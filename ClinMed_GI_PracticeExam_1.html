<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, image?}] }
const EXAM_DATA = {"title": "Clin Med II · GI — HIGH YIELD FINAL PRACTICE EXAM 1", "questions": [{"id": "1", "group": 1, "stem": "A 74-year-old woman with atrial fibrillation comes to the emergency department with four hours of severe, poorly localized abdominal pain that began abruptly. She has vomited once and passed one loose stool. Her apixaban was stopped two weeks ago before a dental extraction and has not been restarted. Her temperature is 37.3°C (99.1°F), blood pressure is 132/84 mm Hg, pulse is 112/min and irregularly irregular, and respirations are 20/min. She is in obvious distress, but her abdomen is soft with only minimal diffuse tenderness, no guarding, no rebound, and present bowel sounds.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 16,400/mm³ |\n| Lactate | 3.6 mmol/L |\n| Creatinine | 1.0 mg/dL |\n| Lipase | 42 U/L |\n| Upright abdominal radiograph | No free air, no dilated loops |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ischemic colitis"}, {"letter": "B", "text": "Acute mesenteric ischemia"}, {"letter": "C", "text": "Acute pancreatitis"}, {"letter": "D", "text": "Perforated peptic ulcer"}, {"letter": "E", "text": "Small bowel obstruction"}], "answer": "B", "explanation": "Acute mesenteric ischemia. Pain out of proportion to a soft, benign abdomen in an older patient with atrial fibrillation off anticoagulation is embolic mesenteric ischemia until proven otherwise. Ischemic colitis gives crampy left-sided pain with bloody diarrhea within 24 hours and tenderness proportionate to the exam.", "objective": "Guide: Acute Mesenteric Ischemia — Presentation, Exam; Ischemic Bowel Disease — Emergency line.", "section": "Severe pain with a benign abdomen"}, {"id": "1A", "group": 1, "stem": "Which of the following is the most appropriate next step in evaluation?", "options": [{"letter": "A", "text": "Repeat upright and left lateral decubitus films"}, {"letter": "B", "text": "CT of the abdomen and pelvis without contrast"}, {"letter": "C", "text": "Mesenteric duplex ultrasonography"}, {"letter": "D", "text": "Colonoscopy with mucosal biopsy"}, {"letter": "E", "text": "CT angiography of the abdomen and pelvis"}], "answer": "E", "explanation": "CT angiography of the abdomen and pelvis. The initial test, 92% sensitive for arterial occlusion or filling defect. Lactate is 86% sensitive but not specific. Angiography is not indicated in ischemic colitis, which is small-vessel low flow.", "objective": "Guide: Acute Mesenteric Ischemia — Diagnostics, 1st Line Imaging.", "section": "Severe pain with a benign abdomen"}, {"id": "1B", "group": 1, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Systemic heparin with urgent revascularization"}, {"letter": "B", "text": "Endoscopic detorsion with placement of a rectal tube"}, {"letter": "C", "text": "Bowel rest with ciprofloxacin and metronidazole"}, {"letter": "D", "text": "Aspirin and a statin with outpatient vascular follow-up"}, {"letter": "E", "text": "Nasogastric decompression with serial abdominal examinations"}], "answer": "A", "explanation": "Systemic heparin with urgent revascularization. Flow must be restored within two to three hours; resuscitate, heparinize, give broad-spectrum antibiotics, and call general and vascular surgery. Pain that improves means infarction, not recovery.", "objective": "Guide: Acute Mesenteric Ischemia — Emergency line; Management, First line.", "section": "Severe pain with a benign abdomen"}, {"id": "2", "group": 2, "stem": "A 54-year-old man with hepatitis C cirrhosis presents with two weeks of increasing abdominal girth and a 6 kg weight gain. He has bulging flanks with shifting dullness and mild peripheral edema, and is afebrile with no abdominal tenderness. Diagnostic paracentesis shows 60 neutrophils/mm³, an ascitic albumin of 0.9 g/dL, and an ascitic total protein of 1.4 g/dL. His serum albumin drawn the same day is 2.6 g/dL.\n\nWhich of the following does the serum-ascites albumin gradient indicate?", "options": [{"letter": "A", "text": "Pancreatic ascites"}, {"letter": "B", "text": "Tuberculous peritonitis"}, {"letter": "C", "text": "Nephrotic syndrome"}, {"letter": "D", "text": "Portal hypertension"}, {"letter": "E", "text": "Peritoneal carcinomatosis"}], "answer": "D", "explanation": "Portal hypertension. Serum albumin 2.6 minus ascitic albumin 0.9 gives a SAAG of 1.7 g/dL. A gradient of 1.1 g/dL or more means portal hypertension with about 97% accuracy; below 1.1 points to malignancy, tuberculosis, or pancreatic ascites. The SAAG is measured once and never repeated.", "objective": "Guide: Ascites — Diagnostics, 1st Line Labs; Special Considerations.", "section": "New abdominal distension"}, {"id": "2A", "group": 2, "stem": "Which of the following is the most appropriate first-line management?", "options": [{"letter": "A", "text": "Intravenous cefotaxime with intravenous albumin"}, {"letter": "B", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "C", "text": "Transjugular intrahepatic portosystemic shunt placement"}, {"letter": "D", "text": "Serial large-volume paracentesis with albumin replacement"}, {"letter": "E", "text": "Sodium restriction with fluid restriction alone"}], "answer": "B", "explanation": "Sodium restriction with spironolactone and furosemide. Sodium under 2 g daily plus spironolactone 100 mg and furosemide 40 mg. Fluid restriction is added only when the sodium falls below 135. Serial large-volume paracentesis and TIPS are for refractory ascites, and cefotaxime with albumin treats SBP — his neutrophil count of 60 excludes it.", "objective": "Guide: Ascites — Management, First Line.", "section": "New abdominal distension"}, {"id": "3", "group": 3, "stem": "A 47-year-old woman has had heartburn and regurgitation for two years, worse when she lies down and after large meals. She has completed eight weeks of a daily proton pump inhibitor taken thirty minutes before breakfast and remains symptomatic most nights. She has no dysphagia, odynophagia, weight loss, vomiting, or anemia. Her examination is normal.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Ambulatory 24-hour esophageal pH monitoring"}, {"letter": "B", "text": "Esophageal manometry with impedance"}, {"letter": "C", "text": "Barium swallow with a 13 mm tablet"}, {"letter": "D", "text": "*H. pylori* stool antigen testing"}, {"letter": "E", "text": "Upper endoscopy with biopsy"}], "answer": "E", "explanation": "Upper endoscopy with biopsy. Endoscopy is indicated for alarm features or for failure after eight weeks of a PPI — she has failed. About two-thirds of patients will have a normal scope (non-erosive reflux disease), which is treated the same way. Ambulatory pH is the gold standard but is reserved for a diagnosis still in doubt after endoscopy.", "objective": "Guide: GERD — Diagnostics, 1st Line and Gold Standard.", "section": "Heartburn that will not settle"}, {"id": "3A", "group": 3, "stem": "Endoscopy is normal. Which of the following is the most appropriate management of her nocturnal symptoms?", "options": [{"letter": "A", "text": "A twice-daily proton pump inhibitor with a bedtime antacid"}, {"letter": "B", "text": "Referral for Nissen fundoplication without further testing"}, {"letter": "C", "text": "An H2 antagonist alone taken twice daily"}, {"letter": "D", "text": "Sucralfate slurry taken four times daily with meals"}, {"letter": "E", "text": "A twice-daily proton pump inhibitor with a bedtime H2 antagonist"}], "answer": "E", "explanation": "A twice-daily proton pump inhibitor with a bedtime H2 antagonist. A bedtime H2 antagonist has the largest effect on nocturnal acid. Surgery requires manometry first and is reserved for failure of maximal medical therapy.", "objective": "Guide: GERD — Management, Refractory / nocturnal; Surgical.", "section": "Heartburn that will not settle"}, {"id": "4", "group": 4, "stem": "A 46-year-old man has 12 hours of severe constant epigastric pain radiating to his back, worse lying flat, with repeated vomiting. He drinks four to five drinks nightly and finished a weekend of much heavier drinking the evening before the pain began. His temperature is 38.0°C (100.4°F), blood pressure is 118/70 mm Hg, pulse is 116/min, and he is tremulous and diaphoretic. He has epigastric tenderness without guarding, rebound, or rigidity, and no jaundice.\n\n| Test | Result |\n|---|---|\n| Lipase | 1,180 U/L (upper limit 60) |\n| ALT / AST | 48 / 96 U/L |\n| Total bilirubin | 1.0 mg/dL |\n| Triglycerides | 220 mg/dL |\n| Calcium | 8.4 mg/dL |\n| Magnesium / phosphorus | 1.3 mg/dL / 1.9 mg/dL |\n| Right upper quadrant ultrasound | No stones, no sludge, common bile duct 4 mm |\n\nWhich of the following is the most likely cause?", "options": [{"letter": "A", "text": "Hypertriglyceridemia"}, {"letter": "B", "text": "Gallstones"}, {"letter": "C", "text": "Recent ERCP"}, {"letter": "D", "text": "Hypercalcemia"}, {"letter": "E", "text": "Alcohol"}], "answer": "E", "explanation": "Alcohol. Years of heavy drinking with a recent binge, an AST above ALT with both under 400, no stones on ultrasound, triglycerides well under 1,000, and normal calcium. Low magnesium and phosphorus fit the alcohol picture and need repletion, along with thiamine.", "objective": "Guide: Alcoholic Pancreatitis — History, Diagnostics, Management.", "section": "Epigastric pain after a binge"}, {"id": "4A", "group": 4, "stem": "Which of the following is the most appropriate initial supportive management?", "options": [{"letter": "A", "text": "Total parenteral nutrition started on admission with bowel rest"}, {"letter": "B", "text": "Lactated Ringer's at 5 to 10 mL/kg/hr with nothing by mouth for five days"}, {"letter": "C", "text": "Prophylactic imipenem with bowel rest and intravenous fluids"}, {"letter": "D", "text": "Lactated Ringer's at 5 to 10 mL/kg/hr with enteral feeding within 24 hours"}, {"letter": "E", "text": "Normal saline at 250 mL/hr continued for the full hospital stay"}], "answer": "D", "explanation": "Lactated Ringer's at 5 to 10 mL/kg/hr with enteral feeding within 24 hours. Aggressive fluids are given for the first 24–48 hours only — continuing past 48 hours risks intubation and abdominal compartment syndrome. Enteral feeding starts within 24 hours; TPN is not first-line, and prophylactic antibiotics are not indicated.", "objective": "Guide: Acute Pancreatitis — Management, First Line and Severe AP; Warnings.", "section": "Epigastric pain after a binge"}, {"id": "4B", "group": 4, "stem": "Which of the following analgesics should be avoided?", "options": [{"letter": "A", "text": "Acetaminophen"}, {"letter": "B", "text": "Ketorolac"}, {"letter": "C", "text": "Fentanyl"}, {"letter": "D", "text": "Morphine"}, {"letter": "E", "text": "Hydromorphone"}], "answer": "D", "explanation": "Morphine. Morphine raises sphincter of Oddi pressure. Use hydromorphone, or fentanyl in chronic kidney disease. NSAIDs are not the analgesic of choice here either, but morphine is the named contraindication.", "objective": "Guide: Acute Pancreatitis — Warnings; Alcoholic Pancreatitis — Warnings.", "section": "Epigastric pain after a binge"}, {"id": "5", "group": 5, "stem": "A 52-year-old man is brought to the emergency department three hours after several episodes of violent retching that followed a night of heavy drinking. He now has severe retrosternal chest pain radiating to his back and is short of breath. His temperature is 38.2°C (100.8°F), blood pressure is 96/60 mm Hg, pulse is 122/min, respirations are 26/min, and oxygen saturation is 91% on room air. He has crepitus over the supraclavicular fossae and a crunching sound over the precordium synchronous with the heartbeat; the abdomen is soft and non-tender.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 17,000/mm³ |\n| Lactate | 3.1 mmol/L |\n| Amylase | 210 U/L |\n| Lipase | 48 U/L |\n| Troponin | Normal |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute coronary syndrome"}, {"letter": "B", "text": "Boerhaave syndrome"}, {"letter": "C", "text": "Acute pancreatitis"}, {"letter": "D", "text": "Bleeding esophageal varices"}, {"letter": "E", "text": "Mallory-Weiss tear"}], "answer": "B", "explanation": "Boerhaave syndrome. Mackler's triad — vomiting, retrosternal pain, subcutaneous emphysema — with Hamman's crunch and shock. A Mallory-Weiss tear is mucosal only and presents as painless hematemesis after retching, with no crepitus. The amylase is up with a normal lipase, which points to perforation rather than pancreatitis.", "objective": "Guide: Boerhaave Syndrome — Emergency line; Special Considerations \"Amylase vs lipase.\"", "section": "Chest pain after violent vomiting"}, {"id": "5A", "group": 5, "stem": "Which of the following is the most appropriate initial imaging study?", "options": [{"letter": "A", "text": "Right upper quadrant ultrasound"}, {"letter": "B", "text": "Upper endoscopy"}, {"letter": "C", "text": "Transthoracic echocardiography"}, {"letter": "D", "text": "Upright chest radiograph"}, {"letter": "E", "text": "Barium esophagram"}], "answer": "D", "explanation": "Upright chest radiograph. First and fastest: mediastinal widening, pneumomediastinum, pleural effusion, subcutaneous emphysema. Barium is contraindicated in a suspected perforation because of barium mediastinitis — a water-soluble agent is requested by name — and endoscopy is contraindicated outright. Mediastinal air may not appear for about an hour, so a normal early film does not exclude it.", "objective": "Guide: Boerhaave Syndrome — Diagnostics; Warnings.", "section": "Chest pain after violent vomiting"}, {"id": "5B", "group": 5, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Nasogastric decompression with intravenous fluids and observation"}, {"letter": "B", "text": "Endoscopic band ligation with an intravenous octreotide infusion"}, {"letter": "C", "text": "Emergent surgical repair with broad-spectrum intravenous antibiotics"}, {"letter": "D", "text": "Chest tube placement with intravenous antibiotics and observation"}, {"letter": "E", "text": "Proton pump inhibitor infusion with serial hemoglobin measurement"}], "answer": "C", "explanation": "Emergent surgical repair with broad-spectrum intravenous antibiotics. Resuscitate, keep NPO, start piperacillin-tazobactam, and call thoracic surgery; mortality climbs by the hour.", "objective": "Guide: Boerhaave Syndrome — Management, First Line.", "section": "Chest pain after violent vomiting"}, {"id": "6", "group": 6, "stem": "A 61-year-old woman with a known duodenal ulcer develops sudden severe diffuse abdominal pain. She lies perfectly still, and her abdomen is rigid with rebound tenderness throughout.\n\nWhich of the following is the most appropriate immediate step?", "options": [{"letter": "A", "text": "Upright chest radiograph"}, {"letter": "B", "text": "Nasogastric decompression with serial examinations"}, {"letter": "C", "text": "Upper endoscopy with biopsy"}, {"letter": "D", "text": "CT of the abdomen and pelvis with oral contrast"}, {"letter": "E", "text": "Diagnostic paracentesis with cell count"}], "answer": "A", "explanation": "Upright chest radiograph. A rigid abdomen in a patient lying perfectly still is a surgical abdomen; the upright film looks for free air and detects as little as 1–2 mL after 5–10 minutes upright. If the patient cannot stand, use a left lateral decubitus view.", "objective": "Guide: Medical Complications of PUD — Emergency line; Peritonitis — Special Considerations \"Free-air detection.\"", "section": "Sudden severe abdominal pain in an ulcer patient"}, {"id": "6A", "group": 6, "stem": "Free air is present. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Endoscopic clipping of the perforation"}, {"letter": "B", "text": "Intravenous proton pump inhibitor with observation"}, {"letter": "C", "text": "Emergent laparotomy with omental patch repair"}, {"letter": "D", "text": "Percutaneous drainage with intravenous antibiotics"}, {"letter": "E", "text": "Repeat imaging in six hours before deciding"}], "answer": "C", "explanation": "Emergent laparotomy with omental patch repair. Free air means perforation and the operating room — do not wait on a CT read when the abdomen is surgical. Broad-spectrum antibiotics and an IV PPI accompany it, and H. pylori is tested and treated afterward.", "objective": "Guide: Peptic Ulcer Disease — Surgical; Medical Complications of PUD — Management, Perforation.", "section": "Sudden severe abdominal pain in an ulcer patient"}, {"id": "7", "group": 7, "stem": "A 41-year-old woman has had 9 hours of steady severe right upper quadrant pain that began about an hour after a fried dinner and has not let up. She has had three similar episodes over the past year, each lasting a few hours and resolving on its own. She has vomited twice and has no appetite. Her temperature is 38.3°C (100.9°F), blood pressure is 128/76 mm Hg, and pulse is 104/min. She lies still on the stretcher and catches her breath when the examiner presses beneath the right costal margin during inspiration; there is no jaundice and no rebound.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 14,600/mm³ with left shift |\n| Total bilirubin | 0.9 mg/dL |\n| Alkaline phosphatase | 96 U/L |\n| AST / ALT | 44 / 38 U/L |\n| Lipase | 38 U/L |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute cholangitis"}, {"letter": "B", "text": "Biliary dyskinesia"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "Acute cholecystitis"}, {"letter": "E", "text": "Biliary colic"}], "answer": "D", "explanation": "Acute cholecystitis. Steady right upper quadrant pain lasting well beyond 4–6 hours, fever, leukocytosis, and a positive Murphy's sign, on a background of prior brief attacks of biliary colic. Why not the look-alikes: biliary colic is constant but resolves in 1–6 hours with no fever and normal labs; choledocholithiasis brings jaundice with cholestatic labs and no fever; cholangitis brings both fever and jaundice.", "objective": "Guide: Acute Cholecystitis — Presentation, Exam; Biliary Colic — Special Considerations \"Discriminator = time.\"", "section": "Right upper quadrant pain after a meal"}, {"id": "7A", "group": 7, "stem": "Which of the following findings would the first-line imaging study most likely show?", "options": [{"letter": "A", "text": "A common bile duct measuring 11 mm with an echogenic filling defect"}, {"letter": "B", "text": "A thickened gallbladder wall with pericholecystic fluid and no stones"}, {"letter": "C", "text": "Stones with a wall over 3 mm, pericholecystic fluid, and a sonographic Murphy's sign"}, {"letter": "D", "text": "A normal gallbladder with an ejection fraction below 35% after cholecystokinin"}, {"letter": "E", "text": "Stones with a normal wall, no pericholecystic fluid, and a negative sonographic Murphy's sign"}], "answer": "C", "explanation": "Stones with a wall over 3 mm, pericholecystic fluid, and a sonographic Murphy's sign. That combination has a positive predictive value of 90–95%. Her bilirubin and alkaline phosphatase are normal, which is what keeps this in the gallbladder — if they were elevated, the answer would be choledocholithiasis.", "objective": "Guide: Acute Cholecystitis — Diagnostics, 1st Line Imaging and Labs.", "section": "Right upper quadrant pain after a meal"}, {"id": "7B", "group": 7, "stem": "Which of the following is the most appropriate definitive management?", "options": [{"letter": "A", "text": "Ursodeoxycholic acid with a low-fat diet and observation"}, {"letter": "B", "text": "Laparoscopic cholecystectomy within 24 to 48 hours"}, {"letter": "C", "text": "Elective cholecystectomy after six weeks of antibiotics"}, {"letter": "D", "text": "ERCP with sphincterotomy followed by cholecystectomy"}, {"letter": "E", "text": "Percutaneous cholecystostomy with delayed cholecystectomy"}], "answer": "B", "explanation": "Laparoscopic cholecystectomy within 24 to 48 hours. Early laparoscopic cholecystectomy is definitive; a cholecystostomy tube is for the patient too sick to operate on.", "objective": "Guide: Acute Cholecystitis — Management, Definitive; Surgical.", "section": "Right upper quadrant pain after a meal"}, {"id": "8", "group": 8, "stem": "A 55-year-old woman has had three days of intermittent right upper quadrant pain with nausea, and for the past two days her urine has been dark and her stools pale. She had an episode of similar pain last month that resolved on its own. She has known gallstones. Her temperature is 37.1°C (98.8°F), blood pressure is 130/78 mm Hg, and pulse is 84/min. She is comfortable at rest with icteric sclerae, right upper quadrant tenderness, and no guarding, rebound, or palpable mass.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 8,900/mm³ |\n| Total bilirubin | 4.6 mg/dL, direct 3.4 mg/dL |\n| Alkaline phosphatase | 340 U/L |\n| GGT | 312 U/L |\n| AST / ALT | 88 / 104 U/L |\n| Lipase | 44 U/L |\n| Right upper quadrant ultrasound | Gallstones, common bile duct 9 mm, normal gallbladder wall |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Primary biliary cholangitis"}, {"letter": "B", "text": "Chronic cholecystitis"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "Acute cholangitis"}, {"letter": "E", "text": "Acute cholecystitis"}], "answer": "C", "explanation": "Choledocholithiasis. Jaundice with dark urine, pale stools, and a cholestatic pattern — bilirubin, alkaline phosphatase and GGT rising out of proportion to the transaminases — without fever. That is the discriminator: cholecystitis gives fever without jaundice, cholangitis gives both.", "objective": "Guide: Choledocholithiasis — Presentation, Diagnostics; Special Considerations \"The discriminator.\"", "section": "Jaundice with right upper quadrant pain"}, {"id": "8A", "group": 8, "stem": "Ultrasound does not visualize a duct stone. Which of the following would best confirm the diagnosis?", "options": [{"letter": "A", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "B", "text": "HIDA scan with cholecystokinin stimulation"}, {"letter": "C", "text": "CT of the abdomen without contrast"}, {"letter": "D", "text": "Repeat right upper quadrant ultrasound in 48 hours"}, {"letter": "E", "text": "Anti-mitochondrial antibody with serum IgM"}], "answer": "A", "explanation": "Magnetic resonance cholangiopancreatography. Ultrasound detects only 40–50% of duct stones, so MRCP (or EUS if still uncertain) is the confirmatory study, with over 90% sensitivity and specificity. It is diagnostic only — MRCP looks, ERCP fixes.", "objective": "Guide: Choledocholithiasis — Diagnostics, Confirmatory.", "section": "Jaundice with right upper quadrant pain"}, {"id": "8B", "group": 8, "stem": "Which of the following is the most appropriate management sequence?", "options": [{"letter": "A", "text": "Cholecystectomy first, then ERCP if the bilirubin remains elevated"}, {"letter": "B", "text": "Cholecystectomy alone with intraoperative duct exploration only if needed"}, {"letter": "C", "text": "Ursodeoxycholic acid with repeat liver enzymes in six weeks"}, {"letter": "D", "text": "Percutaneous transhepatic drainage followed by cholecystectomy"}, {"letter": "E", "text": "ERCP with sphincterotomy and stone extraction, then cholecystectomy"}], "answer": "E", "explanation": "ERCP with sphincterotomy and stone extraction, then cholecystectomy. ERCP is both diagnostic and therapeutic; laparoscopic cholecystectomy follows. Rectal indomethacin or diclofenac 100 mg immediately before the procedure lowers the 3–5% risk of post-ERCP pancreatitis.", "objective": "Guide: Choledocholithiasis — Management; Surgical; Warnings.", "section": "Jaundice with right upper quadrant pain"}, {"id": "9", "group": 9, "stem": "A 32-year-old woman admitted three days ago with a severe ulcerative colitis flare has been on intravenous corticosteroids. This morning she developed sudden severe diffuse abdominal pain and now looks frightened and unwell. Her temperature is 38.8°C (101.8°F), blood pressure is 88/52 mm Hg, pulse is 132/min, and respirations are 28/min. Her abdomen is diffusely tender with guarding, though it is not board-like; she lies very still and will not let the examiner press deeply.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 22,800/mm³ |\n| Lactate | 4.2 mmol/L |\n| Hemoglobin | 8.8 g/dL |\n| Albumin | 2.2 g/dL |\n| Upright chest radiograph | Free air beneath both hemidiaphragms |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Clostridioides difficile superinfection"}, {"letter": "B", "text": "Toxic megacolon without perforation"}, {"letter": "C", "text": "An acute severe flare without complication"}, {"letter": "D", "text": "Colonic perforation"}, {"letter": "E", "text": "Spontaneous bacterial peritonitis"}], "answer": "D", "explanation": "Colonic perforation. Free air under both hemidiaphragms in a patient with severe colitis on steroids. It is the most lethal complication of inflammatory bowel disease, and perforation is a surgical indication in ulcerative colitis alongside severe hemorrhage, refractory disease, and dysplasia or cancer.", "objective": "Guide: Colon Perforation in IBD — Emergency line, Diagnostics; Special Considerations \"UC surgical indications.\"", "section": "A severe colitis flare that changes"}, {"id": "9A", "group": 9, "stem": "Why might her abdomen not be rigid despite this diagnosis?", "options": [{"letter": "A", "text": "Corticosteroids blunt peritoneal signs"}, {"letter": "B", "text": "Free air does not irritate the peritoneum"}, {"letter": "C", "text": "Perforation of the colon causes only visceral pain"}, {"letter": "D", "text": "Colonic contents are sterile in ulcerative colitis"}, {"letter": "E", "text": "Ascites cushions the peritoneal surfaces"}], "answer": "A", "explanation": "Corticosteroids blunt peritoneal signs. The guide flags this explicitly: steroids mask peritoneal signs, and a rigid abdomen may be absent. Free air on an upright film in a patient with IBD is enough on its own.", "objective": "Guide: Colon Perforation in IBD — Emergency line.", "section": "A severe colitis flare that changes"}, {"id": "9B", "group": 9, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Escalation to infliximab with continued intravenous corticosteroids"}, {"letter": "B", "text": "Emergent colectomy with fluid resuscitation and broad-spectrum antibiotics"}, {"letter": "C", "text": "Colonoscopic decompression with intravenous antibiotics"}, {"letter": "D", "text": "CT of the abdomen and pelvis before any surgical decision"}, {"letter": "E", "text": "Nasogastric and rectal decompression with serial radiographs"}], "answer": "B", "explanation": "Emergent colectomy with fluid resuscitation and broad-spectrum antibiotics. Resuscitate, give antibiotics, and operate. Escalating medical therapy in a perforated patient loses time, and CT is unnecessary when free air is already visible.", "objective": "Guide: Colon Perforation in IBD — Management; Emergency line.", "section": "A severe colitis flare that changes"}, {"id": "10", "group": 10, "stem": "A 63-year-old man with hepatitis C cirrhosis is brought in by his wife, who says he has been sleeping all day and awake at night for a week and today could not remember her name. He ran out of his lactulose ten days ago. He has had no fever, vomiting, or black stools, and had no fall or head injury. His temperature is 37.0°C (98.6°F), blood pressure is 112/68 mm Hg, and pulse is 88/min. He is lethargic but rousable and disoriented to place, with a flapping tremor when his wrists are extended, mild jaundice, and moderate ascites that is not tender.\n\n| Test | Result |\n|---|---|\n| Glucose | 96 mg/dL |\n| Sodium | 133 mEq/L |\n| Potassium | 3.2 mEq/L |\n| Creatinine | 1.0 mg/dL |\n| Ammonia | 88 µmol/L |\n| Ascitic neutrophil count | 40 cells/mm³ |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Spontaneous bacterial peritonitis"}, {"letter": "B", "text": "Hypoglycemic encephalopathy"}, {"letter": "C", "text": "Intracranial hemorrhage"}, {"letter": "D", "text": "Wernicke encephalopathy"}, {"letter": "E", "text": "Hepatic encephalopathy"}], "answer": "E", "explanation": "Hepatic encephalopathy. A non-agitated confusional syndrome with sleep-wake reversal and asterixis in a cirrhotic who missed his lactulose; hypokalemia is a classic precipitant. His glucose is normal, his ascitic neutrophil count of 40 excludes SBP, and there was no head injury.", "objective": "Guide: Portal Systemic Encephalopathy — Presentation, Exam; Diagnostics, 1st Line precipitants.", "section": "Confusion in chronic liver disease"}, {"id": "10A", "group": 10, "stem": "Which of the following is the most appropriate first-line therapy?", "options": [{"letter": "A", "text": "Rifaximin 550 mg twice daily as a single agent"}, {"letter": "B", "text": "Lactulose titrated to two to four bowel movements daily"}, {"letter": "C", "text": "Dietary protein restriction to 40 g daily"}, {"letter": "D", "text": "Intravenous albumin with a large-volume paracentesis"}, {"letter": "E", "text": "Intravenous thiamine followed by dextrose"}], "answer": "B", "explanation": "Lactulose titrated to two to four bowel movements daily. Thirty mL one to three times daily, titrated to stool output and clinical improvement — there is no magic dose. Rifaximin 550 mg twice daily is an add-on, not monotherapy, and protein should not be restricted — a 15–25 g bedtime protein snack has good data behind it.", "objective": "Guide: Portal Systemic Encephalopathy — Management; Special Considerations \"Nutrition.\"", "section": "Confusion in chronic liver disease"}, {"id": "10B", "group": 10, "stem": "Which of the following statements about his ammonia level is correct?", "options": [{"letter": "A", "text": "A level above 50 µmol/L is diagnostic in a cirrhotic"}, {"letter": "B", "text": "It supports the diagnosis but neither makes nor excludes it"}, {"letter": "C", "text": "Therapy should be titrated to serial ammonia levels"}, {"letter": "D", "text": "A normal level excludes hepatic encephalopathy"}, {"letter": "E", "text": "It distinguishes hepatic encephalopathy from a structural lesion"}], "answer": "B", "explanation": "It supports the diagnosis but neither makes nor excludes it. Ammonia is only one of several gut-derived toxins the failing liver cannot clear, and therapy is titrated to bowel movements and mental status, not to serial levels.", "objective": "Guide: Portal Systemic Encephalopathy — Diagnostics, Labs; Special Considerations \"Mechanism.\"", "section": "Confusion in chronic liver disease"}, {"id": "11", "group": 11, "stem": "A 70-year-old man has three weeks of painless jaundice with dark urine, pale stools, and 8 kg of weight loss. A non-tender distended gallbladder is palpable below the right costal margin.\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Choledocholithiasis"}, {"letter": "B", "text": "Primary biliary cholangitis"}, {"letter": "C", "text": "Acute cholecystitis"}, {"letter": "D", "text": "Alcohol-related hepatitis"}, {"letter": "E", "text": "Pancreatic head adenocarcinoma"}], "answer": "E", "explanation": "Pancreatic head adenocarcinoma. Painless jaundice with a non-tender palpable gallbladder is Courvoisier's sign, which means malignant obstruction until proven otherwise — 50–70% of the time pancreatic cancer. Stones cause pain, and a gallbladder scarred by chronic stone disease does not distend.", "objective": "Guide: Pancreatic Cancer — Emergency line, Exam; Acalculous Cholecystitis — Special Considerations \"Courvoisier sign.\"", "section": "Painless jaundice"}, {"id": "12", "group": 12, "stem": "A 46-year-old woman has an abdominal ultrasound for an unrelated reason that shows three echogenic mobile gallbladder stones with posterior acoustic shadowing, a normal wall, and no pericholecystic fluid. She has never had abdominal pain, and her liver enzymes are normal.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "HIDA scan with cholecystokinin stimulation"}, {"letter": "B", "text": "Elective laparoscopic cholecystectomy"}, {"letter": "C", "text": "Ursodeoxycholic acid to dissolve the stones"}, {"letter": "D", "text": "MRCP to exclude a common bile duct stone"}, {"letter": "E", "text": "Observation without intervention"}], "answer": "E", "explanation": "Observation without intervention. About 80% of gallstones are asymptomatic, and surgery is not recommended in the absence of symptoms. Note the discriminator: echogenic with a shadow is a stone; echogenic without a shadow is sludge.", "objective": "Guide: Cholelithiasis — Management, Asymptomatic; Special Considerations \"Sludge vs stone.\"", "section": "An incidental finding"}, {"id": "13", "group": 13, "stem": "A 31-year-old man with ileocolonic Crohn's disease diagnosed nine years ago has had four urinary tract infections in six months, and for the past month he has noticed air bubbling in his urine stream and a foul smell to it. He also reports crampy abdominal pain and three loose stools daily. His temperature is 37.8°C (100.0°F), blood pressure is 122/76 mm Hg, and pulse is 96/min. He has a tender fullness in the right lower quadrant with no rebound; there is no perianal drainage.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 13,400/mm³ |\n| CRP | 62 mg/L |\n| Hemoglobin | 11.2 g/dL |\n| Urinalysis | Many white cells, mixed enteric organisms on culture |\n| Albumin | 3.2 g/dL |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "An enterovesical fistula"}, {"letter": "B", "text": "An inflammatory phlegmon without infection"}, {"letter": "C", "text": "A perianal fistula with secondary cystitis"}, {"letter": "D", "text": "A fibrotic ileal stricture with stasis"}, {"letter": "E", "text": "An intra-abdominal abscess without a fistula"}], "answer": "A", "explanation": "An enterovesical fistula. Recurrent urinary infections with mixed enteric organisms plus pneumaturia in long-standing Crohn's is a fistula from bowel into bladder. Fistulas occur in up to 40% of Crohn's patients and are rare in ulcerative colitis.", "objective": "Guide: Fistulizing (Penetrating) Crohn's Disease — Presentation; Special Considerations \"Fistula type.\"", "section": "Recurrent urinary infections in Crohn's disease"}, {"id": "13A", "group": 13, "stem": "Which of the following is the most appropriate imaging study?", "options": [{"letter": "A", "text": "CT or MR enterography of the abdomen and pelvis"}, {"letter": "B", "text": "Retrograde cystography with delayed films"}, {"letter": "C", "text": "Video capsule endoscopy of the small bowel"}, {"letter": "D", "text": "Endoanal ultrasound with a pelvic MRI"}, {"letter": "E", "text": "Barium enema with lateral pelvic views"}], "answer": "A", "explanation": "CT or MR enterography of the abdomen and pelvis. Enterography shows the tract joining two epithelium-lined organs and identifies any abscess. Capsule endoscopy has no role and is contraindicated where a stricture may exist.", "objective": "Guide: Fistulizing Crohn's Disease — Diagnostics, 1st Line Imaging.", "section": "Recurrent urinary infections in Crohn's disease"}, {"id": "13B", "group": 13, "stem": "No abscess is found. Which of the following is the most appropriate medical therapy?", "options": [{"letter": "A", "text": "An anti-TNF agent combined with an immunomodulator"}, {"letter": "B", "text": "An oral aminosalicylate with a low-fiber diet"}, {"letter": "C", "text": "Oral budesonide as a single agent"}, {"letter": "D", "text": "Long-term ciprofloxacin with metronidazole alone"}, {"letter": "E", "text": "Vedolizumab as a single agent"}], "answer": "A", "explanation": "An anti-TNF agent combined with an immunomodulator. Infliximab or adalimumab with an immunomodulator gives the best remission rates (SONIC), alongside colorectal surgery referral. Any abscess must be drained first, with metronidazole and levofloxacin, before starting a TNF inhibitor. Note the risk to counsel: hepatosplenic T-cell lymphoma in men under 35 on dual therapy.", "objective": "Guide: Fistulizing Crohn's Disease — Management; Special Considerations \"Male <35, dual therapy.\"", "section": "Recurrent urinary infections in Crohn's disease"}, {"id": "14", "group": 14, "stem": "A 32-year-old woman has two years of bloating, loose greasy stools that float, and 6 kg of unintentional weight loss. She has an intensely itchy blistering rash over both elbows and knees that she has been treating with topical steroids without relief. She eats a normal diet, and her mother has hypothyroidism. Her hemoglobin is 10.2 g/dL with an MCV of 76 fL and a ferritin of 6 ng/mL.\n\nWhich of the following is the most appropriate initial test?", "options": [{"letter": "A", "text": "HLA-DQ2 and DQ8 genotyping"}, {"letter": "B", "text": "Fecal elastase-1 measurement on a random stool sample"}, {"letter": "C", "text": "Hydrogen breath testing after an oral lactose load"}, {"letter": "D", "text": "IgA tissue transglutaminase antibody with a total IgA level"}, {"letter": "E", "text": "Stool ova and parasite examination on three specimens"}], "answer": "D", "explanation": "IgA tissue transglutaminase antibody with a total IgA level. The preferred screen, and it must be drawn while the patient is still eating gluten. Total IgA is paired with it because selective IgA deficiency produces a false-negative. Her rash is dermatitis herpetiformis.", "objective": "Guide: Celiac Disease — Diagnostics, 1st Line; Special Considerations \"Serology negative, suspicion high.\"", "section": "Malabsorption with a rash"}, {"id": "14A", "group": 14, "stem": "Her test is positive. Which of the following is required to establish the diagnosis?", "options": [{"letter": "A", "text": "Duodenal biopsy obtained after four weeks free of gluten"}, {"letter": "B", "text": "Duodenal biopsy obtained while she is still eating gluten"}, {"letter": "C", "text": "Resolution of her symptoms on a strict gluten-free diet"}, {"letter": "D", "text": "Repeat serologic testing in three to six months"}, {"letter": "E", "text": "Video capsule endoscopy of the entire small bowel"}], "answer": "B", "explanation": "Duodenal biopsy obtained while she is still eating gluten. EGD with duodenal biopsy is the gold standard and is required; both serology and biopsy are falsely negative once gluten is removed. HLA-DQ2/DQ8 is used when the patient is already gluten-free — a negative excludes celiac.", "objective": "Guide: Celiac Disease — Diagnostics, Gold Standard; Special Considerations \"Gluten challenge rule.\"", "section": "Malabsorption with a rash"}, {"id": "15", "group": 15, "stem": "A 46-year-old man arrives 90 minutes after a steak dinner unable to swallow anything, including his own saliva, which he is spitting into a cup. He has retrosternal fullness and is not in respiratory distress.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Barium esophagram to localize the bolus"}, {"letter": "B", "text": "Urgent upper endoscopy"}, {"letter": "C", "text": "Chest radiograph followed by endoscopy"}, {"letter": "D", "text": "Intravenous glucagon with observation for 12 hours"}, {"letter": "E", "text": "CT of the chest with oral contrast"}], "answer": "B", "explanation": "Urgent upper endoscopy. Inability to handle secretions makes this an emergency, and endoscopy is both diagnostic and therapeutic. Imaging is not mandatory and must not delay endoscopy — steak-house syndrome. Intervene if the bolus has not passed within 12 hours, and immediately for airway compromise or a button battery.", "objective": "Guide: Acute Dysphagia (Food Bolus Impaction) — Diagnostics, Emergency line; Special Considerations.", "section": "Meat that will not go down"}, {"id": "15A", "group": 15, "stem": "The bolus is removed and a distal ring is seen. Which of the following should be done in the same sitting?", "options": [{"letter": "A", "text": "Nothing further; repeat endoscopy in six weeks"}, {"letter": "B", "text": "Injection of botulinum toxin into the lower sphincter"}, {"letter": "C", "text": "Nissen fundoplication referral without dilation"}, {"letter": "D", "text": "Dilation of the ring with biopsy of the mucosa"}, {"letter": "E", "text": "Placement of a temporary esophageal stent"}], "answer": "D", "explanation": "Dilation of the ring with biopsy of the mucosa. Endoscopy allows diagnosis, biopsy, and dilation in one sitting; a PPI follows, and the patient needs GI follow-up for the underlying ring, stricture, or eosinophilic esophagitis. Note that upper endoscopy is the most common cause of esophageal perforation overall, with the risk rising with dilation.", "objective": "Guide: Acute Dysphagia — Management; Warnings; Esophageal Dysphagia — Diagnostics.", "section": "Meat that will not go down"}, {"id": "16", "group": 16, "stem": "A 60-year-old man with alcohol-related cirrhosis was admitted eight days ago and treated for spontaneous bacterial peritonitis. His ascites has been difficult to control and his creatinine has risen steadily from 1.0 to 2.4 mg/dL despite holding his diuretics for four days. He has had no vomiting, diarrhea, or bleeding, and has received no contrast or nephrotoxic drugs. His blood pressure is 92/56 mm Hg and pulse is 96/min. He has tense ascites, jaundice, and no peripheral edema; urine output has been 350 mL over the past 24 hours.\n\n| Test | Result |\n|---|---|\n| Creatinine | 2.4 mg/dL |\n| Sodium | 126 mEq/L |\n| Urine sodium | 6 mEq/L |\n| Urine protein | 180 mg/dL |\n| Urine sediment | Bland, no casts, fewer than 5 RBC/hpf |\n| Renal ultrasound | Normal kidneys, no hydronephrosis |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Obstructive uropathy"}, {"letter": "B", "text": "Prerenal azotemia from diuretics"}, {"letter": "C", "text": "Acute tubular necrosis"}, {"letter": "D", "text": "Acute interstitial nephritis"}, {"letter": "E", "text": "Hepatorenal syndrome"}], "answer": "E", "explanation": "Hepatorenal syndrome. Progressive creatinine rise in advanced cirrhosis after SBP — the classic trigger — with a urine sodium under 10 mEq/L, bland sediment, proteinuria under 500 mg/dL, and normal kidneys on ultrasound. Acute tubular necrosis would give muddy brown casts and a higher urine sodium; prerenal azotemia would have improved when the diuretics were held.", "objective": "Guide: Hepatorenal Syndrome — Emergency line, Diagnostics; Special Considerations \"Minor criteria.\"", "section": "Rising creatinine in advanced liver disease"}, {"id": "16A", "group": 16, "stem": "Which of the following would confirm the diagnosis?", "options": [{"letter": "A", "text": "Failure of creatinine to improve after a 1.5 L albumin challenge"}, {"letter": "B", "text": "Improvement of creatinine after a 1.5 L albumin challenge"}, {"letter": "C", "text": "A fractional excretion of sodium above 2 percent"}, {"letter": "D", "text": "Urine eosinophils with peripheral eosinophilia"}, {"letter": "E", "text": "Muddy brown granular casts on urine microscopy"}], "answer": "A", "explanation": "Failure of creatinine to improve after a 1.5 L albumin challenge. Diuretics are stopped and at least 1.5 L of albumin is given; no sustained improvement, with shock, fluid losses, nephrotoxins, and obstruction excluded, confirms it. The kidneys are histologically normal — they would work in a different body.", "objective": "Guide: Hepatorenal Syndrome — Diagnostics, Confirmatory; Special Considerations \"Histology.\"", "section": "Rising creatinine in advanced liver disease"}, {"id": "16B", "group": 16, "stem": "Which of the following is the most appropriate pharmacologic therapy?", "options": [{"letter": "A", "text": "Furosemide with intravenous albumin"}, {"letter": "B", "text": "Low-dose dopamine with intravenous albumin"}, {"letter": "C", "text": "Intravenous normal saline at 150 mL/hr"}, {"letter": "D", "text": "Terlipressin with intravenous albumin"}, {"letter": "E", "text": "Spironolactone with sodium restriction"}], "answer": "D", "explanation": "Terlipressin with intravenous albumin. Albumin 25 g of 25% three times daily is the plasma expander, and terlipressin is added when the creatinine stays above 1.5 despite it; midodrine plus octreotide is the older alternative. Stop terlipressin for abdominal pain or ischemia, hypoxia or pulmonary edema, and avoid it if the MELD is above 35 — that patient needs a transplant. Untreated survival is about two weeks.", "objective": "Guide: Hepatorenal Syndrome — Management; Warnings.", "section": "Rising creatinine in advanced liver disease"}, {"id": "17", "group": 17, "stem": "A 27-year-old nurse sustains a hollow-bore needlestick from a patient known to have hepatitis C. She is asymptomatic, and her baseline hepatitis C antibody and liver enzymes are normal. She returns three weeks later for follow-up.\n\nWhich of the following is the most appropriate test at this visit?", "options": [{"letter": "A", "text": "Hepatitis C antibody alone, repeated at six months"}, {"letter": "B", "text": "Hepatitis C genotype with a fibrosis score"}, {"letter": "C", "text": "Hepatitis C RNA sent together with the antibody"}, {"letter": "D", "text": "ALT alone, repeated monthly for six months"}, {"letter": "E", "text": "Hepatitis C immune globulin before any testing"}], "answer": "C", "explanation": "Hepatitis C RNA sent together with the antibody. In a recent, high-suspicion exposure, send the RNA with the antibody: RNA becomes detectable 2–3 weeks after exposure, while the antibody can take up to six weeks to turn positive — the window period. ALT may be entirely normal.", "objective": "Guide: Acute Hepatitis C — Diagnostics; Hepatitis C — Screening.", "section": "After a needlestick"}, {"id": "17A", "group": 17, "stem": "Her RNA is detectable. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Repeat the HCV RNA at 12 to 24 weeks, since some clear spontaneously"}, {"letter": "B", "text": "Start peginterferon with ribavirin for twenty-four weeks"}, {"letter": "C", "text": "Give hepatitis C immune globulin and repeat testing"}, {"letter": "D", "text": "Reassure her that a single needlestick rarely transmits infection"}, {"letter": "E", "text": "Start a direct-acting antiviral regimen immediately"}], "answer": "A", "explanation": "Repeat the HCV RNA at 12 to 24 weeks, since some clear spontaneously. About 20% clear on their own; a direct-acting antiviral is given if the RNA persists.", "objective": "Guide: Acute Hepatitis C — Management.", "section": "After a needlestick"}, {"id": "18", "group": 18, "stem": "A 71-year-old man has four months of increasing constipation with stools he describes as pencil-thin, intermittent bright red blood mixed into the stool, and cramping. For the past two days he has passed no stool or flatus and his abdomen has become distended. He has never had a colonoscopy. His temperature is 37.2°C (99.0°F), blood pressure is 138/82 mm Hg, and pulse is 96/min. His abdomen is markedly distended and tympanitic with mild diffuse tenderness and no rebound; rectal examination shows an empty vault with brown stool that is guaiac positive.\n\n| Test | Result |\n|---|---|\n| Hemoglobin | 9.6 g/dL, MCV 78 fL |\n| White blood cell count | 11,200/mm³ |\n| Lactate | 1.4 mmol/L |\n| Upright abdominal radiograph | Marked colonic dilation, cecum 8 cm, little rectal gas, few air-fluid levels |\n\nWhich of the following is the most likely cause of his obstruction?", "options": [{"letter": "A", "text": "Postoperative adhesions"}, {"letter": "B", "text": "Fecal impaction"}, {"letter": "C", "text": "An obstructing colonic malignancy"}, {"letter": "D", "text": "Sigmoid volvulus"}, {"letter": "E", "text": "Adynamic ileus"}], "answer": "C", "explanation": "An obstructing colonic malignancy. Months of narrowing stool caliber with blood mixed into the stool, iron deficiency anemia, and now a large bowel obstruction. Colon cancer is the most common cause of large bowel obstruction. The radiograph fits an LBO — gas-rich and fluid-poor with few air-fluid levels, unlike the step-ladder pattern of an SBO.", "objective": "Guide: Left-Sided Colon Cancer — Presentation, Emergency line; Large Bowel Obstruction — Diagnostics.", "section": "Constipation with distension in an older adult"}, {"id": "18A", "group": 18, "stem": "Which of the following is the most appropriate next step in evaluation?", "options": [{"letter": "A", "text": "Colonoscopy to the level of the obstruction"}, {"letter": "B", "text": "CT of the abdomen and pelvis with contrast"}, {"letter": "C", "text": "Repeat radiographs in six hours"}, {"letter": "D", "text": "Water-soluble contrast enema"}, {"letter": "E", "text": "Mesenteric CT angiography"}], "answer": "B", "explanation": "CT of the abdomen and pelvis with contrast. CT identifies the transition point and stages the disease. Endoscopy confirms and biopsies the mass, but imaging comes first in an obstructed patient.", "objective": "Guide: Large Bowel Obstruction — Diagnostics, Best Imaging.", "section": "Constipation with distension in an older adult"}, {"id": "18B", "group": 18, "stem": "Which finding on that study would signal the highest risk of perforation?", "options": [{"letter": "A", "text": "Small bowel dilation proximal to the transition point"}, {"letter": "B", "text": "Colonic dilation of 7 cm with an incompetent ileocecal valve"}, {"letter": "C", "text": "Cecal dilation beyond 9 cm with a competent ileocecal valve"}, {"letter": "D", "text": "A single air-fluid level in the transverse colon"}, {"letter": "E", "text": "Pericolonic fat stranding around the mass"}], "answer": "C", "explanation": "Cecal dilation beyond 9 cm with a competent ileocecal valve. The 3/6/9 rule sets the thresholds — small bowel 3 cm, colon 6 cm, cecum 9 cm — and a competent valve makes it a closed loop that cannot decompress backward.", "objective": "Guide: Large Bowel Obstruction — Special Considerations \"Cecum >9 cm\"; Intestinal Obstruction — Diagnostics.", "section": "Constipation with distension in an older adult"}, {"id": "19", "group": 19, "stem": "A 67-year-old man born in Korea has five months of epigastric pain, early satiety, and 13 kg of weight loss, with two episodes of black tarry stool. He was treated for a gastric ulcer six years ago and never returned for follow-up. His father died of stomach cancer. His blood pressure is 122/74 mm Hg and pulse is 96/min. He is cachectic and pale, with a firm non-tender node above the left clavicle and a vague epigastric fullness.\n\n| Test | Result |\n|---|---|\n| Hemoglobin | 9.2 g/dL, MCV 76 fL |\n| Albumin | 3.1 g/dL |\n| Stool guaiac | Positive |\n| Upper GI series | A rigid, non-distensible stomach that appears identical on every image |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Zollinger-Ellison syndrome"}, {"letter": "B", "text": "Gastric MALT lymphoma"}, {"letter": "C", "text": "Gastric outlet obstruction from pyloric scarring"}, {"letter": "D", "text": "Gastric adenocarcinoma"}, {"letter": "E", "text": "Peptic ulcer disease with scarring"}], "answer": "D", "explanation": "Gastric adenocarcinoma. Weight loss with epigastric pain, early satiety, melena, a Virchow's node, an unhealed prior gastric ulcer, a family history, and Korean birth. The imaging description is linitis plastica — a rigid, non-distensible stomach that looks identical on every image because the tumor has spread diffusely through the wall. Roughly 90–95% of gastric cancers are adenocarcinoma.", "objective": "Guide: Gastric Cancer — Presentation, Exam, History, Diagnostics; Special Considerations \"Histology / prognosis.\"", "section": "Weight loss with epigastric pain"}, {"id": "19A", "group": 19, "stem": "Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Endoscopic ultrasound for depth of invasion"}, {"letter": "B", "text": "PET-CT of the whole body"}, {"letter": "C", "text": "Upper endoscopy with biopsy"}, {"letter": "D", "text": "CT of the chest, abdomen, and pelvis"}, {"letter": "E", "text": "Serum carcinoembryonic antigen and CA 19-9"}], "answer": "C", "explanation": "Upper endoscopy with biopsy. Tissue comes first: an ulcer seen on a barium study cannot be biopsied and needs endoscopy. Note the related rule — any gastric ulcer gets a repeat endoscopy with biopsies at about eight weeks to document healing, because up to 5% of malignant ulcers look benign.", "objective": "Guide: Gastric Cancer — Diagnostics, 1st Line; Special Considerations \"Ulcer on upper GI series.\"", "section": "Weight loss with epigastric pain"}, {"id": "19B", "group": 19, "stem": "Which of the following studies is most reliable for determining depth of invasion?", "options": [{"letter": "A", "text": "Upper GI series with double contrast"}, {"letter": "B", "text": "Diagnostic laparoscopy with peritoneal washings"}, {"letter": "C", "text": "PET-CT of the whole body"}, {"letter": "D", "text": "CT of the abdomen with contrast"}, {"letter": "E", "text": "Endoscopic ultrasound"}], "answer": "E", "explanation": "Endoscopic ultrasound. EUS is the most reliable non-surgical study for T stage. PET beats CT for distant metastases, and CEA, CA 125, and CA 19-9 may be elevated but are not diagnostic.", "objective": "Guide: Gastric Cancer — Diagnostics, Staging and Labs.", "section": "Weight loss with epigastric pain"}, {"id": "20", "group": 20, "stem": "A 55-year-old woman describes epigastric pain that comes on while she is eating and is accompanied by early satiety, belching, and nausea; she has lost 4 kg over three months because eating hurts. She has taken ibuprofen most days for chronic back pain. Endoscopy shows a 1.5 cm ulcer on the lesser curvature of the stomach, and *H. pylori* testing is positive.\n\nWhich of the following features best distinguishes her ulcer from a duodenal ulcer?", "options": [{"letter": "A", "text": "Relief of pain with food and associated weight gain"}, {"letter": "B", "text": "Pain occurring only when the stomach is empty"}, {"letter": "C", "text": "Pain occurring with meals and associated weight loss"}, {"letter": "D", "text": "Pain radiating to the back between the scapulae"}, {"letter": "E", "text": "Pain occurring two to five hours after meals and at night"}], "answer": "C", "explanation": "Pain occurring with meals and associated weight loss. A gastric ulcer hurts with the meal as acid is released, and the patient loses weight because eating hurts. A duodenal ulcer hurts two to five hours after eating and at night between 11 PM and 2 AM, improves with food, and is associated with weight gain.", "objective": "Guide: Peptic Ulcer Disease — Etiology table.", "section": "Two ulcers, two patterns"}, {"id": "20A", "group": 20, "stem": "After eradication therapy and eight weeks of a proton pump inhibitor, which of the following is required?", "options": [{"letter": "A", "text": "Repeat endoscopy with biopsy to document healing"}, {"letter": "B", "text": "An annual upper GI series for three years"}, {"letter": "C", "text": "Repeat endoscopy only if the ulcer was larger than 2 cm"}, {"letter": "D", "text": "Repeat serology to document *H. pylori* eradication"}, {"letter": "E", "text": "No further endoscopy unless symptoms recur"}], "answer": "A", "explanation": "Repeat endoscopy with biopsy to document healing. Gastric ulcers only get a repeat scope — up to 5% of malignant ulcers look benign, so healing must be documented and the lesion re-biopsied. Duodenal ulcers need no repeat unless large, multiple, or symptomatic. Serology never confirms eradication; use a urea breath or stool antigen test at least four weeks out.", "objective": "Guide: Peptic Ulcer Disease — Management, Follow-up; Gastric Cancer — Special Considerations \"Any gastric ulcer.\"", "section": "Two ulcers, two patterns"}, {"id": "21", "group": 21, "stem": "A 48-year-old woman has had 10 hours of severe constant epigastric pain boring through to her back, better when she leans forward and worse when she lies flat, with repeated vomiting. She has had two shorter episodes of right upper quadrant pain after fatty meals in the past year, each resolving within a few hours. She does not drink alcohol and takes no medications. Her temperature is 37.8°C (100.0°F), blood pressure is 124/76 mm Hg, and pulse is 108/min. She has epigastric and right upper quadrant tenderness without guarding, rebound, or rigidity, and her sclerae are icteric.\n\n| Test | Result |\n|---|---|\n| Lipase | 1,640 U/L (upper limit 60) |\n| ALT / AST | 310 / 240 U/L |\n| Alkaline phosphatase | 260 U/L |\n| Total bilirubin | 3.1 mg/dL |\n| Triglycerides | 180 mg/dL |\n| Calcium | 9.2 mg/dL |\n| Right upper quadrant ultrasound | Gallstones, common bile duct 7 mm, no wall thickening |\n\nWhich of the following is the most likely cause?", "options": [{"letter": "A", "text": "Hypertriglyceridemia"}, {"letter": "B", "text": "Hypercalcemia"}, {"letter": "C", "text": "Gallstones"}, {"letter": "D", "text": "Alcohol use"}, {"letter": "E", "text": "A medication effect"}], "answer": "C", "explanation": "Gallstones. Lipase over three times normal with an ALT above 150 and a cholestatic pattern, gallstones on ultrasound, prior postprandial biliary colic, and no alcohol. Gallstones are the most common cause of acute pancreatitis (40–70%). Triglycerides need to exceed 1,000 mg/dL and calcium is normal here.", "objective": "Guide: Gallstone (Biliary) Pancreatitis — Diagnostics; Acute Pancreatitis — \"GET SMASHED.\"", "section": "Severe epigastric pain radiating to the back"}, {"id": "21A", "group": 21, "stem": "By hospital day two her pain has resolved and her bilirubin has normalized. Which of the following is most appropriate before discharge?", "options": [{"letter": "A", "text": "MRCP to exclude a retained common bile duct stone"}, {"letter": "B", "text": "Cholecystectomy during this admission"}, {"letter": "C", "text": "Elective cholecystectomy in six to eight weeks"}, {"letter": "D", "text": "ERCP with sphincterotomy before discharge"}, {"letter": "E", "text": "Ursodeoxycholic acid with dietary fat restriction"}], "answer": "B", "explanation": "Cholecystectomy during this admission. In mild gallstone pancreatitis, same-admission cholecystectomy reduces biliary readmissions without added risk. Delay only for fluid collections.", "objective": "Guide: Gallstone Pancreatitis — Management, Mild AP.", "section": "Severe epigastric pain radiating to the back"}, {"id": "21B", "group": 21, "stem": "Which of the following, had it been present, would have made urgent ERCP the priority instead?", "options": [{"letter": "A", "text": "A hematocrit that fell by five points overnight"}, {"letter": "B", "text": "Fever with rigors and a rising bilirubin"}, {"letter": "C", "text": "A lipase that continued to climb after admission"}, {"letter": "D", "text": "Pain persisting beyond the first forty-eight hours"}, {"letter": "E", "text": "Gallbladder wall thickening on the ultrasound"}], "answer": "B", "explanation": "Fever with rigors and a rising bilirubin. The ERCP predictors are cholangitis, a CBD stone seen on ultrasound, and a bilirubin above 4 mg/dL. MRCP looks; ERCP fixes — and ERCP itself aggravates pancreatitis in 4–10%.", "objective": "Guide: Gallstone Pancreatitis — Special Considerations \"ERCP predictors / vs MRCP.\"", "section": "Severe epigastric pain radiating to the back"}, {"id": "22", "group": 22, "stem": "A 62-year-old man with a long history of heavy smoking and alcohol use is found to have a mass in the proximal esophagus. He has never had reflux symptoms.\n\nWhich type of esophageal neoplasm does this patient most likely have?", "options": [{"letter": "A", "text": "Lymphoma"}, {"letter": "B", "text": "Leiomyoma"}, {"letter": "C", "text": "Squamous cell carcinoma"}, {"letter": "D", "text": "Adenocarcinoma"}, {"letter": "E", "text": "Gastrointestinal stromal tumor"}], "answer": "C", "explanation": "Squamous cell carcinoma. Tobacco and alcohol act synergistically and account for about 90% of US squamous cell cases, and squamous tumors sit in the upper and middle esophagus. Adenocarcinoma is distal or at the GEJ and arises from Barrett's after years of reflux.", "objective": "Guide: Esophageal Squamous Cell Carcinoma — History, Diagnostics; Esophageal Cancer — Special Considerations.", "section": "An esophageal mass"}, {"id": "23", "group": 23, "stem": "A 76-year-old man is seen four weeks after a left middle cerebral artery stroke. He coughs on the first attempt at every swallow, takes several swallows to clear one bite, and has a wet-sounding voice afterward. He was treated for pneumonia last month.\n\nWhich of the following studies best defines his swallowing problem?", "options": [{"letter": "A", "text": "CT of the neck with intravenous contrast"}, {"letter": "B", "text": "Modified barium swallow with a speech-language pathologist"}, {"letter": "C", "text": "High-resolution esophageal manometry"}, {"letter": "D", "text": "Barium esophagram of the distal esophagus"}, {"letter": "E", "text": "Upper endoscopy with esophageal biopsies"}], "answer": "B", "explanation": "Modified barium swallow with a speech-language pathologist. The gold standard for oropharyngeal dysphagia: it shows contrast entering the trachea and bolus pooling in the vallecula and pyriform sinuses, and it names a safe consistency. Note its limit — the study covers the cervical esophagus only and does not exclude a distal lesion.", "objective": "Guide: Oropharyngeal Dysphagia — Diagnostics, Gold Standard; Special Considerations.", "section": "Trouble starting the swallow"}, {"id": "23A", "group": 23, "stem": "A different 72-year-old patient with similar symptoms also regurgitates undigested food onto his pillow at night and has severe halitosis. Which of the following is true of his likely diagnosis?", "options": [{"letter": "A", "text": "Manometry is diagnostic, and imaging adds nothing"}, {"letter": "B", "text": "Barium swallow is diagnostic, and endoscopy risks perforation"}, {"letter": "C", "text": "It is a clinical diagnosis, and no imaging is indicated"}, {"letter": "D", "text": "Endoscopy is diagnostic, and barium swallow usually misses it"}, {"letter": "E", "text": "CT of the neck is diagnostic, and barium risks aspiration"}], "answer": "B", "explanation": "Barium swallow is diagnostic, and endoscopy risks perforation. Undigested food, halitosis, and food on the pillow is a Zenker's diverticulum — a posterior outpouching at Killian's triangle above the upper esophageal sphincter. Treatment is diverticulotomy.", "objective": "Guide: Oropharyngeal Dysphagia — Special Considerations \"Undigested food, halitosis, food on pillow.\"", "section": "Trouble starting the swallow"}, {"id": "24", "group": 24, "stem": "A 60-year-old woman is found to have a nodular liver and splenomegaly on ultrasound during a workup for a low platelet count. She feels well and has never had ascites, jaundice, confusion, or gastrointestinal bleeding. Her platelets are 118,000/mm³, albumin 3.9 g/dL, INR 1.1, and total bilirubin 0.8 mg/dL, and her transient elastography measures 16 kPa.\n\nWhich of the following best describes her disease?", "options": [{"letter": "A", "text": "Steatosis without significant fibrosis"}, {"letter": "B", "text": "Compensated cirrhosis"}, {"letter": "C", "text": "Advanced fibrosis without cirrhosis"}, {"letter": "D", "text": "Non-cirrhotic portal hypertension"}, {"letter": "E", "text": "Decompensated cirrhosis"}], "answer": "B", "explanation": "Compensated cirrhosis. An elastography value above 12–15 kPa is F4. She is compensated because none of the four decompensating events — ascites, variceal bleed, encephalopathy, or jaundice — has ever occurred. Thrombocytopenia is the earliest lab clue, preceding any change in albumin, INR, or bilirubin.", "objective": "Guide: Compensated Cirrhosis — Special Considerations; Cirrhosis — Diagnostics, Staging.", "section": "The newly diagnosed cirrhotic"}, {"id": "24A", "group": 24, "stem": "Which of the following is indicated at the time of diagnosis?", "options": [{"letter": "A", "text": "Upper endoscopy to screen for esophageal varices"}, {"letter": "B", "text": "Referral for transplant evaluation regardless of MELD"}, {"letter": "C", "text": "Hepatic venous pressure gradient measurement"}, {"letter": "D", "text": "Prophylactic banding of the distal esophagus"}, {"letter": "E", "text": "Upper endoscopy only if the platelet count falls below 100,000"}], "answer": "A", "explanation": "Upper endoscopy to screen for esophageal varices. Every cirrhotic gets a screening EGD at diagnosis, repeated every 2–3 years if none are found. Small varices get a non-selective beta blocker; large ones get band ligation.", "objective": "Guide: Cirrhosis — Diagnostics, Screening; Variceal Bleed — Special Considerations \"Screening EGD.\"", "section": "The newly diagnosed cirrhotic"}, {"id": "25", "group": 25, "stem": "A 64-year-old obese white man with twenty years of heartburn is found to have a mass at the gastroesophageal junction with salmon-colored mucosa adjacent to it.\n\nWhich type of esophageal neoplasm does this patient most likely have?", "options": [{"letter": "A", "text": "Small cell carcinoma"}, {"letter": "B", "text": "Squamous cell carcinoma"}, {"letter": "C", "text": "Adenocarcinoma"}, {"letter": "D", "text": "Kaposi sarcoma"}, {"letter": "E", "text": "Leiomyoma"}], "answer": "C", "explanation": "Adenocarcinoma. Distal or GEJ location with adjacent Barrett's mucosa in an obese white man with long-standing GERD. Squamous cell carcinoma sits in the upper or middle esophagus and follows tobacco and alcohol.", "objective": "Guide: Esophageal Adenocarcinoma — Common Patient, Diagnostics; Esophageal Cancer — Special Considerations.", "section": "A distal esophageal mass"}, {"id": "26", "group": 26, "stem": "A 69-year-old woman has eight months of two bowel movements a week with hard lumpy stool, straining, and a sense of incomplete emptying. She takes amlodipine and an iron supplement. She has had no rectal bleeding, no weight loss, and no change in stool caliber, and she has never had a colonoscopy. Her abdominal and rectal examinations are normal with no impaction.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "A stimulant laxative with follow-up in three months"}, {"letter": "B", "text": "Defecography to assess the pelvic floor"}, {"letter": "C", "text": "Anorectal manometry with balloon expulsion testing"}, {"letter": "D", "text": "Sitz marker study of colonic transit"}, {"letter": "E", "text": "Colonoscopy, since she is over 50 and has never been screened"}], "answer": "E", "explanation": "Colonoscopy, since she is over 50 and has never been screened. Constipation with no prior colonoscopy over age 50 earns one to exclude malignancy, even without red flags — and the red flags to know are blood in the stool, rectal bleeding, a rectal mass, tenesmus, unexplained weight loss, jaundice, age over 50, and a sudden change in bowel habit. Transit studies, manometry, and defecography are for refractory disease or a suspected defecatory disorder. Note her amlodipine and iron are both constipating.", "objective": "Guide: Constipation — Diagnostics, Screening and Confirmatory; Special Considerations \"RED FLAGS.\"", "section": "Hard stools and straining"}, {"id": "26A", "group": 26, "stem": "Her colonoscopy is normal. Which of the following is the most appropriate first-line therapy?", "options": [{"letter": "A", "text": "Lubiprostone 8 mcg twice daily"}, {"letter": "B", "text": "Polyethylene glycol 17 g daily as the initial agent"}, {"letter": "C", "text": "Increased dietary fiber with fluids and activity, plus psyllium"}, {"letter": "D", "text": "Biofeedback and pelvic floor physical therapy"}, {"letter": "E", "text": "Senna taken nightly on a long-term basis"}], "answer": "C", "explanation": "Increased dietary fiber with fluids and activity, plus psyllium. Fiber first, with bulk agents — psyllium or methylcellulose — the safest pharmacologic step. Osmotics such as polyethylene glycol and lactulose are second line, stimulants are not for chronic use, and lubiprostone and linaclotide are for refractory disease.", "objective": "Guide: Constipation — Management, First Line and Second Line; Warnings.", "section": "Hard stools and straining"}, {"id": "27", "group": 27, "stem": "A 44-year-old woman six months after a kidney transplant has odynophagia. Endoscopy shows large, deep, longitudinal ulcers in the mid esophagus.\n\nWhich of the following biopsy approaches is most appropriate?", "options": [{"letter": "A", "text": "Biopsy of the ulcer base for cytomegalovirus"}, {"letter": "B", "text": "Biopsy of the ulcer edge for herpes simplex virus"}, {"letter": "C", "text": "Brushings of the plaque for Candida species"}, {"letter": "D", "text": "Four-quadrant biopsies of the distal esophagus"}, {"letter": "E", "text": "Biopsy of the ulcer edge for cytomegalovirus"}], "answer": "A", "explanation": "Biopsy of the ulcer base for cytomegalovirus. Large, deep, linear or longitudinal ulcers are CMV, and the base is biopsied. HSV gives multiple shallow well-c
