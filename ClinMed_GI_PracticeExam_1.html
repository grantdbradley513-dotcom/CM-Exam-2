ircumscribed volcano-like ulcers, and the edge is biopsied. The biopsy site is the exam point.", "objective": "Guide: Infectious Esophagitis (HSV / CMV) — Diagnostics, 1st Line and Confirmatory.", "section": "Ulcers on endoscopy"}, {"id": "28", "group": 28, "stem": "A 24-year-old woman has eighteen months of lower abdominal pain occurring several days a week, relieved after she moves her bowels, alternating between hard pellet stools and loose ones, with bloating. She sleeps through the night without symptoms. She has no weight loss, no rectal bleeding, and no family history of colorectal cancer or inflammatory bowel disease. Her CBC, CRP, tissue transglutaminase IgA, and fecal calprotectin are all normal, and her examination is unremarkable.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "A 72-hour fecal fat collection on a fixed diet"}, {"letter": "B", "text": "Hydrogen breath testing after a lactose load"}, {"letter": "C", "text": "Make the diagnosis clinically using the Rome IV criteria"}, {"letter": "D", "text": "CT enterography of the abdomen and pelvis"}, {"letter": "E", "text": "Colonoscopy with random mucosal biopsies"}], "answer": "C", "explanation": "Make the diagnosis clinically using the Rome IV criteria. Recurrent abdominal pain at least one day a week for three months with at least two of: relation to defecation, change in stool frequency, change in stool form. The criteria have over 95% predictive value. She has no alarm features — normal CBC and CRP, negative celiac serology, normal calprotectin, no nocturnal diarrhea, and she is under 45.", "objective": "Guide: Irritable Bowel Syndrome — Diagnostics, Clinical Dx; Special Considerations \"Alarm features.\"", "section": "Pain with a changing bowel habit"}, {"id": "28A", "group": 28, "stem": "Which of the following is the most appropriate first-line management?", "options": [{"letter": "A", "text": "A low-FODMAP diet with avoidance of caffeine and alcohol"}, {"letter": "B", "text": "A low-dose tricyclic antidepressant started at diagnosis"}, {"letter": "C", "text": "Alosetron for symptom control"}, {"letter": "D", "text": "Loperamide taken before every meal indefinitely"}, {"letter": "E", "text": "Rifaximin for fourteen days as initial therapy"}], "answer": "A", "explanation": "A low-FODMAP diet with avoidance of caffeine and alcohol. Diet is first line, with fiber added for constipation-predominant disease. TCAs and SSRIs are for persistent pain, rifaximin is for diarrhea-predominant disease that has not responded, and alosetron is severely restricted because of ischemic colitis risk.", "objective": "Guide: IBS — Management, First Line; Warnings.", "section": "Pain with a changing bowel habit"}, {"id": "29", "group": 29, "stem": "A 64-year-old man with hepatitis C cirrhosis, currently compensated, has a routine six-month surveillance ultrasound that shows a new 3 cm lesion in the right lobe. He feels well and has had no weight loss, pain, or new decompensation. His examination shows a firm liver edge with no ascites and no asterixis.\n\n| Test | Result |\n|---|---|\n| Alpha-fetoprotein | 9 ng/mL |\n| Total bilirubin | 1.2 mg/dL |\n| INR | 1.1 |\n| Albumin | 3.8 g/dL |\n| Platelets | 96,000/mm³ |\n| Multiphase MRI | 3 cm lesion with arterial enhancement and venous washout, with a capsule |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "A metastatic deposit"}, {"letter": "B", "text": "A regenerative nodule"}, {"letter": "C", "text": "A hepatic hemangioma"}, {"letter": "D", "text": "Hepatocellular carcinoma"}, {"letter": "E", "text": "Intrahepatic cholangiocarcinoma"}], "answer": "D", "explanation": "Hepatocellular carcinoma. In a cirrhotic, a lesion larger than 1 cm with arterial enhancement, venous washout, and a capsule on multiphase imaging is LR-5 — that is the diagnosis. A normal alpha-fetoprotein does not argue against it: 30–50% of tumors do not produce it.", "objective": "Guide: Hepatocellular Carcinoma — Diagnostics, 1st Line Imaging and Labs.", "section": "A liver lesion found on surveillance"}, {"id": "29A", "group": 29, "stem": "Which of the following is the next step?", "options": [{"letter": "A", "text": "PET-CT to characterize the lesion further"}, {"letter": "B", "text": "No biopsy is required; proceed to staging and treatment planning"}, {"letter": "C", "text": "Repeat alpha-fetoprotein in three months before acting"}, {"letter": "D", "text": "Repeat ultrasound in three months to document growth"}, {"letter": "E", "text": "Percutaneous liver biopsy of the lesion for histology"}], "answer": "B", "explanation": "No biopsy is required; proceed to staging and treatment planning. LR-5 imaging in a cirrhotic is diagnostic without histology. Biopsy is required in non-cirrhotic patients, or when a cirrhotic lesion is not LR-5.", "objective": "Guide: Hepatocellular Carcinoma — Diagnostics, 1st Line Imaging and Confirmatory.", "section": "A liver lesion found on surveillance"}, {"id": "29B", "group": 29, "stem": "He is found to have portal hypertension. Which of the following is the most appropriate treatment approach?", "options": [{"letter": "A", "text": "Locoregional therapy with liver transplantation"}, {"letter": "B", "text": "Radiation therapy alone to the lesion"}, {"letter": "C", "text": "Surveillance imaging every three months"}, {"letter": "D", "text": "Surgical resection of the involved segment"}, {"letter": "E", "text": "Systemic immunotherapy as first-line treatment"}], "answer": "A", "explanation": "Locoregional therapy with liver transplantation. Resection requires the absence of portal hypertension. With portal hypertension present, the route is locoregional therapy — TACE, Y-90, or ablation — plus transplantation.", "objective": "Guide: Hepatocellular Carcinoma — Management; Special Considerations \"Resection.\"", "section": "A liver lesion found on surveillance"}, {"id": "30", "group": 30, "stem": "A 36-year-old woman with no known liver disease is brought in with four days of nausea and vomiting followed by jaundice, and today her husband says she has been confused and slurring her words. She started terbinafine for a toenail infection six weeks ago and takes no other medications; she denies acetaminophen and does not drink. Her temperature is 37.4°C (99.3°F), blood pressure is 104/62 mm Hg, and pulse is 108/min. She is disoriented with asterixis and deep jaundice; there are no spider angiomata, no palmar erythema, and no splenomegaly.\n\n| Test | Result |\n|---|---|\n| ALT / AST | 2,240 / 1,880 U/L |\n| Total bilirubin | 16.2 mg/dL |\n| INR | 3.4 |\n| Ammonia | 168 µmol/L |\n| Creatinine | 1.9 mg/dL |\n| Acetaminophen level | Undetectable |\n\nWhich of the following best describes her condition?", "options": [{"letter": "A", "text": "Acute liver failure"}, {"letter": "B", "text": "Ischemic hepatitis"}, {"letter": "C", "text": "Acute-on-chronic liver failure"}, {"letter": "D", "text": "Severe acute liver injury without failure"}, {"letter": "E", "text": "Decompensated chronic liver disease"}], "answer": "A", "explanation": "Acute liver failure. Severe acute liver injury with an INR above 1.5 and hepatic encephalopathy, in a patient with no pre-existing liver disease and an illness under 26 weeks. Terbinafine is a named idiosyncratic DILI agent.", "objective": "Guide: Acute Hepatic Failure — Diagnostics, 1st Line Labs; DILI — Special Considerations \"Idiosyncratic drugs.\"", "section": "Jaundice then confusion in days"}, {"id": "30A", "group": 30, "stem": "Which of the following is the most appropriate immediate action?", "options": [{"letter": "A", "text": "Observation on the ward with daily liver enzymes"}, {"letter": "B", "text": "Corticosteroids with a repeat INR in 48 hours"}, {"letter": "C", "text": "Referral to a transplant center with intensive care admission"}, {"letter": "D", "text": "Lactulose alone with reassessment in 24 hours"}, {"letter": "E", "text": "Liver biopsy to establish the etiology before referral"}], "answer": "C", "explanation": "Referral to a transplant center with intensive care admission. Referral is triggered by acute encephalopathy, shock, renal failure, or an INR above 3 — not by enzyme numbers. Give N-acetylcysteine when the cause is in doubt, watch for cerebral edema, hypoglycemia, and infection, and check an acetaminophen level on every patient.", "objective": "Guide: Acute Hepatic Failure — Emergency line, Management; Special Considerations \"Definition / when to refer.\"", "section": "Jaundice then confusion in days"}, {"id": "30B", "group": 30, "stem": "Her ammonia rises to 210 µmol/L. Which of the following is indicated?", "options": [{"letter": "A", "text": "Repeat ammonia in six hours before any intervention"}, {"letter": "B", "text": "Protein restriction to 20 g daily with additional lactulose"}, {"letter": "C", "text": "Immediate large-volume paracentesis with albumin"}, {"letter": "D", "text": "Rifaximin added at 550 mg twice daily as monotherapy"}, {"letter": "E", "text": "Head CT with hypertonic saline to a sodium goal of 150 mEq/L"}], "answer": "E", "explanation": "Head CT with hypertonic saline to a sodium goal of 150 mEq/L. At an ammonia above 200 or with cerebral edema, obtain a head CT, involve nephrology for vascular access and continuous renal replacement to clear ammonia, and use hypertonic saline to a sodium goal of 150. Protein restriction is not the answer even here.", "objective": "Guide: Acute Hepatic Failure — Management, Ammonia >150.", "section": "Jaundice then confusion in days"}, {"id": "31", "group": 31, "stem": "An 81-year-old nursing-home resident with long-standing constipation is brought in with three days of gradually worsening lower abdominal pain, no bowel movement or flatus for two days, and a rapidly enlarging abdomen. He has had no previous abdominal surgery and no vomiting. His temperature is 37.0°C (98.6°F), blood pressure is 128/76 mm Hg, and pulse is 92/min. His abdomen is massively distended and tympanitic with mild diffuse tenderness, no rebound and no guarding; rectal examination finds an empty vault.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 10,400/mm³ |\n| Lactate | 1.3 mmol/L |\n| Potassium | 3.9 mEq/L |\n| Creatinine | 1.1 mg/dL |\n| Abdominal radiograph | A dilated U-shaped loop rising from the pelvis toward the right upper quadrant with absent rectal gas |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Obstructing sigmoid carcinoma"}, {"letter": "B", "text": "Adynamic ileus"}, {"letter": "C", "text": "Adhesive small bowel obstruction"}, {"letter": "D", "text": "Sigmoid volvulus"}, {"letter": "E", "text": "Fecal impaction"}], "answer": "D", "explanation": "Sigmoid volvulus. An elderly institutionalized patient with chronic constipation and a long redundant colon, and the radiograph shows the coffee bean sign — a dilated U-shaped sigmoid loop pointing toward the right upper quadrant with absent rectal gas. That plain-film finding is diagnostic in 50–60% of cases.", "objective": "Guide: Volvulus — History, Diagnostics, 1st Line Imaging.", "section": "Distension without stool or flatus"}, {"id": "31A", "group": 31, "stem": "Which of the following would CT of the abdomen most likely show?", "options": [{"letter": "A", "text": "Air throughout the bowel to the rectum with no transition point"}, {"letter": "B", "text": "Segmental wall thickening with thumbprinting at the splenic flexure"}, {"letter": "C", "text": "Wall thickening with pericolonic fat stranding and diverticula"}, {"letter": "D", "text": "A whirl pattern with bird-beak tapering at both ends of the loop"}, {"letter": "E", "text": "A thickened double-layered loop with a target sign on sagittal images"}], "answer": "D", "explanation": "A whirl pattern with bird-beak tapering at both ends of the loop. CT confirms in about 90%. Necrosis would show pneumatosis intestinalis and loss of wall enhancement.", "objective": "Guide: Volvulus — Diagnostics, Best Imaging.", "section": "Distension without stool or flatus"}, {"id": "31B", "group": 31, "stem": "He has no peritoneal signs and no pneumatosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Water-soluble contrast enema with observation"}, {"letter": "B", "text": "Emergent sigmoid resection with an end colostomy"}, {"letter": "C", "text": "Nasogastric decompression with serial radiographs alone"}, {"letter": "D", "text": "Endoscopic detorsion alone with no further surgery"}, {"letter": "E", "text": "Endoscopic detorsion followed by elective resection"}], "answer": "E", "explanation": "Endoscopic detorsion followed by elective resection. Flexible sigmoidoscopy detorses a sigmoid volvulus without peritonitis, but detorsion alone recurs in 50–60%, so elective resection follows. Peritonitis or pneumatosis means the operating room, not the scope, and a cecal volvulus goes straight to resection.", "objective": "Guide: Volvulus — Management; Surgical; Special Considerations \"Detorsion alone.\"", "section": "Distension without stool or flatus"}, {"id": "32", "group": 32, "stem": "A 44-year-old man has had ulcerative pancolitis for eleven years, generally well controlled. He has never had a surveillance colonoscopy and has no symptoms currently.\n\nWhich of the following is the most appropriate surveillance program?", "options": [{"letter": "A", "text": "No surveillance until twenty years of disease have elapsed"}, {"letter": "B", "text": "Flexible sigmoidoscopy every two years with random rectal biopsies"}, {"letter": "C", "text": "CT colonography every three years with annual fecal immunochemical testing"}, {"letter": "D", "text": "Colonoscopy with four-quadrant biopsies every 10 cm, at least 32 biopsies"}, {"letter": "E", "text": "Colonoscopy with biopsy of any visible polyp only"}], "answer": "D", "explanation": "Colonoscopy with four-quadrant biopsies every 10 cm, at least 32 biopsies. IBD-associated cancer arises in flat inflamed mucosa rather than a polyp, so it is biopsied rather than seen; the full protocol reaches about 90% sensitivity. Surveillance starts eight years after diagnosis and repeats every one to five years. Risk rises 8–10 years into pancolitis, with a cumulative incidence of 5–10% at 20 years.", "objective": "Guide: IBD-Associated Colorectal Cancer — Diagnostics, Management; Special Considerations \"Timing.\"", "section": "Cancer risk after long-standing colitis"}, {"id": "32A", "group": 32, "stem": "If he also had primary sclerosing cholangitis, how would surveillance differ?", "options": [{"letter": "A", "text": "It would begin at eight years and be repeated every five years"}, {"letter": "B", "text": "It would be unnecessary, since PSC does not raise colorectal risk"}, {"letter": "C", "text": "It would begin at diagnosis and be repeated every one to two years"}, {"letter": "D", "text": "It would be replaced by annual liver imaging alone"}, {"letter": "E", "text": "It would begin at twenty years of disease duration"}], "answer": "C", "explanation": "It would begin at diagnosis and be repeated every one to two years. Ulcerative colitis with primary sclerosing cholangitis does not wait eight years — surveillance starts at diagnosis, yearly to every two years.", "objective": "Guide: IBD-Associated Colorectal Cancer — Management, UC + PSC; Colon Cancer — Surveillance.", "section": "Cancer risk after long-standing colitis"}, {"id": "33", "group": 33, "stem": "A 58-year-old man has a first screening colonoscopy. Two polyps are removed: a 6 mm tubular adenoma and a 14 mm tubulovillous adenoma, both completely excised with clear margins and no invasive carcinoma.\n\nWhich of the following best describes his risk?", "options": [{"letter": "A", "text": "Polyps under 1 cm never progress to carcinoma"}, {"letter": "B", "text": "Malignant potential rises with polyp size and villous histology"}, {"letter": "C", "text": "Villous histology is protective compared with tubular"}, {"letter": "D", "text": "Tubular adenomas carry no malignant potential at any size"}, {"letter": "E", "text": "Malignant potential depends on polyp number alone, not histology"}], "answer": "B", "explanation": "Malignant potential rises with polyp size and villous histology. Polyps over 1 cm or multiple polyps carry a three- to six-fold colorectal cancer risk. About 75% of colorectal cancers arise from an adenomatous polyp through the adenoma-carcinoma sequence.", "objective": "Guide: Colorectal Adenomatous Polyps — Special Considerations.", "section": "What the colonoscopy found"}, {"id": "33A", "group": 33, "stem": "When should his next colonoscopy be scheduled?", "options": [{"letter": "A", "text": "In one year"}, {"letter": "B", "text": "Only if he develops symptoms"}, {"letter": "C", "text": "In six months"}, {"letter": "D", "text": "In ten years"}, {"letter": "E", "text": "In three to five years"}], "answer": "E", "explanation": "In three to five years. Repeat colonoscopy three to five years after adenoma removal; a negative screening colonoscopy returns in ten years. Delayed post-polypectomy bleeding peaks at five to seven days — worth counselling him about.", "objective": "Guide: Colorectal Adenomatous Polyps — Management, Surveillance; Colon Cancer — Screening.", "section": "What the colonoscopy found"}, {"id": "34", "group": 34, "stem": "A 45-year-old man with an endoscopically confirmed duodenal ulcer tests positive for *H. pylori* by urea breath test. He took clarithromycin for a sinus infection last year.\n\nWhich of the following is the most appropriate regimen?", "options": [{"letter": "A", "text": "Omeprazole, clarithromycin, and metronidazole for 10 days"}, {"letter": "B", "text": "Omeprazole alone for 8 weeks, then retesting"}, {"letter": "C", "text": "Omeprazole, clarithromycin, and amoxicillin for 14 days"}, {"letter": "D", "text": "Omeprazole with amoxicillin alone for 14 days"}, {"letter": "E", "text": "Omeprazole, bismuth, metronidazole, and tetracycline for 14 days"}], "answer": "E", "explanation": "Omeprazole, bismuth, metronidazole, and tetracycline for 14 days. Any prior macrolide exposure rules out clarithromycin-based triple therapy — bismuth quadruple therapy for 14 days is the answer. Every regimen carries a standard-dose BID PPI, and eradication is confirmed at least four weeks after treatment by stool antigen or urea breath, never by serology.", "objective": "Guide: H. pylori Gastritis — Management, Prior macrolide/quinolone.", "section": "Eradication after prior antibiotic exposure"}, {"id": "35", "group": 35, "stem": "A 52-year-old man with type 2 diabetes and a body mass index of 36 is found to have a persistently elevated ALT of 78 U/L with an AST of 52 U/L. He drinks one or two beers a month. Viral, autoimmune, and metabolic serologies are negative, and ultrasound shows a bright echogenic liver.\n\nWhich of the following best explains his enzyme pattern?", "options": [{"letter": "A", "text": "An isolated alkaline phosphatase rise, typical of biliary obstruction"}, {"letter": "B", "text": "An AST-to-ALT ratio below 1, typical of metabolic fatty liver disease"}, {"letter": "C", "text": "A mixed pattern, typical of drug-induced liver injury"}, {"letter": "D", "text": "An AST-to-ALT ratio above 2, typical of alcohol-related liver disease"}, {"letter": "E", "text": "Transaminases above 15 times normal, typical of viral hepatitis"}], "answer": "B", "explanation": "An AST-to-ALT ratio below 1, typical of metabolic fatty liver disease. ALT exceeds AST in MASLD, typically 2–5 times normal before cirrhosis, and the enzymes may fluctuate or be normal. A ratio above 2 — especially above 3, which is 97% specific — points to alcohol, and both are usually under 400.", "objective": "Guide: MASLD / MASH — Diagnostics, 1st Line Labs; Fatty Liver (Alcohol-Related) — Diagnostics.", "section": "An incidental fatty liver"}, {"id": "35A", "group": 35, "stem": "Transient elastography places him at F3 fibrosis. In addition to diet and exercise, which of the following is indicated?", "options": [{"letter": "A", "text": "Ursodeoxycholic acid"}, {"letter": "B", "text": "Resmetirom"}, {"letter": "C", "text": "No pharmacologic therapy at any fibrosis stage"}, {"letter": "D", "text": "Prednisone with azathioprine"}, {"letter": "E", "text": "Serial phlebotomy"}], "answer": "B", "explanation": "Resmetirom. A thyroid hormone receptor-beta partial agonist licensed for F2–F3 only — not F0–F1 and not cirrhosis. Semaglutide 2.4 mg is the other option, and it also addresses weight and diabetes. Diet and exercise remain the cornerstone: 5% weight loss to start, 10% to resolve steatohepatitis.", "objective": "Guide: MASLD / MASH — Management; Special Considerations \"Resmetirom indication.\"", "section": "An incidental fatty liver"}, {"id": "36", "group": 36, "stem": "A 17-year-old boy whose father had a colectomy in his twenties undergoes colonoscopy after several months of hematochezia. Hundreds of adenomatous polyps carpet the entire colon.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Surveillance colonoscopy every one to two years"}, {"letter": "B", "text": "Colectomy deferred until age 40"}, {"letter": "C", "text": "Chemoprevention with a daily NSAID"}, {"letter": "D", "text": "Early prophylactic colectomy with genetic counseling"}, {"letter": "E", "text": "Endoscopic polypectomy of all lesions over 1 cm"}], "answer": "D", "explanation": "Early prophylactic colectomy with genetic counseling. Familial adenomatous polyposis is autosomal dominant from a germline APC mutation, with hundreds to thousands of adenomas from childhood, symptoms around age 16, and colorectal cancer in 90% of untreated patients by 45. Early prophylactic colectomy, with ileal pouch-anal anastomosis as the restorative option — the same operation used in ulcerative colitis — plus upper endoscopy, since polyps occur more proximally too.", "objective": "Guide: Familial Adenomatous Polyposis — Diagnostics, Management; Special Considerations \"Cancer risk.\"", "section": "Polyps beyond counting"}, {"id": "37", "group": 37, "stem": "A 57-year-old man has had eighteen months of trouble swallowing solid food that has slowly worsened; liquids go down normally. He has had heartburn for many years, but it has actually become less noticeable over the past year. He has lost 3 kg. Endoscopy is scheduled, and a barium esophagram shows a smooth, tapered, concentric narrowing of the distal esophagus over a 2 cm segment.\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Achalasia"}, {"letter": "B", "text": "Eosinophilic esophagitis"}, {"letter": "C", "text": "A peptic stricture"}, {"letter": "D", "text": "Esophageal carcinoma"}, {"letter": "E", "text": "A Schatzki ring"}], "answer": "C", "explanation": "A peptic stricture. Slowly progressive dysphagia to solids only, with heartburn that improves as the stricture tightens — the scar itself becomes the barrier. A smooth, tapered, concentric distal narrowing of 1–4 cm is the barium signature. A Schatzki ring gives intermittent non-progressive dysphagia with weeks to months between episodes, and carcinoma gives an irregular apple-core lesion with rapid progression.", "objective": "Guide: Esophageal Strictures — Presentation, Diagnostics; Schatzki Ring — Presentation.", "section": "Food that sticks"}, {"id": "37A", "group": 37, "stem": "After endoscopic dilation, which of the following reduces recurrence?", "options": [{"letter": "A", "text": "An H2 antagonist taken at bedtime"}, {"letter": "B", "text": "Sucralfate slurry four times daily"}, {"letter": "C", "text": "A swallowed topical corticosteroid"}, {"letter": "D", "text": "Chewing food thoroughly with no medication"}, {"letter": "E", "text": "A daily proton pump inhibitor"}], "answer": "E", "explanation": "A daily proton pump inhibitor. A daily PPI after dilation cuts recurrence of peptic strictures and rings. Perforation is the worst complication of dilation.", "objective": "Guide: Esophageal Strictures — Management; Warnings.", "section": "Food that sticks"}, {"id": "38", "group": 38, "stem": "A 42-year-old woman has three months of fatigue and a change in her bowel habits. Colonoscopy shows a mass in the ascending colon, and biopsy confirms a mucinous adenocarcinoma; only two small polyps are found elsewhere in the colon. Her mother had colon cancer at 45 and endometrial cancer at 52, and a maternal uncle had colon cancer at 48. Her hemoglobin is 9.8 g/dL with an MCV of 75 fL.\n\nWhich of the following is the most likely underlying condition?", "options": [{"letter": "A", "text": "Lynch syndrome"}, {"letter": "B", "text": "Peutz-Jeghers syndrome"}, {"letter": "C", "text": "IBD-associated colorectal cancer"}, {"letter": "D", "text": "Sporadic colorectal cancer"}, {"letter": "E", "text": "Familial adenomatous polyposis"}], "answer": "A", "explanation": "Lynch syndrome. Right-sided mucinous colorectal cancer under 50, without FAP's carpet of polyps, with a family history spanning colon and endometrial cancer at young ages — the Amsterdam pattern. Lynch accounts for 3–4% of colorectal cancer with an 80% lifetime risk.", "objective": "Guide: Lynch Syndrome — Common Patient, History, Diagnostics; Special Considerations \"Share / risk.\"", "section": "Colon cancer in a young patient"}, {"id": "38A", "group": 38, "stem": "Which of the following confirms the diagnosis?", "options": [{"letter": "A", "text": "Germline mismatch-repair gene testing"}, {"letter": "B", "text": "STK11 gene testing"}, {"letter": "C", "text": "Serum carcinoembryonic antigen"}, {"letter": "D", "text": "Colonoscopy with four-quadrant biopsies every 10 cm"}, {"letter": "E", "text": "APC gene testing"}], "answer": "A", "explanation": "Germline mismatch-repair gene testing. A mutation in a DNA mismatch-repair gene confirms it; APC testing is for FAP. Genetic counseling is part of the first-line evaluation.", "objective": "Guide: Lynch Syndrome — Diagnostics, Confirmatory.", "section": "Colon cancer in a young patient"}, {"id": "38B", "group": 38, "stem": "For which additional malignancy is she at highest risk?", "options": [{"letter": "A", "text": "Esophageal adenocarcinoma"}, {"letter": "B", "text": "Endometrial carcinoma"}, {"letter": "C", "text": "Cutaneous melanoma"}, {"letter": "D", "text": "Thyroid carcinoma"}, {"letter": "E", "text": "Hepatocellular carcinoma"}], "answer": "B", "explanation": "Endometrial carcinoma. Endometrial cancer is the leading associated malignancy; also ovary, stomach, small bowel, hepatobiliary, brain, and renal pelvis or ureter. Management includes early frequent colonoscopic surveillance, testing the patient and family, and a real discussion about prophylactic colectomy and extended resection for synchronous risk.", "objective": "Guide: Lynch Syndrome — Special Considerations \"Other cancers\"; Management.", "section": "Colon cancer in a young patient"}, {"id": "39", "group": 39, "stem": "A 27-year-old man has four days of fever, rigors, and severe periumbilical cramping with more than ten bowel movements daily; since yesterday the stools have contained blood and mucus. He grilled chicken at home five days ago and remembers it being pink at the bone. Nobody else who ate it is ill. His temperature is 38.7°C (101.7°F), blood pressure is 118/72 mm Hg, and pulse is 104/min. His abdomen is markedly tender, worst in the right lower quadrant, without rebound or guarding.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 15,800/mm³ |\n| Creatinine | 1.1 mg/dL |\n| Hemoglobin | 14.1 g/dL |\n| Platelets | 268,000/mm³ |\n| Stool studies | Fecal leukocytes present; multiplex PCR pending |\n\nWhich of the following organisms is most likely responsible?", "options": [{"letter": "A", "text": "Shiga toxin-producing Escherichia coli"}, {"letter": "B", "text": "Non-typhoidal Salmonella"}, {"letter": "C", "text": "Yersinia enterocolitica"}, {"letter": "D", "text": "Campylobacter jejuni"}, {"letter": "E", "text": "Clostridium perfringens"}], "answer": "D", "explanation": "Campylobacter jejuni. Undercooked poultry, an incubation of 1–7 days, fever, and the worst periumbilical cramping of any bacterial diarrhea with bloody mucoid stools by day two or three. STEC gives bloody diarrhea without fever after beef; Salmonella follows eggs, poultry, or reptile contact and cramps less; Yersinia follows raw pork with right-sided pseudoappendicitis; C. perfringens is watery and self-limited.", "objective": "Guide: Campylobacter jejuni — History, Presentation, Exam.", "section": "Bloody diarrhea with severe cramping"}, {"id": "39A", "group": 39, "stem": "Which of the following is the preferred antibiotic if treatment is indicated?", "options": [{"letter": "A", "text": "Ceftriaxone for five days"}, {"letter": "B", "text": "Trimethoprim-sulfamethoxazole for five days"}, {"letter": "C", "text": "Oral vancomycin for ten days"}, {"letter": "D", "text": "Metronidazole for seven days"}, {"letter": "E", "text": "Azithromycin for three days"}], "answer": "E", "explanation": "Azithromycin for three days. Azithromycin 500 mg daily for three days is preferred; levofloxacin or ciprofloxacin are alternatives. Most patients need no antibiotic at all — only the severe or at-risk.", "objective": "Guide: Campylobacter jejuni — Management, Severe / at risk.", "section": "Bloody diarrhea with severe cramping"}, {"id": "39B", "group": 39, "stem": "Two weeks later he develops ascending weakness. This complication follows which of the following?", "options": [{"letter": "A", "text": "Toxin-mediated blockade of presynaptic acetylcholine release"}, {"letter": "B", "text": "Molecular mimicry between bacterial surface proteins and nerve sheaths"}, {"letter": "C", "text": "Direct bacterial invasion of the anterior horn cells"}, {"letter": "D", "text": "Circulating Shiga toxin injuring the renal microvasculature"}, {"letter": "E", "text": "Deposition of immune complexes within synovial membranes"}], "answer": "B", "explanation": "Molecular mimicry between bacterial surface proteins and nerve sheaths. Campylobacter is the classic antecedent infection of Guillain-Barré syndrome, preceding up to 40% of cases; weakness peaks around two weeks. Shiga toxin injuring renal microvessels is HUS, a different organism and a different complication.", "objective": "Guide: Campylobacter jejuni — Explained to Patient; Special Considerations \"Guillain-Barré syndrome.\"", "section": "Bloody diarrhea with severe cramping"}, {"id": "40", "group": 40, "stem": "A 34-year-old woman has three weeks of progressively worsening upper abdominal pain and a rapidly enlarging abdomen. She takes a combined oral contraceptive and had a deep vein thrombosis after a long flight two years ago; her mother has a myeloproliferative disorder. She drinks rarely and has no history of liver disease. Her temperature is 37.2°C (99.0°F), blood pressure is 118/74 mm Hg, and pulse is 92/min. She has tense ascites, a tender enlarged liver, and mild jaundice; there are no spider angiomata and no splenomegaly.\n\n| Test | Result |\n|---|---|\n| AST / ALT | 180 / 210 U/L |\n| Total bilirubin | 3.2 mg/dL |\n| INR | 1.6 |\n| Albumin | 3.4 g/dL |\n| Serum-ascites albumin gradient | 1.6 g/dL |\n| Hepatitis and autoimmune serologies | Negative |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peritoneal carcinomatosis"}, {"letter": "B", "text": "Budd-Chiari syndrome"}, {"letter": "C", "text": "Right-sided heart failure with hepatic congestion"}, {"letter": "D", "text": "Decompensated cirrhosis from an unrecognized cause"}, {"letter": "E", "text": "Autoimmune hepatitis with acute decompensation"}], "answer": "B", "explanation": "Budd-Chiari syndrome. Acute abdominal pain with ascites, a tender enlarged liver, and jaundice in a young woman with a prothrombotic history — oral contraceptives, a prior DVT, and a family history of myeloproliferative disease, the JAK2 setting. The high SAAG confirms portal hypertension, but there are no stigmata of chronic liver disease.", "objective": "Guide: Budd-Chiari Syndrome — Common Patient, History, Presentation, Exam.", "section": "New ascites with a tender liver"}, {"id": "40A", "group": 40, "stem": "Which of the following is the most appropriate initial imaging study?", "options": [{"letter": "A", "text": "Non-contrast CT of the abdomen"}, {"letter": "B", "text": "Right upper quadrant ultrasound without Doppler"}, {"letter": "C", "text": "Doppler ultrasound of the hepatic veins"}, {"letter": "D", "text": "Transient elastography of the liver"}, {"letter": "E", "text": "MRCP of the biliary tree"}], "answer": "C", "explanation": "Doppler ultrasound of the hepatic veins. First-line: absent hepatic veins or hepatic vein thrombus, meaning hepatic venous outflow obstruction. Triple-phase CT is the best follow-on imaging, and direct venography is reserved for an inconclusive study. Any new LFT elevation earns an ultrasound to check patency, ducts, masses, cirrhosis, and steatosis.", "objective": "Guide: Budd-Chiari Syndrome — Diagnostics.", "section": "New ascites with a tender liver"}, {"id": "40B", "group": 40, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Diuretics with sodium restriction and outpatient follow-up"}, {"letter": "B", "text": "Corticosteroids with azathioprine maintenance"}, {"letter": "C", "text": "Antibiotic prophylaxis with ceftriaxone and observation"}, {"letter": "D", "text": "Anticoagulation with urgent referral to an advanced liver center for TIPS"}, {"letter": "E", "text": "Serial large-volume paracentesis with albumin replacement"}], "answer": "D", "explanation": "Anticoagulation with urgent referral to an advanced liver center for TIPS. Anticoagulate and restore outflow; transplantation is for acute liver failure or established cirrhosis.", "objective": "Guide: Budd-Chiari Syndrome — Management.", "section": "New ascites with a tender liver"}, {"id": "41", "group": 41, "stem": "A 33-year-old man has three weeks of bloating, foul-smelling flatulence, and greasy stools that float, with no blood and no fever. He drank from a mountain stream during a backpacking trip a month ago. He has lost 3 kg, and his abdomen is distended but non-tender.\n\nWhich of the following is the preferred diagnostic test?", "options": [{"letter": "A", "text": "Stool antigen testing for Giardia"}, {"letter": "B", "text": "Stool microscopy for cysts and trophozoites"}, {"letter": "C", "text": "Serum antibody testing for Giardia"}, {"letter": "D", "text": "Duodenal aspirate with fluid microscopy"}, {"letter": "E", "text": "Stool culture on selective media"}], "answer": "A", "explanation": "Stool antigen testing for Giardia. The preferred test; microscopy for cysts or trophozoites is confirmatory but less sensitive. The tell is a normal white count with greasy non-bloody stool after untreated stream water.", "objective": "Guide: Giardiasis — Diagnostics.", "section": "Greasy stools after a camping trip"}, {"id": "41A", "group": 41, "stem": "Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "Paromomycin for seven days"}, {"letter": "B", "text": "Supportive care with no antimicrobial"}, {"letter": "C", "text": "Azithromycin for three days"}, {"letter": "D", "text": "A single dose of tinidazole"}, {"letter": "E", "text": "Nitazoxanide for three days"}], "answer": "D", "explanation": "A single dose of tinidazole. First line over age three, with metronidazole as an alternative; nitazoxanide is used at ages one to three. Always treat a symptomatic patient. Prevention is filtering or briskly boiling water for at least five minutes — chlorine and iodine are less effective because the cysts resist chlorine.", "objective": "Guide: Giardiasis — Management; Special Considerations \"Two forms.\"", "section": "Greasy stools after a camping trip"}, {"id": "42", "group": 42, "stem": "A 10-year-old boy with a history of asthma presents with his father complaining of pain and difficulty with swallowing for several months; his father notes a few occasions where he vomited during meals. Endoscopy reveals stacked corrugated rings in the esophagus accompanied by white papules.\n\nWhich diagnosis should be suspected?", "options": [{"letter": "A", "text": "Eosinophilic esophagitis"}, {"letter": "B", "text": "Herpes simplex esophagitis"}, {"letter": "C", "text": "Candida esophagitis"}, {"letter": "D", "text": "Reflux esophagitis"}, {"letter": "E", "text": "Achalasia"}], "answer": "A", "explanation": "Eosinophilic esophagitis. Atopy plus dysphagia and food impaction in a young male, with concentric rings (\"feline esophagus\") and white exudates on endoscopy.", "objective": "Guide: Eosinophilic Esophagitis — Common Patient, History, Diagnostics.", "section": "A child who cannot swallow comfortably"}, {"id": "42A", "group": 42, "stem": "Which of the following findings on biopsy would confirm it?", "options": [{"letter": "A", "text": "Intestinal metaplasia with goblet cells"}, {"letter": "B", "text": "Budding yeast forms with pseudohyphae"}, {"letter": "C", "text": "A thickened subepithelial collagen band"}, {"letter": "D", "text": "More than 15 eosinophils per high-power field"}, {"letter": "E", "text": "Intranuclear inclusions at the edge of an ulcer"}], "answer": "D", "explanation": "More than 15 eosinophils per high-power field. At least six biopsies from the proximal and distal esophagus. Treatment is an elimination diet with a PPI, plus swallowed topical fluticasone or budesonide — inhaled formulation, swallowed rather than inhaled.", "objective": "Guide: Eosinophilic Esophagitis — Diagnostics, Confirmatory; Special Considerations \"Steroid route trap.\"", "section": "A child who cannot swallow comfortably"}, {"id": "43", "group": 43, "stem": "A 38-year-old man with ulcerative pancolitis for nine years, currently in remission on mesalamine, is found to have abnormal liver enzymes on routine labs. He has noticed fatigue and generalized itching for several months and has lost 4 kg. He drinks rarely and takes no other medications. His examination shows scattered excoriations, mild scleral icterus, and a palpable liver edge with mild splenomegaly.\n\n| Test | Result |\n|---|---|\n| Alkaline phosphatase | 640 U/L |\n| GGT | 480 U/L |\n| AST / ALT | 88 / 96 U/L |\n| Total bilirubin | 2.2 mg/dL |\n| Anti-mitochondrial antibody | Negative |\n| p-ANCA | Positive |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "IgG4-related cholangiopathy"}, {"letter": "B", "text": "Autoimmune hepatitis"}, {"letter": "C", "text": "Mesalamine-induced liver injury"}, {"letter": "D", "text": "Primary sclerosing cholangitis"}, {"letter": "E", "text": "Primary biliary cholangitis"}], "answer": "D", "explanation": "Primary sclerosing cholangitis. A cholestatic pattern — alkaline phosphatase and GGT far out of proportion to transaminases that stay under 300 — in a man with ulcerative pancolitis, with p-ANCA positive and AMA negative. AMA positivity would point to PBC instead. Up to 90% of PSC patients have UC.", "objective": "Guide: Primary Sclerosing Cholangitis — Common Patient, Diagnostics; Special Considerations \"Serology split,\" \"IBD link.\"", "section": "Cholestatic enzymes in inflammatory bowel disease"}, {"id": "43A", "group": 43, "stem": "Which of the following is the best test to establish the diagnosis?", "options": [{"letter": "A", "text": "Liver biopsy with reticulin staining"}, {"letter": "B", "text": "Serum IgG4 measured on two occasions"}, {"letter": "C", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "D", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "E", "text": "Right upper quadrant ultrasound with Doppler"}], "answer": "D", "explanation": "Magnetic resonance cholangiopancreatography. A cholangiogram is the gold standard, and MRCP is the best non-invasive version, showing beaded bile ducts; ERCP is used when intervention is needed. Biopsy — showing onion-skin periductal fibrosis — is reserved for a non-diagnostic cholangiogram.", "objective": "Guide: Primary Sclerosing Cholangitis — Diagnostics, Gold Standard and Confirmatory.", "section": "Cholestatic enzymes in inflammatory bowel disease"}, {"id": "43B", "group": 43, "stem": "He is at increased risk for which of the following malignancies?", "options": [{"letter": "A", "text": "Pancreatic adenocarcinoma"}, {"letter": "B", "text": "Hepatocellular carcinoma"}, {"letter": "C", "text": "Cholangiocarcinoma"}, {"letter": "D", "text": "Gallbladder adenocarcinoma"}, {"letter": "E", "text": "Gastric adenocarcinoma"}], "answer": "C", "explanation": "Cholangiocarcinoma. PSC involves medium and large ducts, intrahepatic and extrahepatic, and carries a cholangiocarcinoma risk of roughly 10–15% over a lifetime. He also needs annual colonoscopy from diagnosis rather than waiting eight years, because UC with PSC raises colorectal cancer risk.", "objective": "Guide: PSC — Special Considerations \"Duct territory + cancer\"; Colon Cancer — Surveillance.", "section": "Cholestatic enzymes in inflammatory bowel disease"}, {"id": "44", "group": 44, "stem": "A 62-year-old man with primary sclerosing cholangitis diagnosed twelve years ago is seen for four weeks of deepening jaundice, intense itching, and a dull ache under the right ribs, with 7 kg of weight loss. He has had no fever or rigors. His examination shows jaundice, excoriations, and hepatomegaly with a palpable non-tender gallbladder.\n\n| Test | Result |\n|---|---|\n| Total bilirubin | 11.8 mg/dL, direct 9.4 mg/dL |\n| Alkaline phosphatase | 780 U/L |\n| AST / ALT | 84 / 92 U/L |\n| CA 19-9 | 410 U/mL |\n| MRCP | A dominant stricture at the hepatic duct bifurcation with upstream ductal dilation and no discrete mass |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "A benign dominant stricture of primary sclerosing cholangitis"}, {"letter": "B", "text": "IgG4-related cholangiopathy"}, {"letter": "C", "text": "Pancreatic head adenocarcinoma"}, {"letter": "D", "text": "Choledocholithiasis"}, {"letter": "E", "text": "Cholangiocarcinoma"}], "answer": "E", "explanation": "Cholangiocarcinoma. Painless obstructive jaundice with pruritus, weight loss, and a dominant stricture growing as a stricture rather than a mass in a patient with long-standing PSC. PSC accounts for about 30% of cholangiocarcinoma cases and carries a 10–15% lifetime risk. CA 19-9 is supportive only — not sensitive or specific.", "objective": "Guide: Cholangiocarcinoma — History, Presentation, Diagnostics; Marker.", "section": "Painless jaundice with a duct stricture"}, {"id": "44A", "group": 44, "stem": "Which of the following is the most appropriate next step to establish the diagnosis?", "options": [{"letter": "A", "text": "ERCP with brushings of the stricture"}, {"letter": "B", "text": "Serial CA 19-9 measurements over three months"}, {"letter": "C", "text": "Repeat MRCP in six weeks to look for a mass"}, {"letter": "D", "text": "Percutaneous liver biopsy of the right lobe"}, {"letter": "E", "text": "Empiric corticosteroids with reimaging"}], "answer": "A", "explanation": "ERCP with brushings of the stricture. After MRCP, tissue is obtained by ERCP brushings or biopsy, EUS with fine-needle aspiration, or image-guided biopsy, with surgery if all are non-diagnostic.", "objective": "Guide: Cholangiocarcinoma — Diagnostics, Confirmatory.", "section": "Painless jaundice with a duct stricture"}, {"id": "44B", "group": 44, "stem": "A tumor at this location is known by which name?", "options": [{"letter": "A", "text": "Periampullary adenoma"}, {"letter": "B", "text": "Mirizzi lesion"}, {"letter": "C", "text": "Klatskin tumor"}, {"letter": "D", "text": "Caroli malformation"}, {"letter": "E", "text": "Ampullary carcinoma"}], "answer": "C", "explanation": "Klatskin tumor. A tumor at the bifurcation of the proper hepatic duct, where the right and left hepatic ducts meet. Cholangiocarcinoma is classified as intrahepatic, perihilar — the most common — or distal, and the term excludes the gallbladder and the ampulla of Vater.", "objective": "Guide: Cholangiocarcinoma — Special Considerations \"Klatskin tumor,\" \"Anatomy.\"", "section": "Painless jaundice with a duct stricture"}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
