<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DI Two — GI & Liver Differential + Gap-Fill Self-Grading Exam</title>
<style>
:root {
  --bg:#f5f7fb;
  --card:#ffffff;
  --ink:#192234;
  --muted:#68758c;
  --line:#dbe2ec;
  --navy:#153b5b;
  --teal:#1b6f7a;
  --blue-soft:#eef5f8;
  --green:#e4f6e9;
  --green-b:#4e9c63;
  --red:#fde6e6;
  --red-b:#d55f5f;
  --gold:#fff5d8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}
.app{max-width:1050px;margin:0 auto;padding:18px 14px 92px}
header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:12px}
h1{font-size:clamp(21px,3.2vw,31px);margin:0 0 4px;line-height:1.15}
.sub{font-size:14px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.progress-wrap{height:8px;background:#e5eaf1;border-radius:999px;overflow:hidden;margin:10px 0 16px}
.progress{height:100%;width:1%;background:linear-gradient(90deg,var(--navy),var(--teal));transition:.18s}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 8px 24px rgba(31,47,70,.07);padding:clamp(16px,2.7vw,25px)
}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.qnum{font-weight:800;color:var(--navy);font-size:15px}
.mini{font-size:12px;color:var(--muted)}
.stem{font-size:clamp(16px,2vw,18.5px);font-weight:650;line-height:1.42;margin:0 0 13px}
.choices{display:grid;gap:8px}
.choice{
  width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;
  border:1px solid var(--line);border-radius:11px;background:white;
  padding:10px 12px;font-size:14.8px;line-height:1.34;cursor:pointer;transition:.14s
}
.choice:hover{background:#fbfdff;border-color:#9eb4c4}
.choice .letter{min-width:22px;font-weight:800;color:var(--navy)}
.choice.correct{background:var(--green);border-color:var(--green-b)}
.choice.incorrect{background:var(--red);border-color:var(--red-b)}
.choice.locked{cursor:default}
.feedback{
  display:none;margin-top:13px;border-radius:12px;padding:12px 13px;
  border:1px solid var(--line);font-size:13.5px;line-height:1.45
}
.feedback.show{display:block}
.feedback.good{background:var(--green);border-color:var(--green-b)}
.feedback.bad{background:var(--red);border-color:var(--red-b)}
.feedback .obj{margin-top:7px;font-size:12.8px;color:#35445a}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{
  border:0;border-radius:10px;padding:10px 14px;font-weight:750;font-size:14px;
  cursor:pointer
}
.primary{background:var(--navy);color:white}
.secondary{background:#e9eef4;color:#203047}
button:disabled{opacity:.42;cursor:not-allowed}
.review-banner{
  display:none;background:var(--gold);border:1px solid #dfc873;border-radius:10px;
  padding:9px 11px;margin-bottom:12px;font-size:13px
}
.review-banner.show{display:block}
.results{display:none;margin-top:18px}
.results.show{display:block}
.scorebox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.metric span{font-size:12px;color:var(--muted)}
.metric strong{display:block;font-size:24px;margin-top:2px}
.topic-title{font-weight:800;margin:3px 0 9px}
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.topic{
  background:white;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:13px
}
.topic b{display:block;margin-bottom:4px}
.topic .rank{font-size:11px;color:var(--muted);margin-top:4px}
.fixed{
  position:fixed;left:0;right:0;bottom:0;background:rgba(245,247,251,.96);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20;padding:9px 12px
}
.fixed-inner{max-width:1050px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.import-report{margin:12px 0 0;text-align:center;color:var(--muted);font-size:12px}
@media (max-width:680px){
  header{display:block}
  .status{text-align:left;margin-top:5px}
  .scorebox,.topic-grid{grid-template-columns:1fr}
  .choice{font-size:14.3px;padding:10px}
}
@media (max-height:720px) and (min-width:720px){
  .app{padding-top:9px}
  .card{padding:13px 17px}
  .stem{font-size:15px;margin-bottom:9px}
  .choices{gap:6px}
  .choice{font-size:13px;padding:7px 9px}
  .feedback{font-size:12px;padding:8px 10px}
  .nav{margin-top:9px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>Diagnostic Interpretation II — GI & Liver</h1>
    <div class="sub">Differential Diagnosis + Gap-Fill Practice Exam</div>
  </div>
  <div class="status" id="status"></div>
</header>

<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="reviewBanner" class="review-banner">Review Missed Questions mode</div>

<section class="card" id="examCard">
  <div class="qtop">
    <div id="qnum" class="qnum"></div>
    <div id="answeredCount" class="mini"></div>
  </div>
  <div id="stem" class="stem"></div>
  <div id="choices" class="choices"></div>
  <div id="feedback" class="feedback"></div>
  <div class="nav">
    <button class="secondary" id="prevBtn" onclick="goPrev()">Previous</button>
    <button class="primary" id="nextBtn" onclick="goNext()">Next</button>
  </div>
</section>

<section id="results" class="results">
  <div class="scorebox">
    <div class="metric"><span>Percent</span><strong id="pct">0%</strong></div>
    <div class="metric"><span>Correct / Graded</span><strong id="raw">0 / 0</strong></div>
    <div class="metric"><span>Answered / 100</span><strong id="answeredRaw">0 / 100</strong></div>
  </div>
  <div class="topic-title">Performance by Topic</div>
  <div id="topicGrid" class="topic-grid"></div>
</section>

<div class="import-report">Questions found: 100 • Imported: 100 • Unparsed: 0</div>
</div>

<div class="fixed">
  <div class="fixed-inner">
    <button class="secondary" onclick="gradeCompleted()">Submit (Grade from current place)</button>
    <button class="primary" onclick="finishExam()">Submit (at end of test)</button>
    <button class="secondary" id="reviewBtn" onclick="toggleReview()" disabled>Review Missed Questions</button>
    <button class="secondary" id="copyBtn" onclick="copyMissed()" disabled>COPY missed questions</button>
  </div>
</div>

<script>
const QUESTIONS = [{"n": 1, "stem": "A patient with suspected perforated viscus is being considered for EGD. Which feature is a major reason not to proceed?", "choices": {"A": "Known or suspected perforation", "B": "Stable chronic GERD", "C": "Barrett surveillance", "D": "Uncomplicated dysphagia", "E": "Stable iron deficiency anemia"}, "answer": "A", "explanation": "Known or suspected perforation and medical instability are major contraindications to EGD; recent head or neck surgery is listed as a relative contraindication.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish EGD indications from contraindications.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish EGD indications from contraindications."}, {"n": 2, "stem": "Paracentesis in a febrile cirrhotic patient shows 480 PMNs/mm3. Ascitic fluid culture grows E. coli. Which diagnosis is established?", "choices": {"A": "Spontaneous bacterial peritonitis", "B": "Uncomplicated portal hypertension", "C": "Cardiac ascites", "D": "Tuberculous peritonitis", "E": "Pancreatic ascites"}, "answer": "A", "explanation": "An ascitic PMN count of at least 250/mm3 or a positive culture meets the guide's criterion for SBP; E. coli and Klebsiella are common organisms.", "objective_full": "Other Liver Diagnostics — distinguish SBP from noninfectious ascites.", "topic": "Other Liver Diagnostics", "objective": "distinguish SBP from noninfectious ascites."}, {"n": 3, "stem": "A patient with known alcohol use disorder presents with jaundice. AST is 1,180 U/L and ALT is 1,460 U/L. Which conclusion is most appropriate?", "choices": {"A": "The AST level alone proves skeletal muscle injury", "B": "The values are typical of uncomplicated alcoholic hepatitis", "C": "Look for an acute viral or toxic cause in addition to alcohol use", "D": "The enzyme pattern is typical of primary biliary cholangitis with a cholestatic profile", "E": "The magnitude of elevation confirms chronic cirrhosis"}, "answer": "C", "explanation": "Alcohol-related hepatitis rarely produces AST above about 400 U/L. Transaminases in the thousands point toward acute viral or toxic hepatocellular necrosis.", "objective_full": "Interpretation of Liver Tests — use magnitude and AST/ALT ratio to separate alcohol from viral/toxic injury.", "topic": "Interpretation of Liver Tests", "objective": "use magnitude and AST/ALT ratio to separate alcohol from viral/toxic injury."}, {"n": 4, "stem": "A healthy medical student has HBsAg negative, total anti-HBc negative, and anti-HBs positive. Which interpretation is correct?", "choices": {"A": "Acute hepatitis B", "B": "Immunity from hepatitis B vaccination", "C": "HBV window period", "D": "Chronic hepatitis B", "E": "Resolved natural hepatitis B infection"}, "answer": "B", "explanation": "Vaccination produces anti-HBs without anti-HBc. Core antibody requires natural infection.", "objective_full": "Viral Hepatitis Serologies — distinguish vaccine immunity from natural immunity.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish vaccine immunity from natural immunity."}, {"n": 5, "stem": "A patient is tested late in an acute hepatitis B illness. HBsAg has disappeared and anti-HBs has not yet appeared, but IgM anti-HBc remains positive. What phase is this?", "choices": {"A": "Resolved natural infection", "B": "Chronic hepatitis B", "C": "Vaccination immunity", "D": "HBV window period", "E": "HBeAg seroconversion"}, "answer": "D", "explanation": "During the HBV window period, HBsAg has disappeared before anti-HBs appears; IgM anti-HBc remains detectable and preserves the diagnosis.", "objective_full": "Viral Hepatitis Serologies — distinguish the HBV window period from resolved and vaccinated states.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish the HBV window period from resolved and vaccinated states."}, {"n": 6, "stem": "A patient with a pancreatic head mass has an elevated CA 19-9 level. Which use of CA 19-9 is supported by the guide?", "choices": {"A": "Distinguishing direct from indirect bilirubin", "B": "Replacing imaging in painless jaundice", "C": "Screening asymptomatic adults for pancreatic cancer", "D": "Confirming acute viral hepatitis", "E": "Following prognosis or response to therapy"}, "answer": "E", "explanation": "CA 19-9 is not recommended as a screening test for pancreatic cancer; it may be used for prognostic information and monitoring treatment response or recurrence.", "objective_full": "Interpretation of Liver Tests — distinguish tumor-marker monitoring from screening.", "topic": "Interpretation of Liver Tests", "objective": "distinguish tumor-marker monitoring from screening."}, {"n": 7, "stem": "An elderly institutionalized man with chronic constipation has massive distention. Radiograph shows a large coffee-bean loop arising from the pelvis. Which diagnosis is most likely?", "choices": {"A": "Small-bowel adhesions", "B": "Acute pancreatitis", "C": "Cecal ileus", "D": "Sigmoid volvulus", "E": "Intussusception"}, "answer": "D", "explanation": "The coffee bean sign is classic for sigmoid volvulus, particularly in older institutionalized chronically constipated patients, and represents a closed-loop obstruction requiring prompt detorsion.", "objective_full": "Abdominal Imaging — recognize the coffee bean sign.", "topic": "Abdominal Imaging", "objective": "recognize the coffee bean sign."}, {"n": 8, "stem": "A patient has characteristic acute pancreatitis pain and serum lipase four times the upper limit of normal. Which statement is most accurate?", "choices": {"A": "Daily lipase levels are required to follow severity", "B": "A normal CT would exclude pancreatitis despite the enzyme level", "C": "Lipase is included in all prognostic scores because magnitude predicts outcome", "D": "The lipase supports the diagnosis but does not grade severity", "E": "The value confirms chronic pancreatitis rather than acute disease"}, "answer": "D", "explanation": "Lipase at least three times the upper limit of normal is one of the diagnostic criteria for acute pancreatitis, but the degree of elevation does not correlate with severity.", "objective_full": "Lab Evaluation of GI Disease — distinguish diagnostic enzyme elevation from severity assessment.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish diagnostic enzyme elevation from severity assessment."}, {"n": 9, "stem": "A 67-year-old develops intermittent crampy pain and obstruction. CT shows a target/sausage-shaped bowel-within-bowel lesion. In an adult, what underlying concern should be prioritized?", "choices": {"A": "A pathologic lead point such as tumor", "B": "Functional biliary dyskinesia", "C": "Uncomplicated pancreatitis", "D": "Simple gallstone disease", "E": "Postoperative ileus without a discrete obstructing transition point"}, "answer": "A", "explanation": "Adult intussusception usually has a pathologic lead point and should be considered tumor-related until proven otherwise; CT shows the target or sausage sign.", "objective_full": "Abdominal Imaging — distinguish adult intussusception from other obstructive patterns.", "topic": "Abdominal Imaging", "objective": "distinguish adult intussusception from other obstructive patterns."}, {"n": 10, "stem": "An infant acquires hepatitis B perinatally. Compared with an adult who acquires HBV, which outcome is much more likely?", "choices": {"A": "Development of hepatitis D without HBV", "B": "Permanent immunity from vaccination alone", "C": "Progression to chronic hepatitis B", "D": "Rapid development of anti-HBs with no chronic infection", "E": "Spontaneous clearance in nearly all cases"}, "answer": "C", "explanation": "The handout emphasizes the strong age effect: about 90% of infected infants develop chronic HBV, compared with only about 5–10% of infected adults.", "objective_full": "Viral Hepatitis Serologies — apply age-dependent risk of chronic HBV.", "topic": "Viral Hepatitis Serologies", "objective": "apply age-dependent risk of chronic HBV."}, {"n": 11, "stem": "A 39-year-old man with ulcerative colitis develops progressive fatigue and a persistent cholestatic liver enzyme pattern. Which diagnosis is most strongly suggested?", "choices": {"A": "Primary sclerosing cholangitis", "B": "Hereditary hemochromatosis", "C": "Autoimmune hepatitis", "D": "Primary biliary cholangitis", "E": "Gilbert syndrome"}, "answer": "A", "explanation": "PSC is a chronic cholestatic disease strongly associated with inflammatory bowel disease, especially ulcerative colitis, and carries cholangiocarcinoma risk.", "objective_full": "Interpretation of Liver Tests — distinguish PSC from PBC and hepatocellular disorders.", "topic": "Interpretation of Liver Tests", "objective": "distinguish PSC from PBC and hepatocellular disorders."}, {"n": 12, "stem": "A man with obesity, diabetes, and fatty liver drinks 18 standard alcoholic drinks each week. Which term from the guide best describes the overlap of metabolic steatotic liver disease and alcohol intake above the male threshold?", "choices": {"A": "MetALD", "B": "Isolated MASLD", "C": "Gilbert syndrome", "D": "Acute liver failure", "E": "Primary sclerosing cholangitis"}, "answer": "A", "explanation": "MetALD refers to MASLD plus alcohol intake above the specified threshold; the guide uses more than 15 standard drinks per week for men as significant consumption.", "objective_full": "Interpretation of Liver Tests — distinguish MASLD from alcohol-related overlap disease.", "topic": "Interpretation of Liver Tests", "objective": "distinguish MASLD from alcohol-related overlap disease."}, {"n": 13, "stem": "HBsAg has remained positive for 8 months and anti-HBs is absent. Which diagnosis is established?", "choices": {"A": "Resolved hepatitis B", "B": "HBV vaccination immunity", "C": "Acute hepatitis A", "D": "Resolved hepatitis C", "E": "Chronic hepatitis B"}, "answer": "E", "explanation": "Persistence of HBsAg for more than 6 months defines chronic hepatitis B; anti-HBs remains absent while infection persists.", "objective_full": "Viral Hepatitis Serologies — distinguish chronic HBV from acute/resolved states.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish chronic HBV from acute/resolved states."}, {"n": 14, "stem": "A patient has chronic postprandial RUQ pain but no stones. HIDA with CCK shows a gallbladder ejection fraction of 28%. Which interpretation best fits?", "choices": {"A": "Acute appendicitis", "B": "Mechanical SBO", "C": "Chronic cholecystitis or biliary dyskinesia", "D": "Renal colic", "E": "Normal gallbladder filling and contractile function"}, "answer": "C", "explanation": "An ejection fraction below 35% after CCK supports chronic cholecystitis/biliary dyskinesia in the guide.", "objective_full": "Abdominal Imaging — distinguish HIDA findings of acute cholecystitis from low ejection fraction states.", "topic": "Abdominal Imaging", "objective": "distinguish HIDA findings of acute cholecystitis from low ejection fraction states."}, {"n": 15, "stem": "Several days after cholecystectomy, a patient has abdominal pain and suspected bile leakage. Which HIDA finding would support this complication?", "choices": {"A": "Gallbladder ejection fraction above 35%", "B": "Posterior acoustic shadowing", "C": "Tracer outside the biliary tree", "D": "Haustra between the liver and diaphragm", "E": "A 13-mm tablet lodged in the esophagus"}, "answer": "C", "explanation": "HIDA can evaluate postoperative bile leak; tracer seen outside the biliary tree supports leakage.", "objective_full": "Abdominal Imaging — distinguish HIDA indications and abnormal findings.", "topic": "Abdominal Imaging", "objective": "distinguish HIDA indications and abnormal findings."}, {"n": 16, "stem": "Five days after colonoscopic polypectomy, a patient develops hematochezia. Which complication pattern best matches the guide?", "choices": {"A": "Acute HIDA tracer reaction", "B": "Delayed post-polypectomy bleeding", "C": "Esophageal perforation from manometry", "D": "Gastrografin-induced diarrhea", "E": "Expected barium-related constipation"}, "answer": "B", "explanation": "Colonoscopy bleeding is often related to polypectomy, and delayed bleeding is described as peaking about 5–7 days after the procedure.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — recognize colonoscopy complications and timing.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "recognize colonoscopy complications and timing."}, {"n": 17, "stem": "A patient has a high-grade small bowel obstruction with repeated vomiting. CT is needed to identify the transition point and ischemia. Which contrast strategy should be avoided?", "choices": {"A": "Plain film as the initial obstruction study", "B": "IV contrast when renal function allows", "C": "Ultrasound in pregnancy", "D": "Oral contrast", "E": "No contrast for a renal stone protocol"}, "answer": "D", "explanation": "The guide recommends avoiding oral contrast in high-grade SBO because it can worsen vomiting and aspiration risk; CT with IV contrast is used to assess cause, site, and ischemia.", "objective_full": "Abdominal Imaging — distinguish CT contrast strategies by suspected diagnosis.", "topic": "Abdominal Imaging", "objective": "distinguish CT contrast strategies by suspected diagnosis."}, {"n": 18, "stem": "Same-day serum albumin is 3.4 g/dL and ascitic albumin is 2.0 g/dL. What is the best interpretation?", "choices": {"A": "The result specifically proves peritoneal malignancy", "B": "The gradient must be repeated daily", "C": "The SAAG excludes portal hypertension", "D": "The result diagnoses SBP", "E": "The SAAG supports portal hypertension"}, "answer": "E", "explanation": "SAAG equals serum albumin minus ascitic albumin. A value of 1.1 g/dL or higher supports portal hypertension; the guide states the SAAG is measured once rather than serially.", "objective_full": "Other Liver Diagnostics — calculate and interpret SAAG.", "topic": "Other Liver Diagnostics", "objective": "calculate and interpret SAAG."}, {"n": 19, "stem": "A patient has RUQ pain and a positive Murphy sign. Ultrasound is equivocal despite continued high suspicion for acute cholecystitis. Which study should be obtained next?", "choices": {"A": "HIDA scan", "B": "Barium enema", "C": "Noncontrast renal stone CT", "D": "Modified barium swallow", "E": "Flexible sigmoidoscopy"}, "answer": "A", "explanation": "RUQ ultrasound is first-line for suspected biliary disease. HIDA is the confirmatory second-line test when ultrasound is equivocal but suspicion for acute cholecystitis remains high.", "objective_full": "Abdominal Imaging — distinguish RUQ ultrasound from HIDA scanning.", "topic": "Abdominal Imaging", "objective": "distinguish RUQ ultrasound from HIDA scanning."}, {"n": 20, "stem": "A 46-year-old man has fatigue, bronze skin, second and third MCP arthropathy, and a family history of liver disease. Ferritin is elevated and transferrin saturation is 58%. What is the next confirmatory test listed in the guide?", "choices": {"A": "Antimitochondrial antibody", "B": "Anti-HCV RNA screening", "C": "Serum alpha-1 antitrypsin level", "D": "HFE genotype testing", "E": "Serum ceruloplasmin"}, "answer": "D", "explanation": "Hereditary hemochromatosis is screened with iron indices; elevated ferritin plus transferrin saturation above 45% is followed by HFE genotype testing.", "objective_full": "Interpretation of Liver Tests — distinguish hemochromatosis from Wilson disease, PBC, and A1AT deficiency.", "topic": "Interpretation of Liver Tests", "objective": "distinguish hemochromatosis from Wilson disease, PBC, and A1AT deficiency."}, {"n": 21, "stem": "A patient with years of alcohol-associated pancreatic disease has epigastric pain and malabsorption. Plain abdominal film shows amorphous 'popcorn-like' calcifications in the epigastrium. What do these calcifications suggest?", "choices": {"A": "Radiopaque gallstones", "B": "Uric acid nephrolithiasis", "C": "Pelvic phleboliths", "D": "Chronic pancreatitis", "E": "Acute appendicitis"}, "answer": "D", "explanation": "Pancreatic calcifications are classically amorphous or popcorn-like and support chronic pancreatitis; only a minority of gallstones are visible on KUB.", "objective_full": "Abdominal Imaging — distinguish abdominal calcification patterns.", "topic": "Abdominal Imaging", "objective": "distinguish abdominal calcification patterns."}, {"n": 22, "stem": "A hiker has persistent diarrhea after drinking untreated stream water. A rapid stool antigen test is available. Which organism is the most likely target?", "choices": {"A": "Shigella", "B": "Giardia", "C": "C. difficile", "D": "Salmonella", "E": "Campylobacter"}, "answer": "B", "explanation": "Giardia antigen testing is preferred over O&P when available for compatible travel, hiking, daycare, or waterborne exposure because it is faster and more sensitive.", "objective_full": "Lab Evaluation of GI Disease — distinguish parasite antigen testing from bacterial culture.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish parasite antigen testing from bacterial culture."}, {"n": 23, "stem": "A healthy adult has one day of watery diarrhea after a sick contact. There is no fever, blood, severe pain, dehydration, or immunosuppression. What is the most appropriate diagnostic approach?", "choices": {"A": "C. difficile toxin testing on formed stool", "B": "Immediate colonoscopy with biopsy", "C": "No stool testing; provide supportive care", "D": "O&P on three separate days", "E": "Routine stool culture plus special cultures"}, "answer": "C", "explanation": "Most uncomplicated acute diarrhea without red flags is self-limited and requires no diagnostic testing; workup is reserved for red-flag presentations.", "objective_full": "Lab Evaluation of GI Disease — distinguish uncomplicated acute diarrhea from cases needing stool testing.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish uncomplicated acute diarrhea from cases needing stool testing."}, {"n": 24, "stem": "A radiologist wants maximal visualization of subtle mucosal lesions such as small ulcerations and polyps. Which contrast principle is most appropriate?", "choices": {"A": "Gadolinium-only imaging", "B": "Technetium tracer only", "C": "No contrast with fluoroscopy", "D": "Double contrast", "E": "Single contrast only"}, "answer": "D", "explanation": "Single contrast is better for large obstructing lesions and motility; double contrast adds gas and improves mucosal detail for subtle lesions.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish single- from double-contrast studies.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish single- from double-contrast studies."}, {"n": 25, "stem": "A 52-year-old reports progressive dysphagia to both solids and liquids with regurgitation. Which diagnostic category should be favored before selecting the next test?", "choices": {"A": "Gastric mucosal disease", "B": "Oropharyngeal transfer disorder", "C": "Esophageal motility disorder", "D": "Fixed mechanical obstruction", "E": "Colonic obstruction"}, "answer": "C", "explanation": "Solids only suggests a mechanical obstruction; dysphagia to both solids and liquids points toward an esophageal motility disorder such as achalasia or diffuse esophageal spasm.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish mechanical from motility dysphagia.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish mechanical from motility dysphagia."}, {"n": 26, "stem": "A cirrhotic patient is admitted with new confusion and worsening ascites. Which procedure should be performed even if the ascites is not newly developed?", "choices": {"A": "Routine barium enema", "B": "Hydrogen breath testing", "C": "Diagnostic paracentesis", "D": "Upper GI series", "E": "Screening colonoscopy"}, "answer": "C", "explanation": "Every patient with new-onset ascites should undergo diagnostic paracentesis, and cirrhotic patients should also be tapped at each hospital admission for decompensation.", "objective_full": "Other Liver Diagnostics — know when to perform diagnostic paracentesis.", "topic": "Other Liver Diagnostics", "objective": "know when to perform diagnostic paracentesis."}, {"n": 27, "stem": "A pregnant traveler returns from an endemic region after contaminated-water exposure with acute jaundice. Which hepatitis virus is especially associated with severe disease in pregnancy and usually has no chronic form?", "choices": {"A": "Chronic hepatitis B", "B": "Hepatitis E", "C": "Hepatitis A chronic infection", "D": "Hepatitis C", "E": "Hepatitis D alone"}, "answer": "B", "explanation": "Hepatitis E is fecal-oral, resembles hepatitis A, and is usually self-limited, but pregnant patients are particularly susceptible to severe or fatal disease.", "objective_full": "Viral Hepatitis Serologies — distinguish hepatitis E from the other viral hepatitides.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish hepatitis E from the other viral hepatitides."}, {"n": 28, "stem": "A patient with intermittent solid-food dysphagia is suspected of having a subtle distal ring. Which study may be more sensitive than endoscopy for demonstrating the narrowing?", "choices": {"A": "Upper GI series with SBFT", "B": "Barium esophagram with a 13-mm tablet", "C": "Flexible sigmoidoscopy", "D": "Modified barium swallow with speech therapy", "E": "HIDA scan with CCK"}, "answer": "B", "explanation": "Barium esophagram may better demonstrate rings and strictures because the distal esophagus can be fully distended; a 13-mm tablet can show a functionally significant narrowing.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish barium esophagram from EGD for rings/strictures.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish barium esophagram from EGD for rings/strictures."}, {"n": 29, "stem": "A 19-year-old has unexplained hepatitis, tremor, mood changes, and Kayser-Fleischer rings. Ceruloplasmin is low. Which test is the criterion standard for confirming the underlying disorder?", "choices": {"A": "RUQ ultrasound showing diffuse hepatic steatosis without biliary obstruction", "B": "Serum alpha-1 antitrypsin level", "C": "Antimitochondrial antibody titer", "D": "Liver biopsy with hepatic copper measurement", "E": "HFE genotype testing"}, "answer": "D", "explanation": "In Wilson disease, hepatic copper concentration on liver biopsy is the criterion standard; a normal result effectively excludes the diagnosis.", "objective_full": "Interpretation of Liver Tests — distinguish Wilson disease from other inherited/metabolic liver diseases.", "topic": "Interpretation of Liver Tests", "objective": "distinguish Wilson disease from other inherited/metabolic liver diseases."}, {"n": 30, "stem": "An upper GI series shows an ulcer crater in the stomach. Why is EGD still needed?", "choices": {"A": "To diagnose lactose malabsorption", "B": "To visualize only the terminal ileum", "C": "To biopsy the gastric ulcer and exclude malignancy", "D": "To calculate a SAAG", "E": "To confirm that barium reached and adequately distended the stomach during the study"}, "answer": "C", "explanation": "An ulcer seen on UGI series cannot be biopsied. Gastric ulcers generally require EGD with biopsy to exclude malignancy and can also be tested for H. pylori.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish diagnostic imaging from tissue diagnosis.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish diagnostic imaging from tissue diagnosis."}, {"n": 31, "stem": "A patient with cirrhosis asks how the Child-Turcotte-Pugh score differs from MELD. Which statement is most accurate?", "choices": {"A": "Child-Pugh is identical to FIB-4", "B": "Child-Pugh is used only to diagnose acute hepatitis A", "C": "Child-Pugh is a stool test for occult bleeding", "D": "Child-Pugh directly measures liver stiffness by shear-wave velocity on ultrasound elastography only", "E": "Child-Pugh uses both clinical and serum variables to estimate severity and survival"}, "answer": "E", "explanation": "Child-Pugh is an older cirrhosis severity/prognosis score using clinical and serum variables; Class C has the worst approximate one-year survival.", "objective_full": "Other Liver Diagnostics — distinguish Child-Pugh from MELD and fibrosis tests.", "topic": "Other Liver Diagnostics", "objective": "distinguish Child-Pugh from MELD and fibrosis tests."}, {"n": 32, "stem": "A patient is preparing for a urea breath test for H. pylori. Which medication instructions best reduce false-negative results?", "choices": {"A": "Hold antibiotics for two days but continue bismuth", "B": "Hold PPI 2 weeks and antibiotics/bismuth 4 weeks", "C": "Stop all medications for six months", "D": "Continue all medications without change", "E": "Hold PPI for only 24 hours and continue antibiotics"}, "answer": "B", "explanation": "PPIs should be held for 2 weeks and antibiotics/bismuth for 4 weeks before stool antigen or urea breath testing because these agents can suppress H. pylori and cause false negatives.", "objective_full": "Lab Evaluation of GI Disease — apply H. pylori test preparation.", "topic": "Lab Evaluation of GI Disease", "objective": "apply H. pylori test preparation."}, {"n": 33, "stem": "An asymptomatic adult presents for routine hepatitis C screening. Which test is the usual initial screen before confirmatory testing for active infection?", "choices": {"A": "HBsAg", "B": "HCV-specific IgM", "C": "HCV RNA as the routine first test for everyone", "D": "Anti-HCV antibody", "E": "IgM anti-HAV"}, "answer": "D", "explanation": "The handout recommends anti-HCV antibody as the usual initial screening test because of cost and ease; a positive result is followed by HCV RNA to determine active infection.", "objective_full": "Viral Hepatitis Serologies — distinguish HCV screening from confirmatory testing.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish HCV screening from confirmatory testing."}, {"n": 34, "stem": "A 41-year-old woman with obesity, hypertension, hypertriglyceridemia, and type 2 diabetes is found to have AST 72 U/L, ALT 104 U/L, and normal alkaline phosphatase. She drinks one alcoholic beverage weekly and has no symptoms. Which interpretation best fits the pattern?", "choices": {"A": "Primary biliary cholangitis with a cholestatic pattern", "B": "Extrahepatic biliary obstruction with direct hyperbilirubinemia", "C": "MASLD with a hepatocellular pattern", "D": "Alcohol-related liver disease with a cholestatic pattern", "E": "Gilbert syndrome with isolated indirect hyperbilirubinemia"}, "answer": "C", "explanation": "MASLD is the most common cause of asymptomatic mild aminotransferase elevation and typically has ALT greater than AST, giving an AST/ALT ratio below 1.", "objective_full": "Interpretation of Liver Tests — distinguish MASLD from alcohol-related and cholestatic liver disease.", "topic": "Interpretation of Liver Tests", "objective": "distinguish MASLD from alcohol-related and cholestatic liver disease."}, {"n": 35, "stem": "A 10-year-old and a pregnant adult each present with suspected appendicitis. Which initial imaging approach best minimizes radiation according to the guide?", "choices": {"A": "Ultrasound first", "B": "Noncontrast renal stone CT first", "C": "HIDA scan first", "D": "CT abdomen/pelvis with IV contrast first in both", "E": "Barium enema first"}, "answer": "A", "explanation": "Although CT A/P with IV contrast is preferred for typical nonpregnant adults, ultrasound is first-line for suspected appendicitis in children and pregnancy to minimize ionizing radiation.", "objective_full": "Abdominal Imaging — select appendicitis imaging by patient population.", "topic": "Abdominal Imaging", "objective": "select appendicitis imaging by patient population."}, {"n": 36, "stem": "A patient has jaundice with dark urine and pale stools. Which bilirubin pattern best matches these findings?", "choices": {"A": "Low bilirubin with marked alkaline phosphatase elevation", "B": "Predominantly direct (conjugated) hyperbilirubinemia", "C": "Isolated unconjugated bilirubin from hemolysis", "D": "Predominantly indirect hyperbilirubinemia from Gilbert syndrome", "E": "Normal bilirubin with isolated AST elevation"}, "answer": "B", "explanation": "Conjugated bilirubin is water-soluble, so it can enter urine and cause dark urine; impaired biliary excretion may produce pale or clay-colored stools.", "objective_full": "Interpretation of Liver Tests — distinguish direct from indirect hyperbilirubinemia.", "topic": "Interpretation of Liver Tests", "objective": "distinguish direct from indirect hyperbilirubinemia."}, {"n": 37, "stem": "Two days after surgery, a patient has distention and absent bowel sounds. Imaging shows diffuse dilation of both small and large bowel with gas to the rectum and no transition point. Which diagnosis is most likely?", "choices": {"A": "Mechanical LBO", "B": "Pneumoperitoneum", "C": "Generalized adynamic ileus", "D": "Complete mechanical SBO", "E": "Sigmoid volvulus"}, "answer": "C", "explanation": "Ileus causes diffuse small- and large-bowel dilation without a transition point, with gas continuing to the rectum and quiet bowel sounds; postoperative status and opioids are common causes.", "objective_full": "Abdominal Imaging — distinguish ileus from mechanical obstruction.", "topic": "Abdominal Imaging", "objective": "distinguish ileus from mechanical obstruction."}, {"n": 38, "stem": "A 68-year-old with new epigastric pain, weight loss, and iron deficiency anemia is being evaluated for H. pylori-associated ulcer disease. What is the best initial procedure?", "choices": {"A": "Empiric GERD therapy without testing", "B": "EGD with biopsy-based testing", "C": "H. pylori serology only", "D": "Hydrogen breath testing for lactose", "E": "Routine stool culture"}, "answer": "B", "explanation": "Patients age 60 or older or those with alarm features should undergo EGD up front to avoid missing malignancy and to allow biopsy-based H. pylori testing such as the rapid urease (CLO) test.", "objective_full": "Lab Evaluation of GI Disease — distinguish noninvasive H. pylori testing from EGD in alarm-feature patients.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish noninvasive H. pylori testing from EGD in alarm-feature patients."}, {"n": 39, "stem": "A previously healthy adult develops severe acute liver injury, INR 2.0, and new confusion over 6 days. There is no known chronic liver disease. Which diagnosis best fits?", "choices": {"A": "Isolated cholestasis", "B": "Acute liver failure", "C": "Stable chronic viral hepatitis", "D": "Compensated cirrhosis", "E": "Gilbert syndrome"}, "answer": "B", "explanation": "Acute liver failure is severe acute liver injury with INR greater than 1.5 and hepatic encephalopathy in a patient without preexisting liver disease, developing within about 26 weeks.", "objective_full": "Interpretation of Liver Tests — distinguish acute liver failure from chronic liver disease.", "topic": "Interpretation of Liver Tests", "objective": "distinguish acute liver failure from chronic liver disease."}, {"n": 40, "stem": "A health care worker had a needlestick exposure to HCV 3 weeks ago. Anti-HCV is negative. Which test can identify infection during this early window?", "choices": {"A": "HCV RNA by PCR", "B": "HCV-specific IgM antibody assay", "C": "IgM anti-HAV", "D": "Anti-HBs", "E": "Total anti-HDV"}, "answer": "A", "explanation": "HCV RNA can be detected about 2–3 weeks after infection and may become positive before anti-HCV seroconversion, which can take up to about 6 weeks.", "objective_full": "Viral Hepatitis Serologies — distinguish antibody screening from early RNA detection.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish antibody screening from early RNA detection."}, {"n": 41, "stem": "A patient's AST and ALT are each about 8 times the upper limit of normal, while alkaline phosphatase is only mildly elevated. Total bilirubin is 4.0 mg/dL. Which feature determines that the injury pattern is hepatocellular?", "choices": {"A": "The albumin concentration", "B": "Relative predominance of AST and ALT elevations", "C": "The total bilirubin concentration relative to its upper limit of normal", "D": "The patient's age", "E": "The presence of jaundice alone"}, "answer": "B", "explanation": "Hepatocellular versus cholestatic injury is determined by the relative magnitude of AST/ALT versus alkaline phosphatase. Bilirubin can rise in either pattern and does not classify it.", "objective_full": "Interpretation of Liver Tests — classify liver injury using the Big Three rather than bilirubin.", "topic": "Interpretation of Liver Tests", "objective": "classify liver injury using the Big Three rather than bilirubin."}, {"n": 42, "stem": "A traveler returns with acute nausea, jaundice, and markedly elevated aminotransferases after a likely fecal-oral exposure. Total anti-HAV is positive. Which additional result establishes acute hepatitis A rather than remote exposure or vaccination?", "choices": {"A": "Negative IgM anti-HAV", "B": "Positive anti-HCV with negative RNA", "C": "Positive total anti-HBc IgG", "D": "Positive anti-HBs", "E": "Positive IgM anti-HAV"}, "answer": "E", "explanation": "Total anti-HAV is positive after any exposure or vaccination. IgM anti-HAV is the marker that establishes acute hepatitis A.", "objective_full": "Viral Hepatitis Serologies — distinguish acute HAV from remote infection or vaccination.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish acute HAV from remote infection or vaccination."}, {"n": 43, "stem": "A patient with severe liver disease has modest transaminase elevations but worsening jaundice, low albumin, and prolonged INR. Which statement is most accurate?", "choices": {"A": "GGT is the best measure of synthetic capacity", "B": "Low AST and ALT exclude advanced liver disease", "C": "Albumin changes faster than INR in acute injury", "D": "Bilirubin should be ignored in advanced disease", "E": "Transaminase magnitude does not reliably reflect severity"}, "answer": "E", "explanation": "In cirrhosis and acute liver failure, severity is better reflected by PT/INR, albumin, and bilirubin than by the degree of aminotransferase elevation.", "objective_full": "Interpretation of Liver Tests — distinguish hepatocyte injury markers from liver-function severity markers.", "topic": "Interpretation of Liver Tests", "objective": "distinguish hepatocyte injury markers from liver-function severity markers."}, {"n": 44, "stem": "A 74-year-old three days after a stroke coughs immediately when trying to swallow liquids and has difficulty initiating a swallow. Which study best evaluates the problem?", "choices": {"A": "Modified barium swallow", "B": "Colonoscopy", "C": "EGD", "D": "Standard barium esophagram", "E": "Upper GI series"}, "answer": "A", "explanation": "Trouble initiating the swallow is oropharyngeal or transfer dysphagia. The modified barium swallow is performed with a speech-language pathologist and evaluates aspiration and safe consistencies.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish oropharyngeal from esophageal dysphagia tests.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish oropharyngeal from esophageal dysphagia tests."}, {"n": 45, "stem": "A neonate-sized outline of the abdominal cavity is visible because of a very large volume of intraperitoneal air on a supine film. Which named sign is this?", "choices": {"A": "String sign", "B": "Stack of coins sign", "C": "Football sign", "D": "Sentinel loop", "E": "Coffee bean sign"}, "answer": "C", "explanation": "The football sign is a classic appearance of large pneumoperitoneum on a supine film.", "objective_full": "Abdominal Imaging — recognize classic free-air signs.", "topic": "Abdominal Imaging", "objective": "recognize classic free-air signs."}, {"n": 46, "stem": "A patient suspects lactose intolerance. A two-week lactose elimination and rechallenge trial is inconclusive. What is the next diagnostic test?", "choices": {"A": "Liver biopsy", "B": "Hydrogen breath test", "C": "C. difficile toxin assay", "D": "Fecal occult blood test only", "E": "HCV RNA"}, "answer": "B", "explanation": "The guide uses dietary elimination/rechallenge first for suspected lactose intolerance; hydrogen breath testing is used when the diagnosis remains uncertain.", "objective_full": "Lab Evaluation of GI Disease — distinguish first-line dietary trial from confirmatory hydrogen breath testing.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish first-line dietary trial from confirmatory hydrogen breath testing."}, {"n": 47, "stem": "A frail patient wants a lower-GI screening procedure that typically uses enemas and no sedation, but is informed that any detected polyp will require a full colonoscopy. Which procedure is being discussed?", "choices": {"A": "Upper GI series", "B": "Flexible sigmoidoscopy", "C": "EGD", "D": "HIDA scan", "E": "Barium swallow"}, "answer": "B", "explanation": "Flexible sigmoidoscopy usually requires only limited bowel prep and no sedation, reaches the distal colon, and a polyp or positive FIT mandates full colonoscopy.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish flexible sigmoidoscopy from colonoscopy.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish flexible sigmoidoscopy from colonoscopy."}, {"n": 48, "stem": "A patient with bloody diarrhea has positive fecal leukocytes, but stool cultures are negative. Which noninfectious diagnosis should move higher on the differential?", "choices": {"A": "Uncomplicated viral gastroenteritis", "B": "Irritable bowel syndrome", "C": "Gilbert syndrome", "D": "Lactose intolerance", "E": "Inflammatory bowel disease"}, "answer": "E", "explanation": "Positive fecal leukocytes indicate bowel-wall inflammation. When cultures are negative, the high-yield combination points toward new-onset IBD rather than an invasive bacterial infection.", "objective_full": "Lab Evaluation of GI Disease — distinguish IBD from infectious and functional diarrhea.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish IBD from infectious and functional diarrhea."}, {"n": 49, "stem": "A child has suspected gastric outlet obstruction, and the team wants a nonsedated contrast study of the esophagus, stomach, and duodenum. Which test is best?", "choices": {"A": "Upper GI series", "B": "Modified barium swallow", "C": "HIDA scan", "D": "Flexible sigmoidoscopy", "E": "Barium enema"}, "answer": "A", "explanation": "The upper GI series follows contrast through the esophagus, stomach, and duodenum, is used mainly for gastric pathology, and is more common in pediatrics.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish UGI series from esophagram and SBFT.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish UGI series from esophagram and SBFT."}, {"n": 50, "stem": "A patient has suspected small-bowel Crohn disease with a possible terminal-ileal stricture. Which contrast study extends beyond the stomach and duodenum to evaluate the jejunum and ileum?", "choices": {"A": "Flexible sigmoidoscopy", "B": "Upper GI series with small bowel follow-through", "C": "Barium enema", "D": "Modified barium swallow", "E": "Standard barium swallow focused on the esophagus and distal luminal narrowing"}, "answer": "B", "explanation": "Small bowel follow-through is a continuation of the UGI series that tracks contrast through the jejunum and ileum and can show the string sign, proud loop, strictures, and fistulae.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish SBFT from other fluoroscopic GI studies.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish SBFT from other fluoroscopic GI studies."}, {"n": 51, "stem": "A 35-year-old nonsmoker has premature emphysema and unexplained liver disease. Which initial laboratory test best targets the suspected inherited disorder?", "choices": {"A": "Ferritin and transferrin saturation", "B": "Serum ceruloplasmin", "C": "IgM anti-HAV", "D": "Antimitochondrial antibody", "E": "Serum alpha-1 antitrypsin level"}, "answer": "E", "explanation": "The combination of early emphysema and liver disease, especially in a nonsmoker under 50, should prompt testing for alpha-1 antitrypsin deficiency with a serum A1AT level.", "objective_full": "Interpretation of Liver Tests — distinguish A1AT deficiency from Wilson disease and hemochromatosis.", "topic": "Interpretation of Liver Tests", "objective": "distinguish A1AT deficiency from Wilson disease and hemochromatosis."}, {"n": 52, "stem": "A patient scheduled for HIDA received an opioid shortly beforehand. Why can this interfere with interpretation?", "choices": {"A": "Opioids enlarge the appendix above 6 mm", "B": "Opioids create posterior acoustic shadowing within the gallbladder lumen on ultrasound", "C": "Opioids make barium water-soluble", "D": "Opioids dissolve radiopaque gallstones", "E": "Opioids can cause sphincter of Oddi spasm and mimic obstruction"}, "answer": "E", "explanation": "The guide advises avoiding opioids before HIDA because sphincter of Oddi spasm can mimic biliary obstruction.", "objective_full": "Abdominal Imaging — distinguish patient preparation for HIDA from RUQ ultrasound.", "topic": "Abdominal Imaging", "objective": "distinguish patient preparation for HIDA from RUQ ultrasound."}, {"n": 53, "stem": "A patient with obscure ongoing GI bleeding has a source suspected beyond the reach of routine EGD. Which statement from the guide best distinguishes SBFT from bleeding studies?", "choices": {"A": "SBFT is the first-line test for active arterial bleeding", "B": "SBFT replaces CT angiography for acute bleeding", "C": "SBFT localizes slow bleeding better than tagged-RBC scintigraphy", "D": "SBFT is not the preferred study for GI bleeding", "E": "SBFT is preferred over endoscopy for hemostasis"}, "answer": "D", "explanation": "The guide specifically notes that SBFT is not a GI bleeding study; CT angiography is used for acute bleeding and tagged-RBC scintigraphy can detect slower bleeding.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish small-bowel contrast imaging from bleeding localization studies.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish small-bowel contrast imaging from bleeding localization studies."}, {"n": 54, "stem": "A patient with chronic diarrhea has stool calprotectin markedly elevated, while a friend with IBS has a normal value. What is the main role of calprotectin in this context?", "choices": {"A": "Distinguishing inflammatory bowel disease from IBS", "B": "Confirming active hepatitis C infection with circulating viral RNA", "C": "Determining portal pressure", "D": "Screening for pancreatic cancer", "E": "Diagnosing lactose malabsorption"}, "answer": "A", "explanation": "Stool calprotectin is a neutrophil-derived inflammatory marker used to help distinguish IBD from IBS in chronic diarrhea.", "objective_full": "Lab Evaluation of GI Disease — distinguish inflammatory stool biomarkers from infectious and malabsorption tests.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish inflammatory stool biomarkers from infectious and malabsorption tests."}, {"n": 55, "stem": "An older adult has halitosis, regurgitation of undigested food, and recurrent aspiration pneumonia. Which diagnostic approach is favored because small-mouthed diverticula can be missed or perforated during endoscopy?", "choices": {"A": "Barium swallow", "B": "Upper GI series with SBFT", "C": "Immediate EGD with dilation", "D": "Colonoscopy", "E": "RUQ ultrasound"}, "answer": "A", "explanation": "Barium swallow is considered best for esophageal diverticula, including Zenker diverticulum, and can be safer/more sensitive than endoscopy for small-mouthed diverticula.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish barium swallow from EGD for diverticula.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish barium swallow from EGD for diverticula."}, {"n": 56, "stem": "A patient with long-standing chronic pancreatitis has weight loss and oily stools, but serum lipase is normal. Which stool test most directly assesses pancreatic exocrine function?", "choices": {"A": "C. difficile toxin assay", "B": "Fecal elastase-1", "C": "Stool culture", "D": "Fecal leukocyte smear", "E": "FOBT"}, "answer": "B", "explanation": "Lipase may be normal in advanced chronic pancreatitis. Fecal elastase-1 is a direct marker of exocrine pancreatic function; a value below 100 micrograms/g supports severe exocrine insufficiency.", "objective_full": "Lab Evaluation of GI Disease — distinguish chronic pancreatitis testing from acute pancreatitis enzymes.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish chronic pancreatitis testing from acute pancreatitis enzymes."}, {"n": 57, "stem": "A contrast study shows a rigid, non-distensible stomach whose contour does not change between images. Which finding is most likely?", "choices": {"A": "Linitis plastica from infiltrating gastric adenocarcinoma", "B": "Achalasia", "C": "Uncomplicated sliding hiatal hernia with preserved gastric distensibility", "D": "Diffuse esophageal spasm", "E": "Simple peptic stricture"}, "answer": "A", "explanation": "Linitis plastica is diffuse infiltrating gastric adenocarcinoma that produces a rigid, non-distensible stomach; failure of the GI tract to distend is a malignancy warning sign.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — recognize malignant gastric morphology.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "recognize malignant gastric morphology."}, {"n": 58, "stem": "A patient has HBsAg negative, anti-HBc IgG positive, and anti-HBs positive. Which state is represented?", "choices": {"A": "Resolved natural hepatitis B infection", "B": "Acute hepatitis B", "C": "Chronic hepatitis B", "D": "Vaccination immunity only", "E": "No prior HBV exposure and no acquired immunity"}, "answer": "A", "explanation": "Resolved natural HBV infection leaves both anti-HBc IgG and anti-HBs, while HBsAg is absent.", "objective_full": "Viral Hepatitis Serologies — distinguish resolved natural HBV infection from vaccination.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish resolved natural HBV infection from vaccination."}, {"n": 59, "stem": "A patient develops fever, diarrhea, and pseudoappendicitis after eating undercooked pork. Which pathogen should be specifically considered?", "choices": {"A": "Cryptosporidium", "B": "Vibrio parahaemolyticus", "C": "C. difficile", "D": "Giardia lamblia", "E": "Yersinia enterocolitica"}, "answer": "E", "explanation": "Yersinia enterocolitica is associated with pork exposure and can cause pseudoappendicitis; it may require a special-order culture.", "objective_full": "Lab Evaluation of GI Disease — distinguish Yersinia from other diarrheal pathogens by exposure and presentation.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish Yersinia from other diarrheal pathogens by exposure and presentation."}, {"n": 60, "stem": "A patient with cirrhosis has recurrent ascites and a prior variceal bleed but a MELD score below 15. Which statement best matches the guide?", "choices": {"A": "Variceal bleeding lowers the urgency of referral", "B": "Transplant referral is prohibited below MELD 15 in all clinical circumstances", "C": "Decompensation can justify transplant referral regardless of MELD", "D": "FIB-4 replaces transplant evaluation in decompensation", "E": "Only albumin determines transplant eligibility"}, "answer": "C", "explanation": "The guide recommends transplant referral regardless of MELD for decompensated cirrhosis, including recurrent ascites, encephalopathy, variceal bleeding, or HCC.", "objective_full": "Other Liver Diagnostics — distinguish numeric MELD thresholds from clinical decompensation.", "topic": "Other Liver Diagnostics", "objective": "distinguish numeric MELD thresholds from clinical decompensation."}, {"n": 61, "stem": "A patient with MASLD needs noninvasive fibrosis assessment. Which variable is included in the NAFLD Fibrosis Score but not in FIB-4?", "choices": {"A": "Platelet count", "B": "AST", "C": "ALT", "D": "Age", "E": "BMI"}, "answer": "E", "explanation": "FIB-4 uses age, AST, ALT, and platelets. The NAFLD Fibrosis Score also incorporates BMI, impaired glucose tolerance/diabetes, and albumin.", "objective_full": "Other Liver Diagnostics — distinguish FIB-4 from the NAFLD Fibrosis Score.", "topic": "Other Liver Diagnostics", "objective": "distinguish FIB-4 from the NAFLD Fibrosis Score."}, {"n": 62, "stem": "A patient previously treated successfully for hepatitis C has anti-HCV positive and HCV RNA undetectable. How should these results be interpreted?", "choices": {"A": "Acute hepatitis B window period", "B": "Chronic active hepatitis C with detectable ongoing viral replication", "C": "Hepatitis C vaccination immunity", "D": "Resolved hepatitis C with no current viremia", "E": "Acute hepatitis A"}, "answer": "D", "explanation": "Anti-HCV remains positive after exposure, even after spontaneous or treatment-related clearance. An undetectable HCV RNA means no current active infection.", "objective_full": "Viral Hepatitis Serologies — distinguish prior HCV exposure from active infection.", "topic": "Viral Hepatitis Serologies", "objective": "distinguish prior HCV exposure from active infection."}, {"n": 63, "stem": "A child develops bloody diarrhea after undercooked beef and later has anemia, thrombocytopenia, and acute kidney injury. PT and PTT are normal. Which complication best fits?", "choices": {"A": "Disseminated intravascular coagulation", "B": "Acute liver failure", "C": "Hemolytic uremic syndrome", "D": "Celiac disease", "E": "Spontaneous bacterial peritonitis"}, "answer": "C", "explanation": "The guide describes HUS after EHEC as microangiopathic hemolytic anemia, thrombocytopenia, and AKI with normal PT/PTT; antibiotics should be avoided because they can increase HUS risk.", "objective_full": "Lab Evaluation of GI Disease — distinguish EHEC-associated HUS from other coagulopathic syndromes.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish EHEC-associated HUS from other coagulopathic syndromes."}, {"n": 64, "stem": "Hydrogen breath testing after lactose ingestion shows a 16 ppm rise above baseline. How should this result be interpreted?", "choices": {"A": "Diagnostic of small-bowel Crohn disease", "B": "Diagnostic of celiac disease", "C": "Indeterminate", "D": "Normal", "E": "Diagnostic of lactose malabsorption"}, "answer": "C", "explanation": "The guide interprets a rise above 20 ppm as diagnostic, 10–20 ppm as indeterminate, and 10 ppm or less as normal.", "objective_full": "Lab Evaluation of GI Disease — interpret hydrogen breath-test thresholds.", "topic": "Lab Evaluation of GI Disease", "objective": "interpret hydrogen breath-test thresholds."}, {"n": 65, "stem": "RUQ ultrasound shows echogenic mobile material in the gallbladder. Which feature most strongly distinguishes a gallstone from sludge?", "choices": {"A": "A normal common bile duct diameter", "B": "Absence of a sonographic Murphy sign", "C": "Diffuse hepatic echogenicity", "D": "Posterior acoustic shadowing", "E": "Gallbladder filling on HIDA"}, "answer": "D", "explanation": "Gallstones cast posterior acoustic shadows, whereas biliary sludge does not.", "objective_full": "Abdominal Imaging — distinguish gallstones from biliary sludge on ultrasound.", "topic": "Abdominal Imaging", "objective": "distinguish gallstones from biliary sludge on ultrasound."}, {"n": 66, "stem": "A patient with cirrhosis has a MELD 3.0 score of 17. Which action is supported by the guide?", "choices": {"A": "Replace MELD with a FIB-4 score", "B": "Repeat the score only after five years", "C": "Use Child-Pugh only and ignore MELD", "D": "Wait until the MELD score reaches 40", "E": "Refer for liver transplant evaluation"}, "answer": "E", "explanation": "MELD 3.0 predicts roughly 3-month mortality and is used for transplant prioritization. A MELD of 15 or higher is a threshold for transplant evaluation.", "objective_full": "Other Liver Diagnostics — apply MELD 3.0 to transplant referral.", "topic": "Other Liver Diagnostics", "objective": "apply MELD 3.0 to transplant referral."}, {"n": 67, "stem": "A patient with stable chronic hepatitis B suddenly decompensates. Which additional test is specifically supported by the handout when superinfection is suspected?", "choices": {"A": "Total anti-HAV only", "B": "Anti-HBs alone", "C": "Total anti-HDV", "D": "Hepatitis E RNA screening", "E": "HCV-specific IgM"}, "answer": "C", "explanation": "Hepatitis D requires hepatitis B and should be considered when a patient with chronic HBV unexpectedly worsens; the handout lists total anti-HDV as the test.", "objective_full": "Viral Hepatitis Serologies — recognize hepatitis D superinfection in chronic HBV.", "topic": "Viral Hepatitis Serologies", "objective": "recognize hepatitis D superinfection in chronic HBV."}, {"n": 68, "stem": "A supine abdominal film shows gas on both sides of several bowel walls. Which named sign does this represent?", "choices": {"A": "Target sign from intussusception", "B": "String of pearls from SBO", "C": "Chilaiditi sign from interposed colon", "D": "Coffee bean sign from sigmoid volvulus", "E": "Rigler sign from pneumoperitoneum"}, "answer": "E", "explanation": "Rigler sign is visualization of both sides of the bowel wall due to free intraperitoneal air and is a sign of pneumoperitoneum.", "objective_full": "Abdominal Imaging — distinguish true free-air signs from obstruction and mimics.", "topic": "Abdominal Imaging", "objective": "distinguish true free-air signs from obstruction and mimics."}, {"n": 69, "stem": "A nonpregnant adult with RLQ pain undergoes CT. Which combination most supports acute appendicitis?", "choices": {"A": "Gallbladder wall thickening greater than 3 mm with stones and a sonographic Murphy sign", "B": "Cecum less than 3 cm with no inflammation", "C": "Pancreatic calcifications with ductal beading", "D": "Appendix diameter greater than 6 mm with wall enhancement and fat stranding", "E": "Diffuse bowel dilation with gas to the rectum"}, "answer": "D", "explanation": "The guide describes appendicitis on CT as an appendix greater than 6 mm in outer diameter with wall enhancement and periappendiceal fat stranding.", "objective_full": "Abdominal Imaging — recognize CT features of appendicitis.", "topic": "Abdominal Imaging", "objective": "recognize CT features of appendicitis."}, {"n": 70, "stem": "An immunocompromised patient has severe watery diarrhea and tests positive for Cryptosporidium antigen. What additional evaluation is specifically recommended?", "choices": {"A": "Check anti-HAV IgM only", "B": "Order HIDA for all cases", "C": "Repeat hydrogen breath testing", "D": "Perform barium enema first", "E": "Screen for HIV"}, "answer": "E", "explanation": "The guide highlights severe Cryptosporidium diarrhea as a reason to screen for HIV.", "objective_full": "Lab Evaluation of GI Disease — recognize Cryptosporidium as a clue to immunodeficiency.", "topic": "Lab Evaluation of GI Disease", "objective": "recognize Cryptosporidium as a clue to immunodeficiency."}, {"n": 71, "stem": "A patient develops profuse watery diarrhea 8 weeks after a course of clindamycin. Which specimen is appropriate for C. difficile testing?", "choices": {"A": "Three O&P samples before toxin testing", "B": "Unformed stool", "C": "A gastric biopsy only", "D": "A formed stool specimen", "E": "A serum sample only"}, "answer": "B", "explanation": "C. difficile can occur up to 12 weeks after antibiotics, and testing should be performed only on unformed stool because formed-stool positives may reflect colonization.", "objective_full": "Lab Evaluation of GI Disease — distinguish true C. difficile testing indications and specimens.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish true C. difficile testing indications and specimens."}, {"n": 72, "stem": "A patient develops severe acute hepatocellular injury over 48 hours. Albumin remains normal, but INR is rising. Which explanation best accounts for the discrepancy?", "choices": {"A": "INR changes only after several weeks of liver injury", "B": "Albumin is a marker of cholestasis rather than synthesis", "C": "Clotting factors turn over faster than albumin", "D": "Albumin rises before INR in acute liver failure", "E": "Normal albumin excludes significant acute liver injury"}, "answer": "C", "explanation": "Albumin has a roughly 20-day half-life and may take 2–3 weeks to fall, whereas PT/INR can worsen within hours to days because clotting factors have short half-lives.", "objective_full": "Interpretation of Liver Tests — distinguish rapid and slow markers of hepatic synthetic function.", "topic": "Interpretation of Liver Tests", "objective": "distinguish rapid and slow markers of hepatic synthetic function."}, {"n": 73, "stem": "A 22-year-old has intermittent scleral icterus during fasting and viral illnesses. Total bilirubin is mildly elevated with an indirect predominance. AST, ALT, alkaline phosphatase, CBC, reticulocyte count, and haptoglobin are normal. What is the most likely diagnosis?", "choices": {"A": "Choledocholithiasis", "B": "Acute viral hepatitis", "C": "Gilbert syndrome", "D": "Hemolytic anemia", "E": "Primary biliary cholangitis"}, "answer": "C", "explanation": "Gilbert syndrome causes isolated mild unconjugated hyperbilirubinemia triggered by fasting, stress, or illness, with otherwise normal liver tests and no evidence of hemolysis.", "objective_full": "Interpretation of Liver Tests — distinguish Gilbert syndrome from hemolysis and obstructive/hepatocellular jaundice.", "topic": "Interpretation of Liver Tests", "objective": "distinguish Gilbert syndrome from hemolysis and obstructive/hepatocellular jaundice."}, {"n": 74, "stem": "A jaundiced patient has HBsAg positive and IgM anti-HBc positive. Which diagnosis best fits?", "choices": {"A": "Acute hepatitis B", "B": "Hepatitis B window period", "C": "Resolved hepatitis B", "D": "Vaccination immunity", "E": "Chronic hepatitis B with low replication"}, "answer": "A", "explanation": "HBsAg plus IgM anti-HBc is the key serologic combination for acute hepatitis B.", "objective_full": "Viral Hepatitis Serologies — identify acute HBV infection.", "topic": "Viral Hepatitis Serologies", "objective": "identify acute HBV infection."}, {"n": 75, "stem": "A patient with chronic liver disease has a FIB-4 score of 1.2. Using the guide's hepatitis C cutoffs, how should this be interpreted?", "choices": {"A": "Diagnostic of spontaneous bacterial peritonitis", "B": "Diagnostic of portal hypertension", "C": "Low risk for advanced fibrosis", "D": "High risk for advanced fibrosis", "E": "Indeterminate risk requiring immediate biopsy"}, "answer": "C", "explanation": "FIB-4 below 1.45 is low risk and essentially excludes advanced fibrosis using the cited hepatitis C cutoffs.", "objective_full": "Other Liver Diagnostics — distinguish low, indeterminate, and high FIB-4 ranges.", "topic": "Other Liver Diagnostics", "objective": "distinguish low, indeterminate, and high FIB-4 ranges."}, {"n": 76, "stem": "A 36-year-old woman with autoimmune thyroid disease has fatigue, AST 330 U/L, ALT 470 U/L, alkaline phosphatase 150 U/L, and hypergammaglobulinemia. Which pair of findings would most strongly favor autoimmune hepatitis over primary biliary cholangitis?", "choices": {"A": "Low ceruloplasmin and Kayser-Fleischer rings", "B": "Anti-smooth muscle antibody and elevated IgG", "C": "p-ANCA and ulcerative colitis", "D": "High transferrin saturation and low TIBC", "E": "Antimitochondrial antibody and marked alkaline phosphatase elevation"}, "answer": "B", "explanation": "Autoimmune hepatitis is primarily hepatocellular and is associated with ASMA, ANA, and elevated IgG; PBC is cholestatic and associated with AMA.", "objective_full": "Interpretation of Liver Tests — distinguish autoimmune hepatitis from PBC and inherited disorders.", "topic": "Interpretation of Liver Tests", "objective": "distinguish autoimmune hepatitis from PBC and inherited disorders."}, {"n": 77, "stem": "A 48-year-old man with heavy daily alcohol use has AST 196 U/L, ALT 82 U/L, alkaline phosphatase 100 U/L, and an elevated MCV. Which finding most strongly supports alcohol-related liver disease rather than MASLD?", "choices": {"A": "Isolated indirect bilirubin elevation with normal enzymes", "B": "ALT greater than AST with a ratio below 1", "C": "Marked alkaline phosphatase elevation with pruritus", "D": "AST more than twice the ALT", "E": "Normal GGT with isolated alkaline phosphatase elevation"}, "answer": "D", "explanation": "An AST/ALT ratio above 2 strongly suggests alcohol-related liver disease; MASLD more often has ALT greater than AST.", "objective_full": "Interpretation of Liver Tests — distinguish alcohol-related liver disease from MASLD.", "topic": "Interpretation of Liver Tests", "objective": "distinguish alcohol-related liver disease from MASLD."}, {"n": 78, "stem": "A 67-year-old woman has an isolated alkaline phosphatase elevation. GGT is normal. Which source should be considered first?", "choices": {"A": "Bile duct obstruction", "B": "Alcohol-related hepatitis", "C": "Primary biliary cholangitis with a hepatobiliary alkaline phosphatase elevation", "D": "Bone rather than hepatobiliary tissue", "E": "Acute viral hepatitis"}, "answer": "D", "explanation": "An elevated alkaline phosphatase with a normal GGT points away from a hepatobiliary source and toward bone or another non-hepatic source.", "objective_full": "Interpretation of Liver Tests — use GGT to distinguish hepatic from non-hepatic alkaline phosphatase.", "topic": "Interpretation of Liver Tests", "objective": "use GGT to distinguish hepatic from non-hepatic alkaline phosphatase."}, {"n": 79, "stem": "A patient develops a predominantly cholestatic liver injury after a new medication. Which drug group best matches the guide's cholestatic DILI examples?", "choices": {"A": "Statins, aspirin, and metformin", "B": "Penicillins, sulfa drugs, and estrogens", "C": "Acetaminophen, isoniazid, methotrexate, and statins", "D": "Isoniazid, methotrexate, and acetaminophen", "E": "Methotrexate, acetaminophen, and statins"}, "answer": "B", "explanation": "The guide lists penicillins/derivatives, sulfa drugs, and estrogens/OCPs with cholestatic DILI; acetaminophen, statins, isoniazid, and methotrexate are listed with hepatocellular injury.", "objective_full": "Interpretation of Liver Tests — distinguish hepatocellular from cholestatic drug-induced liver injury.", "topic": "Interpretation of Liver Tests", "objective": "distinguish hepatocellular from cholestatic drug-induced liver injury."}, {"n": 80, "stem": "A patient has alkaline phosphatase 720 U/L, mild AST/ALT elevation, pruritus, and positive AMA. Which additional step is still required before assuming the cholestasis is entirely due to PBC?", "choices": {"A": "Repeat bilirubin measurements until the pattern becomes predominantly indirect", "B": "Image the biliary tree to exclude obstruction or neoplasm", "C": "Order a hydrogen breath test", "D": "Measure HCV RNA before any imaging", "E": "Begin HCC surveillance without imaging"}, "answer": "B", "explanation": "A cholestatic pattern is not automatically PBC. The guide stresses early imaging to exclude obstruction or neoplasm even when autoimmune cholestasis is suspected.", "objective_full": "Interpretation of Liver Tests — distinguish PBC from mechanical obstruction.", "topic": "Interpretation of Liver Tests", "objective": "distinguish PBC from mechanical obstruction."}, {"n": 81, "stem": "A patient's noninvasive fibrosis tests repeatedly fall in an intermediate range. Which test remains the gold standard for definitive fibrosis staging?", "choices": {"A": "Liver biopsy", "B": "Hydrogen breath test", "C": "Flexible sigmoidoscopy", "D": "HIDA scan", "E": "Serum AFP alone"}, "answer": "A", "explanation": "Noninvasive fibrosis tests work best at the extremes. Indeterminate results are a major reason to proceed to liver biopsy, the gold standard for extent of fibrosis.", "objective_full": "Other Liver Diagnostics — distinguish noninvasive fibrosis assessment from biopsy.", "topic": "Other Liver Diagnostics", "objective": "distinguish noninvasive fibrosis assessment from biopsy."}, {"n": 82, "stem": "A 50-year-old woman with autoimmune thyroid disease reports fatigue and intense pruritus. AST is 65 U/L, ALT 74 U/L, and alkaline phosphatase 780 U/L. RUQ ultrasound shows no obstructing lesion. Which laboratory test most directly supports the leading diagnosis?", "choices": {"A": "HFE genotype testing", "B": "Anti-smooth muscle antibody", "C": "IgM anti-HBc", "D": "Antimitochondrial antibody", "E": "Serum ceruloplasmin"}, "answer": "D", "explanation": "PBC is a cholestatic autoimmune disease classically affecting middle-aged women with pruritus and a markedly elevated alkaline phosphatase; AMA is positive in about 90–100%.", "objective_full": "Interpretation of Liver Tests — distinguish PBC from AIH, obstruction, and inherited liver disease.", "topic": "Interpretation of Liver Tests", "objective": "distinguish PBC from AIH, obstruction, and inherited liver disease."}, {"n": 83, "stem": "Ascitic fluid from a cirrhotic patient grows several different organisms. Which interpretation should move higher on the differential than uncomplicated SBP?", "choices": {"A": "Secondary peritonitis from bowel perforation", "B": "Simple portal-hypertensive ascites without a secondary intra-abdominal source", "C": "Hepatorenal syndrome alone", "D": "Primary biliary cholangitis", "E": "Gilbert syndrome"}, "answer": "A", "explanation": "The guide notes that SBP is usually monomicrobial; multiple organisms suggest perforation or another secondary source rather than spontaneous infection.", "objective_full": "Other Liver Diagnostics — distinguish SBP from secondary peritonitis.", "topic": "Other Liver Diagnostics", "objective": "distinguish SBP from secondary peritonitis."}, {"n": 84, "stem": "A patient has abdominal distention and high-pitched bowel sounds. Plain film shows markedly dilated peripheral colon and cecum, little rectal gas, and relatively few air-fluid levels. Which pattern is most consistent?", "choices": {"A": "Mechanical large bowel obstruction", "B": "Localized sentinel loop", "C": "Generalized ileus", "D": "Mechanical small bowel obstruction", "E": "Free intraperitoneal air"}, "answer": "A", "explanation": "LBO produces prominent colonic/cecal dilation with little rectal gas and fewer air-fluid levels because the colon reabsorbs water; the small bowel may remain collapsed if the ileocecal valve is competent.", "objective_full": "Abdominal Imaging — distinguish LBO from SBO and ileus.", "topic": "Abdominal Imaging", "objective": "distinguish LBO from SBO and ileus."}, {"n": 85, "stem": "A 47-year-old has episodes of meat sticking in the chest every few weeks but feels normal between episodes. There is no weight loss. Which lesion best fits?", "choices": {"A": "Peptic esophageal stricture", "B": "Achalasia", "C": "Zenker diverticulum", "D": "Schatzki ring", "E": "Esophageal carcinoma"}, "answer": "D", "explanation": "Schatzki ring classically causes intermittent, non-progressive solid-food dysphagia in patients over 40 and is associated with 'steakhouse syndrome' and meat impaction.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish Schatzki ring from progressive strictures and malignancy.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish Schatzki ring from progressive strictures and malignancy."}, {"n": 86, "stem": "A patient has chronic diarrhea, weight loss, steatorrhea, and iron deficiency anemia. IgA tTG is positive. What is the next step needed to establish the diagnosis?", "choices": {"A": "Use H. pylori serology as confirmation", "B": "Order a barium enema", "C": "Repeat stool culture until positive", "D": "Begin a strict gluten-free diet before serology and any duodenal biopsy", "E": "EGD with multiple duodenal biopsies while still eating gluten"}, "answer": "E", "explanation": "Celiac testing should be performed while the patient is consuming gluten. Positive IgA tTG is confirmed by duodenal biopsy showing villous atrophy and crypt hyperplasia.", "objective_full": "Lab Evaluation of GI Disease — distinguish celiac screening from confirmatory testing.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish celiac screening from confirmatory testing."}, {"n": 87, "stem": "A patient is suspected of having an esophageal perforation after a procedure. Which contrast should replace barium?", "choices": {"A": "No contrast under any circumstances", "B": "Technetium-99m sulfur colloid", "C": "Barium sulfate", "D": "Water-soluble Gastrografin", "E": "Gadolinium"}, "answer": "D", "explanation": "Barium is contraindicated when perforation or an anastomotic leak is suspected because extravasation can cause mediastinitis or peritonitis; water-soluble Gastrografin is used instead.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish barium from water-soluble contrast in perforation.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish barium from water-soluble contrast in perforation."}, {"n": 88, "stem": "A patient completes H. pylori eradication therapy. When should stool antigen or urea breath testing be used to confirm eradication?", "choices": {"A": "No confirmation test can be used", "B": "The day antibiotics are finished", "C": "Within 24 hours of the last PPI dose", "D": "Only if antibody serology becomes negative", "E": "At least 4 weeks after completing therapy"}, "answer": "E", "explanation": "The guide recommends proof of eradication with stool antigen or urea breath testing at least 4 weeks after therapy; serology cannot confirm eradication.", "objective_full": "Lab Evaluation of GI Disease — distinguish diagnosis from post-treatment confirmation.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish diagnosis from post-treatment confirmation."}, {"n": 89, "stem": "A 43-year-old with suspected peptic ulcer disease has no alarm features. Which test is preferred for noninvasive H. pylori diagnosis and can later document eradication?", "choices": {"A": "Routine bacterial stool culture", "B": "Hydrogen breath test for lactose", "C": "H. pylori antibody serology as the sole active-infection test", "D": "Stool antigen or urea breath test", "E": "FOBT alone"}, "answer": "D", "explanation": "Stool antigen and urea breath testing are preferred noninvasive H. pylori tests and can also be used to confirm eradication. Serology is discouraged because antibodies persist for years.", "objective_full": "Lab Evaluation of GI Disease — distinguish active H. pylori tests from serology.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish active H. pylori tests from serology."}, {"n": 90, "stem": "A patient develops inflammatory diarrhea after eating raw shellfish. Which special-order pathogen is most strongly associated with this exposure?", "choices": {"A": "Giardia lamblia", "B": "Yersinia enterocolitica", "C": "Vibrio parahaemolyticus", "D": "Entamoeba histolytica", "E": "C. difficile"}, "answer": "C", "explanation": "Raw shellfish exposure is a classic clue for Vibrio parahaemolyticus, which may require specia
