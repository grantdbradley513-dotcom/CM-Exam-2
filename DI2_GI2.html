l-order stool culture.", "objective_full": "Lab Evaluation of GI Disease — distinguish exposure-linked special stool cultures.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish exposure-linked special stool cultures."}, {"n": 91, "stem": "A patient with massive ascites and coagulopathy requires liver tissue for diagnosis. Which biopsy approach is preferred?", "choices": {"A": "No biopsy route is possible", "B": "Barium-guided liver biopsy", "C": "Percutaneous liver biopsy", "D": "Transjugular liver biopsy", "E": "Blind bedside liver biopsy"}, "answer": "D", "explanation": "Transjugular biopsy is preferred when the percutaneous route is high risk, including massive ascites and coagulopathy, and it can also allow TIPS placement.", "objective_full": "Other Liver Diagnostics — distinguish percutaneous from transjugular biopsy.", "topic": "Other Liver Diagnostics", "objective": "distinguish percutaneous from transjugular biopsy."}, {"n": 92, "stem": "A 44-year-old has fluctuating AST and ALT elevations of 2–4 times the upper limit of normal for a year with few symptoms. Which infectious workup should be performed early?", "choices": {"A": "Total anti-HDV only", "B": "IgM anti-HAV only", "C": "HBeAg without HBsAg", "D": "Hepatitis E antibody only", "E": "Anti-HCV and HBsAg testing"}, "answer": "E", "explanation": "Chronic hepatitis B and C may cause mild or intermittently normal aminotransferases, so viral serologies should be obtained early in chronically elevated liver enzymes.", "objective_full": "Interpretation of Liver Tests — distinguish chronic viral hepatitis from metabolic and alcohol-related liver disease.", "topic": "Interpretation of Liver Tests", "objective": "distinguish chronic viral hepatitis from metabolic and alcohol-related liver disease."}, {"n": 93, "stem": "A patient has dysphagia to solids and liquids, severe noncardiac chest pain, and a corkscrew appearance on barium swallow. What is the next physiologic test used to characterize the motility abnormality?", "choices": {"A": "Esophageal manometry", "B": "Fecal calprotectin", "C": "Tagged RBC scan", "D": "HIDA scan", "E": "Barium enema"}, "answer": "A", "explanation": "Barium swallow can demonstrate a corkscrew pattern of diffuse esophageal spasm, while manometry measures esophageal pressure and contraction patterns.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish structural barium imaging from physiologic manometry.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish structural barium imaging from physiologic manometry."}, {"n": 94, "stem": "A patient has fever and bloody diarrhea after eating undercooked beef. Routine stool culture is being ordered. Which additional organism should be specifically requested because it may not be included in routine culture?", "choices": {"A": "Campylobacter jejuni", "B": "Salmonella species", "C": "C. difficile on formed stool", "D": "Shigella species", "E": "E. coli O157:H7"}, "answer": "E", "explanation": "Routine stool cultures generally identify Salmonella, Shigella, and Campylobacter. EHEC O157:H7 is a special-order organism and should be requested with bloody diarrhea.", "objective_full": "Lab Evaluation of GI Disease — distinguish routine from special-order stool culture.", "topic": "Lab Evaluation of GI Disease", "objective": "distinguish routine from special-order stool culture."}, {"n": 95, "stem": "An upright chest film appears to show subdiaphragmatic lucency, but haustral markings are visible within the lucency between the liver and diaphragm. What is the best interpretation?", "choices": {"A": "Pneumoperitoneum from perforated viscus requiring urgent surgical evaluation", "B": "Rigler sign", "C": "Football sign", "D": "Mechanical SBO", "E": "Chilaiditi sign, a mimic of free air"}, "answer": "E", "explanation": "Chilaiditi sign is interposition of colon between the liver and diaphragm. Visible haustra distinguish it from true free intraperitoneal air.", "objective_full": "Abdominal Imaging — distinguish Chilaiditi sign from pneumoperitoneum.", "topic": "Abdominal Imaging", "objective": "distinguish Chilaiditi sign from pneumoperitoneum."}, {"n": 96, "stem": "A 58-year-old with years of GERD has slowly progressive solid-food dysphagia. Barium swallow shows a smooth, tapered, concentric distal narrowing several centimeters long. Which diagnosis is most likely?", "choices": {"A": "Peptic esophageal stricture", "B": "Zenker diverticulum", "C": "Achalasia", "D": "Schatzki ring", "E": "Diffuse esophageal spasm"}, "answer": "A", "explanation": "Peptic stricture causes progressive solid-food dysphagia and appears as a smooth, tapered, concentric distal narrowing, commonly from long-standing GERD.", "objective_full": "Upper/Lower GI Imaging & Endoscopy — distinguish peptic stricture from Schatzki ring and motility disorders.", "topic": "Upper/Lower GI Imaging & Endoscopy", "objective": "distinguish peptic stricture from Schatzki ring and motility disorders."}, {"n": 97, "stem": "A 71-year-old man has painless jaundice, weight loss, and epigastric discomfort radiating to the back. Alkaline phosphatase is markedly elevated compared with AST and ALT. What is the best next diagnostic step?", "choices": {"A": "Repeat AST and ALT in six months", "B": "Use bilirubin to classify the pattern as hepatocellular", "C": "Order only an HFE genotype test", "D": "Diagnose primary biliary cholangitis and order AMA before any hepatobiliary imaging", "E": "Obtain hepatobiliary imaging to look for obstruction or a mass"}, "answer": "E", "explanation": "A cholestatic pattern requires early imaging to identify obstruction or ductal distortion and avoid missing pancreatic cancer or cholangiocarcinoma.", "objective_full": "Interpretation of Liver Tests — work up a cholestatic pattern and distinguish obstruction from autoimmune cholestasis.", "topic": "Interpretation of Liver Tests", "objective": "work up a cholestatic pattern and distinguish obstruction from autoimmune cholestasis."}, {"n": 98, "stem": "A patient with alcoholic hepatitis has AST 210 U/L, ALT 92 U/L, bilirubin 8.1 mg/dL, and prolonged PT. Which values are most useful for judging disease severity?", "choices": {"A": "Ceruloplasmin and albumin only", "B": "Bilirubin and PT/INR", "C": "Ferritin and transferrin saturation", "D": "AST and ALT alone", "E": "GGT and alkaline phosphatase only"}, "answer": "B", "explanation": "In alcoholic hepatitis and advanced liver disease, bilirubin and synthetic-function markers such as PT/INR better reflect severity than the absolute transaminase level.", "objective_full": "Interpretation of Liver Tests — separate markers of injury from markers of severity.", "topic": "Interpretation of Liver Tests", "objective": "separate markers of injury from markers of severity."}, {"n": 99, "stem": "A cirrhotic patient has refractory ascites despite standard management and recurrent variceal bleeding. Which procedure directly lowers portal pressure and is listed for these complications?", "choices": {"A": "Hydrogen breath test", "B": "HIDA scan", "C": "TIPS", "D": "FIB-4 calculation", "E": "Barium enema"}, "answer": "C", "explanation": "TIPS immediately lowers portal pressure and is used for recurrent variceal bleeding or refractory ascites.", "objective_full": "Other Liver Diagnostics — distinguish TIPS indications from diagnostic testing.", "topic": "Other Liver Diagnostics", "objective": "distinguish TIPS indications from diagnostic testing."}, {"n": 100, "stem": "A patient with chronic hepatitis B is HBeAg positive. What does this generally imply compared with anti-HBe positivity?", "choices": {"A": "Acute hepatitis A coinfection", "B": "Greater viral replication and infectivity", "C": "Resolved infection with no viral replication", "D": "Lower hepatic inflammation and infectivity", "E": "Vaccination immunity"}, "answer": "B", "explanation": "In chronic HBV, HBeAg usually indicates active replication and greater infectivity. Seroconversion to anti-HBe is generally associated with lower replication and inflammation.", "objective_full": "Viral Hepatitis Serologies — distinguish HBeAg from anti-HBe. Exam Construction Verification Questions created: 100 Question order: shuffled after drafting Answer distribution: exactly 20 each for A, B, C, D, and E Question focus: commonly confused diagnoses/tests plus material not emphasized in the first 100-question exam Reasoning mix: first-order recognition plus second-order interpretation, next-step, and workup questions Question stems: not labeled by source, section, or topic Source basis: the same six provided DI Two GI/liver study guides only", "topic": "Viral Hepatitis Serologies", "objective": "distinguish HBeAg from anti-HBe. Exam Construction Verification Questions created: 100 Question order: shuffled after drafting Answer distribution: exactly 20 each for A, B, C, D, and E Question focus: commonly confused diagnoses/tests plus material not emphasized in the first 100-question exam Reasoning mix: first-order recognition plus second-order interpretation, next-step, and workup questions Question stems: not labeled by source, section, or topic Source basis: the same six provided DI Two GI/liver study guides only"}];
const QMAP = Object.fromEntries(QUESTIONS.map(q => [q.n, q]));

const state = {
  current: 1,
  selected: {},
  reviewMode: false,
  reviewList: [],
  reviewIndex: 0
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
}

function getQ() {
  return state.reviewMode ? QMAP[state.reviewList[state.reviewIndex]] : QMAP[state.current];
}

function render() {
  const q = getQ();
  const selected = state.selected[q.n];

  document.getElementById('qnum').textContent = `Question ${q.n}`;
  document.getElementById('stem').textContent = q.stem;
  document.getElementById('answeredCount').textContent = `${Object.keys(state.selected).length} answered`;

  const choices = document.getElementById('choices');
  choices.innerHTML = "";
  for (const letter of ["A","B","C","D","E"]) {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="letter">${letter}.</span><span>${esc(q.choices[letter])}</span>`;
    if (selected) {
      btn.classList.add("locked");
      if (letter === q.answer) btn.classList.add("correct");
      if (letter === selected && selected !== q.answer) btn.classList.add("incorrect");
      btn.disabled = true;
    } else {
      btn.onclick = () => choose(letter);
    }
    choices.appendChild(btn);
  }

  const fb = document.getElementById('feedback');
  if (!selected) {
    fb.className = "feedback";
    fb.innerHTML = "";
  } else {
    const ok = selected === q.answer;
    fb.className = `feedback show ${ok ? "good" : "bad"}`;
    fb.innerHTML =
      `<strong>${ok ? "Correct" : "Incorrect"}.</strong> ` +
      `Correct answer: <strong>${q.answer}. ${esc(q.choices[q.answer])}</strong><br>` +
      `${esc(q.explanation)}` +
      `<div class="obj"><strong>${esc(q.topic)}</strong> — ${esc(q.objective)}</div>`;
  }

  document.getElementById('status').textContent = state.reviewMode
    ? `Missed review ${state.reviewIndex+1} of ${state.reviewList.length}`
    : `Question ${q.n} of 100`;

  const pct = state.reviewMode
    ? ((state.reviewIndex+1) / Math.max(1,state.reviewList.length))*100
    : (q.n/100)*100;
  document.getElementById('progress').style.width = `${pct}%`;

  document.getElementById('prevBtn').disabled = state.reviewMode ? state.reviewIndex===0 : q.n===1;
  document.getElementById('nextBtn').disabled = state.reviewMode ? state.reviewIndex===state.reviewList.length-1 : q.n===100;
  document.getElementById('reviewBanner').classList.toggle('show', state.reviewMode);
}

function choose(letter) {
  const q = getQ();
  if (state.selected[q.n]) return;
  state.selected[q.n] = letter;
  render();
}

function goNext() {
  if (state.reviewMode) {
    if (state.reviewIndex < state.reviewList.length-1) state.reviewIndex++;
  } else if (state.current < 100) {
    state.current++;
  }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function goPrev() {
  if (state.reviewMode) {
    if (state.reviewIndex > 0) state.reviewIndex--;
  } else if (state.current > 1) {
    state.current--;
  }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function compute(answeredOnly=true) {
  const answeredNums = Object.keys(state.selected).map(Number);
  const denom = answeredOnly ? answeredNums : QUESTIONS.map(q => q.n);
  let correct = 0;
  for (const n of denom) if (state.selected[n] === QMAP[n].answer) correct++;
  return {correct, total:denom.length, answered:answeredNums.length};
}

function showResults(answeredOnly) {
  const s = compute(answeredOnly);
  const p = s.total ? Math.round((s.correct/s.total)*1000)/10 : 0;
  document.getElementById('pct').textContent = `${p}%`;
  document.getElementById('raw').textContent = `${s.correct} / ${s.total}`;
  document.getElementById('answeredRaw').textContent = `${s.answered} / 100`;

  const topics = [...new Set(QUESTIONS.map(q => q.topic))];
  let topicStats = topics.map(topic => {
    const answeredQs = QUESTIONS.filter(q => q.topic === topic && state.selected[q.n]);
    const c = answeredQs.filter(q => state.selected[q.n] === q.answer).length;
    return {
      topic,
      correct:c,
      total:answeredQs.length,
      pct:answeredQs.length ? Math.round(c/answeredQs.length*100) : null
    };
  });

  const scored = topicStats.filter(x => x.total > 0).sort((a,b)=>b.pct-a.pct);
  const best = scored.length ? scored[0].topic : null;
  const worst = scored.length ? scored[scored.length-1].topic : null;

  const grid = document.getElementById('topicGrid');
  grid.innerHTML = "";
  for (const x of topicStats) {
    const d = document.createElement("div");
    d.className = "topic";
    let rank = "";
    if (x.topic === best && x.topic === worst && scored.length===1) rank = "Only scored topic";
    else if (x.topic === best) rank = "Strongest";
    else if (x.topic === worst) rank = "Weakest";
    d.innerHTML = `<b>${esc(x.topic)}</b>` +
      `${x.total ? `${x.correct} / ${x.total} correct (${x.pct}%)` : "No answered questions yet"}` +
      `${rank ? `<div class="rank">${rank}</div>` : ""}`;
    grid.appendChild(d);
  }

  document.getElementById('results').classList.add('show');

  state.reviewList = QUESTIONS
    .filter(q => state.selected[q.n] && state.selected[q.n] !== q.answer)
    .map(q => q.n);

  document.getElementById('reviewBtn').disabled = state.reviewList.length===0;
  document.getElementById('copyBtn').disabled = state.reviewList.length===0;
  document.getElementById('results').scrollIntoView({behavior:"smooth",block:"start"});
}

function gradeCompleted() {
  showResults(true);
}

function finishExam() {
  showResults(false);
}

function toggleReview() {
  if (!state.reviewMode) {
    if (!state.reviewList.length) return;
    state.reviewMode = true;
    state.reviewIndex = 0;
  } else {
    state.reviewMode = false;
  }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

async function copyMissed() {
  const missed = QUESTIONS.filter(q => state.selected[q.n] && state.selected[q.n] !== q.answer);
  if (!missed.length) return;

  const text = missed.map(q => {
    const opts = ["A","B","C","D","E"].map(l => `${l}. ${q.choices[l]}`).join("\n");
    return [
      `Question ${q.n}`,
      q.stem,
      opts,
      `Your answer: ${state.selected[q.n]}. ${q.choices[state.selected[q.n]]}`,
      `Correct answer: ${q.answer}. ${q.choices[q.answer]}`,
      `Objective: ${q.topic} — ${q.objective}`,
      `Explanation: ${q.explanation}`
    ].join("\n");
  }).join("\n\n--------------------\n\n");

  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const b = document.getElementById('copyBtn');
  const old = b.textContent;
  b.textContent = "Copied!";
  setTimeout(()=>b.textContent=old,1300);
}

render();
</script>
