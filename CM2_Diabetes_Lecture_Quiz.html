<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
    transition: background-color 0.3s ease;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  #bglayer { position: fixed; inset: 0; z-index: -1; background-size: cover;
    background-position: center; background-repeat: no-repeat; display: none; }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }

alsely low → may mislabel a T2 patient as T1.", "clarify": [{"stem": "C-peptide should be paired with…", "options": [{"letter": "A", "text": "A simultaneous glucose"}, {"letter": "B", "text": "A lipid panel"}], "answer": "A", "explanation": "Interpret against the concurrent glucose."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "C-peptide should NOT be interpreted during → Setting:", "options": [{"letter": "A", "text": "Acute hyperglycemic crisis (e.g., DKA)"}, {"letter": "B", "text": "A stable outpatient visit"}, {"letter": "C", "text": "The fasting state with a glucose"}, {"letter": "D", "text": "Routine annual follow-up"}], "answer": "A", "explanation": "Interpret C-peptide **with a simultaneous glucose and outside acute decompensation** — it can be falsely low during severe hyperglycemia/acute illness."}], "checkpoints": [{"stem": "Autoantibody testing is most useful when T1 is suspected because of → Clue:", "options": [{"letter": "A", "text": "DKA at diagnosis or young age"}, {"letter": "B", "text": "Obesity and acanthosis"}, {"letter": "C", "text": "Older age at onset"}, {"letter": "D", "text": "Slow, asymptomatic onset"}], "answer": "A", "explanation": "Test antibodies with **young age, DKA at diagnosis, or absent T2 risk factors**."}]}}, {"id": "13", "group": 13, "slide": 24, "section": "LADA", "topic": "Differentiating DM types", "skill": "Identification", "stem": "Which diagnosis should be suspected in a lean 45-year-old labeled as having type 2 diabetes whose oral medications fail within 1–2 years?", "options": [{"letter": "A", "text": "Medication-induced diabetes"}, {"letter": "B", "text": "Stress hyperglycemia"}, {"letter": "C", "text": "Latent autoimmune diabetes (LADA)"}, {"letter": "D", "text": "Ketosis-prone type 2 diabetes"}], "answer": "C", "explanation": "**LADA** = adult-onset autoimmune diabetes that looks like T2 until **rapid failure of non-insulin therapy**; it is classified as type 1 → insulin.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "An adult who looks like T2 but loses β-cell function fast — think **autoimmunity** presenting late.", "stem": "Rapid failure of oral agents in a lean adult suggests…", "options": [{"letter": "A", "text": "Ongoing autoimmune β-cell loss"}, {"letter": "B", "text": "Worsening insulin resistance from obesity"}], "answer": "A", "explanation": "Fast β-cell loss in a lean adult = autoimmune.", "clarify": [{"stem": "LADA is ultimately classified as…", "options": [{"letter": "A", "text": "Type 1 diabetes"}, {"letter": "B", "text": "Type 2 diabetes"}], "answer": "A", "explanation": "LADA = autoimmune = type 1 spectrum."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Lean 45-year-old labeled 'type 2' fails oral agents within 1–2 years → Diagnosis:", "options": [{"letter": "A", "text": "Latent autoimmune diabetes (LADA)"}, {"letter": "B", "text": "Ketosis-prone type 2 diabetes"}, {"letter": "C", "text": "Stress hyperglycemia"}, {"letter": "D", "text": "Medication-induced diabetes"}], "answer": "A", "explanation": "**LADA** = adult-onset autoimmune diabetes that looks like T2 until **rapid failure of non-insulin therapy**; it is classified as type 1 → insulin."}], "checkpoints": [{"stem": "Suspected LADA → First test:", "options": [{"letter": "A", "text": "GAD65 antibody"}, {"letter": "B", "text": "Repeat A1C"}, {"letter": "C", "text": "OGTT"}, {"letter": "D", "text": "Fasting lipid panel"}], "answer": "A", "explanation": "**GAD antibodies** first — they persist into adulthood."}]}}, {"id": "14", "group": 14, "slide": 24, "section": "Obese teen in DKA", "topic": "Differentiating DM types", "skill": "Diagnostics & imaging", "stem": "What can be concluded about the type of diabetes in a 15-year-old with obesity who presents with diabetic ketoacidosis?", "options": [{"letter": "A", "text": "Confirms type 1 diabetes"}, {"letter": "B", "text": "Excludes type 1 diabetes"}, {"letter": "C", "text": "Indeterminate; test after stabilizing"}, {"letter": "D", "text": "Confirms type 2 diabetes"}], "answer": "C", "explanation": "Obesity doesn't exclude T1 and DKA doesn't prove it (**ketosis-prone T2** is real) → stabilize, then **antibodies + C-peptide**.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Two traps: obesity is now common in T1, and some T2 patients present in DKA.", "stem": "Can a type 2 patient present in DKA?", "options": [{"letter": "A", "text": "Yes (ketosis-prone type 2)"}, {"letter": "B", "text": "No, never"}], "answer": "A", "explanation": "Ketosis-prone T2 exists, especially under major stress.", "clarify": [{"stem": "Is obesity now common in type 1?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "Historically lean, but obesity is now common."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Obese 15-year-old presents in DKA → Interpretation of type:", "options": [{"letter": "A", "text": "Indeterminate; test after stabilizing"}, {"letter": "B", "text": "Confirms type 1 diabetes"}, {"letter": "C", "text": "Confirms type 2 diabetes"}, {"letter": "D", "text": "Excludes type 1 diabetes"}], "answer": "A", "explanation": "Obesity doesn't exclude T1 and DKA doesn't prove it (**ketosis-prone T2** is real) → stabilize, then **antibodies + C-peptide**."}], "checkpoints": [{"stem": "Diagnostic trap: one of these does NOT exclude type 1 → Finding:", "options": [{"letter": "A", "text": "Obesity"}, {"letter": "B", "text": "Positive GAD65"}, {"letter": "C", "text": "Undetectable C-peptide"}, {"letter": "D", "text": "DKA at onset"}], "answer": "A", "explanation": "**Obesity** does not exclude T1; the others support T1."}]}}, {"id": "15", "group": 15, "slide": 25, "section": "Stress hyperglycemia", "topic": "Differentiating DM types", "skill": "Identification", "stem": "What is the most likely explanation for a glucose level of 245 mg/dL in a septic ICU patient with no history of diabetes?", "options": [{"letter": "A", "text": "Type 1 diabetes"}, {"letter": "B", "text": "LADA"}, {"letter": "C", "text": "Type 2 diabetes"}, {"letter": "D", "text": "Stress hyperglycemia"}], "answer": "D", "explanation": "**Stress hyperglycemia** (sepsis, shock, trauma, ACS, surgery) — rule out before labeling type 2.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Acute critical illness releases counter-regulatory hormones (cortisol, catecholamines) that raise glucose.", "stem": "Sepsis raises glucose mainly through…", "options": [{"letter": "A", "text": "Counter-regulatory stress hormones"}, {"letter": "B", "text": "Autoimmune β-cell destruction"}], "answer": "A", "explanation": "Stress hormones → transient hyperglycemia.", "clarify": [{"stem": "Should you diagnose diabetes from a single value during acute sepsis without more data?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Reassess when the acute illness resolves."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Glucose 245 in a septic ICU patient with no diabetes history → Most likely:", "options": [{"letter": "A", "text": "Stress hyperglycemia"}, {"letter": "B", "text": "Type 1 diabetes"}, {"letter": "C", "text": "Type 2 diabetes"}, {"letter": "D", "text": "LADA"}], "answer": "A", "explanation": "**Stress hyperglycemia** (sepsis, shock, trauma, ACS, surgery) — rule out before labeling type 2."}], "checkpoints": [{"stem": "Most common medication class causing hyperglycemia → Class:", "options": [{"letter": "A", "text": "Glucocorticoids"}, {"letter": "B", "text": "ACE inhibitors"}, {"letter": "C", "text": "Statins"}, {"letter": "D", "text": "Proton pump inhibitors"}], "answer": "A", "explanation": "**Glucocorticoids** top the drug-induced list (also antipsychotics, thiazides, calcineurin inhibitors)."}]}}, {"id": "16", "group": 16, "slide": 28, "section": "A1C cutoff", "topic": "Screening & diagnostic criteria", "skill": "Diagnostics & imaging", "stem": "What A1C level meets the diagnostic threshold for diabetes?", "options": [{"letter": "A", "text": "≥6.5%"}, {"letter": "B", "text": "≥5.7%"}, {"letter": "C", "text": "≥7.0%"}, {"letter": "D", "text": "≥6.0%"}], "answer": "A", "explanation": "Diabetes: **A1C ≥6.5%**; prediabetes 5.7–6.4%; normal <5.7%.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "5.7% is where prediabetes begins; diabetes starts higher.", "stem": "A1C 5.7–6.4% is classified as…", "options": [{"letter": "A", "text": "Prediabetes"}, {"letter": "B", "text": "Diabetes"}, {"letter": "C", "text": "Normal"}], "answer": "A", "explanation": "So diabetes begins at 6.5%.", "clarify": [{"stem": "Is 7% the diagnostic cutoff or the usual treatment goal?", "options": [{"letter": "A", "text": "Treatment goal (<7%)"}, {"letter": "B", "text": "Diagnostic cutoff"}], "answer": "A", "explanation": "<7% is the target for most adults."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "A1C diagnostic of diabetes → Cutoff:", "options": [{"letter": "A", "text": "≥6.5%"}, {"letter": "B", "text": "≥5.7%"}, {"letter": "C", "text": "≥7.0%"}, {"letter": "D", "text": "≥6.0%"}], "answer": "A", "explanation": "Diabetes: **A1C ≥6.5%**; prediabetes 5.7–6.4%; normal <5.7%."}], "checkpoints": [{"stem": "A1C 6.1% → Category:", "options": [{"letter": "A", "text": "Prediabetes"}, {"letter": "B", "text": "Diabetes"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Impaired glucose tolerance"}], "answer": "A", "explanation": "5.7–6.4% = **prediabetes**."}]}}, {"id": "17", "group": 17, "slide": 28, "section": "FPG cutoff", "topic": "Screening & diagnostic criteria", "skill": "Diagnostics & imaging", "stem": "What fasting plasma glucose level meets the diagnostic threshold for diabetes after at least 8 hours without caloric intake?", "options": [{"letter": "A", "text": "≥126 mg/dL"}, {"letter": "B", "text": "≥200 mg/dL"}, {"letter": "C", "text": "≥100 mg/dL"}, {"letter": "D", "text": "≥140 mg/dL"}], "answer": "A", "explanation": "Diabetes: **FPG ≥126**; impaired fasting glucose 100–125; normal <100.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "100 is where fasting abnormality (IFG) starts; diabetes is higher.", "stem": "FPG 100–125 mg/dL is called…", "options": [{"letter": "A", "text": "Impaired fasting glucose (prediabetes)"}, {"letter": "B", "text": "Diabetes"}, {"letter": "C", "text": "Normal"}], "answer": "A", "explanation": "IFG = 100–125, so diabetes begins at 126.", "clarify": [{"stem": "≥200 mg/dL applies to which tests?", "options": [{"letter": "A", "text": "Random glucose (with symptoms) and 2-h OGTT"}, {"letter": "B", "text": "Fasting glucose"}], "answer": "A", "explanation": "200 is the random/OGTT cutoff."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Fasting plasma glucose (≥8 h no calories) diagnostic of diabetes → Cutoff:", "options": [{"letter": "A", "text": "≥126 mg/dL"}, {"letter": "B", "text": "≥100 mg/dL"}, {"letter": "C", "text": "≥140 mg/dL"}, {"letter": "D", "text": "≥200 mg/dL"}], "answer": "A", "explanation": "Diabetes: **FPG ≥126**; impaired fasting glucose 100–125; normal <100."}], "checkpoints": [{"stem": "FPG 112 mg/dL → Term:", "options": [{"letter": "A", "text": "Impaired fasting glucose"}, {"letter": "B", "text": "Impaired glucose tolerance"}, {"letter": "C", "text": "Diabetes mellitus"}, {"letter": "D", "text": "Normal fasting glucose"}], "answer": "A", "explanation": "100–125 = **IFG**; IGT refers to the 2-h OGTT."}]}}, {"id": "18", "group": 18, "slide": 28, "section": "OGTT cutoffs", "topic": "Screening & diagnostic criteria", "skill": "Diagnostics & imaging", "stem": "How is a 2-hour glucose level of 165 mg/dL on a 75-g oral glucose tolerance test classified?", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Impaired glucose tolerance"}, {"letter": "C", "text": "Diabetes mellitus"}, {"letter": "D", "text": "Impaired fasting glucose"}], "answer": "B", "explanation": "2-h OGTT: **≥200 = diabetes**, **140–199 = impaired glucose tolerance (IGT)**, <140 normal.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Two OGTT cutoffs to know: **140** and **200**.", "stem": "2-h OGTT value diagnostic of diabetes is…", "options": [{"letter": "A", "text": "≥200 mg/dL"}, {"letter": "B", "text": "≥140 mg/dL"}, {"letter": "C", "text": "≥126 mg/dL"}], "answer": "A", "explanation": "≥200 = diabetes; 140–199 sits in the prediabetes range.", "clarify": [{"stem": "IFG refers to which test?", "options": [{"letter": "A", "text": "Fasting glucose"}, {"letter": "B", "text": "2-h OGTT"}], "answer": "A", "explanation": "IFG = fasting; IGT = OGTT."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "2-hour glucose 165 mg/dL on 75-g OGTT → Category:", "options": [{"letter": "A", "text": "Impaired glucose tolerance"}, {"letter": "B", "text": "Diabetes mellitus"}, {"letter": "C", "text": "Impaired fasting glucose"}, {"letter": "D", "text": "Normal"}], "answer": "A", "explanation": "2-h OGTT: **≥200 = diabetes**, **140–199 = impaired glucose tolerance (IGT)**, <140 normal."}], "checkpoints": [{"stem": "2-hour OGTT glucose diagnostic of diabetes → Cutoff:", "options": [{"letter": "A", "text": "≥200 mg/dL"}, {"letter": "B", "text": "≥140 mg/dL"}, {"letter": "C", "text": "≥180 mg/dL"}, {"letter": "D", "text": "≥126 mg/dL"}], "answer": "A", "explanation": "**≥200 mg/dL** at 2 hours."}]}}, {"id": "19", "group": 19, "slide": 28, "section": "Random glucose + symptoms", "topic": "Screening & diagnostic criteria", "skill": "Diagnostics & imaging", "stem": "How should a random glucose level of 310 mg/dL be interpreted in a patient with polyuria, polydipsia, and weight loss?", "options": [{"letter": "A", "text": "Order OGTT before diagnosing"}, {"letter": "B", "text": "Diabetes; no confirmation needed"}, {"letter": "C", "text": "Prediabetes; recheck in 1 year"}, {"letter": "D", "text": "Repeat test on another day"}], "answer": "B", "explanation": "**Random ≥200 + classic symptoms** = diabetes; unequivocal hyperglycemia/symptoms or a crisis needs **no confirmation**.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "The confirmation rule applies only when hyperglycemia is NOT unequivocal.", "stem": "Does a symptomatic patient with random glucose ≥200 need a second test?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Classic symptoms + ≥200 is diagnostic on its own.", "clarify": [{"stem": "A random glucose ≥200 WITHOUT symptoms is diagnostic alone?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Random glucose requires classic symptoms."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Random glucose 310 with polyuria, polydipsia, weight loss → Interpretation:", "options": [{"letter": "A", "text": "Diabetes; no confirmation needed"}, {"letter": "B", "text": "Repeat test on another day"}, {"letter": "C", "text": "Prediabetes; recheck in 1 year"}, {"letter": "D", "text": "Order OGTT before diagnosing"}], "answer": "A", "explanation": "**Random ≥200 + classic symptoms** = diabetes; unequivocal hyperglycemia/symptoms or a crisis needs **no confirmation**."}], "checkpoints": [{"stem": "Asymptomatic 40-year-old with a single A1C of 6.7% → Next step:", "options": [{"letter": "A", "text": "Confirm with repeat or second test"}, {"letter": "B", "text": "Diagnose diabetes now"}, {"letter": "C", "text": "Start insulin"}, {"letter": "D", "text": "Repeat in 3 years"}], "answer": "A", "explanation": "Without unequivocal hyperglycemia, **confirm**: same test another day OR two different tests from one sample."}]}}, {"id": "20", "group": 20, "slide": 29, "section": "A1C unreliab oup": 22, "slide": 31, "section": "A1C goal", "topic": "Glycemic targets & monitoring", "skill": "Management", "stem": "What is the A1C goal for most nonpregnant adults with diabetes?", "options": [{"letter": "A", "text": "<6%"}, {"letter": "B", "text": "<7%"}, {"letter": "C", "text": "<5.7%"}, {"letter": "D", "text": "<8%"}], "answer": "B", "explanation": "**A1C <7%** for most; <6.5% if safely achievable; **<7.5–8%** for older/frail or major comorbidity.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "The diagnostic cutoff is 6.5%; the standard treatment goal is a bit above that.", "stem": "Older/frail patients with major comorbidity get a goal that is…", "options": [{"letter": "A", "text": "Less stringent"}, {"letter": "B", "text": "More stringent"}], "answer": "A", "explanation": "Looser goals avoid hypoglycemia in frail patients.", "clarify": [{"stem": "Does a lower A1C goal increase hypoglycemia risk?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "Tighter control = more lows."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Most nonpregnant adults with diabetes → A1C goal:", "options": [{"letter": "A", "text": "<7%"}, {"letter": "B", "text": "<6%"}, {"letter": "C", "text": "<8%"}, {"letter": "D", "text": "<5.7%"}], "answer": "A", "explanation": "**A1C <7%** for most; <6.5% if safely achievable; **<7.5–8%** for older/frail or major comorbidity."}], "checkpoints": [{"stem": "Frail 84-year-old with major comorbidities → A1C goal:", "options": [{"letter": "A", "text": "<7.5–8%"}, {"letter": "B", "text": "<6.5%"}, {"letter": "C", "text": "<7%"}, {"letter": "D", "text": "<6%"}], "answer": "A", "explanation": "Older/frail → **<7.5–8%** (TIR >50%)."}]}}, {"id": "23", "group": 23, "slide": 32, "section": "CGM time in range", "topic": "Glycemic targets & monitoring", "skill": "Diagnostics & imaging", "stem": "What percentage of time should most adults usi stem": "Does metformin cause hypoglycemia on its own?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Metformin is weight-neutral and doesn't cause lows.", "clarify": [{"stem": "Sulfonylureas classically cause…", "options": [{"letter": "A", "text": "Hypoglycemia and weight gain"}, {"letter": "B", "text": "Weight loss"}], "answer": "A", "explanation": "SU = hypo + weight gain."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "New T2DM, no HF, CKD, ASCVD, or obesity concerns; cost matters → Drug:", "options": [{"letter": "A", "text": "Metformin"}, {"letter": "B", "text": "Insulin glargine"}, {"letter": "C", "text": "Sulfonylurea"}, {"letter": "D", "text": "Pioglitazone"}], "answer": "A", "explanation": "With no compelling comorbidity it's an efficacy + cost choice → **metformin** (plus lifestyle) is an excellent answer."}], "checkpoints": [{"stem": "ADA: what drives choice of a type 2 agent most → Driver:", "options": [{"letter": "A", "text": "Comorbidities (HF, CKD, ASCVD)"}, {"letter": "B", "text": "Current A1C level"}, {"letter": "C", "text": "Patient age alone"}, {"letter": "D", "text": "Duration of diabetes"}], "answer": "A", "explanation": "Agent choice is driven by **comorbidities** far more than A1C."}]}}, {"id": "32", "group": 32, "slide": 57, "section": "Heart failure", "topic": "Type 2 drug selection", "skill": "Management", "stem": "Which medication class is preferred for a patient with type 2 diabetes and heart failure with either reduced or preserved ejection fraction?", "options": [{"letter": "A", "text": "SGLT2 inhibitor"}, {"letter": "B", "text": "Sulfonylurea"}, {"letter": "C", "text": "Pioglitazone"}, {"letter": "D", "text": "Insulin"}], "answer": "A", "explanation": "**HF → SGLT2 inhibitor** (reduces HF hospitalization and CV death), regardless of A1C.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "The class that also benefits the heart and kidneys by causing glucosuria and natriuresis.", "stem": "Which class worsens heart failure through fluid retention?", "options": [{"letter": "A", "text": "Pioglitazone (TZD)"}, {"letter": "B", "text": "SGLT2 inhibitor"}], "answer": "A", "explanation": "TZDs worsen HF; SGLT2i protect.", "clarify": [{"stem": "Is the cardiorenal drug indicated even if A1C is at goal?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "Indicated regardless of A1C."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "T2DM with heart failure (HFrEF or HFpEF) → Preferred class:", "options": [{"letter": "A", "text": "SGLT2 inhibitor"}, {"letter": "B", "text": "Pioglitazone"}, {"letter": "C", "text": "Sulfonylurea"}, {"letter": "D", "text": "Insulin"}], "answer": "A", "explanation": "**HF → SGLT2 inhibitor** (reduces HF hospitalization and CV death), regardless of A1C."}], "checkpoints": [{"stem": "Glucose-lowering class to avoid in heart failure (fluid retention) → Class:", "options": [{"letter": "A", "text": "Pioglitazone (TZD)"}, {"letter": "B", "text": "SGLT2 inhibitor"}, {"letter": "C", "text": "Metformin"}, {"letter": "D", "text": "GLP-1 receptor agonist"}], "answer": "A", "explanation": "**Pioglitazone** causes fluid retention and raises HF risk; SGLT2i (also first choice in **CKD**) protect."}]}}, {"id": "33", "group": 33, "slide": 57, "section": "ASCVD", "topic": "Type 2 drug selection", "skill": "Management", "stem": "Which medication class is preferred for a patient with type 2 diabetes and established atherosclerotic cardiovascular disease, such as a prior myocardial infarction or stroke?", "options": [{"letter": "A", "text": "DPP-4 inhibitor"}, {"letter": "B", "text": "Sulfonylurea"}, {"letter": "C", "text": "GLP-1 receptor agonist"}, {"letter": "D", "text": "Pioglitazone"}], "answer": "C", "explanation": "**ASCVD → GLP-1 RA** (or SGLT2i) with proven benefit; GLP-1 RA reduces atherosclerotic events including stroke.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Pick the class proven to reduce **atherosclerotic events** — and it also causes big weight loss.", "stem": "GLP-1 RAs are known for…", "options": [{"letter": "A", "text": "Weight loss and CV benefit"}, {"letter": "B", "text": "Weight gain and hypoglycemia"}], "answer": "A", "explanation": "GLP-1 RA: ↓↓ weight + CV benefit.", "clarify": [{"stem": "Do sulfonylureas have proven CV benefit?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "SUs lower glucose without organ protection."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "T2DM with prior MI or stroke (established ASCVD) → Preferred class:", "options": [{"letter": "A", "text": "GLP-1 receptor agonist"}, {"letter": "B", "text": "Sulfonylurea"}, {"letter": "C", "text": "Pioglitazone"}, {"letter": "D", "text": "DPP-4 inhibitor"}], "answer": "A", "explanation": "**ASCVD → GLP-1 RA** (or SGLT2i) with proven benefit; GLP-1 RA reduces atherosclerotic events including stroke."}], "checkpoints": [{"stem": "T2DM with obesity → Class with the greatest A1C and weight effect:", "options": [{"letter": "A", "text": "Dual GIP/GLP-1 RA (tirzepatide)"}, {"letter": "B", "text": "Metformin"}, {"letter": "C", "text": "Sulfonylurea"}, {"letter": "D", "text": "Pioglitazone"}], "answer": "A", "explanation": "**Tirzepatide** (dual GIP/GLP-1 RA) has the largest A1C and weight effect."}]}}, {"id": "34", "group": 34, "slide": 57, "section": "MASH", "topic": "Type 2 drug selection", "skill": "Management", "stem": "Which treatment option is appropriate for a patient with type 2 diabetes and biopsy-proven metabolic dysfunction-associated steatohepatitis (MASH)?", "options": [{"letter": "A", "text": "Metformin"}, {"letter": "B", "text": "DPP-4 inhibitor"}, {"letter": "C", "text": "Pioglitazone"}, {"letter": "D", "text": "Sulfonylurea"}], "answer": "C", "explanation": "**MASLD/MASH → GLP-1 RA, pioglitazone, or tirzepatide**; metformin, insulin, and DPP-4i do not treat MASH.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Among the oral agents, only the insulin sensitizer (TZD) improves steatohepatitis.", "stem": "Does metformin treat MASH?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Metformin doesn't treat MASH.", "clarify": [{"stem": "Pioglitazone belongs to which class?", "options": [{"letter": "A", "text": "Thiazolidinedione (TZD)"}, {"letter": "B", "text": "Sulfonylurea"}], "answer": "A", "explanation": "TZD = insulin sensitizer."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "T2DM with biopsy-proven MASH → Appropriate option:", "options": [{"letter": "A", "text": "Pioglitazone"}, {"letter": "B", "text": "Metformin"}, {"letter": "C", "text": "Sulfonylurea"}, {"letter": "D", "text": "DPP-4 inhibitor"}], "answer": "A", "explanation": "**MASLD/MASH → GLP-1 RA, pioglitazone, or tirzepatide**; metformin, insulin, and DPP-4i do not treat MASH."}], "checkpoints": [{"stem": "Patient at A1C goal on a sulfonylurea develops HF → ADA approach:", "options": [{"letter": "A", "text": "Consider switching to an SGLT2 inhibitor"}, {"letter": "B", "text": "No change; A1C at goal"}, {"letter": "C", "text": "Add pioglitazone"}, {"letter": "D", "text": "Increase sulfonylurea dose"}], "answer": "A", "explanation": "Comorbidity trumps A1C → **switch to/add an SGLT2i** even at goal."}]}}, {"id": "35", "group": 35, "slide": 59, "section": "Dawn phenomenon", "topic": "Insulin therapy", "skill": "Identification", "stem": "Which phenomenon explains fasting hyperglycemia when overnight continuous glucose monitoring shows glucose levels of 150–160 mg/dL without hypoglycemia?", "options": [{"letter": "A", "text": "Somogyi effect"}, {"letter": "B", "text": "Hypoglycemia unawareness"}, {"letter": "C", "text": "Dawn phenomenon"}, {"letter": "D", "text": "Insulin stacking"}], "answer": "C", "explanation": "**Dawn phenomenon**: physiologic early-morning rise in counter-regulatory hormones (GH) with **normal/high overnight glucose** → adjust timing/dose of long-acting insulin.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "The discriminator is the **overnight glucose**: low → Somogyi; normal/high → dawn.", "stem": "Somogyi effect would show what overnight glucose?", "options": [{"letter": "A", "text": "Low (nocturnal hypoglycemia)"}, {"letter": "B", "text": "Normal or elevated"}], "answer": "A", "explanation": "Somogyi = rebound after a nocturnal low; none here.", "clarify": [{"stem": "Is the dawn phenomenon a recognized physiologic process?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "Dawn is real; Somogyi is unproven/overdiagnosed."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Fasting hyperglycemia; overnight CGM stays 150–160 with no lows → Phenomenon:", "options": [{"letter": "A", "text": "Dawn phenomenon"}, {"letter": "B", "text": "Somogyi effect"}, {"letter": "C", "text": "Hypoglycemia unawareness"}, {"letter": "D", "text": "Insulin stacking"}], "answer": "A", "explanation": "**Dawn phenomenon**: physiologic early-morning rise in counter-regulatory hormones (GH) with **normal/high overnight glucose** → adjust timing/dose of long-acting insulin."}], "checkpoints": [{"stem": "Suspected Somogyi effect → First step before changing basal insulin:", "options": [{"letter": "A", "text": "Confirm overnight hypoglycemia (CGM)"}, {"letter": "B", "text": "Reduce basal insulin by 50%"}, {"letter": "C", "text": "Increase bedtime NPH"}, {"letter": "D", "text": "Stop all insulin"}], "answer": "A", "explanation": "Somogyi is **unproven** → don't reflexively reduce basal; **confirm** nocturnal lows first."}]}}, {"id": "36", "group": 36, "slide": 61, "section": "Hypoglycemia levels", "topic": "Hypoglycemia", "skill": "Identification", "stem": "How is a glucose level of 50 mg/dL classified in an alert patient who can treat the hypoglycemia independently?", "options": [{"letter": "A", "text": "Level 1"}, {"letter": "B", "text": "Not hypoglycemia"}, {"letter": "C", "text": "Level 2"}, {"letter": "D", "text": "Level 3"}], "answer": "C", "explanation": "**Level 1** <70 and ≥54; **Level 2 <54** (neuroglycopenia risk, treat now); **Level 3** = needs help from another person, any number.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Level 3 is defined by **needing assistance**, not by the number; this patient is self-treating.", "stem": "Level 2 hypoglycemia begins below…", "options": [{"letter": "A", "text": "54 mg/dL"}, {"letter": "B", "text": "70 mg/dL"}, {"letter": "C", "text": "40 mg/dL"}], "answer": "A", "explanation": "<54 = level 2; 54–69 = level 1.", "clarify": [{"stem": "Level 3 hypoglycemia is defined by…", "options": [{"letter": "A", "text": "Needing another person's help"}, {"letter": "B", "text": "Glucose <40"}], "answer": "A", "explanation": "Functional definition; the number doesn't matter."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Glucose 50 mg/dL, alert and able to self-treat → Hypoglycemia level:", "options": [{"letter": "A", "text": "Level 2"}, {"letter": "B", "text": "Level 1"}, {"letter": "C", "text": "Level 3"}, {"letter": "D", "text": "Not hypoglycemia"}], "answer": "A", "explanation": "**Level 1** <70 and ≥54; **Level 2 <54** (neuroglycopenia risk, treat now); **Level 3** = needs help from another person, any number."}], "checkpoints": [{"stem": "Strongest risk factor for recurrent hypoglycemia → Factor:", "options": [{"letter": "A", "text": "Prior level 2 or 3 events"}, {"letter": "B", "text": "Obesity"}, {"letter": "C", "text": "Metformin use"}, {"letter": "D", "text": "Young age"}], "answer": "A", "explanation": "**Prior level 2/3 hypoglycemia** is the strongest predictor of recurrence."}]}}, {"id": "37", "group": 37, "slide": 61, "section": "Hypo unawareness", "topic": "Hypoglycemia", "skill": "Complications", "stem": "What term describes repeated episodes of hypoglycemia in a patient whose continuous glucose monitor shows 48 mg/dL without tremor or sweating?", "options": [{"letter": "A", "text": "Hypoglycemia unawareness"}, {"letter": "B", "text": "Dawn phenomenon"}, {"letter": "C", "text": "Somogyi effect"}, {"letter": "D", "text": "Sensor lag artifact"}], "answer": "A", "explanation": "**Hypoglycemia unawareness**: repeated lows blunt the **autonomic** warning → patient jumps straight to confusion/coma. Clue = level-2 glucose without symptoms.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Normally **autonomic** symptoms (tremor, sweating, palpitations, hunger) warn first, before neuroglycopenia.", "stem": "Which symptoms come FIRST in hypoglycemia?", "options": [{"letter": "A", "text": "Autonomic (tremor, sweating, palpitations)"}, {"letter": "B", "text": "Neuroglycopenic (confusion, seizure)"}], "answer": "A", "explanation": "Autonomic warning first; repeated lows blunt it.", "clarify": [{"stem": "Is unawareness partly reversible?", "options": [{"letter": "A", "text": "Yes — weeks of avoiding lows"}, {"letter": "B", "text": "No, permanent"}], "answer": "A", "explanation": "Loosen targets for several weeks."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Repeated lows; CGM shows glucose 48 with no tremor or sweating → Term:", "options": [{"letter": "A", "text": "Hypoglycemia unawareness"}, {"letter": "B", "text": "Somogyi effect"}, {"letter": "C", "text": "Dawn phenomenon"}, {"letter": "D", "text": "Sensor lag artifact"}], "answer": "A", "explanation": "**Hypoglycemia unawareness**: repeated lows blunt the **autonomic** warning → patient jumps straight to confusion/coma. Clue = level-2 glucose without symptoms."}], "checkpoints": [{"stem": "Hypoglycemia unawareness → Management approach:", "options": [{"letter": "A", "text": "Avoid lows for weeks; loosen targets"}, {"letter": "B", "text": "Tighten A1C goal to <6%"}, {"letter": "C", "text": "Add a sulfonylurea"}, {"letter": "D", "text": "Stop glucose monitoring"}], "answer": "A", "explanation": "Several weeks of **strict hypoglycemia avoidance** (looser targets, CGM) restores awareness."}]}}, {"id": "38", "group": 38, "slide": 62, "section": "Rule of 15", "topic": "Hypoglycemia", "skill": "Management", "stem": "How should hypoglycemia be treated in a patient with a glucose level of 62 mg/dL who is tremulous and sweaty but able to swallow?", "options": [{"letter": "A", "text": "Chocolate bar and a nap"}, {"letter": "B", "text": "IM glucagon and call EMS"}, {"letter": "C", "text": "Protein snack alone"}, {"letter": "D", "text": "15 g fast carbs, recheck in 15 min"}], "answer": "D", "explanation": "**Rule of 15**: 15 g fast-acting carbohydrate (4 oz juice, 3–4 glucose tabs) → wait 15 min → recheck → repeat until ≥70. Prefer pure glucose.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "This patient is conscious and can swallow — oral treatment first; glucagon is for those who can't.", "stem": "Why avoid chocolate for a low?", "options": [{"letter": "A", "text": "Fat slows absorption"}, {"letter": "B", "text": "It contains too little sugar"}], "answer": "A", "explanation": "Fat delays glucose uptake.", "clarify": [{"stem": "Protein alone is a poor choice because it…", "options": [{"letter": "A", "text": "Stimulates insulin"}, {"letter": "B", "text": "Raises glucose too fast"}], "answer": "A", "explanation": "Protein doesn't fix the low."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Glucose 62, tremulous and sweaty, can swallow → Treatment:", "options": [{"letter": "A", "text": "15 g fast carbs, recheck in 15 min"}, {"letter": "B", "text": "IM glucagon and call EMS"}, {"letter": "C", "text": "Chocolate bar and a nap"}, {"letter": "D", "text": "Protein snack alone"}], "answer": "A", "explanation": "**Rule of 15**: 15 g fast-acting carbohydrate (4 oz juice, 3–4 glucose tabs) → wait 15 min → recheck → repeat until ≥70. Prefer pure glucose."}], "checkpoints": [{"stem": "Patient on insulin found unresponsive at home → Treatment:", "options": [{"letter": "A", "text": "Glucagon (IM/intranasal) and call EMS"}, {"letter": "B", "text": "Orange juice by mouth"}, {"letter": "C", "text": "Rapid-acting insulin"}, {"letter": "D", "text": "Wait and recheck in 15 minutes"}], "answer": "A", "explanation": "Level 3/can't swallow → **glucagon + EMS**; never give insulin or oral food to an unresponsive patient."}]}}, {"id": "39", "group": 39, "slide": 65, "section": "DKA in T1", "topic": "DKA", "skill": "Disease process", "stem": "Why does diabetic ketoacidosis occur mainly in type 1 diabetes?", "options": [{"letter": "A", "text": "Absent insulin permits unchecked lipolysis/ketogenesis"}, {"letter": "B", "text": "Type 1 patients are more insulin resistant"}, {"letter": "C", "text": "Type 1 causes higher glucose levels"}, {"letter": "D", "text": "Type 1 patients make excess insulin"}], "answer": "A", "explanation": "DKA needs **severe insulin deficiency** → unrestrained lipolysis → ketones → acidosis. Type 2 usually retains enough insulin to suppress ketogenesis.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Even a small amount of insulin is enough to **stop fat breakdown**.", "stem": "Type 2 patients usually have…", "options": [{"letter": "A", "text": "Some insulin — enough to restrain ketogenesis"}, {"letter": "B", "text": "No insulin at all"}], "answer": "A", "explanation": "Residual insulin blocks ketosis → T2 gets HHS instead.", "clarify": [{"stem": "Ketones come from the breakdown of…", "options": [{"letter": "A", "text": "Fat (fatty acids)"}, {"letter": "B", "text": "Protein only"}], "answer": "A", "explanation": "Lipolysis → FFAs → ketoacids."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Why DKA occurs mainly in type 1 → Reason:", "options": [{"letter": "A", "text": "Absent insulin permits unchecked lipolysis/ketogenesis"}, {"letter": "B", "text": "Type 1 patients are more insulin resistant"}, {"letter": "C", "text": "Type 1 causes higher glucose levels"}, {"letter": "D", "text": "Type 1 patients make excess insulin"}], "answer": "A", "explanation": "DKA needs **severe insulin deficiency** → unrestrained lipolysis → ketones → acidosis. Type 2 usually retains enough insulin to suppress ketogenesis."}], "checkpoints": [{"stem": "Known T1D in DKA → Most common precipitants:", "options": [{"letter": "A", "text": "Missed insulin or infection"}, {"letter": "B", "text": "High-protein diet"}, {"letter": "C", "text": "Excess exercise"}, {"letter": "D", "text": "Too much basal insulin"}], "answer": "A", "explanation": "Always ask 'why this episode?' — **insulin interruption** (missed doses, pump failure, rationing) or **↑ demand** (infection, MI, surgery)."}]}}, {"id": "40", "group": 40, "slide": 66, "section": "DKA diagnosis", "topic": "DKA", "skill": "Diagnostics & imaging", "stem": "What is the diagnosis in a vomiting patient with type 1 diabetes, glucose of 350 mg/dL, β-hydroxybutyrate of 4.2 mmol/L, pH of 7.18, and bicarbonate of 12 mmol/L?", "options": [{"letter": "A", "text": "Diabetic ketoacidosis"}, {"letter": "B", "text": "Lactic acidosis"}, {"letter": "C", "text": "Alcoholic ketoacidosis"}, {"letter": "D", "text": "Hyperosmolar hyperglycemic state"}], "answer": "A", "explanation": "DKA = **all three**: glucose ≥200 (or known DM) + **BHB ≥3.0** (or urine ketones ≥2+) + **pH <7.3 and/or HCO₃ <18**.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Check each of the three D-K-A boxes: diabetes, ketosis, acidosis.", "stem": "HHS requires which ketone level?", "options": [{"letter": "A", "text": "BHB <3.0 (minimal ketosis)"}, {"letter": "B", "text": "BHB ≥3.0"}], "answer": "A", "explanation": "High ketones + acidosis points away from HHS.", "clarify": [{"stem": "DKA acidosis cutoff is pH…", "options": [{"letter": "A", "text": "<7.3"}, {"letter": "B", "text": "<7.0"}], "answer": "A", "explanation": "pH <7.3 and/or HCO₃ <18."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Vomiting T1D: glucose 350, β-hydroxybutyrate 4.2, pH 7.18, HCO₃ 12 → Diagnosis:", "options": [{"letter": "A", "text": "Diabetic ketoacidosis"}, {"letter": "B", "text": "Hyperosmolar hyperglycemic state"}, {"letter": "C", "text": "Lactic acidosis"}, {"letter": "D", "text": "Alcoholic ketoacidosis"}], "answer": "A", "explanation": "DKA = **all three**: glucose ≥200 (or known DM) + **BHB ≥3.0** (or urine ketones ≥2+) + **pH <7.3 and/or HCO₃ <18**."}], "checkpoints": [{"stem": "Preferred ketone test for diagnosing and monitoring DKA → Test:", "options": [{"letter": "A", "text": "Blood β-hydroxybutyrate"}, {"letter": "B", "text": "Urine ketone strip"}, {"letter": "C", "text": "Serum acetone"}, {"letter": "D", "text": "Breath ketone meter"}], "answer": "A", "explanation": "**Blood BHB** — urine strips detect acetoacetate, not the predominant ketone."}]}}, {"id": "41", "group": 41, "slide": 67, "section": "Euglycemic DKA", "topic": "DKA", "skill": "Complications", "stem": "What diagnosis should be suspected in a patient taking an SGLT2 inhibitor and following a ketogenic diet who develops nausea, abdominal pain, Kussmaul respirations, and a glucose level of 170 mg/dL?", "options": [{"letter": "A", "text": "Euglycemic DKA"}, {"letter": "B", "text": "HHS"}, {"letter": "C", "text": "Gastroenteritis"}, {"letter": "D", "text": "Hypoglycemia"}], "answer": "A", "explanation": "**Euglycemic DKA** (glucose <200) — SGLT2i, keto/low carb, pregnancy, fasting, alcohol. Rule: diabetes + anion-gap acidosis → **check ketones regardless of glucose**.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "**Kussmaul breathing** means metabolic acidosis — a normal-ish glucose doesn't rule out DKA.", "stem": "SGLT2 inhibitors lower glucose by…", "options": [{"letter": "A", "text": "Excreting glucose in urine"}, {"letter": "B", "text": "Increasing insulin release"}], "answer": "A", "explanation": "Glucosuria keeps glucose deceptively low while ketones build.", "clarify": [{"stem": "Kussmaul respirations signal…", "options": [{"letter": "A", "text": "Metabolic acidosis"}, {"letter": "B", "text": "Respiratory alkalosis"}], "answer": "A", "explanation": "Deep breathing compensates for acidosis."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "On an SGLT2 inhibitor + keto diet: nausea, abdominal pain, Kussmaul, glucose 170 → Diagnosis:", "options": [{"letter": "A", "text": "Euglycemic DKA"}, {"letter": "B", "text": "Gastroenteritis"}, {"letter": "C", "text": "HHS"}, {"letter": "D", "text": "Hypoglycemia"}], "answer": "A", "explanation": "**Euglycemic DKA** (glucose <200) — SGLT2i, keto/low carb, pregnancy, fasting, alcohol. Rule: diabetes + anion-gap acidosis → **check ketones regardless of glucose**."}], "checkpoints": [{"stem": "Patient on an SGLT2 inhibitor → Diet to discourage:", "options": [{"letter": "A", "text": "Ketogenic diet"}, {"letter": "B", "text": "Mediterranean diet"}, {"letter": "C", "text": "DASH diet"}, {"letter": "D", "text": "Plate-method diet"}], "answer": "A", "explanation": "**SGLT2i + ketogenic diet** → euglycemic DKA risk."}]}}, {"id": "42", "group": 42, "slide": 68, "section": "DKA severity", "topic": "DKA", "skill": "Diagnostics & imaging", "stem": "How severe is diabetic ketoacidosis in a stuporous patient with a pH of 6.95 and bicarbonate of 8 mmol/L, and what level of care is appropriate?", "options": [{"letter": "A", "text": "Mild → outpatient"}, {"letter": "B", "text": "Moderate → step-down"}, {"letter": "C", "text": "Severe → ICU"}, {"letter": "D", "text": "Mild → ED observation"}], "answer": "C", "explanation": "Grade DKA by **acidosis + mental stat um before insulin", "topic": "DKA", "skill": "Management", "stem": "What is the next step in treating diabetic ketoacidosis when the initial potassium level is 3.1 mmol/L?", "options": [{"letter": "A", "text": "Give IV bicarbonate first"}, {"letter": "B", "text": "Start insulin drip immediately"}, {"letter": "C", "text": "Restrict IV fluids for now"}, {"letter": "D", "text": "Hold insulin; replace potassium first"}], "answer": "D", "explanation": "Check K⁺ **before insulin** — insulin drives K⁺ into cells → fatal arrhythmia. **K⁺ <3.5 → hold insulin, replace K⁺ first**.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Insulin shifts potassium **into** cells, lowering serum K⁺ further.", "stem": "Insulin moves potassium…", "options": [{"letter": "A", "text": "Into cells (lowers serum K⁺)"}, {"letter": "B", "text": "Out of cells (raises serum K⁺)"}], "answer": "A", "explanation": "Starting insulin with low K⁺ → dangerous hypokalemia.", "clarify": [{"stem": "Severe hypokalemia risks…", "options": [{"letter": "A", "text": "Cardiac arrhythmia"}, {"letter": "B", "text": "Hyperglycemia"}], "answer": "A", "explanation": "Arrhythmia is the lethal risk."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "DKA, initial K⁺ 3.1 mmol/L → Next step:", "options": [{"letter": "A", "text": "Hold insulin; replace potassium first"}, {"letter": "B", "text": "Start insulin drip immediately"}, {"letter": "C", "text": "Give IV bicarbonate first"}, {"letter": "D", "text": "Restrict IV fluids for now"}], "answer": "A", "explanation": "Check K⁺ **before insulin** — insulin drives K⁺ into cells → fatal arrhythmia. **K⁺ <3.5 → hold insulin, replace K⁺ first**."}], "checkpoints": [{"stem": "Standard IV insulin infusion rate for DKA and HHS → Rate:", "options": [{"letter": "A", "text": "0.1 units/kg/h"}, {"letter": "B", "text": "1 unit/kg/h"}, {"letter": "C", "text": "0.01 units/kg/h"}, {"letter": "D", "text": "10 units/h fixed"}], "answer": "A", "explanation": "**0.1 units/kg/h** for both crises."}]}}, {"id": "47", "group": 47, "slide": 71, "section": "HHS correction speed", "topic": "HHS", "skill": "Complications", "stem": "What complication can result from lowering glucose or sodium too rapidly during treatment of hyperosmolar hyperglycemic state?", "options": [{"letter": "A", "text": "Cerebral edema"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Diabetic retinopathy"}, {"letter": "D", "text": "Pancreatitis"}], "answer": "A", "explanation": "HHS safety limits: glucose fall ≤90–120 mg/dL/h and Na⁺ drop ≤10 mmol/L per 24 h — rapid osmolality shifts → **cerebral edema**.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Rapidly lowering serum osmolality pulls water **into brain cells**.", "stem": "Water moves toward the compartment with…", "options": [{"letter": "A", "text": "Higher osmolality"}, {"letter": "B", "text": "Lower osmolality"}], "answer": "A", "explanation": "If serum osm falls fast, the brain becomes relatively hyperosmolar → swelling.", "clarify": [{"stem": "Should HHS glucose be dropped as fast as possible?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Gradual correction protects the brain."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Treating HHS → Complication of lowering glucose/sodium too fast:", "options": [{"letter": "A", "text": "Cerebral edema"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Pancreatitis"}, {"letter": "D", "text": "Diabetic retinopathy"}], "answer": "A", "explanation": "HHS safety limits: glucose fall ≤90–120 mg/dL/h and Na⁺ drop ≤10 mmol/L per 24 h — rapid osmolality shifts → **cerebral edema**."}], "checkpoints": [{"stem": "After any DKA/HHS admission, ADA recommends screening for → Issue:", "options": [{"letter": "A", "text": "Social determinants (e.g., insulin rationing)"}, {"letter": "B", "text": "Celi  retinopathy → Lesion:", "options": [{"letter": "A", "text": "Microaneurysms"}, {"letter": "B", "text": "Neovascularization"}, {"letter": "C", "text": "Cotton-wool spots"}, {"letter": "D", "text": "Vitreous hemorrhage"}], "answer": "A", "explanation": "**Microaneurysms** (tiny capillary outpouchings) are earliest; hard exudates = leakage; cotton-wool spots = nerve-fiber infarcts; **neovascularization defines proliferative** disease."}], "checkpoints": [{"stem": "Fragile new retinal vessels prone to hemorrhage → Stage:", "options": [{"letter": "A", "text": "Proliferative diabetic retinopathy"}, {"letter": "B", "text": "Mild NPDR"}, {"letter": "C", "text": "Macular edema only"}, {"letter": "D", "text": "Hypertensive retinopathy"}], "answer": "A", "explanation": "**Neovascularization = PDR**."}]}}, {"id": "51", "group": 51, "slide": 77, "section": "Eye screening", "topic": "Diabetic retinopathy", "skill": "Diagnostics & imaging", "stem": "When should retinopathy screening begin in a patient with newly diagnosed type 2 diabetes?", "options": [{"letter": "A", "text": "Fluorescein angiogram yearly"}, {"letter": "B", "text": "Only if vision changes"}, {"letter": "C", "text": "Eye exam 5 years after diagnosis"}, {"letter": "D", "text": "Dilated eye exam at diagnosis"}], "answer": "D", "explanation": "T2: **dilated eye exam (or validated retinal photography) at diagnosis**, then at least annually (1–2 years after a normal exam). Vision-threatening disease is asymptomatic.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Type 2 is often present for years before diagnosis — damage may already exist.", "stem": "Why screen type 2 at diagnosis rather than later?", "options": [{"letter": "A", "text": "Diabetes may have been present for years"}, {"letter": "B", "text": "Type 2 retinopathy is always symptomatic"}], "answer": "A", "explanation": "Silent years of hyperglycemia precede T2 diagnosis.", "clarify": [{"stem": "Wait for visual symptoms before screening?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Vision-threatening disease is asymptomatic."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Newly diagnosed type 2 diabetes → Retinopathy screening:", "options": [{"letter": "A", "text": "Dilated eye exam at diagnosis"}, {"letter": "B", "text": "Eye exam 5 years after diagnosis"}, {"letter": "C", "text": "Only if vision changes"}, {"letter": "D", "text": "Fluorescein angiogram yearly"}], "answer": "A", "explanation": "T2: **dilated eye exam (or validated retinal photography) at diagnosis**, then at least annually (1–2 years after a normal exam). Vision-threatening disease is asymptomatic."}], "checkpoints": [{"stem": "After a normal dilated eye exam, rescreening may extend to → Interval:", "options": [{"letter": "A", "text": "Every 1–2 years"}, {"letter": "B", "text": "Every 5 years"}, {"letter": "C", "text": "Every 3 months"}, {"letter": "D", "text": "Never again"}], "answer": "A", "explanation": "Annually, or **every 1–2 years** after a normal exam."}]}}, {"id": "52", "group": 52, "slide": 79, "section": "DKD screening test", "topic": "Diabetic kidney disease", "skill": "Diagnostics & imaging", "stem": "Which tests are used to screen for diabetic kidney disease?", "options": [{"letter": "A", "text": "Urine dipstick for protein"}, {"letter": "B", "text": "24-hour urine creatinine"}, {"letter": "C", "text": "Renal ultrasound"}, {"letter": "D", "text": "Spot UACR + eGFR"}], "answer": "D", "explanation": "Screen with **spot urine albumin-to-creatinine ratio + eGFR** at least annually — order the ACR, **not a dipstick**.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Dipsticks miss early, moderately increased albuminuria.", "stem": "Albuminuria threshold for DKD is UACR…", "options": [{"letter": "A", "text": "≥30 mg/g"}, {"letter": "B", "text": "≥300 mg/g only"}], "answer": "A", "explanation": "≥30 mg/g = albuminuria (A2 30–300, A3 >300).", "clarify": [{"stem": "DKD diagnosis requires abnormality persisting for…", "options": [{"letter": "A", "text": "≥3 months"}, {"letter": "B", "text": "1 day"}], "answer": "A", "explanation": "Repeat abnormal results in 3–6 months."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Diabetic kidney disease screening → Tests:", "options": [{"letter": "A", "text": "Spot UACR + eGFR"}, {"letter": "B", "text": "Urine dipstick for protein"}, {"letter": "C", "text": "24-hour urine creatinine"}, {"letter": "D", "text": "Renal ultrasound"}], "answer": "A", "explanation": "Screen with **spot urine albumin-to-creatinine ratio + eGFR** at least annually — order the ACR, **not a dipstick**."}], "checkpoints": [{"stem": "Type 1 diabetes → When to start kidney disease screening:", "options": [{"letter": "A", "text": "5 years after diagnosis"}, {"letter": "B", "text": "At diagnosis"}, {"letter": "C", "text": "At age 35"}, {"letter": "D", "text": "Only with edema"}], "answer": "A", "explanation": "**T1: 5 years after diagnosis**; T2: at diagnosis."}]}}, {"id": "53", "group": 53, "slide": 80, "section": "Albuminuria treatment", "topic": "Diabetic kidney disease", "skill": "Management", "stem": "Which antihypertensive medication class should be used first in a patient with diabetes, hypertension, and a urine albumin-to-creatinine ratio of 400 mg/g?", "options": [{"letter": "A", "text": "Loop diuretic"}, {"letter": "B", "text": "ACE inhibitor or ARB"}, {"letter": "C", "text": "Alpha-blocker"}, {"letter": "D", "text": "Beta-blocker"}], "answer": "B", "explanation": "DKD pillar 1: **ACEi or ARB** titrated to max tolerated dose for albuminuria/HTN; then **SGLT2i**, finerenone for persistent albuminuria, and global risk control.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Choose the class that lowers **intraglomerular pressure** and reduces albuminuria.", "stem": "After starting an ACEi/ARB, monitor…", "options": [{"letter": "A", "text": "Creatinine and potassium"}, {"letter": "B", "text": "Glucose only"}], "answer": "A", "explanation": "RAS blockade can raise K⁺ and creatinine.", "clarify": [{"stem": "Is combining two drug classes needed if BP ≥150/90?", "options": [{"letter": "A", "text": "Yes — start two agents"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "≥150/90 → two agents."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Diabetes with hypertension and UACR 400 mg/g → First antihypertensive class:", "options": [{"letter": "A", "text": "ACE inhibitor or ARB"}, {"letter": "B", "text": "Beta-blocker"}, {"letter": "C", "text": "Loop diuretic"}, {"letter": "D", "text": "Alpha-blocker"}], "answer": "A", "explanation": "DKD pillar 1: **ACEi or ARB** titrated to max tolerated dose for albuminuria/HTN; then **SGLT2i**, finerenone for persistent albuminuria, and global risk control."}], "checkpoints": [{"stem": "BP goal for most adults with diabetes → Target:", "options": [{"letter": "A", "text": "<130/80"}, {"letter": "B", "text": "<140/90"}, {"letter": "C", "text": "<150/90"}, {"letter": "D", "text": "<120/70 for everyone"}], "answer": "A", "explanation": "**<130/80** when safely attainable (SBP <120 if high CV/renal risk)."}]}}, {"id": "54", "group": 54, "slide": 84, "section": "Statin intensity", "topic": "Atherosclerosis & CV risk", "skill": "Management", "stem": "What lipid-lowering therapy is appropriate for a patient with diabetes and a prior myocardial infarction?", "options": [{"letter": "A", "text": "No statin unless LDL >190"}, {"letter": "B", "text": "Fish oil supplement alone"}, {"letter": "C", "text": "Moderate-intensity statin, LDL <70"}, {"letter": "D", "text": "High-intensity statin, LDL <55"}], "answer": "D", "explanation": "Secondary prevention (DM + ASCVD): **high-intensity statin, LDL <55 and ≥50% reduction**; primary prevention: moderate-intensity statin, LDL <70.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "A prior event = **secondary** prevention → the most aggressive tier.", "stem": "No ASCVD yet → statin intensity:", "options": [{"letter": "A", "text": "Moderate-intensity (LDL <70)"}, {"letter": "B", "text": "No statin"}], "answer": "A", "explanation": "Primary prevention still gets a statin.", "clarify": [{"stem": "Diabetic dyslipidemia pattern →", "options": [{"letter": "A", "text": "↑TG, ↓HDL, small dense LDL"}, {"letter": "B", "text": "↓TG, ↑HDL"}], "answer": "A", "explanation": "Classic atherogenic pattern."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Diabetes with prior MI → Lipid therapy:", "options": [{"letter": "A", "text": "High-intensity statin, LDL <55"}, {"letter": "B", "text": "Moderate-intensity statin, LDL <70"}, {"letter": "C", "text": "No statin unless LDL >190"}, {"letter": "D", "text": "Fish oil supplement alone"}], "answer": "A", "explanation": "Secondary prevention (DM + ASCVD): **high-intensity statin, LDL <55 and ≥50% reduction**; primary prevention: moderate-intensity statin, LDL <70."}], "checkpoints": [{"stem": "Aspirin for diabetes WITHOUT established ASCVD → Recommendation:", "options": [{"letter": "A", "text": "Not routine"}, {"letter": "B", "text": "Required for all"}, {"letter": "C", "text": "Only for type 1"}, {"letter": "D", "text": "Only if A1C >9%"}], "answer": "A", "explanation": "Aspirin is **not routine for primary prevention** — reserve for secondary prevention."}]}}, {"id": "55", "group": 55, "slide": 86, "section": "DPN pattern", "topic": "Neuropathy & diabetic foot", "skill": "Identification", "stem": "Which diagnosis is most likely in a patient with numbness, tingling, and burning in both feet that worsen at night, along with decreased ankle reflexes?", "options": [{"letter": "A", "text": "Charcot neuroarthropathy"}, {"letter": "B", "text": "Peripheral artery disease"}, {"letter": "C", "text": "Lumbar radiculopathy"}, {"letter": "D", "text": "Distal symmetric polyneuropathy"}], "answer": "D", "explanation": "**Distal symmetric 'stocking-glove' polyneuropathy**, feet before hands — a **diagnosis of exclusion** (rule out reversible causes first); ~50% are asymptomatic.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Length-dependent axonal injury hits the **longest nerves first** — the feet, symmetrically.", "stem": "Diabetic polyneuropathy is typically…", "options": [{"letter": "A", "text": "Symmetric and distal"}, {"letter": "B", "text": "Unilateral and proximal"}], "answer": "A", "explanation": "Stocking-glove, both feet.", "clarify": [{"stem": "PAD classically causes…", "options": [{"letter": "A", "text": "Claudication with walking"}, {"letter": "B", "text": "Burning at rest at night"}], "answer": "A", "explanation": "Claudication = vascular, not neuropathic."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Numbness, tingling, burning in both feet worse at night, ↓ ankle reflexes → Diagnosis:", "options": [{"letter": "A", "text": "Distal symmetric polyneuropathy"}, {"letter": "B", "text": "Charcot neuroarthropathy"}, {"letter": "C", "text": "Peripheral artery disease"}, {"letter": "D", "text": "Lumbar radiculopathy"}], "answer": "A", "explanation": "**Distal symmetric 'stocking-glove' polyneuropathy**, feet before hands — a **diagnosis of exclusion** (rule out reversible causes first); ~50% are asymptomatic."}], "checkpoints": [{"stem": "Diabetic neuropathy is a diagnosis of exclusion because → Reason:", "options": [{"letter": "A", "text": "Other causes may be reversible"}, {"letter": "B", "text": "It never occurs in diabetes"}, {"letter": "C", "text": "NCS are always required"}, {"letter": "D", "text": "It is always painful"}], "answer": "A", "explanation": "Rule out **reversible causes** first; routine NCS/EMG not needed for typical DPN."}]}}, {"id": "56", "group": 56, "slide": 87, "section": "CAN silent MI", "topic": "Neuropathy & diabetic foot", "skill": "Complications", "stem": "What should be suspected in a patient with diabetes, orthostatic hypotension, and a fixed heart rate who develops nausea and dyspnea without chest pain?", "options": [{"letter": "A", "text": "Hypoglycemic episode"}, {"letter": "B", "text": "Acute anxiety attack"}, {"letter": "C", "text": "Gastroparesis flare"}, {"letter": "D", "text": "Silent myocardial infarction"}], "answer": "D", "explanation": "**Cardiovascular autonomic neuropathy** → independent risk for CV death and **silent MI**; nausea, fatigue, or dyspnea may BE the MI.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Autonomic neuropathy can blunt **cardiac pain** signals.", "stem": "Is absence of chest pain reassuring in autonomic neuropathy?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Atypical symptoms may be ischemia.", "clarify": [{"stem": "Orthostatic hypotension and a fixed HR suggest…", "options": [{"letter": "A", "text": "Autonomic neuropathy"}, {"letter": "B", "text": "Hyperthyroidism"}], "answer": "A", "explanation": "Classic CAN signs."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Diabetic with orthostasis and fixed heart rate, now nausea and dyspnea without chest pain → Concern:", "options": [{"letter": "A", "text": "Silent myocardial infarction"}, {"letter": "B", "text": "Gastroparesis flare"}, {"letter": "C", "text": "Hypoglycemic episode"}, {"letter": "D", "text": "Acute anxiety attack"}], "answer": "A", "explanation": "**Cardiovascular autonomic neuropathy** → independent risk for CV death and **silent MI**; nausea, fatigue, or dyspnea may BE the MI."}], "checkpoints": [{"stem": "Painful diabetic neuropathy → Medication class to AVOID:", "options": [{"letter": "A", "text": "Opioids (including tramadol)"}, {"letter": "B", "text": "Gabapentinoids"}, {"letter": "C", "text": "Duloxetine"}, {"letter": "D", "text": "Tricyclic antidepressants"}], "answer": "A", "explanation": "Treat with **gabapentinoids, duloxetine, TCAs**; ADA recommends **against opioids/tramadol**."}]}}, {"id": "57", "group": 57, "slide": 88, "section": "Neuropathy screening", "topic": "Neuropathy & diabetic foot", "skill": "Diagnostics & imaging", "stem": "Which test should be performed annually to screen for loss of protective sensation?", "options": [{"letter": "A", "text": "Nerve biopsy"}, {"letter": "B", "text": "Nerve conduction study"}, {"letter": "C", "text": "Lumbar MRI"}, {"letter": "D", "text": "10-g monofilament"}], "answer": "D", "explanation": "Screen with **10-g monofilament** plus vibration, pinprick/temperature, ankle reflexes; **T2 at diagnosis, T1 at 5 years**, then annually.", "objective": "", "bg": "#e0f6ff", "remediation": {"steps": [{"teach": "Screening uses quick bedside tools; electrodiagnostics aren't routine.", "stem": "Are NCS/EMG routinely needed for typical diabetic neuropathy?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Bedside exam suffices.", "clarify": [{"stem": "Neuropathy screening in type 2 begins…", "options": [{"letter": "A", "text": "At diagnosis"}, {"letter": "B", "text": "5 years after diagnosis"}], "answer": "A", "explanation": "T2 at dx; T1 at 5 years."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Annual screening test for loss of protective sensation → Test:", "options": [{"letter": "A", "text": "10-g monofilament"}, {"letter": "B", "text": "Nerve conduction study"}, {"letter": "C", "text": "Nerve biopsy"}, {"letter": "D", "text": "Lumbar MRI"}], "answer": "A", "explanation": "Screen with **10-g monofilament** plus vibration, pinprick/temperature, ankle reflexes; **T2 at diagnosis, T1 at 5 years**, then annually."}], "checkpoints": [{"stem": "Patient with loss of protective sensation (LOPS) → Foot exam frequency:", "options": [{"letter": "A", "text": "Every visit"}, {"letter": "B",
