<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  /* FLAG-PATCH: flag for review */
  .flagrow { margin-top: 12px; }
  .flagbtn { font: inherit; font-size: 0.82em; font-weight: 600; cursor: pointer; background: transparent;
    border: 1.5px dashed var(--border); border-radius: 8px; padding: 4px 11px; color: var(--ink-soft); }
  .flagbtn:hover { border-color: var(--amber); color: var(--amber); }
  .flagbtn.on { background: var(--amber-bg); border-style: solid; border-color: var(--amber); color: var(--amber); }
  .flagtag { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px;
    margin-left: 8px; vertical-align: middle; background: var(--amber-bg); color: var(--amber); }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

ent C-peptide → Diagnosis:", "options": [{"letter": "A", "text": "Type 2 diabetes"}, {"letter": "B", "text": "Type 1 diabetes"}, {"letter": "C", "text": "Prediabetes"}, {"letter": "D", "text": "Insulinoma"}, {"letter": "E", "text": "Gestational diabetes"}], "answer": "B", "explanation": "C-peptide is secreted 1:1 with endogenous insulin — low/absent = β-cell failure. T2DM: C-peptide high / not low, antibodies negative.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "26", "group": 26, "stem": "FNA cytology: insufficient / non-diagnostic → Next step:", "options": [{"letter": "A", "text": "Repeat FNA under ultrasound guidance"}, {"letter": "B", "text": "Serial US at 6–18 months"}, {"letter": "C", "text": "RAIU scan of the nodule"}, {"letter": "D", "text": "Diagnostic surgery"}, {"letter": "E", "text": "Molecular testing panel"}], "answer": "A", "explanation": "'Oops, do-over' — repeat the FNA, US-guided.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "27", "group": 27, "stem": "Low calcium with a low-normal PTH → Interpretation:", "options": [{"letter": "A", "text": "Normal finding"}, {"letter": "B", "text": "Pseudohypoparathyroidism"}, {"letter": "C", "text": "Hypoparathyroidism"}, {"letter": "D", "text": "Vitamin D deficiency"}, {"letter": "E", "text": "Chronic kidney disease"}], "answer": "C", "explanation": "PTH should be high when calcium is low.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "28", "group": 28, "stem": "Hypercortisolism proven → Next test to find the level:", "options": [{"letter": "A", "text": "Aldosterone:renin ratio"}, {"letter": "B", "text": "Cosyntropin stimulation"}, {"letter": "C", "text": "Plasma ACTH"}, {"letter": "D", "text": "MRI pituitary"}, {"letter": "E", "text": "CT adrenals"}], "answer": "C", "explanation": "Prove the disease, then ACTH: low → adrenal (ACTH-independent); high/normal → pituitary or ectopic (ACTH-dependent).", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "29", "group": 29, "stem": "Annual labs in established diabetes → The lecturer's short list:", "options": [{"letter": "A", "text": "CMP, lipid panel, UACR (plus A1C)"}, {"letter": "B", "text": "CBC, ESR, CRP"}, {"letter": "C", "text": "TSH, cortisol, PTH"}, {"letter": "D", "text": "Islet antibodies and C-peptide"}, {"letter": "E", "text": "Liver biopsy and ultrasound"}], "answer": "A", "explanation": "CMP (K, Cr/eGFR, LFTs), lipids, UACR at least annually; A1C q3–6 months.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "30", "group": 30, "stem": "Most common cause of secondary osteoporosis → Cause:", "options": [{"letter": "A", "text": "Hyperthyroidism"}, {"letter": "B", "text": "Chronic glucocorticoids"}, {"letter": "C", "text": "Celiac disease"}, {"letter": "D", "text": "Immobilization"}, {"letter": "E", "text": "Primary hyperparathyroidism"}], "answer": "B", "explanation": "Exogenous steroids; ACR: most older patients on prednisone qualify for bisphosphonates.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "31", "group": 31, "stem": "Radioisotope used to ABLATE the thyroid → Isotope:", "options": [{"letter": "A", "text": "Technetium-99m sestamibi"}, {"letter": "B", "text": "Gallium-67"}, {"letter": "C", "text": "I-131"}, {"letter": "D", "text": "I-123"}, {"letter": "E", "text": "F-18 FDG"}], "answer": "C", "explanation": "123 = diagnose (gamma only); 131 = destroy (gamma + beta). RAIU percent sometimes calculates the I-131 dose.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "32", "group": 32, "stem": "Low BMD + markedly elevated creatinine → Mechanism of bone loss:", "options": [{"letter": "A", "text": "Secondary hyperparathyroidism"}, {"letter": "B", "text": "Multiple myeloma"}, {"letter": "C", "text": "Primary hyperparathyroidism"}, {"letter": "D", "text": "Vitamin D intoxication"}, {"letter": "E", "text": "Hyperthyroidism"}], "answer": "A", "explanation": "The reason creatinine is on the baseline panel.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "33", "group": 33, "stem": "Asymptomatic patient, single FPG 131 → Next step:", "options": [{"letter": "A", "text": "Order a C-peptide level"}, {"letter": "B", "text": "Diagnose diabetes now"}, {"letter": "C", "text": "Start basal insulin now"}, {"letter": "D", "text": "Order islet autoantibodies"}, {"letter": "E", "text": "Repeat the same test on a subsequent day"}], "answer": "E", "explanation": "Without unequivocal symptomatic hyperglycemia, confirm with the same test on another day; two concordant different tests = done.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "34", "group": 34, "stem": "Hyperthyroidism with LOW RAIU → Drug class that will NOT help:", "options": [{"letter": "A", "text": "Glucocorticoids"}, {"letter": "B", "text": "Levothyroxine in the hypo phase"}, {"letter": "C", "text": "Acetaminophen"}, {"letter": "D", "text": "Thionamides (methimazole / PTU)"}, {"letter": "E", "text": "Beta-blockers"}], "answer": "D", "explanation": "Low uptake means nothing new is being synthesized — thionamides have nothing to block. Treat symptomatically (beta-blocker, then thyroxine in the hypo phase).", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "35", "group": 35, "stem": "History of gestational diabetes, now postpartum → Lifelong screening interval:", "options": [{"letter": "A", "text": "Only if symptomatic"}, {"letter": "B", "text": "Every 6 months"}, {"letter": "C", "text": "Every 3 months"}, {"letter": "D", "text": "Every 5 years"}, {"letter": "E", "text": "Every 1–3 years"}], "answer": "E", "explanation": "A history of GDM means screening every 1–3 years for life.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "36", "group": 36, "stem": "Glucosuria on routine urinalysis → Meaning:", "options": [{"letter": "A", "text": "Check the plasma glucose"}, {"letter": "B", "text": "Diagnose diabetes insipidus"}, {"letter": "C", "text": "Diagnose diabetes"}, {"letter": "D", "text": "Diagnose prediabetes"}, {"letter": "E", "text": "Normal — no action"}], "answer": "A", "explanation": "Glucosuria appears above the renal threshold; confirm with plasma glucose.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "37", "group": 37, "stem": "Fever, obtundation, rapid AF on top of Graves with a pneumonia → Diagnosis:", "options": [{"letter": "A", "text": "Pheochromocytoma crisis"}, {"letter": "B", "text": "Myxedema coma"}, {"letter": "C", "text": "Addisonian crisis"}, {"letter": "D", "text": "Thyroid storm"}, {"letter": "E", "text": "Sepsis alone"}], "answer": "D", "explanation": "Thyroid storm with a precipitant → ICU: PTU first (also blocks T4→T3), beta-blockers, glucocorticoids, supportive care.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "38", "group": 38, "stem": "Loop diuretics, bisphosphonates, denosumab, calcitonin, foscarnet → Electrolyte effect:", "options": [{"letter": "A", "text": "Hypocalcemia"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Hypophosphatemia"}, {"letter": "D", "text": "Hyponatremia"}, {"letter": "E", "text": "Hypercalcemia"}], "answer": "A", "explanation": "Check the med list before the PTH (Rule 7).", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "39", "group": 39, "stem": "Low BMD + HIGH calcium → Lab to add:", "options": [{"letter": "A", "text": "SPEP"}, {"letter": "B", "text": "ESR"}, {"letter": "C", "text": "Calcitriol"}, {"letter": "D", "text": "Intact PTH"}, {"letter": "E", "text": "Testosterone"}], "answer": "D", "explanation": "High Ca → PTH → primary hyperparathyroidism; bone loss is reversible with parathyroidectomy.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "40", "group": 40, "stem": "Free T4 0.1 (low) with TSH 4 (normal range) → Interpretation:", "options": [{"letter": "A", "text": "Biotin interference"}, {"letter": "B", "text": "Central hypothyroidism"}, {"letter": "C", "text": "Primary hypothyroidism"}, {"letter": "D", "text": "Euthyroid state"}, {"letter": "E", "text": "Subclinical hypothyroidism"}], "answer": "B", "explanation": "TSH should be sky-high; a pituitary that fails to respond = central disease. Check the adrenal axis too.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "41", "group": 41, "stem": "Confirmed primary aldosteronism, CT shows a unilateral 1.3 cm adenoma → Treatment:", "options": [{"letter": "A", "text": "Bilateral adrenalectomy"}, {"letter": "B", "text": "Unilateral adrenalectomy"}, {"letter": "C", "text": "Dexamethasone suppression"}, {"letter": "D", "text": "Spironolactone for life"}, {"letter": "E", "text": "Observation"}], "answer": "B", "explanation": "Conn's adenoma (~2/3 of cases) is cured surgically; imaging after biochemical proof decides surgery vs drug.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "42", "group": 42, "stem": "Advanced CKD or hypoparathyroidism needing vitamin D → Form to give:", "options": [{"letter": "A", "text": "Cholecalciferol"}, {"letter": "B", "text": "Dietary vitamin D only"}, {"letter": "C", "text": "Calcidiol"}, {"letter": "D", "text": "Ergocalciferol"}, {"letter": "E", "text": "Calcitriol"}], "answer": "E", "explanation": "Impaired (or PTH-dependent) 1α-hydroxylation means native vitamin D cannot be activated — give calcitriol.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "43", "group": 43, "stem": "Secondary adrenal insufficiency → Imaging:", "options": [{"letter": "A", "text": "Adrenal ultrasound"}, {"letter": "B", "text": "Brain MRI with contrast"}, {"letter": "C", "text": "Abdominal CT"}, {"letter": "D", "text": "Chest x-ray"}, {"letter": "E", "text": "Sestamibi scan"}], "answer": "B", "explanation": "Central cause → MRI pituitary with contrast and check TSH/fT4, gonadal axis, GH (hypopituitarism).", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "44", "group": 44, "stem": "Suspected cortisol EXCESS → Time to draw cortisol:", "options": [{"letter": "A", "text": "Midnight"}, {"letter": "B", "text": "Pre-dinner"}, {"letter": "C", "text": "Noon"}, {"letter": "D", "text": "8 AM"}, {"letter": "E", "text": "Random"}], "answer": "A", "explanation": "A high midnight value = loss of diurnal rhythm = Cushing's; the salivary kit is mailed from home on ≥2 nights.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "45", "group": 45, "stem": "Hyperthyroid, exquisitely tender gland after a URI, ESR >50, no antibodies → Diagnosis:", "options": [{"letter": "A", "text": "Postpartum thyroiditis"}, {"letter": "B", "text": "De Quervain's thyroiditis"}, {"letter": "C", "text": "Hashimoto's thyroiditis"}, {"letter": "D", "text": "Graves disease"}, {"letter": "E", "text": "Toxic adenoma"}], "answer": "B", "explanation": "Pain + high ESR + no antibodies + low RAIU = de Quervain's, the MCC of a painful thyroid; triphasic and self-limited.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "46", "group": 46, "stem": "High phosphate with LOW calcium → Diagnoses:", "options": [{"letter": "A", "text": "Hypoparathyroidism or CKD"}, {"letter": "B", "text": "Graves or thyroiditis"}, {"letter": "C", "text": "Vitamin D deficiency or FHH"}, {"letter": "D", "text": "Sarcoidosis or lymphoma"}, {"letter": "E", "text": "Primary HPT or PTHrP"}], "answer": "A", "explanation": "Low phosphate with HIGH calcium → PHPT or PTHrP (Rule 8 fingerprints).", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "47", "group": 47, "stem": "Type 2 diabetes → Annual liver screening test:", "options": [{"letter": "A", "text": "Hepatitis panel"}, {"letter": "B", "text": "Transient elastography first"}, {"letter": "C", "text": "FIB-4 score"}, {"letter": "D", "text": "Liver ultrasound"}, {"letter": "E", "text": "Liver biopsy"}], "answer": "C", "explanation": "Annual FIB-4; ≥1.3 → transient elastography; LSM >12 kPa → hepatology (MASLD).", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "48", "group": 48, "stem": "≥2 islet autoantibodies + NORMAL glucose, no symptoms → Stage:", "options": [{"letter": "A", "text": "LADA"}, {"letter": "B", "text": "Stage 1"}, {"letter": "C", "text": "Prediabetes"}, {"letter": "D", "text": "Stage 3"}, {"letter": "E", "text": "Stage 2"}], "answer": "B", "explanation": "Stage 1 = ≥2 antibodies + normoglycemia → refer endocrinology; ~40% symptomatic in 5 yr, >90% in 15 yr.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "49", "group": 49, "stem": "55-year-old man on prednisone 10 mg for 6 months → Screening decision (NOF):", "options": [{"letter": "A", "text": "FRAX without a DXA"}, {"letter": "B", "text": "DXA now"}, {"letter": "C", "text": "Heel ultrasound only"}, {"letter": "D", "text": "No screening until age 70"}, {"letter": "E", "text": "Screen only if he fractures"}], "answer": "B", "explanation": "Prednisone ≥5 mg for ≥3 months is an NOF risk factor; most older patients on it will qualify for bisphosphonates.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "50", "group": 50, "stem": "ONE positive islet autoantibody, normal glucose (not IA-2) → Prognosis and plan:", "options": [{"letter": "A", "text": "Stage 2 — start teplizumab"}, {"letter": "B", "text": "No further testing is ever needed"}, {"letter": "C", "text": "Refer for insulin pump initiation"}, {"letter": "D", "text": "Stage 3 — start insulin now"}, {"letter": "E", "text": "Low risk — repeat antibodies and glucose at intervals"}], "answer": "E", "explanation": "Risk is the NUMBER of antibodies, not which one (except IA-2 in 2026).", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "51", "group": 51, "stem": "Thiazides and lithium → Electrolyte effect:", "options": [{"letter": "A", "text": "Hyperphosphatemia"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Mild hypercalcemia"}, {"letter": "D", "text": "Hypoglycemia"}, {"letter": "E", "text": "Hypocalcemia"}], "answer": "C", "explanation": "Stop and remeasure before calling it PHPT; thiazides can unmask PHPT.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "52", "group": 52, "stem": "Mild hypercalcemia in a patient on hydrochlorothiazide or lithium → The move:", "options": [{"letter": "A", "text": "Refer for parathyroidectomy"}, {"letter": "B", "text": "Order a sestamibi scan now"}, {"letter": "C", "text": "Stop the drug and remeasure calcium"}, {"letter": "D", "text": "Start cinacalcet now"}, {"letter": "E", "text": "Order a PTHrP level"}], "answer": "C", "explanation": "Thiazides/lithium cause mild hypercalcemia with low/inappropriately normal PTH and can unmask PHPT — remeasure off the drug first.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "53", "group": 53, "stem": "Medullary thyroid CA + pheochromocytoma + mucosal neuromas / marfanoid habitus → Syndrome:", "options": [{"letter": "A", "text": "MEN1"}, {"letter": "B", "text": "APS-1"}, {"letter": "C", "text": "MEN2A"}, {"letter": "D", "text": "Carney complex"}, {"letter": "E", "text": "MEN2B"}], "answer": "E", "explanation": "Mucosal neuromas (lips, tongue, buccal) and marfanoid body habitus mark MEN2B.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "54", "group": 54, "stem": "Thyroid ultrasound showing a hypervascular gland ('thyroid inferno') → Diagnosis:", "options": [{"letter": "A", "text": "Papillary carcinoma"}, {"letter": "B", "text": "Graves disease"}, {"letter": "C", "text": "Hashimoto's thyroiditis"}, {"letter": "D", "text": "Toxic adenoma"}, {"letter": "E", "text": "De Quervain's thyroiditis"}], "answer": "B", "explanation": "Thyroid inferno correlates with a thyroid bruit on exam → look for Graves eye findings.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "55", "group": 55, "stem": "Down syndrome or Turner syndrome → Thyroid rule:", "options": [{"letter": "A", "text": "Annual RAIU scanning"}, {"letter": "B", "text": "Thyroid ultrasound at birth only"}, {"letter": "C", "text": "No increased thyroid risk"}, {"letter": "D", "text": "Low threshold to check TSH"}, {"letter": "E", "text": "Anti-TPO only if goiter"}], "answer": "D", "explanation": "Hypothyroidism is Down syndrome's MC endocrine problem; 10–30% of Turner patients develop thyroid disease.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "56", "group": 56, "stem": "Hypercortisolism + LOW ACTH → Imaging:", "options": [{"letter": "A", "text": "Sestamibi scan"}, {"letter": "B", "text": "Chest CT"}, {"letter": "C", "text": "CT or MRI of the adrenals"}, {"letter": "D", "text": "Brain MRI without contrast"}, {"letter": "E", "text": "MRI pituitary with contrast"}], "answer": "C", "explanation": "Suppressed ACTH = ACTH-independent = cortisol-secreting adrenal adenoma (~15%) → image the adrenals.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "57", "group": 57, "stem": "Hypercalcemia with non-suppressed PTH, urine Ca/Cr clearance ratio >0.02 → Diagnosis:", "options": [{"letter": "A", "text": "Vitamin D intoxication"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Sarcoidosis"}, {"letter": "D", "text": "Milk-alkali syndrome"}, {"letter": "E", "text": "Familial hypocalciuric hypercalcemia"}], "answer": "B", "explanation": "Urine Ca/Cr >0.02 supports PHPT (and predicts stones); <0.01 = FHH.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "58", "group": 58, "stem": "Episodic headache + sweating + palpitations with paroxysmal hypertension → Best initial test:", "options": [{"letter": "A", "text": "Aldosterone:renin ratio"}, {"letter": "B", "text": "24-h urine free cortisol"}, {"letter": "C", "text": "Plasma free metanephrines"}, {"letter": "D", "text": "24-h urine catecholamines"}, {"letter": "E", "text": "Adrenal CT"}], "answer": "C", "explanation": "Plasma free metanephrines = sensitive screen; 24-h urine catecholamines + metanephrines = specific confirmation; then CT/MRI.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "59", "group": 59, "stem": "Normal screening result for T2DM → Repeat interval:", "options": [{"letter": "A", "text": "Every 6 months"}, {"letter": "B", "text": "Never"}, {"letter": "C", "text": "Every 5 years"}, {"letter": "D", "text": "Annually"}, {"letter": "E", "text": "Every 3 years"}], "answer": "E", "explanation": "Normal q3 yr; prediabetes yearly; prior GDM q1–3 yr.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "60", "group": 60, "stem": "Low calcium, HIGH phosphate, low PTH, 2 days after total thyroidectomy → Diagnosis:", "options": [{"letter": "A", "text": "Vitamin D deficiency"}, {"letter": "B", "text": "Pseudohypoparathyroidism"}, {"letter": "C", "text": "Hypomagnesemia"}, {"letter": "D", "text": "CKD secondary hyperparathyroidism"}, {"letter": "E", "text": "Postsurgical hypoparathyroidism"}], "answer": "E", "explanation": "Postsurgical is the MCC of hypoparathyroidism; confirm persistence on 2 measurements ≥2 weeks apart; long term calcitriol + oral calcium.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "61", "group": 61, "stem": "Cosyntropin stimulation test: no rise in cortisol → Diagnosis:", "options": [{"letter": "A", "text": "Normal axis"}, {"letter": "B", "text": "Conn's syndrome"}, {"letter": "C", "text": "Primary adrenal insufficiency"}, {"letter": "D", "text": "Cushing's disease"}, {"letter": "E", "text": "Secondary adrenal insufficiency"}], "answer": "C", "explanation": "Normal peak ≥18–20 µg/dL. No rise = primary (dead gland); a normal rise with low AM cortisol points upstream (secondary).", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "62", "group": 62, "stem": "Started levothyroxine → Recheck TSH when:", "options": [{"letter": "A", "text": "3 months"}, {"letter": "B", "text": "4–6 weeks"}, {"letter": "C", "text": "2 weeks"}, {"letter": "D", "text": "1 week"}, {"letter": "E", "text": "12 months"}], "answer": "B", "explanation": "4–6 weeks after starting and after ANY dose change (adjust in 12–25 mcg steps); annually once stable.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "63", "group": 63, "stem": "Graves disease in pregnancy → Thionamide of choice:", "options": [{"letter": "A", "text": "I-131"}, {"letter": "B", "text": "Levothyroxine"}, {"letter": "C", "text": "Propranolol alone"}, {"letter": "D", "text": "Propylthiouracil (PTU)"}, {"letter": "E", "text": "Methimazole"}], "answer": "D", "explanation": "PTU over methimazole in pregnancy (methimazole is otherwise preferred); PTU is also first in thyroid storm.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "64", "group": 64, "stem": "Abnormal TSH, normal free T4, asymptomatic → Next step:", "options": [{"letter": "A", "text": "Brain MRI"}, {"letter": "B", "text": "Start levothyroxine now"}, {"letter": "C", "text": "Repeat labs in 1–3 months"}, {"letter": "D", "text": "Thyroid ultrasound"}, {"letter": "E", "text": "RAIU scan"}], "answer": "C", "explanation": "Subclinical states are confirmed on repeat before any label or treatment (the confirm-before-you-label rule).", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "65", "group": 65, "stem": "Hypocalcemia → ECG finding:", "options": [{"letter": "A", "text": "Prolonged QT interval"}, {"letter": "B", "text": "Short PR interval"}, {"letter": "C", "text": "Short QT interval"}, {"letter": "D", "text": "U waves"}, {"letter": "E", "text": "Peaked T waves"}], "answer": "A", "explanation": "↓ Ca → long QT and torsades; tetany. The QT can be used to follow calcium changes.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "66", "group": 66, "stem": "Primary adrenal insufficiency → Imaging:", "options": [{"letter": "A", "text": "Abdominal CT"}, {"letter": "B", "text": "RAIU scan"}, {"letter": "C", "text": "Thyroid ultrasound"}, {"letter": "D", "text": "Brain MRI with contrast"}, {"letter": "E", "text": "DXA"}], "answer": "A", "explanation": "Abdominal CT looks for infiltrative, hemorrhagic, infectious or metastatic causes; add PPD/IGRA + CXR if TB is suspected.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "67", "group": 67, "stem": "50-year-old woman, hip fracture after a fall, T −2.8, Ca high, PTH high → Management:", "options": [{"letter": "A", "text": "Cinacalcet alone"}, {"letter": "B", "text": "FRAX calculation"}, {"letter": "C", "text": "Parathyroidectomy"}, {"letter": "D", "text": "Observation"}, {"letter": "E", "text": "Bisphosphonate alone"}], "answer": "C", "explanation": "PHPT with a fragility fracture / T < −2.5 is itself a surgical criterion; parathyroidectomy reverses the bone disease.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "68", "group": 68, "stem": "Sonographic feature that is REASSURING in a thyroid nodule → Feature:", "options": [{"letter": "A", "text": "Taller than wide"}, {"letter": "B", "text": "Irregular / microlobulated margins"}, {"letter": "C", "text": "Extrathyroidal extension"}, {"letter": "D", "text": "Purely cystic"}, {"letter": "E", "text": "Solid component"}], "answer": "D", "explanation": "Purely cystic, ≤1 cm, smooth margins, no calcifications, no extension, no adenopathy → ultrasound follow-up, not FNA.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "69", "group": 69, "stem": "FPG 100–125 mg/dL → Label:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Gestational diabetes"}, {"letter": "C", "text": "Impaired fasting glucose"}, {"letter": "D", "text": "Diabetes"}, {"letter": "E", "text": "Impaired glucose tolerance"}], "answer": "C", "explanation": "IFG = FPG 100–125; IGT = 2-h OGTT 140–199; A1C 5.7–6.4%. Retest at least annually.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "70", "group": 70, "stem": "Suspected thyroid dysfunction, any direction, any age → Best initial test:", "options": [{"letter": "A", "text": "Total T3"}, {"letter": "B", "text": "RAIU scan"}, {"letter": "C", "text": "Free T4"}, {"letter": "D", "text": "Anti-TPO antibody"}, {"letter": "E", "text": "TSH"}], "answer": "E", "explanation": "TSH first — the pituitary is a reliable informant; a normal TSH rules out primary hypo- and hyperthyroidism. Free T4 is the reflex confirmation.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "71", "group": 71, "stem": "RAIU: one hot nodule with the rest of the gland suppressed → Diagnosis:", "options": [{"letter": "A", "text": "Toxic multinodular goiter"}, {"letter": "B", "text": "De Quervain's thyroiditis"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "Toxic adenoma"}, {"letter": "E", "text": "Papillary carcinoma"}], "answer": "D", "explanation": "A single hot nodule suppressing the extranodular tissue is a toxic adenoma — virtually never malignant, so no FNA.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "72", "group": 72, "stem": "Primary HPT + pituitary adenoma + pancreatic islet tumor → Syndrome:", "options": [{"letter": "A", "text": "APS-1"}, {"letter": "B", "text": "MEN2A"}, {"letter": "C", "text": "MEN1"}, {"letter": "D", "text": "MEN2B"}, {"letter": "E", "text": "Von Hippel-Lindau"}], "answer": "C", "explanation": "MEN1 — PHPT is its most frequent and earliest expression.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "73", "group": 73, "stem": "↑ K + ↓ Na + hypotension → Gland:", "options": [{"letter": "A", "text": "Adrenal — Conn's syndrome"}, {"letter": "B", "text": "Thyroid — Graves disease"}, {"letter": "C", "text": "Pituitary — Cushing's disease"}, {"letter": "D", "text": "Parathyroid — primary HPT"}, {"letter": "E", "text": "Adrenal — Addison's disease"}], "answer": "E", "explanation": "The electrolyte fingerprint of aldosterone loss; secondary insufficiency keeps K normal.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "74", "group": 74, "stem": "TSH LOW + free T4 LOW → Next step:", "options": [{"letter": "A", "text": "Anti-TPO antibody"}, {"letter": "B", "text": "Repeat labs in 1–3 months"}, {"letter": "C", "text": "RAIU scan"}, {"letter": "D", "text": "Brain MRI"}, {"letter": "E", "text": "Thyroid ultrasound"}], "answer": "D", "explanation": "Same direction = central (secondary) hypothyroidism — a red flag for a pituitary/hypothalamic lesion → brain MRI and evaluate the other pituitary axes.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "75", "group": 75, "stem": "CGM report shows frequent time below range and time in range below goal → First priority:", "options": [{"letter": "A", "text": "Raise the basal insulin"}, {"letter": "B", "text": "Ignore until the A1C is checked"}, {"letter": "C", "text": "Stop CGM"}, {"letter": "D", "text": "Fix hypoglycemia before hyperglycemia"}, {"letter": "E", "text": "Add a sulfonylurea"}], "answer": "D", "explanation": "Address hypoglycemia first, then hyperglycemia.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "76", "group": 76, "stem": "Hypercalcemia → ECG finding:", "options": [{"letter": "A", "text": "Prolonged QT interval"}, {"letter": "B", "text": "Torsades de pointes"}, {"letter": "C", "text": "Peaked T waves"}, {"letter": "D", "text": "Delta wave"}, {"letter": "E", "text": "Short QT interval"}], "answer": "E", "explanation": "↑ Ca → short QT, bradycardia, AV block (and nephrogenic DI — the 'thrones'). ↓ Ca → long QT, torsades.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "77", "group": 77, "stem": "Low calcium, HIGH PTH, 25-OH-D <20, phosphate low/normal → Diagnosis:", "options": [{"letter": "A", "text": "Hypoparathyroidism"}, {"letter": "B", "text": "CKD secondary hyperparathyroidism"}, {"letter": "C", "text": "Vitamin D deficiency"}, {"letter": "D", "text": "Primary hyperparathyroidism"}, {"letter": "E", "text": "Pseudohypoparathyroidism"}], "answer": "C", "explanation": "Low 25-OH-D with low/normal phosphate; CKD is the other secondary HPT, with high phosphate and high creatinine.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "78", "group": 78, "stem": "Squamous cell lung cancer, Ca 13.8, confusion, suppressed PTH → Mediator:", "options": [{"letter": "A", "text": "Calcitriol"}, {"letter": "B", "text": "Calcidiol"}, {"letter": "C", "text": "Calcitonin"}, {"letter": "D", "text": "Intact PTH"}, {"letter": "E", "text": "PTHrP"}], "answer": "E", "explanation": "Humoral hypercalcemia of malignancy: squamous (lung/head/neck), renal, bladder, breast, ovarian → ↑ PTHrP, ↓ PTH, ↓ phosphate.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "79", "group": 79, "stem": "Asymptomatic primary HPT in a 45-year-old → Management:", "options": [{"letter": "A", "text": "Cinacalcet"}, {"letter": "B", "text": "Observe with annual calcium"}, {"letter": "C", "text": "Bisphosphonate alone"}, {"letter": "D", "text": "Thiazide diuretic"}, {"letter": "E", "text": "Parathyroidectomy"}], "answer": "E", "explanation": "Surgery if symptomatic, or Ca >1 above ULN, T-score ≤ −2.5 / vertebral fx, stones, eGFR <60, hypercalciuria, or age <50.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "80", "group": 80, "stem": "Most common cause of hyperthyroidism → Diagnosis:", "options": [{"letter": "A", "text": "De Quervain's thyroiditis"}, {"letter": "B", "text": "Toxic adenoma"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "Toxic multinodular goiter"}, {"letter": "E", "text": "Postpartum thyroiditis"}], "answer": "C", "explanation": "Graves is the MCC; toxic multinodular goiter is second.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "81", "group": 81, "stem": "Aldosterone:renin ratio >30 → Diagnosis suggested:", "options": [{"letter": "A", "text": "Renal artery stenosis"}, {"letter": "B", "text": "Pheochromocytoma"}, {"letter": "C", "text": "Primary hyperaldosteronism"}, {"letter": "D", "text": "Addison's disease"}, {"letter": "E", "text": "Cushing's syndrome"}], "answer": "C", "explanation": "High aldosterone with suppressed renin = primary aldosteronism; ratio >30 ≈ 90% sensitive and specific.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "82", "group": 82, "stem": "Hypercalcemia, suppressed PTH, HIGH calcitriol, hilar adenopathy → Diagnosis:", "options": [{"letter": "A", "text": "Vitamin D intoxication"}, {"letter": "B", "text": "Sarcoidosis (granulomatous disease)"}, {"letter": "C", "text": "Multiple myeloma"}, {"letter": "D", "text": "Primary hyperparathyroidism"}, {"letter": "E", "text": "Familial hypocalciuric hypercalcemia"}], "answer": "B", "explanation": "Granulomas and lymphoma make calcitriol via extrarenal 1α-hydroxylase; vitamin D intoxication raises calcidiol (25-OH-D) instead.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "83", "group": 83, "stem": "High calcium + SUPPRESSED PTH → Next test:", "options": [{"letter": "A", "text": "24-h urine calcium"}, {"letter": "B", "text": "Anti-21-hydroxylase antibody"}, {"letter": "C", "text": "PTHrP"}, {"letter": "D", "text": "Calcitonin"}, {"letter": "E", "text": "Sestamibi scan"}], "answer": "C", "explanation": "Suppressed PTH shifts the workup away from the parathyroid: PTHrP → calcidiol → calcitriol → the rest.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "84", "group": 84, "stem": "Thyroid nodule found on exam or incidentally on imaging → Initial orders:", "options": [{"letter": "A", "text": "FNA biopsy and cytology"}, {"letter": "B", "text": "TSH + thyroid ultrasound"}, {"letter": "C", "text": "RAIU scan and free T4"}, {"letter": "D", "text": "Calcitonin and CEA"}, {"letter": "E", "text": "CT neck with contrast"}], "answer": "B", "explanation": "Every nodule starts with TSH + US; an incidentaloma carries the same (low, ~5%) malignancy risk as a palpable nodule.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "85", "group": 85, "stem": "Confirmed albuminuria + BP >130/80 → Drug class:", "options": [{"letter": "A", "text": "Thiazide"}, {"letter": "B", "text": "Loop diuretic"}, {"letter": "C", "text": "ACE inhibitor or ARB"}, {"letter": "D", "text": "Calcium channel blocker"}, {"letter": "E", "text": "Beta-blocker"}], "answer": "C", "explanation": "Albuminuria with BP above goal → ACEi or ARB; no ACEi/ARB for primary prevention in normotensive normoalbuminuric T2DM.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "86", "group": 86, "stem": "Pheochromocytoma testing — the pair the exam flips → Which is sensitive vs specific:", "options": [{"letter": "A", "text": "Plasma free metanephrines = sensitive; 24-h urine = specific"}, {"letter": "B", "text": "Plasma metanephrines = specific; 24-h urine = sensitive"}, {"letter": "C", "text": "Adrenal CT = sensitive screen; plasma = specific"}, {"letter": "D", "text": "Both tests are equally sensitive and specific"}, {"letter": "E", "text": "24-h urine = screen; plasma metanephrines = confirm"}], "answer": "A", "explanation": "Sensitive plasma screen → specific 24-h urine confirmation → then imaging.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "87", "group": 87, "stem": "1 mg dexamethasone at 11 PM, 8 AM cortisol >5 µg/dL → Interpretation:", "options": [{"letter": "A", "text": "Adrenal insufficiency"}, {"letter": "B", "text": "Pheochromocytoma"}, {"letter": "C", "text": "Secondary adrenal insufficiency"}, {"letter": "D", "text": "Normal suppression"}, {"letter": "E", "text": "Failure to suppress — suggests Cushing's"}], "answer": "E", "explanation": "Normal = suppression to <2 µg/dL; >5 = failure to suppress. May need more than one abnormal screening test.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "88", "group": 88, "stem": "Polyuria and polydipsia with a NORMAL plasma glucose → Think:", "options": [{"letter": "A", "text": "Type 1 diabetes"}, {"letter": "B", "text": "Type 2 diabetes"}, {"letter": "C", "text": "Prediabetes"}, {"letter": "D", "text": "Diabetes insipidus"}, {"letter": "E", "text": "Stress hyperglycemia"}], "answer": "D", "explanation": "ADH deficiency/resistance; cross-link — hypercalcemia causes nephrogenic DI too.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "89", "group": 89, "stem": "FNA cytology: indeterminate / atypical → Options:", "options": [{"letter": "A", "text": "Observation only"}, {"letter": "B", "text": "Repeat FNA in 2 weeks"}, {"letter": "C", "text": "External beam radiation"}, {"letter": "D", "text": "I-131 ablation"}, {"letter": "E", "text": "Molecular testing or surgery"}], "answer": "E", "explanation": "ThyroSeq v3 / Afirma GSC / ThyraMIR stratify indeterminate nodules as pro-surgery vs pro-watchful-waiting; a benign molecular result still needs US surveillance.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "90", "group": 90, "stem": "A1C 5.7–6.4% → Label:", "options": [{"letter": "A", "text": "Well-controlled diabetes"}, {"letter": "B", "text": "Diabetes"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Prediabetes"}, {"letter": "E", "text": "Gestational diabetes"}], "answer": "D", "explanation": "Prediabetes → lifestyle first, then metformin, GLP-1 RAs, bariatric surgery; retest yearly.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "91", "group": 91, "stem": "ADA A1C goal for most adults → Target:", "options": [{"letter": "A", "text": "<6.5%"}, {"letter": "B", "text": "<9%"}, {"letter": "C", "text": "<8%"}, {"letter": "D", "text": "<6%"}, {"letter": "E", "text": "<7%"}], "answer": "E", "explanation": "<7% for most; <8% is appropriate with limited life expectancy. Targets individualized by age, health status, frailty.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "92", "group": 92, "stem": "Thyroid question in a pregnant or breastfeeding patient → Imaging of choice:", "options": [{"letter": "A", "text": "RAIU scan (I-123)"}, {"letter": "B", "text": "Brain MRI"}, {"letter": "C", "text": "CT neck with contrast"}, {"letter": "D", "text": "Thyroid ultrasound"}, {"letter": "E", "text": "I-131 scan"}], "answer": "D", "explanation": "No radioactive iodine — neither I-123 nor I-131 — in pregnancy or nursing. Ultrasound plus antibodies/labs do the work.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "93", "group": 93, "stem": "Spine film with alternating sclerotic and lucent endplate bands ('rugger-jersey spine') → Diagnosis:", "options": [{"letter": "A", "text": "Renal osteodystrophy"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Paget disease"}, {"letter": "D", "text": "Multiple myeloma"}, {"letter": "E", "text": "Primary hyperparathyroidism"}], "answer": "A", "explanation": "Rugger-jersey spine = renal osteodystrophy of advanced CKD.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "94", "group": 94, "stem": "T-score ≤ −2.5 at femoral neck OR spine → Label:", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Z-score abnormality"}, {"letter": "E", "text": "Osteomalacia"}], "answer": "B", "explanation": "One site at ≤ −2.5 is enough for the diagnosis.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "95", "group": 95, "stem": "Any abnormal total calcium → First step before any workup:", "options": [{"letter": "A", "text": "Sestamibi parathyroid scan"}, {"letter": "B", "text": "24-hour urine calcium"}, {"letter": "C", "text": "Intact PTH level"}, {"letter": "D", "text": "PTH-related peptide"}, {"letter": "E", "text": "Albumin-corrected or ionized calcium"}], "answer": "E", "explanation": "Confirm the calcium is real (albumin-corrected or ionized), remeasure off thiazides/lithium — then PTH.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "96", "group": 96, "stem": "Self-monitored glucose → Preprandial and peak postprandial targets:", "options": [{"letter": "A", "text": "100–140 preprandial; <250 postprandial"}, {"letter": "B", "text": "70–100 preprandial; <140 postprandial"}, {"letter": "C", "text": "90–150 preprandial; <200 postprandial"}, {"letter": "D", "text": "80–130 preprandial; <180 postprandial"}, {"letter": "E", "text": "60–120 preprandial; <160 postprandial"}], "answer": "D", "explanation": "Preprandial 80–130, postprandial <180 measured 90 min–2 h after a meal — what it takes to reach A1C <7%.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "97", "group": 97, "stem": "Calcium 11.0 with PTH 50 (normal range) → Interpretation:", "options": [{"letter": "A", "text": "Primary hyperparathyroidism"}, {"letter": "B", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "C", "text": "No parathyroid disease"}, {"letter": "D", "text": "Vitamin D intoxication"}, {"letter": "E", "text": "Hypercalcemia of malignancy"}], "answer": "A", "explanation": "A hormone that should be suppressed and is merely 'normal' is the abnormal result (Rule 1).", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "98", "group": 98, "stem": "Hypocalcemia with tetany, seizures, prolonged QT, or Ca ≤7.5 → Treatment:", "options": [{"letter": "A", "text": "Calcitriol alone"}, {"letter": "B", "text": "Oral calcium carbonate"}, {"letter": "C", "text": "Observation and repeat labs"}, {"letter": "D", "text": "IV calcium gluconate with telemetry"}, {"letter": "E", "text": "IV magnesium alone"}], "answer": "D", "explanation": "Severe/symptomatic → IV calcium with telemetry; 7.6–8.4 → oral calcium; ≥8.5 → none.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "99", "group": 99, "stem": "New hyperlipidemia before starting a statin → Lab to check first:", "options": [{"letter": "A", "text": "Lipoprotein(a)"}, {"letter": "B", "text": "Cortisol"}, {"letter": "C", "text": "Free T4"}, {"letter": "D", "text": "TSH"}, {"letter": "E", "text": "A1C"}], "answer": "D", "explanation": "AACE/ATA: ~5% are hypothyroid and 60% see cholesterol resolve with thyroxine — treat the thyroid, not the lipid.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "100", "group": 100, "stem": "When to START complication screening (UACR, eye, foot) → Rule:", "options": [{"letter": "A", "text": "Both types 5 years after onset"}, {"letter": "B", "text": "Both types starting at age 40"}, {"letter": "C", "text": "T1DM at diagnosis; T2DM 5 years after onset"}, {"letter": "D", "text": "Both types at diagnosis"}, {"letter": "E", "text": "T2DM at diagnosis; T1DM 5 years after onset"}], "answer": "E", "explanation": "Then at least every 12 months: UACR + eGFR, dilated eye exam, sensory foot exam, autonomic testing; BP every visit.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "101", "group": 101, "stem": "High C-peptide with negative islet autoantibodies → Diagnosis:", "options": [{"letter": "A", "text": "Type 1 diabetes"}, {"letter": "B", "text": "Stage 2 presymptomatic T1DM"}, {"letter": "C", "text": "Diabetes insipidus"}, {"letter": "D", "text": "Type 2 diabetes (insulin resistance)"}, {"letter": "E", "text": "LADA"}], "answer": "D", "explanation": "T2: insulin resistance with preserved (hyper)insulinemia; classification is etiologic, not by age or insulin use.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "102", "group": 102, "stem": "Giving IV calcium to a hypocalcemic patient → Medication that makes it dangerous:", "options": [{"letter": "A", "text": "Metformin"}, {"letter": "B", "text": "Lisinopril"}, {"letter": "C", "text": "Atorvastatin"}, {"letter": "D", "text": "Levothyroxine"}, {"letter": "E", "text": "Digoxin"}], "answer": "E", "explanation": "IV calcium can trigger lethal arrhythmias in patients on digoxin.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "103", "group": 103, "stem": "Salt-and-pepper skull, subperiosteal resorption of the phalanges, brown tumors → Diagnosis:", "options": [{"letter": "A", "text": "Osteitis fibrosa cystica"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Paget disease"}, {"letter": "D", "text": "Multiple myeloma"}, {"letter": "E", "text": "Renal osteodystrophy"}], "answer": "A", "explanation": "Classic but uncommon films of advanced HPT; plain films are not routine — PHPT is diagnosed biochemically.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "104", "group": 104, "stem": "Established diabetes, not at goal or therapy just changed → A1C frequency:", "options": [{"letter": "A", "text": "Every 6 weeks"}, {"letter": "B", "text": "Every 6 months"}, {"letter": "C", "text": "Every visit"}, {"letter": "D", "text": "Annually"}, {"letter": "E", "text": "Every 3 months"}], "answer": "E", "explanation": "Quarterly A1C until at goal — the interval follows red-cell turnover.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "105", "group": 105, "stem": "'Hot' nodule on RAIU → Need for FNA:", "options": [{"letter": "A", "text": "Repeat RAIU at 6 months"}, {"letter": "B", "text": "US-guided FNA required"}, {"letter": "C", "text": "Molecular testing required"}, {"letter": "D", "text": "No FNA — hot nodules are benign"}, {"letter": "E", "text": "Diagnostic lobectomy required"}], "answer": "D", "explanation": "A hyperfunctioning nodule is a toxic adenoma; the work-up becomes the hyperthyroidism pathway, not a cancer work-up.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "106", "group": 106, "stem": "Patient on chronic prednisone with cushingoid features → Rule:", "options": [{"letter": "A", "text": "Skip the Cushing's workup; reassess bone risk"}, {"letter": "B", "text": "Order a plasma ACTH level"}, {"letter": "C", "text": "Order a 24-h urine free cortisol"}, {"letter": "D", "text": "Order an MRI of the pituitary"}, {"letter": "E", "text": "Order a CT of the adrenals"}], "answer": "A", "explanation": "Glucocorticoids cause exogenous Cushing's, hyperglycemia, and are the MC cause of secondary osteoporosis.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "107", "group": 107, "stem": "Calcium >14 and symptomatic → Treatment:", "options": [{"letter": "A", "text": "IV isotonic saline + calcitonin + zoledronic acid"}, {"letter": "B", "text": "Oral hydration and observation"}, {"letter": "C", "text": "Emergent parathyroidectomy"}, {"letter": "D", "text": "Oral cinacalcet alone"}, {"letter": "E", "text": "IV loop diuretic alone"}], "answer": "A", "explanation": "Saline 200–300 mL/h + salmon calcitonin + IV zoledronic acid (preferred over pamidronate); loop diuretics only for volume overload; dialysis if refractory.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "108", "group": 108, "stem": "Genetic testing triggers across the endocrine lectures → Which three:", "options": [{"letter": "A", "text": "Any adrenal incidentaloma; any goiter; any DM"}, {"letter": "B", "text": "T2DM at <40; any osteoporosis; any FHH"}, {"letter": "C", "text": "Early/multigland PHPT; medullary CA; familial pheo"}, {"letter": "D", "text": "Any thyroid nodule; any Cushing's; any Conn's"}, {"letter": "E", "text": "Graves; Hashimoto's; de Quervain's thyroiditis"}], "answer": "C", "explanation": "The MEN threads (Rule 6); MEN2 carriers → prophylactic thyroidectomy.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "109", "group": 109, "stem": "Cushing's disease vs adrenal adenoma Cushing's → The splitter:", "options": [{"letter": "A", "text": "Serum potassium"}, {"letter": "B", "text": "Midnight salivary cortisol"}, {"letter": "C", "text": "Plasma ACTH (high vs low)"}, {"letter": "D", "text": "Dexamethasone suppression"}, {"letter": "E", "text": "24-h urine free cortisol level"}], "answer": "C", "explanation": "ACTH — and the pigmentation that follows it. UFC: disease usually 50–200 µg/24 h; adenoma often >200.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "110", "group": 110, "stem": "Hypercalcemia + VERY high PTH + high phosphate in a dialysis patient → Diagnosis:", "options": [{"letter": "A", "text": "Humoral hypercalcemia of malignancy"}, {"letter": "B", "text": "Pseudohypoparathyroidism"}, {"letter": "C", "text": "Secondary hyperparathyroidism"}, {"letter": "D", "text": "Primary hyperparathyroidism"}, {"letter": "E", "text": "Tertiary hyperparathyroidism"}], "answer": "E", "explanation": "Long secondary HPT becomes autonomous after advanced CKD/transplant — high Ca + very high PTH + high phosphate → parathyroidectomy.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "111", "group": 111, "stem": "High calcium + PTH high or inappropriately NORMAL → Diagnosis:", "options": [{"letter": "A", "text": "Vitamin D intoxication"}, {"letter": "B", "text": "Sarcoidosis"}, {"letter": "C", "text": "Primary hyperparathyroidism"}, {"letter": "D", "text": "Milk-alkali syndrome"}, {"letter": "E", "text": "Humoral hypercalcemia of malignancy"}], "answer": "C", "explanation": "PTH should be suppressed when calcium is high — a 'normal' PTH is inappropriate. Adenoma ~85%, women 3:1, age >50; phosphate low, ALP high.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "112", "group": 112, "stem": "FPG 118 and A1C 6.8 (discordant) → Next step:", "options": [{"letter": "A", "text": "Repeat the A1C"}, {"letter": "B", "text": "Order an OGTT"}, {"letter": "C", "text": "Diagnose diabetes now"}, {"letter": "D", "text": "Repeat the FPG"}, {"letter": "E", "text": "Call it prediabetes"}], "answer": "A", "explanation": "Discordant results → repeat the diagnostic one; concordant two tests = done.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "113", "group": 113, "stem": "Hypertension + spontaneous hypokalemia (± Na 143–147) → Screening test:", "options": [{"letter": "A", "text": "Mid-morning aldosterone : renin ratio"}, {"letter": "B", "text": "Adrenal CT with contrast"}, {"letter": "C", "text": "Cosyntropin stimulation test"}, {"letter": "D", "text": "Plasma free metanephrines"}, {"letter": "E", "text": "24-h urine free cortisol"}], "answer": "A", "explanation": "Aldosterone ↑ with renin suppressed; ratio >20 suggestive, >30 ≈ 90% sens/spec. Mid-morning because ACTH gives aldosterone a morning peak.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "114", "group": 114, "stem": "Hyperpigmentation + hyperkalemia + salt craving + hypotension → Diagnosis:", "options": [{"letter": "A", "text": "Cushing's disease"}, {"letter": "B", "text": "Primary adrenal insufficiency (Addison's)"}, {"letter": "C", "text": "Pheochromocytoma"}, {"letter": "D", "text": "Conn's syndrome"}, {"letter": "E", "text": "Secondary adrenal insufficiency"}], "answer": "B", "explanation": "Both cortisol and aldosterone are lost with high ACTH: ↓Na/↑K, salt craving, tan without tan lines. Neither = secondary.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "115", "group": 115, "stem": "Asymptomatic adrenal mass found incidentally on CT → Rule:", "options": [{"letter": "A", "text": "Repeat the CT in 1 month"}, {"letter": "B", "text": "Biochemical testing first"}, {"letter": "C", "text": "Start spironolactone first"}, {"letter": "D", "text": "CT-guided biopsy first"}, {"letter": "E", "text": "Surgical resection first"}], "answer": "B", "explanation": "Incidentalomas are found in up to 10% of the elderly and 85% are nonfunctional — biochemistry first, imaging second.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "116", "group": 116, "stem": "Hyperthyroid, painless gland, 1–4 months after delivery, anti-TPO positive → Diagnosis:", "options": [{"letter": "A", "text": "Toxic multinodular goiter"}, {"letter": "B", "text": "Postpartum thyroiditis"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "De Quervain's thyroiditis"}, {"letter": "E", "text": "Surreptitious thyroxine ingestion"}], "answer": "B", "explanation": "Painless, within 1 yr of delivery, anti-TPO +, low RAIU; 20–30% end with permanent hypothyroidism. Check TSH in postpartum mood symptoms.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "117", "group": 117, "stem": "Subclinical hypothyroidism, TSH 5–10 → Finding that tips toward treating:", "options": [{"letter": "A", "text": "ESR above 50"}, {"letter": "B", "text": "Age over 65"}, {"letter": "C", "text": "Positive anti-TPO"}, {"letter": "D", "text": "Positive TSI antibody"}, {"letter": "E", "text": "Low free T3 level"}], "answer": "C", "explanation": "AACE: treat TSH 5–10 when anti-TPO is positive (progression 4.3%/yr vs 2.1%/yr) or a goiter is present; also in planned/current pregnancy.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "118", "group": 118, "stem": "On levothyroxine replacement → Goal TSH:", "options": [{"letter": "A", "text": "Suppressed (<0.1)"}, {"letter": "B", "text": "Low-normal (≈1–2)"}, {"letter": "C", "text": "Upper-normal (≈4)"}, {"letter": "D", "text": "Any value below 10"}, {"letter": "E", "text": "Matches the free T4"}], "answer": "B", "explanation": "Aim for a normal TSH toward the lower end of the range; a suppressed TSH = over-replacement (iatrogenic hyperthyroidism).", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "119", "group": 119, "stem": "The test that actually DIAGNOSES thyroid cancer → Test:", "options": [{"letter": "A", "text": "RAIU scan"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "FNA biopsy"}, {"letter": "D", "text": "CT neck"}, {"letter": "E", "text": "Thyroid ultrasound"}], "answer": "C", "explanation": "US selects which nodules to sample; FNA makes the diagnosis (sensitivity 95–98%, specificity 95%).", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "120", "group": 120, "stem": "Autoimmune Addison's disease → Antibody:", "options": [{"letter": "A", "text": "Anti-islet cell"}, {"letter": "B", "text": "TSI"}, {"letter": "C", "text": "Anti-GAD65"}, {"letter": "D", "text": "Anti-21-hydroxylase"}, {"letter": "E", "text": "Anti-TPO"}], "answer": "D", "explanation": "Anti-21-hydroxylase in 70–90%; autoimmune is the MCC of primary adrenal insufficiency in the US (TB historically).", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "121", "group": 121, "stem": "Hyperthyroid labs, LOW RAIU, no goiter, access to thyroid hormone → Likely cause:", "options": [{"letter": "A", "text": "De Quervain's thyroiditis"}, {"letter": "B", "text": "Toxic adenoma"}, {"letter": "C", "text": "TSH-secreting adenoma"}, {"letter": "D", "text": "Graves disease"}, {"letter": "E", "text": "Exogenous thyroxine ingestion"}], "answer": "E", "explanation": "Low uptake with no goiter = exogenous hormone; the low-uptake differential is thyroiditis, factitious ingestion, struma ovarii.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "122", "group": 122, "stem": "72-year-old man with no risk factors asks about DXA → USPSTF grade:", "options": [{"letter": "A", "text": "Grade A"}, {"letter": "B", "text": "Grade D"}, {"letter": "C", "text": "Grade B"}, {"letter": "D", "text": "Grade C"}, {"letter": "E", "text": "Grade I"}], "answer": "E", "explanation": "USPSTF: men = I; NOF would screen men ≥70 — reasonable to offer.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "123", "group": 123, "stem": "Most common cause of hypercalcemia in the OUTPATIENT setting → Diagnosis:", "options": [{"letter": "A", "text": "Thiazide diuretics"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Sarcoidosis"}, {"letter": "D", "text": "Malignancy"}, {"letter": "E", "text": "Vitamin D intoxication"}], "answer": "B", "explanation": "Outpatient, incidental, mild = PHPT; inpatient, acute, severe, symptomatic = malignancy.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "124", "group": 124, "stem": "Suspected permanent hypoparathyroidism → Confirmation rule:", "options": [{"letter": "A", "text": "Two measurements ≥2 weeks apart"}, {"letter": "B", "text": "One calcium below 8.5"}, {"letter": "C", "text": "DXA of the hip and spine"}, {"letter": "D", "text": "Sestamibi parathyroid scan"}, {"letter": "E", "text": "A single PTH below 10"}], "answer": "A", "explanation": "Confirm on two measurements ≥2 weeks apart; then calcitriol + oral calcium, monitor every 3–12 months.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "125", "group": 125, "stem": "Osteopenia on DXA, no fractures → Next step:", "options": [{"letter": "A", "text": "Bone biopsy"}, {"letter": "B", "text": "Repeat DXA in 1 year"}, {"letter": "C", "text": "Calcitonin level"}, {"letter": "D", "text": "Calculate FRAX"}, {"letter": "E", "text": "Start bisphosphonate"}], "answer": "D", "explanation": "FRAX decides treatment in osteopenia: treat if 10-yr hip fracture ≥3% or major osteoporotic fracture ≥20%.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "126", "group": 126, "stem": "Hypercortisolism + HIGH or inappropriately normal ACTH → Imaging:", "options": [{"letter": "A", "text": "RAIU scan of the thyroid"}, {"letter": "B", "text": "CT of the adrenal glands"}, {"letter": "C", "text": "Abdominal ultrasound"}, {"letter": "D", "text": "DXA of the hip and spine"}, {"letter": "E", "text": "MRI of the pituitary with contrast"}], "answer": "E", "explanation": "ACTH-dependent = Cushing's disease (~85%, usually a microadenoma <10 mm) or ectopic ACTH; check visual fields.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "127", "group": 127, "stem": "Mucocutaneous candidiasis + hypoparathyroidism + adrenal insufficiency → Syndrome:", "options": [{"letter": "A", "text": "APS-1"}, {"letter": "B", "text": "MEN1"}, {"letter": "C", "text": "DiGeorge syndrome"}, {"letter": "D", "text": "APS-2"}, {"letter": "E", "text": "MEN2A"}], "answer": "A", "explanation": "APS-1 triad; DiGeorge is congenital parathyroid aplasia.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "128", "group": 128, "stem": "The one place in this exam where imaging IS the diagnosis → Test:", "options": [{"letter": "A", "text": "Thyroid US for cancer"}, {"letter": "B", "text": "DXA for osteoporosis"}, {"letter": "C", "text": "Adrenal CT for Cushing's"}, {"letter": "D", "text": "RAIU for Graves"}, {"letter": "E", "text": "Sestamibi for PHPT"}], "answer": "B", "explanation": "DXA diagnoses osteoporosis — but even here the next move is a lab panel for secondary causes.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "129", "group": 129, "stem": "Medullary thyroid CA + pheochromocytoma + parathyroid adenoma → Syndrome:", "options": [{"letter": "A", "text": "MEN2A"}, {"letter": "B", "text": "MEN1"}, {"letter": "C", "text": "MEN2B"}, {"letter": "D", "text": "Von Hippel-Lindau"}, {"letter": "E", "text": "APS-1"}], "answer": "A", "explanation": "MEN2A = MTC + pheo + primary HPT. MEN2B = MTC + pheo + mucosal neuromas / marfanoid habitus. Both RET, autosomal dominant.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "130", "group": 130, "stem": "Woman planning pregnancy with subclinical hypothyroidism → Management:", "options": [{"letter": "A", "text": "No action — subclinical is benign"}, {"letter": "B", "text": "Treat (normalize TSH before conception)"}, {"letter": "C", "text": "Observe and repeat after delivery"}, {"letter": "D", "text": "RAIU scan"}, {"letter": "E", "text": "Methimazole"}], "answer": "B", "explanation": "Planned or current pregnancy is a treat indication for subclinical hypothyroidism; trimester-specific TSH ranges exist.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "131", "group": 131, "stem": "TSH LOW + free T4 HIGH → Test that finds the cause:", "options": [{"letter": "A", "text": "RAIU scan"}, {"letter": "B", "text": "Brain MRI"}, {"letter": "C", "text": "ESR"}, {"letter": "D", "text": "Thyroid ultrasound"}, {"letter": "E", "text": "Anti-thyroglobulin antibody"}], "answer": "A", "explanation": "Primary hyperthyroidism is confirmed by TSH/fT4; RAIU answers 'which cause?' — high uptake = new synthesis, low uptake = preformed hormone release.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "132", "group": 132, "stem": "66-year-old diabetic with neuropathy and a foot ulcer → Vascular screening test:", "options": [{"letter": "A", "text": "No screening"}, {"letter": "B", "text": "Coronary CT angiography"}, {"letter": "C", "text": "Ankle-brachial index"}, {"letter": "D", "text": "Carotid duplex"}, {"letter": "E", "text": "Stress echocardiogram"}], "answer": "C", "explanation": "ABI for age ≥65 with microvascular disease, foot complications or end-organ damage; no routine CV screening in asymptomatic patients.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "133", "group": 133, "stem": "High calcium, suppressed PTH, PTHrP undetectable → Next two tests:", "options": [{"letter": "A", "text": "Sestamibi scan and DXA"}, {"letter": "B", "text": "Calcidiol and calcitriol levels"}, {"letter": "C", "text": "SPEP and skeletal survey"}, {"letter": "D", "text": "Urine Ca/Cr ratio and ALP"}, {"letter": "E", "text": "TSH and cortisol levels"}], "answer": "B", "explanation": "High calcidiol = vitamin D intoxication; high calcitriol = granulomatous disease or lymphoma (extrarenal 1α-hydroxylase).", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "134", "group": 134, "stem": "72-year-old woman with osteopenia (FRAX 13% / 2.7%) starts prednisone 15 mg for PMR → The move:", "options": [{"letter": "A", "text": "No change — FRAX is fixed"}, {"letter": "B", "text": "Recalculate FRAX"}, {"letter": "C", "text": "Repeat DXA first"}, {"letter": "D", "text": "Start calcitonin"}, {"letter": "E", "text": "Stop the prednisone"}], "answer": "B", "explanation": "Adding a glucocorticoid alone can push a patient across the threshold — recalculate when prednisone is started.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "135", "group": 135, "stem": "Gestational diabetes screening → Timing:", "options": [{"letter": "A", "text": "Random glucose at first visit"}, {"letter": "B", "text": "75-g OGTT at 24–28 weeks"}, {"letter": "C", "text": "A1C at delivery"}, {"letter": "D", "text": "OGTT at 36 weeks"}, {"letter": "E", "text": "FPG at 12 weeks"}], "answer": "B", "explanation": "GDM has separate criteria (FPG ≥92; 1-h ≥180; 2-h ≥153) — never apply the standard thresholds.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "136", "group": 136, "stem": "Cosyntropin stimulation test: NORMAL rise in a patient with low 8 AM cortisol → Diagnosis:", "options": [{"letter": "A", "text": "Secondary adrenal insufficiency"}, {"letter": "B", "text": "Primary adrenal insufficiency"}, {"letter": "C", "text": "Normal — no disease"}, {"letter": "D", "text": "Cushing's syndrome"}, {"letter": "E", "text": "Pheochromocytoma"}], "answer": "A", "explanation": "A normal cosyntropin response does not exclude insufficiency — it points to a pituitary cause → brain MRI + other axes.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "137", "group": 137, "stem": "Elevated aldosterone:renin ratio → Confirmatory test:", "options": [{"letter": "A", "text": "Cosyntropin stimulation"}, {"letter": "B", "text": "Captopril challenge only"}, {"letter": "C", "text": "Adrenal CT"}, {"letter": "D", "text": "24-h urine free cortisol"}, {"letter": "E", "text": "Sodium-loading suppression test"}], "answer": "E", "explanation": "An elevated ratio is not diagnostic — confirm by failure of aldosterone to suppress after oral NaCl (urine aldosterone) or IV saline (PAC).", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "138", "group": 138, "stem": "Primary HPT when surgery is not done → Drug that lowers calcium:", "options": [{"letter": "A", "text": "Levothyroxine"}, {"letter": "B", "text": "Calcitriol"}, {"letter": "C", "text": "Zoledronic acid"}, {"letter": "D", "text": "Cinacalcet"}, {"letter": "E", "text": "Hydrochlorothiazide"}], "answer": "D", "explanation": "Cinacalcet (↑ CaSR sensitivity) lowers calcium; bisphosphonate/denosumab protect bone; replete vitamin D.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "139", "group": 139, "stem": "Pheochromocytoma — proportion that is part of a genetic syndrome → Syndrome to think of:", "options": [{"letter": "A", "text": "APS-1"}, {"letter": "B", "text": "Turner syndrome"}, {"letter": "C", "text": "MEN2 (~25%)"}, {"letter": "D", "text": "DiGeorge syndrome"}, {"letter": "E", "text": "MEN1"}], "answer": "C", "explanation": "~25% syndromic; ask about family history of medullary thyroid carcinoma.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "140", "group": 140, "stem": "Osteolytic hypercalcemia of malignancy → Classic tumors:", "options": [{"letter": "A", "text": "Small cell lung cancer"}, {"letter": "B", "text": "Renal cell carcinoma"}, {"letter": "C", "text": "Hodgkin and non-Hodgkin lymphoma"}, {"letter": "D", "text": "Multiple myeloma and breast cancer"}, {"letter": "E", "text": "Squamous cell lung cancer"}], "answer": "D", "explanation": "Osteolytic = myeloma and breast; humoral/PTHrP = squamous, renal, bladder, breast, ovarian; calcitriol = lymphoma.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "141", "group": 141, "stem": "Medullary thyroid carcinoma → Therapy that does NOT work:", "options": [{"letter": "A", "text": "External radiation"}, {"letter": "B", "text": "Systemic chemotherapy"}, {"letter": "C", "text": "Total thyroidectomy"}, {"letter": "D", "text": "Prophylactic thyroidectomy in carriers"}, {"letter": "E", "text": "I-131 ablation and TSH suppression"}], "answer": "E", "explanation": "C cells do not take up iodine and are not TSH-driven — RAI and TSH suppression are useless; surgery ± radiation/chemo.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "142", "group": 142, "stem": "High-risk differentiated thyroid cancer after thyroidectomy → Adjuvant therapy:", "options": [{"letter": "A", "text": "Cinacalcet and calcitriol"}, {"letter": "B", "text": "Systemic cytotoxic chemotherapy"}, {"letter": "C", "text": "External beam radiation therapy"}, {"letter": "D", "text": "I-131 ablation + TSH suppression"}, {"letter": "E", "text": "Observation with annual US"}], "answer": "D", "explanation": "Adjuvant RAI plus TSH suppression (TSH 0.1–0.5; <0.1 if metastatic) for high-risk papillary/follicular disease.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "143", "group": 143, "stem": "Ectopic ACTH production → Classic tumor:", "options": [{"letter": "A", "text": "Small cell lung cancer"}, {"letter": "B", "text": "Renal cell carcinoma"}, {"letter": "C", "text": "Papillary thyroid cancer"}, {"letter": "D", "text": "Squamous cell lung cancer"}, {"letter": "E", "text": "Pheochromocytoma"}], "answer": "A", "explanation": "Ectopic ACTH: small cell lung CA (also thymic, pancreatic islet, medullary thyroid).", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "144", "group": 144, "stem": "Single confirmed IA-2 antibody with normal glucose (ADA 2026) → Monitoring level:", "options": [{"letter": "A", "text": "Monitor as Stage 1 only"}, {"letter": "B", "text": "No follow-up needed"}, {"letter": "C", "text": "Diagnose Stage 3"}, {"letter": "D", "text": "Start teplizumab immediately"}, {"letter": "E", "text": "Monitor as Stage 2"}], "answer": "E", "explanation": "New 2026: a single confirmed IA-2 antibody has high predictive value → Stage-2-level monitoring.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "145", "group": 145, "stem": "Low BMD in a man → Lab to add:", "options": [{"letter": "A", "text": "Serum protein electrophoresis"}, {"letter": "B", "text": "Serum testosterone"}, {"letter": "C", "text": "Serum prolactin"}, {"letter": "D", "text": "Serum calcitonin"}, {"letter": "E", "text": "Serum estradiol"}], "answer": "B", "explanation": "Hypogonadism of any cause accelerates bone loss (menopause is the classic example).", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "146", "group": 146, "stem": "Postpartum depression or anxiety → Lab not to miss:", "options": [{"letter": "A", "text": "TSH"}, {"letter":
