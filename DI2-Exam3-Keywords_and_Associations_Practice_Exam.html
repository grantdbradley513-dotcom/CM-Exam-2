 "B", "text": "Prolactin"}, {"letter": "C", "text": "A1C"}, {"letter": "D", "text": "Cortisol"}, {"letter": "E", "text": "Ferritin"}], "answer": "A", "explanation": "Postpartum thyroiditis hides inside postpartum mood disorders — check TSH.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "147", "group": 147, "stem": "T-score between −1.0 and −2.5 → Label:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Severe osteoporosis"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Osteopenia"}, {"letter": "E", "text": "Osteomalacia"}], "answer": "D", "explanation": "Normal ≥ −1.0; osteopenia −1.0 to −2.5; osteoporosis ≤ −2.5; severe = ≤ −2.5 + fragility fracture.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "148", "group": 148, "stem": "T-score → Comparison group:", "options": [{"letter": "A", "text": "Same-sex population mean"}, {"letter": "B", "text": "Age-matched peers"}, {"letter": "C", "text": "Young healthy adults"}, {"letter": "D", "text": "WHO reference for men"}, {"letter": "E", "text": "The patient's prior scan"}], "answer": "C", "explanation": "T = SD vs young adult peak; Z = SD vs age-matched. Both SD units; only the comparison group differs.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "149", "group": 149, "stem": "Definition of 'fasting' for an FPG → Rule:", "options": [{"letter": "A", "text": "Water only for 2 hours"}, {"letter": "B", "text": "No caloric intake for ≥8 hours"}, {"letter": "C", "text": "No carbohydrates for 24 hours"}, {"letter": "D", "text": "Nothing by mouth for 12 hours"}, {"letter": "E", "text": "No food for 4 hours"}], "answer": "B", "explanation": "Fasting = no calories ≥8 h. OGTT = 75 g load, read at 2 h.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "150", "group": 150, "stem": "Feature that is more SPECIFIC for Cushing's than ordinary obesity → Finding:", "options": [{"letter": "A", "text": "Narrow pink striae"}, {"letter": "B", "text": "Moon facies"}, {"letter": "C", "text": "Buffalo hump"}, {"letter": "D", "text": "Supraclavicular fat filling"}, {"letter": "E", "text": "Central obesity"}], "answer": "D", "explanation": "Moon facies and buffalo hump occur in plain obesity; plethora, supraclavicular fat, wide purple striae, proximal weakness point to Cushing's.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "151", "group": 151, "stem": "Treated diabetic on injected insulin — want to know endogenous insulin production → Test:", "options": [{"letter": "A", "text": "Serum insulin level"}, {"letter": "B", "text": "C-peptide"}, {"letter": "C", "text": "Anti-GAD65"}, {"letter": "D", "text": "Fructosamine"}, {"letter": "E", "text": "A1C"}], "answer": "B", "explanation": "Injected insulin contains no C-peptide, and C-peptide has a longer half-life — the reason insulin itself is never measured.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "152", "group": 152, "stem": "TSH HIGH + free T4 LOW → Diagnosis:", "options": [{"letter": "A", "text": "Primary hypothyroidism"}, {"letter": "B", "text": "Central hyperthyroidism"}, {"letter": "C", "text": "Subclinical hypothyroidism"}, {"letter": "D", "text": "Central hypothyroidism"}, {"letter": "E", "text": "Primary hyperthyroidism"}], "answer": "A", "explanation": "Opposite directions = primary disease. High TSH with low fT4 is primary hypothyroidism (MCC Hashimoto's).", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "153", "group": 153, "stem": "Thyroid cancer that breaks through the capsule and spreads hematogenously to lung/liver/bone → Type:", "options": [{"letter": "A", "text": "Papillary carcinoma"}, {"letter": "B", "text": "Anaplastic carcinoma"}, {"letter": "C", "text": "Medullary carcinoma"}, {"letter": "D", "text": "Thyroid lymphoma"}, {"letter": "E", "text": "Follicular carcinoma"}], "answer": "E", "explanation": "Follicular (~10%, older patients) — surgery always; papillary spreads mainly to regional nodes and is least aggressive.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "154", "group": 154, "stem": "Cushingoid patient WITH hyperpigmentation and hirsutism → Source:", "options": [{"letter": "A", "text": "Bilateral adrenal hyperplasia"}, {"letter": "B", "text": "Adrenal carcinoma"}, {"letter": "C", "text": "Adrenal adenoma"}, {"letter": "D", "text": "ACTH-dependent (pituitary or ectopic)"}, {"letter": "E", "text": "Exogenous prednisone"}], "answer": "D", "explanation": "Pigmentation and hirsutism/acne require high ACTH (POMC → MSH); adrenal adenomas suppress ACTH.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "155", "group": 155, "stem": "Diabetic patient's eGFR falls to 28 → Action:", "options": [{"letter": "A", "text": "Stop all antihypertensives"}, {"letter": "B", "text": "Start dialysis"}, {"letter": "C", "text": "Continue annual monitoring only"}, {"letter": "D", "text": "Repeat in 2 years"}, {"letter": "E", "text": "Refer to nephrology (stage 4 CKD)"}], "answer": "E", "explanation": "eGFR <60 = CKD (CKD-EPI); refer at <30.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "156", "group": 156, "stem": "'Orphan Annie eye' nuclei, ~80% of thyroid cancers, rises after neck radiation → Type:", "options": [{"letter": "A", "text": "Hürthle cell carcinoma"}, {"letter": "B", "text": "Medullary carcinoma"}, {"letter": "C", "text": "Follicular carcinoma"}, {"letter": "D", "text": "Papillary carcinoma"}, {"letter": "E", "text": "Anaplastic carcinoma"}], "answer": "D", "explanation": "Papillary is the MC and least aggressive; <1 cm microcarcinoma may be observed.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "157", "group": 157, "stem": "Methimazole just started for Graves → Lab to follow during early titration:", "options": [{"letter": "A", "text": "TSH level"}, {"letter": "B", "text": "ESR and CRP"}, {"letter": "C", "text": "TSI antibody"}, {"letter": "D", "text": "Free T4 and T3"}, {"letter": "E", "text": "Anti-TPO antibody"}], "answer": "D", "explanation": "TSH lags for months and is useless early; follow free T4/T3 every 4–6 weeks until normal, then cut the dose 30–50%.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "158", "group": 158, "stem": "Primary HPT at age <30 or multigland disease → Next step:", "options": [{"letter": "A", "text": "Genetic testing for MEN"}, {"letter": "B", "text": "Sestamibi scan only"}, {"letter": "C", "text": "Observation"}, {"letter": "D", "text": "Calcitonin level only"}, {"letter": "E", "text": "Bone scan"}], "answer": "A", "explanation": "MEN1: PHPT (earliest, ~age 20–25) + pituitary + pancreatic islet tumors. MEN2A: PHPT + MTC + pheo.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "159", "group": 159, "stem": "Anti-TPO and anti-thyroglobulin antibodies → Disease:", "options": [{"letter": "A", "text": "Hashimoto's thyroiditis"}, {"letter": "B", "text": "Toxic adenoma"}, {"letter": "C", "text": "Toxic multinodular goiter"}, {"letter": "D", "text": "Graves disease"}, {"letter": "E", "text": "De Quervain's thyroiditis"}], "answer": "A", "explanation": "Anti-TPO (~95%) and anti-Tg (~80%) = Hashimoto's; anti-TPO is also transiently positive in postpartum thyroiditis.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "160", "group": 160, "stem": "T-score ≤ −2.5 plus a fragility fracture → Label:", "options": [{"letter": "A", "text": "Osteomalacia"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Severe osteoporosis"}, {"letter": "D", "text": "Osteopenia"}, {"letter": "E", "text": "Paget disease"}], "answer": "C", "explanation": "Severe/established osteoporosis = ≤ −2.5 with one or more fragility fractures.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "161", "group": 161, "stem": "Thyroid nodule + suppressed TSH → Next test:", "options": [{"letter": "A", "text": "Molecular testing"}, {"letter": "B", "text": "RAIU scan"}, {"letter": "C", "text": "Brain MRI"}, {"letter": "D", "text": "Thyroid ultrasound alone"}, {"letter": "E", "text": "FNA biopsy"}], "answer": "B", "explanation": "Low TSH → function pathway: RAIU decides whether the nodule itself is the source of hyperthyroidism.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "162", "group": 162, "stem": "CGM time-in-range (70–180) → Goal:", "options": [{"letter": "A", "text": "<25%"}, {"letter": "B", "text": ">70%"}, {"letter": "C", "text": ">50%"}, {"letter": "D", "text": "<4%"}, {"letter": "E", "text": ">90%"}], "answer": "B", "explanation": "TIR >70%, TAR <25%, TBR <4%, <54 mg/dL <1%. CGM is recommended for all adults on insulin.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "163", "group": 163, "stem": "≥2 islet autoantibodies + dysglycemia (IFG/IGT/A1C 5.7–6.4) → Stage and therapy:", "options": [{"letter": "A", "text": "Stage 3 — start insulin"}, {"letter": "B", "text": "Stage 2 — consider teplizumab"}, {"letter": "C", "text": "LADA — oral agents"}, {"letter": "D", "text": "Prediabetes — start metformin"}, {"letter": "E", "text": "Stage 1 — observe only"}], "answer": "B", "explanation": "Stage 2 is where teplizumab (anti-CD3) delays progression to Stage 3 — the first disease-modifying therapy.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "164", "group": 164, "stem": "Low calcium, HIGH PTH, high creatinine, high phosphate → Diagnosis:", "options": [{"letter": "A", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "B", "text": "CKD (secondary hyperparathyroidism)"}, {"letter": "C", "text": "Primary hyperparathyroidism"}, {"letter": "D", "text": "Vitamin D deficiency"}, {"letter": "E", "text": "Hypoparathyroidism"}], "answer": "B", "explanation": "CKD is the MCC of secondary HPT; calcitriol falls even with normal 25-OH-D → needs calcitriol, phosphate binders; rugger-jersey spine.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "165", "group": 165, "stem": "FNA cytology: follicular neoplasm → Next step:", "options": [{"letter": "A", "text": "Calcitonin level"}, {"letter": "B", "text": "RAIU scan"}, {"letter": "C", "text": "Surgery"}, {"letter": "D", "text": "Serial ultrasound"}, {"letter": "E", "text": "Molecular testing then observe"}], "answer": "C", "explanation": "FNA cannot separate follicular adenoma from carcinoma — follicular neoplasm goes to surgery on the lecture algorithm.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "166", "group": 166, "stem": "Patient with type 1 diabetes, pernicious anemia, or celiac disease → Thyroid screening rule:", "options": [{"letter": "A", "text": "Anti-TPO only if goiter"}, {"letter": "B", "text": "Low threshold to check TSH"}, {"letter": "C", "text": "No thyroid testing needed"}, {"letter": "D", "text": "Thyroid ultrasound annually"}, {"letter": "E", "text": "RAIU scan"}], "answer": "B", "explanation": "Hashimoto's, Graves, T1DM, Addison's, pernicious anemia, celiac, RA/SLE travel together.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "167", "group": 167, "stem": "New diagnosis of low bone density → Baseline lab panel:", "options": [{"letter": "A", "text": "A1C, lipids, UACR, FIB-4"}, {"letter": "B", "text": "Cortisol, ACTH, aldosterone, renin"}, {"letter": "C", "text": "PTH, PTHrP, calcitriol, calcitonin"}, {"letter": "D", "text": "Calcium, 25-OH vitamin D, creatinine, TSH"}, {"letter": "E", "text": "CBC, ESR, CRP, ferritin"}], "answer": "D", "explanation": "Add testosterone (men), SPEP (anemia/↑Cr/↑total protein), intact PTH (high calcium) as indicated.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "168", "group": 168, "stem": "Patient with Hashimoto's found to have a 1.5 cm solid nodule → Approach:", "options": [{"letter": "A", "text": "Same US/FNA criteria as any nodule"}, {"letter": "B", "text": "No work-up — Hashimoto's explains it"}, {"letter": "C", "text": "RAIU scan first"}, {"letter": "D", "text": "Immediate surgery"}, {"letter": "E", "text": "Serum calcitonin only"}], "answer": "A", "explanation": "Up to 80% of Hashimoto's patients have nodules; Hashimoto's and cancer are not mutually exclusive — apply the same criteria.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "169", "group": 169, "stem": "Vitamin D repletion with 50,000 IU weekly → Recheck 25-OH-D when:", "options": [{"letter": "A", "text": "After 6 months"}, {"letter": "B", "text": "After 8 weeks"}, {"letter": "C", "text": "Never — treat empirically"}, {"letter": "D", "text": "After 1 week"}, {"letter": "E", "text": "After 1 year"}], "answer": "B", "explanation": "8 weeks of weekly dosing → recheck → maintenance 1,500–2,000 IU/day.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "170", "group": 170, "stem": "USPSTF osteoporosis screening → Recommendation:", "options": [{"letter": "A", "text": "Women ≥50 and men ≥70 regardless of risk factors"}, {"letter": "B", "text": "Men ≥70; younger men with at least one risk factor"}, {"letter": "C", "text": "Women ≥65; younger postmenopausal women with a risk factor"}, {"letter": "D", "text": "Women ≥60 and men ≥60 regardless of risk factors"}, {"letter": "E", "text": "All adults ≥65 and anyone starting a statin"}], "answer": "C", "explanation": "USPSTF 2018: women ≥65 Grade B; men = insufficient evidence (I).", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "171", "group": 171, "stem": "Hemoglobin A1C → Diabetic threshold:", "options": [{"letter": "A", "text": "≥7.0%"}, {"letter": "B", "text": "≥6.5%"}, {"letter": "C", "text": "≥6.0%"}, {"letter": "D", "text": "≥5.7%"}, {"letter": "E", "text": "≥8.0%"}], "answer": "B", "explanation": "A1C ≥6.5% (NGSP-certified assay); 5.7–6.4% prediabetes; ≤5.6% normal.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "172", "group": 172, "stem": "Low BMD on heel SXA or forearm pDXA → Next step:", "options": [{"letter": "A", "text": "Nuclear bone scan"}, {"letter": "B", "text": "FRAX without BMD input"}, {"letter": "C", "text": "Start a bisphosphonate"}, {"letter": "D", "text": "Central DXA of hip and spine"}, {"letter": "E", "text": "Repeat the heel test yearly"}], "answer": "D", "explanation": "Peripheral tests are not as good — confirm with a routine central DXA.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "173", "group": 173, "stem": "Slim adult 30–50, acute-onset diabetes, Hashimoto's, oral agents worked then failed → Diagnosis and test:", "options": [{"letter": "A", "text": "LADA — order anti-GAD"}, {"letter": "B", "text": "Type 1 — C-peptide only"}, {"letter": "C", "text": "Stress hyperglycemia"}, {"letter": "D", "text": "Type 2 — add insulin"}, {"letter": "E", "text": "MODY — genetic testing"}], "answer": "A", "explanation": "LADA (type 1.5): ≥2 of age 30–50, acute onset, BMI <25, autoimmune history = 90% sensitivity for anti-GAD.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "174", "group": 174, "stem": "Who should be screened with islet autoantibodies → Population:", "options": [{"letter": "A", "text": "The general low-risk population"}, {"letter": "B", "text": "First-degree relatives of T1DM patients"}, {"letter": "C", "text": "Everyone with prediabetes"}, {"letter": "D", "text": "All adults ≥35 at screening"}, {"letter": "E", "text": "All overweight children"}], "answer": "B", "explanation": "Autoantibody screening for presymptomatic T1DM is for high-risk people, not the general low-risk population.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "175", "group": 175, "stem": "FRAX thresholds that justify treating osteopenia → Numbers:", "options": [{"letter": "A", "text": "Hip ≥1% or major osteoporotic ≥10%"}, {"letter": "B", "text": "Hip ≥3% or major osteoporotic ≥20%"}, {"letter": "C", "text": "Any probability above zero"}, {"letter": "D", "text": "Hip ≥5% or major osteoporotic ≥30%"}, {"letter": "E", "text": "Hip ≥10% or major osteoporotic ≥40%"}], "answer": "B", "explanation": "10-year probability: hip ≥3% or major osteoporotic ≥20%.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "176", "group": 176, "stem": "NOF osteoporosis screening → Recommendation:", "options": [{"letter": "A", "text": "All adults ≥50"}, {"letter": "B", "text": "Men ≥80 only"}, {"letter": "C", "text": "Women ≥60 and men ≥65"}, {"letter": "D", "text": "Women ≥65 only"}, {"letter": "E", "text": "Women ≥65 and men ≥70"}], "answer": "E", "explanation": "NOF 2015 — the men are the difference from USPSTF.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "177", "group": 177, "stem": "Hypoparathyroidism vs pseudohypoparathyroidism (both low Ca, high phosphate) → The splitter:", "options": [{"letter": "A", "text": "Calcitriol level"}, {"letter": "B", "text": "Calcium level"}, {"letter": "C", "text": "Phosphate level"}, {"letter": "D", "text": "Creatinine level"}, {"letter": "E", "text": "Intact PTH level"}], "answer": "E", "explanation": "Hypoparathyroidism: PTH low/inappropriately normal. Pseudohypoparathyroidism: PTH high (resistance).", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "178", "group": 178, "stem": "Proven hypercortisolism with a 'normal' ACTH → Interpretation:", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Adrenal adenoma Cushing's"}, {"letter": "C", "text": "Normal — stop the workup"}, {"letter": "D", "text": "Exogenous glucocorticoid use"}, {"letter": "E", "text": "ACTH-dependent Cushing's"}], "answer": "E", "explanation": "ACTH should be suppressed by excess cortisol; 'normal' = inappropriately normal.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "179", "group": 179, "stem": "Secondary adrenal insufficiency → Potassium and pigmentation:", "options": [{"letter": "A", "text": "Hyperkalemia without pigmentation"}, {"letter": "B", "text": "Hyperkalemia with hyperpigmentation"}, {"letter": "C", "text": "Hypokalemia with hyperpigmentation"}, {"letter": "D", "text": "Hypokalemia without pigmentation"}, {"letter": "E", "text": "Normal potassium, no hyperpigmentation"}], "answer": "E", "explanation": "Aldosterone runs on the RAA axis, not ACTH, so K stays normal; low ACTH means no MSH-driven pigmentation.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "180", "group": 180, "stem": "Postmenopausal woman with a wrist fracture from a ground-level fall, T-score −1.6 → Management:", "options": [{"letter": "A", "text": "Start a bisphosphonate"}, {"letter": "B", "text": "Observe and repeat DXA"}, {"letter": "C", "text": "Repeat DXA in 2 years"}, {"letter": "D", "text": "Calculate FRAX first"}, {"letter": "E", "text": "Calcium and vitamin D only"}], "answer": "A", "explanation": "NOF: fragility fracture OR T ≤ −2.5 → treat; FRAX is only for the osteopenia gray zone.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "181", "group": 181, "stem": "Pregnant or breastfeeding with hyperthyroidism → Two rules:", "options": [{"letter": "A", "text": "RAIU is fine; methimazole preferred"}, {"letter": "B", "text": "CT neck; methimazole"}, {"letter": "C", "text": "I-131 ablation; no drugs"}, {"letter": "D", "text": "No imaging; no drugs"}, {"letter": "E", "text": "No radioactive iodine; PTU over methimazole"}], "answer": "E", "explanation": "Ultrasound is the imaging of choice; PTU in pregnancy; normalize TSH before conception.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "182", "group": 182, "stem": "Most common cause of hypercalcemia in the INPATIENT setting → Diagnosis:", "options": [{"letter": "A", "text": "Milk-alkali syndrome"}, {"letter": "B", "text": "Malignancy"}, {"letter": "C", "text": "Immobilization"}, {"letter": "D", "text": "Primary hyperparathyroidism"}, {"letter": "E", "text": "Vitamin D intoxication"}], "answer": "B", "explanation": "Malignancy — humoral (PTHrP), osteolytic (myeloma, breast), or calcitriol-mediated (lymphoma); PTH is suppressed in all three.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "183", "group": 183, "stem": "Suspected cortisol DEFICIENCY → Time to draw cortisol:", "options": [{"letter": "A", "text": "Noon"}, {"letter": "B", "text": "Random"}, {"letter": "C", "text": "8 AM"}, {"letter": "D", "text": "Midnight"}, {"letter": "E", "text": "4 PM"}], "answer": "C", "explanation": "Draw when cortisol should be HIGH (8 AM); low = insufficiency. Suspect excess → draw at midnight when it should be low.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "184", "group": 184, "stem": "Drugs that disrupt the aldosterone:renin axis you are trying to measure → Classes:", "options": [{"letter": "A", "text": "Beta-blockers, clonidine, hydralazine"}, {"letter": "B", "text": "Statins, ezetimibe, fibrates"}, {"letter": "C", "text": "ACE inhibitors, ARBs, spironolactone / eplerenone"}, {"letter": "D", "text": "Levothyroxine, methimazole, PTU"}, {"letter": "E", "text": "Metformin, sulfonylureas, insulin"}], "answer": "C", "explanation": "Get the specialist involved so the aldosterone:renin is done right the first time.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "185", "group": 185, "stem": "Primary hyperparathyroidism proven biochemically → Role of the sestamibi scan:", "options": [{"letter": "A", "text": "Localize the gland for surgery"}, {"letter": "B", "text": "Decide whether to use cinacalcet"}, {"letter": "C", "text": "Confirm the diagnosis"}, {"letter": "D", "text": "Grade disease severity"}, {"letter": "E", "text": "Rule out parathyroid cancer"}], "answer": "A", "explanation": "PHPT is diagnosed by Ca + PTH; the parathyroid scan localizes (glands can sit in the mediastinum) — it never diagnoses.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "186", "group": 186, "stem": "I-131 ablation for Graves → Expected long-term outcome:", "options": [{"letter": "A", "text": "Permanent hypothyroidism"}, {"letter": "B", "text": "Recurrent hyperthyroidism"}, {"letter": "C", "text": "Thyroid malignancy"}, {"letter": "D", "text": "Permanent hypoparathyroidism"}, {"letter": "E", "text": "Durable euthyroidism"}], "answer": "A", "explanation": "Ablation trades hyperthyroidism for treatable permanent hypothyroidism with TSH monitoring. Useless for medullary thyroid cancer.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "187", "group": 187, "stem": "FNA cytology: benign → Next step:", "options": [{"letter": "A", "text": "Serial ultrasound at 6–18 months"}, {"letter": "B", "text": "Diagnostic lobectomy"}, {"letter": "C", "text": "Molecular testing panel"}, {"letter": "D", "text": "RAIU scan at 6 months"}, {"letter": "E", "text": "Repeat FNA in 3 months"}], "answer": "A", "explanation": "Benign is the majority: US at 6–18 months then longer intervals; re-biopsy only for growth ≥50% volume or 20% in two dimensions.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "188", "group": 188, "stem": "Most common cause of hypothyroidism → Diagnosis:", "options": [{"letter": "A", "text": "Central hypothyroidism"}, {"letter": "B", "text": "Graves disease"}, {"letter": "C", "text": "Hashimoto's thyroiditis"}, {"letter": "D", "text": "Iodine deficiency"}, {"letter": "E", "text": "Postpartum thyroiditis"}], "answer": "C", "explanation": "Autoimmune (Hashimoto's) thyroiditis is by far the MCC in iodine-sufficient areas; anti-TPO testing is optional when the picture is classic.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "189", "group": 189, "stem": "TSH-receptor stimulating antibody (TSI / TRAb) → Disease:", "options": [{"letter": "A", "text": "Struma ovarii"}, {"letter": "B", "text": "Graves disease"}, {"letter": "C", "text": "Hashimoto's thyroiditis"}, {"letter": "D", "text": "Toxic multinodular goiter"}, {"letter": "E", "text": "Postpartum thyroiditis"}], "answer": "B", "explanation": "TSI is positive in ~90% of Graves and is prognostic on methimazole — when it disappears, tapering off is reasonable.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "190", "group": 190, "stem": "Nodule >1 cm, solid, irregular margins, normal TSH → Next step:", "options": [{"letter": "A", "text": "I-131 ablation"}, {"letter": "B", "text": "FNA biopsy (US-guided)"}, {"letter": "C", "text": "RAIU scan"}, {"letter": "D", "text": "Thyroidectomy"}, {"letter": "E", "text": "Observe without imaging"}], "answer": "B", "explanation": "Worrisome US features in a non-functioning nodule → FNA. US characterizes; FNA diagnoses.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "191", "group": 191, "stem": "↓ K + hypertension (± Na 143–147) → Gland:", "options": [{"letter": "A", "text": "Adrenal — Conn's syndrome"}, {"letter": "B", "text": "Adrenal — Addison's disease"}, {"letter": "C", "text": "Thyroid — Graves disease"}, {"letter": "D", "text": "Pancreas — type 1 diabetes"}, {"letter": "E", "text": "Parathyroid — primary HPT"}], "answer": "A", "explanation": "Aldosterone excess: Na retention, K and H+ loss → HTN + hypokalemia.", "objective": "Combined Pattern Guide — Cross-cutting rules", "section": "Cross-cutting rules"}, {"id": "192", "group": 192, "stem": "Septic ICU patient with glucose 240 → Diagnosis:", "options": [{"letter": "A", "text": "Type 2 diabetes — start metformin"}, {"letter": "B", "text": "Prediabetes — repeat in 1 year"}, {"letter": "C", "text": "LADA — order anti-GAD antibodies"}, {"letter": "D", "text": "Type 1 diabetes — start insulin"}, {"letter": "E", "text": "Stress hyperglycemia — not diabetes"}], "answer": "E", "explanation": "Cortisol, catecholamines, glucagon and GH drive stress hyperglycemia in critical illness.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "193", "group": 193, "stem": "Z-score → Comparison group:", "options": [{"letter": "A", "text": "The patient's prior scan"}, {"letter": "B", "text": "Postmenopausal women"}, {"letter": "C", "text": "Young healthy adults"}, {"letter": "D", "text": "Age-matched peers"}, {"letter": "E", "text": "Men over 70"}], "answer": "D", "explanation": "Z-score compares to same-age adults; T-score is used for diagnosis in postmenopausal women and men ≥50.", "objective": "Combined Pattern Guide — Bone density", "section": "Bone density"}, {"id": "194", "group": 194, "stem": "Screening for type 2 diabetes → Who (ADA):", "options": [{"letter": "A", "text": "All adults ≥35; earlier if overweight with a risk factor"}, {"letter": "B", "text": "Only first-degree relatives of diabetics"}, {"letter": "C", "text": "All adults ≥45 regardless of weight"}, {"letter": "D", "text": "All adults ≥18 at every visit"}, {"letter": "E", "text": "Only adults with hyperglycemic symptoms"}], "answer": "A", "explanation": "Normal → repeat every 3 years; prediabetes → yearly; prior gestational DM → every 1–3 years.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "195", "group": 195, "stem": "Total calcium 7.8 mg/dL with albumin 2.0 → Corrected calcium:", "options": [{"letter": "A", "text": "9.4 (normal — no workup)"}, {"letter": "B", "text": "6.2 — severe hypocalcemia"}, {"letter": "C", "text": "7.8 — true hypocalcemia"}, {"letter": "D", "text": "8.6 — mild hypocalcemia"}, {"letter": "E", "text": "10.2 — hypercalcemia"}], "answer": "A", "explanation": "Corrected Ca = Ca + 0.8 × (4 − albumin) = 7.8 + 1.6 = 9.4. Do not work up pseudohypocalcemia.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "196", "group": 196, "stem": "Suspected type 1 diabetes → First autoantibody to order:", "options": [{"letter": "A", "text": "Anti-21-hydroxylase"}, {"letter": "B", "text": "Anti-GAD65"}, {"letter": "C", "text": "TSI"}, {"letter": "D", "text": "Anti-TPO"}, {"letter": "E", "text": "Anti-ZnT8 only"}], "answer": "B", "explanation": "Anti-GAD65 is positive in 60–80%; GAD + IA-2 together >90%. A negative GAD does not exclude T1 → test IA-2 / ZnT8.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "197", "group": 197, "stem": "Stable on a steady levothyroxine dose → TSH frequency:", "options": [{"letter": "A", "text": "Every 4–6 weeks"}, {"letter": "B", "text": "Every 3 months"}, {"letter": "C", "text": "Every 6 months"}, {"letter": "D", "text": "Every 2 years"}, {"letter": "E", "text": "Annually"}], "answer": "E", "explanation": "Once stable, TSH annually or sooner with symptoms. Ask about adherence before raising a dose.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "198", "group": 198, "stem": "Addison's disease → Aldosterone and renin pattern:", "options": [{"letter": "A", "text": "Both high"}, {"letter": "B", "text": "Aldosterone LOW, renin HIGH"}, {"letter": "C", "text": "Both low"}, {"letter": "D", "text": "Aldosterone HIGH, renin LOW"}, {"letter": "E", "text": "Both normal"}], "answer": "B", "explanation": "The mirror image of Conn's (aldosterone high, renin low).", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "199", "group": 199, "stem": "Hypercalcemia, suppressed PTH, HIGH 25-OH vitamin D → Diagnosis:", "options": [{"letter": "A", "text": "Sarcoidosis"}, {"letter": "B", "text": "Vitamin D intoxication"}, {"letter": "C", "text": "Tertiary hyperparathyroidism"}, {"letter": "D", "text": "Lymphoma"}, {"letter": "E", "text": "Primary hyperparathyroidism"}], "answer": "B", "explanation": "Which vitamin D is high is the splitter: calcidiol (25-OH) = intoxication; calcitriol (1,25) = sarcoid/lymphoma.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "200", "group": 200, "stem": "RAIU: multiple discrete hot foci → Diagnosis:", "options": [{"letter": "A", "text": "Hashimoto's thyroiditis"}, {"letter": "B", "text": "TSH-secreting adenoma"}, {"letter": "C", "text": "Toxic adenoma"}, {"letter": "D", "text": "Graves disease"}, {"letter": "E", "text": "Toxic multinodular goiter"}], "answer": "E", "explanation": "Multiple discrete foci of variably increased uptake = toxic MNG.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "201", "group": 201, "stem": "Proven RET mutation carrier in a MEN2 family → Recommended intervention:", "options": [{"letter": "A", "text": "Annual thyroid ultrasound only"}, {"letter": "B", "text": "Lifelong TSH suppression"}, {"letter": "C", "text": "Prophylactic thyroidectomy"}, {"letter": "D", "text": "I-131 ablation"}, {"letter": "E", "text": "Annual calcitonin only"}], "answer": "C", "explanation": "MEN2 carriers have nearly 100% risk of medullary carcinoma → prophylactic thyroidectomy; genetic counseling for the family.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "202", "group": 202, "stem": "2-hour 75-g OGTT → Diabetic threshold:", "options": [{"letter": "A", "text": "≥140 mg/dL"}, {"letter": "B", "text": "≥126 mg/dL"}, {"letter": "C", "text": "≥180 mg/dL"}, {"letter": "D", "text": "≥153 mg/dL"}, {"letter": "E", "text": "≥200 mg/dL"}], "answer": "E", "explanation": "OGTT ≥200 = diabetes; 140–199 = impaired glucose tolerance; <140 normal. Most sensitive test; mainly used for gestational DM.", "objective": "Combined Pattern Guide — Diabetes", "section": "Diabetes"}, {"id": "203", "group": 203, "stem": "Suspected vitamin D deficiency → Test to order:", "options": [{"letter": "A", "text": "Ionized calcium"}, {"letter": "B", "text": "Intact PTH"}, {"letter": "C", "text": "ALP"}, {"letter": "D", "text": "25-hydroxyvitamin D (calcidiol)"}, {"letter": "E", "text": "1,25-dihydroxyvitamin D (calcitriol)"}], "answer": "D", "explanation": "Always the 25-OH storage form for status (<20 deficient); calcitriol can be normal or high in deficiency because secondary HPT drives 1α-hydroxylase.", "objective": "Combined Pattern Guide — Calcium & parathyroid", "section": "Calcium & parathyroid"}, {"id": "204", "group": 204, "stem": "Subclinical hyperthyroidism in a 78-year-old → Most likely cause:", "options": [{"letter": "A", "text": "Toxic adenoma / toxic multinodular goiter"}, {"letter": "B", "text": "Hashimoto's thyroiditis"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "De Quervain's thyroiditis"}, {"letter": "E", "text": "TSH-secreting pituitary adenoma"}], "answer": "A", "explanation": "In the elderly, subclinical hyperthyroidism is usually a toxic adenoma or TMG — not Graves. Treat the cause if symptomatic, >65, CV disease, or osteoporosis.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "205", "group": 205, "stem": "Microcalcifications within a thyroid nodule → Cancer type:", "options": [{"letter": "A", "text": "Medullary carcinoma"}, {"letter": "B", "text": "Thyroid lymphoma"}, {"letter": "C", "text": "Follicular carcinoma"}, {"letter": "D", "text": "Anaplastic carcinoma"}, {"letter": "E", "text": "Papillary carcinoma"}], "answer": "E", "explanation": "Microcalcifications ↔ papillary (the MC, least aggressive type). Lecture example: 1.9 cm nodule with microcalcifications → biopsy.", "objective": "Combined Pattern Guide — Thyroid nodules & cancer", "section": "Thyroid nodules & cancer"}, {"id": "206", "group": 206, "stem": "Thyrotoxic labs with NO symptoms in a patient taking mega-dose hair/nail supplements → Likely cause:", "options": [{"letter": "A", "text": "Graves disease"}, {"letter": "B", "text": "Thyroid hormone resistance"}, {"letter": "C", "text": "Biotin assay interference"}, {"letter": "D", "text": "Toxic adenoma"}, {"letter": "E", "text": "Factitious thyrotoxicosis"}], "answer": "C", "explanation": "Biotin mimics Graves on the assay (low TSH, high T4/T3). Hold biotin 48 h and repeat.", "objective": "Combined Pattern Guide — Thyroid function", "section": "Thyroid function"}, {"id": "207", "group": 207, "stem": "Pheochromocytoma vs panic/anxiety disorder → Test that settles it:", "options": [{"letter": "A", "text": "Plasma free metanephrines"}, {"letter": "B", "text": "ECG"}, {"letter": "C", "text": "Brain MRI"}, {"letter": "D", "text": "Aldosterone:renin ratio"}, {"letter": "E", "text": "Thyroid function tests"}], "answer": "A", "explanation": "Episodic headache + sweating + palpitations with labile HTN → plasma free metanephrines.", "objective": "Combined Pattern Guide — Adrenal", "section": "Adrenal"}, {"id": "208", "group": 208, "stem": "Positive anti-TPO antibody → Other autoimmune diseases (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  const flagged = {};        // question id -> true (set by the student at any point; never affects the score)
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  // Flagging: available on every question in every mode, answered or not. A flagged
  // question joins the missed list and the copy-out, so a question that was guessed
  // right can still be carried into the next round of study.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">\u2691 ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '\u2691 ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (flagged[q.id] && mode !== 'exam') html += '<span class="flagtag">\u2691 FLAGGED</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += flagHtml(q);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {                 // wrong, or flagged by the student
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }
  function wrongCount() { return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer).length; }
  function flaggedCount() { return Object.keys(flagged).length; }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    const nf = flaggedCount();
    if (nf) html += '<div class="score-note" style="text-align:center;margin:-6px 0 12px">' + nf + ' question' + (nf === 1 ? '' : 's') +
      ' flagged for review (flags never change the score)</div>';
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + wrongCount() + ' missed, ' + flaggedCount() + ' flagged)';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered' : 'My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
