is — Emergency line, Exam, Management; Special Considerations \"Non-specificity.\"", "section": "Pancreatitis with an unusual laboratory picture"}, {"id": "24B", "group": 24, "stem": "Which of the following is the most appropriate acute therapy in addition to fluids?", "options": [{"letter": "A", "text": "An insulin infusion with glucose monitoring"}, {"letter": "B", "text": "A statin at the maximum tolerated dose"}, {"letter": "C", "text": "Oral omega-3 fatty acids at high dose"}, {"letter": "D", "text": "A fibrate started on admission"}, {"letter": "E", "text": "Prophylactic imipenem with bowel rest"}], "answer": "A", "explanation": "An insulin infusion with glucose monitoring. Insulin with glucose clears chylomicrons and acutely lowers triglycerides; plasmapheresis is reserved for severe cases. Fibrates come later, once he is tolerating intake, to prevent recurrence — they are not the acute therapy.", "objective": "Guide: Hypertriglyceridemia-Induced Pancreatitis — Management.", "section": "Pancreatitis with an unusual laboratory picture"}, {"id": "25", "group": 25, "stem": "A 39-year-old woman has had eight months of recurrent right upper quadrant pain after meals, radiating to the right scapula and lasting a couple of hours. Two ultrasounds have shown no stones or sludge, and her liver enzymes, lipase, and CBC have been normal each time. Upper endoscopy was normal.\n\nWhich of the following studies would establish the diagnosis?", "options": [{"letter": "A", "text": "HIDA scan with cholecystokinin-stimulated ejection fraction"}, {"letter": "B", "text": "Endoscopic ultrasound of the gallbladder and duct"}, {"letter": "C", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "D", "text": "Repeat ultrasound after a fatty meal challenge"}, {"letter": "E", "text": "Esophageal manometry with pH monitoring"}], "answer": "A", "explanation": "HIDA scan with cholecystokinin-stimulated ejection fraction. Biliary pain with no stones, normal labs and normal imaging is functional gallbladder disorder — a diagnosis of exclusion whose one positive functional test is the CCK-stimulated HIDA.", "objective": "Guide: Biliary Dyskinesia — Diagnostics, 1st Line and Gold Standard.", "section": "Biliary pain with a normal workup"}, {"id": "25A", "group": 25, "stem": "Which of the following results supports the diagnosis?", "options": [{"letter": "A", "text": "Failure of the gallbladder to fill at one hour"}, {"letter": "B", "text": "A gallbladder ejection fraction below 35 percent"}, {"letter": "C", "text": "Delayed gallbladder filling with normal emptying"}, {"letter": "D", "text": "A common bile duct measuring 9 mm after the meal"}, {"letter": "E", "text": "A gallbladder ejection fraction above 60 percent"}], "answer": "B", "explanation": "A gallbladder ejection fraction below 35 percent. Normal is above 35%. Failure of the gallbladder to fill at all is the finding in acute cholecystitis, while merely delayed filling — not complete non-visualization — is the pattern in chronic cholecystitis, which is a histopathologic diagnosis in a gallbladder that almost always contains stones. Treatment for dyskinesia is elective cholecystectomy.", "objective": "Guide: Biliary Dyskinesia — Diagnostics, Management; Chronic Cholecystitis — Diagnostics, Confirmatory.", "section": "Biliary pain with a normal workup"}, {"id": "26", "group": 26, "stem": "A 58-year-old man who had a small bowel resection with a stricturoplasty for Crohn's disease four years ago has months of bloating, excessive flatulence, crampy pain, and loose stools. His Crohn's has been quiescent, his CRP is normal, and his fecal calprotectin is 40 µg/g.\n\nWhich of the following is the most appropriate diagnostic test?", "options": [{"letter": "A", "text": "Fecal elastase-1 measurement"}, {"letter": "B", "text": "Hydrogen breath testing"}, {"letter": "C", "text": "CT enterography of the small bowel"}, {"letter": "D", "text": "Stool ova and parasite examination"}, {"letter": "E", "text": "Colonoscopy with random biopsies"}], "answer": "B", "explanation": "Hydrogen breath testing. Small intestinal bacterial overgrowth in the classic setting — prior bowel surgery with a stricturoplasty, a blind loop, and slowed transit — with quiescent Crohn's, a normal CRP, and a normal calprotectin arguing against active inflammation. Small bowel aspirate with culture is the alternative.", "objective": "Guide: Small Intestinal Bacterial Overgrowth — Diagnostics; Special Considerations \"Setting.\"", "section": "Bloating after bowel surgery"}, {"id": "26A", "group": 26, "stem": "Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "Pancrelipase with the first bite of each meal"}, {"letter": "B", "text": "Rifaximin with correction of the underlying driver"}, {"letter": "C", "text": "Budesonide with a low-residue diet"}, {"letter": "D", "text": "Loperamide taken before each meal"}, {"letter": "E", "text": "A gluten-free diet with dietitian support"}], "answer": "B", "explanation": "Rifaximin with correction of the underlying driver. Antibiotics — rifaximin, metronidazole, or amoxicillin-clavulanate — combined with treating the driver, whether that is a stricture or a motility problem. Treating the bacteria without addressing the anatomy invites recurrence.", "objective": "Guide: SIBO — Management, First Line.", "section": "Bloating after bowel surgery"}, {"id": "27", "group": 27, "stem": "A 22-year-old man is referred by psychiatry after four months of a coarse tremor in both hands, slurred speech, and irritability that his family describes as a change in personality. His transaminases have been mildly elevated on two occasions over the past year. He does not drink alcohol, takes no medications, and has no history of hepatitis exposure. A brother had unexplained liver disease in his twenties.\n\nWhich of the following is the most appropriate initial laboratory evaluation?", "options": [{"letter": "A", "text": "Anti-smooth muscle antibody with serum IgG"}, {"letter": "B", "text": "Serum ferritin with transferrin saturation"}, {"letter": "C", "text": "Anti-mitochondrial antibody with serum IgM"}, {"letter": "D", "text": "Serum ceruloplasmin with a 24-hour urinary copper"}, {"letter": "E", "text": "Serum alpha-1 antitrypsin level with phenotyping"}], "answer": "D", "explanation": "Serum ceruloplasmin with a 24-hour urinary copper. Wilson's disease should be suspected in any young patient with liver disease plus neurologic or psychiatric findings. Ceruloplasmin below 20 mg/dL with a high 24-hour urinary copper is the first-line pair; ATP7B testing confirms.", "objective": "Guide: Wilson's Disease — Diagnostics, 1st Line Labs; Special Considerations \"Key trap.\"", "section": "The young patient with liver and brain findings"}, {"id": "27A", "group": 27, "stem": "Which of the following examination findings would support the diagnosis?", "options": [{"letter": "A", "text": "A barrel-shaped chest with expiratory wheezing"}, {"letter": "B", "text": "Bronze skin with metacarpophalangeal joint arthropathy"}, {"letter": "C", "text": "Spider angiomata with prominent palmar erythema"}, {"letter": "D", "text": "Kayser-Fleischer rings on slit-lamp examination"}, {"letter": "E", "text": "Xanthelasma with excoriations from chronic pruritus"}], "answer": "D", "explanation": "Kayser-Fleischer rings on slit-lamp examination. Bronze skin with MCP arthropathy is hemochromatosis; xanthelasma with pruritus is PBC; a barrel chest in a non-smoker suggests alpha-1 antitrypsin deficiency.", "objective": "Guide: Wilson's Disease — Exam; Diagnostics, 1st Line.", "section": "The young patient with liver and brain findings"}, {"id": "28", "group": 28, "stem": "A 51-year-old man of northern European descent has two years of fatigue, aching in the second and third knuckles of both hands, and reduced libido. He was told last year that he has diabetes and now takes metformin. His father died of cirrhosis and was never a heavy drinker. He drinks two beers a week. His skin has a deep bronze cast even where the sun does not reach, and he has tenderness over the metacarpophalangeal joints and a liver edge 3 cm below the costal margin.\n\n| Test | Result |\n|---|---|\n| AST / ALT | 78 / 64 U/L |\n| Transferrin saturation | 68% |\n| Ferritin | 1,240 ng/mL |\n| Hemoglobin A1c | 8.1% |\n| Total bilirubin | 1.0 mg/dL |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "B", "text": "Metabolic dysfunction-associated steatohepatitis"}, {"letter": "C", "text": "Alcohol-related liver disease"}, {"letter": "D", "text": "Hereditary hemochromatosis"}, {"letter": "E", "text": "Wilson's disease"}], "answer": "D", "explanation": "Hereditary hemochromatosis. Bronze skin, diabetes, MCP arthropathy, hypogonadism, and a family history of cirrhosis in a northern European man. A transferrin saturation above 45% with a ferritin above 300 is a positive screen.", "objective": "Guide: Hemochromatosis — Common Patient, Presentation, Diagnostics, 1st Line Labs.", "section": "Bronze skin with joint pain"}, {"id": "28A", "group": 28, "stem": "Which of the following confirms the diagnosis?", "options": [{"letter": "A", "text": "Anti-smooth muscle antibody with serum IgG"}, {"letter": "B", "text": "HFE gene testing for C282Y and H63D"}, {"letter": "C", "text": "Transient elastography of the liver"}, {"letter": "D", "text": "ATP7B gene testing"}, {"letter": "E", "text": "Serum ceruloplasmin with urinary copper"}], "answer": "B", "explanation": "HFE gene testing for C282Y and H63D. Two abnormal HFE genes confirm; liver biopsy showing iron overload is the alternative confirmatory test. It is autosomal recessive on chromosome 6.", "objective": "Guide: Hemochromatosis — Diagnostics, Confirmatory; Special Considerations \"Genetics.\"", "section": "Bronze skin with joint pain"}, {"id": "28B", "group": 28, "stem": "Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "Ursodeoxycholic acid with fat-soluble vitamins"}, {"letter": "B", "text": "D-penicillamine with a low-copper diet"}, {"letter": "C", "text": "Serial phlebotomy with avoidance of alcohol and iron"}, {"letter": "D", "text": "Deferoxamine chelation as first-line therapy"}, {"letter": "E", "text": "Prednisone tapered over twelve weeks"}], "answer": "C", "explanation": "Serial phlebotomy with avoidance of alcohol and iron. Phlebotomy prevents further damage but does not reverse what has already occurred. He also needs HCC surveillance — hemochromatosis sits with hepatitis B, hepatitis C, and steatohepatitis at the top of the risk list.", "objective": "Guide: Hemochromatosis — Management; Special Considerations \"Phlebotomy,\" \"HCC risk.\"", "section": "Bronze skin with joint pain"}, {"id": "29", "group": 29, "stem": "A 68-year-old man is in the intensive care unit on day twelve after a motor vehicle collision. He is ventilated, has been receiving total parenteral nutrition, and is immobile with multiple orthopedic injuries. Over the past two days he has developed a fever with a rising white count and no identified source; blood and urine cultures are negative and his chest radiograph is unchanged. His temperature is 38.6°C (101.5°F), blood pressure is 104/62 mm Hg, and pulse is 116/min. He is sedated and cannot report pain, and the abdomen is distended with a vaguely palpable fullness under the right costal margin.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 19,200/mm³ |\n| Total bilirubin | 1.8 mg/dL |\n| Alkaline phosphatase | 210 U/L |\n| AST / ALT | 78 / 66 U/L |\n| Right upper quadrant ultrasound | Gallbladder wall 6 mm, pericholecystic fluid, sludge, NO stones |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acalculous cholecystitis"}, {"letter": "B", "text": "Biliary dyskinesia"}, {"letter": "C", "text": "Chronic cholecystitis"}, {"letter": "D", "text": "Acute cholangitis"}, {"letter": "E", "text": "Calculous acute cholecystitis"}], "answer": "A", "explanation": "Acalculous cholecystitis. Unexplained fever and leukocytosis in a critically ill patient on parenteral nutrition, ventilated and immobile — that combination is itself the trigger to look. Ultrasound shows wall thickening with pericholecystic fluid and no stones. It accounts for about 10% of acute cholecystitis and carries higher morbidity than the calculous form, with early gangrene and perforation.", "objective": "Guide: Acalculous Cholecystitis — Common Patient, Emergency line, Diagnostics.", "section": "Fever in the intensive care unit"}, {"id": "29A", "group": 29, "stem": "Which of the following is the gold standard confirmatory test?", "options": [{"letter": "A", "text": "MRCP showing beaded intrahepatic ducts"}, {"letter": "B", "text": "ERCP with brushings of the cystic duct"}, {"letter": "C", "text": "CT of the abdomen showing a hypodense gallbladder wall"}, {"letter": "D", "text": "Endoscopic ultrasound of the gallbladder fossa"}, {"letter": "E", "text": "HIDA scan showing failure of gallbladder filling"}], "answer": "E", "explanation": "HIDA scan showing failure of gallbladder filling. Failure to fill indicates functional cystic duct obstruction.", "objective": "Guide: Acalculous Cholecystitis — Diagnostics, Gold Standard.", "section": "Fever in the intensive care unit"}, {"id": "29B", "group": 29, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Percutaneous cholecystostomy drainage with intravenous antibiotics"}, {"letter": "B", "text": "Ursodeoxycholic acid with discontinuation of parenteral nutrition"}, {"letter": "C", "text": "ERCP with sphincterotomy and biliary stent placement"}, {"letter": "D", "text": "Emergent laparoscopic cholecystectomy with antibiotics"}, {"letter": "E", "text": "Intravenous antibiotics alone with repeat imaging in 48 hours"}], "answer": "A", "explanation": "Percutaneous cholecystostomy drainage with intravenous antibiotics. Drainage is the treatment in a patient too ill to operate on — percutaneous or endoscopic — with the same antibiotics used for calculous disease. A later cholecystectomy is often unnecessary because recurrence is low.", "objective": "Guide: Acalculous Cholecystitis — Management; Surgical.", "section": "Fever in the intensive care unit"}, {"id": "30", "group": 30, "stem": "A 68-year-old man is on postoperative day three after an open hernia repair. He has abdominal bloating with mild diffuse discomfort and has vomited twice; he has passed no flatus. He has been receiving hydromorphone by patient-controlled analgesia. His temperature is 37.1°C (98.8°F) and pulse is 88/min. His abdomen is distended and tympanitic with absent bowel sounds, no localized tenderness, and no peritoneal signs. His potassium is 3.0 mEq/L and magnesium 1.4 mg/dL, and an abdominal radiograph shows gas distributed throughout the small bowel, colon, and rectum with no transition point.\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Mesenteric ischemia presenting as ileus"}, {"letter": "B", "text": "Adhesive small bowel obstruction"}, {"letter": "C", "text": "Adynamic ileus"}, {"letter": "D", "text": "Early anastomotic leak with peritonitis"}, {"letter": "E", "text": "Ogilvie syndrome with impending perforation"}], "answer": "C", "explanation": "Adynamic ileus. Postoperative ileus is the most common cause, lasting 48–72 hours and longer on high-dose opioids, and hypokalemia and hypomagnesemia are classic contributors. The contrast with mechanical obstruction is the whole question: quiet or absent sounds, mild diffuse pain, no peritoneal signs, no fever or tachycardia, and gas all the way through to the rectum with no transition point.", "objective": "Guide: Adynamic Ileus — Diagnostics; Special Considerations \"Key contrast with SBO.\"", "section": "A quiet distended abdomen after surgery"}, {"id": "30A", "group": 30, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Emergent exploratory laparotomy with adhesiolysis"}, {"letter": "B", "text": "Neostigmine infusion with continuous cardiac monitoring"}, {"letter": "C", "text": "Broad-spectrum intravenous antibiotics with serial lactates"}, {"letter": "D", "text": "Aggressive intravenous fluid loading with maintenance at 200 mL/hr"}, {"letter": "E", "text": "Correct the potassium and magnesium and limit narcotics"}], "answer": "E", "explanation": "Correct the potassium and magnesium and limit narcotics. Along with bowel rest, nasogastric suction, early ambulation, and chewing gum, which stimulates the cephalocaudal reflex. Excess IV fluids worsen bowel edema. And severe pain in a supposed ileus is ischemia until proven otherwise.", "objective": "Guide: Adynamic Ileus — Management; Emergency line.", "section": "A quiet distended abdomen after surgery"}, {"id": "31", "group": 31, "stem": "A 6-year-old girl has three days of crampy abdominal pain with diarrhea that became bloody yesterday. She has no fever. Five days ago she ate an undercooked hamburger at a family cookout.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Loperamide with oral rehydration solution"}, {"letter": "B", "text": "Intravenous ceftriaxone with intravenous fluid resuscitation"}, {"letter": "C", "text": "Oral metronidazole with oral rehydration solution"}, {"letter": "D", "text": "Supportive care with monitoring for hemolytic uremic syndrome"}, {"letter": "E", "text": "Oral azithromycin with oral rehydration solution"}], "answer": "D", "explanation": "Supportive care with monitoring for hemolytic uremic syndrome. Bloody diarrhea without fever after undercooked beef is Shiga-toxin-producing E. coli. Antibiotics increase toxin release and HUS risk, and antimotility agents prolong toxin exposure. HUS appears 5–10 days after diarrhea starts in 15–20% of children under 10.", "objective": "Guide: EHEC — Management, AVOID; Warnings.", "section": "Bloody diarrhea after a cookout"}, {"id": "32", "group": 32, "stem": "A 36-year-old man with untreated HIV and a CD4 count of 90 cells/µL has two weeks of pain with swallowing. Examination shows white plaques on the tongue and buccal mucosa that scrape off.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Empiric oral fluconazole"}, {"letter": "B", "text": "Empiric intravenous ganciclovir"}, {"letter": "C", "text": "Clotrimazole troches"}, {"letter": "D", "text": "Upper endoscopy with biopsy"}, {"letter": "E", "text": "Empiric oral acyclovir"}], "answer": "A", "explanation": "Empiric oral fluconazole. HIV with thrush and odynophagia is treated empirically for Candida esophagitis — no scope needed up front. A CD4 count under 200 makes it an AIDS-defining illness. It must be systemic therapy: topical antifungals such as clotrimazole troches are never adequate for esophageal disease.", "objective": "Guide: Candida Esophagitis — Diagnostics, Clinical Dx; Management, Never.", "section": "Painful swallowing in immunosuppression"}, {"id": "32A", "group": 32, "stem": "He has no improvement after five days. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Esophageal manometry with impedance"}, {"letter": "B", "text": "Doubling the fluconazole dose for another week"}, {"letter": "C", "text": "Empiric ganciclovir without endoscopy"}, {"letter": "D", "text": "A barium esophagram"}, {"letter": "E", "text": "Upper endoscopy with biopsy"}], "answer": "E", "explanation": "Upper endoscopy with biopsy. Failure to respond in three to five days is the trigger for endoscopy — it is the only way to separate the four causes of esophagitis, and here it would look for HSV or CMV ulcers rather than white plaques.", "objective": "Guide: Candida Esophagitis — Diagnostics, 1st Line; Esophagitis — Diagnostics.", "section": "Painful swallowing in immunosuppression"}, {"id": "33", "group": 33, "stem": "A 55-year-old woman who used injection drugs in her twenties has a positive hepatitis C antibody. Her HCV RNA is undetectable on two separate occasions, and her liver enzymes are normal.\n\nWhich of the following best describes her status?", "options": [{"letter": "A", "text": "A false-positive antibody requiring no further discussion"}, {"letter": "B", "text": "Cleared or cured infection, with no immunity against reinfection"}, {"letter": "C", "text": "Active chronic infection that warrants antiviral therapy"}, {"letter": "D", "text": "Immunity from prior infection that protects against reinfection"}, {"letter": "E", "text": "A chronic carrier state requiring six-monthly monitoring"}], "answer": "B", "explanation": "Cleared or cured infection, with no immunity against reinfection. There is no hepatitis C carrier state: a positive antibody with undetectable RNA means the infection was cleared or cured. The antibody persists and confers no immunity, so she needs counseling about reinfection and retesting if exposure continues.", "objective": "Guide: Hepatitis C Carrier State — Explained to Patient, Diagnostics, Management.", "section": "An antibody without a virus"}, {"id": "34", "group": 34, "stem": "A 63-year-old man has three days of steadily worsening left lower quadrant pain with a low-grade fever, nausea, and looser stools than usual. He has had two similar milder episodes over the past four years and eats little fiber. He has had no rectal bleeding and no weight loss. His temperature is 38.1°C (100.6°F), blood pressure is 134/80 mm Hg, and pulse is 98/min. He has focal left lower quadrant tenderness with voluntary guarding, no rebound, and no palpable mass; bowel sounds are present.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 16,200/mm³ |\n| CRP | 165 mg/L |\n| Creatinine | 1.0 mg/dL |\n| Urinalysis | Few white cells, no bacteria |\n| Lactate | 1.2 mmol/L |\n\nWhich of the following is the most appropriate next step in evaluation?", "options": [{"letter": "A", "text": "Abdominal ultrasound of the left lower quadrant"}, {"letter": "B", "text": "Colonoscopy with biopsy of the affected segment"}, {"letter": "C", "text": "CT of the abdomen and pelvis with contrast"}, {"letter": "D", "text": "Flexible sigmoidoscopy without preparation"}, {"letter": "E", "text": "Water-soluble contrast enema"}], "answer": "C", "explanation": "CT of the abdomen and pelvis with contrast. Wall thickening with pericolonic fat stranding alongside diverticula, and it assesses for perforation and abscess. Colonoscopy and barium enema are contraindicated during the acute episode.", "objective": "Guide: Diverticulitis — Diagnostics, 1st Line Imaging; Warnings.", "section": "Left lower quadrant pain with fever"}, {"id": "34A", "group": 34, "stem": "The study shows sigmoid wall thickening with pericolonic fat stranding and a 3 cm walled-off pelvic abscess. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Immediate colonoscopy to exclude a malignancy"}, {"letter": "B", "text": "Oral antibiotics with outpatient follow-up in two days"}, {"letter": "C", "text": "Intravenous antibiotics alone with serial examinations"}, {"letter": "D", "text": "Percutaneous drainage with intravenous antibiotics"}, {"letter": "E", "text": "Emergent sigmoid colectomy with end colostomy"}], "answer": "D", "explanation": "Percutaneous drainage with intravenous antibiotics. An abscess larger than 2 cm is drained percutaneously; smaller ones resolve on antibiotics alone. Hinchey I–II are treated medically with or without drainage; only purulent or feculent peritonitis (III–IV) goes straight to the OR.", "objective": "Guide: Diverticulitis — Surgical; Diagnostics, Hinchey Classification.", "section": "Left lower quadrant pain with fever"}, {"id": "34B", "group": 34, "stem": "Six weeks after he recovers, which of the following is indicated?", "options": [{"letter": "A", "text": "Colonoscopy to exclude a malignancy that mimicked the attack"}, {"letter": "B", "text": "No further evaluation if his symptoms have resolved"}, {"letter": "C", "text": "Elective sigmoid colectomy regardless of risk factors"}, {"letter": "D", "text": "Lifelong avoidance of nuts, seeds, and berries"}, {"letter": "E", "text": "Repeat CT of the abdomen and pelvis with contrast"}], "answer": "A", "explanation": "Colonoscopy to exclude a malignancy that mimicked the attack. Interval colonoscopy at 6–8 weeks after resolution, if none was done within the past year. Long-term he should eat a high-fiber diet; nuts, seeds, and berries are fine.", "objective": "Guide: Diverticulitis — Management, Long-term; Warnings.", "section": "Left lower quadrant pain with fever"}, {"id": "35", "group": 35, "stem": "A 21-year-old woman has bloating, cramping, and watery diarrhea starting about an hour after ice cream or a glass of milk, with no symptoms when she avoids dairy and no symptoms when she fasts. She has no blood in her stool, no weight loss, and no fever.\n\nWhich of the following results on hydrogen breath testing would confirm the diagnosis?", "options": [{"letter": "A", "text": "A fall in breath hydrogen after a lactose load with a rise in methane"}, {"letter": "B", "text": "A rise in breath hydrogen above 20 ppm within 90 minutes of a lactose load"}, {"letter": "C", "text": "A rise in breath hydrogen above 20 ppm within 90 minutes of a glucose load"}, {"letter": "D", "text": "A rise in breath hydrogen of 10 to 20 ppm within 90 minutes of a lactose load"}, {"letter": "E", "text": "No change in breath hydrogen with resolution of symptoms"}], "answer": "B", "explanation": "A rise in breath hydrogen above 20 ppm within 90 minutes of a lactose load. After a 50 g lactose load: above 20 ppm is positive, 10–20 ppm is indeterminate, and 10 or below is normal. Note the pattern that got her here — osmotic diarrhea that improves with fasting.", "objective": "Guide: Lactose Intolerance — Diagnostics, Additional; Presentation.", "section": "Symptoms after dairy"}, {"id": "35A", "group": 35, "stem": "Which of the following best describes the goal of management?", "options": [{"letter": "A", "text": "Elimination of all fermentable carbohydrates from the diet"}, {"letter": "B", "text": "A trial of rifaximin before any dietary modification"}, {"letter": "C", "text": "Lactose intake reduced to her own threshold, not eliminated entirely"}, {"letter": "D", "text": "Lactase enzyme replacement instead of any dietary change"}, {"letter": "E", "text": "Complete lifelong elimination of all dairy products"}], "answer": "C", "explanation": "Lactose intake reduced to her own threshold, not eliminated entirely. The goal is comfort, not elimination — most people tolerate at least one 8-ounce glass of milk daily, and aged cheese and unpasteurized yogurt are tolerated better. Lactase replacement helps, and calcium supplementation is added if dairy is dropped.", "objective": "Guide: Lactose Intolerance — Management; Special Considerations \"Goal.\"", "section": "Symptoms after dairy"}, {"id": "36", "group": 36, "stem": "A 29-year-old woman has six weeks of fatigue, then two weeks of jaundice and dark urine. She has Hashimoto's thyroiditis, and her sister has celiac disease. She takes levothyroxine only, uses no supplements, does not drink, and has no risk factors for viral hepatitis. Her temperature is 37.2°C (99.0°F), blood pressure is 116/72 mm Hg, and pulse is 84/min. She has icteric sclerae and a smooth liver edge 2 cm below the costal margin; there is no asterixis and no ascites.\n\n| Test | Result |\n|---|---|\n| ALT / AST | 1,120 / 940 U/L |\n| Total bilirubin | 6.8 mg/dL |\n| Alkaline phosphatase | 138 U/L |\n| INR | 1.2 |\n| Acetaminophen level | Undetectable |\n| Hepatitis A, B, and C serologies | Negative |\n\nWhich of the following additional tests is most likely to establish the diagnosis?", "options": [{"letter": "A", "text": "Alpha-1 antitrypsin level with phenotyping"}, {"letter": "B", "text": "Ceruloplasmin with a 24-hour urinary copper"}, {"letter": "C", "text": "Anti-mitochondrial antibody with serum IgM"}, {"letter": "D", "text": "Ferritin with transferrin saturation"}, {"letter": "E", "text": "Anti-smooth muscle antibody with serum IgG"}], "answer": "E", "explanation": "Anti-smooth muscle antibody with serum IgG. A young woman with another autoimmune disease and a family history of autoimmunity, transaminases in the thousands, and negative viral serologies and acetaminophen. ASMA with a raised IgG is positive in over 80%; ANA is often positive and anti-LKM may be.", "objective": "Guide: Autoimmune Hepatitis — Common Patient, Diagnostics, Additional.", "section": "Hepatitis in a young woman"}, {"id": "36A", "group": 36, "stem": "Which of the following would liver biopsy most likely show?", "options": [{"letter": "A", "text": "Interface hepatitis with a plasma cell infiltrate"}, {"letter": "B", "text": "Non-caseating granulomas scattered in the parenchyma"}, {"letter": "C", "text": "Steatosis with ballooning and Mallory bodies"}, {"letter": "D", "text": "A florid duct lesion with granuloma formation"}, {"letter": "E", "text": "Onion-skin periductal fibrosis around bile ducts"}], "answer": "A", "explanation": "Interface hepatitis with a plasma cell infiltrate. The confirmatory histology. Onion-skin fibrosis is PSC, the florid duct lesion is PBC, and ballooning with Mallory bodies is steatohepatitis.", "objective": "Guide: Autoimmune Hepatitis — Diagnostics, Confirmatory.", "section": "Hepatitis in a young woman"}, {"id": "36B", "group": 36, "stem": "Which of the following is the most appropriate initial therapy?", "options": [{"letter": "A", "text": "Prednisone, with azathioprine added for maintenance"}, {"letter": "B", "text": "Ursodeoxycholic acid at 13 to 15 mg/kg daily"}, {"letter": "C", "text": "Serial phlebotomy with dietary iron restriction"}, {"letter": "D", "text": "Tenofovir continued indefinitely"}, {"letter": "E", "text": "N-acetylcysteine until the INR normalizes"}], "answer": "A", "explanation": "Prednisone, with azathioprine added for maintenance. Prednisone 40 mg induces; azathioprine 100 mg or mycophenolate maintains while the prednisone is weaned to 5 mg. Check TPMT before starting azathioprine, since slow metabolizers develop myelotoxicity. About 30% are already cirrhotic at presentation.", "objective": "Guide: Autoimmune Hepatitis — Management; Warnings; Special Considerations.", "section": "Hepatitis in a young woman"}, {"id": "37", "group": 37, "stem": "An 11-month-old boy is brought in with a day of episodes in which he suddenly screams, draws his knees to his chest, and goes pale, each lasting a few minutes and returning every fifteen or twenty minutes. Between episodes he has been quiet and sleepy. He has vomited three times, and his mother describes his last diaper as containing dark red mucousy material. He had a cold last week. His temperature is 37.4°C (99.3°F) and pulse is 152/min. His abdomen is soft between episodes with a sausage-shaped fullness palpable in the right upper quadrant.\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute gastroenteritis"}, {"letter": "B", "text": "Pyloric stenosis"}, {"letter": "C", "text": "Intussusception"}, {"letter": "D", "text": "Meckel's diverticulum with bleeding"}, {"letter": "E", "text": "Malrotation with midgut volvulus"}], "answer": "C", "explanation": "Intussusception. Colicky pain every 15–20 minutes with drawing the legs up, lethargy between episodes, a preceding viral illness, a sausage-shaped mass, and red currant jelly stool. It is the most common intestinal obstruction in children and the most common abdominal emergency of childhood, usually at the ileocecal junction and usually idiopathic.", "objective": "Guide: Intussusception — Presentation, Exam; Special Considerations \"Children.\"", "section": "A screaming toddler"}, {"id": "37A", "group": 37, "stem": "Which of the following is the most appropriate initial imaging study?", "options": [{"letter": "A", "text": "Technetium-99m pertechnetate scan"}, {"letter": "B", "text": "Upper gastrointestinal series with barium"}, {"letter": "C", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "D", "text": "Abdominal MRI without sedation"}, {"letter": "E", "text": "Abdominal ultrasound"}], "answer": "E", "explanation": "Abdominal ultrasound. Ultrasound shows the target sign of telescoped bowel. CT is the study in adults, where intussusception is rare and means a pathologic lead point until proven otherwise — malignant in about half.", "objective": "Guide: Intussusception — Diagnostics; Special Considerations \"Adults.\"", "section": "A screaming toddler"}, {"id": "37B", "group": 37, "stem": "Which of the following is both diagnostic and therapeutic?", "options": [{"letter": "A", "text": "Observation with repeat ultrasound in six hours"}, {"letter": "B", "text": "An air or water-soluble contrast enema with surgical standby"}, {"letter": "C", "text": "Colonoscopic reduction under general anesthesia"}, {"letter": "D", "text": "Nasogastric decompression with intravenous fluid resuscitation"}, {"letter": "E", "text": "Laparoscopic reduction with a planned bowel resection"}], "answer": "B", "explanation": "An air or water-soluble contrast enema with surgical standby. Air, barium, or water-soluble contrast enema is both diagnostic and therapeutic with over 80% success, with the surgical team on standby. Recurrence is 5–10% within 24 hours. Surgery follows a failed reduction, and is usually the answer in adults.", "objective": "Guide: Intussusception — Management; Special Considerations \"After enema reduction.\"", "section": "A screaming toddler"}, {"id": "38", "group": 38, "stem": "A 64-year-old woman has had four months of watery, nonbloody diarrhea with urgency, including stools that wake her from sleep. She has lost 4 kg. She takes omeprazole for reflux and naproxen for knee pain, and has hypothyroidism. Stool cultures, C. difficile testing, and ova and parasite studies are negative, and her abdominal examination is normal.\n\nWhich of the following is the most appropriate next step in evaluation?", "options": [{"letter": "A", "text": "An empiric four-week trial of a low-FODMAP diet"}, {"letter": "B", "text": "Colonoscopy with random biopsies of normal-appearing mucosa"}, {"letter": "C", "text": "CT enterography of the abdomen and pelvis"}, {"letter": "D", "text": "Colonoscopy with biopsies of visibly inflamed segments only"}, {"letter": "E", "text": "Hydrogen breath testing after an oral lactose load"}], "answer": "B", "explanation": "Colonoscopy with random biopsies of normal-appearing mucosa. Chronic watery nonbloody diarrhea in an older woman on a PPI and an NSAID, with nocturnal stools (IBS spares sleep) and weight loss, points to microscopic colitis. The colon looks normal endoscopically, so the diagnosis is missed if only abnormal-looking areas are biopsied.", "objective": "Guide: Microscopic Colitis — Diagnostics, 1st Line.", "section": "Chronic watery diarrhea in an older adult"}, {"id": "38A", "group": 38, "stem": "Which of the following findings would that study most likely show?", "options": [{"letter": "A", "text": "Diffusely dark pigmented mucosa with a mosaic pattern"}, {"letter": "B", "text": "Continuous mucosal friability extending up from the rectum"}, {"letter": "C", "text": "Skip lesions with non-caseating granulomas in the ileum"}, {"letter": "D", "text": "Adherent yellow pseudomembranes over erythematous mucosa"}, {"letter": "E", "text": "A thickened subepithelial collagen band beneath normal mucosa"}], "answer": "E", "explanation": "A thickened subepithelial collagen band beneath normal mucosa. Collagenous subtype; the lymphocytic subtype shows more than 20 intraepithelial lymphocytes per 100 epithelial cells.", "objective": "Guide: Microscopic Colitis — Diagnostics, Additional.", "section": "Chronic watery diarrhea in an older adult"}, {"id": "39", "group": 39, "stem": "A 58-year-old man is seen for fatigue and itching that began about ten days after he finished a course of amoxicillin-clavulanate for a dental infection. He takes no other medications and no supplements, drinks minimally, and has no risk factors for viral hepatitis. His alkaline phosphatase is 480 U/L, GGT 390 U/L, ALT 96 U/L, AST 82 U/L, total bilirubin 3.6 mg/dL, and INR 1.0. Viral and autoimmune serologies are negative, and his liver ultrasound is normal.\n\nWhich of the following patterns of injury does this represent?", "options": [{"letter": "A", "text": "Hepatocellular"}, {"letter": "B", "text": "Congestive"}, {"letter": "C", "text": "Infiltrative"}, {"letter": "D", "text": "Vascular"}, {"letter": "E", "text": "Cholestatic"}], "answer": "E", "explanation": "Cholestatic. Alkaline phosphatase and GGT rising far out of proportion to the transaminases, with a raised bilirubin and a normal INR. Amoxicillin-clavulanate is the single most common cause of drug-induced liver injury — idiosyncratic, at standard doses, with a latency of days to weeks that can extend past the day the drug was stopped. Six of the top ten DILI agents are antibiotics.", "objective": "Guide: Drug-Induced Hepatitis (DILI) — Diagnostics; Warnings; Special Considerations \"Top offenders.\"", "section": "Liver enzymes after an antibiotic"}, {"id": "39A", "group": 39, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "N-acetylcysteine until the transaminases fall below 1,000"}, {"letter": "B", "text": "Urgent referral for liver transplantation evaluation"}, {"letter": "C", "text": "Prednisone tapered over eight weeks with monthly liver enzymes"}, {"letter": "D", "text": "Ursodeoxycholic acid at 15 mg/kg continued indefinitely"}, {"letter": "E", "text": "Supportive care with cholestyramine for pruritus and no rechallenge"}], "answer": "E", "explanation": "Supportive care with cholestyramine for pruritus and no rechallenge. Stop the drug; cholestyramine with antihistamines for cholestatic itch. His bilirubin of 3.6 with enzymes under 200 warrants close follow-up, and a bilirubin above 4–5 would prompt hepatology referral. Prednisone has weak, non-guideline evidence, and transplant assessment is triggered by an INR above 2 or any encephalopathy — he has neither.", "objective": "Guide: DILI — Management; Special Considerations \"Prognosis.\"", "section": "Liver enzymes after an antibiotic"}, {"id": "40", "group": 40, "stem": "A 27-year-old woman at 30 weeks of gestation returns from Central Asia with jaundice, nausea, and markedly elevated transaminases. Serologies for hepatitis A, B, and C are negative.\n\nWhich of the following is true of the most likely diagnosis?", "options": [{"letter": "A", "text": "It occurs only as a coinfection with hepatitis B"}, {"letter": "B", "text": "It carries a markedly increased risk of fulminant hepatic failure in pregnancy"}, {"letter": "C", "text": "It is prevented by a vaccine routinely given in the United States"}, {"letter": "D", "text": "It progresses to chronic infection in more than half of pregnant patients"}, {"letter": "E", "text": "It requires immediate antiviral therapy to protect the fetus"}], "answer": "B", "explanation": "It carries a markedly increased risk of fulminant hepatic failure in pregnancy. Hepatitis E after travel to Africa, the Middle East, Asia, or Central America, with a negative A/B/C panel, is the classic board association. It is always acute and never chronic, there is no US vaccine, and treatment is supportive. Overall case fatality from fulminant failure is about 1.7%, but pregnancy is the recognized high-risk state.", "objective": "Guide: Hepatitis E — Emergency line, Special Considerations.", "section": "Hepatitis in pregnancy"}, {"id": "41", "group": 41, "stem": "A 52-year-old woman with type 1 diabetes for twenty-five years and a hemoglobin A1c of 9.4% has eight months of early satiety, bloating, and vomiting of food she ate several hours earlier. Upper endoscopy shows retained food but no mechanical obstruction, ulcer, or mass.\n\nWhich of the following studies establishes the diagnosis?", "options": [{"letter": "A", "text": "A wireless motility capsule study of whole-gut transit"}, {"letter": "B", "text": "An upper gastrointestinal series with small bowel follow-through"}, {"letter": "C", "text": "Hydrogen breath testing after a glucose load"}, {"letter": "D", "text": "Gastric emptying scintigraphy with a standardized solid meal"}, {"letter": "E", "text": "Antroduodenal manometry over a 24-hour period"}], "answer": "D", "explanation": "Gastric emptying scintigraphy with a standardized solid meal. The ACG gold standard: more than 60% of the meal retained at 2 hours, or more than 10% at 4 hours. Endoscopy comes first to exclude mechanical obstruction — which it did here. The meal is standardized because fat and protein slow emptying.", "objective": "Guide: Gastroparesis — Diagnostics, Gold Standard; Special Considerations \"Protocol.\"", "section": "Vomiting food eaten hours earlier"}, {"id": "41A", "group": 41, "stem": "She is started on metoclopramide. Which adverse effect carries a black box warning?", "options": [{"letter": "A", "text": "Interstitial nephritis"}, {"letter": "B", "text": "Lactic acidosis"}, {"letter": "C", "text": "Hemolytic anemia"}, {"letter": "D", "text": "Tardive dyskinesia"}, {"letter": "E", "text": "Tendon rupture"}], "answer": "D", "explanation": "Tardive dyskinesia. The metoclopramide black box: tardive dyskinesia, which is irreversible and independent of dose and duration. Never combine it with a phenothiazine — the extrapyramidal effects are additive.", "objective": "Guide: Gastroparesis — Warnings.", "section": "Vomiting food eaten hours earlier"}, {"id": "42", "group": 42, "stem": "A 26-year-old woman has five days of jaundice and dark urine after two weeks of malaise, fever, and nausea. She returned five weeks ago from a month in rural Guatemala and was never vaccinated against hepatitis A.\n\nWhich of the following tests establishes the diagnosis?", "options": [{"letter": "A", "text": "Hepatitis A RNA by polymerase chain reaction"}, {"letter": "B", "text": "Hepatitis A IgG antibody"}, {"letter": "C", "text": "Total hepatitis A antibody"}, {"letter": "D", "text": "Hepatitis A IgM antibody"}, {"letter": "E", "text": "Hepatitis E antibody"}], "answer": "D", "explanation": "Hepatitis A IgM antibody. HAV IgM confirms acute infection. IgG alone means prior infection or immunity, and a total HAV antibody cannot separate acute from remote — a classic distractor.", "objective": "Guide: Hepatitis A — Diagnostics, Additional; Special Considerations \"HAV Ab total.\"", "section": "Jaundice after travel"}, {"id": "42A", "group": 42, "stem": "Which of the following is true of her infection?", "options": [{"letter": "A", "text": "It becomes chronic in fewer than five percent of infected adults"}, {"letter": "B", "text": "It requires a second infection with hepatitis D to cause jaundice"}, {"letter": "C", "text": "It requires antiviral therapy to prevent progression to cirrhosis"}, {"letter": "D", "text": "It never becomes chronic, and clearance confers lasting immunity"}, {"letter": "E", "text": "It carries the highest mortality when acquired during pregnancy"}], "answer": "D", "explanation": "It never becomes chronic, and clearance confers lasting immunity. Hepatitis A is always acute; fulminant failure occurs in 1–2%, usually on top of existing chronic liver disease. Chronicity in fewer than 5% of adults describes hepatitis B; the pregnancy association is hepatitis E.", "objective": "Guide: Hepatitis A — Special Considerations \"Course\"; Emergency line.", "section": "Jaundice after travel"}, {"id": "43", "group": 43, "stem": "A 44-year-old man from the Mediterranean with chronic hepatitis B, stable for years, develops new jaundice and a sharp rise in his transaminases. His HBsAg remains positive.\n\nWhich of the following tests should be sent?", "options": [{"letter": "A", "text": "Total anti-hepatitis D antibody"}, {"letter": "B", "text": "Hepatitis B e antigen with hepatitis B e antibody"}, {"letter": "C", "text": "Hepatitis B core IgM antibody"}, {"letter": "D", "text": "Hepatitis A IgM antibody"}, {"letter": "E", "text": "Anti-mitochondrial antibody"}], "answer": "A", "explanation": "Total anti-hepatitis D antibody. Total anti-HDV is the only test for the virus, and a positive HBsAg is required because the hepatitis D virion is coated in HBsAg. Sudden worsening of stable chronic hepatitis B in a patient from the Mediterranean is the classic superinfection picture.", "objective": "Guide: Hepatitis D — Diagnostics; Common Patient.", "section": "Worsening of known hepatitis B"}, {"id": "43A", "group": 43, "stem": "Which of the following is true of this virus?", "options": [{"letter": "A", "text": "It is prevented by a dedicated vaccine given in three doses"}, {"letter": "B", "text": "It is cleared reliably by direct-acting antiviral therapy"}, {"letter": "C", "text": "It carries a better prognosis than hepatitis B infection alone"}, {"letter": "D", "text": "It can establish infection independently of hepatitis B"}, {"letter": "E", "text": "It cannot infect anyone who is not already hepatitis B positive"}], "answer": "E", "explanation": "It cannot infect anyone who is not already hepatitis B positive. Hepatitis D never occurs alone — clear the B and you clear the D, and the hepatitis B vaccine prevents it. Acquired together it is coinfection; on top of chronic hepatitis B it is superinfection, which carries the worse prognosis and is more likely than hepatitis B alone to progress to cirrhosis.", "objective": "Guide: Hepatitis D — Special Considerations.", "section": "Worsening of known hepatitis B"}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
