<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

const EXAM_DATA = {"title": "Clin Med II · GI — HIGH YIELD FINAL PRACTICE EXAM 2", "questions": [{"id": "1", "group": 1, "stem": "A 22-year-old man comes to the emergency department with 20 hours of abdominal pain that began around his navel and has settled in the right lower quadrant. He felt nauseated and vomited once after the pain started, has had no appetite since yesterday, and developed a low-grade fever this afternoon. He has had no previous abdominal surgery and no diarrhea. His temperature is 38.0°C (100.4°F), blood pressure is 126/78 mm Hg, pulse is 96/min, and respirations are 16/min. He has tenderness at McBurney's point with voluntary guarding, a positive Rovsing's sign, and pain on right hip extension; the abdomen is not rigid and bowel sounds are present. His white blood cell count is 15,100/mm³ with 82% neutrophils and his CRP is 38 mg/L.\n\nWhich of the following is the most appropriate next step in evaluation?", "options": [{"letter": "A", "text": "Diagnostic laparoscopy of the right lower quadrant"}, {"letter": "B", "text": "CT of the abdomen and pelvis with IV contrast"}, {"letter": "C", "text": "Graded-compression ultrasound of the right lower quadrant"}, {"letter": "D", "text": "Colonoscopy with terminal ileal intubation"}, {"letter": "E", "text": "Upright and supine abdominal radiographs"}], "answer": "B", "explanation": "CT of the abdomen and pelvis with IV contrast. CT with IV contrast is first-line imaging for suspected appendicitis in adults; ultrasound is first in children and pregnancy. His Alvarado score is 9 (migration, anorexia, nausea, RLQ tenderness 2, fever, leukocytosis 2, neutrophilia).", "objective": "Guide: Appendicitis — Diagnostics, 1st Line Imaging (adults).", "section": "Right lower quadrant pain"}, {"id": "1A", "group": 1, "stem": "Which of the following findings is that study most likely to show?", "options": [{"letter": "A", "text": "Terminal ileal wall thickening with enlarged mesenteric lymph nodes"}, {"letter": "B", "text": "Sigmoid wall thickening with pericolonic stranding and diverticula"}, {"letter": "C", "text": "An appendiceal diameter of 11 mm with periappendiceal fat stranding"}, {"letter": "D", "text": "Dilated small bowel loops with a transition point in the pelvis"}, {"letter": "E", "text": "Segmental colonic wall thickening with thumbprinting at a watershed"}], "answer": "C", "explanation": "An appendiceal diameter of 11 mm with periappendiceal fat stranding. The CT criteria are an appendix greater than 6 mm, a non-filling lumen, wall thickening and enhancement, and periappendiceal fat stranding, with or without an appendicolith.", "objective": "Guide: Appendicitis — Diagnostics, findings column.", "section": "Right lower quadrant pain"}, {"id": "1B", "group": 1, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Observation with repeat cross-sectional imaging in twenty-four hours"}, {"letter": "B", "text": "Nasogastric decompression with serial abdominal examinations"}, {"letter": "C", "text": "Intravenous antibiotics alone with a planned interval appendectomy"}, {"letter": "D", "text": "Laparoscopic appendectomy with preoperative intravenous antibiotics"}, {"letter": "E", "text": "Percutaneous drainage followed by a ten-day course of oral antibiotics"}], "answer": "D", "explanation": "Laparoscopic appendectomy with preoperative intravenous antibiotics. Appendectomy is the standard of care, laparoscopic preferred. Non-operative antibiotic management is reserved for selected uncomplicated cases and fails more often with an appendicolith or age over 45.", "objective": "Guide: Appendicitis — Management, First line (operative); Surgical.", "section": "Right lower quadrant pain"}, {"id": "2", "group": 2, "stem": "A 72-year-old woman is brought to the emergency department with two days of right upper quadrant pain that has become constant, along with shaking chills and dark urine. Her daughter says she has been confused since this morning. She was found to have gallstones on an ultrasound two years ago and declined surgery. Her temperature is 38.9°C (102.0°F), blood pressure is 88/54 mm Hg, pulse is 118/min, and respirations are 22/min. She is lethargic but rousable, with icteric sclerae and right upper quadrant tenderness without guarding or rebound.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 18,400/mm³ with left shift |\n| Total bilirubin | 5.8 mg/dL |\n| Alkaline phosphatase | 412 U/L |\n| GGT | 388 U/L |\n| AST / ALT | 96 / 88 U/L |\n| Lipase | 42 U/L |\n| Right upper quadrant ultrasound | Gallbladder stones, wall 2 mm, no pericholecystic fluid, common bile duct 11 mm |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Primary sclerosing cholangitis"}, {"letter": "B", "text": "Choledocholithiasis"}, {"letter": "C", "text": "Acute cholecystitis"}, {"letter": "D", "text": "Acute cholangitis"}, {"letter": "E", "text": "Gallstone pancreatitis"}], "answer": "D", "explanation": "Acute cholangitis. Fever, jaundice, and RUQ pain is Charcot's triad; adding hypotension and altered mental status makes Reynold's pentad. The labs are cholestatic (alk phos and GGT out of proportion to AST/ALT) with a dilated CBD at 11 mm, and the gallbladder wall is normal with no pericholecystic fluid. Why not the look-alikes: cholecystitis gives fever without jaundice and normal bilirubin and alk phos; choledocholithiasis gives jaundice and cholestatic labs without fever; gallstone pancreatitis requires an elevated lipase.", "objective": "Guide: Cholangitis — Emergency line; Choledocholithiasis — Special Considerations \"The discriminator.\"", "section": "Right upper quadrant pain with fever and jaundice"}, {"id": "2A", "group": 2, "stem": "Which of the following is the most appropriate immediate step in management?", "options": [{"letter": "A", "text": "Laparoscopic cholecystectomy within 24 hours"}, {"letter": "B", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "C", "text": "Endoscopic retrograde cholangiopancreatography within 24 hours"}, {"letter": "D", "text": "Percutaneous cholecystostomy tube placement"}, {"letter": "E", "text": "Intravenous fluid resuscitation and intravenous antibiotics"}], "answer": "E", "explanation": "Intravenous fluid resuscitation and intravenous antibiotics. Antibiotics come first — piperacillin-tazobactam, or levofloxacin plus metronidazole. ERCP is right, but it follows resuscitation; about 70% of these patients become bacteremic.", "objective": "Guide: Cholangitis — Management, First Line.", "section": "Right upper quadrant pain with fever and jaundice"}, {"id": "2B", "group": 2, "stem": "Once she has been stabilized, which of the following achieves source control?", "options": [{"letter": "A", "text": "Percutaneous cholecystostomy with delayed cholecystectomy"}, {"letter": "B", "text": "Laparoscopic cholecystectomy with a critical view of safety"}, {"letter": "C", "text": "Open common bile duct exploration with T-tube placement"}, {"letter": "D", "text": "Endoscopic sphincterotomy with stone extraction"}, {"letter": "E", "text": "Percutaneous transhepatic biliary drainage catheter"}], "answer": "D", "explanation": "Endoscopic sphincterotomy with stone extraction. Urgent ERCP relieves the obstruction and drains the infected duct. Cholecystectomy is definitive but only once she is stable and the obstruction is cleared.", "objective": "Guide: Cholangitis — Management, Source control; Surgical.", "section": "Right upper quadrant pain with fever and jaundice"}, {"id": "3", "group": 3, "stem": "A 57-year-old man with alcohol-related cirrhosis and known ascites is brought in by his wife for two days of increasing abdominal distension and confusion. He has not had fever, vomiting, or hematemesis, and he has taken his diuretics as prescribed. His temperature is 37.2°C (99.0°F), blood pressure is 96/58 mm Hg, pulse is 104/min, and respirations are 18/min. He is drowsy but rousable, with scleral icterus, asterixis, a tense abdomen with shifting dullness, and mild diffuse tenderness without guarding or rebound.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 12,900/mm³ |\n| Sodium | 128 mEq/L |\n| Creatinine | 1.6 mg/dL (baseline 0.9) |\n| Total bilirubin | 4.8 mg/dL |\n| INR | 1.7 |\n| Albumin | 2.4 g/dL |\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Blood cultures with empiric intravenous antibiotics"}, {"letter": "B", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "C", "text": "Diagnostic paracentesis with cell count and culture"}, {"letter": "D", "text": "Upper endoscopy to exclude a variceal source"}, {"letter": "E", "text": "Empiric lactulose with reassessment in the morning"}], "answer": "C", "explanation": "Diagnostic paracentesis with cell count and culture. Paracentesis is not optional on any cirrhotic admission, and it must come before antibiotics. Fever is absent in many cases of SBP and about 15% are asymptomatic; deterioration alone is the trigger.", "objective": "Guide: SBP — Emergency line, Diagnostics 1st Line; Decompensated Cirrhosis — Special Considerations.", "section": "The deteriorating cirrhotic"}, {"id": "3A", "group": 3, "stem": "Which of the following results would confirm the diagnosis?", "options": [{"letter": "A", "text": "An ascitic neutrophil count of 480 cells/mm³"}, {"letter": "B", "text": "An ascitic neutrophil count of 120 cells/mm³"}, {"letter": "C", "text": "An ascitic total protein above 3.0 g/dL"}, {"letter": "D", "text": "A serum-ascites albumin gradient below 1.1 g/dL"}, {"letter": "E", "text": "Growth of three different organisms on ascitic culture"}], "answer": "A", "explanation": "An ascitic neutrophil count of 480 cells/mm³. SBP is a PMN count of 250 cells/mm³ or more, or a positive culture. Three organisms means a perforation, not SBP. A SAAG below 1.1 would argue against portal hypertension altogether.", "objective": "Guide: SBP — Diagnostics; Special Considerations \"Multiple organisms.\"", "section": "The deteriorating cirrhotic"}, {"id": "3B", "group": 3, "stem": "Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "Transjugular intrahepatic portosystemic shunt placement"}, {"letter": "B", "text": "Large-volume paracentesis with albumin replacement"}, {"letter": "C", "text": "Intravenous cefotaxime with intravenous albumin"}, {"letter": "D", "text": "Intravenous cefotaxime without additional therapy"}, {"letter": "E", "text": "Oral ciprofloxacin with outpatient follow-up"}], "answer": "C", "explanation": "Intravenous cefotaxime with intravenous albumin. Cefotaxime covers E. coli and Klebsiella, and albumin given within six hours cuts renal failure and mortality. Large-volume paracentesis without albumin is a classic precipitant of hepatorenal syndrome.", "objective": "Guide: SBP — Management, First Line and Adjunct.", "section": "The deteriorating cirrhotic"}, {"id": "4", "group": 4, "stem": "A 45-year-old man has been HBsAg positive for eight years. His HBeAg is positive with a negative HBeAb, his HBV DNA is 240,000 IU/mL, and his ALT has been two to three times the upper limit of normal on three occasions over the past year. Transient elastography shows F2 fibrosis. His renal function is normal and he is not pregnant.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Start tenofovir and continue it long term"}, {"letter": "B", "text": "Start peginterferon alfa-2a for forty-eight weeks"}, {"letter": "C", "text": "Repeat the hepatitis B panel in six months before deciding"}, {"letter": "D", "text": "Monitor ALT and HBV DNA every six months without therapy"}, {"letter": "E", "text": "Start entecavir for twelve weeks and then reassess"}], "answer": "A", "explanation": "Start tenofovir and continue it long term. HBeAg positive with a high viral load and persistently elevated ALT is active replicating chronic hepatitis B. Tenofovir is preferred with normal renal function, in pregnancy, with HIV coinfection, or after prior lamivudine, and is taken with food; entecavir is preferred in renal insufficiency and taken without food. Therapy is usually lifelong. Note the black box: severe HBV flares on discontinuation.", "objective": "Guide: Chronic Hepatitis B — Management, First Line; Warnings.", "section": "Deciding to treat chronic infection"}, {"id": "4A", "group": 4, "stem": "Which of the following surveillance measures does he require regardless of treatment?", "options": [{"letter": "A", "text": "Alpha-fetoprotein alone every six months"}, {"letter": "B", "text": "No surveillance until cirrhosis develops"}, {"letter": "C", "text": "Non-contrast CT of the liver every twelve months"}, {"letter": "D", "text": "Liver ultrasound with alpha-fetoprotein every six months"}, {"letter": "E", "text": "Liver ultrasound with alpha-fetoprotein every two years"}], "answer": "D", "explanation": "Liver ultrasound with alpha-fetoprotein every six months. Hepatocellular carcinoma screening runs every six months for anyone over 40 or with cirrhosis, for life — hepatitis B causes HCC in non-cirrhotic livers, and antivirals lower but do not eliminate that risk. AFP alone is not recommended, and CT or MRI must be with contrast.", "objective": "Guide: Chronic Hepatitis B — Diagnostics, Surveillance; Special Considerations \"HCC screening never stops.\"", "section": "Deciding to treat chronic infection"}, {"id": "5", "group": 5, "stem": "A 26-year-old man has had ten weeks of bloody diarrhea with mucus, six to eight stools daily, along with a constant urge to move his bowels and crampy left lower quadrant pain relieved by defecation. He quit smoking four months ago after ten years. He has lost 5 kg. His temperature is 37.4°C (99.3°F), blood pressure is 118/74 mm Hg, and pulse is 94/min. He has left lower quadrant tenderness, gross blood on rectal examination, and conjunctival pallor; there is no perianal disease and no abdominal mass.\n\n| Test | Result |\n|---|---|\n| Hemoglobin | 10.8 g/dL |\n| Albumin | 3.4 g/dL |\n| ESR | 34 mm/hr |\n| Stool cultures and C. difficile toxin | Negative |\n| Fecal calprotectin | 780 µg/g |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Crohn's disease"}, {"letter": "B", "text": "Amebiasis"}, {"letter": "C", "text": "Ischemic colitis"}, {"letter": "D", "text": "Ulcerative colitis"}, {"letter": "E", "text": "Irritable bowel syndrome"}], "answer": "D", "explanation": "Ulcerative colitis. Bloody diarrhea with mucus, tenesmus, and left lower quadrant cramping in a young adult who recently quit smoking — smoking is protective in UC and harmful in Crohn's. No perianal disease, no mass, no fistula.", "objective": "Guide: Ulcerative Colitis — Presentation, History, Exam.", "section": "Bloody diarrhea in a young adult"}, {"id": "5A", "group": 5, "stem": "Which of the following would colonoscopy with ileal intubation most likely show?", "options": [{"letter": "A", "text": "A single longitudinal ulcer with an abrupt transition to normal mucosa"}, {"letter": "B", "text": "An endoscopically normal colon with abnormal random biopsies"}, {"letter": "C", "text": "Skip lesions with cobblestoning and deep longitudinal ulcers"}, {"letter": "D", "text": "Continuous inflammation from the rectum with a spared terminal ileum"}, {"letter": "E", "text": "Flask-shaped ulcers with intervening normal-appearing mucosa"}], "answer": "D", "explanation": "Continuous inflammation from the rectum with a spared terminal ileum. Loss of vascular pattern, granularity, friability, pseudopolyps, and no skip lesions. Ileal involvement would make it Crohn's.", "objective": "Guide: Ulcerative Colitis — Diagnostics, 1st Line / Gold Standard.", "section": "Bloody diarrhea in a young adult"}, {"id": "5B", "group": 5, "stem": "Colonoscopy shows disease limited to the rectum and sigmoid. Which of the following is the most appropriate initial therapy?", "options": [{"letter": "A", "text": "Oral prednisone tapered over eight weeks"}, {"letter": "B", "text": "Total proctocolectomy with ileal pouch-anal anastomosis"}, {"letter": "C", "text": "Oral ciprofloxacin with metronidazole"}, {"letter": "D", "text": "A mesalamine enema with an oral aminosalicylate"}, {"letter": "E", "text": "Infliximab induction with an immunomodulator"}], "answer": "D", "explanation": "A mesalamine enema with an oral aminosalicylate. Distal or left-sided disease is treated topically plus orally; proctitis alone gets a mesalamine suppository with an oral aminosalicylate. Steroids treat an acute flare but are never maintenance, and colectomy is reserved for refractory or complicated disease.", "objective": "Guide: Ulcerative Colitis — Management, Distal / left-sided.", "section": "Bloody diarrhea in a young adult"}, {"id": "6", "group": 6, "stem": "A 39-year-old woman with Crohn's disease for eighteen years and two prior ileal resections has three days of colicky pain that comes on after meals, vomiting, and no bowel movement since yesterday. Her abdomen is distended with high-pitched bowel sounds and mild tenderness. CT enterography shows a 6 cm segment of terminal ileal narrowing with proximal dilation, no wall enhancement, no surrounding inflammation, and no abscess. Her CRP is 6 mg/L.\n\nWhich of the following best characterizes the stricture?", "options": [{"letter": "A", "text": "Inflammatory"}, {"letter": "B", "text": "Anastomotic ulceration"}, {"letter": "C", "text": "Extrinsic compression from an abscess"}, {"letter": "D", "text": "Fibrotic"}, {"letter": "E", "text": "Malignant"}], "answer": "D", "explanation": "Fibrotic. No wall enhancement, no surrounding inflammation, and a CRP of 6 — the inflammation has burned out and left scar. Enterography is used precisely because it separates inflammatory from fibrotic narrowing.", "objective": "Guide: Stricturing Crohn's Disease with SBO — Diagnostics; Special Considerations \"Natural history.\"", "section": "Obstruction in long-standing Crohn's disease"}, {"id": "6A", "group": 6, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Intravenous corticosteroids followed by a biologic"}, {"letter": "B", "text": "Endoscopic balloon dilation or stricturoplasty"}, {"letter": "C", "text": "Anti-TNF therapy with an immunomodulator"}, {"letter": "D", "text": "Video capsule endoscopy to define the segment"}, {"letter": "E", "text": "Extended small bowel resection with primary anastomosis"}], "answer": "B", "explanation": "Endoscopic balloon dilation or stricturoplasty. Medicine helps the inflammatory stricture, not the fibrotic one. Stricturoplasty widens without resecting because bowel length is the currency — she has already had two resections and is at risk of short bowel syndrome. Capsule endoscopy is contraindicated whenever a stricture is suspected.", "objective": "Guide: Stricturing Crohn's — Management, Fibrotic stricture; Crohn's Disease — Surgical; Short Bowel Syndrome — Special Considerations.", "section": "Obstruction in long-standing Crohn's disease"}, {"id": "7", "group": 7, "stem": "A 29-year-old man has ten days of malaise, nausea, and joint aches followed by four days of jaundice and dark urine. He got a tattoo at an unlicensed shop four months ago and has had several new sexual partners in the past year. He does not drink and takes no medications. His temperature is 37.9°C (100.2°F), blood pressure is 118/72 mm Hg, and pulse is 88/min. He has icteric sclerae, a liver edge 3 cm below the costal margin that is tender, and a faint urticarial rash; there is no asterixis and no ascites.\n\n| Test | Result |\n|---|---|\n| ALT / AST | 1,840 / 1,210 U/L |\n| Total bilirubin | 7.4 mg/dL |\n| Alkaline phosphatase | 160 U/L |\n| INR | 1.1 |\n| Albumin | 4.1 g/dL |\n\nWhich of the following patterns of injury does this represent?", "options": [{"letter": "A", "text": "Infiltrative"}, {"letter": "B", "text": "Mixed hepatocellular and cholestatic"}, {"letter": "C", "text": "Cholestatic"}, {"letter": "D", "text": "Congestive"}, {"letter": "E", "text": "Hepatocellular"}], "answer": "E", "explanation": "Hepatocellular. Transaminases more than ten times the upper limit with ALT above AST and a bilirubin over 3, while the alkaline phosphatase barely moves. A cholestatic pattern would be alkaline phosphatase predominant. Alcohol-related hepatitis is AST-predominant with both usually below 400.", "objective": "Guide: Acute Hepatitis — Diagnostics; Special Considerations \"Hepatocellular vs cholestatic.\"", "section": "Jaundice with arthralgia in a young adult"}, {"id": "7A", "group": 7, "stem": "Which pair of serologic tests should be ordered together to establish the diagnosis?", "options": [{"letter": "A", "text": "Hepatitis B surface antigen and hepatitis B core IgM antibody"}, {"letter": "B", "text": "Hepatitis B e antigen and hepatitis B e antibody"}, {"letter": "C", "text": "Hepatitis B core IgG antibody and hepatitis B DNA"}, {"letter": "D", "text": "Hepatitis B surface antigen and hepatitis B surface antibody"}, {"letter": "E", "text": "Hepatitis B surface antibody and hepatitis B core IgG antibody"}], "answer": "A", "explanation": "Hepatitis B surface antigen and hepatitis B core IgM antibody. Order both: acute hepatitis B is HBsAg positive, core IgM positive, surface antibody negative. Core IgM matters because of the window period, when the surface antigen has cleared before the surface antibody appears and core IgM is the only positive marker.", "objective": "Guide: Acute Hepatitis B — Diagnostics, 1st Line; Hepatitis B — Confirmatory.", "section": "Jaundice with arthralgia in a young adult"}, {"id": "7B", "group": 7, "stem": "His INR remains normal and he has no encephalopathy. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Entecavir started now and continued for at least twelve months"}, {"letter": "B", "text": "Peginterferon alfa-2a given weekly for forty-eight weeks"}, {"letter": "C", "text": "Supportive care alone, with hepatitis B surface antigen repeated at six months"}, {"letter": "D", "text": "Hepatitis B immune globulin with the vaccine series"}, {"letter": "E", "text": "Tenofovir started now and continued indefinitely"}], "answer": "C", "explanation": "Supportive care alone, with hepatitis B surface antigen repeated at six months. Immunocompetent adults clear acute hepatitis B in about six months with no medication — fewer than 5% become chronic. Antivirals are reserved for acute liver failure, a protracted course with a rising INR and jaundice beyond four weeks, or diagnostic uncertainty. Peginterferon is contraindicated in acute hepatitis B.", "objective": "Guide: Acute Hepatitis B — Management; Warnings; Special Considerations \"Chronicity by age.\"", "section": "Jaundice with arthralgia in a young adult"}, {"id": "8", "group": 8, "stem": "A 70-year-old man has been managed for 36 hours with a nasogastric tube and intravenous fluids for a small bowel obstruction after two previous abdominal operations. Over the past four hours his pain has changed from coming in waves to being constant and severe, and he now looks unwell. His temperature is 38.4°C (101.1°F), blood pressure is 94/56 mm Hg, pulse is 128/min, and respirations are 26/min. His abdomen is distended with guarding and rebound tenderness that is worst in the mid abdomen, and his bowel sounds, which had been high-pitched, are now silent.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 21,600/mm³ |\n| Lactate | 4.8 mmol/L |\n| Arterial pH | 7.29 |\n| Bicarbonate | 16 mEq/L |\n| Creatinine | 1.7 mg/dL |\n\nWhich of the following has most likely occurred?", "options": [{"letter": "A", "text": "Acute pancreatitis from nasogastric decompression"}, {"letter": "B", "text": "Aspiration pneumonitis around the nasogastric tube"}, {"letter": "C", "text": "Clostridioides difficile colitis from prior antibiotics"}, {"letter": "D", "text": "Strangulation with bowel ischemia"}, {"letter": "E", "text": "Resolution of the obstruction with a postoperative ileus"}], "answer": "D", "explanation": "Strangulation with bowel ischemia. Pain turning from colicky to constant and severe, fever and tachycardia, peritoneal signs, bowel sounds going from hyperactive to silent, and a rising lactate with metabolic acidosis. Wall pressure in the distended loop has exceeded perfusion pressure; mortality reaches 70% once ischemia with bacterial overgrowth and septicemia sets in.", "objective": "Guide: Complications of Bowel Obstruction — Presentation, Emergency line, Exam.", "section": "Obstruction that turns"}, {"id": "8A", "group": 8, "stem": "Which of the following CT findings would confirm this?", "options": [{"letter": "A", "text": "A dilated U-shaped sigmoid loop with a whirl pattern at its base"}, {"letter": "B", "text": "Diffuse gas throughout the bowel to the rectum with no transition point"}, {"letter": "C", "text": "An encapsulated fluid collection with an enhancing wall near the pancreas"}, {"letter": "D", "text": "Segmental colonic thumbprinting confined to the splenic flexure"}, {"letter": "E", "text": "Bowel wall thickening with lack of enhancement and pneumatosis intestinalis"}], "answer": "E", "explanation": "Bowel wall thickening with lack of enhancement and pneumatosis intestinalis. CT with IV contrast detects ischemia and strangulation: wall thickening, lack of enhancement, pneumatosis, portal venous gas, fat stranding, and free fluid.", "objective": "Guide: Complications of Bowel Obstruction — Diagnostics, Best Imaging.", "section": "Obstruction that turns"}, {"id": "8B", "group": 8, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Colonoscopic decompression with rectal tube placement"}, {"letter": "B", "text": "Water-soluble contrast administration through the nasogastric tube"}, {"letter": "C", "text": "Emergent laparotomy with resection of nonviable bowel"}, {"letter": "D", "text": "Continued nasogastric decompression for another 24 hours"}, {"letter": "E", "text": "Percutaneous drainage with broad-spectrum antibiotics"}], "answer": "C", "explanation": "Emergent laparotomy with resection of nonviable bowel. Resuscitate with nasogastric decompression, fluids, and broad-spectrum antibiotics, then operate. A surgical abdomen does not wait on imaging, and the non-operative trial for an obstruction is never carried past 3–5 days regardless.", "objective": "Guide: Complications of Bowel Obstruction — Management, Emergency line; Intestinal Obstruction — Special Considerations.", "section": "Obstruction that turns"}, {"id": "9", "group": 9, "stem": "A 58-year-old man with a long history of NSAID use for arthritis develops sudden severe upper abdominal pain that within an hour spreads across his whole abdomen. He has vomited once and refuses to move on the stretcher. His temperature is 38.4°C (101.1°F), blood pressure is 96/58 mm Hg, pulse is 124/min, and respirations are 26/min. His abdomen is rigid and board-like with guarding and rebound throughout, and bowel sounds are absent.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 19,800/mm³ |\n| Lactate | 3.4 mmol/L |\n| Creatinine | 1.5 mg/dL |\n| Lipase | 88 U/L |\n| Upright chest radiograph | Free air under the right hemidiaphragm |\n\nWhich of the following best describes his condition?", "options": [{"letter": "A", "text": "Secondary peritonitis from a perforated viscus"}, {"letter": "B", "text": "Mesenteric ischemia without perforation"}, {"letter": "C", "text": "Acute pancreatitis with retroperitoneal inflammation"}, {"letter": "D", "text": "Spontaneous bacterial peritonitis"}, {"letter": "E", "text": "Peritoneal dialysis-associated peritonitis"}], "answer": "A", "explanation": "Secondary peritonitis from a perforated viscus. A rigid board-like abdomen in a patient lying perfectly still with free air is a surgical abdomen. Secondary peritonitis follows a perforated viscus and is surgical; spontaneous bacterial peritonitis occurs in a cirrhotic with ascites or on peritoneal dialysis and is not.", "objective": "Guide: Peritonitis — Etiology table, Emergency line, Exam.", "section": "An abdomen that will not be touched"}, {"id": "9A", "group": 9, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Nasogastric decompression with serial abdominal examinations"}, {"letter": "B", "text": "Percutaneous drainage with culture-directed antibiotics"}, {"letter": "C", "text": "Diagnostic paracentesis with cell count before antibiotics"}, {"letter": "D", "text": "Emergency exploratory laparotomy with broad-spectrum antibiotics"}, {"letter": "E", "text": "CT of the abdomen and pelvis with contrast before deciding"}], "answer": "D", "explanation": "Emergency exploratory laparotomy with broad-spectrum antibiotics. Free air means the operating room — do not await a CT. Empiric piperacillin-tazobactam, or a cephalosporin with metronidazole, then culture-directed.", "objective": "Guide: Peritonitis — Surgical, Management, Emergency line.", "section": "An abdomen that will not be touched"}, {"id": "9B", "group": 9, "stem": "Which radiographic sign describes gas outlining both sides of the bowel wall on a supine film?", "options": [{"letter": "A", "text": "The coffee bean sign"}, {"letter": "B", "text": "The football sign"}, {"letter": "C", "text": "Chilaiditi's sign"}, {"letter": "D", "text": "Rigler's sign"}, {"letter": "E", "text": "Thumbprinting"}], "answer": "D", "explanation": "Rigler's sign. Also called the double-wall sign: gas on both sides of the bowel wall on a supine film. The football sign is massive free air outlining the whole cavity. Chilaiditi's sign is the mimic — colon interposed between liver and diaphragm, with haustra visible in the lucency — and free air is also expected after recent laparotomy, laparoscopy, or ERCP.", "objective": "Guide: Peritonitis — Special Considerations \"Named signs,\" \"Chilaiditi sign = the mimic.\"", "section": "An abdomen that will not be touched"}, {"id": "10", "group": 10, "stem": "A 68-year-old woman has six months of progressive fatigue and exertional dyspnea. She has no abdominal pain, no change in stool caliber or frequency, and no visible blood in her stool. She has never had a colonoscopy. She is pale, her abdomen is soft and non-tender, and her stool is guaiac positive. Her hemoglobin is 8.9 g/dL with an MCV of 74 fL and a ferritin of 8 ng/mL.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Oral iron with repeat blood counts in three months"}, {"letter": "B", "text": "Colonoscopy with biopsy"}, {"letter": "C", "text": "Fecal immunochemical testing"}, {"letter": "D", "text": "Upper endoscopy alone"}, {"letter": "E", "text": "CT of the abdomen and pelvis with contrast"}], "answer": "B", "explanation": "Colonoscopy with biopsy. Iron deficiency anemia with occult blood in an adult over 45 is colorectal cancer until proven otherwise. FIT is a screening test, not a workup for established anemia, and empiric iron delays the diagnosis.", "objective": "Guide: Right-Sided Colon Cancer — Diagnostics, 1st Line; Colon Cancer — Presentation.", "section": "Iron deficiency without a source"}, {"id": "10A", "group": 10, "stem": "Which of the following findings is most likely?", "options": [{"letter": "A", "text": "Multiple sigmoid diverticula without inflammation"}, {"letter": "B", "text": "Continuous friable mucosa beginning at the rectum"}, {"letter": "C", "text": "Hundreds of adenomatous polyps throughout the colon"}, {"letter": "D", "text": "An annular constricting mass in the sigmoid colon"}, {"letter": "E", "text": "A fungating mass in the cecum"}], "answer": "E", "explanation": "A fungating mass in the cecum. A wide lumen and liquid stool let a right-sided tumor grow and bleed slowly without obstructing — anemia and fatigue rather than caliber change. An annular constricting mass is the left-sided pattern.", "objective": "Guide: Right-Sided Colon Cancer — Special Considerations \"Vs left side.\"", "section": "Iron deficiency without a source"}, {"id": "11", "group": 11, "stem": "A 58-year-old man with fifteen years of heartburn undergoes upper endoscopy. Salmon-colored mucosa extends 3 cm above the gastroesophageal junction, and four-quadrant biopsies show intestinal metaplasia without dysplasia.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Endoscopic ablation of the affected segment with annual surveillance"}, {"letter": "B", "text": "Daily long-term proton pump inhibitor without further endoscopic surveillance"}, {"letter": "C", "text": "Daily long-term proton pump inhibitor with surveillance endoscopy every three years"}, {"letter": "D", "text": "Proton pump inhibitor as needed for symptoms with no surveillance"}, {"letter": "E", "text": "Nissen fundoplication followed by surveillance every five years"}], "answer": "C", "explanation": "Daily long-term proton pump inhibitor with surveillance endoscopy every three years. Barrett's and severe erosive esophagitis are the two long-term PPI maintenance indications, and acid suppression does not remove the need for surveillance. Non-dysplastic Barrett's is surveilled every three years, with a repeat within a year of baseline to confirm. Ablation is for dysplasia.", "objective": "Guide: Barrett's Esophagus — Diagnostics, Surveillance; Management; Special Considerations \"PPI ≠ surveillance.\"", "section": "The consequence of years of reflux"}, {"id": "11A", "group": 11, "stem": "He is at increased risk for which of the following?", "options": [{"letter": "A", "text": "Esophageal leiomyosarcoma"}, {"letter": "B", "text": "Esophageal adenocarcinoma"}, {"letter": "C", "text": "Gastric MALT lymphoma"}, {"letter": "D", "text": "Gastric adenocarcinoma"}, {"letter": "E", "text": "Esophageal squamous cell carcinoma"}], "answer": "B", "explanation": "Esophageal adenocarcinoma. Intestinal metaplasia is the adenocarcinoma pathway — roughly 0.25%/yr from non-dysplastic Barrett's, rising to 4–8%/yr with high-grade dysplasia.", "objective": "Guide: Barrett's Esophagus — Special Considerations \"Cancer type and risk.\"", "section": "The consequence of years of reflux"}, {"id": "12", "group": 12, "stem": "A 51-year-old man with a twenty-year history of heavy alcohol use and three prior hospitalizations for pancreatitis has constant epigastric pain, oily stools that float and are hard to flush, and 12 kg of weight loss. His amylase and lipase are normal. His abdomen is soft with epigastric tenderness, and he has temporal wasting.\n\nWhich of the following findings on CT of the abdomen would best support the diagnosis?", "options": [{"letter": "A", "text": "Homogeneous peripancreatic fluid without a defined wall"}, {"letter": "B", "text": "Non-enhancing pancreatic parenchyma with surrounding gas"}, {"letter": "C", "text": "Coarse \"popcorn\" calcifications with a dilated beaded duct"}, {"letter": "D", "text": "An encapsulated fluid collection with an enhancing wall"}, {"letter": "E", "text": "A hypodense mass in the head with double duct dilation"}], "answer": "C", "explanation": "Coarse \"popcorn\" calcifications with a dilated beaded duct. Amorphous epigastric calcifications are pathognomonic on CT, with gland atrophy and a chain-of-lakes duct. Normal amylase and lipase do not rule chronic pancreatitis out. MRCP is the gold standard and beats CT early, showing an irregular beaded main duct with side-branch dilation.", "objective": "Guide: Chronic Pancreatitis — Diagnostics; 1st Line Labs.", "section": "Recurrent pain with greasy stools"}, {"id": "12A", "group": 12, "stem": "Which of the following laboratory tests best confirms exocrine failure?", "options": [{"letter": "A", "text": "Serum amylase and lipase"}, {"letter": "B", "text": "A 72-hour fecal fat collection on a fixed diet"}, {"letter": "C", "text": "Fecal elastase-1"}, {"letter": "D", "text": "Serum trypsinogen with a secretin stimulation test"}, {"letter": "E", "text": "Fecal calprotectin"}], "answer": "C", "explanation": "Fecal elastase-1. Below 200 µg/g indicates insufficiency, and below 100 is strongly suggestive. Steatorrhea itself is late — it needs about 90% loss of exocrine function, typically 5–10 years in.", "objective": "Guide: Chronic Pancreatitis — Diagnostics, 1st Line Labs; Special Considerations \"Steatorrhea.\"", "section": "Recurrent pain with greasy stools"}, {"id": "13", "group": 13, "stem": "A 54-year-old man is on hospital day nine for severe acute pancreatitis. His pain and fever never settled, and over the past two days his white count has climbed and he has become tachycardic. He has received fluids and enteral feeds and no antibiotics. His temperature is 38.9°C (102.0°F), blood pressure is 100/58 mm Hg, pulse is 122/min, and respirations are 24/min. He has diffuse abdominal tenderness with mild distension and no rigidity.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 23,400/mm³ with left shift |\n| Creatinine | 1.9 mg/dL |\n| Lactate | 2.4 mmol/L |\n| Blood cultures | Pending |\n| CT abdomen with IV contrast | Non-enhancing pancreatic body and tail with gas locked within the necrotic tissue |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Infected pancreatic necrosis"}, {"letter": "B", "text": "An acute peripancreatic fluid collection"}, {"letter": "C", "text": "Sterile necrotizing pancreatitis"}, {"letter": "D", "text": "Hemorrhagic pancreatitis"}, {"letter": "E", "text": "A pancreatic pseudocyst"}], "answer": "A", "explanation": "Infected pancreatic necrosis. Failure to improve at 7–10 days with fever, a rising white count, and gas within the necrotic tissue on CT. About a third of necrotizing pancreatitis becomes infected; the usual organisms are E. coli, Klebsiella, Enterococcus, and Pseudomonas.", "objective": "Guide: Infected Pancreatic Necrosis — Presentation, Diagnostics; Acute Necrotic Collection — Special Considerations \"Suspect infection.\"", "section": "Pancreatitis that is not improving"}, {"id": "13A", "group": 13, "stem": "Which of the following antibiotics is most appropriate?", "options": [{"letter": "A", "text": "Oral vancomycin"}, {"letter": "B", "text": "Nitrofurantoin"}, {"letter": "C", "text": "Azithromycin"}, {"letter": "D", "text": "Cefazolin"}, {"letter": "E", "text": "Imipenem-cilastatin"}], "answer": "E", "explanation": "Imipenem-cilastatin. The agent must penetrate pancreatic tissue: imipenem-cilastatin 500 mg IV every 6 hours for 14 days, with ciprofloxacin (or ceftazidime or cefepime) plus metronidazole as the alternative. About 39% resolve on antibiotics alone. Note that sterile necrosis gets no antibiotics at all.", "objective": "Guide: Infected Pancreatic Necrosis — Management; Necrotizing Pancreatitis — Management.", "section": "Pancreatitis that is not improving"}, {"id": "13B", "group": 13, "stem": "He does not improve on antibiotics. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Repeat contrast CT in 72 hours before any intervention"}, {"letter": "B", "text": "ERCP with pancreatic duct stenting and sphincterotomy"}, {"letter": "C", "text": "Immediate open surgical necrosectomy with wide drainage"}, {"letter": "D", "text": "Endoscopic or percutaneous necrosectomy, delayed until the collection walls off"}, {"letter": "E", "text": "Percutaneous drainage of all sterile necrosis to reduce mortality"}], "answer": "D", "explanation": "Endoscopic or percutaneous necrosectomy, delayed until the collection walls off. Minimally invasive first, surgery only if that fails, and delayed roughly 30 days until walled-off necrosis has formed — the mature wall is what makes drainage safe. Draining sterile necrosis does not reduce mortality.", "objective": "Guide: Infected Pancreatic Necrosis — Management, Refractory; Walled-Off Necrosis — Management.", "section": "Pancreatitis that is not improving"}, {"id": "14", "group": 14, "stem": "A 74-year-old man finished a course of ciprofloxacin for pneumonia ten days ago and now has ten to fifteen watery, foul-smelling stools daily with lower abdominal cramping and fever. His temperature is 38.5°C (101.3°F) and pulse is 112/min. He has left lower quadrant tenderness with mild distension and no rebound. His white blood cell count is 24,000/mm³, creatinine 1.8 mg/dL, and albumin 2.6 g/dL.\n\nWhich of the following is the most appropriate initial therapy?", "options": [{"letter": "A", "text": "Oral vancomycin with discontinuation of the offending antibiotic"}, {"letter": "B", "text": "Oral metronidazole with loperamide for symptom control"}, {"letter": "C", "text": "Intravenous metronidazole with continuation of the antibiotic"}, {"letter": "D", "text": "Fecal microbiota transplantation after stool toxin confirmation"}, {"letter": "E", "text": "Intravenous vancomycin with discontinuation of the antibiotic"}], "answer": "A", "explanation": "Oral vancomycin with discontinuation of the offending antibiotic. Fidaxomicin 200 mg BID or vancomycin 125 mg PO QID for 10 days, with the inciting antibiotic stopped as soon as possible. Vancomycin must be oral — IV vancomycin does not treat C. difficile. Antidiarrheals are contraindicated because they precipitate toxic megacolon, and FMT is reserved for the fourth or later episode.", "objective": "Guide: CDI — Management, Initial episode; Warnings.", "section": "Diarrhea after antibiotics"}, {"id": "14A", "group": 14, "stem": "Which of the following findings would indicate fulminant disease requiring urgent surgical consultation?", "options": [{"letter": "A", "text": "A stool toxin assay that remains positive after treatment"}, {"letter": "B", "text": "Persistent watery stools beyond seventy-two hours"}, {"letter": "C", "text": "Colonic dilation beyond 6 cm with hypotension"}, {"letter": "D", "text": "A white blood cell count that falls to 12,000/mm³"}, {"letter": "E", "text": "Left lower quadrant tenderness that persists on day three"}], "answer": "C", "explanation": "Colonic dilation beyond 6 cm with hypotension. Fulminant disease means hypotension or shock, ileus, or megacolon — and diarrhea may stop once ileus develops. Toxic megacolon is colonic dilation greater than 6 cm with loss of haustra plus systemic toxicity; it calls for early surgical consultation and CT.", "objective": "Guide: CDI — Emergency line; Toxic Megacolon — Diagnostics, Criteria.", "section": "Diarrhea after antibiotics"}, {"id": "15", "group": 15, "stem": "A 24-year-old woman has had eight months of crampy right lower quadrant pain and four to five loose stools daily without blood, along with 7 kg of weight loss. For the past three months she has had a small opening near her anus that drains foul fluid onto her underwear. She smokes half a pack of cigarettes daily. Her temperature is 37.6°C (99.7°F), blood pressure is 112/70 mm Hg, and pulse is 92/min. She has aphthous ulcers on the buccal mucosa, a tender fullness in the right lower quadrant, and an indurated perianal opening with a palpable tract; the rectal mucosa is normal.\n\n| Test | Result |\n|---|---|\n| Hemoglobin | 10.4 g/dL, MCV 76 fL |\n| Albumin | 3.1 g/dL |\n| CRP | 48 mg/L |\n| Fecal calprotectin | 620 µg/g |\n| Stool cultures and C. difficile testing | Negative |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica infection"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Ulcerative colitis"}, {"letter": "D", "text": "Indeterminate colitis"}, {"letter": "E", "text": "Crohn's disease"}], "answer": "E", "explanation": "Crohn's disease. Right lower quadrant pain, nonbloody diarrhea, weight loss, aphthous ulcers, and above all a perianal fistula with a spared rectum — fistulas occur in up to 40% of Crohn's and are rare in UC. Smoking worsens Crohn's and is protective in UC. Why not UC: bloody diarrhea, continuous disease from the rectum, no fistulas, and a non-smoker or ex-smoker.", "objective": "Guide: Crohn's Disease — Presentation, Exam, History; Fistulizing Crohn's — Special Considerations.", "section": "Chronic diarrhea in a young adult"}, {"id": "15A", "group": 15, "stem": "Which of the following findings would ileocolonoscopy most likely show?", "options": [{"letter": "A", "text": "A normal-appearing colon with normal random biopsies"}, {"letter": "B", "text": "Yellow adherent plaques over diffusely erythematous mucosa"}, {"letter": "C", "text": "Skip lesions with cobblestoning and a spared rectum"}, {"letter": "D", "text": "Continuous friable mucosa extending upward from the rectum"}, {"letter": "E", "text": "Multiple sigmoid outpouchings without surrounding inflammation"}], "answer": "C", "explanation": "Skip lesions with cobblestoning and a spared rectum. Also deep longitudinal \"bear claw\" ulcers. Continuous inflammation from the rectum with a spared terminal ileum is UC.", "objective": "Guide: Crohn's Disease — Diagnostics, 1st Line.", "section": "Chronic diarrhea in a young adult"}, {"id": "15B", "group": 15, "stem": "In addition to endoscopy with biopsy, which of the following completes the diagnostic evaluation?", "options": [{"letter": "A", "text": "Anorectal manometry with balloon expulsion testing"}, {"letter": "B", "text": "Barium swallow with small bowel follow-through"}, {"letter": "C", "text": "Abdominal ultrasound with Doppler of the mesenteric vessels"}, {"letter": "D", "text": "Video capsule endoscopy of the small bowel"}, {"letter": "E", "text": "CT or MR enterography of the small bowel"}], "answer": "E", "explanation": "CT or MR enterography of the small bowel. The gold standard is endoscopy with biopsy plus cross-sectional enterography — a combination, not one test. Capsule endoscopy is contraindicated whenever a stricture is suspected.", "objective": "Guide: Crohn's Disease — Diagnostics, Gold Standard; Special Considerations \"Capsule endoscopy.\"", "section": "Chronic diarrhea in a young adult"}, {"id": "16", "group": 16, "stem": "A 74-year-old woman with coronary disease and an aortic aneurysm repaired three weeks ago develops sudden crampy left lower abdominal pain, and within a few hours passes several maroon stools with an urge to keep going. She has not vomited. Her temperature is 37.5°C (99.5°F), blood pressure is 118/70 mm Hg, and pulse is 96/min. Her abdomen is soft with tenderness localized over the left lower quadrant that matches where she points, without rebound or rigidity, and bowel sounds are present.\n\n| Test | Result |\n|---|---|\n| White blood cell count | 13,200/mm³ |\n| Lactate | 1.5 mmol/L |\n| Hemoglobin | 11.9 g/dL |\n| Creatinine | 1.1 mg/dL |\n| Upright radiograph | No free air, no dilated loops |\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute mesenteric ischemia"}, {"letter": "B", "text": "Diverticular hemorrhage"}, {"letter": "C", "text": "Ischemic colitis"}, {"letter": "D", "text": "Infectious colitis"}, {"letter": "E", "text": "Acute diverticulitis"}], "answer": "C", "explanation": "Ischemic colitis. Rapid-onset crampy left-sided pain followed within 24 hours by bloody diarrhea in a patient over 60 with cardiovascular disease and recent aortic surgery. Tenderness is proportionate to the exam — the opposite of mesenteric ischemia, where pain is out of proportion to a soft belly and the small bowel is at risk. Diverticular bleeding is painless.", "objective": "Guide: Ischemic Colitis — Presentation, Exam, History; Acute Mesenteric Ischemia — Special Considerations \"vs ischemic colitis.\"", "section": "Left-sided pain with bleeding"}, {"id": "16A", "group": 16, "stem": "Which of the following would CT of the abdomen with intravenous contrast most likely show?", "options": [{"letter": "A", "text": "Sigmoid wall thickening with pericolonic stranding and diverticula"}, {"letter": "B", "text": "Diffuse colonic dilation with loss of haustral markings"}, {"letter": "C", "text": "Free intraperitoneal air with mesenteric fat stranding"}, {"letter": "D", "text": "An abrupt arterial cutoff in the superior mesenteric artery"}, {"letter": "E", "text": "Segmental wall thickening with thumbprinting near the splenic flexure"}], "answer": "E", "explanation": "Segmental wall thickening with thumbprinting near the splenic flexure. Thumbprinting is not specific on its own — location at a watershed, symptoms, and risk factors together make the diagnosis. Angiography is not indicated here, since 95% is non-occlusive low flow.", "objective": "Guide: Ischemic Colitis — Diagnostics, 1st Line Imaging; Special Considerations.", "section": "Left-sided pain with bleeding"}, {"id": "16B", "group": 16, "stem": "Colonoscopy is performed once she is stable. Which finding would be most characteristic?", "options": [{"letter": "A", "text": "Skip lesions with cobblestoning and rectal sparing"}, {"letter": "B", "text": "Multiple outpouchings without surrounding inflammation"}, {"letter": "C", "text": "A single longitudinal ulcer with an abrupt transition to normal mucosa"}, {"letter": "D", "text": "Continuous friability beginning at the rectum and extending proximally"}, {"letter": "E", "text": "Yellow adherent plaques over an erythematous colon"}], "answer": "C", "explanation": "A single longitudinal ulcer with an abrupt transition to normal mucosa. The colon single-stripe sign, with segmental erythema, edema, and friability ending abruptly at normal mucosa. The rectum is usually spared because of its dual internal iliac supply — rectal involvement argues for a different diagnosis. Do not scope with peritonitis or suspected gangrene.", "objective": "Guide: Ischemic Colitis — Diagnostics, Gold Standard; Special Considerations; Warnings.", "section": "Left-sided pain with bleeding"}, {"id": "17", "group": 17, "stem": "A 68-year-old man is brought in after vomiting a cupful of dark material that looked like coffee grounds, followed by two black tarry stools. He has taken naproxen twice daily for six months for shoulder pain and takes no acid suppression. He drinks two beers a week and has no liver disease. His blood pressure is 104/62 mm Hg, pulse is 112/min, and he is pale and diaphoretic. His abdomen is soft with epigastric tenderness and no organomegaly; rectal examination shows melena.\n\n| Test | Result |\n|---|---|\n| Hemoglobin | 8.1 g/dL |\n| Platelets | 210,000/mm³ |\n| INR | 1.0 |\n| BUN / creatinine | 42 / 0.9 mg/dL |\n| Albumin | 4.0 g/dL |\n\nWhich of the following is the most likely source of bleeding?", "options": [{"letter": "A", "text": "Erosive gastritis alone"}, {"letter": "B", "text": "A peptic ulcer"}, {"letter": "C", "text": "Esophageal varices"}, {"letter": "D", "text": "A Mallory-Weiss tear"}, {"letter": "E", "text": "A gastric malignancy"}], "answer": "B", "explanation": "A peptic ulcer. Six months of a twice-daily NSAID with no acid suppression, coffee-ground emesis, and melena, in a patient with no liver disease and a normal INR and albumin. The BUN-to-creatinine ratio above 30 marks an upper GI source from digested blood.", "objective": "Guide: Peptic Ulcer Disease — Emergency line; Medical Complications of PUD — Special Considerations \"BUN:Cr >30.\"", "section": "Vomiting blood"}, {"id": "17A", "group": 17, "stem": "Which of the following is the most appropriate pharmacologic management before endoscopy?", "options": [{"letter": "A", "text": "Octreotide 50 mcg intravenous bolus followed by a 50 mcg/hr infusion"}, {"letter": "B", "text": "Oral pantoprazole 40 mg twice daily with observation"}, {"letter": "C", "text": "Tranexamic acid 1 g intravenously with fresh frozen plasma"}, {"letter": "D", "text": "Pantoprazole 80 mg intravenous bolus followed by an 8 mg/hr infusion"}, {"letter": "E", "text": "Ceftriaxone 1 g intravenously with an oral proton pump inhibitor"}], "answer": "D", "explanation": "Pantoprazole 80 mg intravenous bolus followed by an 8 mg/hr infusion. A clot needs a gastric pH above 6 to hold. Octreotide and ceftriaxone belong to the variceal protocol in a cirrhotic — he is not one. Tranexamic acid shows no benefit in GI bleeding.", "objective": "Guide: Medical Complications of PUD — Management, Bleeding; Esophageal Varices — Warnings.", "section": "Vomiting blood"}, {"id": "17B", "group": 17, "stem": "Which endoscopic finding carries the highest risk of rebleeding?", "options": [{"letter": "A", "text": "A non-bleeding visible vessel"}, {"letter": "B", "text": "Diffuse antral erythema without ulceration"}, {"letter": "C", "text": "A flat pigmented spot"}, {"letter": "D", "text": "A clean ulcer base"}, {"letter": "E", "text": "A linear tear at the gastroesophageal junction"}], "answer": "A", "explanation": "A non-bleeding visible vessel. The stigmata earning endoscopic therapy are active bleeding, a non-bleeding visible vessel, and an adherent clot; rebleeding runs up to 43% with a visible vessel versus about 5% for a clean base.", "objective": "Guide: Peptic Ulcer Disease — Special Considerations \"Bleeding = MC complication.\"", "section": "Vomiting blood"}, {"id": "18", "group": 18, "stem": "A 34-year-old man born in Vietnam is screened during a new-patient visit. He feels well, drinks no alcohol, and his transaminases have been normal on two occasions six months apart.\n\n| Test | Result |\n|---|---|\n| HBsAg | Positive |\n| HBsAb | Negative |\n| HBcAb IgG | Positive |\n| HBcAb IgM | Negative |\n| HBeAg | Negative |\n| HBeAb | Positive |\n| HBV DNA | Undetectable |\n\nWhich of the following best describes his status?", "options": [{"letter": "A", "text": "Acute hepatitis B infection"}, {"letter": "B", "text": "Immunity from prior vaccination"}, {"letter": "C", "text": "Immunity from a resolved infection"}, {"letter": "D", "text": "Chronic hepatitis B with active replication"}, {"letter": "E", "text": "Inactive chronic hepatitis B infection"}], "answer": "E", "explanation": "Inactive chronic hepatitis B infection. HBsAg positive beyond six months with core IgG makes it chronic; HBeAg negative with HBeAb positive, undetectable DNA, and persistently normal ALT makes it the inactive carrier state. Vaccine immunity would be HBsAb positive with a negative core antibody; resolved infection is HBsAb and core antibody positive with a negative surface antigen.", "objective": "Guide: Hepatitis B Carrier State — Diagnostics; Hepatitis B — Special Considerations, Serology.", "section": "Reading a hepatitis B panel"}, {"id": "18A", "group": 18, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Monitoring of ALT and HBV DNA without antiviral therapy"}, {"letter": "B", "text": "Entecavir for twelve weeks followed by reassessment"}, {"letter": "C", "text": "A three-dose hepatitis B vaccination series"}, {"letter": "D", "text": "Tenofovir started now and continued indefinitely"}, {"letter": "E", "text": "Peginterferon alfa-2a given weekly for forty-eight weeks"}], "answer": "A", "explanation": "Monitoring of ALT and HBV DNA without antiviral therapy. No antiviral is indicated; ALT and HBV DNA every 6–12 months. HCC surveillance with ultrasound every six months begins over age 40 or with cirrhosis. If immunosuppression is ever planned, prophylactic antiviral is usually required — reactivation can be fulminant.", "objective": "Guide: Hepatitis B Carrier State — Management; Special Considerations.", "section": "Reading a hepatitis B panel"}, {"id": "19", "group": 19, "stem": "A 44-year-old man has sudden severe epigastric pain radiating to his back with nausea and vomiting, relieved somewhat by sitting forward. He has epigastric tenderness without guarding or rebound.\n\nWhich of the following laboratory tests is most useful in establishing the diagnosis?", "options": [{"letter": "A", "text": "Serum lactate dehydrogenase"}, {"letter": "B", "text": "Urinary trypsinogen-2"}, {"letter": "C", "text": "Serum lipase"}, {"letter": "D", "text": "Serum amylase"}, {"letter": "E", "text": "Serum alkaline phosphatase"}], "answer": "C", "explanation": "Serum lipase. Lipase at three times the upper limit or more is the diagnostic threshold; it is more sensitive and specific than amylase and stays elevated for about two weeks. Amylase is not used — false positives from bowel, uterus, salivary gland, and cholecystitis, and it misses roughly 20% of cases.", "objective": "Guide: Acute Pancreatitis — Diagnostics, 1st Line Labs; Special Considerations \"Lipase vs amylase.\"", "section": "Confirming pancreatic inflammation"}, {"id": "19A", "group": 19, "stem": "Which of the following is true of the value obtained?", "options": [{"letter": "A", "text": "It rises only once pancreatic necrosis has developed"}, {"letter": "B", "text": "A normal value excludes acute pancreatitis in all patients"}, {"letter": "C", "text": "The degree of elevation correlates directly with disease severity"}, {"letter": "D", "text": "It normalizes within 24 hours of symptom onset"}, {"letter": "E", "text": "The degree of elevation does not predict the severity of disease"}], "answer": "E", "explanation": "The degree of elevation does not predict the severity of disease. Severity is judged by organ failure and scores such as Ranson's, not by the enzyme number. Note also that lipase can be falsely low in severe lipemia from hypertriglyceridemia.", "objective": "Guide: Acute Pancreatitis — Diagnostics; Hypertriglyceridemia-Induced Pancreatitis — Diagnostics.", "section": "Confirming pancreatic inflammation"}, {"id": "20", "group": 20, "stem": "A 47-year-old man had severe acute pancreatitis seven weeks ago. He has persistent epigastric discomfort, early satiety, and vomiting after meals. CT of the abdomen shows an 8 cm encapsulated fluid collection with a well-defined enhancing wall adjacent to the pancreas, containing minimal debris; the pancreas itself enhances normally.\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "An acute necrotic collection"}, {"letter": "B", "text": "A cystic pancreatic neoplasm"}, {"letter": "C", "text": "Walled-off necrosis"}, {"letter": "D", "text": "An acute peripancreatic fluid collection"}, {"letter": "E", "text": "A pancreatic pseudocyst"}], "answer": "E", "explanation": "A pancreatic pseudocyst. Encapsulated fluid with a well-defined enhancing wall, minimal debris, and a normally enhancing pancreas, at least four weeks after the attack. An acute peripancreatic fluid collection has no wall and occurs in the first four weeks; walled-off necrosis is heterogeneous with necrotic debris; an acute necrotic collection is heterogeneous and unwalled.", "objective": "Guide: Pancreatic Pseudocyst — Diagnostics; APFC and WON — Special Considerations.", "section": "A collection after pancreatitis"}, {"id": "20A", "group": 20, "stem": "Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Observation with repeat imaging in three months"}, {"letter": "B", "text": "Percutaneous aspiration for cytology only"}, {"letter": "C", "text": "Distal pancreatectomy with splenectomy"}, {"letter": "D", "text": "Antibiotics with repeat imaging in one week"}, {"letter": "E", "text": "Endoscopic drainage of the collection"}], "answer": "E", "explanation": "Endoscopic drainage of the collection. Drainage is indicated for pain, mass effect, or infection — endoscopic preferred. Observation is right only for collections under 5 cm that are asymptomatic; his are neither.", "objective": "Guide: Pancreatic Pseudocyst — Management.", "section": "A collection after pancreatitis"}, {"id": "21", "group": 21, "stem": "A 61-year-old man has a positive hepatitis C antibody on one-time screening. He feels well and his liver enzymes are normal.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Hepatitis C genotype testing"}, {"letter": "B", "text": "Repeat hepatitis C antibody testing in six months"}, {"letter": "C", "text": "Hepatitis C RNA by polymerase chain reaction"}, {"letter": "D", "text": "Liver biopsy to stage hepatic fibrosis"}, {"letter": "E", "text": "Reassurance that the result is a false positive"}], "answer": "C", "explanation": "Hepatitis C RNA by polymerase chain reaction. A positive antibody means exposure only — it stays positive after cure and after spontaneous clearance, and false positives occur. Every positive antibody must be followed by an RNA.", "objective": "Guide: Hepatitis C — Diagnostics, Confirmatory; Special Considerations \"No vaccine, no immunity.\"", "section": "A positive screening antibody"}, {"id": "21A", "group": 21, "stem": "His hepatitis C RNA is detectable. Which of the following must be checked before treatment begins?", "options": [{"letter": "A", "text": "Thyroid stimulating hormone and free thyroxine"}, {"letter": "B", "text": "Serum alpha-fetoprotein and a liver ultrasound"}, {"letter": "C", "text": "Serum ceruloplasmin and 24-hour urinary copper"}, {"letter": "D", "text": "Anti-mitochondrial antibody and serum IgM"}, {"letter": "E", "text": "Hepatitis B surface antigen and core antibody"}], "answer": "E", "explanation": "Hepatitis B surface antigen and core antibody. Epclusa and Mavyret carry a black box warning for hepatitis B reactivation, so HBV status must be established before starting a direct-acting antiviral. HIV is checked as well.", "objective": "Guide: Hepatitis C — Warnings; Chronic Hepatitis C — Diagnostics, Screening.", "section": "A positive screening antibody"}, {"id": "22", "group": 22, "stem": "A 41-year-old man has had two years of difficulty swallowing both solids and liquids, and regurgitates undigested food hours after eating. A barium esophagram shows a dilated esophagus tapering to a beak at the gastroesophageal junction.\n\nWhich of the following studies confirms the diagnosis?", "options": [{"letter": "A", "text": "CT of the chest with intravenous contrast"}, {"letter": "B", "text": "High-resolution esophageal manometry"}, {"letter": "C", "text": "Upper endoscopy with esophageal biopsies"}, {"letter": "D", "text": "Barium esophagram repeated with a 13 mm tablet"}, {"letter": "E", "text": "Ambulatory 24-hour esophageal pH monitoring"}], "answer": "B", "explanation": "High-resolution esophageal manometry. Dysphagia to solids and liquids with a bird's-beak esophagram is achalasia; manometry is the gold standard, showing absent peristalsis with incomplete LES relaxation. EGD is still performed in every patient, but to exclude pseudoachalasia from a GEJ malignancy — not to confirm.", "objective": "Guide: Achalasia — Diagnostics, Gold Standard.", "section": "Dysphagia to solids and liquids"}, {"id": "22A", "group": 22, "stem": "This patient is at increased long-term risk for which of the following?", "options": [{"letter": "A", "text": "Esophageal leiomyoma"}, {"letter": "B", "text": "Esophageal squamous cell carcinoma"}, {"letter": "C", "text": "Gastric adenocarcinoma"}, {"letter": "D", "text": "Gastric MALT lymphoma"}, {"letter": "E", "text": "Esophageal adenocarcinoma"}], "answer": "B", "explanation": "Esophageal squamous cell carcinoma. Chronic stasis above a closed LES causes chronic inflammation. Adenocarcinoma is the Barrett's/GERD pathway, not this one.", "objective": "Guide: Achalasia — Special Considerations, Cancer risk.", "section": "Dysphagia to solids and liquids"}, {"id": "23", "group": 23, "stem": "A 59-year-old man with known alcohol-related cirrhosis vomits a large volume of bright red blood at home and arrives pale and lightheaded. He has not been retching beforehand and has had no abdominal pain. His blood pressure is 86/52 mm Hg, pulse is 126/min, and respirations are 24/min. He has spider angiomata, caput medusae, splenomegaly, and moderate ascites; there is no crepitus and the abdomen is non-tender.\n\n| Test | Result |\n|---|---|\n| Hemoglobin | 7.4 g/dL |\n| Platelets | 84,000/mm³ |\n| INR | 1.6 |\n| BUN / creatinine | 38 / 1.1 mg/dL |\n| Total bilirubin | 3.4 mg/dL |\n\nWhich of the following is the most likely source of the bleeding?", "options": [{"letter": "A", "text": "Esophageal varices"}, {"letter": "B", "text": "A bleeding duodenal ulcer"}, {"letter": "C", "text": "Erosive gastritis"}, {"letter": "D", "text": "Boerhaave syndrome"}, {"letter": "E", "text": "A Mallory-Weiss tear"}], "answer": "A", "explanation": "Esophageal varices. Hematemesis in a cirrhotic is variceal until proven otherwise — varices account for 59% of upper GI bleeds in this population. There was no antecedent retching, which is what a Mallory-Weiss tear requires, and no crepitus or chest pain to suggest Boerhaave.", "objective": "Guide: Esophageal Varices — Emergency line; Variceal Bleed — Special Considerations, Epidemiology.", "section": "Hematemesis in liver disease"}, {"id": "23A", "group": 23, "stem": "Which of the following combinations should be started immediately?", "options": [{"letter": "A", "text": "Vasopressin with fresh frozen plasma and platelets"}, {"letter": "B", "text": "A non-selective beta blocker with a proton pump inhibitor"}, {"letter": "C", "text": "Octreotide and a proton pump inhibitor alone"}, {"letter": "D", "text": "Octreotide, ceftriaxone, and a proton pump inhibitor"}, {"letter": "E", "text": "Ceftriaxone and tranexamic acid with fresh frozen plasma"}], "answer": "D", "explanation": "Octreotide, ceftriaxone, and a proton pump inhibitor. Octreotide lowers splanchnic and portal pressure, and antibiotic prophylaxis is not optional in a cirrhotic with a GI bleed — ceftriaxone reduces mortality. Band ligation follows within 12 hours. Tranexamic acid has no benefit.", "objective": "Guide: Variceal Bleed — Emergency line; Esophageal Varices — Warnings.", "section": "Hematemesis in liver disease"}, {"id": "23B", "group": 23, "stem": "Which of the following best describes the transfusion goal?", "options": [{"letter": "A", "text": "Transfuse to a hemoglobin near 7 g/dL and no higher"}, {"letter": "B", "text": "Transfuse only once the hemoglobin falls below 6 g/dL"}, {"letter": "C", "text": "Transfuse to a hemoglobin near 10 g/dL for organ perfusion"}, {"letter": "D", "text": "Withhold transfusion until endoscopic hemostasis is achieved"}, {"letter": "E", "text": "Transfuse to normalize the blood pressure above 120 systolic"}], "answer": "A", "explanation": "Transfuse to a hemoglobin near 7 g/dL and no higher. Resuscitation here is pressure-related, not arterial: over-resuscitation raises portal pressure and worsens the bleed. Aim for a blood pressure around 100 systolic and a hemoglobin of 7–8.", "objective": "Guide: Variceal Bleed — Special Considerations \"Resuscitation.\"", "section": "Hematemesis in liver disease"}, {"id": "24", "group": 24, "stem": "A 39-year-old man with poorly controlled type 2 diabetes has 14 hours of severe epigastric pain radiating to the back with vomiting. He drinks rarely, has no gallstones on ultrasound, and his mother has a lipid disorder. He was started on an estrogen-containing medication three months ago. His temperature is 37.6°C (99.7°F), blood pressure is 130/82 mm Hg, and pulse is 110/min. He has epigastric tenderness without guarding, small yellow papules over the extensor surfaces of both elbows, and creamy-appearing retinal vessels on fundoscopy.\n\n| Test | Result |\n|---|---|\n| Triglycerides | 3,850 mg/dL |\n| Lipase | 260 U/L |\n| Glucose | 388 mg/dL |\n| Calcium | 8.8 mg/dL |\n| Serum appearance | Lipemic |\n\nWhich of the following is the most likely cause of his pancreatitis?", "options": [{"letter": "A", "text": "Hypertriglyceridemia"}, {"letter": "B", "text": "Alcohol"}, {"letter": "C", "text": "Hypercalcemia"}, {"letter": "D", "text": "Autoimmune pancreatitis"}, {"letter": "E", "text": "Gallstones"}], "answer": "A", "explanation": "Hypertriglyceridemia. Triglycerides above 1,000 mg/dL with lipemic serum, eruptive xanthomas, and lipemia retinalis, in an obese diabetic on estrogen with a family lipid disorder and no gallstones. It is the third most common cause after gallstones and alcohol. Estrogens raise triglycerides and should be stopped.", "objective": "Guide: Hypertriglyceridemia-Induced Pancreatitis — Common Patient, Exam, Diagnostics; Warnings.", "section": "Pancreatitis with an unusual laboratory picture"}, {"id": "24A", "group": 24, "stem": "A different patient with severe pancreatitis deteriorates suddenly with hypotension, a falling hematocrit, and bruising over both flanks and around the navel. What has most likely occurred?", "options": [{"letter": "A", "text": "Infected pancreatic necrosis with septic shock"}, {"letter": "B", "text": "Hemorrhagic pancreatitis with retroperitoneal bleeding"}, {"letter": "C", "text": "Rupture of a pancreatic pseudocyst into the peritoneum"}, {"letter": "D", "text": "Abdominal compartment syndrome from fluid overload"}, {"letter": "E", "text": "Splenic vein thrombosis with gastric variceal bleeding"}], "answer": "B", "explanation": "Hemorrhagic pancreatitis with retroperitoneal bleeding. Grey Turner's sign is flank ecchymosis from retroperitoneal blood tracking to the lateral wall; Cullen's sign is periumbilical, along the falciform ligament. Both are rare, take 24–48 hours to appear, and are not specific — any major retroperitoneal bleed will do it, including a ruptured AAA, a ruptured ectopic pregnancy, or trauma. Management is ICU care, blood-product resuscitation, and interventional-radiology angioembolization, with surgery for uncontrolled hemorrhage. (Note in the index case above: severe lipemia can falsely lower the measured lipase, which is why his enzyme is only modestly raised.)", "objective": "Guide: Hemorrhagic Pancreatit
