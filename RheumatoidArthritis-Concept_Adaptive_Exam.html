<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "Rheumatoid Arthritis-Concept_Adaptive_Exam", "questions": [{"id": "1", "group": 1, "section": "RA diagnosis", "topic": "Rheumatoid arthritis — diagnosis & serology", "skill": "Diagnostics & imaging", "stem": "Which serologic marker is highly specific for rheumatoid arthritis?", "options": [{"letter": "A", "text": "Elevated ESR"}, {"letter": "B", "text": "Rheumatoid factor"}, {"letter": "C", "text": "Antinuclear antibody"}, {"letter": "D", "text": "Elevated CRP"}, {"letter": "E", "text": "Anti-CCP antibody"}], "answer": "E", "explanation": "**Anti-CCP is very specific (≈95%) for RA** and predicts erosive disease; RF is an IgM antibody that is nonspecific (also positive in SBE and hepatitis C).", "objective": "", "remediation": {"steps": [{"teach": "RA serology relies on two antibodies: **rheumatoid factor (RF)**, an IgM antibody, and an antibody directed against **citrullinated peptides**. Only one of them is specific.", "stem": "Rheumatoid factor is an antibody of which immunoglobulin class?", "options": [{"letter": "A", "text": "IgE"}, {"letter": "B", "text": "IgM"}, {"letter": "C", "text": "IgG"}], "answer": "B", "explanation": "RF is an IgM antibody directed against the Fc portion of IgG; it is <70% sensitive and nonspecific.", "clarify": [{"teach": "Citrulline is deaminated arginine, produced by the enzyme PADI.", "stem": "Anti-CCP is directed against which modified peptides?", "options": [{"letter": "A", "text": "Citrullinated peptides"}, {"letter": "B", "text": "Phosphorylated peptides"}], "answer": "A", "explanation": "CCP = cyclic citrullinated peptide; citrulline is arginine deaminated by PADI."}]}, {"teach": "RF can be positive in infections such as SBE and hepatitis C, which limits its **specificity**. The other antibody is also the marker that **predicts erosive disease**.", "stem": "Which positive result is LEAST helpful for confirming RA because of poor specificity?", "options": [{"letter": "A", "text": "Positive anti-CCP"}, {"letter": "B", "text": "Positive RF"}, {"letter": "C", "text": "Both are equally specific"}], "answer": "B", "explanation": "RF is nonspecific (seen in SBE, hepatitis C); anti-CCP is ~95% specific."}, {"teach": "In the lecture's opening vignette of early symmetric synovitis, the first labs ordered are the two RA antibodies plus ESR/CRP.", "stem": "For suspected early RA, which pair of antibodies is ordered first?", "options": [{"letter": "A", "text": "ANA + anti-dsDNA"}, {"letter": "B", "text": "Anti-CCP + HLA-B27"}, {"letter": "C", "text": "RF + ANA"}, {"letter": "D", "text": "RF + anti-CCP"}], "answer": "D", "explanation": "Early RA → order RF and anti-CCP; anti-CCP is the specific one."}], "checkpoints": [{"stem": "A positive anti-CCP predicts which feature of RA?", "options": [{"letter": "A", "text": "Scleritis"}, {"letter": "B", "text": "Erosive disease"}, {"letter": "C", "text": "Pleural effusion"}, {"letter": "D", "text": "Felty syndrome"}], "answer": "B", "explanation": "Anti-CCP is 95% specific, 67% sensitive, and predicts erosive disease."}, {"stem": "RF is considered nonspecific because it is also positive in which condition?", "options": [{"letter": "A", "text": "Psoriatic arthritis"}, {"letter": "B", "text": "Gout"}, {"letter": "C", "text": "Hepatitis C"}, {"letter": "D", "text": "Osteoarthritis"}], "answer": "C", "explanation": "RF is seen in SBE and hepatitis C, among others."}]}}, {"id": "2", "group": 2, "section": "RA clinical presentation", "topic": "Rheumatoid arthritis — extra-articular disease", "skill": "Complications", "multi": true, "stem": "Which of the following are extra-articular manifestations of rheumatoid arthritis?", "options": [{"letter": "A", "text": "Interstitial lung disease"}, {"letter": "B", "text": "Dactylitis"}, {"letter": "C", "text": "Scleritis"}, {"letter": "D", "text": "Pericarditis"}, {"letter": "E", "text": "Anterior uveitis"}], "answers": ["A", "C", "D"], "explanation": "RA extra-articular disease includes **ILD (up to 50%)**, scleritis (perforation risk), pericarditis and CAD, Felty syndrome, nodules, and vasculitis. Dactylitis and anterior uveitis belong to psoriatic and oligoarticular/enthesitis-related JIA.", "objective": "", "remediation": {"steps": [{"teach": "RA lung disease is common: **interstitial lung disease** occurs in up to half of patients, along with pleural effusions (5%), rheumatoid lung nodules, and bronchiectasis.", "stem": "Which is the most common pulmonary manifestation of RA?", "options": [{"letter": "A", "text": "Interstitial lung disease"}, {"letter": "B", "text": "Lung nodules"}, {"letter": "C", "text": "Pleural effusion"}], "answer": "A", "explanation": "ILD occurs in up to 50%; pleural disease in about 5%.", "clarify": [{"stem": "RA pleural effusions occur in roughly what proportion of patients?", "options": [{"letter": "A", "text": "About 50%"}, {"letter": "B", "text": "About 5%"}], "answer": "B", "explanation": "Pleural disease ≈5%; ILD is the one that reaches 50%."}]}, {"teach": "RA eye disease spans dry eyes, episcleritis, **scleritis** (may perforate) and keratitis (corneal melt). Uveitis is the eye complication of **JIA**, not adult RA.", "stem": "The RA eye complication that threatens scleral perforation is:", "options": [{"letter": "A", "text": "Episcleritis"}, {"letter": "B", "text": "Anterior uveitis"}, {"letter": "C", "text": "Scleritis"}], "answer": "C", "explanation": "Scleritis can progress to scleral perforation; episcleritis is benign.", "clarify": [{"stem": "Anterior uveitis is the classic eye complication of which condition?", "options": [{"letter": "A", "text": "Oligoarticular JIA"}, {"letter": "B", "text": "Adult RA"}], "answer": "A", "explanation": "20% of oligoarticular JIA develop anterior uveitis; adult RA causes scleritis/keratitis."}]}, {"teach": "Cardiac manifestations are **pericarditis** and accelerated coronary artery disease. Dactylitis (sausage digit) is a feature of **psoriatic** arthritis/JIA.", "stem": "Dactylitis in a child with arthritis points toward which JIA subtype?", "options": [{"letter": "A", "text": "Systemic JIA"}, {"letter": "B", "text": "Oligoarticular JIA"}, {"letter": "C", "text": "Psoriatic JIA"}], "answer": "C", "explanation": "One third of psoriatic JIA patients have dactylitis; it is not an RA feature."}], "checkpoints": [{"stem": "Which triad defines Felty syndrome?", "options": [{"letter": "A", "text": "RA + leukocytosis + fever"}, {"letter": "B", "text": "RA + neutropenia + splenomegaly"}, {"letter": "C", "text": "RA + thrombocytosis + hepatomegaly"}, {"letter": "D", "text": "RA + anemia + lymphadenopathy"}], "answer": "B", "explanation": "Felty = RA, neutropenia, splenomegaly."}, {"stem": "Hoarseness in an RA patient most likely reflects arthritis of which structure?", "options": [{"letter": "A", "text": "Temporomandibular joint"}, {"letter": "B", "text": "Atlantoaxial joint"}, {"letter": "C", "text": "Cricoarytenoid joint"}, {"letter": "D", "text": "Sternoclavicular joint"}], "answer": "C", "explanation": "RA with hoarseness → cricoarytenoid arthritis (voice box)."}]}, "answer": "A,C,D"}, {"id": "3", "group": 3, "section": "Juvenile idiopathic arthritis", "topic": "Juvenile idiopathic arthritis", "skill": "Identification", "stem": "Juvenile idiopathic arthritis is defined by persistent synovitis lasting longer than how many weeks, in a child under what age?", "options": [{"letter": "A", "text": ">6 weeks, <16 years"}, {"letter": "B", "text": ">6 weeks, <18 years"}, {"letter": "C", "text": ">3 months, <21 years"}, {"letter": "D", "text": ">12 weeks, <16 years"}, {"letter": "E", "text": ">2 weeks, <12 years"}], "answer": "A", "explanation": "JIA = **persistent synovitis in >1 joint for >6 weeks in a child <16 years**; more common in girls; formerly called JRA.", "objective": "", "remediation": {"steps": [{"teach": "The 6-week threshold matters because **crystalline and viral arthritis** rarely persist that long; the same ≥6-week rule appears in the adult RA criteria.", "stem": "Why does the JIA definition require more than 6 weeks of synovitis?", "options": [{"letter": "A", "text": "Because uveitis takes 6 weeks to appear"}, {"letter": "B", "text": "Because RF takes 6 weeks to turn positive"}, {"letter": "C", "text": "To exclude self-limited viral or crystal causes"}], "answer": "C", "explanation": "Duration ≥6 weeks is less often seen with crystalline or viral causes.", "clarify": [{"stem": "In the adult ACR/EULAR criteria, a point is awarded for symptom duration of at least:", "options": [{"letter": "A", "text": "6 weeks"}, {"letter": "B", "text": "6 months"}], "answer": "A", "explanation": "Duration ≥6 weeks = 1 point."}]}, {"teach": "JIA was formerly called JRA; 'idiopathic' reflects an unclear cause, though a **viral URI or pharyngitis** can trigger it. It is **more common in girls**.", "stem": "Which statement about JIA is correct?", "options": [{"letter": "A", "text": "It requires a positive RF"}, {"letter": "B", "text": "It is more common in girls"}, {"letter": "C", "text": "It is caused by a known bacterium"}], "answer": "B", "explanation": "JIA is idiopathic, more common in girls, and diagnosed clinically."}], "checkpoints": [{"stem": "With treatment, what proportion of JIA patients have inactive disease at 3 years?", "options": [{"letter": "A", "text": "95%"}, {"letter": "B", "text": "20%"}, {"letter": "C", "text": "50%"}, {"letter": "D", "text": "70%"}], "answer": "D", "explanation": "70% have inactive disease at 3 years with treatment."}, {"stem": "The diagnosis of JIA is primarily:", "options": [{"letter": "A", "text": "By synovial biopsy"}, {"letter": "B", "text": "Radiographic"}, {"letter": "C", "text": "Clinical"}, {"letter": "D", "text": "Serologic (ANA)"}], "answer": "C", "explanation": "JIA is mainly a clinical diagnosis; ANA is prognostic, not diagnostic."}]}}, {"id": "4", "group": 4, "section": "RA pharmacologic management", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Pharmacology", "stem": "Which agent is the first-line \"anchor\" DMARD for rheumatoid arthritis?", "options": [{"letter": "A", "text": "Methotrexate"}, {"letter": "B", "text": "Sulfasalazine"}, {"letter": "C", "text": "Leflunomide"}, {"letter": "D", "text": "Adalimumab"}, {"letter": "E", "text": "Hydroxychloroquine"}], "answer": "A", "explanation": "**Methotrexate is the anchor csDMARD**, given weekly with daily folic acid; TNF blockers are second-line after MTX, and hydroxychloroquine is reserved for mild disease.", "objective": "", "remediation": {"steps": [{"teach": "RA drugs are layered: NSAIDs for symptoms, prednisone as a bridge, then **disease-modifying** agents (csDMARD → bDMARD/tsDMARD).", "stem": "Which drug class actually alters the course of RA?", "options": [{"letter": "A", "text": "Acetaminophen"}, {"letter": "B", "text": "DMARDs"}, {"letter": "C", "text": "NSAIDs"}], "answer": "B", "explanation": "Only DMARDs modify disease; NSAIDs relieve symptoms.", "clarify": [{"stem": "NSAIDs in RA:", "options": [{"letter": "A", "text": "Prevent joint erosions"}, {"letter": "B", "text": "Relieve symptoms only"}], "answer": "B", "explanation": "NSAIDs do not change the disease course or prevent damage."}]}, {"teach": "Among csDMARDs, one is reserved for **mild disease** (hydroxychloroquine), one persists ~2 years (leflunomide), one is a prodrug split into 5-ASA + sulfapyridine (sulfasalazine); the anchor is the weekly agent given with **folic acid**.", "stem": "Which supplement is paired daily with the anchor DMARD?", "options": [{"letter": "A", "text": "Vitamin D"}, {"letter": "B", "text": "Folic acid"}, {"letter": "C", "text": "Iron"}], "answer": "B", "explanation": "Folic acid daily offsets the folate effects of the weekly anchor drug.", "clarify": [{"stem": "Which csDMARD is reserved for mild disease?", "options": [{"letter": "A", "text": "Methotrexate"}, {"letter": "B", "text": "Hydroxychloroquine"}], "answer": "B", "explanation": "Hydroxychloroquine = csDMARD for mild disease."}]}, {"teach": "Low-dose weekly therapy acts via adenosine signaling rather than as a folate antagonist; it is **teratogenic** and requires **CXR, CBC, CMP, hepatitis** screening at baseline.", "stem": "The first DMARD started in newly diagnosed RA is:", "options": [{"letter": "A", "text": "Methotrexate"}, {"letter": "B", "text": "Etanercept"}, {"letter": "C", "text": "Tofacitinib"}, {"letter": "D", "text": "Prednisone"}], "answer": "A", "explanation": "Methotrexate is the anchor, first-line DMARD."}], "checkpoints": [{"stem": "A methotrexate patient develops GI upset and fatigue after each weekly dose. What is added?", "options": [{"letter": "A", "text": "Leucovorin"}, {"letter": "B", "text": "A second NSAID"}, {"letter": "C", "text": "Prednisone"}, {"letter": "D", "text": "Sulfasalazine"}], "answer": "A", "explanation": "Leucovorin weekly is added for GI symptoms or fatigue after MTX dosing."}, {"stem": "Methotrexate dosing frequency in RA:", "options": [{"letter": "A", "text": "Every 2 weeks"}, {"letter": "B", "text": "Weekly"}, {"letter": "C", "text": "Daily"}, {"letter": "D", "text": "Monthly"}], "answer": "B", "explanation": "MTX is given weekly with folic acid daily."}]}}, {"id": "5", "group": 5, "section": "RA clinical presentation", "topic": "Rheumatoid arthritis — extra-articular disease", "skill": "Complications", "stem": "Painful red eye in a patient with RA that can progress to scleral perforation → Diagnosis:", "options": [{"letter": "A", "text": "Scleritis"}, {"letter": "B", "text": "Keratitis"}, {"letter": "C", "text": "Episcleritis"}, {"letter": "D", "text": "Anterior uveitis"}, {"letter": "E", "text": "Keratoconjunctivitis sicca"}], "answer": "A", "explanation": "**Scleritis** is the sight-threatening RA eye complication (risk of perforation) — not benign episcleritis; keratitis instead causes corneal melt.", "objective": "", "remediation": {"steps": [{"teach": "RA eye disease ranges from dry eyes (10–15%) and mild superficial **episcleritis** to deeper inflammation that threatens the globe.", "stem": "Which RA eye finding is benign and superficial?", "options": [{"letter": "A", "text": "Scleritis"}, {"letter": "B", "text": "Episcleritis"}], "answer": "B", "explanation": "Episcleritis is benign; scleritis is not."}, {"teach": "Keratitis in RA causes **corneal melt**; inflammation of the scleral wall itself threatens **perforation**.", "stem": "Corneal melt is a complication of which RA eye process?", "options": [{"letter": "A", "text": "Scleritis"}, {"letter": "B", "text": "Keratitis"}, {"letter": "C", "text": "Dry eyes"}], "answer": "B", "explanation": "Keratitis → corneal melt; scleritis → scleral perforation."}, {"teach": "A painful red eye with perforation risk should be recognized as inflammation of the sclera itself.", "stem": "RA + painful red eye with perforation risk →", "options": [{"letter": "A", "text": "Uveitis"}, {"letter": "B", "text": "Episcleritis"}, {"letter": "C", "text": "Dry eyes"}, {"letter": "D", "text": "Scleritis"}], "answer": "D", "explanation": "Scleritis, not benign episcleritis."}], "checkpoints": [{"stem": "Which RA eye complication produces corneal melt?", "options": [{"letter": "A", "text": "Keratitis"}, {"letter": "B", "text": "Episcleritis"}, {"letter": "C", "text": "Scleritis"}, {"letter": "D", "text": "Dry eyes"}], "answer": "A", "explanation": "Keratitis → corneal melt."}, {"stem": "Dry eyes occur in roughly what share of RA patients?", "options": [{"letter": "A", "text": "50%"}, {"letter": "B", "text": "10–15%"}, {"letter": "C", "text": "90%"}, {"letter": "D", "text": "1%"}], "answer": "B", "explanation": "Dry eyes affect 10–15%."}]}}, {"id": "6", "group": 6, "section": "DMARD monitoring", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Diagnostics & imaging", "multi": true, "stem": "Which of the following are part of the baseline workup before starting methotrexate?", "options": [{"letter": "A", "text": "Chest X-ray"}, {"letter": "B", "text": "Retinal examination"}, {"letter": "C", "text": "Complete blood count"}, {"letter": "D", "text": "Hepatitis screen"}, {"letter": "E", "text": "TB test (Quantiferon)"}], "answers": ["A", "C", "D"], "explanation": "MTX baseline = **CXR, CBC, CMP, hepatitis screen**, then CBC/CMP at 4 weeks and every 2–3 months. Retinal exams belong to hydroxychloroquine; TB screening belongs to biologics.", "objective": "", "remediation": {"steps": [{"teach": "Methotrexate threatens the **liver and bone marrow**, so the baseline includes blood counts, a metabolic panel and viral hepatitis screening.", "stem": "Which lab pair is repeated at 4 weeks and then every 2–3 months on methotrexate?", "options": [{"letter": "A", "text": "RF and anti-CCP"}, {"letter": "B", "text": "ESR and CRP"}, {"letter": "C", "text": "CBC and CMP"}], "answer": "C", "explanation": "CBC/CMP at 4 weeks, then every 2–3 months.", "clarify": [{"stem": "Hepatitis screening before methotrexate is done because the drug is:", "options": [{"letter": "A", "text": "Nephrotoxic"}, {"letter": "B", "text": "Hepatotoxic"}], "answer": "B", "explanation": "Liver risk drives hepatitis screening and CMP monitoring."}]}, {"teach": "A baseline chest film screens the lungs; a retinal exam is the monitoring requirement for a different csDMARD.", "stem": "Which DMARD requires a retinal exam at baseline and annually?", "options": [{"letter": "A", "text": "Sulfasalazine"}, {"letter": "B", "text": "Hydroxychloroquine"}, {"letter": "C", "text": "Methotrexate"}], "answer": "B", "explanation": "Hydroxychloroquine → retinal exam baseline + annually."}, {"teach": "TB screening (PPD/Quantiferon) is required before **biologics** because of reactivation risk, not before methotrexate.", "stem": "TB screening is mandatory before starting which class?", "options": [{"letter": "A", "text": "TNF blockers"}, {"letter": "B", "text": "NSAIDs"}, {"letter": "C", "text": "Methotrexate"}], "answer": "A", "explanation": "Biologics carry TB reactivation risk → PPD/Quantiferon first."}], "checkpoints": [{"stem": "After the 4-week check, how often are CBC/CMP repeated on methotrexate?", "options": [{"letter": "A", "text": "Weekly"}, {"letter": "B", "text": "Every 6–12 months"}, {"letter": "C", "text": "Annually"}, {"letter": "D", "text": "Every 2–3 months"}], "answer": "D", "explanation": "MTX: CBC/CMP at 4 weeks, then q2–3 months."}, {"stem": "Sulfasalazine CBC/CMP monitoring interval:", "options": [{"letter": "A", "text": "Every 3–6 months"}, {"letter": "B", "text": "Not required"}, {"letter": "C", "text": "Weekly"}, {"letter": "D", "text": "Annually"}], "answer": "A", "explanation": "Sulfasalazine: CBC/CMP q3–6 months."}]}, "answer": "A,C,D"}, {"id": "7", "group": 7, "section": "RA acute flare vs chronic disease", "topic": "Rheumatoid arthritis — flare vs chronic disease", "skill": "Management", "stem": "A deformed RA hand with ulnar deviation but cool, non-tender joints and a low joint count → Best interpretation:", "options": [{"letter": "A", "text": "Active flare needing more immunosuppression"}, {"letter": "B", "text": "Burned-out structural damage"}, {"letter": "C", "text": "Septic arthritis until proven otherwise"}, {"letter": "D", "text": "Early RA requiring hand X-rays"}, {"letter": "E", "text": "Psoriatic arthritis rather than RA"}], "answer": "B", "explanation": "Fixed deformities with cool, non-tender joints are **burned-out structural damage, not a flare** — escalating immunosuppression will not reverse them.", "objective": "", "remediation": {"steps": [{"teach": "An active flare is **hot, red, swollen, tender** with prolonged morning stiffness, flexor tenosynovitis, systemic symptoms and elevated ESR/CRP.", "stem": "Which lab pattern accompanies an active RA flare?", "options": [{"letter": "A", "text": "Elevated ESR/CRP"}, {"letter": "B", "text": "Normal ESR/CRP"}, {"letter": "C", "text": "Falling RF titer"}], "answer": "A", "explanation": "Active disease raises acute-phase reactants.", "clarify": [{"stem": "Inability to make a fist in the morning during a flare is due to:", "options": [{"letter": "A", "text": "Flexor tenosynovitis"}, {"letter": "B", "text": "Bony ankylosis"}], "answer": "A", "explanation": "Flexor tenosynovitis prevents full fist closure."}]}, {"teach": "Longstanding well-controlled RA may show essentially nothing or 'cool synovitis'; poorly controlled disease leaves **fixed deformities** and erosions on imaging.", "stem": "Fixed ulnar deviation and swan-neck deformities indicate:", "options": [{"letter": "A", "text": "An acute flare"}, {"letter": "B", "text": "Early RA"}, {"letter": "C", "text": "Longstanding poorly controlled disease"}], "answer": "C", "explanation": "Deformities are the legacy of chronic poorly controlled disease.", "clarify": [{"stem": "PIP hyperextension with DIP flexion is which deformity?", "options": [{"letter": "A", "text": "Swan-neck"}, {"letter": "B", "text": "Boutonnière"}], "answer": "A", "explanation": "Swan-neck = PIP hyperextension + DIP flexion; boutonnière is the reverse."}]}, {"teach": "Treatment decisions follow disease activity, not deformity: a cool, non-tender deformed hand will not improve with stronger drugs.", "stem": "Correct response to a cool, deformed, non-tender RA hand:", "options": [{"letter": "A", "text": "Give pulse IV steroids"}, {"letter": "B", "text": "Do not escalate immunosuppression for deformity alone"}, {"letter": "C", "text": "Start a TNF blocker"}], "answer": "B", "explanation": "Burned-out damage is structural; immunosuppression will not reverse it."}], "checkpoints": [{"stem": "A true flare in a patient already on methotrexate is managed with:", "options": [{"letter": "A", "text": "Joint-replacement surgery"}, {"letter": "B", "text": "Stopping all DMARDs"}, {"letter": "C", "text": "Long-term high-dose prednisone"}, {"letter": "D", "text": "Short-term prednisone while the DMARD is adjusted"}], "answer": "D", "explanation": "Flares: short-term prednisone bridge ± NSAIDs while DMARD therapy is started or adjusted."}, {"stem": "PIP flexion with DIP hyperextension →", "options": [{"letter": "A", "text": "Boutonnière"}, {"letter": "B", "text": "Ulnar deviation"}, {"letter": "C", "text": "Swan-neck"}, {"letter": "D", "text": "Hammer toe"}], "answer": "A", "explanation": "Boutonnière = PIP flexion + DIP hyperextension."}]}}, {"id": "8", "group": 8, "section": "RA pathophysiology", "topic": "Rheumatoid arthritis — pathophysiology & risk factors", "skill": "Disease process", "stem": "Which is the most important genetic risk factor for rheumatoid arthritis?", "options": [{"letter": "A", "text": "Complement C4 deficiency"}, {"letter": "B", "text": "HLA-B27"}, {"letter": "C", "text": "HLA-DR3"}, {"letter": "D", "text": "HLA-DR4 shared epitope"}, {"letter": "E", "text": "PADI gene deletion"}], "answer": "D", "explanation": "RA risk is ~60% genetic, dominated by **class II MHC — HLA-DR4 and the HLA-D shared epitope**, which binds citrullinated peptides to trigger T cells.", "objective": "", "remediation": {"steps": [{"teach": "Genetics account for **60%** of RA risk; >100 loci exist, but the dominant genes encode **class II MHC** molecules that present peptides to T cells.", "stem": "RA risk is split roughly how between genetics and environment?", "options": [{"letter": "A", "text": "60% genetic / 40% environmental"}, {"letter": "B", "text": "10% genetic / 90% environmental"}, {"letter": "C", "text": "90% genetic / 10% environmental"}], "answer": "A", "explanation": "Genetics ≈60%, environment ≈40%.", "clarify": [{"stem": "HLA-DR molecules are which class of MHC?", "options": [{"letter": "A", "text": "Class I"}, {"letter": "B", "text": "Class II"}], "answer": "B", "explanation": "HLA-DR = class II MHC."}]}, {"teach": "Citrulline (deaminated arginine, made by **PADI**) binds the shared epitope; **smoking** and *P. gingivalis* raise PADI activity.", "stem": "Which exposure increases PADI activity and citrullination?", "options": [{"letter": "A", "text": "Smoking"}, {"letter": "B", "text": "Sun exposure"}, {"letter": "C", "text": "Alcohol"}], "answer": "A", "explanation": "Smoking increases PADI activity → more citrullinated peptides.", "clarify": [{"stem": "Periodontal disease is an RA risk factor because P. gingivalis:", "options": [{"letter": "A", "text": "Carries HLA-DR4"}, {"letter": "B", "text": "Expresses PADI"}], "answer": "B", "explanation": "P. gingivalis expresses PADI, driving citrullination."}]}, {"teach": "The HLA molecule most tied to RA is a DR allele carrying the 'shared epitope'.", "stem": "Which HLA association is classic for RA?", "options": [{"letter": "A", "text": "HLA-DR3"}, {"letter": "B", "text": "HLA-DQ2"}, {"letter": "C", "text": "HLA-B27"}, {"letter": "D", "text": "HLA-DR4"}], "answer": "D", "explanation": "HLA-DR4 / shared epitope."}], "checkpoints": [{"stem": "Which occupational exposure is an environmental risk factor for RA?", "options": [{"letter": "A", "text": "Lead"}, {"letter": "B", "text": "Silica dust"}, {"letter": "C", "text": "Cold temperatures"}, {"letter": "D", "text": "Asbestos"}], "answer": "B", "explanation": "Silica dust (construction, mining, oil & gas) is a listed environmental risk."}, {"stem": "The key cytokines driving RA synovitis are:", "options": [{"letter": "A", "text": "IL-1, IL-6, TNF-α"}, {"letter": "B", "text": "IFN-γ alone"}, {"letter": "C", "text": "IL-10 and TGF-β"}, {"letter": "D", "text": "IL-4, IL-5, IL-13"}], "answer": "A", "explanation": "IL-1, IL-6 and TNF-α drive pannus formation and erosion."}]}}, {"id": "9", "group": 9, "section": "Juvenile idiopathic arthritis", "topic": "Juvenile idiopathic arthritis", "skill": "Counseling & prevention", "stem": "A child with oligoarticular JIA has a positive ANA. What is the required next step?", "options": [{"letter": "A", "text": "Repeat the ANA in 6 weeks"}, {"letter": "B", "text": "Start methotrexate"}, {"letter": "C", "text": "Order anti-dsDNA"}, {"letter": "D", "text": "Refer to ophthalmology"}, {"letter": "E", "text": "Refer to nephrology"}], "answer": "D", "explanation": "In oligoarticular JIA, **ANA positivity raises anterior uveitis risk → ophthalmology referral**; ANA is a prognostic marker, not a diagnostic test.", "objective": "", "remediation": {"steps": [{"teach": "Oligoarticular JIA (≤4 joints, mostly knees and hips) is the **most common** subtype; about **20%** develop anterior uveitis (photosensitivity, blurry vision, eye pain, red eye).", "stem": "Oligoarticular JIA involves how many joints?", "options": [{"letter": "A", "text": "Only 1"}, {"letter": "B", "text": "≤4"}, {"letter": "C", "text": "≥5"}], "answer": "B", "explanation": "Oligo = ≤4 joints; poly = ≥5.", "clarify": [{"stem": "The most common JIA subtype is:", "options": [{"letter": "A", "text": "Systemic"}, {"letter": "B", "text": "Oligoarticular"}], "answer": "B", "explanation": "Oligoarticular is most common; polyarticular is second."}]}, {"teach": "In JIA, ANA does not confirm the diagnosis; it is a **prognostic marker** for eye disease.", "stem": "The role of ANA in JIA is:", "options": [{"letter": "A", "text": "Prognostic marker for uveitis risk"}, {"letter": "B", "text": "Marker of MAS"}, {"letter": "C", "text": "Diagnostic confirmation"}], "answer": "A", "explanation": "ANA is not diagnostic; positive ANA ↑ eye risk."}, {"teach": "Because uveitis can be silent and sight-threatening, the ANA-positive child is sent to the specialist who screens the eyes.", "stem": "ANA-positive oligoarticular JIA → referral to:", "options": [{"letter": "A", "text": "Cardiology"}, {"letter": "B", "text": "Nephrology"}, {"letter": "C", "text": "Ophthalmology"}, {"letter": "D", "text": "Dermatology"}], "answer": "C", "explanation": "Refer ANA+ OJIA to ophthalmology for uveitis screening."}], "checkpoints": [{"stem": "Which symptom cluster suggests anterior uveitis in a child with JIA?", "options": [{"letter": "A", "text": "Photosensitivity, blurry vision, eye pain, red eye"}, {"letter": "B", "text": "Hoarseness and stridor"}, {"letter": "C", "text": "Low-back morning stiffness"}, {"letter": "D", "text": "Fever and salmon-colored rash"}], "answer": "A", "explanation": "Uveitis: photosensitivity, blurry vision, eye pain, red eye."}, {"stem": "Which joints are most often involved in oligoarticular JIA?", "options": [{"letter": "A", "text": "Knees and hips"}, {"letter": "B", "text": "MCPs and wrists"}, {"letter": "C", "text": "DIP joints"}, {"letter": "D", "text": "Spine and SI joints"}], "answer": "A", "explanation": "Oligoarticular JIA mostly affects knees and hips."}]}}, {"id": "10", "group": 10, "section": "DMARD monitoring", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Diagnostics & imaging", "multi": true, "stem": "Which of the following must be completed before starting a TNF blocker?", "options": [{"letter": "A", "text": "TB screening (PPD or Quantiferon)"}, {"letter": "B", "text": "Retinal examination"}, {"letter": "C", "text": "Hepatitis B and C screening"}, {"letter": "D", "text": "Shingrix vaccination"}, {"letter": "E", "text": "HIV test"}], "answers": ["A", "C", "E"], "explanation": "Biologic baseline = **CXR, hepatitis B & C, TB screening (PPD/Quantiferon), HIV, CBC, CMP, UA**; Quantiferon and hepatitis are repeated yearly. Retinal exams are for hydroxychloroquine; Shingrix precedes JAK inhibitors.", "objective": "", "remediation": {"steps": [{"teach": "TNF blockers weaken the immunity that contains granulomas, so latent **tuberculosis** can reactivate.", "stem": "Why is a PPD or Quantiferon required before TNF blockers?", "options": [{"letter": "A", "text": "Risk of retinal toxicity"}, {"letter": "B", "text": "Risk of zoster"}, {"letter": "C", "text": "Risk of TB reactivation"}], "answer": "C", "explanation": "TNF blockade → TB reactivation; screen first.", "clarify": [{"stem": "TB screening while on a biologic is repeated:", "options": [{"letter": "A", "text": "Never"}, {"letter": "B", "text": "Yearly"}], "answer": "B", "explanation": "Quantiferon and hepatitis are rechecked annually."}]}, {"teach": "Chronic viral infections — **hepatitis B/C and HIV** — can flare or progress under biologic immunosuppression, so they are screened at baseline along with CXR, CBC, CMP and UA.", "stem": "Which viral screens are baseline for biologics?", "options": [{"letter": "A", "text": "EBV and CMV"}, {"letter": "B", "text": "Parvovirus and mycoplasma"}, {"letter": "C", "text": "Hepatitis B/C and HIV"}], "answer": "C", "explanation": "Hepatitis B & C and HIV are part of the biologic baseline."}, {"teach": "The two wrong items belong to other drugs: an eye exam is for hydroxychloroquine, and the zoster vaccine is for **JAK inhibitors**.", "stem": "Shingrix before therapy is specifically required for:", "options": [{"letter": "A", "text": "TNF blockers"}, {"letter": "B", "text": "Methotrexate"}, {"letter": "C", "text": "JAK inhibitors"}], "answer": "C", "explanation": "JAK inhibitors reactivate zoster → Shingrix first.", "clarify": [{"stem": "Retinal exam monitoring applies to:", "options": [{"letter": "A", "text": "Adalimumab"}, {"letter": "B", "text": "Hydroxychloroquine"}], "answer": "B", "explanation": "Hydroxychloroquine → retinal exam baseline and annually."}]}], "checkpoints": [{"stem": "Which RA drug class carries a risk of MS activation?", "options": [{"letter": "A", "text": "JAK inhibitors"}, {"letter": "B", "text": "TNF blockers"}, {"letter": "C", "text": "IL-6 blockers"}, {"letter": "D", "text": "Hydroxychloroquine"}], "answer": "B", "explanation": "TNF blockers can activate MS; avoid in MS patients."}, {"stem": "How often are CBC/CMP checked while on a biologic?", "options": [{"letter": "A", "text": "Only at baseline"}, {"letter": "B", "text": "Every 3–6 months"}, {"letter": "C", "text": "Weekly"}, {"letter": "D", "text": "Every 2 weeks"}], "answer": "B", "explanation": "Biologics: CBC/CMP q3–6 months."}]}, "answer": "A,C,E"}, {"id": "11", "group": 11, "section": "RA joints affected", "topic": "Rheumatoid arthritis — joints affected", "skill": "Identification", "stem": "Involvement of the DIP joints in hand arthritis points away from RA and toward which diagnoses?", "options": [{"letter": "A", "text": "Ankylosing spondylitis or JIA"}, {"letter": "B", "text": "Osteoarthritis or psoriatic arthritis"}, {"letter": "C", "text": "Systemic lupus or scleroderma"}, {"letter": "D", "text": "Septic arthritis or reactive arthritis"}, {"letter": "E", "text": "Gout or pseudogout"}], "answer": "B", "explanation": "RA **spares the DIP joints**; DIP involvement suggests **OA or psoriatic arthritis** instead.", "objective": "", "remediation": {"steps": [{"teach": "RA favors the **small joints of the hands and feet** symmetrically — MCP, PIP, MTP, and bilateral wrists.", "stem": "Which hand joints does RA typically involve?", "options": [{"letter": "A", "text": "1st CMC only"}, {"letter": "B", "text": "DIP only"}, {"letter": "C", "text": "MCP and PIP"}], "answer": "C", "explanation": "MCP and PIP joints plus wrists are the RA pattern."}, {"teach": "One row of finger joints is characteristically spared in RA; its involvement should change the differential.", "stem": "Which finger joint row does RA spare?", "options": [{"letter": "A", "text": "DIP"}, {"letter": "B", "text": "PIP"}, {"letter": "C", "text": "MCP"}], "answer": "A", "explanation": "RA spares the DIP joints."}, {"teach": "DIP disease belongs to the degenerative and psoriatic patterns.", "stem": "DIP involvement → think:", "options": [{"letter": "A", "text": "RA"}, {"letter": "B", "text": "SLE"}, {"letter": "C", "text": "OA or psoriatic arthritis"}, {"letter": "D", "text": "Gout"}], "answer": "C", "explanation": "DIP involvement points to OA or PsA."}], "checkpoints": [{"stem": "Which foot joints are classically involved in RA?", "options": [{"letter": "A", "text": "MTP joints"}, {"letter": "B", "text": "Subtalar joints"}, {"letter": "C", "text": "Interphalangeal joints of the toes only"}, {"letter": "D", "text": "Ankles only"}], "answer": "A", "explanation": "MTP joints of the feet are classic RA sites."}, {"stem": "Which joints are excluded from the 2010 ACR/EULAR joint count?", "options": [{"letter": "A", "text": "1st CMC, DIP, 1st MTP"}, {"letter": "B", "text": "Knee, hip, shoulder"}, {"letter": "C", "text": "MCP, PIP, wrist"}, {"letter": "D", "text": "Elbow, ankle, TMJ"}], "answer": "A", "explanation": "1st CMC, DIP and 1st MTP are excluded from the count."}]}}, {"id": "12", "group": 12, "section": "DMARD counseling", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Counseling & prevention", "stem": "Which DMARD should be avoided in a woman who wishes to become pregnant because it persists in the body for up to 2 years?", "options": [{"letter": "A", "text": "Sulfasalazine"}, {"letter": "B", "text": "Leflunomide"}, {"letter": "C", "text": "Hydroxychloroquine"}, {"letter": "D", "text": "Etanercept"}, {"letter": "E", "text": "Tocilizumab"}], "answer": "B", "explanation": "**Leflunomide stays in the body up to 2 years**, so it is avoided when pregnancy is desired; methotrexate is also teratogenic but does not persist that long.", "objective": "", "remediation": {"steps": [{"teach": "Leflunomide blocks pyrimidine synthesis and is antiproliferative, so it is unsafe in pregnancy; its distinguishing feature is **how long it lingers**.", "stem": "Leflunomide can persist in the body for up to:", "options": [{"letter": "A", "text": "2 days"}, {"letter": "B", "text": "2 weeks"}, {"letter": "C", "text": "2 years"}], "answer": "C", "explanation": "Leflunomide persists up to 2 years."}, {"teach": "Methotrexate is also **teratogenic**, but the drug whose washout takes years is the one singled out for women planning pregnancy.", "stem": "Which other csDMARD is explicitly teratogenic?", "options": [{"letter": "A", "text": "Methotrexate"}, {"letter": "B", "text": "Sulfasalazine"}], "answer": "A", "explanation": "Methotrexate is teratogenic; leflunomide is the one with a 2-year persistence."}, {"teach": "Pre-pregnancy counseling in RA focuses on the agent with the 2-year washout.", "stem": "Woman planning pregnancy — which DMARD to avoid?", "options": [{"letter": "A", "text": "Hydroxychloroquine"}, {"letter": "B", "text": "Sulfasalazine"}, {"letter": "C", "text": "Etanercept"}, {"letter": "D", "text": "Leflunomide"}], "answer": "D", "explanation": "Leflunomide (persists ≈2 years)."}], "checkpoints": [{"stem": "Leflunomide monitoring: CBC/CMP at 4 weeks and then:", "options": [{"letter": "A", "text": "Annually"}, {"letter": "B", "text": "Every 3 months"}, {"letter": "C", "text": "Only if symptomatic"}, {"letter": "D", "text": "Weekly"}], "answer": "B", "explanation": "Leflunomide: hepatitis screen, CBC, CMP; CBC/CMP at 4 weeks then q3 months."}, {"stem": "Common side effects of sulfasalazine include:", "options": [{"letter": "A", "text": "Zoster reactivation"}, {"letter": "B", "text": "GI perforation"}, {"letter": "C", "text": "Retinal toxicity"}, {"letter": "D", "text": "Rash, GI upset, fatigue"}], "answer": "D", "explanation": "Sulfasalazine: rash, GI upset, fatigue."}]}}, {"id": "13", "group": 13, "section": "RA diagnosis", "topic": "Rheumatoid arthritis — diagnosis & serology", "skill": "Diagnostics & imaging", "stem": "Under the 2010 ACR/EULAR classification criteria, what total score classifies a patient as having definite RA?", "options": [{"letter": "A", "text": "≥10 points"}, {"letter": "B", "text": "≥3 points"}, {"letter": "C", "text": "≥4 points"}, {"letter": "D", "text": "≥8 points"}, {"letter": "E", "text": "≥6 points"}], "answer": "E", "explanation": "**≥6 of 10 points = RA**, scored from joint count, serology, acute-phase reactants, and ≥6-week duration; requires ≥1 joint with definite synovitis not better explained.", "objective": "", "remediation": {"steps": [{"teach": "The criteria score four domains: **joint involvement, serology, CRP/ESR, and symptom duration**.", "stem": "Which domain can contribute the most points (up to 5)?", "options": [{"letter": "A", "text": "Abnormal CRP/ESR"}, {"letter": "B", "text": "Symptom duration"}, {"letter": "C", "text": "Joint involvement (>10 small joints)"}], "answer": "C", "explanation": ">10 small joints = 5 points; CRP/ESR and duration give 1 each.", "clarify": [{"stem": "Abnormal CRP or ESR contributes how many points?", "options": [{"letter": "A", "text": "3"}, {"letter": "B", "text": "1"}], "answer": "B", "explanation": "CRP/ESR abnormal = 1 point."}]}, {"teach": "Serology scores by titer: low-positive RF/CCP (≤3× ULN) scores 2, while **high-titer (>3× ULN) scores 3**.", "stem": "A high-titer anti-CCP (>3× ULN) scores:", "options": [{"letter": "A", "text": "2 points"}, {"letter": "B", "text": "3 points"}, {"letter": "C", "text": "5 points"}], "answer": "B", "explanation": "High RF/CCP (>3× ULN) = 3 points; low = 2.", "clarify": [{"stem": "Symptom duration ≥6 weeks scores:", "options": [{"letter": "A", "text": "1 point"}, {"letter": "B", "text": "2 points"}], "answer": "A", "explanation": "Duration ≥6 weeks = 1 point."}]}, {"teach": "Points are summed against a threshold that classifies RA.", "stem": "The classification threshold for RA is:", "options": [{"letter": "A", "text": "≥4 points"}, {"letter": "B", "text": "≥6 points"}, {"letter": "C", "text": "≥8 points"}], "answer": "B", "explanation": "≥6 points = RA."}], "checkpoints": [{"stem": "Which joints are excluded from the ACR/EULAR joint count?", "options": [{"letter": "A", "text": "Wrists"}, {"letter": "B", "text": "2nd–5th MCP"}, {"letter": "C", "text": "Knees"}, {"letter": "D", "text": "1st CMC, DIP, 1st MTP"}], "answer": "D", "explanation": "1st CMC, DIP and 1st MTP are excluded."}, {"stem": "What is the entry requirement before the criteria are scored?", "options": [{"letter": "A", "text": "≥1 joint with definite synovitis not better explained"}, {"letter": "B", "text": "Morning stiffness lasting more than 1 hour"}, {"letter": "C", "text": "Erosions present on hand radiographs"}, {"letter": "D", "text": "Positive RF and anti-CCP on two occasions"}], "answer": "A", "explanation": "Requires ≥1 joint with definite synovitis not better explained by another disease."}]}}, {"id": "14", "group": 14, "section": "Second-line agents", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Pharmacology", "stem": "Which class of second-line RA agents is taken orally, acts intracellularly, and has efficacy equal to biologics?", "options": [{"letter": "A", "text": "JAK inhibitors"}, {"letter": "B", "text": "IL-6 blockers"}, {"letter": "C", "text": "T-cell co-stimulation modulators"}, {"letter": "D", "text": "TNF blockers"}, {"letter": "E", "text": "Conventional synthetic DMARDs"}], "answer": "A", "explanation": "**JAK inhibitors (tofacitinib, baricitinib, upadacitinib)** are oral tsDMARDs acting intracellularly on JAK1/2/3 with **equal efficacy to biologics**; biologics are parenteral proteins with extracellular targets.", "objective": "", "remediation": {"steps": [{"teach": "Biologic DMARDs are **protein agents with extracellular targets**, given **parenterally** (suffixes -mab, -cept, -ra, -kin).", "stem": "Biologic DMARDs are administered:", "options": [{"letter": "A", "text": "Parenterally"}, {"letter": "B", "text": "Orally"}], "answer": "A", "explanation": "Biologics are proteins → parenteral.", "clarify": [{"stem": "The suffix -cept denotes:", "options": [{"letter": "A", "text": "A receptor-based agent"}, {"letter": "B", "text": "An interleukin"}], "answer": "A", "explanation": "-cept = receptor-based (etanercept, abatacept); -kin = interleukin."}]}, {"teach": "Targeted synthetic DMARDs are small molecules — oral **-inibs** — that enter the cell to block kinase signaling.", "stem": "Drug names ending in -inib belong to which class?", "options": [{"letter": "A", "text": "IL-1 blockers"}, {"letter": "B", "text": "JAK inhibitors"}, {"letter": "C", "text": "TNF blockers"}], "answer": "B", "explanation": "Tofacitinib, baricitinib, upadacitinib are JAK inhibitors."}, {"teach": "Despite being pills, this class matches biologic efficacy.", "stem": "Oral, intracellular, equal efficacy to biologics →", "options": [{"letter": "A", "text": "Hydroxychloroquine"}, {"letter": "B", "text": "Rituximab"}, {"letter": "C", "text": "Abatacept"}, {"letter": "D", "text": "JAK inhibitors"}], "answer": "D", "explanation": "JAK inhibitors = tsDMARDs, oral, equal to biologics."}], "checkpoints": [{"stem": "Which drugs are JAK inhibitors?", "options": [{"letter": "A", "text": "Tofacitinib, baricitinib, upadacitinib"}, {"letter": "B", "text": "Tocilizumab, sarilumab, anakinra"}, {"letter": "C", "text": "Infliximab, adalimumab, etanercept"}, {"letter": "D", "text": "Abatacept, rituximab, leflunomide"}], "answer": "A", "explanation": "The -inibs are the JAK inhibitors."}, {"stem": "Which concern is specific to JAK inhibitors rather than TNF blockers?", "options": [{"letter": "A", "text": "TB reactivation"}, {"letter": "B", "text": "MS flare"}, {"letter": "C", "text": "COPD exacerbation"}, {"letter": "D", "text": "Zoster reactivation and thrombosis"}], "answer": "D", "explanation": "JAK inhibitors: zoster, clots, lipids, LFTs, leukopenia."}]}}, {"id": "14A", "group": 14, "section": "Second-line agents", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Counseling & prevention", "stem": "Before starting a JAK inhibitor, which intervention is required?", "options": [{"letter": "A", "text": "Echocardiogram"}, {"letter": "B", "text": "Bone density scan"}, {"letter": "C", "text": "Shingrix vaccination"}, {"letter": "D", "text": "Pulmonary function tests"}, {"letter": "E", "text": "Retinal examination"}], "answer": "C", "explanation": "JAK inhibitors cause **zoster reactivation → give Shingrix before starting**; other concerns are thrombosis at higher dose, hepatotoxicity, hyperlipidemia, and leukopenia.", "objective": "", "remediation": {"steps": [{"teach": "The signature infectious risk of JAK inhibitors is reactivation of **herpes zoster**.", "stem": "Which infection is reactivated by JAK inhibitors?", "options": [{"letter": "A", "text": "Herpes zoster"}, {"letter": "B", "text": "Tuberculosis"}, {"letter": "C", "text": "Hepatitis B"}], "answer": "A", "explanation": "Zoster reactivation is the JAK-inhibitor concern; TB is the TNF-blocker concern."}, {"teach": "That risk is mitigated with a vaccine given **before** therapy begins.", "stem": "Which vaccine is given before a JAK inhibitor?", "options": [{"letter": "A", "text": "MMR"}, {"letter": "B", "text": "Shingrix"}, {"letter": "C", "text": "Pneumovax"}, {"letter": "D", "text": "Hepatitis B vaccine"}], "answer": "B", "explanation": "Shingrix first, then the JAK inhibitor."}], "checkpoints": [{"stem": "Which non-infectious JAK-inhibitor risk is dose-related?", "options": [{"letter": "A", "text": "Scleral perforation"}, {"letter": "B", "text": "Retinal toxicity"}, {"letter": "C", "text": "Nephrotoxicity"}, {"letter": "D", "text": "Thrombotic events"}], "answer": "D", "explanation": "Thrombosis occurs at higher JAK-inhibitor doses."}, {"stem": "Which lab abnormalities are known JAK-inhibitor concerns?", "options": [{"letter": "A", "text": "Hypocalcemia"}, {"letter": "B", "text": "Hyperlipidemia and elevated LFTs"}, {"letter": "C", "text": "Hyperkalemia"}, {"letter": "D", "text": "Hypoglycemia"}], "answer": "B", "explanation": "JAK inhibitors: hyperlipidemia, hepatotoxicity, leukopenia."}]}}, {"id": "15", "group": 15, "section": "Juvenile idiopathic arthritis", "topic": "Juvenile idiopathic arthritis", "skill": "Identification", "multi": true, "stem": "Which of the following are features of systemic JIA (Still disease)?", "options": [{"letter": "A", "text": "Quotidian fever"}, {"letter": "B", "text": "Salmon-colored rash"}, {"letter": "C", "text": "Hepatosplenomegaly"}, {"letter": "D", "text": "Involvement of ≤4 joints"}, {"letter": "E", "text": "Positive ANA as the hallmark"}], "answers": ["A", "B", "C"], "explanation": "Systemic JIA = **many joints + fever, rash, lymphadenopathy, hepatosplenomegaly**; complication = MAS. ≤4 joints defines oligoarticular JIA, where a positive ANA marks uveitis risk.", "objective": "", "remediation": {"steps": [{"teach": "Systemic JIA involves **many joints** and is dominated by systemic signs: daily spiking fever, evanescent salmon rash, lymphadenopathy, enlarged liver and spleen.", "stem": "Systemic JIA typically involves:", "options": [{"letter": "A", "text": "Many joints"}, {"letter": "B", "text": "≤4 joints"}, {"letter": "C", "text": "Only the spine"}], "answer": "A", "explanation": "Still disease = many joints plus systemic features.", "clarify": [{"stem": "The fever pattern of Still disease is:", "options": [{"letter": "A", "text": "Continuous low-grade"}, {"letter": "B", "text": "Quotidian (daily spike)"}], "answer": "B", "explanation": "Quotidian fever with salmon rash is the Still pattern."}]}, {"teach": "Joint count defines the other subtypes: **≤4** = oligoarticular (most common), **≥5** = polyarticular (second most common).", "stem": "≥5 joints involved →", "options": [{"letter": "A", "text": "Polyarticular JIA"}, {"letter": "B", "text": "Oligoarticular JIA"}, {"letter": "C", "text": "Enthesitis-related JIA"}], "answer": "A", "explanation": "Polyarticular = ≥5 joints; oligoarticular = ≤4.", "clarify": [{"stem": "Polyarticular JIA children who are RF/CCP positive should be:", "options": [{"letter": "A", "text": "Treated more expeditiously"}, {"letter": "B", "text": "Observed without treatment"}], "answer": "A", "explanation": "RF/CCP-positive children are treated more expeditiously."}]}, {"teach": "ANA is a uveitis-risk marker in oligoarticular JIA — it is **not diagnostic** of any subtype and is not a hallmark of Still disease.", "stem": "A positive ANA in JIA indicates:", "options": [{"letter": "A", "text": "Impending MAS"}, {"letter": "B", "text": "Systemic JIA"}, {"letter": "C", "text": "Higher uveitis risk"}], "answer": "C", "explanation": "ANA = prognostic marker for uveitis, not diagnostic."}], "checkpoints": [{"stem": "The life-threatening complication of systemic JIA is:", "options": [{"letter": "A", "text": "Macrophage activation syndrome"}, {"letter": "B", "text": "Cricoarytenoid arthritis"}, {"letter": "C", "text": "Scleral perforation"}, {"letter": "D", "text": "Anterior uveitis"}], "answer": "A", "explanation": "Still disease → MAS."}, {"stem": "What proportion of psoriatic JIA patients have dactylitis?", "options": [{"letter": "A", "text": "Half"}, {"letter": "B", "text": "One third"}, {"letter": "C", "text": "Fewer than 5%"}, {"letter": "D", "text": "Nearly all"}], "answer": "B", "explanation": "1/3 have dactylitis; 50% have psoriatic skin/nail findings."}]}, "answer": "A,B,C"}, {"id": "16", "group": 16, "section": "Second-line agents", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Pharmacology", "stem": "In an RA patient who also has multiple sclerosis, which biologic class must be avoided?", "options": [{"letter": "A", "text": "T-cell co-stimulation modulators"}, {"letter": "B", "text": "IL-6 blockers"}, {"letter": "C", "text": "Anti-B-cell therapy"}, {"letter": "D", "text": "TNF blockers"}, {"letter": "E", "text": "IL-1 blockers"}], "answer": "D", "explanation": "**TNF blockers can activate MS** — avoid them in patients with MS. Other class-specific concerns: abatacept → COPD exacerbation, IL-6 blockers → GI perforation, rituximab → no antibody response.", "objective": "", "remediation": {"steps": [{"teach": "Every biologic class shares the risks of **infection, TB reactivation, lymphoma and cost**; each class then adds a signature concern.", "stem": "Which concern is shared across all biologics?", "options": [{"letter": "A", "text": "Hyperlipidemia"}, {"letter": "B", "text": "Retinal toxicity"}, {"letter": "C", "text": "Increased infection"}], "answer": "C", "explanation": "Infection and TB reactivation are shared biologic risks."}, {"teach": "Abatacept worsens **COPD**; IL-6 blockers risk **gastric perforation**; rituximab blunts **antibody responses**.", "stem": "Which biologic is linked to COPD exacerbation?", "options": [{"letter": "A", "text": "Rituximab"}, {"letter": "B", "text": "Abatacept"}, {"letter": "C", "text": "Tocilizumab"}], "answer": "B", "explanation": "Abatacept → COPD exacerbation.", "clarify": [{"stem": "Lack of antibody production is a concern with:", "options": [{"letter": "A", "text": "Etanercept"}, {"letter": "B", "text": "Rituximab"}], "answer": "B", "explanation": "Rituximab depletes B cells → no antibody response."}]}, {"teach": "The class whose signature concern is **activation of demyelinating disease** is the one to avoid in MS.", "stem": "Patient with MS needs a biologic — avoid:", "options": [{"letter": "A", "text": "Abatacept"}, {"letter": "B", "text": "TNF blockers"}, {"letter": "C", "text": "Rituximab"}, {"letter": "D", "text": "Anakinra"}], "answer": "B", "explanation": "TNF blockers → MS activation."}], "checkpoints": [{"stem": "Gastric/GI perforation is the signature danger of which biologics?", "options": [{"letter": "A", "text": "Anakinra"}, {"letter": "B", "text": "Abatacept"}, {"letter": "C", "text": "Infliximab and adalimumab"}, {"letter": "D", "text": "Tocilizumab and sarilumab"}], "answer": "D", "explanation": "IL-6 blockers → GI perforation."}, {"stem": "Which drugs are TNF blockers?", "options": [{"letter": "A", "text": "Rituximab, abatacept, leflunomide"}, {"letter": "B", "text": "Tofacitinib, baricitinib, upadacitinib"}, {"letter": "C", "text": "Infliximab, adalimumab, etanercept"}, {"letter": "D", "text": "Tocilizumab, sarilumab, anakinra"}], "answer": "C", "explanation": "TNF blockers: infliximab, adalimumab, etanercept, certolizumab, golimumab."}]}}, {"id": "17", "group": 17, "section": "RA diagnosis", "topic": "Rheumatoid arthritis — diagnosis & serology", "skill": "Diagnostics & imaging", "stem": "Which radiographic findings are expected in EARLY rheumatoid arthritis?", "options": [{"letter": "A", "text": "Osteophytes with subchondral sclerosis"}, {"letter": "B", "text": "Bilateral symmetric sacroiliitis"}, {"letter": "C", "text": "Periarticular osteopenia, marginal erosion"}, {"letter": "D", "text": "Linear chondrocalcinosis of cartilage"}, {"letter": "E", "text": "Joint-space loss with deformity and subluxation"}], "answer": "C", "explanation": "Early RA: **periarticular osteopenia and early marginal erosions**; late RA: joint-space loss, extensive erosions, deformity/subluxation. In 7-week disease, hand X-rays are often still normal.", "objective": "", "remediation": {"steps": [{"teach": "RA synovial **pannus** activates osteoclasts, which thin the bone next to the joint before eroding the joint margins.", "stem": "Osteoclast activation in RA causes:", "options": [{"letter": "A", "text": "Erosions and periarticular osteopenia"}, {"letter": "B", "text": "Chondrocalcinosis"}, {"letter": "C", "text": "Osteophytes"}], "answer": "A", "explanation": "Osteoclasts → erosions + periarticular osteopenia.", "clarify": [{"stem": "The proliferating synovium in RA is called:", "options": [{"letter": "A", "text": "Pannus"}, {"letter": "B", "text": "Tophus"}], "answer": "A", "explanation": "Pannus erodes cartilage and bone."}]}, {"teach": "Late disease shows joint-space loss, extensive erosions and deformity; very early disease may show **nothing yet**.", "stem": "In 7-week early RA, hand X-rays are expected to show:", "options": [{"letter": "A", "text": "Extensive erosions"}, {"letter": "B", "text": "Subluxation"}, {"letter": "C", "text": "No narrowing or erosion yet"}], "answer": "C", "explanation": "Lecture pitfall: 7-week disease is too early for narrowing and erosion."}, {"teach": "The earliest radiographic clues are bone thinning around the joint and small marginal erosions.", "stem": "Earliest X-ray findings of RA:", "options": [{"letter": "A", "text": "Osteophytes"}, {"letter": "B", "text": "Joint-space loss, subluxation"}, {"letter": "C", "text": "Sacroiliitis"}, {"letter": "D", "text": "Periarticular osteopenia, marginal erosion"}], "answer": "D", "explanation": "Early RA = periarticular osteopenia + early marginal erosion."}], "checkpoints": [{"stem": "Besides X-ray, which imaging modalities are listed for RA?", "options": [{"letter": "A", "text": "CT only"}, {"letter": "B", "text": "Ultrasound and MRI"}, {"letter": "C", "text": "DEXA"}, {"letter": "D", "text": "PET and bone scan"}], "answer": "B", "explanation": "Imaging: X-ray, ultrasound, MRI."}, {"stem": "Late RA radiographs show:", "options": [{"letter": "A", "text": "Periarticular osteopenia only"}, {"letter": "B", "text": "Joint-space loss, extensive erosions, subluxation"}, {"letter": "C", "text": "Normal films"}, {"letter": "D", "text": "Osteophytes and sclerosis"}], "answer": "B", "explanation": "Late RA: joint-space loss, extensive erosions, deformity/subluxation."}]}}, {"id": "18", "group": 18, "section": "RA clinical presentation", "topic": "Rheumatoid arthritis — extra-articular disease", "skill": "Complications", "stem": "RA + neutropenia + splenomegaly → Diagnosis:", "options": [{"letter": "A", "text": "Rheumatoid vasculitis"}, {"letter": "B", "text": "Macrophage activation syndrome"}, {"letter": "C", "text": "Felty syndrome"}, {"letter": "D", "text": "Large granular lymphocyte syndrome"}, {"letter": "E", "text": "Still disease"}], "answer": "C", "explanation": "**Felty syndrome = RA + neutropenia + splenomegaly**; other heme features of RA are anemia, LGL syndrome, and increased lymphoma risk.", "objective": "", "remediation": {"steps": [{"teach": "RA hematologic manifestations: **anemia**, a named triad with low neutrophils and a big spleen, LGL syndrome, and higher **lymphoma** risk.", "stem": "Which malignancy risk is increased in RA?", "options": [{"letter": "A", "text": "Lymphoma"}, {"letter": "B", "text": "Colon cancer"}, {"letter": "C", "text": "Melanoma"}], "answer": "A", "explanation": "RA increases lymphoma risk (as do TNF blockers)."}, {"teach": "The named triad combines RA with a specific cytopenia and an enlarged organ.", "stem": "The cytopenia in the RA triad is:", "options": [{"letter": "A", "text": "Thrombocytopenia"}, {"letter": "B", "text": "Neutropenia"}, {"letter": "C", "text": "Lymphopenia"}], "answer": "B", "explanation": "Neutropenia, with splenomegaly.", "clarify": [{"stem": "The enlarged organ in the triad is the:", "options": [{"letter": "A", "text": "Liver"}, {"letter": "B", "text": "Spleen"}], "answer": "B", "explanation": "Splenomegaly."}]}, {"teach": "Put together: RA, neutropenia, splenomegaly.", "stem": "RA + neutropenia + splenomegaly =", "options": [{"letter": "A", "text": "Still disease"}, {"letter": "B", "text": "Felty syndrome"}, {"letter": "C", "text": "MAS"}, {"letter": "D", "text": "Sjögren syndrome"}], "answer": "B", "explanation": "Felty syndrome."}], "checkpoints": [{"stem": "Systemic symptoms of RA include:", "options": [{"letter": "A", "text": "Weight gain and edema"}, {"letter": "B", "text": "High fever with rigors"}, {"letter": "C", "text": "Fatigue, low-grade fever, weight loss, anemia"}, {"letter": "D", "text": "Polyuria and polydipsia"}], "answer": "C", "explanation": "Fatigue, low-grade fever, myalgias, weight loss, anemia."}, {"stem": "Rheumatoid nodules are typically found on:", "options": [{"letter": "A", "text": "Flexor surfaces of the wrists"}, {"letter": "B", "text": "The palms"}, {"letter": "C", "text": "Extensor surfaces such as the elbows"}, {"letter": "D", "text": "The face"}], "answer": "C", "explanation": "Nodules on extensor surfaces (e.g., elbows)."}]}}, {"id": "19", "group": 19, "section": "Second-line agents", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Complications", "stem": "Gastric/GI perforation is the signature danger of which biologic class?", "options": [{"letter": "A", "text": "TNF blockers"}, {"letter": "B", "text": "IL-6 blockers"}, {"letter": "C", "text": "Anti-B-cell therapy"}, {"letter": "D", "text": "IL-1 blocker"}, {"letter": "E", "text": "T-cell co-stimulation modulator"}], "answer": "B", "explanation": "**IL-6 blockers (tocilizumab, sarilumab) → GI/gastric perforation**; abatacept → COPD exacerbation; rituximab → no antibody response; TNF blockers → TB reactivation and MS flare.", "objective": "", "remediation": {"steps": [{"teach": "Tocilizumab and sarilumab block the **IL-6** pathway; anakinra blocks IL-1.", "stem": "Tocilizumab blocks which cytokine?", "options": [{"letter": "A", "text": "IL-6"}, {"letter": "B", "text": "IL-1"}, {"letter": "C", "text": "TNF-α"}], "answer": "A", "explanation": "Tocilizumab and sarilumab are IL-6 blockers.", "clarify": [{"stem": "Anakinra blocks:", "options": [{"letter": "A", "text": "IL-6"}, {"letter": "B", "text": "IL-1"}], "answer": "B", "explanation": "Anakinra = IL-1 blocker."}]}, {"teach": "Match the concerns: COPD exacerbation → abatacept; no antibody response → rituximab; TB/MS → TNF blockers; **gut perforation** → the IL-6 class.", "stem": "Which agent is linked to COPD exacerbation?", "options": [{"letter": "A", "text": "Tocilizumab"}, {"letter": "B", "text": "Abatacept"}, {"letter": "C", "text": "Infliximab"}], "answer": "B", "explanation": "Abatacept → COPD exacerbation."}, {"teach": "The IL-6 blockers carry the GI perforation warning.", "stem": "GI perforation →", "options": [{"letter": "A", "text": "Anakinra"}, {"letter": "B", "text": "Rituximab"}, {"letter": "C", "text": "IL-6 blockers"}, {"letter": "D", "text": "TNF blockers"}], "answer": "C", "explanation": "Tocilizumab/sarilumab → gastric perforation."}], "checkpoints": [{"stem": "Which biologic blunts antibody production?", "options": [{"letter": "A", "text": "Rituximab"}, {"letter": "B", "text": "Anakinra"}, {"letter": "C", "text": "Abatacept"}, {"letter": "D", "text": "Etanercept"}], "answer": "A", "explanation": "Rituximab (anti-B cell) → lack of antibody production."}, {"stem": "The suffix -ra in a biologic name means:", "options": [{"letter": "A", "text": "Receptor antagonist"}, {"letter": "B", "text": "Receptor-based fusion protein"}, {"letter": "C", "text": "Interleukin"}, {"letter": "D", "text": "Monoclonal antibody"}], "answer": "A", "explanation": "-ra = receptor antagonist (anakinra); -mab antibody; -kin interleukin; -cept receptor-based."}]}}, {"id": "20", "group": 20, "section": "Second-line agents", "topic": "Rheumatoid arthritis — pharmacology", "skill": "Pharmacology", "multi": true, "stem": "Which of the following are recognized concerns with JAK inhibitors?", "options": [{"letter": "A", "text": "Zoster reactivation"}, {"letter": "B", "text": "Retinal toxicity"}, {"letter": "C", "text": "Thrombosis at higher doses"}, {"letter": "D", "text": "Gastric perforation"}, {"letter": "E", "text": "Hyperlipidemia"}], "answers": ["A", "C", "E"], "explanation": "JAK inhibitor concerns: **zoster reactivation (Shingrix first), thrombosis at higher dose, hepatotoxicity, hyperlipidemia, leukopenia**. Retinal toxicity is hydroxychloroquine; gastric perforation is IL-6 blockers.", "objective": "", "remediation": {"steps": [{"teach": "The infectious risk of JAK inhibitors is **herpes zoster**, addressed by vaccination before therapy.", "stem": "Which infection is reactivated by JAK inhibitors?", "options": [{"letter": "A", "text": "Zoster"}, {"letter": "B", "text": "Tuberculosis"}, {"letter": "C", "text": "Hepatitis C"}], "answer": "A", "explanation": "Zoster → give Shingrix first."}, {"teach": "Non-infectious risks are vascular and metabolic: **clots at higher doses**, raised lipids, raised LFTs, and low white cells.", "stem": "Which JAK-inhibitor risk is dose-related?", "options": [{"letter": "A", "text": "Zoster"}, {"letter": "B", "text": "Leukopenia"}, {"letter": "C", "text": "Thrombotic events"}], "answer": "C", "explanation": "Thrombosis occurs at higher doses.", "clarify": [{"stem": "JAK inhibitors can raise:", "options": [{"letter": "A", "text": "Blood glucose only"}, {"letter": "B", "text": "Lipids and LFTs"}], "answer": "B", "explanation": "Hyperlipidemia and hepatotoxicity are listed concerns."}]}, {"teach": "The two wrong options belong to other drugs: eye toxicity to hydroxychloroquine, gut perforation to IL-6 blockers.", "stem": "Retinal toxicity is the monitoring concern for:", "options": [{"letter": "A", "text": "Tofacitinib"}, {"letter": "B", "text": "Baricitinib"}, {"letter": "C", "text": "Hydroxychloroquine"}], "answer": "C", "explanation": "HCQ → retinal exam baseline and annually.", "clarify": [{"stem": "Gastric perforation is the concern with:", "options": [{"letter": "A", "text": "JAK inhibitors"}, {"letter": "B", "text": "IL-6 blockers"}], "answer": "B", "explanation": "Tocilizumab/sarilumab → GI perforation."}]}], "checkpoints": [{"stem": "Which lab is followed because JAK inhibitors cause leukopenia?", "options": [{"letter": "A", "text": "Lipid panel"}, {"letter": "B", "text": "Urinalysis"}, {"letter": "C", "text": "CBC"}, {"letter": "D", "text": "ESR"}], "answer": "C", "explanation": "Leukopenia is tracked on the CBC."}, {"stem": "Compared with biologics, JAK-inhibitor efficacy is:", "options": [{"letter": "A", "text": "Superior"}, {"letter": "B", "text": "Unknown"}, {"letter": "C", "text": "Inferior"}, {"letter": "D", "text": "Equal"}], "answer": "D", "explanation": "JAK inhibitors have equal efficacy to biologics."}]}, "answer": "A,C,E"}, {"id": "21", "group": 21, "section": "RA joints affected", "topic": "Rheumatoid arthritis — joints affected", "skill": "Identification", "multi": true, "stem": "Which joints are most frequently affected by rheumatoid arthritis?", "options": [{"letter": "A", "text": "MCP joints"}, {"letter": "B", "text": "DIP joints"}, {"letter": "C", "text": "MTP joints"}, {"letter": "D", "text": "PIP joints"}, {"letter": "E", "text": "Bilateral wrists"}], "answers": ["A", "C", "D", "E"], "explanation": "RA involves **MCP, PIP, MTP, and bilateral wrists** symmetrically; it **spares the DIP** (DIP involvement → OA or psoriatic arthritis).", "objective": "", "remediation": {"steps": [{"teach": "RA is
