<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,

//      steps: [{ teach?, stem, options, answer, explanation?,

to meet criteria?", "options": [{"letter": "A", "text": "SSS ≥5"}, {"letter": "B", "text": "SSS ≥9"}, {"letter": "C", "text": "SSS ≥3"}], "answer": "B", "explanation": "WPI 4–6 must be paired with SSS ≥9; WPI ≥7 only needs SSS ≥5.", "clarify": [{"stem": "A WPI of 7 or more needs an SSS of at least:", "options": [{"letter": "A", "text": "5"}, {"letter": "B", "text": "9"}], "answer": "A", "explanation": "WPI ≥7 + SSS ≥5 is the first pathway."}]}, {"teach": "Apply the rule: all three parts (score pathway, **4 of 5 regions**, **≥3 months**) must be met at once.", "stem": "WPI 5, SSS 7, 5 regions, 4 months — which element fails?", "options": [{"letter": "A", "text": "The SSS is too low for a WPI of 5"}, {"letter": "B", "text": "Too few regions"}, {"letter": "C", "text": "Duration too short"}], "answer": "A", "explanation": "Regions and duration pass; WPI 5 is in the 4–6 band and needs SSS ≥9, so SSS 7 fails."}], "checkpoints": [{"stem": "WPI 8, SSS 6, pain in 4 regions, 4 months → criteria status:", "options": [{"letter": "A", "text": "Meets — WPI ≥7 with SSS ≥5"}, {"letter": "B", "text": "Fails — SSS must be ≥9"}, {"letter": "C", "text": "Fails — needs 5 of 5 regions"}, {"letter": "D", "text": "Fails — needs ≥6 months"}], "answer": "A", "explanation": "WPI 8 is ≥7, so SSS ≥5 suffices; 4 of 5 regions and ≥3 months are met."}, {"stem": "Minimum symptom duration required by the 2016 ACR criteria:", "options": [{"letter": "A", "text": "6 weeks"}, {"letter": "B", "text": "3 months"}, {"letter": "C", "text": "6 months"}, {"letter": "D", "text": "12 months"}], "answer": "B", "explanation": "Symptoms must be present at a similar level for ≥3 months."}]}}, {"id": "2", "group": 2, "section": "Definition", "topic": "Definition and pathophysiology", "skill": "Disease process", "stem": "Fibromyalgia is best understood as a disorder of which process?", "options": [{"letter": "A", "text": "Autoimmune inflammation of the synovium"}, {"letter": "B", "text": "Peripheral nerve demyelination"}, {"letter": "C", "text": "Central pain perception and processing"}, {"letter": "D", "text": "Inflammatory necrosis of muscle fibers"}, {"letter": "E", "text": "Degenerative cartilage loss"}], "answer": "C", "explanation": "Fibromyalgia is **not inflammatory** — it is a disorder of **pain perception and processing** with amplification of pain signaling within the CNS.", "objective": "", "remediation": {"steps": [{"teach": "Fibromyalgia is defined by **widespread chronic pain, fatigue, disturbed sleep and mental fogginess** — the patient 'hurts all over, not anywhere specific'.", "stem": "Which feature is NOT part of the core definition of fibromyalgia?", "options": [{"letter": "A", "text": "Widespread chronic pain"}, {"letter": "B", "text": "Joint swelling and deformity"}, {"letter": "C", "text": "Disturbed sleep"}], "answer": "B", "explanation": "Joint swelling is absent; the core features are widespread pain, fatigue, poor sleep and fogginess.", "clarify": [{"stem": "On exam, fibromyalgia shows multiple tender points plus:", "options": [{"letter": "A", "text": "No joint swelling or deformity"}, {"letter": "B", "text": "Warm, swollen joints"}], "answer": "A", "explanation": "Tender points without synovitis is the pattern."}]}, {"teach": "Because it is not inflammatory, inflammatory markers stay **normal** — the problem is how the **nervous system amplifies** pain signals.", "stem": "Where does the pain amplification in fibromyalgia occur?", "options": [{"letter": "A", "text": "In the joint synovium"}, {"letter": "B", "text": "Within the central nervous system"}, {"letter": "C", "text": "In the muscle fibers"}], "answer": "B", "explanation": "Fibromyalgia is a disorder of central pain processing with CNS amplification of pain signaling."}], "checkpoints": [{"stem": "Because fibromyalgia is non-inflammatory, which lab pattern is expected?", "options": [{"letter": "A", "text": "Elevated ESR and CRP"}, {"letter": "B", "text": "Positive rheumatoid factor"}, {"letter": "C", "text": "Normal CBC, ESR/CRP and RF"}, {"letter": "D", "text": "Elevated creatine kinase"}], "answer": "C", "explanation": "All routine labs are normal; they are ordered only to exclude mimics."}]}}, {"id": "3", "group": 3, "section": "Pharmacologic agents", "topic": "FDA-approved drugs", "skill": "Pharmacology", "multi": true, "stem": "Which of the following medications are FDA-approved specifically for fibromyalgia?", "options": [{"letter": "A", "text": "Duloxetine (Cymbalta)"}, {"letter": "B", "text": "Milnacipran (Savella)"}, {"letter": "C", "text": "Gabapentin (Neurontin)"}, {"letter": "D", "text": "Pregabalin (Lyrica)"}, {"letter": "E", "text": "Amitriptyline (Elavil)"}], "answers": ["A", "B", "D"], "explanation": "The three FDA-approved agents are **duloxetine, milnacipran and pregabalin**. Gabapentin and amitriptyline are used off-label (gabapentin as an alternative anti-epileptic, amitriptyline as a bedtime sleep agent).", "objective": "", "remediation": {"steps": [{"teach": "Two of the approved drugs are **SNRIs**. The guide lists three SNRIs for fibromyalgia, but only two carry FDA approval.", "stem": "Which SNRI is used for fibromyalgia but is NOT FDA-approved for it?", "options": [{"letter": "A", "text": "Duloxetine"}, {"letter": "B", "text": "Venlafaxine"}, {"letter": "C", "text": "Milnacipran"}], "answer": "B", "explanation": "Venlafaxine (Effexor) is used off-label; duloxetine and milnacipran are FDA-approved.", "clarify": [{"stem": "Milnacipran's brand name is:", "options": [{"letter": "A", "text": "Savella"}, {"letter": "B", "text": "Cymbalta"}], "answer": "A", "explanation": "Savella = milnacipran; Cymbalta = duloxetine."}]}, {"teach": "The third approved drug is an **anti-epileptic**. The guide names two anti-epileptics, but only one is FDA-approved for fibromyalgia.", "stem": "Which anti-epileptic is FDA-approved for fibromyalgia?", "options": [{"letter": "A", "text": "Gabapentin"}, {"letter": "B", "text": "Pregabalin"}], "answer": "B", "explanation": "Pregabalin (Lyrica) is approved; gabapentin (Neurontin) is an off-label alternative."}, {"teach": "Amitriptyline appears in the guide under a different role — it is a **bedtime sleep adjunct**, not an FDA-approved fibromyalgia drug.", "stem": "Amitriptyline is used in fibromyalgia primarily to:", "options": [{"letter": "A", "text": "Correct sleep disruption at bedtime"}, {"letter": "B", "text": "Serve as an FDA-approved first-line agent"}, {"letter": "C", "text": "Reduce joint inflammation"}], "answer": "A", "explanation": "Low-dose amitriptyline qhs is a sleep adjunct alongside trazodone, tizanidine and cyclobenzaprine."}], "checkpoints": [{"stem": "Which drug class contains two of the three FDA-approved fibromyalgia agents?", "options": [{"letter": "A", "text": "SSRIs"}, {"letter": "B", "text": "SNRIs"}, {"letter": "C", "text": "Tricyclics"}, {"letter": "D", "text": "Anti-epileptics"}], "answer": "B", "explanation": "Duloxetine and milnacipran are SNRIs; pregabalin is the lone approved anti-epileptic."}, {"stem": "Which is NOT one of the three FDA-approved fibromyalgia drugs?", "options": [{"letter": "A", "text": "Pregabalin"}, {"letter": "B", "text": "Milnacipran"}, {"letter": "C", "text": "Duloxetine"}, {"letter": "D", "text": "Cyclobenzaprine"}], "answer": "D", "explanation": "Cyclobenzaprine is a bedtime sleep adjunct, not an FDA-approved fibromyalgia agent."}]}, "answer": "A,B,D"}, {"id": "4", "group": 4, "section": "Management", "topic": "Activity modification / exercise", "skill": "Management", "stem": "Single best therapeutic option for fibromyalgia → ", "options": [{"letter": "A", "text": "Low-dose daily prednisone"}, {"letter": "B", "text": "Weekly methotrexate"}, {"letter": "C", "text": "Graded aerobic exercise"}, {"letter": "D", "text": "Hydroxychloroquine therapy"}, {"letter": "E", "text": "Scheduled NSAIDs"}], "answer": "C", "explanation": "**Graded aerobic exercise** is the single best therapy; prednisone, methotrexate, HCQ and NSAIDs target inflammation, which is absent in fibromyalgia.", "objective": "", "remediation": {"steps": [{"teach": "Fibromyalgia is **not inflammatory**, so drugs that suppress inflammation or the immune system do not help.", "stem": "Why do prednisone and methotrexate fail in fibromyalgia?", "options": [{"letter": "A", "text": "The condition is non-inflammatory"}, {"letter": "B", "text": "They worsen sleep"}, {"letter": "C", "text": "They are contraindicated in women"}], "answer": "A", "explanation": "There is no inflammation to suppress; steroids and DMARDs do nothing for central pain amplification.", "clarify": [{"stem": "Chronic NSAIDs and steroids in fibromyalgia are:", "options": [{"letter": "A", "text": "Avoided — not inflammatory"}, {"letter": "B", "text": "First-line therapy"}], "answer": "A", "explanation": "The guide says to avoid chronic NSAIDs and steroids."}]}, {"teach": "The best treatment is **non-pharmacologic**: start slowly with an activity the patient gravitates toward — walking, bike, yoga, tai chi, water aerobics, Pilates — and 'get them moving'.", "stem": "How should exercise be introduced in fibromyalgia?", "options": [{"letter": "A", "text": "Start slowly and build gradually"}, {"letter": "B", "text": "Begin with high-intensity training"}, {"letter": "C", "text": "Restrict to bed rest during flares"}], "answer": "A", "explanation": "Graded means starting slowly and increasing over time.", "clarify": [{"stem": "Which is an appropriate starting activity listed in the guide?", "options": [{"letter": "A", "text": "Water aerobics"}, {"letter": "B", "text": "Prolonged bed rest"}], "answer": "A", "explanation": "Walking, exercise bike, yoga, tai chi, water aerobics and Pilates are all listed."}]}, {"teach": "Put it together: of all options, one **gradually increased aerobic program** is the single best therapy for fibromyalgia.", "stem": "The single best therapeutic option for fibromyalgia is:", "options": [{"letter": "A", "text": "Graded aerobic exercise"}, {"letter": "B", "text": "Hydroxychloroquine"}, {"letter": "C", "text": "Scheduled NSAIDs"}], "answer": "A", "explanation": "Graded aerobic exercise plus education is the best initial therapy."}], "checkpoints": [{"stem": "A patient asks which exercise type to choose. The guide's advice:", "options": [{"letter": "A", "text": "Only land-based running"}, {"letter": "B", "text": "Whatever the patient gravitates toward"}, {"letter": "C", "text": "Avoid exercise until pain resolves"}, {"letter": "D", "text": "Resistance training only"}], "answer": "B", "explanation": "Walking, bike, yoga, tai chi, water aerobics, Pilates — whatever gets them moving."}, {"stem": "Role of physical therapy in fibromyalgia:", "options": [{"letter": "A", "text": "Conditioning and pacing, avoiding passive-modality dependence"}, {"letter": "B", "text": "Joint immobilization"}, {"letter": "C", "text": "Daily passive massage as the primary therapy"}, {"letter": "D", "text": "Surgical referral for tender points"}], "answer": "A", "explanation": "PT and water therapy build conditioning and pacing; passive modalities should not become a dependence."}]}}, {"id": "5", "group": 5, "section": "Etiology", "topic": "Sleep disturbance (alpha-delta)", "skill": "Disease process", "stem": "The characteristic sleep abnormality described in fibromyalgia is:", "options": [{"letter": "A", "text": "REM sleep behavior disorder"}, {"letter": "B", "text": "Alpha-wave intrusion into deep sleep"}, {"letter": "C", "text": "Recurrent obstructive apneic episodes"}, {"letter": "D", "text": "Loss of all slow-wave sleep"}, {"letter": "E", "text": "Periodic limb movements of sleep"}], "answer": "B", "explanation": "Fibromyalgia shows **alpha-delta overlap** — alpha (wake-type) waves intrude into deep delta sleep, leaving the patient unrefreshed.", "objective": "", "remediation": {"steps": [{"teach": "Patients wake **unrefreshed** because the deep, restorative stage of sleep is disrupted by a faster brain-wave pattern normally seen when awake.", "stem": "Which brain wave normally characterizes deep, restorative sleep?", "options": [{"letter": "A", "text": "Delta"}, {"letter": "B", "text": "Alpha"}], "answer": "A", "explanation": "Delta waves = deep sleep; alpha waves are a wake-type rhythm."}, {"teach": "The fibromyalgia pattern is the wake rhythm **overlapping** with the deep-sleep rhythm — the name of the abnormality combines both wave types.", "stem": "The sleep abnormality in fibromyalgia is called:", "options": [{"letter": "A", "text": "Alpha-delta overlap"}, {"letter": "B", "text": "Theta-beta reversal"}, {"letter": "C", "text": "REM rebound"}], "answer": "A", "explanation": "Alpha intrusion into delta sleep = alpha-delta overlap."}], "checkpoints": [{"stem": "First step in the sleep-correction prong when a sleep disorder is suspected:", "options": [{"letter": "A", "text": "Start prednisone"}, {"letter": "B", "text": "Sleep study if appropriate, then correct the disorder"}, {"letter": "C", "text": "Prescribe chronic opioids"}, {"letter": "D", "text": "Order an MRI of the brain"}], "answer": "B", "explanation": "Obtain a sleep study if indicated and correct any identified sleep disorder."}]}}, {"id": "6", "group": 6, "section": "Pharmacologic agents", "topic": "Pregabalin counseling", "skill": "Pharmacology", "stem": "Adverse effect to counsel on when starting pregabalin for fibromyalgia →", "options": [{"letter": "A", "text": "Weight gain"}, {"letter": "B", "text": "Hepatotoxicity"}, {"letter": "C", "text": "GI bleeding"}, {"letter": "D", "text": "Hypertension"}, {"letter": "E", "text": "Retinal toxicity"}], "answer": "A", "explanation": "Pregabalin (Lyrica) causes **weight gain** and should be **tapered slowly** when stopped.", "objective": "", "remediation": {"steps": [{"teach": "Pregabalin is the **anti-epileptic** that is FDA-approved for fibromyalgia; its counseling points are a body-habitus change and a stopping rule.", "stem": "Pregabalin belongs to which drug class?", "options": [{"letter": "A", "text": "SNRI"}, {"letter": "B", "text": "Anti-epileptic"}, {"letter": "C", "text": "Opioid"}], "answer": "B", "explanation": "Pregabalin and gabapentin are the anti-epileptics used in fibromyalgia."}, {"teach": "Patients on this agent should be warned about a change on the **scale**, not the liver, gut or eyes.", "stem": "The hallmark side effect of pregabalin to counsel is:", "options": [{"letter": "A", "text": "Weight gain"}, {"letter": "B", "text": "Retinal toxicity"}, {"letter": "C", "text": "GI bleeding"}], "answer": "A", "explanation": "Weight gain is the pregabalin counseling point; taper when stopping."}], "checkpoints": [{"stem": "When discontinuing pregabalin in a fibromyalgia patient:", "options": [{"letter": "A", "text": "Stop abruptly"}, {"letter": "B", "text": "Taper slowly"}, {"letter": "C", "text": "Replace with prednisone"}, {"letter": "D", "text": "Check ESR first"}], "answer": "B", "explanation": "Both pregabalin and duloxetine should be tapered slowly rather than stopped abruptly."}]}}, {"id": "6A", "group": 6, "section": "Pharmacologic agents", "topic": "Duloxetine counseling", "skill": "Counseling & prevention", "stem": "Key counseling points for duloxetine in fibromyalgia include drowsiness, nausea/vomiting, and which instruction?", "options": [{"letter": "A", "text": "Taper slowly when stopping"}, {"letter": "B", "text": "Take only at bedtime"}, {"letter": "C", "text": "Monitor CBC every month on therapy"}, {"letter": "D", "text": "Avoid aerobic exercise"}, {"letter": "E", "text": "Pair with a daily NSAID for pain"}], "answer": "A", "explanation": "Duloxetine (Cymbalta) causes drowsiness and N/V and must be **tapered off slowly**; it is dosed daily, not just at bedtime.", "objective": "", "remediation": {"steps": [{"teach": "Duloxetine is an **SNRI**, FDA-approved for fibromyalgia, with drowsiness and nausea/vomiting as its main side effects.", "stem": "Duloxetine's brand name and class are:", "options": [{"letter": "A", "text": "Cymbalta — SNRI"}, {"letter": "B", "text": "Lyrica — anti-epileptic"}, {"letter": "C", "text": "Savella — SSRI"}], "answer": "A", "explanation": "Cymbalta = duloxetine, an SNRI. Savella is milnacipran (also SNRI); Lyrica is pregabalin."}, {"teach": "Like pregabalin, this SNRI has a rule for **how it is stopped**, not how it is monitored.", "stem": "The discontinuation instruction for duloxetine is:", "options": [{"letter": "A", "text": "Taper off slowly"}, {"letter": "B", "text": "Stop abruptly once pain improves"}], "answer": "A", "explanation": "Taper off slowly — the same rule applies to pregabalin."}], "checkpoints": [{"stem": "Which pair of side effects is attributed to duloxetine in the guide?", "options": [{"letter": "A", "text": "Weight gain and edema"}, {"letter": "B", "text": "Drowsiness and nausea/vomiting"}, {"letter": "C", "text": "Hepatotoxicity and rash"}, {"letter": "D", "text": "Hypertension and tremor"}], "answer": "B", "explanation": "Duloxetine: drowsiness and N/V; weight gain belongs to pregabalin."}]}}, {"id": "7", "group": 7, "section": "Associated conditions", "topic": "Associated conditions", "skill": "Identification", "multi": true, "stem": "Which of the following are conditions associated with fibromyalgia according to the lecture?", "options": [{"letter": "A", "text": "Irritable bowel syndrome"}, {"letter": "B", "text": "Symmetric joint swelling"}, {"letter": "C", "text": "TMJ dysfunction"}, {"letter": "D", "text": "Recurrent headaches"}, {"letter": "E", "text": "Elevated sed rate"}], "answers": ["A", "C", "D"], "explanation": "Associated conditions: anxiety/depression, recurrent headaches, **IBS**, tingling/numbness, chronic pelvic pain, **TMJ**. Joint swelling and an elevated ESR point away from fibromyalgia.", "objective": "", "remediation": {"steps": [{"teach": "Fibromyalgia travels with other **functional and psychiatric** conditions — gut, head, pelvis, jaw and mood — rather than with objective inflammatory findings.", "stem": "Which GI condition is associated with fibromyalgia?", "options": [{"letter": "A", "text": "Irritable bowel syndrome"}, {"letter": "B", "text": "Inflammatory bowel disease"}, {"letter": "C", "text": "Peptic ulcer disease"}], "answer": "A", "explanation": "IBS — a functional disorder — is the associated GI condition.", "clarify": [{"stem": "Which pelvic complaint is associated with fibromyalgia?", "options": [{"letter": "A", "text": "Chronic pelvic pain"}, {"letter": "B", "text": "Pelvic inflammatory disease"}], "answer": "A", "explanation": "Chronic pelvic pain is listed among the associated conditions."}]}, {"teach": "Head and jaw complaints are also part of the cluster: **recurrent headaches** and **TMJ** problems.", "stem": "Which jaw-related condition is associated with fibromyalgia?", "options": [{"letter": "A", "text": "TMJ dysfunction"}, {"letter": "B", "text": "Giant cell arteritis"}, {"letter": "C", "text": "Dental abscess"}], "answer": "A", "explanation": "TMJ is listed alongside recurrent headaches."}, {"teach": "Objective inflammatory signs are **absent** — their presence argues for a different diagnosis.", "stem": "Which finding argues AGAINST fibromyalgia?", "options": [{"letter": "A", "text": "Symmetric joint swelling"}, {"letter": "B", "text": "Tingling and numbness"}, {"letter": "C", "text": "Anxiety or depression"}], "answer": "A", "explanation": "Joint swelling (synovitis) and elevated ESR are not features; paresthesias and mood disorders are."}], "checkpoints": [{"stem": "Which psychiatric conditions commonly accompany fibromyalgia?", "options": [{"letter": "A", "text": "Schizophrenia and mania"}, {"letter": "B", "text": "Anxiety and depression"}, {"letter": "C", "text": "Anorexia and bulimia"}, {"letter": "D", "text": "Delirium and dementia"}], "answer": "B", "explanation": "Anxiety and depression are the associated psychiatric conditions, addressed with CBT-type psychotherapy."}, {"stem": "Which sensory complaint is listed as an associated feature?", "options": [{"letter": "A", "text": "Tingling and numbness"}, {"letter": "B", "text": "Sudden vision loss"}, {"letter": "C", "text": "Hearing loss"}, {"letter": "D", "text": "Loss of smell"}], "answer": "A", "explanation": "Paresthesias (tingling/numbness) are among the associated complaints."}]}, "answer": "A,C,D"}, {"id": "8", "group": 8, "section": "Diagnosis", "topic": "Role of laboratory testing", "skill": "Diagnostics & imaging", "stem": "Which statement correctly describes the role of labs (CBC, ESR, RF) in diagnosing fibromyalgia?", "options": [{"letter": "A", "text": "An elevated ESR confirms the diagnosis"}, {"letter": "B", "text": "A positive RF is required for diagnosis"}, {"letter": "C", "text": "Labs are normal; they exclude mimics"}, {"letter": "D", "text": "A positive ANA confirms the diagnosis"}, {"letter": "E", "text": "A high CK confirms the diagnosis"}], "answer": "C", "explanation": "The diagnosis is **clinical**; CBC, sed rate and RF are **normal**. Labs are ordered to exclude mimics, not to confirm.", "objective": "", "remediation": {"steps": [{"teach": "There is **no confirmatory lab** for fibromyalgia — the diagnosis rests on the clinical WPI/SSS criteria.", "stem": "What lab test confirms fibromyalgia?", "options": [{"letter": "A", "text": "None — the diagnosis is clinical"}, {"letter": "B", "text": "Rheumatoid factor"}, {"letter": "C", "text": "ESR"}], "answer": "A", "explanation": "No lab confirms it; diagnosis is clinical using WPI/SSS.", "clarify": [{"stem": "Expected ESR/CRP in fibromyalgia:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Markedly elevated"}], "answer": "A", "explanation": "Inflammatory markers are normal."}]}, {"teach": "Labs still have a purpose: they rule out **look-alike diseases** that could explain diffuse pain.", "stem": "Why order a CBC, ESR and RF in a suspected fibromyalgia patient?", "options": [{"letter": "A", "text": "To exclude mimics"}, {"letter": "B", "text": "To confirm fibromyalgia"}, {"letter": "C", "text": "To stage disease severity"}], "answer": "A", "explanation": "Labs exclude other conditions; they neither confirm nor stage fibromyalgia."}], "checkpoints": [{"stem": "Diffuse pain, tender points, no synovitis, normal ESR, negative RF → diagnosis:", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Systemic lupus erythematosus"}, {"letter": "C", "text": "Fibromyalgia"}, {"letter": "D", "text": "Polymyalgia rheumatica"}], "answer": "C", "explanation": "Tender points with no joint swelling and normal labs is the fibromyalgia pattern."}]}}, {"id": "9", "group": 9, "section": "Epidemiology", "topic": "Incidence and age of onset", "skill": "Disease process", "multi": true, "stem": "Which of the following epidemiologic statements about fibromyalgia are correct?", "options": [{"letter": "A", "text": "Predominantly affects women"}, {"letter": "B", "text": "Onset is typically in the 30s–60s"}, {"letter": "C", "text": "US prevalence is about 2–3%"}, {"letter": "D", "text": "Onset peaks in early childhood"}, {"letter": "E", "text": "Affects men more than women"}], "answers": ["A", "B", "C"], "explanation": "Fibromyalgia affects **women** predominantly, with onset in the **30s–60s** and a US prevalence of **2–3%**.", "objective": "", "remediation": {"steps": [{"teach": "Fibromyalgia has a strong **sex predominance** — one sex is affected far more often.", "stem": "Fibromyalgia predominantly affects:", "options": [{"letter": "A", "text": "Women"}, {"letter": "B", "text": "Men"}], "answer": "A", "explanation": "The typical patient is a woman."}, {"teach": "Onset falls in **middle adulthood**, not childhood or old age.", "stem": "Typical age of onset of fibromyalgia:", "options": [{"letter": "A", "text": "30s–60s"}, {"letter": "B", "text": "Under 10 years"}, {"letter": "C", "text": "Over 75 years"}], "answer": "A", "explanation": "Onset in the 30s–60s; childhood onset is not the pattern."}, {"teach": "Prevalence is a **low single-digit percentage** of the US population, and the risk is much higher in relatives.", "stem": "US prevalence of fibromyalgia is approximately:", "options": [{"letter": "A", "text": "2–3%"}, {"letter": "B", "text": "15%"}, {"letter": "C", "text": "25%"}], "answer": "A", "explanation": "About 2–3%; the 15% figure refers to secondary fibromyalgia in RA/lupus patients.", "clarify": [{"stem": "First-degree relatives of a fibromyalgia patient are how much more likely to develop it?", "options": [{"letter": "A", "text": "8.5×"}, {"letter": "B", "text": "2×"}], "answer": "A", "explanation": "Genetic predisposition: 1st-degree relatives are 8.5× more likely."}]}], "checkpoints": [{"stem": "Genetic predisposition in fibromyalgia is reflected by:", "options": [{"letter": "A", "text": "1st-degree relatives at 8.5× risk, familial lower pain threshold"}, {"letter": "B", "text": "HLA-B27 positivity"}, {"letter": "C", "text": "Autosomal dominant inheritance with full penetrance"}, {"letter": "D", "text": "No familial clustering"}], "answer": "A", "explanation": "Relatives carry 8.5× risk and a familial lower pain threshold linked to pain-processing genes."}]}, "answer": "A,B,C"}, {"id": "10", "group": 10, "section": "Associated conditions", "topic": "Secondary fibromyalgia", "skill": "Complications", "stem": "Diffuse pain out of proportion to the degree of synovitis in a patient with established RA or lupus → most likely explanation:", "options": [{"letter": "A", "text": "Uncontrolled RA flare"}, {"letter": "B", "text": "Secondary fibromyalgia"}, {"letter": "C", "text": "Drug-induced lupus"}, {"letter": "D", "text": "Polymyalgia rheumatica"}, {"letter": "E", "text": "Septic arthritis"}], "answer": "B", "explanation": "**Secondary fibromyalgia** occurs in up to **15%** of patients with rheumatic disease such as RA and lupus; pain exceeding the visible synovitis is the clue.", "objective": "", "remediation": {"steps": [{"teach": "Fibromyalgia can ", "text": "Low-dose amitriptyline at bedtime"}, {"letter": "C", "text": "Scheduled naproxen"}, {"letter": "D", "text": "Oxycodone every night at bedtime"}, {"letter": "E", "text": "Low-dose prednisone"}], "answer": "B", "explanation": "For unrefreshing sleep the guide uses a **bedtime sleep adjunct** — low-dose amitriptyline, trazodone, tizanidine or cyclobenzaprine qhs — plus a sleep study if indicated.", "objective": "", "remediation": {"steps": [{"teach": "Correcting **sleep disruption** is one of the four prongs of treatment; specific agents are given **at bedtime** for this purpose.", "stem": "When are the sleep-adjunct medications for fibromyalgia dosed?", "options": [{"letter": "A", "text": "At bedtime (qhs)"}, {"letter": "B", "text": "First thing in the morning"}, {"letter": "C", "text": "With every meal"}], "answer": "A", "explanation": "All four sleep adjuncts are bedtime (qhs) agents."}, {"teach": "The bedtime agents in the guide are a **tricyclic**, **trazodone**, a muscle relaxant **(cyclobenzaprine)** and **tizanidine** — not opioids, NSAIDs or steroids.", "stem": "Which is a bedtime sleep adjunct used in fibromyalgia?", "options": [{"letter": "A", "text": "Low-dose amitriptyline"}, {"letter": "B", "text": "Oxycodone"}, {"letter": "C", "text": "Prednisone"}], "answer": "A", "explanation": "Amitriptyline, trazodone, tizanidine and cyclobenzaprine are the sleep adjuncts; opioids and steroids are avoided.", "clarify": [{"stem": "Which of these is a listed fibromyalgia sleep adjunct?", "options": [{"letter": "A", "text": "Trazodone"}, {"letter": "B", "text": "Naproxen"}], "answer": "A", "explanation": "Trazodone qhs is listed; chronic NSAIDs are avoided."}]}], "checkpoints": [{"stem": "Which muscle relaxant is used at bedtime for sleep in fibromyalgia?", "options": [{"letter": "A", "text": "Cyclobenzaprine"}, {"letter": "B", "text": "Methotrexate"}, {"letter": "C", "text": "Hydroxychloroquine"}, {"letter": "D", "text": "Naproxen"}], "answer": "A", "explanation": "Cyclobenzaprine 10 mg qhs (and tizanidine) are the bedtime muscle relaxants listed."}]}}, {"id": "13", "group": 13, "section": "Pharmacologic agents", "topic": "Agents to avoid", "skill": "Pharmacology", "multi": true, "stem": "Which of the following should be avoided or offer no benefit in fibromyalgia because the condition is non-inflammatory?", "options": [{"letter": "A", "text": "Chronic oxycodone"}, {"letter": "B", "text": "Prednisone"}, {"letter": "C", "text": "Methotrexate"}, {"letter": "D", "text": "Duloxetine"}, {"letter": "E", "text": "Pregabalin"}], "answers": ["A", "B", "C"], "explanation": "Avoid **opioids (other than tramadol), chronic NSAIDs, steroids and DMARDs** — fibromyalgia is not inflammatory. Duloxetine and pregabalin are FDA-approved therapies.", "objective": "", "remediation": {"steps": [{"teach": "Drugs that suppress **inflammation or the immune system** have nothing to act on in fibromyalgia.", "stem": "Should prednisone be given for fibromyalgia?", "options": [{"letter": "A", "text": "No — non-inflammatory; it does not help"}, {"letter": "B", "text": "Yes — a short burst is first-line"}], "answer": "A", "explanation": "Steroids do not help a non-inflammatory central pain disorder.", "clarify": [{"stem": "Methotrexate (a DMARD) in fibromyalgia is:", "options": [{"letter": "A", "text": "Not indicated"}, {"letter": "B", "text": "Standard therapy"}], "answer": "A", "explanation": "DMARDs are avoided; they treat inflammatory arthritis, not fibromyalgia."}]}, {"teach": "Among analgesics, **other opioids are avoided**; only one weak opioid with SNRI activity appears in the guide.", "stem": "Which opioid-class analgesic is the exception listed as acceptable in fibromyalgia?", "options": [{"letter": "A", "text": "Tramadol"}, {"letter": "B", "text": "Oxycodone"}, {"letter": "C", "text": "Morphine"}], "answer": "A", "explanation": "Tramadol (mu agonist + SNRI) is listed; other opioids are avoided."}, {"teach": "In contrast, the **FDA-approve ared with earlier approaches?", "options": [{"letter": "A", "text": "A tender-point count on physical exam is now required"}, {"letter": "B", "text": "Other diagnoses no longer need to be excluded"}, {"letter": "C", "text": "ESR must be documented as normal"}, {"letter": "D", "text": "Symptoms must persist for at least 6 months"}, {"letter": "E", "text": "MRI of the spine is required"}], "answer": "B", "explanation": "The 2016 criteria make the diagnosis **irrespective of other diagnoses** — it is no longer required to rule out all other conditions.", "objective": "", "remediation": {"steps": [{"teach": "Older thinking treated fibromyalgia as a **diagnosis of exclusion**; the 2016 criteria changed that relationship with other diseases.", "stem": "Under the 2016 criteria, can fibromyalgia be diagnosed in a patient who also has RA?", "options": [{"letter": "A", "text": "Yes — irrespective of other diagnoses"}, {"letter": "B", "text": "No — RA must first be excluded"}], "answer": "A", "explanation": "The diagnosis is made irrespective of other diagnoses (this is how secondary fibromyalgia is recognized)."}, {"teach": "The 2016 criteria rely on **WPI/SSS scoring, regions and duration** — no imaging, no lab threshold, no tender-point count.", "stem": "Which is NOT an element of the 2016 criteria?", "options": [{"letter": "A", "text": "Spine MRI"}, {"letter": "B", "text": "WPI/SSS score"}, {"letter": "C", "text": "Symptoms ≥3 months"}], "answer": "A", "explanation": "Imaging and labs are not criteria elements; WPI/SSS, 4 of 5 regions and ≥3 months are."}], "checkpoints": [{"stem": "The ACTTION-APS 2019 alternative criteria require pain in how many of 9 sites plus sleep problems or fatigue for ≥3 months?", "options": [{"letter": "A", "text": "≥3 of 9"}, {"letter": "B", "text": "≥6 of 9"}, {"letter": "C", "text": "All 9"}, {"letter": "D", "text": "≥4 of 9"}], "answer": "B", "explanation": "ACTTION-APS 2019: pain in ≥6 of 9 sites + moderate–severe sleep problems or fatigue,
