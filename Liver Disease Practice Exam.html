<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

const EXAM_DATA = {"title": "Clinical Medicine II — Liver Disease Practice Exam", "questions": [{"id": "1", "group": 1, "stem": "A 38-year-old man who was born in Vietnam and moved to the United States as a teenager is seen in the primary care clinic for a routine visit. He feels well and has no abdominal pain, although he reports mild fatigue on questioning. He has no jaundice. He was never vaccinated against hepatitis B, reports no injection drug use and no high-risk sexual exposure, and his mother had liver cancer. His temperature is 36.7°C (98.1°F), blood pressure is 120/74 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. Examination is normal apart from a liver edge palpable 2 cm below the costal margin; there is no jaundice, no spider angiomata, no palmar erythema, and no splenomegaly. A liver panel drawn last month was abnormal and a repeat is similar.\n\nALT: 78 U/L\nAST: 54 U/L\nPlatelets: 198,000/mm³\nAlbumin: 4.1 g/dL\nINR: 1.0\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Serum alpha-1 antitrypsin level with liver function tests"}, {"letter": "B", "text": "Hepatitis C antibody with an HCV viral load by PCR and genotype"}, {"letter": "C", "text": "AST and ALT with GGT and a serum phosphatidylethanol level"}, {"letter": "D", "text": "Hepatitis B surface antigen with surface antibody and core antibody IgG"}, {"letter": "E", "text": "Transferrin saturation with ferritin and liver function tests"}], "answer": "D", "explanation": "Chronically elevated transaminases in an adult born in a country of high prevalence are worked up with viral serology first, and the surface antigen is the screening test for hepatitis B. Perinatal transmission is the likely route here: his mother had liver cancer, his siblings were never screened, and he was never vaccinated.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "1A", "group": 1, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A positive surface antigen with a negative surface antibody and a detectable viral load"}, {"letter": "B", "text": "A transferrin saturation above 45% with a ferritin above 300 ng/mL"}, {"letter": "C", "text": "An AST:ALT ratio above 2 with an elevated GGT and a positive phosphatidylethanol level"}, {"letter": "D", "text": "A low alpha-1 antitrypsin level with elevated transaminases"}, {"letter": "E", "text": "A positive antibody with detectable viral RNA"}], "answer": "A", "explanation": "A positive surface antigen means infection and a negative surface antibody means he is not immune. A detectable HBV DNA of 42,000 IU/mL with a negative core IgM makes this chronic rather than acute infection; the core IgG is positive.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "1B", "group": 1, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hereditary hemochromatosis"}, {"letter": "B", "text": "Chronic hepatitis B"}, {"letter": "C", "text": "Chronic hepatitis C"}, {"letter": "D", "text": "Alcohol-related liver disease"}, {"letter": "E", "text": "Alpha-1 antitrypsin deficiency"}], "answer": "B", "explanation": "Surface antigen positivity with a positive core IgG and a detectable viral load, in a patient with hepatomegaly and no stigmata of cirrhosis, is chronic hepatitis B. Hepatitis C would show a positive antibody with detectable RNA, and the genetic causes would show abnormal iron studies or a low alpha-1 antitrypsin level.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "2", "group": 2, "stem": "A 26-year-old man is seen in the primary care clinic after a panel drawn for fatigue showed a new transaminase and bilirubin elevation. His girlfriend noticed mild jaundice; he is otherwise largely asymptomatic. He started a new workout supplement 6 weeks ago along with a hair-and-nail product, and completed a course of amoxicillin/clavulanate for sinusitis 5 weeks ago. He does not drink alcohol, takes no acetaminophen beyond occasional single doses, and has no injection drug use. His temperature is 36.8°C (98.2°F), blood pressure is 118/72 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination shows mild jaundice with scleral icterus, no rash and no eosinophilia, and a soft abdomen with mild right upper quadrant tenderness; there is no hepatomegaly and no asterixis.\n\nINR: 1.1\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "AST and ALT with ANA, anti-smooth muscle antibody, and serum IgG"}, {"letter": "B", "text": "Ceruloplasmin with a 24-hour urinary copper and a slit-lamp examination"}, {"letter": "C", "text": "A complete metabolic panel with bilirubin, PT/INR, and a complete blood count"}, {"letter": "D", "text": "A serum acetaminophen level with AST and ALT, INR, and bilirubin"}, {"letter": "E", "text": "AST, ALT, alkaline phosphatase, and bilirubin with an INR and a serologic workup"}], "answer": "E", "explanation": "A new transaminase and bilirubin elevation after a workout supplement, a hair-and-nail product, and a completed course of amoxicillin/clavulanate calls for transaminases, alkaline phosphatase, and bilirubin with an INR and a serologic workup for other causes. Always ask about prescription drugs, over-the-counter drugs, AND supplements with any abnormal liver test.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B3", "pgroup": "B", "pstack": "A"}, {"id": "2A", "group": 2, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A detectable drug level with an AST and ALT in the thousands"}, {"letter": "B", "text": "An AST greater than the ALT with neither above 400 IU/L, with hyperbilirubinemia and leukocytosis"}, {"letter": "C", "text": "A mixed hepatocellular and cholestatic pattern with a temporal relationship to a drug"}, {"letter": "D", "text": "A ceruloplasmin under 20 mg/dL with a high urinary copper and Kayser-Fleischer rings"}, {"letter": "E", "text": "Transaminases above 1,000 U/L with a positive anti-smooth muscle antibody and a raised IgG"}], "answer": "C", "explanation": "His ALT is 486 U/L, AST 392 U/L, alkaline phosphatase 340 U/L, and total bilirubin 3.4 mg/dL — a mixed hepatocellular and cholestatic pattern — with a temporal relationship to the supplement and improvement after stopping it. Viral serologies, autoantibodies, iron studies, ceruloplasmin, and alpha-1 antitrypsin are negative or normal, and ultrasound shows patent vasculature with no obstruction or mass.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B3", "pgroup": "B", "pstack": "A"}, {"id": "2B", "group": 2, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Autoimmune hepatitis"}, {"letter": "B", "text": "Drug-induced liver injury"}, {"letter": "C", "text": "Wilson's disease"}, {"letter": "D", "text": "Acute alcohol-related hepatitis"}, {"letter": "E", "text": "Acetaminophen hepatotoxicity"}], "answer": "B", "explanation": "Drug-induced liver injury is a diagnosis of exclusion built on the temporal relationship, the course after cessation, concomitant medications, and exclusion of other liver disease. Idiosyncratic hypersensitivity injury can follow even a SINGLE dose — amoxicillin/clavulanate is the leading agent — so a course completed weeks ago is still in play.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B3", "pgroup": "B", "pstack": "A"}, {"id": "3", "group": 3, "stem": "A 41-year-old woman comes to the gastroenterology clinic after a panel drawn for fatigue showed cholestatic liver injury. She has no itching and no jaundice, but reports a dry cough, exertional breathlessness, and joint aches. She was diagnosed with sarcoidosis 2 years ago with hilar lymphadenopathy on chest imaging. She has no new drug exposure, no tuberculosis risk factors, no travel, and no injection drug use. Her temperature is 36.9°C (98.4°F), blood pressure is 118/72 mm Hg, pulse is 78/min, respirations are 16/min, and oxygen saturation is 97% on room air. Examination shows hepatomegaly with the liver edge 3 cm below the costal margin, erythema nodosum on both shins, and palpable cervical lymphadenopathy; there is no jaundice and no excoriation.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Alkaline phosphatase and GGT with MRCP and serum IgG subclasses"}, {"letter": "B", "text": "Alkaline phosphatase and GGT with an anti-mitochondrial antibody and a serum IgM"}, {"letter": "C", "text": "Serum IgG subclasses sent at least twice, with MRCP and a contrasted CT"}, {"letter": "D", "text": "Transabdominal right upper quadrant ultrasound with liver function tests"}, {"letter": "E", "text": "Alkaline phosphatase and GGT with an anti-mitochondrial antibody and MRCP or ERCP"}], "answer": "E", "explanation": "A cholestatic pattern in a patient with known sarcoidosis is worked up with an alkaline phosphatase and GGT plus an anti-mitochondrial antibody to rule out primary biliary cholangitis and cholangiography to rule out sclerosing cholangitis and obstruction. The work-up order matters: exclude those FIRST, then biopsy.", "objective": "", "section": "A cholestatic laboratory pattern with a  biliary cholangitis granulomas are usually centered around bile ducts, which is why the anti-mitochondrial antibody and the cholangiogram come before the biopsy.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C4", "pgroup": "C", "pstack": "A"}, {"id": "3C", "group": 3, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Primary sclerosing cholangitis"}, {"letter": "B", "text": "Choledocholithiasis"}, {"letter": "C", "text": "Autoimmune (IgG4) cholangiopathy"}, {"letter": "D", "text": "Hepatic granulomas"}, {"letter": "E", "text": "Primary biliary cholangitis"}], "answer": "D", "explanation": "A very high alkaline phosphatase and GGT with a negative anti-mitochondrial antibody, a normal cholangiogram, and non-caseating granulomas on biopsy in a patient with systemic sarcoid findings is hepatic granulomatous disease from sarcoidosis. A granuloma forms when the body cannot clear an irritant and boxes it in with inflammation and scar.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C4", "pgroup": "C", "pstack": "A"}, {"id": "4", "group": 4, "stem": "A 54-year-old man of Northern European descent comes to the primary care clinic with 2 years of aching in both hands, worsening fatigue, and reduced libido with impotence. His wife says his skin has taken on a permanent tan even through the winter, and diabetes was newly identified. His father died of cirrhosis without ever drinking. He uses no alcohol and has no viral risk factors. His temperature is 36.7°C (98.1°F), blood pressure is 132/80 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. Examination shows bronze discoloration of the skin, tenderness and squaring of the second and third metacarpophalangeal joints, hepatomegaly with the liver edge 4 cm below the costal margin, and testicular atrophy; there is no jaundice and no ascites.\n\nTransferrin saturation: 68%\nFerritin: 1,180 ng/mL\nALT: 92 U/L\nAST: 78 U/L\nHemoglobin A1c: 7.4%\nTestosterone: Low\nViral serologies: Negative\n\nWhich of the following tests would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "ATP7B genetic testing"}, {"letter": "B", "text": "HFE gene testing for C282Y, H63D, and S65C"}, {"letter": "C", "text": "Direct venography"}, {"letter": "D", "text": "Liver biopsy"}, {"letter": "E", "text": "Alpha-1 antitrypsin genotype or phenotype testing"}], "answer": "B", "explanation": "A transferrin saturation above 45% with a ferritin above 300 ng/mL is a positive screen, and HFE gene testing for C282Y, H63D, and S65C is what confirms it. Liver biopsy would show iron overload but is not required.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D1", "pgroup": "D", "pstack": "A"}, {"id": "4A", "group": 4, "stem": "Which of the following results would most likely be found?", "options": [{"letter": "A", "text": "An ATP7B mutation"}, {"letter": "B", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "C", "text": "Two abnormal HFE genes, a homozygous result"}, {"letter": "D", "text": "Obstructed hepatic venous outflow"}, {"letter": "E", "text": "An SS, SZ, or ZZ genotype"}], "answer": "C", "explanation": "The disease is autosomal recessive on chromosome 6 and is confirmed by an HFE genotype showing homozygosity — two abnormal genes, C282Y homozygous here. The mutated HFE protein is trapped intracellularly and cannot bind transferrin.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D1", "pgroup": "D", "pstack": "A"}, {"id": "4B", "group": 4, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "B", "text": "Budd-Chiari syndrome"}, {"letter": "C", "text": "Wilson's disease"}, {"letter": "D", "text": "Hereditary hemochromatosis"}, {"letter": "E", "text": "Autoimmune hepatitis"}], "answer": "D", "explanation": "Bronze skin with diabetes, arthropathy, and hypogonadism in a middle-aged man with iron overload and C282Y homozygosity is hereditary hemochromatosis, prevalence about 1 in 140. Wilson's disease would show copper accumulation with Kayser-Fleischer rings and neuropsychiatric change in a younger patient.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D1", "pgroup": "D", "pstack": "A"}, {"id": "5", "group": 5, "stem": "A 59-year-old woman comes to the gastroenterology clinic. She was well until abdominal distension developed over the past 2 months, with fatigue and mild jaundice. She has had metabolic dysfunction-associated steatotic liver disease with type 2 diabetes and obesity for over a decade, and uses no alcohol and has no viral hepatitis. She has had no prior decompensating event. Her temperature is 36.7°C (98.1°F), blood pressure is 108/66 mm Hg, pulse is 82/min, respirations are 16/min, and oxygen saturation is 97% on room air. Examination shows spider angiomata over the chest, palmar erythema, and caput medusae, along with splenomegaly and ascites with shifting dullness and mild scleral icterus. There is no asterixis and no confusion.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "A MELD 3.0 score with liver imaging and transplant center evaluation"}, {"letter": "B", "text": "An INR and ammonia with an acetaminophen level, viral serologies, and Doppler ultrasound"}, {"letter": "C", "text": "Doppler ultrasound of the liver with triple-phase CT and liver function tests"}, {"letter": "D", "text": "Multiphasic contrast CT or MRI of the liver with an alpha-fetoprotein"}, {"letter": "E", "text": "A complete blood count, metabolic panel, INR, and albumin with a liver ultrasound and transient elastography"}], "answer": "E", "explanation": "New ascites with spider angiomata, palmar erythema, caput medusae, and splenomegaly in a patient with a decade of steatotic liver disease is a first decompensating event. The staging set is a blood count, metabolic panel, INR, and albumin with a liver ultrasound and transient elastography or FIB-4, plus a screening endoscopy for varices at diagnosis.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E2", "pgroup": "E", "pstack": "A"}, {"id": "5A", "group": 5, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Platelets below 150,000/mm³ with a raised INR, a low albumin, and a nodular liver"}, {"letter": "B", "text": "Arterial enhancement with venous washout in a lesion above 1 cm in a cirrhotic"}, {"letter": "C", "text": "Hepatic venous outflow obstruction with absent hepatic veins or hepatic vein thrombus"}, {"letter": "D", "text": "A MELD 3.0 score at or above 15 with a decompensation history"}, {"letter": "E", "text": "Severe acute liver injury with an INR above 1.5 and hepatic encephalopathy in a previously healthy liver"}], "answer": "A", "explanation": "Her platelets are 96,000/mm³ with an INR of 1.5, an albumin of 2.9 g/dL, and a total bilirubin of 2.6 mg/dL, and ultrasound shows a nodular liver with splenomegaly and ascites. Elastography is 22 kPa (stage F4) and the FIB-4 is 4.8, above 3.25; screening endoscopy shows small esophageal varices.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E2", "pgroup": "E", "pstack": "A"}, {"id": "5B", "group": 5, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Acute liver failure"}, {"letter": "B", "text": "Acute alcohol-related hepatitis"}, {"letter": "C", "text": "Hepatocellular carcinoma"}, {"letter": "D", "text": "Cirrhosis"}, {"letter": "E", "text": "Budd-Chiari syndrome"}], "answer": "D", "explanation": "Cirrhosis is the END STAGE of any chronic liver disease and is defined histologically by regenerative nodules surrounded by fibrous tissue — F4 on staging. Its complications are not etiology specific. A previously healthy liver failing in days would be acute liver failure; her stigmata, thrombocytopenia, and low albumin mark established chronic disease.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E2", "pgroup": "E", "pstack": "A"}, {"id": "6", "group": 6, "stem": "A 55-year-old man with alcohol-related cirrhosis diagnosed 3 years ago is brought to the emergency department after vomiting a large volume of bright red blood twice at home and passing a black tarry stool. He feels lightheaded and was asymptomatic until the bleeding. He has had no prior variceal bleed, has not had a screening endoscopy since diagnosis, and takes no beta-blocker. His temperature is 36.9°C (98.4°F), blood pressure is 88/54 mm Hg, pulse is 122/min, respirations are 22/min, and oxygen saturation is 96% on room air. Examination shows caput medusae, splenomegaly, conjunctival pallor, and spider angiomata, with melena on rectal examination; there is no asterixis and no confusion. Resuscitation is under way.\n\nPlatelets: 74,000/mm³\nINR: 1.6\n\nWhich of the following is the most appropriate next step to establish the source of the bleeding?", "options": [{"letter": "A", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}, {"letter": "B", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}, {"letter": "C", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}, {"letter": "D", "text": "Clinical diagnosis with West Haven grading and a search for precipitants"}, {"letter": "E", "text": "Upper endoscopy with a complete blood count and type and cross"}], "answer": "E", "explanation": "Hematemesis and melena with hypotension and tachycardia in a known cirrhotic is an upper gastrointestinal bleed until proven otherwise: urgent upper endoscopy with a blood count and a type and cross. He has had no screening endoscopy since his diagnosis 3 years ago.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F1", "pgroup": "F", "pstack": "A"}, {"id": "6A", "group": 6, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Esophageal or gastric fundal varices with a red wale sign, and anemia"}, {"letter": "B", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}, {"letter": "C", "text": "An ascitic PMN count at or above 250/mm³ with a positive culture and a rising creatinine"}, {"letter": "D", "text": "A SAAG at or above 1.1 g/dL with a low ascitic total protein and PMNs under 250/mm³"}, {"letter": "E", "text": "Confusion with asterixis in a cirrhotic, with an identified precipitant"}], "answer": "A", "explanation": "Endoscopy shows large esophageal varices with red wale signs and an adherent clot; the red wale sign means high bleeding risk. His hemoglobin is 7.2 g/dL with a hematocrit of 22%, and the portosystemic gradient is 18 mmHg — at or above 12 mmHg is sufficient for bleeding risk, against a normal portal pressure of 5-10 mmHg.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F1", "pgroup": "F", "pstack": "A"}, {"id": "6B", "group": 6, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hepatorenal syndrome"}, {"letter": "B", "text": "Ascites"}, {"letter": "C", "text": "Bleeding gastroesophageal varices from portal hypertension"}, {"letter": "D", "text": "Spontaneous bacterial peritonitis"}, {"letter": "E", "text": "Hepatic encephalopathy"}], "answer": "C", "explanation": "Hematemesis with hypotension and anemia in a cirrhotic, with endoscopic varices bearing red wale signs, is bleeding gastroesophageal varices from portal hypertension. Painless distension with a normal hemoglobin would be ascites, and confusion with asterixis would be encephalopathy.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F1", "pgroup": "F", "pstack": "A"}, {"id": "7", "group": 7, "stem": "A 53-year-old man comes to the hepatology clinic with dyspnea on exertion progressing over 9 months; he now stops after one flight of stairs. He has fatigue, ankle swelling, and abdominal fullness. He has known cirrhosis with portal hypertension from hepatitis B, with varices banded twice, and no primary lung disease — he has never smoked, has no asthma or COPD, and has had no pulmonary embolism. His temperature is 36.8°C (98.2°F), blood pressure is 108/70 mm Hg, pulse is 92/min, respirations are 20/min, and oxygen saturation is 94% on room air. Examination shows a loud P2, jugular venous distension, peripheral edema, and a right ventricular heave, with clear lungs; there is no clubbing and no platypnea.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Right heart catheterization"}, {"letter": "B", "text": "Chest x-ray with an echocardiogram with Doppler and bubble study"}, {"letter": "C", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}, {"letter": "D", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}, {"letter": "E", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}], "answer": "B", "explanation": "Exertional dyspnea in a cirrhotic with portal hypertension and signs of right heart failure gets a chest x-ray plus an echocardiogram with Doppler and bubble study first; the three thoracic complications are looked for together, and right heart catheterization follows the echo rather than preceding it.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G3", "pgroup": "G", "pstack": "A"}, {"id": "7A", "group": 7, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}, {"letter": "B", "text": "An ascitic PMN count at or above 250/mm³ or a positive culture, with a rising creatinine"}, {"letter": "C", "text": "A clear chest x-ray with hypoxemia and bubbles crossing after 4-6 heartbeats"}, {"letter": "D", "text": "A transudative, usually right-sided pleural effusion in a cirrhotic with ascites"}, {"letter": "E", "text": "Elevated right-sided heart pressures on echocardiography with a negative bubble study"}], "answer": "E", "explanation": "His chest x-ray shows enlarged central pulmonary arteries with a prominent right heart border, and echocardiography shows an estimated pulmonary artery systolic pressure of 62 mm Hg with right ventricular dilation. The bubble study is NEGATIVE for an intrapulmonary shunt.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G3", "pgroup": "G", "pstack": "A"}, {"id": "7B", "group": 7, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hepatohydrothorax"}, {"letter": "B", "text": "Hepatopulmonary syndrome"}, {"letter": "C", "text": "Hepatorenal syndrome"}, {"letter": "D", "text": "Portopulmonary hypertension"}, {"letter": "E", "text": "Spontaneous bacterial peritonitis"}], "answer": "D", "explanation": "Right heart failure signs with elevated right-sided pressures and a negative bubble study, in a cirrhotic with only mild hypoxia, is portopulmonary hypertension. Hepatopulmonary syndrome is a shunt on bubble study with marked hypoxia and normal pressures — the two are looked for in the same workup and separated on these findings.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G3", "pgroup": "G", "pstack": "A"}, {"id": "8", "group": 8, "stem": "A 47-year-old woman is seen in the primary care clinic after abnormal liver enzymes were found on a pre-operative panel. She has been fatigued over the past year and has no jaundice. She reports “a few glasses of wine most nights,” and her partner describes closer to a bottle daily. She has no injection drug use, no obesity, and no diabetes. Her temperature is 36.7°C (98.1°F), blood pressure is 128/78 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 98% on room air. Examination shows hepatomegaly with a liver edge 3 cm below the costal margin and no signs of cirrhosis: no spider angiomata, no palmar erythema, no caput medusae, no ascites, and no asterixis.\n\nPlatelets: 176,000/mm³\nAlbumin: 4.0 g/dL\nTotal bilirubin: 1.1 mg/dL\nINR: 1.1\nViral serologies: Negative\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "AST and ALT with a liver ultrasound and a serologic workup for other causes"}, {"letter": "B", "text": "AST and ALT with GGT and a serum phosphatidylethanol level"}, {"letter": "C", "text": "Hepatitis B surface antigen with surface antibody and core antibody IgG"}, {"letter": "D", "text": "Transferrin saturation with ferritin and liver function tests"}, {"letter": "E", "text": "Hepatitis C antibody with an HCV viral load by PCR and genotype"}], "answer": "B", "explanation": "A collateral history of about a bottle of wine daily is far above the significant-use threshold of 140 g per week for women. Transaminases with a GGT and a serum phosphatidylethanol are the first-line set: phosphatidylethanol is the hemoglobin A1c for alcohol and reflects moderate-to-heavy use over the prior 2-6 weeks.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A4", "pgroup": "A", "pstack": "A"}, {"id": "8A", "group": 8, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An AST:ALT ratio above 2 with an elevated GGT and a positive phosphatidylethanol level"}, {"letter": "B", "text": "An AST/ALT ratio below 1 with steatosis on imaging and other causes excluded"}, {"letter": "C", "text": "A positive surface antigen with a negative surface antibody and a detectable viral load"}, {"letter": "D", "text": "A transferrin saturation above 45% with a ferritin above 300 ng/mL"}, {"letter": "E", "text": "A positive antibody with detectable viral RNA"}], "answer": "A", "explanation": "Her AST of 148 U/L against an ALT of 62 U/L is a ratio of 2.4; a ratio above 3 is 97% specific for alcohol. The GGT is 312 U/L and the phosphatidylethanol is positive — an AST:ALT above 2 with an elevated GGT is the classic clinical pearl. Her transaminases are well under 15 times the upper limit of normal, as expected in alcohol-related injury.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A4", "pgroup": "A", "pstack": "A"}, {"id": "8B", "group": 8, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Metabolic dysfunction-associated steatotic liver disease"}, {"letter": "B", "text": "Chronic hepatitis B"}, {"letter": "C", "text": "Alcohol-related liver disease"}, {"letter": "D", "text": "Hereditary hemochromatosis"}, {"letter": "E", "text": "Chronic hepatitis C"}], "answer": "C", "explanation": "Asymptomatic fatty liver from alcohol: an AST:ALT ratio above 2 with an elevated GGT and a positive phosphatidylethanol, negative viral serologies, and no metabolic phenotype. Ninety to a hundred percent of heavy drinkers have fatty liver, but only 10-30% develop cirrhosis, and she has no stigmata of it.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A4", "pgroup": "A", "pstack": "A"}, {"id": "9", "group": 9, "stem": "A 44-year-old man is admitted with two weeks of deepening jaundice, loss of appetite, dull right upper quadrant pain, and low-grade fever. He has drunk heavily for fifteen years and increased sharply about a month ago after losing his job, including a recent binge. He has taken no acetaminophen, no new medications, and no supplements. His temperature is 38.2°C (100.8°F), blood pressure is 112/68 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 96% on room air. Examination shows deep jaundice with scleral icterus, tender hepatomegaly 5 cm below the costal margin, and spider angiomata over the chest. There is no asterixis and no confusion.\n\nINR: 1.9\nAlbumin: 2.6 g/dL\nCreatinine: 1.1 mg/dL\nPlatelets: 118,000/mm³\nAcetaminophen level: Undetectable\nViral serologies and autoimmune markers: Negative\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "AST, ALT, alkaline phosphatase, and bilirubin with an INR and a serologic workup"}, {"letter": "B", "text": "AST and ALT with ANA, anti-smooth muscle antibody, and serum IgG"}, {"letter": "C", "text": "Ceruloplasmin with a 24-hour urinary copper and a slit-lamp examination"}, {"letter": "D", "text": "A serum acetaminophen level with AST and ALT, INR, and bilirubin"}, {"letter": "E", "text": "A complete metabolic panel with bilirubin, PT/INR, and a complete blood count"}], "answer": "E", "explanation": "Deepening jaundice two weeks after a binge in a long-standing heavy drinker is worked up with a metabolic panel including bilirubin, a PT/INR, and a complete blood count. The enzyme pattern, the bilirubin, and the white count together carry the diagnosis; no serology or drug level defines it.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B1", "pgroup": "B", "pstack": "A"}, {"id": "9A", "group": 9, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Transaminases above 1,000 U/L with a positive anti-smooth muscle antibody and a raised IgG"}, {"letter": "B", "text": "An AST greater than the ALT with neither above 400 IU/L, with hyperbilirubinemia and leukocytosis"}, {"letter": "C", "text": "A detectable drug level with an AST and ALT in the thousands"}, {"letter": "D", "text": "A mixed hepatocellular and cholestatic pattern with a temporal relationship to a drug"}, {"letter": "E", "text": "A ceruloplasmin under 20 mg/dL with a high urinary copper and Kayser-Fleischer rings"}], "answer": "B", "explanation": "His AST of 214 U/L exceeds his ALT of 88 U/L and neither is above 400 IU/L — the AST rarely exceeds 400 in alcohol-related hepatitis. The total bilirubin is 14.6 mg/dL and the white cell count is 15,800/mm³. Transaminases in the thousands would mean viral or toxic necrosis instead.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B1", "pgroup": "B", "pstack": "A"}, {"id": "9B", "group": 9, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Acute alcohol-related hepatitis"}, {"letter": "B", "text": "Acetaminophen hepatotoxicity"}, {"letter": "C", "text": "Drug-induced liver injury"}, {"letter": "D", "text": "Wilson's disease"}, {"letter": "E", "text": "Autoimmune hepatitis"}], "answer": "A", "explanation": "Jaundice developing over weeks after a binge on chronic heavy drinking, with an AST above the ALT and neither above 400, marked hyperbilirubinemia, and leukocytosis, is acute alcohol-related hepatitis. Autoimmune hepatitis would show autoantibodies with a raised IgG, and an acetaminophen injury would show a detectable level with transaminases in the thousands.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B1", "pgroup": "B", "pstack": "A"}, {"id": "10", "group": 10, "stem": "A 56-year-old woman comes to the gastroenterology clinic with 2 years of fatigue and relentless itching that no topical treatment has touched, worst at night. She has Hashimoto thyroiditis and Sicca syndrome with dry eyes and mouth, a recent DEXA scan showed osteopenia, and her lipid panel shows hypercholesterolemia. She has no inflammatory bowel disease. Her temperature is 36.7°C (98.1°F), blood pressure is 118/72 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. Examination shows excoriations over the trunk and limbs from scratching and xanthelasma at both medial canthi; there is no jaundice, no hepatomegaly, no splenomegaly, and no ascites.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Serum IgG subclasses sent at least twice, with MRCP and a contrasted CT"}, {"letter": "B", "text": "AST, ALT, alkaline phosphatase, and bilirubin with an INR and a serologic workup"}, {"letter": "C", "text": "Alkaline phosphatase and GGT with MRCP and serum IgG subclasses"}, {"letter": "D", "text": "Alkaline phosphatase and GGT with an anti-mitochondrial antibody and a serum IgM"}, {"letter": "E", "text": "Transabdominal right upper quadrant ultrasound with liver function tests"}], "answer": "D", "explanation": "Fatigue with refractory pruritus in a middle-aged woman with other autoimmune disease, osteopenia, and hypercholesterolemia is a cholestatic presentation. The first-line set is an alkaline phosphatase and GGT with an anti-mitochondrial antibody and a serum IgM. Jaundice is absent because it comes late.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C1", "pgroup": "C", "pstack": "A"}, {"id": "10A", "group": 10, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A very high alkaline phosphatase and GGT with a negative anti-mitochondrial antibody and no obstruction, stone, or mass"}, {"letter": "B", "text": "A markedly raised alkaline phosphatase with duct beading on cholangiography and a normal IgG4"}, {"letter": "C", "text": "A markedly raised alkaline phosphatase with a positive anti-mitochondrial antibody and an elevated IgM"}, {"letter": "D", "text": "An elevated serum IgG4 with biliary strictures or a mass and other organ involvement"}, {"letter": "E", "text": "A cholestatic pattern with a dilated common bile duct and a raised bilirubin"}], "answer": "C", "explanation": "Her alkaline phosphatase is 612 U/L with a GGT of 528 U/L and a total bilirubin of only 1.1 mg/dL — a cholestatic pattern in which the bilirubin rises only late. The anti-mitochondrial antibody is positive, found in 90-100% of cases and diagnostic, and the IgM is elevated at 480 mg/dL. The p-ANCA is negative and the IgG4 is normal.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C1", "pgroup": "C", "pstack": "A"}, {"id": "10B", "group": 10, "stem": "If a liver biopsy were performed, which of the following findings would most likely be present?", "options": [{"letter": "A", "text": "Non-caseating granulomas"}, {"letter": "B", "text": "Non-suppurative lymphocholangitis with a granuloma around a bile duct"}, {"letter": "C", "text": "Concentric “onion skin” fibrosis around the bile ducts"}, {"letter": "D", "text": "IgG4-positive plasma cell tissue deposition"}, {"letter": "E", "text": "Caseating granulomas"}], "answer": "B", "explanation": "The histology is non-suppurative lymphocholangitis — the “florid duct lesion,” a granuloma around a bile duct. Biopsy is only done if the anti-mitochondrial antibody is negative or the diagnosis is unclear, neither of which applies here.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C1", "pgroup": "C", "pstack": "A"}, {"id": "10C", "group": 10, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Primary biliary cholangitis"}, {"letter": "B", "text": "Hepatic granulomas"}, {"letter": "C", "text": "Autoimmune (IgG4) cholangiopathy"}, {"letter": "D", "text": "Primary sclerosing cholangitis"}, {"letter": "E", "text": "Choledocholithiasis"}], "answer": "A", "explanation": "A markedly raised alkaline phosphatase with a positive anti-mitochondrial antibody and an elevated IgM, in a woman with pruritus and other autoimmune disease, is primary biliary cholangitis; the target is the small intrahepatic bile ducts. Sclerosing cholangitis would show duct beading in a patient with ulcerative colitis, and IgG4 disease an elevated IgG4 with a biliary mass.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C1", "pgroup": "C", "pstack": "A"}, {"id": "11", "group": 11, "stem": "A 54-year-old man has hereditary hemochromatosis with C282Y homozygosity, a transferrin saturation of 68%, and a ferritin of 1,180 ng/mL.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "A low-copper diet with D-penicillamine, trientine, or zinc acetate"}, {"letter": "B", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "C", "text": "Monitoring with smoking cessation"}, {"letter": "D", "text": "Diet and exercise with 5-10% weight loss"}, {"letter": "E", "text": "Prednisone 40 mg for induction"}], "answer": "B", "explanation": "Serial phlebotomy with avoidance of alcohol and dietary iron is the treatment. Phlebotomy does NOT reverse damage — it prevents further damage — so a normalized ferritin is not a cured liver. Hemochromatosis is one of the highest-risk conditions for hepatocellular carcinoma, alongside hepatitis B, hepatitis C, and NASH, and also carries cardiomyopathy and hypogonadism risk.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D1", "pgroup": "D", "pstack": "B"}, {"id": "12", "group": 12, "stem": "A 67-year-old man is seen in the hepatology clinic after a 2.4 cm nodule in segment VII was found on his routine 6-month surveillance ultrasound. On questioning he reports 5 kg (11 lb) of weight loss and vague right upper quadrant discomfort. He had chronic hepatitis C with cirrhosis, cured with direct-acting antivirals 4 years ago but still under surveillance, and he drank heavily in his forties. He has had no prior decompensation. His temperature is 36.8°C (98.2°F), blood pressure is 122/74 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 97% on room air. Examination shows a nodular liver edge palpable 3 cm below the costal margin and spider angiomata over the chest, with no ascites, no asterixis, and no jaundice.\n\nPlatelets: 108,000/mm³\nAlbumin: 3.6 g/dL\nTotal bilirubin: 1.4 mg/dL\nINR: 1.2\nRecent EGD: No varices\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Doppler ultrasound of the liver with triple-phase CT and liver function tests"}, {"letter": "B", "text": "A MELD 3.0 score with liver imaging and transplant center evaluation"}, {"letter": "C", "text": "Multiphasic contrast CT or MRI of the liver with an alpha-fetoprotein"}, {"letter": "D", "text": "A complete blood count, metabolic panel, INR, and albumin with a liver ultrasound and transient elastography"}, {"letter": "E", "text": "An INR and ammonia with an acetaminophen level, viral serologies, and Doppler ultrasound"}], "answer": "C", "explanation": "A 2.4 cm nodule found on routine 6-month surveillance ultrasound in a cirrhotic is characterized with multiphasic contrast CT or MRI plus an alpha-fetoprotein. Ultrasound detects; multiphasic imaging categorizes.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E3", "pgroup": "E", "pstack": "A"}, {"id": "12A", "group": 12, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Platelets below 150,000/mm³ with a raised INR, a low albumin, and a nodular liver"}, {"letter": "B", "text": "Severe acute liver injury with an INR above 1.5 and hepatic encephalopathy in a previously healthy liver"}, {"letter": "C", "text": "Hepatic venous outflow obstruction with absent hepatic veins or hepatic vein thrombus"}, {"letter": "D", "text": "Arterial enhancement with venous washout in a lesion above 1 cm in a cirrhotic"}, {"letter": "E", "text": "A MELD 3.0 score at or above 15 with a decompensation history"}], "answer": "D", "explanation": "The lesion shows arterial enhancement with venous washout, is above 1 cm, and has a capsule in a cirrhotic liver — the LR-5 category, which is diagnostic and needs no biopsy. LR-3 is low-to-moderate suspicion and LR-4 is high suspicion. His alpha-fetoprotein of 18 ng/mL is near-normal, which does not argue against the diagnosis.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E3", "pgroup": "E", "pstack": "A"}, {"id": "12B", "group": 12, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hepatocellular carcinoma"}, {"letter": "B", "text": "Acute alcohol-related hepatitis"}, {"letter": "C", "text": "Budd-Chiari syndrome"}, {"letter": "D", "text": "Acute liver failure"}, {"letter": "E", "text": "Cirrhosis"}], "answer": "A", "explanation": "A discrete LR-5 lesion on multiphasic imaging in a cirrhotic is hepatocellular carcinoma. Highest risk comes from viral hepatitis, alcohol, MASH, and genetic hemochromatosis. A nodular liver without a focal lesion would be cirrhosis alone.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E3", "pgroup": "E", "pstack": "A"}, {"id": "13", "group": 13, "stem": "A 55-year-old man with alcohol-related cirrhosis has bleeding esophageal varices with red wale signs and an adherent clot on endoscopy. His blood pressure is 88/54 mm Hg, his pulse is 122/min, and his hemoglobin is 7.2 g/dL.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Band ligation with octreotide, ceftriaxone, and a proton pump inhibitor, and a non-selective beta-blocker now"}, {"letter": "B", "text": "Band ligation with octreotide, ceftriaxone, and a proton pump inhibitor, transfusing to a hemoglobin of 7"}, {"letter": "C", "text": "Band ligation with octreotide, ceftriaxone, and a proton pump inhibitor, and crystalloid to a normal blood pressure"}, {"letter": "D", "text": "Band ligation with octreotide, ceftriaxone, and a proton pump inhibitor, transfusing to a hemoglobin of 10"}, {"letter": "E", "text": "Band ligation with octreotide and a proton pump inhibitor, withholding antibiotics unless he becomes febrile"}], "answer": "B", "explanation": "Variceal bleeding is PRESSURE-related, not arterial: do NOT over-resuscitate. Keep the blood pressure around 100 and the hemoglobin around 7-8, because filling him up raises portal pressure and worsens the bleed. Ceftriaxone is part of the standard bundle rather than something withheld pending fever, and in a decompensated, hypotensive patient non-selective beta-blockers are often not tolerated.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F1", "pgroup": "F", "pstack": "B"}, {"id": "13A", "group": 13, "stem": "He re-bleeds despite repeat band ligation. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Lactulose titrated to 2-4 bowel movements daily"}, {"letter": "B", "text": "Diagnostic paracentesis before empiric cefotaxime 2 g IV every 8 hours"}, {"letter": "C", "text": "Sodium restriction with spironolactone 100 mg and furosemide 40 mg daily"}, {"letter": "D", "text": "Stopping diuretics and giving IV albumin 25 g of 25% three times daily"}, {"letter": "E", "text": "Transjugular intrahepatic portosystemic shunt"}], "answer": "E", "explanation": "TIPS is the treatment for refractory variceal bleeding and immediately lowers portal pressure. It lowers re-bleeding risk relative to beta-blockers but increases hepatic encephalopathy, so it is a patient-by-patient decision.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F1", "pgroup": "F", "pstack": "B"}, {"id": "14", "group": 14, "stem": "A 64-year-old woman comes to the emergency department with dyspnea from a pleural effusion worsening over 3 weeks, along with a dry cough and chest fullness on the right; she has needed to sleep upright. She has known cirrhosis with ascites from metabolic dysfunction-associated steatotic liver disease, on spironolactone and furosemide, and this is her third right-sided effusion in a year. Her temperature is 36.8°C (98.2°F), blood pressure is 106/64 mm Hg, pulse is 88/min, respirations are 22/min, and oxygen saturation is 90% on room air. Examination shows dullness to percussion and decreased breath sounds over the right lower chest with absent tactile fremitus, along with ascites with shifting dullness; there is no loud P2, no jugular venous distension, and no clubbing.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}, {"letter": "B", "text": "Right heart catheterization"}, {"letter": "C", "text": "Chest x-ray with an echocardiogram with Doppler and bubble study"}, {"letter": "D", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}, {"letter": "E", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}], "answer": "C", "explanation": "Any cirrhotic with shortness of breath gets a chest x-ray plus an echocardiogram with Doppler and bubble study, which is what separates the three thoracic complications; thoracentesis with fluid studies follows to characterize the effusion.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G4", "pgroup": "G", "pstack": "A"}, {"id": "14A", "group": 14, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An ascitic PMN count at or above 250/mm³ or a positive culture, with a rising creatinine"}, {"letter": "B", "text": "Elevated right-sided heart pressures on echocardiography with a negative bubble study"}, {"letter": "C", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}, {"letter": "D", "text": "A transudative, usually right-sided pleural effusion in a cirrhotic with ascites"}, {"letter": "E", "text": "A clear chest x-ray with hypoxemia and bubbles crossing after 4-6 heartbeats"}], "answer": "D", "explanation": "Her chest x-ray shows a large right-sided pleural effusion, and thoracentesis returns a transudate: pleural fluid protein 1.2 g/dL against a serum protein of 5.8 g/dL, LDH 78 U/L, nucleated cell count 90/mm³, and a negative culture. The bubble study is negative and right heart pressures are normal, excluding hepatopulmonary syndrome and portopulmonary hypertension.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G4", "pgroup": "G", "pstack": "A"}, {"id": "14B", "group": 14, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hepatopulmonary syndrome"}, {"letter": "B", "text": "Hepatorenal syndrome"}, {"letter": "C", "text": "Spontaneous bacterial peritonitis"}, {"letter": "D", "text": "Portopulmonary hypertension"}, {"letter": "E", "text": "Hepatohydrothorax"}], "answer": "E", "explanation": "A transudative, usually right-sided pleural effusion in a cirrhotic with ascites is hepatohydrothorax — ascites going into the chest. Clear lungs with a positive bubble study would be hepatopulmonary syndrome, and elevated right-sided pressures with clear lungs would be portopulmonary hypertension.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G4", "pgroup": "G", "pstack": "A"}, {"id": "15", "group": 15, "stem": "A 52-year-old man comes to the primary care clinic after an elevated ALT was found on a routine panel and confirmed on repeat. He has mild fatigue and occasional right upper quadrant fullness. He has had type 2 diabetes on insulin for 9 years, along with hypertension and dyslipidemia. He drinks two beers a month, well below the significant-alcohol threshold of 210 g per week for men. His temperature is 36.7°C (98.1°F), blood pressure is 138/84 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 97% on room air. Examination shows visceral and truncal obesity with a body mass index of 36 and a waist of 112 cm, and hepatomegaly with a liver edge 3 cm below the costal margin. There is no jaundice, no spider angiomata, and no ascites.\n\nPlatelets: 212,000/mm³\nAlbumin: 4.2 g/dL\nTotal bilirubin: 0.7 mg/dL\nINR: 1.0\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Transferrin saturation with ferritin and liver function tests"}, {"letter": "B", "text": "Hepatitis C antibody with an HCV viral load by PCR and genotype"}, {"letter": "C", "text": "AST and ALT with a liver ultrasound and a serologic workup for other causes"}, {"letter": "D", "text": "Hepatitis B surface antigen with surface antibody and core antibody IgG"}, {"letter": "E", "text": "AST and ALT with GGT and a serum phosphatidylethanol level"}], "answer": "C", "explanation": "An asymptomatic transaminase elevation confirmed on repeat, in a patient with diabetes, hypertension, dyslipidemia, and truncal obesity, is worked up with transaminases, a liver ultrasound, and a serologic search for other causes. Steatotic liver disease is the most common cause of asymptomatic mildly elevated transaminases in the US, accounting for 40-70% of outpatient elevations, but it is a diagnosis that requires other causes to be excluded.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A3", "pgroup": "A", "pstack": "A"}, {"id": "15A", "group": 15, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An AST/ALT ratio below 1 with steatosis on imaging and other causes excluded"}, {"letter": "B", "text": "An AST:ALT ratio above 2 with an elevated GGT and a positive phosphatidylethanol level"}, {"letter": "C", "text": "A positive surface antigen with a negative surface antibody and a detectable viral load"}, {"letter": "D", "text": "A transferrin saturation above 45% with a ferritin above 300 ng/mL"}, {"letter": "E", "text": "A positive antibody with detectable viral RNA"}], "answer": "A", "explanation": "His ALT of 96 U/L against an AST of 62 U/L is a ratio below 1, about 2-3 times the upper limit of normal, with steatosis on ultrasound in a metabolic phenotype and hepatitis B and C serologies, iron studies, ceruloplasmin, alpha-1 antitrypsin, ANA, ASMA, and AMA all negative or normal. An AST exceeding the ALT without alcohol would instead suggest progression to advanced fibrosis.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A3", "pgroup": "A", "pstack": "A"}, {"id": "15B", "group": 15, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Chronic hepatitis B"}, {"letter": "B", "text": "Hereditary hemochromatosis"}, {"letter": "C", "text": "Alcohol-related liver disease"}, {"letter": "D", "text": "Metabolic dysfunction-associated steatotic liver disease"}, {"letter": "E", "text": "Chronic hepatitis C"}], "answer": "D", "explanation": "This is the liver manifestation of metabolic syndrome: steatosis on imaging with metabolic risk factors, an ALT exceeding the AST, and other causes excluded. Alcohol-related disease would show an AST:ALT ratio above 2 with an elevated GGT and a positive phosphatidylethanol, and drinking above the significant threshold would make this MetALD instead.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A3", "pgroup": "A", "pstack": "A"}, {"id": "16", "group": 16, "stem": "A 44-year-old man with acute alcohol-related hepatitis has a total bilirubin of 14.6 mg/dL, an INR of 1.9, a white cell count of 15,800/mm³, and a temperature of 38.2°C (100.8°F).\n\nWhich of the following is the most appropriate initial management?", "options": [{"letter": "A", "text": "Abstinence and counseling, early enteral nutrition at 80-100 g of protein daily, and antibiotics only if a source is found"}, {"letter": "B", "text": "Abstinence and counseling, early enteral nutrition at 80-100 g of protein daily, and prompt treatment of infection"}, {"letter": "C", "text": "Abstinence and counseling, protein restriction to 20 g daily, and prednisolone 40 mg for 28 days"}, {"letter": "D", "text": "Abstinence and counseling, protein restriction to 20 g daily, and prompt treatment of infection"}, {"letter": "E", "text": "Abstinence and counseling, early enteral nutrition at 80-100 g of protein daily, and prednisolone before cultures return"}], "answer": "B", "explanation": "Abstinence with counseling and early enteral nutrition at 80-100 g of protein per day are treatment, not supportive care: do NOT protein restrict. Death in the first 30 days is usually infection and multi-organ failure, so his fever is treated promptly rather than attributed to the hepatitis, and steroids are never given into an untreated infection. Steroid data are weak — prednisolone reduced 28-day mortality without reaching significance and showed no benefit at 90 days or 1 year — so it is offered by Maddrey discriminant function rather than reflexively.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B1", "pgroup": "B", "pstack": "B"}, {"id": "16A", "group": 16, "stem": "After a week of treatment his MELD is 28 and he is not improving. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Prednisone 40 mg for induction"}, {"letter": "B", "text": "Stopping all acetaminophen and giving N-acetylcysteine"}, {"letter": "C", "text": "Stopping the drug and taking no non-prescribed supplements"}, {"letter": "D", "text": "A low-copper diet with D-penicillamine"}, {"letter": "E", "text": "Referral for liver transplant evaluation"}], "answer": "E", "explanation": "Refractory severe alcohol-related hepatitis with a MELD above 25 and no improvement on conservative therapy goes to transplant evaluation. Mortality is 20-50% at 3 months when the disease is severe.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B1", "pgroup": "B", "pstack": "B"}, {"id": "17", "group": 17, "stem": "A 41-year-old woman with sarcoidosis has an alkaline phosphatase of 782 U/L with a GGT of 690 U/L, a negative anti-mitochondrial antibody, and an MRCP showing no obstruction, stone, mass, or duct beading. Liver biopsy shows non-caseating granulomas.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Pre-operative ERCP with sphincterotomy and stone extraction"}, {"letter": "B", "text": "Corticosteroids directed at the sarcoidosis"}, {"letter": "C", "text": "Supportive care with ERCP for dominant strictures"}, {"letter": "D", "text": "Ursodeoxycholic acid 12-15 mg/kg"}, {"letter": "E", "text": "Anti-tuberculous therapy"}], "answer": "B", "explanation": "Treatment is directed at the underlying cause, and any offending drug is stopped. Non-caseating granulomas with a negative anti-mitochondrial antibody in a patient with known sarcoidosis are hepatic sarcoidosis, treated with corticosteroids. The caseating-versus-non-caseating distinction is what decides between an immunosuppressant and an anti-tuberculous regimen, and starting steroids into an undiagnosed tuberculous granuloma is the harm.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C4", "pgroup": "C", "pstack": "B"}, {"id": "18", "group": 18, "stem": "A 24-year-old woman is seen in the neurology clinic on referral from primary care for neuropsychiatric changes over the past year: a tremor of both hands, slurred speech, deteriorating handwriting, and a personality change her family describes as flat and irritable. She has had amenorrhea for 8 months, and abnormal liver enzymes were found on a panel. A maternal cousin had liver disease in his twenties. She uses no alcohol, has had no drug exposure, and has no viral risk factors. Her temperature is 36.7°C (98.1°F), blood pressure is 110/68 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination shows Kayser-Fleischer rings on slit-lamp examination, a coarse resting and postural tremor with dysarthria, mild scleral icterus, and hepatomegaly with the liver edge 3 cm below the costal margin.\n\nCeruloplasmin: 11 mg/dL\n24-hour urinary copper: 186 mcg\nALT: 168 U/L\nAST: 194 U/L\nTotal bilirubin: 2.4 mg/dL\nINR: 1.2\nHemoglobin: 10.8 g/dL with a normal MCV\nHaptoglobin: Low\n\nWhich of the following tests would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "HFE gene testing for C282Y, H63D, and S65C"}, {"letter": "B", "text": "Alpha-1 antitrypsin genotype or phenotype testing"}, {"letter": "C", "text": "Liver biopsy"}, {"letter": "D", "text": "ATP7B genetic testing"}, {"letter": "E", "text": "Direct venography"}], "answer": "D", "explanation": "A ceruloplasmin under 20 mg/dL with a high 24-hour urinary copper and Kayser-Fleischer rings is the screening triad; ATP7B genetic testing is now the standard confirmatory study, with liver biopsy copper as the criterion standard.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D2", "pgroup": "D", "pstack": "A"}, {"id": "18A", "group": 18, "stem": "Which of the following results would most likely be found?", "options": [{"letter": "A", "text": "An ATP7B mutation"}, {"letter": "B", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "C", "text": "Two abnormal HFE genes, a homozygous result"}, {"letter": "D", "text": "Obstructed hepatic venous outflow"}, {"letter": "E", "text": "An SS, SZ, or ZZ genotype"}], "answer": "A", "explanation": "More than 200 causative ATP7B variants are described. The mutation reduces vesicular copper secretion into bile and impairs incorporation of copper into ceruloplasmin, which is why the ceruloplasmin is low while urinary copper is high.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D2", "pgroup": "D", "pstack": "A"}, {"id": "18B", "group": 18, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Budd-Chiari syndrome"}, {"letter": "B", "text": "Hereditary hemochromatosis"}, {"letter": "C", "text": "Wilson's disease"}, {"letter": "D", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "E", "text": "Autoimmune hepatitis"}], "answer": "C", "explanation": "Suspect Wilson's disease in a YOUNG patient with liver disease plus neurologic or psychiatric findings. Her low ceruloplasmin, high urinary copper, Kayser-Fleischer rings, and Coombs-negative hemolytic anemia with a low haptoglobin fit; hemochromatosis would show iron overload in an older patient.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D2", "pgroup": "D", "pstack": "A"}, {"id": "19", "group": 19, "stem": "A 67-year-old man with cirrhosis has a 2.4 cm LR-5 lesion in segment VII, with arterial enhancement, venous washout, and a capsule. His alpha-fetoprotein is 18 ng/mL. He has no ascites and no varices on recent endoscopy, so there is no clinical portal hypertension.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Surgical resection"}, {"letter": "B", "text": "Liver biopsy of the lesion before any treatment"}, {"letter": "C", "text": "Systemic immunotherapy"}, {"letter": "D", "text": "Repeat imaging in 6 months, since the alpha-fetoprotein is near-normal"}, {"letter": "E", "text": "Locoregional therapy with liver transplantation"}], "answer": "A", "explanation": "Resection requires the ABSENCE of portal hypertension, and he has none — no ascites and no varices — so resection is appropriate. Resecting a cirrhotic WITH portal hypertension is the error; that patient goes to locoregional therapy plus transplant. An LR-5 lesion in a cirrhotic needs no biopsy, so biopsying it adds risk without changing the diagnosis, and alpha-fetoprotein is helpful but 30-50% of tumors do not produce it, so a normal value must not dismiss a lesion.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E3", "pgroup": "E", "pstack": "B"}, {"id": "19A", "group": 19, "stem": "Years later he develops advanced, unresectable disease. Which of the following treatments is most appropriate?", "options": [{"letter": "A", "text": "Abstinence with early enteral nutrition and vitamin replacement"}, {"letter": "B", "text": "ICU supportive care with N-acetylcysteine"}, {"letter": "C", "text": "Systemic immunotherapy"}, {"letter": "D", "text": "Urgent advanced-liver-center referral with TIPS and anticoagulation"}, {"letter": "E", "text": "Treating or removing the underlying cause, with surveillance imaging"}], "answer": "C", "explanation": "Advanced hepatocellular carcinoma is treated with systemic therapy, predominantly immunotherapy.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E3", "pgroup": "E", "pstack": "B"}, {"id": "20", "group": 20, "stem": "A 62-year-old woman comes to the gastroenterology clinic with abdominal distension developing over 8 weeks and a weight gain of 7 kg, with early satiety and mild exertional dyspnea. She has no pain and no fever. She has known cirrhosis from chronic hepatitis C and eats a high-sodium diet with frequent takeout; she has had no prior paracentesis and no prior spontaneous bacterial peritonitis. Her temperature is 36.7°C (98.1°F), blood pressure is 106/64 mm Hg, pulse is 80/min, respirations are 18/min, and oxygen saturation is 96% on room air. Examination shows shifting dullness and a fluid wave, bulging flanks, peripheral edema to mid-shin, and spider angiomata; there is no abdominal tenderness, no rebound, and no asterixis.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}, {"letter": "B", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}, {"letter": "C", "text": "Upper endoscopy with a complete blood count and type and cross"}, {"letter": "D", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}, {"letter": "E", "text": "Clinical diagnosis with West Haven grading and a search for precipitants"}], "answer": "D", "explanation": "Every new-onset ascites and every cirrhotic admission gets a diagnostic paracentesis with albumin, cell count, and culture, alongside a SAME-DAY serum albumin for the SAAG. Abdominal ultrasound confirms the fluid, but the tap is what characterizes it.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F2", "pgroup": "F", "pstack": "A"}, {"id": "20A", "group": 20, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An ascitic PMN count at or above 250/mm³ with a positive culture and a rising creatinine"}, {"letter": "B", "text": "A SAAG at or above 1.1 g/dL with a low ascitic total protein and PMNs under 250/mm³"}, {"letter": "C", "text": "Confusion with asterixis in a cirrhotic, with an identified precipitant"}, {"letter": "D", "text": "Esophageal or gastric fundal varices with a red wale sign, and anemia"}, {"letter": "E", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}], "answer": "B", "explanation": "Her serum albumin of 3.0 g/dL minus an ascitic albumin of 1.2 g/dL gives a SAAG of 1.8 g/dL; at or above 1.1 g/dL this means portal hypertension, about 97% accurate. The ascitic total protein is low at 1.4 g/dL, as expected in cirrhosis rather than the high protein of cardiac ascites, and the PMN count is 60/mm³ with a negative culture, so there is no spontaneous bacterial peritonitis.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F2", "pgroup": "F", "pstack": "A"}, {"id": "20B", "group": 20, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hepatic encephalopathy"}, {"letter": "B", "text": "Hepatorenal syndrome"}, {"letter": "C", "text": "Spontaneous bacterial peritonitis"}, {"letter": "D", "text": "Bleeding gastroesophageal varices from portal hypertension"}, {"letter": "E", "text": "Ascites"}], "answer": "E", "explanation": "Painless abdominal distension with a high SAAG and a bland tap in a cirrhotic is uncomplicated ascites. About 85% of ascites in the US is portal hypertension from cirrhosis. A PMN count at or above 250 with a positive culture would make it spontaneous bacterial peritonitis.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F2", "pgroup": "F", "pstack": "A"}, {"id": "21", "group": 21, "stem": "A 49-year-old woman comes to the hepatology clinic with 6 months of dyspnea and hypoxia, along with platypnea: her breathlessness is worse sitting or standing and improves when she lies flat. She has fatigue. She has known cirrhosis from autoimmune hepatitis and no primary lung disease — she has never smoked, has no asthma or COPD, and has had no pulmonary embolism. Her temperature is 36.7°C (98.1°F), blood pressure is 110/68 mm Hg, pulse is 84/min, respirations are 20/min, and oxygen saturation is 86% on room air seated, rising to 92% supine. Examination shows digital clubbing and perioral cyanosis with clear lungs — no crackles, no wheeze, no dullness — along with spider angiomata and minimal ascites; there is no loud P2, no jugular venous distension, and no peripheral edema.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}, {"letter": "B", "text": "Chest x-ray wit
