onary edema at baseline or worsening on therapy, and a MELD above 35, where the patient needs transplant instead — none of which applies here.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G1", "pgroup": "G", "pstack": "B"}, {"id": "50", "group": 50, "stem": "A 52-year-old man with pre-cirrhotic metabolic dysfunction-associated steatotic liver disease and a FIB-4 of 1.9 asks how often he needs to be checked.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Liver tests every 2-3 years with transient elastography every 2-3 years"}, {"letter": "B", "text": "Liver tests every 6 months with transient elastography every 6 months"}, {"letter": "C", "text": "Liver tests every 6 months with transient elastography only if the ALT rises"}, {"letter": "D", "text": "Liver tests every 6 months with a liver biopsy every 2-3 years"}, {"letter": "E", "text": "Liver tests every 6 months with transient elastography every 2-3 years"}], "answer": "E", "explanation": "Pre-cirrhotic monitoring is labs every 6 months and a FibroScan every 2-3 years. Biopsy is rarely needed. Elastography is what resolves the indeterminate FIB-4 band — below 1.45 excludes advanced fibrosis and above 3.25 predicts it — so it is not withheld pending a rise in enzymes. Steatosis progresses to cirrhosis in 3-4% over 10 years, and MASH in 20-30%.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A3", "pgroup": "A", "pstack": "C"}, {"id": "51", "group": 51, "stem": "A 31-year-old woman comes to the emergency department with 3 months of fatigue, then jaundice and dark urine over the past week, with nausea and right upper quadrant discomfort. She has Hashimoto thyroiditis and vitiligo, and her mother has rheumatoid arthritis. She uses no alcohol, no acetaminophen, and no new medications or supplements. Her temperature is 37.3°C (99.1°F), blood pressure is 112/70 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 98% on room air. Examination shows jaundice with scleral icterus and hepatomegaly with the liver edge 3 cm below the costal margin, with no asterixis, no ascites, and no spider angiomata.\n\nTotal bilirubin: 6.8 mg/dL\nINR: 1.4\nAlbumin: 3.4 g/dL\nAcetaminophen level: Undetectable\nViral serologies: Negative\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "A complete metabolic panel with bilirubin, PT/INR, and a complete blood count"}, {"letter": "B", "text": "AST, ALT, alkaline phosphatase, and bilirubin with an INR and a serologic workup"}, {"letter": "C", "text": "A serum acetaminophen level with AST and ALT, INR, and bilirubin"}, {"letter": "D", "text": "AST and ALT with ANA, anti-smooth muscle antibody, and serum IgG"}, {"letter": "E", "text": "Ceruloplasmin with a 24-hour urinary copper and a slit-lamp examination"}], "answer": "D", "explanation": "An acute hepatitic illness in a young woman with Hashimoto thyroiditis, vitiligo, and a family history of rheumatoid arthritis, with no alcohol, acetaminophen, or new medication, points to autoimmune disease. Transaminases with ANA, anti-smooth muscle antibody, and a serum IgG are the first-line set; twenty to thirty percent present acutely like this.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B2", "pgroup": "B", "pstack": "A"}, {"id": "51A", "group": 51, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Transaminases above 1,000 U/L with a positive anti-smooth muscle antibody and a raised IgG"}, {"letter": "B", "text": "A mixed hepatocellular and cholestatic pattern with a temporal relationship to a drug"}, {"letter": "C", "text": "A detectable drug level with an AST and ALT in the thousands"}, {"letter": "D", "text": "An AST greater than the ALT with neither above 400 IU/L, with hyperbilirubinemia and leukocytosis"}, {"letter": "E", "text": "A ceruloplasmin under 20 mg/dL with a high urinary copper and Kayser-Fleischer rings"}], "answer": "A", "explanation": "Her ALT is 1,180 U/L with an AST of 940 U/L — a hepatocellular pattern. The anti-smooth muscle antibody is positive with an IgG of 3,240 mg/dL, a combination present in more than 80% of cases, and the ANA is positive at 1:320 with a negative anti-LKM.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B2", "pgroup": "B", "pstack": "A"}, {"id": "51B", "group": 51, "stem": "Which of the following tests would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Ceruloplasmin with a 24-hour urinary copper"}, {"letter": "B", "text": "A serum ammonia level"}, {"letter": "C", "text": "Liver biopsy"}, {"letter": "D", "text": "Doppler ultrasound of the liver"}, {"letter": "E", "text": "ATP7B genetic testing"}], "answer": "C", "explanation": "Liver biopsy is the confirmatory study and shows interface hepatitis with plasma cell infiltration. The cell target is the HEPATOCYTE, in contrast to primary biliary cholangitis, which targets small bile ducts, and primary sclerosing cholangitis, which targets mid and large ducts.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B2", "pgroup": "B", "pstack": "A"}, {"id": "51C", "group": 51, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Drug-induced liver injury"}, {"letter": "B", "text": "Autoimmune hepatitis"}, {"letter": "C", "text": "Acute alcohol-related hepatitis"}, {"letter": "D", "text": "Acetaminophen hepatotoxicity"}, {"letter": "E", "text": "Wilson's disease"}], "answer": "B", "explanation": "Transaminases above 1,000 with a positive anti-smooth muscle antibody, a raised IgG, and a positive ANA, in a woman with other autoimmune disease and a family history, is autoimmune hepatitis. A drinker would show an AST above the ALT with neither above 400, and an idiosyncratic drug injury would follow a new exposure with negative autoantibodies.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B2", "pgroup": "B", "pstack": "A"}, {"id": "52", "group": 52, "stem": "A 56-year-old woman with primary biliary cholangitis asks what else she should be watched for.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Screen for hypercholesterolemia and osteopenia only in men with this disease"}, {"letter": "B", "text": "Screen for hypercholesterolemia and osteopenia only if her itching becomes refractory"}, {"letter": "C", "text": "Screen for hypercholesterolemia and osteopenia, which are common in this disease"}, {"letter": "D", "text": "Screen for hypercholesterolemia and osteopenia only if she becomes jaundiced"}, {"letter": "E", "text": "Screen for hypercholesterolemia and osteopenia only if the alkaline phosphatase fails to normalize"}], "answer": "C", "explanation": "Hypercholesterolemia and osteopenia are common in primary biliary cholangitis and are looked for regardless of jaundice, biochemical response, or symptom severity — symptom severity does not track disease severity. The disease has a female-to-male ratio of about 9:1 and is associated with Sicca syndrome, thyroid disease, rheumatoid arthritis, scleroderma, Raynaud phenomenon, and CREST.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C1", "pgroup": "C", "pstack": "C"}, {"id": "53", "group": 53, "stem": "A 33-year-old woman with Budd-Chiari syndrome asks why this happened to her.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "In the United States it is most often seen in women with a thrombophilic disorder such as a JAK2 mutation"}, {"letter": "B", "text": "In the United States it is most often seen in women with chronic viral hepatitis"}, {"letter": "C", "text": "In the United States it is most often the result of an inherited iron-storage disorder"}, {"letter": "D", "text": "In the United States it is most often the result of long-standing alcohol use"}, {"letter": "E", "text": "In the United States it is most often seen in men with a thrombophilic disorder such as a JAK2 mutation"}], "answer": "A", "explanation": "In the US, Budd-Chiari syndrome is most commonly seen in women with a thrombophilic disorder, such as a JAK2 mutation. The rule that catches it is that any patient with newly elevated liver tests gets an ultrasound looking for patent vasculature, biliary obstruction or dilation, masses, signs of cirrhosis, and steatosis.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D4", "pgroup": "D", "pstack": "C"}, {"id": "54", "group": 54, "stem": "A 59-year-old woman has newly diagnosed cirrhosis from metabolic dysfunction-associated steatotic liver disease. Her platelets are 96,000/mm³, her INR is 1.5, her albumin is 2.9 g/dL, and her total bilirubin is 2.6 mg/dL. Elastography is 22 kPa and screening endoscopy shows small esophageal varices.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Treat the underlying cause and repeat endoscopy only if she has a variceal bleed"}, {"letter": "B", "text": "Treat the underlying cause and begin 6-monthly liver imaging only if the transaminases rise"}, {"letter": "C", "text": "Treat the underlying cause and allow acetaminophen up to 4 g daily for pain"}, {"letter": "D", "text": "Treat the underlying cause, vaccinate against hepatitis A and B, and begin 6-monthly liver imaging"}, {"letter": "E", "text": "Perform a percutaneous liver biopsy to confirm the stage before treating the cause"}], "answer": "D", "explanation": "Management is treating or removing the underlying cause, hepatitis A and B vaccination, liver imaging every 6 months for hepatocellular carcinoma, and endoscopic variceal surveillance. Do NOT biopsy with an INR above 1.5 or platelets below 50,000-60,000 — her INR of 1.5 sits exactly at that line, which is one reason biopsy is rarely required. In cirrhosis acetaminophen is capped at 2 g per day and NSAIDs are avoided, and PT, albumin, and bilirubin reflect severity while the transaminase level does not.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E2", "pgroup": "E", "pstack": "B"}, {"id": "54A", "group": 54, "stem": "Years later she develops end-stage liver disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "ICU supportive care with N-acetylcysteine"}, {"letter": "B", "text": "Abstinence with early enteral nutrition and vitamin replacement"}, {"letter": "C", "text": "Surgical resection"}, {"letter": "D", "text": "Urgent advanced-liver-center referral with TIPS and anticoagulation"}, {"letter": "E", "text": "Liver transplantation"}], "answer": "E", "explanation": "Liver transplantation is the treatment for end-stage cirrhosis.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E2", "pgroup": "E", "pstack": "B"}, {"id": "55", "group": 55, "stem": "A 58-year-old man with cirrhosis and ascites has become sleepier and more jaundiced over 3 days with diffuse abdominal pain. He is afebrile with no rebound. His creatinine has risen from 1.0 to 1.7 mg/dL.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Empiric cefotaxime 2 g IV every 8 hours first, then diagnostic paracentesis"}, {"letter": "B", "text": "Diagnostic paracentesis first, then antibiotics only if the Gram stain is positive"}, {"letter": "C", "text": "Diagnostic paracentesis first, then empiric cefotaxime 2 g IV every 8 hours"}, {"letter": "D", "text": "Observation with repeat liver tests, since he is afebrile and has no rebound"}, {"letter": "E", "text": "Empiric cefotaxime 2 g IV every 8 hours, with paracentesis only if he becomes febrile"}], "answer": "C", "explanation": "Not all patients have fever or abdominal pain — tap the belly. The paracentesis comes BEFORE the antibiotics, because starting the antibiotic first destroys the yield of a culture that is already negative about half the time, and the Gram stain is low yield. Empiric cefotaxime 2 g IV every 8 hours or ceftriaxone follows. IV albumin is associated with improved survival.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F3", "pgroup": "F", "pstack": "B"}, {"id": "56", "group": 56, "stem": "A 53-year-old man with portopulmonary hypertension asks how cirrhosis caused it.\n\nWhich of the following is the most appropriate explanation?", "options": [{"letter": "A", "text": "Hormonal changes from cirrhosis create large arteriovenous shunts in the lungs"}, {"letter": "B", "text": "Splanchnic vasodilatation causes intense renal vasoconstriction"}, {"letter": "C", "text": "Ascites tracks through the diaphragm into the pleural space"}, {"letter": "D", "text": "A stiff liver raises resistance to portal flow, so fluid weeps off the liver surface"}, {"letter": "E", "text": "Hormonal and pressure changes from cirrhosis remodel the pulmonary arterial vasculature"}], "answer": "E", "explanation": "Hormonal and pressure changes from cirrhosis remodel the pulmonary arterial vasculature, producing the high pressures confirmed on right heart catheterization. Arteriovenous shunting in the lungs describes hepatopulmonary syndrome, which is a shunt on bubble study with hypoxia; both are sought in the same workup.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G3", "pgroup": "G", "pstack": "C"}, {"id": "57", "group": 57, "stem": "A 61-year-old woman has chronic hepatitis C, genotype 1a, with an HCV RNA of 1.8 million IU/mL. Her FibroScan is 6.4 kPa, consistent with stage F0-F1, and she has no cirrhosis.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Treat now with glecaprevir/pibrentasvir for 8 weeks"}, {"letter": "B", "text": "Treat only if the ALT remains above twice the upper limit of normal"}, {"letter": "C", "text": "Treat only if the FibroScan shows advanced fibrosis"}, {"letter": "D", "text": "Treat only if she has not used injection drugs in the past year"}, {"letter": "E", "text": "Treat only after a liver biopsy confirms the stage of fibrosis"}], "answer": "A", "explanation": "Everyone with chronic hepatitis C is treated unless there is a direct contraindication, which is a life expectancy under 1 year or advanced decompensated cirrhosis (referred to a transplant center first). Fibrosis stage, enzyme level, and drug-use history do not gate therapy. Glecaprevir/pibrentasvir for 8 weeks or sofosbuvir/velpatasvir for 12 weeks are the regimens.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A2", "pgroup": "A", "pstack": "B"}, {"id": "57A", "group": 57, "stem": "Twelve weeks after she completes therapy the HCV RNA is still detectable. Which of the following treatments is most appropriate now?", "options": [{"letter": "A", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "B", "text": "Sofosbuvir/velpatasvir/voxilaprevir with or without ribavirin"}, {"letter": "C", "text": "Specialist referral with tenofovir or entecavir"}, {"letter": "D", "text": "Diet and exercise with 5-10% weight loss, and resmetirom"}, {"letter": "E", "text": "Abstinence with counseling and naltrexone 50 mg daily"}], "answer": "B", "explanation": "Retreatment after direct-acting antiviral failure uses the salvage regimen sofosbuvir/velpatasvir/voxilaprevir, with or without ribavirin. Cure is confirmed by a negative viral load 3 months after therapy.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A2", "pgroup": "A", "pstack": "B"}, {"id": "58", "group": 58, "stem": "A 31-year-old woman has autoimmune hepatitis. Her ALT is 1,180 U/L, her AST is 940 U/L, her total bilirubin is 6.8 mg/dL, and her INR is 1.4. Liver biopsy shows interface hepatitis with plasma cell infiltration.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Begin prednisone 40 mg and refer her to a transplant center only if the INR exceeds 2"}, {"letter": "B", "text": "Begin prednisone 40 mg and manage her as an outpatient with weekly liver tests"}, {"letter": "C", "text": "Withhold prednisone and repeat the liver tests in 2 weeks"}, {"letter": "D", "text": "Begin prednisone 40 mg and refer her to a transplant center"}, {"letter": "E", "text": "Begin prednisone 40 mg only after the INR normalizes"}], "answer": "D", "explanation": "Prednisone 40 mg is induction therapy. Very high AST/ALT plus jaundice plus an elevated INR means send to a transplant center — her INR of 1.4 is the number to watch, and treating at home while it climbs is the error. Thirty percent already have cirrhosis at presentation.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B2", "pgroup": "B", "pstack": "B"}, {"id": "58A", "group": 58, "stem": "Her transaminases fall and the prednisone is being weaned to 5 mg. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Azathioprine 100 mg daily"}, {"letter": "B", "text": "Abstinence with early enteral nutrition and vitamin replacement"}, {"letter": "C", "text": "A low-copper diet with D-penicillamine"}, {"letter": "D", "text": "Stopping the drug and taking no non-prescribed supplements"}, {"letter": "E", "text": "Stopping all acetaminophen and giving N-acetylcysteine"}], "answer": "A", "explanation": "Maintenance is azathioprine 100 mg or mycophenolate 500 mg twice daily while the prednisone is weaned to 5 mg and the response reassessed.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B2", "pgroup": "B", "pstack": "B"}, {"id": "59", "group": 59, "stem": "A 63-year-old man has obstructive jaundice and a hilar mass-like lesion read as possible cholangiocarcinoma. His serum IgG4 is 418 mg/dL on two separate draws, and CT shows a sausage-shaped pancreas, retroperitoneal soft-tissue thickening, and lacrimal gland enlargement.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with ERCP for the dominant stricture"}, {"letter": "B", "text": "Prednisone with azathioprine, and referral to rheumatology"}, {"letter": "C", "text": "Pre-operative ERCP with sphincterotomy and stone extraction"}, {"letter": "D", "text": "Surgical resection of the hilar lesion"}, {"letter": "E", "text": "Ursodeoxycholic acid 12-15 mg/kg"}], "answer": "B", "explanation": "IgG4 cholangiopathy is extremely steroid responsive: prednisone with azathioprine or mycophenolate is first-line, and extra-hepatic disease warrants rheumatology referral. The danger runs in one direction — a patient sent for resection of a presumed cholangiocarcinoma has had an operation for a condition that responds dramatically to steroids, which is exactly why the IgG4 is sent at least twice before a mass is treated as cancer.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C3", "pgroup": "C", "pstack": "B"}, {"id": "59A", "group": 59, "stem": "He later develops systemic and neurologic involvement. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Supportive care with ERCP as needed for dominant strictures"}, {"letter": "B", "text": "Ursodeoxycholic acid 12-15 mg/kg with the alkaline phosphatase checked at 1 year"}, {"letter": "C", "text": "Inebilizumab-cdon"}, {"letter": "D", "text": "Stopping the drug and taking no non-prescribed supplements"}, {"letter": "E", "text": "Pre-operative ERCP with sphincterotomy and stone extraction"}], "answer": "C", "explanation": "Inebilizumab-cdon, a rituximab-like biologic, is newly approved for systemic or neurologic IgG4-related disease.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C3", "pgroup": "C", "pstack": "B"}, {"id": "60", "group": 60, "stem": "A 24-year-old woman with Wilson's disease asks about the condition.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "It affects about 1 in 140 people and results from an HFE mutation"}, {"letter": "B", "text": "It affects about 1 in 50,000 people and results from a SERPINA1 mutation"}, {"letter": "C", "text": "It affects about 1 in 140 people and results from an ATP7B mutation"}, {"letter": "D", "text": "It affects about 1 in 50,000 people and results from an ATP7B mutation"}, {"letter": "E", "text": "It affects about 1 in 1,000 people and results from an HFE mutation"}], "answer": "D", "explanation": "Wilson's disease has a prevalence of about 1 in 50,000 and follows from an ATP7B mutation. Other features to expect are osteoporosis, chondrocalcinosis, hypoparathyroidism, hemolytic anemia, and renal tubular acidosis.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D2", "pgroup": "D", "pstack": "C"}, {"id": "61", "group": 61, "stem": "A 59-year-old woman with newly diagnosed cirrhosis asks what would signal that her liver disease has worsened.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "Hepatic encephalopathy is the only decompensating event that changes prognosis"}, {"letter": "B", "text": "A falling platelet count is the only decompensating event"}, {"letter": "C", "text": "Ascites, variceal bleeding, and a rising transaminase level are the decompensating events"}, {"letter": "D", "text": "A rising transaminase level is the earliest decompensating event"}, {"letter": "E", "text": "Ascites, variceal bleeding, hepatic encephalopathy, and jaundice are the decompensating events"}], "answer": "E", "explanation": "The decompensating events are ascites, variceal bleed, hepatic encephalopathy, and jaundice. In cirrhosis, PT, albumin, and bilirubin reflect severity while the transaminase level does not, so normal-looking enzymes are not reassurance. Prognosis is scored by Child-Pugh — about 100%, 80%, and 45% one-year survival for classes A, B, and C — and by MELD 3.0.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E2", "pgroup": "E", "pstack": "C"}, {"id": "62", "group": 62, "stem": "A 58-year-old man with cirrhosis and ascites is having a diagnostic paracentesis, and the fluid is about to be sent for culture.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Repeat the paracentesis in 48 hours if the first culture is negative"}, {"letter": "B", "text": "Rely on the Gram stain, which is positive in about 80% of cases"}, {"letter": "C", "text": "Send the fluid to the laboratory in a sterile container, which raises culture yield from about 50% to about 80%"}, {"letter": "D", "text": "Inoculate blood culture bottles at the bedside, which raises culture yield from about 50% to about 80%"}, {"letter": "E", "text": "Inoculate blood culture bottles at the bedside, which raises culture yield from about 80% to about 95%"}], "answer": "D", "explanation": "The diagnosis is a PMN count above 250 AND/OR a positive fluid culture, and cultures are often negative. Bedside inoculation of blood culture bottles raises the yield from about 50% to about 80%. Multiple organisms on culture suggest a perforation rather than spontaneous bacterial peritonitis, which changes management from antibiotics to surgery.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F3", "pgroup": "F", "pstack": "C"}, {"id": "63", "group": 63, "stem": "A 60-year-old man has type 1 hepatorenal syndrome that followed treatment for spontaneous bacterial peritonitis and a large-volume paracentesis without albumin. His family asks about his prognosis.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "Type 1 develops over months and has the same prognosis as cirrhosis with ascites alone"}, {"letter": "B", "text": "Type 1 develops within 14 days and has a better prognosis than type 2"}, {"letter": "C", "text": "Type 1 develops within 14 days and has a median survival under 2 weeks"}, {"letter": "D", "text": "Type 1 develops within 14 days and has a median survival of about 6 months"}, {"letter": "E", "text": "Type 1 develops over months and has a median survival under 2 weeks"}], "answer": "C", "explanation": "Type 1 (AKI-HRS) is a doubling of creatinine above 2.5, or a 50% fall in creatinine clearance to under 20 mL/min, within 14 days — often triggered by spontaneous bacterial peritonitis, acute alcoholic hepatitis, or large-volume paracentesis without volume expansion — with a median survival under 2 weeks. Type 2 (NAKI-HRS) is a gradual, less severe GFR reduction manifesting as diuretic-resistant ascites, with better survival than type 1 but worse than cirrhosis with ascites alone.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G1", "pgroup": "G", "pstack": "C"}, {"id": "64", "group": 64, "stem": "A 61-year-old woman with chronic hepatitis C and no cirrhosis completes 8 weeks of glecaprevir/pibrentasvir. She asks what happens next.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Confirm a negative viral load 3 months after therapy, and give the hepatitis C vaccine"}, {"letter": "B", "text": "Confirm a negative viral load 3 months after therapy, and counsel that she can be re-infected"}, {"letter": "C", "text": "Confirm a negative viral load 3 months after therapy, and begin 6-monthly liver imaging"}, {"letter": "D", "text": "Confirm a negative viral load 3 months after therapy, and counsel that she is now immune"}, {"letter": "E", "text": "Confirm a negative antibody 3 months after therapy, and counsel that she can be re-infected"}], "answer": "B", "explanation": "Cure is confirmed with a viral load 3 months after therapy. Cure does NOT confer immunity, so she can be re-infected and exposure counseling continues; the antibody stays positive and there is no hepatitis C vaccine. With no cirrhosis, no further monitoring is needed; with cirrhosis, hepatocellular carcinoma and decompensation surveillance continues.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A2", "pgroup": "A", "pstack": "C"}, {"id": "65", "group": 65, "stem": "A 31-year-old woman with newly diagnosed autoimmune hepatitis asks about her disease.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "Cirrhosis develops only in patients whose IgG remains elevated"}, {"letter": "B", "text": "About 30% of patients develop cirrhosis in the year after diagnosis"}, {"letter": "C", "text": "Cirrhosis develops only in patients who present with an acute hepatitic illness"}, {"letter": "D", "text": "Fewer than 5% of patients ever develop cirrhosis"}, {"letter": "E", "text": "About 30% of patients already have cirrhosis when the diagnosis is made"}], "answer": "E", "explanation": "Thirty percent already have cirrhosis at presentation, which is why initial assessment stages the liver rather than assuming early disease. Twenty to thirty percent present with an acute hepatitic illness as she did, but that does not determine who is already cirrhotic.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B2", "pgroup": "B", "pstack": "C"}, {"id": "66", "group": 66, "stem": "A 29-year-old man with ulcerative colitis has newly diagnosed primary sclerosing cholangitis. His alkaline phosphatase is 704 U/L and cholangiography shows “beads on a string” narrowing of the bile ducts.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care, with serum IgG subclasses checked at least twice"}, {"letter": "B", "text": "Supportive care, with ursodeoxycholic acid and no further antibody testing"}, {"letter": "C", "text": "Supportive care, with serum IgG subclasses checked only if a biliary mass appears"}, {"letter": "D", "text": "Supportive care, with a p-ANCA titer used to confirm the diagnosis"}, {"letter": "E", "text": "Supportive care, with a liver biopsy used to confirm the diagnosis"}], "answer": "A", "explanation": "CHECK AN IgG4 at least twice with ANY new diagnosis of this disease or any new biliary mass, because IgG4 disease is steroid-responsive and is the one version of this picture with an effective treatment; missing it means treating a treatable disease supportively. The p-ANCA antibodies are research-based and no one relies on an antibody for the diagnosis, and biopsy is reserved for a non-diagnostic cholangiogram.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C2", "pgroup": "C", "pstack": "B"}, {"id": "66A", "group": 66, "stem": "Years later he develops end-stage liver disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Ursodeoxycholic acid 12-15 mg/kg with the alkaline phosphatase checked at 1 year"}, {"letter": "B", "text": "Liver transplantation"}, {"letter": "C", "text": "Pre-operative ERCP with sphincterotomy and stone extraction"}, {"letter": "D", "text": "Treatment of the underlying cause, with corticosteroids for sarcoidosis"}, {"letter": "E", "text": "Prednisone with azathioprine or mycophenolate"}], "answer": "B", "explanation": "Liver transplantation is the treatment for end-stage primary sclerosing cholangitis. ERCP addresses dominant strictures and antibiotics treat cholangitis, but neither alters the course.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C2", "pgroup": "C", "pstack": "B"}, {"id": "67", "group": 67, "stem": "A 46-year-old never-smoker with emphysema has alpha-1 antitrypsin deficiency with a level of 32 mg/dL, a ZZ genotype, and an ALT of 88 U/L. He has no signs of cirrhosis.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Monitoring of the liver, with avoidance of all inhaled exposure"}, {"letter": "B", "text": "Monitoring of the liver only if augmentation therapy is declined"}, {"letter": "C", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "D", "text": "A low-copper diet with D-penicillamine"}, {"letter": "E", "text": "Enzyme augmentation therapy, which will also protect the liver"}], "answer": "A", "explanation": "Management of the liver is monitoring, with smoking cessation and avoidance of exposure — he has never smoked. Enzyme replacement helps the LUNG but does NOT help the liver, so a patient started on augmentation therapy for emphysema still needs hepatic monitoring; assuming the liver is covered is the error. The two organs are often affected separately, so a normal chest does not exclude the liver disease and vice versa.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D3", "pgroup": "D", "pstack": "B"}, {"id": "67A", "group": 67, "stem": "Years later he develops end-stage liver disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Diet and exercise with 5-10% weight loss"}, {"letter": "B", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "C", "text": "A low-copper diet with D-penicillamine, trientine, or zinc acetate"}, {"letter": "D", "text": "Liver transplantation"}, {"letter": "E", "text": "Prednisone 40 mg for induction"}], "answer": "D", "explanation": "Liver transplantation is the treatment for end-stage liver disease from alpha-1 antitrypsin deficiency; augmentation therapy does not alter the hepatic disease.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D3", "pgroup": "D", "pstack": "B"}, {"id": "68", "group": 68, "stem": "A 28-year-old man with acute liver failure after a wild mushroom ingestion has an INR of 3.4, an ammonia of 188 µmol/L, an AST of 8,400 U/L, and an albumin of 4.0 g/dL. He is disoriented with asterixis and hypotensive.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Ward observation with serial liver tests, since the albumin is normal"}, {"letter": "B", "text": "ICU supportive care with N-acetylcysteine, deferring imaging until the ammonia exceeds 200 µmol/L"}, {"letter": "C", "text": "ICU supportive care, withholding N-acetylcysteine because the acetaminophen level is undetectable"}, {"letter": "D", "text": "Ward observation with serial liver tests, since there is no pre-existing liver disease"}, {"letter": "E", "text": "ICU supportive care with N-acetylcysteine and a head CT"}], "answer": "E", "explanation": "Give N-acetylcysteine when in doubt in acute liver failure of unclear cause, without waiting for a level. With an ammonia above 150 µmol/L a head CT is obtained; above 200 or with cerebral edema, nephrology is consulted for vascular access and CRRT to remove ammonia. PT/INR moves in hours to days while albumin takes 2-3 weeks to fall, so a normal albumin does NOT rule out acute liver injury.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E1", "pgroup": "E", "pstack": "B"}, {"id": "68A", "group": 68, "stem": "He now meets referral criteria. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Surgical resection"}, {"letter": "B", "text": "Urgent advanced-liver-center referral with TIPS and anticoagulation"}, {"letter": "C", "text": "Referral to a transplant center"}, {"letter": "D", "text": "Abstinence with early enteral nutrition and vitamin replacement"}, {"letter": "E", "text": "Treating or removing the underlying cause, with surveillance imaging"}], "answer": "C", "explanation": "Referral goes on acute hepatic encephalopathy, shock, renal failure, or an INR above 3 — do NOT focus on the enzyme numbers. Transplant is the only cure and is applicable in about 50% of acute liver failure, with post-transplant survival similar to other liver diseases.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E1", "pgroup": "E", "pstack": "B"}, {"id": "69", "group": 69, "stem": "A 66-year-old woman with recurrent hepatic encephalopathy asks why her ammonia level was checked but not used to make the diagnosis.\n\nWhich of the following is the most appropriate explanation?", "options": [{"letter": "A", "text": "The brain is exposed to gut-derived toxins the liver cannot clear, and ammonia is only one of them"}, {"letter": "B", "text": "The ammonia level is diagnostic only when it exceeds 100 µmol/L"}, {"letter": "C", "text": "The ammonia level is unreliable because lactulose lowers it before symptoms improve"}, {"letter": "D", "text": "The ammonia level reflects the degree of portal hypertension rather than brain exposure"}, {"letter": "E", "text": "The ammonia level is diagnostic only when it is measured in arterial blood"}], "answer": "A", "explanation": "Hepatic encephalopathy results from exposure of the brain to gut-derived toxins the liver cannot clear, with ammonia one important candidate among several — which is why the ammonia level is supportive rather than diagnostic and does not make or exclude the diagnosis. Grading is clinical, by West Haven.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F4", "pgroup": "F", "pstack": "C"}, {"id": "70", "group": 70, "stem": "A 49-year-old woman with cirrhosis has a PaO₂ of 54 mm Hg on room air, a clear chest x-ray, normal right-sided pressures on echocardiography, and bubbles crossing after 5 heartbeats.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Percutaneous closure of an intracardiac shunt"}, {"letter": "B", "text": "Sodium restriction with therapeutic thoracentesis"}, {"letter": "C", "text": "Stopping diuretics and giving IV albumin 25 g of 25% three times daily"}, {"letter": "D", "text": "Pulmonary vasodilator therapy"}, {"letter": "E", "text": "Supplemental oxygen"}], "answer": "E", "explanation": "Treatment of hepatopulmonary syndrome is supplemental oxygen, with liver transplantation definitive. The bubble-study timing is the whole distinction and it is easy to misread: crossing after 4-6 beats is an intrapulmonary shunt, while crossing in under 3 beats suggests an intracardiac shunt, which would be an entirely different pathway. Vasodilator therapy treats portopulmonary hypertension, which has high pressures and a negative bubble study.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G2", "pgroup": "G", "pstack": "B"}, {"id": "70A", "group": 70, "stem": "Her hypoxemia progresses despite treatment. Which of the following is the most appropriate definitive management?", "options": [{"letter": "A", "text": "Empiric cefotaxime 2 g IV every 8 hours"}, {"letter": "B", "text": "Liver transplantation"}, {"letter": "C", "text": "Sodium restriction with spironolactone 100 mg and furosemide 40 mg daily"}, {"letter": "D", "text": "Pulmonary vasodilator therapy"}, {"letter": "E", "text": "Stopping diuretics and giving IV albumin 25 g of 25% three times daily"}], "answer": "B", "explanation": "Liver transplantation is the definitive treatment for hepatopulmonary syndrome.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G2", "pgroup": "G", "pstack": "B"}, {"id": "71", "group": 71, "stem": "A 38-year-old man is given a diagnosis of chronic hepatitis B. His surface antigen is positive, his surface antibody is negative, his core IgG is positive, and his HBV DNA is 42,000 IU/mL with an ALT of 78 U/L. He has no jaundice, spider angiomata, or splenomegaly.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Defer antiviral therapy and give him the hepatitis B vaccine series"}, {"letter": "B", "text": "Refer to a specialist and begin tenofovir only while the surface antibody remains negative"}, {"letter": "C", "text": "Refer to a specialist and begin tenofovir only during periods of elevated viral load"}, {"letter": "D", "text": "Refer to a specialist and begin tenofovir, continued indefinitely"}, {"letter": "E", "text": "Refer to a specialist and begin tenofovir, stopping it once the ALT normalizes"}], "answer": "D", "explanation": "Surface antigen positivity is itself the indication for specialist referral, with tenofovir alafenamide, tenofovir disoproxil fumarate, or entecavir. There is no cure: therapy is daily and indefinite, so stopping when the enzymes normalize is the error. Vaccination is for his non-immune contacts and newborns, not for him.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A1", "pgroup": "A", "pstack": "B"}, {"id": "72", "group": 72, "stem": "A 26-year-old man recovering from drug-induced liver injury asks which products cause this and how long recovery takes.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "Six of the ten leading agents are antibiotics, and cholestatic jaundice resolves within 2-4 weeks"}, {"letter": "B", "text": "Most cases are caused by acetaminophen, and cholestatic jaundice can take 3-12 months to resolve"}, {"letter": "C", "text": "Six of the ten leading agents are antibiotics, and cholestatic jaundice can take 3-12 months to resolve"}, {"letter": "D", "text": "Most cases are caused by herbal supplements, and cholestatic jaundice resolves within 2-4 weeks"}, {"letter": "E", "text": "Most cases are caused by statins, and cholestatic jaundice resolves within 2-4 weeks"}], "answer": "C", "explanation": "Six of the ten top agents are ANTIBIOTICS, with amoxicillin/clavulanate first; more than 600 drugs have been implicated and hepatotoxicity is the most frequent cause of post-marketing withdrawal. Acetaminophen and ethanol cause dose-dependent rather than idiosyncratic injury. Cholestasis and jaundice can take 3-12 months to fully resolve.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B3", "pgroup": "B", "pstack": "C"}, {"id": "73", "group": 73, "stem": "A 63-year-old man with IgG4 cholangiopathy asks what else the disease can involve.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "It can involve the biliary tree, the pancreas, and the colon only"}, {"letter": "B", "text": "It can involve the biliary tree, pancreas, retroperitoneum, lacrimal structures, and central nervous system"}, {"letter": "C", "text": "It can involve the biliary tree and the lungs only"}, {"letter": "D", "text": "It can involve the biliary tree and the pancreas only"}, {"letter": "E", "text": "It is confined to the biliary tree once jaundice appears"}], "answer": "B", "explanation": "Formally classified in 2004, IgG4-related disease deposits IgG4 in tissue across the biliary tree (mimicking sclerosing cholangitis and cholangiocarcinoma), the pancreas, the retroperitoneum, the lacrimal and ophthalmologic structures, and the CNS. Immunosuppression produces a dramatic radiographic response.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C3", "pgroup": "C", "pstack": "C"}, {"id": "74", "group": 74, "stem": "A 54-year-old man with newly diagnosed hereditary hemochromatosis asks about the condition.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "It is autosomal recessive, affects about 1 in 1,000 people, and presents earlier in women than in men"}, {"letter": "B", "text": "It is autosomal dominant, affects about 1 in 140 people, and presents later in women than in men"}, {"letter": "C", "text": "It is autosomal recessive, affects about 1 in 140 people, and presents later in women than in men"}, {"letter": "D", "text": "It is autosomal recessive, affects about 1 in 140 people, and presents later in men than in women"}, {"letter": "E", "text": "It is autosomal recessive, affects about 1 in 50,000 people, and presents later in women than in men"}], "answer": "C", "explanation": "Hereditary hemochromatosis is autosomal recessive on chromosome 6 with a prevalence of about 1 in 140, the most common of the three genetic liver diseases. Women present later than men because of menstrual iron loss. Clinical liver disease is acute in children and chronic in middle age.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D1", "pgroup": "D", "pstack": "C"}, {"id": "75", "group": 75, "stem": "A 67-year-old man with cirrhosis asks how hepatocellular carcinoma is screened for.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Multiphasic contrast CT every 6 months for all cirrhotics"}, {"letter": "B", "text": "Alpha-fetoprotein alone every 6 months for all cirrhotics"}, {"letter": "C", "text": "Liver ultrasound every 6 months only for cirrhotics with viral hepatitis"}, {"letter": "D", "text": "Liver ultrasound every 12 months, with or without an alpha-fetoprotein, for all cirrhotics"}, {"letter": "E", "text": "Liver ultrasound every 6 months, with or without an alpha-fetoprotein, for all cirrhotics"}], "answer": "E", "explanation": "Surveillance is liver ultrasound every 6 months, with or without an alpha-fetoprotein, for ALL cirrhotics. AFP ALONE is not recommended for surveillance because 30-50% of tumors do not produce it. The prevalence of hepatocellular carcinoma in hepatitis B with cirrhosis is about 10%, and hepatitis B can cause it WITHOUT cirrhosis.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E3", "pgroup": "E", "pstack": "C"}, {"id": "76", "group": 76, "stem": "A 62-year-old woman with cirrhosis has new ascites. Her SAAG is 1.8 g/dL, her ascitic total protein is 1.4 g/dL, her ascitic PMN count is 60/mm³, and the culture is negative. She takes antihypertensives.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction below 2 g daily with spironolactone 100 mg and furosemide 40 mg daily"}, {"letter": "B", "text": "Sodium restriction below 2 g daily with spironolactone and furosemide, and a repeat SAAG at the next tap"}, {"letter": "C", "text": "Serial large-volume paracentesis with albumin replacement"}, {"letter": "D", "text": "Free water restriction alone, with a repeat SAAG at the next tap"}, {"letter": "E", "text": "Sodium restriction below 2 g daily with spironolactone al // Reshuffle-on-load for a Clinical Vignette practice exam.
//
// Injected copy, adapted from clinical-vignette-exam/assets/shuffle.js.
// CHANGE FROM THE SKILL ASSET: the original searched for a legal order by
// random restart, capped at 4,000 attempts, and silently fell back to the
// built order when it could not separate all group-mates. With 84 stacks in
// 7 groups that fallback fired on nearly every load, so the exam opened in
// the same order every time. The random restart is replaced below by a
// constructive greedy group-interleave that always satisfies constraint 1,
// with a bounded random-restart pass kept only as a first try.
//
// Requires three extra fields on every question, written by the exam build:
//   pcase   the case id from the case file, e.g. "A3"
//   pgroup  the differential group letter, e.g. "A"
//   pstack  "A" recognition | "B" management safety | "C" counseling
//
// Constraints preserved on every shuffle:
//   1. no two consecutive stacks share a differential group
//   2. a patient's Stack A precedes their Stack B, which precedes their Stack C
//   3. follow-up nodes never leave their parent
(function reshuffleExam() {
  var qs = EXAM_DATA.questions;
  if (!qs || !qs.length || !qs[0].pcase) return;   // metadata absent: leave order alone

  // ---- collect stacks, parent first ----------------------------------------
  var map = {}, order = [];
  qs.forEach(function (q) {
    if (!map[q.group]) { map[q.group] = []; order.push(q.group); }
    map[q.group].push(q);
  });
  var stacks = order.map(function (g) {
    return { qs: map[g], pcase: map[g][0].pcase, pgroup: map[g][0].pgroup, pstack: map[g][0].pstack };
  });
  if (stacks.length < 3) return;

  var RANK = { A: 0, B: 1, C: 2 };

  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }

  // Reorder one case's stacks into A->B->C at whatever positions that case holds,
  // leaving every other position as the shuffle left it. Because a case's stacks
  // all belong to one group, this never changes the group at any position, so it
  // cannot break the no-adjacent-group constraint.
  function repairCaseOrder(seq) {
    var pend = {}, idx = {};
    seq.forEach(function (s) { (pend[s.pcase] = pend[s.pcase] || []).push(s); });
    Object.keys(pend).forEach(function (c) {
      pend[c].sort(function (x, y) { return RANK[x.pstack] - RANK[y.pstack]; });
      idx[c] = 0;
    });
    return seq.map(function (s) { return pend[s.pcase][idx[s.pcase]++]; });
  }

  function groupsAdjacent(seq) {
    for (var i = 0; i < seq.length - 1; i++) {
      if (seq[i].pgroup === seq[i + 1].pgroup) return true;
    }
    return false;
  }

  // Constructive greedy interleave: at each step take a stack from the group
  // with the most remaining that is not the group just placed. Ties are broken
  // at random and the stack itself is drawn at random, so the order differs on
  // every load while constraint 1 holds by construction.
  function greedyInterleave(all) {
    var buckets = {}, keys = [];
    all.forEach(function (s) {
      if (!buckets[s.pgroup]) { buckets[s.pgroup] = []; keys.push(s.pgroup); }
      buckets[s.pgroup].push(s);
    });
    keys.forEach(function (k) { buckets[k] = shuffled(buckets[k]); });
    var out = [], last = null, n = all.length;
    for (var step = 0; step < n; step++) {
      var cands = keys.filter(function (k) { return buckets[k].length && k !== last; });
      if (!cands.length) cands = keys.filter(function (k) { return buckets[k].length; });
      if (!cands.length) break;
      var best = -1;
      cands.forEach(function (k) { if (buckets[k].length > best) best = buckets[k].length; });
      var tied = shuffled(cands.filter(function (k) { return buckets[k].length === best; }));
      var g = tied[0];
      out.push(buckets[g].pop());
      last = g;
    }
    return out;
  }

  var seq = null;
  for (var attempt = 0; attempt < 200; attempt++) {
    var cand = repairCaseOrder(shuffled(stacks));
    if (!groupsAdjacent(cand)) { seq = cand; break; }
  }
  if (!seq) {
    for (var g2 = 0; g2 < 50; g2++) {
      var built = repairCaseOrder(greedyInterleave(stacks));
      if (built.length === stacks.length && !groupsAdjacent(built)) { seq = built; break; }
    }
  }
  if (!seq) return;   // could not satisfy the constraints: keep the built order

  // ---- shuffle the options inside each question ----------------------------
  var LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  seq.forEach(function (s) {
    s.qs.forEach(function (q) {
      if (!q.options || q.options.length < 2) return;
      var keyText = null;
      q.options.forEach(function (o) { if (o.letter === q.answer) keyText = o.text; });
      var texts = shuffled(q.options.map(function (o) { return o.text; }));
      q.options = texts.map(function (t, i) { return { letter: LET[i], text: t }; });
      for (var i = 0; i < q.options.length; i++) {
        if (q.options[i].text === keyText) { q.answer = q.options[i].letter; break; }
      }
    });
  });

  // ---- renumber and write the new order back ------------------------------
  var out = [];
  seq.forEach(function (s, i) {
    var n = i + 1;
    s.qs.forEach(function (q, j) {
      q.group = n;
      q.id = j === 0 ? String(n) : String(n) + LET[j - 1];
      out.push(q);
    });
  });
  EXAM_DATA.questions = out;
})();


(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
