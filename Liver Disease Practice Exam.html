h an echocardiogram with Doppler and bubble study"}, {"letter": "C", "text": "Right heart catheterization"}, {"letter": "D", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}, {"letter": "E", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}], "answer": "B", "explanation": "ANY cirrhotic with shortness of breath gets a chest x-ray plus an echocardiogram with Doppler and bubble study, to look for hepatopulmonary syndrome, portopulmonary hypertension, and hepatohydrothorax together — ordering only one of the three misses the other two.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G2", "pgroup": "G", "pstack": "A"}, {"id": "21A", "group": 21, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A clear chest x-ray with hypoxemia and bubbles crossing after 4-6 heartbeats"}, {"letter": "B", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}, {"letter": "C", "text": "An ascitic PMN count at or above 250/mm³ or a positive culture, with a rising creatinine"}, {"letter": "D", "text": "A transudative, usually right-sided pleural effusion in a cirrhotic with ascites"}, {"letter": "E", "text": "Elevated right-sided heart pressures on echocardiography with a negative bubble study"}], "answer": "A", "explanation": "Her chest x-ray is clear with no effusion, infiltrate, or cardiomegaly, her PaO₂ is 54 mm Hg on room air, and the echo bubble study is positive with bubbles crossing after 5 heartbeats — an intrapulmonary rather than intracardiac shunt. Right-sided pressures are normal, so this is not portopulmonary hypertension.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G2", "pgroup": "G", "pstack": "A"}, {"id": "21B", "group": 21, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Portopulmonary hypertension"}, {"letter": "B", "text": "Hepatohydrothorax"}, {"letter": "C", "text": "Spontaneous bacterial peritonitis"}, {"letter": "D", "text": "Hepatorenal syndrome"}, {"letter": "E", "text": "Hepatopulmonary syndrome"}], "answer": "E", "explanation": "Hypoxemia with platypnea, clubbing, clear lungs, and late bubble crossing is hepatopulmonary syndrome. Bubbles crossing after 4-6 beats mean shunting in the LUNGS, while immediate crossing in under 3 beats suggests an intracardiac shunt — calling an intracardiac shunt hepatopulmonary syndrome sends the patient down the wrong pathway entirely.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G2", "pgroup": "G", "pstack": "A"}, {"id": "22", "group": 22, "stem": "A 52-year-old man with type 2 diabetes and a body mass index of 36 has metabolic dysfunction-associated steatotic liver disease. His FIB-4 is 1.9 and transient elastography shows stage F3 fibrosis at 11.2 kPa. He has begun diet and exercise and has stopped all alcohol and non-prescribed supplements.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Withhold resmetirom and repeat the FIB-4 in 6 months"}, {"letter": "B", "text": "Begin resmetirom only if the elastogram falls back to stage F0-F1"}, {"letter": "C", "text": "Withhold resmetirom and begin gemfibrozil for his dyslipidemia"}, {"letter": "D", "text": "Begin resmetirom now"}, {"letter": "E", "text": "Begin resmetirom only if the elastogram progresses to stage F4"}], "answer": "D", "explanation": "Resmetirom, a THR-β partial agonist, is indicated for F2/F3 fibrosis ONLY — not F0-F1 and not cirrhosis — so stage F3 qualifies him now. Gemfibrozil must be avoided entirely with resmetirom, as must cyclosporine, and statins and clopidogrel require dose caps. Noninvasive tests work best at the extremes and cannot separate intermediate stages, which is why his FIB-4 of 1.9 needed the elastogram.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A3", "pgroup": "A", "pstack": "B"}, {"id": "22A", "group": 22, "stem": "Years later, repeat elastography shows stage F4 fibrosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Abstinence with counseling and naltrexone 50 mg daily"}, {"letter": "B", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "C", "text": "Clinical trial enrollment with standard cirrhosis management"}, {"letter": "D", "text": "Monitoring with smoking cessation"}, {"letter": "E", "text": "Specialist referral with tenofovir or entecavir"}], "answer": "C", "explanation": "F4 on elastography is cirrhosis, at which point resmetirom is no longer indicated. Management becomes standard cirrhosis care with consideration of a clinical trial.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A3", "pgroup": "A", "pstack": "B"}, {"id": "23", "group": 23, "stem": "A 34-year-old woman comes to the emergency department with a day of nausea and vomiting and right upper quadrant pain, and has become confused over the past few hours. She has had influenza for five days and has been taking multiple combination cold-and-flu products alongside extra-strength acetaminophen for fever and body aches, without realizing that several of them contained acetaminophen — an estimated 9-11 g daily for four days. Her temperature is 37.6°C (99.7°F), blood pressure is 104/62 mm Hg, pulse is 108/min, respirations are 20/min, and oxygen saturation is 97% on room air. Examination shows jaundice with scleral icterus, disorientation to place with asterixis, and right upper quadrant tenderness.\n\nCreatinine: 1.8 mg/dL\nAmmonia: 118 µmol/L\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "A serum acetaminophen level with AST and ALT, INR, and bilirubin"}, {"letter": "B", "text": "A complete metabolic panel with bilirubin, PT/INR, and a complete blood count"}, {"letter": "C", "text": "AST and ALT with ANA, anti-smooth muscle antibody, and serum IgG"}, {"letter": "D", "text": "Ceruloplasmin with a 24-hour urinary copper and a slit-lamp examination"}, {"letter": "E", "text": "AST, ALT, alkaline phosphatase, and bilirubin with an INR and a serologic workup"}], "answer": "A", "explanation": "Five days of influenza treated with multiple combination cold-and-flu products alongside extra-strength acetaminophen, now with vomiting, jaundice, and confusion, calls for an acetaminophen level with transaminases, an INR, and a bilirubin. The antidote is time-critical, so the level is sent with the panel rather than after it.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B4", "pgroup": "B", "pstack": "A"}, {"id": "23A", "group": 23, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An AST greater than the ALT with neither above 400 IU/L, with hyperbilirubinemia and leukocytosis"}, {"letter": "B", "text": "A detectable drug level with an AST and ALT in the thousands"}, {"letter": "C", "text": "A mixed hepatocellular and cholestatic pattern with a temporal relationship to a drug"}, {"letter": "D", "text": "A ceruloplasmin under 20 mg/dL with a high urinary copper and Kayser-Fleischer rings"}, {"letter": "E", "text": "Transaminases above 1,000 U/L with a positive anti-smooth muscle antibody and a raised IgG"}], "answer": "B", "explanation": "Her acetaminophen level is 22 mcg/mL with an AST of 6,840 U/L and an ALT of 5,120 U/L — more than 15 times the upper limit of normal, which indicates toxic (or viral) necrosis. The INR is rising at 2.6 and the bilirubin at 5.2 mg/dL.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B4", "pgroup": "B", "pstack": "A"}, {"id": "23B", "group": 23, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Drug-induced liver injury"}, {"letter": "B", "text": "Wilson's disease"}, {"letter": "C", "text": "Autoimmune hepatitis"}, {"letter": "D", "text": "Acetaminophen hepatotoxicity"}, {"letter": "E", "text": "Acute alcohol-related hepatitis"}], "answer": "D", "explanation": "Chronic supratherapeutic acetaminophen use rather than a single ingestion, with a detectable level and transaminases in the thousands, is acetaminophen hepatotoxicity. Acetaminophen is the most common cause of acute liver failure in the US. Alcohol-related hepatitis would keep the AST under 400, and an idiosyncratic drug injury would show a normal INR.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B4", "pgroup": "B", "pstack": "A"}, {"id": "24", "group": 24, "stem": "A 56-year-old woman has primary biliary cholangitis. Her alkaline phosphatase is 612 U/L, her anti-mitochondrial antibody is positive, her IgM is elevated, and her total bilirubin is 1.1 mg/dL.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Topical therapy for the pruritus, with liver tests rechecked at 1 year"}, {"letter": "B", "text": "Ursodeoxycholic acid 12-15 mg/kg, with a liver biopsy at 1 year"}, {"letter": "C", "text": "Ursodeoxycholic acid 12-15 mg/kg, with the anti-mitochondrial antibody titer rechecked at 1 year"}, {"letter": "D", "text": "Ursodeoxycholic acid 12-15 mg/kg, with the alkaline phosphatase rechecked only if symptoms worsen"}, {"letter": "E", "text": "Ursodeoxycholic acid 12-15 mg/kg, with the alkaline phosphatase rechecked at 1 year"}], "answer": "E", "explanation": "Ursodeoxycholic acid 12-15 mg/kg is first-line, and the 1-year alkaline phosphatase is a decision point rather than a routine recheck: the goal is below 180 and preferably normal, and leaving a patient on ursodeoxycholic acid alone with a persistently high alkaline phosphatase is the error. Symptom severity does NOT correlate with disease severity, so the itch neither grades the disease nor governs the recheck — but it may incapacitate her and is treated on its own terms.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C1", "pgroup": "C", "pstack": "B"}, {"id": "24A", "group": 24, "stem": "One year later her alkaline phosphatase has not normalized and her itching remains refractory. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Supportive care with ERCP as needed for dominant strictures"}, {"letter": "B", "text": "Pre-operative ERCP with sphincterotomy and stone extraction"}, {"letter": "C", "text": "Elafibranor or seladelpar"}, {"letter": "D", "text": "Treatment of the underlying cause, with corticosteroids for sarcoidosis"}, {"letter": "E", "text": "Prednisone with azathioprine or mycophenolate"}], "answer": "C", "explanation": "The second-line agent is indicated if the alkaline phosphatase fails to normalize after 6-12 months OR the itching is refractory. Elafibranor and seladelpar also help the pruritus.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C1", "pgroup": "C", "pstack": "B"}, {"id": "25", "group": 25, "stem": "A 33-year-old woman comes to the emergency department with 10 days of acute abdominal pain and ascites: a dull, constant right upper quadrant ache with rapidly increasing abdominal distension. Her partner noticed jaundice. She was diagnosed with a myeloproliferative disorder with a JAK2 mutation 2 years ago, had a prior deep vein thrombosis, and takes a combined oral contraceptive. Her temperature is 37.4°C (99.3°F), blood pressure is 108/66 mm Hg, pulse is 102/min, respirations are 18/min, and oxygen saturation is 97% on room air. Examination shows tender hepatomegaly with the liver edge 6 cm below the costal margin and marked tenderness on palpation, ascites with shifting dullness and a fluid wave, and jaundice; there is no splenomegaly and no caput medusae.\n\nAST: 486 U/L\nALT: 512 U/L\nTotal bilirubin: 4.2 mg/dL\nINR: 1.7\nAlbumin: 3.2 g/dL\nPlatelets: 512,000/mm³\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Serum alpha-1 antitrypsin level with liver function tests"}, {"letter": "B", "text": "Doppler ultrasound of the liver with triple-phase CT and liver function tests"}, {"letter": "C", "text": "AST and ALT with ANA, anti-smooth muscle antibody, and serum IgG"}, {"letter": "D", "text": "Ceruloplasmin with a 24-hour urinary copper and a slit-lamp examination"}, {"letter": "E", "text": "Transferrin saturation with ferritin and liver function tests"}], "answer": "B", "explanation": "Any patient with newly elevated liver tests gets an ultrasound looking for patent vasculature, bile duct obstruction or dilation, masses, signs of cirrhosis, and steatosis — and acute painful hepatomegaly with new ascites in a thrombophilic young woman makes a Doppler study with triple-phase CT the priority.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D4", "pgroup": "D", "pstack": "A"}, {"id": "25A", "group": 25, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A transferrin saturation above 45% with a ferritin above 300 ng/mL and elevated transaminases"}, {"letter": "B", "text": "A low alpha-1 antitrypsin level with elevated transaminases"}, {"letter": "C", "text": "A ceruloplasmin under 20 mg/dL with a high urinary copper and Kayser-Fleischer rings"}, {"letter": "D", "text": "Hepatic venous outflow obstruction with absent hepatic veins or hepatic vein thrombus"}, {"letter": "E", "text": "Transaminases above 1,000 U/L with a positive anti-smooth muscle antibody and a raised IgG"}], "answer": "D", "explanation": "Doppler shows absent flow in the hepatic veins with visible thrombus, and triple-phase CT shows hepatomegaly with heterogeneous enhancement and ascites. This is the vascular cause of acute liver failure.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D4", "pgroup": "D", "pstack": "A"}, {"id": "25B", "group": 25, "stem": "Which of the following tests would most directly confirm the diagnosis if the non-invasive imaging were inconclusive?", "options": [{"letter": "A", "text": "Alpha-1 antitrypsin genotype or phenotype testing"}, {"letter": "B", "text": "Liver biopsy"}, {"letter": "C", "text": "Direct venography"}, {"letter": "D", "text": "ATP7B genetic testing"}, {"letter": "E", "text": "HFE gene testing for C282Y, H63D, and S65C"}], "answer": "C", "explanation": "Direct venography is used when non-invasive imaging is inconclusive and demonstrates obstructed hepatic venous outflow.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D4", "pgroup": "D", "pstack": "A"}, {"id": "25C", "group": 25, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Autoimmune hepatitis"}, {"letter": "B", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "C", "text": "Wilson's disease"}, {"letter": "D", "text": "Hereditary hemochromatosis"}, {"letter": "E", "text": "Budd-Chiari syndrome"}], "answer": "E", "explanation": "Acute painful hepatomegaly with new ascites and thrombosed hepatic veins in a hypercoagulable young woman is Budd-Chiari syndrome, in contrast to the chronic, painless enzyme abnormalities traced to iron, copper, or a protein deficiency.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D4", "pgroup": "D", "pstack": "A"}, {"id": "26", "group": 26, "stem": "A 50-year-old woman is seen in the hepatology clinic. She has had three admissions in 6 months for recurrent ascites requiring paracentesis, one episode of hepatic encephalopathy, and a variceal bleed, with refractory complications despite maximal diuretics. She has alcohol-related cirrhosis with 3 years of abstinence and has had no acute liver failure; there was no hepatocellular carcinoma on her most recent imaging. Her temperature is 36.8°C (98.2°F), blood pressure is 100/62 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 96% on room air. Examination shows ascites with bulging flanks and shifting dullness, asterixis on the current visit, jaundice with scleral icterus, muscle wasting, and spider angiomata.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "A MELD 3.0 score with liver imaging and transplant center evaluation"}, {"letter": "B", "text": "An INR and ammonia with an acetaminophen level, viral serologies, and Doppler ultrasound"}, {"letter": "C", "text": "A complete blood count, metabolic panel, INR, and albumin with a liver ultrasound and transient elastography"}, {"letter": "D", "text": "Multiphasic contrast CT or MRI of the liver with an alpha-fetoprotein"}, {"letter": "E", "text": "Doppler ultrasound of the liver with triple-phase CT and liver function tests"}], "answer": "A", "explanation": "Three admissions in 6 months for recurrent ascites, one episode of encephalopathy, and a variceal bleed, all refractory to maximal diuretics, is a decompensating course. The assessment is a MELD 3.0 score with liver imaging for hepatocellular carcinoma and transplant center evaluation.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E4", "pgroup": "E", "pstack": "A"}, {"id": "26A", "group": 26, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Platelets below 150,000/mm³ with a raised INR, a low albumin, and a nodular liver"}, {"letter": "B", "text": "A MELD 3.0 score at or above 15 with a decompensation history"}, {"letter": "C", "text": "Hepatic venous outflow obstruction with absent hepatic veins or hepatic vein thrombus"}, {"letter": "D", "text": "Arterial enhancement with venous washout in a lesion above 1 cm in a cirrhotic"}, {"letter": "E", "text": "Severe acute liver injury with an INR above 1.5 and hepatic encephalopathy in a previously healthy liver"}], "answer": "B", "explanation": "Her MELD 3.0 is 24 — at or above 15, so transplant evaluation is indicated — with a total bilirubin of 5.2 mg/dL, an INR of 2.0, a creatinine of 1.6 mg/dL, a sodium of 128 mEq/L, and an albumin of 2.6 g/dL. She is Child-Pugh class C, and multiphasic imaging shows no LR-5 lesion.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E4", "pgroup": "E", "pstack": "A"}, {"id": "26B", "group": 26, "stem": "Which of the following best describes this patient's status?", "options": [{"letter": "A", "text": "Acute alcohol-related hepatitis"}, {"letter": "B", "text": "Acute liver failure"}, {"letter": "C", "text": "Hepatocellular carcinoma"}, {"letter": "D", "text": "Decompensated cirrhosis with a MELD at or above 15"}, {"letter": "E", "text": "Budd-Chiari syndrome"}], "answer": "D", "explanation": "Multiple decompensating events with a MELD 3.0 of 24 and Child-Pugh class C, with no tumor on imaging, define decompensated cirrhosis warranting transplant referral. MELD predicts roughly 3-month mortality and ranges from 6 to 40.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E4", "pgroup": "E", "pstack": "A"}, {"id": "27", "group": 27, "stem": "A 66-year-old woman is brought to the emergency department because over 4 days she has become slower and has reversed her sleep-wake cycle, sleeping through the day and awake at night; today she is somnolent and hard to rouse for conversation. She has known cirrhosis from hepatitis C with a TIPS placed 8 months ago for refractory ascites, and she missed her lactulose doses for the past week because she disliked the diarrhea. Her temperature is 36.9°C (98.4°F), blood pressure is 112/68 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 97% on room air. Examination shows slurred speech and altered mental status — she is drowsy and disoriented to time — with jaundice and ascites; there is no focal neurologic deficit and no meningismus.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}, {"letter": "B", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}, {"letter": "C", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}, {"letter": "D", "text": "Upper endoscopy with a complete blood count and type and cross"}, {"letter": "E", "text": "Clinical diagnosis with West Haven grading and a search for precipitants"}], "answer": "E", "explanation": "A non-agitated confusional syndrome with a reversed sleep-wake cycle in a cirrhotic is a clinical diagnosis, graded by West Haven, and the work is the search for precipitants: a blood count, metabolic panel, cultures, and a paracentesis. An ammonia level is supportive only.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F4", "pgroup": "F", "pstack": "A"}, {"id": "27A", "group": 27, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An ascitic PMN count at or above 250/mm³ with a positive culture and a rising creatinine"}, {"letter": "B", "text": "Esophageal or gastric fundal varices with a red wale sign, and anemia"}, {"letter": "C", "text": "Confusion with asterixis in a cirrhotic, with an identified precipitant"}, {"letter": "D", "text": "A SAAG at or above 1.1 g/dL with a low ascitic total protein and PMNs under 250/mm³"}, {"letter": "E", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}], "answer": "C", "explanation": "She has asterixis with the arms extended, which with confusion in a cirrhotic is the diagnosis; by West Haven this is grade III (marked confusion and somnolent). Her ammonia is 96 µmol/L, her sodium 129 mEq/L and potassium 3.1 mEq/L from over-diuresis, with a paracentesis PMN of 40/mm³, negative cultures, no melena, and no new sedating medication — so dehydration, electrolyte disturbance, and missed lactulose are the precipitants.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F4", "pgroup": "F", "pstack": "A"}, {"id": "27B", "group": 27, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hepatic encephalopathy"}, {"letter": "B", "text": "Spontaneous bacterial peritonitis"}, {"letter": "C", "text": "Ascites"}, {"letter": "D", "text": "Bleeding gastroesophageal varices from portal hypertension"}, {"letter": "E", "text": "Hepatorenal syndrome"}], "answer": "A", "explanation": "Confusion with asterixis in a cirrhotic with an identified precipitant is hepatic encephalopathy. A negative paracentesis excludes spontaneous bacterial peritonitis, and TIPS increases the risk of encephalopathy, so her shunt is part of the substrate rather than incidental history.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F4", "pgroup": "F", "pstack": "A"}, {"id": "28", "group": 28, "stem": "A 64-year-old woman with cirrhosis and ascites has a large right-sided pleural effusion. Thoracentesis returns a transudate with a protein of 1.2 g/dL against a serum protein of 5.8 g/dL, an LDH of 78 U/L, a nucleated cell count of 90/mm³, and a negative culture. The bubble study is negative and right heart pressures are normal. This is her third effusion in a year.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supplemental oxygen alone"}, {"letter": "B", "text": "Chest tube drainage with pleurodesis"}, {"letter": "C", "text": "Empiric antibiotics with therapeutic thoracentesis"}, {"letter": "D", "text": "Chest tube drainage with sodium restriction"}, {"letter": "E", "text": "Sodium restriction with therapeutic thoracentesis, spironolactone, and furosemide"}], "answer": "E", "explanation": "Hepatohydrothorax is managed the same as ascites: sodium restriction, therapeutic thoracentesis, and spironolactone with furosemide. AVOID chest tubes — they cause massive protein and fluid loss and infection. A recurrent transudative effusion in a cirrhotic invites a drain, and that is precisely the wrong move.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G4", "pgroup": "G", "pstack": "B"}, {"id": "28A", "group": 28, "stem": "Her effusion recurs despite maximal medical therapy. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Empiric cefotaxime 2 g IV every 8 hours"}, {"letter": "B", "text": "Supplemental oxygen"}, {"letter": "C", "text": "Transjugular intrahepatic portosystemic shunt"}, {"letter": "D", "text": "Pulmonary vasodilator therapy"}, {"letter": "E", "text": "Stopping diuretics and giving IV albumin 25 g of 25% three times daily"}], "answer": "C", "explanation": "Hepatohydrothorax is more difficult to resolve than abdominal ascites, and patients often need TIPS or liver transplant, so repeated taps alone are not a durable plan.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G4", "pgroup": "G", "pstack": "B"}, {"id": "29", "group": 29, "stem": "A 61-year-old woman comes to the primary care clinic for a routine visit. She feels well apart from mild fatigue, and abnormal liver tests were found on a screening panel. She used injection drugs in her twenties and stopped decades ago, received a blood transfusion in 1985, and has several tattoos. She does not drink alcohol and has no known liver disease. Her temperature is 36.6°C (97.9°F), blood pressure is 124/76 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. Examination is normal, with no jaundice, no spider angiomata, no palmar erythema, no splenomegaly, and no ascites.\n\nALT: 84 U/L\nAST: 68 U/L\nPlatelets: 186,000/mm³\nAlbumin: 4.0 g/dL\nTotal bilirubin: 0.8 mg/dL\nINR: 1.0\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "AST and ALT with GGT and a serum phosphatidylethanol level"}, {"letter": "B", "text": "AST and ALT with a liver ultrasound and a serologic workup for other causes"}, {"letter": "C", "text": "Hepatitis B surface antigen with surface antibody and core antibody IgG"}, {"letter": "D", "text": "Hepatitis C antibody with an HCV viral load by PCR and genotype"}, {"letter": "E", "text": "Transferrin saturation with ferritin and liver function tests"}], "answer": "D", "explanation": "A screening panel showing abnormal liver tests in a patient with remote injection drug use, a 1985 transfusion, and tattoos calls for the hepatitis C antibody, which is the screening test. Chronic hepatitis C affects about 0.9% of Americans and remains one of the three leading US causes of cirrhosis.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A2", "pgroup": "A", "pstack": "A"}, {"id": "29A", "group": 29, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A positive antibody with detectable viral RNA"}, {"letter": "B", "text": "A positive surface antigen with a negative surface antibody and a detectable viral load"}, {"letter": "C", "text": "An AST/ALT ratio below 1 with steatosis on imaging and other causes excluded"}, {"letter": "D", "text": "A transferrin saturation above 45% with a ferritin above 300 ng/mL"}, {"letter": "E", "text": "An AST:ALT ratio above 2 with an elevated GGT and a positive phosphatidylethanol level"}], "answer": "A", "explanation": "The antibody marks exposure; only a detectable viral load proves active infection. Hers is 1.8 million IU/mL, genotype 1a. FibroScan at 6.4 kPa places her at F0-F1 without cirrhosis.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A2", "pgroup": "A", "pstack": "A"}, {"id": "29B", "group": 29, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Metabolic dysfunction-associated steatotic liver disease"}, {"letter": "B", "text": "Chronic hepatitis C"}, {"letter": "C", "text": "Alcohol-related liver disease"}, {"letter": "D", "text": "Hereditary hemochromatosis"}, {"letter": "E", "text": "Chronic hepatitis B"}], "answer": "B", "explanation": "A positive hepatitis C antibody with detectable RNA in a former injection drug user is chronic hepatitis C. Hepatitis B would show a positive surface antigen, alcohol-related disease an AST:ALT ratio above 2 with a positive phosphatidylethanol, and steatotic liver disease a metabolic phenotype with fat on imaging.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A2", "pgroup": "A", "pstack": "A"}, {"id": "30", "group": 30, "stem": "A 34-year-old woman has acetaminophen hepatotoxicity after taking an estimated 9-11 g daily for four days in combination cold-and-flu products. Her acetaminophen level is 22 mcg/mL, her AST is 6,840 U/L, her INR is 2.6, and she has asterixis.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Stop all acetaminophen and observe, since the ingestion was not a single overdose"}, {"letter": "B", "text": "Stop all acetaminophen and start N-acetylcysteine only if the INR exceeds 3"}, {"letter": "C", "text": "Stop all acetaminophen and start N-acetylcysteine only if the level rises further"}, {"letter": "D", "text": "Reduce acetaminophen to 2 g daily and start N-acetylcysteine"}, {"letter": "E", "text": "Stop all acetaminophen and start N-acetylcysteine now"}], "answer": "E", "explanation": "N-acetylcysteine is the antidote and is given as soon as possible — give it when in doubt in acute liver failure of unclear cause, rather than waiting for a level to confirm. It is continued until the INR is under 1.5 and the enzymes are downtrending below 1,000. Toxicity is likely above 10 g in 24 hours, which she reached through combination products without a single overdose.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B4", "pgroup": "B", "pstack": "B"}, {"id": "30A", "group": 30, "stem": "Her INR continues to rise despite therapy. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Prednisone 40 mg for induction"}, {"letter": "B", "text": "Applying the King's College Criteria and referring to a transplant center"}, {"letter": "C", "text": "Stopping the drug and taking no non-prescribed supplements"}, {"letter": "D", "text": "Abstinence with early enteral nutrition and vitamin replacement"}, {"letter": "E", "text": "A low-copper diet with D-penicillamine"}], "answer": "B", "explanation": "Escalation in acetaminophen hepatotoxicity is by the King's College Criteria, followed by transplant center referral.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B4", "pgroup": "B", "pstack": "B"}, {"id": "31", "group": 31, "stem": "A 41-year-old woman with hepatic granulomas asks what a granuloma actually is.\n\nWhich of the following best describes what a granuloma is?", "options": [{"letter": "A", "text": "A central accumulation of fibroblasts with peripheral macrophages and neutrophils"}, {"letter": "B", "text": "A central accumulation of plasma cells with peripheral lymphocytes and eosinophils"}, {"letter": "C", "text": "A central accumulation of lymphocytes with peripheral plasma cells and neutrophils"}, {"letter": "D", "text": "A central accumulation of mononuclear cells and macrophages with peripheral lymphocytes and fibroblasts"}, {"letter": "E", "text": "A central accumulation of neutrophils with peripheral macrophages and fibroblasts"}], "answer": "D", "explanation": "A granuloma is a central accumulation of mononuclear cells and macrophages with peripheral lymphocytes and fibroblasts. It forms when the body cannot clear an irritant, so it “boxes it in” with inflammation and scar.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C4", "pgroup": "C", "pstack": "C"}, {"id": "32", "group": 32, "stem": "A 33-year-old woman with a JAK2-mutated myeloproliferative disorder has new ascites and tender hepatomegaly, and Doppler ultrasound shows absent flow in the hepatic veins with visible thrombus.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Urgent referral to an advanced liver center for TIPS, with anticoagulation"}, {"letter": "B", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "C", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "D", "text": "A low-copper diet with D-penicillamine"}, {"letter": "E", "text": "Monitoring with smoking cessation"}], "answer": "A", "explanation": "This is the vascular cause of acute liver failure, and the management is restoring flow with TIPS (or transplant) plus anticoagulation, rather than supportive care alone. Treating new ascites in a young woman as ordinary cirrhotic ascites and diuresing her is the error, because the outflow obstruction is correctable.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D4", "pgroup": "D", "pstack": "B"}, {"id": "32A", "group": 32, "stem": "Despite intervention she develops acute liver failure. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Diet and exercise with 5-10% weight loss"}, {"letter": "B", "text": "Monitoring with smoking cessation"}, {"letter": "C", "text": "Liver transplantation"}, {"letter": "D", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "E", "text": "Prednisone 40 mg for induction"}], "answer": "C", "explanation": "Liver transplantation is the treatment for Budd-Chiari syndrome that progresses to acute liver failure or cirrhosis.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D4", "pgroup": "D", "pstack": "B"}, {"id": "33", "group": 33, "stem": "A 28-year-old man is brought to the emergency department by his brother two days after they foraged and ate wild mushrooms. He vomited repeatedly on the first day, felt better yesterday, and today became jaundiced and progressively confused, with easy bruising and gum bleeding. He has never had liver disease and has taken no acetaminophen, alcohol, prescription drugs, or supplements. His temperature is 37.1°C (98.8°F), blood pressure is 96/58 mm Hg, pulse is 112/min, respirations are 22/min, and oxygen saturation is 96% on room air. Examination shows asterixis with disorientation to time and place, jaundice, and hypotension, with no stigmata of chronic liver disease: no spider angiomata, no palmar erythema, no caput medusae, and no splenomegaly.\n\nAST: 8,400 U/L\nALT: 6,900 U/L\nTotal bilirubin: 9.8 mg/dL\nCreatinine: 2.2 mg/dL\nAlbumin: 4.0 g/dL\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Doppler ultrasound of the liver with triple-phase CT and liver function tests"}, {"letter": "B", "text": "A complete blood count, metabolic panel, INR, and albumin with a liver ultrasound and transient elastography"}, {"letter": "C", "text": "A MELD 3.0 score with liver imaging and transplant center evaluation"}, {"letter": "D", "text": "An INR and ammonia with an acetaminophen level, viral serologies, and Doppler ultrasound"}, {"letter": "E", "text": "Multiphasic contrast CT or MRI of the liver with an alpha-fetoprotein"}], "answer": "D", "explanation": "Jaundice then confusion two days after a wild mushroom ingestion, in a man with no pre-existing liver disease, calls for an INR and ammonia with an acetaminophen level, viral serologies, an autoimmune workup, and a Doppler ultrasound. The INR and the encephalopathy define the syndrome; the etiology screen runs alongside.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E1", "pgroup": "E", "pstack": "A"}, {"id": "33A", "group": 33, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Platelets below 150,000/mm³ with a raised INR, a low albumin, and a nodular liver"}, {"letter": "B", "text": "Severe acute liver injury with an INR above 1.5 and hepatic encephalopathy in a previously healthy liver"}, {"letter": "C", "text": "Hepatic venous outflow obstruction with absent hepatic veins or hepatic vein thrombus"}, {"letter": "D", "text": "Arterial enhancement with venous washout in a lesion above 1 cm in a cirrhotic"}, {"letter": "E", "text": "A MELD 3.0 score at or above 15 with a decompensation history"}], "answer": "B", "explanation": "His INR is 3.4 and his ammonia is 188 µmol/L. Severe acute liver injury with an INR above 1.5 plus hepatic encephalopathy, in a previously healthy liver and within 26 weeks, is the definition. The acetaminophen level is undetectable, viral serologies and autoantibodies negative, and Doppler shows patent hepatic vasculature, excluding Budd-Chiari.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E1", "pgroup": "E", "pstack": "A"}, {"id": "33B", "group": 33, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Acute liver failure"}, {"letter": "B", "text": "Budd-Chiari syndrome"}, {"letter": "C", "text": "Hepatocellular carcinoma"}, {"letter": "D", "text": "Cirrhosis"}, {"letter": "E", "text": "Decompensated cirrhosis with a MELD at or above 15"}], "answer": "A", "explanation": "Acute liver injury is rapid injury with an INR above 1.5; acute liver failure is that plus new hepatic encephalopathy without pre-existing liver disease. Amanita phalloides is a recognized cause. His normal albumin and absent stigmata argue against established cirrhosis.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E1", "pgroup": "E", "pstack": "A"}, {"id": "34", "group": 34, "stem": "A 55-year-old man with cirrhosis has recovered from a variceal bleed and asks how rebleeding will be prevented.\n\nIn addition to a programme of endoscopic variceal ligation, which of the following is indicated?", "options": [{"letter": "A", "text": "A proton pump inhibitor continued indefinitely"}, {"letter": "B", "text": "Octreotide by continuous infusion continued after discharge"}, {"letter": "C", "text": "A non-selective beta-blocker titrated to a heart rate of 55-60"}, {"letter": "D", "text": "Ceftriaxone continued for a further 7 days"}, {"letter": "E", "text": "Spironolactone with furosemide"}], "answer": "C", "explanation": "After a variceal haemorrhage, secondary prevention is banding together with a non-selective beta-blocker — the guide lists both as indicated. Octreotide and ceftriaxone belong to the acute bleed, not to secondary prevention. Screening endoscopy every 2-3 years is the primary-prevention schedule for a cirrhotic who has never bled, which no longer applies once bleeding has occurred.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F1", "pgroup": "F", "pstack": "C"}, {"id": "35", "group": 35, "stem": "A 60-year-old man with advanced alcohol-related cirrhosis is admitted with a creatinine that has been rising despite volume, urine output under 500 mL in 24 hours, and ascites that no longer responds to diuretics. He was treated for spontaneous bacterial peritonitis two weeks ago and had a large-volume paracentesis without albumin replacement. He has had no nephrotoxins, no contrast exposure, and no shock. His temperature is 36.8°C (98.2°F), blood pressure is 92/56 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 96% on room air. Examination shows tense ascites, hypotension, and jaundice, with no peripheral edema, no flank tenderness, and no bladder distension.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}, {"letter": "B", "text": "Right heart catheterization"}, {"letter": "C", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}, {"letter": "D", "text": "Chest x-ray with an echocardiogram with Doppler and bubble study"}, {"letter": "E", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}], "answer": "C", "explanation": "A rising creatinine with oliguria and diuretic-resistant ascites, two weeks after spontaneous bacterial peritonitis and a large-volume paracentesis without albumin, calls for a creatinine and creatinine clearance with urine sodium, creatinine, protein, eosinophils, and osmolality, plus a renal ultrasound. The diagnosis is exclusionary, so parenchymal and obstructive disease must be ruled out.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G1", "pgroup": "G", "pstack": "A"}, {"id": "35A", "group": 35, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A clear chest x-ray with hypoxemia and bubbles crossing after 4-6 heartbeats"}, {"letter": "B", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}, {"letter": "C", "text": "Elevated right-sided heart pressures on echocardiography with a negative bubble study"}, {"letter": "D", "text": "An ascitic PMN count at or above 250/mm³ or a positive culture, with a rising creatinine"}, {"letter": "E", "text": "A transudative, usually right-sided pleural effusion in a cirrhotic with ascites"}], "answer": "B", "explanation": "His creatinine is 2.8 mg/dL with a creatinine clearance of 18 mL/min, his urine sodium is 6 mEq/L with a high urine osmolality and proteinuria below 500 mg/dL, and urine eosinophils are absent with fewer than 50 RBC per high-power field. The renal ultrasound is normal with no obstruction and normal-sized kidneys, and his serum sodium is 126 mEq/L.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G1", "pgroup": "G", "pstack": "A"}, {"id": "35B", "group": 35, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hepatorenal syndrome"}, {"letter": "B", "text": "Spontaneous bacterial peritonitis"}, {"letter": "C", "text": "Portopulmonary hypertension"}, {"letter": "D", "text": "Hepatohydrothorax"}, {"letter": "E", "text": "Hepatopulmonary syndrome"}], "answer": "A", "explanation": "Renal failure in cirrhosis with ascites WITHOUT hypovolemia or other kidney pathology is hepatorenal syndrome. The mechanism is intense renal vasoconstriction from extreme under-filling of the systemic arterial circulation driven by splanchnic vasodilatation — the kidneys simply think you are hypotensive.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G1", "pgroup": "G", "pstack": "A"}, {"id": "36", "group": 36, "stem": "A 47-year-old woman has alcohol-related fatty liver disease. Her AST is 148 U/L against an ALT of 62 U/L, her GGT is 312 U/L, and her phosphatidylethanol is positive. She continues to drink about a bottle of wine daily and has no opioid use.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Complete abstinence with counseling, and naltrexone only if she is also using opioids"}, {"letter": "B", "text": "Complete abstinence with counseling, and naltrexone only if the GGT remains elevated"}, {"letter": "C", "text": "Reduction to below 140 g of alcohol per week, with counseling"}, {"letter": "D", "text": "Complete abstinence with counseling, and naltrexone 50 mg daily"}, {"letter": "E", "text": "Reduction to one standard drink daily, with counseling"}], "answer": "D", "explanation": "Abstinence is where all treatment begins: with ANY liver disease there is no safe level of alcohol, so cutting back below the significant-use threshold is not the goal. Naltrexone 50 mg daily supports abstinence, and its only true contraindication is active or ongoing opioid use — which would forbid the drug, not indicate it.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A4", "pgroup": "A", "pstack": "B"}, {"id": "37", "group": 37, "stem": "A 26-year-old man has drug-induced liver injury after starting a workout supplement 6 weeks ago and completing a course of amoxicillin/clavulanate 5 weeks ago. His ALT is 486 U/L, his alkaline phosphatase is 340 U/L, his total bilirubin is 3.4 mg/dL, and his INR is 1.1.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Stop the supplement and all non-prescribed products, and begin prednisone"}, {"letter": "B", "text": "Continue the supplement and repeat the liver tests in 3 months"}, {"letter": "C", "text": "Stop the supplement only if the bilirubin rises above 4-5 mg/dL"}, {"letter": "D", "text": "Stop the amoxicillin/clavulanate only, since the course is already complete"}, {"letter": "E", "text": "Stop the supplement and all non-prescribed products, and monitor closely"}], "answer": "E", "explanation": "Stopping the offending agent is the treatment, and no non-prescribed supplements should be taken. Prognostically, a normal bilirubin and INR with the drug stopped predicts recovery, while a bilirubin above 2-3 with enzymes above 200 raises concern and above 4-5 goes to hepatology — so his numbers call for close monitoring now, not a wait-and-see threshold. Prednisone is reserved for severe disease or failure to respond and is not strongly evidence- or guideline-based.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B3", "pgroup": "B", "pstack": "B"}, {"id": "37A", "group": 37, "stem": "Two weeks later his INR has risen above 2 and he has developed hepatic encephalopathy. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "A low-copper diet with D-penicillamine"}, {"letter": "B", "text": "Stopping all acetaminophen and giving N-acetylcysteine"}, {"letter": "C", "text": "Referral for transplant assessment"}, {"letter": "D", "text": "Prednisone 40 mg for induction"}, {"letter": "E", "text": "Abstinence with early enteral nutrition and vitamin replacement"}], "answer": "C", "explanation": "Liver failure from drug-induced injury goes to transplant assessment if the INR is above 2 or there is any hepatic encephalopathy.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B3", "pgroup": "B", "pstack": "B"}, {"id": "38", "group": 38, "stem": "A 29-year-old man comes to the gastroenterology clinic with a year of cholestatic itching and intermittent jaundice, along with two episodes of recurrent cholangitis with fever and right upper quadrant pain that were treated with antibiotics. He has been fatigued. He was diagnosed with ulcerative colitis 6 years ago. His temperature is 36.9°C (98.4°F), blood pressure is 118/70 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. Examination shows jaundice with scleral icterus, right upper quadrant tenderness, excoriations on the forearms, and hepatomegaly with the liver edge 3 cm below the costal margin.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "AST, ALT, alkaline phosphatase, and bilirubin with an INR and a serologic workup"}, {"letter": "B", "text": "Serum IgG subclasses sent at least twice, with MRCP and a contrasted CT"}, {"letter": "C", "text": "Transabdominal right upper quadrant ultrasound with liver function tests"}, {"letter": "D", "text": "Alkaline phosphatase and GGT with an anti-mitochondrial antibody and a serum IgM"}, {"letter": "E", "text": "Alkaline phosphatase and GGT with MRCP and serum IgG subclasses"}], "answer": "E", "explanation": "Cholestatic itching with intermittent jaundice and two episodes of cholangitis in a young man with ulcerative colitis calls for an alkaline phosphatase and GGT with cholangiography by MRCP and serum IgG subclasses. Inflammatory bowel disease is present in more than two-thirds of patients with this disease.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C2", "pgroup": "C", "pstack": "A"}, {"id": "38A", "group": 38, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A very high alkaline phosphatase and GGT with a negative anti-mitochondrial antibody and no obstruction, stone, or mass"}, {"letter": "B", "text": "A markedly raised alkaline phosphatase with a positive anti-mitochondrial antibody and an elevated IgM"}, {"letter": "C", "text": "A markedly raised alkaline phosphatase with duct beading on cholangiography and a normal IgG4"}, {"letter": "D", "text": "A cholestatic pattern with a dilated common bile duct and a raised bilirubin"}, {"letter": "E", "text": "An elevated serum IgG4 with biliary strictures or a mass and other organ involvement"}], "answer": "C", "explanation": "His alkaline phosphatase is 704 U/L with a GGT of 610 U/L, a total bilirubin of 3.1 mg/dL, and cholangiography showing “beads on a string” narrowing of the bile ducts. The IgG4 is normal at 78 mg/dL — if it were elevated, this would be IgG4 cholangiopathy instead. The anti-mitochondrial antibody is negative and the p-ANCA positive.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C2", "pgroup": "C", "pstack": "A"}, {"id": "38B", "group": 38, "stem": "If a liver biopsy were performed, which of the following findings would most likely be present?", "options": [{"letter": "A", "text": "Non-suppurative lymphocholangitis with a granuloma around a bile duct"}, {"letter": "B", "text": "Concentric “onion skin” fibrosis around the bile ducts"}, {"letter": "C", "text": "Non-caseating granulomas"}, {"letter": "D", "text": "Caseating granulomas"}, {"letter": "E", "text": "IgG4-positive plasma cell tissue deposition"}], "answer": "B", "explanation": "The histology is concentric “onion skin” fibrosis around the bile ducts. Biopsy is reserved for a non-diagnostic cholangiogram; here the beading already carries the diagnosis.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C2", "pgroup": "C", "pstack": "A"}, {"id": "38C", "group": 38, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Primary sclerosing cholangitis"}, {"letter": "B", "text": "Choledocholithiasis"}, {"letter": "C", "text": "Autoimmune (IgG4) cholangiopathy"}, {"letter": "D", "text": "Primary biliary cholangitis"}, {"letter": "E", "text": "Hepatic granulomas"}], "answer": "A", "explanation": "Duct beading on cholangiography with a negative anti-mitochondrial antibody, a normal IgG4, and ulcerative colitis is primary sclerosing cholangitis, which targets mid and large ducts rather than the small intrahepatic ducts of primary biliary cholangitis. The signature is p-ANCA positivity, an ulcerative colitis association, and cholangiocarcinoma risk.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C2", "pgroup": "C", "pstack": "A"}, {"id": "39", "group": 39, "stem": "A 46-year-old man is seen in the pulmonology clinic, referred for an unexplained transaminase elevation persisting for 2 years. He has emphysema with exertional dyspnea and a chronic cough, diagnosed at age 43, and he has never smoked. An uncle had cryptogenic cirrhosis. He uses no alcohol, has no viral risk factors, and takes no new medications or supplements. His temperature is 36.7°C (98.1°F), blood pressure is 124/76 mm Hg, pulse is 80/min, respirations are 18/min, and oxygen saturation is 94% on room air. Examination shows a barrel chest with wheezing and prolonged expiration, and a liver edge palpable 2 cm below the costal margin; there is no jaundice, no ascites, and no spider angiomata.\n\nAlpha-1 antitrypsin: 32 mg/dL (normal roughly 100-200)\nALT: 88 U/L\nAST: 72 U/L\nTotal bilirubin: 0.8 mg/dL\nINR: 1.0\nAlbumin: 4.1 g/dL\nPlatelets: 202,000/mm³\nViral serologies, iron studies, ceruloplasmin, ANA, ASMA, AMA: Normal or negative\n\nWhich of the following tests would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Direct venography"}, {"letter": "B", "text": "HFE gene testing for C282Y, H63D, and S65C"}, {"letter": "C", "text": "ATP7B genetic testing"}, {"letter": "D", "text": "Alpha-1 antitrypsin genotype or phenotype testing"}, {"letter": "E", "text": "Liver biopsy"}], "answer": "D", "explanation": "A low alpha-1 antitrypsin level with elevated transaminases is the screen; genotype or phenotype testing confirms it. Suspect this with liver disease PLUS emphysema, or emphysema under age 50 in a non-smoker.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D3", "pgroup": "D", "pstack": "A"}, {"id": "39A", "group": 39, "stem": "Which of the following results would most likely be found?", "options": [{"letter": "A", "text": "Obstructed hepatic venous outflow"}, {"letter": "B", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "C", "text": "An SS, SZ, or ZZ genotype"}, {"letter": "D", "text": "An ATP7B mutation"}, {"letter": "E", "text": "Two abnormal HFE genes, a homozygous result"}], "answer": "C", "explanation": "SS, SZ, and ZZ genotypes are abnormal while MM is normal; his is ZZ. The condition follows from a single-gene mutation in SERPINA1, autosomal recessive on chromosome 14, with a prevalence of about 1 in 1,000.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D3", "pgroup": "D", "pstack": "A"}, {"id": "39B", "group": 39, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Wilson's disease"}, {"letter": "B", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "C", "text": "Budd-Chiari syndrome"}, {"letter": "D", "text": "Autoimmune hepatitis"}, {"letter": "E", "text": "Hereditary hemochromatosis"}], "answer": "B", "explanation": "Emphysema in a never-smoker diagnosed in his forties, with an unexplained transaminase elevation, a family history of cryptogenic cirrhosis, a low alpha-1 antitrypsin level, and a ZZ genotype is alpha-1 antitrypsin deficiency. It is frequently found while working up unexplained high liver tests or cirrhosis.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D3", "pgroup": "D", "pstack": "A"}, {"id": "40", "group": 40, "stem": "A 50-year-old woman with alcohol-related cirrhosis has had three admissions in 6 months for recurrent ascites, one episode of hepatic encephalopathy, and a variceal bleed. Her MELD 3.0 is 24 and she is Child-Pugh class C.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Refer her to a transplant center only if hepatocellular carcinoma develops"}, {"letter": "B", "text": "Refer her to a transplant center once a further decompensating event occurs"}, {"letter": "C", "text": "Refer her to a transplant center once the MELD exceeds 30"}, {"letter": "D", "text": "Continue maximal diuretics and reassess the MELD in 6 months"}, {"letter": "E", "text": "Refer her to a transplant center now"}], "answer": "E", "explanation": "Referral itself is the action, and it goes ahead REGARDLESS of MELD for decompensated cirrhosis — recurrent ascites, encephalopathy, a variceal bleed, or hepatocellular carcinoma — or for acute liver failure. Waiting for the score to climb past a threshold in a patient who is already decompensating is the error. The indications are acute liver failure; acute alcohol-related hepatitis with a MELD above 25 not improving on conservative therapy; and cirrhosis with any decompensating event, a MELD above 12-15, or hepatocellular carcinoma.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E4", "pgroup": "E", "pstack": "B"}, {"id": "41", "group": 41, "stem": "A 58-year-old man is brought to the emergency department by his family because he has been sleepier and more jaundiced over 3 days, with diffuse abdominal pain. He has known cirrhosis with ascites from metabolic dysfunction-associated steatotic liver disease, managed with spironolactone and furosemide. He has had no recent instrumentation and no perforation risk, and no prior infection of the ascitic fluid. His temperature is 37.2°C (99.0°F), blood pressure is 100/60 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 96% on room air. Examination shows diffuse abdominal tenderness with ascites and shifting dullness, jaundice, and mild asterixis; there is no fever and no rebound, so the examination is close to normal.\n\nWBC: 14,200/mm³\nTotal bilirubin: 6.4 mg/dL\nINR: 1.8\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Diagnostic paracentesis with cell count and a bedside-inoculated ascitic culture"}, {"letter": "B", "text": "Clinical diagnosis with West Haven grading and a search for precipitants"}, {"letter": "C", "text": "Creatinine and creatinine clearance with urine studies and a renal ultrasound"}, {"letter": "D", "text": "Upper endoscopy with a complete blood count and type and cross"}, {"letter": "E", "text": "Diagnostic paracentesis with ascitic albumin and a same-day serum albumin"}], "answer": "A", "explanation": "Suspect this in ANY cirrhotic with ascites who develops acute-on-chronic liver failure, and tap the belly: cell count and differential with an ascitic culture inoculated into blood culture bottles AT THE BEDSIDE. His ascites is already established, so the SAAG — measured once and never repeated — adds nothing here.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F3", "pgroup": "F", "pstack": "A"}, {"id": "41A", "group": 41, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Confusion with asterixis in a cirrhotic, with an identified precipitant"}, {"letter": "B", "text": "Esophageal or gastric fundal varices with a red wale sign, and anemia"}, {"letter": "C", "text": "A SAAG at or above 1.1 g/dL with a low ascitic total protein and PMNs under 250/mm³"}, {"letter": "D", "text": "An ascitic PMN count at or above 250/mm³ with a positive culture and a rising creatinine"}, {"letter": "E", "text": "A creatinine above 1.5 mg/dL with a urine sodium below 10 mEq/L and a normal renal ultrasound"}], "answer": "D", "explanation": "His ascitic PMN count is 640 cells/mm³ — at or above 250, which is the diagnosis — and the culture, inoculated at the bedside, grew a single organism, E. coli; the Gram stain was negative and is low yield. His creatinine has risen from 1.0 to 1.7 mg/dL. Multiple organisms would instead suggest a perforation.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F3", "pgroup": "F", "pstack": "A"}, {"id": "41B", "group": 41, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Ascites"}, {"letter": "B", "text": "Spontaneous bacterial peritonitis"}, {"letter": "C", "text": "Hepatorenal syndrome"}, {"letter": "D", "text": "Hepatic encephalopathy"}, {"letter": "E", "text": "Bleeding gastroesophageal varices from portal hypertension"}], "answer": "B", "explanation": "An ascitic PMN count at or above 250 and/or a positive fluid culture in a cirrhotic with acute-on-chronic decline is spontaneous bacterial peritonitis, and fever and pain are often absent. The usual organisms are E. coli and Klebsiella. It is one of the classic triggers of hepatorenal syndrome, which his rising creatinine already hints at.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F3", "pgroup": "F", "pstack": "A"}, {"id": "42", "group": 42, "stem": "A 53-year-old man with cirrhosis has a loud P2, jugular venous distension, and peripheral edema. Echocardiography shows an estimated pulmonary artery systolic pressure of 62 mm Hg with a negative bubble study, and right heart catheterization confirms a mean pulmonary artery pressure of 44 mm Hg with an elevated pulmonary vascular resistance and a normal wedge pressure.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with therapeutic thoracentesis"}, {"letter": "B", "text": "Supplemental oxygen"}, {"letter": "C", "text": "Listing for liver transplantation now"}, {"letter": "D", "text": "Pulmonary vasodilator therapy"}, {"letter": "E", "text": "Stopping diuretics and giving IV albumin 25 g of 25% three times daily"}], "answer": "D", "explanation": "Portopulmonary hypertension is treated with the same pulmonary vasodilator therapy used for non-liver-related pulmonary hypertension. Pressures must be CONTROLLED before transplant — uncontrolled portopulmonary hypertension is a transplant risk — so listing him before the pressures come down is the error. Supplemental oxygen treats hepatopulmonary syndrome, which is a shunt on bubble study with hypoxia rather than high pressures on catheterization.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G3", "pgroup": "G", "pstack": "B"}, {"id": "42A", "group": 42, "stem": "His pulmonary pressures are now controlled on therapy. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Supplemental oxygen"}, {"letter": "B", "text": "Sodium restriction with therapeutic thoracentesis, spironolactone, and furosemide"}, {"letter": "C", "text": "Referral for liver transplantation"}, {"letter": "D", "text": "Stopping diuretics and giving IV albumin 25 g of 25% three times daily"}, {"letter": "E", "text": "Empiric cefotaxime 2 g IV every 8 hours"}], "answer": "C", "explanation": "Once the pressures are controlled, liver transplantation becomes the definitive step; uncontrolled pressures make transplant hazardous.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G3", "pgroup": "G", "pstack": "B"}, {"id": "43", "group": 43, "stem": "A 47-year-old woman with alcohol-related fatty liver disease asks how much alcohol would be acceptable for her.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Complete abstinence from alcohol"}, {"letter": "B", "text": "No more than 140 g of alcohol per week, the significant-use threshold for women"}, {"letter": "C", "text": "No alcohol until the phosphatidylethanol becomes undetectable, then social drinking"}, {"letter": "D", "text": "No more than one standard drink of 14 g daily"}, {"letter": "E", "text": "No more than 210 g of alcohol per week, the significant-use threshold for men"}], "answer": "A", "explanation": "Significant alcohol use is more than 140 g per week in women and more than 210 g per week in men, with a standard drink of 14 g, but those thresholds define exposure rather than safety: with any liver disease there is NO safe level of alcohol. Phosphatidylethanol reflects use over the prior 2-6 weeks and is a monitoring tool, not a threshold for resuming.", "objective": "", "section": "Chronically abnormal liver enzymes in a patient with no symptoms", "pcase": "A4", "pgroup": "A", "pstack": "C"}, {"id": "44", "group": 44, "stem": "A 44-year-old man with severe acute alcohol-related hepatitis is improving and asks about his prognosis.\n\nWhich of the following is the most appropriate counseling?", "options": [{"letter": "A", "text": "Mortality is 20-50% at 3 months, and fewer than one in ten already have cirrhosis"}, {"letter": "B", "text": "Mortality is under 5% at 3 months, and more than half already have cirrhosis"}, {"letter": "C", "text": "Mortality is under 5% at 3 months, and about 30% already have cirrhosis"}, {"letter": "D", "text": "Mortality is 20-50% at 1 year, and about 30% already have cirrhosis"}, {"letter": "E", "text": "Mortality is 20-50% at 3 months, and more than half already have cirrhosis at presentation"}], "answer": "E", "explanation": "Severe acute alcohol-related hepatitis is one of the deadliest syndromes in hepatology, with a 3-month mortality of 20-50%. More than 50% already have cirrhosis at presentation, and of those who do not, about 30% develop it after the first episode. Death in the first 30 days is usually infection or multi-organ failure; from days 31 to 90 it is usually alcohol relapse.", "objective": "", "section": "Acute hepatocellular injury with a rising transaminase and jaundice", "pcase": "B1", "pgroup": "B", "pstack": "C"}, {"id": "45", "group": 45, "stem": "A 63-year-old man comes to the gastroenterology clinic with obstructive jaundice developing over 6 weeks with dark urine and pale stools, itching, and weight loss; imaging showed a biliary mass that was read as possible cholangiocarcinoma. He was treated for autoimmune pancreatitis 3 years ago, retroperitoneal fibrosis was found on a CT last year, and he has had painless swelling of both lacrimal glands. He has no inflammatory bowel disease. His temperature is 36.8°C (98.2°F), blood pressure is 126/76 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 97% on room air. Examination shows jaundice with scleral icterus and bilateral lacrimal gland swelling, with a soft abdomen, mild right upper quadrant tenderness, and no palpable mass.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Alkaline phosphatase and GGT with MRCP and serum IgG subclasses"}, {"letter": "B", "text": "AST, ALT, alkaline phosphatase, and bilirubin with an INR and a serologic workup"}, {"letter": "C", "text": "Alkaline phosphatase and GGT with an anti-mitochondrial antibody and a serum IgM"}, {"letter": "D", "text": "Serum IgG subclasses sent at least twice, with MRCP and a contrasted CT"}, {"letter": "E", "text": "Transabdominal right upper quadrant ultrasound with liver function tests"}], "answer": "D", "explanation": "Obstructive jaundice with a hilar biliary mass read as possible cholangiocarcinoma, in a man with prior autoimmune pancreatitis, retroperitoneal fibrosis, and lacrimal gland swelling, calls for serum IgG subclasses sent at least twice with MRCP and a contrasted CT of the head, chest, abdomen, and pelvis. The multi-organ pattern is the clue.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C3", "pgroup": "C", "pstack": "A"}, {"id": "45A", "group": 45, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A markedly raised alkaline phosphatase with a positive anti-mitochondrial antibody and an elevated IgM"}, {"letter": "B", "text": "A very high alkaline phosphatase and GGT with a negative anti-mitochondrial antibody and no obstruction, stone, or mass"}, {"letter": "C", "text": "An elevated serum IgG4 with biliary strictures or a mass and other organ involvement"}, {"letter": "D", "text": "A cholestatic pattern with a dilated common bile duct and a raised bilirubin"}, {"letter": "E", "text": "A markedly raised alkaline phosphatase with duct beading on cholangiography and a normal IgG4"}], "answer": "C", "explanation": "His serum IgG4 is elevated at 418 mg/dL on two separate draws. MRCP shows biliary strictures with a mass-like lesion at the hilum in a sclerosing-cholangitis-like appearance, and CT shows other organ involvement: a sausage-shaped pancreas, retroperitoneal soft-tissue thickening, and lacrimal gland enlargement. The alkaline phosphatase is 588 U/L with a negative anti-mitochondrial antibody.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C3", "pgroup": "C", "pstack": "A"}, {"id": "45B", "group": 45, "stem": "A biopsy of the affected tissue is performed. Which of the following findings would most likely be present?", "options": [{"letter": "A", "text": "Caseating granulomas"}, {"letter": "B", "text": "IgG4-positive plasma cell tissue deposition"}, {"letter": "C", "text": "Non-caseating granulomas"}, {"letter": "D", "text": "Non-suppurative lymphocholangitis with a granuloma around a bile duct"}, {"letter": "E", "text": "Concentric “onion skin” fibrosis around the bile ducts"}], "answer": "B", "explanation": "Tissue biopsy with IgG4 staining shows IgG4-positive plasma cell tissue deposition. Immune activation raises the serum IgG4 and deposits IgG4 in tissue, and there is a dramatic radiographic response before versus after immunosuppression.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C3", "pgroup": "C", "pstack": "A"}, {"id": "45C", "group": 45, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Primary biliary cholangitis"}, {"letter": "B", "text": "Primary sclerosing cholangitis"}, {"letter": "C", "text": "Hepatic granulomas"}, {"letter": "D", "text": "Choledocholithiasis"}, {"letter": "E", "text": "Autoimmune (IgG4) cholangiopathy"}], "answer": "E", "explanation": "An elevated serum IgG4 with biliary strictures and a mass, alongside autoimmune pancreatitis, retroperitoneal fibrosis, and lacrimal gland involvement, is IgG4 cholangiopathy. It mimics both sclerosing cholangitis and cholangiocarcinoma, but the IgG4 and the multi-organ disease separate it.", "objective": "", "section": "A cholestatic laboratory pattern with a high alkaline phosphatase", "pcase": "C3", "pgroup": "C", "pstack": "A"}, {"id": "46", "group": 46, "stem": "A 24-year-old woman has Wilson's disease with a ceruloplasmin of 11 mg/dL, a 24-hour urinary copper of 186 mcg, Kayser-Fleischer rings, and an ATP7B mutation.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "A low-copper diet with D-penicillamine, trientine, or zinc acetate"}, {"letter": "B", "text": "Prednisone 40 mg for induction"}, {"letter": "C", "text": "Referral to psychiatry for treatment of her personality change"}, {"letter": "D", "text": "Monitoring with smoking cessation"}, {"letter": "E", "text": "Serial phlebotomy with no alcohol and no iron intake"}], "answer": "A", "explanation": "A low-copper diet with D-penicillamine, trientine, or zinc acetate is the treatment. A young patient with liver disease plus neurologic or psychiatric findings must be suspected of this disease — treating the tremor and personality change as a primary psychiatric illness while the liver fails is the error.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D2", "pgroup": "D", "pstack": "B"}, {"id": "46A", "group": 46, "stem": "Months later she develops a rising INR with hepatic encephalopathy. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Monitoring with smoking cessation"}, {"letter": "B", "text": "Diet and exercise with 5-10% weight loss"}, {"letter": "C", "text": "Serial phlebotomy with no alcohol and no iron intake"}, {"letter": "D", "text": "Liver transplantation"}, {"letter": "E", "text": "Prednisone 40 mg for induction"}], "answer": "D", "explanation": "Wilson's disease can present as, or progress to, acute liver failure, and liver transplantation is the treatment at that point. It is a cause of acute liver failure to remember in a young patient with a rising INR and encephalopathy.", "objective": "", "section": "An unexplained enzyme abnormality traced to a genetic or vascular cause", "pcase": "D2", "pgroup": "D", "pstack": "B"}, {"id": "47", "group": 47, "stem": "A 50-year-old woman being referred for liver transplantation asks what the MELD 3.0 score measures.\n\nWhich of the following is the most appropriate explanation of what the score measures?", "options": [{"letter": "A", "text": "AST and ALT, creatinine and sodium, albumin, and biologic sex"}, {"letter": "B", "text": "INR and bilirubin, creatinine and sodium, albumin, and biologic sex"}, {"letter": "C", "text": "INR and bilirubin, creatinine and sodium, and albumin"}, {"letter": "D", "text": "INR and bilirubin, creatinine and sodium, and biologic sex"}, {"letter": "E", "text": "INR and bilirubin, creatinine and potassium, albumin, and biologic sex"}], "answer": "B", "explanation": "MELD 3.0 combines INR and bilirubin for the liver, creatinine and sodium for the kidney, albumin for nutrition, and biologic sex, which was added to better reflect disease in smaller women. Post-transplant survival in acute liver failure is similar to other liver diseases, and transplant is applicable in about 50% of those cases.", "objective": "", "section": "End-stage liver disease, its complications of structure, and the transplant decision", "pcase": "E4", "pgroup": "E", "pstack": "C"}, {"id": "48", "group": 48, "stem": "A 66-year-old woman with cirrhosis and a TIPS placed 8 months ago is somnolent with asterixis, West Haven grade III. Her sodium is 129 mEq/L and her potassium is 3.1 mEq/L from over-diuresis, her paracentesis shows a PMN count of 40/mm³ with negative cultures, and she has missed her lactulose for a week.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Correct the precipitants and give lactulose titrated to 2-4 bowel movements daily, with protein restriction"}, {"letter": "B", "text": "Correct the precipitants and give lactulose 30 mL once daily, with protein restriction"}, {"letter": "C", "text": "Correct the precipitants and give lactulose 30 mL once daily, with a bedtime protein snack"}, {"letter": "D", "text": "Correct the precipitants and close the TIPS shunt, with protein restriction"}, {"letter": "E", "text": "Correct the precipitants and give lactulose titrated to 2-4 bowel movements daily, with a bedtime protein snack"}], "answer": "E", "explanation": "There is no magic lactulose dose — titrate to 2-4 bowel movements a day and clinical improvement, so a fixed order producing one stool a day is undertreatment. The bedtime protein snack of 15-25 g has very good data: do NOT protein restrict, which is the classic reflex and is wrong. The precipitants here are dehydration and electrolyte disturbance plus missed lactulose.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F4", "pgroup": "F", "pstack": "B"}, {"id": "48A", "group": 48, "stem": "She improves but has two further episodes despite taking lactulose reliably. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Rifaximin 550 mg twice daily"}, {"letter": "B", "text": "Sodium restriction with spironolactone 100 mg and furosemide 40 mg daily"}, {"letter": "C", "text": "Stopping diuretics and giving IV albumin 25 g of 25% three times daily"}, {"letter": "D", "text": "Endoscopic band ligation with octreotide, ceftriaxone, and a proton pump inhibitor"}, {"letter": "E", "text": "Diagnostic paracentesis before empiric cefotaxime 2 g IV every 8 hours"}], "answer": "A", "explanation": "Rifaximin 550 mg twice daily is the add-on to lactulose, with zinc 220 µg twice daily if the patient is deficient.", "objective": "", "section": "A decompensating abdominal complication of portal hypertension", "pcase": "F4", "pgroup": "F", "pstack": "B"}, {"id": "49", "group": 49, "stem": "A 60-year-old man with cirrhosis has a creatinine of 2.8 mg/dL, a urine sodium of 6 mEq/L, a high urine osmolality, proteinuria below 500 mg/dL, and a normal renal ultrasound. He has tense, diuretic-resistant ascites and is on spironolactone and furosemide.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Stop the diuretics and begin hemodialysis"}, {"letter": "B", "text": "Stop the diuretics and begin terlipressin"}, {"letter": "C", "text": "Stop the diuretics and give IV albumin 25 g of 25% three times daily"}, {"letter": "D", "text": "Continue the diuretics and give IV albumin 25 g of 25% three times daily"}, {"letter": "E", "text": "Continue the diuretics and restrict free water"}], "answer": "C", "explanation": "Diuretics are stopped and plasma is expanded with IV albumin. The diagnosis is exclusionary, and the albumin challenge is designed to prevent treating a volume-responsive prerenal picture as hepatorenal syndrome. Terlipressin is considered only when the creatinine stays above 1.5 DESPITE albumin, so it follows plasma expansion rather than replacing it.", "objective": "", "section": "A systemic or thoracic complication of cirrhosis", "pcase": "G1", "pgroup": "G", "pstack": "B"}, {"id": "49A", "group": 49, "stem": "After diuretic withdrawal and 1.5 L of albumin his creatinine remains above 1.5 mg/dL. His lactate is normal, he is not hypoxic, and his MELD is 28. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Supplemental oxygen"}, {"letter": "B", "text": "Terlipressin"}, {"letter": "C", "text": "Sodium restriction with spironolactone 100 mg and furosemide 40 mg daily"}, {"letter": "D", "text": "Pulmonary vasodilator therapy"}, {"letter": "E", "text": "Empiric cefotaxime 2 g IV every 8 hours"}], "answer": "B", "explanation": "Terlipressin is the vasoconstrictor once the creatinine stays above 1.5 despite albumin; midodrine plus octreotide is the alternative. It has three named avoidances — abdominal pain or ischemia with an elevated lactate, hypoxia or pulm
