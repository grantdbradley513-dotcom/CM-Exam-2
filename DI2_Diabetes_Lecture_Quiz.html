<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  /* LQ-PATCH: two-across option grid + select-all-that-apply */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .opts .opt { margin-bottom: 0; height: 100%; }
  .opts .opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
  @media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
  .group.c3 .opts, .group.c4 .opts { gap: 5px; margin-bottom: 5px; }
  .group.c2 .opts { gap: 6px; margin-bottom: 6px; }
  .opt.picked { border-color: var(--accent); background: var(--accent-soft); }
  .opt .box { min-width: 1.25em; height: 1.25em; line-height: 1.15em; text-align: center;
    border: 2px solid var(--border); border-radius: 4px; font-size: 0.8em; font-weight: 700;
    color: transparent; flex: 0 0 auto; }
  .opt .box.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct .box.on { background: var(--green); border-color: var(--green); }
  .opt.incorrect .box.on { background: var(--red); border-color: var(--red); }
  .sata-note { font-size: 0.85em; font-weight: 700; color: var(--accent); margin: -6px 0 10px; }
  .sata-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .opt-submit { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 8px;
    padding: 8px 18px; background: var(--accent); color: #fff; }
  .opt-submit:disabled { opacity: 0.45; cursor: default; }
  .sata-count { font-size: 0.85em; color: var(--ink-soft); }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "Diabetes Mellitus Lab Evaluation — Fundamentals (DI 2 Exam 3)", "questions": [{"id": "1", "group": 1, "section": "ADA diagnostic criteria", "topic": "Diagnostic criteria (glucose & OGTT)", "skill": "Diagnostics & imaging", "stem": "Which laboratory results, each on its own, satisfy an ADA diagnostic criterion for diabetes mellitus?", "options": [{"letter": "A", "text": "Glucosuria on a routine urine dipstick"}, {"letter": "B", "text": "Hemoglobin A1C ≥ 6.5%"}, {"letter": "C", "text": "Fasting plasma glucose of 100–125 mg/dL"}, {"letter": "D", "text": "Random glucose ≥ 200 mg/dL with classic symptoms"}, {"letter": "E", "text": "2-hour 75-g OGTT glucose ≥ 200 mg/dL"}, {"letter": "F", "text": "Fasting plasma glucose ≥ 126 mg/dL"}], "answer": ["B", "D", "E", "F"], "explanation": "Any **one** of these four abnormalities, confirmed, makes the diagnosis. FPG 100–125 is **prediabetes**, and glucosuria is not a criterion — it simply means glucose has passed the renal threshold of 170–200 mg/dL.", "objective": "", "remediation": {"steps": [{"teach": "The four criteria are four different ways of catching the same thing: a glucose level high enough that microvascular complications begin to climb — which is why the fasting number sits where it does.", "stem": "What fasting plasma glucose value marks the diagnostic threshold for diabetes?", "options": [{"letter": "A", "text": "≥ 100 mg/dL"}, {"letter": "B", "text": "≥ 140 mg/dL"}, {"letter": "C", "text": "≥ 126 mg/dL"}, {"letter": "D", "text": "≥ 200 mg/dL"}], "answer": "C", "explanation": "**FPG ≥ 126 mg/dL** is diagnostic; the association with nephropathy, neuropathy and retinopathy rises steeply above it.", "clarify": [{"stem": "How long must a patient go without calories for a glucose to count as fasting?", "options": [{"letter": "A", "text": "At least 8 hours"}, {"letter": "B", "text": "At least 2 hours"}], "answer": "A", "explanation": "Fasting means **no caloric intake for ≥ 8 hours**."}, {"stem": "A patient has polyuria and polydipsia but a completely normal plasma glucose. What should be considered?", "options": [{"letter": "A", "text": "Type 2 diabetes"}, {"letter": "B", "text": "Diabetes insipidus"}], "answer": "B", "explanation": "Polyuria and polydipsia with normal glucose points to **diabetes insipidus**, a disorder of ADH."}]}, {"teach": "The random criterion is the only one that carries a symptom requirement, and it shares its 200 mg/dL cutoff with the 2-hour OGTT.", "stem": "Why does a random glucose of 215 mg/dL count as diagnostic only when classic symptoms are present?", "options": [{"letter": "A", "text": "Random samples are drawn from capillary rather than venous blood"}, {"letter": "B", "text": "Random glucose is unaffected by what the patient last ate"}, {"letter": "C", "text": "A value above 200 mg/dL is expected after any meal"}, {"letter": "D", "text": "Without symptoms the result is not unequivocal and must be confirmed"}], "answer": "D", "explanation": "Only **unequivocal symptomatic hyperglycemia** stands on a single value; everything else is confirmed."}], "checkpoints": [{"stem": "A patient with no symptoms has a 2-hour OGTT value of 210 mg/dL. What does this result establish?", "options": [{"letter": "A", "text": "A diagnosis of diabetes needing no further testing"}, {"letter": "B", "text": "A diabetic-range result that still must be confirmed"}, {"letter": "C", "text": "Impaired glucose tolerance"}, {"letter": "D", "text": "A normal post-load response"}], "answer": "B", "explanation": "A 2-hour value **≥ 200 mg/dL** is in the diabetic range, but an asymptomatic patient needs a confirmatory test."}, {"stem": "Which urine finding is often mistaken for a diagnostic criterion but only reflects the renal glucose threshold?", "options": [{"letter": "A", "text": "Ketonuria"}, {"letter": "B", "text": "Albuminuria"}, {"letter": "C", "text": "Glucosuria"}, {"letter": "D", "text": "Hematuria"}], "answer": "C", "explanation": "**Glucosuria** appears once plasma glucose exceeds 170–200 mg/dL; it prompts a plasma glucose, it does not diagnose."}]}}, {"id": "2", "group": 2, "section": "ADA diagnostic criteria", "topic": "Prediabetes", "skill": "Diagnostics & imaging", "stem": "An asymptomatic adult has a fasting plasma glucose of 112 mg/dL. How should this result be interpreted?", "options": [{"letter": "A", "text": "Impaired fasting glucose"}, {"letter": "B", "text": "Impaired glucose tolerance"}, {"letter": "C", "text": "Diabetes mellitus"}, {"letter": "D", "text": "Normal fasting glucose"}], "answer": "A", "explanation": "FPG **100–125 mg/dL** is impaired fasting glucose, one form of prediabetes. Impaired glucose *tolerance* is the 2-hour OGTT term.", "objective": "", "remediation": {"steps": [{"teach": "Fasting glucose has three bands: normal below 100, prediabetes 100–125, diabetes at 126 and above.", "stem": "Where does the prediabetes range for fasting plasma glucose end?", "options": [{"letter": "A", "text": "99 mg/dL"}, {"letter": "B", "text": "139 mg/dL"}, {"letter": "C", "text": "199 mg/dL"}, {"letter": "D", "text": "125 mg/dL"}], "answer": "D", "explanation": "Impaired fasting glucose runs **100–125 mg/dL**.", "clarify": [{"stem": "Which A1C range defines prediabetes?", "options": [{"letter": "A", "text": "5.7–6.4%"}, {"letter": "B", "text": "6.5–7.0%"}], "answer": "A", "explanation": "Prediabetes on A1C is **5.7–6.4%**; normal is ≤ 5.6%."}]}, {"teach": "Each test has its own prediabetes label, and mixing them up is the classic error.", "stem": "Which term describes a 2-hour OGTT value between 140 and 199 mg/dL?", "options": [{"letter": "A", "text": "Impaired fasting glucose"}, {"letter": "B", "text": "Impaired glucose tolerance"}, {"letter": "C", "text": "Diabetes mellitus"}, {"letter": "D", "text": "Normal glucose tolerance"}], "answer": "B", "explanation": "2-hour OGTT **140–199 mg/dL** is impaired glucose tolerance."}], "checkpoints": [{"stem": "How often should a patient found to have prediabetes be retested?", "options": [{"letter": "A", "text": "At least annually"}, {"letter": "B", "text": "Every 3 years"}, {"letter": "C", "text": "Every 5 years"}, {"letter": "D", "text": "Only if symptoms develop"}], "answer": "A", "explanation": "Prediabetes progresses at roughly 6% per year, so it is retested **at least annually**."}, {"stem": "Which intervention is most effective at preventing progression from prediabetes to type 2 diabetes?", "options": [{"letter": "A", "text": "An annual OGTT"}, {"letter": "B", "text": "Teplizumab"}, {"letter": "C", "text": "Diet, exercise and weight loss"}, {"letter": "D", "text": "Basal insulin"}], "answer": "C", "explanation": "**Lifestyle change** comes first; metformin or a GLP-1 receptor agonist may be added if it fails."}]}}, {"id": "3", "group": 3, "section": "ADA diagnostic criteria", "topic": "Hemoglobin A1C", "skill": "Diagnostics & imaging", "stem": "Over roughly what period of time does hemoglobin A1C reflect a patient's average blood glucose?", "options": [{"letter": "A", "text": "~1 year"}, {"letter": "B", "text": "~2 weeks"}, {"letter": "C", "text": "~3 months"}, {"letter": "D", "text": "~6 months"}], "answer": "C", "explanation": "A1C is the percentage of glycated hemoglobin and tracks mean glucose over the previous **~3 months**, weighted toward recent weeks.", "objective": "", "remediation": {"steps": [{"teach": "Glucose attaches irreversibly to hemoglobin at a rate set by the prevailing glucose, so the value tracks the life span of the red cell.", "stem": "To what molecule is glucose irreversibly attached in the measurement we call A1C?", "options": [{"letter": "A", "text": "Circulating insulin"}, {"letter": "B", "text": "Proinsulin in the β cell"}, {"letter": "C", "text": "Albumin in the plasma"}, {"letter": "D", "text": "Hemoglobin inside red cells"}], "answer": "D", "explanation": "A1C is **glycated hemoglobin**, and the bond does not come undone.", "clarify": [{"stem": "About what fraction of red cells turns over each day, keeping A1C a rolling average?", "options": [{"letter": "A", "text": "About 1%"}, {"letter": "B", "text": "About 25%"}], "answer": "A", "explanation": "Roughly **1% of red cells** turn over daily, so the average rolls forward continuously."}]}, {"teach": "The three-month window is not weighted evenly across its length.", "stem": "Which part of the three-month window influences the A1C value the most?", "options": [{"letter": "A", "text": "The earliest weeks"}, {"letter": "B", "text": "All weeks equally"}, {"letter": "C", "text": "Only the last 24 hours"}, {"letter": "D", "text": "The most recent weeks"}], "answer": "D", "explanation": "A1C is a weighted average, **most influenced by the recent weeks**."}], "checkpoints": [{"stem": "Why is a single A1C often preferred over a fasting or random glucose for judging control?", "options": [{"letter": "A", "text": "It detects hypoglycemia"}, {"letter": "B", "text": "It displays glucose swings"}, {"letter": "C", "text": "One sample, with much less day-to-day variability"}, {"letter": "D", "text": "It requires an 8-hour fast"}], "answer": "C", "explanation": "A1C takes **one sample** and varies far less than individual glucose values."}]}}, {"id": "4", "group": 4, "section": "ADA diagnostic criteria", "topic": "Hemoglobin A1C", "skill": "Diagnostics & imaging", "stem": "Which statements correctly describe limitations of hemoglobin A1C?", "options": [{"letter": "A", "text": "It reflects only the preceding two weeks"}, {"letter": "B", "text": "It does not reveal hypoglycemic episodes"}, {"letter": "C", "text": "People glycate hemoglobin at different rates"}, {"letter": "D", "text": "It does not capture glycemic variability"}, {"letter": "E", "text": "It requires at least an 8-hour fast"}, {"letter": "F", "text": "It cannot be used to diagnose diabetes"}], "answer": ["B", "C", "D"], "explanation": "A1C is an **average**, so swings and lows vanish inside it, and differing glycation rates make it less comparable **between** people. It needs no fasting, spans ~3 months, and ≥ 6.5% is diagnostic.", "objective": "", "remediation": {"steps": [{"teach": "An average cancels highs against lows, which is exactly what makes it a poor description of an unstable patient.", "stem": "Which pattern can a reassuring average A1C conceal in a patient on insulin?", "options": [{"letter": "A", "text": "A steadily normal glucose"}, {"letter": "B", "text": "Frequent highs offset by frequent lows"}, {"letter": "C", "text": "A gradual rise in mean glucose"}, {"letter": "D", "text": "An isolated fasting elevation"}], "answer": "B", "explanation": "Highs and lows cancel, so **variability and hypoglycemia** are invisible in the average.", "clarify": [{"stem": "How should control be judged in a patient with type 1 diabetes and wide glucose swings?", "options": [{"letter": "A", "text": "A1C alone"}, {"letter": "B", "text": "Self-monitored glucose or CGM together with A1C"}], "answer": "B", "explanation": "Pair the A1C with **SMBG or CGM** when variability matters."}]}, {"teach": "The second limitation is about comparing one person with another, not one month with the next.", "stem": "Why can the same A1C value correspond to slightly different mean glucoses in two patients?", "options": [{"letter": "A", "text": "Red cells in some people never turn over"}, {"letter": "B", "text": "Fasting status changes the result"}, {"letter": "C", "text": "Glycation rates differ between individuals"}, {"letter": "D", "text": "Assays are not standardized"}], "answer": "C", "explanation": "Some people **glycate faster**, so A1C compares poorly between individuals while remaining the best test within one."}], "checkpoints": [{"stem": "A patient's A1C is 6.9%, but she reports shakiness and sweating several nights each week. What should be added?", "options": [{"letter": "A", "text": "A repeat A1C in one month"}, {"letter": "B", "text": "An oral glucose tolerance test"}, {"letter": "C", "text": "Nothing — the A1C is at goal"}, {"letter": "D", "text": "CGM or self-monitored glucose"}], "answer": "D", "explanation": "Nocturnal hypoglycemia is invisible to A1C; **CGM or finger-sticks** are needed to see it."}]}}, {"id": "5", "group": 5, "section": "ADA diagnostic criteria", "topic": "Diagnostic criteria (glucose & OGTT)", "skill": "Diagnostics & imaging", "stem": "What conclusion is appropriate when a septic ICU patient has a glucose level of 240 mg/dL?", "options": [{"letter": "A", "text": "Do not diagnose DM now"}, {"letter": "B", "text": "Diagnose type 2 DM"}, {"letter": "C", "text": "Diagnose prediabetes"}, {"letter": "D", "text": "Order islet antibodies"}], "answer": "A", "explanation": "Critical illness is **not** a setting in which to diagnose diabetes — this is **stress hyperglycemia** from counter-regulatory hormones.", "objective": "", "remediation": {"steps": [{"teach": "In critical illness, cortisol, catecholamines, glucagon and growth hormone all drive gluconeogenesis.", "stem": "What mainly drives the hyperglycemia seen during sepsis and other critical illness?", "options": [{"letter": "A", "text": "Counter-regulatory stress hormones"}, {"letter": "B", "text": "Autoimmune β-cell destruction"}, {"letter": "C", "text": "Obesity-related insulin resistance"}, {"letter": "D", "text": "Withdrawal of exogenous insulin"}], "answer": "A", "explanation": "**Stress hormones** plus gluconeogenesis and glycogenolysis raise the glucose.", "clarify": [{"stem": "What effect do cortisol and catecholamines have on blood glucose?", "options": [{"letter": "A", "text": "They raise it"}, {"letter": "B", "text": "They lower it"}], "answer": "A", "explanation": "Both are **counter-regulatory** hormones that raise glucose."}]}, {"teach": "Deferring the diagnosis is not the same as ignoring the number.", "stem": "What should be done about this patient's elevated glucose once he recovers from sepsis?", "options": [{"letter": "A", "text": "Record type 2 diabetes retrospectively"}, {"letter": "B", "text": "Assume the value was normal and stop testing"}, {"letter": "C", "text": "Re-evaluate him with a formal diagnostic test"}, {"letter": "D", "text": "Order islet autoantibodies"}], "answer": "C", "explanation": "Re-evaluate with **FPG or A1C** after recovery, when stress hormones have settled."}], "checkpoints": [{"stem": "Which other situation has its own diagnostic criteria rather than the standard ADA thresholds?", "options": [{"letter": "A", "text": "Chronic kidney disease"}, {"letter": "B", "text": "Older age"}, {"letter": "C", "text": "Obesity"}, {"letter": "D", "text": "Pregnancy"}], "answer": "D", "explanation": "**Gestational diabetes** uses separate cutoffs (fasting ≥ 92, 1-h ≥ 180, 2-h ≥ 153 at 24–28 weeks)."}]}}, {"id": "6", "group": 6, "section": "Confirming the diagnosis", "topic": "Confirming the diagnosis", "skill": "Diagnostics & imaging", "stem": "What is the next step for an asymptomatic patient with a fasting plasma glucose of 131 mg/dL?", "options": [{"letter": "A", "text": "Recheck in 3 years"}, {"letter": "B", "text": "Repeat FPG on another day"}, {"letter": "C", "text": "Diagnose diabetes now"}, {"letter": "D", "text": "Order islet antibodies"}], "answer": "B", "explanation": "Without unequivocal symptomatic hyperglycemia, **confirm on a subsequent day using the same test**.", "objective": "", "remediation": {"steps": [{"teach": "Only unequivocal symptomatic hyperglycemia stands on one value; everything else needs a second abnormal result.", "stem": "Does an asymptomatic patient with one abnormal glucose result need confirmatory testing?", "options": [{"letter": "A", "text": "No — a single result is enough"}, {"letter": "B", "text": "Yes"}], "answer": "B", "explanation": "Asymptomatic patients need **two abnormal results**.", "clarify": [{"stem": "In which single situation is one abnormal value enough to diagnose diabetes?", "options": [{"letter": "A", "text": "A random glucose ≥ 200 mg/dL with classic symptoms"}, {"letter": "B", "text": "Any fasting glucose ≥ 126 mg/dL"}], "answer": "A", "explanation": "Only **symptomatic** hyperglycemia with a random glucose ≥ 200 mg/dL needs no repeat."}]}, {"teach": "Confirmation is done with the same assay that was abnormal, drawn soon afterward.", "stem": "Which test should be used to confirm an abnormal fasting plasma glucose?", "options": [{"letter": "A", "text": "A urine glucose dipstick"}, {"letter": "B", "text": "The same fasting glucose, on a subsequent day"}, {"letter": "C", "text": "A random glucose after lunch"}, {"letter": "D", "text": "An OGTT the same afternoon"}], "answer": "B", "explanation": "Repeat the **same test** on a subsequent day."}], "checkpoints": [{"stem": "A patient has an FPG of 130 mg/dL and an A1C of 6.7% drawn at the same visit. What is the next step?", "options": [{"letter": "A", "text": "Repeat both tests next week"}, {"letter": "B", "text": "Order an oral glucose tolerance test"}, {"letter": "C", "text": "Call this prediabetes"}, {"letter": "D", "text": "No further testing — the diagnosis is made"}], "answer": "D", "explanation": "Two different tests **concordant** for diabetes confirm each other; A1C and FPG agree about 98% of the time."}]}}, {"id": "7", "group": 7, "section": "Confirming the diagnosis", "topic": "Confirming the diagnosis", "skill": "Diagnostics & imaging", "stem": "What is the next step when fasting plasma glucose is 118 mg/dL but A1C is 6.8%?", "options": [{"letter": "A", "text": "Repeat the A1C"}, {"letter": "B", "text": "Repeat the FPG"}, {"letter": "C", "text": "Diagnose diabetes"}, {"letter": "D", "text": "Diagnose prediabetes"}], "answer": "A", "explanation": "When two tests are discordant, **repeat the one that is diagnostic of diabetes** — here the A1C.", "objective": "", "remediation": {"steps": [{"teach": "Start by sorting the two values into their bands.", "stem": "Which of this patient's two results falls in the diabetic range?", "options": [{"letter": "A", "text": "The A1C of 6.8%"}, {"letter": "B", "text": "The fasting glucose of 118 mg/dL"}], "answer": "A", "explanation": "A1C ≥ 6.5% is diabetic; an FPG of 118 is only prediabetic.", "clarify": [{"stem": "Into which range does a fasting plasma glucose of 118 mg/dL fall?", "options": [{"letter": "A", "text": "Diabetes"}, {"letter": "B", "text": "Prediabetes"}], "answer": "B", "explanation": "100–125 mg/dL is **impaired fasting glucose**."}]}, {"teach": "The rule names which of the two discordant tests gets repeated.", "stem": "When two different tests disagree, which one should be repeated?", "options": [{"letter": "A", "text": "The test in the prediabetes range"}, {"letter": "B", "text": "Both tests at the same visit"}, {"letter": "C", "text": "The test that is diagnostic of diabetes"}, {"letter": "D", "text": "Neither — average the two values"}], "answer": "C", "explanation": "Repeat the **diagnostic** test to confirm it."}], "checkpoints": [{"stem": "Two different tests both land in the diabetic range in the same patient. What follows?", "options": [{"letter": "A", "text": "Both tests must be repeated"}, {"letter": "B", "text": "Only the higher value is repeated"}, {"letter": "C", "text": "An OGTT is required"}, {"letter": "D", "text": "The diagnosis is confirmed"}], "answer": "D", "explanation": "Concordant tests mean **no additional testing** is needed."}]}}, {"id": "8", "group": 8, "section": "Screening for type 2 DM", "topic": "Type 2 DM screening", "skill": "Diagnostics & imaging", "stem": "At what age does the ADA recommend beginning type 2 diabetes screening in all adults?", "options": [{"letter": "A", "text": "45"}, {"letter": "B", "text": "40"}, {"letter": "C", "text": "30"}, {"letter": "D", "text": "35"}], "answer": "D", "explanation": "ADA: screen **all adults starting at age 35**, and earlier if the patient has overweight or obesity plus at least one risk factor.", "objective": "", "remediation": {"steps": [{"teach": "The ADA screens every adult from a set age onward; younger adults qualify on the basis of risk.", "stem": "Which younger adults should be screened before the age cutoff is reached?", "options": [{"letter": "A", "text": "Only those reporting classic symptoms"}, {"letter": "B", "text": "Only those who are pregnant"}, {"letter": "C", "text": "Those with overweight or obesity plus ≥ 1 risk factor"}, {"letter": "D", "text": "Those with a normal BMI and no risk factors"}], "answer": "C", "explanation": "Below 35, screening requires **overweight or obesity plus at least one risk factor**.", "clarify": [{"stem": "Which group does the USPSTF recommend screening, for contrast?", "options": [{"letter": "A", "text": "Adults 35–70 with overweight or obesity"}, {"letter": "B", "text": "All adults over 18"}], "answer": "A", "explanation": "USPSTF limits screening to **35–70 with overweight or obesity**."}]}, {"teach": "Any of three tests may be used to screen; antibodies and C-peptide have no role here.", "stem": "Which tests are acceptable for screening an asymptomatic adult for type 2 diabetes?", "options": [{"letter": "A", "text": "A urine albumin-to-creatinine ratio"}, {"letter": "B", "text": "A1C, fasting glucose, or a 2-hour OGTT"}, {"letter": "C", "text": "Islet autoantibodies"}, {"letter": "D", "text": "A C-peptide level"}], "answer": "B", "explanation": "**A1C, FPG or the 2-hour OGTT** are all acceptable screening tests."}], "checkpoints": [{"stem": "A 28-year-old with a BMI of 32 whose mother has type 2 diabetes asks about testing. What do you advise?", "options": [{"letter": "A", "text": "Wait until age 35"}, {"letter": "B", "text": "No screening is indicated"}, {"letter": "C", "text": "Screen only during pregnancy"}, {"letter": "D", "text": "Screen now"}], "answer": "D", "explanation": "Under 35 but overweight with a first-degree relative — **screen now**."}, {"stem": "Besides overweight, which finding counts as a risk factor that justifies early screening?", "options": [{"letter": "A", "text": "Seasonal allergies"}, {"letter": "B", "text": "Iron-deficiency anemia"}, {"letter": "C", "text": "Polycystic ovary syndrome"}, {"letter": "D", "text": "Migraine headaches"}], "answer": "C", "explanation": "**PCOS** sits alongside hypertension, dyslipidemia, inactivity, prior gestational diabetes and a first-degree relative."}]}}, {"id": "9", "group": 9, "section": "Screening for type 2 DM", "topic": "Type 2 DM screening", "skill": "Diagnostics & imaging", "stem": "When should screening be repeated in an asymptomatic patient with a normal type 2 diabetes screening result?", "options": [{"letter": "A", "text": "Every year"}, {"letter": "B", "text": "Every 5 years"}, {"letter": "C", "text": "At least every 3 years"}, {"letter": "D", "text": "Every 6 months"}], "answer": "C", "explanation": "A normal result is repeated **at least every 3 years**; prediabetes is retested yearly.", "objective": "", "remediation": {"steps": [{"teach": "Retesting intervals scale with risk: the higher the risk, the shorter the interval.", "stem": "How often is a patient with prediabetes retested compared with one whose screen was normal?", "options": [{"letter": "A", "text": "More often — yearly"}, {"letter": "B", "text": "Less often — every 5 years"}], "answer": "A", "explanation": "Prediabetes is retested **annually**.", "clarify": [{"stem": "How often should a woman with a history of gestational diabetes be tested?", "options": [{"letter": "A", "text": "Every 1–3 years"}, {"letter": "B", "text": "Once at age 50"}], "answer": "A", "explanation": "Prior gestational diabetes calls for testing **every 1–3 years** for life."}]}, {"teach": "Apply the longest interval to the lowest-risk patient.", "stem": "A 45-year-old with a normal A1C last year and no risk factors asks when to be rechecked. What do you tell him?", "options": [{"letter": "A", "text": "Only if symptoms appear"}, {"letter": "B", "text": "In 6 months"}, {"letter": "C", "text": "In 1 year"}, {"letter": "D", "text": "In about 3 years"}], "answer": "D", "explanation": "A normal screen in a low-risk adult is repeated at **3-year** intervals."}], "checkpoints": [{"stem": "A patient's screening A1C comes back at 6.1%. When should glucose status be reassessed?", "options": [{"letter": "A", "text": "No further testing is needed"}, {"letter": "B", "text": "In 3 years"}, {"letter": "C", "text": "In 1 year"}, {"letter": "D", "text": "In 5 years"}], "answer": "C", "explanation": "An A1C of 5.7–6.4% is prediabetes, which is retested **annually**."}]}}, {"id": "10", "group": 10, "section": "Type 1 versus type 2", "topic": "T1 vs T2 — antibodies & C-peptide", "skill": "Identification", "stem": "Which features at presentation favor type 1 diabetes over type 2 diabetes?", "options": [{"letter": "A", "text": "Obesity with a strong family history"}, {"letter": "B", "text": "Acanthosis nigricans and skin tags"}, {"letter": "C", "text": "Onset in childhood or adolescence"}, {"letter": "D", "text": "Gradual onset after the age of 40"}, {"letter": "E", "text": "A thin body habitus"}, {"letter": "F", "text": "Ketoacidosis as the first manifestation"}], "answer": ["C", "E", "F"], "explanation": "Type 1 is **sudden, thin and ketosis-prone**, peaking at ages 4–6 and 10–14, with DKA the first sign in 25–50%. Acanthosis nigricans, gradual onset after 40 and obesity with family history describe **type 2**.", "objective": "", "remediation": {"steps": [{"teach": "The split between the two types starts with mechanism, and every clinical clue follows from it.", "stem": "Which mechanism underlies type 2 diabetes?", "options": [{"letter": "A", "text": "Deficient ADH secretion"}, {"letter": "B", "text": "Insulin resistance with relative insulin deficiency"}, {"letter": "C", "text": "Iron deposition within the pancreas"}, {"letter": "D", "text": "Autoimmune β-cell destruction"}], "answer": "B", "explanation": "Type 2 is **insulin resistance** with a relative, not absolute, deficiency.", "clarify": [{"stem": "With no insulin to suppress lipolysis, which products accumulate and cause ketoacidosis?", "options": [{"letter": "A", "text": "Lactate from anaerobic metabolism"}, {"letter": "B", "text": "Ketones such as β-hydroxybutyrate"}], "answer": "B", "explanation": "**Ketones** — β-hydroxybutyrate, acetoacetate and acetone — accumulate and acidify the blood."}]}, {"teach": "Skin findings track insulin resistance, so they point the opposite way.", "stem": "Which type of diabetes is suggested by acanthosis nigricans and acrochordons?", "options": [{"letter": "A", "text": "Type 1 diabetes"}, {"letter": "B", "text": "LADA"}, {"letter": "C", "text": "Diabetes insipidus"}, {"letter": "D", "text": "Type 2 diabetes"}], "answer": "D", "explanation": "Both are cutaneous markers of **insulin resistance**."}], "checkpoints": [{"stem": "Diabetes appearing after months of high-dose glucocorticoid therapy belongs to which etiologic category?", "options": [{"letter": "A", "text": "Autoimmune type 1 diabetes"}, {"letter": "B", "text": "Gestational diabetes"}, {"letter": "C", "text": "Drug-induced diabetes"}, {"letter": "D", "text": "Disease of the exocrine pancreas"}], "answer": "C", "explanation": "Glucocorticoids are the classic cause of **drug-induced** diabetes."}, {"stem": "In which etiologic category does the diabetes of hemochromatosis, so-called bronze diabetes, belong?", "options": [{"letter": "A", "text": "Autoimmune type 1 diabetes"}, {"letter": "B", "text": "Drug-induced diabetes"}, {"letter": "C", "text": "Disease of the exocrine pancreas"}, {"letter": "D", "text": "Another endocrinopathy"}], "answer": "C", "explanation": "Hemochromatosis damages the pancreas itself, alongside **chronic pancreatitis and cystic fibrosis**."}]}}, {"id": "11", "group": 11, "section": "Type 1 versus type 2", "topic": "T1 vs T2 — antibodies & C-peptide", "skill": "Diagnostics & imaging", "stem": "What does a low or absent C-peptide level indicate?", "options": [{"letter": "A", "text": "Insulin resistance"}, {"letter": "B", "text": "Absolute insulin deficiency"}, {"letter": "C", "text": "Hyperinsulinemia"}, {"letter": "D", "text": "Normal β-cell reserve"}], "answer": "B", "explanation": "Low C-peptide means **absolute insulin deficiency** — the signature of type 1 diabetes.", "objective": "", "remediation": {"steps": [{"teach": "C-peptide is the 31-amino-acid fragment cleaved from proinsulin and released 1:1 with the body's own insulin.", "stem": "What does the amount of circulating C-peptide tell you about the β cells?", "options": [{"letter": "A", "text": "Whether they are under autoimmune attack"}, {"letter": "B", "text": "How resistant the tissues are to insulin"}, {"letter": "C", "text": "How quickly insulin is being cleared"}, {"letter": "D", "text": "How much insulin they are producing"}], "answer": "D", "explanation": "C-peptide is a direct gauge of **endogenous insulin production**.", "clarify": [{"stem": "In what ratio is C-peptide released with the body's own insulin?", "options": [{"letter": "A", "text": "1:10"}, {"letter": "B", "text": "1:1"}], "answer": "B", "explanation": "They are co-secreted **1:1**."}]}, {"teach": "The reason we reach for C-peptide instead of an insulin level matters most in a treated patient.", "stem": "Why is C-peptide, rather than a serum insulin level, used in a patient already taking insulin?", "options": [{"letter": "A", "text": "Injected insulin contains no C-peptide"}, {"letter": "B", "text": "C-peptide lowers glucose directly"}, {"letter": "C", "text": "Insulin assays also detect antibodies"}, {"letter": "D", "text": "C-peptide is cleared faster than insulin"}], "answer": "A", "explanation": "Exogenous insulin carries **no C-peptide**, so the measurement reflects only what the patient makes."}], "checkpoints": [{"stem": "A 55-year-old with obesity and newly found hyperglycemia has an elevated C-peptide. What does this suggest?", "options": [{"letter": "A", "text": "Absolute insulin deficiency"}, {"letter": "B", "text": "An autoimmune process"}, {"letter": "C", "text": "Diabetes insipidus"}, {"letter": "D", "text": "Insulin resistance, consistent with type 2 diabetes"}], "answer": "D", "explanation": "High C-peptide means **hyperinsulinemia and resistance** — type 2 diabetes."}, {"stem": "How does the half-life of C-peptide compare with that of insulin, and why does that help?", "options": [{"letter": "A", "text": "3–4× longer, giving a steadier measurement"}, {"letter": "B", "text": "Much shorter, giving a real-time measurement"}, {"letter": "C", "text": "Identical, so either may be measured"}, {"letter": "D", "text": "Highly variable, so it is rarely useful"}], "answer": "A", "explanation": "C-peptide lasts **3–4 times longer**, making it the more reliable sample."}]}}, {"id": "12", "group": 12, "section": "Type 1 versus type 2", "topic": "LADA", "skill": "Identification", "stem": "Which diagnosis should be suspected in a 38-year-old with a BMI of 23, fairly acute onset of diabetes, and Hashimoto thyroiditis?", "options": [{"letter": "A", "text": "Type 2 DM"}, {"letter": "B", "text": "Diabetes insipidus"}, {"letter": "C", "text": "Prediabetes"}, {"letter": "D", "text": "LADA"}], "answer": "D", "explanation": "Age 30–50, acute onset, BMI < 25 and an autoimmune history point to **latent autoimmune diabetes of adults**.", "objective": "", "remediation": {"steps": [{"teach": "The LADA features are age over 30 and under 50, fairly acute onset, BMI under 25, and personal or family autoimmune disease.", "stem": "How many of the four LADA features does this patient show?", "options": [{"letter": "A", "text": "Only one"}, {"letter": "B", "text": "All four"}], "answer": "B", "explanation": "She meets **all four**, and two are enough to make the diagnosis worth pursuing.", "clarify": [{"stem": "Is LADA an autoimmune disease like type 1, or a resistant state like type 2?", "options": [{"letter": "A", "text": "Autoimmune, like type 1"}, {"letter": "B", "text": "Resistant, like type 2"}], "answer": "A", "explanation": "LADA is indolent **autoimmune** β-cell destruction — type 1 arriving slowly in an adult."}]}, {"teach": "Because the mechanism is autoimmune, the confirming test is an antibody rather than a glucose study.", "stem": "Which test should be ordered when LADA is suspected in a slim adult?", "options": [{"letter": "A", "text": "A 2-hour OGTT"}, {"letter": "B", "text": "A FIB-4 score"}, {"letter": "C", "text": "Anti-GAD antibodies"}, {"letter": "D", "text": "A urine albumin-to-creatinine ratio"}], "answer": "C", "explanation": "Order **anti-GAD**; two or more LADA features give about 90% sensitivity for a positive result."}], "checkpoints": [{"stem": "Why is LADA so often misdiagnosed as type 2 diabetes at first?", "options": [{"letter": "A", "text": "These patients are typically obese"}, {"letter": "B", "text": "It almost always presents in ketoacidosis"}, {"letter": "C", "text": "Islet antibodies are usually negative"}, {"letter": "D", "text": "Oral agents work initially and insulin is not needed at diagnosis"}], "answer": "D", "explanation": "Oral agents work for a while, so the shift to **insulin dependence** over months to years is what gives it away."}, {"stem": "How sensitive is the presence of at least two LADA features for anti-GAD positivity?", "options": [{"letter": "A", "text": "About 50%"}, {"letter": "B", "text": "About 90%"}, {"letter": "C", "text": "About 15%"}, {"letter": "D", "text": "About 25%"}], "answer": "B", "explanation": "Two or more features carry roughly **90% sensitivity**."}]}}, {"id": "13", "group": 13, "section": "Islet autoantibodies", "topic": "T1 vs T2 — antibodies & C-peptide", "skill": "Diagnostics & imaging", "stem": "Which antibodies belong to the islet autoantibody panel ordered when type 1 diabetes is suspected?", "options": [{"letter": "A", "text": "Anti-IA-2"}, {"letter": "B", "text": "Anti-thyroid peroxidase"}, {"letter": "C", "text": "Anti-tissue transglutaminase"}, {"letter": "D", "text": "Anti-ZnT8"}, {"letter": "E", "text": "Anti-GAD65"}, {"letter": "F", "text": "Insulin autoantibodies"}], "answer": ["A", "D", "E", "F"], "explanation": "The panel is **GAD65, IA-2, ZnT8, insulin autoantibodies and islet-cell antibodies**; 85–90% of patients with type 1 have at least one. Anti-TPO and anti-tTG mark thyroid and celiac disease.", "objective": "", "remediation": {"steps": [{"teach": "One member of the panel carries most of the diagnostic yield and is usually sent first.", "stem": "Which single islet antibody is positive in roughly 60–80% of new-onset type 1 diabetes?", "options": [{"letter": "A", "text": "Insulin autoantibodies"}, {"letter": "B", "text": "Anti-CD3"}, {"letter": "C", "text": "Anti-GAD65"}, {"letter": "D", "text": "Anti-ZnT8"}], "answer": "C", "explanation": "**Anti-GAD65** leads the panel; anti-CD3 is not an antibody test at all but teplizumab's target.", "clarify": [{"stem": "What share of type 1 patients are positive when anti-GAD65 and anti-IA-2 are combined?", "options": [{"letter": "A", "text": "More than 90%"}, {"letter": "B", "text": "Fewer than 40%"}], "answer": "A", "explanation": "Together the two catch **over 90%** of cases."}]}, {"teach": "Antibodies directed at other organs belong to other autoimmune diseases, even though they often travel together.", "stem": "Why is anti-thyroid peroxidase not part of the islet autoantibody panel?", "options": [{"letter": "A", "text": "It is positive in everyone with diabetes"}, {"letter": "B", "text": "It marks thyroid autoimmunity, not β-cell autoimmunity"}, {"letter": "C", "text": "It is only valid in children"}, {"letter": "D", "text": "It is run by a different laboratory"}], "answer": "B", "explanation": "Anti-TPO marks **autoimmune thyroid disease**; it says nothing about the islets."}], "checkpoints": [{"stem": "A healthy adult with no family history of diabetes asks to have islet autoantibodies checked. What is the appropriate response?", "options": [{"letter": "A", "text": "Order anti-GAD65 by itself"}, {"letter": "B", "text": "Screen only if the A1C is normal"}, {"letter": "C", "text": "Screening is not recommended in the general low-risk population"}, {"letter": "D", "text": "Order the full panel today"}], "answer": "C", "explanation": "Autoantibody screening is reserved for **high-risk people**, chiefly relatives of someone with type 1."}, {"stem": "A 9-year-old whose brother has type 1 diabetes is being evaluated for presymptomatic disease. What should be ordered?", "options": [{"letter": "A", "text": "C-peptide and a serum insulin level"}, {"letter": "B", "text": "FIB-4 and a UACR"}, {"letter": "C", "text": "An ankle-brachial index"}, {"letter": "D", "text": "The islet autoantibody panel"}], "answer": "D", "explanation": "First-degree relatives are screened with **GAD65, IA-2, ZnT8, IAA and ICA**."}]}}, {"id": "14", "group": 14, "section": "Islet autoantibodies", "topic": "T1 vs T2 — antibodies & C-peptide", "skill": "Diagnostics & imaging", "stem": "What is the next step when type 1 diabetes is suspected but anti-GAD65 testing is negative?", "options": [{"letter": "A", "text": "Test IA-2 or ZnT8 antibodies"}, {"letter": "B", "text": "Repeat GAD65 in 3 years"}, {"letter": "C", "text": "Rule out type 1 DM"}, {"letter": "D", "text": "Diagnose type 2 DM"}], "answer": "A", "explanation": "A negative anti-GAD65 should prompt **IA-2 or ZnT8 testing** and, where needed, specialist consultation.", "objective": "", "remediation": {"steps": [{"teach": "Anti-GAD65 misses a substantial minority of cases, so a negative result is not an exclusion.", "stem": "Does a negative anti-GAD65 result exclude type 1 diabetes?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "A single negative antibody does **not** exclude autoimmune diabetes.", "clarify": [{"stem": "In roughly what percentage of new-onset type 1 diabetes is anti-GAD65 positive?", "options": [{"letter": "A", "text": "60–80%"}, {"letter": "B", "text": "Nearly 100%"}], "answer": "A", "explanation": "**60–80%**, varying with age and sex."}]}, {"teach": "Testing moves on through the rest of the islet panel rather than switching organs.", "stem": "Which antibodies should be checked next when anti-GAD65 is negative but suspicion persists?", "options": [{"letter": "A", "text": "None — repeat GAD65 in 3 years"}, {"letter": "B", "text": "Anti-TPO and anti-tTG"}, {"letter": "C", "text": "Insulin and C-peptide"}, {"letter": "D", "text": "IA-2 and ZnT8"}], "answer": "D", "explanation": "Move on to **IA-2 and ZnT8**, and consult a specialist if they are also negative."}], "checkpoints": [{"stem": "What does a positive anti-GAD65 mean in a patient clinically suspected of having type 1 diabetes?", "options": [{"letter": "A", "text": "It confirms type 2 diabetes"}, {"letter": "B", "text": "It rules out LADA"}, {"letter": "C", "text": "It supports autoimmune (type 1) diabetes"}, {"letter": "D", "text": "It establishes stage 3 disease"}], "answer": "C", "explanation": "A positive antibody with clinical suspicion means **autoimmune diabetes**."}]}}, {"id": "15", "group": 15, "section": "Islet autoantibodies", "topic": "T1 vs T2 — antibodies & C-peptide", "skill": "Diagnostics & imaging", "stem": "What determines risk stratification based on islet autoantibodies?", "options": [{"letter": "A", "text": "Antibody titer level"}, {"letter": "B", "text": "Age at testing"}, {"letter": "C", "text": "Number of positive antibodies"}, {"letter": "D", "text": "Which antibody is positive"}], "answer": "C", "explanation": "Risk is stratified by the **number** of positive autoantibodies, not by which one is positive.", "objective": "", "remediation": {"steps": [{"teach": "Compare the two groups: one positive antibody carries about a 15% risk over 15 years, two or more carries over 90%.", "stem": "What distinguishes the high-risk group from the low-risk group in autoantibody testing?", "options": [{"letter": "A", "text": "Which particular antibody is positive"}, {"letter": "B", "text": "The number of positive antibodies"}], "answer": "B", "explanation": "The **count** drives the risk.", "clarify": [{"stem": "What happens to roughly half of the people who have only one positive antibody?", "options": [{"letter": "A", "text": "They progress within 5 years"}, {"letter": "B", "text": "They revert to antibody-negative"}], "answer": "B", "explanation": "About **50% revert**, and only ~15% progress over 15 years."}]}, {"teach": "Attach a number to the high-risk group, because that number is what triggers referral.", "stem": "What is the approximate 5-year risk of symptomatic type 1 diabetes with two or more positive antibodies?", "options": [{"letter": "A", "text": "About 15%"}, {"letter": "B", "text": "About 6%"}, {"letter": "C", "text": "About 40%"}, {"letter": "D", "text": "About 90%"}], "answer": "C", "explanation": "Two or more antibodies carry roughly **40% within 5 years**."}], "checkpoints": [{"stem": "A child has one positive islet autoantibody and a normal glucose. What is the appropriate management?", "options": [{"letter": "A", "text": "Start teplizumab now"}, {"letter": "B", "text": "Begin insulin therapy"}, {"letter": "C", "text": "No further follow-up is needed"}, {"letter": "D", "text": "Repeat antibodies, glucose and A1C at set intervals"}], "answer": "D", "explanation": "A single antibody calls for **scheduled repeat testing**, unless it is IA-2."}]}}, {"id": "15a", "group": 15, "section": "Islet autoantibodies", "topic": "T1 vs T2 — antibodies & C-peptide", "skill": "Diagnostics & imaging", "stem": "What is the next step for a patient found to have two or more positive islet autoantibodies?", "options": [{"letter": "A", "text": "Repeat antibodies in 3 yr"}, {"letter": "B", "text": "Refer to endocrinology"}, {"letter": "C", "text": "Start metformin"}, {"letter": "D", "text": "No follow-up needed"}], "answer": "B", "explanation": "Two or more antibodies mean ~40% risk within 5 years and > 90% within 15, so **refer to endocrinology** for presymptomatic type 1 care.", "objective": "", "remediation": {"steps": [{"teach": "Put the number in context before deciding what to do with it.", "stem": "How would you characterize the risk carried by two or more positive antibodies?", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High"}], "answer": "B", "explanation": "This is a **high-risk** group, not a group for reassurance.", "clarify": [{"stem": "Which specialty manages presymptomatic type 1 diabetes?", "options": [{"letter": "A", "text": "Endocrinology"}, {"letter": "B", "text": "Nephrology"}], "answer": "A", "explanation": "**Endocrinology** handles staging, education and monitoring."}]}, {"teach": "Referral is not a formality — it buys specific things for the patient.", "stem": "What does referral at this point actually make possible?", "options": [{"letter": "A", "text": "Immediate insulin independence"}, {"letter": "B", "text": "Reversal of the autoantibodies"}, {"letter": "C", "text": "Staging, education and monitoring before ketoacidosis"}, {"letter": "D", "text": "An end to all further testing"}], "answer": "C", "explanation": "Staging allows intervention **before DKA**, including teplizumab in stage 2."}], "checkpoints": [{"stem": "What is the risk of symptomatic type 1 diabetes within 15 years with two or more antibodies?", "options": [{"letter": "A", "text": "About 15%"}, {"letter": "B", "text": "About 6%"}, {"letter": "C", "text": "About 40%"}, {"letter": "D", "text": "More than 90%"}], "answer": "D", "explanation": "**Over 90%** within 15 years."}]}}, {"id": "16", "group": 16, "section": "Presymptomatic type 1 DM", "topic": "Presymptomatic T1DM staging & screening", "skill": "Diagnostics & imaging", "stem": "Which stage of type 1 diabetes is characterized by at least two islet autoantibodies, normal glucose, and no symptoms?", "options": [{"letter": "A", "text": "Stage 2"}, {"letter": "B", "text": "Stage 3"}, {"letter": "C", "text": "Not staged"}, {"letter": "D", "text": "Stage 1"}], "answer": "D", "explanation": "**Stage 1** is two or more islet autoantibodies with normal glucose and no symptoms.", "objective": "", "remediation": {"steps": [{"teach": "Stages 1 and 2 share the antibodies and the absence of symptoms; only the glucose separates them.", "stem": "Which stage has two or more antibodies and dysglycemia but still no symptoms?", "options": [{"letter": "A", "text": "Stage 2"}, {"letter": "B", "text": "Stage 1"}], "answer": "A", "explanation": "Dysglycemia without symptoms is **stage 2**.", "clarify": [{"stem": "What defines stage 3 of type 1 diabetes?", "options": [{"letter": "A", "text": "Antibodies with no glucose abnormality"}, {"letter": "B", "text": "Overt hyperglycemia meeting standard criteria"}], "answer": "B", "explanation": "Stage 3 is **clinical onset** — the classic diagnosis."}]}, {"teach": "The 2026 update changes how one particular single antibody is handled.", "stem": "Under the 2026 update, how should a patient with a single confirmed IA-2 antibody be monitored?", "options": [{"letter": "A", "text": "As though in stage 1"}, {"letter": "B", "text": "As though in stage 3"}, {"letter": "C", "text": "As though in stage 2"}, {"letter": "D", "text": "As general population"}], "answer": "C", "explanation": "A confirmed single **IA-2** antibody has high predictive value and earns stage-2 monitoring."}], "checkpoints": [{"stem": "A relative with two positive antibodies and an A1C of 6.0% has no symptoms. Which stage is this?", "options": [{"letter": "A", "text": "Stage 1"}, {"letter": "B", "text": "Stage 3"}, {"letter": "C", "text": "Not staged"}, {"letter": "D", "text": "Stage 2"}], "answer": "D", "explanation": "An A1C of 5.7–6.4% is dysglycemia, so this is **stage 2**."}, {"stem": "A single positive anti-GAD65 with a normal glucose calls for what?", "options": [{"letter": "A", "text": "Repeat testing at set intervals"}, {"letter": "B", "text": "Monitoring as stage 2"}, {"letter": "C", "text": "Teplizumab"}, {"letter": "D", "text": "Starting insulin"}], "answer": "A", "explanation": "Other single antibodies get **scheduled repeat testing**, not stage-2 monitoring."}]}}, {"id": "17", "group": 17, "section": "Presymptomatic type 1 DM", "topic": "Presymptomatic T1DM staging & screening", "skill": "Pharmacology", "stem": "Between which stages of type 1 diabetes does teplizumab, an anti-CD3 antibody, delay progression?", "options": [{"letter": "A", "text": "Stage 1 to Stage 2"}, {"letter": "B", "text": "Stage 2 to Stage 3"}, {"letter": "C", "text": "Prediabetes to T2DM"}, {"letter": "D", "text": "Stage 3 to DKA"}], "answer": "B", "explanation": "**Teplizumab** is given in stage 2 and delays progression to **stage 3**, clinical onset — the first disease-modifying therapy for type 1.", "objective": "", "remediation": {"steps": [{"teach": "Fix which stage counts as clinical onset before deciding where a preventive drug belongs.", "stem": "Which stage of type 1 diabetes represents clinical onset?", "options": [{"letter": "A", "text": "Stage 3"}, {"letter": "B", "text": "Stage 1"}], "answer": "A", "explanation": "**Stage 3** is overt hyperglycemia meeting standard criteria.", "clarify": [{"stem": "What kind of drug is teplizumab?", "options": [{"letter": "A", "text": "An anti-CD3 monoclonal antibody"}, {"letter": "B", "text": "A GLP-1 receptor agonist"}], "answer": "A", "explanation": "It is an **anti-CD3 monoclonal antibody**."}]}, {"teach": "A disease-modifying drug has to be given while there is still something to preserve.", "stem": "At which point in the course of type 1 diabetes is teplizumab given?", "options": [{"letter": "A", "text": "After several years of insulin therapy"}, {"letter": "B", "text": "In anyone with one positive antibody"}, {"letter": "C", "text": "At the time of ketoacidosis"}, {"letter": "D", "text": "In stage 2, before clinical onset"}], "answer": "D", "explanation": "It is given in **stage 2**, while glucose is only mildly abnormal."}], "checkpoints": [{"stem": "What is the main clinical reason for staging presymptomatic type 1 diabetes at all?", "options": [{"letter": "A", "text": "To decide about statin therapy"}, {"letter": "B", "text": "To set an A1C goal"}, {"letter": "C", "text": "To monitor and intervene before ketoacidosis"}, {"letter": "D", "text": "To diagnose type 2 diabetes"}], "answer": "C", "explanation": "Staging exists so that monitoring and treatment happen **before DKA**."}]}}, {"id": "18", "group": 18, "section": "Glycemic control targets", "topic": "Glycemic targets & glucose monitoring", "skill": "Diagnostics & imaging", "stem": "What is the A1C goal for most adults with diabetes?", "options": [{"letter": "A", "text": "< 6.5%"}, {"letter": "B", "text": "< 8%"}, {"letter": "C", "text": "< 7%"}, {"letter": "D", "text": "< 5.7%"}], "answer": "C", "explanation": "ADA: **A1C < 7%** for most patients, with a less stringent < 8% where life expectancy is limited.", "objective": "", "remediation": {"steps": [{"teach": "The diagnostic cutoff and the treatment goal are different numbers, and a third number exists for frail patients.", "stem": "Which A1C goal applies to a patient with limited life expectancy?", "options": [{"letter": "A", "text": "< 8%"}, {"letter": "B", "text": "< 7%"}], "answer": "A", "explanation": "A less stringent **< 8%** is appropriate there.", "clarify": [{"stem": "What does an A1C of 6.5% or above represent?", "options": [{"letter": "A", "text": "The treatment goal in established diabetes"}, {"letter": "B", "text": "The diagnostic cutoff for diabetes"}], "answer": "B", "explanation": "6.5% is the **diagnostic** threshold, not a goal."}]}, {"teach": "Finger-stick targets are simply what it takes, day to day, to land under 7%.", "stem": "Which self-monitored glucose targets usually correspond to an A1C below 7%?", "options": [{"letter": "A", "text": "Preprandial < 70 and postprandial < 100 mg/dL"}, {"letter": "B", "text": "Preprandial 80–130 and peak postprandial < 180 mg/dL"}, {"letter": "C", "text": "Preprandial 130–180 and postprandial < 250 mg/dL"}, {"letter": "D", "text": "Any value below 200 mg/dL at any time"}], "answer": "B", "explanation": "**Preprandial 80–130** and **peak postprandial < 180 mg/dL**."}], "checkpoints": [{"stem": "When is the peak postprandial glucose measured after a meal?", "options": [{"letter": "A", "text": "At 8 hours"}, {"letter": "B", "text": "Within 15 minutes"}, {"letter": "C", "text": "90 minutes to 2 hours"}, {"letter": "D", "text": "At 4 hours"}], "answer": "C", "explanation": "Peak postprandial glucose is checked **90 minutes to 2 hours** after eating."}]}}, {"id": "19", "group": 19, "section": "Glycemic control targets", "topic": "Glycemic targets & glucose monitoring", "skill": "Diagnostics & imaging", "stem": "How often should A1C be measured when glycemic goals are not met or treatment has recently changed?", "options": [{"letter": "A", "text": "Every 3 months"}, {"letter": "B", "text": "Every 6 months"}, {"letter": "C", "text": "Every 12 months"}, {"letter": "D", "text": "Every month"}], "answer": "A", "explanation": "A1C is checked **quarterly** when a patient is off goal or therapy has changed, and twice a year when stable at goal.", "objective": "", "remediation": {"steps": [{"teach": "The interval follows the biology of the test: A1C needs about one red-cell window to move.", "stem": "How often should A1C be checked in a patient at goal on stable therapy?", "options": [{"letter": "A", "text": "Every 6 months"}, {"letter": "B", "text": "Every 3 months"}], "answer": "A", "explanation": "Stable and at goal means **at least twice a year**.", "clarify": [{"stem": "Why is checking an A1C monthly of little value?", "options": [{"letter": "A", "text": "The assay is unreliable"}, {"letter": "B", "text": "It reflects about 3 months of glucose"}], "answer": "B", "explanation": "A month is too short for the **3-month** average to move meaningfully."}]}, {"teach": "Apply the shorter interval after any change in regimen.", "stem": "A patient's regimen was changed last month. When should the next A1C be drawn?", "options": [{"letter": "A", "text": "In 2 weeks"}, {"letter": "B", "text": "In 6 months"}, {"letter": "C", "text": "In 1 year"}, {"letter": "D", "text": "In about 3 months"}], "answer": "D", "explanation": "Wait roughly **3 months** so the A1C reflects the new regimen."}], "checkpoints": [{"stem": "Which patients need quarterly rather than twice-yearly A1C testing?", "options": [{"letter": "A", "text": "Only patients using CGM"}, {"letter": "B", "text": "Those at goal on stable therapy"}, {"letter": "C", "text": "All patients with prediabetes"}, {"letter": "D", "text": "Those not at goal or whose therapy recently changed"}], "answer": "D", "explanation": "Quarterly testing is for patients **off goal or recently changed**."}]}}, {"id": "20", "group": 20, "section": "Glycemic control targets", "topic": "Glycemic targets & glucose monitoring", "skill": "Diagnostics & imaging", "stem": "What is the goal for continuous glucose monitoring time in the range of 70–180 mg/dL?", "options": [{"letter": "A", "text": "> 25%"}, {"letter": "B", "text": "> 70%"}, {"letter": "C", "text": "> 50%"}, {"letter": "D", "text": "> 90%"}], "answer": "B", "explanation": "**Time in range > 70%**, with time above range < 25% and time below range < 4%.", "objective": "", "remediation": {"steps": [{"teach": "The CGM targets describe a shape: most of the day in range, a slice above, a very thin slice below.", "stem": "What is the goal for time above range, above 180 mg/dL, on a CGM report?", "options": [{"letter": "A", "text": "Less than 25%"}, {"letter": "B", "text": "Less than 4%"}], "answer": "A", "explanation": "Time above range should be **< 25%**, with time over 250 mg/dL under 5%.", "clarify": [{"stem": "Which glucose window is counted as time in range?", "options": [{"letter": "A", "text": "70–180 mg/dL"}, {"letter": "B", "text": "80–130 mg/dL"}], "answer": "A", "explanation": "Time in range is **70–180 m
