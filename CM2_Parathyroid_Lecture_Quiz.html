<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
    transition: background-color 0.3s ease;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  #bglayer { position: fixed; inset: 0; z-index: -1; background-size: cover;
    background-position: center; background-repeat: no-repeat; display: none; }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }

ium."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "↑ Calcium, ↓ phosphate, ↑ intact PTH → Diagnosis:", "options": [{"letter": "A", "text": "Primary hyperparathyroidism"}, {"letter": "B", "text": "Secondary hyperparathyroidism"}, {"letter": "C", "text": "Humoral hypercalcemia of malignancy"}, {"letter": "D", "text": "Pseudohypoparathyroidism"}], "answer": "A", "explanation": "High calcium with a **non-suppressed PTH** and low phosphate = **primary hyperparathyroidism**."}], "checkpoints": [{"stem": "Hypercalcemia with a suppressed PTH and elevated PTHrP → Diagnosis:", "options": [{"letter": "A", "text": "Humoral hypercalcemia of malignancy"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Tertiary hyperparathyroidism"}, {"letter": "D", "text": "Familial hypocalciuric hypercalcemia"}], "answer": "A", "explanation": "Suppressed PTH + **↑ PTHrP** = humoral hypercalcemia of malignancy."}]}}, {"id": "13", "group": 13, "slide": 17, "section": "Polyuria mechanism", "topic": "Primary hyperparathyroidism", "skill": "Complications", "stem": "How does hypercalcemia cause polyuria and polydipsia?", "options": [{"letter": "A", "text": "SIADH"}, {"letter": "B", "text": "Osmotic diuresis from glucose"}, {"letter": "C", "text": "Nephrogenic diabetes insipidus"}, {"letter": "D", "text": "Central diabetes insipidus"}], "answer": "C", "explanation": "Hypercalcemia blunts the kidney's response to ADH → **nephrogenic DI** → polyuria, dehydration.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "ADH is still being made here — the problem is that the **kidney won't respond** to it.", "stem": "Kidneys that don't respond to circulating ADH cause which type of DI?", "options": [{"letter": "A", "text": "Nephrogenic"}, {"letter": "B", "text": "Central"}], "answer": "A", "explanation": "Renal unresponsiveness to ADH = **nephrogenic** DI.", "clarify": [{"stem": "Central DI is a lack of ADH from the…", "options": [{"letter": "A", "text": "Hypothalamus/pituitary"}, {"letter": "B", "text": "Kidney"}], "answer": "A", "explanation": "Central DI = **no ADH made** — not the hypercalcemia mechanism."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hypercalcemia causing polyuria and polydipsia (\"thrones\") → Mechanism:", "options": [{"letter": "A", "text": "Nephrogenic diabetes insipidus"}, {"letter": "B", "text": "Central diabetes insipidus"}, {"letter": "C", "text": "Osmotic diuresis from glucose"}, {"letter": "D", "text": "SIADH"}], "answer": "A", "explanation": "Hypercalcemia blunts the kidney's response to ADH → **nephrogenic DI** → polyuria, dehydration."}], "checkpoints": [{"stem": "Hypercalcemia-associated crystal arthropathy → Disease:", "options": [{"letter": "A", "text": "Pseudogout (CPPD)"}, {"letter": "B", "text": "Gout"}, {"letter": "C", "text": "Septic arthritis"}, {"letter": "D", "text": "Rheumatoid arthritis"}], "answer": "A", "explanation": "PHPT can contribute to **calcium pyrophosphate deposition (pseudogout)**."}]}}, {"id": "14", "group": 14, "slide": 17, "section": "Hypercalcemia ECG", "topic": "Primary hyperparathyroidism", "skill": "Complications", "stem": "What is the classic ECG interval change associated with hypercalcemia?", "options": [{"letter": "A", "text": "Prolonged QT interval"}, {"letter": "B", "text": "Delta wave"}, {"letter": "C", "text": "Shortened QT interval"}, {"letter": "D", "text": "Peaked T waves"}], "answer": "C", "explanation": "Hypercalcemia **shortens the QT**; it can also cause bradycardia and AV block.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "Calcium and QT move in **opposite directions**.", "stem": "Hypocalcemia does what to the QT?", "options": [{"letter": "A", "text": "Prolongs it"}, {"letter": "B", "text": "Shortens it"}], "answer": "A", "explanation": "Low Ca → long QT, so **high Ca → short QT**.", "clarify": [{"stem": "Peaked T waves are the classic sign of…", "options": [{"letter": "A", "text": "Hyperkalemia"}, {"letter": "B", "text": "Hypercalcemia"}], "answer": "A", "explanation": "Peaked T = **potassium**, not calcium."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hypercalcemia → Classic ECG interval change:", "options": [{"letter": "A", "text": "Shortened QT interval"}, {"letter": "B", "text": "Prolonged QT interval"}, {"letter": "C", "text": "Peaked T waves"}, {"letter": "D", "text": "Delta wave"}], "answer": "A", "explanation": "Hypercalcemia **shortens the QT**; it can also cause bradycardia and AV block."}], "checkpoints": [{"stem": "Bradyarrhythmia commonly seen with hypercalcemia → Rhythm:", "options": [{"letter": "A", "text": "AV block"}, {"letter": "B", "text": "Atrial flutter"}, {"letter": "C", "text": "Ventricular tachycardia"}, {"letter": "D", "text": "WPW pre-excitation"}], "answer": "A", "explanation": "Hypercalcemia can cause **bradycardia and AV block**."}]}}, {"id": "15", "group": 15, "slide": 19, "section": "PHPT mnemonic", "topic": "Primary hyperparathyroidism", "skill": "Identification", "stem": "Which electrolyte disorder can cause kidney stones, bone pain, constipation, polyuria, and depression?", "options": [{"letter": "A", "text": "Hypocalcemia"}, {"letter": "B", "text": "Hyponatremia"}, {"letter": "C", "text": "Hypokalemia"}, {"letter": "D", "text": "Hypercalcemia"}], "answer": "D", "explanation": "\"**Stones, bones, abdominal groans, thrones, psychiatric overtones**\" = symptomatic hypercalcemia (classically PHPT).", "objective": "", "bg": "#e0edff", "remediation": {"steps": [{"teach": "Calcium stones and bone loss both point to calcium being **pulled out of bone and dumped in urine**.", "stem": "Calcium nephrolithiasis and osteopenia suggest serum calcium is…", "options": [{"letter": "A", "text": "Elevated"}, {"letter": "B", "text": "Low"}], "answer": "A", "explanation": "Bone resorption + stones = **high calcium**.", "clarify": [{"stem": "Tetany and perioral tingling suggest…", "options": [{"letter": "A", "text": "Low calcium"}, {"letter": "B", "text": "High calcium"}], "answer": "A", "explanation": "Neuromuscular irritability = **hypocalcemia** — the opposite picture."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Kidney stones, bone pain, constipation, polyuria, depression → Electrolyte disorder:", "options": [{"letter": "A", "text": "Hypercalcemia"}, {"letter": "B", "text": "Hypocalcemia"}, {"letter": "C", "text": "Hypokalemia"}, {"letter": "D", "text": "Hyponatremia"}], "answer": "A", "explanation": "\"**Stones, bones, abdominal groans, thrones, psychiatric overtones**\" = symptomatic hypercalcemia (classically PHPT)."}], "checkpoints": [{"stem": "\"Abdominal groans\" in the PHPT mnemonic → Classic GI symptom:", "options": [{"letter": "A", "text": "Constipation"}, {"letter": "B", "text": "Diarrhea"}, {"letter": "C", "text": "Hematemesis"}, {"letter": "D", "text": "Steatorrhea"}], "answer": "A", "explanation": "Hypercalcemia slows the gut: **constipation**, nausea, anorexia."}]}}, {"id": "16", "group": 16, "slide": 21, "section": "Inappropriately normal PTH", "topic": "Primary hyperparathyroidism", "skill": "Diagnostics & imaging", "stem": "How should a PTH level of 50 pg/mL, reported as normal, be interpreted when calcium is 11.4 mg/dL?", "options": [{"letter": "A", "text": "Consistent with primary hyperparathyroidism"}, {"letter": "B", "text": "Rules out parathyroid disease"}, {"letter": "C", "text": "Hypercalcemia of malignancy"}, {"letter": "D", "text": "Lab artifact from low albumin"}], "answer": "A", "explanation": "With high calcium, PTH should be **suppressed** — a normal PTH is **inappropriately normal** and still fits PHPT.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "Always read PTH **against the calcium**. Ask what a healthy gland would do when calcium is high.", "stem": "With hypercalcemia, a healthy parathyroid's PTH should be…", "options": [{"letter": "A", "text": "Low (suppressed)"}, {"letter": "B", "text": "Normal"}, {"letter": "C", "text": "High"}], "answer": "A", "explanation": "Normal glands **suppress** PTH when calcium is high.", "clarify": [{"stem": "Malignancy-related hypercalcemia typically shows a PTH that is…", "options": [{"letter": "A", "text": "Suppressed"}, {"letter": "B", "text": "Normal or high"}], "answer": "A", "explanation": "A normal PTH argues **against** malignancy."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Calcium 11.4 mg/dL with PTH 50 pg/mL (\"normal\") → Interpretation:", "options": [{"letter": "A", "text": "Consistent with primary hyperparathyroidism"}, {"letter": "B", "text": "Rules out parathyroid disease"}, {"letter": "C", "text": "Hypercalcemia of malignancy"}, {"letter": "D", "text": "Lab artifact from low albumin"}], "answer": "A", "explanation": "With high calcium, PTH should be **suppressed** — a normal PTH is **inappropriately normal** and still fits PHPT."}], "checkpoints": [{"stem": "PHPT diagnosis is established by → Method:", "options": [{"letter": "A", "text": "Biochemical labs (Ca + PTH)"}, {"letter": "B", "text": "Sestamibi scan"}, {"letter": "C", "text": "Neck ultrasound"}, {"letter": "D", "text": "Skull x-ray"}], "answer": "A", "explanation": "PHPT is diagnosed **biochemically**; imaging only localizes or assesses end-organ effects."}]}}, {"id": "17", "group": 17, "slide": 21, "section": "Localization imaging", "topic": "Primary hyperparathyroidism", "skill": "Diagnostics & imaging", "stem": "Which study is used to localize the abnormal gland before surgery for confirmed primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Sestamibi parathyroid scan"}, {"letter": "B", "text": "Plain skull radiograph"}, {"letter": "C", "text": "Non-contrast CT abdomen"}, {"letter": "D", "text": "DXA bone density scan"}], "answer": "A", "explanation": "A **nuclear medicine parathyroid (sestamibi) scan** localizes the gland(s) for surgery — it does not make the diagnosis.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "This imaging is for **surgical planning**, after the diagnosis is already made, and gland location can vary (even mediastinum).", "stem": "The goal of this study is to…", "options": [{"letter": "A", "text": "Find which gland to remove"}, {"letter": "B", "text": "Confirm the diagnosis of PHPT"}], "answer": "A", "explanation": "The diagnosis is already made by labs — imaging **finds the gland**.", "clarify": [{"stem": "Non-contrast CT abdomen in PHPT is used to look for…", "options": [{"letter": "A", "text": "Kidney stones"}, {"letter": "B", "text": "The adenoma"}], "answer": "A", "explanation": "Renal imaging assesses **nephrolithiasis/nephrocalcinosis**."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Confirmed PHPT, planning surgery → Study to localize the abnormal gland:", "options": [{"letter": "A", "text": "Sestamibi parathyroid scan"}, {"letter": "B", "text": "Non-contrast CT abdomen"}, {"letter": "C", "text": "DXA bone density scan"}, {"letter": "D", "text": "Plain skull radiograph"}], "answer": "A", "explanation": "A **nuclear medicine parathyroid (sestamibi) scan** localizes the gland(s) for surgery — it does not make the diagnosis."}], "checkpoints": [{"stem": "Confirmed PHPT → Preferred study for skeletal involvement:", "options": [{"letter": "A", "text": "DXA with vertebral fracture assessment"}, {"letter": "B", "text": "Sestamibi scan"}, {"letter": "C", "text": "Renal ultrasound"}, {"letter": "D", "text": "Bone biopsy"}], "answer": "A", "explanation": "**DXA with VFA** assesses osteoporosis and fragility fractures."}]}}, {"id": "18", "group": 18, "slide": 21, "section": "FHH look-alike", "topic": "Other hypercalcemia causes", "skill": "Diagnostics & imaging", "stem": "Which diagnosis is most likely in a patient with mild hypercalcemia, normal or mildly elevated PTH, and a calcium-to-creatinine clearance ratio below 0.01 on a 24-hour urine collection?", "options": [{"letter": "A", "text": "Milk-alkali syndrome"}, {"letter": "B", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "C", "text": "Primary hyperparathyroidism"}, {"letter": "D", "text": "Tertiary hyperparathyroidism"}], "answer": "B", "explanation": "**Familial hypocalciuric hypercalcemia** mimics PHPT but has **low urinary calcium** (Ca/Cr < 0.01); PHPT is > 0.02.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "The name gives it away — look at what the **urine** calcium is doing.", "stem": "A urine Ca/Cr clearance ratio below 0.01 means urinary calcium is…", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High"}], "answer": "A", "explanation": "< 0.01 = **hypocalciuria**.", "clarify": [{"stem": "In PHPT, urinary calcium is usually…", "options": [{"letter": "A", "text": "High (ratio > 0.02)"}, {"letter": "B", "text": "Low (ratio < 0.01)"}], "answer": "A", "explanation": "PHPT → **hypercalciuria**, a stone risk."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Mild hypercalcemia, normal/mildly ↑ PTH, 24-h urine Ca/Cr clearance < 0.01 → Diagnosis:", "options": [{"letter": "A", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Tertiary hyperparathyroidism"}, {"letter": "D", "text": "Milk-alkali syndrome"}], "answer": "A", "explanation": "**Familial hypocalciuric hypercalcemia** mimics PHPT but has **low urinary calcium** (Ca/Cr < 0.01); PHPT is > 0.02."}], "checkpoints": [{"stem": "Why exclude FHH before parathyroidectomy?", "options": [{"letter": "A", "text": "Surgery does not help FHH"}, {"letter": "B", "text": "FHH requires urgent surgery"}, {"letter": "C", "text": "FHH causes severe stones"}, {"letter": "D", "text": "FHH is a malignancy"}], "answer": "A", "explanation": "FHH is an inherited calcium-sensing problem that **surgery does not fix** — it's a mimic to rule out."}]}}, {"id": "19", "group": 19, "slide": 22, "section": "Salt-and-pepper skull", "topic": "Skeletal findings of PTH excess", "skill": "Diagnostics & imaging", "stem": "What radiographic sign describes diffuse granular lytic foci in the skull in severe hyperparathyroidism?", "options": [{"letter": "A", "text": "Hair-on-end skull"}, {"letter": "B", "text": "Salt-and-pepper skull"}, {"letter": "C", "text": "Punched-out lesions"}, {"letter": "D", "text": "Rugger-jersey spine"}], "answer": "B", "explanation": "**Salt-and-pepper (pepper-pot) skull** = diffuse trabecular resorption, a feature of **osteitis fibrosa cystica**.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "The pattern is **granular, diffuse demineralization** of the calvarium from bone resorption.", "stem": "Tiny scattered lucencies throughout the skull describe…", "options": [{"letter": "A", "text": "Granular 'salt-and-pepper' resorption"}, {"letter": "B", "text": "Striped vertebral endplates"}], "answer": "A", "explanation": "Diffuse tiny foci = **salt-and-pepper**.", "clarify": [{"stem": "Rugger-jersey sign is seen in the…", "options": [{"letter": "A", "text": "Spine"}, {"letter": "B", "text": "Skull"}], "answer": "A", "explanation": "Rugger-jersey is a **vertebral** finding."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Skull film with diffuse granular lytic foci in severe hyperparathyroidism → Sign:", "options": [{"letter": "A", "text": "Salt-and-pepper skull"}, {"letter": "B", "text": "Rugger-jersey spine"}, {"letter": "C", "text": "Punched-out lesions"}, {"letter": "D", "text": "Hair-on-end skull"}], "answer": "A", "explanation": "**Salt-and-pepper (pepper-pot) skull** = diffuse trabecular resorption, a feature of **osteitis fibrosa cystica**."}], "checkpoints": [{"stem": "Is a salt-and-pepper skull required to diagnose PHPT?", "options": [{"letter": "A", "text": "No — diagnosis is biochemical"}, {"letter": "B", "text": "Yes — it is the gold standard"}, {"letter": "C", "text": "Only in men"}, {"letter": "D", "text": "Only after age 50"}], "answer": "A", "explanation": "Classic but uncommon; **PHPT is diagnosed by calcium and PTH**."}]}}, {"id": "20", "group": 20, "slide": 24, "section": "PHPT treatment of choice", "topic": "Primary hyperparathyroidism", "skill": "Management", "stem": "What is the definitive treatment for symptomatic primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Thiazide diuretic"}, {"letter": "B", "text": "Cinacalcet"}, {"letter": "C", "text": "Bisphosphonate"}, {"letter": "D", "text": "Parathyroidectomy"}], "answer": "D", "explanation": "**Parathyroidectomy** is definitive (curative in ~98%) and is indicated for all symptomatic patients.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "Ask which option actually **removes the cause** rather than treating a consequence.", "stem": "Bisphosphonates in PHPT improve bone density but…", "options": [{"letter": "A", "text": "Don't fix the parathyroid disorder"}, {"letter": "B", "text": "Cure the adenoma"}], "answer": "A", "explanation": "Bisphosphonates treat the **bones**, not the gland.", "clarify": [{"stem": "Thiazides in PHPT should be…", "options": [{"letter": "A", "text": "Avoided (raise calcium)"}, {"letter": "B", "text": "Used first-line"}], "answer": "A", "explanation": "Thiazides **reduce urinary calcium excretion** and worsen hypercalcemia."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Symptomatic primary hyperparathyroidism → Definitive treatment:", "options": [{"letter": "A", "text": "Parathyroidectomy"}, {"letter": "B", "text": "Cinacalcet"}, {"letter": "C", "text": "Bisphosphonate"}, {"letter": "D", "text": "Thiazide diuretic"}], "answer": "A", "explanation": "**Parathyroidectomy** is definitive (curative in ~98%) and is indicated for all symptomatic patients."}], "checkpoints": [{"stem": "PHPT patient who declines surgery, calcium 12.8 → Medication to lower calcium:", "options": [{"letter": "A", "text": "Cinacalcet"}, {"letter": "B", "text": "Hydrochlorothiazide"}, {"letter": "C", "text": "Calcitriol"}, {"letter": "D", "text": "Calcium carbonate"}], "answer": "A", "explanation": "When surgery isn't done, **cinacalcet** targets the high calcium; bisphosphonate/denosumab targets low bone density."}]}}, {"id": "21", "group": 21, "slide": 24, "section": "Surgical indication: age", "topic": "Primary hyperparathyroidism", "skill": "Management", "stem": "Which patient with asymptomatic primary hyperparathyroidism meets the criteria for parathyroidectomy?", "options": [{"letter": "A", "text": "Age 46, normal bones and kidneys"}, {"letter": "B", "text": "Age 70, T-score −1.4"}, {"letter": "C", "text": "Age 62, Ca 0.5 above ULN"}, {"letter": "D", "text": "Age 58, eGFR 80"}], "answer": "A", "explanation": "**Age < 50** alone is a surgical indication in asymptomatic PHPT.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "Indications in asymptomatic patients target those most likely to develop **end-organ damage** over time — and younger patients have the most years ahead.", "stem": "Which age cutoff is a surgical indication by itself?", "options": [{"letter": "A", "text": "Under 50"}, {"letter": "B", "text": "Over 65"}, {"letter": "C", "text": "Over 80"}], "answer": "A", "explanation": "**Age < 50** is a stand-alone indication.", "clarify": [{"stem": "A T-score of −1.4 is in which range?", "options": [{"letter": "A", "text": "Osteopenia (not an indication)"}, {"letter": "B", "text": "Osteoporosis (an indication)"}], "answer": "A", "explanation": "The skeletal criterion is **T-score ≤ −2.5** or vertebral fracture."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Asymptomatic PHPT → Which patient meets criteria for parathyroidectomy?", "options": [{"letter": "A", "text": "Age 46, normal bones and kidneys"}, {"letter": "B", "text": "Age 62, Ca 0.5 above ULN"}, {"letter": "C", "text": "Age 70, T-score −1.4"}, {"letter": "D", "text": "Age 58, eGFR 80"}], "answer": "A", "explanation": "**Age < 50** alone is a surgical indication in asymptomatic PHPT."}], "checkpoints": [{"stem": "Asymptomatic PHPT → Renal criterion for surgery:", "options": [{"letter": "A", "text": "eGFR < 60 mL/min"}, {"letter": "B", "text": "eGFR < 90 mL/min"}, {"letter": "C", "text": "Creatinine > 1.0"}, {"letter": "D", "text": "Any proteinuria"}], "answer": "A", "explanation": "**eGFR < 60**, hypercalciuria, or stones/nephrocalcinosis are renal indications."}]}}, {"id": "22", "group": 22, "slide": 24, "section": "Surgical indication: calcium", "topic": "Primary hyperparathyroidism", "skill": "Management", "stem": "What serum calcium threshold is an indication for surgery in asymptomatic primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Any value above normal"}, {"letter": "B", "text": "> 1 mg/dL above upper limit of normal"}, {"letter": "C", "text": "> 14 mg/dL"}, {"letter": "D", "text": "> 3 mg/dL above upper limit of normal"}], "answer": "B", "explanation": "Serum calcium **> 1 mg/dL above the ULN** is an indication for parathyroidectomy.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "Mild elevations just over normal are common and can be watched; the threshold is a **modest but definite** rise.", "stem": "A calcium 0.4 mg/dL above the ULN in an asymptomatic patient alone…", "options": [{"letter": "A", "text": "Does not meet the threshold"}, {"letter": "B", "text": "Meets the threshold"}], "answer": "A", "explanation": "The cutoff is **more than 1 mg/dL** above the ULN.", "clarify": [{"stem": "Calcium > 14 mg/dL is the threshold for…", "options": [{"letter": "A", "text": "Hypercalcemic crisis treatment"}, {"letter": "B", "text": "Elective surgery"}], "answer": "A", "explanation": "> 14 is an **emergency** level, not the surgical criterion."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Asymptomatic PHPT → Serum calcium threshold for surgery:", "options": [{"letter": "A", "text": "> 1 mg/dL above upper limit of normal"}, {"letter": "B", "text": "Any value above normal"}, {"letter": "C", "text": "> 3 mg/dL above upper limit of normal"}, {"letter": "D", "text": "> 14 mg/dL"}], "answer": "A", "explanation": "Serum calcium **> 1 mg/dL above the ULN** is an indication for parathyroidectomy."}], "checkpoints": [{"stem": "Asymptomatic PHPT, age 62, Ca 10.6 (ULN 10.0), eGFR 75, T-score −1.2, no stones → Plan:", "options": [{"letter": "A", "text": "Observe with monitoring"}, {"letter": "B", "text": "Urgent parathyroidectomy"}, {"letter": "C", "text": "IV zoledronic acid"}, {"letter": "D", "text": "Start a thiazide"}], "answer": "A", "explanation": "No criteria met → **observe**: hydrate, avoid thiazides/lithium, monitor Ca, eGFR, DXA, 25(OH)D."}]}}, {"id": "23", "group": 23, "slide": 27, "section": "Inpatient hypercalcemia", "topic": "Hypercalcemia of malignancy", "skill": "Identification", "stem": "What is the most likely cause of acute, severe, symptomatic hypercalcemia in a hospitalized patient?", "options": [{"letter": "A", "text": "Thiazide use"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "D", "text": "Malignancy"}], "answer": "D", "explanation": "Inpatient, acute, severe hypercalcemia → **malignancy**; it occurs late and carries a poor prognosis.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "Contrast the **setting and tempo**: PHPT is outpatient and indolent.", "stem": "Rapidly rising, severe hypercalcemia in a sick inpatient suggests…", "options": [{"letter": "A", "text": "A tumor-driven process"}, {"letter": "B", "text": "A slowly growing adenoma"}], "answer": "A", "explanation": "Fast and severe = **malignancy**.", "clarify": [{"stem": "FHH hypercalcemia is usually…", "options": [{"letter": "A", "text": "Mild and lifelong"}, {"letter": "B", "text": "Severe and acute"}], "answer": "A", "explanation": "FHH is **mild** and benign."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hospitalized patient, acute severe symptomatic hypercalcemia → Most likely cause:", "options": [{"letter": "A", "text": "Malignancy"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "D", "text": "Thiazide use"}], "answer": "A", "explanation": "Inpatient, acute, severe hypercalcemia → **malignancy**; it occurs late and carries a poor prognosis."}], "checkpoints": [{"stem": "Hypercalcemia of malignancy → Expected intact PTH:", "options": [{"letter": "A", "text": "Suppressed"}, {"letter": "B", "text": "Elevated"}, {"letter": "C", "text": "Inappropriately normal"}, {"letter": "D", "text": "Very high"}], "answer": "A", "explanation": "Malignancy is **non-parathyroid** hypercalcemia → PTH is **suppressed**."}]}}, {"id": "24", "group": 24, "slide": 28, "section": "HHM lab pattern", "topic": "Hypercalcemia of malignancy", "skill": "Diagnostics & imaging", "stem": "Which diagnosis is most likely in a patient who smokes and has a lung mass, calcium of 13.9 mg/dL, PTH below 10 pg/mL, and elevated PTH-related peptide?", "options": [{"letter": "A", "text": "Osteolytic bone metastases"}, {"letter": "B", "text": "Humoral hypercalcemia of malignancy"}, {"letter": "C", "text": "Calcitriol-mediated hypercalcemia"}, {"letter": "D", "text": "Primary hyperparathyroidism"}], "answer": "B", "explanation": "Tumor-secreted **PTHrP** with a **suppressed PTH** = humoral hypercalcemia of malignancy; skeletal metastases aren't required.", "objective": "", "bg": "#e0ebff", "remediation": {"steps": [{"teach": "The key lab is the **PTH-like peptide** made by the tumor, which acts like PTH but isn't regulated by calcium.", "stem": "An elevated PTHrP means the calcium is being driven by…", "options": [{"lette  "objective": "", "bg": "#e0ebff", "remediation": {"steps": [{"teach": "The lecture lists three mechanisms: humoral (PTHrP), **osteolytic**, and calcitriol-mediated. This stem describes direct bone destruction.", "stem": "Which mechanism involves tumor destroying bone locally?", "options": [{"letter": "A", "text": "Osteolytic"}, {"letter": "B", "text": "Humoral"}, {"letter": "C", "text": "Calcitriol-mediated"}], "answer": "A", "explanation": "Local bone destruction = **osteolytic**.", "clarify": [{"stem": "Squamous cell carcinoma mainly causes hypercalcemia through…", "options": [{"letter": "A", "text": "PTHrP (humoral)"}, {"letter": "B", "text": "Bone destruction"}], "answer": "A", "explanation": "Squamous cell = **humoral/PTHrP**."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hypercalcemia from local bone destruction, classically with lytic bone lesions → Malignancy:", "options": [{"letter": "A", "text": "Multiple myeloma"}, {"letter": "B", "text": "Squamous cell lung cancer"}, {"letter": "C", "text": "Lymphoma"}, {"letter": "D", "text": "Renal cell carcinoma"}], "answer": "A", "explanation": "**Osteolytic** hypercalcemia = local bone destruction, classically **multiple myeloma** (and breast cancer)."}], "checkpoints": [{"stem": "Calcitriol-mediated hypercalcemia of malignancy → Classic tumor:", "options": [{"letter": "A", "text": "Lymphoma"}, {"letter": "B", "text": "Multiple myeloma"}, {"letter": "C", "text": "Ovarian carcinoma"}, {"letter": "D", "text": "Bladder carcinoma"}], "answer": "A", "explanation": "**Lymphoma** makes calcitriol via extrarenal 1α-hydroxylase."}]}}, {"id": "26", "group": 26, "slide": 29, "section": "Crisis first step", "topic": "Hypercalcemia of malignancy", "skill": "Management", "stem": "What is the first intervention for a confused, dehydrated patient with a calcium level of 15.2 mg/dL?", "options": [{"letter": "A", "text": "Emergency parathyroidectomy"}, {"letter": "B", "text": "Loop diuretic"}, {"let  "topic": "Hypercalcemia of malignancy", "skill": "Management", "stem": "Which medication has the fastest onset of action for severe symptomatic hypercalcemia when saline infusion has already been started?", "options": [{"letter": "A", "text": "Calcitonin"}, {"letter": "B", "text": "Zoledronic acid"}, {"letter": "C", "text": "Cinacalcet"}, {"letter": "D", "text": "Denosumab"}], "answer": "A", "explanation": "**Calcitonin** works within hours but is modest and loses effect (tachyphylaxis) by ~48 h; bisphosphonates take 2–4 days.", "objective": "", "bg": "#e0ebff", "remediation": {"steps": [{"teach": "You need a **bridge** that works within hours while the slower bone-resorption blocker kicks in.", "stem": "Bisphosphonates reach full effect in about…", "options": [{"letter": "A", "text": "2–4 days"}, {"letter": "B", "text": "2–4 hours"}], "answer": "A", "explanation": "Bisphosphonates are **slow** — a faster bridge is needed.", "clarify": [{"stem": "Cinacalcet is mainly used for…", "options": [{"letter": "A", "text": "Chronic PTH-driven hypercalcemia"}, {"letter": "B", "text": "Emergency crisis"}], "answer": "A", "explanation": "Cinacalcet is for **PHPT/parathyroid carcinoma**, not the acute crisis."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Severe symptomatic hypercalcemia, saline running → Agent with the fastest onset:", "options": [{"letter": "A", "text": "Calcitonin"}, {"letter": "B", "text": "Zoledronic acid"}, {"letter": "C", "text": "Denosumab"}, {"letter": "D", "text": "Cinacalcet"}], "answer": "A", "explanation": "**Calcitonin** works within hours but is modest and loses effect (tachyphylaxis) by ~48 h; bisphosphonates take 2–4 days."}], "checkpoints": [{"stem": "Refractory life-threatening hypercalcemia, fluids contraindicated → Rescue option:", "options": [{"letter": "A", "text": "Hemodialysis"}, {"letter": "B", "text": "Loop diuretic alone"}, {"letter": "C", "text": "Parathyroid scan"}, {"letter": "D", "text": "Oral pho  "explanation": "**Thiazides** reduce urinary calcium excretion (with a low-sodium diet and BP/electrolyte monitoring)."}]}}, {"id": "45", "group": 45, "slide": 46, "section": "Calcium target", "topic": "Primary hypoparathyroidism", "skill": "Management", "stem": "What is the target serum calcium level in chronic hypoparathyroidism?", "options": [{"letter": "A", "text": "Low-normal range"}, {"letter": "B", "text": "Upper limit of normal"}, {"letter": "C", "text": "Slightly above normal"}, {"letter": "D", "text": "Mid-normal range"}], "answer": "A", "explanation": "Target **low-normal calcium** to reduce **hypercalciuria**, kidney stones, and tissue calcification.", "objective": "", "bg": "#e0ecff", "remediation": {"steps": [{"teach": "Without PTH, the kidney loses calcium easily, so pushing serum calcium higher spills it into the **urine**.", "stem": "Raising serum calcium in hypoparathyroidism increases the risk of…", "options": [{"letter": "A", "text": "Hypercalciuria and nephrocalcinosis"}, {"letter": "B", "text": "Tetany"}], "answer": "A", "explanation": "Higher calcium → **hypercalciuria/nephrocalcinosis**.", "clarify": [{"stem": "Tetany risk is greatest when calcium is…", "options": [{"letter": "A", "text": "Too low"}, {"letter": "B", "text": "Low-normal"}], "answer": "A", "explanation": "Low-normal is enough to prevent symptoms."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Chronic hypoparathyroidism → Serum calcium target:", "options": [{"letter": "A", "text": "Low-normal range"}, {"letter": "B", "text": "Mid-normal range"}, {"letter": "C", "text": "Upper limit of normal"}, {"letter": "D", "text": "Slightly above normal"}], "answer": "A", "explanation": "Target **low-normal calcium** to reduce **hypercalciuria**, kidney stones, and tissue calcification."}], "checkpoints": [{"stem": "Hypoparathyroidism poorly controlled on conventional therapy → Option for selected patients:", "options": [{"letter": "A", "text": "Recombinant     if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(q.answer) + '. ' + fmt(optText(q, q.answer)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });
    pushCheckpoint(q, t);
  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);
    }
  }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong without a pathway, or its pathway has finished.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';
    t.trail.forEach((n, i) => { html += nodeHtml(q, n, i, interactive); });
    html += '</div>';
    return html;
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + fmt(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const wrong = answered && chosen !== q.answer;
    const tutoring = wrong && hasTutor(q);
    const t = tutor[q.id];
    // While the pathway is still in its teaching steps (exam mode), the correct answer stays hidden
    const hideKey = mode === 'exam' && tutoring && t && t.phase === 'steps';
    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Mastered after review</span>';
    else if (status === 'review') html += '<span class="badge review">Flagged for review</span>';
    else if (status === 'active') html += '<span class="badge active">Guided review in progress</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === chosen) cls += chosen === q.answer ? ' correct' : ' incorrect';
        else if (o.letter === q.answer && !hideKey) cls += ' correct';
        else if (!hideKey) cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];
    const _bl = document.getElementById('bglayer');
    if (_bl) _bl.style.display = EXAM_DATA.bgImage ? 'block' : 'none';

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          answers[qid] = btn.getAttribute('data-letter');
          if (answers[qid] !== q.answer && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    document.body.style.backgroundColor = '';
    { const _bl = document.getElementById('bglayer'); if (_bl) _bl.style.display = 'none'; }
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    document.body.style.backgroundColor = '';
    { const _bl = document.getElementById('bglayer'); if (_bl) _bl.style.display = 'none'; }
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer: ' + q.answer + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  { const _bl = document.getElementById('bglayer'); if (_bl && EXAM_DATA.bgImage) _bl.style.backgroundImage = 'url(' + EXAM_DATA.bgImage + ')'; }
  renderPage();
})();
</script>
</body>
</html>
