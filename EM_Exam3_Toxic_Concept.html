const EXAM_DATA = {"title": "Toxic Ingestion — Lecture Quiz (Adaptive)", "questions": [{"id": "1", "group": 1, "slide": 5, "section": "General Principles", "topic": "Initial approach (ABCDs)", "skill": "Management", "stem": "A poisoned patient is so encephalopathic and vomiting that he has lost his gag and cough reflexes. What is the appropriate airway decision?", "options": [{"letter": "A", "text": "Place a nasal cannula and observe"}, {"letter": "B", "text": "Intubate now to protect the airway"}, {"letter": "C", "text": "Position laterally and suction as needed"}, {"letter": "D", "text": "Give flumazenil and reassess"}], "answer": "B", "explanation": "Loss of **gag and cough reflexes** means the patient cannot protect against aspiration, so intubate; opioids, GHB, and benzodiazepines are the classic offenders.", "objective": "", "hint": "The airway question in toxicology turns on **protective reflexes**, not on the level of consciousness alone; opioids, GHB, and benzodiazepines are the classic agents that take them away."}, {"id": "2", "group": 2, "slide": 5, "section": "General Principles", "topic": "Initial approach (ABCDs)", "skill": "Management", "stem": "A patient brought in as 'intoxicated' has severe altered mentation. What must be checked immediately before attributing the picture to the ingestion?", "options": [{"letter": "A", "text": "Non-contrast head CT"}, {"letter": "B", "text": "Serum ethanol level"}, {"letter": "C", "text": "Urine drug screen"}, {"letter": "D", "text": "Bedside glucose"}], "answer": "D", "explanation": "Check an **Accu-Chek** first in every altered patient; alcohol, sulfonylureas, insulin, and beta blockers all cause hypoglycemia, and the urine drug screen is unreliable.", "objective": "", "hint": "The 'D' of the toxicology ABCDs warns that an **intoxicated label** hides reversible killers; think of the fastest bedside test that explains altered mentation on its own."}, {"id": "3", "group": 3, "slide": 5, "section": "General Principles", "topic": "Carbon monoxide", "skill": "Diagnostics & imaging", "stem": "A whole family presents in winter with headache, nausea, and confusion, and every pulse oximeter reads normal. Which test confirms the suspected diagnosis?", "options": [{"letter": "A", "text": "Carboxyhemoglobin by co-oximetry"}, {"letter": "B", "text": "Chest radiograph"}, {"letter": "C", "text": "Serum lactate level"}, {"letter": "D", "text": "Arterial blood gas oxygen saturation"}], "answer": "A", "explanation": "**Carbon monoxide** gives a falsely normal pulse-ox; diagnose with co-oximetry and treat with 100% O2 by non-rebreather, hyperbaric O2 if severe or pregnant.", "objective": "", "hint": "Several household members sick at once with a heater running points to an inhaled gas; a standard pulse oximeter **cannot distinguish** the bound hemoglobin species, so the confirming test has to measure it directly."}, {"id": "4", "group": 4, "slide": 5, "section": "General Principles", "topic": "Cyanide", "skill": "Pharmacology", "stem": "A comatose house-fire victim has a lactate of 15 with a normal arterial oxygen saturation. Which antidote should be given?", "options": [{"letter": "A", "text": "Sodium bicarbonate"}, {"letter": "B", "text": "Methylene blue"}, {"letter": "C", "text": "Naloxone"}, {"letter": "D", "text": "Hydroxocobalamin"}], "answer": "D", "explanation": "**Cyanide** from smoke inhalation (burning plastics) causes lactic acidosis with normal SaO2; hydroxocobalamin (Cyanokit) is first line, with 100% O2.", "objective": "", "hint": "Burning plastics release a poison that stops cells from **using oxygen**, producing profound lactic acidosis despite normal saturation; its antidote binds the toxin directly and is given empirically to fire victims with this picture."}, {"id": "5", "group": 5, "slide": 6, "section": "General Principles", "topic": "Poison Control", "skill": "Management", "stem": "Which phone number connects any caller nationwide to the local poison control center?", "options": [{"letter": "A", "text": "1-800-411-1222"}, {"letter": "B", "text": "1-800-222-1222"}, {"letter": "C", "text": "1-888-222-1222"}, {"letter": "D", "text": "1-800-222-1212"}], "answer": "B", "explanation": "**1-800-222-1222** reaches the local center (Grady in Georgia) with management recommendations and toxicology access for professionals and the public alike.", "objective": "", "hint": ""}, {"id": "6", "group": 6, "slide": 9, "section": "General Principles", "topic": "Therapeutic index", "skill": "Pharmacology", "stem": "Which drugs have a narrow therapeutic index that makes a dangerous overdose easy to reach?", "options": [{"letter": "A", "text": "Acetaminophen"}, {"letter": "B", "text": "Cannabinoids"}, {"letter": "C", "text": "Warfarin"}, {"letter": "D", "text": "Benzodiazepines"}, {"letter": "E", "text": "Tricyclic antidepressants"}, {"letter": "F", "text": "Lithium"}], "answer": "CEF", "explanation": "**Lithium, TCAs, and warfarin** are the lecture's narrow-TI drugs (bupropion above 450 mg joins them, with seizures); acetaminophen and cannabis have huge LD50s and isolated benzodiazepine overdose is rarely fatal.", "objective": "", "hint": "Therapeutic index is the gap between an effective dose and a toxic one; look for the drugs whose levels are **routinely monitored** in clinic because small changes tip them into toxicity, and rule out agents with enormous LD50s or wide safety margins."}, {"id": "7", "group": 7, "slide": 9, "section": "General Principles", "topic": "Lithium", "skill": "Management", "stem": "A bipolar patient on lithium who became dehydrated presents with coarse tremor, ataxia, and confusion. Which treatment plan is correct?", "options": [{"letter": "A", "text": "Fomepizole and bicarbonate"}, {"letter": "B", "text": "IV normal saline, hemodialysis if severe"}, {"letter": "C", "text": "Sodium bicarbonate boluses"}, {"letter": "D", "text": "Activated charcoal and observation"}], "answer": "B", "explanation": "**Lithium** toxicity is treated with aggressive saline and hemodialysis for severe neurotoxicity or renal failure; charcoal does not bind lithium.", "objective": "", "hint": "Lithium has no antidote and is handled by the **kidneys**; the plan restores the route of elimination and, when neurotoxicity is severe, replaces it with a machine. Charcoal cannot bind this metal."}, {"id": "8", "group": 8, "slide": 9, "section": "General Principles", "topic": "Warfarin", "skill": "Management", "stem": "A warfarin patient has an INR of 8 with gum bleeding and a brisk GI bleed. Which treatment reverses the coagulopathy fastest?", "options": [{"letter": "A", "text": "Oral vitamin K alone"}, {"letter": "B", "text": "Vitamin K plus 4-factor PCC"}, {"letter": "C", "text": "Protamine sulfate"}, {"letter": "D", "text": "Hold warfarin and recheck the INR"}], "answer": "B", "explanation": "**Vitamin K + 4-factor PCC** (or FFP) for life-threatening bleeding; INR >9 without bleeding gets oral vitamin K and a held dose.", "objective": "", "hint": "Active life-threatening bleeding needs **immediate factor replacement** on top of the slower vitamin-dependent fix; holding the drug or oral reversal alone fits only the non-bleeding patient."}, {"id": "9", "group": 9, "slide": 11, "section": "General Principles", "topic": "Toxicology workup", "skill": "Diagnostics & imaging", "stem": "Why is an acetaminophen level drawn on every intentional ingestion regardless of the stated history?", "options": [{"letter": "A", "text": "A negative level rules out other ingestions"}, {"letter": "B", "text": "The level predicts cardiac arrhythmia risk"}, {"letter": "C", "text": "Toxicity is silent early and it is the most common co-ingestant"}, {"letter": "D", "text": "It is the most reliable marker of total pill burden"}], "answer": "C", "explanation": "**Acetaminophen** is asymptomatic for the first 24 h and the most common co-ingestant, so ethanol, salicylate, and acetaminophen levels are drawn on every intentional ingestion.", "objective": "", "hint": "The 'blood tox' panel is ethanol, salicylate, and acetaminophen; one of them has a treatable **window** that closes before any symptom appears, and patients under-report what they took."}, {"id": "10", "group": 10, "slide": 12, "section": "General Principles", "topic": "Supportive care", "skill": "Management", "stem": "Which overdoses have no specific antidote and are managed purely with supportive care?", "options": [{"letter": "A", "text": "Opioids"}, {"letter": "B", "text": "Organophosphates"}, {"letter": "C", "text": "Hallucinogens (LSD, psilocybin)"}, {"letter": "D", "text": "GHB"}, {"letter": "E", "text": "Acetaminophen"}, {"letter": "F", "text": "Sympathomimetics (cocaine, methamphetamine)"}], "answer": "CDF", "explanation": "**No antidote** exists for hallucinogens, sympathomimetics, or GHB — benzos for agitation and airway support until the drug is metabolized; opioids, organophosphates, and acetaminophen have naloxone, atropine/2-PAM, and NAC.", "objective": "", "hint": "Dr. Reines' rule is that most drugs are 'metabolized to freedom'; exclude every agent you can name a **reversal drug** for and the rest are the answers."}, {"id": "11", "group": 11, "slide": 12, "section": "General Principles", "topic": "Activated charcoal", "skill": "Management", "stem": "Which situations make activated charcoal inappropriate for an ingestion?", "options": [{"letter": "A", "text": "Lithium or iron ingestion"}, {"letter": "B", "text": "Acetaminophen ingested within the past hour"}, {"letter": "C", "text": "Corrosive acid or alkali ingestion"}, {"letter": "D", "text": "Drowsy patient with an unprotected airway"}], "answer": "ACD", "explanation": "Charcoal is **contraindicated** with AMS or an unprotected airway, with corrosives (it obscures endoscopy), and it does not bind metals like lithium and iron or alcohols; an early acetaminophen ingestion is a classic indication.", "objective": "", "hint": "Charcoal works only when it can **bind** the toxin and sit safely in a stomach that will not aspirate or need endoscopy; ask of each option whether the charcoal would bind, obscure, or be inhaled."}, {"id": "12", "group": 12, "slide": 12, "section": "General Principles", "topic": "Corrosives (acids and alkalis)", "skill": "Disease process", "stem": "Why do alkali ingestions such as drain cleaner typically cause deeper esophageal injury than acids?", "options": [{"letter": "A", "text": "Coagulation necrosis forms an eschar that spreads"}, {"letter": "B", "text": "Alkalis are swallowed in larger volumes"}, {"letter": "C", "text": "Liquefaction necrosis dissolves tissue and keeps penetrating"}, {"letter": "D", "text": "Alkalis are absorbed and injure from the bloodstream"}], "answer": "C", "explanation": "Alkalis (pH >12: lye, oven cleaner, detergent pods, button batteries) cause **liquefaction necrosis** with perforation and later strictures; acids (pH <2) cause coagulation necrosis and classically injure the stomach.", "objective": "", "hint": "Acids make a protective **eschar** that limits their own depth; the alkali mechanism is the opposite, a saponification of fat with no barrier forming."}, {"id": "13", "group": 13, "slide": 12, "section": "General Principles", "topic": "Corrosives (acids and alkalis)", "skill": "Management", "stem": "Which interventions belong in the management of a symptomatic drain-cleaner ingestion?", "options": [{"letter": "A", "text": "Activated charcoal"}, {"letter": "B", "text": "Neutralization with a weak acid"}, {"letter": "C", "text": "Early airway assessment, intubating for stridor or drooling"}, {"letter": "D", "text": "Gastric lavage"}, {"letter": "E", "text": "Keep NPO with IV fluids and analgesia"}, {"letter": "F", "text": "Endoscopy within 12–24 hours to grade the injury"}], "answer": "CEF", "explanation": "Corrosives get **airway, NPO, and endoscopy**; no charcoal, lavage, neutralization (exothermic), or induced emesis, and a clean mouth does not exclude esophageal injury.", "objective": "", "hint": "Corrosive injury is managed by **protecting and looking**: secure the airway, keep anything from passing through the burned tract, and grade the damage. Anything that adds heat, obscures the view, or re-exposes the mucosa is excluded."}, {"id": "14", "group": 14, "slide": 14, "section": "Toxidromes: Drugs of Abuse", "topic": "Ethanol", "skill": "Disease process", "stem": "Why can a chronic drinker be alert and conversant at an ethanol level that would sedate a naive patient?", "options": [{"letter": "A", "text": "Ketones falsely elevate the measured level"}, {"letter": "B", "text": "Chronic use raises the LD50 of ethanol"}, {"letter": "C", "text": "Chronic users clear ethanol by first-order kinetics"}, {"letter": "D", "text": "Tolerance shifts the response to a given level"}], "answer": "D", "explanation": "**Tolerance** up- or down-regulates the effect of a given level; ethanol clears by zero-order kinetics (~30 mg/dL/h), so sobriety is clinical, not a number.", "objective": "", "hint": "Sobriety is not an undetectable level; the slide's phrase about being **up- or down-regulated by habit** explains the mismatch, while elimination itself stays fixed at about 30 mg/dL per hour for everyone."}, {"id": "15", "group": 15, "slide": 15, "section": "Toxidromes: Drugs of Abuse", "topic": "Benzodiazepines", "skill": "Pharmacology", "stem": "In which setting is flumazenil appropriate for reversing benzodiazepine sedation?", "options": [{"letter": "A", "text": "Chronic benzodiazepine user with a mixed overdose"}, {"letter": "B", "text": "Any benzodiazepine overdose with sedation"}, {"letter": "C", "text": "Over-sedation during procedural sedation"}, {"letter": "D", "text": "Unknown-ingestion coma as a diagnostic trial"}], "answer": "C", "explanation": "**Flumazenil** is used only in a procedural-sedation setting; otherwise benzodiazepine overdose is supportive (intubate if no gag or cough reflex).", "objective": "", "hint": "Flumazenil can precipitate **seizures** in dependent patients and mixed ingestions, so it is reserved for the one setting where the dose, the drug, and the patient's baseline are all known."}, {"id": "16", "group": 16, "slide": 16, "section": "Toxidromes: Drugs of Abuse", "topic": "Opioids", "skill": "Pharmacology", "stem": "A patient with pinpoint pupils, a respiratory rate of 6, and elevated EtCO2 needs naloxone. How should it be dosed?", "options": [{"letter": "A", "text": "Only after intubation, to avoid vomiting"}, {"letter": "B", "text": "Small titrated doses until breathing recovers"}, {"letter": "C", "text": "A single dose, then discharge once awake"}, {"letter": "D", "text": "A full reversal dose to achieve complete arousal"}], "answer": "B", "explanation": "**Naloxone low and slow** — titrate to respiratory effort, not full arousal; watch for opioid non-cardiogenic pulmonary edema, and remember the urine drug screen misses fentanyl.", "objective": "", "hint": "'Low and slow' is the lecture's phrase: the goal is **respiratory effort**, not wakefulness, because full reversal precipitates withdrawal, and long-acting opioids may need repeat dosing or an infusion."}, {"id": "17", "group": 17, "slide": 17, "section": "Toxidromes: Drugs of Abuse", "topic": "Cannabinoids", "skill": "Management", "stem": "A heavy daily cannabis user has cyclic intractable vomiting. Which medication does the lecture name for this syndrome?", "options": [{"letter": "A", "text": "Ondansetron"}, {"letter": "B", "text": "Cyproheptadine"}, {"letter": "C", "text": "Metoclopramide"}, {"letter": "D", "text": "Droperidol"}], "answer": "D", "explanation": "**Droperidol** for cannabinoid hyperemesis syndrome; cannabis is the 2nd most common drug of abuse, edibles are 'huge in kids and the elderly,' and synthetics are unpredictable.", "objective": "", "hint": "Cannabinoid hyperemesis responds poorly to standard serotonin-blocking antiemetics; the lecture names a single agent from the **antipsychotic** family, not a serotonin antagonist or prokinetic."}, {"id": "18", "group": 18, "slide": 18, "section": "Toxidromes: Drugs of Abuse", "topic": "Sympathomimetics", "skill": "Identification", "stem": "Which findings make up the sympathomimetic toxidrome seen with cocaine and methamphetamine?", "options": [{"letter": "A", "text": "Miosis"}, {"letter": "B", "text": "Diaphoresis"}, {"letter": "C", "text": "Hyperthermia"}, {"letter": "D", "text": "Dry, flushed skin"}, {"letter": "E", "text": "Mydriasis"}, {"letter": "F", "text": "Hypertension and tachycardia"}], "answer": "BCEF", "explanation": "**Sympathomimetic** toxidrome: HTN, tachycardia, hyperthermia, mydriasis, diaphoresis, agitation; dry skin means anticholinergic, miosis means opioid or cholinergic.", "objective": "", "hint": "Think **alpha-agonist** overdrive, everything up and wet; the skin finding is the key discriminator from the anticholinergic toxidrome, which otherwise looks similar."}, {"id": "19", "group": 19, "slide": 18, "section": "Toxidromes: Drugs of Abuse", "topic": "Cocaine", "skill": "Management", "stem": "An agitated, hypertensive, tachycardic patient has chest pain after cocaine use. What is the correct first-line approach?", "options": [{"letter": "A", "text": "IV beta blocker to control heart rate"}, {"letter": "B", "text": "Benzodiazepines, cooling, and fluids"}, {"letter": "C", "text": "Physostigmine"}, {"letter": "D", "text": "Haloperidol for agitation"}], "answer": "B", "explanation": "**Benzos** first for sympathomimetics, with cooling and fluids; avoid beta blockers in cocaine (unopposed alpha); nitrates or CCBs for chest pain; vasospasm causes MI, dissection, and stroke.", "objective": "", "hint": "Amphetamines and cocaine are one toxidrome with no antidote; calm the **central drive** first rather than reaching for an antihypertensive, and remember one antihypertensive class leaves alpha stimulation unopposed."}, {"id": "20", "group": 20, "slide": 21, "section": "Toxidromes: OTC", "topic": "Acetaminophen", "skill": "Management", "stem": "A patient took a large acetaminophen overdose 6 hours ago and feels fine. How is the decision to start N-acetylcysteine made?", "options": [{"letter": "A", "text": "Treat only if RUQ pain develops"}, {"letter": "B", "text": "Confirm ingestion with the urine drug screen first"}, {"letter": "C", "text": "Start NAC only once transaminases rise"}, {"letter": "D", "text": "Plot a 4-hour-or-later level on the Rumack-Matthew nomogram"}], "answer": "D", "explanation": "**NAC** is guided by the Rumack-Matthew nomogram (level versus hours post-ingestion) plus LFTs; untreated toxicity progresses from RUQ pain and rising AST/ALT to fulminant hepatic failure at 72–96 h.", "objective": "", "hint": "The antidote decision for a single acute ingestion is **graphical** and time-dependent, valid from 4 to 24 h; LFTs guide management, and an unknown time or chronic ingestion gets treated regardless."}, {"id": "21", "group": 21, "slide": 22, "section": "Toxidromes: OTC", "topic": "Salicylates", "skill": "Management", "stem": "A hyperventilating patient with tinnitus and a mixed respiratory alkalosis and metabolic acidosis took aspirin. Which treatment is indicated?", "options": [{"letter": "A", "text": "Fomepizole"}, {"letter": "B", "text": "Intubation to normalize the pH"}, {"letter": "C", "text": "Sodium bicarbonate, with dialysis if severe"}, {"letter": "D", "text": "N-acetylcysteine"}], "answer": "C", "explanation": "**Sodium bicarbonate** alkalinization and dialysis for salicylates (aspirin, Pepto-Bismol, oil of wintergreen; severe >300 mg/kg); the ECG may show a widened QRS.", "objective": "", "hint": "Salicylate is trapped and excreted when serum and urine are made **alkaline**; the sickest patients need extracorporeal removal, and taking away the patient's own hyperventilation worsens the acidosis."}, {"id": "22", "group": 22, "slide": 24, "section": "Toxidromes: OTC", "topic": "Organophosphates", "skill": "Identification", "stem": "Which findings point to the cholinergic toxidrome of organophosphate poisoning?", "options": [{"letter": "A", "text": "Miosis"}, {"letter": "B", "text": "Dry mucous membranes"}, {"letter": "C", "text": "Diarrhea and urination"}, {"letter": "D", "text": "Mydriasis"}, {"letter": "E", "text": "Bronchorrhea and wheezing"}, {"letter": "F", "text": "Bradycardia"}], "answer": "ACEF", "explanation": "**DUMBBELS**: Diarrhea, Urination, Miosis, Bronchorrhea/Bronchospasm, Bradycardia, Emesis, Lacrimation, Salivation/Sweating; ECG shows prolonged QTc and bradyarrhythmias — 'rare in practice, common on test.'", "objective": "", "hint": "DUMBBELS is the mnemonic: everything **wet and slow**. Rule out any finding that belongs to the dry, dilated anticholinergic picture, which is its mirror image."}, {"id": "23", "group": 23, "slide": 24, "section": "Toxidromes: OTC", "topic": "Organophosphates", "skill": "Pharmacology", "stem": "A farmer is drooling, wheezing, bradycardic, and miotic after pesticide exposure. Which antidote combination is given after decontamination?", "options": [{"letter": "A", "text": "Naloxone plus sodium bicarbonate"}, {"letter": "B", "text": "Physostigmine plus benzodiazepines"}, {"letter": "C", "text": "Glucagon plus high-dose insulin"}, {"letter": "D", "text": "Atropine plus pralidoxime (2-PAM)"}], "answer": "D", "explanation": "**Atropine + 2-PAM** for organophosphates; atropine is titrated to drying of secretions, pralidoxime reactivates the enzyme if given early; strip clothing and wash with soap and water, protecting rescuers with PPE.", "objective": "", "hint": "Two drugs: one dries the secretions that kill the patient (titrated to **bronchorrhea**, not pupil size) and one reactivates the poisoned enzyme if given early. Protect yourself with PPE and strip the clothing first."}, {"id": "24", "group": 24, "slide": 25, "section": "Toxidromes: OTC", "topic": "Anticholinergics", "skill": "Pharmacology", "stem": "A patient is hot, dry, flushed, mydriatic, and delirious after a diphenhydramine overdose. Which antidote is specific to this toxidrome?", "options": [{"letter": "A", "text": "Atropine"}, {"letter": "B", "text": "Flumazenil"}, {"letter": "C", "text": "Cyproheptadine"}, {"letter": "D", "text": "Physostigmine"}], "answer": "D", "explanation": "**Physostigmine** for pure anticholinergic delirium (antihistamines, antipsychotics, TCAs, jimsonweed); supportive care, benzos, and bicarb for QRS prolongation.", "objective": "", "hint": "Anti-DUMBBELS ('hot as a hare, dry as a bone, blind as a bat, mad as a hatter') is **way more common** than cholinergic poisoning; its antidote restores acetylcholine and is withheld when the QRS is wide, when bicarbonate takes over."}, {"id": "25", "group": 25, "slide": 27, "section": "Specific Toxic Ingestions", "topic": "TCAs", "skill": "Management", "stem": "A somnolent, tachycardic, hypotensive patient has a QRS of 140 ms after an amitriptyline overdose. What is the mainstay of treatment?", "options": [{"letter": "A", "text": "Physostigmine"}, {"letter": "B", "text": "Procainamide"}, {"letter": "C", "text": "Sodium bicarbonate boluses"}, {"letter": "D", "text": "Activated charcoal and observation"}], "answer": "C", "explanation": "**Sodium bicarbonate** is the mainstay for TCAs (Elavil, doxepin), narrowing the QRS and treating hypotension; benzos for seizures; complications are the 3 C's — coma, convulsions, cardiotoxicity.", "objective": "", "hint": "'Tachy-sleepy' with a wide QRS is the TCA signature; the mainstay **narrows the QRS** and treats the hypotension at the same time, while the anticholinergic antidote and class IA antiarrhythmics are both avoided."}, {"id": "26", "group": 26, "slide": 28, "section": "Specific Toxic Ingestions", "topic": "Quetiapine", "skill": "Identification", "stem": "A patient is sedated and tachycardic with a prolonged QT after taking a sleep aid prescribed off-label for depression. Which drug fits, and how is it treated?", "options": [{"letter": "A", "text": "Diphenhydramine; physostigmine"}, {"letter": "B", "text": "Bupropion; benzodiazepines for seizures"}, {"letter": "C", "text": "Amitriptyline; sodium bicarbonate"}, {"letter": "D", "text": "Quetiapine; supportive care, no antidote"}], "answer": "D", "explanation": "**Quetiapine** (Seroquel): tachy-sleepy with long QT, supportive care only; its similar structure confounds the TCA screen.", "objective": "", "hint": "This antipsychotic produces the same 'tachy-sleepy' picture as a TCA and even **confounds the TCA screen** because of its similar structure, but the lecture gives it no antidote."}, {"id": "27", "group": 27, "slide": 30, "section": "Specific Toxic Ingestions", "topic": "Valproic acid", "skill": "Pharmacology", "stem": "A patient on Depakote is confused with a markedly elevated ammonia and normal liver function tests. Which antidote is indicated?", "options": [{"letter": "A", "text": "Fomepizole"}, {"letter": "B", "text": "L-carnitine"}, {"letter": "C", "text": "Lactulose"}, {"letter": "D", "text": "N-acetylcysteine"}], "answer": "B", "explanation": "**L-carnitine** for valproic acid toxicity; valproate is dialyzable and is the lecture's named indication for whole-bowel irrigation with PEG.", "objective": "", "hint": "Valproate causes a **hyperammonemic** encephalopathy that mimics hepatic encephalopathy through the same pathway; its antidote is a supplement, and the drug is also dialyzable and amenable to whole-bowel irrigation."}, {"id": "28", "group": 28, "slide": 32, "section": "Specific Toxic Ingestions", "topic": "Serotonin syndrome", "skill": "Management", "stem": "An SSRI patient recently started an MAOI and now has tremor, inducible clonus, hyperreflexia, and a temperature of 41 °C. Which treatment is indicated?", "options": [{"letter": "A", "text": "Sodium bicarbonate"}, {"letter": "B", "text": "Benzodiazepines, cooling, and cyproheptadine"}, {"letter": "C", "text": "Physostigmine"}, {"letter": "D", "text": "Dantrolene and bromocriptine"}], "answer": "B", "explanation": "**Cyproheptadine** plus lots of benzos and active cooling for serotonin syndrome (SSRI + MAOI, cocaine, or MDMA); SHIVERS — Shivering, Hyperreflexia, Increased temperature, Vital instability, Encephalopathy, Restlessness, Sweating.", "objective": "", "hint": "Serotonin syndrome is a complication of SSRI plus MAOI, cocaine, or MDMA; stop the agent, sedate liberally, bring the temperature down, and add the one named antidote, a **serotonin antagonist**."}, {"id": "29", "group": 29, "slide": 33, "section": "Specific Toxic Ingestions", "topic": "Neuroleptic malignant syndrome", "skill": "Identification", "stem": "A patient on haloperidol develops fever and altered mentation over several days. Which exam finding distinguishes neuroleptic malignant syndrome from serotonin syndrome?", "options": [{"letter": "A", "text": "Mydriasis and diaphoresis"}, {"letter": "B", "text": "Pinpoint pupils"}, {"letter": "C", "text": "Lead-pipe rigidity with bradyreflexia"}, {"letter": "D", "text": "Inducible clonus and hyperreflexia"}], "answer": "C", "explanation": "**NMS** (Haldol, antiemetics) = lead-pipe rigidity, slower onset, bradyreflexia; serotonin syndrome = tremor, clonus, hyperreflexia; NMS treatment is stop the drug, benzos, dantrolene or bromocriptine.", "objective": "", "hint": "Both syndromes are hyperthermic and look similar; the discriminator is **muscle tone**, with the antipsychotic-induced syndrome being slower in onset and stiff rather than twitchy."}, {"id": "30", "group": 30, "slide": 34, "section": "Specific Toxic Ingestions", "topic": "Isopropyl alcohol", "skill": "Diagnostics & imaging", "stem": "A patient looks drunk with a negative ethanol level, elevated ketones, fruity breath, and no metabolic acidosis. Which agent and treatment fit?", "options": [{"letter": "A", "text": "Ethanol; glucose and thiamine"}, {"letter": "B", "text": "Isopropyl alcohol; supportive care, fomepizole does not work"}, {"letter": "C", "text": "Ethylene glycol; fomepizole and bicarbonate"}, {"letter": "D", "text": "Methanol; fomepizole and dialysis"}], "answer": "B", "explanation": "**Isopropyl**: ketosis WITHOUT acidosis, elevated osmolar gap, dialyzable; fomepizole does NOT work because there is no toxic metabolite to block.", "objective": "", "hint": "'Sunday-morning intoxication' from rubbing alcohol is metabolized to **acetone**, which is not an acid, so the pattern is ketones with a normal anion gap; the alcohol-dehydrogenase blocker has no toxic metabolite to prevent."}, {"id": "31", "group": 31, "slide": 35, "section": "Specific Toxic Ingestions", "topic": "Methanol", "skill": "Identification", "stem": "A patient who drank homemade moonshine describes 'snowstorm' vision and has a high anion-gap metabolic acidosis. Which toxic alcohol is responsible?", "options": [{"letter": "A", "text": "Ethylene glycol"}, {"letter": "B", "text": "Methanol"}, {"letter": "C", "text": "Ethanol"}, {"letter": "D", "text": "Isopropyl alcohol"}], "answer": "B", "explanation": "**Methanol** (moonshine, windshield fluid): snowstorm vision loss, basal ganglia infarcts, AG acidosis; fomepizole (ADH blocker) or ethanol, bicarb, dialysis; blindness is permanent.", "objective": "", "hint": "Each toxic alcohol owns an organ: one hits the **eyes** and basal ganglia through formic acid, one hits the kidneys with oxalate, and one causes no acidosis at all."}, {"id": "32", "group": 32, "slide": 36, "section": "Specific Toxic Ingestions", "topic": "Ethylene glycol", "skill": "Diagnostics & imaging", "stem": "A toddler who drank antifreeze has a high anion-gap acidosis. Which osmolar gap value is concerning for toxic alcohol poisoning?", "options": [{"letter": "A", "text": "Greater than 100"}, {"letter": "B", "text": "Greater than 5"}, {"letter": "C", "text": "Greater than 50"}, {"letter": "D", "text": "Greater than 20"}], "answer": "C", "explanation": "Osmolar gap = measured minus calculated Osm (2×Na + glucose + urea); normal <10, **>50** concerning for toxic alcohol. Ethylene glycol ('cars & kids') causes massive diuresis then renal failure with calcium-oxalate crystals; fomepizole + bicarb, aggressive fluids, dialysis.", "objective": "", "hint": ""}, {"id": "33", "group": 33, "slide": 37, "section": "Specific Toxic Ingestions", "topic": "Beta blockers", "skill": "Management", "stem": "A patient on metoprolol is bradycardic, hypotensive, and hypoglycemic after an overdose. Which treatment sequence is correct?", "options": [{"letter": "A", "text": "Liberal IV fluid boluses and atropine"}, {"letter": "B", "text": "Glucagon, then high-dose insulin and vasopressors"}, {"letter": "C", "text": "Calcium gluconate and liberal IV fluids"}, {"letter": "D", "text": "Sodium bicarbonate and dialysis"}], "answer": "B", "explanation": "**Beta blockers** ('-lol'): hypotension, bradycardia, HYPOglycemia; glucagon, then high-dose insulin, pressors, methylene blue ('LOTS of side effects'); avoid IVF; ECMO/dialysis as rescue.", "objective": "", "hint": "The glucose is the clue: '-lol' overdose runs **low**, CCB overdose runs high. Treatment starts with the hormone that works around the blocked receptor and escalates to the insulin strategy; fluids are deliberately limited."}, {"id": "34", "group": 34, "slide": 38, "section": "Specific Toxic Ingestions", "topic": "Calcium channel blockers", "skill": "Management", "stem": "A patient on diltiazem is bradycardic, hypotensive, and hyperglycemic after an overdose. Which therapies belong in management?", "options": [{"letter": "A", "text": "IV calcium"}, {"letter": "B", "text": "High-dose insulin with dextrose"}, {"letter": "C", "text": "Vasopressors"}, {"letter": "D", "text": "Liberal IV fluid boluses"}], "answer": "ABC", "explanation": "**CCB**: calcium (poor evidence), high-dose insulin, vasopressors, avoid IVF, ECMO; non-DHP (diltiazem, verapamil) cause bradycardia and heart failure, DHP '-pines' cause hypotension with reflex tachycardia.", "objective": "", "hint": "CCB overdose is 'very dangerous' and volume is **not** the fix; think of the agents that restore inotropy and vascular tone, with ECMO as the rescue, and remember hyperglycemia is what separates this from a beta blocker."}, {"id": "35", "group": 35, "slide": 38, "section": "Specific Toxic Ingestions", "topic": "Digoxin", "skill": "Pharmacology", "stem": "An elderly patient on digoxin has nausea, yellow-green halos, bradycardia, and a potassium of 6.2. Which antidote is indicated?", "options": [{"letter": "A", "text": "Digoxin-specific Fab fragments"}, {"letter": "B", "text": "Hemodialysis"}, {"letter": "C", "text": "IV calcium gluconate"}, {"letter": "D", "text": "Atropine alone"}], "answer": "A", "explanation": "**Digoxin-specific Fab** (Digibind) for life-threatening arrhythmia, K >5–5.5, or end-organ dysfunction; avoid calcium, correct magnesium; chronic toxicity is precipitated by renal failure and hypokalemia.", "objective": "", "hint": "Visual halos plus any bradyarrhythmia in a digoxin patient is the diagnosis; **hyperkalemia** in acute overdose predicts mortality and is itself an indication for the specific antidote, while calcium is avoided and dialysis does not remove the drug."}, {"id": "36", "group": 36, "slide": 39, "section": "Specific Toxic Ingestions", "topic": "Sulfonylurea / insulin", "skill": "Complications", "stem": "A toddler swallowed a grandparent's glyburide. Why does this ingestion require admission rather than a 6-hour observation?", "options": [{"letter": "A", "text": "Sulfonylureas cause delayed, prolonged hypoglycemia"}, {"letter": "B", "text": "Hyperkalemia develops over 24 hours"}, {"letter": "C", "text": "Seizures occur from direct neurotoxicity"}, {"letter": "D", "text": "Glyburide causes delayed cardiotoxicity"}], "answer": "A", "explanation": "**Sulfonylurea/insulin** overdose: prolonged hypoglycemia (glyburide and glargine are long-acting); dextrose infusions, serial glucose checks, octreotide for sulfonylureas, admit 24 h.", "objective": "", "hint": "'Gli-/gly-' drugs and glargine keep working for many hours and children can turn symptomatic late; the plan of dextrose infusions, **serial Accu-Cheks**, and octreotide presumes the problem persists for a day."}, {"id": "37", "group": 37, "slide": 41, "section": "Uncommon Cases", "topic": "Lead", "skill": "Pharmacology", "stem": "A child with chronic paint-chip ingestion has encephalopathy and a markedly elevated lead level. Which chelation regimen does the lecture name for severe cases?", "options": [{"letter": "A", "text": "Succimer alone"}, {"letter": "B", "text": "Penicillamine alone"}, {"letter": "C", "text": "Dimercaprol (BAL) plus EDTA"}, {"letter": "D", "text": "Deferoxamine"}], "answer": "C", "explanation": "**Dimercaprol + EDTA** for severe or adult lead toxicity; succimer and penicillamine for peds; chelate at >45 acute or >70 chronic; adults get vague CNS, anemia, GI symptoms, children encephalopathy and lead lines.", "objective": "", "hint": "Peds mild-to-moderate cases get the oral agents (one with many adverse effects); **severe or adult** cases get the two-drug parenteral combination."}, {"id": "38", "group": 38, "slide": 42, "section": "Uncommon Cases", "topic": "Body stuffers and packers", "skill": "Complications", "stem": "A traveler is found to have multiple drug packets in the bowel on CT. What makes a packer more dangerous than a stuffer?", "options": [{"letter": "A", "text": "Packers always need immediate laparotomy"}, {"letter": "B", "text": "Rupture of a packet releases a massive dose"}, {"letter": "C", "text": "Stuffers carry larger total quantities"}, {"letter": "D", "text": "Packers swallow drugs unwrapped"}], "answer": "B", "explanation": "**Body packers** become a surgical issue if a packet ruptures or obstructs; CT shows the packets; whole-bowel irrigation; stuffers swallow small amounts to evade police and get supportive care.", "objective": "", "hint": "Stuffers swallow a small amount to evade police and get mild effects; packers carry **well-wrapped** bulk, usually without effect, and the danger lies in what happens if the wrapping fails."}, {"id": "39", "group": 39, "slide": 44, "section": "Uncommon Cases", "topic": "Snake bites", "skill": "Identification", "stem": "A hiker bitten by a copperhead has swelling, local tissue destruction, and coagulopathy. Which treatment is indicated?", "options": [{"letter": "A", "text": "Observation only, since most bites are dry"}, {"letter": "B", "text": "Incision and suction of the wound"}, {"letter": "C", "text": "CroFab antivenom, elevate and splint"}, {"letter": "D", "text": "Tourniquet above the bite"}], "answer": "C", "explanation": "**CroFab** for pit vipers (copperheads, rattlesnakes) with elevation and splinting, watching for anaphylaxis and secondary infection; elapids (coral snake) cause delayed neurotoxic paralysis with little local injury.", "objective": "", "hint": "Pit vipers destroy **local tissue** and clotting; a quarter of bites are dry, but the symptomatic patient gets the specific antivenom. Tourniquets belong to the slide on the neurotoxic coral snake."}, {"id": "40", "group": 40, "slide": 46, "section": "Uncommon Cases", "topic": "Spider bites", "skill": "Identification", "stem": "A woman develops severe abdominal muscle rigidity mimicking an acute abdomen after a bite in a woodpile. Which spider is responsible?", "options": [{"letter": "A", "text": "Brown recluse"}, {"letter": "B", "text": "Tarantula"}, {"letter": "C", "text": "Black widow"}, {"letter": "D", "text": "Hobo spider"}], "answer": "C", "explanation": "**Black widow**: severe muscle spasm, especially abdominal; supportive care, antivenom. Brown recluse: painless bite progressing to a necrotic ulcer over days; 'It's NEVER a spider bite' — most are MRSA abscesses.", "objective": "", "hint": "One spider causes **spasm**, the other a painless bite that progresses to a necrotic ulcer over days; and the lecture's final word is that most 'spider bites' are actually MRSA abscesses."}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  const normAns = a => (Array.isArray(a) ? a.join('') : String(a == null ? '' : a))
    .toUpperCase().replace(/[^A-Z]/g, '').split('')
    .filter((v, i, z) => z.indexOf(v) === i).sort().join('');
  questions.forEach(q => { const n = normAns(q.answer); q.multi = q.multi === true || n.length > 1; q.answer = n; });
  const picks = {};          // question id -> letters picked but not yet submitted (multi only)
  const second = {};         // question id -> second-attempt answer (NOT scored)
  const flagged = {};        // question id -> true, set by the student at any point
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const keys = new Set(String(item.answer).split('').map(l => (item.options.find(o => o.letter === l) || {}).text));
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = item.options.filter(o => keys.has(o.text)).map(o => o.letter).join('');
  }
  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letters) => String(letters == null ? '' : letters).split('')
    .map(l => { const o = item.options.find(x => x.letter === l); return o ? o.text : ''; })
    .filter(Boolean).join(' \u00b7 ');
  const letters = v => String(v == null ? '' : v).split('').join(', ');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Hint, then the same question again =================
  // A missed question is never replaced by new questions. The student gets a hint
  // that points hard at the answer without naming it, then the SAME question again.
  // The FIRST attempt is what is scored; the second only decides whether the concept
  // is recorded as relearned or still shaky.
  function hintOf(q) {
    const r = q.remediation || {};
    return q.hint || r.hint || ((r.steps || [])[0] || {}).teach || '';
  }
  function hasTutor(q) { return !!hintOf(q); }

  function startTutor(q) {
    tutor[q.id] = { status: 'active', first: answers[q.id] };
    delete picks[q.id];
  }

  function isRetrying(q) { const t = tutor[q.id]; return !!(t && t.status === 'active'); }

  function secondAnswer(q, picked) {
    const t = tutor[q.id];
    if (!t || t.status !== 'active') return;
    second[q.id] = picked;
    t.status = picked === q.answer ? 'mastered' : 'review';
  }

  // The option already shown to be wrong is struck out on the retry. A select-all
  // answer is a set rather than one claim, so there every option stays live.
  function elimOf(q) { const t = tutor[q.id]; return (t && !q.multi && t.first) ? t.first : ''; }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong with no hint to give, or the second attempt is in.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return !isRetrying(q);
  }

  function tutorStatus(q) { const t = tutor[q.id]; return t ? t.status : null; }

  function hintHtml(q) {
    return '<div class="tutor"><div class="tutor-head">Hint</div>' +
      '<div class="tnode active hint"><span class="tlabel">Try again \u2014 same question</span>' +
      '<div class="teach">' + fmt(hintOf(q)) + '</div></div></div>';
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly can still be carried into the next round of study.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">\u2691 ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '\u2691 ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  // Collapsed record of the retry, shown in the review screens
  function trailHtml(q) {
    const t = tutor[q.id];
    if (!t) return '';
    const sec = second[q.id];
    let html = '<div class="tutor"><div class="tutor-head">Hint and second attempt</div>' +
      '<div class="tnode done"><div class="teach">' + fmt(hintOf(q)) + '</div>' +
      '<div class="firstpick">First answer: ' + esc(letters(t.first)) + '. ' + fmt(optText(q, t.first)) + '</div>';
    if (sec === undefined) html += '<div class="nudge">Second attempt not taken.</div>';
    else html += '<div class="feedback ' + (t.status === 'mastered' ? 'good' : 'bad') + '"><div class="verdict">' +
      (t.status === 'mastered' ? '\u2713 Correct on the second attempt'
        : '\u2717 Second attempt: ' + esc(letters(sec)) + '. ' + fmt(optText(q, sec))) + '</div></div>';
    return html + '</div></div>';
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen, first) {
    const good = chosen === q.answer;
    const keyTxt = optText(q, q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '\u2713 Correct' : '\u2717 Incorrect \u2014 correct answer' +
      (q.multi ? 's' : '') + ': ' + esc(letters(q.answer)) + (keyTxt ? '. ' + fmt(keyTxt) : '')) + '</div>';
    if (!good && q.multi) {
      const got = String(chosen || '').split('').filter(Boolean);
      const missed = String(q.answer).split('').filter(l => got.indexOf(l) === -1);
      const extra = got.filter(l => q.answer.indexOf(l) === -1), bits = [];
      if (missed.length) bits.push('missed ' + missed.join(', '));
      if (extra.length) bits.push('wrongly included ' + extra.join(', '));
      if (bits.length) html += '<div class="obj" style="font-style:normal">You ' + esc(bits.join(' and ')) + '.</div>';
    }
    if (first !== undefined && first !== chosen) {
      html += '<div class="firstpick">First attempt: ' + esc(letters(first)) + '. ' + fmt(optText(q, first)) +
        (good ? ' \u2014 corrected after the hint.' : ' \u2014 also incorrect.') + '</div>';
    }
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const first = answers[q.id];
    const sec = second[q.id];
    const retry = isRetrying(q) && mode === 'exam';
    const answered = first !== undefined && !retry;
    const chosen = sec !== undefined ? sec : first;
    const status = tutorStatus(q);
    const sel = answered ? String(chosen || '') : (q.multi ? (picks[q.id] || []).join('') : '');
    const dead = retry ? elimOf(q) : '';

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Right on the second try</span>';
    else if (status === 'review') html += '<span class="badge review">Missed twice</span>';
    else if (status === 'active') html += '<span class="badge active">Second attempt</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';

    if (retry) {
      html += '<div class="feedback tutoring"><div class="verdict">\u2717 Not quite \u2014 ' +
        esc(letters(first)) + '. ' + fmt(optText(q, first)) + '</div>' +
        '<div>Read the hint, then answer the same question again. Your first answer is the one that is scored.</div></div>';
      html += hintHtml(q);
    }

    if (q.multi && !answered) html += '<div class="sata-note">Select all that apply.</div>';
    html += '<div class="opts">';
    q.options.forEach(o => {
      let cls = 'opt';
      const hit = sel.indexOf(o.letter) !== -1;
      const out = dead.indexOf(o.letter) !== -1;
      if (answered) {
        if (hit) cls += q.answer.indexOf(o.letter) !== -1 ? ' correct' : ' incorrect';
        else if (q.answer.indexOf(o.letter) !== -1) cls += ' correct';
        else cls += ' dim';
      } else if (out) cls += ' incorrect elim';
      else if (hit) cls += ' picked';
      const mark = (q.multi ? '<span class="box' + (hit ? ' on' : '') + '">' + (hit ? '\u2713' : '') + '</span>' : '') +
        '<span class="letter">' + esc(o.letter) + '.</span>';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered || out || mode !== 'exam' ? ' disabled' : '') + '>' +
        mark + '<span>' + fmt(o.text) + '</span></button>';
    });
    html += '</div>';
    if (q.multi && !answered) {
      const n = (picks[q.id] || []).length;
      html += '<div class="sata-bar"><button class="opt-submit" data-submit="' + esc(q.id) + '"' +
        (n ? '' : ' disabled') + '>Submit answer</button><span class="sata-count">' +
        (n ? n + ' selected' : 'Choose one or more') + '</span></div>';
    }
    if (answered) html += feedbackHtml(q, chosen, sec !== undefined ? first : undefined);
    html += flagHtml(q);
    if (mode !== 'exam' && tutor[q.id]) {
      html += '<details class="trail"><summary>Hint and second attempt</summary>' + trailHtml(q) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'take the second attempt above to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Option clicks: first attempt, then the second attempt on the same question
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      const commit = picked => {
        const q = byId[qid];
        if (answers[qid] === undefined) {
          answers[qid] = picked;
          if (picked !== q.answer && hasTutor(q)) startTutor(q);
        } else if (isRetrying(q)) secondAnswer(q, picked);
        renderPage(true);
      };
      card.querySelectorAll(':scope > .opts > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          const q = byId[qid];
          if (answers[qid] !== undefined && !isRetrying(q)) return;
          const letter = btn.getAttribute('data-letter');
          if (q.multi) {                       // toggle; nothing is committed until Submit
            const cur = picks[qid] || (picks[qid] = []);
            const at = cur.indexOf(letter);
            if (at === -1) cur.push(letter); else cur.splice(at, 1);
            return renderPage(true);
          }
          commit(letter);
        });
      });
      const sub = card.querySelector(':scope > .sata-bar > .opt-submit');
      if (sub) sub.addEventListener('click', () => {
        if (mode !== 'exam') return;
        const cur = picks[qid] || [];
        if (cur.length) commit(cur.slice().sort().join(''));
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.qcard > .feedback');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      if (second[id] !== undefined) { ts.tq++; if (t.status === 'mastered') ts.tqRight++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {                 // wrong on the first attempt, or flagged
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' still shaky');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' right on the second try');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed question' + (r.ts.started === 1 ? '' : 's') + ' answered right on the second attempt</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try, plus anything you flagged</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed or flagged — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, flagged: 2, mastered: 3 };
      const items = missed.map(q => {
        const wrong = answers[q.id] !== undefined && answers[q.id] !== q.answer;
        let st = wrong ? (tutor[q.id] ? tutor[q.id].status : 'missed') : 'flagged';
        if (st === 'active') st = 'review';
        return { q, st: st, flag: !!flagged[q.id] };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', flagged: 'Flagged', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + (it.flag && it.st !== 'flagged' ? '⚑ ' : '') +
          label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Second attempts</h2><div class="sub" style="margin-bottom:12px">How the hint-and-retry went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>missed on the first try</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>right after the hint</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>second attempts right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered'
        : 'My answer (first attempt, scored): ' + letters(answers[q.id]));
      lines.push('Correct answer: ' + letters(q.answer) + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        lines.push('Hint shown: ' + plain(hintOf(q)));
        lines.push('Second attempt: ' + { mastered: 'CORRECT after the hint', review: 'still wrong \u2014 needs review',
          active: 'not taken' }[t.status]);
        if (second[q.id] !== undefined && t.status !== 'mastered')
          lines.push('  picked ' + letters(second[q.id]) + '. ' + plain(optText(q, second[q.id])));
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(second).forEach(k => delete second[k]);
    Object.keys(picks).forEach(k => delete picks[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
