<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

const EXAM_DATA = (function (raw) {
  // Reshuffle stack order and option order on every open; renumber ids.
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const groups = {}; const order = [];
  raw.questions.forEach(q => { if (!groups[q.group]) { groups[q.group] = []; order.push(q.group); } groups[q.group].push(q); });
  shuffle(order);
  const out = []; const letters = ['A','B','C','D','E','F'];
  order.forEach((g, gi) => {
    groups[g].forEach((q, qi) => {
      const correct = q.options.find(o => o.letter === q.answer).text;
      const opts = shuffle(q.options.map(o => o.text)).map((t, i) => ({ letter: letters[i], text: t }));
      const ans = opts.find(o => o.text === correct).letter;
      out.push(Object.assign({}, q, { id: String(gi + 1) + (qi === 0 ? '' : letters[qi - 1]), group: gi + 1, options: opts, answer: ans }));
    });
  });
  return { title: raw.title, questions: out };

am; Admit; Bone scan; Delay reduction until swelling resolves; Cast"}, {"letter": "D", "text": "Immediate ORIF without reduction; No splint; MRI first; NPO for 24 hours; Discharge home"}, {"letter": "E", "text": "Ottawa rules first; Compression wrap; Crutches; NSAIDs only; Return if not improved in 2 weeks"}], "answer": "A", "explanation": "Pain Management!!; Are additional studies needed based on your exam? If so, what?; Reduction; Splinting; Prompt follow up", "objective": "Evaluation of the Orthopaedic Patient — Case #3", "section": "Evaluation of the Orthopaedic Patient"}, {"id": "4", "group": 4, "stem": "A 32 year old female presents to the clinic complaining of worsening 2 week right foot pain.\nShe states she is a runner and has a goal of running a half marathon later this fall. Prior to this goal, she was running about 3 times weekly with an average distance of 2 - 3 miles. For the past 3 weeks, she has increased her training and is now running 4 – 5 times weekly with an average distance of 5 miles.\nShe takes no medications other than OTC ibuprofen (“when it really hurts”) and oral contraceptives.\nShe denies a specific recent injury and denies previous foot problems. Pain at worst is 3/10 and occurs when running. Pain resolves with rest.\nVS: WNL\nPE:\nGeneral – A & O x 3, WDWN female, NAD, athletic in appearance\nHEENT - Normal\nCV & Pulm – Normal\nMSK – No foot deformities noted. Slight swelling and mild tenderness over right 2nd MT, otherwise normal ROM and strength in all UE & LE. Normal and equal wear on treads of shoes. Normal ambulation with no gait abnormalities noted.\nNeuro – Normal in right LE\nImaging: X-ray is on the right\nPatient returns to clinic 3 weeks later with increased right foot pain.\nShe initially rested her foot for about a week and her symptoms improved, however, she then returned to her training workout schedule and the foot pain has returned and is a 5/10.\nOTC ibuprofen helps “for a bit” but she now experiences pain with walking and standing.\nPE is same as before, however now she has increased swelling across the dorsum of her right foot and pain with palpation over the right 2nd and 3rd MT.\n\nWhat do we do now?", "options": [{"letter": "A", "text": "Repeat X-rays"}, {"letter": "B", "text": "MRI of the right foot"}, {"letter": "C", "text": "Three-phase bone scan"}, {"letter": "D", "text": "CT of the right foot"}, {"letter": "E", "text": "Return to full training schedule"}], "answer": "A", "explanation": "Repeat X-rays!", "objective": "Intro to Ortho Imaging — Case 1: “My foot hurts”", "section": "Intro to Ortho Imaging", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAIqA1gDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD3GiivJvgh4y13xPLrX/CQX/2pLVImj/cxptzvz9xRnoKAPWaK4+P4n+C5LKW8XXYhBG4Ri0MisSRnhSuW/AHFbeka9pfiHS5L3RL6O5gG5TImQUbHQgjIPfkUAatFeK+AfFp0Dwlr+p6v4rTWXRkS1ZzdSqkpRyqHzEUgMR2445IrY+HfxdstchS28S3FraatPeCC2t7a3m2yKwULk/MASxI5I6UAepUV5bY3d4fjddW58T77YKcaR5tx8v7kH7pTyuvzcN39a6fVviP4Q0i9ks7/AFuFLiJikiJG8mxgcEHapAIPagDq6KzNN1vTdc0uS+0a9iuoMMPMib7rAdCOoPsa82/Z71fU9WsNabVdRvL1o5YghuZ2kKghs43E4oA9coqK6jkmtpY4Z2gkdCqTKoJjJHDAEEHHuK8j8NfEbVPDviLVtB+I12Ge3VpLe7EKoGCjOAFABDDle+eOp4APYaK8v+F3iDxX4y1i/wBavbs23h6ORktrMQx/O3Yb9u4hRyTnkn0yK9PZgi 5, "stem": "Patient is a 19 year old male who presents with right hand pain x 12 hours.\nHe went to a fraternity party the previous evening and saw his ex-girlfriend dancing with one of his friends. He became angry and decided to leave the party. As he was leaving, he hit the door with his closed fist and had immediate pain over the dorsum of his hand.\nHe went to sleep thinking the pain would improve by the morning but it has now worsened and the hand is swollen and he experiences pain when he tries to make a fist.\nHe takes no medication and is in good health otherwise. Pt is right hand dominant.\nVS: WNL\nPE:\nGeneral – A & O x 3, WDWN male, NAD\nHEENT - Normal\nCV & Pulm – Normal\nMSK – Swelling and tenderness over dorsum of right hand. Moderate tenderness to light palpation over right 4th and 5th MC. Reduced ROM in right wrist and throughout right fingers. Right thumb ROM is intact and normal. Normal ROM and strength in remaining UE & LE joints. Radial & ulnar pulses are equal and intact in both upper limbs.\nNeuro – Normal sensation throughout right UE\n\nWhat is the suspected diagnosis?", "options": [{"letter": "A", "text": "Boxer's fracture — fracture of the right 5th metacarpal neck"}, {"letter": "B", "text": "Bennett's fracture — fracture at the base of the right 1st metacarpal"}, {"letter": "C", "text": "Fracture of the right 4th metacarpal base with CMC dislocation"}, {"letter": "D", "text": "Fight bite — septic arthritis of the right 5th MCP joint"}, {"letter": "E", "text": "Rupture of the extensor tendon over the right 5th MCP joint"}], "answer": "A", "explanation": "(Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 2: “My hand hurts”", "section": "Intro to Ortho Imaging", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARC UYUdCeaSSZThQeKrP0phoAsNIMBQfl9qQsoU4NQd6G6UASFxsODyadbzNDIrqfmByKh7fhSDqKATsz1jSbpbuxilB5Kjd9avrXKeByTYy5JPzV1cdedNWk0e9Rk5RTZMvGKk4AqIVKvQVJ0IcvUYqZKaO1OHUUmUSjHYU7JBzTU604dDSGSA+tK7ZXb2qPtTj0FCER+X6VKq7VFI/SlHamNtskUg08nAqNetPPSmQNPSkzSt90Ug60APHSgHBoNIKYWHE00jPIpG+9Tu1ABj1o4NJ2pRQA0jmlFLTe9Jkjs0hPFJS0CY3pTWNOPWmnrTQhjV554u0AJfm4gjyspycetehtWbrABhGQOtWm0tDGtBSjqeYppErD/AFWKk/sWb/nmK7QKMdB+VOwPQUvayOX2cT//2Q=="}, {"id": "6", "group": 6, "stem": "Patient is 58 year old male painter who complains of right elbow pain x 3 hours.\nEarlier this morning, he was climbing a ladder to begin cutting in the corners of a ceiling he was to paint and he slipped on the ladder and fell off. As he fell, he tried to catch himself but landed on his elbow with his arm out-stretched.\nHe had immediate pain in his elbow and states the elbow became swollen within 15 – 30 minutes.\nHe has pain and reduced ROM with all elbow motion. He’s holding the right elbow in slight flexion and adduction against his body and using his left hand to support the injured limb. Pt is right hand dominant.\nPMH: HTN, Hyperlipidemia, and “pre-diabetes”. He takes lisinopril, lipitor and metformin. He drinks 2 – 4 beers on the weekends and is a prolific tobacco chewer.\nVS: WNL except BP is 150/95\nPE:\nGeneral – A & O x 3, WDWN slightly obese male, NAD, holding right arm in flexion and adduction and supporting with left hand\nHEENT - Normal\nCV & Pulm – Normal\nMSK – No UE deformities noted. Slight swelling and tenderness over right proximal radius. Normal ROM in right wrist and shoulder. Limited ROM testing done in right elbow due to pain. Normal ROM in left UE & b/l LEs.\nNeuro – Normal in right UE\n\nName a few conditions that might be on the DDx.", "options": [{"letter": "A", "text": "Radial head fracture"}, {"letter": "B", "text": "Olecranon fracture"}, {"letter": "C", "text": "Supracondylar humerus fracture"}, {"letter": "D", "text": "Distal biceps tendon rupture"}, {"letter": "E", "text": "Posterior elbow dislocation"}], "answer": "A", "explanation": "Radial head fracture (films confirm a right radial head fracture) (Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 3: “My elbow hurts”", "section": "Intro to Ortho Imaging"}, {"id": "7", "group": 7, "stem": "Patient is a 35 year old male who returned from a skiing vacation yesterday. Two days ago, while downhill skiing, his left pole got snagged on something covered up by the snow. He was able to yank the pole free as he pivoted but he had immediate pain in his left hand and thumb.\nWhen he got to the bottom of the run, he pulled off his glove and noticed swelling at the base of the thumb for which he made a snowball and held it against this area until the snowball melted.\nHe proceeded with a few more runs, treating the hand/thumb pain with snowballs and then decided to end his skiing day.\nHe has taken OTC ibuprofen for the past 2 days. His PMH, FH and SHx are unremarkable. Pt is right hand dominant.\nVS: WNL\nPE:\nGeneral – A & O x 3, WDWN male, NAD\nHEENT - Normal\nCV & Pulm – Normal\nMSK – Base of left thumb has moderate swelling, warmth and tenderness to light palpation. Pt has reduced ROM of left thumb due to pain, ROM in other fingers are normal. Possible laxity of UCL noted with testing. ROM in left elbow and shoulder appear normal.\nNormal ROM and strength in remaining UE & LE joints. Radial & ulnar pulses are equal and intact in both upper limbs.\nNeuro – Normal sensation noted throughout right UE\n\nWhat should be included in the DDx?", "options": [{"letter": "A", "text": "Gamekeeper's (skier's) thumb — left thumb MCP ulnar collateral ligament injury"}, {"letter": "B", "text": "Bennett's fracture — intra-articular fracture at the base of the left 1st metacarpal"}, {"letter": "C", "text": "De Quervain's tenosynovitis — inflammation of the APL and EPB tendons"}, {"letter": "D", "text": "Scaphoid fracture — waist fracture with tenderness in the snuffbox"}, {"letter": "E", "text": "Thumb CMC osteoarthritis — degenerative change at the base of the thumb"}], "answer": "A", "explanation": "Gamekeeper's (skier's) thumb — left thumb MCP ulnar collateral ligament injury with a small avulsion fracture at the base of the proximal phalanx (Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 4: “I hurt my thumb”", "section": "Intro to Ortho Imaging"}, {"id": "8", "group": 8, "stem": "Patient is a 45 year old female who developed right wrist pain 2 hours ago when she slipped and fell while going to her car.\nShe states the driveway is shaded by trees and has “green slime” on it that “her husband hasn’t gotten around to cleaning off”. The green area becomes slippery after a hard rain and her area had thunderstorms overnight. As she opened the car door, she lost her balance and fell backwards. She threw her right arm out to try to break the fall but ended up landing on her outstretched hand with her palm on the pavement. Pt is right hand dominant.\nShe has hypothyroidism and HTN. She takes Levothyroxine and Amlodipine. The rest of her medical and family history is unremarkable.\nVS: WNL except BP is 160/88\nPE:\nGeneral – A & O x 3, WDWN female, appears in moderate pain\nHEENT - Normal\nCV & Pulm – Normal\nMSK – Possible dinner fork deformity noted in right wrist with moderate swelling and tenderness to light palpation. Pt unable to move right wrist due to pain and supports right wrist with left hand. ROM in right elbow appears normal. Right thumb and finger ROM is intact but reduced due to pain. Normal ROM and strength in remaining UE & LE joints. Radial & ulnar pulses are equal and intact in both upper limbs.\nNeuro – Normal sensation noted throughout right UE\n\nName a few conditions that might be on the DDx.", "options": [{"letter": "A", "text": "Colles fracture — right distal radius fracture with dorsal displacement"}, {"letter": "B", "text": "Smith fracture — right distal radius fracture with volar displacement"}, {"letter": "C", "text": "Scaphoid fracture — fracture through the waist of the right scaphoid"}, {"letter": "D", "text": "Galeazzi fracture — distal radial shaft fracture with DRUJ dislocation"}, {"letter": "E", "text": "Barton fracture — intra-articular rim fracture with carpal subluxation"}], "answer": "A", "explanation": "Colles fracture — right distal radius fracture with dorsal displacement (\"dinner fork\" deformity) (Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 5: “My wrist hurts”", "section": "Intro to Ortho Imaging"}, {"id": "9", "group": 9, "stem": "A 73 year old female retired Museum Art Director complains of right knee pain after slipping in her kitchen x 4 hours.\nShe states she was frying fish for dinner and some of the cooking oil splattered on the tile floor near the stove. As she turned to go to the sink, she slipped on the cooking oil and fell on the floor, landing on her flexed knee.\nShe had immediate pain and could not get up without assistance from her husband.\nHe was able to get her to a chair and she iced her knee for “a couple of hours” but they are concerned about the pain and swelling. Additionally, she has not able to bear weight on the knee.\nHer past medical history includes early stage dementia and urinary incontinence. Her medications include memantine and Detrol. She appears to be a fair historian and her husband states she “generally does well”. Family and surgical history are non-contributory and nonremarkable.\nVS: T 98.8, P 95, BP is 155/92, O2 98% RA, R 20\nPE:\nGeneral – A & O x 3, WDWN female in moderate distress. PT is NWB due to pain and is in wheelchair. Pt appears to be fair historian with husband helping answer questions.\nHEENT - Normal\nCV & Pulm – Normal\nMSK – Right knee with warmth, ecchymosis, erythema, moderate swelling and pain with light palpation. Moderate effusion noted throughout capsule. 1+ pedal edema in right LE. DP pulse normal\nNeuro – Normal sensation noted throughout right LE\n\nName a few conditions that might be on the DDx.", "options": [{"letter": "A", "text": "Transverse patellar fracture (right)"}, {"letter": "B", "text": "Quadriceps tendon rupture (right)"}, {"letter": "C", "text": "Prepatellar bursitis (right)"}, {"letter": "D", "text": "Tibial plateau fracture (right)"}, {"letter": "E", "text": "Lateral patellar dislocation (right)"}], "answer": "A", "explanation": "(Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 6: “My knee hurts”", "section": "Intro to Ortho Imaging", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAIqAbkDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD3GimTSpDE8srBI0UszHoAOSa8l0Xxj4s+ImuXsPhS5t9F0ezIDXctuJpWznb8rcZOCccY7k8UAeu0VymhWni/T727j1/V7XVLA2zNDcR24glWQEcFRxjGemenauL+AWsapq2k66+qaneXbRvGI3uZ3kKZVs4yTj8KAPX6K8o+D+sPbaHr1/rXir+2Le12SPNvuZPIQKxPEqA9s/KD0rp2+J/gtbGO9bXYhDI5RP3Mm8kdfk27sc9cYoA7Ciub13VrXU/Amp6lo2qxxwvZStFfRs4ERCn5sqCwIPoMjHSsb4SXzjwTLdan4gTVFjuJC99JLKVRQF4LTKrAD6Y5oA72iuSt/iZ4Mub5bKHXrczs21co4Un/AHyu39a0PEXjHw94ZkSPW9UhtZXXesRDO5XJGdqgnGQefagDdorC8O+MfD3iZ3j0TVIbqRBuaPDI4HrtYA498V57p+sao/7QF5pj6leNp6odtoZ2MQ/cKfuZx156daAPX6KK5u88d+GLHWLnSLzVo4L22XdMkkbqqDaG++Rt6Ed++OtAHSUVgeHfGfh3xLNJBomqRXM0Y3NH mur / femoral neck)"}, {"letter": "B", "text": "Posterior dislocation of the native left hip"}, {"letter": "C", "text": "Left pubic ramus fracture"}, {"letter": "D", "text": "Pathologic fracture of the left femoral shaft"}, {"letter": "E", "text": "Left greater trochanteric bursitis"}], "answer": "A", "explanation": "(Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 8: “My hip hurts”", "section": "Intro to Ortho Imaging"}, {"id": "12", "group": 12, "stem": "Pt is a 27 year old male construction worker who was at a private home construction site building a new front porch when he stepped backward and lost his balance and fell off the porch to the ground – a distance of approximately 5 feet.\nHe fell with his left arm abducted and extended and felt a pop in his shoulder. The injury occurred approximately 30 minutes prior. He is unable to move his left arm. A coworker who witnessed the fall brought him to the ED.\nPt has a PMH of an ACL repair about 10 years ago when he played baseball during high school. He takes no medications and his FM is unremarkable. He smokes a pack of cigarettes daily x 5 years.\nVS: T 98.1, BP 160/91, P 95, R 18, O2 98% RA\nPE:\nGeneral – A & O x 3, WDWN male in moderate distress\nHEENT - Normal\nCV – Tachycardic with normal rhythm, no m/r/g, normal S1/S2\nPulm – CTAB, no wheezes, rubs or rhonchi noted\nMSK – Due to patient’s pain and distress, provider is unable to palpate injury or assess ROM. By appearance, left shoulder appear to droop and is externally rotated. Sulcus sign is observed. Radial and ulnar pulses are present and equal bilaterally\nNeuro – Normal sensation noted throughout b/l UEs\n\nWhat is the suspected diagnosis?", "options": [{"letter": "A", "text": "Anterior dislocation of the left shoulder"}, {"letter": "B", "text": "Posterior dislocation of the left shoulder"}, {"letter": "C", "text": "Left acromioclavicular separation"}, {"letter": "D", "text": "Left proximal humerus fracture"}, {"letter": "E", "text": "Left full-thickness rotator cuff tear"}], "answer": "A", "explanation": "(Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 9: “My shoulder hurts”", "section": "Intro to Ortho Imaging"}, {"id": "13", "group": 13, "stem": "A 45-year-old man presented with a 2-year history of an enlarging left forearm mass. He has noted enlargement of his left forearm with associated pain with movement. The pain is worst with flexion on the lateral aspect of his forearm. The pain does not overtly limit his activities of daily living and improves with non-steroidal anti-inflammatory drugs. He denies numbness, tingling, weakness or unexpected weight loss.\nPatient recalled suffering an injury to his left forearm during a soccer game in Ghana at the age of 15 years. He was seen by a nurse who placed his forearm in a cast. No radiography images were obtained, and he had no further follow-up.\nHe has never had issues with his forearm until the last few years.\nOn PE, the patient has a notable deformity of the left forearm. There was a palpable mass in the mid-ulnar shaft without tenderness, erythema or skin break.\nHis elbow and wrist range of motions were preserved with mild pain with supination, pronation and elbow flexion.\nHe had normal strength and was neurovascularly intact.\n\nIs this a new fracture or old fracture?", "options": [{"letter": "A", "text": "Old fracture — chronic non-union"}, {"letter": "B", "text": "New fracture — acute displaced"}, {"letter": "C", "text": "Old fracture — healed in anatomic alignment"}, {"letter": "D", "text": "New fracture — pathologic through a tumor"}, {"letter": "E", "text": "Old fracture — complicated by osteomyelitis"}], "answer": "A", "explanation": "(Answer inferred from lecture slides)", "objective": "Intro to Ortho Imaging — Case 10: “Left forearm mass”", "section": "Intro to Ortho Imaging", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRA nuted fracture of the ulnar diaphysis with an intact, normally aligned radius and elbow"}, {"letter": "C", "text": "Atrophic non-union of the radial diaphysis with an intact ulna and a normal elbow joint"}, {"letter": "D", "text": "Expansile lytic lesion of the ulnar shaft with a sunburst periosteal reaction"}, {"letter": "E", "text": "Healed ulnar shaft fracture in anatomic alignment with normal elbow and wrist joints"}], "answer": "A", "explanation": "“Plain radiography demonstrated a chronic and hypertrophic non-union ulnar diaphysis fracture with mild deformity of the radial diaphysis related to the healed fracture. There was also moderate to severe osteoarthrosis of the elbow.”", "objective": "Intro to Ortho Imaging — Case 10: “Left forearm mass”", "section": "Intro to Ortho Imaging"}, {"id": "13B", "group": 13, "stem": "Treatment:", "options": [{"letter": "A", "text": "Elective ulnar open reduction and internal fixation with bone graft"}, {"letter": "B", "text": "Closed reduction and long-arm casting for 6 weeks"}, {"letter": "C", "text": "Wide resection of the ulna with limb-salvage reconstruction"}, {"letter": "D", "text": "IV antibiotics and surgical debridement of the ulna"}, {"letter": "E", "text": "Observation only — the deformity is cosmetic"}], "answer": "A", "explanation": "“Our consultant orthopedic surgeon recommended an elective ulnar open reduction and internal fixation with bone graft.”", "objective": "Intro to Ortho Imaging — Case 10: “Left forearm mass”", "section": "Intro to Ortho Imaging"}, {"id": "14", "group": 14, "stem": "20 y/o female presents to ED with report of MVC 1 hour prior to arrival. Pt states that she was crossing an intersection when her car was hit on the driver’s side rear by another car who ran the red light. She reports that her “spun” and then hit a wall. Pt reports wearing her seatbelt and reports all airbags deployed. She denies hitting her head and denies LOC but states that her head was whipped around during the accident. Pt was able to self extricated from her vehicle and was ambulatory from the scene. Pt admits to neck pain. She also states that she feels tingling to her right arm. Denies any other pain.\n\nDifferential Diagnosis? Anything else you want to know?", "options": [{"letter": "A", "text": "Cervical muscle spasm"}, {"letter": "B", "text": "Jefferson fracture"}, {"letter": "C", "text": "Central cord syndrome"}, {"letter": "D", "text": "Hangman's fracture"}, {"letter": "E", "text": "Thoracic outlet syndrome"}], "answer": "A", "explanation": "Cervical muscle spasm.", "objective": "Spine Disorders — Case #1", "section": "Spine Disorders"}, {"id": "15", "group": 15, "stem": "41 y/o male presents to ED with complaint of back pain. Pt reports chronic hx of back pain for several months but states that his pain suddenly worsened today when he sneezed. He reports some numbness to both feet and reports difficulty starting and stopping bowel movements.\n\nWhat are you thinking about? Do you have other questions? Any physical exam & special tests you want to perform?", "options": [{"letter": "A", "text": "Cauda equina syndrome from a herniated L4/L5 disc"}, {"letter": "B", "text": "Lumbar spinal stenosis with neurogenic claudication"}, {"letter": "C", "text": "Vertebral compression fracture from osteoporosis"}, {"letter": "D", "text": "Sciatica from an L5/S1 lateral disc herniation"}, {"letter": "E", "text": "Ankylosing spondylitis with sacroiliitis"}], "answer": "A", "explanation": "Emergent MRI revealed severe herniation of L4/L5 disc with near complete cord compression (cauda equina) — taken emergently to OR for decompression.", "objective": "Spine Disorders — Case #2", "section": "Spine Disorders"}, {"id": "16", "group": 16, "stem": "A 42-year-old female presents with burning pain in the ball of her foot radiating to the 3rd and 4th toes. The pain is worse after prolonged standing, especially while wearing high heels. Examination reveals tenderness over the plantar aspect of the distal foot at the 3rd intermetatarsal space. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Morton neuroma"}, {"letter": "B", "text": "Plantar fasciitis"}, {"letter": "C", "text": "Tarsal tunnel syndrome"}, {"letter": "D", "text": "Metatarsal stress fracture"}, {"letter": "E", "text": "Hallux valgus"}], "answer": "A", "explanation": "Correct Answer: Morton neuroma", "objective": "Cram the PANCE — MSK — 1. Morton Neuroma", "section": "Cram the PANCE — MSK"}, {"id": "17", "group": 17, "stem": "A 62-year-old male presents after a motor vehicle accident with severe right hip pain. The right leg is internally rotated and adducted. X-rays demonstrate a hip dislocation. What type of dislocation did he most likely sustain?", "options": [{"letter": "A", "text": "Posterior hip dislocation"}, {"letter": "B", "text": "Anterior hip dislocation"}, {"letter": "C", "text": "Intertrochanteric fracture"}, {"letter": "D", "text": "Femoral neck fracture"}, {"letter": "E", "text": "Acetabular fracture"}], "answer": "A", "explanation": "Correct Answer: Posterior hip dislocation", "objective": "Cram the PANCE — MSK — 2. Hip Dislocation", "section": "Cram the PANCE — MSK"}, {"id": "18", "group": 18, "stem": "A 46-year-old male develops severe low-back pain radiating into both legs after moving furniture. He has numbness of the inner thighs and buttocks, difficulty urinating, lower-extremity weakness, saddle paresthesia, and loss of rectal tone. What is the diagnostic test of choice?", "options": [{"letter": "A", "text": "MRI"}, {"letter": "B", "text": "CT myelogram"}, {"letter": "C", "text": "Lumbar spine X-ray"}, {"letter": "D", "text": "EMG/NCS"}, {"letter": "E", "text": "Post-void residual"}], "answer": "A", "explanation": "Correct Answer: MRI", "objective": "Cram the PANCE — MSK — 3. Cauda Equina Syndrome", "section": "Cram the PANCE — MSK"}, {"id": "19", "group": 19, "stem": "Anterior displacement or forward slippage of one vertebral body relative to the vertebral body beneath it is known as what?", "options": [{"letter": "A", "text": "Spondylolisthesis"}, {"letter": "B", "text": "Spondylolysis"}, {"letter": "C", "text": "Spinal stenosis"}, {"letter": "D", "text": "Retrolisthesis"}, {"letter": "E", "text": "Spondylosis"}], "answer": "A", "explanation": "Correct Answer: Spondylolisthesis", "objective": "Cram the PANCE — MSK — 4. Spondylolisthesis", "section": "Cram the PANCE — MSK"}, {"id": "20", "group": 20, "stem": "A young child develops limited use of the right arm after his older brother swings him by his arms. There is no bony tenderness, bruising, deformity, or swelling, and radiographs are negative. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Radial head subluxation (nursemaid elbow)"}, {"letter": "B", "text": "Supracondylar humerus fracture"}, {"letter": "C", "text": "Radial head fracture"}, {"letter": "D", "text": "Olecranon bursitis"}, {"letter": "E", "text": "Posterior elbow dislocation"}], "answer": "A", "explanation": "Correct Answer: Radial head subluxation (nursemaid elbow)", "objective": "Cram the PANCE — MSK — 5. Nursemaid Elbow", "section": "Cram the PANCE — MSK"}, {"id": "21", "group": 21, "stem": "A 27-year-old male playing soccer suddenly stops to change direction and feels a pop in his knee followed by pain and immediate swelling. Lachman testing demonstrates increased anterior tibial translation without a distinct endpoint. What injury did he sustain?", "options": [{"letter": "A", "text": "Anterior cruciate ligament (ACL) tear"}, {"letter": "B", "text": "Posterior cruciate ligament (PCL) tear"}, {"letter": "C", "text": "Medial collateral ligament (MCL) tear"}, {"letter": "D", "text": "Medial meniscus tear"}, {"letter": "E", "text": "Patellar dislocation"}], "answer": "A", "explanation": "Correct Answer: Anterior cruciate ligament (ACL) tear", "objective": "Cram the PANCE — MSK — 6. ACL Injury", "section": "Cram the PANCE — MSK"}, {"id": "22", "group": 22, "stem": "A 14-year-old boy presents with severe, deep knee and thigh pain that keeps him awake at night. A tender soft-tissue mass is palpated over the distal femur. X-ray demonstrates a radial/sunburst pattern. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Osteosarcoma"}, {"letter": "B", "text": "Ewing sarcoma"}, {"letter": "C", "text": "Osteoid osteoma"}, {"letter": "D", "text": "Chondrosarcoma"}, {"letter": "E", "text": "Osteochondroma"}], "answer": "A", "explanation": "Correct Answer: Osteosarcoma", "objective": "Cram the PANCE — MSK — 7. Bone Malignancy", "section": "Cram the PANCE — MSK"}, {"id": "23", "group": 23, "stem": "A patient develops acute shoulder pain after a seizure. The arm is held in adduction and internal rotation and cannot be externally rotated. X-ray demonstrates a “light-bulb” appearance of the humeral head. What injury did the patient sustain?", "options": [{"letter": "A", "text": "Posterior shoulder dislocation"}, {"letter": "B", "text": "Anterior shoulder dislocation"}, {"letter": "C", "text": "Proximal humerus fracture"}, {"letter": "D", "text": "Acromioclavicular separation"}, {"letter": "E", "text": "Rotator cuff tear"}], "answer": "A", "explanation": "Correct Answer: Posterior shoulder dislocation", "objective": "Cram the PANCE — MSK — 8. Posterior Shoulder Dislocation", "section": "Cram the PANCE — MSK"}, {"id": "24", "group": 24, "stem": "A 67-year-old female has chronic hand and knee pain that worsens in the evening with only a few minutes of morning stiffness. Examination reveals hard, enlarged distal interphalangeal joints. What are these DIP enlargements called?", "options": [{"letter": "A", "text": "Heberden nodes"}, {"letter": "B", "text": "Bouchard nodes"}, {"letter": "C", "text": "Tophi"}, {"letter": "D", "text": "Rheumatoid nodules"}, {"letter": "E", "text": "Swan neck deformity"}], "answer": "A", "explanation": "Correct Answer: Heberden nodes", "objective": "Cram the PANCE — MSK — 9. Osteoarthritis Nodes", "section": "Cram the PANCE — MSK"}, {"id": "25", "group": 25, "stem": "A 53-year-old woman with diabetes and hypothyroidism develops progressive shoulder pain and stiffness without trauma. Both active and passive range of motion are markedly restricted in all planes. Rotator cuff strength and shoulder radiographs are normal. What is the diagnosis?", "options": [{"letter": "A", "text": "Adhesive capsulitis (frozen shoulder)"}, {"letter": "B", "text": "Rotator cuff tendonitis"}, {"letter": "C", "text": "Subacromial bursitis"}, {"letter": "D", "text": "Glenohumeral osteoarthritis"}, {"letter": "E", "text": "Impingement syndrome"}], "answer": "A", "explanation": "Correct Answer: Adhesive capsulitis (frozen shoulder)", "objective": "Cram the PANCE — MSK — 10. Frozen Shoulder", "section": "Cram the PANCE — MSK"}, {"id": "26", "group": 26, "stem": "Injury to which nerve during a humeral shaft fracture can produce wrist drop and weakness of wrist and finger extension?", "options": [{"letter": "A", "text": "Radial nerve"}, {"letter": "B", "text": "Axillary nerve"}, {"letter": "C", "text": "Median nerve"}, {"letter": "D", "text": "Ulnar nerve"}, {"letter": "E", "text": "Musculocutaneous nerve"}], "answer": "A", "explanation": "Correct Answer: Radial nerve", "objective": "Cram the PANCE — MSK — 11. Humeral Shaft Fracture", "section": "Cram the PANCE — MSK"}, {"id": "27", "group": 27, "stem": "A 22-year-old male has chronic hip and thigh pain that is worse at night and dramatically relieved by ibuprofen. Imaging demonstrates an osteoid osteoma. What is secreted by the tumor that produces the pain?", "options": [{"letter": "A", "text": "Prostaglandins"}, {"letter": "B", "text": "Bradykinin"}, {"letter": "C", "text": "Histamine"}, {"letter": "D", "text": "Substance P"}, {"letter": "E", "text": "Leukotrienes"}], "answer": "A", "explanation": "Correct Answer: Prostaglandins", "objective": "Cram the PANCE — MSK — 12. Osteoid Osteoma", "section": "Cram the PANCE — MSK"}, {"id": "28", "group": 28, "stem": "Scoliosis is defined as an abnormal lateral curvature of the spine with a Cobb angle greater than what value?", "options": [{"letter": "A", "text": "10°"}, {"letter": "B", "text": "5°"}, {"letter": "C", "text": "20°"}, {"letter": "D", "text": "25°"}, {"letter": "E", "text": "40°"}], "answer": "A", "explanation": "Correct Answer: 10°", "objective": "Cram the PANCE — MSK — 13. Scoliosis", "section": "Cram the PANCE — MSK"}, {"id": "29", "group": 29, "stem": "A 59-year-old female sustains an anterior shoulder dislocation after falling from her bicycle. She develops numbness and tingling over the lateral shoulder with deltoid weakness. Which nerve was injured?", "options": [{"letter": "A", "text": "Axillary nerve"}, {"letter": "B", "text": "Radial nerve"}, {"letter": "C", "text": "Musculocutaneous nerve"}, {"letter": "D", "text": "Suprascapular nerve"}, {"letter": "E", "text": "Long thoracic nerve"}], "answer": "A", "explanation": "Correct Answer: Axillary nerve", "objective": "Cram the PANCE — MSK — 14. Anterior Shoulder Dislocation Complication", "section": "Cram the PANCE — MSK"}, {"id": "30", "group": 30, "stem": "A 32-year-old woman six weeks postpartum develops radial-sided wrist pain exacerbated by thumb and wrist movement. She has tenderness over the radial styloid, and ulnar deviation of the wrist with the thumb flexed into the palm reproduces her pain. What is the diagnosis?", "options": [{"letter": "A", "text": "De Quervain tenosynovitis"}, {"letter": "B", "text": "Intersection syndrome"}, {"letter": "C", "text": "Scaphoid fracture"}, {"letter": "D", "text": "Thumb CMC osteoarthritis"}, {"letter": "E", "text": "Carpal tunnel syndrome"}], "answer": "A", "explanation": "Correct Answer: De Quervain tenosynovitis/tendinopathy", "objective": "Cram the PANCE — MSK — 15. Radial-Sided Wrist Pain", "section": "Cram the PANCE — MSK"}, {"id": "31", "group": 31, "stem": "A distal radius fracture with dorsal displacement of the distal radius fragment is called what?", "options": [{"letter": "A", "text": "Colles fracture"}, {"letter": "B", "text": "Smith fracture"}, {"letter": "C", "text": "Barton fracture"}, {"letter": "D", "text": "Galeazzi fracture"}, {"letter": "E", "text": "Chauffeur fracture"}], "answer": "A", "explanation": "Correct Answer: Colles fracture", "objective": "Cram the PANCE — MSK — 16. Distal Radius Fracture", "section": "Cram the PANCE — MSK"}, {"id": "32", "group": 32, "stem": "A 57-year-old male has shoulder pain with overhead activity and while sleeping on the affected side. With the arm internally rotated, thumb down, and abducted to 90°, resisted downward pressure causes pain and weakness. MRI confirms a full-thickness rotator cuff tear. Which tendon is affected?", "options": [{"letter": "A", "text": "Supraspinatus tendon"}, {"letter": "B", "text": "Infraspinatus tendon"}, {"letter": "C", "text": "Subscapularis tendon"}, {"letter": "D", "text": "Teres minor tendon"}, {"letter": "E", "text": "Long head of biceps tendon"}], "answer": "A", "explanation": "Correct Answer: Supraspinatus tendon", "objective": "Cram the PANCE — MSK — 17. Rotator Cuff Tear", "section": "Cram the PANCE — MSK"}, {"id": "33", "group": 33, "stem": "A 14-year-old boy has anterior knee pain that worsens while playing basketball or squatting. Examination reveals a prominent, tender tibial tubercle. What is the mainstay of treatment?", "options": [{"letter": "A", "text": "NSAIDs, ice, and activity modification"}, {"letter": "B", "text": "Surgical excision of the tubercle"}, {"letter": "C", "text": "Long-leg cast immobilization"}, {"letter": "D", "text": "Intra-articular steroid injection"}, {"letter": "E", "text": "Complete rest from all activity"}], "answer": "A", "explanation": "Correct Answer: Conservative treatment — NSAIDs, ice, and activity modification", "objective": "Cram the PANCE — MSK — 18. Osgood-Schlatter Disease", "section": "Cram the PANCE — MSK"}, {"id": "34", "group": 34, "stem": "A 43-year-old female has numbness and tingling involving the thumb, index finger, middle finger, and part of the ring finger. Symptoms are worse at night, and Tinel and Phalen tests are positive. Which nerve is compressed?", "options": [{"letter": "A", "text": "Median nerve"}, {"letter": "B", "text": "Ulnar nerve"}, {"letter": "C", "text": "Radial nerve"}, {"letter": "D", "text": "Anterior interosseous nerve"}, {"letter": "E", "text": "Musculocutaneous nerve"}], "answer": "A", "explanation": "Correct Answer: Median nerve", "objective": "Cram the PANCE — MSK — 19. Carpal Tunnel Syndrome", "section": "Cram the PANCE — MSK"}, {"id": "35", "group": 35, "stem": "A 67-year-old avid golfer develops elbow pain without trauma. Wrist flexion against resistance reproduces the pain. Where would tenderness most likely be found?", "options": [{"letter": "A", "text": "Medial epicondyle"}, {"letter": "B", "text": "Lateral epicondyle"}, {"letter": "C", "text": "Olecranon"}, {"letter": "D", "text": "Radial head"}, {"letter": "E", "text": "Antecubital fossa"}], "answer": "A", "explanation": "Correct Answer: Medial epicondyle", "objective": "Cram the PANCE — MSK — 20. Golfer’s Elbow", "section": "Cram the PANCE — MSK"}, {"id": "36", "group": 36, "stem": "Which physical examination test involves squeezing the gastrocnemius/calf and observing for plantar flexion when evaluating a suspected Achilles tendon rupture?", "options": [{"letter": "A", "text": "Thompson test"}, {"letter": "B", "text": "Simmonds-Lachman test"}, {"letter": "C", "text": "Anterior drawer test"}, {"letter": "D", "text": "Kleiger test"}, {"letter": "E", "text": "Squeeze (syndesmosis) test"}], "answer": "A", "explanation": "Correct Answer: Thompson test", "objective": "Cram the PANCE — MSK — 21. Achilles Tendon Rupture", "section": "Cram the PANCE — MSK"}, {"id": "37", "group": 37, "stem": "A 31-year-old male sustains a blow to the lateral aspect of the knee while playing football. Valgus stress testing at approximately 30° of flexion produces pain and laxity. Which structure was injured?", "options": [{"letter": "A", "text": "Medial collateral ligament (MCL)"}, {"letter": "B", "text": "Lateral collateral ligament (LCL)"}, {"letter": "C", "text": "Anterior cruciate ligament (ACL)"}, {"letter": "D", "text": "Posterior cruciate ligament (PCL)"}, {"letter": "E", "text": "Medial meniscus"}], "answer": "A", "explanation": "Correct Answer: Medial collateral ligament (MCL)", "objective": "Cram the PANCE — MSK — 22. Knee Ligament Injury", "section": "Cram the PANCE — MSK"}, {"id": "38", "group": 38, "stem": "A 56-year-old female has persistent heel pain that is worst with her first steps after getting out of bed and improves throughout the day. Examination reveals point tenderness over the medial calcaneal tubercle. What is the diagnosis?", "options": [{"letter": "A", "text": "Plantar fasciitis"}, {"letter": "B", "text": "Achilles tendinitis"}, {"letter": "C", "text": "Calcaneal stress fracture"}, {"letter": "D", "text": "Tarsal tunnel syndrome"}, {"letter": "E", "text": "Morton neuroma"}], "answer": "A", "explanation": "Correct Answer: Plantar fasciitis", "objective": "Cram the PANCE — MSK — 23. Heel Pain", "section": "Cram the PANCE — MSK"}, {"id": "39", "group": 39, "stem": "A 14-year-old boy has persistent thigh pain and swelling with constitutional symptoms and night sweats. X-ray demonstrates a moth-eaten lesion with an onion-skin periosteal reaction. Biopsy reveals small round blue cells and cytogenetics show t(11;22). What is the diagnosis?", "options": [{"letter": "A", "text": "Ewing sarcoma"}, {"letter": "B", "text": "Osteosarcoma"}, {"letter": "C", "text": "Chondrosarcoma"}, {"letter": "D", "text": "Osteomyelitis"}, {"letter": "E", "text": "Multiple myeloma"}], "answer": "A", "explanation": "Correct Answer: Ewing sarcoma", "objective": "Cram the PANCE — MSK — 24. Ewing Sarcoma", "section": "Cram the PANCE — MSK"}, {"id": "40", "group": 40, "stem": "Which ligament is most commonly injured in a , "options": [{"letter": "A", "text": "Meniscal tear"}, {"letter": "B", "text": "ACL tear"}, {"letter": "C", "text": "Patellofemoral syndrome"}, {"letter": "D", "text": "Osteochondritis dissecans"}, {"letter": "E", "text": "MCL sprain"}], "answer": "A", "explanation": "Correct Answer: Meniscal tear", "objective": "Cram the PANCE — MSK — 28. Meniscal Injury", "section": "Cram the PANCE — MSK"}, {"id": "44", "group": 44, "stem": "A 22-year-old male has a painless, slowly enlarging mass of the upper arm. Radiographs reveal a large pedunculated lesion pointing away from the joint space. It is identified as the most common benign bone tumor. What is the diagnosis?", "options": [{"letter": "A", "text": "Osteochondroma"}, {"letter": "B", "text": "Enchondroma"}, {"letter": "C", "text": "Osteoid osteoma"}, {"letter": "D", "text": "Giant cell tumor"}, {"letter": "E", "text": "Unicameral bone cyst"}], "answer": "A", "explanation": "Correct Answer: Osteochondroma", "objective": "Cram the PANCE — MSK — 29. Benign Bone Tumor", "section": "Cram the PANCE — MSK"}, {"id": "45", "group": 45, "stem": "A 29-year-old female avid runner presents with anterior knee pain without trauma. Lateral movement of the patella produces discomfort and apprehension. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Patellofemoral pain syndrome"}, {"letter": "B", "text": "Patellar tendonitis"}, {"letter": "C", "text": "Iliotibial band syndrome"}, {"letter": "D", "text": "Prepatellar bursitis"}, {"letter": "E", "text": "Osgood-Schlatter disease"}], "answer": "A", "explanation": "Correct Answer: Patellofemoral pain syndrome", "objective": "Cram the PANCE — MSK — 30. Anterior Knee Pain in a Runner", "section": "Cram the PANCE — MSK"}, {"id": "46", "group": 46, "stem": "Which carpal bone is fractured most commonly?", "options": [{"letter": "A", "text": "Scaphoid"}, {"letter": "B", "text": "Lunate"}, {"letter": "C", "text": "Hamate"}, {"letter": "D", "text": "Trapezium"}, {"letter": "E", "text": "Capitate"}], "answer": "A", "explanation": "Correct Answer: Scaphoid", "objective": "Cram the PANCE — MSK — 31. Most Common Carpal Fracture", "section": "Cram the PANCE — MSK"}]});

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
