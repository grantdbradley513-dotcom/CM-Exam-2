<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "Pagets Disease of the Bone-Concept_Adaptive_Exam", "questions": [{"id": "1", "group": 1, "section": "Definition", "topic": "Paget's disease of the bone — definition", "skill": "Identification", "stem": "A chronic, focal disease of bone characterized by excessive and disorganized bone remodeling, historically called osteitis deformans → Diagnosis:", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Paget's disease of bone"}, {"letter": "C", "text": "Multiple myeloma"}, {"letter": "D", "text": "Metastatic prostate cancer to bone"}, {"letter": "E", "text": "Acromegaly"}], "answer": "B", "explanation": "**Osteitis deformans** is the historical name (Sir James Paget, 1876) for Paget's disease of the bone — a chronic, **focal** disorder of excessive, disorganized remodeling. Despite the name it is not inflammatory.", "objective": "", "remediation": {"steps": [{"teach": "The disease named for Sir James Paget in 1876 is a disorder of **bone remodeling**, not of bone mass alone and not inflammation.", "stem": "Which word in the historical name 'osteitis deformans' is misleading about the disease process?", "options": [{"letter": "A", "text": "'Osteitis' — the disease is not inflammatory"}, {"letter": "B", "text": "'Deformans' — the disease never deforms bone"}], "answer": "A", "explanation": "The guide stresses the disease is **not inflammatory despite the name**; it is an abnormality of remodeling from increased bone-cell activity. Deformity (bowing, skull enlargement) is very real.", "clarify": [{"teach": "The core abnormality is **excessive and disorganized remodeling** of bone.", "stem": "Is Paget's disease a disease of the whole skeleton or of specific bones?", "options": [{"letter": "A", "text": "Specific (focal) bones"}, {"letter": "B", "text": "Diffuse, whole skeleton"}], "answer": "A", "explanation": "Paget's is **focal** — monostotic or polyostotic — unlike the diffuse bone loss of osteoporosis."}]}, {"teach": "Among metabolic bone diseases, one is the **most common** (osteoporosis) and one is the **second most common**.", "stem": "Which ranking does the guide give Paget's disease among metabolic bone diseases?", "options": [{"letter": "A", "text": "Most common"}, {"letter": "B", "text": "2nd most common"}, {"letter": "C", "text": "Rarest"}], "answer": "B", "explanation": "Paget's is the **2nd most common metabolic bone disease** after osteoporosis.", "clarify": [{"stem": "Which disease is the most common metabolic bone disease?", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Paget's disease"}], "answer": "A", "explanation": "**Osteoporosis** is most common; Paget's is second."}]}], "checkpoints": [{"stem": "A textbook describes 'a focal disorder of excessive, chaotic bone remodeling at roughly 20 times the normal rate.' Which disease is being described?", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Osteitis deformans"}, {"letter": "C", "text": "Multiple myeloma"}, {"letter": "D", "text": "Acromegaly"}], "answer": "B", "explanation": "Chaotic remodeling at **~20× normal** in focal sites defines Paget's disease (**osteitis deformans**)."}]}}, {"id": "2", "group": 2, "section": "Complications", "topic": "Complications", "skill": "Complications", "multi": true, "stem": "Which of the following are recognized complications of Paget's disease of the bone?", "options": [{"letter": "A", "text": "Hearing loss / deafness"}, {"letter": "B", "text": "High-output cardiac failure"}, {"letter": "C", "text": "Osteosarcoma in pagetic bone"}, {"letter": "D", "text": "Hypercalcemia"}, {"letter": "E", "text": "Elevated parathyroid hormone"}], "answers": ["A", "B", "C"], "explanation": "Complications are **deafness (8%)**, nerve compression/spinal stenosis, **high-output cardiac failure** (rare, AV shunting in bone), **osteosarcoma (<1%)**, and secondary OA. **Calcium, phosphate, and PTH stay normal** — homeostasis is maintained.", "objective": "", "remediation": {"steps": [{"teach": "Paget's deforms the **skull and ossicles**, so one classic complication involves a special sense.", "stem": "Enlarged pagetic skull bone causes ossicle ankylosis and narrows the internal auditory meatus. Which complication results?", "options": [{"letter": "A", "text": "Hearing loss"}, {"letter": "B", "text": "Blindness"}, {"letter": "C", "text": "Loss of smell"}], "answer": "A", "explanation": "**Hearing loss (8%)** — conductive from ossicle ankylosis plus sensorineural from internal auditory meatus narrowing.", "clarify": [{"stem": "Craniofacial overgrowth in Paget's giving a 'lion face' with headaches is called:", "options": [{"letter": "A", "text": "Leontiasis ossea"}, {"letter": "B", "text": "Acromegaly"}], "answer": "A", "explanation": "**Leontiasis ossea** ('lion face') is pagetic craniofacial overgrowth."}]}, {"teach": "Pagetic bone is **highly vascular** with AV shunts, which puts a demand on the heart.", "stem": "Which type of cardiac failure is a rare complication of extensive Paget's disease?", "options": [{"letter": "A", "text": "High-output cardiac failure"}, {"letter": "B", "text": "Low-output ischemic cardiomyopathy"}, {"letter": "C", "text": "Constrictive pericarditis"}], "answer": "A", "explanation": "Increased blood flow and **AV shunts in bone** cause rare **high-output cardiac failure**.", "clarify": [{"stem": "Why does the skin over a pagetic bone feel warm?", "options": [{"letter": "A", "text": "The bone is hypervascular and hypermetabolic"}, {"letter": "B", "text": "The bone is infected"}], "answer": "A", "explanation": "Localized warmth reflects **hypervascular, hypermetabolic** bone — not fever or erythema."}]}, {"teach": "In Paget's the mineral labs are a classic 'negative' finding — remodeling is excessive but **homeostasis is maintained**.", "stem": "Which set of labs is NORMAL in Paget's disease?", "options": [{"letter": "A", "text": "Calcium, phosphate, PTH"}, {"letter": "B", "text": "Alkaline phosphatase"}, {"letter": "C", "text": "Urinary collagen-degradation markers"}], "answer": "A", "explanation": "**Calcium, phosphate, and PTH are normal**; ALP is elevated and urinary NTx/CTx may be elevated. Hypercalcemia and high PTH are therefore not complications of Paget's.", "clarify": [{"stem": "The dreaded malignant complication arising in pagetic bone (<1%) is:", "options": [{"letter": "A", "text": "Osteosarcoma"}, {"letter": "B", "text": "Multiple myeloma"}], "answer": "A", "explanation": "**Osteosarcoma** in pagetic bone is the most dreaded complication, occurring in <1%."}]}], "checkpoints": [{"stem": "Which complication of Paget's disease occurs in about 8% of patients?", "options": [{"letter": "A", "text": "Osteosarcoma"}, {"letter": "B", "text": "Deafness"}, {"letter": "C", "text": "High-output cardiac failure"}, {"letter": "D", "text": "Pathologic fracture"}], "answer": "B", "explanation": "**Deafness occurs in 8%**; osteosarcoma is <1%, fracture 6%, and high-output failure is rare."}, {"stem": "Adjacent-joint disease that develops in the hip or knee next to pagetic bone is best described as:", "options": [{"letter": "A", "text": "Secondary osteoarthritis"}, {"letter": "B", "text": "Septic arthritis"}, {"letter": "C", "text": "Gouty arthritis"}, {"letter": "D", "text": "Rheumatoid arthritis"}], "answer": "A", "explanation": "Paget's causes **secondary osteoarthritis** of adjacent joints (hip, knee), which may need joint replacement."}]}, "answer": "A,B,C"}, {"id": "3", "group": 3, "section": "Diagnosis — labs", "topic": "Diagnosis — labs", "skill": "Diagnostics & imaging", "stem": "Older man, isolated elevated alkaline phosphatase on a CMP with normal calcium, phosphate, PTH, and liver tests → Most likely diagnosis:", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Paget's disease of bone"}, {"letter": "D", "text": "Biliary obstruction"}, {"letter": "E", "text": "Multiple myeloma of the spine"}], "answer": "C", "explanation": "An **isolated elevated ALP with normal Ca/PO4/PTH** in an older adult is the exam-level signature of Paget's — ALP is secreted by overactive osteoblasts. Osteoporosis has a normal ALP.", "objective": "", "remediation": {"steps": [{"teach": "In Paget's the overactive **osteoblasts** secrete an enzyme that becomes the lab marker of disease activity.", "stem": "Which enzyme do osteoblasts secrete that serves as the lab marker in Paget's disease?", "options": [{"letter": "A", "text": "Alkaline phosphatase"}, {"letter": "B", "text": "Parathyroid hormone"}, {"letter": "C", "text": "Creatine kinase"}], "answer": "A", "explanation": "**Alkaline phosphatase** correlates with osteoblastic activity and is the marker that rises in Paget's.", "clarify": [{"stem": "Most Paget's patients are asymptomatic. How is the disease usually first detected?", "options": [{"letter": "A", "text": "Incidental isolated ↑ ALP or incidental X-ray"}, {"letter": "B", "text": "Screening bone biopsy"}], "answer": "A", "explanation": "Detection is incidental — an **isolated ↑ ALP on a CMP** or classic X-ray findings. Bone biopsy is **not routinely done**."}]}, {"teach": "The pattern of the other mineral labs separates Paget's from parathyroid and malignant bone disease.", "stem": "Which lab pattern fits Paget's disease?", "options": [{"letter": "A", "text": "↑ ALP; normal Ca, PO4, PTH"}, {"letter": "B", "text": "↑ Ca, ↑ PTH, ↓ PO4"}, {"letter": "C", "text": "Normal ALP, Ca, PO4"}], "answer": "A", "explanation": "Paget's = **↑↑ ALP with normal calcium, phosphate, and PTH**. Option B is hyperparathyroidism; option C is osteoporosis.", "clarify": [{"stem": "Which disease has a NORMAL alkaline phosphatase on the lecture comparison chart?", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Paget's disease"}], "answer": "A", "explanation": "**Osteoporosis has normal Ca, PO4, and ALP**; Paget's has ↑↑ ALP."}]}], "checkpoints": [{"stem": "An older man's total ALP is normal, yet Paget's is still suspected from his X-ray. Which lab can confirm bone-derived activity?", "options": [{"letter": "A", "text": "Serum calcium"}, {"letter": "B", "text": "Bone-specific alkaline phosphatase"}, {"letter": "C", "text": "Parathyroid hormone"}, {"letter": "D", "text": "Serum phosphate"}], "answer": "B", "explanation": "**Bone-specific ALP** can be elevated even when total ALP is normal (NEJM case 2); Ca, PO4, and PTH are normal in Paget's."}]}}, {"id": "3a", "group": 3, "section": "Treatment — pharm", "topic": "Treatment — pharm", "skill": "Pharmacology", "stem": "For symptomatic Paget's disease, the most effective and recommended first-line drug regimen → :", "options": [{"letter": "A", "text": "Oral alendronate daily"}, {"letter": "B", "text": "Zoledronate IV single dose"}, {"letter": "C", "text": "Oral prednisone taper"}, {"letter": "D", "text": "Subcutaneous teriparatide daily"}, {"letter": "E", "text": "Oral calcium plus vitamin D"}], "answer": "B", "explanation": "Bisphosphonates are the mainstay; **zoledronate (Reclast) IV single dose is most effective and recommended** (↓ ALP ~90% within 6 months, best pain response). Oral risedronate or alendronate are alternatives.", "objective": "", "remediation": {"steps": [{"teach": "Pagetic bone is driven by overactive **osteoclasts**, so the mainstay drug class blocks osteoclasts.", "stem": "Which drug class is the mainstay of Paget's treatment?", "options": [{"letter": "A", "text": "Bisphosphonates"}, {"letter": "B", "text": "Glucocorticoids"}, {"letter": "C", "text": "NSAIDs"}], "answer": "A", "explanation": "**Bisphosphonates block osteoclasts** and are the mainstay; NSAIDs/acetaminophen are only a pain bridge until they work.", "clarify": [{"stem": "What is used for pain until the bisphosphonate takes effect?", "options": [{"letter": "A", "text": "NSAIDs or acetaminophen"}, {"letter": "B", "text": "Opioids"}], "answer": "A", "explanation": "**NSAIDs / acetaminophen** bridge pain until bisphosphonates work."}]}, {"teach": "Within the bisphosphonate class, one **IV agent given once** outperforms the oral agents.", "stem": "Which bisphosphonate does the guide call most effective and recommended?", "options": [{"letter": "A", "text": "Zoledronate (Reclast)"}, {"letter": "B", "text": "Risedronate (Actonel)"}, {"letter": "C", "text": "Alendronate (Fosamax)"}], "answer": "A", "explanation": "**Zoledronate IV single dose** is most effective; risedronate and alendronate are oral alternatives.", "clarify": [{"stem": "How is zoledronate given for Paget's?", "options": [{"letter": "A", "text": "IV single dose"}, {"letter": "B", "text": "Oral weekly"}], "answer": "A", "explanation": "Zoledronate is an **IV single dose**; the oral agents are the alternatives."}]}], "checkpoints": [{"stem": "A Paget's patient cannot receive IV therapy. Which oral alternative does the guide list?", "options": [{"letter": "A", "text": "Risedronate"}, {"letter": "B", "text": "Prednisone"}, {"letter": "C", "text": "Teriparatide"}, {"letter": "D", "text": "Methotrexate"}], "answer": "A", "explanation": "Oral **risedronate (Actonel) or alendronate (Fosamax)** are the alternatives to IV zoledronate."}, {"stem": "After treatment, approximately how much does zoledronate lower ALP within 6 months?", "options": [{"letter": "A", "text": "~10%"}, {"letter": "B", "text": "~50%"}, {"letter": "C", "text": "~90%"}, {"letter": "D", "text": "It does not change ALP"}], "answer": "C", "explanation": "Zoledronate lowers ALP **~90% within 6 months** with the best pain response."}]}}, {"id": "4", "group": 4, "section": "Osteoporosis vs Paget's", "topic": "Osteoporosis vs Paget's", "skill": "Disease process", "stem": "Which feature distinguishes Paget's disease from osteoporosis on the lecture comparison chart?", "options": [{"letter": "A", "text": "Paget's is diffuse; osteoporosis is focal"}, {"letter": "B", "text": "Paget's has thickened cortex; osteoporosis has thin cortex"}, {"letter": "C", "text": "Paget's has normal ALP; osteoporosis has ↑ ALP"}, {"letter": "D", "text": "Paget's is treated with DEXA; osteoporosis with bone scan"}, {"letter": "E", "text": "Paget's is painless until fracture; osteoporosis is painful"}], "answer": "B", "explanation": "Paget's = **focal, thickened cortex and coarse trabeculae, ↑↑ ALP, bone scan**; osteoporosis = **diffuse, thin cortices, normal ALP, DEXA** and 'silent' until pathologic fracture.", "objective": "", "remediation": {"steps": [{"teach": "Osteoporosis is **loss of bone mass** with normal composition; Paget's is **excessive, chaotic remodeling** that makes enlarged but weak bone.", "stem": "Which disease produces enlarged, thickened but structurally weak bone?", "options": [{"letter": "A", "text": "Paget's disease"}, {"letter": "B", "text": "Osteoporosis"}], "answer": "A", "explanation": "**Paget's** → enlarged, misshapen, mechanically inferior bone. Osteoporosis → normal composition, just ↓ mass/density.", "clarify": [{"stem": "In osteoporosis, resorption vs formation is:", "options": [{"letter": "A", "text": "Resorption > formation"}, {"letter": "B", "text": "Both ~20× normal and chaotic"}], "answer": "A", "explanation": "Osteoporosis: **resorption > formation**; Paget's: chaotic remodeling ~20× normal."}]}, {"teach": "The two diseases are imaged differently — one by **bone density** measurement, the other by **focal activity** mapping.", "stem": "Which imaging test pairs with which disease?", "options": [{"letter": "A", "text": "DEXA → osteoporosis; bone scan → Paget's"}, {"letter": "B", "text": "Bone scan → osteoporosis; DEXA → Paget's"}, {"letter": "C", "text": "DEXA for both"}], "answer": "A", "explanation": "**DEXA** measures density for osteoporosis; **bone scan** maps focal hot spots for Paget's.", "clarify": [{"stem": "Which disease is 'silent' — painless until a pathologic fracture?", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Paget's disease"}], "answer": "A", "explanation": "**Osteoporosis is silent** until fracture; Paget's is often asymptomatic too but, when symptomatic, causes bone pain, deformity, and deafness."}]}], "checkpoints": [{"stem": "On X-ray, thin cortices and diffuse trabecular thinning with a normal ALP point to which diagnosis?", "options": [{"letter": "A", "text": "Paget's disease"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Osteosarcoma"}, {"letter": "D", "text": "Acromegaly"}], "answer": "B", "explanation": "**Thin cortices, diffuse thinning, normal ALP = osteoporosis**; Paget's shows thick cortex, coarse trabeculae, and ↑↑ ALP."}]}}, {"id": "5", "group": 5, "section": "Diagnosis — imaging", "topic": "Diagnosis — imaging", "skill": "Diagnostics & imaging", "multi": true, "stem": "Which of the following are classic plain-film findings of Paget's disease of the bone?", "options": [{"letter": "A", "text": "Thickened cortical bone"}, {"letter": "B", "text": "Coarsened, thickened trabeculae"}, {"letter": "C", "text": "'Cotton wool' calvarium"}, {"letter": "D", "text": "Diffuse trabecular thinning"}, {"letter": "E", "text": "Purely lytic punched-out lesions"}], "answers": ["A", "B", "C"], "explanation": "Paget's films show **mixed osteosclerotic and osteolytic lesions, thickened cortex, coarsened trabeculae**, a **'cotton wool' skull**, and bowed femur with thick cortex. Diffuse thinning is osteoporosis; purely lytic lesions suggest multiple myeloma.", "objective": "", "remediation": {"steps": [{"teach": "Pagetic bone is **enlarged**, so its cortex and trabeculae look bigger than normal bone — compare with the contralateral bone.", "stem": "Compared with the contralateral bone, the cortex of a pagetic femur appears:", "options": [{"letter": "A", "text": "Thickened"}, {"letter": "B", "text": "Thinned"}, {"letter": "C", "text": "Unchanged"}], "answer": "A", "explanation": "Paget's produces a **thickened cortex** and **coarse trabeculae**; the guide advises comparing cortical thickness with the contralateral bone.", "clarify": [{"stem": "Thin cortices and diffuse trabecular thinning describe which disease instead?", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Paget's disease"}], "answer": "A", "explanation": "**Diffuse thinning = osteoporosis**, the look-alike that makes option D wrong."}]}, {"teach": "The pagetic skull (involved in 29–65%) has a characteristic mixed lytic/blastic, thickened appearance.", "stem": "The mixed lytic/blastic thickened calvarium of skull Paget's is described as:", "options": [{"letter": "A", "text": "'Cotton wool' appearance"}, {"letter": "B", "text": "'Punched-out' lesions"}, {"letter": "C", "text": "'Salt-and-pepper' skull"}], "answer": "A", "explanation": "**'Cotton wool'** calvarium with skull-base sclerosis is the Paget's skull.", "clarify": [{"stem": "Are pagetic lesions purely lytic, purely sclerotic, or mixed?", "options": [{"letter": "A", "text": "Mixed sclerotic and lytic"}, {"letter": "B", "text": "Purely lytic"}], "answer": "A", "explanation": "Paget's shows **both osteosclerotic and osteolytic** lesions; purely lytic disease is multiple myeloma."}]}, {"teach": "Purely lytic bone disease belongs to a different diagnosis that is imaged differently.", "stem": "Which disease is purely lytic and is worked up with skeletal survey or low-dose CT instead of bone scan?", "options": [{"letter": "A", "text": "Multiple myeloma"}, {"letter": "B", "text": "Paget's disease"}, {"letter": "C", "text": "Osteoporosis"}], "answer": "A", "explanation": "**Multiple myeloma** is purely lytic — bone scan is not used; skeletal survey/low-dose CT is. This is why 'purely lytic punched-out lesions' is not a Paget's finding.", "clarify": [{"stem": "A bowed femur with a thick cortex on X-ray suggests:", "options": [{"letter": "A", "text": "Paget's of long bone"}, {"letter": "B", "text": "Osteoporotic femur"}], "answer": "A", "explanation": "**Bowed femur with thick cortex** is classic Paget's of the long bone."}]}], "checkpoints": [{"stem": "A pelvic X-ray shows enlargement of one hemipelvis with coarse trabeculation and mixed lytic/sclerotic change. Which diagnosis fits?", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Paget's disease"}, {"letter": "C", "text": "Multiple myeloma"}, {"letter": "D", "text": "Acromegaly"}], "answer": "B", "explanation": "**Pelvis enlargement with coarse trabeculation** and mixed lytic/sclerotic change is Paget's — the pelvis is its most common site."}]}, "answer": "A,B,C"}, {"id": "6", "group": 6, "section": "Pathophysiology", "topic": "Pathophysiology", "skill": "Disease process", "stem": "Most common skeletal site of involvement in Paget's disease of the bone → :", "options": [{"letter": "A", "text": "Skull"}, {"letter": "B", "text": "Vertebrae"}, {"letter": "C", "text": "Pelvis"}, {"letter": "D", "text": "Femur"}, {"letter": "E", "text": "Tibia"}], "answer": "C", "explanation": "The **pelvis is the most common site**, followed by skull, spine, and long bones of the legs (femur/tibia). Disease is polyostotic in 60–70%.", "objective": "", "remediation": {"steps": [{"teach": "Paget's is **focal** — it involves one bone (monostotic) or several (polyostotic) rather than the whole skeleton.", "stem": "What proportion of Paget's disease is polyostotic?", "options": [{"letter": "A", "text": "60–70%"}, {"letter": "B", "text": "10–20%"}, {"letter": "C", "text": "Nearly 100%"}], "answer": "A", "explanation": "**Polyostotic disease occurs in 60–70%**; the rest is monostotic.", "clarify": [{"stem": "Which term means a single bone is involved?", "options": [{"letter": "A", "text": "Monostotic"}, {"letter": "B", "text": "Polyostotic"}], "answer": "A", "explanation": "**Monostotic** = one bone; polyostotic = several."}]}, {"teach": "The guide ranks the common sites: a large flat bone of the hip girdle first, then the calvarium, spine, and legs.", "stem": "After the most common site, which bones follow in frequency?", "options": [{"letter": "A", "text": "Skull, spine, femur/tibia"}, {"letter": "B", "text": "Hands, feet, jaw"}, {"letter": "C", "text": "Ribs, clavicle, scapula"}], "answer": "A", "explanation": "Order: pelvis → **skull, spine, femur/tibia**. Hands, feet, and jaw enlargement is acromegaly.", "clarify": [{"stem": "Skull involvement occurs in roughly what share of Paget's patients?", "options": [{"letter": "A", "text": "29–65%"}, {"letter": "B", "text": "<1%"}], "answer": "A", "explanation": "The skull is involved in **29–65%**, producing the cotton-wool calvarium."}]}], "checkpoints": [{"stem": "Which pattern of skeletal distribution is typical of Paget's disease?", "options": [{"letter": "A", "text": "Diffuse involvement of the entire skeleton"}, {"letter": "B", "text": "Focal, often polyostotic involvement"}, {"letter": "C", "text": "Symmetric small joints of the hands"}, {"letter": "D", "text": "Isolated to the hands, feet, and jaw"}], "answer": "B", "explanation": "Paget's is **focal, monostotic or polyostotic (60–70%)**, favoring pelvis, skull, spine, and legs."}]}}, {"id": "7", "group": 7, "section": "Differential diagnosis", "topic": "Differential diagnosis", "skill": "Identification", "stem": "Increasing hat size together with enlargement of the hands, feet, and jaw and an elevated IGF-1 → Diagnosis:", "options": [{"letter": "A", "text": "Skull Paget's disease"}, {"letter": "B", "text": "Acromegaly"}, {"letter": "C", "text": "Leontiasis ossea"}, {"letter": "D", "text": "Metastatic prostate cancer"}, {"letter": "E", "text": "Osteoporosis"}], "answer": "B", "explanation": "**Acromegaly** also enlarges the skull but adds **hands, feet, jaw, and ↑ IGF-1**. Skull Paget's enlarges the frontal bone (↑ hat size) with a cotton-wool calvarium, hearing loss, and headaches.", "objective": "", "remediation": {"steps": [{"teach": "Two diseases on the guide's differential enlarge the **skull and hat size**; the extra sites and the lab separate them.", "stem": "Which disease enlarges the skull AND the hands, feet, and jaw?", "options": [{"letter": "A", "text": "Acromegaly"}, {"letter": "B", "text": "Paget's disease"}, {"letter": "C", "text": "Osteoporosis"}], "answer": "A", "explanation": "**Acromegaly** enlarges hands, feet, and jaw in addition to the skull; Paget's enlarges focal bones like the frontal bone.", "clarify": [{"stem": "Which lab is elevated in acromegaly and helps separate it from Paget's?", "options": [{"letter": "A", "text": "IGF-1"}, {"letter": "B", "text": "Alkaline phosphatase"}], "answer": "A", "explanation": "**↑ IGF-1** marks acromegaly; ↑ ALP marks Paget's."}]}, {"teach": "Besides acromegaly and osteoporosis, the guide's differential includes **joint disease** and **malignancy**.", "stem": "Which malignancy does the guide name as a Paget's mimic in the pelvis and lumbar spine?", "options": [{"letter": "A", "text": "Metastatic prostate cancer"}, {"letter": "B", "text": "Osteosarcoma"}, {"letter": "C", "text": "Multiple myeloma"}], "answer": "A", "explanation": "**Metastatic prostate cancer to pelvis/L-spine** is the named bone malignancy on the differential; osteosarcoma is a complication arising in pagetic bone.", "clarify": [{"stem": "Osteoarthritis appears on the Paget's differential because:", "options": [{"letter": "A", "text": "Paget's causes secondary OA and primary OA coexists"}, {"letter": "B", "text": "OA raises alkaline phosphatase"}], "answer": "A", "explanation": "**Paget's causes secondary OA** of adjacent joints, and primary OA often coexists in older patients."}]}], "checkpoints": [{"stem": "Increasing hat size with new hearing loss and headaches, but normal hands and feet and a normal IGF-1, points to:", "options": [{"letter": "A", "text": "Acromegaly"}, {"letter": "B", "text": "Skull Paget's disease"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Multiple myeloma"}], "answer": "B", "explanation": "Hat size ↑ + **hearing loss + headaches** without acral enlargement = **skull Paget's** (cotton-wool calvarium)."}]}}, {"id": "8", "group": 8, "section": "Treatment — pharm", "topic": "Treatment — pharm", "skill": "Management", "stem": "How is treatment success monitored in Paget's disease after starting a bisphosphonate?", "options": [{"letter": "A", "text": "Repeat DEXA scan every 2 years"}, {"letter": "B", "text": "Less bone pain and falling serial ALP"}, {"letter": "C", "text": "Normalization of serum calcium"}, {"letter": "D", "text": "Repeat bone biopsy at 6 months"}, {"letter": "E", "text": "Resolution of all hot spots on repeat bone scan"}], "answer": "B", "explanation": "Monitor **improvement in bone pain and serial ALP** — falling ALP means the drug is working. Symptom-directed treatment is preferred over treat-to-target ALP normalization. Calcium is already normal; biopsy is never routine.", "objective": "", "remediation": {"steps": [{"teach": "The lab that rises with disease activity is also the lab that **falls when treatment works**.", "stem": "Which lab trend indicates the bisphosphonate is working?", "options": [{"letter": "A", "text": "Falling alkaline phosphatase"}, {"letter": "B", "text": "Rising calcium"}, {"letter": "C", "text": "Falling PTH"}], "answer": "A", "explanation": "**Falling ALP = working**; calcium and PTH are normal before and after treatment.", "clarify": [{"stem": "Does the guide prefer treating to a target normal ALP or treating symptoms?", "options": [{"letter": "A", "text": "Symptom-directed treatment"}, {"letter": "B", "text": "Treat-to-target ALP normalization"}], "answer": "A", "explanation": "**Symptom-directed treatment is preferred** over treat-to-target ALP normalization."}]}, {"teach": "Alongside the lab, the clinical marker of success is the patient's main symptom.", "stem": "Which clinical change confirms treatment response?", "options": [{"letter": "A", "text": "Less bone pain"}, {"letter": "B", "text": "Decreased hat size"}, {"letter": "C", "text": "Return of hearing"}], "answer": "A", "explanation": "**Improvement in bone pain** plus falling ALP = treatment is working.", "clarify": [{"stem": "What is the stated goal of Paget's treatment, given that there is no cure?", "options": [{"letter": "A", "text": "Relieve symptoms and normalize remodeling to prevent complications"}, {"letter": "B", "text": "Restore bone to its original shape"}], "answer": "A", "explanation": "**No cure**; the goal is symptom relief and normalized remodeling to prevent complications."}]}], "checkpoints": [{"stem": "Years after a single zoledronate dose, a Paget's patient's ALP rises again and the bone scan shows active sites. What does the guide recommend?", "options": [{"letter": "A", "text": "Switch to a glucocorticoid"}, {"letter": "B", "text": "Re-treat with zoledronate"}, {"letter": "C", "text": "Bone biopsy"}, {"letter": "D", "text": "Observe without treatment"}], "answer": "B", "explanation": "**Re-treatment every 5–10 years with zoledronate** if biochemically active or active on bone scan, or for pain, progressive deformity/arthritis, or before surgery."}]}}, {"id": "9", "group": 9, "section": "Epidemiology", "topic": "Epidemiology", "skill": "Disease process", "multi": true, "stem": "Which of the following statements about the epidemiology of Paget's disease of the bone are correct?", "options": [{"letter": "A", "text": "Men are affected more than women (3:2)"}, {"letter": "B", "text": "Most common in people of European descent"}, {"letter": "C", "text": "Rare in people under age 40"}, {"letter": "D", "text": "The most common metabolic bone disease"}, {"letter": "E", "text": "Prevalence and severity are increasing"}], "answers": ["A", "B", "C"], "explanation": "Paget's affects **older adults (>55, 1–2%), M>F 3:2, European descent**, and is rare under 40; incidence nearly doubles each decade after 50. It is the **2nd** most common metabolic bone disease and its **prevalence and severity are decreasing**.", "objective": "", "remediation": {"steps": [{"teach": "Paget's is a disease of **advanced age** with a male predominance and a geographic/ancestral pattern.", "stem": "Which sex ratio does the guide give for Paget's disease?", "options": [{"letter": "A", "text": "M > F, 3:2"}, {"letter": "B", "text": "F > M, 3:1"}, {"letter": "C", "text": "Equal"}], "answer": "A", "explanation": "**M > F (3:2)** — unlike post-menopausal osteoporosis, which favors women.", "clarify": [{"stem": "Which ancestry is most commonly affected?", "options": [{"letter": "A", "text": "European descent"}, {"letter": "B", "text": "East Asian descent"}], "answer": "A", "explanation": "Paget's is most common in people of **European descent**."}]}, {"teach": "Age is the strongest epidemiologic feature — think of a **cutoff age** and a **rising incidence with each decade**.", "stem": "About what percentage of the US population over 55 has Paget's disease?", "options": [{"letter": "A", "text": "1–2%"}, {"letter": "B", "text": "10–15%"}, {"letter": "C", "text": "<0.01%"}], "answer": "A", "explanation": "**~1–2% of those >55**; rare under 40; incidence nearly doubles each decade after 50.", "clarify": [{"stem": "Is Paget's common in adults under 40?", "options": [{"letter": "A", "text": "No — rare under 40"}, {"letter": "B", "text": "Yes — peaks in the 30s"}], "answer": "A", "explanation": "Paget's is **rare under 40**."}]}, {"teach": "Two of the options were wrong because they describe **osteoporosis** or the **opposite trend**.", "stem": "What has happened to the prevalence and severity of Paget's disease over recent decades?", "options": [{"letter": "A", "text": "Decreasing"}, {"letter": "B", "text": "Increasing"}, {"letter": "C", "text": "Unchanged"}], "answer": "A", "explanation": "**Prevalence and severity are decreasing**; and Paget's is the 2nd most common metabolic bone disease, not the most common (that is osteoporosis).", "clarify": [{"stem": "Which disease is the MOST common metabolic bone disease?", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Paget's disease"}], "answer": "A", "explanation": "**Osteoporosis** is most common; Paget's is second."}]}], "checkpoints": [{"stem": "The guide notes Paget's incidence changes with age in which way?", "options": [{"letter": "A", "text": "Peaks in adolescence"}, {"letter": "B", "text": "Nearly doubles each decade after 50"}, {"letter": "C", "text": "Falls after age 60"}, {"letter": "D", "text": "Is constant across adult life"}], "answer": "B", "explanation": "Incidence **nearly doubles each decade after 50**."}]}, "answer": "A,B,C"}, {"id": "10", "group": 10, "section": "Complications", "topic": "Complications", "skill": "Complications", "stem": "New severe pain and swelling in a bone known to be affected by Paget's disease → Must rule out:", "options": [{"letter": "A", "text": "Osteomyelitis"}, {"letter": "B", "text": "Osteosarcoma"}, {"letter": "C", "text": "Gout flare"}, {"letter": "D", "text": "Secondary osteoarthritis"}, {"letter": "E", "text": "Multiple myeloma"}], "answer": "B", "explanation": "**Osteosarcoma in pagetic bone** is the most dreaded complication (<1%); new severe pain or swelling in a known pagetic bone demands that it be ruled out.", "objective": "", "remediation": {"steps": [{"teach": "Pagetic bone pain is usually **deep, aching, chronic, and worse with weight-bearing**; a sudden change in character is a red flag.", "stem": "What does a sudden change to severe pain with swelling in a pagetic bone signal?", "options": [{"letter": "A", "text": "Possible malignant transformation"}, {"letter": "B", "text": "Expected disease behavior"}, {"letter": "C", "text": "Successful treatment"}], "answer": "A", "explanation": "A change to **severe pain/swelling** should prompt a search for **malignant transformation**.", "clarify": [{"stem": "Typical pagetic bone pain is described as:", "options": [{"letter": "A", "text": "Deep, aching, day and night, worse with weight-bearing"}, {"letter": "B", "text": "Sharp, brief, only at night"}], "answer": "A", "explanation": "Bone pain (75% of symptomatic patients) is **deep, aching, day and night, worse with weight-bearing**."}]}, {"teach": "The malignancy that arises **within pagetic bone** is a primary bone sarcoma, not a marrow or metastatic cancer.", "stem": "Which malignancy arises in pagetic bone?", "options": [{"letter": "A", "text": "Osteosarcoma"}, {"letter": "B", "text": "Multiple myeloma"}, {"letter": "C", "text": "Metastatic prostate cancer"}], "answer": "A", "explanation": "**Osteosarcoma** is the dreaded complication (<1%). Myeloma and prostate metastases are differential diagnoses, not complications.", "clarify": [{"stem": "How common is osteosarcoma in Paget's disease?", "options": [{"letter": "A", "text": "<1%"}, {"letter": "B", "text": "About 8%"}], "answer": "A", "explanation": "**<1%** — rare but the most feared; 8% is the rate of deafness."}]}], "checkpoints": [{"stem": "Which Paget's complication is described by the guide as 'the most dreaded'?", "options": [{"letter": "A", "text": "Deafness"}, {"letter": "B", "text": "Secondary osteoarthritis"}, {"letter": "C", "text": "Malignant transformation to osteosarcoma"}, {"letter": "D", "text": "Spinal stenosis"}], "answer": "C", "explanation": "**Osteosarcoma in pagetic bone** is the most dreaded complication."}]}}, {"id": "11", "group": 11, "section": "Diagnosis — labs", "topic": "Diagnosis — labs", "skill": "Diagnostics & imaging", "stem": "Elevated total alkaline phosphatase, but unclear whether the source is bone or liver → Best next lab:", "options": [{"letter": "A", "text": "Serum calcium"}, {"letter": "B", "text": "Bone-specific alkaline phosphatase"}, {"letter": "C", "text": "Parathyroid hormone"}, {"letter": "D", "text": "Urinary deoxypyridinoline (collagen marker)"}, {"letter": "E", "text": "Serum phosphate"}], "answer": "B", "explanation": "Use **bone-specific ALP** (or GGT to exclude a liver source) when liver, biliary, intestinal, or placental ALP is possible. Urinary collagen markers (NTx, CTx, deoxypyridinoline) may be ↑ but are **not routine**.", "objective": "", "remediation": {"steps": [{"teach": "Total ALP comes from several tissues; an **isoenzyme** test isolates the bone fraction.", "stem": "Which tissues besides bone can raise total alkaline phosphatase?", "options": [{"letter": "A", "text": "Liver, biliary tract, intestine, placenta"}, {"letter": "B", "text": "Kidney and lung only"}, {"letter": "C", "text": "Skeletal muscle"}], "answer": "A", "explanation": "ALP may come from **liver/biliary/intestinal/placental** sources — hence the need for bone-specific ALP.", "clarify": [{"stem": "Which liver enzyme can be used instead to exclude a hepatic source of ALP?", "options": [{"letter": "A", "text": "GGT"}, {"letter": "B", "text": "PTH"}], "answer": "A", "explanation": "**GGT** excludes a liver source; PTH is a parathyroid hormone, normal in Paget's."}]}, {"teach": "The guide warns that total ALP can be **normal** while the bone fraction is elevated.", "stem": "In the NEJM case the guide cites, what was the lab pattern?", "options": [{"letter": "A", "text": "Normal total ALP, elevated bone-specific ALP"}, {"letter": "B", "text": "Elevated calcium, normal ALP"}, {"letter": "C", "text": "Elevated PTH, low phosphate"}], "answer": "A", "explanation": "**ALP can be normal with bone-specific ALP elevated** (NEJM case 2).", "clarify": [{"stem": "Are urinary collagen-degradation markers (NTx, CTx) part of the routine Paget's workup?", "options": [{"letter": "A", "text": "No — may be elevated but not routine"}, {"letter": "B", "text": "Yes — required for diagnosis"}], "answer": "A", "explanation": "Urinary markers may be ↑ but are **not routine**; nor is bone biopsy."}]}], "checkpoints": [{"stem": "Which diagnostic procedure does the guide say is NOT routinely done to confirm Paget's disease?", "options": [{"letter": "A", "text": "Plain films of the affected area"}, {"letter": "B", "text": "Tc-99m MDP bone scan"}, {"letter": "C", "text": "Bone biopsy"}, {"letter": "D", "text": "Serum alkaline phosphatase"}], "answer": "C", "explanation": "**Bone biopsy is not routinely done**; diagnosis rests on ALP, plain films, and bone scan."}]}}, {"id": "12", "group": 12, "section": "Treatment — pharm", "topic": "Treatment — pharm", "skill": "Management", "multi": true, "stem": "Which of the following are indications to treat Paget's disease with a bisphosphonate?", "options": [{"letter": "A", "text": "Bone pain from active disease"}, {"letter": "B", "text": "Nerve compression"}, {"letter": "C", "text": "Lytic lesions"}, {"letter": "D", "text": "Planned elective surgery on pagetic bone"}, {"letter": "E", "text": "Every asymptomatic incidental ↑ ALP"}], "answers": ["A", "B", "C", "D"], "explanation": "Treat **active/symptomatic disease — bone pain, nerve compression, lytic lesions** — and give a bisphosphonate **~3 months before surgery** on pagetic bone to limit bleeding. **Not every asymptomatic case** is treated.", "objective": "", "remediation": {"steps": [{"teach": "The guide draws a line between **active/symptomatic** disease, which is treated, and silent incidental disease, which may not be.", "stem": "Which Paget's patient does the guide say does NOT automatically need bisphosphonate treatment?", "options": [{"letter": "A", "text": "Asymptomatic patient with incidental ↑ ALP"}, {"letter": "B", "text": "Patient with bone pain"}, {"letter": "C", "text": "Patient with nerve compression"}], "answer": "A", "explanation": "Treat **active/symptomatic** disease, **not every asymptomatic case**.", "clarify": [{"stem": "Is there a cure for Paget's disease?", "options": [{"letter": "A", "text": "No — treatment relieves symptoms and normalizes remodeling"}, {"letter": "B", "text": "Yes — a single zoledronate dose is curative"}], "answer": "A", "explanation": "**No cure**; the goal is symptom relief and preventing complications."}]}, {"teach": "Three features define **active** disease that warrants treatment: a symptom, a neurologic consequence, and an X-ray pattern.", "stem": "Which X-ray finding is listed as an indication to treat?", "options": [{"letter": "A", "text": "Lytic lesions"}, {"letter": "B", "text": "Healed sclerotic lesions"}, {"letter": "C", "text": "Normal bone density"}], "answer": "A", "explanation": "**Lytic lesions** indicate active disease; bone pain and nerve compression are the other listed indications.", "clarify": [{"stem": "Nerve compression in Paget's (carpal tunnel, radiculopathy, spinal stenosis) is caused by:", "options": [{"letter": "A", "text": "Enlarged pagetic bone pressing on nerves"}, {"letter": "B", "text": "Autoimmune inflammation of nerves"}], "answer": "A", "explanation": "**Enlarged bone compresses nerves** — an indication for treatment."}]}, {"teach": "Pagetic bone is **highly vascular**, which matters when a surgeon is about to cut it.", "stem": "Why is a bisphosphonate given before elective surgery on pagetic bone?", "options": [{"letter": "A", "text": "To reduce intra-operative blood loss"}, {"letter": "B", "text": "To prevent surgical infection"}, {"letter": "C", "text": "To shrink the bone to normal size"}], "answer": "A", "explanation": "**Pagetic bone bleeds**; a bisphosphonate ~3 months pre-op reduces blood loss — hence surgery is an indication.", "clarify": [{"stem": "How far before surgery should the bisphosphonate be given?", "options": [{"letter": "A", "text": "About 3 months"}, {"letter": "B", "text": "The morning of surgery"}], "answer": "A", "explanation": "**~3 months pre-op** to reduce bleeding."}]}], "checkpoints": [{"stem": "Which of the following is a reason listed by the guide for RE-treatment with zoledronate?", "options": [{"letter": "A", "text": "Progressive deformity or arthritis"}, {"letter": "B", "text": "Normal ALP on routine labs"}, {"letter": "C", "text": "Stable asymptomatic disease"}, {"letter": "D", "text": "A normal bone scan"}], "answer": "A", "explanation": "Re-treat q5–10 yr if biochemically active or active on bone scan, or for **pain, progressive deformity/arthritis, or before surgery**."}]}, "answer": "A,B,C,D"}, {"id": "13", "group": 13, "section": "Pathophysiology", "topic": "Pathophysiology", "skill": "Disease process", "stem": "The primary abnormality in Paget's disease of the bone → :", "options": [{"letter": "A", "text": "Autoimmune destruction of osteoblasts"}, {"letter": "B", "text": "Excessive bone remodeling (~20× normal)"}, {"letter": "C", "text": "Defective mineralization of osteoid"}, {"letter": "D", "text": "Decreased bone mass with normal composition"}, {"letter": "E", "text": "Monoclonal plasma-cell proliferation in marrow"}], "answer": "B", "explanation": "Paget's = **excessive remodeling ~20× normal**: ↑ osteoclastic resorption by enormous multinucleated osteoclasts → ↑ osteoblastic formation of disorganized, structurally poor bone. Decreased mass with normal composition is osteoporosis.", "objective": "", "remediation": {"steps": [{"teach": "The cycle starts with one bone cell type **resorbing** bone and ends with another **laying down** chaotic bone.", "stem": "Which cell initiates the pagetic remodeling cycle?", "options": [{"letter": "A", "text": "Enormous multinucleated osteoclasts"}, {"letter": "B", "text": "Plasma cells"}, {"letter": "C", "text": "Chondrocytes"}], "answer": "A", "explanation": "**Enormous multinucleated osteoclasts** drive ↑ resorption, followed by ↑ osteoblastic formation of haphazard bone.", "clarify": [{"stem": "The bone that osteoblasts lay down in Paget's is:", "options": [{"letter": "A", "text": "Disorganized, haphazard, structurally poor"}, {"letter": "B", "text": "Normal lamellar bone, just more of it"}], "answer": "A", "explanation": "Pagetic bone is **disorganized and structurally poor** — enlarged, misshapen, mechanically inferior, highly vascular."}]}, {"teach": "The cause is unknown, but the guide names a possible **viral trigger** and a **genetic** contribution.", "stem": "Which virus is the proposed trigger for Paget's disease?", "options": [{"letter": "A", "text": "Measles"}, {"letter": "B", "text": "Epstein–Barr virus"}, {"letter": "C", "text": "Hepatitis B"}], "answer": "A", "explanation": "Possible **measles trigger** plus genetic predisposition; **familial in 15–30%**.", "clarify": [{"stem": "What proportion of Paget's cases are familial?", "options": [{"letter": "A", "text": "15–30%"}, {"letter": "B", "text": "<1%"}], "answer": "A", "explanation": "**Familial in 15–30%** — a genetic predisposition."}]}], "checkpoints": [{"stem": "Which end result of pagetic remodeling explains bowing of the legs and pathologic fractures?", "options": [{"letter": "A", "text": "Enlarged but mechanically inferior bone"}, {"letter": "B", "text": "Dense, stronger-than-normal bone"}, {"letter": "C", "text": "Thin, demineralized bone"}, {"letter": "D", "text": "Replacement of bone by plasma cells"}], "answer": "A", "explanation": "Chaotic remodeling yields **enlarged, misshapen, mechanically inferior, highly vascular bone** → bowing, fractures, nerve entrapment."}]}}, {"id": "14", "group": 14, "section": "Complications", "topic": "Complications", "skill": "Complications", "stem": "Neurogenic claudication relieved by forward flexion (the 'shopping-cart sign') in a Paget's patient → Underlying complication:", "options": [{"letter": "A", "text": "Carpal tunnel syndrome"}, {"letter": "B", "text": "Spinal stenosis from bony overgrowth"}, {"letter": "C", "text": "High-output cardiac failure"}, {"letter": "D", "text": "Secondary osteoarthritis of the hip joint"}, {"letter": "E", "text": "Vertebral osteosarcoma"}], "answer": "B", "explanation": "Enlarged pagetic vertebrae cause **spinal stenosis** — neurogenic claudication **relieved by flexion/shopping-cart sign**. Other nerve compressions include carpal tunnel and lumbosacral radiculopathy.", "objective": "", "remediation": {"steps": [{"teach": "Pagetic bone **enlarges**, and enlarged bone in a confined canal compresses the structures passing through it.", "stem": "Which nerve-compression syndromes does the guide list for Paget's disease?", "options": [{"letter": "A", "text": "Carpal tunnel, lumbosacral radiculopathy, spinal stenosis"}, {"letter": "B", "text": "Bell's palsy and trigeminal neuralgia"}, {"letter": "C", "text": "Guillain–Barré syndrome"}], "answer": "A", "explanation": "Enlarged bone causes **carpal tunnel, lumbosacral radiculopathy, and spinal stenosis**.", "clarify": [{"stem": "Neurogenic claudication from spinal stenosis is classically relieved by:", "options": [{"letter": "A", "text": "Forward flexion (leaning on a shopping cart)"}, {"letter": "B", "text": "Standing upright and extending the back"}], "answer": "A", "explanation": "**Relieved by flexion** — the shopping-cart sign."}]}, {"teach": "Spinal involvement also contributes to a visible **deformity** and a type of **fracture**.", "stem": "Which spinal findings does the guide attribute to Paget's?", "options": [{"letter": "A", "text": "Kyphosis and vertebral compression fractures"}, {"letter": "B", "text": "Scoliosis from leg-length discrepancy only"}, {"letter": "C", "text": "Sacroiliitis with bamboo spine"}], "answer": "A", "explanation": "Skeletal deformities (18%) include **kyphosis**; pathologic fractures (6%) include **vertebral compression**.", "clarify": [{"stem": "What fraction of symptomatic Paget's patients have pathologic fractures?", "options": [{"letter": "A", "text": "6%"}, {"letter": "B", "text": "75%"}], "answer": "A", "explanation": "**Fracture 6%**; bone pain 75%; deformity 18%."}]}], "checkpoints": [{"stem": "A Paget's patient has hand numbness and tingling in the median nerve distribution. Which mechanism explains it?", "options": [{"letter": "A", "text": "Enlarged bone compressing the nerve (carpal tunnel)"}, {"letter": "B", "text": "AV shunting in bone"}, {"letter": "C", "text": "Ossicle ankylosis"}, {"letter": "D", "text": "Hypercalcemia"}], "answer": "A", "explanation": "**Nerve compression by enlarged bone** — carpal tunnel is one of the listed entrapments."}]}}, {"id": "15", "group": 15, "section": "Treatment — surgical", "topic": "Treatment — surgical", "skill": "Management", "stem": "Paget's patient scheduled for total hip replacement for secondary osteoarthritis → Pre-operative step to limit blood loss:", "options": [{"letter": "A", "text": "Transfuse two units of blood the day before"}, {"letter": "B", "text": "Bisphosphonate about 3 months pre-op"}, {"letter": "C", "text": "High-dose NSAIDs the week before"}, {"letter": "D", "text": "Repeat bone scan the morning of surgery"}, {"letter": "E", "text": "Start calcium and vitamin D supplements"}], "answer": "B", "explanation": "**Pagetic bone bleeds** (hypervascular) — give a **bisphosphonate ~3 months pre-op** to reduce blood loss. Total hip/knee replacement is for secondary OA failing medical therapy.", "objective": "", "remediation": {"steps": [{"teach": "The surgical concern in Paget's follows directly from the bone's **vascularity**.", "stem": "Why does surgery on pagetic bone carry extra risk?", "options": [{"letter": "A", "text": "The bone is hypervascular and bleeds"}, {"letter": "B", "text": "The bone is too dense to cut"}, {"letter": "C", "text": "The bone is infected"}], "answer": "A", "explanation": "**Pagetic bone bleeds** — highly vascular, hypermetabolic bone.", "clarify": [{"stem": "Which drug class reduces pagetic bone activity and therefore bleeding before surgery?", "options": [{"letter": "A", "text": "Bisphosphonates"}, {"letter": "B", "text": "NSAIDs"}], "answer": "A", "explanation": "A **bisphosphonate** given ~3 months pre-op limits blood loss."}]}, {"teach": "Surgery is reserved for structural problems the drugs cannot fix.", "stem": "Which are the surgical indications the guide lists for Paget's disease?", "options": [{"letter": "A", "text": "Deformity, pathologic fracture, secondary OA failing medical therapy"}, {"letter": "B", "text": "Any elevated ALP"}, {"letter": "C", "text": "Asymptomatic hot spots on bone scan"}], "answer": "A", "explanation": "Surgery for **deformity and pathologic fracture**; **total hip/knee replacement** for secondary OA failing medical therapy.", "clarify": [{"stem": "Joint replacement in Paget's is done for which joint problem?", "options": [{"letter": "A", "text": "Secondary osteoarthritis of hip/knee"}, {"letter": "B", "text": "Septic arthritis"}], "answer": "A", "explanation": "**Secondary OA** of adjacent hip/knee failing medical therapy."}]}], "checkpoints": [{"stem": "Which non-surgical referral does the guide suggest for difficult Paget's disease?", "options": [{"letter": "A", "text": "Rheumatology or endocrinology"}, {"letter": "B", "text": "Dermatology"}, {"letter": "C", "text": "Gastroenterology"}, {"letter": "D", "text": "Psychiatry"}], "answer": "A", "explanation": "Refer to **rheumatology/endocrinology** if needed."}]}}, {"id": "16", "group": 16, "section": "Diagnosis — imaging", "topic": "Diagnosis — imaging", "skill": "Diagnostics & imaging", "stem": "Primary purpose of the Tc-99m MDP bone scan recommended for all Paget's patients at diagnosis → :", "options": [{"letter": "A", "text": "Confirm the diagnosis with a disease-specific pattern"}, {"letter": "B", "text": "Define extent and distribution of disease"}, {"letter": "C", "text": "Measure bone mineral density"}, {"letter": "D", "text": "Exclude multiple myeloma"}, {"letter": "E", "text": "Replace plain films of the affected bone"}], "answer": "B", "explanation": "Bone scan defines **extent and distribution** — picks up asymptomatic sites as **'hot spots'**. It is **highly sensitive but not specific** (also fracture, osteomyelitis, metastases) and is not used for purely lytic myeloma.", "objective": "", "remediation": {"steps": [{"teach": "Plain films show the **affected bone**; the bone scan answers a different question about the **whole skeleton**.", "stem": "What does the bone scan add that plain (function () {
  const questions = EXAM_DATA.questions;

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }

  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };
  // Select-all-that-apply support: q.multi === true, q.answers = ['A','C'] (q.answer mirrors the joined key for audits).

  const chosenLetters = q => { const a = answers[q.id]; return a === undefined ? [] : (isMulti(q) ? String(a).split(',').filter(Boolean).sort() : [a]); };
  const isRight = q => { const c = chosenLetters(q), k = keyLetters(q); return c.length === k.length && c.every((x, i) => x === k[i]); };

  const pendingSel = {};   // multi questions: letters ticked but not yet checked

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;

    return false;
  }

  function finishSteps(q, t) {

  function pushCheckpoint(q, t) {

    node.chosen = letter;

    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }

        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
