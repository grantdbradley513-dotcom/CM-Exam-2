<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }

l hypothyroidism — AACE", "topic": "Subclinical thyroid disease", "skill": "Management", "stem": "TSH 5–10, free T4 normal → AACE treats if also present:", "options": [{"letter": "A", "text": "Positive TSI antibodies"}, {"letter": "B", "text": "ESR above 50 mm/h"}, {"letter": "C", "text": "Positive anti-TPO or goiter"}, {"letter": "D", "text": "Low RAIU uptake"}], "answer": "C", "explanation": "TSH **5–10 with positive anti-TPO antibodies or goiter** has the highest progression to overt hypothyroidism → treat.", "objective": "", "remediation": {"steps": [{"teach": "The add-on findings that tip toward treatment are signs of **Hashimoto's autoimmunity** or gland enlargement.", "stem": "Antibody that marks Hashimoto's →", "options": [{"letter": "A", "text": "TSI"}, {"letter": "B", "text": "Anti-TPO"}, {"letter": "C", "text": "None"}], "answer": "B", "explanation": "**Anti-TPO** marks Hashimoto's.", "clarify": [{"stem": "TSI antibodies point to →", "options": [{"letter": "A", "text": "Hashimoto's thyroiditis"}, {"letter": "B", "text": "Graves disease"}], "answer": "B", "explanation": "TSI = **Graves**, not relevant to subclinical hypo."}]}], "checkpoints": [{"stem": "Subclinical hypothyroidism → also consider treating if:", "options": [{"letter": "A", "text": "Patient is over 90"}, {"letter": "B", "text": "TSH falls on repeat"}, {"letter": "C", "text": "Current or planned pregnancy"}], "answer": "C", "explanation": "AACE: also consider treatment with **current/planned pregnancy**."}]}}, {"id": "15", "group": 15, "section": "Subclinical hyperthyroidism", "topic": "Subclinical thyroid disease", "skill": "Disease process", "stem": "What is the most common cause of subclinical hyperthyroidism in a patient older than 65?", "options": [{"letter": "A", "text": "Toxic adenoma or TMG"}, {"letter": "B", "text": "Graves disease"}, {"letter": "C", "text": "Subacute thyroiditis"}, {"letter": "D", "text": "TSH-secreting adenoma"}], "answer": "A", "explanation": "In older patients the MC causes are **single toxic adenomas or toxic multinodular goiters — NOT Graves**.", "objective": "", "remediation": {"steps": [{"teach": "In the **elderly**, autonomous **nodules** are the usual culprit — the lecture specifically says it is **not** the autoimmune cause.", "stem": "In patients > 65, subclinical hyperthyroidism usually comes from →", "options": [{"letter": "A", "text": "Autoimmune antibodies"}, {"letter": "B", "text": "Viral inflammation"}, {"letter": "C", "text": "Autonomous nodules"}], "answer": "C", "explanation": "Hot **nodules** (adenoma/TMG).", "clarify": [{"stem": "Graves disease is the MC cause of subclinical hyper in > 65?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "The slide explicitly says **NOT Graves** in this age group."}]}], "checkpoints": [{"stem": "AACE treats subclinical hyperthyroidism if →", "options": [{"letter": "A", "text": "Age < 30 and asymptomatic"}, {"letter": "B", "text": "Positive anti-TPO only"}, {"letter": "C", "text": "Age > 65 or CV dz/osteoporosis"}], "answer": "C", "explanation": "Treat if significantly symptomatic, **> 65**, **CV disease or osteoporosis**."}]}}, {"id": "16", "group": 16, "section": "Secondary (central) hypothyroidism", "topic": "Central (secondary) thyroid disease", "skill": "Disease process", "stem": "What is the basic differential diagnosis for low TSH with low free T4?", "options": [{"letter": "A", "text": "Pituitary mass lesion"}, {"letter": "B", "text": "Hashimoto's thyroiditis"}, {"letter": "C", "text": "Toxic multinodular goiter"}, {"letter": "D", "text": "Postpartum thyroiditis"}], "answer": "A", "explanation": "Central hypothyroidism DDx: **pituitary mass lesions** (e.g. nonfunctioning adenoma compressing thyrotropes), CNS tumors, infiltrative disease (sarcoid, hemochromatosis), TBI, CNS radiation.", "objective": "", "remediation": {"steps": [{"teach": "Both values low = the **pituitary** isn't making enough TSH. Look for something that damages or compresses the **thyrotropes**.", "stem": "The problem in central hypothyroidism is located in →", "options": [{"letter": "A", "text": "Thyroid gland"}, {"letter": "B", "text": "Peripheral tissues"}, {"letter": "C", "text": "Pituitary/hypothalamus"}], "answer": "C", "explanation": "**Central** = pituitary/hypothalamus.", "clarify": [{"stem": "Hashimoto's thyroiditis would give →", "options": [{"letter": "A", "text": "Low TSH, low free T4"}, {"letter": "B", "text": "High TSH, low free T4"}], "answer": "B", "explanation": "Hashimoto's is **primary** — TSH goes **up**."}]}], "checkpoints": [{"stem": "Infiltrative disease that can cause central hypothyroidism →", "options": [{"letter": "A", "text": "Sarcoidosis"}, {"letter": "B", "text": "Graves disease"}, {"letter": "C", "text": "Struma ovarii"}], "answer": "A", "explanation": "**Sarcoidosis** or **hemochromatosis** can infiltrate the pituitary."}, {"stem": "Pituitary cells that make TSH are called →", "options": [{"letter": "A", "text": "Thyrotropes"}, {"letter": "B", "text": "Follicular cells"}, {"letter": "C", "text": "Parafollicular cells"}], "answer": "A", "explanation": "**Thyrotropes** produce TSH."}]}}, {"id": "17", "group": 17, "section": "Secondary (central) hyperthyroidism", "topic": "Central (secondary) thyroid disease", "skill": "Disease process", "stem": "What rare condition can cause both high TSH and high free T4?", "options": [{"letter": "A", "text": "TSH-secreting pituitary adenoma"}, {"letter": "B", "text": "Toxic multinodular goiter"}, {"letter": "C", "text": "Hashimoto's thyroiditis"}, {"letter": "D", "text": "Subacute painful thyroiditis"}], "answer": "A", "explanation": "Central hyperthyroidism (very rare): **TSH-secreting pituitary adenoma** or partial thyroid hormone resistance.", "objective": "", "remediation": {"steps": [{"teach": "TSH stays **high** despite high T4 → something is making TSH **autonomously** in the pituitary.", "stem": "A tumor making excess TSH would be located in the →", "options": [{"letter": "A", "text": "Thyroid"}, {"letter": "B", "text": "Ovary"}, {"letter": "C", "text": "Pituitary"}], "answer": "C", "explanation": "A **pituitary** adenoma secreting TSH.", "clarify": [{"stem": "Toxic multinodular goiter would give TSH that is →", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}], "answer": "B", "explanation": "TMG is **primary** → TSH **suppressed**."}]}], "checkpoints": [{"stem": "Other rare cause of central hyperthyroidism →", "options": [{"letter": "A", "text": "Biotin ingestion"}, {"letter": "B", "text": "Thyroid hormone resistance"}, {"letter": "C", "text": "Iodine deficiency"}], "answer": "B", "explanation": "Partial **resistance to T4/T3 feedback** (T3-receptor defects)."}]}}, {"id": "18", "group": 18, "section": "Secondary states — imaging", "topic": "Central (secondary) thyroid disease", "skill": "Diagnostics & imaging", "stem": "What is the best imaging study for suspected secondary or central thyroid disease?", "options": [{"letter": "A", "text": "Head CT"}, {"letter": "B", "text": "Thyroid ultrasound"}, {"letter": "C", "text": "Brain MRI"}, {"letter": "D", "text": "RAIU scan"}], "answer": "C", "explanation": "**Brain imaging — MRI best** — is helpful in the secondary scenarios to look for a pituitary lesion.", "objective": "", "remediation": {"steps": [{"teach": "In central disease the lesion is in the **pituitary**, so image the **brain**, not the neck.", "stem": "Central disease → image the →", "options": [{"letter": "A", "text": "Thyroid gland"}, {"letter": "B", "text": "Ovaries"}, {"letter": "C", "text": "Brain/pituitary"}], "answer": "C", "explanation": "Look at the **pituitary**.", "clarify": [{"stem": "Best modality for the pituitary per lecture →", "options": [{"letter": "A", "text": "CT"}, {"letter": "B", "text": "MRI"}], "answer": "B", "explanation": "**MRI** is best."}]}], "checkpoints": [{"stem": "60 yo, TSH 4 (normal), free T4 0.1 → also evaluate:", "options": [{"letter": "A", "text": "Anti-TPO titers"}, {"letter": "B", "text": "Other pituitary axes"}, {"letter": "C", "text": "Thyroid ultrasound"}], "answer": "B", "explanation": "Central hypothyroidism → MRI plus check **other pituitary axes** (hypopituitarism)."}]}}, {"id": "19", "group": 19, "section": "Thyroid autoantibodies", "topic": "Thyroid autoantibodies", "skill": "Disease process", "stem": "Which thyroid disorder generally has no associated autoantibodies?", "options": [{"letter": "A", "text": "Hashimoto's thyroiditis"}, {"letter": "B", "text": "Graves disease"}, {"letter": "C", "text": "Toxic multinodular goiter"}, {"letter": "D", "text": "Postpartum thyroiditis"}], "answer": "C", "explanation": "**No antibodies** with toxic multinodular goiter, toxic adenoma, or subacute painful thyroiditis; Hashimoto's, Graves and postpartum thyroiditis do have antibodies.", "objective": "", "remediation": {"steps": [{"teach": "The two classic **autoimmune** thyroid diseases are **Hashimoto's** (hypo) and **Graves** (hyper); **postpartum** thyroiditis also has antibodies. Nodular disease is **autonomous**, not autoimmune.", "stem": "Two major autoimmune thyroid diseases →", "options": [{"letter": "A", "text": "Hashimoto's and Graves"}, {"letter": "B", "text": "TMG and toxic adenoma"}, {"letter": "C", "text": "de Quervain's and TMG"}], "answer": "A", "explanation": "**Hashimoto's** and **Graves** are autoimmune.", "clarify": [{"stem": "Postpartum thyroiditis usually has antibodies?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes (anti-TPO)"}], "answer": "B", "explanation": "Usually **anti-TPO positive**."}]}], "checkpoints": [{"stem": "Subacute painful (de Quervain's) thyroiditis → antibodies:", "options": [{"letter": "A", "text": "None associated"}, {"letter": "B", "text": "Anti-TPO in 95%"}, {"letter": "C", "text": "TSI in 90%"}], "answer": "A", "explanation": "**No autoantibody** association in de Quervain's."}]}}, {"id": "20", "group": 20, "section": "Anti-TPO antibodies", "topic": "Thyroid autoantibodies", "skill": "Diagnostics & imaging", "stem": "Which antibody is positive in approximately 95% of patients with Hashimoto thyroiditis?", "options": [{"letter": "A", "text": "Anti-TPO antibody"}, {"letter": "B", "text": "Anti-Tg antibody"}, {"letter": "C", "text": "TSI antibody"}, {"letter": "D", "text": "Antinuclear antibody"}], "answer": "A", "explanation": "Nearly all (~95%) patients with Hashimoto's have high **anti-thyroid peroxidase (anti-TPO)** antibodies.", "objective": "", "remediation": {"steps": [{"teach": "**Thyroid peroxidase** is the enzyme used to manufacture T3/T4; the antibody against it is the most sensitive Hashimoto's marker.", "stem": "Thyroid peroxidase is →", "options": [{"letter": "A", "text": "A TSH receptor"}, {"letter": "B", "text": "An enzyme that makes T3/T4"}, {"letter": "C", "text": "A binding protein"}], "answer": "B", "explanation": "TPO is an **enzyme** in hormone synthesis.", "clarify": [{"stem": "Anti-Tg antibodies are positive in Hashimoto's about →", "options": [{"letter": "A", "text": "~95%"}, {"letter": "B", "text": "~80%"}], "answer": "B", "explanation": "Anti-Tg ~**80%**; anti-TPO ~**95%**."}]}], "checkpoints": [{"stem": "Hashimoto's thyroiditis is autoimmune →", "options": [{"letter": "A", "text": "Hypothyroidism"}, {"letter": "B", "text": "Hyperthyroidism"}, {"letter": "C", "text": "Thyroid cancer"}], "answer": "A", "explanation": "Hashimoto's = **autoimmune hypothyroidism**."}]}}, {"id": "21", "group": 21, "section": "Hashimoto's — MC cause", "topic": "Thyroid autoantibodies", "skill": "Disease process", "stem": "What is the most common cause of overt hypothyroidism in iodine-sufficient areas?", "options": [{"letter": "A", "text": "Subacute thyroiditis"}, {"letter": "B", "text": "Postpartum thyroiditis"}, {"letter": "C", "text": "Pituitary adenoma"}, {"letter": "D", "text": "Hashimoto's thyroiditis"}], "answer": "D", "explanation": "In iodine-sufficient areas **autoimmune (Hashimoto's) thyroiditis** is by far the most common cause of overt hypothyroidism — so antibody testing is often unnecessary.", "objective": "", "remediation": {"steps": [{"teach": "The MC cause is the **autoimmune** one marked by anti-TPO; the others are transient or central.", "stem": "Hashimoto's mechanism →", "options": [{"letter": "A", "text": "Autoimmune"}, {"letter": "B", "text": "Viral"}, {"letter": "C", "text": "Pituitary mass"}], "answer": "A", "explanation": "Hashimoto's is **autoimmune** thyroiditis.", "clarify": [{"stem": "Subacute and postpartum thyroiditis are usually →", "options": [{"letter": "A", "text": "Permanent"}, {"letter": "B", "text": "Transient"}], "answer": "B", "explanation": "They are **self-limited/transient** courses."}]}], "checkpoints": [{"stem": "Classic Hashimoto's picture → is anti-TPO testing mandatory?", "options": [{"letter": "A", "text": "Yes, before any therapy"}, {"letter": "B", "text": "Yes, plus RAIU"}, {"letter": "C", "text": "No, can treat presumptively"}], "answer": "C", "explanation": "Testing is **debatable**; patients can be treated under a presumptive diagnosis."}]}}, {"id": "22", "group": 22, "section": "Anti-TPO — subclinical", "topic": "Thyroid autoantibodies", "skill": "Diagnostics & imaging", "stem": "What does a positive anti-TPO result indicate in a patient with subclinical hypothyroidism?", "options": [{"letter": "A", "text": "Coexisting Graves disease"}, {"letter": "B", "text": "Higher risk of overt progression"}, {"letter": "C", "text": "Need for an RAIU scan"}, {"letter": "D", "text": "Lab assay interference"}], "answer": "B", "explanation": "Anti-TPO in subclinical hypothyroidism **predicts progression to overt hypothyroidism** (4.3%/yr vs 2.1%/yr) — an argument for treating.", "objective": "", "remediation": {"steps": [{"teach": "Antibodies mean **ongoing autoimmune destruction** — the gland is more likely to keep failing.", "stem": "Anti-TPO positive vs negative → yearly progression is →", "options": [{"letter": "A", "text": "About the same"}, {"letter": "B", "text": "Lower"}, {"letter": "C", "text": "About double"}], "answer": "C", "explanation": "**4.3%/yr vs 2.1%/yr.**", "clarify": [{"stem": "Positive anti-TPO in subclinical hypo argues →", "options": [{"letter": "A", "text": "For treating"}, {"letter": "B", "text": "Against treating"}], "answer": "A", "explanation": "It favors **low-dose thyroxine**."}]}], "checkpoints": [{"stem": "Positive anti-TPO also raises risk of other autoimmune dz, e.g. →", "options": [{"letter": "A", "text": "Type 1 diabetes"}, {"letter": "B", "text": "Osteoarthritis"}, {"letter": "C", "text": "Gout"}], "answer": "A", "explanation": "Also flags risk of **adrenal insufficiency, T1DM**."}]}}, {"id": "23", "group": 23, "section": "Anti-Tg antibodies", "topic": "Thyroid autoantibodies", "skill": "Diagnostics & imaging", "stem": "In approximately what percentage of patients with Hashimoto thyroiditis are anti-thyroglobulin antibodies positive?", "options": [{"letter": "A", "text": "~95%"}, {"letter": "B", "text": "~50%"}, {"letter": "C", "text": "~80%"}, {"letter": "D", "text": "~20%"}], "answer": "C", "explanation": "About **80%** of Hashimoto's patients have positive anti-Tg antibodies (vs ~95% for anti-TPO).", "objective": "", "remediation": {"steps": [{"teach": "**Thyroglobulin** is the protein base for T3/T4 synthesis. Its antibody is common in Hashimoto's but a bit **less** frequent than anti-TPO.", "stem": "Compared with anti-TPO, anti-Tg is positive in Hashimoto's →", "options": [{"letter": "A", "text": "More often"}, {"letter": "B", "text": "Never"}, {"letter": "C", "text": "Somewhat less often"}], "answer": "C", "explanation": "Anti-Tg (~80%) < anti-TPO (~95%).", "clarify": [{"stem": "Thyroglobulin is made by →", "options": [{"letter": "A", "text": "Pituitary thyrotropes"}, {"letter": "B", "text": "Follicular cells"}], "answer": "B", "explanation": "Synthesized by **follicular cells**, stored in the follicle lumen."}]}], "checkpoints": [{"stem": "Anti-TPO positivity in Hashimoto's →", "options": [{"letter": "A", "text": "~80%"}, {"letter": "B", "text": "~95%"}, {"letter": "C", "text": "~50%"}], "answer": "B", "explanation": "Anti-TPO ~**95%**."}]}}, {"id": "24", "group": 24, "section": "TSH receptor-stimulating antibodies", "topic": "Thyroid autoantibodies", "skill": "Diagnostics & imaging", "stem": "Which disease is associated with thyroid-stimulating immunoglobulin, also called TSI or TSHR-S?", "options": [{"letter": "A", "text": "Graves disease"}, {"letter": "B", "text": "Hashimoto's thyroiditis"}, {"letter": "C", "text": "Toxic adenoma"}, {"letter": "D", "text": "Subacute thyroiditis"}], "answer": "A", "explanation": "**TSI** act as TSH-receptor agonists and are seen in ~90% of **Graves disease** — very helpful in diagnosis.", "objective": "", "remediation": {"steps": [{"teach": "These antibodies **stimulate** the TSH receptor, driving the gland to make **more** hormone — autoimmune **hyper**thyroidism.", "stem": "TSI act at the TSH receptor as →", "options": [{"letter": "A", "text": "Agonists (stimulate)"}, {"letter": "B", "text": "Blockers"}, {"letter": "C", "text": "Enzyme inhibitors"}], "answer": "A", "explanation": "**TSH receptor agonists**.", "clarify": [{"stem": "Stimulating the TSH receptor causes →", "options": [{"letter": "A", "text": "Hyperthyroidism"}, {"letter": "B", "text": "Hypothyroidism"}], "answer": "A", "explanation": "More T3/T4 → **hyper**."}]}], "checkpoints": [{"stem": "TSI positive in about what % of Graves?", "options": [{"letter": "A", "text": "~50%"}, {"letter": "B", "text": "~90%"}, {"letter": "C", "text": "~20%"}], "answer": "B", "explanation": "Seen in ~**90%** of Graves."}, {"stem": "Diffuse smooth goiter, bruit, eye findings + hyperthyroid → antibody to order:", "options": [{"letter": "A", "text": "Anti-TPO"}, {"letter": "B", "text": "TSI"}, {"letter": "C", "text": "Anti-Tg"}], "answer": "B", "explanation": "**TSI** confirms Graves."}]}}, {"id": "25", "group": 25, "section": "Levothyroxine monitoring", "topic": "Lab monitoring on therapy", "skill": "Diagnostics & imaging", "stem": "When should TSH be rechecked after starting levothyroxine or changing its dose?", "options": [{"letter": "A", "text": "4–6 weeks"}, {"letter": "B", "text": "1–2 weeks"}, {"letter": "C", "text": "3–6 months"}, {"letter": "D", "text": "12 months"}], "answer": "A", "explanation": "Repeat **TSH 4–6 weeks** after starting replacement and after **any** dose adjustment.", "objective": "", "remediation": {"steps": [{"teach": "T4 has a long half-life (5–7 days), so a new steady state takes **several weeks** — recheck in about **a month and a half**.", "stem": "Recheck after a dose change is measured in →", "options": [{"letter": "A", "text": "Days"}, {"letter": "B", "text": "Years"}, {"letter": "C", "text": "Weeks"}], "answer": "C", "explanation": "**4–6 weeks.**", "clarify": [{"stem": "Once stable on levothyroxine, TSH is checked →", "options": [{"letter": "A", "text": "Every 4–6 weeks"}, {"letter": "B", "text": "Annually"}], "answer": "B", "explanation": "Stable → **annually** or sooner with symptoms."}]}], "checkpoints": [{"stem": "Dose adjustments of levothyroxine are typically made in →", "options": [{"letter": "A", "text": "12–25 mcg increments"}, {"letter": "B", "text": "100 mcg increments"}, {"letter": "C", "text": "1–2 mcg increments"}], "answer": "A", "explanation": "Adjust in **12–25 mcg** steps."}, {"stem": "Before raising the dose for a persistently high TSH, always ask about →", "options": [{"letter": "A", "text": "Biotin intake only"}, {"letter": "B", "text": "Adherence"}, {"letter": "C", "text": "Family history"}], "answer": "B", "explanation": "Always ask if the pt is taking it **consistently**."}]}}, {"id": "26", "group": 26, "section": "Levothyroxine monitoring", "topic": "Lab monitoring on therapy", "skill": "Diagnostics & imaging", "stem": "What is the target TSH for a patient receiving thyroid hormone replacement?", "options": [{"letter": "A", "text": "Upper end of normal range"}, {"letter": "B", "text": "Below the normal range"}, {"letter": "C", "text": "Lower end of normal range"}, {"letter": "D", "text": "Above the normal range"}], "answer": "C", "explanation": "Aim for normalization, typically toward the **lower end of the normal reference range** (≈1–2).", "objective": "", "remediation": {"steps": [{"teach": "You want TSH **normal** — not suppressed (over-replacement) — and the lecture favors the **lower half** of normal.", "stem": "A suppressed TSH on levothyroxine means →", "options": [{"letter": "A", "text": "Over-replacement"}, {"letter": "B", "text": "Under-replacement"}, {"letter": "C", "text": "Ideal dosing"}], "answer": "A", "explanation": "Low TSH = **too much** hormone → decrease dose.", "clarify": [{"stem": "TSH still high on levothyroxine → dose should be →", "options": [{"letter": "A", "text": "Decreased"}, {"letter": "B", "text": "Increased"}], "answer": "B", "explanation": "High TSH = under-replaced → **increase**."}]}], "checkpoints": [{"stem": "On Synthroid 100 mcg, TSH 0.3 at 6 wks → next:", "options": [{"letter": "A", "text": "Increase to 112 mcg"}, {"letter": "B", "text": "No change"}, {"letter": "C", "text": "Decrease to 88 mcg"}], "answer": "C", "explanation": "Low TSH = over-replaced → **decrease** (e.g. 88 mcg), recheck in 6 wks."}]}}, {"id": "27", "group": 27, "section": "Methimazole monitoring", "topic": "Lab monitoring on therapy", "skill": "Diagnostics & imaging", "stem": "Which laboratory values should be followed every 4–6 weeks initially after starting methimazole for Graves disease?", "options": [{"letter": "A", "text": "TSH alone"}, {"letter": "B", "text": "Free T4 and T3"}, {"letter": "C", "text": "Anti-TPO antibody"}, {"letter": "D", "text": "ESR and CRP"}], "answer": "B", "explanation": "Use **serial free T4 and T3** every 4–6 weeks initially to bring hormone levels into the normal range.", "objective": "", "remediation": {"steps": [{"teach": "Early in Graves treatment, **TSH stays suppressed** for a while, so you follow the **hormones themselves**.", "stem": "Early in thionamide therapy, follow →", "options": [{"letter": "A", "text": "Thyroid hormone levels"}, {"letter": "B", "text": "TSH alone"}, {"letter": "C", "text": "Thyroid ultrasound"}], "answer": "A", "explanation": "Follow **free T4/T3** early.", "clarify": [{"stem": "Once stable on maintenance methimazole, check →", "options": [{"letter": "A", "text": "Free T3 weekly"}, {"letter": "B", "text": "TSH and free T4 every few months"}], "answer": "B", "explanation": "Stable → **TSH + free T4 every few months**."}]}], "checkpoints": [{"stem": "Free T4 normalized on methimazole → dose change:", "options": [{"letter": "A", "text": "Decrease by 30–50%"}, {"letter": "B", "text": "Increase by 30–50%"}, {"letter": "C", "text": "Stop immediately"}], "answer": "A", "explanation": "Once normal, **decrease MMI by 30–50%**."}, {"stem": "Thionamide preferred over PTU except in pregnancy →", "options": [{"letter": "A", "text": "Propylthiouracil"}, {"letter": "B", "text": "Methimazole"}, {"letter": "C", "text": "Levothyroxine"}], "answer": "B", "explanation": "**Methimazole** is preferred (except pregnancy)."}]}}, {"id": "28", "group": 28, "section": "Methimazole — TSI", "topic": "Lab monitoring on therapy", "skill": "Diagnostics & imaging", "stem": "What does it suggest when TSI antibodies become undetectable during methimazole treatment?", "options": [{"letter": "A", "text": "Switch to PTU"}, {"letter": "B", "text": "Reasonable to taper off"}, {"letter": "C", "text": "Proceed to I-131"}, {"letter": "D", "text": "Increase the dose"}], "answer": "B", "explanation": "Falling/disappearing **TSI** during methimazole is prognostic — tapering off is reasonable with hope for **durable remission**.", "objective": "", "remediation": {"steps": [{"teach": "TSI is the **driver** of Graves. If the driver disappears, the disease may be in **remission**.", "stem": "Undetectable TSI suggests the Graves process is →", "options": [{"letter": "A", "text": "In remission"}, {"letter": "B", "text": "Worsening"}, {"letter": "C", "text": "Unchanged"}], "answer": "A", "explanation": "Loss of TSI → **remission** likely.", "clarify": [{"stem": "Usual US course of methimazole →", "options": [{"letter": "A", "text": "1–2 months"}, {"letter": "B", "text": "1–2 years"}], "answer": "B", "explanation": "Typically **1–2 years**."}]}], "checkpoints": [{"stem": "After stopping methimazole in remission, some patients →", "options": [{"letter": "A", "text": "Relapse later"}, {"letter": "B", "text": "Become hypothyroid immediately"}, {"letter": "C", "text": "Develop TMG"}], "answer": "A", "explanation": "A subset **relapse** after discontinuation."}]}}, {"id": "29", "group": 29, "section": "Subacute painful thyroiditis", "topic": "Subacute painful (de Quervain's) thyroiditis", "skill": "Identification", "stem": "What is the most common cause of a painful thyroid gland?", "options": [{"letter": "A", "text": "Postpartum thyroiditis"}, {"letter": "B", "text": "Hashimoto's thyroiditis"}, {"letter": "C", "text": "Toxic multinodular goiter"}, {"letter": "D", "text": "Subacute (de Quervain's) thyroiditis"}], "answer": "D", "explanation": "**Subacute painful (de Quervain's, granulomatous) thyroiditis** is the MC cause of a painful thyroid — often post-viral.", "objective": "", "remediation": {"steps": [{"teach": "The clue is **pain/tenderness**, usually after a **viral URI** — a granulomatous inflammation of the gland.", "stem": "Painful thyroid after a cold suggests the cause is →", "options": [{"letter": "A", "text": "Viral/post-viral inflammation"}, {"letter": "B", "text": "Autoimmune antibodies"}, {"letter": "C", "text": "Autonomous nodules"}], "answer": "A", "explanation": "De Quervain's is **viral/post-viral**.", "clarify": [{"stem": "Postpartum thyroiditis gland is →", "options": [{"letter": "A", "text": "NOT painful"}, {"letter": "B", "text": "Very painful"}], "answer": "A", "explanation": "Postpartum thyroiditis is **painless**."}]}], "checkpoints": [{"stem": "De Quervain's demographic →", "options": [{"letter": "A", "text": "Women 25–35"}, {"letter": "B", "text": "Men over 70"}, {"letter": "C", "text": "Children under 5"}], "answer": "A", "explanation": "Women 4–5× > men, typically **25–35 yrs**."}]}}, {"id": "30", "group": 30, "section": "Subacute painful thyroiditis — ESR", "topic": "Subacute painful (de Quervain's) thyroiditis", "skill": "Diagnostics & imaging", "stem": "What ESR result is expected in a patient with a tender thyroid after a viral upper respiratory infection?", "options": [{"letter": "A", "text": "Normal (< 20 mm/h)"}, {"letter": "B", "text": "Mildly ↑ (20–30 mm/h)"}, {"letter": "C", "text": "Low (< 5 mm/h)"}, {"letter": "D", "text": "> 50 mm/h, often > 100"}], "answer": "D", "explanation": "ESR is usually **> 50 mm/h, often > 100 mm/h** in subacute painful thyroiditis.", "objective": "", "remediation": {"steps": [{"teach": "ESR measures **inflammation**; de Quervain's is an intensely **inflamed** gland, so expect a markedly high value.", "stem": "ESR in de Quervain's is →", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Markedly elevated"}, {"letter": "C", "text": "Low"}], "answer": "B", "explanation": "**Markedly elevated.**", "clarify": [{"stem": "Another inflammatory marker elevated in de Quervain's →", "options": [{"letter": "A", "text": "CRP"}, {"letter": "B", "text": "Anti-TPO"}], "answer": "A", "explanation": "**CRP** is elevated too; antibodies are not."}]}], "checkpoints": [{"stem": "De Quervain's → autoantibodies:", "options": [{"letter": "A", "text": "None associated"}, {"letter": "B", "text": "Anti-TPO positive"}, {"letter": "C", "text": "TSI positive"}], "answer": "A", "explanation": "**No autoantibody** association."}]}}, {"id": "31", "group": 31, "section": "Subacute painful thyroiditis — RAIU", "topic": "Subacute painful (de Quervain's) thyroiditis", "skill": "Diagnostics & imaging", "stem": "What radioactive iodine uptake pattern is expected during the hyperthyroid phase of de Quervain thyroiditis?", "options": [{"letter": "A", "text": "Diffuse high uptake"}, {"letter": "B", "text": "Low / depressed uptake"}, {"letter": "C", "text": "Single hot nodule"}, {"letter": "D", "text": "Multiple hot foci"}], "answer": "B", "explanation": "The hyperthyroid phase is **release of preformed hormone** from damaged follicles, so **RAIU is low/depressed**.", "objective": "", "remediation": {"steps": [{"teach": "Inflamed follicles **leak stored hormone**; the gland is not making new hormone, so it doesn't trap much iodine.", "stem": "Hyperthyroidism in de Quervain's comes from →", "options": [{"letter": "A", "text": "Release of preformed hormone"}, {"letter": "B", "text": "New hormone synthesis"}, {"letter": "C", "text": "TSH stimulation"}], "answer": "A", "explanation": "**Leakage of preformed hormone.**", "clarify": [{"stem": "Low RAIU uptake means →", "options": [{"letter": "A", "text": "Excess new synthesis"}, {"letter": "B", "text": "No new hormone synthesis"}], "answer": "B", "explanation": "Low uptake = **not making** new hormone."}]}], "checkpoints": [{"stem": "Graves disease → RAIU pattern:", "options": [{"letter": "A", "text": "Low uptake"}, {"letter": "B", "text": "Diffuse high uptake"}, {"letter": "C", "text": "No uptake"}], "answer": "B", "explanation": "Graves = **diffuse, homogeneous high uptake**."}]}}, {"id": "32", "group": 32, "section": "Subacute painful thyroiditis — course", "topic": "Subacute painful (de Quervain's) thyroiditis", "skill": "Disease process", "stem": "What is the classic course of subacute painful thyroiditis?", "options": [{"letter": "A", "text": "Hypo → hyper → euthyroid"}, {"letter": "B", "text": "Persistent hyperthyroid"}, {"letter": "C", "text": "Permanent hypothyroid"}, {"letter": "D", "text": "Hyper → hypo → euthyroid"}], "answer": "D", "explanation": "Typically **triphasic: hyper → hypo → euthyroid**, with complete recovery in **3–4 months** (self-limited).", "objective": "", "remediation": {"steps": [{"teach": "Damaged follicles first **dump stored hormone** (hyper); then the depleted gland is **underactive** (hypo) before it heals.", "stem": "First phase of de Quervain's →", "options": [{"letter": "A", "text": "Hypothyroid"}, {"letter": "B", "text": "Euthyroid"}, {"letter": "C", "text": "Hyperthyroid"}], "answer": "C", "explanation": "It **starts hyper** from released hormone.", "clarify": [{"stem": "De Quervain's is →", "options": [{"letter": "A", "text": "Self-limited"}, {"letter": "B", "text": "Lifelong"}], "answer": "A", "explanation": "Complete recovery in **3–4 months** is characteristic."}]}], "checkpoints": [{"stem": "Typical time to complete recovery in de Quervain's →", "options": [{"letter": "A", "text": "3–4 months"}, {"letter": "B", "text": "3–4 years"}, {"letter": "C", "text": "3–4 days"}], "answer": "A", "explanation": "**3–4 months.**"}]}}, {"id": "33", "group": 33, "section": "Postpartum thyroiditis", "topic": "Postpartum thyroiditis", "skill": "Identification", "stem": "What diagnosis is most likely when thyroiditis develops within 1 year after delivery and the gland is not tender?", "options": [{"letter": "A", "text": "Subacute painful thyroiditis"}, {"letter": "B", "text": "Toxic adenoma"}, {"letter": "C", "text": "Postpartum thyroiditis"}, {"letter": "D", "text": "Central hyperthyroidism"}], "answer": "C", "explanation": "**Postpartum thyroiditis** is a subacute thyroiditis with onset within the first year after childbirth — the thyroid is **NOT painful**.", "objective": "", "remediation": {"steps": [{"teach": "Two clues: **within a year of delivery** and a **painless** gland.", "stem": "Painless gland excludes →", "options": [{"letter": "A", "text": "Postpartum thyroiditis"}, {"letter": "B", "text": "Hashimoto's"}, {"letter": "C", "text": "Subacute painful thyroiditis"}], "answer": "C", "explanation": "De Quervain's is **painful**; postpartum is **painless**.", "clarify": [{"stem": "Postpartum thyroiditis course is usually →", "options": [{"letter": "A", "text": "Monophasic hypo"}, {"letter": "B", "text": "Triphasic"}], "answer": "B", "explanation": "**Hyper → hypo → euthyroid**, like de Quervain's."}]}], "checkpoints": [{"stem": "Postpartum thyroiditis → RAIU in the hyperthyroid phase:", "options": [{"letter": "A", "text": "Low uptake"}, {"letter": "B", "text": "Diffuse high uptake"}, {"letter": "C", "text": "Single hot nodule"}], "answer": "A", "explanation": "Release of preformed hormone → **low uptake**."}, {"stem": "Postpartum thyroiditis → % permanent hypothyroidism:", "options": [{"letter": "A", "text": "20–30%"}, {"letter": "B", "text": "90–100%"}, {"letter": "C", "text": "0%"}], "answer": "A", "explanation": "Permanent hypothyroidism in **20–30%**."}]}}, {"id": "34", "group": 34, "section": "Postpartum thyroiditis — antibodies", "topic": "Postpartum thyroiditis", "skill": "Diagnostics & imaging", "stem": "Which antibody is usually present in postpartum thyroiditis?", "options": [{"letter": "A", "text": "TSI antibody"}, {"letter": "B", "text": "No antibodies"}, {"letter": "C", "text": "Anti-TPO antibody"}, {"letter": "D", "text": "Antinuclear antibody"}], "answer": "C", "explanation": "Women with postpartum thyroiditis usually have **anti-TPO** antibodies (60–85%) — transient, unless they persist (then Hashimoto's).", "objective": "", "remediation": {"steps": [{"teach": "Postpartum thyroiditis is on the **Hashimoto's-like autoimmune** side, unlike de Quervain's.", "stem": "Postpartum thyroiditis is →", "options": [{"letter": "A", "text": "Viral"}, {"letter": "B", "text": "Nodular"}, {"letter": "C", "text": "Autoimmune"}], "answer": "C", "explanation": "It carries **antibodies**.", "clarify": [{"stem": "Persistent anti-TPO after postpartum thyroiditis means →", "options": [{"letter": "A", "text": "Developed Hashimoto's"}, {"letter": "B", "text": "Developed Graves"}], "answer": "A", "explanation": "Persisting antibodies = **Hashimoto's**."}]}], "checkpoints": [{"stem": "De Quervain's vs postpartum: which has antibodies?", "options": [{"letter": "A", "text": "de Quervain's thyroiditis"}, {"letter": "B", "text": "Both equally"}, {"letter": "C", "text": "Postpartum thyroiditis"}], "answer": "C", "explanation": "**Postpartum** (anti-TPO); de Quervain's has none."}]}}, {"id": "35", "group": 35, "section": "Postpartum thyroiditis — recognition", "topic": "Postpartum thyroiditis", "skill": "Diagnostics & imaging", "stem": "Which laboratory test should be checked in a new mother with postpartum depression or anxiety?", "options": [{"letter": "A", "text": "ESR"}, {"letter": "B", "text": "Anti-Tg"}, {"letter": "C", "text": "Free T3"}, {"letter": "D", "text": "TSH"}], "answer": "D", "explanation": "Postpartum thyroiditis is easily mistaken for newborn stress or postpartum mood disorder — **check TSH**.", "objective": "", "remediation": {"steps": [{"teach": "Thyroid swings mimic **mood** symptoms; use the standard **first-line** thyroid test.", "stem": "Best initial test for any suspected thyroid dysfunction →", "options": [{"letter": "A", "text": "TSH"}, {"letter": "B", "text": "ESR"}, {"letter": "C", "text": "RAIU"}], "answer": "A", "explanation": "**TSH** first.", "clarify": [{"stem": "Postpartum is a time to consider thyroid disease?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "The lecture flags **postpartum** as a time to check."}]}], "checkpoints": [{"stem": "Risk factor for postpartum thyroiditis →", "options": [{"letter": "A", "text": "Prior appendectomy"}, {"letter": "B", "text": "Low BMI"}, {"letter": "C", "text": "Type 1 diabetes"}], "answer": "C", "explanation": "Autoimmune disease such as **T1DM** increases risk."}]}}, {"id": "36", "group": 36, "section": "RAIU — procedure", "topic": "RAIU scan", "skill": "Diagnostics & imaging", "stem": "Which isotope is used for a radioactive iodine uptake scan, and how is it administered?", "options": [{"letter": "A", "text": "Oral I-131"}, {"letter": "B", "text": "Oral I-123"}, {"letter": "C", "text": "IV I-123"}, {"letter": "D", "text": "IV I-131"}], "answer": "B", "explanation": "**I-123 is taken orally** and the gland is imaged by a gamma camera at **6 and 24 hours**.", "objective": "", "remediation": {"steps": [{"teach": "**I-123** emits only gamma rays → imaging. I-131 adds beta → destroys tissue. The diagnostic dose is swallowed.", "stem": "Isotope used for diagnostic imaging →", "options": [{"letter": "A", "text": "I-123"}, {"letter": "B", "text": "I-131"}, {"letter": "C", "text": "Both equally"}], "answer": "A", "explanation": "**123 = diagnose; 131 = destroy.**", "clarify": [{"stem": "RAIU images are taken at →", "options": [{"letter": "A", "text": "6 and 24 hours"}, {"letter": "B", "text": "1 and 2 weeks"}], "answer": "A", "explanation": "Imaged at **6 and 24 h**."}]}], "checkpoints": [{"stem": "I-131 emits →", "options": [{"letter": "A", "text": "Gamma AND beta radiation"}, {"letter": "B", "text": "Gamma only"}, {"letter": "C", "text": "Alpha only"}], "answer": "A", "explanation": "I-131 = **gamma + beta** → ablation."}]}}, {"id": "37", "group": 37, "section": "RAIU — normal values", "topic": "RAIU scan", "skill": "Diagnostics & imaging", "stem": "What is the normal 24-hour radioactive iodine uptake range?", "options": [{"letter": "A", "text": "~2–16%"}, {"letter": "B", "text": "~8–25%"}, {"letter": "C", "text": "~30–50%"}, {"letter": "D", "text": "~0–2%"}], "answer": "B", "explanation": "Normal **24-hour uptake ~8–25%** (6-hour ~2–16%).", "objective": "", "remediation": {"steps": [{"teach": "Uptake **accumulates** over time, so the 24-hour normal range is **higher** than the 6-hour range.", "stem": "Compared with 6-hour uptake, normal 24-hour uptake is →", "options": [{"letter": "A", "text": "Lower"}, {"letter": "B", "text": "Identical"}, {"letter": "C", "text": "Higher"}], "answer": "C", "explanation": "24-h (8–25%) > 6-h (2–16%).", "clarify": [{"stem": "Normal 6-hour uptake →", "options": [{"letter": "A", "text": "~2–16%"}, {"letter": "B", "text": "~8–25%"}], "answer": "A", "explanation": "6-hour ~**2–16%**."}]}], "checkpoints": [{"stem": "Normal 6-hour RAIU →", "options": [{"letter": "A", "text": "~30–50%"}, {"letter": "B", "text": "~2–16%"}, {"letter": "C", "text": "~60–80%"}], "answer": "B", "explanation": "6-hour normal ~**2–16%**."}]}}, {"id": "38", "group": 38, "section": "RAIU — interpretation", "topic": "RAIU scan", "skill": "Disease process", "stem": "What does high radioactive iodine uptake represent?", "options": [{"letter": "A", "text": "Release of preformed hormone"}, {"letter": "B", "text": "Exogenous hormone intake"}, {"letter": "C", "text": "New hormone synthesis"}, {"letter": "D", "text": "Thyroid gland destruction"}], "answer": "C", "explanation": "**High uptake = excessive de novo synthesis** of hormone (Graves, TMG, toxic adenoma); low uptake = leakage of preformed hormone or exogenous hormone.", "objective": "", "remediation": {"steps": [{"teach": "The gland traps iodine to **build** hormone. More trapping = more **manufacturing**.", "stem": "A gland making lots of NEW hormone traps iodine →", "options": [{"letter": "A", "text": "Poorly"}, {"letter": "B", "text": "Avidly"}, {"letter": "C", "text": "Not at all"}], "answer": "B", "explanation": "Active synthesis → **avid uptake**.", "clarify": [{"stem": "Low uptake hyperthyroidism means →", "options": [{"letter": "A", "text": "New synthesis"}, {"letter": "B", "text": "Preformed hormone release"}], "answer": "B", "explanation": "Low uptake = **leakage** or exogenous hormone."}]}], "checkpoints": [{"stem": "LOW uptake + hyperthyroid → mechanism:", "options": [{"letter": "A", "text": "Release of preformed hormone"}, {"letter": "B", "text": "New hormone synthesis"}, {"letter": "C", "text": "TSH-secreting tumor"}], "answer": "A", "explanation": "Low uptake = **destruction/le         '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          answers[qid] = btn.getAttribute('data-letter');
          if (answers[qid] !== q.answer && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer: ' + q.answer + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
