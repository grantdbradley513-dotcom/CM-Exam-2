<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  /* LQ-PATCH: two-across option grid + select-all-that-apply */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .opts .opt { margin-bottom: 0; height: 100%; }
  .opts .opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
  @media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
  .group.c3 .opts, .group.c4 .opts { gap: 5px; margin-bottom: 5px; }
  .group.c2 .opts { gap: 6px; margin-bottom: 6px; }
  .opt.picked { border-color: var(--accent); background: var(--accent-soft); }
  .opt .box { min-width: 1.25em; height: 1.25em; line-height: 1.15em; text-align: center;
    border: 2px solid var(--border); border-radius: 4px; font-size: 0.8em; font-weight: 700;
    color: transparent; flex: 0 0 auto; }
  .opt .box.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct .box.on { background: var(--green); border-color: var(--green); }
  .opt.incorrect .box.on { background: var(--red); border-color: var(--red); }
  .sata-note { font-size: 0.85em; font-weight: 700; color: var(--accent); margin: -6px 0 10px; }
  .sata-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .opt-submit { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 8px;
    padding: 8px 18px; background: var(--accent); color: #fff; }
  .opt-submit:disabled { opacity: 0.45; cursor: default; }
  .sata-count { font-size: 0.85em; color: var(--ink-soft); }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>

ensitive first look.", "stem": "Which hormone acts as the informant that the thyroid is misbehaving?", "options": [{"letter": "A", "text": "Free T4"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "Thyroglobulin"}, {"letter": "D", "text": "Calcitonin"}], "answer": "B", "explanation": "The pituitary's **TSH** shifts in response to thyroid dysfunction."}, {"teach": "Because the pituitary answers in **both** directions, a single normal TSH carries a lot of negative predictive value.", "stem": "Which conditions does a normal TSH generally rule out?", "options": [{"letter": "A", "text": "Primary hypothyroidism only"}, {"letter": "B", "text": "Primary hyperthyroidism only"}, {"letter": "C", "text": "Central hypothyroidism and hyperthyroidism"}, {"letter": "D", "text": "Primary hypothyroidism and primary hyperthyroidism"}], "answer": "D", "explanation": "A **normal TSH generally rules out both primary hypothyroidism and primary hyperthyroidism**; central disease can still hide behind it.", "clarify": [{"stem": "Are most disorders of thyroid function primary or central in origin?", "options": [{"letter": "A", "text": "Primary — the gland itself"}, {"letter": "B", "text": "Central — the pituitary"}], "answer": "A", "explanation": "The **overwhelming majority are primary**, which is what makes TSH reliable."}, {"stem": "At what point in the workup is a free T4 usually ordered?", "options": [{"letter": "A", "text": "Before any TSH is drawn"}, {"letter": "B", "text": "After an abnormal TSH"}], "answer": "B", "explanation": "Free T4 is the **reflex confirmatory** test after an abnormal TSH."}, {"stem": "When thyroid hormone is measured, is the free or the total level preferred?", "options": [{"letter": "A", "text": "The free (unbound) level"}, {"letter": "B", "text": "The total level"}], "answer": "A", "explanation": "Only the **free** fraction is biologically active, so order free T4, not total."}]}], "checkpoints": [{"stem": "An initial TSH comes back abnormal — which test is ordered next to confirm the diagnosis?", "options": [{"letter": "A", "text": "ESR"}, {"letter": "B", "text": "RAIU scan"}, {"letter": "C", "text": "Thyroid ultrasound"}, {"letter": "D", "text": "Free T4"}], "answer": "D", "explanation": "**Free T4** confirms the diagnosis after an abnormal TSH."}, {"stem": "What is the main role of an RAIU scan in the evaluation of thyroid disease?", "options": [{"letter": "A", "text": "Screening for hypothyroidism"}, {"letter": "B", "text": "Measuring pituitary TSH reserve"}, {"letter": "C", "text": "Finding the cause of hyperthyroidism"}, {"letter": "D", "text": "Confirming an abnormal free T4"}], "answer": "C", "explanation": "RAIU distinguishes the **causes of hyperthyroidism**; it is not a first-line screen."}]}}, {"id": "3", "group": 3, "section": "Who to test", "topic": "TSH", "skill": "Diagnostics & imaging", "stem": "Which patients warrant a low threshold for checking a TSH level?", "options": [{"letter": "A", "text": "An uncomplicated ankle sprain"}, {"letter": "B", "text": "Down syndrome or Turner syndrome"}, {"letter": "C", "text": "A single episode of viral gastroenteritis"}, {"letter": "D", "text": "Seasonal allergic rhinitis"}, {"letter": "E", "text": "Postpartum depression or anxiety"}, {"letter": "F", "text": "Newly diagnosed hyperlipidemia before a statin"}], "answer": ["B", "E", "F"], "explanation": "There is **no universal screening** (USPSTF: insufficient evidence), but AACE/ATA advise a TSH in **new hyperlipidemia before a statin**, thyroid disease is common in **Down and Turner syndrome**, and postpartum thyroiditis is easily mistaken for a **postpartum mood disorder**.", "objective": "", "remediation": {"steps": [{"teach": "**Hypothyroidism raises cholesterol**, and roughly 5% of patients with new hyperlipidemia are hypothyroid — treating the thyroid can resolve the lipids.", "stem": "Why is a TSH checked in new hyperlipidemia before a statin is started?", "options": [{"letter": "A", "text": "Statins falsely lower the TSH assay"}, {"letter": "B", "text": "Statins are contraindicated in all thyroid disease"}, {"letter": "C", "text": "Hypothyroidism can be the cause of the hyperlipidemia"}, {"letter": "D", "text": "A high TSH predicts statin myopathy"}], "answer": "C", "explanation": "About **5%** are hypothyroid, and 60% see the cholesterol resolve with thyroxine instead of a statin."}, {"teach": "Two chromosomal syndromes carry very high rates of thyroid disease, and one of them is rechecked on a schedule.", "stem": "Which chromosomal syndromes carry a high lifetime rate of thyroid disease?", "options": [{"letter": "A", "text": "Marfan and Ehlers-Danlos syndrome"}, {"letter": "B", "text": "Klinefelter and Noonan syndrome"}, {"letter": "C", "text": "Fragile X and Prader-Willi syndrome"}, {"letter": "D", "text": "Down and Turner syndrome"}], "answer": "D", "explanation": "Hypothyroidism is the MC endocrine problem in **Down syndrome**; **Turner syndrome** is checked at diagnosis and every 1–2 years.", "clarify": [{"stem": "Is universal thyroid screening of asymptomatic adults recommended?", "options": [{"letter": "A", "text": "Yes — every adult yearly"}, {"letter": "B", "text": "No — the evidence is insufficient"}], "answer": "B", "explanation": "USPSTF finds **insufficient evidence** for universal screening; keep a low threshold in high-risk groups instead."}]}, {"teach": "Thyroid symptoms after delivery get written off as new-parent exhaustion, so mood symptoms earn a TSH.", "stem": "Which test should be checked in a new mother with depression or anxiety after delivery?", "options": [{"letter": "A", "text": "ESR"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "Anti-thyroglobulin antibody"}, {"letter": "D", "text": "Free T3"}], "answer": "B", "explanation": "**Check a TSH** — postpartum thyroiditis is easily mistaken for a postpartum mood disorder."}], "checkpoints": [{"stem": "A 52-year-old presents with new carpal tunnel syndrome and fatigue — what should be checked?", "options": [{"letter": "A", "text": "A TSH level"}, {"letter": "B", "text": "An ESR"}, {"letter": "C", "text": "An RAIU scan"}, {"letter": "D", "text": "A thyroid ultrasound"}], "answer": "A", "explanation": "Carpal tunnel and peripheral neuropathy are on the lecture's **low-threshold TSH** list."}, {"stem": "Which additional history lowers the threshold for checking a TSH?", "options": [{"letter": "A", "text": "A remote ankle fracture"}, {"letter": "B", "text": "A penicillin allergy"}, {"letter": "C", "text": "A childhood tonsillectomy"}, {"letter": "D", "text": "Prior neck or upper-chest radiation"}], "answer": "D", "explanation": "**Neck or upper-chest radiation** (breast cancer, mediastinal lymphoma) raises later thyroid risk."}]}}, {"id": "4", "group": 4, "section": "Biotin interference", "topic": "Thyroid function tests (free T4 & patterns)", "skill": "Diagnostics & imaging", "stem": "What is the likely explanation for low TSH and high T4 in a patient without thyroid symptoms who takes hair and nail supplements?", "options": [{"letter": "A", "text": "Early Graves disease"}, {"letter": "B", "text": "Toxic multinodular goiter"}, {"letter": "C", "text": "Biotin assay interference"}, {"letter": "D", "text": "Subacute thyroiditis"}], "answer": "C", "explanation": "Mega-dose **biotin (vitamin B7)** interferes with the TSH/T4/T3 assays in a pattern that **mimics Graves** (low TSH, high T4) — suspect it when the labs look thyrotoxic but the patient has no symptoms.", "objective": "", "remediation": {"steps": [{"teach": "Hair and nail supplements contain **mega-dose biotin** (~10 mg versus a ~30 mcg daily requirement). The clue is **labs without symptoms**.", "stem": "A patient has thyrotoxic-looking labs but no symptoms at all — what should be suspected first?", "options": [{"letter": "A", "text": "True hyperthyroidism"}, {"letter": "B", "text": "Central hypothyroidism"}, {"letter": "C", "text": "Laboratory assay interference"}, {"letter": "D", " ", "text": "6 hours"}, {"letter": "D", "text": "48 hours"}], "answer": "D", "explanation": "Hold biotin supplements for **48 hours** before thyroid function testing, then repeat the panel.", "objective": "", "remediation": {"steps": [{"teach": "Biotin's effect on the assay wears off quickly — the lecture's hold time is measured in **days, not weeks**.", "stem": "Is the recommended biotin hold measured in hours, days, weeks or months?", "options": [{"letter": "A", "text": "About two days"}, {"letter": "B", "text": "About two hours"}, {"letter": "C", "text": "About two weeks"}, {"letter": "D", "text": "About two months"}], "answer": "A", "explanation": "**48 hours** is two days.", "clarify": [{"stem": "Biotin is which B vitamin?", "options": [{"letter": "A", "text": "Vitamin B7"}, {"letter": "B", "text": "Vitamin B12"}], "answer": "A", "explanation": "Biotin is **vitamin B7**."}]}], "checkpoints": [{"stem": "Repeat labs after a 48-hour biotin hold are completely normal — what does that confirm?", "options": [{"letter": "A", "text": "The patient has early Graves disease"}, {"letter": "B", "text": "The patient has subclinical hyperthyroidism"}, {"letter": "C", "text": "A thyroid ultrasound is now required"}, {"letter": "D", "text": "The first set reflected assay interference"}], "answer": "D", "explanation": "Normalization off biotin confirms the original panel was **assay interference**, not disease."}]}}, {"id": "5", "group": 5, "section": "TFT patterns", "topic": "Thyroid function tests (free T4 & patterns)", "skill": "Diagnostics & imaging", "stem": "What diagnosis is indicated by high TSH and low free T4?", "options": [{"letter": "A", "text": "Subclinical hypothyroidism"}, {"letter": "B", "text": "Primary hypothyroidism"}, {"letter": "C", "text": "Central hypothyroidism"}, {"letter": "D", "text": "Central hyperthyroidism"}], "answer": "B", "explanation": "**High TSH plus low free T4 is primary hypothyroidism** — the pituitary is responding appropriately to a gland th values low means the pituitary is **not** responding to a low hormone level — the red flag for **secondary (central) hypothyroidism**.", "objective": "", "remediation": {"steps": [{"teach": "With a healthy pituitary a **low T4 should drive the TSH up**. If the TSH is low too, the **pituitary itself** has failed.", "stem": "What should TSH do when the free T4 is low and the pituitary is healthy?", "options": [{"letter": "A", "text": "Fall"}, {"letter": "B", "text": "Stay unchanged"}, {"letter": "C", "text": "Rise"}, {"letter": "D", "text": "Become undetectable"}], "answer": "C", "explanation": "Feedback should make TSH **rise**; a low TSH means the pituitary is the problem.", "clarify": [{"stem": "Is a patient with a low free T4 functionally hypothyroid or hyperthyroid?", "options": [{"letter": "A", "text": "Hyperthyroid"}, {"letter": "B", "text": "Hypothyroid"}], "answer": "B", "explanation": "Low hormone means the patient is **hypothyroid**."}]}, {"teach": "The giveaway for central disease is that TSH and free T4 move in the **same** direction instead of opposite ones.", "stem": "Which laboratory relationship is the red flag for central thyroid disease?", "options": [{"letter": "A", "text": "TSH and free T4 moving in opposite directions"}, {"letter": "B", "text": "A normal TSH with a normal free T4"}, {"letter": "C", "text": "An isolated rise in total T4"}, {"letter": "D", "text": "TSH and free T4 moving in the same direction"}], "answer": "D", "explanation": "**Same-direction movement** of TSH and free T4 is the red flag for **central** disease."}], "checkpoints": [{"stem": "What rare condition explains a high TSH together with a high free T4?", "options": [{"letter": "A", "text": "Hashimoto's thyroiditis"}, {"letter": "B", "text": "A TSH-secreting pituitary adenoma"}, {"letter": "C", "text": "Subacute painful thyroiditis"}, {"letter": "D", "text": "A toxic multinodular goiter"}], "answer": "B", "explanation": "Both high means central **hyperthyroidism** — a **TSH-secreting pituitary adenoma** or partial thyroid hormone resistance."}, {"stem": "Which lesion is the classic cause of central hypothyroidism?", "options": [{"letter": "A", "text": "A toxic adenoma of the thyroid"}, {"letter": "B", "text": "Postpartum thyroiditis"}, {"letter": "C", "text": "A nonfunctioning pituitary adenoma with mass effect"}, {"letter": "D", "text": "Dietary iodine deficiency"}], "answer": "C", "explanation": "The DDx is **pituitary mass lesions**, CNS tumors, infiltrative disease (sarcoidosis, hemochromatosis), TBI and prior CNS radiation."}]}}, {"id": "7a", "group": 7, "section": "Secondary (central) thyroid disease", "topic": "Central (secondary) thyroid disease", "skill": "Diagnostics & imaging", "stem": "Which imaging study is best for a patient with suspected central thyroid disease?", "options": [{"letter": "A", "text": "Thyroid ultrasound"}, {"letter": "B", "text": "RAIU scan"}, {"letter": "C", "text": "Head CT"}, {"letter": "D", "text": "Brain MRI"}], "answer": "D", "explanation": "Central disease points at the pituitary, so the study is **brain imaging — MRI is best** — to look for a pituitary lesion.", "objective": "", "remediation": {"steps": [{"teach": "In central disease the lesion sits in the **pituitary**, so image the **brain**, not the neck.", "stem": "In central thyroid disease, which organ should be imaged?", "options": [{"letter": "A", "text": "The brain and pituitary"}, {"letter": "B", "text": "The adrenal glands"}, {"letter": "C", "text": "The ovaries"}, {"letter": "D", "text": "The thyroid gland"}], "answer": "A", "explanation": "Image the **pituitary**, not the thyroid.", "clarify": [{"stem": "Which imaging modality shows the pituitary gland best?", "options": [{"letter": "A", "text": "MRI"}, {"letter": "B", "text": "CT"}], "answer": "A", "explanation": "**MRI** is the modality of choice for the pituitary."}]}], "checkpoints": [{"stem": "A 60-year-old has a normal TSH with a low free T4 — what else should be evaluated?", "options": [{"letter": "A", "text": "Anti-TPO antibody titers"}, {"letter": "B", "text": "A thyroid ultrasound"}, {"letter": "C", "text": "The other pituitary hormone axes"}, {"letter": "D", "text": "An ESR and CRP"}], "answer": "C", "explanation": "Central hypothyroidism calls for imaging plus assessment of the **other pituitary axes** for hypopituitarism."}]}}, {"id": "8", "group": 8, "section": "Subclinical hypothyroidism — AACE", "topic": "Subclinical thyroid disease", "skill": "Management", "stem": "Which findings favor treating subclinical hypothyroidism rather than observing it?", "options": [{"letter": "A", "text": "An ESR above 50 mm/h"}, {"letter": "B", "text": "Current or planned pregnancy"}, {"letter": "C", "text": "A diffuse firm goiter"}, {"letter": "D", "text": "Age over 65 with no symptoms"}, {"letter": "E", "text": "Positive anti-TPO antibodies"}, {"letter": "F", "text": "A TSH above 10 mIU/L"}], "answer": ["B", "C", "E", "F"], "explanation": "AACE treats when the **TSH is above 10**, or when a TSH of **5–10 comes with positive anti-TPO or a goiter** (highest progression rates), and also considers treatment with **current or planned pregnancy**. Age over 65 is a criterion for subclinical *hyper*thyroidism, and a raised ESR belongs to painful thyroiditis.", "objective": "", "remediation": {"steps": [{"teach": "AACE draws the automatic-treat line at a TSH well above the normal upper limit — in **double digits**.", "stem": "At what TSH does AACE recommend treating subclinical hypothyroidism outright?", "options": [{"letter": "A", "text": "Above 2.5 mIU/L"}, {"letter": "B", "text": "Above 4.2 mIU/L"}, {"letter": "C", "text": "Above 7.5 mIU/L"}, {"letter": "D", "text": "Above 10 mIU/L"}], "answer": "D", "explanation": "The AACE threshold for treating on the number alone is **TSH > 10 mIU/L**.", "clarify": [{"stem": "What is the example upper limit of a normal adult TSH?", "options": [{"letter": "A", "text": "About 4.2 mIU/L"}, {"letter": "B", "text": "About 10 mIU/L"}], "answer": "A", "explanation": "The upper limit is about **4.2**, so a TSH of 10 is well beyond it."}]}, {"teach": "Between 5 and 10 the decision turns on **evidence of autoimmune thyroiditis** — a positive antibody or an enlarged gland.", "stem": "Which antibody predicts progression from subclinical to overt hypothyroidism?", "options": [{"letter": "A", "text": "Anti-mitochondrial antibody"}, {"letter": "B", "text": "Anti-TPO"}, {"letter": "C", "text": "TSI"}, {"letter": "D", "text": "Anti-nuclear antibody"}], "answer": "B", "explanation": "A positive **anti-TPO** raises progression from 2.1%/yr to **4.3%/yr**, which argues for treating."}, {"teach": "One more situation lowers the threshold regardless of the exact number, because maternal hormone matters to the fetus.", "stem": "In which situation is treatment considered even at a modestly raised TSH?", "options": [{"letter": "A", "text": "Seasonal allergic rhinitis"}, {"letter": "B", "text": "Current or planned pregnancy"}, {"letter": "C", "text": "A recent viral illness"}, {"letter": "D", "text": "A remote ankle injury"}], "answer": "B", "explanation": "AACE also considers treatment with **current or planned pregnancy**."}], "checkpoints": [{"stem": "A 75-year-old has a TSH of 12.5 with a normal free T4 — what does AACE advise?", "options": [{"letter": "A", "text": "Observe without treatment"}, {"letter": "B", "text": "Order an RAIU scan"}, {"letter": "C", "text": "Order a brain MRI"}, {"letter": "D", "text": "Start low-dose thyroxine and titrate"}], "answer": "D", "explanation": "A TSH above 10 meets the AACE threshold — start low (25–50 mcg/day) and titrate every 4–6 weeks."}, {"stem": "Which finding would instead argue for treating subclinical hyperthyroidism?", "options": [{"letter": "A", "text": "Positive anti-TPO antibodies"}, {"letter": "B", "text": "A TSH above 10 mIU/L"}, {"letter": "C", "text": "Age over 65 or osteoporosis"}, {"letter": "D", "text": "A planned pregnancy"}], "answer": "C", "explanation": "Subclinical hyperthyroidism is treated when the patient is significantly symptomatic, **over 65**, or has **cardiovascular disease or osteoporosis**."}]}}, {"id": "9", "group": 9, "section": "Subclinical hyperthyroidism", "topic": "Subclinical thyroid disease", "skill": "Disease process", "stem": "What is the most common cause of subclinical hyperthyroidism in a patient older than 65?", "options": [{"letter": "A", "text": "Toxic adenoma or toxic multinodular goiter"}, {"letter": "B", "text": "TSH-secreting adenoma"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "Subacute thyroiditis"}], "answer": "A", "explanation": "In older patients the most common causes are a **single toxic adenoma or a toxic multinodular goiter — not Graves**.", "objective": "", "remediation": {"steps": [{"teach": "In the **elderly** an autonomous **nodule** is the usual culprit; the lecture specifically says it is not the autoimmune cause.", "stem": "Where does the excess hormone usually come from in an older patient with subclinical hyperthyroidism?", "options": [{"letter": "A", "text": "An autonomously functioning nodule"}, {"letter": "B", "text": "Stimulating autoantibodies"}, {"letter": "C", "text": "Viral inflammation of the gland"}, {"letter": "D", "text": "A pituitary adenoma"}], "answer": "A", "explanation": "Hot **nodules** — a toxic adenoma or a toxic multinodular goiter.", "clarify": [{"stem": "Is Graves disease the usual cause of subclinical hyperthyroidism after age 65?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "The lecture explicitly says **not Graves** in this age group."}]}, {"teach": "Treatment is aimed at the **underlying cause**, and the criteria are about **cardiac and skeletal risk**, not the TSH number alone.", "stem": "Which patients does AACE recommend treating for subclinical hyperthyroidism?", "options": [{"letter": "A", "text": "Only patients under age 30"}, {"letter": "B", "text": "Only patients with positive anti-TPO"}, {"letter": "C", "text": "Age over 65, cardiovascular disease or osteoporosis"}, {"letter": "D", "text": "Anyone with a TSH below 0.4"}], "answer": "C", "explanation": "Treat if significantly symptomatic, **over 65**, or with **cardiovascular disease or osteoporosis**."}], "checkpoints": [{"stem": "Why does subclinical hyperthyroidism matter most in an older patient?", "options": [{"letter": "A", "text": "It causes rapid weight gain"}, {"letter": "B", "text": "It prevents statin therapy"}, {"letter": "C", "text": "It raises the ESR"}, {"letter": "D", "text": "It threatens the heart and the skeleton"}], "answer": "D", "explanation": "Untreated excess hormone drives **atrial fibrillation and bone loss**, which is why age, CV disease and osteoporosis set the treatment threshold."}]}}, {"id": "10", "group": 10, "section": "Thyroid autoantibodies", "topic": "Thyroid autoantibodies", "skill": "Disease process", "stem": "Which thyroid disorders generally have no associated autoantibodies?", "options": [{"letter": "A", "text": "Hashimoto's thyroiditis"}, {"letter": "B", "text": "Postpartum thyroiditis"}, {"letter": "C", "text": "Subacute painful (de Quervain's) thyroiditis"}, {"letter": "D", "text": "Graves disease"}, {"letter": "E", "text": "Toxic adenoma"}, {"letter": "F", "text": "Toxic multinodular goiter"}], "answer": ["C", "E", "F"], "explanation": "**No antibodies** are associated with **toxic multinodular goiter, toxic adenoma or de Quervain's thyroiditis** — those glands are autonomous or virally damaged, not autoimmune. Hashimoto's, Graves and postpartum thyroiditis all carry antibodies.", "objective": "", "remediation": {"steps": [{"teach": "Two thyroid diseases are classically **autoimmune**: **Hashimoto's** (hypothyroid) and **Graves** (hyperthyroid). **Postpartum thyroiditis** also carries antibodies.", "stem": "Which two thyroid diseases are the classic autoimmune ones?", "options": [{"letter": "A", "text": "Postpartum and subacute painful thyroiditis"}, {"letter": "B", "text": "Toxic adenoma and toxic multinodular goiter"}, {"letter": "C", "text": "De Quervain's and toxic adenoma"}, {"letter": "D", "text": "Hashimoto's and Graves"}], "answer": "D", "explanation": "**Hashimoto's** and **Graves** are the two autoimmune thyroid diseases.", "clarify": [{"stem": "Is postpartum thyroiditis usually anti-TPO positive?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "It is usually **anti-TPO positive** (60–85%), though the antibodies are often transient."}]}, {"teach": "A **nodular** gland is **autonomous**, not autoimmune — the nodule simply ignores the TSH signal and makes hormone on its own.", "stem": "Why does a toxic multinodular goiter carry no autoantibodies?", "options": [{"letter": "A", "text": "The antibodies are consumed by the nodules"}, {"letter": "B", "text": "The nodules function autonomously rather than autoimmunely"}, {"letter": "C", "text": "The assay cannot detect them in a goiter"}, {"letter": "D", "text": "The antibodies appear only after treatment"}], "answer": "B", "explanation": "Nodular disease is **autonomous**, so there is no antibody to find."}, {"teach": "De Quervain's is **post-viral inflammation**, which is why it raises an ESR but produces no antibody.", "stem": "What drives the gland damage in subacute painful thyroiditis?", "options": [{"letter": "A", "text": "Stimulating autoantibodies"}, {"letter": "B", "text": "An autonomous nodule"}, {"letter": "C", "text": "Post-viral inflammation"}, {"letter": "D", "text": "Pituitary overdrive"}], "answer": "C", "explanation": "It is a **viral or post-viral granulomatous inflammation**, not an autoimmune process."}], "checkpoints": [{"stem": "Which antibody is most useful for diagnosing Graves disease?", "options": [{"letter": "A", "text": "Anti-TPO"}, {"letter": "B", "text": "TSH-receptor stimulating antibody (TSI)"}, {"letter": "C", "text": "Anti-thyroglobulin"}, {"letter": "D", "text": "Anti-nuclear antibody"}], "answer": "B", "explanation": "**TSI (TRAb-stimulating)** is positive in about 90% of Graves disease."}, {"stem": "Which antibody pair points to Hashimoto's thyroiditis?", "options": [{"letter": "A", "text": "Anti-TPO and anti-thyroglobulin"}, {"letter": "B", "text": "TSI and anti-nuclear antibody"}, {"letter": "C", "text": "Anti-mitochondrial and anti-smooth muscle"}, {"letter": "D", "text": "Anti-TPO and TSI"}], "answer": "A", "explanation": "**Anti-TPO and anti-thyroglobulin** are the Hashimoto's antibodies."}]}}, {"id": "11", "group": 11, "section": "Anti-TPO antibodies", "topic": "Thyroid autoantibodies", "skill": "Diagnostics & imaging", "stem": "Which antibody is positive in approximately 95% of patients with Hashimoto thyroiditis?", "options": [{"letter": "A", "text": "Anti-TPO antibody"}, {"letter": "B", "text": "Anti-thyroglobulin antibody"}, {"letter": "C", "text": "TSI antibody"}, {"letter": "D", "text": "Antinuclear antibody"}], "answer": "A", "explanation": "Nearly all (~95%) patients with Hashimoto's have high **anti-thyroid peroxidase (anti-TPO)** antibodies.", "objective": "", "remediation": {"steps": [{"teach": "**Thyroid peroxidase** is the enzyme the gland uses to manufacture T3 and T4, and the antibody against it is the most sensitive Hashimoto's marker.", "stem": "What is thyroid peroxidase in normal thyroid physiology?", "options": [{"letter": "A", "text": "The TSH receptor on follicular cells"}, {"letter": "B", "text": "The protein that stores hormone in follicles"}, {"letter": "C", "text": "The enzyme used to make T3 and T4"}, {"letter": "D", "text": "The transporter that carries T4 in blood"}], "answer": "C", "explanation": "**TPO** is the enzyme used to manufacture T3 and T4.", "clarify": [{"stem": "Which protein serves as the base for T3 and T4 synthesis?", "options": [{"letter": "A", "text": "Thyroid peroxidase"}, {"letter": "B", "text": "Thyroglobulin"}], "answer": "B", "explanation": "**Thyroglobulin** is the protein base made by follicular cells and stored in the follicle lumen."}]}, {"teach": "Antibody testing rarely changes anything in a classic case — its value lies with the **subclinical** patient and the unexplained goiter.", "stem": "In which patient does an anti-TPO result actually change management?", "options": [{"letter": "A", "text": "One with a classic Hashimoto's picture"}, {"letter": "B", "text": "One with a toxic adenoma"}, {"letter": "C", "text": "One with de Quervain's thyroiditis"}, {"letter": "D", "text": "One with subclinical hypothyroidism"}], "answer": "D", "explanation": "In **subclinical hypothyroidism** a positive anti-TPO tips the decision toward treating."}], "checkpoints": [{"stem": "What does a positive anti-TPO mean in a patient with subclinical hypothyroidism?", "options": [{"letter": "A", "text": "Coexisting Graves disease"}, {"letter": "B", "text": "A need for an RAIU scan"}, {"letter": "C", "text": "Laboratory assay interference"}, {"letter": "D", "text": "A higher rate of progression to overt disease"}], "answer": "D", "explanation": "Positive anti-TPO predicts **progression to overt hypothyroidism** (4.3%/yr versus 2.1%/yr) and flags other autoimmune disease."}, {"stem": "Which antibody acts as a TSH-receptor agonist and drives hormone release?", "options": [{"letter": "A", "text": "Anti-TPO"}, {"letter": "B", "text": "Anti-thyroglobulin"}, {"letter": "C", "text": "TSH-receptor stimulating antibody (TSI)"}, {"letter": "D", "text": "Anti-nuclear antibody"}], "answer": "C", "explanation": "**TSI** behaves as a TSH-receptor agonist, which is why it causes Graves hyperthyroidism."}]}}, {"id": "12", "group": 12, "section": "Hashimoto's — most common cause", "topic": "Thyroid autoantibodies", "skill": "Disease process", "stem": "What is the most common cause of overt hypothyroidism in iodine-sufficient areas?", "options": [{"letter": "A", "text": "Pituitary adenoma"}, {"letter": "B", "text": "Hashimoto's thyroiditis"}, {"letter": "C", "text": "Subacute thyroiditis"}, {"letter": "D", "text": "Postpartum thyroiditis"}], "answer": "B", "explanation": "In iodine-sufficient areas **autoimmune (Hashimoto's) thyroiditis** is by far the most common cause of overt hypothyroidism, so antibody testing is often unnecessary.", "objective": "", "remediation": {"steps": [{"teach": "In iodine-sufficient countries the gland is usually destroyed by **autoimmunity**, not by a lack of iodine or by infection.", "stem": "What mechanism most often destroys the thyroid in iodine-sufficient countries?", "options": [{"letter": "A", "text": "Autoimmune thyroiditis"}, {"letter": "B", "text": "Iodine deficiency"}, {"letter": "C", "text": "Bacterial infection"}, {"letter": "D", "text": "Pituitary failure"}], "answer": "A", "explanation": "**Autoimmune thyroiditis** is by far the most common mechanism.", "clarify": [{"stem": "Does a classic Hashimoto's picture require antibody testing before treatment?", "options": [{"letter": "A", "text": "No — it can be treated presumptively"}, {"letter": "B", "text": "Yes — antibodies are required"}], "answer": "A", "explanation": "Patients with a classic picture can be **treated presumptively** with levothyroxine."}]}, {"teach": "The **hyperthyroid** side has its own most-common cause, and it is also autoimmune.", "stem": "What is the most common cause of hyperthyroidism overall?", "options": [{"letter": "A", "text": "Toxic multinodular goiter"}, {"letter": "B", "text": "Toxic adenoma"}, {"letter": "C", "text": "Subacute thyroiditis"}, {"letter": "D", "text": "Graves disease"}], "answer": "D", "explanation": "**Graves disease** is the most common cause of hyperthyroidism."}], "checkpoints": [{"stem": "Which treatment is started once overt hypothyroidism is confirmed?", "options": [{"letter": "A", "text": "Methimazole"}, {"letter": "B", "text": "Levothyroxine replacement"}, {"letter": "C", "text": "Radioactive iodine ablation"}, {"letter": "D", "text": "Propylthiouracil"}], "answer": "B", "explanation": "Overt hypothyroidism is treated with **levothyroxine**, roughly 1.6 mcg/kg/day in a healthy younger patient."}, {"stem": "Which autoimmune condition is the hyperthyroid counterpart of Hashimoto's thyroiditis?", "options": [{"letter": "A", "text": "Toxic adenoma"}, {"letter": "B", "text": "De Quervain's thyroiditis"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "Postpartum thyroiditis"}], "answer": "C", "explanation": "**Graves disease** is autoimmune hyperthyroidism."}]}}, {"id": "13", "group": 13, "section": "Levothyroxine monitoring", "topic": "Lab monitoring on therapy", "skill": "Diagnostics & imaging", "stem": "When should TSH be rechecked after starting levothyroxine or changing its dose?", "options": [{"letter": "A", "text": "1–2 weeks"}, {"letter": "B", "text": "3–6 months"}, {"letter": "C", "text": "12 months"}, {"letter": "D", "text": "4–6 weeks"}], "answer": "D", "explanation": "Repeat the **TSH 4–6 weeks** after starting replacement and 4–6 weeks after **any** dose adjustment.", "objective": "", "remediation": {"steps": [{"teach": "**T4 has a 5–7 day half-life**, so a new dose needs roughly six weeks to reach a steady state the TSH can reflect.", "stem": "Why is a TSH not rechecked one week after a levothyroxine dose change?", "options": [{"letter": "A", "text": "TSH is suppressed by the tablet itself"}, {"letter": "B", "text": "Levels have not reached steady state yet"}, {"letter": "C", "text": "Biotin interference lasts a week"}, {"letter": "D", "text": "The assay is unreliable that early"}], "answer": "B", "explanation": "The hormone has not reached **steady state**, so an early TSH misleads.", "clarify": [{"stem": "What is the approximate half-life of T4?", "options": [{"letter": "A", "text": "5–7 days"}, {"letter": "B", "text": "About 1 day"}], "answer": "A", "explanation": "T4's half-life is **5–7 days**; T3's is about 1 day."}]}, {"teach": "The same **4–6 week** interval applies after every change, and the dose moves in small steps.", "stem": "By how much is the levothyroxine dose usually adjusted at each step?", "options": [{"letter": "A", "text": "1–2 mcg"}, {"letter": "B", "text": "100–150 mcg"}, {"letter": "C", "text": "12–25 mcg"}, {"letter": "D", "text": "200–250 mcg"}], "answer": "C", "explanation": "Adjust in **12–25 mcg** increments and recheck in 4–6 weeks."}], "checkpoints": [{"stem": "Once a patient is stable on levothyroxine, how often is the TSH checked?", "options": [{"letter": "A", "text": "Only if the dose is changed"}, {"letter": "B", "text": "Every 4–6 weeks indefinitely"}, {"letter": "C", "text": "Every 2 weeks"}, {"letter": "D", "text": "Annually, or sooner if symptoms appear"}], "answer": "D", "explanation": "Once stable, check the TSH **annually** or sooner if symptoms return."}, {"stem": "A TSH six weeks after starting levothyroxine is still 10 — what should be done?", "options": [{"letter": "A", "text": "Order an RAIU scan"}, {"letter": "B", "text": "Decrease the dose and recheck in 6 weeks"}, {"letter": "C", "text": "Increase the dose and recheck in 6 weeks"}, {"letter": "D", "text": "Stop the levothyroxine"}], "answer": "C", "explanation": "A still-high TSH means **increase the dose** — after confirming adherence — and recheck in 6 weeks."}]}}, {"id": "13a", "group": 13, "section": "Levothyroxine monitoring", "topic": "Lab monitoring on therapy", "skill": "Management", "stem": "What is the target TSH for a patient receiving thyroid hormone replacement?", "options": [{"letter": "A", "text": "Upper end of the normal range"}, {"letter": "B", "text": "Lower end of the normal range"}, {"letter": "C", "text": "Below the normal range"}, {"letter": "D", "text": "Above the normal range"}], "answer": "B", "explanation": "Aim for normalization of the TSH, typically toward the **lower end of the normal reference range** (about 1–2).", "objective": "", "remediation": {"steps": [{"teach": "The goal is **normalization**, aiming low within the range without tipping the patient into suppression.", "stem": "What TSH value is typically aimed for on replacement therapy?", "options": [{"letter": "A", "text": "About 1–2 mIU/L"}, {"letter": "B", "text": "About 0.1 mIU/L"}, {"letter": "C", "text": "About 8 mIU/L"}, {"letter": "D", "text": "About 12 mIU/L"}], "answer": "A", "explanation": "The usual target is roughly **1–2 mIU/L**.", "clarify": [{"stem": "What does an over-suppressed TSH on replacement indicate?", "options": [{"letter": "A", "text": "Under-replacement"}, {"letter": "B", "text": "Iatrogenic hyperthyroidism"}], "answer": "B", "explanation": "Too much thyroxine produces **iatrogenic hyperthyroidism**."}]}], "checkpoints": [{"stem": "A patient on levothyroxine has a TSH of 0.3 — what is the next step?", "options": [{"letter": "A", "text": "Increase the dose and recheck in 6 weeks"}, {"letter": "B", "text": "Continue the current dose"}, {"letter": "C", "text": "Add methimazole"}, {"letter": "D", "text": "Reduce the dose and recheck in 6 weeks"}], "answer": "D", "explanation": "A suppressed TSH means over-replacement — **drop the dose** and recheck in 6 weeks."}]}}, {"id": "14", "group": 14, "section": "Methimazole monitoring", "topic": "Lab monitoring on therapy", "skill": "Diagnostics & imaging", "stem": "Which laboratory values should be followed every 4–6 weeks initially after starting methimazole for Graves disease?", "options": [{"letter": "A", "text": "Anti-TPO antibody"}, {"letter": "B", "text": "ESR and CRP"}, {"letter": "C", "text": "TSH alone"}, {"letter": "D", "text": "Free T4 and T3"}], "answer": "D", "explanation": "Use **serial free T4 and T3** every 4–6 weeks initially — follow the hormones, not the TSH, early in treatment.", "objective": "", "remediation": {"steps": [{"teach": "After months of thyrotoxicosis the pituitary stays **suppressed**, so an early TSH lags behind the patient.", "stem": "Why is the TSH unreliable in the first weeks of methimazole therapy?", "options": [{"letter": "A", "text": "It stays suppressed and lags behind the hormones"}, {"letter": "B", "text": "Methimazole interferes with the TSH assay"}, {"letter": "C", "text": "It rises far too quickly to interpret"}, {"letter": "D", "text": "It is only valid in hypothyroidism"}], "answer": "A", "explanation": "The suppressed pituitary takes time to recover, so **follow free T4 and T3** instead.", "clarify": [{"stem": "Which thionamide is preferred for Graves disease outside of pregnancy?", "options": [{"letter": "A", "text": "Propylthiouracil"}, {"letter": "B", "text": "Methimazole"}], "answer": "B", "explanation": "**Methimazole** is faster, more convenient and has fewer side effects, except in pregnancy."}]}, {"teach": "Once the hormone levels normalize the dose comes down and monitoring stretches out.", "stem": "What happens to the methimazole dose once the hormone levels normalize?", "options": [{"letter": "A", "text": "It is doubled"}, {"letter": "B", "text": "It is stopped immediately"}, {"letter": "C", "text": "It is left unchanged for two years"}, {"letter": "D", "text": "It is reduced by 30–50%"}], "answer": "D", "explanation": "Cut the dose by **30–50%** and keep rechecking every 4–6 weeks; once stable, TSH and free T4 every few months."}], "checkpoints": [{"stem": "What does it mean when TSI antibodies become undetectable during methimazole therapy?", "options": [{"letter": "A", "text": "The patient should switch to PTU"}, {"letter": "B", "text": "Immediate I-131 ablation is required"}, {"letter": "C", "text": "Tapering off the drug is reasonable"}, {"letter": "D", "text": "The dose should be doubled"}], "answer": "C", "explanation": "Falling or undetectable **TSI** is prognostic — tapering off is reasonable with hope of durable remission."}, {"stem": "How long does a typical course of thionamide therapy run in the United States?", "options": [{"letter": "A", "text": "1–2 years"}, {"letter": "B", "text": "2–4 weeks"}, {"letter": "C", "text": "About 3 months"}, {"letter": "D", "text": "At least 20 years"}], "answer": "A", "explanation": "The usual course is **1–2 years**, though long-term methimazole is safe if the patient prefers it."}]}}, {"id": "15", "group": 15, "section": "Subacute painful thyroiditis", "topic": "Subacute painful (de Quervain's) thyroiditis", "skill": "Identification", "stem": "Which findings support a diagnosis of subacute painful (de Quervain's) thyroiditis?", "options": [{"letter": "A", "text": "Onset a few weeks after a viral illness"}, {"letter": "B", "text": "Diffusely increased radioiodine uptake"}, {"letter": "C", "text": "Positive TSH-receptor stimulating antibodies"}, {"letter": "D", "text": "A painless gland three months after delivery"}, {"letter": "E", "text": "An exquisitely tender, enlarged gland"}, {"letter": "F", "text": "An ESR above 100 mm/h"}], "answer": ["A", "E", "F"], "explanation": "De Quervain's is **post-viral**: a **very tender** gland weeks after a URI with an **ESR over 50, often over 100**. It has **no autoantibodies**, and uptake is **low** rather than high; a painless gland after delivery is postpartum thyroiditis.", "objective": "", "remediation": {"steps": [{"teach": "The single most useful finding is **pain** — de Quervain's is the most common cause of a painful thyroid, and the pain is worse with swallowing, coughing or neck movement.", "stem": "What is the most common cause of a painful thyroid gland?", "options": [{"letter": "A", "text": "Hashimoto's thyroiditis"}, {"letter": "B", "text": "Subacute (de Quervain's) thyroiditis"}, {"letter": "C", "text": "Postpartum thyroiditis"}, {"letter": "D", "text": "Toxic multinodular goiter"}], "answer": "B", "explanation": "**Subacute painful (granulomatous) thyroiditis** is the MC cause of a painful thyroid, usually post-viral."}, {"teach": "The inflammation is **post-viral**, which is why the acute-phase reactants run so high and why no antibody is found.", "stem": "Which laboratory marker is dramatically elevated in de Quervain's thyroiditis?", "options": [{"letter": "A", "text": "Anti-thyroglobulin"}, {"letter": "B", "text": "Anti-TPO"}, {"letter": "C", "text": "ESR"}, {"letter": "D", "text": "TSI"}], "answer": "C", "explanation": "The **ESR** is strikingly high, usually above 50 and often above 100 mm/h.", "clarify": [{"stem": "Are autoantibodies associated with subacute painful thyroiditis?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "There is **no autoantibody association** in de Quervain's."}]}, {"teach": "The hyperthyroid phase is **leaked preformed hormone**, not new synthesis, so the scan is quiet.", "stem": "What radioiodine uptake is expected during the hyperthyroid phase of de Quervain's?", "options": [{"letter": "A", "text": "A single hot nodule"}, {"letter": "B", "text": "Multiple hot foci"}, {"letter": "C", "text": "Diffusely increased uptake"}, {"letter": "D", "text": "Low or absent uptake"}], "answer": "D", "explanation": "Damaged follicles release stored hormone, so the **RAIU is low**."}], "checkpoints": [{"stem": "A 32-year-old has severe anterior neck pain radiating to the ear three weeks after a cold — which test confirms the suspicion?", "options": [{"letter": "A", "text": "A TSI antibody level"}, {"letter": "B", "text": "A brain MRI"}, {"letter": "C", "text": "An ESR"}, {"letter": "D", "text": "An anti-thyroglobulin level"}], "answer": "C", "explanation": "The **ESR** (with CRP) confirms the clinical impression; the diagnosis itself rests on pain plus a tender gland."}, {"stem": "What is the typical course of subacute painful thyroiditis?", "options": [{"letter": "A", "text": "Hyper, then hypo, then euthyroid over 3–4 months"}, {"letter": "B", "text": "Hypo, then hyper, then euthyroid"}, {"letter": "C", "text": "Permanent hypothyroidism in every patient"}, {"letter": "D", "text": "Persistent hyperthyroidism for years"}], "answer": "A", "explanation": "The course is **triphasic — hyper, hypo, euthyroid** — with complete recovery in 3–4 months."}]}}, {"id": "15a", "group": 15, "section": "Subacute painful thyroiditis", "topic": "Subacute painful (de Quervain's) thyroiditis", "skill": "Diagnostics & imaging", "stem": "What ESR result is expected in a patient with a tender thyroid after a viral upper respiratory infection?", "options": [{"letter": "A", "text": "Low, under 5 mm/h"}, {"letter": "B", "text": "Normal, under 20 mm/h"}, {"letter": "C", "text": "Above 50 mm/h, often above 100"}, {"letter": "D", "text": "Mildly raised, 20–30 mm/h"}], "answer": "C", "explanation": "The ESR in subacute painful thyroiditis is usually **above 50 mm/h and often above 100 mm/h**.", "objective": "", "remediation": {"steps": [{"teach": "The ESR here is not borderline — it is **strikingly high**, which is part of what separates this from other thyroid disease.", "stem": "Is the ESR in subacute painful thyroiditis mildly or strikingly elevated?", "options": [{"letter": "A", "text": "Mildly elevated"}, {"letter": "B", "text": "Strikingly elevated"}], "answer": "B", "explanation": "Expect **over 50 mm/h, often over 100**.", "clarify": [{"stem": "Which other acute-phase marker also rises in de Quervain's?", "options": [{"letter": "A", "text": "CRP"}, {"letter": "B", "text": "Anti-TPO"}], "answer": "A", "explanation": "The **CRP** rises alongside the ESR."}]}, {"teach": "The labs support the picture, but they are not what makes the diagnosis.", "stem": "What is sufficient to make the diagnosis of subacute painful thyroiditis?", "options": [{"letter": "A", "text": "A positive anti-TPO result"}, {"letter": "B", "text": "A diffusely hot RAIU scan"}, {"letter": "C", "text": "An MRI of the pituitary"}, {"letter": "D", "text": "Neck pain with a tender gland on exam"}], "answer": "D", "explanation": "Subacute thyroiditis is a **clinical diagnosis** — neck pain plus a tender gland is enough; labs confirm."}], "checkpoints": [{"stem": "Which treatment is appropriate for the hyperthyroid phase of de Quervain's thyroiditis?", "options": [{"letter": "A", "text": "Methimazole"}, {"letter": "B", "text": "Radioactive iodine ablation"}, {"letter": "C", "text": "Symptomatic care with a beta-blocker"}, {"letter": "D", "text": "Levothyroxine"}], "answer": "C", "explanation": "No new hormone is being made, so antithyroid drugs are useless — use **symptomatic treatment such as a beta-blocker**."}]}}, {"id": "16", "group": 16, "section": "Postpartum thyroiditis", "topic": "Postpartum thyroiditis", "skill": "Identification", "stem": "What diagnosis is most likely when thyroiditis develops within 1 year after delivery and the gland is not tender?", "options": [{"letter": "A", "text": "Central hyperthyroidism"}, {"letter": "B", "text": "Subacute painful thyroiditis"}, {"letter": "C", "text": "Toxic adenoma"}, {"letter": "D", "text": "Postpartum thyroiditis"}], "answer": "D", "explanation": "**Postpartum thyroiditis** is a subacute thyroiditis with onset in the first year after childbirth, and the gland is **not painful** — that is the discriminator from de Quervain's.", "objective": "", "remediation": {"steps": [{"teach": "Both postpartum thyroiditis and de Quervain's are subacute thyroiditides with a triphasic course; the exam finding separates them.", "stem": "What distinguishes postpartum thyroiditis from de Quervain's thyroiditis on examination?", "options": [{"letter": "A", "text": "The gland is exquisitely tender"}, {"letter": "B", "text": "The gland is not palpable at all"}, {"letter": "C", "text": "A bruit is heard over the gland"}, {"letter": "D", "text": "The gland is painless"}], "answer": "D", "explanation": "Postpartum thyroiditis is **painless**; de Quervain's is exquisitely tender.", "clarify": [{"stem": "Which antibody is usually positive in postpartum thyroiditis?", "options": [{"letter": "A", "text": "Anti-TPO"}, {"letter": "B", "text": "TSI"}], "answer": "A", "explanation": "**Anti-TPO** is positive in 60–85%, usually transiently."}]}, {"teach": "Most women recover within 12–18 months, but a meaningful minority do not get their thyroid back.", "stem": "What proportion of women with postpartum thyroiditis become permanently hypothyroid?", "options": [{"letter": "A", "text": "1–2%"}, {"letter": "B", "text": "60–70%"}, {"letter": "C", "text": "Nearly all of them"}, {"letter": "D", "text": "20–30%"}], "answer": "D", "explanation": "**20–30%** are left permanently hypothyroid and need long-term levothyroxine."}], "checkpoints": [{"stem": "Which test should be checked in a new mother presenting with depression and fatigue?", "options": [{"letter": "A", "text": "ESR"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "Anti-thyroglobulin"}, {"letter": "D", "text": "Brain MRI"}], "answer": "B", "explanation": "Postpartum thyroiditis is easily mistaken for a postpartum mood disorder — **check a TSH**."}, {"stem": "What radioiodine uptake is expected during the hyperthyroid phase of postpartum thyroiditis?", "options": [{"letter": "A", "text": "Diffusely high uptake"}, {"letter": "B", "text": "A single hot nodule"}, {"letter": "C", "text": "Low uptake"}, {"letter": "D", "text": "Multiple hot foci"}], "answer": "C", "explanation": "Like de Quervain's, the hyperthyroid phase is **released preformed hormone**, so uptake is low."}]}}, {"id": "17", "group": 17, "section": "RAIU — interpretation", "topic": "RAIU scan", "skill": "Disease process", "stem": "What does high radioactive iodine uptake represent?", "options": [{"letter": "A", "text": "Release of preformed hormone"}, {"letter": "B", "text": "Exogenous hormone intake"}, {"letter": "C", "text": "New hormone synthesis"}, {"letter": "D", "text": "Destruction of thyroid tissue"}], "answer": "C", "explanation": "**High uptake means excessive de novo synthesis** of hormone (Graves, toxic multinodular goiter, toxic adenoma); low uptake means leakage of preformed hormone or exogenous hormone.", "objective": "", "remediation": {"steps": [{"teach": "The RAIU answers one question in a thyrotoxic patient, and every interpretation flows from it.", "stem": "What single question does an RAIU scan answer in a hyperthyroid patient?", "options": [{"letter": "A", "text": "Is the gland benign or malignant?"}, {"letter": "B", "text": "Is the pituitary or the thyroid at fault?"}, {"letter": "C", "text": "Is the gland making new hormone or leaking stored hormone?"}, {"letter": "D", "text": "Is the patient iodine deficient?"}], "answer": "C", "explanation": "High uptake means **new synthesis**; low uptake means **leaked or swallowed** hormone.", "clarify": [{"stem": "Does a damaged, leaking thyroid take up iodine avidly?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "A damaged gland is not synthesizing, so uptake is **low**."}]}, {"teach": "Iodine is the **raw material** for hormone synthesis, so only a gland that is actively building hormone pulls in the tracer.", "stem": "Why does an actively synthesizing thyroid take up radioiodine?", "options": [{"letter": "A", "text": "Iodine is the raw material for hormone synthesis"}, {"letter": "B", "text": "Iodine binds to the TSH receptor"}, {"letter": "C", "text": "Iodine is stored inside damaged follicles"}, {"letter": "D", "text": "Iodine is excreted by the thyroid"}], "answer": "A", "explanation": "The gland traps **iodine** to build T3 and T4, so synthesis equals uptake."}], "checkpoints": [{"stem": "Which diagnosis is indicated by one discrete hot nodule with suppression of the surrounding gland?", "options": [{"letter": "A", "text": "Toxic multinodular goiter"}, {"letter": "B", "text": "Postpartum thyroiditis"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "Toxic adenoma"}], "answer": "D", "explanation": "A single hot nodule with **suppressed extranodular tissue** is a **toxic adenoma**."}, {"stem": "Which diagnosis is indicated by an enlarged gland with intense, homogeneous, diffusely increased uptake?", "options": [{"letter": "A", "text": "Toxic adenoma"}, {"letter": "B", "text": "De Quervain's thyroiditis"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "Surreptitious levothyroxine use"}], "answer": "C", "explanation": "**Diffuse, homogeneous** increased uptake across an enlarged gland is classic **Graves disease**."}]}}, {"id": "18", "group": 18, "section": "RAIU — low uptake", "topic": "RAIU scan", "skill": "Identification", "stem": "Which causes of thyrotoxicosis produce low or absent radioactive iodine uptake?", "options": [{"letter": "A", "text": "Toxic multinodular goiter"}, {"letter": "B", "text": "Subacute painful (de Quervain's) thyroiditis"}, {"letter": "C", "text": "Graves disease"}, {"letter": "D", "text": "Toxic adenoma"}, {"letter": "E", "text": "Postpartum thyroiditis"}, {"letter": "F", "text": "Surreptitious thyroid hormone ingestion"}], "answer": ["B", "E", "F"], "explanation": "**Low or absent uptake** means the hormone is **preformed** — leaked from a damaged gland (**de Quervain's, postpartum thyroiditis**) or swallowed (**surreptitious thyroid hormone**, struma ovarii). Graves, toxic adenoma and toxic multinodular goiter all synthesize new hormone and take up avidly.", "objective": "", "remediation": {"steps": [{"teach": "Group the causes by mechanism: **destruction** releases stored hormone while the gland itself makes nothing.", "stem": "Which mechanism produces thyrotoxicosis with a low radioiodine uptake?", "options": [{"letter": "A", "text": "Pituitary overproduction of TSH"}, {"letter": "B", "text": "Dietary iodine deficiency"}, {"letter": "C", "text": "Excess new hormone synthesis"}, {"letter": "D", "text": "Release of preformed hormone from a damaged gland"}], "answer": "D", "explanation": "Low uptake means **preformed hormone** is leaking out, not being made."}, {"teach": "A swallowed hormone looks the same to the scanner, because the patient's own gland has shut down.", "stem": "Why is uptake low in a patient taking thyroid hormone surreptitiously?", "options": [{"letter": "A", "text": "The tablets block the gamma camera"}, {"letter": "B", "text": "Their own gland is suppressed by the exogenous hormone"}, {"letter": "C", "text": "The hormone destroys the thyroid follicles"}, {"letter": "D", "text": "The pituitary secretes extra TSH"}], "answer": "B", "explanation": "Exogenous hormone **suppresses** the patient's own gland, so it traps no tracer.", "clarify": [{"stem": "Does a patient taking thyroid hormone surreptitiously usually have a goiter?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Hyperthyroid labs with **low uptake and no goiter** should raise this possibility."}]}, {"teach": "The **high-uptake** group is the mirror image, and recognising it keeps the two lists separate.", "stem": "Which group of diagnoses produces high radioiodine uptake?", "options": [{"letter": "A", "text": "De Quervain's and postpartum thyroiditis"}, {"letter": "B", "text": "Surreptitious T4 and struma ovarii"}, {"letter": "C", "text": "Graves, toxic adenoma and toxic multinodular goiter"}, {"letter": "D", "text": "Central hypothyroidism and hypopituitarism"}], "answer": "C", "explanation": "Graves is diffuse, a toxic adenoma is one hot spot and a toxic multinodular goiter is multifocal."}], "checkpoints": [{"stem": "A woman is thyrotoxic four months after delivery with a painless gland — what uptake is expected?", "options": [{"letter": "A", "text": "Diffusely increased uptake"}, {"letter": "B", "text": "Low or absent uptake"}, {"letter": "C", "text": "A single hot nodule"}, {"letter": "D", "text": "Multiple hot foci"}], "answer": "B", "explanation": "The hyperthyroid phase of postpartum thyroiditis is released preformed hormone, so uptake is **low**."}, {"stem": "Which rare ectopic source can cause thyrotoxicosis with low thyroid uptake?", "options": [{"letter": "A", "text": "Struma ovarii"}, {"letter": "B", "text": "A TSH-secreting adenoma"}, {"letter": "C", "text": "A toxic adenoma"}, {"letter": "D", "text": "A parathyroid adenoma"}], "answer": "A", "explanation": "**Struma ovarii** — an ovarian teratoma that is more than half thyroid tissue — makes hormone outside the neck."}]}}, {"id": "19", "group": 19, "section": "Radioactive iodine — diagnosis vs ablation", "topic": "Radioactive iodine (diagnosis vs ablation)", "skill": "Diagnostics & imaging", "stem": "Which iodine isotope is used for a diagnostic uptake scan, and why is it chosen?", "options": [{"letter": "A", "text": "I-123, because it emits gamma radiation only"}, {"letter": "B", "text": "I-131, because it emits beta radiation"}, {"letter": "C", "text": "I-123, because it must be given intravenously"}, {"letter": "D", "text": "I-131, because it has a shorter half-life"}], "answer": "A", "explanation": "**I-123 is given orally and emits gamma radiation only**, so it images without destroying tissue — 123 diagnoses, 131 destroys.", "objective": "", "remediation": {"steps": [{"teach": "The two isotopes differ in what they emit: **I-123 gives off gamma only**, while **I-131 gives off gamma and beta**.", "stem": "Which radiation type makes I-131 capable of destroying thyroid tissue?", "options": [{"letter": "A", "text": "Gamma rays"}, {"letter": "B", "text": "Alpha particles"}, {"letter": "C", "text": "X-rays"}, {"letter": "D", "text": "Beta particles"}], "answer": "D", "explanation": "The **beta** emission destroys tissue, which is why I-131 is the ablation isotope.", "clarify": [{"stem": "How is the tracer given for an uptake scan?", "options": [{"letter": "A", "text": "Intravenously"}, {"letter": "B", "text": "Orally"}], "answer": "B", "explanation": "I-123 is taken **orally**."}, {"stem": "At what times is the gland imaged after the tracer dose?", "options": [{"letter": "A", "text": "At 6 and 24 hours"}, {"letter": "B", "text": "At 1 and 2 hours"}], "answer": "A", "explanation": "A gamma camera images the gland at **6 and 24 hours**."}]}, {"teach": "The measured uptake percentage is not only diagnostic — it feeds into treatment planning.", "stem": "What additional use does the measured uptake percentage have?", "options": [{"letter": "A", "text": "Estimating the free T4 level"}, {"letter": "B", "text": "Predicting antibody titers"}, {"letter": "C", "text": "Setting the levothyroxine dose"}, {"letter": "D", "text": "Calculating the I-131 ablation dose"}], "answer": "D", "explanation": "The percent uptake is sometimes used to **calculate the I-131 dose** for ablation."}], "checkpoints": [{"stem": "Which isotope is used to ablate an overactive thyroid gland?", "options": [{"letter": "A", "text": "I-131"}, {"letter": "B", "text": "I-123"}, {"letter": "C", "text": "Technetium-99m"}, {"letter": "D", "text": "Gallium-67"}], "answer": "A", "explanation": "**I-131** (gamma plus beta) is the ablation isotope: 123 diagnoses, 131 destroys."}]}}, {"id": "19a", "group": 19, "section": "Radioactive iodine — diagnosis vs ablation", "topic": "Radioactive iodine (diagnosis vs ablation)", "skill": "Management", "stem": "What is the expected long-term outcome after I-131 ablation for hyperthyroidism?", "options": [{"letter": "A", "text": "Return to normal function without medication"}, {"letter": "B", "text": "Permanent hyperthyroidism requiring methimazole"}, {"letter": "C", "text": "No lasting change in thyroid function"}, {"letter": "D", "text": "Permanent hypothyroidism needing lifelong levothyroxine"}], "answer": "D", "explanation": "Ablation destroys functioning thyroid tissue, so the hyperthyroidism is traded for **permanent hypothyroidism** managed with **lifelong levothyroxine** and TSH monitoring.", "objective": "", "remediation": {"steps": [{"teach": "The beta radiation **destroys** functioning follicular tissue — that is the point of the treatment, and it does not stop at 'just enough'.", "stem": "What happens to functioning thyroid tissue after I-131 ablation?", "options": [{"letter": "A", "text": "It is only temporarily suppressed"}, {"letter": "B", "text": "It regenerates within a few weeks"}, {"letter": "C", "text": "It is destroyed"}, {"letter": "D", "text": "It becomes autoimmune"}], "answer": "C", "explanation": "Functioning tissue is **destroyed**, which is why hypothyroidism follows.", "clarify": [{"stem": "Can thionamide therapy be stopped in order to proceed with radioiodine?", "options": [{"letter": "A", "text": "No, never"}, {"letter": "B", "text": "Yes, at any time"}], "answer": "B", "explanation": "Thionamides can be **stopped at any time** to proceed to radioiodine or surgery."}]}], "checkpoints": [{"stem": "Which monitoring does a patient need after radioiodine ablation?", "options": [{"letter": "A", "text": "Quarterly TSI antibody titers"}, {"letter": "B", "text": "Serial ESR measurements"}, {"letter": "C", "text": "Periodic TSH on levothyroxine replacement"}, {"letter": "D", "text": "Annual RAIU scans"}], "answer": "C", "explanation": "They need **lifelong levothyroxine with periodic TSH** checks, just like any hypothyroid patient."}]}}, {"id": "20", "group": 20, "section": "Thyroid ultrasound", "topic": "Thyroid ultrasound", "skill": "Diagnostics & imaging", "stem": "What is the imaging test of choice for a pregnant or breastfeeding patient who needs thyroid imaging?", "options": [{"letter": "A", "text": "I-131 whole-body scan"}, {"letter": "B", "text": "CT neck with contrast"}, {"letter": "C", "text": "Thyroid ultrasound"}, {"letter": "D", "text": "I-123 RAIU scan"}], "answer": "C", "explanation": "**Ultrasound** is the preferred imaging in pregnant or breastfeeding women, because they must not receive radioactive iodine.", "objective": "", "remediation": {"steps": [{"teach": "**Radioactive iodine is contraindicated in pregnancy and nursing** — both I-123 and I-131 — because it reaches the fetal or infant thyroid.", "stem": "Which imaging agents are contraindicated in a pregnant or nursing patient?", "options": [{"letter": "A", "text": "I-131 only"}, {"letter": "B", "text": "I-123 only"}, {"letter": "C", "text": "Neither one is contraindicated"}, {"letter": "D", "text": "Both I-123 and I-131"}], "answer": "D", "explanation": "**Both** isotopes are contraindicated; use ultrasound instead.", "clarify": [{"stem": "Does thyroid ultrasound involve any ionizing radiation?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "Ultrasound uses **no ionizing radiation**, which is why it is safe in pregnancy."}]}, {"teach": "Ultrasound answers an **anatomic** question, which also makes it the study for nodules and for FNA guidance.", "stem": "What kind of information does a thyroid ultrasound provide?", "options": [{"letter": "A", "text": "Anatomy, not thyroid function"}, {"letter": "B", "text": "Function, not anatomy"}, {"letter": "C", "text": "Both function and hormone levels"}, {"letter": "D", "text": "Pituitary anatomy"}], "answer": "A", "explanation": "Ultrasound gives **anatomy**; the RAIU gives **function**."}], "checkpoints": [{"stem": "Which diagnosis is suggested by a hypervascular thyroid inferno pattern on ultrasound?", "options": [{"letter": "A", "text": "De Quervain's thyroiditis"}, {"letter": "B", "text": "Postpartum thyroiditis"}, {"letter": "C", "text": "Hashimoto's thyroiditis"}, {"letter": "D", "text": "Graves disease"}], "answer": "D", "explanation": "A **\"thyroid inferno\"** — a hypervascular gland — suggests **Graves disease** and correlates with a thyroid bruit."}, {"stem": "Which antithyroid drug is preferred during pregnancy?", "options": [{"letter": "A", "text": "Radioiodine"}, {"letter": "B", "text": "Methimazole"}, {"letter": "C", "text": "Propylthiouracil"}, {"letter": "D", "text": "Levothyroxine"}], "answer": "C", "explanation": "**PTU** is preferred over methimazole in pregnancy — current ATA guidance narrows that to the **first trimester**, switching to methimazole afterward — and radioiodine is not an option at all."}]}}]};
