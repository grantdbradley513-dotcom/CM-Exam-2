<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "Rheumatology Approach-Concept_Adaptive_Exam", "questions": [{"id": "1", "group": 1, "section": "Synovial fluid & crystals", "topic": "Crystal-induced arthritis (CPPD)", "skill": "Diagnostics & imaging", "stem": "Synovial fluid: WBC 28,000 (94% PMN), Gram stain negative, rhomboid-shaped crystals that are positively birefringent and appear blue when parallel to the compensator → Diagnosis:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Pseudogout (CPPD)"}, {"letter": "C", "text": "Septic arthritis"}, {"letter": "D", "text": "Osteoarthritis"}, {"letter": "E", "text": "Reactive arthritis"}], "answer": "B", "explanation": "**Rhomboid, positively birefringent crystals (blue when parallel)** are calcium pyrophosphate — pseudogout. Gout crystals are needle-shaped, negatively birefringent, and yellow when parallel.", "objective": "", "remediation": {"steps": [{"teach": "Two crystal arthropathies are separated on polarized microscopy by **crystal shape and birefringence**. One crystal is long and needle-like; the other is short and rhomboid.", "stem": "Which crystal shape is described as rhomboid?", "options": [{"letter": "A", "text": "Monosodium urate"}, {"letter": "B", "text": "Calcium pyrophosphate"}, {"letter": "C", "text": "Cholesterol"}], "answer": "B", "explanation": "Calcium pyrophosphate (CPP) crystals are rhomboid; monosodium urate crystals are needle-shaped.", "clarify": [{"teach": "Birefringence is read by rotating the crystal relative to the compensator axis and noting its color.", "stem": "Under polarized light, a crystal that appears BLUE when parallel to the compensator is:", "options": [{"letter": "A", "text": "Positively birefringent"}, {"letter": "B", "text": "Negatively birefringent"}], "answer": "A", "explanation": "Blue-parallel = positive birefringence; yellow-parallel = negative birefringence."}]}, {"teach": "The fluid class also matters: a WBC of **10,000–50,000 with a negative Gram stain and visible crystals** defines crystal-induced fluid, not septic fluid.", "stem": "A WBC of 28,000 with a negative Gram stain and crystals present fits which fluid class?", "options": [{"letter": "A", "text": "Non-inflammatory"}, {"letter": "B", "text": "Crystal-induced"}, {"letter": "C", "text": "Infectious"}], "answer": "B", "explanation": "Crystal-induced fluid runs 10,000–50,000 WBC with a negative Gram stain; infectious fluid is >50,000 with a positive Gram stain or culture."}, {"teach": "Put it together: rhomboid + positively birefringent + blue parallel = **calcium pyrophosphate deposition (pseudogout)**.", "stem": "Rhomboid, positively birefringent crystals → Diagnosis:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Pseudogout (CPPD)"}, {"letter": "C", "text": "Septic arthritis"}], "answer": "B", "explanation": "Pseudogout. Gout = needle, negative, yellow parallel."}], "checkpoints": [{"stem": "Which synovial crystal description belongs to gout rather than pseudogout?", "options": [{"letter": "A", "text": "Rhomboid, positively birefringent"}, {"letter": "B", "text": "Needle-shaped, negatively birefringent"}, {"letter": "C", "text": "Rhomboid, blue when parallel"}, {"letter": "D", "text": "No crystals, positive Gram stain"}], "answer": "B", "explanation": "Gout (monosodium urate) = needle-shaped, negatively birefringent, yellow when parallel."}, {"stem": "A pseudogout crystal viewed PERPENDICULAR to the compensator appears:", "options": [{"letter": "A", "text": "Blue"}, {"letter": "B", "text": "Yellow"}, {"letter": "C", "text": "Colorless"}, {"letter": "D", "text": "Red"}], "answer": "B", "explanation": "CPP crystals are blue when parallel and yellow when perpendicular (the reverse of urate)."}]}}, {"id": "1a", "group": 1, "section": "Synovial fluid & crystals", "topic": "Crystal-induced arthritis (CPPD)", "skill": "Management", "stem": "For that acute pseudogout knee (Gram stain negative, crystals confirmed) → Best management:", "options": [{"letter": "A", "text": "Empiric IV antibiotics while awaiting culture results"}, {"letter": "B", "text": "Aspiration + intra-articular glucocorticoid"}, {"letter": "C", "text": "Serial radiographs and observation"}, {"letter": "D", "text": "Serum rheumatoid factor and ANA"}, {"letter": "E", "text": "Immediate surgical joint washout"}], "answer": "B", "explanation": "With infection excluded (negative Gram stain, crystals seen), the lecture answer is **thorough joint aspiration plus intra-articular glucocorticoid injection**. Steroid injection is only safe once a septic joint is off the table.", "objective": "", "remediation": {"steps": [{"teach": "Before injecting any joint, the one thing that must be excluded is **infection** — a septic joint must never receive intra-articular steroid.", "stem": "Which fluid result makes intra-articular steroid injection acceptable?", "options": [{"letter": "A", "text": "Positive Gram stain"}, {"letter": "B", "text": "Negative Gram stain with crystals"}, {"letter": "C", "text": "WBC >50,000, no crystals"}], "answer": "B", "explanation": "A negative Gram stain with crystals points to crystal arthritis; the other two results point to infection."}, {"teach": "Once crystal arthritis is confirmed, management of the acute joint is **local**: drain the effusion thoroughly and inject glucocorticoid into the joint.", "stem": "Confirmed acute pseudogout knee → Best management:", "options": [{"letter": "A", "text": "Aspirate thoroughly + intra-articular glucocorticoid"}, {"letter": "B", "text": "IV antibiotics"}, {"letter": "C", "text": "Surgical washout"}], "answer": "A", "explanation": "Thorough aspiration plus intra-articular glucocorticoid is the lecture's best management for acute CPPD."}], "checkpoints": [{"stem": "What must be true of the synovial fluid before a glucocorticoid is injected into a hot joint?", "options": [{"letter": "A", "text": "WBC must be >50,000"}, {"letter": "B", "text": "Infection must be excluded (Gram stain negative)"}, {"letter": "C", "text": "Crystals must be absent"}, {"letter": "D", "text": "Glucose must be low"}], "answer": "B", "explanation": "Never inject steroid into a possibly infected joint; a negative Gram stain is required first."}]}}, {"id": "2", "group": 2, "section": "Inflammatory vs non-inflammatory", "topic": "Inflammatory vs non-inflammatory arthritis", "skill": "Identification", "multi": true, "stem": "Which of the following are features of INFLAMMATORY arthritis?", "options": [{"letter": "A", "text": "Morning stiffness lasting longer than 60 minutes"}, {"letter": "B", "text": "Stiffness that worsens with immobility"}, {"letter": "C", "text": "Bony enlargement with minimal warmth"}, {"letter": "D", "text": "Synovial WBC >2,000/µL, neutrophil-predominant"}, {"letter": "E", "text": "Normal or minimally elevated ESR and CRP"}], "answers": ["A", "B", "D"], "explanation": "Inflammatory arthritis: **morning stiffness >60 min that worsens with immobility, constitutional symptoms, warm swollen joints, synovial WBC >2,000 (neutrophils in acute disease), and elevated ESR/CRP**. Bony enlargement and near-normal markers belong to non-inflammatory disease such as OA.", "objective": "", "remediation": {"steps": [{"teach": "Morning stiffness is the first discriminator. Inflammatory disease produces **prolonged stiffness that gets worse the longer the joint is still**; non-inflammatory disease produces brief stiffness.", "stem": "Morning stiffness lasting 90 minutes that worsens after sitting still points to:", "options": [{"letter": "A", "text": "Inflammatory arthritis"}, {"letter": "B", "text": "Non-inflammatory arthritis"}], "answer": "A", "explanation": "Inflammatory stiffness is >60 min and worsens with immobility; non-inflammatory stiffness is <30 min.", "clarify": [{"stem": "Non-inflammatory morning stiffness typically lasts:", "options": [{"letter": "A", "text": "Less than 30 minutes"}, {"letter": "B", "text": "More than 60 minutes"}], "answer": "A", "explanation": "Non-inflammatory stiffness is <30 min."}]}, {"teach": "Exam findings separate the two as well. **Erythema, warmth, soft-tissue swelling and effusion** signal inflammation; **bony enlargement without warmth** is the non-inflammatory (OA) picture.", "stem": "Bony enlargement of the joint with minimal warmth and no soft-tissue swelling is characteristic of:", "options": [{"letter": "A", "text": "Inflammatory arthritis"}, {"letter": "B", "text": "Non-inflammatory arthritis (OA)"}], "answer": "B", "explanation": "Bony enlargement is an OA (non-inflammatory) finding; inflammatory joints show warmth and soft-tissue swelling."}, {"teach": "Labs finish the picture: inflammatory arthritis has **synovial WBC >2,000 (neutrophils in acute inflammation), elevated ESR/CRP, and anemia of inflammation**. Non-inflammatory fluid is 200–2,000 WBC with monocytes and near-normal markers.", "stem": "Which lab pattern is inflammatory?", "options": [{"letter": "A", "text": "Synovial WBC 800, monocytes; normal CRP"}, {"letter": "B", "text": "Synovial WBC 9,000, neutrophils; elevated ESR/CRP"}, {"letter": "C", "text": "Synovial WBC 150, clear fluid"}], "answer": "B", "explanation": "WBC >2,000 with neutrophils and raised ESR/CRP is inflammatory; the others are non-inflammatory or normal."}], "checkpoints": [{"stem": "Which constitutional feature belongs to inflammatory rather than non-inflammatory arthritis?", "options": [{"letter": "A", "text": "Fever, fatigue, and malaise"}, {"letter": "B", "text": "Pain only with weight-bearing"}, {"letter": "C", "text": "Crepitus on motion"}, {"letter": "D", "text": "Stiffness under 30 minutes"}], "answer": "A", "explanation": "Constitutional symptoms (fever, fatigue, malaise) accompany inflammatory arthritis and are generally absent in non-inflammatory disease."}, {"stem": "In chronic (rather than acute) inflammatory arthritis, the predominant synovial fluid cell is the:", "options": [{"letter": "A", "text": "Neutrophil"}, {"letter": "B", "text": "Monocyte"}, {"letter": "C", "text": "Eosinophil"}, {"letter": "D", "text": "Erythrocyte"}], "answer": "B", "explanation": "Acute inflammation is neutrophil-predominant; chronic inflammation shifts to monocytes."}]}, "answer": "A,B,D"}, {"id": "3", "group": 3, "section": "Extra-articular findings", "topic": "Extra-articular findings — skin", "skill": "Identification", "stem": "Gottron papules over the MCP/PIP/DIP joints, heliotrope rash, and mechanic's hands → Diagnosis:", "options": [{"letter": "A", "text": "Systemic lupus erythematosus"}, {"letter": "B", "text": "Systemic sclerosis"}, {"letter": "C", "text": "Dermatomyositis"}, {"letter": "D", "text": "Psoriatic arthritis"}, {"letter": "E", "text": "Cutaneous vasculitis"}], "answer": "C", "explanation": "**Gottron papules, heliotrope rash, mechanic's hands, and abnormal nailfold capillaroscopy** are the skin signature of dermatomyositis. Lupus gives malar/discoid/photosensitive rashes; systemic sclerosis gives tight shiny skin with Raynaud.", "objective": "", "remediation": {"steps": [{"teach": "Skin findings often name the rheumatic disease. Each connective-tissue disease has its own **signature rash**: a butterfly rash over the cheeks, violaceous eyelids with knuckle papules, or tight shiny hard skin.", "stem": "A malar (butterfly) rash with photosensitivity and discoid plaques points to:", "options": [{"letter": "A", "text": "Lupus"}, {"letter": "B", "text": "Dermatomyositis"}, {"letter": "C", "text": "Systemic sclerosis"}], "answer": "A", "explanation": "Malar rash, SCLE, photosensitive rash, discoid lupus and alopecia are the lupus skin findings.", "clarify": [{"stem": "Tight, shiny, hard skin with ulcers and Raynaud phenomenon points to:", "options": [{"letter": "A", "text": "Systemic sclerosis"}, {"letter": "B", "text": "Psoriatic arthritis"}], "answer": "A", "explanation": "Skin tightening with Raynaud and abnormal nailfold capillaries is systemic sclerosis."}]}, {"teach": "Papules over the knuckles plus a violaceous rash of the upper eyelids are the two hallmark cutaneous findings of one specific inflammatory myopathy.", "stem": "Gottron papules + heliotrope rash → Diagnosis:", "options": [{"letter": "A", "text": "Dermatomyositis"}, {"letter": "B", "text": "Lupus"}, {"letter": "C", "text": "Vasculitis"}], "answer": "A", "explanation": "Gottron papules and heliotrope rash are pathognomonic for dermatomyositis."}], "checkpoints": [{"stem": "Scaly plaques on extensor surfaces with nail pitting and onycholysis point to which arthritis?", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Psoriatic arthritis"}, {"letter": "C", "text": "Dermatomyositis"}, {"letter": "D", "text": "Lyme disease"}], "answer": "B", "explanation": "Plaque psoriasis on extensor surfaces, nail pitting and onycholysis are the skin clues to psoriatic arthritis."}, {"stem": "Palpable purpura on the legs is the skin clue to:", "options": [{"letter": "A", "text": "Vasculitis"}, {"letter": "B", "text": "Osteoarthritis"}, {"letter": "C", "text": "Fibromyalgia"}, {"letter": "D", "text": "Gout"}], "answer": "A", "explanation": "Palpable purpura, nodules and ulcers point to vasculitis."}]}}, {"id": "4", "group": 4, "section": "Diagnostic workup", "topic": "ESR", "skill": "Diagnostics & imaging", "stem": "Upper limit of normal ESR for a WOMAN, by age → Formula:", "options": [{"letter": "A", "text": "Age ÷ 2"}, {"letter": "B", "text": "(Age + 10) ÷ 2"}, {"letter": "C", "text": "Age × 2"}, {"letter": "D", "text": "Age − 10"}, {"letter": "E", "text": "Fixed at 20 mm/hr"}], "answer": "B", "explanation": "ESR upper limit of normal: **men = age/2; women = (age + 10)/2**. ESR >100 mm/hr should raise GCA, PMR, multiple myeloma, cancer, or overwhelming inflammation.", "objective": "", "remediation": {"steps": [{"teach": "ESR rises with age and is a little higher in women, so the upper limit of normal is an **age-based formula that differs by sex**.", "stem": "The upper limit of normal ESR for a MAN is:", "options": [{"letter": "A", "text": "Age ÷ 2"}, {"letter": "B", "text": "Age × 2"}, {"letter": "C", "text": "Always 15 mm/hr"}], "answer": "A", "explanation": "Men: age/2.", "clarify": [{"stem": "Compared with a man of the same age, a woman's upper limit of normal ESR is:", "options": [{"letter": "A", "text": "Higher"}, {"letter": "B", "text": "Lower"}], "answer": "A", "explanation": "The female formula adds 10 to the age before halving, so the limit is higher."}]}, {"teach": "For women the age is adjusted upward by 10 years before halving.", "stem": "Upper limit of normal ESR for a woman → Formula:", "options": [{"letter": "A", "text": "(Age + 10) ÷ 2"}, {"letter": "B", "text": "Age ÷ 2"}, {"letter": "C", "text": "Age + 10"}], "answer": "A", "explanation": "Women: (age + 10)/2."}], "checkpoints": [{"stem": "An ESR above 100 mm/hr should prompt consideration of which group of conditions?", "options": [{"letter": "A", "text": "Osteoarthritis and fibromyalgia"}, {"letter": "B", "text": "GCA, PMR, multiple myeloma, cancer"}, {"letter": "C", "text": "Periarticular bursitis"}, {"letter": "D", "text": "Low-titer ANA in a healthy person"}], "answer": "B", "explanation": "ESR >100 → giant cell arteritis, polymyalgia rheumatica, multiple myeloma, cancer, or overwhelming inflammation."}, {"stem": "What does the ESR actually measure?", "options": [{"letter": "A", "text": "Hepatic production of an acute-phase protein"}, {"letter": "B", "text": "The rate erythrocytes fall in anticoagulated plasma"}, {"letter": "C", "text": "IgM antibody against IgG"}, {"letter": "D", "text": "Antibodies against nuclear antigens"}], "answer": "B", "explanation": "ESR measures the fall of red cells in anticoagulated plasma; acute-phase reactants neutralize the RBC negative surface charge and speed the fall."}]}}, {"id": "5", "group": 5, "section": "Articular vs non-articular", "topic": "Articular vs periarticular pain", "skill": "Identification", "stem": "Deep, diffuse joint pain present with BOTH active and passive range of motion, with effusion → Source of pain:", "options": [{"letter": "A", "text": "Articular joint structures"}, {"letter": "B", "text": "Periarticular tendon sheath"}, {"letter": "C", "text": "Periarticular bursa"}, {"letter": "D", "text": "Adjacent muscle"}, {"letter": "E", "text": "Periosteum of adjacent bone"}], "answer": "A", "explanation": "**Articular pain is deep and diffuse, hurts with both active and passive ROM, and commonly has effusion or synovial swelling.** Periarticular pain is point-tender, painless on passive ROM, and rarely has effusion.", "objective": "", "remediation": {"steps": [{"teach": "The exam discriminator is **passive range of motion**. When the examiner moves the joint, tendons, bursae and muscles are unloaded — so periarticular structures do not hurt on passive motion, but a diseased joint does.", "stem": "Pain reproduced when the EXAMINER moves the joint (passive ROM) localizes the problem to:", "options": [{"letter": "A", "text": "The joint itself (articular)"}, {"letter": "B", "text": "Tendon or bursa (periarticular)"}], "answer": "A", "explanation": "Passive ROM pain = articular; periarticular pain hurts only when the patient moves it.", "clarify": [{"stem": "Point tenderness over a single spot with painless passive ROM is typical of:", "options": [{"letter": "A", "text": "Periarticular pain"}, {"letter": "B", "text": "Articular pain"}], "answer": "A", "explanation": "Point tenderness with painless passive ROM = periarticular (tendon, bursa, ligament)."}]}, {"teach": "Effusion is the second clue: **joint effusion or synovial swelling is common in articular disease and uncommon in periarticular disease**.", "stem": "Deep diffuse pain, pain on active AND passive ROM, effusion present → Source:", "options": [{"letter": "A", "text": "Articular"}, {"letter": "B", "text": "Periarticular"}], "answer": "A", "explanation": "All three features — diffuse deep pain, passive-ROM pain, and effusion — are articular."}], "checkpoints": [{"stem": "Which structure is PERIARTICULAR?", "options": [{"letter": "A", "text": "Synovium"}, {"letter": "B", "text": "Articular cartilage"}, {"letter": "C", "text": "Bursa"}, {"letter": "D", "text": "Joint capsule"}], "answer": "C", "explanation": "Bursae, tendons, ligaments, muscle and bone are periarticular; synovium, cartilage and capsule are articular."}, {"stem": "Why is passive range of motion painless in periarticular disease?", "options": [{"letter": "A", "text": "The joint capsule is anesthetized by effusion"}, {"letter": "B", "text": "Tendons and bursae are unloaded when the examiner moves the joint"}, {"letter": "C", "text": "Periarticular structures lack nerve supply"}, {"letter": "D", "text": "Passive motion does not move the joint surfaces"}], "answer": "B", "explanation": "Periarticular structures are unloaded during examiner-driven motion, so they do not hurt."}]}}, {"id": "6", "group": 6, "section": "Synovial fluid & crystals", "topic": "Synovial fluid analysis", "skill": "Diagnostics & imaging", "multi": true, "stem": "Which synovial fluid findings are consistent with a SEPTIC joint?", "options": [{"letter": "A", "text": "WBC greater than 50,000/µL"}, {"letter": "B", "text": "Positive Gram stain or culture"}, {"letter": "C", "text": "Clear, transparent yellow fluid"}, {"letter": "D", "text": "WBC between 200 and 2,000/µL"}, {"letter": "E", "text": "Opaque yellow or white fluid"}], "answers": ["A", "B", "E"], "explanation": "Infectious fluid is **opaque yellow/white with WBC >50,000 and a positive Gram stain or culture**. Clear transparent fluid with WBC 200–2,000 is non-inflammatory (OA, trauma).", "objective": "", "remediation": {"steps": [{"teach": "Synovial fluid is classed by **appearance and WBC count**. Normal and non-inflammatory fluid is clear and transparent; inflammatory, crystal and infectious fluid is opaque yellow or white.", "stem": "Clear, transparent yellow fluid with WBC 1,200 belongs to which class?", "options": [{"letter": "A", "text": "Non-inflammatory"}, {"letter": "B", "text": "Infectious"}, {"letter": "C", "text": "Crystal-induced"}], "answer": "A", "explanation": "Clear fluid with WBC 200–2,000 is non-inflammatory (OA, trauma).", "clarify": [{"stem": "Normal synovial fluid WBC is:", "options": [{"letter": "A", "text": "Less than 200/µL"}, {"letter": "B", "text": "2,000–20,000/µL"}], "answer": "A", "explanation": "Normal <200; non-inflammatory 200–2,000."}]}, {"teach": "The WBC thresholds climb by class: inflammatory **2,000–20,000**, crystal-induced **10,000–50,000**, infectious **>50,000**.", "stem": "Which WBC count is the threshold for infectious fluid?", "options": [{"letter": "A", "text": ">2,000"}, {"letter": "B", "text": ">20,000"}, {"letter": "C", "text": ">50,000"}], "answer": "C", "explanation": "Infectious fluid is >50,000 WBC; crystal fluid overlaps at 10,000–50,000."}, {"teach": "The decisive finding for infection is the **Gram stain or culture**: positive = septic joint. Crystal fluid has a negative Gram stain with crystals present.", "stem": "Opaque fluid, WBC 80,000, Gram stain positive → Class:", "options": [{"letter": "A", "text": "Infectious (septic joint)"}, {"letter": "B", "text": "Crystal-induced"}, {"letter": "C", "text": "Inflammatory"}], "answer": "A", "explanation": "WBC >50,000 plus a positive Gram stain = septic joint."}], "checkpoints": [{"stem": "Which fluid finding separates crystal-induced from infectious synovial fluid when the WBC is 40,000?", "options": [{"letter": "A", "text": "Fluid color"}, {"letter": "B", "text": "Negative Gram stain with crystals present"}, {"letter": "C", "text": "Fluid transparency"}, {"letter": "D", "text": "Monocyte predominance"}], "answer": "B", "explanation": "Both classes are opaque with overlapping WBC; crystal fluid has a negative Gram stain and visible crystals, septic fluid a positive Gram stain/culture."}, {"stem": "Inflammatory (RA, SpA, CTD) synovial fluid typically has a WBC of:", "options": [{"letter": "A", "text": "<200"}, {"letter": "B", "text": "200–2,000"}, {"letter": "C", "text": "2,000–20,000"}, {"letter": "D", "text": ">50,000"}], "answer": "C", "explanation": "Inflammatory fluid is 2,000–20,000 WBC with a negative Gram stain."}]}, "answer": "A,B,E"}, {"id": "7", "group": 7, "section": "Patterns of joint disease", "topic": "Patterns of joint disease", "skill": "Identification", "stem": "Which condition classically produces a MIGRATORY arthritis — inflammation that moves from joint to joint?", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Ankylosing spondylitis"}, {"letter": "C", "text": "Gonococcal arthritis"}, {"letter": "D", "text": "Psoriatic arthritis"}, {"letter": "E", "text": "Reactive arthritis"}], "answer": "C", "explanation": "**Migratory → acute rheumatic fever, gonococcal arthritis, Lyme disease, palindromic rheumatism.** RA, AS, PsA and reactive arthritis are ADDITIVE — new joints are added to those already inflamed.", "objective": "", "remediation": {"steps": [{"teach": "Two temporal patterns are tested. In one, inflammation **leaves one joint and appears in another**; in the other, **new joints join the ones already inflamed**.", "stem": "Inflammation that resolves in the knee and then appears in the wrist, then the ankle, is called:", "options": [{"letter": "A", "text": "Migratory"}, {"letter": "B", "text": "Additive"}, {"letter": "C", "text": "Recruitment"}], "answer": "A", "explanation": "Migratory = inflammation moves from joint to joint. Additive = joints accumulate. Recruitment is a cellular process, not a joint pattern.", "clarify": [{"stem": "'Recruitment' in rheumatology refers to:", "options": [{"letter": "A", "text": "White cells drawn from blood into the inflamed joint"}, {"letter": "B", "text": "Arthritis spreading to adjacent joints"}], "answer": "A", "explanation": "Recruitment is a process (immune cells drawn to inflammation), not a pattern of joint involvement."}]}, {"teach": "The migratory list is short and infectious/post-infectious in flavor: **rheumatic fever, gonococcal, Lyme, palindromic rheumatism**. The additive list is the chronic inflammatory arthritides.", "stem": "Which disease is on the MIGRATORY list?", "options": [{"letter": "A", "text": "Lyme disease"}, {"letter": "B", "text": "Rheumatoid arthritis"}, {"letter": "C", "text": "Psoriatic arthritis"}], "answer": "A", "explanation": "Lyme is migratory; RA and PsA are additive."}], "checkpoints": [{"stem": "Which pattern describes rheumatoid arthritis, AS, psoriatic and reactive arthritis?", "options": [{"letter": "A", "text": "Migratory"}, {"letter": "B", "text": "Additive"}, {"letter": "C", "text": "Recruitment"}, {"letter": "D", "text": "Palindromic"}], "answer": "B", "explanation": "These are additive arthritides — more joints are added to those already involved."}, {"stem": "Acute rheumatic fever produces which joint pattern?", "options": [{"letter": "A", "text": "Additive polyarthritis"}, {"letter": "B", "text": "Migratory arthritis"}, {"letter": "C", "text": "Axial-only disease"}, {"letter": "D", "text": "Fixed monoarthritis"}], "answer": "B", "explanation": "Acute rheumatic fever is a classic migratory arthritis."}]}}, {"id": "8", "group": 8, "section": "Diagnostic workup", "topic": "Anti-CCP", "skill": "Diagnostics & imaging", "stem": "Which RA serology is highly SPECIFIC (~95%) but less sensitive (~67%)?", "options": [{"letter": "A", "text": "Rheumatoid factor"}, {"letter": "B", "text": "Anti-CCP antibody"}, {"letter": "C", "text": "Antinuclear antibody"}, {"letter": "D", "text": "C-reactive protein"}, {"letter": "E", "text": "Anti-dsDNA antibody"}], "answer": "B", "explanation": "**Anti-CCP is 95% specific for RA** (SPIN — a positive rules it in) but only 67% sensitive. RF is present in <70% of RA and is nonspecific (SBE, hepatitis C).", "objective": "", "remediation": {"steps": [{"teach": "Two antibodies are used for RA. One is an **IgM against the Fc portion of IgG**, found in under 70% of RA and in several non-rheumatic conditions. The other is far more **specific**.", "stem": "The IgM antibody directed against the Fc portion of IgG is:", "options": [{"letter": "A", "text": "Rheumatoid factor"}, {"letter": "B", "text": "Anti-CCP"}, {"letter": "C", "text": "ANA"}], "answer": "A", "explanation": "Rheumatoid factor = IgM anti-Fc of IgG; present in <70% of RA and not specific.", "clarify": [{"stem": "A test with high SPECIFICITY is most useful for:", "options": [{"letter": "A", "text": "Ruling a diagnosis IN when positive (SPIN)"}, {"letter": "B", "text": "Ruling a diagnosis OUT when negative"}], "answer": "A", "explanation": "SPIN: specific test, positive rules IN. SNOUT: sensitive test, negative rules OUT."}]}, {"teach": "The more specific RA antibody targets citrullinated peptides; a positive result **rules RA in**, though a negative result cannot exclude it (sensitivity only 67%).", "stem": "RA serology that is 95% specific but only 67% sensitive:", "options": [{"letter": "A", "text": "Anti-CCP"}, {"letter": "B", "text": "Rheumatoid factor"}, {"letter": "C", "text": "ANA"}], "answer": "A", "explanation": "Anti-CCP: 95% specific, 67% sensitive."}], "checkpoints": [{"stem": "A negative result on a highly SENSITIVE test is best used to:", "options": [{"letter": "A", "text": "Rule the diagnosis in"}, {"letter": "B", "text": "Rule the diagnosis out (SNOUT)"}, {"letter": "C", "text": "Confirm erosive disease"}, {"letter": "D", "text": "Replace synovial fluid analysis"}], "answer": "B", "explanation": "SNOUT — a sensitive test, when negative, rules the disease out."}, {"stem": "Approximately what fraction of RA patients are rheumatoid-factor positive?", "options": [{"letter": "A", "text": "Fewer than 70%"}, {"letter": "B", "text": "Over 95%"}, {"letter": "C", "text": "About 5%"}, {"letter": "D", "text": "Essentially all"}], "answer": "A", "explanation": "RF is present in <70% of RA patients."}]}}, {"id": "8a", "group": 8, "section": "Diagnostic workup", "topic": "Anti-CCP", "skill": "Complications", "stem": "Anti-CCP-positive rheumatoid arthritis predicts what course?", "options": [{"letter": "A", "text": "Milder, self-limited joint disease"}, {"letter": "B", "text": "More rapid erosive joint damage"}, {"letter": "C", "text": "Isolated axial involvement"}, {"letter": "D", "text": "Migratory joint pattern"}, {"letter": "E", "text": "Spontaneous seroconversion"}], "answer": "B", "explanation": "**CCP-positive RA → more rapid erosive joint damage.** The antibody is both diagnostic (specific) and prognostic.", "objective": "", "remediation": {"steps": [{"teach": "Beyond diagnosis, anti-CCP carries **prognostic** weight — its presence marks a more aggressive, destructive phenotype.", "stem": "Compared with CCP-negative RA, CCP-positive RA tends to show:", "options": [{"letter": "A", "text": "Faster structural (erosive) damage"}, {"letter": "B", "text": "Less joint damage over time"}], "answer": "A", "explanation": "CCP-positive RA is associated with more rapid erosive joint damage."}], "checkpoints": [{"stem": "The erosions seen in aggressive RA are produced by local activation of which cells?", "options": [{"letter": "A", "text": "Osteoblasts"}, {"letter": "B", "text": "Osteoclasts"}, {"letter": "C", "text": "Chondrocytes"}, {"letter": "D", "text": "Erythrocytes"}], "answer": "B", "explanation": "Cytokines (IL-1, IL-6, TNF-α) activate osteoclasts → erosions and periarticular osteopenia."}]}}, {"id": "9", "group": 9, "section": "Joint destruction", "topic": "Inflammatory joint destruction", "skill": "Disease process", "stem": "The proliferating inflammatory synovial tissue that invades cartilage and bone in rheumatoid arthritis is called:", "options": [{"letter": "A", "text": "Enthesis"}, {"letter": "B", "text": "Tophus"}, {"letter": "C", "text": "Pannus"}, {"letter": "D", "text": "Osteophyte"}, {"letter": "E", "text": "Bursa"}], "answer": "C", "explanation": "**Pannus** = proliferating inflammatory synovium that invades cartilage and bone. Enthesis is the tendon/ligament insertion (target in spondyloarthritis); osteophytes are OA bone spurs.", "objective": "", "remediation": {"steps": [{"teach": "In RA the problem starts in the **synovial membrane**: it becomes swollen and inflamed and then proliferates. In OA, by contrast, the primary change is **thinned cartilage** with bone rubbing on bone.", "stem": "Which structure is primarily inflamed and proliferating in rheumatoid arthritis?", "options": [{"letter": "A", "text": "Synovial membrane"}, {"letter": "B", "text": "Articular cartilage only"}, {"letter": "C", "text": "Tendon insertion"}], "answer": "A", "explanation": "RA = swollen, inflamed synovial membrane → bone erosion. OA = thinned cartilage (wear-and-tear).", "clarify": [{"stem": "Osteoarthritis is best described as:", "options": [{"letter": "A", "text": "Wear-and-tear cartilage thinning, not synovial inflammation"}, {"letter": "B", "text": "Primary synovial inflammation"}], "answer": "A", "explanation": "OA is thinned cartilage with bone ends rubbing together."}]}, {"teach": "The proliferated synovial tissue has a specific name; it behaves like an invasive mass that eats into cartilage and bone.", "stem": "Proliferating inflammatory synovium invading cartilage and bone → Term:", "options": [{"letter": "A", "text": "Pannus"}, {"letter": "B", "text": "Osteophyte"}, {"letter": "C", "text": "Enthesis"}], "answer": "A", "explanation": "Pannus."}], "checkpoints": [{"stem": "The enthesis — the site where tendon or ligament inserts into bone — is the primary target in:", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Spondyloarthritis"}, {"letter": "C", "text": "Gout"}, {"letter": "D", "text": "Fibromyalgia"}], "answer": "B", "explanation": "The enthesis is the target in spondyloarthritis."}, {"stem": "Which cytokine trio drives the RA inflammatory cascade?", "options": [{"letter": "A", "text": "IL-1, IL-6, TNF-α"}, {"letter": "B", "text": "IgM, IgG, IgA"}, {"letter": "C", "text": "ESR, CRP, RF"}, {"letter": "D", "text": "Insulin, glucagon, cortisol"}], "answer": "A", "explanation": "IL-1, IL-6 and TNF-α are the cytokines named in the cascade."}]}}, {"id": "10", "group": 10, "section": "Diagnostic workup", "topic": "Rheumatoid factor", "skill": "Diagnostics & imaging", "multi": true, "stem": "A positive rheumatoid factor without synovitis is nonspecific. In which of the following can RF be positive WITHOUT rheumatoid arthritis?", "options": [{"letter": "A", "text": "Subacute bacterial endocarditis"}, {"letter": "B", "text": "Hepatitis C infection"}, {"letter": "C", "text": "Osteoarthritis"}, {"letter": "D", "text": "Pseudogout (CPPD)"}, {"letter": "E", "text": "Fibromyalgia"}], "answers": ["A", "B"], "explanation": "RF is an IgM against the Fc of IgG and is **not specific — also seen in SBE and hepatitis C**. Anti-CCP is the specific test. OA, CPPD and fibromyalgia are not RF-associated conditions in the lecture.", "objective": "", "remediation": {"steps": [{"teach": "Rheumatoid factor is an antibody against **our own IgG**, so anything that chronically stimulates the immune system — a chronic infection, for instance — can raise it.", "stem": "Which chronic infection is named as a cause of a positive rheumatoid factor?", "options": [{"letter": "A", "text": "Hepatitis C"}, {"letter": "B", "text": "Gonococcal arthritis"}, {"letter": "C", "text": "Lyme disease"}], "answer": "A", "explanation": "Hepatitis C is a classic non-RA cause of RF positivity.", "clarify": [{"stem": "Rheumatoid factor is which antibody class?", "options": [{"letter": "A", "text": "IgM against the Fc of IgG"}, {"letter": "B", "text": "IgG against nuclear antigens"}], "answer": "A", "explanation": "RF = IgM anti-Fc of IgG."}]}, {"teach": "A second named cause is a **chronic bacterial infection of a heart valve**.", "stem": "Which cardiac infection is a recognized cause of false-positive RF?", "options": [{"letter": "A", "text": "Subacute bacterial endocarditis"}, {"letter": "B", "text": "Pericarditis of lupus"}, {"letter": "C", "text": "Rheumatic valvular disease"}], "answer": "A", "explanation": "SBE is named alongside hepatitis C as a non-RA cause of RF."}, {"teach": "The non-inflammatory and non-autoimmune conditions on the list — degenerative, crystal, and pain-amplification disorders — are not RF-associated. When RF is positive without synovitis, the next move is the **specific** RA test.", "stem": "RF positive, no synovitis → the more specific test to order is:", "options": [{"letter": "A", "text": "Anti-CCP"}, {"letter": "B", "text": "ANA"}, {"letter": "C", "text": "Repeat RF"}], "answer": "A", "explanation": "Anti-CCP is the specific RA test (SPIN)."}], "checkpoints": [{"stem": "A positive RF with no joint swelling is best interpreted as:", "options": [{"letter": "A", "text": "Diagnostic of RA"}, {"letter": "B", "text": "Nonspecific — consider SBE or hepatitis C and check anti-CCP"}, {"letter": "C", "text": "Evidence of lupus"}, {"letter": "D", "text": "An indication for intra-articular steroid"}], "answer": "B", "explanation": "RF is nonspecific; without synovitis consider SBE/hep C and use anti-CCP as the specific test."}]}, "answer": "A,B"}, {"id": "11", "group": 11, "section": "Extra-articular findings", "topic": "Extra-articular findings — eyes", "skill": "Identification", "stem": "Eye redness, watering and irritation with NO visual loss and no significant pain → Ocular finding:", "options": [{"letter": "A", "text": "Anterior uveitis"}, {"letter": "B", "text": "Posterior uveitis"}, {"letter": "C", "text": "Episcleritis"}, {"letter": "D", "text": "Scleritis"}, {"letter": "E", "text": "Sicca syndrome"}], "answer": "C", "explanation": "**Episcleritis = redness, watering, irritation, no visual loss** (RA, vasculitis, SpA, SLE). Scleritis adds eye pain and photophobia; anterior uveitis has pain, redness and visual change; sicca is dry eyes (Sjögren).", "objective": "", "remediation": {"steps": [{"teach": "Four red/irritated-eye patterns are tested. Two involve the sclera — one superficial and **painless**, one deep and **painful with photophobia**. Uveitis involves the iris/ciliary body/choroid and changes vision.", "stem": "A red eye with marked eye PAIN and photophobia is:", "options": [{"letter": "A", "text": "Scleritis"}, {"letter": "B", "text": "Episcleritis"}, {"letter": "C", "text": "Sicca"}], "answer": "A", "explanation": "Scleritis = redness + eye pain + photophobia (RA, IBD, relapsing polychondritis, SLE).", "clarify": [{"stem": "Uveitis affects which structures?", "options": [{"letter": "A", "text": "Iris, ciliary body, choroid"}, {"letter": "B", "text": "Lacrimal gland only"}], "answer": "A", "explanation": "Uveitis = inflammation of the iris, ciliary body and choroid."}]}, {"teach": "The superficial scleral inflammation is benign-looking: red, watery, irritated, but **vision is preserved** and pain is minimal.", "stem": "Redness, watering, irritation, no visual loss → Finding:", "options": [{"letter": "A", "text": "Episcleritis"}, {"letter": "B", "text": "Scleritis"}, {"letter": "C", "text": "Anterior uveitis"}], "answer": "A", "explanation": "Episcleritis."}], "checkpoints": [{"stem": "Which group of diseases is classically associated with UVEITIS?", "options": [{"letter": "A", "text": "AS, IBD, reactive arthritis, sarcoidosis, Behçet, GPA"}, {"letter": "B", "text": "Osteoarthritis and fibromyalgia"}, {"letter": "C", "text": "Gout and pseudogout"}, {"letter": "D", "text": "Sjögren syndrome only"}], "answer": "A", "explanation": "Uveitis → AS, IBD, reactive arthritis, sarcoid, Behçet, GPA."}, {"stem": "Dry eyes (sicca) and sudden loss of vision point, respectively, to:", "options": [{"letter": "A", "text": "Sjögren; giant cell arteritis"}, {"letter": "B", "text": "GCA; Sjögren"}, {"letter": "C", "text": "RA; gout"}, {"letter": "D", "text": "Behçet; OA"}], "answer": "A", "explanation": "Sicca → Sjögren; loss of vision → GCA."}]}}, {"id": "12", "group": 12, "section": "Diagnostic workup", "topic": "Approach to the diagnostic workup", "skill": "Management", "stem": "Monoarticular hot joint → First step in the workup:", "options": [{"letter": "A", "text": "Joint aspiration with fluid analysis"}, {"letter": "B", "text": "Intra-articular steroid injection"}, {"letter": "C", "text": "Plain radiographs of the affected joint"}, {"letter": "D", "text": "Serum RF and ANA testing"}, {"letter": "E", "text": "Empiric NSAID trial for two weeks"}], "answer": "A", "explanation": "A monoarticular hot joint is **crystal vs septic — tap it**: WBC, Gram stain and crystals. Steroid must not be injected until infection is excluded; serologies and imaging only confirm.", "objective": "", "remediation": {"steps": [{"teach": "A single hot joint has two must-not-miss causes: **crystal arthritis and septic arthritis**. Both are monoarticular, both look the same from outside, and only one test separates them.", "stem": "Which two diagnoses must be separated first in a monoarticular hot joint?", "options": [{"letter": "A", "text": "Crystal vs septic arthritis"}, {"letter": "B", "text": "RA vs lupus"}, {"letter": "C", "text": "OA vs fibromyalgia"}], "answer": "A", "explanation": "Monoarticular → crystalline, septic, viral, reactive; crystal vs septic is the urgent split.", "clarify": [{"stem": "Which pattern describes crystal and septic arthritis?", "options": [{"letter": "A", "text": "Monoarticular (1 joint)"}, {"letter": "B", "text": "Polyarticular (5+ joints)"}], "answer": "A", "explanation": "Both are classically monoarticular."}]}, {"teach": "Blood tests and x-rays cannot tell a septic joint from gout. Only the **fluid inside the joint** can — its WBC, Gram stain and crystal exam.", "stem": "Monoarticular hot joint → First step:", "options": [{"letter": "A", "text": "Aspirate the joint (WBC, Gram stain, crystals)"}, {"letter": "B", "text": "Order serum RF and ANA"}, {"letter": "C", "text": "Inject steroid"}], "answer": "A", "explanation": "Tap it."}], "checkpoints": [{"stem": "Per the lecturer's order of operations, labs and imaging are used to:", "options": [{"letter": "A", "text": "Replace the history and exam"}, {"letter": "B", "text": "Confirm what listening and examining suggest"}, {"letter": "C", "text": "Screen every patient with ANA subserologies"}, {"letter": "D", "text": "Decide joint size"}], "answer": "B", "explanation": "'Eyes cannot see what the mind does not know' — H&P first; labs and imaging only confirm."}, {"stem": "After H&P and inflammatory markers (ESR/CRP), the next step in the workup sequence is:", "options": [{"letter": "A", "text": "Serologies (RF, ANA) when appropriate"}, {"letter": "B", "text": "Empiric steroid injection"}, {"letter": "C", "text": "Surgical biopsy"}, {"letter": "D", "text": "Immediate MRI of all joints"}], "answer": "A", "explanation": "H&P → ESR/CRP → serologies when appropriate → synovial fluid analysis → imaging."}]}}, {"id": "13", "group": 13, "section": "Arthralgia vs arthritis", "topic": "Arthralgia vs arthritis", "skill": "Disease process", "stem": "Patient-reported joint pain, which may be articular OR periarticular, is termed:", "options": [{"letter": "A", "text": "Arthralgia"}, {"letter": "B", "text": "Arthritis"}, {"letter": "C", "text": "Synovitis"}, {"letter": "D", "text": "Enthesitis"}, {"letter": "E", "text": "Tenosynovitis"}], "answer": "A", "explanation": "**Arthralgia = SYMPTOM** (patient-reported joint pain). **Arthritis = DIAGNOSIS** — clinician-documented pain AND inflammation of a joint (arth = joint, itis = inflammation).", "objective": "", "remediation": {"steps": [{"teach": "The lecture insists on two words: one is what the **patient reports**, the other is what the **clinician documents** after finding inflammation.", "stem": "'Arthritis' is best classified as a:", "options": [{"letter": "A", "text": "Diagnosis"}, {"letter": "B", "text": "Symptom"}], "answer": "A", "explanation": "Arthritis is not a symptom but a diagnosis — clinician-reported joint inflammation.", "clarify": [{"stem": "Arthritis requires joint pain plus:", "options": [{"letter": "A", "text": "Inflammation"}, {"letter": "B", "text": "Radiographic erosions"}], "answer": "A", "explanation": "Arth = joint, itis = inflammation → pain AND inflammation."}]}, {"teach": "The patient's word for joint pain does not specify whether the source is the joint itself or the tissues around it.", "stem": "Patient-reported joint pain (articular or periarticular) → Term:", "options": [{"letter": "A", "text": "Arthralgia"}, {"letter": "B", "text": "Arthritis"}, {"letter": "C", "text": "Synovitis"}], "answer": "A", "explanation": "Arthralgia is the symptom."}], "checkpoints": [{"stem": "A clinician documents a warm, swollen knee with effusion. This finding is best labeled:", "options": [{"letter": "A", "text": "Arthralgia"}, {"letter": "B", "text": "Arthritis"}, {"letter": "C", "text": "Recruitment"}, {"letter": "D", "text": "Enthesis"}], "answer": "B", "explanation": "Clinician-documented joint inflammation = arthritis (a diagnosis)."}]}}, {"id": "14", "group": 14, "section": "Diagnostic workup", "topic": "ESR", "skill": "Diagnostics & imaging", "multi": true, "stem": "Which NON-rheumatic conditions can elevate the ESR and confound its interpretation?", "options": [{"letter": "A", "text": "Pregnancy"}, {"letter": "B", "text": "Obesity"}, {"letter": "C", "text": "Osteoarthritis"}, {"letter": "D", "text": "Chronic kidney disease"}, {"letter": "E", "text": "Diabetes"}], "answers": ["A", "B", "D", "E"], "explanation": "ESR is elevated in inflammation and infection but also in **pregnancy, diabetes, obesity, CKD, and malignancy**. Osteoarthritis is non-inflammatory — markers are normal or minimally elevated.", "objective": "", "remediation": {"steps": [{"teach": "ESR rises whenever **acute-phase reactants neutralize the RBC surface charge** — and several common non-rheumatic states do this: a gravid state, excess adiposity, metabolic and renal disease, and cancer.", "stem": "Which of these raises the ESR in the absence of arthritis?", "options": [{"letter": "A", "text": "Pregnancy"}, {"letter": "B", "text": "Osteoarthritis"}], "answer": "A", "explanation": "Pregnancy elevates ESR; OA (non-inflammatory) does not meaningfully.", "clarify": [{"stem": "In non-inflammatory arthritis such as OA, ESR and CRP are typically:", "options": [{"letter": "A", "text": "Normal or minimally elevated"}, {"letter": "B", "text": "Markedly elevated"}], "answer": "A", "explanation": "Non-inflammatory disease leaves markers normal or minimally elevated."}]}, {"teach": "The metabolic confounders on the lecture list are **diabetes and obesity**; the organ-failure confounder is **chronic kidney disease**; **malignancy** completes the list.", "stem": "Which pair are both ESR confounders?", "options": [{"letter": "A", "text": "Diabetes and CKD"}, {"letter": "B", "text": "Osteoarthritis and fibromyalgia"}, {"letter": "C", "text": "Gout and OA"}], "answer": "A", "explanation": "Diabetes, obesity, CKD, pregnancy and malignancy all elevate ESR."}], "checkpoints": [{"stem": "Which acute-phase protein is made in the liver in response to IL-6?", "options": [{"letter": "A", "text": "C-reactive protein"}, {"letter": "B", "text": "Rheumatoid factor"}, {"letter": "C", "text": "Antinuclear antibody"}, {"letter": "D", "text": "Anti-CCP"}], "answer": "A", "explanation": "CRP is produced by the liver in response to IL-6."}, {"stem": "In inflammatory conditions CRP is usually 2–10× normal. A CRP far above that range should prompt consideration of:", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Infection"}, {"letter": "C", "text": "Fibromyalgia"}, {"letter": "D", "text": "Low-titer ANA"}], "answer": "B", "explanation": "CRP far above 10× normal → consider infection."}]}, "answer": "A,B,D,E"}, {"id": "15", "group": 15, "section": "Synovial fluid & crystals", "topic": "Crystal-induced arthritis (gout)", "skill": "Diagnostics & imaging", "stem": "Needle-shaped crystals that appear YELLOW when parallel to the compensator → Birefringence and diagnosis:", "options": [{"letter": "A", "text": "Negatively birefringent — gout"}, {"letter": "B", "text": "Positively birefringent — gout"}, {"letter": "C", "text": "Negatively birefringent — CPPD"}, {"letter": "D", "text": "Positively birefringent — CPPD"}, {"letter": "E", "text": "Non-birefringent — septic joint"}], "answer": "A", "explanation": "**Gout (MSU) = needle-shaped, negatively birefringent, yellow when parallel** (blue perpendicular). CPPD = rhomboid, positively birefringent, blue when parallel.", "objective": "", "remediation": {"steps": [{"teach": "Monosodium urate crystals are **long and needle-like**; calcium pyrophosphate crystals are **short rhomboids**. Shape is the first clue.", "stem": "Needle-shaped synovial crystals are:", "options": [{"letter": "A", "text": "Monosodium urate (gout)"}, {"letter": "B", "text": "Calcium pyrophosphate (CPPD)"}], "answer": "A", "explanation": "Needles = urate; rhomboids = CPP."}, {"teach": "Birefringence is the second clue. A crystal that is **yellow when parallel** to the compensator axis has negative birefringence; **blue when parallel** is positive.", "stem": "Yellow when parallel to the compensator → Birefringence:", "options": [{"letter": "A", "text": "Negative"}, {"letter": "B", "text": "Positive"}], "answer": "A", "explanation": "Yellow-parallel = negative (gout); blue-parallel = positive (CPPD).", "clarify": [{"stem": "A gout crystal viewed PERPENDICULAR to the compensator appears:", "options": [{"letter": "A", "text": "Blue"}, {"letter": "B", "text": "Yellow"}], "answer": "A", "explanation": "Urate: yellow parallel, blue perpendicular."}]}], "checkpoints": [{"stem": "Which synovial WBC range fits a crystal-induced effusion?", "options": [{"letter": "A", "text": "<200"}, {"letter": "B", "text": "200–2,000"}, {"letter": "C", "text": "10,000–50,000"}, {"letter": "D", "text": ">200,000 with positive Gram stain"}], "answer": "C", "explanation": "Crystal-induced fluid: 10,000–50,000 WBC, Gram stain negative, crystals present."}]}}, {"id": "16", "group": 16, "section": "Synovial fluid & crystals", "topic": "Septic joint", "skill": "Complications", "stem": "Synovial WBC 200,000, glucose 20, no crystals seen. Which intervention is CONTRAINDICATED in this joint?", "options": [{"letter": "A", "text": "Gram stain of the fluid"}, {"letter": "B", "text": "Culture of the fluid"}, {"letter": "C", "text": "Intra-articular glucocorticoid injection"}, {"letter": "D", "text": "Measuring fluid cell count"}, {"letter": "E", "text": "Repeat aspiration of the joint in 48 hours"}], "answer": "C", "explanation": "Septic-looking fluid (**WBC >50,000, low glucose, no crystals**) → Gram stain and culture before anything else; **never inject steroid into a possibly infected joint**.", "objective": "", "remediation": {"steps": [{"teach": "A WBC far above 50,000 with no crystals is **infectious-class fluid** until proven otherwise. The first move is to identify the organism.", "stem": "Synovial WBC 200,000, no crystals → Next step:", "options": [{"letter": "A", "text": "Gram stain and culture of the fluid"}, {"letter": "B", "text": "Serum uric acid"}, {"letter": "C", "text": "Anti-CCP"}], "answer": "A", "explanation": "Gram stain and culture of the joint fluid come before anything else.", "clarify": [{"stem": "Which WBC threshold defines infectious synovial fluid?", "options": [{"letter": "A", "text": ">50,000"}, {"letter": "B", "text": ">2,000"}], "answer": "A", "explanation": "Infectious >50,000."}]}, {"teach": "Glucocorticoid injected into an infected joint suppresses the local response and worsens the infection — the lecture's rule is absolute.", "stem": "In a possibly infected joint, intra-articular steroid is:", "options": [{"letter": "A", "text": "Contraindicated"}, {"letter": "B", "text": "First-line"}, {"letter": "C", "text": "Used only after NSAIDs"}], "answer": "A", "explanation": "Never inject steroid into a possibly infected joint."}], "checkpoints": [{"stem": "Which fluid pattern makes a septic joint most likely?", "options": [{"letter": "A", "text": "Clear fluid, WBC 500"}, {"letter": "B", "text": "Opaque fluid, WBC 28,000, rhomboid crystals"}, {"letter": "C", "text": "Opaque fluid, WBC >50,000, positive Gram stain, no crystals"}, {"letter": "D", "text": "Yellow fluid, WBC 150"}], "answer": "C", "explanation": ">50,000 WBC with a positive Gram stain and no crystals = septic joint."}]}}, {"id": "17", "group": 17, "section": "Definitions", "topic": "Define rheumatology", "skill": "Disease process", "stem": "Rheumatology is defined as the branch of medicine dealing with inflammation of which tissues?", "options": [{"letter": "A", "text": "Joints, muscles, and connective tissue"}, {"letter": "B", "text": "Bone marrow and blood cells"}, {"letter": "C", "text": "Skin, hair, and nails"}, {"letter": "D", "text": "Peripheral nerves, spinal cord, and brain"}, {"letter": "E", "text": "Kidneys and urinary tract"}], "answer": "A", "explanation": "Rheumatology deals with **inflammation of joints, muscles, and connective tissue** — over 100 rheumatic diseases, including RA, gout, lupus, osteoporosis, OA and psoriatic arthritis. 'Rheuma' = to flow (congestion/inflammation).", "objective": "", "remediation": {"steps": [{"teach": "Galen's word *rheumatismos* comes from *rheuma*, **to flow** — the idea of congestion and inflammation. The specialty covers musculoskeletal diseases plus systemic autoimmune diseases that can attack muscles, joints and organs.", "stem": "'Rheuma' literally means:", "options": [{"letter": "A", "text": "To flow (congestion)"}, {"letter": "B", "text": "To break"}, {"letter": "C", "text": "To swell"}], "answer": "A", "explanation": "Rheuma = to flow, as in nasal congestion; rheumatic essentially means congestion/inflammation.", "clarify": [{"stem": "Approximately ho (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };
  // Select-all-that-apply support: q.multi === true, q.answers = ['A','C'] (q.answer mirrors the joined key for audits).
  const isMulti = q => !!q.multi;
  const keyLetters = q => isMulti(q) ? (q.answers || String(q.answer).split(',')).map(x => x.trim()).sort() : [q.answer];
  const chosenLetters = q => { const a = answers[q.id]; return a === undefined ? [] : (isMulti(q) ? String(a).split(',').filter(Boolean).sort() : [a]); };
  const isRight = q => { const c = chosenLetters(q), k = keyLetters(q); return c.length === k.length && c.every((x, i) => x === k[i]); };
  const keyLabel = q => keyLetters(q).join(', ');
  const keyText = q => keyLetters(q).map(l => optText(q, l)).join('; ');
  const pendingSel = {};   // multi questions: letters ticked but not yet checked

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(keyLabel(q)) + '. ' + fmt(keyText(q)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });

  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);

  }

  // A question is "resolved" (lets its follow-up appear) once answered right,

  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (isRight(q) || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';

  // ================= Rendering =================

  function questionHtml(q) {

    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
