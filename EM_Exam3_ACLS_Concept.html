const EXAM_DATA = {"title": "ACLS — Lecture Quiz (Adaptive)", "questions": [{"id": "1", "group": 1, "slide": 3, "section": "What is ACLS?", "topic": "ACLS algorithms", "skill": "Identification", "stem": "A patient is found unresponsive and the team is deciding which ACLS algorithm applies. Which finding makes that first decision?", "options": [{"letter": "A", "text": "Whether the rhythm is regular or irregular"}, {"letter": "B", "text": "Whether the blood pressure is measurable"}, {"letter": "C", "text": "Whether a carotid pulse is present"}, {"letter": "D", "text": "Whether the QRS is narrow or wide"}], "answer": "C", "explanation": "The **pulse check** is the first branch point: no pulse means the cardiac-arrest algorithm; a pulse sends you to the bradycardia or tachycardia algorithm, where stability and QRS width are judged next.", "objective": "", "hint": "QRS width, regularity and stability are the second and third questions, used only once the patient is already in a branch with a **perfusing rhythm**. The first question is more basic than anything on the monitor."}, {"id": "2", "group": 2, "slide": 5, "section": "What is ACLS?", "topic": "2025 AHA updates", "skill": "Management", "stem": "Which changes were introduced in the October 2025 AHA guidelines that the lecture highlights?", "options": [{"letter": "A", "text": "POCUS may be used to find reversible causes if it does not interrupt CPR"}, {"letter": "B", "text": "CPR should not be delayed to give naloxone in suspected opioid arrest"}, {"letter": "C", "text": "Mechanical CPR devices are not recommended routinely for out-of-hospital arrest"}, {"letter": "D", "text": "IV access is preferred over IO access"}, {"letter": "E", "text": "Vasopressin has replaced epinephrine as the arrest pressor"}, {"letter": "F", "text": "Adenosine is now first-line for atrial fibrillation with a pulse"}], "answer": "ABCD", "explanation": "The **2025 updates** are: no routine mechanical CPR for OHCA (except transport), IV over IO, polymorphic VT gets immediate defibrillation, 200 J first shock for AF/flutter, POCUS only if it does not interrupt CPR, and no CPR delay for naloxone. Epinephrine remains the arrest pressor and adenosine never works in an irregular rhythm.", "objective": "", "hint": "Every true 2025 change protects **uninterrupted CPR** or streamlines access and electricity. Two options reverse long-standing drug rules that the deck still teaches, so they cannot be new guidance."}, {"id": "3", "group": 3, "slide": 12, "section": "BLS", "topic": "High-quality CPR", "skill": "Management", "stem": "Which practices are part of high-quality CPR as the BLS highlights describe them?", "options": [{"letter": "A", "text": "Ventilate about 20 breaths per minute once intubated"}, {"letter": "B", "text": "Pause after each shock to confirm a pulse"}, {"letter": "C", "text": "Check the rhythm and switch compressors every 2 minutes"}, {"letter": "D", "text": "Compress at a rate of 100 to 120 per minute"}, {"letter": "E", "text": "Compress 2 inches deep and allow full chest recoil"}, {"letter": "F", "text": "Keep every pause in compressions under 10 seconds"}], "answer": "CDEF", "explanation": "**High-quality CPR** means 2 inches with full recoil, 100–120/min, interruptions under 10 seconds, 2-minute cycles with compressor switches, 30:2 (or 1 breath every 6 seconds with an advanced airway), ventilating only to chest rise, and resuming compressions immediately after a shock.", "objective": "", "hint": "The 2-2-2-2 rule and the seven highlights all serve one goal: maximal **uninterrupted perfusion** with minimal over-ventilation. Anything that stops compressions or pushes extra air works against that goal."}, {"id": "4", "group": 4, "slide": 12, "section": "BLS", "topic": "High-quality CPR", "skill": "Management", "stem": "During a BLS assessment a patient has a palpable pulse but is not breathing. What is the correct action?", "options": [{"letter": "A", "text": "Place the patient in the recovery position and monitor"}, {"letter": "B", "text": "Give one rescue breath every 6 seconds and recheck the pulse every 2 minutes"}, {"letter": "C", "text": "Start compressions at 30:2 immediately"}, {"letter": "D", "text": "Attach the defibrillator and analyze the rhythm"}], "answer": "B", "explanation": "A **pulse without breathing** calls for ventilation support at 10 breaths per minute with a pulse recheck every 2 minutes; compressions and shocks are for the pulseless patient, and the recovery position is for someone breathing with a pulse.", "objective": "", "hint": "Circulation is already present, so compressions and electricity have nothing to fix; the deficit is purely **ventilatory** and the patient must be reassessed on the usual cycle because the pulse can be lost."}, {"id": "5", "group": 5, "slide": 15, "section": "Rhythm Identification", "topic": "Sinus tachycardia", "skill": "Management", "stem": "A febrile patient has a regular narrow tachycardia at 110 with a normal P wave before every QRS. What is the initial management?", "options": [{"letter": "A", "text": "Diltiazem IV for rate control"}, {"letter": "B", "text": "Synchronized cardioversion at 50 to 100 J"}, {"letter": "C", "text": "Adenosine 6 mg rapid IV push"}, {"letter": "D", "text": "Treat the underlying cause such as fever, pain or hypovolemia"}], "answer": "D", "explanation": "**Sinus tachycardia** is a physiologic response: visible normal P waves, gradual onset, usually under 150. Adenosine only transiently slows it, and cardioversion or rate control is not indicated; fix the driver.", "objective": "", "hint": "Visible P waves at a rate well below the SVT range mark this as the sinus node responding to a **stimulus**, not a re-entry circuit, so nothing that acts on the AV node or the rhythm itself will help."}, {"id": "6", "group": 6, "slide": 16, "section": "Rhythm Identification", "topic": "Sinus bradycardia", "skill": "Management", "stem": "A patient on a beta-blocker has sinus bradycardia at 48 with normal blood pressure and no symptoms. What is the appropriate initial management?", "options": [{"letter": "A", "text": "Atropine 1 mg IV bolus now"}, {"letter": "B", "text": "Start a dopamine infusion"}, {"letter": "C", "text": "Observe on a monitor and address the cause, such as holding the beta-blocker"}, {"letter": "D", "text": "Transcutaneous pacing with pads applied"}], "answer": "C", "explanation": "The bradycardia algorithm escalates to drugs and pacing only when the slow rate is causing **instability** (hypotension, altered mentation, shock, ischemic chest pain, acute heart failure); an asymptomatic patient is monitored while the cause is treated.", "objective": "", "hint": "Every active step in the bradycardia algorithm is reserved for a patient the slow rate is **harming**. Read the vignette for signs of hypoperfusion before reaching for any intervention."}, {"id": "7", "group": 7, "slide": 17, "section": "Rhythm Identification", "topic": "PEA", "skill": "Management", "stem": "The monitor shows an organized sinus rhythm but the patient has no palpable pulse. What is the only way this patient achieves ROSC?", "options": [{"letter": "A", "text": "Amiodarone 300 mg IV push"}, {"letter": "B", "text": "Synchronized cardioversion at 200 J"}, {"letter": "C", "text": "Defibrillation at 120 to 200 J biphasic"}, {"letter": "D", "text": "CPR with epinephrine while aggressively correcting the Hs and Ts"}], "answer": "D", "explanation": "**PEA** is a non-shockable rhythm: the strip cannot diagnose it, the pulse check does. Circulation returns only when the reversible cause (tamponade, tension pneumothorax, PE, hypovolemia, hyperkalemia, acidosis, toxins) is treated alongside CPR and epinephrine.", "objective": "", "hint": "An organized rhythm with no pulse means the electrical system is working but something **mechanical or metabolic** is stopping it from perfusing; electricity and antiarrhythmics fix neither problem."}, {"id": "8", "group": 8, "slide": 18, "section": "Rhythm Identification", "topic": "SVT", "skill": "Management", "stem": "A stable young adult has a regular narrow-complex tachycardia at 180 with no visible P waves. What is the first intervention?", "options": [{"letter": "A", "text": "Vagal maneuvers such as a modified Valsalva"}, {"letter": "B", "text": "Metoprolol IV"}, {"letter": "C", "text": "Synchronized cardioversion"}, {"letter": "D", "text": "Adenosine 6 mg rapid IV push"}], "answer": "A", "explanation": "Stable **SVT** is treated in sequence: vagal maneuvers first, then adenosine 6 mg rapid push with flush (12 mg if needed), then a beta-blocker or calcium-channel blocker; cardioversion is for the unstable patient.", "objective": "", "hint": "The stable-SVT ladder begins with the step that costs nothing and needs no IV; drugs follow only if it fails. The question asks for the **first** rung, not the most effective one."}, {"id": "9", "group": 9, "slide": 19, "section": "Rhythm Identification", "topic": "Ventricular tachycardia", "skill": "Management", "stem": "A patient with a pulse and normal blood pressure has a wide, regular, uniform tachycardia at 170. What is the drug of choice?", "options": [{"letter": "A", "text": "Verapamil 2.5 to 5 mg IV"}, {"letter": "B", "text": "Amiodarone 150 mg IV over 10 minutes"}, {"letter": "C", "text": "Magnesium sulfate 1 to 2 g IV"}, {"letter": "D", "text": "Diltiazem 0.25 mg/kg IV over 2 minutes"}], "answer": "B", "explanation": "Stable **monomorphic VT** is treated with amiodarone 150 mg over 10 minutes (drip 1 mg/min), or procainamide or sotalol, plus expert consultation; adenosine may be tried only if the rhythm is regular and monomorphic. Have the pads on, because VT is rarely stable for long.", "objective": "", "hint": "Treat any wide regular tachycardia as **ventricular** until proven otherwise. Calcium-channel blockers can collapse such a patient, and the magnesium indication is a twisting polymorphic rhythm, not a uniform one."}, {"id": "10", "group": 10, "slide": 19, "section": "Rhythm Identification", "topic": "Ventricular tachycardia", "skill": "Management", "stem": "A patient with a wide regular tachycardia still has a pulse but is hypotensive and confused. What is the next step?", "options": [{"letter": "A", "text": "Adenosine 6 mg rapid IV push"}, {"letter": "B", "text": "Unsynchronized defibrillation at 360 J"}, {"letter": "C", "text": "Amiodarone 150 mg IV over 10 minutes"}, {"letter": "D", "text": "Synchronized cardioversion after sedation if time allows"}], "answer": "D", "explanation": "**Unstable VT with a pulse** gets synchronized cardioversion (100 J start in standard ACLS); defibrillation is for pulseless VT or polymorphic VT, and drugs are too slow for a patient in shock.", "objective": "", "hint": "Instability means electricity rather than a drug, and because a pulse and organized QRS complexes are present the device can **time** its shock to the R wave instead of firing blindly."}, {"id": "11", "group": 11, "slide": 20, "section": "Rhythm Identification", "topic": "Torsades de pointes", "skill": "Management", "stem": "Under the 2025 update, how is an unstable patient with polymorphic ventricular tachycardia treated electrically?", "options": [{"letter": "A", "text": "Synchronized cardioversion starting at 200 J"}, {"letter": "B", "text": "Immediate unsynchronized defibrillation"}, {"letter": "C", "text": "Synchronized cardioversion starting at 100 J"}, {"letter": "D", "text": "Transcutaneous overdrive pacing first"}], "answer": "B", "explanation": "**Polymorphic VT** is treated as an unstable rhythm: defibrillate immediately. The twisting complexes give the device no consistent R wave to synchronize to, so it is handled like VF.", "objective": "", "hint": "Synchronization requires a QRS the machine can lock onto every beat; a rhythm whose amplitude **twists** around the baseline cannot be timed, which is the same reason VF is never synchronized."}, {"id": "12", "group": 12, "slide": 20, "section": "Rhythm Identification", "topic": "Torsades de pointes", "skill": "Pharmacology", "stem": "Which drug is given to every patient with torsades de pointes, whether or not a pulse is present?", "options": [{"letter": "A", "text": "Procainamide 20 to 50 mg/min"}, {"letter": "B", "text": "Magnesium sulfate 1 to 2 g IV over 1 to 2 minutes"}, {"letter": "C", "text": "Amiodarone 300 mg IV push"}, {"letter": "D", "text": "Sodium bicarbonate 1 mEq/kg IV"}], "answer": "B", "explanation": "**Magnesium** suppresses the early afterdepolarizations that trigger torsades and is given even with a normal serum level; QT-prolonging antiarrhythmics such as amiodarone and procainamide are avoided.", "objective": "", "hint": "Torsades grows out of a **prolonged QT**, so the right drug stabilizes the membrane without lengthening repolarization further; two of the options are class I or III antiarrhythmics that do exactly the opposite."}, {"id": "13", "group": 13, "slide": 21, "section": "Rhythm Identification", "topic": "Ventricular fibrillation", "skill": "Management", "stem": "Why must the team confirm lead connections and increase the gain before calling a flat line asystole?", "options": [{"letter": "A", "text": "Fine ventricular fibrillation can look like asystole and is shockable"}, {"letter": "B", "text": "Asystole requires synchronized cardioversion once confirmed"}, {"letter": "C", "text": "Epinephrine cannot be given until the rhythm is confirmed"}, {"letter": "D", "text": "Agonal complexes always mean a pulse is present"}], "answer": "A", "explanation": "**Fine VF** can masquerade as asystole; missing it means withholding the one therapy that converts VF. Check a second lead and the gain before committing to the non-shockable arm.", "objective": "", "hint": "The cost of the mistake is the point: one of the two look-alike rhythms has a treatment the other does not, so the team must prove the line is truly **electrically silent** before giving up on electricity."}, {"id": "14", "group": 14, "slide": 22, "section": "Rhythm Identification", "topic": "Atrial fibrillation", "skill": "Management", "stem": "A stable patient has an irregularly irregular narrow tachycardia at 140 with no discernible P waves. What is the appropriate initial treatment?", "options": [{"letter": "A", "text": "Diltiazem 0.25 mg/kg IV over 2 minutes"}, {"letter": "B", "text": "Adenosine 6 mg rapid IV push"}, {"letter": "C", "text": "Amiodarone 150 mg IV over 10 minutes"}, {"letter": "D", "text": "Synchronized cardioversion at 200 J"}], "answer": "A", "explanation": "Stable **atrial fibrillation** with rapid ventricular response gets rate control with diltiazem (or metoprolol). Adenosine does not work because the rhythm is not regular, and cardioversion is reserved for the unstable patient.", "objective": "", "hint": "Adenosine only breaks a **regular** re-entry circuit, and electricity is for instability; what remains is a drug that slows AV-nodal conduction while the irregular rhythm continues."}, {"id": "15", "group": 15, "slide": 23, "section": "Rhythm Identification", "topic": "PEA", "skill": "Diagnostics & imaging", "stem": "A pulseless patient has an organized rhythm, and POCUS shows the heart contracting (PREM). What does this finding imply?", "options": [{"letter": "A", "text": "True electromechanical dissociation with a prognosis like asystole"}, {"letter": "B", "text": "Pseudo-PEA with a better prognosis and a reversible cause to find"}, {"letter": "C", "text": "The rhythm is shockable and defibrillation should follow"}, {"letter": "D", "text": "Resuscitation can be terminated after one more cycle"}], "answer": "B", "explanation": "**PREM** (Pulseless Rhythm, Echocardiographic Motion) means the heart is beating too weakly to produce a pulse; search hard for tamponade, hypovolemia, PE or tension pneumothorax. PRES (standstill) behaves like asystole.", "objective": "", "hint": "Contrast the two acronyms by their last word: **standstill** carries the grim meaning, while visible contraction means the pump still works and something is preventing output."}, {"id": "16", "group": 16, "slide": 24, "section": "Rhythm Identification", "topic": "Atrial flutter", "skill": "Identification", "stem": "Which ECG finding identifies atrial flutter rather than atrial fibrillation or SVT?", "options": [{"letter": "A", "text": "Narrow regular rhythm at 180 with P waves buried in the QRS"}, {"letter": "B", "text": "Wide complexes whose amplitude twists around the baseline"}, {"letter": "C", "text": "Irregularly irregular rhythm with a fibrillatory baseline"}, {"letter": "D", "text": "Sawtooth flutter waves with a ventricular rate near 150"}], "answer": "D", "explanation": "**Atrial flutter** shows sawtooth F waves (best in II, III, aVF) with an atrial rate near 300 and, with 2:1 block, a fixed ventricular rate of about 150. Management mirrors AF: rate control if stable, 200 J synchronized cardioversion if unstable.", "objective": "", "hint": "A fixed ventricular rate of almost exactly half of 300 is the arithmetic clue, and the baseline between QRS complexes has a **repeating** pattern rather than chaos or a flat line."}, {"id": "17", "group": 17, "slide": 27, "section": "Rhythm Identification", "topic": "Second-degree AV block type 1", "skill": "Identification", "stem": "Which ECG pattern identifies second-degree AV block type 1 (Wenckebach)?", "options": [{"letter": "A", "text": "P waves and QRS complexes each regular but unrelated to one another"}, {"letter": "B", "text": "PR interval lengthening beat to beat until a QRS is dropped"}, {"letter": "C", "text": "PR interval constant with sudden unpredictable dropped QRS complexes"}, {"letter": "D", "text": "PR interval fixed and longer than 0.20 s with every P conducted"}], "answer": "B", "explanation": "**Mobitz I** is longer, longer, longer, drop: a nodal block that is usually benign and responds to atropine if symptomatic. A fixed PR with a sudden drop is Mobitz II; a fixed prolonged PR with no drops is first degree; unrelated Ps and QRSs is complete block.", "objective": "", "hint": "The glance test for the two second-degree blocks is what the PR does **before** the dropped beat; the two options that describe no dropped beat at all cannot be second degree."}, {"id": "18", "group": 18, "slide": 29, "section": "Rhythm Identification", "topic": "Second-degree AV block type 2", "skill": "Management", "stem": "A symptomatic patient has a constant PR interval with intermittent unpredictable dropped QRS complexes. Why is early transcutaneous pacing preferred over relying on atropine?", "options": [{"letter": "A", "text": "The block is in the AV node, where atropine causes paradoxical bradycardia"}, {"letter": "B", "text": "The block is infranodal, so atropine is unlikely to help and the rhythm may progress to complete block"}, {"letter": "C", "text": "Atropine is contraindicated whenever the QRS is narrow"}, {"letter": "D", "text": "Pacing is required before any medication in every bradycardia"}], "answer": "B", "explanation": "**Mobitz II** sits below the AV node in the His-Purkinje system, so a vagolytic has little to act on and can worsen the ratio; have the pads on, pace early, bridge with epinephrine or dopamine, and consult cardiology for a pacemaker.", "objective": "", "hint": "Atropine works by removing vagal tone from the SA and AV nodes, so its usefulness depends on **where** the block lives. Decide whether this block is nodal or below the node and the answer follows."}, {"id": "19", "group": 19, "slide": 30, "section": "Rhythm Identification", "topic": "Third-degree AV block", "skill": "Management", "stem": "A hypotensive patient at a rate of 35 has regular P waves and regular wide QRS complexes with no relationship between them. What is the next step?", "options": [{"letter": "A", "text": "Synchronized cardioversion at 200 J"}, {"letter": "B", "text": "Transcutaneous pacing with pads on now, bridging to transvenous pacing"}, {"letter": "C", "text": "Adenosine 6 mg to restore AV conduction"}, {"letter": "D", "text": "Observe on a monitor and hold AV-nodal drugs"}], "answer": "B", "explanation": "**Third-degree block** with AV dissociation and a wide ventricular escape is infranodal and unstable: atropine may be tried but usually fails, so go straight to pacing, add an epinephrine or dopamine drip if needed, and arrange a permanent pacemaker.", "objective": "", "hint": "Complete dissociation with a slow **wide** escape rhythm is the most dangerous bradycardia on the list and the patient is already hypotensive; watchful waiting and AV-nodal drugs both make it worse, and cardioversion is for fast rhythms."}, {"id": "20", "group": 20, "slide": 35, "section": "Pharmacology", "topic": "Epinephrine", "skill": "Pharmacology", "stem": "How does the timing of the first epinephrine dose differ between shockable and non-shockable cardiac arrest?", "options": [{"letter": "A", "text": "Shockable: after the third shock; non-shockable: only if atropine fails"}, {"letter": "B", "text": "Shockable: before the first shock; non-shockable: after the second rhythm check"}, {"letter": "C", "text": "Shockable: after the second shock; non-shockable: as soon as possible"}, {"letter": "D", "text": "Shockable and non-shockable: both after the first 2-minute cycle"}], "answer": "C", "explanation": "**Epinephrine 1 mg IV/IO every 3 to 5 minutes** is given in every arrest: in VF or pulseless VT it follows the second shock, while in asystole and PEA there are no shocks to wait for, so it is given immediately.", "objective": "", "hint": "In the shockable arm electricity is the first therapy, so the drug waits until defibrillation has had **two chances**; in the non-shockable arm there is no shock to wait for and nothing should delay the drug."}, {"id": "21", "group": 21, "slide": 35, "section": "Pharmacology", "topic": "Amiodarone", "skill": "Pharmacology", "stem": "Ventricular fibrillation persists after the third shock with epinephrine already given. Which antiarrhythmic and dose come next?", "options": [{"letter": "A", "text": "Procainamide 20 to 50 mg/min infusion"}, {"letter": "B", "text": "Amiodarone 150 mg IV over 10 minutes"}, {"letter": "C", "text": "Magnesium sulfate 2 g IV push"}, {"letter": "D", "text": "Amiodarone 300 mg IV/IO push, then 150 mg if needed"}], "answer": "D", "explanation": "Refractory **VF or pulseless VT** (not responding to two rounds of defibrillation, given after the third shock) gets amiodarone 300 mg push then 150 mg; lidocaine 1 to 1.5 mg/kg then 0.5 to 0.75 mg/kg is the alternative. The 150 mg over 10 minutes dose is for stable VT with a pulse.", "objective": "", "hint": "The arrest dose of the class III drug is a rapid **push** at double the stable-VT dose; slow infusions and magnesium belong to patients with a pulse or a twisting polymorphic rhythm."}, {"id": "22", "group": 22, "slide": 36, "section": "Pharmacology", "topic": "Adenosine", "skill": "Pharmacology", "stem": "Why must adenosine be given as a rapid push into a large proximal vein followed immediately by a saline flush?", "options": [{"letter": "A", "text": "The flush is needed to prevent extravasation necrosis"}, {"letter": "B", "text": "It precipitates with calcium in peripheral lines"}, {"letter": "C", "text": "Slow administration causes prolonged hypotension"}, {"letter": "D", "text": "Its half-life is only seconds, so a slow push never reaches the AV node"}], "answer": "D", "explanation": "**Adenosine** is cleared within seconds, so it must arrive at the heart as a bolus (6 mg, then 12 mg); given slowly nothing happens. Warn the patient about brief chest pressure and expect transient asystole on the strip.", "objective": "", "hint": "The deck's line is that if you push it slow, nothing happens. The explanation lies in how quickly the drug **disappears** from the blood, not in any chemical incompatibility or tissue toxicity."}, {"id": "23", "group": 23, "slide": 36, "section": "Pharmacology", "topic": "Adenosine", "skill": "Pharmacology", "stem": "In which situations should adenosine be avoided?", "options": [{"letter": "A", "text": "Stable regular monomorphic wide-complex tachycardia"}, {"letter": "B", "text": "Second- or third-degree AV block"}, {"letter": "C", "text": "Known asthma with active bronchospasm"}, {"letter": "D", "text": "Wide irregular tachycardia suggesting pre-excited AF"}, {"letter": "E", "text": "Stable regular narrow SVT after vagal maneuvers fail"}, {"letter": "F", "text": "Atrial fibrillation or flutter with a pulse"}], "answer": "BCDF", "explanation": "**Adenosine** is for regular rhythms with a pulse: narrow SVT, and diagnostically in regular monomorphic wide-complex tachycardia. It is avoided in irregular rhythms (it can drive pre-excited AF into VF), bronchospasm, high-grade block and sick sinus.", "objective": "", "hint": "The deck's indication is tachycardic with a pulse, regular QRS, regular rhythm. Anything **irregular** is out, as is any patient whose AV node or airways cannot tolerate a brief blockade."}, {"id": "24", "group": 24, "slide": 36, "section": "Pharmacology", "topic": "Diltiazem", "skill": "Pharmacology", "stem": "Vagal maneuvers and two doses of adenosine fail to convert a stable narrow regular SVT. What is the next pharmacologic step?", "options": [{"letter": "A", "text": "Magnesium sulfate 1 to 2 g IV"}, {"letter": "B", "text": "Epinephrine infusion 2 to 10 mcg/min"}, {"letter": "C", "text": "Amiodarone 150 mg IV over 10 minutes"}, {"letter": "D", "text": "Metoprolol IV or diltiazem or verapamil IV"}], "answer": "D", "explanation": "When adenosine fails in stable SVT, a **beta-blocker or non-dihydropyridine calcium-channel blocker** slows the AV node. Verapamil has the strongest negative inotropy, so avoid it (and diltiazem) in heart failure, hypotension, or any wide-complex or pre-excited rhythm.", "objective": "", "hint": "The stable narrow-complex ladder stays with agents that slow **AV-nodal** conduction; the class III drug belongs to the wide-complex ladder, and the other two options treat torsades and bradycardia."}, {"id": "25", "group": 25, "slide": 37, "section": "Pharmacology", "topic": "Procainamide", "skill": "Management", "stem": "A patient has a wide irregular tachycardia and pre-excited atrial fibrillation through an accessory pathway is suspected. What is appropriate treatment?", "options": [{"letter": "A", "text": "Diltiazem 0.25 mg/kg IV"}, {"letter": "B", "text": "Adenosine 6 mg then 12 mg rapid push"}, {"letter": "C", "text": "Procainamide infusion or synchronized cardioversion"}, {"letter": "D", "text": "Metoprolol 5 mg IV repeated every 5 minutes"}], "answer": "C", "explanation": "In **pre-excited AF (WPW)** every AV-nodal blocker (adenosine, beta-blocker, calcium-channel blocker, digoxin) can shunt conduction down the accessory pathway and precipitate VF; use procainamide or electricity instead.", "objective": "", "hint": "Three of the options share one mechanism, slowing the **AV node**, and that mechanism is exactly what turns this rhythm into VF. The remaining option is the one agent on the stable wide-complex slide that works on the pathway itself."}, {"id": "26", "group": 26, "slide": 37, "section": "Pharmacology", "topic": "Torsades de pointes", "skill": "Pharmacology", "stem": "Which antiarrhythmics should be avoided in torsades de pointes because they prolong the QT interval?", "options": [{"letter": "A", "text": "Procainamide"}, {"letter": "B", "text": "Amiodarone"}, {"letter": "C", "text": "Sotalol"}, {"letter": "D", "text": "Magnesium sulfate"}], "answer": "ABC", "explanation": "**Amiodarone, procainamide and sotalol** all lengthen repolarization and can worsen torsades; magnesium is the treatment, followed by stopping QT-prolonging drugs, replacing potassium and calcium, and overdrive pacing if it recurs.", "objective": "", "hint": "Every drug on the stable wide-complex tachycardia slide shares the same liability in a patient whose baseline **QT** is already long; only the membrane stabilizer given for this rhythm is safe."}, {"id": "27", "group": 27, "slide": 39, "section": "Pharmacology", "topic": "Epinephrine", "skill": "Pharmacology", "stem": "An unstable bradycardic patient with a pulse has failed atropine and transcutaneous pacing. How should epinephrine be given?", "options": [{"letter": "A", "text": "1 mg IV push repeated every 3 to 5 minutes"}, {"letter": "B", "text": "40 units IV once in place of atropine"}, {"letter": "C", "text": "0.3 mg intramuscularly into the thigh"}, {"letter": "D", "text": "Infusion at 2 to 10 mcg/min titrated to response"}], "answer": "D", "explanation": "With a **pulse present**, epinephrine is given only as a titrated drip (or dopamine 5 to 20 mcg/kg/min), tapered slowly; the 1 mg push is the cardiac-arrest dose and would provoke tachyarrhythmias and ischemia in a perfusing patient.", "objective": "", "hint": "The patient is not in arrest, so the bolus dose for pulseless rhythms is dangerous here. The bradycardia slide lists this drug as a **drip**, used when the first drug and pacing have both failed."}, {"id": "28", "group": 28, "slide": 40, "section": "Pharmacology", "topic": "Sodium bicarbonate", "skill": "Pharmacology", "stem": "For which suspected causes of cardiac arrest is sodium bicarbonate indicated?", "options": [{"letter": "A", "text": "Tricyclic antidepressant overdose with a wide QRS"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Severe metabolic acidosis as the cause of arrest"}, {"letter": "D", "text": "Any arrest lasting longer than 10 minutes"}], "answer": "ABC", "explanation": "**Sodium bicarbonate** is not routine in ACLS; it is reserved for the hydrogen-ion H (acidosis), hyperkalemia, and sodium-channel-blocker toxicity. It needs adequate ventilation to clear the CO2 it generates and must not share a line with calcium or catecholamines.", "objective": "", "hint": "Bicarbonate earns a place only when a specific **cause** of the arrest is one it can reverse; duration of the code by itself is never the indication, which is why the deck says it is not routinely used."}, {"id": "29", "group": 29, "slide": 40, "section": "Pharmacology", "topic": "Vasopressin", "skill": "Pharmacology", "stem": "What is the current role of vasopressin in the ACLS cardiac-arrest algorithm?", "options": [{"letter": "A", "text": "It is given 40 units with every epinephrine dose"}, {"letter": "B", "text": "It is the preferred pressor in shockable rhythms"}, {"letter": "C", "text": "It has been replaced by epinephrine and is no longer part of the algorithm"}, {"letter": "D", "text": "It is first-line for asystole before epinephrine"}], "answer": "C", "explanation": "**Vasopressin** was removed from the AHA arrest algorithm for lack of benefit over epinephrine; its main current use is as an adjunct pressor in vasodilatory or septic shock.", "objective": "", "hint": "The deck describes this drug entirely in the **past tense**. Three options give it an active job in today's algorithm, which contradicts that description."}, {"id": "30", "group": 30, "slide": 42, "section": "Electricity Review", "topic": "Defibrillation", "skill": "Management", "stem": "Which rhythms are treated with an untimed defibrillation shock rather than synchronized cardioversion?", "options": [{"letter": "A", "text": "Third-degree AV block with hypotension"}, {"letter": "B", "text": "Pulseless ventricular tachycardia"}, {"letter": "C", "text": "Unstable monomorphic ventricular tachycardia with a pulse"}, {"letter": "D", "text": "Hypotensive atrial fibrillation with rapid ventricular response"}, {"letter": "E", "text": "Unstable polymorphic ventricular tachycardia"}, {"letter": "F", "text": "Ventricular fibrillation"}], "answer": "BEF", "explanation": "**Defibrillation** (biphasic 120 to 200 J, monophasic 360 J) is for VF, pulseless VT and, per 2025, polymorphic VT. Unstable AF and unstable monomorphic VT with a pulse are cardioverted with synchronization, and unstable block is paced.", "objective": "", "hint": "The deck frames electricity by one question: can the device find an **R wave**? Rhythms with a consistent QRS and a pulse get a timed shock; a slow rhythm gets pacing; the remaining rhythms get the untimed dose."}, {"id": "31", "group": 31, "slide": 45, "section": "Hs and Ts", "topic": "Hs and Ts", "skill": "Disease process", "stem": "Which conditions are among the reversible Hs of cardiac arrest?", "options": [{"letter": "A", "text": "Hypothermia"}, {"letter": "B", "text": "Hyperglycemia"}, {"letter": "C", "text": "Hypo- or hyperkalemia"}, {"letter": "D", "text": "Hypertension"}, {"letter": "E", "text": "Hypovolemia"}, {"letter": "F", "text": "Hypoxia"}], "answer": "ACEF", "explanation": "The **five Hs** are hypovolemia, hypoxia, hydrogen ion (acidosis), hypo-/hyperkalemia and hypothermia; the five Ts are tension pneumothorax, tamponade, toxins, pulmonary thrombosis and coronary thrombosis. The deck marks this slide with three asterisks.", "objective": "", "hint": "The Hs are the **metabolic and hypoxic** causes that can be corrected during the code; two of the options are chronic conditions with no immediate fix at the bedside and are not on the slide."}, {"id": "32", "group": 32, "slide": 46, "section": "Hs and Ts", "topic": "Hs and Ts", "skill": "Management", "stem": "Which treatments correctly match the reversible T that they address?", "options": [{"letter": "A", "text": "Coronary thrombosis treated with sodium bicarbonate"}, {"letter": "B", "text": "Toxins treated with the matching antidote and supportive care"}, {"letter": "C", "text": "Tension pneumothorax treated with needle decompression then a chest tube"}, {"letter": "D", "text": "Cardiac tamponade treated with pericardiocentesis"}, {"letter": "E", "text": "Cardiac tamponade treated with needle decompression of the chest"}, {"letter": "F", "text": "Pulmonary thrombosis treated with fibrinolysis (tPA or TNK)"}], "answer": "BCDF", "explanation": "The **Ts** are mechanical and obstructive: decompress the tension pneumothorax, drain the tamponade, lyse the pulmonary embolus, give antidotes for toxins, and reperfuse the coronary thrombosis with lytics or the cath lab.", "objective": "", "hint": "Each T is a physical obstruction to flow, so its treatment physically removes or dissolves the **obstruction**. Two options either apply a metabolic drug to a clot or aim a needle at the wrong cavity."}, {"id": "33", "group": 33, "slide": 46, "section": "Hs and Ts", "topic": "Hs and Ts", "skill": "Management", "stem": "A dialysis patient arrests with a wide QRS and peaked T waves on the monitor. Which treatment targets the suspected cause during CPR?", "options": [{"letter": "A", "text": "Calcium, sodium bicarbonate, and insulin with glucose"}, {"letter": "B", "text": "Fibrinolysis with tPA or TNK"}, {"letter": "C", "text": "Naloxone 2 mg IV"}, {"letter": "D", "text": "Needle decompression of the chest"}], "answer": "A", "explanation": "**Hyperkalemia** is the H to suspect in a dialysis patient with a wide QRS and peaked T waves: calcium stabilizes the membrane while bicarbonate and insulin with glucose shift potassium into cells.", "objective": "", "hint": "Renal failure plus a widening QRS points to an **electrolyte** H rather than a mechanical T; the correct bundle both protects the myocardial membrane and moves the ion out of the blood."}, {"id": "34", "group": 34, "slide": 48, "section": "Algorithms", "topic": "Bradycardia algorithm", "skill": "Management", "stem": "An unstable bradycardic patient remains hypotensive after the maximum dose of atropine. What is the next step in the bradycardia algorithm?", "options": [{"letter": "A", "text": "Transcutaneous pacing"}, {"letter": "B", "text": "Immediate cardiology consult for a permanent pacemaker"}, {"letter": "C", "text": "Dopamine infusion at 5 to 20 mcg/kg/min"}, {"letter": "D", "text": "Synchronized cardioversion at 100 J"}], "answer": "A", "explanation": "The **bradycardia algorithm** runs atropine 1 mg every 3 to 5 minutes to 3 mg, then transcutaneous pacing, then an epinephrine (2 to 10 mcg/min) or dopamine (5 to 20 mcg/kg/min) infusion if pacing fails, then cardiology for transvenous pacing.", "objective": "", "hint": "The infusions are explicitly reserved for the patient in whom atropine is ineffective **and** the next intervention has failed; that intervention is electrical and comes before any drip or consult."}, {"id": "35", "group": 35, "slide": 49, "section": "Algorithms", "topic": "Tachycardia algorithm", "skill": "Identification", "stem": "Which findings make a tachycardic patient with a pulse unstable and therefore a candidate for immediate synchronized cardioversion?", "options": [{"letter": "A", "text": "Palpitations and anxiety"}, {"letter": "B", "text": "Acutely altered mental status"}, {"letter": "C", "text": "Hypotension or signs of shock"}, {"letter": "D", "text": "Heart rate above 150"}, {"letter": "E", "text": "Ischemic chest pain"}, {"letter": "F", "text": "Acute heart failure"}], "answer": "BCEF", "explanation": "**Instability** is defined by hypoperfusion: hypotension or shock, altered mental status, ischemic chest pain, or acute heart failure. Rate alone and symptoms such as palpitations do not qualify; stable patients get drugs.", "objective": "", "hint": "The algorithm defines instability by evidence that vital organs are **underperfused**, not by how fast the rate is or how the patient feels about it."}, {"id": "36", "group": 36, "slide": 49, "section": "Algorithms", "topic": "Atrial fibrillation", "skill": "Management", "stem": "Per the 2025 update, what energy is used for the first synchronized cardioversion of unstable atrial fibrillation or flutter?", "options": [{"letter": "A", "text": "200 J biphasic"}, {"letter": "B", "text": "360 J monophasic"}, {"letter": "C", "text": "100 J biphasic"}, {"letter": "D", "text": "50 J biphasic"}], "answer": "A", "explanation": "The **2025 update** sets the first synchronized shock for AF or flutter at 200 J biphasic; SVT (50 to 100 J) and monomorphic VT (100 J) keep the standard ACLS starting energies.", "objective": "", "hint": "The deck gives only one explicit cardioversion number and attaches it to the two **atrial** rhythms; it is higher than the traditional starting energies but lower than the monophasic defibrillation dose."}, {"id": "37", "group": 37, "slide": 54, "section": "Algorithms", "topic": "Cardiac arrest algorithm", "skill": "Management", "stem": "Immediately after the first shock is delivered for ventricular fibrillation, what should the team do?", "options": [{"letter": "A", "text": "Give amiodarone 300 mg and reanalyze the rhythm"}, {"letter": "B", "text": "Give epinephrine 1 mg before restarting compressions"}, {"letter": "C", "text": "Check for a pulse for up to 10 seconds"}, {"letter": "D", "text": "Resume CPR immediately and continue for 2 minutes before the next rhythm check"}], "answer": "D", "explanation": "After any **shock**, compressions restart immediately without a pulse check; the rhythm is reassessed at the 2-minute mark, and the drugs follow their schedule (epinephrine after the second shock, amiodarone after the third).", "objective": "", "hint": "The algorithm slide repeats the same phrase after every shock, and it is about minimizing **hands-off** time. Both drugs in the options have later, specific places in the sequence."}, {"id": "38", "group": 38, "slide": 57, "section": "ROSC", "topic": "ROSC", "skill": "Diagnostics & imaging", "stem": "During CPR the end-tidal CO2 abruptly rises above 40 mmHg. What does this most likely indicate and what should follow?", "options": [{"letter": "A", "text": "Worsening acidosis; give sodium bicarbonate"}, {"letter": "B", "text": "Return of spontaneous circulation; confirm with a pulse check at the next 2-minute mark"}, {"letter": "C", "text": "Esophageal tube placement; reintubate immediately"}, {"letter": "D", "text": "Hyperventilation; slow the ventilation rate"}], "answer": "B", "explanation": "A sudden **EtCO2 jump above 40 mmHg** means blood is again delivering CO2 to the lungs, the earliest sign of ROSC along with a palpable pulse, measurable blood pressure and spontaneous movement.", "objective": "", "hint": "Exhaled CO2 depends on pulmonary **blood flow** during a code. A sudden rise means more blood is reaching the lungs, which has one happy explanation, and the response is to verify it without breaking the CPR cycle early."}, {"id": "39", "group": 39, "slide": 58, "section": "ROSC", "topic": "Post-ROSC care", "skill": "Management", "stem": "Which interventions belong in the immediate post-ROSC management bundle?", "options": [{"letter": "A", "text": "Obtain a 12-lead ECG to look for STEMI needing the cath lab"}, {"letter": "B", "text": "Maintain a MAP above 65 mmHg with fluids and vasopressors"}, {"letter": "C", "text": "Titrate oxygen to keep SpO2 at 100 percent"}, {"letter": "D", "text": "Targeted temperature management at 36 degrees C for 36 hours"}, {"letter": "E", "text": "Place an endotracheal tube now that compressions have stopped"}, {"letter": "F", "text": "Hyperventilate to blow off accumulated CO2"}], "answer": "ABDE", "explanation": "**Post-ROSC care** is airway, EKG, TTM: intubate once a pulse is back (CPR pauses were capped at 10 seconds), 12-lead for STEMI, TTM 36 C for 36 hours, MAP above 65, SpO2 92 to 98 percent with normocapnia, treat the cause, and admit to the ICU.", "objective": "", "hint": "The goal is preventing **secondary brain injury**, which means normal oxygen and normal CO2 rather than extremes of either, plus the three deck items of definitive airway, a tracing of the heart, and temperature control."}, {"id": "40", "group": 40, "slide": 63, "section": "Cardiac Arrest in Special Populations", "topic": "Cardiac arrest in pregnancy", "skill": "Management", "stem": "Which two modifications to resuscitation apply to a pregnant patient in cardiac arrest?", "options": [{"letter": "A", "text": "Left lateral tilt only, with delivery deferred until ROSC"}, {"letter": "B", "text": "Half-dose epinephrine and no defibrillation"}, {"letter": "C", "text": "Compressions over the upper abdomen and immediate ECMO"}, {"letter": "D", "text": "Lateral uterine displacement during CPR and perimortem cesarean by 5 minutes"}], "answer": "D", "explanation": "In **maternal arrest** the gravid uterus is displaced laterally to relieve aortocaval compression, and if ROSC is not achieved a perimortem cesarean is performed by 5 minutes; drugs and defibrillation are otherwise unchanged.", "objective": "", "hint": "The two changes solve a single mechanical problem, the uterus compressing venous return, first by moving it and then, on a strict **clock**, by emptying it. Drug doses and shocks are not modified."}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  const normAns = a => (Array.isArray(a) ? a.join('') : String(a == null ? '' : a))
    .toUpperCase().replace(/[^A-Z]/g, '').split('')
    .filter((v, i, z) => z.indexOf(v) === i).sort().join('');
  questions.forEach(q => { const n = normAns(q.answer); q.multi = q.multi === true || n.length > 1; q.answer = n; });
  const picks = {};          // question id -> letters picked but not yet submitted (multi only)
  const second = {};         // question id -> second-attempt answer (NOT scored)
  const flagged = {};        // question id -> true, set by the student at any point
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const keys = new Set(String(item.answer).split('').map(l => (item.options.find(o => o.letter === l) || {}).text));
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = item.options.filter(o => keys.has(o.text)).map(o => o.letter).join('');
  }
  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letters) => String(letters == null ? '' : letters).split('')
    .map(l => { const o = item.options.find(x => x.letter === l); return o ? o.text : ''; })
    .filter(Boolean).join(' \u00b7 ');
  const letters = v => String(v == null ? '' : v).split('').join(', ');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Hint, then the same question again =================
  // A missed question is never replaced by new questions. The student gets a hint
  // that points hard at the answer without naming it, then the SAME question again.
  // The FIRST attempt is what is scored; the second only decides whether the concept
  // is recorded as relearned or still shaky.
  function hintOf(q) {
    const r = q.remediation || {};
    return q.hint || r.hint || ((r.steps || [])[0] || {}).teach || '';
  }
  function hasTutor(q) { return !!hintOf(q); }

  function startTutor(q) {
    tutor[q.id] = { status: 'active', first: answers[q.id] };
    delete picks[q.id];
  }

  function isRetrying(q) { const t = tutor[q.id]; return !!(t && t.status === 'active'); }

  function secondAnswer(q, picked) {
    const t = tutor[q.id];
    if (!t || t.status !== 'active') return;
    second[q.id] = picked;
    t.status = picked === q.answer ? 'mastered' : 'review';
  }

  // The option already shown to be wrong is struck out on the retry. A select-all
  // answer is a set rather than one claim, so there every option stays live.
  function elimOf(q) { const t = tutor[q.id]; return (t && !q.multi && t.first) ? t.first : ''; }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong with no hint to give, or the second attempt is in.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return !isRetrying(q);
  }

  function tutorStatus(q) { const t = tutor[q.id]; return t ? t.status : null; }

  function hintHtml(q) {
    return '<div class="tutor"><div class="tutor-head">Hint</div>' +
      '<div class="tnode active hint"><span class="tlabel">Try again \u2014 same question</span>' +
      '<div class="teach">' + fmt(hintOf(q)) + '</div></div></div>';
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly can still be carried into the next round of study.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">\u2691 ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '\u2691 ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  // Collapsed record of the retry, shown in the review screens
  function trailHtml(q) {
    const t = tutor[q.id];
    if (!t) return '';
    const sec = second[q.id];
    let html = '<div class="tutor"><div class="tutor-head">Hint and second attempt</div>' +
      '<div class="tnode done"><div class="teach">' + fmt(hintOf(q)) + '</div>' +
      '<div class="firstpick">First answer: ' + esc(letters(t.first)) + '. ' + fmt(optText(q, t.first)) + '</div>';
    if (sec === undefined) html += '<div class="nudge">Second attempt not taken.</div>';
    else html += '<div class="feedback ' + (t.status === 'mastered' ? 'good' : 'bad') + '"><div class="verdict">' +
      (t.status === 'mastered' ? '\u2713 Correct on the second attempt'
        : '\u2717 Second attempt: ' + esc(letters(sec)) + '. ' + fmt(optText(q, sec))) + '</div></div>';
    return html + '</div></div>';
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen, first) {
    const good = chosen === q.answer;
    const keyTxt = optText(q, q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '\u2713 Correct' : '\u2717 Incorrect \u2014 correct answer' +
      (q.multi ? 's' : '') + ': ' + esc(letters(q.answer)) + (keyTxt ? '. ' + fmt(keyTxt) : '')) + '</div>';
    if (!good && q.multi) {
      const got = String(chosen || '').split('').filter(Boolean);
      const missed = String(q.answer).split('').filter(l => got.indexOf(l) === -1);
      const extra = got.filter(l => q.answer.indexOf(l) === -1), bits = [];
      if (missed.length) bits.push('missed ' + missed.join(', '));
      if (extra.length) bits.push('wrongly included ' + extra.join(', '));
      if (bits.length) html += '<div class="obj" style="font-style:normal">You ' + esc(bits.join(' and ')) + '.</div>';
    }
    if (first !== undefined && first !== chosen) {
      html += '<div class="firstpick">First attempt: ' + esc(letters(first)) + '. ' + fmt(optText(q, first)) +
        (good ? ' \u2014 corrected after the hint.' : ' \u2014 also incorrect.') + '</div>';
    }
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const first = answers[q.id];
    const sec = second[q.id];
    const retry = isRetrying(q) && mode === 'exam';
    const answered = first !== undefined && !retry;
    const chosen = sec !== undefined ? sec : first;
    const status = tutorStatus(q);
    const sel = answered ? String(chosen || '') : (q.multi ? (picks[q.id] || []).join('') : '');
    const dead = retry ? elimOf(q) : '';

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Right on the second try</span>';
    else if (status === 'review') html += '<span class="badge review">Missed twice</span>';
    else if (status === 'active') html += '<span class="badge active">Second attempt</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';

    if (retry) {
      html += '<div class="feedback tutoring"><div class="verdict">\u2717 Not quite \u2014 ' +
        esc(letters(first)) + '. ' + fmt(optText(q, first)) + '</div>' +
        '<div>Read the hint, then answer the same question again. Your first answer is the one that is scored.</div></div>';
      html += hintHtml(q);
    }

    if (q.multi && !answered) html += '<div class="sata-note">Select all that apply.</div>';
    html += '<div class="opts">';
    q.options.forEach(o => {
      let cls = 'opt';
      const hit = sel.indexOf(o.letter) !== -1;
      const out = dead.indexOf(o.letter) !== -1;
      if (answered) {
        if (hit) cls += q.answer.indexOf(o.letter) !== -1 ? ' correct' : ' incorrect';
        else if (q.answer.indexOf(o.letter) !== -1) cls += ' correct';
        else cls += ' dim';
      } else if (out) cls += ' incorrect elim';
      else if (hit) cls += ' picked';
      const mark = (q.multi ? '<span class="box' + (hit ? ' on' : '') + '">' + (hit ? '\u2713' : '') + '</span>' : '') +
        '<span class="letter">' + esc(o.letter) + '.</span>';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered || out || mode !== 'exam' ? ' disabled' : '') + '>' +
        mark + '<span>' + fmt(o.text) + '</span></button>';
    });
    html += '</div>';
    if (q.multi && !answered) {
      const n = (picks[q.id] || []).length;
      html += '<div class="sata-bar"><button class="opt-submit" data-submit="' + esc(q.id) + '"' +
        (n ? '' : ' disabled') + '>Submit answer</button><span class="sata-count">' +
        (n ? n + ' selected' : 'Choose one or more') + '</span></div>';
    }
    if (answered) html += feedbackHtml(q, chosen, sec !== undefined ? first : undefined);
    html += flagHtml(q);
    if (mode !== 'exam' && tutor[q.id]) {
      html += '<details class="trail"><summary>Hint and second attempt</summary>' + trailHtml(q) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'take the second attempt above to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Option clicks: first attempt, then the second attempt on the same question
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      const commit = picked => {
        const q = byId[qid];
        if (answers[qid] === undefined) {
          answers[qid] = picked;
          if (picked !== q.answer && hasTutor(q)) startTutor(q);
        } else if (isRetrying(q)) secondAnswer(q, picked);
        renderPage(true);
      };
      card.querySelectorAll(':scope > .opts > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          const q = byId[qid];
          if (answers[qid] !== undefined && !isRetrying(q)) return;
          const letter = btn.getAttribute('data-letter');
          if (q.multi) {                       // toggle; nothing is committed until Submit
            const cur = picks[qid] || (picks[qid] = []);
            const at = cur.indexOf(letter);
            if (at === -1) cur.push(letter); else cur.splice(at, 1);
            return renderPage(true);
          }
          commit(letter);
        });
      });
      const sub = card.querySelector(':scope > .sata-bar > .opt-submit');
      if (sub) sub.addEventListener('click', () => {
        if (mode !== 'exam') return;
        const cur = picks[qid] || [];
        if (cur.length) commit(cur.slice().sort().join(''));
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.qcard > .feedback');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      if (second[id] !== undefined) { ts.tq++; if (t.status === 'mastered') ts.tqRight++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {                 // wrong on the first attempt, or flagged
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' still shaky');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' right on the second try');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed question' + (r.ts.started === 1 ? '' : 's') + ' answered right on the second attempt</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try, plus anything you flagged</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed or flagged — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, flagged: 2, mastered: 3 };
      const items = missed.map(q => {
        const wrong = answers[q.id] !== undefined && answers[q.id] !== q.answer;
        let st = wrong ? (tutor[q.id] ? tutor[q.id].status : 'missed') : 'flagged';
        if (st === 'active') st = 'review';
        return { q, st: st, flag: !!flagged[q.id] };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', flagged: 'Flagged', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + (it.flag && it.st !== 'flagged' ? '⚑ ' : '') +
          label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Second attempts</h2><div class="sub" style="margin-bottom:12px">How the hint-and-retry went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>missed on the first try</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>right after the hint</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>second attempts right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered'
        : 'My answer (first attempt, scored): ' + letters(answers[q.id]));
      lines.push('Correct answer: ' + letters(q.answer) + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        lines.push('Hint shown: ' + plain(hintOf(q)));
        lines.push('Second attempt: ' + { mastered: 'CORRECT after the hint', review: 'still wrong \u2014 needs review',
          active: 'not taken' }[t.status]);
        if (second[q.id] !== undefined && t.status !== 'mastered')
          lines.push('  picked ' + letters(second[q.id]) + '. ' + plain(optText(q, second[q.id])));
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(second).forEach(k => delete second[k]);
    Object.keys(picks).forEach(k => delete picks[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
