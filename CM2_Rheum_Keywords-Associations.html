<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

ive": "", "section": "Lupus Family"}, {"id": "20", "group": 20, "stem": "Ultimate goal of rehabilitation (ICF) →", "options": [{"letter": "A", "text": "Participation"}, {"letter": "B", "text": "Independence in ADLs"}, {"letter": "C", "text": "Return to work"}, {"letter": "D", "text": "Remediation of impairment"}, {"letter": "E", "text": "Pain control"}], "answer": "A", "explanation": "ICF: body structure/function → activity → participation; participation is the ultimate goal.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "21", "group": 21, "stem": "Sjögren patient with persistent unilateral parotid enlargement, lymphadenopathy, new cytopenia → Evaluate for:", "options": [{"letter": "A", "text": "Parotid abscess"}, {"letter": "B", "text": "Sarcoidosis"}, {"letter": "C", "text": "Sialolithiasis"}, {"letter": "D", "text": "Mumps"}, {"letter": "E", "text": "Non-Hodgkin lymphoma"}], "answer": "E", "explanation": "Sjögren carries an increased risk of NHL.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "22", "group": 22, "stem": "Dry gritty eyes + dry mouth + bilateral parotid enlargement + dental caries → Diagnosis:", "options": [{"letter": "A", "text": "Diabetes mellitus"}, {"letter": "B", "text": "Mumps"}, {"letter": "C", "text": "Sjögren syndrome"}, {"letter": "D", "text": "Sarcoidosis"}, {"letter": "E", "text": "Anticholinergic side effect"}], "answer": "C", "explanation": "Sicca + parotid enlargement = Sjögren; ANA/RF/SSA/SSB positive.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "23", "group": 23, "stem": "Sausage digit (dactylitis) → Disease family:", "options": [{"letter": "A", "text": "Spondyloarthropathies (PsA, reactive)"}, {"letter": "B", "text": "Crystal arthropathy"}, {"letter": "C", "text": "Rheumatoid arthritis"}, {"letter": "D", "text": "Osteoarthritis"}, {"letter": "E", "text": "Lupus"}], "answer": "A", "explanation": "Dactylitis and enthesitis are SpA hallmarks.", "objective": "", "  styloid, 20–30° elbow flexion"}, {"letter": "E", "text": "Elbow locked straight, tips at shoulder width"}], "answer": "B", "explanation": "Axillary crutch: 2–3 fingers below axilla, tips slightly wider than shoulders, weight on hands.", "objective": "", "section": "Assistive Devices"}, {"id": "28", "group": 28, "stem": "Newly diagnosed dermatomyositis → Mandatory evaluation:", "options": [{"letter": "A", "text": "HLA-B27"}, {"letter": "B", "text": "Age-appropriate malignancy screening"}, {"letter": "C", "text": "Echocardiogram for Libman-Sacks"}, {"letter": "D", "text": "Renal biopsy"}, {"letter": "E", "text": "Temporal artery biopsy"}], "answer": "B", "explanation": "Cancer in 15–20% of DM (7–10% PM) — screen every patient.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "29", "group": 29, "stem": "Long-term device for a patient with MS or cerebral palsy with balance and weakness deficits →", "options": [{"letter": "A", "text": "Standard walker"}, {"letter": "B", "text": "Straight cane"}, {"letter": "C", "text": "Lofstrand (forearm) crutches"}, {"letter": "D", "text": "Hemi-walker"}, {"letter": "E", "text": "Axillary crutches"}], "answer": "C", "explanation": "Lofstrand = long-term neurologic use; cuff 3 finger widths below the elbow, grip at wrist height. Axillary = temporary ortho.", "objective": "", "section": "Assistive Devices"}, {"id": "30", "group": 30, "stem": "Patient of African or South Asian descent before starting allopurinol → Test:", "options": [{"letter": "A", "text": "HLA-B51"}, {"letter": "B", "text": "HLA-B27"}, {"letter": "C", "text": "HLA-B*58:01"}, {"letter": "D", "text": "G6PD level"}, {"letter": "E", "text": "HLA-DR4"}], "answer": "C", "explanation": "HLA-B*58:01 predicts allopurinol hypersensitivity syndrome.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "31", "group": 31, "stem": "Hand X-ray with periarticular osteopenia and marginal erosions → Diagnosis:", "options": [{"letter": "A", "text": "Psoriatic arthritis"}, {"letter": "B", "text": "CPPD"}, {"letter": "C", "text": "Gout"}, {"letter": "D", "text": "Osteoarthritis"}, {"letter": "E", "text": "Rheumatoid arthritis"}], "answer": "E", "explanation": "RA: periarticular osteopenia, marginal erosions, joint-space narrowing (late; normal early). Gout: punched-out erosions with overhanging edges. PsA: pencil-in-cup.", "objective": "", "section": "RA & JIA"}, {"id": "32", "group": 32, "stem": "BADLs/IADLs, fine motor, visual-spatial skills, upper-extremity orthotics → Team member:", "options": [{"letter": "A", "text": "Speech-language pathologist"}, {"letter": "B", "text": "Orthotist"}, {"letter": "C", "text": "Occupational therapist"}, {"letter": "D", "text": "Physical therapist"}, {"letter": "E", "text": "Rehab nurse"}], "answer": "C", "explanation": "OT = daily living, fine motor, visual-spatial, UE orthotics; PT = gross motor, mobility, falls, home assessment.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "33", "group": 33, "stem": "Ventilator/trach weaning, wound vac, prolonged IV antibiotics → Rehab setting:", "options": [{"letter": "A", "text": "Subacute rehab (SNF)"}, {"letter": "B", "text": "Acute inpatient rehabilitation"}, {"letter": "C", "text": "Outpatient"}, {"letter": "D", "text": "Long-term acute care (LTAC)"}, {"letter": "E", "text": "Home health"}], "answer": "D", "explanation": "LTAC: MD daily, RT ≥TID, skilled nursing ≥7 h/day, LOS ~30 days.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "34", "group": 34, "stem": "Non-weight-bearing, toe-touch or partial weight-bearing order → Device requirement:", "options": [{"letter": "A", "text": "A hemi-walker"}, {"letter": "B", "text": "No device needed"}, {"letter": "C", "text": "A quad cane"}, {"letter": "D", "text": "A straight cane in the opposite hand"}, {"letter": "E", "text": "Bilateral upper-extremity support — walker, crutches or parallel bars"}], "answer": "E", "explanation": "Limited WB (NWB/TTWB/PWB) requires bilateral UE support; canes only for WBAT/FWB.", "objective": "", "section": "Assistive Devices"}, {"id": "35", "group": 35, "stem": "Anti-SSA (Ro) positive mother → Fetal risk:", "options": [{"letter": "A", "text": "Neonatal lupus / congenital heart block"}, {"letter": "B", "text": "Fetal loss from thrombosis"}, {"letter": "C", "text": "Fetal hydrops from anemia"}, {"letter": "D", "text": "Neural tube defect"}, {"letter": "E", "text": "Macrosomia"}], "answer": "A", "explanation": "SSA crosses the placenta → neonatal lupus and congenital heart block; hydroxychloroquine reduces the risk.", "objective": "", "section": "Lupus Family"}, {"id": "36", "group": 36, "stem": "Reactive arthritis → Initial treatment:", "options": [{"letter": "A", "text": "NSAIDs (+ antibiotics only if infection still active)"}, {"letter": "B", "text": "Sulfasalazine"}, {"letter": "C", "text": "Methotrexate"}, {"letter": "D", "text": "Prednisone 1 mg/kg"}, {"letter": "E", "text": "TNF inhibitor"}], "answer": "A", "explanation": "NSAIDs first; persistent >3–6 months → methotrexate or TNF inhibitors.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "37", "group": 37, "stem": "Violaceous upper eyelids + scaly papules over the knuckles → Diagnosis:", "options": [{"letter": "A", "text": "Polymyositis"}, {"letter": "B", "text": "Systemic lupus erythematosus"}, {"letter": "C", "text": "Dermatomyositis"}, {"letter": "D", "text": "Allergic contact dermatitis"}, {"letter": "E", "text": "Psoriasis"}], "answer": "C", "explanation": "Heliotrope rash + Gottron papules (highly specific) = dermatomyositis; also shawl/V sign, mechanic's hands.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "38", "group": 38, "stem": "Chalky nodules on the ear helix and olecranon → Finding and diagnosis:", "options": [{"letter": "A", "text": "Rheumatoid nodules — RA"}, {"letter": "B", "text": "Tophi — chronic tophaceous gout"}, {"letter": "C", "text": "Calcinosis — limited scleroderma"}, {"letter": "D", "text": "Gottron papules — dermatomyositis"}, {"letter": "E", "text": "Xanthomas — hyperlipidemia"}], "answer": "B", "explanation": "Tophi = MSU deposits; their presence is itself an indication for urate-lowering therapy with target <5 mg/dL.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "39", "group": 39, "stem": "Polymyalgia rheumatica → Screen at every visit for:", "options": [{"letter": "A", "text": "Uveitis"}, {"letter": "B", "text": "Lupus nephritis"}, {"letter": "C", "text": "Malignancy of the colon"}, {"letter": "D", "text": "Interstitial lung disease"}, {"letter": "E", "text": "Giant cell arteritis symptoms"}], "answer": "E", "explanation": "20% of PMR develop GCA; 40–50% of GCA have PMR — ask about headache, jaw claudication, vision.", "objective": "", "section": "Vasculitis"}, {"id": "40", "group": 40, "stem": "Synovial fluid WBC >50,000/µL with a positive Gram stain → Fluid class:", "options": [{"letter": "A", "text": "Inflammatory"}, {"letter": "B", "text": "Hemorrhagic"}, {"letter": "C", "text": "Non-inflammatory"}, {"letter": "D", "text": "Crystal"}, {"letter": "E", "text": "Septic"}], "answer": "E", "explanation": "Septic fluid is >50,000 with Gram stain/culture positive — never inject a steroid.", "objective": "", "section": "Approach & Labs"}, {"id": "41", "group": 41, "stem": "Non-severe EGPA → Targeted biologic:", "options": [{"letter": "A", "text": "Adalimumab (TNF)"}, {"letter": "B", "text": "Rituximab (CD20)"}, {"letter": "C", "text": "Mepolizumab (IL-5)"}, {"letter": "D", "text": "Secukinumab (IL-17)"}, {"letter": "E", "text": "Tocilizumab (IL-6)"}], "answer": "C", "explanation": "Mepolizumab for less severe EGPA; severe → steroids + rituximab/cyclophosphamide.", "objective": "", "section": "Vasculitis"}, {"id": "42", "group": 42, "stem": "Antiphospholipid syndrome with thrombosis → Long-term anticoagulant:", "options": [{"letter": "A", "text": "Low-molecular-weight heparin for 3 months only"}, {"letter": "B", "text": "Aspirin alone"}, {"letter": "C", "text": "Clopidogrel"}, {"letter": "D", "text": "Warfarin"}, {"letter": "E", "text": "Apixaban"}], "answer": "D", "explanation": "LMWH bridging → warfarin long term (usually lifelong); DOACs only in mild disease.", "objective": "", "section": "Lupus Family"}, {"id": "43", "group": 43, "stem": "Increasing hat size, hearing loss, bowed tibia, warmth over the bone → Diagnosis:", "options": [{"letter": "A", "text": "Osteosarcoma"}, {"letter": "B", "text": "Acromegaly"}, {"letter": "C", "text": "Osteomalacia"}, {"letter": "D", "text": "Fibrous dysplasia"}, {"letter": "E", "text": "Paget's disease of bone"}], "answer": "E", "explanation": "Skull enlargement, deafness (ossicle ankylosis + auditory meatus narrowing), bowing, hypervascular warm bone = Paget's. Acromegaly enlarges hands/feet/jaw (IGF-1).", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "44", "group": 44, "stem": "Hemiparetic arm hanging unsupported at the bedside → Correct care:", "options": [{"letter": "A", "text": "Position/support the shoulder, ROM, resting hand splint — never pull on the arm"}, {"letter": "B", "text": "Begin heavy resistance training"}, {"letter": "C", "text": "Immobilize the shoulder in a sling full-time"}, {"letter": "D", "text": "Pull the patient up by the arm to mobilize early"}, {"letter": "E", "text": "Leave the hand flexed to prevent spasm"}], "answer": "A", "explanation": "Position → ROM → splint → task practice; avoid pulling on the arm or ignoring shoulder pain.", "objective": "", "section": "Neuro Rehab"}, {"id": "45", "group": 45, "stem": "Pulmonary hemorrhage + glomerulonephritis together → Category:", "options": [{"letter": "A", "text": "Large-vessel vasculitis (GCA)"}, {"letter": "B", "text": "Variable-vessel vasculitis (Behçet)"}, {"letter": "C", "text": "Immune-complex vasculitis (IgA)"}, {"letter": "D", "text": "Small-vessel ANCA-associated vasculitis"}, {"letter": "E", "text": "Medium-vessel vasculitis (PAN)"}], "answer": "D", "explanation": "Pulmonary-renal syndrome = GPA/MPA/EGPA — never PAN.", "objective": "", "section": "Vasculitis"}, {"id": "46", "group": 46, "stem": "Before starting a TNF blocker → Mandatory screening:", "options": [{"letter": "A", "text": "Retinal exam"}, {"letter": "B", "text": "HLA-B27"}, {"letter": "C", "text": "Pulmonary function tests"}, {"letter": "D", "text": "TB, hepatitis B/C, HIV"}, {"letter": "E", "text": "DEXA scan"}], "answer": "D", "explanation": "All biologics/JAKi: TB (PPD/Quantiferon), hepatitis B/C, HIV, CXR before starting.", "objective": "", "section": "RA & JIA"}, {"id": "47", "group": 47, "stem": "Suspected inflammatory myopathy → Best initial test:", "options": [{"letter": "A", "text": "Creatine kinase"}, {"letter": "B", "text": "Anti-Jo-1"}, {"letter": "C", "text": "Muscle biopsy"}, {"letter": "D", "text": "MRI of the thighs"}, {"letter": "E", "text": "EMG"}], "answer": "A", "explanation": "CK (and aldolase) first; EMG myopathic; muscle biopsy is the gold standard.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "48", "group": 48, "stem": "Raynaud + arthritis + puffy hands with high-titer anti-U1-RNP and negative dsDNA/Smith → Diagnosis:", "options": [{"letter": "A", "text": "Limited systemic sclerosis"}, {"letter": "B", "text": "Mixed connective tissue disease"}, {"letter": "C", "text": "Systemic lupus erythematosus"}, {"letter": "D", "text": "Polymyositis"}, {"letter": "E", "text": "Sjögren syndrome"}], "answer": "B", "explanation": "MCTD = overlap of SLE/SSc/PM held together by anti-U1-RNP; watch for ILD/pulmonary hypertension.", "objective": "", "section": "Lupus Family"}, {"id": "49", "group": 49, "stem": "Complex regional pain syndrome → How the diagnosis is made:", "options": [{"letter": "A", "text": "Bone scan"}, {"letter": "B", "text": "Nerve conduction studies"}, {"letter": "C", "text": "MRI of the limb"}, {"letter": "D", "text": "Exclusion of all other causes"}, {"letter": "E", "text": "Clinically, by the Budapest criteria"}], "answer": "E", "explanation": "CRPS is NOT a diagnosis of exclusion — it is made positively on Budapest criteria; imaging and labs are optional.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "50", "group": 50, "stem": "Gold standard for giant cell arteritis →", "options": [{"letter": "A", "text": "Temporal artery biopsy"}, {"letter": "B", "text": "MR angiography"}, {"letter": "C", "text": "Fundoscopy"}, {"letter": "D", "text": "Temporal artery ultrasound"}, {"letter": "E", "text": "ESR and CRP"}], "answer": "A", "explanation": "Biopsy → granulomatous inflammation with giant cells; stays positive ~2 weeks after steroids start.", "objective": "", "section": "Vasculitis"}, {"id": "51", "group": 51, "stem": "Lupus-like fever, arthritis and serositis after starting an antiarrhythmic → Drug:", "options": [{"letter": "A", "text": "Digoxin"}, {"letter": "B", "text": "Metoprolol"}, {"letter": "C", "text": "Diltiazem"}, {"letter": "D", "text": "Amiodarone"}, {"letter": "E", "text": "Procainamide"}], "answer": "E", "explanation": "CHIMP Q: chlorpromazine, hydralazine, INH, methyldopa, procainamide, quinidine; also minocycline, TNF blockers.", "objective": "", "section": "Lupus Family"}, {"id": "52", "group": 52, "stem": "Recurrent painful oral AND genital ulcers + uveitis in a young Middle-Eastern man → Diagnosis:", "options": [{"letter": "A", "text": "Behçet syndrome"}, {"letter": "B", "text": "Crohn disease"}, {"letter": "C", "text": "Herpes simplex"}, {"letter": "D", "text": "Reactive arthritis"}, {"letter": "E", "text": "Systemic lupus erythematosus"}], "answer": "A", "explanation": "Behçet: oral + genital ulcers, uveitis/hypopyon, erythema nodosum, pathergy, venous thrombosis; HLA-B51.", "objective": "", "section": "Vasculitis"}, {"id": "53", "group": 53, "stem": "Complex regional pain syndrome → First-line treatment:", "options": [{"letter": "A", "text": "CRPS-specific PT/OT for about 6 months"}, {"letter": "B", "text": "Opioid analgesia"}, {"letter": "C", "text": "Long-term oral steroids"}, {"letter": "D", "text": "Sympathetic nerve block"}, {"letter": "E", "text": "Spinal cord stimulator"}], "answer": "A", "explanation": "PT/OT to restore function; NSAIDs, a 2–4 wk steroid course, bisphosphonates, gabapentin/TCA adjuncts; stimulator and blocks for refractory disease.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "54", "group": 54, "stem": "Granulomatosis with polyangiitis → Induction therapy:", "options": [{"letter": "A", "text": "High-dose steroids + cyclophosphamide or rituximab"}, {"letter": "B", "text": "Apremilast"}, {"letter": "C", "text": "Methotrexate alone"}, {"letter": "D", "text": "Prednisone 10–20 mg alone"}, {"letter": "E", "text": "Mepolizumab"}], "answer": "A", "explanation": "Induce with steroids + cyclophosphamide or rituximab; maintain with MMF, azathioprine or rituximab.", "objective": "", "section": "Vasculitis"}, {"id": "55", "group": 55, "stem": "Unprovoked DVT + recurrent fetal loss + thrombocytopenia + prolonged PTT → Diagnosis:", "options": [{"letter": "A", "text": "Factor V Leiden"}, {"letter": "B", "text": "Immune thrombocytopenia"}, {"letter": "C", "text": "Antiphospholipid syndrome"}, {"letter": "D", "text": "Disseminated intravascular coagulation"}, {"letter": "E", "text": "Protein C deficiency"}], "answer": "C", "explanation": "APS: persistent lupus anticoagulant / anticardiolipin / anti-β2GP1 + thrombosis or pregnancy morbidity.", "objective": "", "section": "Lupus Family"}, {"id": "56", "group": 56, "stem": "Anticentromere antibody → Diagnosis and feared complication:", "options": [{"letter": "A", "text": "Diffuse SSc — interstitial lung disease"}, {"letter": "B", "text": "Limited SSc (CREST) — pulmonary arterial hypertension"}, {"letter": "C", "text": "Diffuse SSc — renal crisis"}, {"letter": "D", "text": "MCTD — myositis"}, {"letter": "E", "text": "Sjögren — lymphoma"}], "answer": "B", "explanation": "Anticentromere = limited cutaneous SSc; PAH is the usual cause of death.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "57", "group": 57, "stem": "Medication that can precipitate scleroderma renal crisis →", "options": [{"letter": "A", "text": "Mycophenolate"}, {"letter": "B", "text": "Lisinopril"}, {"letter": "C", "text": "Prednisone above 7.5 mg/day"}, {"letter": "D", "text": "Nifedipine"}, {"letter": "E", "text": "Omeprazole"}], "answer": "C", "explanation": "Avoid steroids >7.5 mg in diffuse SSc; CCBs may protect.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "58", "group": 58, "stem": "Scleroderma interstitial lung disease → Treatment options:", "options": [{"letter": "A", "text": "Prednisone 1 mg/kg"}, {"letter": "B", "text": "Mycophenolate, cyclophosphamide, nintedanib, tocilizumab"}, {"letter": "C", "text": "Sildenafil, bosentan"}, {"letter": "D", "text": "ACE inhibitor"}, {"letter": "E", "text": "Methotrexate"}], "answer": "B", "explanation": "ILD: MMF, cyclophosphamide, rituximab, nintedanib, tocilizumab. PAH: CCBs, sildenafil/tadalafil, bosentan, iloprost.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "59", "group": 59, "stem": "Teratogenic DMARD that persists in the body for up to 2 years →", "options": [{"letter": "A", "text": "Leflunomide"}, {"letter": "B", "text": "Sulfasalazine"}, {"letter": "C", "text": "Etanercept"}, {"letter": "D", "text": "Hydroxychloroquine"}, {"letter": "E", "text": "Methotrexate"}], "answer": "A", "explanation": "Leflunomide needs a 2-year washout (or cholestyramine) — avoid in women planning pregnancy.", "objective": "", "section": "RA & JIA"}, {"id": "60", "group": 60, "stem": "Arthritis that moves from joint to joint, each resolving as the next begins → Pattern and classic cause:", "options": [{"letter": "A", "text": "Migratory — gonococcal / rheumatic fever / Lyme"}, {"letter": "B", "text": "Oligoarticular — spondyloarthritis"}, {"letter": "C", "text": "Additive — rheumatoid arthritis"}, {"letter": "D", "text": "Monoarticular — crystal arthritis"}, {"letter": "E", "text": "Symmetric polyarticular — lupus"}], "answer": "A", "explanation": "Migratory = rheumatic fever, gonococcal, Lyme, palindromic. Additive = reactive, RA, AS, PsA.", "objective": "", "section": "Approach & Labs"}, {"id": "61", "group": 61, "stem": "Giant cell arteritis with any visual symptom → Immediate action:", "options": [{"letter": "A", "text": "Prednisone 10 mg daily"}, {"letter": "B", "text": "MRI brain first"}, {"letter": "C", "text": "Aspirin and ophthalmology referral"}, {"letter": "D", "text": "IV methylprednisolone 1 g now — before the biopsy"}, {"letter": "E", "text": "Schedule temporal artery biopsy, then treat"}], "answer": "D", "explanation": "Visual symptoms = impending blindness; steroids first, biopsy within 2 weeks (it stays positive).", "objective": "", "section": "Vasculitis"}, {"id": "62", "group": 62, "stem": "New severe pain and swelling in a known pagetic bone → Rule out:", "options": [{"letter": "A", "text": "Pathologic fracture"}, {"letter": "B", "text": "Osteomyelitis"}, {"letter": "C", "text": "Osteosarcoma"}, {"letter": "D", "text": "Gout"}, {"letter": "E", "text": "Septic arthritis"}], "answer": "C", "explanation": "Osteosarcoma (<1%) — new pain or a mass in pagetic bone is a red flag.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "63", "group": 63, "stem": "Known RA on methotrexate with one joint far hotter and more swollen than the rest → Next step:", "options": [{"letter": "A", "text": "Start a prednisone bridge"}, {"letter": "B", "text": "Aspirate that joint to exclude infection"}, {"letter": "C", "text": "Increase the methotrexate dose"}, {"letter": "D", "text": "Inject intra-articular steroid"}, {"letter": "E", "text": "Add a TNF blocker"}], "answer": "B", "explanation": "A single disproportionately hot joint in an immunosuppressed patient = septic arthritis until proven otherwise.", "objective": "", "section": "RA & JIA"}, {"id": "64", "group": 64, "stem": "Wet, gurgly voice after swallowing and coughing with thin liquids → Next step:", "options": [{"letter": "A", "text": "Start aspiration-pneumonia antibiotics"}, {"letter": "B", "text": "Insert a feeding tube"}, {"letter": "C", "text": "Thicken liquids and continue the diet"}, {"letter": "D", "text": "Order a chest X-ray and continue PO"}, {"letter": "E", "text": "SLP bedside swallow evaluation; NPO if high risk; review medication routes"}], "answer": "E", "explanation": "Dysphagia is a medical safety issue — SLP evaluation, keep NPO until clarified, check med routes.", "objective": "", "section": "Neuro Rehab"}, {"id": "65", "group": 65, "stem": "Child under 16 with swollen knee and ankle for 3 months, ANA positive, RF negative → Diagnosis:", "options": [{"letter": "A", "text": "Oligoarticular JIA"}, {"letter": "B", "text": "Reactive arthritis"}, {"letter": "C", "text": "Polyarticular JIA"}, {"letter": "D", "text": "Septic arthritis"}, {"letter": "E", "text": "Systemic JIA (Still disease)"}], "answer": "A", "explanation": "Oligoarticular (≤4 joints, knees/hips) is the most common JIA subtype; ANA+ marks uveitis risk.", "objective": "", "section": "RA & JIA"}, {"id": "66", "group": 66, "stem": "\"Can't see, can't pee, can't climb a tree\" → Diagnosis:", "options": [{"letter": "A", "text": "Ankylosing spondylitis"}, {"letter": "B", "text": "Gonococcal arthritis"}, {"letter": "C", "text": "Reactive arthritis"}, {"letter": "D", "text": "Psoriatic arthritis"}, {"letter": "E", "text": "Behçet syndrome"}], "answer": "C", "explanation": "Reiter triad: conjunctivitis + urethritis + arthritis within 2 months of a GI/GU infection.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "67", "group": 67, "stem": "Symptomatic Paget's disease → Most effective treatment:", "options": [{"letter": "A", "text": "Oral alendronate"}, {"letter": "B", "text": "Denosumab"}, {"letter": "C", "text": "Single-dose IV zoledronate"}, {"letter": "D", "text": "Teriparatide"}, {"letter": "E", "text": "Calcitonin"}], "answer": "C", "explanation": "Zoledronate IV single dose is most effective; oral risedronate/alendronate are alternatives; NSAIDs/acetaminophen until it works.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "68", "group": 68, "stem": "Suspected Sjögren with negative SSA/SSB → Confirmatory test:", "options": [{"letter": "A", "text": "Salivary flow rate"}, {"letter": "B", "text": "ANA titer"}, {"letter": "C", "text": "Parotid ultrasound"}, {"letter": "D", "text": "Lip (minor salivary gland) biopsy"}, {"letter": "E", "text": "Sialography"}], "answer": "D", "explanation": "Lip biopsy → focal lymphocytic sialadenitis.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "69", "group": 69, "stem": "Halting, effortful telegraphic speech; the patient knows what he wants to say → Diagnosis:", "options": [{"letter": "A", "text": "Receptive aphasia"}, {"letter": "B", "text": "Dysphonia"}, {"letter": "C", "text": "Expressive aphasia"}, {"letter": "D", "text": "Dysarthria"}, {"letter": "E", "text": "Global aphasia"}], "answer": "C", "explanation": "Expressive aphasia → use yes/no questions, gestures, writing, pictures; relevant to capacity assessment.", "objective": "", "section": "Neuro Rehab"}, {"id": "70", "group": 70, "stem": "Biologic class associated with GI perforation →", "options": [{"letter": "A", "text": "Abatacept"}, {"letter": "B", "text": "TNF blockers"}, {"letter": "C", "text": "Rituximab"}, {"letter": "D", "text": "IL-6 blockers (tocilizumab, sarilumab)"}, {"letter": "E", "text": "IL-17 blockers"}], "answer": "D", "explanation": "IL-6 blockade → GI perforation; abatacept → COPD exacerbation; TNF → TB/lymphoma/MS flare/DILE.", "objective": "", "section": "RA & JIA"}, {"id": "71", "group": 71, "stem": "Hot swollen joint with a normal serum uric acid → Next step:", "options": [{"letter": "A", "text": "Start allopurinol"}, {"letter": "B", "text": "Order a dual-energy CT first"}, {"letter": "C", "text": "Treat empirically with antibiotics"}, {"letter": "D", "text": "Gout is excluded — look elsewhere"}, {"letter": "E", "text": "Arthrocentesis with polarized microscopy"}], "answer": "E", "explanation": "Uric acid can be NORMAL during a flare — crystals make the diagnosis.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "72", "group": 72, "stem": "Liaison to the insurance case manager, discharge planning, orders DME →", "options": [{"letter": "A", "text": "Case manager"}, {"letter": "B", "text": "Medical social worker"}, {"letter": "C", "text": "Rehab nurse"}, {"letter": "D", "text": "Vocational therapist"}, {"letter": "E", "text": "Occupational therapist"}], "answer": "A", "explanation": "Case manager (inpatient) handles insurance, discharge planning, DME.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "73", "group": 73, "stem": "Walker handgrip height → Landmark:", "options": [{"letter": "A", "text": "Mid-thigh, giving 10° elbow flexion"}, {"letter": "B", "text": "Umbilicus, giving 60° elbow flexion"}, {"letter": "C", "text": "Greater trochanter, giving 0° elbow flexion"}, {"letter": "D", "text": "Iliac crest, giving 45° elbow flexion"}, {"letter": "E", "text": "Ulnar styloid in standing, giving 20–30° elbow flexion"}], "answer": "E", "explanation": "Measure — never trust the device's height markings; 20–30° elbow flexion gives the best mechanical advantage.", "objective": "", "section": "Assistive Devices"}, {"id": "74", "group": 74, "stem": "Scarring coin-shaped plaques with central atrophy and hair-follicle loss, lesions inside the ears → Diagnosis:", "options": [{"letter": "A", "text": "Tinea capitis"}, {"letter": "B", "text": "Subacute cutaneous lupus"}, {"letter": "C", "text": "Psoriasis"}, {"letter": "D", "text": "Seborrheic dermatitis"}, {"letter": "E", "text": "Discoid lupus erythematosus"}], "answer": "E", "explanation": "DLE: keratotic scaling, hyperpigmented edges, central scarring/atrophy, scarring alopecia — always look in the ears.", "objective": "", "section": "Lupus Family"}, {"id": "75", "group": 75, "stem": "Ankylosing spondylitis → Extra-articular \"A\" complications:", "options": [{"letter": "A", "text": "Ascites, asthma, atrophy, apnea"}, {"letter": "B", "text": "Alopecia, anemia, arthralgia, anxiety"}, {"letter": "C", "text": "Acne, aphthae, abscess, angioedema"}, {"letter": "D", "text": "Acromegaly, adrenal failure, amyloid"}, {"letter": "E", "text": "Anterior uveitis, apical fibrosis, aortitis/AR, AV block"}], "answer": "E", "explanation": "The A's: anterior uveitis, apical pulmonary fibrosis, aortitis → aortic regurgitation, AV block; plus vertebral fractures.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "76", "group": 76, "stem": "ANA-positive oligoarticular JIA → Required referral:", "options": [{"letter": "A", "text": "Cardiology"}, {"letter": "B", "text": "Orthopedics"}, {"letter": "C", "text": "Nephrology"}, {"letter": "D", "text": "Dermatology"}, {"letter": "E", "text": "Ophthalmology (slit-lamp for uveitis)"}], "answer": "E", "explanation": "20% of oligoarticular JIA develop anterior uveitis; ANA positivity raises the risk — it is prognostic, not diagnostic.", "objective": "", "section": "RA & JIA"}, {"id": "77", "group": 77, "stem": "Over 60, bilateral shoulder and hip girdle morning stiffness, normal strength, normal CK, high ESR → Diagnosis:", "options": [{"letter": "A", "text": "Polymyalgia rheumatica"}, {"letter": "B", "text": "Hypothyroidism"}, {"letter": "C", "text": "Rheumatoid arthritis"}, {"letter": "D", "text": "Fibromyalgia"}, {"letter": "E", "text": "Polymyositis"}], "answer": "A", "explanation": "PMR: girdle stiffness, normal CK and strength, no small-joint synovitis, dramatic response to low-dose prednisone.", "objective": "", "section": "Vasculitis"}, {"id": "78", "group": 78, "stem": "Slurred, slow, low-volume speech with intact language → Diagnosis:", "options": [{"letter": "A", "text": "Global aphasia"}, {"letter": "B", "text": "Expressive aphasia"}, {"letter": "C", "text": "Apraxia of speech"}, {"letter": "D", "text": "Dysarthria"}, {"letter": "E", "text": "Receptive aphasia"}], "answer": "D", "explanation": "Dysarthria is a motor speech disorder; language is intact.", "objective": "", "section": "Neuro Rehab"}, {"id": "79", "group": 79, "stem": "Fibromyalgia → First-line management:", "options": [{"letter": "A", "text": "Prednisone"}, {"letter": "B", "text": "Graded aerobic exercise and education"}, {"letter": "C", "text": "Weekly methotrexate"}, {"letter": "D", "text": "Hydroxychloroquine"}, {"letter": "E", "text": "Oxycodone"}], "answer": "B", "explanation": "Not inflammatory — steroids, NSAIDs, DMARDs and opioids do not help; exercise, education, sleep correction come first.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "80", "group": 80, "stem": "Gait sequence with a walker →", "options": [{"letter": "A", "text": "Walker → unaffected leg → affected leg"}, {"letter": "B", "text": "Both legs → walker"}, {"letter": "C", "text": "Affected leg → walker → unaffected leg"}, {"letter": "D", "text": "Walker → affected leg → unaffected leg"}, {"letter": "E", "text": "Unaffected leg → walker → affected leg"}], "answer": "D", "explanation": "Walker first, then the affected leg, then the unaffected leg.", "objective": "", "section": "Assistive Devices"}, {"id": "81", "group": 81, "stem": "Negative ANA in a patient suspected of having lupus → Interpretation:", "options": [{"letter": "A", "text": "Order the ANA panel anyway"}, {"letter": "B", "text": "SLE essentially ruled out"}, {"letter": "C", "text": "Diagnose seronegative lupus"}, {"letter": "D", "text": "Repeat ANA in 2 weeks"}, {"letter": "E", "text": "Order anti-dsDNA"}], "answer": "B", "explanation": "ANA is 99% sensitive — a negative rules lupus out (SNOUT). ANA 1:40 is seen in 1/3 of healthy people; subserologies only with strong suspicion.", "objective": "", "section": "Approach & Labs"}, {"id": "82", "group": 82, "stem": "Refractory sinusitis with bloody crusting + hemoptysis + hematuria with RBC casts → Diagnosis:", "options": [{"letter": "A", "text": "Polyarteritis nodosa"}, {"letter": "B", "text": "Goodpasture syndrome"}, {"letter": "C", "text": "Eosinophilic granulomatosis with polyangiitis"}, {"letter": "D", "text": "Granulomatosis with polyangiitis"}, {"letter": "E", "text": "IgA vasculitis"}], "answer": "D", "explanation": "Upper airway + lower airway + kidney = GPA triad.", "objective": "", "section": "Vasculitis"}, {"id": "83", "group": 83, "stem": "Malignant hypertension with acute renal failure in diffuse scleroderma → Diagnosis and treatment:", "options": [{"letter": "A", "text": "Scleroderma renal crisis — ACE inhibitor"}, {"letter": "B", "text": "Hemolytic-uremic syndrome — plasma exchange"}, {"letter": "C", "text": "Hypertensive emergency — nitroprusside"}, {"letter": "D", "text": "PAN — steroids + cyclophosphamide"}, {"letter": "E", "text": "Lupus nephritis — cyclophosphamide"}], "answer": "A", "explanation": "Renal crisis: ACE inhibitor (captopril)/ARB; monthly BP checks; steroids >7.5 mg can trigger it.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "84", "group": 84, "stem": "Paget's disease → Test that defines the extent of skeletal involvement:", "options": [{"letter": "A", "text": "CT of the skull"}, {"letter": "B", "text": "MRI of the pelvis"}, {"letter": "C", "text": "DEXA"}, {"letter": "D", "text": "Skeletal survey"}, {"letter": "E", "text": "Nuclear medicine bone scan"}], "answer": "E", "explanation": "Bone scan (Tc-99m MDP) shows focal hot spots — sensitive, not specific; plain films confirm.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "85", "group": 85, "stem": "\"Pencil-in-cup\" deformity on hand X-ray → Diagnosis:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Scleroderma"}, {"letter": "C", "text": "Psoriatic arthritis"}, {"letter": "D", "text": "Osteoarthritis"}, {"letter": "E", "text": "Rheumatoid arthritis"}], "answer": "C", "explanation": "Pencil-in-cup, DIP erosions with periostitis, osteolysis in mutilans = PsA.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "86", "group": 86, "stem": "Age over 50, new temporal headache, jaw claudication, scalp tenderness → Diagnosis:", "options": [{"letter": "A", "text": "Trigeminal neuralgia"}, {"letter": "B", "text": "Cluster headache"}, {"letter": "C", "text": "Temporomandibular joint disorder"}, {"letter": "D", "text": "Giant cell arteritis"}, {"letter": "E", "text": "Tension headache"}], "answer": "D", "explanation": "GCA: >50, new headache, jaw claudication, tender pulseless temporal artery, ESR often >100.", "objective": "", "section": "Vasculitis"}, {"id": "87", "group": 87, "stem": "Symmetric proximal weakness (stairs, chairs, combing hair) WITHOUT pain, markedly elevated CK → Diagnosis:", "options": [{"letter": "A", "text": "Polymyalgia rheumatica"}, {"letter": "B", "text": "Myasthenia gravis"}, {"letter": "C", "text": "Hypothyroid myopathy"}, {"letter": "D", "text": "Polymyositis"}, {"letter": "E", "text": "Fibromyalgia"}], "answer": "D", "explanation": "Myositis = weakness, not pain; PMR = pain/stiffness with normal CK and normal strength.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "88", "group": 88, "stem": "Child with daily spiking fever, evanescent salmon rash, lymphadenopathy, hepatosplenomegaly and polyarthritis → Diagnosis:", "options": [{"letter": "A", "text": "Kawasaki disease"}, {"letter": "B", "text": "Systemic JIA (Still disease)"}, {"letter": "C", "text": "Oligoarticular JIA"}, {"letter": "D", "text": "Acute rheumatic fever"}, {"letter": "E", "text": "Leukemia"}], "answer": "B", "explanation": "Systemic JIA = fever + rash + LAD + HSM + arthritis.", "objective": "", "section": "RA & JIA"}, {"id": "89", "group": 89, "stem": "Antihypertensive that most often precipitates gout →", "options": [{"letter": "A", "text": "Losartan"}, {"letter": "B", "text": "Metoprolol"}, {"letter": "C", "text": "Amlodipine"}, {"letter": "D", "text": "Lisinopril"}, {"letter": "E", "text": "Hydrochlorothiazide"}], "answer": "E", "explanation": "Thiazide and loop diuretics (also low-dose aspirin, cyclosporine, pyrazinamide) cause under-excretion.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "90", "group": 90, "stem": "Post-op lumbar fusion needing a device → Best choice and why:", "options": [{"letter": "A", "text": "Axillary crutches — temporary use"}, {"letter": "B", "text": "Lofstrand crutches — long-term use"}, {"letter": "C", "text": "Cane — pain relief"}, {"letter": "D", "text": "Hemi-walker — one-handed"}, {"letter": "E", "text": "Walker — keeps neutral spinal alignment"}], "answer": "E", "explanation": "Walker indications: limited WB, weakness, poor balance, amputee, low endurance/cardiac/respiratory, post-op spine, cognitive deficit.", "objective": "", "section": "Assistive Devices"}, {"id": "91", "group": 91, "stem": "CPPD in a patient under 50 → Workup to add:", "options": [{"letter": "A", "text": "Calcium/PTH, iron studies, magnesium, ALP"}, {"letter": "B", "text": "HLA-B27 and SI joint films"}, {"letter": "C", "text": "Hepatitis B serologies"}, {"letter": "D", "text": "Serum uric acid and 24-h urine urate"}, {"letter": "E", "text": "ANA panel and complement"}], "answer": "A", "explanation": "Young CPPD → hyperparathyroidism, hemochromatosis, hypomagnesemia, hypophosphatasia.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "92", "group": 92, "stem": "Ankylosing spondylitis → First-line pharmacologic treatment:", "options": [{"letter": "A", "text": "Sulfasalazine"}, {"letter": "B", "text": "NSAIDs (e.g., naproxen) for 2–4 weeks"}, {"letter": "C", "text": "Prednisone"}, {"letter": "D", "text": "Methotrexate"}, {"letter": "E", "text": "TNF inhibitor"}], "answer": "B", "explanation": "NSAIDs + extension exercises/PT first; switch NSAID if no response; then TNF, IL-17 or JAK inhibitors.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "93", "group": 93, "stem": "Most stable device → least stable, in order →", "options": [{"letter": "A", "text": "Axillary crutches > walker > quad cane > hemi-walker > cane"}, {"letter": "B", "text": "Walker > parallel bars > hemi-walker > crutches > cane"}, {"letter": "C", "text": "Parallel bars > walker > axillary crutches > forearm crutches > bilateral canes > hemi-walker > quad cane > straight cane"}, {"letter": "D", "text": "Hemi-walker > quad cane > walker > crutches > cane"}, {"letter": "E", "text": "Straight cane > quad cane > hemi-walker > walker > parallel bars"}], "answer": "C", "explanation": "Stability ladder: most stable/least mobile at the top.", "objective": "", "section": "Assistive Devices"}, {"id": "94", "group": 94, "stem": "Post-hip-fracture patient after a 3-day hospital stay who tolerates only 2 hours of therapy per day → Setting:", "options": [{"letter": "A", "text": "Acute inpatient rehabilitation"}, {"letter": "B", "text": "Long-term acute care"}, {"letter": "C", "text": "Outpatient"}, {"letter": "D", "text": "Home health"}, {"letter": "E", "text": "Subacute rehab (SNF)"}], "answer": "E", "explanation": "SAR: 2 h/day, provider ≤3×/wk, 3-day hospital stay required, LOS 3–4 wk, more orthopedic.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "95", "group": 95, "stem": "Before starting tofacitinib or another JAK inhibitor → Vaccine to give first:", "options": [{"letter": "A", "text": "Hepatitis B"}, {"letter": "B", "text": "HPV"}, {"letter": "C", "text": "Pneumococcal"}, {"letter": "D", "text": "MMR"}, {"letter": "E", "text": "Shingrix (zoster)"}], "answer": "E", "explanation": "JAK inhibitors reactivate zoster → Shingrix first; also thrombosis, LFTs, lipids, leukopenia.", "objective": "", "section": "RA & JIA"}, {"id": "96", "group": 96, "stem": "Rehab team leader in a traumatic brain injury program →", "options": [{"letter": "A", "text": "Neuropsychologist"}, {"letter": "B", "text": "Rehab nurse"}, {"letter": "C", "text": "Physiatrist"}, {"letter": "D", "text": "Case manager"}, {"letter": "E", "text": "Physical therapist"}], "answer": "A", "explanation": "MD/PA usually leads; the neuropsychologist leads in TBI.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "97", "group": 97, "stem": "X-ray showing punched-out erosions with overhanging (\"rat-bite\") edges → Diagnosis:", "options": [{"letter": "A", "text": "Psoriatic arthritis"}, {"letter": "B", "text": "Chronic gout"}, {"letter": "C", "text": "Rheumatoid arthritis"}, {"letter": "D", "text": "CPPD"}, {"letter": "E", "text": "Osteoarthritis"}], "answer": "B", "explanation": "Overhanging-edge erosions with soft-tissue tophi = chronic gout.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "98", "group": 98, "stem": "New lupus symptoms in a post-menopausal woman → Think first:", "options": [{"letter": "A", "text": "Sjögren syndrome"}, {"letter": "B", "text": "Systemic lupus erythematosus"}, {"letter": "C", "text": "Drug-induced lupus"}, {"letter": "D", "text": "Polymyalgia rheumatica"}, {"letter": "E", "text": "Fibromyalgia"}], "answer": "C", "explanation": "SLE favors women of childbearing age; new disease after menopause → look for hydralazine, procainamide, etc.", "objective": "", "section": "Lupus Family"}, {"id": "99", "group": 99, "stem": "Schirmer test with less than 5 mm of wetting in 5 minutes → Diagnosis:", "options": [{"letter": "A", "text": "Blepharitis"}, {"letter": "B", "text": "Allergic conjunctivitis"}, {"letter": "C", "text": "Sjögren syndrome"}, {"letter": "D", "text": "Bell palsy"}, {"letter": "E", "text": "Graves ophthalmopathy"}], "answer": "C", "explanation": "Schirmer <5 mm/5 min = reduced tear production.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "100", "group": 100, "stem": "Gait sequence with a cane →", "options": [{"letter": "A", "text": "Unaffected leg and cane together, then affected leg"}, {"letter": "B", "text": "Cane, then unaffected leg, then affected leg"}, {"letter": "C", "text": "Cane, then both legs together"}, {"letter": "D", "text": "Affected leg, then cane, then unaffected leg"}, {"letter": "E", "text": "Cane and affected leg together, then the unaffected leg"}], "answer": "E", "explanation": "Cane + affected leg move together, then the unaffected leg.", "objective": "", "section": "Assistive Devices"}, {"id": "101", "group": 101, "stem": "Abrupt, exquisitely painful red swollen first MTP joint at 2 AM → Finding and diagnosis:", "options": [{"letter": "A", "text": "Podagra — gout"}, {"letter": "B", "text": "Enthesitis — reactive arthritis"}, {"letter": "C", "text": "Dactylitis — psoriatic arthritis"}, {"letter": "D", "text": "Hallux valgus — osteoarthritis"}, {"letter": "E", "text": "Chondrocalcinosis — CPPD"}], "answer": "A", "explanation": "Podagra is the classic first gout attack.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "102", "group": 102, "stem": "False-positive RPR/VDRL in a young woman with livedo reticularis → Antibody responsible:", "options": [{"letter": "A", "text": "Rheumatoid factor"}, {"letter": "B", "text": "Anticardiolipin"}, {"letter": "C", "text": "Anti-Scl-70"}, {"letter": "D", "text": "Anti-SSA (Ro)"}, {"letter": "E", "text": "Anti-dsDNA"}], "answer": "B", "explanation": "The cardiolipin reagent in the syphilis test cross-reacts with anticardiolipin — a classic APS clue.", "objective": "", "section": "Lupus Family"}, {"id": "103", "group": 103, "stem": "Ulnar deviation, swan-neck and boutonnière deformities → Diagnosis:", "options": [{"letter": "A", "text": "Psoriatic arthritis mutilans"}, {"letter": "B", "text": "Chronic tophaceous gout"}, {"letter": "C", "text": "Jaccoud arthropathy of lupus"}, {"letter": "D", "text": "Chronic rheumatoid arthritis"}, {"letter": "E", "text": "Osteoarthritis"}], "answer": "D", "explanation": "Late RA deformities: ulnar deviation, volar subluxation, swan-neck, boutonnière, hammer toes.", "objective": "", "section": "RA & JIA"}, {"id": "104", "group": 104, "stem": "Right-hemisphere stroke patient leaves food on the left side of the plate and shaves only one side → Deficit and who addresses it:", "options": [{"letter": "A", "text": "Hemianopia — ophthalmology"}, {"letter": "B", "text": "Unilateral neglect — OT visual-scanning strategies"}, {"letter": "C", "text": "Agnosia — SLP"}, {"letter": "D", "text": "Apraxia — PT"}, {"letter": "E", "text": "Dysphagia — SLP"}], "answer": "B", "explanation": "Neglect/visual-spatial deficits → OT: scanning, environmental setup, cueing, caregiver education.", "objective": "", "section": "Neuro Rehab"}, {"id": "105", "group": 105, "stem": "Schober test with less than 5 cm of excursion → Diagnosis:", "options": [{"letter": "A", "text": "Spondylolisthesis"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Fibromyalgia"}, {"letter": "D", "text": "Lumbar strain"}, {"letter": "E", "text": "Ankylosing spondylitis"}], "answer": "E", "explanation": "10 cm mark should reach ≥15 cm on flexion; <5 cm excursion = reduced lumbar mobility of AS.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "106", "group": 106, "stem": "Vasculitis that spares the lungs and never causes glomerulonephritis →", "options": [{"letter": "A", "text": "Goodpasture syndrome"}, {"letter": "B", "text": "Polyarteritis nodosa"}, {"letter": "C", "text": "Eosinophilic granulomatosis with polyangiitis"}, {"letter": "D", "text": "Granulomatosis with polyangiitis"}, {"letter": "E", "text": "Microscopic polyangiitis"}], "answer": "B", "explanation": "PAN affects renal arteries (HTN, infarcts) but not glomeruli; a pulmonary-renal syndrome is never PAN.", "objective": "", "section": "Vasculitis"}, {"id": "107", "group": 107, "stem": "Mucocutaneous Behçet → First-line:", "options": [{"letter": "A", "text": "High-dose IV steroids"}, {"letter": "B", "text": "Cyclophosphamide"}, {"letter": "C", "text": "Rituximab"}, {"letter": "D", "text": "Methotrexate"}, {"letter": "E", "text": "Apremilast or colchicine"}], "answer": "E", "explanation": "Apremilast (PDE4i), colchicine, topical steroids; ocular/vascular/CNS → steroids, azathioprine, cyclophosphamide, anti-TNF.", "objective": "", "section": "Vasculitis"}, {"id": "108", "group": 108, "stem": "Patient arrives at clinic in a wheelchair, or cannot rise from a chair, or has stairs at home and never had PT → Action:", "options": [{"letter": "A", "text": "Prescribe a cane"}, {"letter": "B", "text": "Prescribe a walker"}, {"letter": "C", "text": "Order a scooter"}, {"letter": "D", "text": "Order home health nursing"}, {"letter": "E", "text": "Refer to physical therapy"}], "answer": "E", "explanation": "PT referral triggers: post-ortho surgery, sit↔stand difficulty, needs help with device, unstable, dementia, wheelchair, functional change, untreated neuro weakness, stairs.", "objective": "", "section": "Assistive Devices"}, {"id": "109", "group": 109, "stem": "Suspected lupus nephritis → Test that classifies it and guides therapy:", "options": [{"letter": "A", "text": "Anti-dsDNA titer"}, {"letter": "B", "text": "Complement levels"}, {"letter": "C", "text": "24-hour urine protein"}, {"letter": "D", "text": "Renal ultrasound"}, {"letter": "E", "text": "Renal biopsy"}], "answer": "E", "explanation": "Biopsy gives class I–VI; class III/IV (proliferative) need aggressive induction.", "objective": "", "section": "Lupus Family"}, {"id": "110", "group": 110, "stem": "Uricosuric that is contraindicated in CKD and kidney stones →", "options": [{"letter": "A", "text": "Febuxostat"}, {"letter": "B", "text": "Colchicine"}, {"letter": "C", "text": "Anakinra"}, {"letter": "D", "text": "Allopurinol"}, {"letter": "E", "text": "Probenecid"}], "answer": "E", "explanation": "Probenecid increases urinary urate — avoid with CKD or nephrolithiasis.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "111", "group": 111, "stem": "Starting allopurinol → Add for the first 3–6 months:", "options": [{"letter": "A", "text": "Febuxostat"}, {"letter": "B", "text": "Low-dose colchicine prophylaxis"}, {"letter": "C", "text": "Probenecid"}, {"letter": "D", "text": "Pegloticase"}, {"letter": "E", "text": "Daily prednisone 40 mg"}], "answer": "B", "explanation": "Starting ULT precipitates flares — cover with colchicine 0.6 mg daily–bid for 3–6 months (or low-dose NSAID/prednisone).", "objective": "", "section": "Crystal Arthropathies"}, {"id": "112", "group": 112, "stem": "Burning limb pain out of proportion weeks after a fracture, with swelling, mottled color, temperature asymmetry and allodynia → Diagnosis:", "options": [{"letter": "A", "text": "Cellulitis"}, {"letter": "B", "text": "Deep vein thrombosis"}, {"letter": "C", "text": "Complex regional pain syndrome"}, {"letter": "D", "text": "Peripheral neuropathy"}, {"letter": "E", "text": "Compartment syndrome"}], "answer": "C", "explanation": "CRPS: regional (not dermatomal) pain out of proportion after trauma/surgery/stroke, with vasomotor, sudomotor and trophic changes.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "113", "group": 113, "stem": "Crusted pustular papules on the palms and soles after a diarrheal illness → Finding:", "options": [{"letter": "A", "text": "Pustular psoriasis"}, {"letter": "B", "text": "Erythema nodosum"}, {"letter": "C", "text": "Keratoderma blennorrhagicum"}, {"letter": "D", "text": "Secondary syphilis"}, {"letter": "E", "text": "Gottron papules"}], "answer": "C", "explanation": "Keratoderma blennorrhagicum is indistinguishable from pustular psoriasis — the infection history makes the call.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "114", "group": 114, "stem": "\"Hurts all over\" for years, non-restorative sleep, \"fibro fog\", multiple tender points, no synovitis, normal labs → Diagnosis:", "options": [{"letter": "A", "text": "Hypothyroidism"}, {"letter": "B", "text": "Rheumatoid arthritis"}, {"letter": "C", "text": "Polymyositis"}, {"letter": "D", "text": "Polymyalgia rheumatica"}, {"letter": "E", "text": "Fibromyalgia"}], "answer": "E", "explanation": "Fibromyalgia: widespread pain ≥3 months, fatigue, sleep and cognitive symptoms; CBC/ESR/RF/CK/TSH normal.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "115", "group": 115, "stem": "Medication every lupus patient should be on unless contraindicated →", "options": [{"letter": "A", "text": "Prednisone"}, {"letter": "B", "text": "Hydroxychloroquine"}, {"letter": "C", "text": "Cyclophosphamide"}, {"letter": "D", "text": "Belimumab"}, {"letter": "E", "text": "Methotrexate"}], "answer": "B", "explanation": "HCQ reduces flares, thrombosis, insulin resistance, mortality and neonatal heart block (SSA+).", "objective": "", "section": "Lupus Family"}, {"id": "116", "group": 116, "stem": "Spondyloarthritis in a patient with Crohn's disease → Biologic class to AVOID:", "options": [{"letter": "A", "text": "TNF inhibitors"}, {"letter": "B", "text": "IL-23 inhibitors"}, {"letter": "C", "text": "JAK inhibitors"}, {"letter": "D", "text": "IL-17 inhibitors (secukinumab, ixekizumab)"}, {"letter": "E", "text": "IL-12/23 inhibitor (ustekinumab)"}], "answer": "D", "explanation": "IL-17 blockers worsen or unmask IBD — give TNF, IL-23 or JAK inhibitors instead.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "117", "group": 117, "stem": "ESR greater than 100 mm/h → Conditions to consider:", "options": [{"letter": "A", "text": "GCA, PMR, myeloma, malignancy"}, {"letter": "B", "text": "Paget's disease, osteoporosis"}, {"letter": "C", "text": "Reactive arthritis, AS, PsA"}, {"letter": "D", "text": "Gout, CPPD, septic joint"}, {"letter": "E", "text": "Fibromyalgia, OA, CRPS"}], "answer": "A", "explanation": "ESR >100 → GCA/PMR, multiple myeloma, cancer. ESR ULN: men age/2, women (age+10)/2.", "objective": "", "section": "Approach & Labs"}, {"id": "118", "group": 118, "stem": "Antibody that tracks lupus disease activity and nephritis →", "options": [{"letter": "A", "text": "Anti-U1-RNP"}, {"letter": "B", "text": "ANA titer"}, {"letter": "C", "text": "Anti-histone"}, {"letter": "D", "text": "Anti-dsDNA"}, {"letter": "E", "text": "Anti-Smith"}], "answer": "D", "explanation": "dsDNA rises with activity; ANA titer does not track activity.", "objective": "", "section": "Lupus Family"}, {"id": "119", "group": 119, "stem": "New calf swelling, chest pain or a new neurologic deficit during a rehab session → Action:", "options": [{"letter": "A", "text": "Document and re-check tomorrow"}, {"letter": "B", "text": "Continue — therapy is part of treatment"}, {"letter": "C", "text": "Reduce therapy intensity and continue"}, {"letter": "D", "text": "Clinical pause point — hold therapy and re-stabilize"}, {"letter": "E", "text": "Switch to OT only"}], "answer": "D", "explanation": "Pause points: new neuro deficit, aspiration, suspected DVT/PE, chest pain, unsafe cognition.", "objective": "", "section": "Neuro Rehab"}, {"id": "120", "group": 120, "stem": "Hydroxychloroquine → Required monitoring:", "options": [{"letter": "A", "text": "Annual DEXA"}, {"letter": "B", "text": "Quarterly LFTs"}, {"letter": "C", "text": "Baseline PFTs"}, {"letter": "D", "text": "Yearly retinal exam"}, {"letter": "E", "text": "Monthly CBC"}], "answer": "D", "explanation": "HCQ retinopathy — retinal exam at baseline and yearly.", "objective": "", "section": "RA & JIA"}, {"id": "121", "group": 121, "stem": "Cane for right-knee osteoarthritis → Which hand holds it:", "options": [{"letter": "A", "text": "The dominant hand"}, {"letter": "B", "text": "Either hand — patient preference"}, {"letter": "C", "text": "Right hand (same side)"}, {"letter": "D", "text": "Alternate hands daily"}, {"letter": "E", "text": "Left hand (opposite the affected side)"}], "answer": "E", "explanation": "Cane in the hand opposite the affected limb; elbow 15–30° flexion.", "objective": "", "section": "Assistive Devices"}, {"id": "122", "group": 122, "stem": "Symmetric MCP, PIP, wrist and MTP synovitis for more than 6 weeks that spares the DIPs → Diagnosis:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Systemic lupus erythematosus"}, {"letter": "C", "text": "Psoriatic arthritis"}, {"letter": "D", "text": "Osteoarthritis"}, {"letter": "E", "text": "Rheumatoid arthritis"}], "answer": "E", "explanation": "RA = symmetric small-joint polyarthritis sparing the DIPs; DIP disease → OA or PsA.", "objective": "", "section": "RA & JIA"}, {"id": "123", "group": 123, "stem": "Swallowing, cognition and adaptive communication devices → Team member:", "options": [{"letter": "A", "text": "Neuropsychologist"}, {"letter": "B", "text": "Speech-language pathologist"}, {"letter": "C", "text": "Occupational therapist"}, {"letter": "D", "text": "Physical therapist"}, {"letter": "E", "text": "Dietician"}], "answer": "B", "explanation": "SLP covers communication, cognition and swallow.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "124", "group": 124, "stem": "FDA-approved medications for fibromyalgia →", "options": [{"letter": "A", "text": "Prednisone, methotrexate, hydroxychloroquine"}, {"letter": "B", "text": "Amitriptyline, trazodone, cyclobenzaprine"}, {"letter": "C", "text": "Naproxen, celecoxib, tramadol"}, {"letter": "D", "text": "Duloxetine, milnacipran, pregabalin"}, {"letter": "E", "text": "Gabapentin, venlafaxine, fluoxetine"}], "answer": "D", "explanation": "FDA-approved: duloxetine, milnacipran, pregabalin. Bedtime amitriptyline/trazodone/cyclobenzaprine help sleep; SSRIs, gabapentin, tramadol are alternatives.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "125", "group": 125, "stem": "\"Bamboo spine\" with syndesmophytes and bilateral sacroiliitis → Diagnosis:", "options": [{"letter": "A", "text": "Degenerative disc disease"}, {"letter": "B", "text": "Psoriatic spondylitis"}, {"letter": "C", "text": "Diffuse idiopathic skeletal hyperostosis"}, {"letter": "D", "text": "Ankylosing spondylitis"}, {"letter": "E", "text": "Paget's disease"}], "answer": "D", "explanation": "Bilateral sacroiliitis, squared vertebrae, syndesmophytes → bamboo spine.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "126", "group": 126, "stem": "Life-threatening complication of systemic JIA →", "options": [{"letter": "A", "text": "Scleroderma renal crisis"}, {"letter": "B", "text": "Macrophage activation syndrome"}, {"letter": "C", "text": "Catastrophic APS"}, {"letter": "D", "text": "Felty syndrome"}, {"letter": "E", "text": "Anterior uveitis"}], "answer": "B", "explanation": "MAS = uncontrolled macrophage activation with widespread inflammation and organ damage.", "objective": "", "section": "RA & JIA"}, {"id": "127", "group": 127, "stem": "Cannot recognize objects despite intact vision and sensation → Term:", "options": [{"letter": "A", "text": "Agnosia"}, {"letter": "B", "text": "Apraxia"}, {"letter": "C", "text": "Neglect"}, {"letter": "D", "text": "Aphasia"}, {"letter": "E", "text": "Dysarthria"}], "answer": "A", "explanation": "Agnosia = recognition failure; apraxia = cannot perform purposeful movements.", "objective": "", "section": "Neuro Rehab"}, {"id": "128", "group": 128, "stem": "Skull X-ray with a \"cotton-wool\" appearance → Diagnosis:", "options": [{"letter": "A", "text": "Paget's disease of bone"}, {"letter": "B", "text": "Hyperparathyroidism"}, {"letter": "C", "text": "Metastatic prostate cancer"}, {"letter": "D", "text": "Multiple myeloma"}, {"letter": "E", "text": "Osteopetrosis"}], "answer": "A", "explanation": "Cotton-wool skull = mixed lytic/sclerotic thickened calvarium of Paget's.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "129", "group": 129, "stem": "Asthma + marked eosinophilia + mononeuritis multiplex + p-ANCA → Diagnosis:", "options": [{"letter": "A", "text": "Eosinophilic granulomatosis with polyangiitis"}, {"letter": "B", "text": "Allergic bronchopulmonary aspergillosis"}, {"letter": "C", "text": "Hypereosinophilic syndrome"}, {"letter": "D", "text": "Granulomatosis with polyangiitis"}, {"letter": "E", "text": "Polyarteritis nodosa"}], "answer": "A", "explanation": "EGPA (Churg-Strauss) = asthma + eosinophils + vasculitis; cardiac involvement is the usual cause of death.", "objective": "", "section": "Vasculitis"}, {"id": "130", "group": 130, "stem": "Young man with months of low back pain that improves with exercise and worsens with rest, stiffness over an hour → Diagnosis:", "options": [{"letter": "A", "text": "Vertebral compression fracture"}, {"letter": "B", "text": "Ankylosing spondylitis"}, {"letter": "C", "text": "Mechanical low back pain"}, {"letter": "D", "text": "Lumbar disc herniation"}, {"letter": "E", "text": "Spinal stenosis"}], "answer": "B", "explanation": "Inflammatory back pain: insidious, <40 y, better with activity, worse at night/rest, AM stiffness >1 h.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "131", "group": 131, "stem": "Annular scaly plaques on sun-exposed skin that look like tinea or psoriasis, ANA negative → Diagnosis and antibody:", "options": [{"letter": "A", "text": "Subacute cutaneous lupus — anti-SSA (Ro)"}, {"letter": "B", "text": "Discoid lupus — anti-dsDNA"}, {"letter": "C", "text": "Dermatomyositis — anti-Jo-1"}, {"letter": "D", "text": "Psoriasis — HLA-B27"}, {"letter": "E", "text": "Systemic lupus — anti-Smith"}], "answer": "A", "explanation": "SCLE: annular/psoriasiform rash, non-scarring, ANA may be negative, SSA positive; associated with calcium-channel blockers.", "objective": "", "section": "Lupus Family"}, {"id": "132", "group": 132, "stem": "Acute gout flare in a patient with CKD and a prior GI bleed → Preferred treatment:", "options": [{"letter": "A", "text": "Indomethacin"}, {"letter": "B", "text": "Intra-articular glucocorticoid after aspiration"}, {"letter": "C", "text": "Allopurinol started today"}, {"letter": "D", "text": "Probenecid"}, {"letter": "E", "text": "High-dose colchicine"}], "answer": "B", "explanation": "CKD: avoid NSAIDs, caution colchicine, avoid probenecid — use intra-articular (or oral) steroid.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "133", "group": 133, "stem": "Needle-shaped crystals, negatively birefringent (yellow parallel to the axis) → Diagnosis:", "options": [{"letter": "A", "text": "Septic arthritis"}, {"letter": "B", "text": "Milwaukee shoulder"}, {"letter": "C", "text": "Pseudogout (CPPD)"}, {"letter": "D", "text": "Gout"}, {"letter": "E", "text": "Reactive arthritis"}], "answer": "D", "explanation": "Monosodium urate = needle-shaped, negatively birefringent.", "objective": "", "section": "Approach & Labs"}, {"id": "134", "group": 134, "stem": "Anti-Scl-70 (topoisomerase I) → Diagnosis and feared complication:", "options": [{"letter": "A", "text": "Diffuse SSc — interstitial lung disease / renal crisis"}, {"letter": "B", "text": "Limited SSc — pulmonary hypertension"}, {"letter": "C", "text": "Polymyositis — ILD"}, {"letter": "D", "text": "SLE — nephritis"}, {"letter": "E", "text": "MCTD — ILD"}], "answer": "A", "explanation": "Scl-70 = diffuse SSc with ILD and decreased survival; renal crisis in the first 5 years.", "objective": "", "section": "Scleroderma, Sjögren & Myositis"}, {"id": "135", "group": 135, "stem": "DIP arthritis with nail pitting and onycholysis → Diagnosis:", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Psoriatic arthritis"}, {"letter": "C", "text": "Osteoarthritis"}, {"letter": "D", "text": "Gout"}, {"letter": "E", "text": "Reactive arthritis"}], "answer": "B", "explanation": "DIP disease looks like OA, but nail pitting (specific) points to PsA; RA spares the DIPs.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "136", "group": 136, "stem": "Polyarteritis nodosa → Treatment:", "options": [{"letter": "A", "text": "Apremilast"}, {"letter": "B", "text": "Prednisone 10–20 mg alone"}, {"letter": "C", "text": "Tocilizumab"}, {"letter": "D", "text": "Mepolizumab"}, {"letter": "E", "text": "Steroids + cyclophosphamide (+ antivirals if HBV)"}], "answer": "E", "explanation": "IV steroids + cyclophosphamide; treat hepatitis B; plasmapheresis in HBV-associated disease.", "objective": "", "section": "Vasculitis"}, {"id": "137", "group": 137, "stem": "Older man with isolated elevated alkaline phosphatase, normal calcium, phosphate and PTH → Diagnosis:", "options": [{"letter": "A", "text": "Primary hyperparathyroidism"}, {"letter": "B", "text": "Paget's disease of bone"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Osteomalacia"}, {"letter": "E", "text": "Multiple myeloma"}], "answer": "B", "explanation": "Isolated ↑ALP with normal Ca/PO4/PTH = Paget's; osteoporosis has normal ALP; hyperparathyroidism raises calcium.", "objective": "", "section": "Fibromyalgia, CRPS & Paget's"}, {"id": "138", "group": 138, "stem": "Gout flare while already taking allopurinol → Allopurinol should be:", "options": [{"letter": "A", "text": "Switched to probenecid"}, {"letter": "B", "text": "Continued at the same dose"}, {"letter": "C", "text": "Stopped until the flare resolves"}, {"letter": "D", "text": "Doubled immediately"}, {"letter": "E", "text": "Switched to pegloticase"}], "answer": "B", "explanation": "Never stop (or start) ULT during a flare — treat the flare and continue allopurinol.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "139", "group": 139, "stem": "Severe lupus nephritis, alveolar hemorrhage or CNS lupus → Induction therapy:", "options": [{"letter": "A", "text": "Cyclophosphamide or mycophenolate + high-dose steroids"}, {"letter": "B", "text": "Anifrolumab"}, {"letter": "C", "text": "Hydroxychloroquine alone"}, {"letter": "D", "text": "NSAIDs and low-dose prednisone"}, {"letter": "E", "text": "Belimumab mo ptions": [{"letter": "A", "text": "Secukinumab (IL-17)"}, {"letter": "B", "text": "Adalimumab (TNF inhibitor)"}, {"letter": "C", "text": "Apremilast"}, {"letter": "D", "text": "Etanercept"}, {"letter": "E", "text": "Naproxen"}], "answer": "B", "explanation": "TNF inhibitors (adalimumab, infliximab, certolizumab), IL-23, IL-12/23, JAK — never IL-17; NSAIDs can flare colitis.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "144", "group": 144, "stem": "Knee X-ray with calcification of the menisci (chondrocalcinosis) → Diagnosis:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Septic arthritis"}, {"letter": "C", "text": "CPPD (pseudogout)"}, {"letter": "D", "text": "Osteoarthritis"}, {"letter": "E", "text": "Paget's disease"}], "answer": "C", "explanation": "Chondrocalcinosis = CPP deposition in cartilage; asymptomatic chondrocalcinosis needs no treatment.", "objective": "", "section": "Crystal Arthropathies"}, {"id": "145", "group": 145, "stem": "The 4Ms of Age-Friendly care →", "options": [{"letter": "A", "text": "Motor, Memory, Mood, Mobility"}, {"letter": "B", "text": "Mind, Muscle, Meds, Motivation"}, {"letter": "C", "text": "Medicine, Monitoring, Movement, Meals"}, {"letter": "D", "text": "What Matters, Medication, Mentation, Mobility"}, {"letter": "E", "text": "Mentation, Malnutrition, Mobility, Morbidity"}], "answer": "D", "explanation": "What matters to the patient, their meds, their mind, whether they can move.", "objective": "", "section": "Neuro Rehab"}, {"id": "146", "group": 146, "stem": "Erythematous malar rash that spares the nasolabial folds → Diagnosis:", "options": [{"letter": "A", "text": "Subacute cutaneous lupus"}, {"letter": "B", "text": "Dermatomyositis"}, {"letter": "C", "text": "Seborrheic dermatitis"}, {"letter": "D", "text": "Systemic lupus erythematosus"}, {"letter": "E", "text": "Rosacea"}], "answer": "D", "explanation": "Butterfly rash sparing the nasolabial folds = SLE; rosacea/seborrheic dermatitis
