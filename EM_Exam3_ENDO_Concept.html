const EXAM_DATA = {"title": "Pulmonary Emergencies — Lecture Quiz (Adaptive)", "questions": [{"id": "1", "group": 1, "slide": 5, "section": "Pulmonary Workup", "topic": "ED approach to pulmonary complaints", "skill": "Identification", "stem": "A patient arrives in the ED with a pulmonary complaint. What must be settled before any differential diagnosis is built?", "options": [{"letter": "A", "text": "Respiratory distress and airway protection"}, {"letter": "B", "text": "Which labs and biomarkers to send first"}, {"letter": "C", "text": "The need for CT versus V/Q imaging"}, {"letter": "D", "text": "Pulmonary versus cardiac versus other source"}], "answer": "A", "explanation": "Count the rate, ask whether they are **protecting the airway**, and decide on O2, PAP, or a tube; only when vitals are stable do you move on to labs, imaging, and the differential.", "objective": "", "hint": "The lecturer's opening instruction puts **hypoxia and hypercapnia** first and treats the rest of the assessment as something you earn only once vital signs are stable. Imaging, labs, and sorting the differential all come after that gate."}, {"id": "2", "group": 2, "slide": 12, "section": "Hemoptysis", "topic": "Hemoptysis", "skill": "Identification", "stem": "A healthy adult coughs up blood-tinged sputum after a week of viral cough. Which diagnosis is the most common cause of hemoptysis overall?", "options": [{"letter": "A", "text": "Pulmonary tuberculosis"}, {"letter": "B", "text": "Acute bronchitis"}, {"letter": "C", "text": "Pulmonary embolism"}, {"letter": "D", "text": "Bronchogenic carcinoma"}], "answer": "B", "explanation": "**Bronchitis** is the most common cause of hemoptysis overall; TB leads worldwide and bronchogenic carcinoma is the second most common cause. Ninety percent of bleeds come from the high-pressure bronchial arteries.", "objective": "", "hint": "Think about which of these you see weekly rather than which is the deadliest; **TB** is the leading cause worldwide and lung cancer is the second most common cause overall."}, {"id": "3", "group": 3, "slide": 14, "section": "Hemoptysis", "topic": "Hemoptysis", "skill": "Diagnostics & imaging", "stem": "A patient with non-massive hemoptysis has had a history, exam, and chest X-ray. Which features move the workup on to a CT of the chest?", "options": [{"letter": "A", "text": "Smoker older than 40"}, {"letter": "B", "text": "Normal oxygen saturation"}, {"letter": "C", "text": "Hemoptysis lasting more than one week"}, {"letter": "D", "text": "Abnormal chest X-ray"}, {"letter": "E", "text": "Known COPD or lung cancer"}, {"letter": "F", "text": "Bleeding that has already stopped"}], "answer": "ACDE", "explanation": "Abnormal CXR or any risk factor (**smoker >40**, cancer, COPD, hemoptysis >1 wk) means CT chest with or without bronchoscopy; no risk factors plus normal CXR plus bleeding stopped means treat bronchitis and observe. Every hemoptysis gets a CXR regardless.", "objective": "", "hint": "The algorithm sends the low-risk patient with a clean film and no further bleeding home as **bronchitis** with PCP follow-up; anything that raises the odds of an underlying structural or malignant lesion earns more imaging."}, {"id": "4", "group": 4, "slide": 15, "section": "Hemoptysis", "topic": "Massive hemoptysis", "skill": "Management", "stem": "A patient coughing up more than 600 mL of blood in 24 hours is bleeding from the left lung. How should the patient be positioned and why?", "options": [{"letter": "A", "text": "Left side down, so gravity keeps blood out of the right lung"}, {"letter": "B", "text": "Supine with the head elevated to protect the airway"}, {"letter": "C", "text": "Right side down, so the bleeding lung drains upward"}, {"letter": "D", "text": "Prone to encourage clot expulsion with coughing"}], "answer": "A", "explanation": "Lateral decubitus with the **bleeding side down** lets gravity protect the healthy lung; secure the airway with a large ETT (>8.5) so bronchoscopy is possible, give TXA, and get CTA then IR for bronchial artery embolization, CT surgery, and ICU.", "objective": "", "hint": "The goal is to **separate** the bleeding lung from the lung still exchanging gas; think about which direction blood flows under gravity and which lung you want it flowing away from."}, {"id": "5", "group": 5, "slide": 18, "section": "Hemoptysis", "topic": "Bronchitis", "skill": "Management", "stem": "A patient with fever, cough, and minor hemoptysis has a normal chest X-ray and is diagnosed with acute bronchitis. What is the appropriate treatment?", "options": [{"letter": "A", "text": "Admission for CT and bronchoscopy"}, {"letter": "B", "text": "Benzonatate and guaifenesin, home"}, {"letter": "C", "text": "Oseltamivir started within 48 hours"}, {"letter": "D", "text": "Azithromycin with discharge home"}], "answer": "B", "explanation": "Bronchitis is viral and gets **no antibiotics**; supportive care with benzonatate and guaifenesin and discharge. It is the most common cause of hemoptysis, so the CXR is there to rule out pneumonia.", "objective": "", "hint": "The causes are adenovirus, influenza, parainfluenza, RSV, and COVID, none of which respond to an antibacterial. Treatment targets the **cough** itself and the patient goes home once pneumonia and PE are not a concern."}, {"id": "6", "group": 6, "slide": 19, "section": "Hemoptysis", "topic": "Tuberculosis", "skill": "Management", "stem": "An immigrant with weeks of cough, weight loss, night sweats, and hemoptysis has cavitary apical lesions on chest X-ray. What is the ED's role?", "options": [{"letter": "A", "text": "Obtain an IGRA and discharge if negative"}, {"letter": "B", "text": "Admit every suspected case to the ICU"}, {"letter": "C", "text": "Isolate, notify public health, arrange follow-up"}, {"letter": "D", "text": "Start RIPE therapy before discharge"}], "answer": "C", "explanation": "In the ER, **isolate** the patient, get the CXR, contact public health, and give isolation and follow-up instructions; RIPE is not usually started in the ER. Admit if ill-appearing, diagnosis uncertain, or non-adherent (negative-pressure room).", "objective": "", "hint": "This is a reportable, **airborne** infection whose four-drug regimen is not usually begun in the emergency department; admission is reserved for the ill-appearing, uncertain, or non-adherent patient."}, {"id": "7", "group": 7, "slide": 22, "section": "Hemoptysis", "topic": "Pneumonia (CAP)", "skill": "Pharmacology", "stem": "A patient with community-acquired pneumonia is being admitted to a medical floor, not the ICU. Which empiric antibiotic regimen is appropriate?", "options": [{"letter": "A", "text": "Ceftriaxone plus azithromycin"}, {"letter": "B", "text": "Piperacillin-tazobactam plus vancomycin"}, {"letter": "C", "text": "Amoxicillin-clavulanate plus doxycycline"}, {"letter": "D", "text": "Amoxicillin or doxycycline alone"}], "answer": "A", "explanation": "Inpatient non-ICU CAP gets **ceftriaxone + azithromycin** (or a respiratory FQ); healthy outpatients get amoxicillin or doxycycline, comorbid outpatients Augmentin + doxy/macrolide or an FQ; add vancomycin or linezolid for MRSA risk and an antipseudomonal beta-lactam for Pseudomonas risk.", "objective": "", "hint": "Each regimen on the slide matches a setting: a single oral agent for the healthy outpatient, a combination oral regimen or a respiratory fluoroquinolone for outpatients with comorbidities, and **broader** coverage reserved for Pseudomonas or MRSA risk. Pick the one written for the ward."}, {"id": "8", "group": 8, "slide": 23, "section": "Hemoptysis", "topic": "Pneumonia (CAP)", "skill": "Diagnostics & imaging", "stem": "Which variables are scored in the CURB-65 tool used to risk-stratify community-acquired pneumonia?", "options": [{"letter": "A", "text": "Temperature above 38 °C"}, {"letter": "B", "text": "Age 65 or older"}, {"letter": "C", "text": "Respiratory rate of 30 or more"}, {"letter": "D", "text": "Oxygen saturation below 90%"}, {"letter": "E", "text": "BUN greater than 19"}, {"letter": "F", "text": "Confusion"}], "answer": "BCEF", "explanation": "**CURB-65** = Confusion, BUN >19, RR ≥30, BP <90/≤60, age ≥65. Score 0–1 outpatient, 2 observation versus admit, ≥3 admit (ICU if 4–5).", "objective": "", "hint": "The acronym spells out its own items, one of which is **blood pressure** (SBP <90 or DBP ≤60) and is not offered here. Fever and oxygen saturation belong to other severity tools, not this one."}, {"id": "9", "group": 9, "slide": 27, "section": "Hemoptysis", "topic": "HIV pneumonia (PJP)", "skill": "Identification", "stem": "An HIV patient with a CD4 count of 120 has progressive dyspnea, dry cough, hypoxia, and bilateral ground-glass infiltrates. What is the diagnosis and first-line treatment?", "options": [{"letter": "A", "text": "Bacterial CAP; ceftriaxone and azithromycin"}, {"letter": "B", "text": "Tuberculosis; isolation and RIPE"}, {"letter": "C", "text": "Influenza pneumonia; oseltamivir"}, {"letter": "D", "text": "PJP; trimethoprim-sulfamethoxazole"}], "answer": "D", "explanation": "CD4 <200 with bilateral ground-glass infiltrates is **PJP**; treat with TMP/SMX, add steroids if moderate to severe, and give Bactrim prophylaxis whenever CD4 <200. Bacterial CAP is still common in HIV and is treated like any CAP.", "objective": "", "hint": "The **CD4 count** is the discriminator: below 200 the opportunistic organism becomes the board answer, and its treatment is the same drug used for prophylaxis at that threshold, with steroids added when moderate to severe."}, {"id": "10", "group": 10, "slide": 28, "section": "Hemoptysis", "topic": "Empyema", "skill": "Complications", "stem": "A patient admitted for bacterial pneumonia is not improving after several days of appropriate antibiotics. Which complication should be suspected and how is it managed?", "options": [{"letter": "A", "text": "Lung abscess; prolonged oral antibiotics"}, {"letter": "B", "text": "ARDS; lung-protective ventilation"}, {"letter": "C", "text": "Pulmonary embolism; anticoagulation"}, {"letter": "D", "text": "Empyema; chest tube drainage plus antibiotics"}], "answer": "D", "explanation": "**Empyema** is pus in the pleural space, usually a complication of pneumonia; suspect it when pneumonia fails to resolve, confirm on CT/US (loculated, fluid pH <7.10, low glucose, neutrophils), and treat with drainage plus antibiotics. Admit.", "objective": "", "hint": "The lecture's rule is that a pneumonia that fails to resolve on therapy has an **infected collection** beside it that antibiotics alone cannot reach; the fix is mechanical as well as medical."}, {"id": "11", "group": 11, "slide": 33, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Diagnostics & imaging", "stem": "A low pretest probability patient is being evaluated with the PERC rule. Which items, if present, prevent PE from being ruled out?", "options": [{"letter": "A", "text": "Oxygen saturation below 95% on room air"}, {"letter": "B", "text": "Age 50 or older"}, {"letter": "C", "text": "Current estrogen or hormone use"}, {"letter": "D", "text": "Fever above 38 °C"}, {"letter": "E", "text": "Pleuritic chest pain"}, {"letter": "F", "text": "Unilateral leg swelling"}], "answer": "ABCF", "explanation": "The eight **PERC** criteria: age ≥50, HR ≥100, SpO2 <95% RA, unilateral leg swelling, hemoptysis, recent surgery/trauma, prior PE/DVT, hormone use. All negative = PE ruled out with no further testing; any positive = move to Wells.", "objective": "", "hint": "PERC is used only when pretest probability is under 15%, and every criterion must be negative to stop the workup. The items are the classic **VTE risk factors** and vital-sign abnormalities, not symptom descriptors or infectious signs."}, {"id": "12", "group": 12, "slide": 34, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Diagnostics & imaging", "stem": "A patient cannot be PERC-negative and scores 6 on the Wells criteria. What is the next diagnostic step?", "options": [{"letter": "A", "text": "CT pulmonary angiography directly"}, {"letter": "B", "text": "D-dimer, then CTA only if positive"}, {"letter": "C", "text": "Lower-extremity venous ultrasound"}, {"letter": "D", "text": "Bedside echocardiogram for RV strain"}], "answer": "A", "explanation": "Wells >4 (PE likely) goes **straight to CTA**; Wells 0–4 gets a D-dimer, and a positive D-dimer mandates CTA. High gestalt also skips the calculator and images.", "objective": "", "hint": "The two-tier cutoff on the slide is a Wells score of **4**: at or below it the patient is 'PE unlikely' and gets a screening blood test; above it the patient is 'PE likely' and a negative screen could not be trusted anyway."}, {"id": "13", "group": 13, "slide": 35, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Diagnostics & imaging", "stem": "In which patient can a D-dimer below the exclusion cutoff not be trusted to rule out pulmonary embolism?", "options": [{"letter": "A", "text": "A patient already on anticoagulation"}, {"letter": "B", "text": "A patient with a Wells score of 2"}, {"letter": "C", "text": "A patient with symptoms for two days"}, {"letter": "D", "text": "A 75-year-old using the age-adjusted cutoff"}], "answer": "A", "explanation": "A D-dimer <500 (or age × 10 if >50) has NPV >99% — **unless** the patient is on anticoagulation or symptoms have lasted >2 weeks (organized clot). Values above 4000–5000 suggest massive PE, malignancy, dissection, or DIC.", "objective": "", "hint": "The test detects **active** fibrin breakdown. Anything that blocks new clot from forming, or lets the clot organize for more than two weeks, blunts the signal, so a reassuring value is falsely reassuring."}, {"id": "14", "group": 14, "slide": 38, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Diagnostics & imaging", "stem": "A patient with suspected PE has a wedge-shaped peripheral opacity on chest X-ray. What does this finding represent?", "options": [{"letter": "A", "text": "Lobar consolidation from pneumonia"}, {"letter": "B", "text": "Hampton's hump from a pulmonary infarct"}, {"letter": "C", "text": "Atelectasis from splinting"}, {"letter": "D", "text": "Westermark sign of focal oligemia"}], "answer": "B", "explanation": "**Hampton's hump** is a wedge-shaped peripheral opacity from pulmonary infarction (mimics peripheral pneumonia); Westermark sign is focal oligemia distal to the embolus. The classic ECG is S1Q3T3 plus sinus tachycardia.", "objective": "", "hint": "Two eponyms belong to PE on the plain film: one is a region of **absent vessels** distal to the clot, the other is tissue that died for lack of blood supply. The shape tells you which."}, {"id": "15", "group": 15, "slide": 41, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Diagnostics & imaging", "stem": "When should a V/Q scan replace CT angiography as the definitive imaging study for suspected pulmonary embolism?", "options": [{"letter": "A", "text": "When contrast is contraindicated or in pregnancy"}, {"letter": "B", "text": "When bedside echo already shows RV strain"}, {"letter": "C", "text": "When the D-dimer falls in the gray zone"}, {"letter": "D", "text": "Whenever the Wells score exceeds four"}], "answer": "A", "explanation": "**V/Q scan** when contrast is contraindicated, after a recent contrast CT, or in pregnancy. In pregnancy use the YEARS algorithm (leg signs mean LE ultrasound first); fetal dose from either study is far below the teratogenic threshold, but CT gives 20–100× more radiation to maternal breast tissue.", "objective": "", "hint": "CTA is the test of choice; the alternative exists for patients who cannot receive the **dye** or who just received it, plus one special population in which maternal breast radiation matters."}, {"id": "16", "group": 16, "slide": 43, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Pharmacology", "stem": "A hemodynamically stable patient has a confirmed pulmonary embolism. Which statement best describes the initial anticoagulation strategy?", "options": [{"letter": "A", "text": "Warfarin bridged with heparin is first-line"}, {"letter": "B", "text": "Anticoagulate all; LMWH over UFH, DOAC over warfarin"}, {"letter": "C", "text": "Anticoagulate only if PESI class III or higher"}, {"letter": "D", "text": "Unfractionated heparin preferred for everyone"}], "answer": "B", "explanation": "**All** PE patients are anticoagulated unless contraindicated; LMWH is preferred over UFH for initial parenteral therapy and DOACs over VKAs (apixaban is the preferred oral agent, safe at all CKD stages). Continue beyond 3–6 months if no reversible risk factor.", "objective": "", "hint": "Anticoagulation is the one therapy every PE patient receives unless contraindicated, and the preferences on the slide favor the **newer** agents for both the parenteral and the oral phase."}, {"id": "17", "group": 17, "slide": 44, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Management", "stem": "A patient with confirmed PE has persistent hypotension despite resuscitation. Which treatment is indicated, and for which patients is it reserved?", "options": [{"letter": "A", "text": "Thrombolysis; unstable Category D/E patients"}, {"letter": "B", "text": "IVC filter; all patients with recurrent PE"}, {"letter": "C", "text": "Anticoagulation alone; mortality is low"}, {"letter": "D", "text": "Thrombolysis; any PE with RV strain"}], "answer": "A", "explanation": "**Thrombolytics** are for unstable confirmed (or highly suspected in arrest) PE — 2026 AHA/ACC Categories D and E; unstable PE mortality is 25–50%. Activate the PERT team; surgical or catheter embolectomy if lysis is contraindicated.", "objective": "", "hint": "Hypotension is present in only about one in ten PE patients but is the strongest predictor of **mortality**. Clot-busting therapy is reserved for those in incipient or established cardiopulmonary failure, not for everyone with a strained right ventricle."}, {"id": "18", "group": 18, "slide": 48, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Pharmacology", "stem": "Which histories are absolute contraindications to thrombolytic therapy for pulmonary embolism?", "options": [{"letter": "A", "text": "Age over 75 years"}, {"letter": "B", "text": "Heavy menstrual bleeding"}, {"letter": "C", "text": "Active internal bleeding"}, {"letter": "D", "text": "Suspected aortic dissection"}, {"letter": "E", "text": "Prior intracranial hemorrhage"}, {"letter": "F", "text": "Ischemic stroke within the past 3 months"}], "answer": "CDEF", "explanation": "Absolute contraindications: prior **ICH**, known structural cerebral vascular lesion, malignant intracranial neoplasm, ischemic stroke within 3 months, suspected aortic dissection, active bleeding or bleeding diathesis (not menses), significant closed-head or facial trauma within 3 months.", "objective": "", "hint": "Absolute contraindications are conditions in which a lytic would cause **catastrophic** bleeding into a closed space or a vessel wall already torn. Physiologic bleeding and advanced age are not on the list."}, {"id": "19", "group": 19, "slide": 49, "section": "Hemoptysis", "topic": "Pulmonary embolism", "skill": "Management", "stem": "A patient with confirmed PE is PESI class II with normal RV function, normal troponin, and reliable access to medication and follow-up. What is the disposition?", "options": [{"letter": "A", "text": "Observe in the ED and repeat the troponin"}, {"letter": "B", "text": "Admit to telemetry for 24 hours of observation"}, {"letter": "C", "text": "Admit to the ICU for possible thrombolysis"}, {"letter": "D", "text": "Discharge on a DOAC with follow-up within 7 days"}], "answer": "D", "explanation": "**PESI I–II** (Categories A/B) with no RV strain, normal biomarkers, and no new O2 need can go home on a DOAC — but only after screening social determinants (access, cost, transport) and securing follow-up within 7 days. PESI III–V or any admit trigger means hospitalization.", "objective": "", "hint": "The low PESI classes carry 30-day mortality under 2% and were non-inferior as **outpatients**; the admit triggers are RV strain, hypotension, new O2 requirement, elevated lactate, or elevated troponin/pro-BNP, none of which are present here."}, {"id": "20", "group": 20, "slide": 56, "section": "Hemoptysis", "topic": "Pulmonary embolism in pregnancy", "skill": "Pharmacology", "stem": "A pregnant patient at 30 weeks is diagnosed with pulmonary embolism. Which anticoagulant is appropriate?", "options": [{"letter": "A", "text": "Rivaroxaban"}, {"letter": "B", "text": "Warfarin"}, {"letter": "C", "text": "Low-molecular-weight heparin"}, {"letter": "D", "text": "Apixaban"}], "answer": "C", "explanation": "Pregnancy PE gets **heparin or LMWH only** — no DOAC, no warfarin. VTE risk peaks in the 6 weeks postpartum and returns to baseline by 12 weeks.", "objective": "", "hint": "DOACs are contraindicated in pregnancy and breastfeeding, and the vitamin K antagonist is a **teratogen**; the safe class is the parenteral agent that does not cross the placenta."}, {"id": "21", "group": 21, "slide": 64, "section": "Cough", "topic": "Influenza", "skill": "Pharmacology", "stem": "A healthy adult has 36 hours of fever, myalgias, headache, and cough, and tests positive for influenza. What is the treatment approach?", "options": [{"letter": "A", "text": "Dexamethasone to shorten the illness"}, {"letter": "B", "text": "Consider oseltamivir, hydrate, acetaminophen"}, {"letter": "C", "text": "Azithromycin to prevent secondary pneumonia"}, {"letter": "D", "text": "Admission for IV fluids and observation"}], "answer": "B", "explanation": "Influenza (antigen/PCR) is treated supportively — hydration, acetaminophen — with **oseltamivir** considered within 48 h via shared decision-making. Admit if significantly dehydrated, in respiratory distress, hypoxemic, or AMS.", "objective": "", "hint": "The antiviral shortens illness by about a day only when started within **48 hours**, and recent meta-analyses show no reduction in hospitalization, which is why the slide says 'consider' rather than 'give'. Admission is for dehydration, hypoxia, or altered mental status."}, {"id": "22", "group": 22, "slide": 65, "section": "Cough", "topic": "Pertussis", "skill": "Management", "stem": "An unvaccinated adult has had a cough for 2 weeks with paroxysms, inspiratory whoop, and post-tussive emesis. What is the correct ED management?", "options": [{"letter": "A", "text": "Admit for IV antibiotics and observation"}, {"letter": "B", "text": "Amoxicillin and airborne isolation"}, {"letter": "C", "text": "Supportive care only; antibiotics no longer help"}, {"letter": "D", "text": "Azithromycin, droplet precautions, prophylaxis for contacts"}], "answer": "D", "explanation": "Pertussis (NP PCR) gets **azithromycin** if within 3 weeks of cough onset, droplet precautions, and post-exposure prophylaxis for household and healthcare contacts; most go home.", "objective": "", "hint": "Antibiotics are worthwhile within **3 weeks** of cough onset because that is the highest-transmission window, and the public-health half of the plan reaches beyond the patient to the household and healthcare workers exposed."}, {"id": "23", "group": 23, "slide": 66, "section": "Cough", "topic": "Bronchiolitis (RSV)", "skill": "Management", "stem": "A 9-month-old in January has wheezing, tachypnea, and rhinorrhea, with SpO2 of 94% and no retractions. What is the appropriate ED treatment?", "options": [{"letter": "A", "text": "Oxygen by nasal cannula and admission"}, {"letter": "B", "text": "Azithromycin for atypical coverage"}, {"letter": "C", "text": "Albuterol nebulizer and oral dexamethasone"}, {"letter": "D", "text": "Nasal suction and supportive care"}], "answer": "D", "explanation": "Bronchiolitis (RSV, ages 0–2, winter) is **supportive**: nasal suctioning, O2 only if SpO2 <92%. Admit if hypoxic, using accessory muscles, or dehydrated. Prevention: maternal RSV vaccine at 32–36 weeks or nirsevimab for infants <8 months if the mother was unvaccinated.", "objective": "", "hint": "The RSV threshold for supplemental oxygen is an SpO2 under **92%**, and bronchodilators and steroids have no role; admission is for hypoxia, accessory muscle use, or dehydration, none of which are present."}, {"id": "24", "group": 24, "slide": 68, "section": "Cough", "topic": "Croup", "skill": "Pharmacology", "stem": "A 2-year-old with a barking cough and stridor at rest is treated for croup. Which medication is given and which is avoided, and why?", "options": [{"letter": "A", "text": "Ipratropium; dexamethasone avoided in toddlers"}, {"letter": "B", "text": "Ceftriaxone; epinephrine avoided for tachycardia"}, {"letter": "C", "text": "Albuterol; steroids avoided in a viral illness"}, {"letter": "D", "text": "Dexamethasone; albuterol avoided because it worsens edema"}], "answer": "D", "explanation": "**Dexamethasone** is first line for all croup; nebulized racemic epinephrine if stridor at rest, then observe 2–3 h. No albuterol — vasodilation worsens the edema. Admit if ≥2 epi doses or unable to tolerate PO.", "objective": "", "hint": "Croup is **subglottic** swelling, not bronchospasm, so the drugs that help shrink the airway are a steroid for every patient and a nebulized vasoconstrictor for stridor at rest; ask what a bronchodilator does to blood vessels."}, {"id": "25", "group": 25, "slide": 70, "section": "Cough", "topic": "Foreign body aspiration", "skill": "Diagnostics & imaging", "stem": "A 3-year-old has sudden wheeze, cough, and unilateral decreased breath sounds, but the chest X-ray is normal. What is the next step?", "options": [{"letter": "A", "text": "CT chest to look for pneumonia"}, {"letter": "B", "text": "Reassure and discharge with return precautions"}, {"letter": "C", "text": "Albuterol trial and repeat examination"}, {"letter": "D", "text": "Rigid bronchoscopy under general anesthesia"}], "answer": "D", "explanation": "Foreign body aspiration (ages 1–5): CXR misses ~75% because most objects are **radiolucent**. Heimlich or intubation to dislodge a complete obstruction; partial obstruction goes to rigid bronchoscopy under GA. Discharge once removed.", "objective": "", "hint": "About **75%** of aspirated objects do not show on a plain film, so a normal study excludes nothing; the sudden, unilateral story in this age group is the diagnosis, and the definitive step both confirms and removes it."}, {"id": "26", "group": 26, "slide": 83, "section": "Shortness of Breath", "topic": "Tension pneumothorax", "skill": "Identification", "stem": "Which clinical findings differentiate a tension pneumothorax from a simple spontaneous pneumothorax at the bedside?", "options": [{"letter": "A", "text": "Hypotension"}, {"letter": "B", "text": "Jugular venous distension"}, {"letter": "C", "text": "Decreased breath sounds on the affected side"}, {"letter": "D", "text": "Hyperresonance on the affected side"}, {"letter": "E", "text": "Pleuritic chest pain"}, {"letter": "F", "text": "Tracheal deviation away from the affected side"}], "answer": "ABF", "explanation": "Tension adds **tracheal deviation**, hypotension, JVD, severe distress, and worsening hypoxia (rising peak pressures if ventilated) to the shared SOB, pleuritic pain, decreased breath sounds, hyperresonance, and tachycardia. Tracheal deviation is a late sign — do not require it.", "objective": "", "hint": "Both share the findings of air in the pleural space. Tension adds the consequences of **mediastinal shift** and kinked vena cavae — signs of obstructive shock rather than signs of a collapsed lung."}, {"id": "27", "group": 27, "slide": 83, "section": "Shortness of Breath", "topic": "Tension pneumothorax", "skill": "Management", "stem": "A dyspneic trauma patient is hypotensive with JVD and absent breath sounds on the right. What is the immediate management?", "options": [{"letter": "A", "text": "Positive-pressure ventilation and fluid bolus"}, {"letter": "B", "text": "Needle decompression, then tube thoracostomy"}, {"letter": "C", "text": "Bedside ultrasound, then CT of the chest"}, {"letter": "D", "text": "Portable chest X-ray to confirm, then chest tube"}], "answer": "B", "explanation": "Tension PTX: immediate **needle decompression** followed by tube thoracostomy; do not wait for imaging and avoid positive-pressure ventilation until decompressed. Admit always.", "objective": "", "hint": "Tension pneumothorax is a **clinical** diagnosis; imaging delays treatment, and positive pressure drives more air through the one-way valve. Relieve the pressure first with the fastest available intervention, then place the definitive one."}, {"id": "28", "group": 28, "slide": 84, "section": "Shortness of Breath", "topic": "Pneumothorax", "skill": "Management", "stem": "A patient with COPD presents with a 1.5 cm spontaneous pneumothorax and mild dyspnea. What is the appropriate management and disposition?", "options": [{"letter": "A", "text": "Oxygen, observe 3 hours, repeat CXR, discharge"}, {"letter": "B", "text": "Discharge with repeat CXR in 2 weeks"}, {"letter": "C", "text": "Chest tube or catheter and admission"}, {"letter": "D", "text": "Needle aspiration and discharge with follow-up"}], "answer": "C", "explanation": "A **secondary** pneumothorax (COPD, asthma, ILD, cancer) of any size gets a small catheter or chest tube and admission. Small (≤2 cm) primary first-time PTX in a stable patient: NRB O2, observe >3 h, repeat CXR, discharge with return precautions and a 2-week recheck; >2 cm or symptomatic: chest tube and admit. Bedside US shows absent lung sliding with a lung point.", "objective": "", "hint": "Size rules (the 2 cm cutoff) govern a **primary** pneumothorax in a healthy lung. Underlying lung disease changes everything — the disposition is the same regardless of how small the film looks."}, {"id": "29", "group": 29, "slide": 85, "section": "Shortness of Breath", "topic": "Pleural effusion", "skill": "Diagnostics & imaging", "stem": "Which pleural fluid measurements make up Light's criteria for classifying an effusion as exudative?", "options": [{"letter": "A", "text": "Pleural fluid glucose below 60"}, {"letter": "B", "text": "Neutrophil predominance"}, {"letter": "C", "text": "Pleural fluid to serum protein ratio greater than 0.5"}, {"letter": "D", "text": "Pleural fluid to serum LDH ratio greater than 0.6"}, {"letter": "E", "text": "Pleural fluid LDH above two-thirds the serum upper limit"}, {"letter": "F", "text": "Pleural fluid pH below 7.10"}], "answer": "CDE", "explanation": "**Light's criteria** (exudate if ≥1): fluid/serum protein >0.5, fluid/serum LDH >0.6, fluid LDH >2/3 ULN serum. Cell count (neutrophils = parapneumonic/PE/pancreatitis; lymphocytes = cancer/TB), low glucose, pH <7.10 (parapneumonic needing a tube), and amylase then refine the cause. CXR needs 150–200 mL to blunt the costophrenic angle.", "objective": "", "hint": "Light's criteria compare two **chemistries** with their serum values and nothing else. Glucose, pH, and cell count are the next-step tests that narrow the cause of an exudate once you have one."}, {"id": "30", "group": 30, "slide": 86, "section": "Shortness of Breath", "topic": "Pleural effusion", "skill": "Management", "stem": "A patient with heart failure has a moderate pleural effusion on CXR, mild dyspnea, and stable vital signs. What is the ED plan?", "options": [{"letter": "A", "text": "Diuresis and discharge with PCP follow-up"}, {"letter": "B", "text": "Emergent thoracentesis and discharge"}, {"letter": "C", "text": "Observe 4 hours and discharge if improved"}, {"letter": "D", "text": "Diuresis and admission"}], "answer": "D", "explanation": "Transudates (CHF, nephrotic, cirrhosis) get **diuresis**; thoracentesis if unstable or for symptom control. Only a trace effusion with no life-threatening cause goes home — anything beyond trace is admitted.", "objective": "", "hint": "Thoracentesis is reserved for the unstable or symptomatic patient, and a transudate from hydrostatic pressure responds to volume removal by medication. Disposition hinges on one word on the slide: **trace**."}, {"id": "31", "group": 31, "slide": 90, "section": "Shortness of Breath", "topic": "Hemothorax", "skill": "Management", "stem": "A trauma patient's chest tube drains 1600 mL of blood immediately after placement. What does this output indicate?", "options": [{"letter": "A", "text": "Need for a second, larger chest tube"}, {"letter": "B", "text": "Chylothorax from thoracic duct injury"}, {"letter": "C", "text": "Expected drainage; continue tube thoracostomy"}, {"letter": "D", "text": "Massive hemothorax requiring thoracotomy"}], "answer": "D", "explanation": "Hemothorax = blood in the pleural space, usually from direct lung injury; most resolve with a large tube. **Thoracotomy** if >1500 mL initial output, 150–200 mL/h for 2–4 h, or persistent transfusion need. Massive hemothorax is on the life-threatening effusion list — admit.", "objective": "", "hint": "Most hemothoraces resolve with a large tube alone. The surgical triggers are an initial output above **1500 mL**, ongoing output of 150–200 mL/h for 2–4 hours, or a persistent transfusion requirement."}, {"id": "32", "group": 32, "slide": 90, "section": "Shortness of Breath", "topic": "Chylothorax", "skill": "Identification", "stem": "After thoracic surgery, a patient's pleural drain fills with milky white fluid. What is the diagnosis and which structure was injured?", "options": [{"letter": "A", "text": "Empyema; parapneumonic space"}, {"letter": "B", "text": "Transudate; pulmonary lymphatics"}, {"letter": "C", "text": "Hemothorax; intercostal artery"}, {"letter": "D", "text": "Chylothorax; thoracic duct"}], "answer": "D", "explanation": "**Chylothorax** is lymphatic fluid (chyle) in the pleural space from thoracic duct injury (surgery, penetrating trauma) or lymphoma; it is milky white. Treat with drainage, fat restriction/MCT or TPN, and ligation if persistent.", "objective": "", "hint": "The word that defines each pleural collection is the **fluid** — pus, blood, or lymph. The appearance here points to lymph, and the single large lymphatic channel that runs through the chest is the one surgery can injure."}, {"id": "33", "group": 33, "slide": 91, "section": "Shortness of Breath", "topic": "ARDS", "skill": "Diagnostics & imaging", "stem": "A septic patient develops profound dyspnea with new bilateral opacities and a PaO2/FiO2 ratio of 150 despite a normal cardiac evaluation. How is this classified and ventilated?", "options": [{"letter": "A", "text": "Cardiogenic pulmonary edema; diuresis and BiPAP"}, {"letter": "B", "text": "Moderate ARDS; tidal volume 6 mL/kg ideal body weight"}, {"letter": "C", "text": "Mild ARDS; supplemental oxygen by nasal cannula"}, {"letter": "D", "text": "Severe ARDS; high tidal volumes to recruit alveoli"}], "answer": "B", "explanation": "**ARDS**: bilateral opacities not from heart failure, P/F <300 (mild 200–300, moderate 100–200, severe <100). Treat the cause, mechanical ventilation with tidal volume 6 mL/kg IBW, consider steroids, ICU. FiO2 on nasal cannula ≈ 20% + 4 × L/min.", "objective": "", "hint": "ARDS is non-cardiogenic edema defined by a P/F ratio under **300**, with severity bands of 200–300, 100–200, and under 100. Ventilation is lung-protective, which means small breaths, not big ones."}, {"id": "34", "group": 34, "slide": 94, "section": "Shortness of Breath", "topic": "Epiglottitis", "skill": "Management", "stem": "A febrile child is drooling, tripoding, and stridulous with a muffled voice. What is the appropriate ED management?", "options": [{"letter": "A", "text": "Lateral neck film, then tongue-depressor exam of the throat"}, {"letter": "B", "text": "Supine positioning and oral antibiotics, discharge home"}, {"letter": "C", "text": "Dexamethasone and racemic epinephrine, observe 3 hours"}, {"letter": "D", "text": "Keep upright, no oral exam, secure airway, ceftriaxone"}], "answer": "D", "explanation": "**Epiglottitis**: keep the child upright, do not examine the oropharynx, nebulized epinephrine, prepare for airway management (may need cricothyrotomy), ceftriaxone ± vancomycin for MRSA. Admit to ICU with ENT consultation.", "objective": "", "hint": "This is a **supraglottic** emergency in which agitation or instrumenting the mouth can trigger laryngospasm; the diagnosis is clinical (thumbprint sign confirms but is not required) and the plan is airway first, antibiotics second, ICU and ENT third."}, {"id": "35", "group": 35, "slide": 98, "section": "Wheezing", "topic": "Asthma exacerbation", "skill": "Management", "stem": "A wheezing asthmatic arrives with SpO2 of 88% and dyspnea limiting conversation. What is the initial ED treatment, and which diagnostic test is not used?", "options": [{"letter": "A", "text": "Albuterol alone; no steroids or oxygen"}, {"letter": "B", "text": "O2, IV magnesium, ketamine; no chest X-ray"}, {"letter": "C", "text": "BiPAP and IV antibiotics; no peak flow"}, {"letter": "D", "text": "O2, albuterol-ipratropium, steroids; no PFTs"}], "answer": "D", "explanation": "Asthma exacerbation: O2 if SpO2 <90%, **duoneb** (albuterol/ipratropium, continuous if needed), and systemic steroids. Diagnosis is clinical — no PFTs in the ER; CXR only if pneumonia, PTX, or foreign body is suspected.", "objective": "", "hint": "The lecture's line is that formal spirometry has no role in the ER; diagnosis is clinical and response is tracked by bedside peak flow and saturation. First-line therapy is the standard **trio**, with the adjuncts reserved for failure to improve."}, {"id": "36", "group": 36, "slide": 103, "section": "Wheezing", "topic": "Status asthmaticus", "skill": "Management", "stem": "An asthmatic has a silent chest and accessory muscle use despite repeated duonebs and steroids. Which adjunct is given first, and what must be excluded before starting NIPPV?", "options": [{"letter": "A", "text": "IV magnesium sulfate; pneumothorax"}, {"letter": "B", "text": "IV antibiotics; pneumonia"}, {"letter": "C", "text": "Nebulized racemic epinephrine; croup"}, {"letter": "D", "text": "IV furosemide; heart failure"}], "answer": "A", "explanation": "**Status asthmaticus**: IV magnesium 1–2 g (monitor BP and DTRs), NIPPV after ruling out pneumothorax, epinephrine, ketamine. Intubate for altered sensorium, progressive hypercarbia, acidosis, or inability to protect the airway — ventilation only rests the patient, it does not relieve the obstruction.", "objective": "", "hint": "A silent chest is **worse** than loud wheezing. The first-line IV adjunct is a smooth-muscle relaxant monitored by blood pressure and deep tendon reflexes, and the condition that positive pressure can convert into tension is the one to rule out."}, {"id": "37", "group": 37, "slide": 105, "section": "Wheezing", "topic": "COPD exacerbation", "skill": "Management", "stem": "A COPD patient in exacerbation has an SpO2 of 85%. What oxygen saturation target should guide supplemental O2?", "options": [{"letter": "A", "text": "Above 98%"}, {"letter": "B", "text": "No target; give high-flow O2"}, {"letter": "C", "text": "88–92%"}, {"letter": "D", "text": "Above 94%"}], "answer": "C", "explanation": "COPD: titrate O2 to **88–92%** (PaO2 60–70 mmHg), duoneb, steroids, BiPAP if needed; ABG shows PaO2 <60 or PCO2 >44 (respiratory acidosis). ICU for pH <7.2, NIV failure, AMS, or hemodynamic instability.", "objective": "", "hint": "Over-oxygenating a chronic CO2 retainer worsens hypercapnia, so the target is deliberately **modest** and the ABG is repeated after 20–30 minutes if saturation stays below 90% or hypercapnia is a concern."}, {"id": "38", "group": 38, "slide": 106, "section": "Wheezing", "topic": "COPD exacerbation", "skill": "Pharmacology", "stem": "Which clinical features justify antibiotics in a moderately ill patient with a COPD exacerbation?", "options": [{"letter": "A", "text": "Increased dyspnea"}, {"letter": "B", "text": "Increased sputum volume"}, {"letter": "C", "text": "Wheezing on auscultation"}, {"letter": "D", "text": "Increased sputum purulence"}], "answer": "ABD", "explanation": "COPD antibiotics for increased **sputum**, purulence, and dyspnea: azithromycin (or beta-lactam, doxycycline, Bactrim) if uncomplicated; fluoroquinolone with risk factors (recent hospitalization/antibiotics, comorbidity, frequent exacerbations); cover Pseudomonas if recent admission/antibiotics, prior Pseudomonas culture, or bronchiectasis.", "objective": "", "hint": "The lecture's rule is antibiotics for the moderately or severely ill patient with evidence of **infection**, judged by changes in what the patient is producing and how hard they are breathing; wheezing is the exacerbation itself, present with or without infection."}, {"id": "39", "group": 39, "slide": 110, "section": "Wheezing", "topic": "Asthma/COPD discharge", "skill": "Counseling & prevention", "stem": "A COPD patient has improved after ED treatment and is going home. Which discharge item does the lecture single out to confirm before the patient leaves?", "options": [{"letter": "A", "text": "Antibiotics are prescribed regardless of sputum change"}, {"letter": "B", "text": "Pulmonary function tests are ordered for next week"}, {"letter": "C", "text": "A repeat chest X-ray has been scheduled in 2 weeks"}, {"letter": "D", "text": "The patient can demonstrate correct inhaler technique"}], "answer": "D", "explanation": "COPD discharge: home O2 if needed, bronchodilators, short oral steroid course, antibiotics if indicated, follow-up within **1 week**, and ensure the patient knows how to use the inhaler. Asthma: SABA plus oral steroids, continue ICS, written action plan, follow-up in 1–4 weeks.", "objective": "", "hint": "The bundle is home O2 if needed, adequate bronchodilators, a short oral steroid course, antibiotics only when indicated, and PCP or pulmonology follow-up within a week — plus one **hands-on** check that the medications will actually reach the lungs."}, {"id": "40", "group": 40, "slide": 115, "section": "Review & Disposition", "topic": "Disposition rules", "skill": "Management", "stem": "Which of the following diagnoses is admitted according to the lecture's discharge-versus-admit summary regardless of how well the patient appears?", "options": [{"letter": "A", "text": "Influenza"}, {"letter": "B", "text": "Croup"}, {"letter": "C", "text": "Acute bronchitis"}, {"letter": "D", "text": "Epiglottitis"}], "answer": "D", "explanation": "The admit list: PE Category C–E, high CURB-65/PSI pneumonia, any infection or COPD/asthma with unstable VS, new O2 demand, accessory muscle use, or persistent wheezing/stridor, large/recurrent/secondary/tension PTX, worsening bronchiectasis, ARDS, and **epiglottitis**. Disposition is a safety decision, not a bed decision.", "objective": "", "hint": "Infections like bronchitis, croup, influenza, pertussis, and bronchiolitis go home when vitals, saturation, and work of breathing are stable. The admit-always list is reserved for conditions in which the **airway** or oxygenation can fail abruptly."}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  const normAns = a => (Array.isArray(a) ? a.join('') : String(a == null ? '' : a))
    .toUpperCase().replace(/[^A-Z]/g, '').split('')
    .filter((v, i, z) => z.indexOf(v) === i).sort().join('');
  questions.forEach(q => { const n = normAns(q.answer); q.multi = q.multi === true || n.length > 1; q.answer = n; });
  const picks = {};          // question id -> letters picked but not yet submitted (multi only)
  const second = {};         // question id -> second-attempt answer (NOT scored)
  const flagged = {};        // question id -> true, set by the student at any point
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const keys = new Set(String(item.answer).split('').map(l => (item.options.find(o => o.letter === l) || {}).text));
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = item.options.filter(o => keys.has(o.text)).map(o => o.letter).join('');
  }
  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letters) => String(letters == null ? '' : letters).split('')
    .map(l => { const o = item.options.find(x => x.letter === l); return o ? o.text : ''; })
    .filter(Boolean).join(' \u00b7 ');
  const letters = v => String(v == null ? '' : v).split('').join(', ');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Hint, then the same question again =================
  // A missed question is never replaced by new questions. The student gets a hint
  // that points hard at the answer without naming it, then the SAME question again.
  // The FIRST attempt is what is scored; the second only decides whether the concept
  // is recorded as relearned or still shaky.
  function hintOf(q) {
    const r = q.remediation || {};
    return q.hint || r.hint || ((r.steps || [])[0] || {}).teach || '';
  }
  function hasTutor(q) { return !!hintOf(q); }

  function startTutor(q) {
    tutor[q.id] = { status: 'active', first: answers[q.id] };
    delete picks[q.id];
  }

  function isRetrying(q) { const t = tutor[q.id]; return !!(t && t.status === 'active'); }

  function secondAnswer(q, picked) {
    const t = tutor[q.id];
    if (!t || t.status !== 'active') return;
    second[q.id] = picked;
    t.status = picked === q.answer ? 'mastered' : 'review';
  }

  // The option already shown to be wrong is struck out on the retry. A select-all
  // answer is a set rather than one claim, so there every option stays live.
  function elimOf(q) { const t = tutor[q.id]; return (t && !q.multi && t.first) ? t.first : ''; }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong with no hint to give, or the second attempt is in.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return !isRetrying(q);
  }

  function tutorStatus(q) { const t = tutor[q.id]; return t ? t.status : null; }

  function hintHtml(q) {
    return '<div class="tutor"><div class="tutor-head">Hint</div>' +
      '<div class="tnode active hint"><span class="tlabel">Try again \u2014 same question</span>' +
      '<div class="teach">' + fmt(hintOf(q)) + '</div></div></div>';
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly can still be carried into the next round of study.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">\u2691 ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '\u2691 ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  // Collapsed record of the retry, shown in the review screens
  function trailHtml(q) {
    const t = tutor[q.id];
    if (!t) return '';
    const sec = second[q.id];
    let html = '<div class="tutor"><div class="tutor-head">Hint and second attempt</div>' +
      '<div class="tnode done"><div class="teach">' + fmt(hintOf(q)) + '</div>' +
      '<div class="firstpick">First answer: ' + esc(letters(t.first)) + '. ' + fmt(optText(q, t.first)) + '</div>';
    if (sec === undefined) html += '<div class="nudge">Second attempt not taken.</div>';
    else html += '<div class="feedback ' + (t.status === 'mastered' ? 'good' : 'bad') + '"><div class="verdict">' +
      (t.status === 'mastered' ? '\u2713 Correct on the second attempt'
        : '\u2717 Second attempt: ' + esc(letters(sec)) + '. ' + fmt(optText(q, sec))) + '</div></div>';
    return html + '</div></div>';
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen, first) {
    const good = chosen === q.answer;
    const keyTxt = optText(q, q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '\u2713 Correct' : '\u2717 Incorrect \u2014 correct answer' +
      (q.multi ? 's' : '') + ': ' + esc(letters(q.answer)) + (keyTxt ? '. ' + fmt(keyTxt) : '')) + '</div>';
    if (!good && q.multi) {
      const got = String(chosen || '').split('').filter(Boolean);
      const missed = String(q.answer).split('').filter(l => got.indexOf(l) === -1);
      const extra = got.filter(l => q.answer.indexOf(l) === -1), bits = [];
      if (missed.length) bits.push('missed ' + missed.join(', '));
      if (extra.length) bits.push('wrongly included ' + extra.join(', '));
      if (bits.length) html += '<div class="obj" style="font-style:normal">You ' + esc(bits.join(' and ')) + '.</div>';
    }
    if (first !== undefined && first !== chosen) {
      html += '<div class="firstpick">First attempt: ' + esc(letters(first)) + '. ' + fmt(optText(q, first)) +
        (good ? ' \u2014 corrected after the hint.' : ' \u2014 also incorrect.') + '</div>';
    }
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const first = answers[q.id];
    const sec = second[q.id];
    const retry = isRetrying(q) && mode === 'exam';
    const answered = first !== undefined && !retry;
    const chosen = sec !== undefined ? sec : first;
    const status = tutorStatus(q);
    const sel = answered ? String(chosen || '') : (q.multi ? (picks[q.id] || []).join('') : '');
    const dead = retry ? elimOf(q) : '';

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Right on the second try</span>';
    else if (status === 'review') html += '<span class="badge review">Missed twice</span>';
    else if (status === 'active') html += '<span class="badge active">Second attempt</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';

    if (retry) {
      html += '<div class="feedback tutoring"><div class="verdict">\u2717 Not quite \u2014 ' +
        esc(letters(first)) + '. ' + fmt(optText(q, first)) + '</div>' +
        '<div>Read the hint, then answer the same question again. Your first answer is the one that is scored.</div></div>';
      html += hintHtml(q);
    }

    if (q.multi && !answered) html += '<div class="sata-note">Select all that apply.</div>';
    html += '<div class="opts">';
    q.options.forEach(o => {
      let cls = 'opt';
      const hit = sel.indexOf(o.letter) !== -1;
      const out = dead.indexOf(o.letter) !== -1;
      if (answered) {
        if (hit) cls += q.answer.indexOf(o.letter) !== -1 ? ' correct' : ' incorrect';
        else if (q.answer.indexOf(o.letter) !== -1) cls += ' correct';
        else cls += ' dim';
      } else if (out) cls += ' incorrect elim';
      else if (hit) cls += ' picked';
      const mark = (q.multi ? '<span class="box' + (hit ? ' on' : '') + '">' + (hit ? '\u2713' : '') + '</span>' : '') +
        '<span class="letter">' + esc(o.letter) + '.</span>';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered || out || mode !== 'exam' ? ' disabled' : '') + '>' +
        mark + '<span>' + fmt(o.text) + '</span></button>';
    });
    html += '</div>';
    if (q.multi && !answered) {
      const n = (picks[q.id] || []).length;
      html += '<div class="sata-bar"><button class="opt-submit" data-submit="' + esc(q.id) + '"' +
        (n ? '' : ' disabled') + '>Submit answer</button><span class="sata-count">' +
        (n ? n + ' selected' : 'Choose one or more') + '</span></div>';
    }
    if (answered) html += feedbackHtml(q, chosen, sec !== undefined ? first : undefined);
    html += flagHtml(q);
    if (mode !== 'exam' && tutor[q.id]) {
      html += '<details class="trail"><summary>Hint and second attempt</summary>' + trailHtml(q) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'take the second attempt above to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Option clicks: first attempt, then the second attempt on the same question
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      const commit = picked => {
        const q = byId[qid];
        if (answers[qid] === undefined) {
          answers[qid] = picked;
          if (picked !== q.answer && hasTutor(q)) startTutor(q);
        } else if (isRetrying(q)) secondAnswer(q, picked);
        renderPage(true);
      };
      card.querySelectorAll(':scope > .opts > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          const q = byId[qid];
          if (answers[qid] !== undefined && !isRetrying(q)) return;
          const letter = btn.getAttribute('data-letter');
          if (q.multi) {                       // toggle; nothing is committed until Submit
            const cur = picks[qid] || (picks[qid] = []);
            const at = cur.indexOf(letter);
            if (at === -1) cur.push(letter); else cur.splice(at, 1);
            return renderPage(true);
          }
          commit(letter);
        });
      });
      const sub = card.querySelector(':scope > .sata-bar > .opt-submit');
      if (sub) sub.addEventListener('click', () => {
        if (mode !== 'exam') return;
        const cur = picks[qid] || [];
        if (cur.length) commit(cur.slice().sort().join(''));
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.qcard > .feedback');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      if (second[id] !== undefined) { ts.tq++; if (t.status === 'mastered') ts.tqRight++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {                 // wrong on the first attempt, or flagged
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' still shaky');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' right on the second try');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed question' + (r.ts.started === 1 ? '' : 's') + ' answered right on the second attempt</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try, plus anything you flagged</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed or flagged — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, flagged: 2, mastered: 3 };
      const items = missed.map(q => {
        const wrong = answers[q.id] !== undefined && answers[q.id] !== q.answer;
        let st = wrong ? (tutor[q.id] ? tutor[q.id].status : 'missed') : 'flagged';
        if (st === 'active') st = 'review';
        return { q, st: st, flag: !!flagged[q.id] };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', flagged: 'Flagged', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + (it.flag && it.st !== 'flagged' ? '⚑ ' : '') +
          label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Second attempts</h2><div class="sub" style="margin-bottom:12px">How the hint-and-retry went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>missed on the first try</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>right after the hint</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>second attempts right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered'
        : 'My answer (first attempt, scored): ' + letters(answers[q.id]));
      lines.push('Correct answer: ' + letters(q.answer) + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        lines.push('Hint shown: ' + plain(hintOf(q)));
        lines.push('Second attempt: ' + { mastered: 'CORRECT after the hint', review: 'still wrong \u2014 needs review',
          active: 'not taken' }[t.status]);
        if (second[q.id] !== undefined && t.status !== 'mastered')
          lines.push('  picked ' + letters(second[q.id]) + '. ' + plain(optText(q, second[q.id])));
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(second).forEach(k => delete second[k]);
    Object.keys(picks).forEach(k => delete picks[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
