<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHARM Exam 4 — Self-Grading Practice Exam</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--accent:#3157d5;--ok:#14804a;--okbg:#e9f8ef;--bad:#c43131;--badbg:#fff0f0;--warn:#a35b00;--shadow:0 14px 40px rgba(34,54,89,.10)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.42}
.app{max-width:1120px;margin:auto;padding:18px}.topbar{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.94);backdrop-filter:blur(12px);padding:10px 0 12px}
.header{background:linear-gradient(135deg,#142d68,#3157d5);color:white;border-radius:18px;padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px}
.header h1{font-size:clamp(20px,2.4vw,30px);margin:0}.header p{margin:3px 0 0;opacity:.86;font-size:13px}.counter{font-weight:800;white-space:nowrap}.progress{height:7px;background:#dce5f5;border-radius:99px;overflow:hidden;margin:10px 4px 0}.progress>div{height:100%;background:var(--accent);width:0;transition:.25s}
.exam-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-top:14px;min-height:58vh}.question-grid{display:grid;grid-template-columns:1fr;gap:14px}.question-grid.multi{grid-template-columns:repeat(2,minmax(0,1fr))}
.qbox{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.qhead{font-weight:850;font-size:15px;margin-bottom:8px}.stem{font-size:14px;margin:0 0 10px}.choices{display:grid;gap:6px}.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:#fff;font-size:13px;transition:.15s}.choice:hover{border-color:#9eb0e9;background:#f8faff}.choice input{margin-top:3px}.choice.correct{border-color:var(--ok);background:var(--okbg)}.choice.incorrect{border-color:var(--bad);background:var(--badbg)}.choice.locked{cursor:default}.feedback{display:none;margin-top:9px;padding:9px 10px;border-radius:10px;font-size:12.5px}.feedback.show{display:block}.feedback.ok{background:var(--okbg);color:#0d6037}.feedback.bad{background:var(--badbg);color:#8e2222}.meta{margin-top:5px;color:#475569}.controls{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:14px}.left,.right{display:flex;flex-wrap:wrap;gap:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer;font-size:14px}.primary{background:var(--accent);color:#fff}.secondary{background:#e8edf7;color:#203052}.danger{background:#8f2d2d;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}
.results{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin-top:14px}.results.show{display:block}.score{font-size:32px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}.stat{background:#f6f8fc;border-radius:12px;padding:13px}.stat strong{display:block;font-size:20px}.section-table{width:100%;border-collapse:collapse;font-size:13px}.section-table th,.section-table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#eef2ff;color:#3147a4;font-size:11px;font-weight:800}.review-note{font-size:13px;color:var(--muted)}
@media(max-width:760px){.app{padding:10px}.header{padding:14px}.question-grid.multi{grid-template-columns:1fr}.exam-card{padding:12px}.qbox{padding:12px}.stem{font-size:14px}.choice{font-size:13px}.controls,.left,.right{width:100%}.btn{flex:1}.header p{display:none}}
@media(min-width:761px) and (max-height:850px){.exam-card{padding:14px}.qbox{padding:11px}.stem{font-size:12.5px}.choice{padding:6px 8px;font-size:12px}.question-grid{gap:10px}}
</style></head><body><div class="app">
<div class="topbar"><div class="header"><div><h1>PHARM Exam 4</h1><p>Standalone self-grading practice exam • 90 scored items</p></div><div class="counter" id="counter"></div></div><div class="progress"><div id="progressBar"></div></div></div>
<main id="examCard" class="exam-card"><div id="questionGrid" class="question-grid"></div><div class="controls"><div class="left"><button id="prevBtn" class="btn secondary">Previous</button><button id="reviewBtn" class="btn secondary">Review Missed Questions</button></div><div class="right"><button id="gradeCurrentBtn" class="btn danger">Submit (Grade from current place)</button><button id="nextBtn" class="btn primary">Next</button><button id="submitBtn" class="btn primary" style="display:none">Submit (End of Test)</button></div></div></main>
<section id="results" class="results"><h2>Exam Results</h2><div class="score" id="scoreLine"></div><div class="stats" id="stats"></div><h3>Performance by Content Area</h3><div id="sectionScores"></div><p class="review-note">Scores include only answered questions when grading from the current place.</p></section>
</div><script>
const groups=[[{"id": "1", "number": 1, "suffix": "", "stem": "A 42-year-old woman returns from camping in Tennessee with high fever, severe headache, and a rash that began on her wrists and ankles and spread centrally; the spots do not blanch. She recalls a tick bite. Which of the following is the most likely diagnosis?", "choices": [{"letter": "A", "text": "Trichomoniasis"}, {"letter": "B", "text": "Rocky Mountain spotted fever"}, {"letter": "C", "text": "Giardiasis"}, {"letter": "D", "text": "Coccidioidomycosis"}, {"letter": "E", "text": "Lyme disease with erythema migrans"}], "correct": "B", "rationale": "A non-blanching petechial rash beginning at the wrists/ankles and spreading centrally (with later palm/sole involvement) after a tick bite is classic for RMSF (Rickettsia rickettsii).", "objective": "TFP 1", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "1A", "number": 1, "suffix": "A", "stem": "Which of the following is the treatment of choice for this condition, including in pregnant patients?", "choices": [{"letter": "A", "text": "Amoxicillin"}, {"letter": "B", "text": "Fluconazole"}, {"letter": "C", "text": "Praziquantel"}, {"letter": "D", "text": "Doxycycline"}, {"letter": "E", "text": "Metronidazole"}], "correct": "D", "rationale": "Doxycycline is the treatment of choice for RMSF for all patients, including pregnant women, and should be started empirically without waiting for confirmatory testing.", "objective": "TFP 1", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "2", "number": 2, "suffix": "", "stem": "A patient with high-grade non-Hodgkin lymphoma is treated with R-CHOP. The 'R' component adds which type of therapy to the CHOP backbone?", "choices": [{"letter": "A", "text": "A topoisomerase inhibitor"}, {"letter": "B", "text": "A monoclonal antibody (immunotherapy)"}, {"letter": "C", "text": "A platinum-based heavy-metal alkylator"}, {"letter": "D", "text": "An aromatase inhibitor"}, {"letter": "E", "text": "An intrathecal antimetabolite"}], "correct": "B", "rationale": "The 'R' in R-CHOP is rituximab, a monoclonal antibody (immunotherapy) added to cyclophosphamide, doxorubicin, vincristine, and prednisone.", "objective": "Onc 3", "section": "Oncology"}], [{"id": "3", "number": 3, "suffix": "", "stem": "A patient on chronic proton pump inhibitor therapy is started on oral itraconazole. Why might this combination reduce antifungal efficacy?", "choices": [{"letter": "A", "text": "PPIs block itraconazole entry into fungal cells"}, {"letter": "B", "text": "PPIs directly inactivate itraconazole in blood"}, {"letter": "C", "text": "PPIs speed renal clearance of itraconazole"}, {"letter": "D", "text": "Itraconazole binds the PPI and is excreted"}, {"letter": "E", "text": "Itraconazole needs an acidic gut to be absorbed"}], "correct": "E", "rationale": "Oral itraconazole requires an acidic environment and food for absorption; PPIs raise gastric pH and impair its absorption. Itraconazole can also cause a triad of hypertension, hypokalemia, and edema.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "4", "number": 4, "suffix": "", "stem": "A 65-year-old woman with small cell lung cancer is starting cisplatin. Which set of adverse effects is most characteristic of this heavy-metal agent?", "choices": [{"letter": "A", "text": "Hemorrhagic cystitis and secondary leukemia"}, {"letter": "B", "text": "Nephrotoxicity, severe nausea, and neuropathy"}, {"letter": "C", "text": "Irreversible cardiomyopathy and heart failure"}, {"letter": "D", "text": "Endometrial cancer and thromboembolism"}, {"letter": "E", "text": "Hand-foot syndrome and mucositis"}], "correct": "B", "rationale": "Cisplatin causes dose-related nephrotoxicity (requiring aggressive hydration), severe nausea/vomiting (requiring pre-medication), and peripheral neuropathy.", "objective": "Onc 1", "section": "Oncology"}, {"id": "4A", "number": 4, "suffix": "A", "stem": "Which class of antiemetic is most appropriate to give before and after this agent to prevent its severe nausea and vomiting?", "choices": [{"letter": "A", "text": "Bulk-forming laxatives"}, {"letter": "B", "text": "5-HT3 antagonists (e.g., ondansetron)"}, {"letter": "C", "text": "First-generation sedating antihistamines"}, {"letter": "D", "text": "Proton pump inhibitors"}, {"letter": "E", "text": "Topical anesthetic agents"}], "correct": "B", "rationale": "Cisplatin is highly emetogenic; 5-HT3 antagonists such as ondansetron are given prophylactically on treatment days and for 2-3 days afterward.", "objective": "Onc 1", "section": "Oncology"}], [{"id": "5", "number": 5, "suffix": "", "stem": "A patient treated with clarithromycin for pharyngitis is also on a statin and warfarin. Which property of this macrolide most drives its drug interactions?", "choices": [{"letter": "A", "text": "Irreversible platelet inhibition"}, {"letter": "B", "text": "Renal tubular secretion blockade"}, {"letter": "C", "text": "Strong CYP3A4 induction"}, {"letter": "D", "text": "Chelation with divalent cations"}, {"letter": "E", "text": "Potent CYP3A4 inhibition"}], "correct": "E", "rationale": "Clarithromycin is a potent CYP3A4 inhibitor, raising levels of statins (rhabdomyolysis risk), warfarin, and calcineurin inhibitors; macrolides also prolong the QT interval.", "objective": "ENT-AR 2", "section": "ENT"}], [{"id": "6", "number": 6, "suffix": "", "stem": "A patient coinfected with HIV and chronic hepatitis B is on a tenofovir/emtricitabine-containing regimen. Which counseling point is most important?", "choices": [{"letter": "A", "text": "Do not abruptly stop ART; it can flare hepatitis B"}, {"letter": "B", "text": "Stop ART immediately if any nausea or fatigue develops"}, {"letter": "C", "text": "Add ribavirin routinely to every ART regimen"}, {"letter": "D", "text": "Double the dose during any acute febrile illness"}, {"letter": "E", "text": "Avoid all routine vaccinations while on therapy"}], "correct": "A", "rationale": "Some ART agents (tenofovir, emtricitabine, lamivudine) also treat hepatitis B; abruptly stopping them in a coinfected patient can cause a hepatitis B flare and fulminant hepatic failure.", "objective": "HIV 3", "section": "HIV/Antiviral"}], [{"id": "7", "number": 7, "suffix": "", "stem": "A 40-year-old construction worker in Arizona has several weeks of cough, pleuritic chest pain, fatigue, arthralgias, and low-grade fever, with a chest x-ray showing an upper lobe infiltrate and hilar adenopathy. Which of the following is the most likely diagnosis?", "choices": [{"letter": "A", "text": "Cryptococcosis"}, {"letter": "B", "text": "Histoplasmosis"}, {"letter": "C", "text": "Coccidioidomycosis"}, {"letter": "D", "text": "Blastomycosis"}, {"letter": "E", "text": "Candidemia"}], "correct": "C", "rationale": "Pulmonary disease with arthralgias in a patient from the desert Southwest (Arizona/California) exposed to dust is classic for coccidioidomycosis ('Valley fever').", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "7A", "number": 7, "suffix": "A", "stem": "For symptomatic pulmonary disease from this organism, which agent is the preferred oral azole?", "choices": [{"letter": "A", "text": "Flucytosine"}, {"letter": "B", "text": "Albendazole"}, {"letter": "C", "text": "Fluconazole"}, {"letter": "D", "text": "Metronidazole"}, {"letter": "E", "text": "Nystatin"}], "correct": "C", "rationale": "Fluconazole is a preferred agent for coccidioidomycosis; amphotericin B is added first for severe disease.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "8", "number": 8, "suffix": "", "stem": "A woman with HER2-positive breast cancer is treated with trastuzumab. Which toxicity requires monitoring, especially when this drug is combined with an anthracycline?", "choices": [{"letter": "A", "text": "Peripheral neuropathy"}, {"letter": "B", "text": "Cardiomyopathy"}, {"letter": "C", "text": "Nephrotoxicity"}, {"letter": "D", "text": "Hemorrhagic cystitis"}, {"letter": "E", "text": "Endometrial cancer"}], "correct": "B", "rationale": "Trastuzumab (anti-HER2 monoclonal antibody) can cause cardiomyopathy, and this risk increases when combined with anthracyclines; cardiac function is monitored, including for up to 2 years after treatment.", "objective": "Onc 1", "section": "Oncology"}], [{"id": "9", "number": 9, "suffix": "", "stem": "Which set of metabolic adverse effects is most characteristic of the protease inhibitor class?", "choices": [{"letter": "A", "text": "Hyperglycemia and dyslipidemia"}, {"letter": "B", "text": "Hyperkalemia and hyperphosphatemia"}, {"letter": "C", "text": "Hypoglycemia and hypolipidemia"}, {"letter": "D", "text": "Hypophosphatemia and glycosuria"}, {"letter": "E", "text": "Hemolytic anemia and neutropenia"}], "correct": "A", "rationale": "Protease inhibitors are associated with hyperglycemia/diabetes, hypertriglyceridemia, hypercholesterolemia, and fat redistribution.", "objective": "HIV 1", "section": "HIV/Antiviral"}], [{"id": "10", "number": 10, "suffix": "", "stem": "A patient about to start an azole antifungal is also taking a statin. Which interaction is the basis for the recommendation to hold the statin?", "choices": [{"letter": "A", "text": "Azoles and statins together cause hemolysis"}, {"letter": "B", "text": "Azoles inactivate statins, raising cholesterol"}, {"letter": "C", "text": "Azoles reduce statin absorption, causing treatment failure"}, {"letter": "D", "text": "Azoles increase statin levels, risking rhabdomyolysis"}, {"letter": "E", "text": "Azoles and statins together cause tendon rupture"}], "correct": "D", "rationale": "Azoles inhibit CYP450, raising statin levels and the risk of rhabdomyolysis; azoles are also hepatotoxic and can prolong the QT interval.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "11", "number": 11, "suffix": "", "stem": "A patient treated for pharyngitis with clindamycin returns with several days of severe, watery diarrhea, crampy abdominal pain, and low-grade fever. Which complication is most likely?", "choices": [{"letter": "A", "text": "Serotonin syndrome"}, {"letter": "B", "text": "Cholestatic jaundice with dark urine"}, {"letter": "C", "text": "Rhinitis medicamentosa"}, {"letter": "D", "text": "Clostridioides difficile colitis"}, {"letter": "E", "text": "Achilles tendon rupture"}], "correct": "D", "rationale": "Clindamycin carries the highest C. difficile risk among pharyngitis antibiotics; new severe diarrhea should prompt evaluation for C. difficile colitis.", "objective": "ENT-AR 2", "section": "ENT"}], [{"id": "12", "number": 12, "suffix": "", "stem": "A 7-year-old boy with a recent sinus infection presents with fever, eyelid swelling, and redness. On exam he has pain and restriction with extraocular movements, proptosis, and diplopia. Which of the following is the most likely diagnosis?", "choices": [{"letter": "A", "text": "Orbital cellulitis"}, {"letter": "B", "text": "Chalazion"}, {"letter": "C", "text": "Preseptal (periorbital) cellulitis"}, {"letter": "D", "text": "Allergic conjunctivitis"}, {"letter": "E", "text": "Hordeolum"}], "correct": "A", "rationale": "Pain and restriction of eye movements, proptosis, and diplopia distinguish orbital cellulitis (often from ethmoid sinusitis) from preseptal cellulitis, which lacks these findings.", "objective": "Ophtho 8", "section": "Ophthalmology"}, {"id": "12A", "number": 12, "suffix": "A", "stem": "Which of the following is the most appropriate treatment approach for this patient?", "choices": [{"letter": "A", "text": "Admit for IV vancomycin and ceftriaxone"}, {"letter": "B", "text": "Outpatient oral amoxicillin-clavulanate"}, {"letter": "C", "text": "Topical erythromycin ophthalmic ointment"}, {"letter": "D", "text": "Oral cephalexin at home for ten days"}, {"letter": "E", "text": "Artificial tears and warm compresses"}], "correct": "A", "rationale": "Orbital cellulitis requires admission and IV antibiotics covering S. aureus/MRSA, streptococci, and gram-negatives (e.g., vancomycin plus ampicillin-sulbactam, piperacillin-tazobactam, or ceftriaxone; add metronidazole for intracranial/anaerobic concern).", "objective": "Ophtho 10", "section": "Ophthalmology"}, {"id": "12B", "number": 12, "suffix": "B", "stem": "A different 9-year-old child has eyelid swelling and redness after a URI but NO pain with eye movements, NO proptosis, and full motility. Which treatment is most appropriate for this presentation?", "choices": [{"letter": "A", "text": "Oral acyclovir"}, {"letter": "B", "text": "Topical prednisolone drops"}, {"letter": "C", "text": "Admission for IV vancomycin and piperacillin-tazobactam"}, {"letter": "D", "text": "Intravitreal anti-VEGF injection"}, {"letter": "E", "text": "Oral amoxicillin-clavulanate as an outpatient"}], "correct": "E", "rationale": "Preseptal cellulitis without orbital signs is treated with oral antibiotics such as amoxicillin-clavulanate; MRSA coverage (e.g., TMP-SMX) is added when skin trauma is present or there is no improvement.", "objective": "Ophtho 9", "section": "Ophthalmology"}], [{"id": "13", "number": 13, "suffix": "", "stem": "A 62-year-old man with poorly controlled hypertension asks about an oral decongestant for nasal congestion. Which adverse effect is the most significant concern with an alpha-adrenergic agonist decongestant?", "choices": [{"letter": "A", "text": "Tendon rupture"}, {"letter": "B", "text": "Cholestatic jaundice"}, {"letter": "C", "text": "Photosensitivity rash"}, {"letter": "D", "text": "Elevated blood pressure"}, {"letter": "E", "text": "Excessive sedation"}], "correct": "D", "rationale": "Alpha-adrenergic agonists such as phenylephrine cause dose-dependent vasoconstriction and can worsen hypertension; they should be avoided or used with caution in cardiovascular disease and with MAOIs.", "objective": "ENT-AR 2", "section": "ENT"}], [{"id": "14", "number": 14, "suffix": "", "stem": "A patient with lung cancer treated with cisplatin plus etoposide returns with pancytopenia. Which agent is most responsible for the severe myelosuppression?", "choices": [{"letter": "A", "text": "Dexamethasone"}, {"letter": "B", "text": "Ondansetron"}, {"letter": "C", "text": "Etoposide"}, {"letter": "D", "text": "Leucovorin"}, {"letter": "E", "text": "Filgrastim"}], "correct": "C", "rationale": "Etoposide, a topoisomerase inhibitor, characteristically causes severe myelosuppression.", "objective": "Onc 1", "section": "Oncology"}], [{"id": "15", "number": 15, "suffix": "", "stem": "A patient is started on dolutegravir, an integrase strand transfer inhibitor. What is the mechanism of action of this class?", "choices": [{"letter": "A", "text": "Blocks fusion of the virus with the cell"}, {"letter": "B", "text": "Blocks the CCR5 coreceptor on the cell"}, {"letter": "C", "text": "Blocks the protease that matures viral proteins"}, {"letter": "D", "text": "Blocks reverse transcriptase noncompetitively"}, {"letter": "E", "text": "Blocks integration of proviral DNA into host DNA"}], "correct": "E", "rationale": "INSTIs (e.g., dolutegravir, bictegravir) inhibit insertion of proviral DNA into the host genome; they are generally well tolerated, with nausea/diarrhea most common.", "objective": "HIV 1", "section": "HIV/Antiviral"}, {"id": "15A", "number": 15, "suffix": "A", "stem": "Which co-administered product reduces absorption of this class through chelation and should be separated in timing?", "choices": [{"letter": "A", "text": "Topical emollients for dry skin"}, {"letter": "B", "text": "Oral rehydration solutions"}, {"letter": "C", "text": "Acetaminophen taken for fever"}, {"letter": "D", "text": "Antacids and cation-containing supplements"}, {"letter": "E", "text": "Inhaled corticosteroids taken daily for asthma"}], "correct": "D", "rationale": "INSTIs have decreased absorption when taken with antacids and polyvalent cations (iron, calcium, multivitamins) due to chelation; dosing should be separated.", "objective": "HIV 1", "section": "HIV/Antiviral"}], [{"id": "16", "number": 16, "suffix": "", "stem": "A 38-year-old woman with newly diagnosed diabetes has vulvar itching, burning, and a thick, white, curd-like vaginal discharge with vulvar erythema. Which oral agent is appropriate for uncomplicated vaginal candidiasis?", "choices": [{"letter": "A", "text": "Metronidazole"}, {"letter": "B", "text": "Albendazole"}, {"letter": "C", "text": "Amphotericin B"}, {"letter": "D", "text": "Doxycycline"}, {"letter": "E", "text": "Fluconazole"}], "correct": "E", "rationale": "Uncomplicated vaginal candidiasis can be treated with a single oral dose of fluconazole (or topical azoles).", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "17", "number": 17, "suffix": "", "stem": "A 25-year-old man presents with 2 days of redness and thick, purulent discharge in the left eye that started overnight and mats the lids shut; it is now spreading to the right eye. He does not wear contact lenses. Visual acuity is normal and there is no preauricular node. Which of the following is the most appropriate treatment?", "choices": [{"letter": "A", "text": "Warm compresses alone with no medication"}, {"letter": "B", "text": "Topical latanoprost"}, {"letter": "C", "text": "Topical prednisolone"}, {"letter": "D", "text": "Topical erythromycin ophthalmic ointment"}, {"letter": "E", "text": "Oral acyclovir"}], "correct": "D", "rationale": "Bacterial conjunctivitis in a non-contact-lens wearer is treated with a topical antibiotic such as erythromycin ointment or trimethoprim/polymyxin B drops.", "objective": "Ophtho 3", "section": "Ophthalmology"}], [{"id": "18", "number": 18, "suffix": "", "stem": "An 18-month-old with a positive influenza test and symptom onset this morning needs antiviral therapy. Which oral neuraminidase inhibitor is most appropriate?", "choices": [{"letter": "A", "text": "Zanamivir"}, {"letter": "B", "text": "Ribavirin"}, {"letter": "C", "text": "Amantadine"}, {"letter": "D", "text": "Oseltamivir"}, {"letter": "E", "text": "Remdesivir"}], "correct": "D", "rationale": "Oseltamivir is an oral neuraminidase inhibitor effective against influenza A and B and appropriate for young children; it blocks release of new virions from infected cells.", "objective": "HIV 4", "section": "HIV/Antiviral"}, {"id": "18A", "number": 18, "suffix": "A", "stem": "Which neuraminidase inhibitor is inhaled and therefore best avoided in patients with reactive airway disease?", "choices": [{"letter": "A", "text": "Peramivir"}, {"letter": "B", "text": "Remdesivir"}, {"letter": "C", "text": "Zanamivir"}, {"letter": "D", "text": "Oseltamivir"}, {"letter": "E", "text": "Baloxavir"}], "correct": "C", "rationale": "Zanamivir is inhaled and can cause bronchospasm/respiratory irritation, so it is avoided in asthma/COPD; peramivir is IV and oseltamivir is oral.", "objective": "HIV 4", "section": "HIV/Antiviral"}], [{"id": "19", "number": 19, "suffix": "", "stem": "A 40-year-old truck driver needs an oral antihistamine for allergic rhinitis but cannot be drowsy on the job. Which agent is the best choice?", "choices": [{"letter": "A", "text": "Diphenhydramine"}, {"letter": "B", "text": "Chlorpheniramine"}, {"letter": "C", "text": "Loratadine"}, {"letter": "D", "text": "Promethazine"}, {"letter": "E", "text": "Hydroxyzine"}], "correct": "C", "rationale": "Second-generation antihistamines such as loratadine are peripherally selective, polar molecules that do not readily cross the blood-brain barrier, so they are non-sedating and preferred when alertness is required.", "objective": "ENT-AR 2", "section": "ENT"}], [{"id": "20", "number": 20, "suffix": "", "stem": "A 26-year-old woman with HIV and a CD4 count below 100 has three months of progressively worsening headache and lethargy. CSF studies are positive on India ink stain and cryptococcal antigen. Which of the following is the most likely diagnosis?", "choices": [{"letter": "A", "text": "Trichomoniasis"}, {"letter": "B", "text": "Giardiasis"}, {"letter": "C", "text": "Coccidioidomycosis"}, {"letter": "D", "text": "Cryptococcosis"}, {"letter": "E", "text": "Histoplasmosis"}], "correct": "D", "rationale": "A chronic meningitis in an HIV patient with CD4 <100, positive India ink stain, and cryptococcal antigen is cryptococcosis.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "20A", "number": 20, "suffix": "A", "stem": "Which combination is used for induction treatment of this condition?", "choices": [{"letter": "A", "text": "Fluconazole plus metronidazole"}, {"letter": "B", "text": "Amphotericin B plus flucytosine"}, {"letter": "C", "text": "Nystatin plus doxycycline"}, {"letter": "D", "text": "Itraconazole plus albendazole"}, {"letter": "E", "text": "Praziquantel plus ivermectin"}], "correct": "B", "rationale": "Cryptococcal meningitis is treated with induction amphotericin B plus flucytosine; fluconazole is used for consolidation/maintenance and prophylaxis.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "21", "number": 21, "suffix": "", "stem": "A 45-year-old woman being treated for breast cancer develops progressive dyspnea, fatigue, and lower-extremity edema; an echocardiogram shows a reduced left ventricular ejection fraction. Which chemotherapy agent in her regimen is the most likely cause?", "choices": [{"letter": "A", "text": "5-Fluorouracil"}, {"letter": "B", "text": "Cyclophosphamide"}, {"letter": "C", "text": "Tamoxifen"}, {"letter": "D", "text": "Epirubicin"}, {"letter": "E", "text": "Docetaxel"}], "correct": "D", "rationale": "Anthracyclines/anti-tumor antibiotics such as epirubicin and doxorubicin cause dose-dependent, often irreversible cardiotoxicity; LVEF is monitored with ECHO before, during, and after therapy.", "objective": "Onc 1", "section": "Oncology"}, {"id": "21A", "number": 21, "suffix": "A", "stem": "Which monitoring is most important during treatment with this class of agent?", "choices": [{"letter": "A", "text": "Serial echocardiograms to assess LVEF"}, {"letter": "B", "text": "Frequent bone density scanning"}, {"letter": "C", "text": "Routine pulmonary function spirometry"}, {"letter": "D", "text": "Weekly visual acuity testing"}, {"letter": "E", "text": "Serum G6PD activity monitoring"}], "correct": "A", "rationale": "Because anthracyclines cause cardiotoxicity, serial ECHO/LVEF assessment is essential; the toxicity can be irreversible.", "objective": "Onc 2", "section": "Oncology"}], [{"id": "22", "number": 22, "suffix": "", "stem": "A 30-year-old man who hikes frequently presents with fever, headache, myalgias, and an expanding erythematous rash with central clearing (a bull's-eye lesion) on his thigh that developed a week after a wooded-area hike. Which of the following is the most appropriate treatment?", "choices": [{"letter": "A", "text": "Fluconazole"}, {"letter": "B", "text": "Doxycycline"}, {"letter": "C", "text": "Amphotericin B"}, {"letter": "D", "text": "Metronidazole"}, {"letter": "E", "text": "Albendazole"}], "correct": "B", "rationale": "Erythema migrans (bull's-eye rash) after tick exposure is early Lyme disease (Borrelia burgdorferi); doxycycline is first-line, and treatment is on clinical grounds without waiting for serology.", "objective": "TFP 1", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "22A", "number": 22, "suffix": "A", "stem": "The patient asks whether serologic testing is needed before starting therapy. What is the best response?", "choices": [{"letter": "A", "text": "A fungal culture is required before treating"}, {"letter": "B", "text": "Blood cultures must be positive before treating"}, {"letter": "C", "text": "Wait for confirmatory serology before any therapy"}, {"letter": "D", "text": "Treat clinically; early serology is often negative"}, {"letter": "E", "text": "Treatment should be delayed until IgG appears"}], "correct": "D", "rationale": "Early Lyme disease is a clinical diagnosis in an endemic area; serology is frequently negative at presentation, so treatment should not wait for it.", "objective": "TFP 1", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "22B", "number": 22, "suffix": "B", "stem": "If this patient were pregnant, which alternative agent would be most appropriate?", "choices": [{"letter": "A", "text": "Ivermectin"}, {"letter": "B", "text": "Doxycycline"}, {"letter": "C", "text": "Ciprofloxacin"}, {"letter": "D", "text": "Itraconazole"}, {"letter": "E", "text": "Amoxicillin"}], "correct": "E", "rationale": "Amoxicillin is the preferred alternative for Lyme disease in pregnancy, when doxycycline is generally avoided.", "objective": "TFP 1", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "23", "number": 23, "suffix": "", "stem": "Two nucleoside reverse transcriptase inhibitors form the 'backbone' of most initial ART regimens. At which step of the HIV life cycle do NRTIs act?", "choices": [{"letter": "A", "text": "Cleavage of the viral polyprotein"}, {"letter": "B", "text": "Reverse transcription (formation of viral DNA)"}, {"letter": "C", "text": "Release of new virions from the cell"}, {"letter": "D", "text": "Attachment of virus to the CD4 receptor"}, {"letter": "E", "text": "Integration of the viral DNA into the host genome"}], "correct": "B", "rationale": "NRTIs inhibit HIV reverse transcriptase, preventing formation/elongation of viral DNA; two NRTIs form the backbone of most regimens.", "objective": "HIV 1", "section": "HIV/Antiviral"}], [{"id": "24", "number": 24, "suffix": "", "stem": "A 22-year-old woman who wears soft contact lenses develops a red eye with purulent discharge. Because of her contact lens use, coverage of Pseudomonas aeruginosa is required. Which topical agent is most appropriate?", "choices": [{"letter": "A", "text": "Trifluridine drops"}, {"letter": "B", "text": "Erythromycin ophthalmic ointment"}, {"letter": "C", "text": "Sulfacetamide drops"}, {"letter": "D", "text": "Ciprofloxacin ophthalmic drops"}, {"letter": "E", "text": "Bacitracin ophthalmic ointment"}], "correct": "D", "rationale": "Contact-lens wearers need antipseudomonal coverage; a topical fluoroquinolone (e.g., ciprofloxacin, ofloxacin) or an aminoglycoside such as gentamicin is preferred.", "objective": "Ophtho 3", "section": "Ophthalmology"}], [{"id": "25", "number": 25, "suffix": "", "stem": "A 35-year-old man has used a topical nasal decongestant spray every day for 2 weeks and now reports worsening congestion whenever it wears off. Which agent and complication does this describe?", "choices": [{"letter": "A", "text": "Loratadine causing anticholinergic effects"}, {"letter": "B", "text": "Fluticasone causing septal perforation"}, {"letter": "C", "text": "Azelastine causing paradoxical bronchospasm"}, {"letter": "D", "text": "Oxymetazoline causing rebound congestion"}, {"letter": "E", "text": "Montelukast causing neuropsychiatric events"}], "correct": "D", "rationale": "Topical oxymetazoline (Afrin) should be limited to no more than 3 days; prolonged use causes rebound nasal congestion (rhinitis medicamentosa).", "objective": "ENT-AR 2", "section": "ENT"}], [{"id": "26", "number": 26, "suffix": "", "stem": "A patient receiving cyclophosphamide as part of a lymphoma regimen is counseled on preventing a characteristic bladder toxicity. Which intervention is most important?", "choices": [{"letter": "A", "text": "Premedicate with an antihistamine"}, {"letter": "B", "text": "Take a daily calcium supplement"}, {"letter": "C", "text": "Maintain aggressive hydration"}, {"letter": "D", "text": "Check G6PD before each dose"}, {"letter": "E", "text": "Avoid all sun exposure"}], "correct": "C", "rationale": "Cyclophosphamide (an alkylating agent) can cause hemorrhagic cystitis; adequate hydration is key to prevention. Bone marrow suppression is its dose-limiting toxicity.", "objective": "Onc 1", "section": "Oncology"}], [{"id": "27", "number": 27, "suffix": "", "stem": "A 56-year-old man has a macrocytic anemia and progressive numbness of the fingers and toes with memory difficulty. Serum B12 is low with elevated methylmalonic acid. Because of significant neurologic symptoms, which treatment approach is most appropriate initially?", "choices": [{"letter": "A", "text": "Intravenous cyanocobalamin"}, {"letter": "B", "text": "Oral ferrous sulfate"}, {"letter": "C", "text": "Oral folic acid"}, {"letter": "D", "text": "Subcutaneous darbepoetin"}, {"letter": "E", "text": "Intramuscular cyanocobalamin"}], "correct": "E", "rationale": "Patients with significant neurologic symptoms from B12 deficiency should be treated initially with IM cyanocobalamin; B12 is not given IV (it is largely excreted in urine).", "objective": "Anemia 1", "section": "Anemia"}, {"id": "27A", "number": 27, "suffix": "A", "stem": "His deficiency is due to pernicious anemia. What does this imply about the duration of therapy?", "choices": [{"letter": "A", "text": "No treatment is needed if diet improves"}, {"letter": "B", "text": "Therapy can stop once the anemia resolves"}, {"letter": "C", "text": "A single injection is curative"}, {"letter": "D", "text": "Lifelong supplementation is required"}, {"letter": "E", "text": "Only a 2-week course is needed"}], "correct": "D", "rationale": "Pernicious anemia is not reversible, so lifelong B12 supplementation (oral or IM) is required.", "objective": "Anemia 1", "section": "Anemia"}], [{"id": "28", "number": 28, "suffix": "", "stem": "A 38-year-old gardener from Tennessee has ulcerated, crusted skin plaques with raised borders, plus fatigue, weight loss, and low-grade fever. Blastomycosis is diagnosed. Which of the following is appropriate treatment for moderate disease?", "choices": [{"letter": "A", "text": "Metronidazole"}, {"letter": "B", "text": "Pyrantel pamoate"}, {"letter": "C", "text": "Ivermectin"}, {"letter": "D", "text": "Doxycycline"}, {"letter": "E", "text": "Itraconazole"}], "correct": "E", "rationale": "Itraconazole is used for blastomycosis (amphotericin B is added for severe disease), similar to other endemic molds.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "29", "number": 29, "suffix": "", "stem": "A patient with stage III colon cancer is treated with FOLFOX (folinic acid, 5-fluorouracil, and oxaliplatin). What is the role of the folinic acid (leucovorin) in this regimen?", "choices": [{"letter": "A", "text": "It stimulates neutrophil recovery"}, {"letter": "B", "text": "It prevents hemorrhagic cystitis"}, {"letter": "C", "text": "It reverses anthracycline cardiotoxicity"}, {"letter": "D", "text": "It prevents cisplatin nephrotoxicity"}, {"letter": "E", "text": "It increases the efficacy of 5-fluorouracil"}], "correct": "E", "rationale": "In FOLFOX, folinic acid (leucovorin) acts as a modulating agent that enhances the efficacy of 5-FU (a different role than its rescue function with methotrexate).", "objective": "Onc 3", "section": "Oncology"}], [{"id": "30", "number": 30, "suffix": "", "stem": "A 32-year-old man is newly diagnosed with HIV on routine screening. He is asymptomatic with a CD4 count of 450 cells/mm3 and viral load of 75,000 copies/mL, and genotype shows no resistance. According to current guidelines, when should antiretroviral therapy be started?", "choices": [{"letter": "A", "text": "Only once the CD4 count falls below 200"}, {"letter": "B", "text": "Immediately, regardless of CD4 count"}, {"letter": "C", "text": "Only after an AIDS-defining illness occurs"}, {"letter": "D", "text": "Only once the CD4 count falls below 350"}, {"letter": "E", "text": "Only if the viral load exceeds 100,000"}], "correct": "B", "rationale": "ART should be started as soon as possible after diagnosis regardless of CD4 count, and continued indefinitely to prevent viral rebound.", "objective": "HIV 3", "section": "HIV/Antiviral"}], [{"id": "31", "number": 31, "suffix": "", "stem": "A 15-year-old girl presents with a 3-day history of a painful, red, tender swelling near the base of the lashes on her left lower lid. Visual acuity is 20/20, extraocular movements are full, and there is no proptosis. The lesion points toward the lid margin. Which of the following is the most appropriate initial management?", "choices": [{"letter": "A", "text": "Urgent IV vancomycin and admission"}, {"letter": "B", "text": "Warm compresses several times daily"}, {"letter": "C", "text": "Topical prednisolone acetate drops"}, {"letter": "D", "text": "Topical cyclosporine twice daily"}, {"letter": "E", "text": "Oral doxycycline for two weeks"}], "correct": "B", "rationale": "An acute hordeolum (stye), usually S. aureus, is managed first with warm compresses to promote drainage; a topical antibiotic can be added, and I&D is reserved for lesions that do not resolve.", "objective": "Ophtho 2", "section": "Ophthalmology"}], [{"id": "32", "number": 32, "suffix": "", "stem": "A 30-year-old woman is prescribed doxycycline for sinusitis. Which counseling point about adverse effects is most appropriate?", "choices": [{"letter": "A", "text": "Anticipate marked daytime drowsiness"}, {"letter": "B", "text": "Take it with an antacid to reduce upset"}, {"letter": "C", "text": "Use sunscreen because of photosensitivity"}, {"letter": "D", "text": "Expect harmless red discoloration of stool"}, {"letter": "E", "text": "Watch for rebound nasal congestion"}], "correct": "C", "rationale": "Doxycycline causes phototoxicity, so sun protection is advised. It should be taken with water while upright to avoid esophageal irritation, and antacids/dairy/iron reduce its absorption.", "objective": "ENT-Sinus 3", "section": "ENT"}], [{"id": "33", "number": 33, "suffix": "", "stem": "A patient with metastatic NSCLC on pembrolizumab, an immune checkpoint inhibitor, returns with new pericarditis, hypothyroidism, and worsening renal function. Which mechanism explains these varied toxicities?", "choices": [{"letter": "A", "text": "Estrogen-agonist stimulation of tissues"}, {"letter": "B", "text": "Direct nephrotoxic damage from platinum"}, {"letter": "C", "text": "Anthracycline-induced free-radical injury"}, {"letter": "D", "text": "Alkylating-agent bladder mucosal injury"}, {"letter": "E", "text": "Unchecked autoimmune attack on normal tissues"}], "correct": "E", "rationale": "Checkpoint inhibitors (e.g., pembrolizumab, a PD-1 inhibitor) release immune regulation, causing immune-related adverse events across many organs (endocrine, cardiac, GI, renal, pulmonary, skin); severe cases are treated with corticosteroids.", "objective": "Onc 1", "section": "Oncology"}, {"id": "33A", "number": 33, "suffix": "A", "stem": "Which treatment is used for severe immune-related adverse events from this class?", "choices": [{"letter": "A", "text": "Mesna"}, {"letter": "B", "text": "Filgrastim"}, {"letter": "C", "text": "Allopurinol"}, {"letter": "D", "text": "Leucovorin"}, {"letter": "E", "text": "Corticosteroids"}], "correct": "E", "rationale": "Severe immune-related adverse events are treated promptly with corticosteroids to suppress the autoimmune response.", "objective": "Onc 2", "section": "Oncology"}], [{"id": "34", "number": 34, "suffix": "", "stem": "A 7-year-old recent immigrant presents with abdominal pain and vomiting; his mother saved a ~6 cm reddish-brown worm from his emesis, and imaging shows small-bowel obstruction. This is classic ascariasis. Which drug class is first-line?", "choices": [{"letter": "A", "text": "Tetracyclines (doxycycline)"}, {"letter": "B", "text": "Nitroimidazoles (metronidazole/tinidazole)"}, {"letter": "C", "text": "Macrolides (azithromycin)"}, {"letter": "D", "text": "Benzimidazoles (albendazole/mebendazole)"}, {"letter": "E", "text": "Echinocandins (caspofungin)"}], "correct": "D", "rationale": "Roundworm (Ascaris) is treated with a benzimidazole such as albendazole or mebendazole.", "objective": "TFP 3", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "35", "number": 35, "suffix": "", "stem": "A young woman may receive ribavirin. Which black box warnings must be discussed before starting this agent?", "choices": [{"letter": "A", "text": "Hepatic steatosis and lactic acidosis"}, {"letter": "B", "text": "Nephrotoxicity and ototoxicity"}, {"letter": "C", "text": "Hemolytic anemia and teratogenicity"}, {"letter": "D", "text": "QT prolongation and torsades"}, {"letter": "E", "text": "Tendon rupture and neuropathy"}], "correct": "C", "rationale": "Ribavirin carries black box warnings for hemolytic anemia and teratogenicity; it is used for severe RSV in select children and (historically) chronic hepatitis C.", "objective": "HIV 4", "section": "HIV/Antiviral"}], [{"id": "36", "number": 36, "suffix": "", "stem": "A 34-year-old woman with heavy menstrual periods has fatigue, pica (chewing ice), pale conjunctivae, and spooning of the nails. Labs show a microcytic anemia with low ferritin. She has no GI intolerance and can take oral medication. Which of the following is the most appropriate first-line therapy?", "choices": [{"letter": "A", "text": "Intravenous iron sucrose"}, {"letter": "B", "text": "Oral folic acid"}, {"letter": "C", "text": "Intramuscular cyanocobalamin"}, {"letter": "D", "text": "Oral ferrous sulfate"}, {"letter": "E", "text": "Subcutaneous darbepoetin"}], "correct": "D", "rationale": "Oral iron salts (ferrous sulfate) are the first-line, inexpensive, effective treatment for iron deficiency anemia when tolerated.", "objective": "Anemia 1", "section": "Anemia"}, {"id": "36A", "number": 36, "suffix": "A", "stem": "Which counseling point maximizes absorption of this therapy?", "choices": [{"letter": "A", "text": "Take it together with milk, an antacid, or coffee"}, {"letter": "B", "text": "Always take it with a calcium supplement"}, {"letter": "C", "text": "Take it with coffee to reduce nausea"}, {"letter": "D", "text": "Take it right after a high-dairy meal"}, {"letter": "E", "text": "Take on an empty stomach, optionally with vitamin C"}], "correct": "E", "rationale": "Oral iron is best absorbed on an empty stomach; ascorbic acid (vitamin C) may enhance absorption, while dairy, calcium, antacids, PPIs, coffee, and tea reduce it.", "objective": "Anemia 1", "section": "Anemia"}, {"id": "36B", "number": 36, "suffix": "B", "stem": "The patient should be reassured about which expected, benign adverse effect?", "choices": [{"letter": "A", "text": "Orange discoloration of body fluids"}, {"letter": "B", "text": "Permanent gray staining of the teeth"}, {"letter": "C", "text": "Bright red blood streaking the stool"}, {"letter": "D", "text": "Dark/black discoloration of the stool"}, {"letter": "E", "text": "Blue-gray discoloration of the skin"}], "correct": "D", "rationale": "Oral iron commonly causes harmless black stools; importantly, fecal occult blood testing remains negative unless there is true GI bleeding.", "objective": "Anemia 1", "section": "Anemia"}], [{"id": "37", "number": 37, "suffix": "", "stem": "A 66-year-old man is diagnosed with primary open-angle glaucoma and elevated intraocular pressure. His clinician wants to start the preferred first-line topical agent that lowers IOP by increasing aqueous outflow, dosed once nightly. Which agent is most appropriate?", "choices": [{"letter": "A", "text": "Acetazolamide"}, {"letter": "B", "text": "Pilocarpine"}, {"letter": "C", "text": "Brimonidine"}, {"letter": "D", "text": "Timolol"}, {"letter": "E", "text": "Latanoprost"}], "correct": "E", "rationale": "Prostaglandin analogs such as latanoprost are preferred first-line for POAG; they increase uveoscleral aqueous outflow and are dosed once at bedtime.", "objective": "Ophtho 11", "section": "Ophthalmology"}, {"id": "37A", "number": 37, "suffix": "A", "stem": "Which adverse effect should this patient be counseled about with this agent?", "choices": [{"letter": "A", "text": "Bronchospasm and symptomatic bradycardia"}, {"letter": "B", "text": "Cinchonism with tinnitus and vertigo"}, {"letter": "C", "text": "Iris darkening and eyelash lengthening"}, {"letter": "D", "text": "Rebound congestion with chronic use"}, {"letter": "E", "text": "Systemic hypokalemia and weakness"}], "correct": "C", "rationale": "Prostaglandin analogs cause brown iris pigmentation, periocular skin darkening, and eyelash growth, along with conjunctival hyperemia.", "objective": "Ophtho 11", "section": "Ophthalmology"}], [{"id": "38", "number": 38, "suffix": "", "stem": "For which patient is doxycycline the LEAST appropriate choice for bacterial sinusitis?", "choices": [{"letter": "A", "text": "A 50-year-old with type 2 diabetes"}, {"letter": "B", "text": "A 25-year-old woman with mild asthma"}, {"letter": "C", "text": "A woman who is pregnant"}, {"letter": "D", "text": "A 35-year-old with seasonal allergies"}, {"letter": "E", "text": "A 40-year-old man with hypertension"}], "correct": "C", "rationale": "Doxycycline is contraindicated in pregnancy and in children under 8 because tetracyclines deposit in developing bone and teeth and cross the placenta.", "objective": "ENT-Sinus 3", "section": "ENT"}], [{"id": "39", "number": 39, "suffix": "", "stem": "A 75-year-old man with metastatic prostate cancer is started on leuprolide. In the first weeks of therapy, which effect should be anticipated?", "choices": [{"letter": "A", "text": "Transient tumor flare from a hormone surge"}, {"letter": "B", "text": "Immediate and irreversible cardiomyopathy"}, {"letter": "C", "text": "Rapid tumor lysis with hyperkalemia"}, {"letter": "D", "text": "Acute hemorrhagic cystitis"}, {"letter": "E", "text": "Severe hand-foot desquamation"}], "correct": "A", "rationale": "GnRH agonists such as leuprolide initially stimulate the pituitary, causing a temporary surge and possible tumor flare before hormone levels fall; other effects include hot flashes and reduced bone density.", "objective": "Onc 1", "section": "Oncology"}, {"id": "39A", "number": 39, "suffix": "A", "stem": "Because of reduced bone mineral density with this therapy, what supplementation should be started?", "choices": [{"letter": "A", "text": "Folic acid and vitamin B12"}, {"letter": "B", "text": "Potassium and magnesium"}, {"letter": "C", "text": "Calcium and vitamin D"}, {"letter": "D", "text": "Iron and vitamin C supplements"}, {"letter": "E", "text": "Zinc and selenium tablets"}], "correct": "C", "rationale": "Patients on androgen-deprivation therapy should receive calcium and vitamin D to help prevent osteoporosis and fractures.", "objective": "Onc 1", "section": "Oncology"}], [{"id": "40", "number": 40, "suffix": "", "stem": "A 2-year-old with fever, ear tugging, and irritability has a bulging, erythematous, immobile tympanic membrane. She has not taken antibiotics recently and has no drug allergies. Which of the following is the recommended first-line therapy?", "choices": [{"letter": "A", "text": "Oral levofloxacin"}, {"letter": "B", "text": "Topical ciprofloxacin drops"}, {"letter": "C", "text": "Oral azithromycin"}, {"letter": "D", "text": "Oral doxycycline"}, {"letter": "E", "text": "High-dose amoxicillin"}], "correct": "E", "rationale": "High-dose amoxicillin (80-90 mg/kg/day) is first-line for acute otitis media; amoxicillin-clavulanate is used when there was recent amoxicillin use or prior treatment failure.", "objective": "ENT-Otitis 2", "section": "ENT"}, {"id": "40A", "number": 40, "suffix": "A", "stem": "If she had taken amoxicillin within the past month, which regimen would be preferred to overcome likely resistance?", "choices": [{"letter": "A", "text": "Amoxicillin-clavulanate"}, {"letter": "B", "text": "Oral clindamycin"}, {"letter": "C", "text": "Plain amoxicillin at a lower dose"}, {"letter": "D", "text": "Oral doxycycline"}, {"letter": "E", "text": "Topical ofloxacin drops"}], "correct": "A", "rationale": "Recent amoxicillin exposure or treatment failure favors amoxicillin-clavulanate, which covers beta-lactamase-producing H. influenzae and M. catarrhalis.", "objective": "ENT-Otitis 2", "section": "ENT"}], [{"id": "41", "number": 41, "suffix": "", "stem": "A patient starting antiretroviral therapy asks what the main goal of treatment is. Which of the following best describes the primary goal of ART?", "choices": [{"letter": "A", "text": "Achieve sustained virologic suppression"}, {"letter": "B", "text": "Normalize the CD4 count within one week"}, {"letter": "C", "text": "Completely eradicate HIV from the body"}, {"letter": "D", "text": "Stop therapy once symptoms resolve"}, {"letter": "E", "text": "Prevent all future resistance mutations"}], "correct": "A", "rationale": "The goal of ART is durable, maximal suppression of viral replication (undetectable viral load); current therapy does not eradicate the virus.", "objective": "HIV 3", "section": "HIV/Antiviral"}], [{"id": "42", "number": 42, "suffix": "", "stem": "A woman starting ferrous sulfate for iron deficiency also takes levothyroxine each morning. What is the most appropriate instruction to prevent a drug interaction?", "choices": [{"letter": "A", "text": "Double the levothyroxine dose while on iron"}, {"letter": "B", "text": "Separate iron from levothyroxine by about 4 hours"}, {"letter": "C", "text": "Stop the levothyroxine while on iron"}, {"letter": "D", "text": "Take both medications together each morning"}, {"letter": "E", "text": "Crush both tablets and take with milk"}], "correct": "B", "rationale": "Iron binds levothyroxine and reduces its absorption; they should be separated by about 4 hours (and iron separated from fluoroquinolones/tetracyclines/antacids by ~2 hours).", "objective": "Anemia 1", "section": "Anemia"}], [{"id": "43", "number": 43, "suffix": "", "stem": "A 33-year-old woman with a history of ankylosing spondylitis presents with a painful, red left eye, photophobia, and blurred vision. Slit-lamp exam shows anterior chamber cells and flare consistent with anterior uveitis. Which combination is the mainstay of treatment (with ophthalmology)?", "choices": [{"letter": "A", "text": "Topical antibiotic plus artificial tears"}, {"letter": "B", "text": "Topical beta-blocker plus prostaglandin analog"}, {"letter": "C", "text": "Topical antihistamine plus decongestant"}, {"letter": "D", "text": "Topical corticosteroid plus a cycloplegic"}, {"letter": "E", "text": "Oral antiviral plus topical steroid"}], "correct": "D", "rationale": "Anterior uveitis is treated with a topical corticosteroid (e.g., prednisolone acetate) to reduce inflammation plus a cycloplegic/dilating agent (e.g., cyclopentolate) for pain and to prevent synechiae.", "objective": "Ophtho 2", "section": "Ophthalmology"}], [{"id": "44", "number": 44, "suffix": "", "stem": "A 54-year-old man with diabetes has white, creamy patches on his tongue and buccal mucosa that scrape off to reveal erythema, causing mild discomfort. For this mild oropharyngeal infection, which topical therapy is appropriate?", "choices": [{"letter": "A", "text": "Clotrimazole troches"}, {"letter": "B", "text": "Topical mupirocin"}, {"letter": "C", "text": "Systemic amphotericin B"}, {"letter": "D", "text": "Oral doxycycline"}, {"letter": "E", "text": "Oral metronidazole"}], "correct": "A", "rationale": "Mild oral candidiasis (thrush) is treated topically with clotrimazole troches, miconazole buccal tablets, or nystatin suspension; fluconazole is used for moderate-severe or esophageal disease.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "44A", "number": 44, "suffix": "A", "stem": "If this patient instead had esophageal involvement with odynophagia, which agent is preferred?", "choices": [{"letter": "A", "text": "Topical miconazole gel"}, {"letter": "B", "text": "Oral doxycycline"}, {"letter": "C", "text": "Clotrimazole troches"}, {"letter": "D", "text": "Fluconazole"}, {"letter": "E", "text": "Nystatin swish-and-spit"}], "correct": "D", "rationale": "Esophageal candidiasis requires systemic therapy with fluconazole (higher dose, longer course), not topical agents.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "45", "number": 45, "suffix": "", "stem": "A 60-year-old man with chronic kidney disease has symptomatic anemia after iron stores have been assessed and repleted. Which class of medication is used to treat anemia of CKD?", "choices": [{"letter": "A", "text": "Erythropoiesis-stimulating agents"}, {"letter": "B", "text": "Loop diuretics"}, {"letter": "C", "text": "Leukotriene receptor antagonists"}, {"letter": "D", "text": "Oral tetracyclines"}, {"letter": "E", "text": "Proton pump inhibitors"}], "correct": "A", "rationale": "Erythropoiesis-stimulating agents (epoetin alfa, darbepoetin) treat anemia of CKD after iron status is optimized.", "objective": "Anemia 1", "section": "Anemia"}, {"id": "45A", "number": 45, "suffix": "A", "stem": "Which black box concern guides how high the hemoglobin target should be with this therapy?", "choices": [{"letter": "A", "text": "Higher hemoglobin triggers hemolysis"}, {"letter": "B", "text": "Higher hemoglobin causes hepatic failure"}, {"letter": "C", "text": "Higher hemoglobin causes irreversible deafness"}, {"letter": "D", "text": "Higher hemoglobin raises stroke, MI, and clot risk"}, {"letter": "E", "text": "Higher hemoglobin causes tendon rupture"}], "correct": "D", "rationale": "ESAs carry a black box warning; targeting Hgb at or above ~10-11.5 g/dL (and especially higher) is associated with increased mortality, stroke, MI, and venous thromboembolism, so they are avoided when Hgb is >=10.", "objective": "Anemia 1", "section": "Anemia"}, {"id": "45B", "number": 45, "suffix": "B", "stem": "In which patient should ESA therapy generally be avoided?", "choices": [{"letter": "A", "text": "A patient with controlled hypertension"}, {"letter": "B", "text": "A patient on hemodialysis"}, {"letter": "C", "text": "A patient with low erythropoietin levels"}, {"letter": "D", "text": "A patient with iron deficiency corrected"}, {"letter": "E", "text": "A patient with active malignancy"}], "correct": "E", "rationale": "ESAs are avoided in patients with active or recent malignancy because they may promote tumor progression/recurrence; they may also cause or worsen hypertension.", "objective": "Anemia 1", "section": "Anemia"}], [{"id": "46", "number": 46, "suffix": "", "stem": "A patient with high-grade B-cell non-Hodgkin lymphoma is treated with R-CHOP. After the rituximab infusion, laboratory studies show hyperuricemia, hyperkalemia, hyperphosphatemia, and hypocalcemia. Which complication does this represent?", "choices": [{"letter": "A", "text": "Tumor lysis syndrome"}, {"letter": "B", "text": "Hand-foot syndrome"}, {"letter": "C", "text": "Serotonin syndrome"}, {"letter": "D", "text": "Hemorrhagic cystitis"}, {"letter": "E", "text": "Cardiomyopathy"}], "correct": "A", "rationale": "Rapid tumor cell breakdown causes tumor lysis syndrome (hyperuricemia, hyperkalemia, hyperphosphatemia, hypocalcemia), notably after rituximab in bulky lymphoma/leukemia.", "objective": "Onc 1", "section": "Oncology"}, {"id": "46A", "number": 46, "suffix": "A", "stem": "Which premedication is given before this monoclonal antibody to reduce infusion reactions?", "choices": [{"letter": "A", "text": "Oral calcium and vitamin D supplements"}, {"letter": "B", "text": "Folic acid and B12"}, {"letter": "C", "text": "Iron and vitamin C"}, {"letter": "D", "text": "Diphenhydramine and acetaminophen"}, {"letter": "E", "text": "Potassium and magnesium"}], "correct": "D", "rationale": "Rituximab can cause serious infusion reactions (hypotension, bronchospasm, angioedema); premedication with diphenhydramine and acetaminophen (and slow infusion) is used.", "objective": "Onc 2", "section": "Oncology"}], [{"id": "47", "number": 47, "suffix": "", "stem": "A 38-year-old woman has had facial pressure, purulent nasal discharge, and congestion for 12 days. Her symptoms initially improved around day 6 but then worsened again with a fever of 39°C. Which of the following best characterizes her condition?", "choices": [{"letter": "A", "text": "Acute bacterial sinusitis"}, {"letter": "B", "text": "Allergic rhinitis"}, {"letter": "C", "text": "Chronic sinusitis"}, {"letter": "D", "text": "Vasomotor rhinitis"}, {"letter": "E", "text": "Acute viral sinusitis"}], "correct": "A", "rationale": "Symptoms persisting beyond 10 days, or worsening after initial improvement ('double sickening'), or severe symptoms with high fever and purulent discharge, indicate acute bacterial sinusitis.", "objective": "ENT-Sinus 1", "section": "ENT"}, {"id": "47A", "number": 47, "suffix": "A", "stem": "She has no drug allergies. Which of the following is the most appropriate first-line antibiotic?", "choices": [{"letter": "A", "text": "Cephalexin"}, {"letter": "B", "text": "Clindamycin"}, {"letter": "C", "text": "Azithromycin given for five days"}, {"letter": "D", "text": "Levofloxacin"}, {"letter": "E", "text": "Amoxicillin-clavulanate"}], "correct": "E", "rationale": "First-line therapy for acute bacterial sinusitis is amoxicillin or amoxicillin-clavulanate; the latter adds beta-lactamase coverage.", "objective": "ENT-Sinus 2", "section": "ENT"}, {"id": "47B", "number": 47, "suffix": "B", "stem": "If she instead had a penicillin allergy, which oral agent is an appropriate alternative for this infection?", "choices": [{"letter": "A", "text": "Nitrofurantoin"}, {"letter": "B", "text": "Metronidazole"}, {"letter": "C", "text": "Doxycycline"}, {"letter": "D", "text": "Penicillin V"}, {"letter": "E", "text": "Amoxicillin"}], "correct": "C", "rationale": "Doxycycline is a recommended alternative for bacterial sinusitis in penicillin-allergic patients; respiratory fluoroquinolones (levofloxacin, moxifloxacin) are other options.", "objective": "ENT-Sinus 2", "section": "ENT"}], [{"id": "48", "number": 48, "suffix": "", "stem": "A 70-year-old man with primary open-angle glaucoma is being considered for topical timolol, which lowers IOP by decreasing aqueous humor production. Which coexisting condition is a contraindication to this agent?", "choices": [{"letter": "A", "text": "Benign prostatic hyperplasia"}, {"letter": "B", "text": "Gastroesophageal reflux disease"}, {"letter": "C", "text": "Severe asthma with reactive airway disease"}, {"letter": "D", "text": "Mild knee osteoarthritis"}, {"letter": "E", "text": "Type 2 diabetes mellitus, diet-controlled"}], "correct": "C", "rationale": "Topical nonselective beta-blockers (timolol) can be systemically absorbed and cause bronchospasm, bradycardia, hypotension, and worsening heart failure; they are contraindicated in reactive airway disease, marked bradycardia/heart block, and decompensated heart failure.", "objective": "Ophtho 11", "section": "Ophthalmology"}], [{"id": "49", "number": 49, "suffix": "", "stem": "A treatment-naive patient with HIV is starting therapy. Which of the following is a recommended initial regimen for most people with HIV and the most commonly prescribed single-tablet option?", "choices": [{"letter": "A", "text": "Zidovudine monotherapy without a booster"}, {"letter": "B", "text": "Two protease inhibitors without any NRTI"}, {"letter": "C", "text": "Bictegravir/emtricitabine/tenofovir alafenamide"}, {"letter": "D", "text": "Efavirenz monotherapy without a backbone"}, {"letter": "E", "text": "Atazanavir plus darunavir plus emtricitabine"}], "correct": "C", "rationale": "Bictegravir/emtricitabine/tenofovir alafenamide (Biktarvy) is a recommended, well-tolerated, single-tablet INSTI-based initial regimen and the most commonly prescribed.", "objective": "HIV 3", "section": "HIV/Antiviral"}], [{"id": "50", "number": 50, "suffix": "", "stem": "A 44-year-old man on immunosuppressive therapy develops fever, cough, headache, and pleuritic chest pain two weeks after exploring caves in Ohio. Chest imaging shows infiltrates with mediastinal adenopathy. Which of the following is the most likely diagnosis?", "choices": [{"letter": "A", "text": "Oral candidiasis"}, {"letter": "B", "text": "Cryptococcosis"}, {"letter": "C", "text": "Histoplasmosis"}, {"letter": "D", "text": "Blastomycosis"}, {"letter": "E", "text": "Coccidioidomycosis"}], "correct": "C", "rationale": "Cave exposure (bat/bird droppings) in the Ohio/Mississippi River valleys with pulmonary infiltrates and mediastinal adenopathy is classic for histoplasmosis.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "50A", "number": 50, "suffix": "A", "stem": "For moderate pulmonary disease from this fungus, which oral agent is preferred?", "choices": [{"letter": "A", "text": "Praziquantel"}, {"letter": "B", "text": "Doxycycline"}, {"letter": "C", "text": "Itraconazole"}, {"letter": "D", "text": "Metronidazole"}, {"letter": "E", "text": "Nystatin"}], "correct": "C", "rationale": "Itraconazole is the preferred oral agent for moderate histoplasmosis; amphotericin B (often followed by itraconazole) is used for severe disease.", "objective": "TFP 2", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "51", "number": 51, "suffix": "", "stem": "A patient with macrocytic anemia is about to be started on folic acid. Why is it essential to also check for vitamin B12 deficiency before treating?", "choices": [{"letter": "A", "text": "Folate triggers hemolysis in G6PD deficiency"}, {"letter": "B", "text": "Folate causes irreversible tendon damage"}, {"letter": "C", "text": "Folate raises the INR dangerously"}, {"letter": "D", "text": "Folate can correct the anemia but not the neuropathy"}, {"letter": "E", "text": "Folate directly worsens iron absorption in the gut"}], "correct": "D", "rationale": "Starting folic acid before excluding B12 deficiency can correct the anemia while allowing B12-related neurologic damage to progress and become permanent; always check both.", "objective": "Anemia 1", "section": "Anemia"}], [{"id": "52", "number": 52, "suffix": "", "stem": "A patient with metastatic colorectal cancer is on bevacizumab, an anti-VEGF monoclonal antibody, and needs major surgery. Which consideration is most important?", "choices": [{"letter": "A", "text": "It impairs wound healing and must be held around surgery"}, {"letter": "B", "text": "It causes irreversible cardiomyopathy within days"}, {"letter": "C", "text": "It causes a disulfiram-like reaction when drinking alcohol"}, {"letter": "D", "text": "It requires G6PD testing before every dose"}, {"letter": "E", "text": "It must be separated from oral iron by 2 hours"}], "correct": "A", "rationale": "Bevacizumab inhibits VEGF/angiogenesis and impairs wound healing; it must not be given within ~28 days before or after major surgery. Other risks include GI perforation and venous thromboembolism.", "objective": "Onc 1", "section": "Oncology"}], [{"id": "53", "number": 53, "suffix": "", "stem": "A clinician is teaching a patient how to instill eye drops and minimize systemic absorption of a topical glaucoma medication. Which instruction is most appropriate?", "choices": [{"letter": "A", "text": "Instill the drop onto the cornea while blinking rapidly"}, {"letter": "B", "text": "Close the eye and press the inner corner for 2-3 minutes"}, {"letter": "C", "text": "Give multiple different drops at once without waiting between them"}, {"letter": "D", "text": "Touch the dropper tip to the eye to ensure accurate delivery"}, {"letter": "E", "text": "Rub the eye vigorously to spread the drop after instilling"}], "correct": "B", "rationale": "Closing the eye and pressing on the inner canthus (nasolacrimal occlusion) reduces systemic absorption; the dropper should not touch the eye, and when using more than one drop, separate by ~5 minutes.", "objective": "Ophtho 1", "section": "Ophthalmology"}], [{"id": "54", "number": 54, "suffix": "", "stem": "A patient on an NRTI-containing regimen develops fatigue, nausea, and an elevated lactate. Which class-associated adverse effect is of concern?", "choices": [{"letter": "A", "text": "QT prolongation and torsades"}, {"letter": "B", "text": "Indirect hyperbilirubinemia and jaundice"}, {"letter": "C", "text": "Severe cutaneous drug reaction"}, {"letter": "D", "text": "Lactic acidosis with hepatic steatosis"}, {"letter": "E", "text": "Hyperglycemia and dyslipidemia"}], "correct": "D", "rationale": "NRTIs carry a black box risk of potentially fatal lactic acidosis and hepatomegaly with steatosis.", "objective": "HIV 1", "section": "HIV/Antiviral"}], [{"id": "55", "number": 55, "suffix": "", "stem": "A 30-year-old with both allergic rhinitis and mild asthma could benefit from a single oral agent that treats both. Which agent is most appropriate, and what serious warning must be discussed?", "choices": [{"letter": "A", "text": "Fexofenadine with black box QT prolongation risk"}, {"letter": "B", "text": "Diphenhydramine; black box tendon rupture"}, {"letter": "C", "text": "Montelukast; black box neuropsychiatric events"}, {"letter": "D", "text": "Oxymetazoline; black box hepatotoxicity"}, {"letter": "E", "text": "Phenylephrine; black box agranulocytosis"}], "correct": "C", "rationale": "Montelukast, a leukotriene receptor antagonist, treats both allergic rhinitis and asthma but carries a black box warning for neuropsychiatric events (depression, suicidality, agitation, sleep disturbance).", "objective": "ENT-AR 2", "section": "ENT"}], [{"id": "56", "number": 56, "suffix": "", "stem": "A 32-year-old field scientist returns from a tropical malaria-endemic region with fever, chills, headache, and a blood smear showing Plasmodium falciparum. Which of the following is generally the most effective treatment option?", "choices": [{"letter": "A", "text": "Oral doxycycline monotherapy for a week"}, {"letter": "B", "text": "Oral albendazole"}, {"letter": "C", "text": "Oral metronidazole"}, {"letter": "D", "text": "Artemisinin-based combination therapy"}, {"letter": "E", "text": "Oral fluconazole"}], "correct": "D", "rationale": "Artemisinin-based combination therapies (e.g., artemether-lumefantrine) are the most effective option for P. falciparum and are combined to prevent resistance.", "objective": "TFP 3", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "56A", "number": 56, "suffix": "A", "stem": "Which species is emphasized as the most dangerous, potentially fatal cause of malaria?", "choices": [{"letter": "A", "text": "Plasmodium ovale"}, {"letter": "B", "text": "Plasmodium malariae"}, {"letter": "C", "text": "Plasmodium knowlesi"}, {"letter": "D", "text": "Plasmodium vivax"}, {"letter": "E", "text": "Plasmodium falciparum"}], "correct": "E", "rationale": "P. falciparum is the most dangerous species, capable of rapidly fulminant, fatal disease; malaria is transmitted by the female Anopheles mosquito.", "objective": "TFP 3", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "57A", "number": 57, "suffix": "A", "stem": "Which co-administered drug most increases methotrexate toxicity and should be used cautiously?", "choices": [{"letter": "A", "text": "Loop diuretics"}, {"letter": "B", "text": "Inhaled corticosteroids"}, {"letter": "C", "text": "Topical emollients"}, {"letter": "D", "text": "NSAIDs"}, {"letter": "E", "text": "Bulk laxatives"}], "correct": "D", "rationale": "NSAIDs, salicylates, PPIs, and sulfonamides increase methotrexate toxicity; methotrexate is also contraindicated in pregnancy.", "objective": "Onc 1", "section": "Oncology"}], [{"id": "58", "number": 58, "suffix": "", "stem": "A 28-year-old woman has vaginal itching, dysuria, and a frothy, greenish-yellow discharge; wet mount shows motile trichomonads. Which of the following is the drug of choice?", "choices": [{"letter": "A", "text": "Albendazole"}, {"letter": "B", "text": "Fluconazole"}, {"letter": "C", "text": "Metronidazole"}, {"letter": "D", "text": "Nystatin"}, {"letter": "E", "text": "Doxycycline"}], "correct": "C", "rationale": "Metronidazole is the drug of choice for Trichomonas vaginalis (also for giardiasis, amebiasis, and bacterial vaginosis).", "objective": "TFP 3", "section": "Tick-Borne/Fungal/Parasitic"}, {"id": "58A", "number": 58, "suffix": "A", "stem": "Which counseling point about this drug is most important?", "choices": [{"letter": "A", "text": "Use sunscreen daily to prevent phototoxic skin burns"}, {"letter": "B", "text": "Expect harmless red discoloration of urine"}, {"letter": "C", "text": "Take it with iron to improve absorption"}, {"letter": "D", "text": "Avoid alcohol to prevent a disulfiram-like reaction"}, {"letter": "E", "text": "Stop the drug if tendon pain develops"}], "correct": "D", "rationale": "Metronidazole causes a disulfiram-like reaction with alcohol; patients must avoid alcohol during and shortly after therapy. It can also prolong the QT interval.", "objective": "TFP 3", "section": "Tick-Borne/Fungal/Parasitic"}], [{"id": "59", "number": 59, "suffix": "", "stem": "A 42-year-old woman with Crohn disease and iron deficiency anemia has tried oral iron but has worsening GI symptoms and poor absorption. Which of the following is the most appropriate next step?", "choices": [{"letter": "A", "text": "Erythropoiesis-stimulating agent therapy"}, {"letter": "B", "text": "Intravenous iron"}, {"letter": "C", "text": "A higher daily dose of oral ferrous sulfate"}, {"letter": "D", "text": "Oral folic acid supplementation"}, {"letter": "E", "text": "Intramuscular vitamin B12"}], "correct": "B", "rationale": "IV iron is indicated when oral iron is not tolerated, when there is malabsorption/IBD, when rapid repletion is needed, or in later pregnancy.", "objective": "Anemia 1", "section": "Anemia"}, {"id": "59A", "number": 59, "suffix": "A", "stem": "Which IV iron formulation carries the highest risk of hypersensitivity/anaphylaxis and has classically warranted a test dose?", "choices": [{"letter": "A", "text": "Ferrous fumarate"}, {"letter": "B", "text": "Iron sucrose"}, {"letter": "C", "text": "Iron dextran"}, {"letter": "D", "text": "Cyanocobalamin"}, {"letter": "E", "text": "Ferrous gluconate"}], "correct": "C", "rationale": "Iron dextran carries the highest hypersensitivity/anaphylaxis risk and historically required a test dose; newer formulations have much lower risk.", "objective": "Anemia 1", "section": "Anemia"}], [{"id": "60", "number": 60, "suffix": "", "stem": "A 30-year-old contact-lens wearer walked into a tree branch and now has a painful right eye with tearing, photophobia, and foreign-body sensation. Fluorescein staining shows an epithelial defect without infiltrate. Which of the following is appropriate in his management?", "choices": [{"letter": "A", "text": "Topical prednisolone drops"}, {"letter": "B", "text": "Oral valacyclovir"}, {"letter": "C", "text": "An eye patch for all abrasions"}, {"letter": "D", "text": "Topical proparacaine for the patient to use at home for pain"}, {"letter": "E", "text": "Topical antipseudomonal antibiotic (ciprofloxacin)"}], "correct": "E", "rationale": "Contact-lens-associated abrasions require topical antibiotic prophylaxis with antipseudomonal coverage (fluoroquinolone); topical anesthetics are not prescribed for home use because they delay healing.", "objective": "Ophtho 3", "section": "Ophthalmology"}], [{"id": "61", "number": 61, "suffix": "", "stem": "A patient on atazanavir develops scleral icterus and jaundice, but liver transaminases are normal and bilirubin is predominantly indirect. What is the most appropriate interpretation?", "choices": [{"letter": "A", "text": "Acute hepatitis caused by drug-induced liver injury"}, {"letter": "B", "text": "Benign indirect hyperbilirubinemia from atazanavir"}, {"letter": "C", "text": "Hemolysis from abacavir hypersensitivity"}, {"letter": "D", "text": "Lactic acidosis from mitochondrial toxicity"}, {"letter": "E", "text": "Biliary obstruction requiring urgent surgery"}], "correct": "B", "rationale": "Atazanavir characteristically causes indirect (unconjugated) hyperbilirubinemia and jaundice without other LFT abnormalities; it is benign.", "objective": "HIV 1", "section": "HIV/Antiviral"}], [{"id": "62", "number": 62, "suffix": "", "stem": "A 28-year-old woman has perennial nasal congestion, rhinorrhea, sneezing, and itching from dust-mite allergy, with pale boggy nasal mucosa on exam. She wants the single most effective medication for ongoing control. Which of the following is the most appropriate first-line therapy?", "choices": [{"letter": "A", "text": "Intranasal fluticasone daily"}, {"letter": "B", "text": "Intranasal oxymetazoline as needed"}, {"letter": "C", "text": "Oral diphenhydramine at night"}, {"letter": "D", "text": "Oral phenylephrine twice daily"}, {"letter": "E", "text": "Oral montelukast every morning"}], "correct": "A", "rationale": "Intranasal corticosteroids (e.g., fluticasone) are the most effective and first-line therapy for allergic rhinitis because they suppress the entire inflammatory response, not just histamine.", "objective": "ENT-AR 1", "section": "ENT"}]];
let page=0, graded=false, reviewMode=false, reviewGroups=[];
const responses={};
const qGrid=document.getElementById('questionGrid'), counter=document.getElementById('counter'), progressBar=document.getElementById('progressBar');
const prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn'), submitBtn=document.getElementById('submitBtn'), gradeCurrentBtn=document.getElementById('gradeCurrentBtn'), reviewBtn=document.getElementById('reviewBtn');
const activeGroups=()=>reviewMode?reviewGroups:groups;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
 const arr=activeGroups(); if(!arr.length) return;
 const group=arr[page]; qGrid.innerHTML=''; qGrid.className='question-grid'+(group.length>1?' multi':'');
 group.forEach(q=>{
  const box=document.createElement('section'); box.className='qbox';
  const selected=responses[q.id];
  let choices=q.choices.map(c=>{let cls='choice'; if(graded||selected){if(c.letter===q.correct) cls+=' correct'; if(selected===c.letter&&selected!==q.correct) cls+=' incorrect'; cls+=' locked';} return `<label class="${cls}"><input type="radio" name="q_${q.id}" value="${c.letter}" ${selected===c.letter?'checked':''} ${graded||selected?'disabled':''}><strong>${c.letter}.</strong><span>${esc(c.text)}</span></label>`;}).join('');
  let fb=''; if(selected){const ok=selected===q.correct; fb=`<div class="feedback show ${ok?'ok':'bad'}"><strong>${ok?'Correct':'Incorrect'}.</strong> Correct answer: ${q.correct}.<div>${esc(q.rationale)}</div><div class="meta"><span class="pill">${esc(q.section)} • ${esc(q.objective)}</span></div></div>`;}
  else if(graded){fb=`<div class="feedback show bad"><strong>Unanswered.</strong> Correct answer: ${q.correct}.<div>${esc(q.rationale)}</div><div class="meta"><span class="pill">${esc(q.section)} • ${esc(q.objective)}</span></div></div>`;}
  box.innerHTML=`<div class="qhead">Question ${q.id}</div><p class="stem">${esc(q.stem)}</p><div class="choices">${choices}</div>${fb}`;
  box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{responses[q.id]=inp.value; render();})); qGrid.appendChild(box);
 });
 counter.textContent=`Page ${page+1} of ${arr.length}`; progressBar.style.width=`${((page+1)/arr.length)*100}%`;
 prevBtn.disabled=page===0; nextBtn.style.display=page===arr.length-1?'none':''; submitBtn.style.display=page===arr.length-1&&!reviewMode?'inline-block':'none'; gradeCurrentBtn.style.display=reviewMode?'none':'inline-block';
 reviewBtn.textContent=reviewMode?'Return to Full Exam':'Review Missed Questions';
 window.scrollTo({top:0,behavior:'smooth'});
}
function grade(mode){
 graded=true;
 let considered=groups.flat().filter(q=>mode==='current'?responses[q.id]:true);
 let answered=considered.filter(q=>responses[q.id]); let correct=answered.filter(q=>responses[q.id]===q.correct);
 const denom=mode==='current'?answered.length:considered.length; const pct=denom?Math.round(correct.length/denom*100):0;
 document.getElementById('results').classList.add('show'); document.getElementById('scoreLine').textContent=`${pct}%`;
 document.getElementById('stats').innerHTML=`<div class="stat"><span>Correct</span><strong>${correct.length}</strong></div><div class="stat"><span>Scored</span><strong>${denom}</strong></div><div class="stat"><span>Answered</span><strong>${answered.length} / 90</strong></div>`;
 const by={}; considered.forEach(q=>{(by[q.section]??={c:0,n:0}).n++; if(responses[q.id]===q.correct)by[q.section].c++;});
 const rows=Object.entries(by).map(([s,v])=>`<tr><td>${esc(s)}</td><td>${v.c} / ${v.n}</td><td>${v.n?Math.round(v.c/v.n*100):0}%</td></tr>`).join('');
 document.getElementById('sectionScores').innerHTML=`<table class="section-table"><thead><tr><th>Content Area</th><th>Correct</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table>`;
 render(); document.getElementById('results').scrollIntoView({behavior:'smooth'});
}
prevBtn.onclick=()=>{if(page>0){page--;render();}}; nextBtn.onclick=()=>{if(page<activeGroups().length-1){page++;render();}};
gradeCurrentBtn.onclick=()=>grade('current'); submitBtn.onclick=()=>grade('all');
reviewBtn.onclick=()=>{
 if(reviewMode){reviewMode=false;page=0;render();return;}
 reviewGroups=groups.filter(g=>g.some(q=>responses[q.id]&&responses[q.id]!==q.correct));
 if(!reviewGroups.length){alert('No missed answered questions to review.');return;}
 reviewMode=true;page=0;render();
};
render();
</script></body></html>
