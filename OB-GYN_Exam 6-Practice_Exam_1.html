heart tones are heard, BP is 150/96, and urine protein is 2+. What are the most appropriate initial studies?", "options": [{"letter": "A", "text": "Quantitative hCG and pelvic ultrasound"}, {"letter": "B", "text": "Serum lipase"}, {"letter": "C", "text": "Cell-free DNA"}, {"letter": "D", "text": "CT head"}, {"letter": "E", "text": "Fetal echocardiogram"}], "answer": "A", "explanation": "Uterus large for dates + bleeding + hyperemesis + preeclampsia <20 wk = molar pregnancy until proven otherwise → quantitative hCG + pelvic/transvaginal US (plus CBC, TSH/free T4, type/Rh, coags, CXR).", "objective": "Complications of Pregnancy (De La Cruz) — Ectopic pregnancy and gestational trophoblastic disease", "section": "Complications of Pregnancy"}, {"id": "30A", "group": 30, "stem": "hCG is 280,000 mIU/mL. Ultrasound shows a central heterogeneous \"snowstorm\" mass with no fetus and bilateral theca lutein cysts. What karyotype is expected?", "options": [{"letter": "A", "text": "46,XY of maternal origin"}, {"letter": "B", "text": "47,XX,+21"}, {"letter": "C", "text": "69,XXY with fetal tissue"}, {"letter": "D", "text": "45,X"}, {"letter": "E", "text": "46,XX of entirely paternal origin, no fetal tissue"}], "answer": "E", "explanation": "Complete mole = diploid 46, all paternal, no fetal tissue, hCG >100,000. Partial = triploid 69,XXY/XXX with fetal tissue, hCG usually <100,000.", "objective": "Complications of Pregnancy (De La Cruz) — Ectopic pregnancy and gestational trophoblastic disease", "section": "Complications of Pregnancy"}, {"id": "30B", "group": 30, "stem": "What is the appropriate management?", "options": [{"letter": "A", "text": "Suction uterine evacuation, then serial quantitative hCG until normal with reliable contraception during follow-up"}, {"letter": "B", "text": "Expectant management"}, {"letter": "C", "text": "Hysterectomy is mandatory"}, {"letter": "D", "text": "Methotrexate alone"}, {"letter": "E", "text": "Induction of labor with misoprostol"}], "answer": "A", "explanation": "Suction evacuation (hysterectomy alternative if childbearing complete) → serial hCG until normal, then surveillance; reliable contraception; RhIG if Rh-negative.", "objective": "Complications of Pregnancy (De La Cruz) — Ectopic pregnancy and gestational trophoblastic disease", "section": "Complications of Pregnancy"}, {"id": "30C", "group": 30, "stem": "After evacuation, her hCG plateaus over three consecutive weekly measurements. What does this indicate and what is next?", "options": [{"letter": "A", "text": "Normal postmolar course — continue observation"}, {"letter": "B", "text": "Gestational trophoblastic neoplasia — oncology referral for staging and chemotherapy (methotrexate or actinomycin-D)"}, {"letter": "C", "text": "Laboratory error — stop testing"}, {"letter": "D", "text": "Theca lutein cyst rupture — laparoscopy"}, {"letter": "E", "text": "New intrauterine pregnancy — obtain ultrasound"}], "answer": "B", "explanation": "Plateauing or rising hCG after evacuation = GTN (complete mole 13–20% risk) → oncology, staging (CXR, imaging), chemotherapy.", "objective": "Complications of Pregnancy (De La Cruz) — Ectopic pregnancy and gestational trophoblastic disease", "section": "Complications of Pregnancy"}, {"id": "31", "group": 31, "stem": "A 22-year-old G1 at 35 weeks presents with a headache not relieved by acetaminophen and seeing spots. BP is 168/112 and 166/110 on repeat 15 minutes later. Patellar reflexes are 3+. Labs are shown. [[LABS]] What is the diagnosis?", "options": [{"letter": "A", "text": "Chronic hypertension"}, {"letter": "B", "text": "HELLP syndrome"}, {"letter": "C", "text": "Preeclampsia with severe features"}, {"letter": "D", "text": "Preeclampsia without severe features"}, {"letter": "E", "text": "Gestational hypertension"}], "answer": "C", "explanation": "New HTN after 20 wk + proteinuria (P:C ≥0.3) = preeclampsia. Severe features (any one): BP ≥160/110, plt <100K, AST/ALT ≥2×, Cr >1.1, pulmonary edema, cerebral/visual symptoms. She has severe-range BP and cerebral/visual symptoms; labs are not HELLP.", "objective": "Diseases in Pregnancy (Marcus) — Hypertensive disorders of pregnancy", "section": "Hypertensive Disorders of Pregnancy", "labs": [{"test": "Platelets", "result": "145,000/µL", "range": "150,000–400,000/µL"}, {"test": "AST", "result": "38 U/L", "range": "10–40 U/L"}, {"test": "ALT", "result": "30 U/L", "range": "7–35 U/L"}, {"test": "Creatinine", "result": "0.8 mg/dL", "range": "0.4–0.8 mg/dL"}, {"test": "Urine protein:creatinine", "result": "0.5", "range": "<0.3"}]}, {"id": "31A", "group": 31, "stem": "What is the most appropriate management?", "options": [{"letter": "A", "text": "Magnesium sulfate and expectant management until 37 weeks"}, {"letter": "B", "text": "Lisinopril and bed rest"}, {"letter": "C", "text": "Betamethasone and delay delivery for 48 hours"}, {"letter": "D", "text": "Oral labetalol and outpatient follow-up in 1 week"}, {"letter": "E", "text": "IV labetalol, magnesium sulfate seizure prophylaxis, and delivery once stabilized"}], "answer": "E", "explanation": "Severe features → admit, urgent BP control (IV labetalol, IV hydralazine or IR nifedipine) + MgSO4; deliver at ≥34 wk once stable. Never ACE-I/ARB.", "objective": "Diseases in Pregnancy (Marcus) — Hypertensive disorders of pregnancy", "section": "Hypertensive Disorders of Pregnancy"}, {"id": "31B", "group": 31, "stem": "During the magnesium infusion, the nurse notes absent patellar reflexes and a respiratory rate of 10. What is the next step?", "options": [{"letter": "A", "text": "Increase the magnesium infusion"}, {"letter": "B", "text": "Emergency cesarean delivery"}, {"letter": "C", "text": "Give IV lorazepam"}, {"letter": "D", "text": "Give IV hydralazine"}, {"letter": "E", "text": "Stop the infusion and give calcium gluconate"}], "answer": "E", "explanation": "Hypermagnesemia: loss of DTRs (earliest) → respiratory depression → arrest. Stop the infusion and give calcium gluconate.", "objective": "Diseases in Pregnancy (Marcus) — Hypertensive disorders of pregnancy", "section": "Hypertensive Disorders of Pregnancy"}, {"id": "32", "group": 32, "stem": "A 19-year-old at 37 weeks with preeclampsia has a generalized tonic-clonic seizure on the labor floor. BP is 172/114. What is the first-line anticonvulsant?", "options": [{"letter": "A", "text": "IV levetiracetam"}, {"letter": "B", "text": "IV lorazepam"}, {"letter": "C", "text": "IV diazepam"}, {"letter": "D", "text": "Magnesium sulfate 4–6 g IV load, then 1–2 g/h"}, {"letter": "E", "text": "IV phenytoin"}], "answer": "D", "explanation": "Eclampsia: airway, O₂, left lateral decubitus → MgSO4 (first line; continue 24 h after delivery/last seizure) → urgent BP control → deliver once stable. Benzodiazepines/phenytoin are NOT first line.", "objective": "Diseases in Pregnancy (Marcus) — Hypertensive disorders of pregnancy", "section": "Hypertensive Disorders of Pregnancy"}, {"id": "33", "group": 33, "stem": "A 26-year-old at 9 weeks reports palpitations, heat intolerance, tremor and weight loss despite good appetite. She has exophthalmos and a goiter with a bruit. TSH is <0.01 mU/L, free T4 is elevated and TSI is positive. Which antithyroid drug is preferred now?", "options": [{"letter": "A", "text": "Propylthiouracil (PTU)"}, {"letter": "B", "text": "Levothyroxine"}, {"letter": "C", "text": "Radioactive iodine"}, {"letter": "D", "text": "Potassium iodide alone"}, {"letter": "E", "text": "Methimazole"}], "answer": "A", "explanation": "Graves' in pregnancy: PTU in the 1st trimester (methimazole → aplasia cutis/embryopathy). Radioactive iodine is contraindicated. Short-term β-blocker for symptoms.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "33A", "group": 33, "stem": "At 16 weeks she remains on therapy. What change is recommended?", "options": [{"letter": "A", "text": "Continue PTU through delivery"}, {"letter": "B", "text": "Stop all antithyroid medication"}, {"letter": "C", "text": "Switch to levothyroxine"}, {"letter": "D", "text": "Switch to methimazole"}, {"letter": "E", "text": "Add radioactive iodine"}], "answer": "D", "explanation": "Switch to methimazole in the 2nd/3rd trimester because PTU causes hepatotoxicity.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "34", "group": 34, "stem": "A 29-year-old at 28 weeks reports 2 days of left calf swelling and pain. The left calf is 3 cm larger than the right and tender. What is the most appropriate diagnostic test?", "options": [{"letter": "A", "text": "Compression duplex ultrasound"}, {"letter": "B", "text": "V/Q scan"}, {"letter": "C", "text": "CT pulmonary angiography"}, {"letter": "D", "text": "D-dimer"}, {"letter": "E", "text": "Venography"}], "answer": "A", "explanation": "DVT in pregnancy → compression duplex US. D-dimer is physiologically elevated and not useful.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "34A", "group": 34, "stem": "Ultrasound confirms a left femoral DVT. What is the treatment of choice?", "options": [{"letter": "A", "text": "Apixaban"}, {"letter": "B", "text": "Compression stockings alone"}, {"letter": "C", "text": "Warfarin"}, {"letter": "D", "text": "Aspirin 81 mg"}, {"letter": "E", "text": "Therapeutic enoxaparin (LMWH) through pregnancy and ≥6 weeks postpartum"}], "answer": "E", "explanation": "LMWH is the treatment of choice (continue ≥6 wk postpartum, total ≥3 months; hold ~24 h before delivery/neuraxial). Warfarin is category X in pregnancy (OK postpartum); DOACs are avoided.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "35", "group": 35, "stem": "A 28-year-old at 24 weeks with persistent asthma stopped her inhaled corticosteroid when she learned she was pregnant. She now uses albuterol 4–5 times a week and wakes at night with cough. Which is the most appropriate controller?", "options": [{"letter": "A", "text": "Continue albuterol only to avoid fetal exposure"}, {"letter": "B", "text": "Oral prednisone daily"}, {"letter": "C", "text": "Inhaled budesonide"}, {"letter": "D", "text": "Montelukast as preferred controller"}, {"letter": "E", "text": "Theophylline"}], "answer": "C", "explanation": "Inhaled budesonide is the preferred ICS in pregnancy (add LABA if uncontrolled). Under-treated asthma (maternal hypoxia → LBW, prematurity, preeclampsia) is riskier than the medications.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "35A", "group": 35, "stem": "Months later she presents with a severe exacerbation. ABG shows PaCO₂ 40 mm Hg. How should this be interpreted?", "options": [{"letter": "A", "text": "Expected hyperventilation from anxiety"}, {"letter": "B", "text": "Impending respiratory failure, because baseline PaCO₂ in pregnancy is ~30"}, {"letter": "C", "text": "Metabolic acidosis from ketosis"}, {"letter": "D", "text": "Normal — no concern"}, {"letter": "E", "text": "Reassuring compensated respiratory alkalosis"}], "answer": "B", "explanation": "Pregnancy causes compensated respiratory alkalosis (baseline PaCO₂ ~30); a \"normal\" 40 means CO₂ retention — impending failure.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "36", "group": 36, "stem": "A 31-year-old at 33 weeks reports numbness and tingling of the thumb, index and middle fingers of both hands, worse at night and relieved by shaking her hands. Tinel and Phalen signs are positive; strength is normal. What is first-line management?", "options": [{"letter": "A", "text": "Gabapentin"}, {"letter": "B", "text": "Surgical carpal tunnel release"}, {"letter": "C", "text": "Neutral wrist splints at night with activity modification"}, {"letter": "D", "text": "Nerve conduction studies before any treatment"}, {"letter": "E", "text": "Oral prednisone"}], "answer": "C", "explanation": "Pregnancy carpal tunnel is a clinical diagnosis; first line is a neutral night splint, activity modification and acetaminophen. It usually resolves within weeks of delivery.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "37", "group": 37, "stem": "A 30-year-old G2P1 at 26 weeks with BMI 31 has a non-fasting 50-g 1-hour glucose challenge of 152 mg/dL. What is the next step?", "options": [{"letter": "A", "text": "Hemoglobin A1c"}, {"letter": "B", "text": "Fasting 100-g 3-hour oral glucose tolerance test"}, {"letter": "C", "text": "Repeat the 50-g challenge in 4 weeks"}, {"letter": "D", "text": "No further testing; value is normal"}, {"letter": "E", "text": "Diagnose gestational diabetes and start insulin"}], "answer": "B", "explanation": "Two-step: 50-g GCT ≥135–140 → fasting 100-g 3-h OGTT. A1c is unreliable in pregnancy and never the GDM screen.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Pre-existing and gestational diabetes", "section": "Diabetes & Infections in Pregnancy"}, {"id": "37A", "group": 37, "stem": "Her 3-hour OGTT values are shown. [[LABS]] What is the interpretation?", "options": [{"letter": "A", "text": "Gestational diabetes — begin nutrition therapy, exercise and self-monitoring of glucose 4×/day"}, {"letter": "B", "text": "Inconclusive — repeat the OGTT"}, {"letter": "C", "text": "Pre-existing type 2 diabetes — start insulin immediately"}, {"letter": "D", "text": "Impaired fasting glucose only — repeat at 32 weeks"}, {"letter": "E", "text": "Normal — no gestational diabetes"}], "answer": "A", "explanation": "≥2 values met or exceeded = GDM (Carpenter-Coustan 95/180/155/140). Fasting 98 and 1-h 186 exceed thresholds. First line: medical nutrition therapy, exercise, SMBG fasting + 2 h after meals.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Pre-existing and gestational diabetes", "section": "Diabetes & Infections in Pregnancy", "labs": [{"test": "Fasting glucose", "result": "98 mg/dL", "range": "<95 mg/dL"}, {"test": "1-hour glucose", "result": "186 mg/dL", "range": "<180 mg/dL"}, {"test": "2-hour glucose", "result": "150 mg/dL", "range": "<155 mg/dL"}, {"test": "3-hour glucose", "result": "128 mg/dL", "range": "<140 mg/dL"}]}, {"id": "37B", "group": 37, "stem": "After 1 week of diet and exercise, 40% of her glucose values are above target. What is the preferred next step?", "options": [{"letter": "A", "text": "Continue diet for another month"}, {"letter": "B", "text": "Glyburide"}, {"letter": "C", "text": "Schedule cesarean at 34 weeks"}, {"letter": "D", "text": "Insulin"}, {"letter": "E", "text": "Metformin"}], "answer": "D", "explanation": "Not at goal (≥30% of values over target in 1 wk) → insulin preferred (does not cross the placenta); metformin or glyburide only if unable/non-adherent with insulin.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Pre-existing and gestational diabetes", "section": "Diabetes & Infections in Pregnancy"}, {"id": "37C", "group": 37, "stem": "Which postpartum follow-up is recommended?", "options": [{"letter": "A", "text": "No follow-up — GDM resolves after delivery"}, {"letter": "B", "text": "HbA1c at the 6-week visit only"}, {"letter": "C", "text": "Annual 100-g OGTT"}, {"letter": "D", "text": "Fasting glucose every 10 years"}, {"letter": "E", "text": "75-g OGTT & Infections in Pregnancy"}, {"id": "39", "group": 39, "stem": "A 24-year-old kindergarten teacher at 16 weeks has joint aches. Several children in her class have \"slapped cheek\" rashes. What is the most appropriate test?", "options": [{"letter": "A", "text": "Rubella titer"}, {"letter": "B", "text": "No testing — parvovirus does not affect pregnancy"}, {"letter": "C", "text": "Toxoplasma IgM/IgG"}, {"letter": "D", "text": "CMV PCR of urine"}, {"letter": "E", "text": "Parvovirus B19 IgG and IgM"}], "answer": "E", "explanation": "Exposure to fifth disease → parvovirus IgG/IgM (IgM+ = recent infection; IgG+/IgM− = immune). No routine screening.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "39A", "group": 39, "stem": "IgM is positive. Serial ultrasound with MCA Doppler at 22 weeks shows fetal anemia with ascites and skin edema. What is the management?", "options": [{"letter": "A", "text": "Immediate cesarean delivery"}, {"letter": "B", "text": "Intrauterine transfusion"}, {"letter": "C", "text": "Spiramycin"}, {"letter": "D", "text": "IV acyclovir"}, {"letter": "E", "text": "Termination is the only option"}], "answer": "B", "explanation": "Parvovirus attacks fetal RBC precursors → severe anemia → non-immune hydrops; fetal anemia/hydrops → intrauterine transfusion.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "40", "group": 40, "stem": "A 30-year-old at her first prenatal visit is HBsAg-positive with a high HBV viral load. Which plan best prevents vertical transmission?", "options": [{"letter": "A", "text": "Tenofovir for the mother and HBV vaccine + HBIG to the newborn within 12 hours of birth"}, {"letter": "B", "text": "No intervention; HBV is not transmitted vertically"}, {"letter": "C", "text": "Scheduled cesarean delivery"}, {"letter": "D", "text": "Interferon during pregnancy"}, {"letter": "E", "text": "Avoid breastfeeding and give the newborn HBIG at 2 months"}], "answer": "A", "explanation": "HBV transmits mainly intrapartum. Mother: tenofovir if viral load high. Newborn (the key step): HBV vaccine + HBIG within 12 h. Not a C-section indication.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "41", "group": 41, "stem": "A 28-year-old at 36 weeks with HIV has a viral load of 12,000 copies/mL despite ART. Which delivery and feeding plan is recommended?", "options": [{"letter": "A", "text": "Cesarean delivery and breastfeeding"}, {"letter": "B", "text": "Cesarean delivery and avoid breastfeeding"}, {"letter": "C", "text": "Vaginal delivery and avoid breastfeeding"}, {"letter": "D", "text": "Vaginal delivery and breastfeeding"}, {"letter": "E", "text": "Induction at 34 weeks"}], "answer": "B", "explanation": "Delivery route is based on viral load — high VL → cesarean. In the US, avoid breastfeeding (HIV transmits in utero, intrapartum AND via breast milk).", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "42", "group": 42, "stem": "A 29-year-old at 28 weeks has fever, myalgias, headache and diarrhea 1 week after eating deli meats and unpasteurized soft cheese. Blood cultures grow gram-positive rods. What is the treatment?", "options": [{"letter": "A", "text": "Oseltamivir"}, {"letter": "B", "text": "Oral ciprofloxacin"}, {"letter": "C", "text": "IV ampicillin plus gentamicin"}, {"letter": "D", "text": "Supportive care only"}, {"letter": "E", "text": "Ceftriaxone"}], "answer": "C", "explanation": "Listeria monocytogenes (foodborne → transplacental; miscarriage, stillbirth, neonatal sepsis) → IV ampicillin + gentamicin. Notifiable.", "objective": jective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "47", "group": 47, "stem": "A 34-year-old with poorly controlled gestational diabetes and an estimated fetal weight of 4,300 g has a prolonged second stage. The fetal head delivers and then retracts against the perineum; gentle traction fails to deliver the anterior shoulder. After calling for help, what is the first maneuver?", "options": [{"letter": "A", "text": "Firm downward traction on the head"}, {"letter": "B", "text": "Zavanelli maneuver"}, {"letter": "C", "text": "McRoberts maneuver with suprapubic pressure"}, {"letter": "D", "text": "Fundal pressure"}, {"letter": "E", "text": "Deliberate clavicle fracture"}], "answer": "C", "explanation": "Shoulder dystocia (turtle sign): never pull down/laterally, no fundal pressure. McRoberts (hyperflex legs) + suprapubic pressure → posterior arm/rotational maneuvers → Gaskin; Zavanelli/clavicle fracture are last resorts.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "47A", "group": 47, "stem": "After delivery, the newborn's right arm is adducted and internally rotated with the wrist flexed. What is the most likely injury?", "options": [{"letter": "A", "text": "Clavicle fracture"}, {"letter": "B", "text": "Humeral fracture"}, {"letter": "C", "text": "Erb's (upper brachial plexus) palsy"}, {"letter": "D", "text": "Klumpke palsy"}, {"letter": "E", "text": "Cephalohematoma"}], "answer": "C", "explanation": "Fetal complications of shoulder dystocia include brachial plexus (Erb's) palsy — the \"waiter's tip\" posture — clavicle/humerus fracture and hypoxia.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "48", "group": 48, "stem": "A 29-year-old delivers twins vaginally after a prolonged oxytocin induction. Twenty minutes after the placentas deliver, she has lost 1,200 mL of blood. HR 118, BP 104/66. The fundus is soft, boggy and above the umbilicus. What are the first steps?", "options": [{"letter": "A", "text": "Methylergonovine IM as the first agent"}, {"letter": "B", "text": "Bimanual uterine massage, empty the bladder, and IV oxytocin (plus tranexamic acid)"}, {"letter": "C", "text": "Immediate hysterectomy"}, {"letter": "D", "text": "Observe; blood loss is normal for twins"}, {"letter": "E", "text": "Uterine artery embolization"}], "answer": "B", "explanation": "PPH (>1,000 mL) — Tone (atony) is ~70–80%. First line: bimanual massage/compression, empty the bladder, explore the cavity, IV oxytocin; TXA 1 g IV within 3 h.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "48A", "group": 48, "stem": "Bleeding continues despite oxytocin. She has preeclampsia (BP now 158/104) and a history of asthma. Which uterotonic is most appropriate?", "options": [{"letter": "A", "text": "Misoprostol 800–1,000 mcg"}, {"letter": "B", "text": "Methylergonovine"}, {"letter": "C", "text": "Carboprost"}, {"letter": "D", "text": "Terbutaline"}, {"letter": "E", "text": "Nifedipine"}], "answer": "A", "explanation": "Methylergonovine is avoided in HTN/preeclampsia; carboprost is avoided in asthma → misoprostol.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "48B", "group": 48, "stem": "Bleeding is controlled after balloon tamponade and 6 units of blood. Six weeks later she reports that her milk never came in, persistent amenorrhea, fatigue and cold intolerance. Labs are shown. [[LABS]] What is the diagnosis?", "options": [{"letter": "A", "text": "Primary adrenal insufficiency (Addison disease)"}, {"letter": "B", "text": "Lymphocytic hypophysitis"}, {"letter": "C", "text": "Postpartum thyroiditis"}, {"letter": "D", "text": "Primary hypothyroidism"}, {"letter": "E", "text": "Sheehan syndrome"}], "answer": "E", "explanation": "Failure to lactate (first sign, ↓ prolactin) after massive PPH + low pituitary AND low target-gland hormones = Sheehan syndrome (postpartum pituitary necrosis).", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications", "labs": [{"test": "8 AM cortisol", "result": "2.1 µg/dL", "range": "5–23 µg/dL"}, {"test": "ACTH", "result": "Low", "range": "Normal"}, {"test": "Free T4", "result": "0.6 ng/dL", "range": "0.8–1.8 ng/dL"}, {"test": "TSH", "result": "0.9 mU/L", "range": "0.4–4.0 mU/L"}, {"test": "Prolactin", "result": "Low", "range": "Normal"}]}, {"id": "48C", "group": 48, "stem": "Which hormone must be replaced first?", "options": [{"letter": "A", "text": "Levothyroxine"}, {"letter": "B", "text": "Estrogen/progestin"}, {"letter": "C", "text": "Desmopressin"}, {"letter": "D", "text": "Hydrocortisone"}, {"letter": "E", "text": "Growth hormone"}], "answer": "D", "explanation": "Replace glucocorticoid FIRST, then levothyroxine — giving thyroid hormone first can precipitate adrenal crisis.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "49", "group": 49, "stem": "A 32-year-old undergoing a trial of labor after one low-transverse cesarean is augmented with oxytocin. She suddenly reports severe abdominal pain, the fetal heart rate drops to 70 bpm, and the presenting part is no longer palpable at the prior station. What is the most likely diagnosis and management?", "options": [{"letter": "A", "text": "Normal second stage — continue pushing"}, {"letter": "B", "text": "Placental abruption — amniotomy"}, {"letter": "C", "text": "Cord prolapse — knee-chest position and observation"}, {"letter": "D", "text": "Uterine rupture — immediate laparotomy/cesarean delivery"}, {"letter": "E", "text": "Uterine atony — oxytocin bolus"}], "answer": "D", "explanation": "Fetal bradycardia + loss of station + pain in a scarred uterus = rupture until proven otherwise → emergency laparotomy, deliver, repair or hysterectomy, resuscitate.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "49A", "group": 49, "stem": "Which cervical ripening agent should have been avoided in a patient with a prior cesarean?", "options": [{"letter": "A", "text": "Membrane sweeping"}, {"letter": "B", "text": "Amniotomy"}, {"letter": "C", "text": "Misoprostol (prostaglandin)"}, {"letter": "D", "text": "Laminaria"}, {"letter": "E", "text": "Cook double balloon"}], "answer": "C", "explanation": "No prostaglandin ripening (misoprostol, PGE2) after prior cesarean/uterine surgery — rupture risk.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  const flagged = {};        // question id -> true, set by the learner at any point (never affects score)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  // Lab values as a table. q.labs is [{test, result, range}]. If the stem contains
  // the marker [[LABS]] the table goes there (so the vignette can continue after
  // the labs); otherwise it follows the stem.
  function labsHtml(q) {
    if (!q.labs || !q.labs.length) return '';
    const hasRange = q.labs.some(l => l.range);
    let html = '<table class="labs"><thead><tr><th>Test</th><th>Result</th>' +
      (hasRange ? '<th>Reference Range</th>' : '') + '</tr></thead><tbody>';
    q.labs.forEach(l => {
      html += '<tr><td>' + esc(l.test) + '</td><td class="res">' + esc(l.result) + '</td>' +
        (hasRange ? '<td class="ref">' + (l.range ? '(' + esc(String(l.range).replace(/^\(|\)$/g, '')) + ')' : '') + '</td>' : '') + '</tr>';
    });
    return html + '</tbody></table>';
  }

  function stemHtml(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    const table = labsHtml(q);
    if (table && stem.indexOf('[[LABS]]') !== -1) {
      const parts = stem.split('[[LABS]]');
      return '<div class="stem">' + esc(parts[0].replace(/\s+$/, '')) + '</div>' + table +
        (parts[1] && parts[1].trim() ? '<div class="stem">' + esc(parts[1].replace(/^\s+/, '')) + '</div>' : '');
    }
    return '<div class="stem">' + esc(stem.replace('[[LABS]]', '')) + '</div>' + table;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += stemHtml(q);
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += flagHtml(q);
    html += '</div>';
    return html;
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly (or not understood) can still be carried into the next round
  // of study. Flagging never changes the score — it is a bookmark, not a second answer.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">⚑ ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '⚑ ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {                 // answered wrong, or flagged by the learner
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          stemHtml(g[0]) + '</div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  // Plain-text stem with the lab table flattened to one line per lab
  function stemText(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    if (!q.labs || !q.labs.length) return stem.replace('[[LABS]]', '').trim();
    const rows = q.labs.map(l => '  ' + l.test + ': ' + l.result + (l.range ? ' (ref ' + String(l.range).replace(/^\(|\)$/g, '') + ')' : '')).join('\n');
    const i = stem.indexOf('[[LABS]]');
    const before = i === -1 ? stem : stem.slice(0, i);
    const hasHeader = /\b(labs|laboratory (studies|results|values))\s*:?\s*$/i.test(before);   // stem already says "Labs:"
    const block = (hasHeader ? '' : 'Labs:\n') + rows;
    return (i !== -1 ? before.replace(/\s+$/, '') + '\n' + block + '\n' + stem.slice(i + 8).replace(/^\s+/, '') : stem + '\n' + block).trim();
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + stemText(group[0]));
      lines.push(stemText(q));
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered' : 'My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
