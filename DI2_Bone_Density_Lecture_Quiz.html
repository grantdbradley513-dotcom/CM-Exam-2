<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }

fficient evidence (Grade I)** to assess screening in men.", "objective": "", "remediation": {"steps": [{"teach": "The guidelines **differ on men**: USPSTF can't say; NOF screens men ≥70.", "stem": "Which body screens all men ≥70?", "options": [{"letter": "A", "text": "NOF"}, {"letter": "B", "text": "USPSTF"}, {"letter": "C", "text": "Neither"}], "answer": "A", "explanation": "**NOF** (2015) screens men ≥70; USPSTF does not commit.", "clarify": [{"stem": "Grade I means:", "options": [{"letter": "A", "text": "Insufficient evidence"}, {"letter": "B", "text": "Recommend against"}], "answer": "A", "explanation": "**I = insufficient** evidence to assess benefit vs harm."}]}], "checkpoints": [{"stem": "NOF (2015) → screen all men at age:", "options": [{"letter": "A", "text": "≥70"}, {"letter": "B", "text": "≥50"}, {"letter": "C", "text": "≥65"}, {"letter": "D", "text": "≥80"}], "answer": "A", "explanation": "NOF: men **≥70** (and 50–69 with risk factors)."}, {"stem": "72 yo man, no risks, asks about DXA → USPSTF stance:", "options": [{"letter": "A", "text": "Grade B, screen"}, {"letter": "B", "text": "Recommend against"}, {"letter": "C", "text": "Screen every year"}, {"letter": "D", "text": "Insufficient evidence"}], "answer": "D", "explanation": "USPSTF = **Grade I** for men."}]}}, {"id": "12", "group": 12, "section": "Screening — NOF", "topic": "Osteoporosis screening", "skill": "Diagnostics & imaging", "stem": "What prednisone dose and duration meet the National Osteoporosis Foundation threshold for medication-related osteoporosis risk?", "options": [{"letter": "A", "text": "≥20 mg for ≥1 month"}, {"letter": "B", "text": "≥5 mg for ≥2 weeks"}, {"letter": "C", "text": "≥5 mg for ≥3 months"}, {"letter": "D", "text": "Any dose for ≥1 year"}], "answer": "C", "explanation": "NOF lists **prednisone ≥5 mg for ≥3 months** as a risk factor warranting earlier screening.", "objective": "", "remediation": {"steps": [{"teach": "The NOF threshold is a **low dose** but a **prolonged duration**.", "stem": "Prednisone risk threshold dose:", "options": [{"letter": "A", "text": "≥20 mg/day"}, {"letter": "B", "text": "≥5 mg/day"}, {"letter": "C", "text": "≥60 mg/day"}], "answer": "B", "explanation": "**≥5 mg**.", "clarify": [{"stem": "Prednisone risk threshold duration:", "options": [{"letter": "A", "text": "≥3 months"}, {"letter": "B", "text": "≥2 weeks"}], "answer": "A", "explanation": "**≥3 months**."}]}], "checkpoints": [{"stem": "55 yo man on prednisone 10 mg × 6 months → NOF:", "options": [{"letter": "A", "text": "Screen with DXA"}, {"letter": "B", "text": "No screening until 70"}, {"letter": "C", "text": "Grade I, no action"}, {"letter": "D", "text": "Check SPEP only"}], "answer": "A", "explanation": "Men 50–69 with a risk factor (prednisone ≥5 mg ≥3 mo) → **DXA**."}, {"stem": "Prednisone 5 mg daily × 4 months → meets NOF risk?", "options": [{"letter": "A", "text": "No — dose too low"}, {"letter": "B", "text": "No — too short"}, {"letter": "C", "text": "Only if male"}, {"letter": "D", "text": "Yes"}], "answer": "D", "explanation": "**≥5 mg for ≥3 months** is met."}]}}, {"id": "13", "group": 13, "section": "Screening — NOF", "topic": "Secondary osteoporosis", "skill": "Disease process", "stem": "What is the most common cause of secondary osteoporosis?", "options": [{"letter": "A", "text": "Exogenous glucocorticoids"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Hyperthyroidism"}, {"letter": "D", "text": "Celiac disease"}], "answer": "A", "explanation": "**Exogenous steroid (glucocorticoid) use** is the most common cause of secondary osteoporosis.", "objective": "List common conditions and medications that contribute to low bone density", "remediation": {"steps": [{"teach": "'Secondary' osteoporosis = bone loss caused by a **drug or disease**. The lecture names one cause as the MCC.", "stem": "Secondary osteoporosis is caused by:", "options": [{"letter": "A", "text": "A drug or another disease"}, {"letter": " s and medications that contribute to low bone density", "remediation": {"steps": [{"teach": "Think about **why**: celiac → malabsorption; PHPT → PTH pulls calcium from bone; RA → inflammation and steroids.", "stem": "Celiac disease lowers BMD mainly by:", "options": [{"letter": "A", "text": "Excess bone formation"}, {"letter": "B", "text": "Malabsorption"}, {"letter": "C", "text": "High estrogen"}], "answer": "B", "explanation": "Celiac causes **malabsorption** (calcium/vitamin D).", "clarify": [{"stem": "Which arthritis is on the NOF list?", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Rheumatoid arthritis"}], "answer": "B", "explanation": "**RA** is a NOF secondary-osteoporosis condition."}]}], "checkpoints": [{"stem": "Endocrine condition on the NOF risk list →", "options": [{"letter": "A", "text": "Hypothyroidism"}, {"letter": "B", "text": "Type 2 diabetes"}, {"letter": "C", "text": "Hyperprolactinoma"}, {"letter": "D", "text": "Primary hyperparathyroidism"}], "answer": "D", "explanation": "NOF lists **primary hyperparathyroidism**."}, {"stem": "Inflammatory arthritis on the NOF list →", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Gout"}, {"letter": "C", "text": "Rheumatoid arthritis"}, {"letter": "D", "text": "Pseudogout"}], "answer": "C", "explanation": "**RA**."}]}}, {"id": "15", "group": 15, "section": "T score vs Z score", "topic": "T-score vs Z-score", "skill": "Identification", "stem": "With which reference population does a T-score compare the patient's bone mineral density?", "options": [{"letter": "A", "text": "Age-matched adults (peers)"}, {"letter": "B", "text": "The patient's own prior scan"}, {"letter": "C", "text": "Young healthy adults at peak bone mass"}, {"letter": "D", "text": "Same-sex adults over age 65"}], "answer": "C", "explanation": "T-score = SD vs **young, healthy adults at peak bone mass**; Z-score = SD vs age-matched peers.", "objective": "Differentiate between a ns BMD is:", "options": [{"letter": "A", "text": "2 SD below the young-adult mean"}, {"letter": "B", "text": "2 g/cm² below normal"}, {"letter": "C", "text": "2% below normal"}], "answer": "A", "explanation": "**2 standard deviations** below the reference.", "clarify": [{"stem": "Raw BMD from DXA is reported in:", "options": [{"letter": "A", "text": "SD"}, {"letter": "B", "text": "g/cm²"}], "answer": "B", "explanation": "Raw BMD = **g/cm²**; scores are SD."}]}], "checkpoints": [{"stem": "Value NOT directly comparable between DXA manufacturers →", "options": [{"letter": "A", "text": "T-score"}, {"letter": "B", "text": "Z-score"}, {"letter": "C", "text": "SD from the mean"}, {"letter": "D", "text": "Raw BMD in g/cm²"}], "answer": "D", "explanation": "Raw **g/cm²** differs by manufacturer; T/Z can be compared."}, {"stem": "T-score −1.5 means BMD is →", "options": [{"letter": "A", "text": "1.5 SD above peak mean"}, {"letter": "B", "text": "1.5 g/cm² low"}, {"letter": "C", "text": "1.5 SD below peak mean"}, {"letter": "D", "text": "15% low"}], "answer": "C", "explanation": "**1.5 SD below** the young-adult mean."}]}}, {"id": "17", "group": 17, "section": "T-score criteria", "topic": "DXA interpretation", "skill": "Diagnostics & imaging", "stem": "How is a DXA T-score of −0.8 interpreted?", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Osteopenia"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Severe osteoporosis"}], "answer": "A", "explanation": "**Normal = T-score ≥ −1.0** (within 1 SD of the young-adult mean).", "objective": "Distinguish between normal, osteopenia, and osteoporosis based on T-score", "remediation": {"steps": [{"teach": "Cutoffs: **≥ −1.0 normal**, −1.0 to −2.5 osteopenia, **≤ −2.5** osteoporosis.", "stem": "Is −0.8 above or below −1.0?", "options": [{"letter": "A", "text": "Below (more negative)"}, {"letter": "B", "text": "Above (less negative)"}, {"letter": "C", "text": "Equal"}], "answer": "B", "explanation": "−0.8 is **above** −1.0 → normal range.", "clarify": [{"stem": "Normal T-score cutoff:", "options": [{"letter": "A", "text": "≥ −2.5"}, {"letter": "B", "text": "≥ −1.0"}], "answer": "B", "explanation": "Normal = **≥ −1.0**."}]}], "checkpoints": [{"stem": "T-score −1.3 → classification:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Severe osteoporosis"}, {"letter": "D", "text": "Osteopenia"}], "answer": "D", "explanation": "−1.3 is below −1.0 but above −2.5 → **osteopenia**; normal is ≥ −1.0."}, {"stem": "Normal BMD → T-score:", "options": [{"letter": "A", "text": "≥ −2.5"}, {"letter": "B", "text": "≥ 0"}, {"letter": "C", "text": "≥ −1.0"}, {"letter": "D", "text": "≥ +1.0"}], "answer": "C", "explanation": "**≥ −1.0**."}]}}, {"id": "18", "group": 18, "section": "T-score criteria", "topic": "DXA interpretation", "skill": "Diagnostics & imaging", "stem": "What is the diagnosis in a patient with a DXA T-score of −1.8 and no fractures?", "options": [{"letter": "A", "text": "Normal bone density"}, {"letter": "B", "text": "Osteopenia (low bone mass)"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Severe osteoporosis"}], "answer": "B", "explanation": "**Osteopenia (low bone mass) = T between −1.0 and −2.5**.", "objective": "Distinguish between normal, osteopenia, and osteoporosis based on T-score", "remediation": {"steps": [{"teach": "−1.8 is **below −1.0** but **above −2.5**.", "stem": "T-score range for osteopenia:", "options": [{"letter": "A", "text": "≥ −1.0"}, {"letter": "B", "text": "≤ −2.5"}, {"letter": "C", "text": "Between −1.0 and −2.5"}], "answer": "C", "explanation": "Osteopenia = **−1.0 to −2.5**.", "clarify": [{"stem": "Osteopenia is also called:", "options": [{"letter": "A", "text": "Osteomalacia"}, {"letter": "B", "text": "Low bone mass"}], "answer": "B", "explanation": "Osteopenia = **low bone mass**."}]}], "checkpoints": [{"stem": "Osteopenia T-score → next decision tool:", "options": [{"letter": "A", "text": "Z-score"}, {"letter": "B", "text": "SPEP"}, {"letter": "C", "text": "Repeat DXA in 1 month"}, {"letter": "D", "text": "FRAX"}], "answer": "D", "explanation": "Osteopenia → **FRAX** to decide on treatment."}, {"stem": "T-score −2.2 → classification:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Osteopenia"}, {"letter": "D", "text": "Severe osteoporosis"}], "answer": "C", "explanation": "−2.2 is between −1.0 and −2.5 → **osteopenia**."}]}}, {"id": "19", "group": 19, "section": "T-score criteria", "topic": "DXA interpretation", "skill": "Diagnostics & imaging", "stem": "What T-score meets the diagnostic threshold for osteoporosis?", "options": [{"letter": "A", "text": "≤ −1.0"}, {"letter": "B", "text": "≤ −2.0"}, {"letter": "C", "text": "≤ −2.5"}, {"letter": "D", "text": "≤ −3.5"}], "answer": "C", "explanation": "Osteoporosis = **T-score ≤ −2.5** at the femoral neck or spine.", "objective": "Distinguish between normal, osteopenia, and osteoporosis based on T-score", "remediation": {"steps": [{"teach": "Osteoporosis = BMD **2.5 or more SD below** the young-adult mean.", "stem": "T-score −2.6 at the femoral neck is:", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Normal"}], "answer": "B", "explanation": "−2.6 is ≤ −2.5 → **osteoporosis**.", "clarify": [{"stem": "Osteoporosis is diagnosed at:", "options": [{"letter": "A", "text": "Heel or phalanx"}, {"letter": "B", "text": "Femoral neck or spine"}], "answer": "B", "explanation": "**Femoral neck or spine**."}, {"stem": "−1.0 is the cutoff between:", "options": [{"letter": "A", "text": "Normal and osteopenia"}, {"letter": "B", "text": "Osteopenia and osteoporosis"}], "answer": "A", "explanation": "−1.0 separates **normal / osteopenia**; −2.5 separates osteopenia / osteoporosis."}]}], "checkpoints": [{"stem": "T-score −2.5 → classification:", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Normal"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Indeterminate"}], "answer": "C", "explanation": "≤ −2.5 includes −2.5 → **osteoporosis**."}, {"stem": "Hip T −2.8, spine T −2.3 → diagnosis:", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Osteoporosis"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Need a third site"}], "answer": "B", "explanation": "One site ≤ −2.5 is enough → **osteoporosis**."}]}}, {"id": "20", "group": 20, "section": "T-score criteria", "topic": "DXA interpretation", "skill": "Diagnostics & imaging", "stem": "How is a T-score of −2.5 or lower with one or more fragility fractures classified?", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Osteoporosis, uncomplicated"}, {"letter": "C", "text": "Osteomalacia"}, {"letter": "D", "text": "Severe (established) osteoporosis"}], "answer": "D", "explanation": "**Severe / established osteoporosis** = T ≤ −2.5 plus ≥1 fragility fracture.", "objective": "Distinguish between normal, osteopenia, and osteoporosis based on T-score", "remediation": {"steps": [{"teach": "Add a fracture on top of osteoporosis-range BMD and the severity goes **up a level**.", "stem": "T ≤ −2.5 without any fracture is:", "options": [{"letter": "A", "text": "Severe osteoporosis"}, {"letter": "B", "text": "Osteopenia"}, {"letter": "C", "text": "Osteoporosis"}], "answer": "C", "explanation": "T ≤ −2.5 alone = **osteoporosis**.", "clarify": [{"stem": "A fragility fracture results from:", "options": [{"letter": "A", "text": "Low trauma"}, {"letter": "B", "text": "High-energy trauma"}], "answer": "A", "explanation": "Fragility = **low trauma**."}]}], "checkpoints": [{"stem": "Severe osteoporosis requires T ≤ −2.5 and →", "options": [{"letter": "A", "text": "A Z-score ≤ −2.0"}, {"letter": "B", "text": "High serum calcium"}, {"letter": "C", "text": "A fragility fracture"}, {"letter": "D", "text": "Age ≥ 80"}], "answer": "C", "explanation": "Severe = osteoporosis + **fragility fracture**."}, {"stem": "T −3.0, prior vertebral compression fx from minimal trauma →", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Severe osteoporosis"}, {"letter": "C", "text": "Osteoporosis only"}, {"letter": "D", "text": "Normal"}], "answer": "B", "explanation": "T ≤ −2.5 + fragility fx = **severe/established**."}]}}, {"id": "21", "group": 21, "section": "T-score criteria", "topic": "DXA interpretation", "skill": "Disease process", "stem": "Approximately how much does fracture risk increase with each one-standard-deviation decrease in bone mineral density?", "options": [{"letter": "A", "text": "2-fold"}, {"letter": "B", "text": "10%"}, {"letter": "C", "text": "5-fold"}, {"letter": "D", "text": "10-fold"}], "answer": "A", "explanation": "Fracture risk increases **approximately 2-fold for every SD decrease** in BMD.", "objective": "", "remediation": {"steps": [{"teach": "The relationship is multiplicative: each SD lower **doubles** risk.", "stem": "Going from T −1 to T −2 multiplies fracture risk by about:", "options": [{"letter": "A", "text": "2"}, {"letter": "B", "text": "10"}, {"letter": "C", "text": "1.1"}], "answer": "A", "explanation": "Roughly **doubles** (×2).", "clarify": [{"stem": "Lower BMD means fracture risk is:", "options": [{"letter": "A", "text": "Higher"}, {"letter": "B", "text": "Lower"}], "answer": "A", "explanation": "Lower BMD → **higher** fracture risk."}]}], "checkpoints": [{"stem": "T −3 vs T −1 → fracture risk roughly:", "options": [{"letter": "A", "text": "2×"}, {"letter": "B", "text": "8×"}, {"letter": "C", "text": "4×"}, {"letter": "D", "text": "No change"}], "answer": "C", "explanation": "Two SD drops → 2 × 2 = **4-fold**."}, {"stem": "T-score criteria apply to postmenopausal women and men aged →", "options": [{"letter": "A", "text": "≥40"}, {"letter": "B", "text": "≥50"}, {"letter": "C", "text": "≥65"}, {"letter": "D", "text": "≥70"}], "answer": "B", "explanation": "Use T-score criteria in peri/postmenopausal women and **men ≥50**."}]}}, {"id": "22", "group": 22, "section": "Eval for 2° causes", "topic": "Secondary-cause lab evaluation", "skill": "Diagnostics & imaging", "stem": "Which basic laboratory panel is used to evaluate secondary causes of low bone mineral density?", "options": [{"letter": "A", "text": "Ca, PTH, SPEP, testosterone"}, {"letter": "B", "text": "Ca, 25-OH vit D, creatinine, TSH"}, {"letter": "C", "text": "CBC, ESR, ALP, cortisol"}, {"letter": "D", "text": "Ca, 1,25-OH vit D, LFTs, PTH"}], "answer": "B", "explanation": "Basic panel: **calcium, 25-hydroxyvitamin D, creatinine, and TSH** (plus review PMHx, social hx, meds).", "objective": "List the baseline lab evaluation for secondary causes of bone loss", "remediation": {"steps": [{"teach": "The basic panel is **four** labs everyone with BMD loss gets; PTH, SPEP and testosterone are **add-ons** as indicated.", "stem": "Intact PTH is added when:", "options": [{"letter": "A", "text": "Every patient"}, {"letter": "B", "text": "TSH is low"}, {"letter": "C", "text": "Calcium is high"}], "answer": "C", "explanation": "PTH is reflexed to **high calcium**, not routine.", "clarify": [{"stem": "Vitamin D test on the basic panel:", "options": [{"letter": "A", "text": "25-hydroxyvitamin D"}, {"letter": "B", "text": "1,25-dihydroxyvitamin D"}], "answer": "A", "explanation": "**25-OH D** is the one ordered."}, {"stem": "TSH screens for:", "options": [{"letter": "A", "text": "Myeloma"}, {"letter": "B", "text": "Hyperthyroidism"}], "answer": "B", "explanation": "TSH → **hyperthyroidism**."}]}], "checkpoints": [{"stem": "Which lab is an ADD-ON, not part of the basic panel?", "options": [{"letter": "A", "text": "Serum calcium"}, {"letter": "B", "text": "Serum protein electrophoresis"}, {"letter": "C", "text": "Creatinine"}, {"letter": "D", "text": "TSH"}], "answer": "B", "explanation": "**SPEP** is added only with suggestive findings."}, {"stem": "Besides labs, every pt with BMD loss needs review of →", "options": [{"letter": "A", "text": "PMHx, social hx, med list"}, {"letter": "B", "text": "Family vaccine history"}, {"letter": "C", "text": "Dental records"}, {"letter": "D", "text": "Prior MRI images"}], "answer": "A", "explanation": "Review **PMHx, social history and medications**."}]}}, {"id": "23", "group": 23, "section": "Eval for 2° causes", "topic": "Secondary-cause lab evaluation", "skill": "Disease process", "stem": "Through what mechanism does markedly elevated creatinine with reduced eGFR contribute to low bone mineral density?", "options": [{"letter": "A", "text": "Primary hyperparathyroidism"}, {"letter": "B", "text": "Secondary hypothyroidism"}, {"letter": "C", "text": "Secondary hyperparathyroidism"}, {"letter": "D", "text": "Excess vitamin D activation"}], "answer": "C", "explanation": "Renal failure causes **secondary hyperparathyroidism**, which decreases BMD — why creatinine is on the panel.", "objective": "", "remediation": {"steps": [{"teach": "**Primary** = gland itself is the problem; **secondary** = gland responding to another disease (here, the kidney).", "stem": "In renal failure, PTH rises as a response to:", "options": [{"letter": "A", "text": "Kidney disease"}, {"letter": "B", "text": "A parathyroid adenoma"}, {"letter": "C", "text": "Thyroid disease"}], "answer": "A", "explanation": "The parathyroids respond to **renal failure** → secondary.", "clarify": [{"stem": "Hyperparathyroidism effect on BMD:", "options": [{"letter": "A", "text": "Increases it"}, {"letter": "B", "text": "Decreases it"}], "answer": "B", "explanation": "PTH excess → **decreased BMD**."}]}], "checkpoints": [{"stem": "Why is creatinine on the baseline panel?", "options": [{"letter": "A", "text": "Screen for myeloma alone"}, {"letter": "B", "text": "Detect renal cause of ↑PTH"}, {"letter": "C", "text": "Dose calcium supplements"}, {"letter": "D", "text": "Measure muscle mass"}], "answer": "B", "explanation": "High Cr → renal failure → **secondary hyperparathyroidism**."}, {"stem": "Primary hyperparathyroidism → source of excess PTH:", "options": [{"letter": "A", "text": "Parathyroid gland itself"}, {"letter": "B", "text": "Kidney failure"}, {"letter": "C", "text": "Vitamin D deficiency"}, {"letter": "D", "text": "Pituitary"}], "answer": "A", "explanation": "**Primary** = the parathyroid gland is the source."}]}}, {"id": "24", "group": 24, "section": "Vitamin D testing", "topic": "Secondary-cause lab evaluation", "skill": "Diagnostics & imaging", "stem": "What is the most specific screening test for vitamin D deficiency?", "options": [{"letter": "A", "text": "Serum 1,25-dihydroxyvitamin D"}, {"letter": "B", "text": "Serum calcium"}, {"letter": "C", "text": "Intact PTH level"}, {"letter": "D", "text": "Serum 25-hydroxyvitamin D"}], "answer": "D", "explanation": "**25(OH)D (calcidiol)** is the most specific screening test — it is the major circulating and storage form.", "objective": "List the baseline lab evaluation: serum calcium and 25-hydroxyvitamin D level", "remediation": {"steps": [{"teach": "Order the **storage/circulating** form — it reflects total vitamin D status.", "stem": "Major circulating and storage form of vitamin D:", "options": [{"letter": "A", "text": "1,25-dihydroxyvitamin D"}, {"letter": "B", "text": "Vitamin D2"}, {"letter": "C", "text": "25-hydroxyvitamin D"}], "answer": "C", "explanation": "**25(OH)D** = calcidiol.", "clarify": [{"stem": "25-hydroxyvitamin D is also called:", "options": [{"letter": "A", "text": "Calcitonin"}, {"letter": "B", "text": "Calcidiol"}], "answer": "B", "explanation": "**Calcidiol**."}, {"stem": "The 25-hydroxylation step is:", "options": [{"letter": "A", "text": "Not tightly regulated"}, {"letter": "B", "text": "Tightly regulated"}], "answer": "A", "explanation": "**Not tightly regulated**, so 25(OH)D reflects supply."}]}], "checkpoints": [{"stem": "25-hydroxylation of vitamin D3 occurs in the →", "options": [{"letter": "A", "text": "Liver"}, {"letter": "B", "text": "Kidney"}, {"letter": "C", "text": "Skin"}, {"letter": "D", "text": "Parathyroid"}], "answer": "A", "explanation": "D3 is 25-hydroxylated in the **liver**."}, {"stem": "Calcidiol is →", "options": [{"letter": "A", "text": "1,25-dihydroxyvitamin D"}, {"letter": "B", "text": "Parathyroid hormone"}, {"letter": "C", "text": "Calcitonin"}, {"letter": "D", "text": "25-hydroxyvitamin D"}], "answer": "D", "explanation": "**Calcidiol = 25(OH)D**."}]}}, {"id": "25", "group": 25, "section": "Eval for 2° causes — add-ons", "topic": "Secondary-cause lab evaluation", "skill": "Diagnostics & imaging", "stem": "Which additional laboratory test should be included when evaluating low bone mineral density in a man?", "options": [{"letter": "A", "text": "Serum testosterone"}, {"letter": "B", "text": "Serum estradiol"}, {"letter": "C", "text": "Serum prolactin"}, {"letter": "D", "text": "Serum cortisol"}], "answer": "A", "explanation": "In men, add **serum testosterone** — any primary or secondary hypogonadism accelerates bone loss.", "objective": "", "remediation": {"steps": [{"teach": "Bone loss **accelerates in hypogonadal states** — menopause in women; low testosterone in men.", "stem": "Female hypogonadal state that is the classic example of bone loss:", "options": [{"letter": "A", "text": "Menopause"}, {"letter": "B", "text": "Pregnancy"}, {"letter": "C", "text": "Puberty"}], "answer": "A", "explanation": "**Menopause** is the classic example.", "clarify": [{"stem": "Primary or secondary hypogonadism in men → testosterone:", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High"}], "answer": "A", "explanation": "Both have **low testosterone**."}]}], "checkpoints": [{"stem": "Why measure testosterone in men with osteoporosis?", "options": [{"letter": "A", "text": "Detect hypogonadism"}, {"letter": "B", "text": "Detect myeloma"}, {"letter": "C", "text": "Detect hyperthyroidism"}, {"letter": "D", "text": "Detect vitamin D deficiency"}], "answer": "A", "explanation": "Low testosterone = **hypogonadism**, a secondary cause."}, {"stem": "Premature ovarian failure lowers BMD because of →", "options": [{"letter": "A", "text": "Hypercalcemia"}, {"letter": "B", "text": "Renal failure"}, {"letter": "C", "text": "Malabsorption"}, {"letter": "D", "text": "Hypogonadism"}], "answer": "D", "explanation": "Loss of sex hormones = **hypogonadal** bone loss."}]}}, {"id": "26", "group": 26, "section": "Eval for 2° causes — add-ons", "topic": "Secondary-cause lab evaluation", "skill": "Diagnostics & imaging", "stem": "What additional test should be ordered in a patient with low bone mineral density, anemia, elevated creatinine, and elevated total protein?", "options": [{"letter": "A", "text": "Intact PTH level"}, {"letter": "B", "text": "Serum protein electrophoresis"}, {"letter": "C", "text": "Serum testosterone"}, {"letter": "D", "text": "Repeat TSH"}], "answer": "B", "explanation": "Add **SPEP** to rule out **multiple myeloma** when there is anemia, ↑Cr, ↑ total protein.", "objective": "List the baseline lab evaluation ... SPEP, or others as indicated", "remediation": {"steps": [{"teach": "Anemia + kidney injury + high protein = think of a **plasma cell malignancy**.", "stem": "Anemia, ↑Cr, ↑ total protein suggest:", "options": [{"letter": "A", "text": "Hyperthyroidism"}, {"letter": "B", "text": "Multiple myeloma"}, {"letter": "C", "text": "Celiac disease"}], "answer": "B", "explanation": "Suggestive of **myeloma**.", "clarify": [{"stem": "SPEP detects:", "options": [{"letter": "A", "text": "Abnormal protein spike"}, {"letter": "B", "text": "Thyroid hormone level"}], "answer": "A", "explanation": "SPEP looks for an abnormal (monoclonal) **protein** — myeloma."}]}], "checkpoints": [{"stem": "SPEP in low-BMD workup rules out →", "options": [{"letter": "A", "text": "Multiple myeloma"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Hypogonadism"}, {"letter": "D", "text": "Celiac disease"}], "answer": "A", "explanation": "SPEP → **myeloma**."}, {"stem": "Clue triad prompting SPEP →", "options": [{"letter": "A", "text": "↑Ca, ↑PTH, kidney stones"}, {"letter": "B", "text": "Low TSH, tremor, weight loss"}, {"letter": "C", "text": "Low testosterone, ↓ libido"}, {"letter": "D", "text": "Anemia, ↑Cr, ↑ total protein"}], "answer": "D", "explanation": "**Anemia, ↑Cr, ↑TP**."}]}}, {"id": "27", "group": 27, "section": "Eval for 2° causes — add-ons", "topic": "Secondary-cause lab evaluation", "skill": "Diagnostics & imaging", "stem": "Which additional laboratory test should be ordered in a patient with low bone mineral density and elevated serum calcium?", "options": [{"letter": "A", "text": "Serum testosterone"}, {"letter": "B", "text": "SPEP"}, {"letter": "C", "text": "Intact PTH level"}, {"letter": "D", "text": "1,25-OH vitamin D"}], "answer": "C", "explanation": "Add **intact PTH** in those with ↑Ca to look for **primary hyperparathyroidism**.", "objective": "List the baseline lab evaluation ... intact-PTH", "remediation": {"steps": [{"teach": "High calcium + bone loss → is the **parathyroid** driving it?", "stem": "Hormone that raises serum calcium by pulling it from bone:", "options": [{"letter": "A", "text": "Calcitonin"}, {"letter": "B", "text": "Insulin"}, {"letter": "C", "text": "PTH"}], "answer": "C", "explanation": "**PTH** raises calcium, partly by bone resorption.", "clarify": [{"stem": "Is PTH part of the routine baseline panel?", "options": [{"letter": "A", "text": "No — only if Ca is high"}, {"letter": "B", "text": "Yes — everyone"}], "answer": "A", "explanation": "PTH is **reflexed to high calcium**."}]}], "checkpoints": [{"stem": "↑Ca and ↑ intact PTH → diagnosis:", "options": [{"letter": "A", "text": "Primary hyperparathyroidism"}, {"letter": "B", "text": "Secondary hyperparathyroidism"}, {"letter": "C", "text": "Vitamin D deficiency"}, {"letter": "D", "text": "Multiple (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(q.answer) + '. ' + fmt(optText(q, q.answer)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });
    pushCheckpoint(q, t);
  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);
    }
  }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong without a pathway, or its pathway has finished.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';
    t.trail.forEach((n, i) => { html += nodeHtml(q, n, i, interactive); });
    html += '</div>';
    return html;
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + fmt(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const wrong = answered && chosen !== q.answer;
    const tutoring = wrong && hasTutor(q);
    const t = tutor[q.id];
    // While the pathway is still in its teaching steps (exam mode), the correct answer stays hidden
    const hideKey = mode === 'exam' && tutoring && t && t.phase === 'steps';
    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Mastered after review</span>';
    else if (status === 'review') html += '<span class="badge review">Flagged for review</span>';
    else if (status === 'active') html += '<span class="badge active">Guided review in progress</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === chosen) cls += chosen === q.answer ? ' correct' : ' incorrect';
        else if (o.letter === q.answer && !hideKey) cls += ' correct';
        else if (!hideKey) cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          answers[qid] = btn.getAttribute('data-letter');
          if (answers[qid] !== q.answer && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer: ' + q.answer + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
