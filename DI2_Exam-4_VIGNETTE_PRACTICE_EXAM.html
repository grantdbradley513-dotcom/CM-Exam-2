}, {"letter": "C", "text": "Order intact PTH and a 24-hour urine calcium"}, {"letter": "D", "text": "Calculate a 10-year fracture risk with FRAX"}, {"letter": "E", "text": "Repeat the DXA in 6 months on the same machine"}], "answer": "D", "explanation": "Osteopenia is the gray zone where FRAX decides treatment. A T-score ≤ −2.5 or a fragility fracture would already qualify for therapy without FRAX.", "objective": "", "section": "Bone Density Testing"}, {"id": "58b", "group": 58, "stem": "Her 10-year FRAX risk returns as 13% for major osteoporotic fracture and 2.7% for hip fracture. What should you recommend?", "options": [{"letter": "A", "text": "Begin denosumab every 6 months"}, {"letter": "B", "text": "Begin estrogen replacement for bone protection"}, {"letter": "C", "text": "No medication; calcium, vitamin D, weight-bearing exercise"}, {"letter": "D", "text": "Refer for teriparatide injections"}, {"letter": "E", "text": "Begin alendronate 70 mg weekly"}], "answer": "C", "explanation": "Treatment thresholds in osteopenia are hip ≥ 3% or major osteoporotic ≥ 20%. At 2.7% and 13% she is below both, so the answer to 'Should I take Fosamax?' is no.", "objective": "", "section": "Bone Density Testing"}, {"id": "59", "group": 59, "stem": "A 23-year-old woman at 24 weeks tests positive for Chlamydia trachomatis on NAAT. She has no drug allergies.\n\nWhat is the appropriate treatment and follow-up?", "options": [{"letter": "A", "text": "Azithromycin 1 g orally once; test of cure at 4 weeks"}, {"letter": "B", "text": "Doxycycline 100 mg twice daily for 7 days; retest at 3 months"}, {"letter": "C", "text": "Levofloxacin daily for 7 days; test of cure at 2 weeks"}, {"letter": "D", "text": "Ceftriaxone 500 mg IM once; test of cure at 4 weeks"}, {"letter": "E", "text": "Azithromycin 1 g orally once; no further testing"}], "answer": "A", "explanation": "In pregnancy chlamydia is treated with azithromycin (doxycycline is avoided for fetal teeth/bone), with a test of cure at ~4 weeks and retest for reinfection at 3 months.", "objective": "", "section": "Routine OB Labs & Imaging"}, {"id": "60", "group": 60, "stem": "A 36-year-old woman has had no periods for 8 months and reports hot flashes and vaginal dryness. Pregnancy test is negative. FSH is 52 IU/L and estradiol is low.\n\nWhat is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hyperprolactinemia"}, {"letter": "B", "text": "Polycystic ovary syndrome"}, {"letter": "C", "text": "Functional hypothalamic amenorrhea"}, {"letter": "D", "text": "Asherman syndrome"}, {"letter": "E", "text": "Primary ovarian insufficiency"}], "answer": "E", "explanation": "High FSH with low estradiol before age 40 = primary ovarian insufficiency (primary gonadal failure pattern). Hypothalamic causes show low or inappropriately normal FSH.", "objective": "", "section": "Fertility Evaluation"}, {"id": "61", "group": 61, "stem": "A 42-year-old woman has a co-test result of high-risk HPV positive (genotype: HPV 16 and 18 negative, other high-risk types positive) with NILM cytology. She has no prior abnormal results.\n\nWhat is the most appropriate next step?", "options": [{"letter": "A", "text": "Endocervical curettage"}, {"letter": "B", "text": "Repeat HPV testing and cytology in 12 months"}, {"letter": "C", "text": "Return to routine 5-year screening"}, {"letter": "D", "text": "LEEP"}, {"letter": "E", "text": "Colposcopy now"}], "answer": "B", "explanation": "Other (non-16/18) high-risk HPV with normal cytology is repeated in 12 months; an abnormal Pap with other hrHPV would go to colposcopy.", "objective": "", "section": "Cervical Cancer Screening"}, {"id": "62", "group": 62, "stem": "A 44-year-old woman has a palpable, hard, irregular mass in the left breast. Diagnostic mammogram and targeted ultrasound are both reported as negative.\n\nWhat is the most appropriate next step?", "options": [{"letter": "A", "text": "Clinical breast exam in 3 months"}, {"letter": "B", "text": "Repeat mammogram in 6 months"}, {"letter": "C", "text": "Breast MRI in 1 year"}, {"letter": "D", "text": "Tissue biopsy or surgical referral"}, {"letter": "E", "text": "Reassure and return to routine screening"}], "answer": "D", "explanation": "Mammography misses 10–20% of cancers. A suspicious exam with negative imaging still requires biopsy or referral — you are never wrong to refer.", "objective": "", "section": "Breast Disease"}, {"id": "63", "group": 63, "stem": "A 32-year-old woman and her 34-year-old husband have been trying to conceive for 14 months with frequent unprotected intercourse. She has regular 28-day cycles with breast tenderness and bloating before each period. Neither has children. Both are healthy and take no medications.\n\nWhat is the most appropriate initial test for the male partner?", "options": [{"letter": "A", "text": "Semen analysis"}, {"letter": "B", "text": "FSH and LH levels"}, {"letter": "C", "text": "Scrotal ultrasound"}, {"letter": "D", "text": "Karyotype"}, {"letter": "E", "text": "Morning total testosterone"}], "answer": "A", "explanation": "Semen analysis is the cornerstone of male evaluation and is ordered at the start — ~40% of infertile couples have more than one factor, so both partners are evaluated together.", "objective": "", "section": "Fertility Evaluation"}, {"id": "63a", "group": 63, "stem": "The semen analysis shows a low sperm concentration with normal volume. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Start clomiphene for the husband"}, {"letter": "B", "text": "Order a karyotype"}, {"letter": "C", "text": "Refer directly for intracytoplasmic sperm injection"}, {"letter": "D", "text": "Scrotal ultrasound for varicocele"}, {"letter": "E", "text": "Repeat the semen analysis in at least 2 weeks"}], "answer": "E", "explanation": "Semen parameters vary; an abnormal result is repeated at least 2 weeks apart (2–7 days abstinence, to the lab within 1 hour) before further work-up.", "objective": "", "section": "Fertility Evaluation"}, {"id": "63b", "group": 63, "stem": "The repeat analysis confirms a low concentration. Which test is most appropriate next?", "options": [{"letter": "A", "text": "Testicular biopsy"}, {"letter": "B", "text": "Postcoital test"}, {"letter": "C", "text": "Prostate-specific antigen"}, {"letter": "D", "text": "Morning total testosterone with FSH and LH"}, {"letter": "E", "text": "Antisperm antibodies"}], "answer": "D", "explanation": "Low count → hypogonadism work-up: 8–10 AM total testosterone with FSH/LH (± prolactin). Hypogonadism is the most common cause of male-factor infertility.", "objective": "", "section": "Fertility Evaluation"}, {"id": "64", "group": 64, "stem": "A 50-year-old woman fractures her hip after stumbling while jogging. DXA shows a hip T-score of −2.8 and spine T-score of −2.3. Serum calcium is 11.4 mg/dL (8.5–10.5) and creatinine is normal.\n\nWhich test is most likely to identify the cause of her bone loss?", "options": [{"letter": "A", "text": "Serum testosterone"}, {"letter": "B", "text": "Intact parathyroid hormone"}, {"letter": "C", "text": "25-hydroxyvitamin D"}, {"letter": "D", "text": "Serum protein electrophoresis"}, {"letter": "E", "text": "Thyroid-stimulating hormone"}], "answer": "B", "explanation": "Osteoporosis with hypercalcemia points to primary hyperparathyroidism; add intact PTH. Parathyroidectomy reverses the bone loss, and a T-score < −2.5 or fragility fracture is itself a surgical criterion.", "objective": "", "section": "Bone Density Testing"}, {"id": "65", "group": 65, "stem": "A 28-year-old man has a deep, very painful 2 cm penile ulcer with a ragged gray necrotic base and a tender, fluctuant left inguinal node. HSV PCR of the ulcer is negative and RPR and treponemal tests are negative.\n\nWhat is the most likely diagnosis?", "options": [{"letter": "A", "text": "Lymphogranuloma venereum"}, {"letter": "B", "text": "Primary syphilis"}, {"letter": "C", "text": "Condylomata lata"}, {"letter": "D", "text": "Genital herpes"}, {"letter": "E", "text": "Chancroid"}], "answer": "E", "explanation": "Chancroid (H. ducreyi): very painful, non-indurated ulcer with suppurative buboes; diagnosed clinically after excluding HSV and syphilis because culture is limited. A syphilitic chancre is painless and indurated.", "objective": "", "section": "STI & Vaginitis Testing"}, {"id": "66", "group": 66, "stem": "A 19-year-old G1 at 12 weeks has a first-trimester combined screen. Nuchal translucency is 3.6 mm, free β-hCG is elevated, and PAPP-A is low. Her calculated trisomy 21 risk is 1 in 80. She wants a definitive answer as soon as possible.\n\nWhat is the most appropriate next step?", "options": [{"letter": "A", "text": "Chorionic villus sampling"}, {"letter": "B", "text": "Amniocentesis now"}, {"letter": "C", "text": "Quad screen at 16 weeks"}, {"letter": "D", "text": "Repeat nuchal translucency in 2 weeks"}, {"letter": "E", "text": "Reassure; the screen is only slightly abnormal"}], "answer": "A", "explanation": "Increased NT (> 3 mm), increased hCG, and decreased PAPP-A is the trisomy 21 pattern; risk ≥ 1 in 250 is a positive screen. CVS (9–14 weeks) is the earliest definitive test; amniocentesis is not done until 15–20 weeks.", "objective": "", "section": "Routine OB Labs & Imaging"}, {"id": "66a", "group": 66, "stem": "She is Rh-negative. What must accompany the procedure?", "options": [{"letter": "A", "text": "A repeat antibody screen 1 week later"}, {"letter": "B", "text": "Kleihauer–Betke testing before the procedure"}, {"letter": "C", "text": "Rh immune globulin at 28 weeks only"}, {"letter": "D", "text": "No additional measure; the procedure is transcervical"}, {"letter": "E", "text": "Rh immune globulin at the time of the procedure"}], "answer": "E", "explanation": "Any procedure or event with fetomaternal mixing (CVS, amniocentesis, bleeding, trauma) in an Rh-negative woman → RhoGAM at that time.", "objective": "", "section": "Routine OB Labs & Imaging"}, {"id": "67", "group": 67, "stem": "A 34-year-old man presents with infertility. He has used intramuscular testosterone obtained at his gym for 2 years. Exam shows muscular build and small, soft testes. Semen analysis shows azoospermia. FSH and LH are both below the reference range; serum testosterone is high-normal.\n\nWhat is the most likely explanation?", "options": [{"letter": "A", "text": "Prolactin-secreting pituitary adenoma"}, {"letter": "B", "text": "Klinefelter syndrome"}, {"letter": "C", "text": "Kallmann syndrome"}, {"letter": "D", "text": "Bilateral testicular obstruction"}, {"letter": "E", "text": "Exogenous testosterone suppressing GnRH, LH, and spermatogenesis"}], "answer": "E", "explanation": "Exogenous testosterone suppresses GnRH/LH and intratesticular testosterone, causing azoospermia and atrophy — it acts as a male contraceptive. Recovery after stopping takes 6–12+ months.", "objective": "", "section": "Fertility Evaluation"}, {"id": "68", "group": 68, "stem": "A 35-year-old woman reports milky discharge from both nipples for 3 months. It can be expressed from multiple ducts. She takes risperidone and her periods have become irregular. Breast exam shows no mass.\n\nWhich initial laboratory evaluation is most appropriate?", "options": [{"letter": "A", "text": "hCG, prolactin, and TSH"}, {"letter": "B", "text": "Estradiol, FSH, and LH"}, {"letter": "C", "text": "Guaiac testing of the discharge"}, {"letter": "D", "text": "Nipple discharge cytology"}, {"letter": "E", "text": "Prolactin and CA 15-3"}], "answer": "A", "explanation": "Bilateral, multi-duct, milky discharge is galactorrhea: rule out pregnancy, then check prolactin and TSH and review medications (antipsychotics, metoclopramide, SSRIs, opiates). Cytology is not recommended.", "objective": "", "section": "Breast Disease"}, {"id": "68a", "group": 68, "stem": "Prolactin is markedly elevated and remains so after the risperidone is changed. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Breast ultrasound"}, {"letter": "B", "text": "Ductography"}, {"letter": "C", "text": "Diagnostic mammogram"}, {"letter": "D", "text": "Pituitary MRI"}, {"letter": "E", "text": "Core needle biopsy"}], "answer": "D", "explanation": "Unexplained hyperprolactinemia → brain MRI for pituitary adenoma. Galactorrhea is not associated with breast cancer.", "objective": "", "section": "Breast Disease"}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  const flagged = {};        // question id -> true, set by the learner at any point (never affects score)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  // Lab values as a table. q.labs is [{test, result, range}]. If the stem contains
  // the marker [[LABS]] the table goes there (so the vignette can continue after
  // the labs); otherwise it follows the stem.
  function labsHtml(q) {
    if (!q.labs || !q.labs.length) return '';
    const hasRange = q.labs.some(l => l.range);
    let html = '<table class="labs"><thead><tr><th>Test</th><th>Result</th>' +
      (hasRange ? '<th>Reference Range</th>' : '') + '</tr></thead><tbody>';
    q.labs.forEach(l => {
      html += '<tr><td>' + esc(l.test) + '</td><td class="res">' + esc(l.result) + '</td>' +
        (hasRange ? '<td class="ref">' + (l.range ? '(' + esc(String(l.range).replace(/^\(|\)$/g, '')) + ')' : '') + '</td>' : '') + '</tr>';
    });
    return html + '</tbody></table>';
  }

  function stemHtml(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    const table = labsHtml(q);
    if (table && stem.indexOf('[[LABS]]') !== -1) {
      const parts = stem.split('[[LABS]]');
      return '<div class="stem">' + esc(parts[0].replace(/\s+$/, '')) + '</div>' + table +
        (parts[1] && parts[1].trim() ? '<div class="stem">' + esc(parts[1].replace(/^\s+/, '')) + '</div>' : '');
    }
    return '<div class="stem">' + esc(stem.replace('[[LABS]]', '')) + '</div>' + table;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += stemHtml(q);
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += flagHtml(q);
    html += '</div>';
    return html;
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly (or not understood) can still be carried into the next round
  // of study. Flagging never changes the score — it is a bookmark, not a second answer.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">⚑ ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '⚑ ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {                 // answered wrong, or flagged by the learner
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          stemHtml(g[0]) + '</div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  // Plain-text stem with the lab table flattened to one line per lab
  function stemText(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    if (!q.labs || !q.labs.length) return stem.replace('[[LABS]]', '').trim();
    const rows = q.labs.map(l => '  ' + l.test + ': ' + l.result + (l.range ? ' (ref ' + String(l.range).replace(/^\(|\)$/g, '') + ')' : '')).join('\n');
    const i = stem.indexOf('[[LABS]]');
    const before = i === -1 ? stem : stem.slice(0, i);
    const hasHeader = /\b(labs|laboratory (studies|results|values))\s*:?\s*$/i.test(before);   // stem already says "Labs:"
    const block = (hasHeader ? '' : 'Labs:\n') + rows;
    return (i !== -1 ? before.replace(/\s+$/, '') + '\n' + block + '\n' + stem.slice(i + 8).replace(/^\s+/, '') : stem + '\n' + block).trim();
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + stemText(group[0]));
      lines.push(stemText(q));
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered' : 'My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
