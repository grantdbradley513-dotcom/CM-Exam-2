<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "Complex Regional Pain Syndrome-Concept_Adaptive_Exam", "questions": [{"id": "1", "group": 1, "section": "Recognizing CRPS", "topic": "CRPS — Signs & Symptoms", "skill": "Identification", "stem": "Burning distal-limb pain weeks after a fracture, out of proportion to the injury, with swelling, mottled color change, sweating, and allodynia in a regional (non-dermatomal) distribution → Diagnosis:", "options": [{"letter": "A", "text": "Peripheral neuropathy (radiculopathy)"}, {"letter": "B", "text": "Complex regional pain syndrome"}, {"letter": "C", "text": "Primary Raynaud phenomenon"}, {"letter": "D", "text": "Acute deep vein thrombosis"}, {"letter": "E", "text": "Acute gouty arthritis"}], "answer": "B", "explanation": "**Pain disproportionate to the inciting event, regional rather than dermatomal, with vasomotor/sudomotor/trophic changes weeks after trauma** is the core picture of CRPS; apply the Budapest criteria.", "objective": "", "remediation": {"steps": [{"teach": "The condition is a **chronic, rare, post-traumatic** regional pain disorder of a **distal limb** in which pain is more severe and prolonged than the inciting event.", "stem": "Which inciting events most classically precede this syndrome?", "options": [{"letter": "A", "text": "Fracture, surgery, or crush injury"}, {"letter": "B", "text": "Viral upper respiratory infection"}, {"letter": "C", "text": "High-purine diet"}], "answer": "A", "explanation": "Triggers are trauma, fractures, surgery, crush injury, stroke, pregnancy, or idiopathic.", "clarify": [{"teach": "Onset is delayed after the trigger rather than immediate.", "stem": "Symptoms typically develop over what interval after the inciting event?", "options": [{"letter": "A", "text": "4–6 weeks"}, {"letter": "B", "text": "4–6 hours"}], "answer": "A", "explanation": "Symptoms develop over 4–6 weeks and can last years."}]}, {"teach": "The pain **does not follow a nerve root or peripheral nerve**; it is regional, and it is accompanied by vasomotor, sudomotor, and trophic changes.", "stem": "Pain following a single dermatome or peripheral nerve points toward which alternative?", "options": [{"letter": "A", "text": "Peripheral neuropathy or radiculopathy"}, {"letter": "B", "text": "The post-traumatic regional pain syndrome"}, {"letter": "C", "text": "Raynaud phenomenon"}], "answer": "A", "explanation": "Neuropathy follows a nerve or dermatome; the regional pain syndrome does not."}, {"teach": "Put the pattern together: a post-traumatic distal limb with disproportionate regional pain plus autonomic and trophic signs.", "stem": "Six weeks after a distal radius fracture, a hand has burning pain, swelling, mottled color, sweating, and allodynia not in a nerve distribution → Diagnosis:", "options": [{"letter": "A", "text": "Complex regional pain syndrome"}, {"letter": "B", "text": "Raynaud phenomenon"}, {"letter": "C", "text": "Peripheral neuropathy"}, {"letter": "D", "text": "Gout"}], "answer": "A", "explanation": "This is the guide's reverse-lookup scenario for CRPS — apply the Budapest criteria."}], "checkpoints": [{"stem": "Which feature of the pain itself is the hallmark that separates CRPS from a peripheral nerve lesion?", "options": [{"letter": "A", "text": "Regional distribution not matching a nerve or dermatome"}, {"letter": "B", "text": "Strictly dermatomal distribution"}, {"letter": "C", "text": "Episodic triphasic color change"}, {"letter": "D", "text": "Joint-centered pain with crystals"}], "answer": "A", "explanation": "CRPS pain is regional, not dermatomal."}, {"stem": "Over what interval do CRPS symptoms typically develop after the inciting trauma?", "options": [{"letter": "A", "text": "24–48 hours"}, {"letter": "B", "text": "4–6 weeks"}, {"letter": "C", "text": "4–6 months"}, {"letter": "D", "text": "18 months"}], "answer": "B", "explanation": "Onset is over 4–6 weeks; 18 months is the usual resolution horizon."}]}}, {"id": "2", "group": 2, "section": "Budapest criteria", "topic": "Budapest Criteria", "skill": "Diagnostics & imaging", "multi": true, "stem": "Which of the following are sign/symptom categories of the Budapest criteria for CRPS?", "options": [{"letter": "A", "text": "Sensory (hyperesthesia/allodynia)"}, {"letter": "B", "text": "Serologic (elevated inflammatory markers)"}, {"letter": "C", "text": "Vasomotor (temperature/color asymmetry)"}, {"letter": "D", "text": "Sudomotor/edema (sweating, swelling)"}, {"letter": "E", "text": "Motor/trophic (weakness, tremor, hair/nail changes)"}], "answers": ["A", "C", "D", "E"], "explanation": "The Budapest criteria are clinical: disproportionate pain + findings in the **sensory, vasomotor, sudomotor/edema, and motor/trophic** categories; labs are not a category and are generally unhelpful.", "objective": "", "remediation": {"steps": [{"teach": "The Budapest criteria are **clinical**: continuing pain **disproportionate to the inciting event** plus findings across symptom categories — laboratory tests are not one of the categories.", "stem": "Do inflammatory markers form one of the Budapest categories?", "options": [{"letter": "A", "text": "No — labs only help exclude mimics"}, {"letter": "B", "text": "Yes — an elevated ESR/CRP is required"}], "answer": "A", "explanation": "Inflammatory markers are generally unhelpful and are used only to exclude mimics."}, {"teach": "Two categories describe **what the patient feels** and **how the skin's blood flow looks**: abnormal sensation and abnormal vessel tone.", "stem": "Hyperesthesia and allodynia belong to which Budapest category?", "options": [{"letter": "A", "text": "Sensory"}, {"letter": "B", "text": "Vasomotor"}, {"letter": "C", "text": "Motor/trophic"}], "answer": "A", "explanation": "Hyperesthesia and allodynia (pain from light touch) are the sensory category.", "clarify": [{"teach": "Vasomotor refers to blood-vessel tone, which changes skin temperature and color.", "stem": "Temperature or color asymmetry between limbs falls under which category?", "options": [{"letter": "A", "text": "Vasomotor"}, {"letter": "B", "text": "Sudomotor/edema"}], "answer": "A", "explanation": "Temperature/color asymmetry is the vasomotor category."}]}, {"teach": "The remaining two categories cover **sweating and swelling** and **movement plus tissue growth** (hair, nails, skin).", "stem": "Decreased range of motion, weakness, tremor, and nail changes are grouped under which category?", "options": [{"letter": "A", "text": "Motor/trophic"}, {"letter": "B", "text": "Sudomotor/edema"}, {"letter": "C", "text": "Sensory"}], "answer": "A", "explanation": "Motor dysfunction and trophic (hair/nail/skin) changes form the motor/trophic category.", "clarify": [{"stem": "Hyperhidrosis and limb swelling fall under which category?", "options": [{"letter": "A", "text": "Sudomotor/edema"}, {"letter": "B", "text": "Vasomotor"}], "answer": "A", "explanation": "Sweating (sudomotor) and swelling (edema) share one category."}]}], "checkpoints": [{"stem": "Besides category findings, what else do the Budapest criteria require?", "options": [{"letter": "A", "text": "Pain disproportionate to the inciting event and no better alternative diagnosis"}, {"letter": "B", "text": "X-ray demineralization of the limb"}, {"letter": "C", "text": "A positive autoantibody panel"}, {"letter": "D", "text": "Symptoms lasting more than 18 months"}], "answer": "A", "explanation": "Disproportionate pain + category findings + no better alternative diagnosis."}, {"stem": "Reddish-blue mottled discoloration with one limb warmer than the other illustrates which category?", "options": [{"letter": "A", "text": "Sensory"}, {"letter": "B", "text": "Vasomotor"}, {"letter": "C", "text": "Motor/trophic"}, {"letter": "D", "text": "Sudomotor/edema"}], "answer": "B", "explanation": "Color and temperature asymmetry are vasomotor findings."}]}, "answer": "A,C,D,E"}, {"id": "3", "group": 3, "section": "Medications", "topic": "CRPS — Management", "skill": "Pharmacology", "stem": "Which analgesic class should be avoided in the management of CRPS?", "options": [{"letter": "A", "text": "Oral NSAIDs"}, {"letter": "B", "text": "Short-course oral corticosteroids"}, {"letter": "C", "text": "Opioids"}, {"letter": "D", "text": "Low-dose tricyclic antidepressants"}, {"letter": "E", "text": "Gabapentin"}], "answer": "C", "explanation": "**Opioids should be avoided** in CRPS; NSAIDs, a 2–4-week oral steroid course, bisphosphonates, and adjuncts such as gabapentin or low-dose TCAs/SNRIs are the medication options.", "objective": "", "remediation": {"steps": [{"teach": "CRPS medication therapy centers on **anti-inflammatory and bone-protective** agents plus neuropathic adjuncts that have mixed results.", "stem": "Which pair are first-line medications given alongside rehabilitation?", "options": [{"letter": "A", "text": "NSAIDs and a short oral steroid course"}, {"letter": "B", "text": "Long-acting opioids and muscle relaxants"}], "answer": "A", "explanation": "First-line management is CRPS-specific PT/OT + NSAIDs ± a short steroid course.", "clarify": [{"stem": "How long is the oral corticosteroid course in CRPS?", "options": [{"letter": "A", "text": "2–4 weeks"}, {"letter": "B", "text": "6 months"}], "answer": "A", "explanation": "Steroids are a short 2–4-week course; bisphosphonates run 6 months."}]}, {"teach": "Adjuncts: **gabapentin** has mixed results; **low-dose TCAs or SNRIs** may help quality of life. One analgesic class is explicitly excluded.", "stem": "Which agents have 'mixed results' but remain acceptable options in CRPS?", "options": [{"letter": "A", "text": "Gabapentin and low-dose TCAs/SNRIs"}, {"letter": "B", "text": "Opioid analgesics"}, {"letter": "C", "text": "Bisphosphonates"}], "answer": "A", "explanation": "Gabapentin and low-dose TCAs/SNRIs have mixed results; bisphosphonates have a clear indication (osteopenia)."}, {"teach": "The class to avoid is the one most often reached for in severe pain.", "stem": "Which drug class must be avoided in CRPS?", "options": [{"letter": "A", "text": "Opioids"}, {"letter": "B", "text": "NSAIDs"}, {"letter": "C", "text": "Corticosteroids"}, {"letter": "D", "text": "Bisphosphonates"}], "answer": "A", "explanation": "Opioids should be AVOIDED in CRPS."}], "checkpoints": [{"stem": "Which medication in the CRPS plan targets the associated osteopenia?", "options": [{"letter": "A", "text": "Bisphosphonate for 6 months"}, {"letter": "B", "text": "Gabapentin"}, {"letter": "C", "text": "Oral NSAID"}, {"letter": "D", "text": "Tramadol"}], "answer": "A", "explanation": "Bisphosphonates ×6 months treat CRPS-associated osteopenia."}, {"stem": "Gabapentin's role in CRPS is best described as:", "options": [{"letter": "A", "text": "Optional adjunct with mixed results"}, {"letter": "B", "text": "Cornerstone first-line therapy"}, {"letter": "C", "text": "Contraindicated"}, {"letter": "D", "text": "Reserved for refractory cases only"}], "answer": "A", "explanation": "Gabapentin has mixed results; rehab is the cornerstone and SCS/nerve blocks are the refractory options."}]}}, {"id": "4", "group": 4, "section": "Pathophysiology", "topic": "CRPS — Pathophysiology", "skill": "Disease process", "multi": true, "stem": "Which of the following are proposed components of the pathophysiology of CRPS?", "options": [{"letter": "A", "text": "Neurogenic inflammation releasing substance P and CGRP"}, {"letter": "B", "text": "Monosodium urate crystal deposition within the joint"}, {"letter": "C", "text": "Abnormal regional autonomic activation"}, {"letter": "D", "text": "Circulating IgM/IgG autoantibodies"}, {"letter": "E", "text": "Compression of a single spinal nerve root"}], "answers": ["A", "C", "D"], "explanation": "The exact cause is unknown, but CRPS is associated with **neurogenic inflammation (substance P, CGRP), abnormal regional autonomic activation, IgM/IgG autoantibodies, and central sensitization**; crystals and nerve-root compression point to gout and radiculopathy.", "objective": "", "remediation": {"steps": [{"teach": "Neurogenic inflammation means the nerves themselves release **inflammatory neuropeptides**, producing swelling, warmth, and redness.", "stem": "Which mediators does the guide name in CRPS neurogenic inflammation?", "options": [{"letter": "A", "text": "Substance P and calcitonin gene-related peptide"}, {"letter": "B", "text": "Uric acid and xanthine oxidase"}, {"letter": "C", "text": "Rheumatoid factor and anti-CCP"}], "answer": "A", "explanation": "Substance P and CGRP drive neurogenic inflammation in CRPS.", "clarify": [{"stem": "Urate crystal deposition is the mechanism of which CRPS mimic?", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "The regional pain syndrome itself"}], "answer": "A", "explanation": "Gout is joint-centered with crystals; CRPS has no crystals."}]}, {"teach": "Dysregulated **autonomic** output explains the sweating, temperature, and hair/nail changes; immune findings suggest an **autoimmune** component.", "stem": "Hyperhidrosis and limb warmth in CRPS are attributed to:", "options": [{"letter": "A", "text": "Abnormal regional autonomic activation"}, {"letter": "B", "text": "Nerve-root compression"}, {"letter": "C", "text": "A septic joint"}], "answer": "A", "explanation": "Regional vasomotor/sudomotor changes reflect abnormal autonomic activation.", "clarify": [{"stem": "Which finding supports an autoimmune component?", "options": [{"letter": "A", "text": "Circulating IgM/IgG autoantibodies"}, {"letter": "B", "text": "Crystals in synovial fluid"}], "answer": "A", "explanation": "Circulating IgM/IgG autoantibodies suggest autoimmunity."}]}, {"teach": "In chronic CRPS the **brain and spinal cord amplify** incoming nerve signals.", "stem": "Widespread skin sensitivity and severe pain in chronic CRPS result from:", "options": [{"letter": "A", "text": "Central sensitization"}, {"letter": "B", "text": "Dermatomal nerve-root compression"}, {"letter": "C", "text": "Crystal arthropathy"}], "answer": "A", "explanation": "Central sensitization amplifies signals, causing widespread sensitivity."}], "checkpoints": [{"stem": "Chronic CRPS producing widespread skin sensitivity reflects which process?", "options": [{"letter": "A", "text": "Central sensitization"}, {"letter": "B", "text": "Urate crystal deposition"}, {"letter": "C", "text": "Nerve-root compression"}, {"letter": "D", "text": "Septic arthritis"}], "answer": "A", "explanation": "Brain and spinal cord amplify nerve signals in chronic CRPS."}, {"stem": "Pain following a single nerve root rather than a region suggests:", "options": [{"letter": "A", "text": "Radiculopathy/peripheral neuropathy, not CRPS"}, {"letter": "B", "text": "CRPS"}, {"letter": "C", "text": "Raynaud phenomenon"}, {"letter": "D", "text": "Gout"}], "answer": "A", "explanation": "CRPS is regional; nerve-root patterns are neuropathy/radiculopathy."}]}, "answer": "A,C,D"}, {"id": "5", "group": 5, "section": "Differential", "topic": "CRPS — Differential Diagnosis", "skill": "Identification", "stem": "Episodic triphasic color change of the digits without allodynia → Mimic of CRPS:", "options": [{"letter": "A", "text": "Raynaud phenomenon"}, {"letter": "B", "text": "Rheumatoid arthritis"}, {"letter": "C", "text": "Peripheral neuropathy"}, {"letter": "D", "text": "Compartment syndrome"}, {"letter": "E", "text": "Conversion disorder"}], "answer": "A", "explanation": "**Raynaud = episodic triphasic color change without allodynia**; CRPS color change is persistent and mottled and is accompanied by allodynia and swelling.", "objective": "", "remediation": {"steps": [{"teach": "CRPS causes **persistent** regional discoloration with **allodynia**; its vascular mimic is **episodic**.", "stem": "Which pattern best fits CRPS rather than a vasospastic disorder?", "options": [{"letter": "A", "text": "Persistent mottled discoloration with pain from light touch"}, {"letter": "B", "text": "Episodes of white→blue→red digits that fully resolve"}], "answer": "A", "explanation": "CRPS mottling persists and comes with allodynia; episodic triphasic change is vasospasm."}, {"teach": "Other discriminators: gout is **joint-centered with crystals**; RA is **symmetric polyarthritis with serology**.", "stem": "Symmetric polyarthritis with positive serology → mimic:", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Gout"}, {"letter": "C", "text": "Raynaud phenomenon"}], "answer": "A", "explanation": "RA = symmetric polyarthritis with serology.", "clarify": [{"stem": "Joint-centered pain with synovial crystals → mimic:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Rheumatoid arthritis"}], "answer": "A", "explanation": "Gout = joint-centered with crystals."}]}, {"teach": "Episodic, triphasic, and no allodynia — identify the vascular mimic.", "stem": "Episodic triphasic digital color change without allodynia is:", "options": [{"letter": "A", "text": "Raynaud phenomenon"}, {"letter": "B", "text": "CRPS"}, {"letter": "C", "text": "Conversion disorder"}], "answer": "A", "explanation": "Raynaud phenomenon is the episodic triphasic color-change mimic."}], "checkpoints": [{"stem": "What feature of CRPS skin color change distinguishes it from Raynaud phenomenon?", "options": [{"letter": "A", "text": "Persistent mottled reddish-blue discoloration with allodynia"}, {"letter": "B", "text": "Episodic white-blue-red phases"}, {"letter": "C", "text": "A dermatomal rash"}, {"letter": "D", "text": "Erythema over a single joint"}], "answer": "A", "explanation": "CRPS discoloration is persistent, mottled, and accompanied by allodynia."}, {"stem": "Symmetric small-joint polyarthritis with positive serology is which CRPS mimic?", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Gout"}, {"letter": "C", "text": "Raynaud phenomenon"}, {"letter": "D", "text": "Stress fracture"}], "answer": "A", "explanation": "RA = symmetric polyarthritis with serology."}]}}, {"id": "6", "group": 6, "section": "Imaging", "topic": "CRPS — Imaging & Labs", "skill": "Diagnostics & imaging", "stem": "Which plain-radiograph finding may be seen in the affected limb in CRPS?", "options": [{"letter": "A", "text": "Patchy demineralization (osteopenia)"}, {"letter": "B", "text": "Marrow edema and soft-tissue inflammation"}, {"letter": "C", "text": "A discrete stress-fracture line"}, {"letter": "D", "text": "Symmetric erosive joint changes"}, {"letter": "E", "text": "Tophaceous deposits around joints"}], "answer": "A", "explanation": "**X-ray may show patchy bone demineralization (osteopenia)** and **MRI may show inflammation/edema**, but neither is required — the diagnosis is clinical.", "objective": "", "remediation": {"steps": [{"teach": "Imaging in CRPS is **optional**; the diagnosis rests on **clinical criteria**.", "stem": "Is imaging required to diagnose CRPS?", "options": [{"letter": "A", "text": "No — the diagnosis is clinical"}, {"letter": "B", "text": "Yes — MRI must confirm it"}], "answer": "A", "explanation": "Imaging is not necessary; Budapest criteria are clinical."}, {"teach": "Two modalities can show supportive changes: one shows loss of **bone density**, the other **soft-tissue inflammation**.", "stem": "Which modality may show inflammation/edema in CRPS?", "options": [{"letter": "A", "text": "MRI"}, {"letter": "B", "text": "Plain X-ray"}, {"letter": "C", "text": "Ultrasound"}], "answer": "A", "explanation": "MRI may show evidence of inflammation/edema.", "clarify": [{"stem": "Which modality shows loss of bone mineral in the limb?", "options": [{"letter": "A", "text": "Plain X-ray"}, {"letter": "B", "text": "MRI"}], "answer": "A", "explanation": "X-ray shows patchy demineralization."}]}, {"teach": "Name the bone change seen on X-ray.", "stem": "The X-ray finding described in CRPS is:", "options": [{"letter": "A", "text": "Patchy bone demineralization"}, {"letter": "B", "text": "Joint erosions"}, {"letter": "C", "text": "A fracture line"}], "answer": "A", "explanation": "Patchy demineralization (osteopenia) of the affected limb."}], "checkpoints": [{"stem": "MRI of a CRPS-affected limb may show:", "options": [{"letter": "A", "text": "Inflammation/edema"}, {"letter": "B", "text": "Patchy demineralization"}, {"letter": "C", "text": "Chondrocalcinosis"}, {"letter": "D", "text": "Urate tophi"}], "answer": "A", "explanation": "MRI shows inflammation/edema; X-ray shows demineralization."}, {"stem": "The role of inflammatory markers in a CRPS workup is:", "options": [{"letter": "A", "text": "Generally unhelpful; used only to exclude mimics"}, {"letter": "B", "text": "Required to make the diagnosis"}, {"letter": "C", "text": "To confirm the Budapest criteria"}, {"letter": "D", "text": "To predict chronicity"}], "answer": "A", "explanation": "Labs are not routinely done and serve only to exclude mimics."}]}}, {"id": "7", "group": 7, "section": "Stages", "topic": "CRPS — Signs & Symptoms", "skill": "Complications", "stem": "Which feature characterizes persistent (chronic) CRPS rather than early CRPS?", "options": [{"letter": "A", "text": "Obvious swelling, warmth, and red-blue mottling"}, {"letter": "B", "text": "Increased hair growth with marked hyperhidrosis"}, {"letter": "C", "text": "Less inflammation, more pain, weakness, tremor"}, {"letter": "D", "text": "Pain beginning within hours of the injury"}, {"letter": "E", "text": "Pain confined strictly to one dermatome"}], "answer": "C", "explanation": "**Persistent CRPS: reduced visible inflammation but increased burning/shock-like pain, motor dysfunction (↓ROM, weakness, tremor), hyperesthesia/allodynia, and trophic changes**; early CRPS is the obviously inflamed, warm, sweaty, hairy limb.", "objective": "", "remediation": {"steps": [{"teach": "Early CRPS (the first months) looks **inflamed**.", "stem": "Which cluster describes early CRPS?", "options": [{"letter": "A", "text": "Swelling, warmth, mottled color, sweating, increased hair"}, {"letter": "B", "text": "Weakness, tremor, reduced ROM with little swelling"}], "answer": "A", "explanation": "Early CRPS shows obvious inflammation with hyperhidrosis and increased hair growth."}, {"teach": "As the syndrome persists, inflammation **fades** while pain **intensifies** and the limb becomes **less functional**.", "stem": "Which motor findings appear in persistent CRPS?", "options": [{"letter": "A", "text": "Decreased ROM, weakness, tremor"}, {"letter": "B", "text": "Fasciculations in one dermatome"}, {"letter": "C", "text": "Symmetric joint swelling"}], "answer": "A", "explanation": "Motor dysfunction — ↓ROM and/or strength, tremors — marks persistent CRPS.", "clarify": [{"stem": "Pain produced by light touch is called:", "options": [{"letter": "A", "text": "Allodynia"}, {"letter": "B", "text": "Paresthesia"}], "answer": "A", "explanation": "Allodynia = pain from a normally non-painful stimulus."}]}, {"teach": "Contrast the two stages.", "stem": "Less visible inflammation but more burning pain → stage:", "options": [{"letter": "A", "text": "Persistent CRPS"}, {"letter": "B", "text": "Early CRPS"}], "answer": "A", "explanation": "Persistent CRPS = less inflammation, more pain."}], "checkpoints": [{"stem": "Which pain qualities are described in persistent CRPS?", "options": [{"letter": "A", "text": "Burning, tingling, shock-like, worse with activity"}, {"letter": "B", "text": "Dull aching relieved by activity"}, {"letter": "C", "text": "Episodic and triphasic"}, {"letter": "D", "text": "Morning stiffness over an hour"}], "answer": "A", "explanation": "Persistent CRPS pain is burning, tingling, shock-like and may worsen with activity."}, {"stem": "In the ~80% whose pain resolves naturally, improvement typically begins:", "options": [{"letter": "A", "text": "4–15 months after onset"}, {"letter": "B", "text": "Within the first week"}, {"letter": "C", "text": "Only after 18 months"}, {"letter": "D", "text": "Never without surgery"}], "answer": "A", "explanation": "Improvement begins 4–15 months after onset and almost never later than 18 months."}]}}, {"id": "8", "group": 8, "section": "Management plan", "topic": "CRPS — Management", "skill": "Management", "multi": true, "stem": "Which of the following are components of the recommended management plan for CRPS?", "options": [{"letter": "A", "text": "CRPS-specific physical and occupational therapy for ~6 months"}, {"letter": "B", "text": "Prolonged immobilization and splinting of the affected limb"}, {"letter": "C", "text": "Oral NSAIDs"}, {"letter": "D", "text": "Scheduled long-acting opioid analgesia"}, {"letter": "E", "text": "Bisphosphonate therapy for about 6 months"}], "answers": ["A", "C", "E"], "explanation": "Management = **~6 months of CRPS-specific PT/OT (early mobilization, desensitization, mirror therapy), NSAIDs, a 2–4-week oral steroid course, and 6 months of bisphosphonates**; opioids are avoided and the limb is mobilized, not immobilized.", "objective": "", "remediation": {"steps": [{"teach": "Rehabilitation is the **cornerstone**: the limb is moved, desensitized, and retrained rather than rested.", "stem": "Which rehab approach is correct for CRPS?", "options": [{"letter": "A", "text": "Early mobilization, desensitization, graded motor imagery/mirror therapy"}, {"letter": "B", "text": "Strict rest and splinting until the pain resolves"}], "answer": "A", "explanation": "CRPS-specific PT/OT uses early mobilization and desensitization; immobilization is not part of the plan.", "clarify": [{"stem": "Typical duration of CRPS-specific PT/OT?", "options": [{"letter": "A", "text": "~6 months"}, {"letter": "B", "text": "~2 weeks"}], "answer": "A", "explanation": "About 6 months of CRPS-specific PT/OT."}]}, {"teach": "Medications pair an **anti-inflammatory** with a **short steroid course**, plus an agent for the **osteopenia**.", "stem": "Which agent treats the osteopenia associated with CRPS?", "options": [{"letter": "A", "text": "Bisphosphonate"}, {"letter": "B", "text": "Opioid"}, {"letter": "C", "text": "Gabapentin"}], "answer": "A", "explanation": "Bisphosphonates for 6 months treat the osteopenia.", "clarify": [{"stem": "Oral NSAIDs in CRPS are:", "options": [{"letter": "A", "text": "Part of first-line management"}, {"letter": "B", "text": "Contraindicated"}], "answer": "A", "explanation": "First-line = PT/OT + NSAIDs ± short steroid course."}]}, {"teach": "One analgesic class is explicitly excluded from the plan.", "stem": "Scheduled opioids in CRPS are:", "options": [{"letter": "A", "text": "To be avoided"}, {"letter": "B", "text": "First-line therapy"}, {"letter": "C", "text": "Reserved for osteopenia"}], "answer": "A", "explanation": "Opioids should be AVOIDED."}], "checkpoints": [{"stem": "First-line management of CRPS is best summarized as:", "options": [{"letter": "A", "text": "CRPS-specific PT/OT + NSAIDs ± a short steroid course"}, {"letter": "B", "text": "Opioids + splinting"}, {"letter": "C", "text": "Spinal cord stimulator placement"}, {"letter": "D", "text": "Antibiotics + rest"}], "answer": "A", "explanation": "Rehab plus NSAIDs ± a short oral steroid course is first-line."}, {"stem": "How long is the bisphosphonate course in CRPS?", "options": [{"letter": "A", "text": "6 months"}, {"letter": "B", "text": "2–4 weeks"}, {"letter": "C", "text": "18 months"}, {"letter": "D", "text": "Lifelong"}], "answer": "A", "explanation": "Bisphosphonates ×6 months; steroids are the 2–4-week course."}]}, "answer": "A,C,E"}, {"id": "9", "group": 9, "section": "Budapest criteria", "topic": "Budapest Criteria", "skill": "Diagnostics & imaging", "stem": "Which statement correctly describes how the diagnosis of CRPS is established?", "options": [{"letter": "A", "text": "It is a diagnosis of exclusion made after labs and imaging are normal"}, {"letter": "B", "text": "It is made positively on clinical Budapest criteria"}, {"letter": "C", "text": "It requires MRI evidence of limb inflammation"}, {"letter": "D", "text": "It requires X-ray evidence of bone demineralization"}, {"letter": "E", "text": "It is confirmed by elevated inflammatory markers"}], "answer": "B", "explanation": "CRPS is **NOT a diagnosis of exclusion — it is made positively on the clinical Budapest criteria**; imaging and labs are optional and mainly exclude mimics.", "objective": "", "remediation": {"steps": [{"teach": "The criteria are **clinical** — built from history and exam, not tests.", "stem": "What is the basis of the CRPS diagnosis?", "options": [{"letter": "A", "text": "Clinical criteria"}, {"letter": "B", "text": "A confirmatory lab test"}], "answer": "A", "explanation": "Budapest criteria are clinical."}, {"teach": "A 'diagnosis of exclusion' means everything else must be ruled out first; here the diagnosis is instead made **positively** when criteria are met, with no better alternative explanation.", "stem": "CRPS is a diagnosis of exclusion — true or false?", "options": [{"letter": "A", "text": "False"}, {"letter": "B", "text": "True"}], "answer": "A", "explanation": "It is NOT a diagnosis of exclusion.", "clarify": [{"stem": "What role do labs play in CRPS?", "options": [{"letter": "A", "text": "Exclude mimics"}, {"letter": "B", "text": "Confirm CRPS"}], "answer": "A", "explanation": "Inflammatory markers are generally unhelpful and only exclude mimics."}]}, {"teach": "State how the diagnosis is made.", "stem": "How is CRPS diagnosed?", "options": [{"letter": "A", "text": "Positively on Budapest criteria"}, {"letter": "B", "text": "By MRI"}, {"letter": "C", "text": "By ESR/CRP"}], "answer": "A", "explanation": "Clinical Budapest criteria make the diagnosis."}], "checkpoints": [{"stem": "Which element is required by the Budapest criteria?", "options": [{"letter": "A", "text": "Continuing pain disproportionate to the inciting event"}, {"letter": "B", "text": "X-ray demineralization"}, {"letter": "C", "text": "Elevated CRP"}, {"letter": "D", "text": "Positive IgG autoantibodies"}], "answer": "A", "explanati (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };
  // Select-all-that-apply support: q.multi === true, q.answers = ['A','C'] (q.answer mirrors the joined key for audits).
  const isMulti = q => !!q.multi;
  const keyLetters = q => isMulti(q) ? (q.answers || String(q.answer).split(',')).map(x => x.trim()).sort() : [q.answer];
  const chosenLetters = q => { const a = answers[q.id]; return a === undefined ? [] : (isMulti(q) ? String(a).split(',').filter(Boolean).sort() : [a]); };
  const isRight = q => { const c = chosenLetters(q), k = keyLetters(q); return c.length === k.length && c.every((x, i) => x === k[i]); };
  const keyLabel = q => keyLetters(q).join(', ');
  const keyText = q => keyLetters(q).map(l => optText(q, l)).join('; ');
  const pendingSel = {};   // multi questions: letters ticked but not yet checked

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(keyLabel(q)) + '. ' + fmt(keyText(q)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });
    pushCheckpoint(q, t);
  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);
    }
  }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong without a pathway, or its pathway has finished.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (isRight(q) || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';
    t.trail.forEach((n, i) => { html += nodeHtml(q, n, i, interactive); });
    html += '</div>';
    return html;
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = isRight(q);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer' + (isMulti(q) ? 's' : '') + ': ' +
      esc(keyLabel(q)) + '. ' + fmt(keyText(q))) + '</div>';
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const wrong = answered && !isRight(q);
    const tutoring = wrong && hasTutor(q);
    const t = tutor[q.id];
    // While the pathway is still in its teaching steps (exam mode), the correct answer stays hidden
    const hideKey = mode === 'exam' && tutoring && t && t.phase === 'steps';
    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Mastered after review</span>';
    else if (status === 'review') html += '<span class="badge review">Flagged for review</span>';
    else if (status === 'active') html += '<span class="badge active">Guided review in progress</span>';
    html += '<div class="stem">' + fmt(q.stem) + (isMulti(q) ? '\n<span class="sata">Select all that apply</span>' : '') + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    const multi = isMulti(q), chosenSet = chosenLetters(q), keySet = keyLetters(q), sel = pendingSel[q.id] || [];
    q.options.forEach(o => {
      let cls = 'opt' + (multi ? ' multi' : '');
      if (answered) {
        const picked = chosenSet.indexOf(o.letter) !== -1, isKey = keySet.indexOf(o.letter) !== -1;
        if (multi) {
          if (picked && isKey) cls += ' correct';
          else if (picked && !isKey) cls += ' incorrect';
          else if (!picked && isKey && !hideKey) cls += ' missed';
          else if (!hideKey) cls += ' dim';
        } else {
          if (o.letter === chosen) cls += isRight(q) ? ' correct' : ' incorrect';
          else if (isKey && !hideKey) cls += ' correct';
          else if (!hideKey) cls += ' dim';
        }
      } else if (multi && sel.indexOf(o.letter) !== -1) cls += ' sel';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + (multi ? '<span class="box"></span>' : '') + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (multi && !answered && mode === 'exam') html += '<button class="btn primary btn-check"' + (sel.length ? '' : ' disabled') + '>Check answer</button>';
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          if (isMulti(q)) {
            const l = btn.getAttribute('data-letter');
            const cur = pendingSel[qid] || [];
            pendingSel[qid] = cur.indexOf(l) === -1 ? cur.concat([l]) : cur.filter(x => x !== l);
            renderPage(true);
            return;
          }
          answers[qid] = btn.getAttribute('data-letter');
          if (!isRight(q) && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
      const chk = card.querySelector(':scope > .btn-check');
      if (chk) chk.addEventListener('click', () => {
        if (mode !== 'exam' || answers[qid] !== undefined) return;
        const q = byId[qid];
        const sel = (pendingSel[qid] || []).slice().sort();
        if (!sel.length) return;
        answers[qid] = sel.join(',');
        delete pendingSel[qid];
        if (!isRight(q) && hasTutor(q)) startTutor(q);
        renderPage(true);
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (isRight(q)) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (isRight(q)) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && !isRight(q));
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer' + (isMulti(q) ? 's' : '') + ': ' + keyLabel(q) + '. ' + plain(keyText(q)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(pendingSel).forEach(k => delete pendingSel[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
