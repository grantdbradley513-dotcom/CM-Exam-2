A polyp found at flexible sigmoidoscopy — or a positive FIT — mandates a full colonoscopy. Sigmoidoscopy reaches only the splenic flexure, the distal third of the colon, and is a triage test rather than a definitive one. FIT is also less sensitive for right-sided lesions."}, {"id": "57", "group": 57, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Scope facts", "stem": "A 71-year-old woman has recurrent iron deficiency anemia with no overt bleeding. EGD and colonoscopy are both normal. Which test comes next?", "options": [{"letter": "A", "text": "Video capsule endoscopy"}, {"letter": "B", "text": "Small bowel follow-through"}, {"letter": "C", "text": "Repeat colonoscopy in six months"}, {"letter": "D", "text": "Double-contrast barium enema"}], "answer": "A", "explanation": "For obscure GI bleeding with normal EGD and colonoscopy, use video capsule endoscopy — visualization only, no biopsy, retention 1–3% — or push/balloon enteroscopy if biopsy or therapy is needed. SBFT is not the study for GI bleeding. For acute brisk bleeding use CT angiography; for slow bleeding, tagged-RBC scintigraphy."}, {"id": "58", "group": 58, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Scope facts", "stem": "During EGD for an upper GI bleed, which ulcer finding does NOT require endoscopic therapy?", "options": [{"letter": "A", "text": "A non-bleeding visible vessel"}, {"letter": "B", "text": "Active bleeding from the ulcer"}, {"letter": "C", "text": "An adherent clot"}, {"letter": "D", "text": "A clean-based ulcer"}], "answer": "D", "explanation": "Endoscopic predictors of persistent or recurrent bleeding — active bleeding, a non-bleeding visible vessel, or an adherent clot — benefit from endoscopic therapy. Clean-based ulcers do not. Rebleeding is about 5% for clean-based ulcers versus up to 43% with a non-bleeding visible vessel."}, {"id": "59", "group": 59, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Gas patterns", "stem": "A 72-year-old woman with a prior hysterectomy and appendectomy presents with 18 hours of vomiting, abdominal distension, and obstipation. Bowel sounds are hyperactive and high-pitched. The upright film shows dilated central loops measuring 4.2 cm with valvulae crossing the full lumen, multiple air–fluid levels at staggered heights, and almost no gas in the rectum. What is the diagnosis?", "options": [{"letter": "A", "text": "Generalized adynamic ileus"}, {"letter": "B", "text": "Sigmoid volvulus"}, {"letter": "C", "text": "Mechanical large bowel obstruction"}, {"letter": "D", "text": "Mechanical small bowel obstruction"}], "answer": "D", "explanation": "The classic triad is dilated small bowel above 3 cm, multiple air–fluid levels, and a paucity or absence of distal and rectal gas. Central loops with valvulae conniventes crossing the full lumen confirm small bowel, and hyperactive high-pitched sounds fit peristalsis fighting a block. Differential level heights of 20–25 mm within one loop are most specific for mechanical obstruction."}, {"id": "59a", "group": 59, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Gas patterns", "stem": "The most likely underlying cause is:", "options": [{"letter": "A", "text": "Incarcerated inguinal hernia"}, {"letter": "B", "text": "Colon cancer"}, {"letter": "C", "text": "Intussusception"}, {"letter": "D", "text": "Post-operative adhesions"}], "answer": "D", "explanation": "Post-operative adhesions cause up to 70% of bowel obstructions in developed countries. Risk factors include prior colorectal, appendiceal, and gynecologic surgery, and each prior episode of obstruction raises the odds of another. Colon cancer is the most common cause of LARGE bowel obstruction."}, {"id": "59b", "group": 59, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Test of choice", "stem": "The appropriate next imaging step is:", "options": [{"letter": "A", "text": "CT with both IV and oral contrast"}, {"letter": "B", "text": "Upper GI series with small bowel follow-through"}, {"letter": "C", "text": "Double-contrast barium enema of the colon"}, {"letter": "D", "text": "CT with IV contrast and no oral contrast"}], "answer": "D", "explanation": "Do the plain film first, then CT with IV contrast, which is most sensitive for confirming obstruction and identifying the transition point, cause, and complications — and IV contrast is what detects ischemia and strangulation. Oral contrast should generally be avoided in suspected high-grade SBO because it worsens discomfort and risks aspiration."}, {"id": "60", "group": 60, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Gas patterns", "stem": "A 68-year-old man is one day out from a sigmoid colectomy. His abdomen is distended and tympanitic with absent bowel sounds. The supine film shows gaseous distension of both small and large bowel with no transition point, and gas is present in the rectum. What is the diagnosis and management?", "options": [{"letter": "A", "text": "Adynamic ileus — supportive care and electrolyte repletion"}, {"letter": "B", "text": "Mechanical SBO — urgent operative exploration"}, {"letter": "C", "text": "Mechanical LBO — urgent endoscopic decompression"}, {"letter": "D", "text": "Toxic megacolon — steroids and broad antibiotics"}], "answer": "A", "explanation": "Generalized ileus is failure of peristalsis, not a blockage: diffuse dilation of BOTH small and large bowel, no transition point, and gas down to the rectum, with absent or hypoactive sounds. The most common cause is recent abdominal or pelvic surgery, generally lasting 48–72 hours. Also consider hypokalemia, hypomagnesemia, opioids, and anticholinergics."}, {"id": "60a", "group": 60, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Gas patterns", "stem": "Overnight he develops severe pain out of proportion to his exam. This raises concern for:", "options": [{"letter": "A", "text": "Bowel ischemia"}, {"letter": "B", "text": "A resolving ileus"}, {"letter": "C", "text": "A new mechanical obstruction"}, {"letter": "D", "text": "Inadequate analgesic dosing"}], "answer": "A", "explanation": "An ileus with no transition point is not a mechanical obstruction to be relieved surgically — but reassess if pain becomes severe, since significant bowel ischemia can also cause a functional ileus and severe abdominal pain is part of that picture."}, {"id": "61", "group": 61, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Named signs", "stem": "An 81-year-old nursing home resident with chronic constipation presents with massive abdominal distension. The plain film shows an enormously dilated U-shaped loop arising from the pelvis toward the right upper quadrant, with opposed medial walls. What is the diagnosis?", "options": [{"letter": "A", "text": "Cecal volvulus"}, {"letter": "B", "text": "Sigmoid volvulus"}, {"letter": "C", "text": "Toxic megacolon"}, {"letter": "D", "text": "Intussusception"}], "answer": "B", "explanation": "This is the coffee bean sign of sigmoid volvulus, a closed-loop obstruction in which an air-filled sigmoid twists on its mesentery, occluding both lumen and blood supply. It classically occurs in older, institutionalized, or chronically constipated men, and untreated it progresses rapidly to ischemia and perforation, so prompt detorsion is essential."}, {"id": "62", "group": 62, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Free air", "stem": "A 59-year-old man with a history of peptic ulcer disease develops sudden severe epigastric pain and now has a rigid abdomen. He is able to sit upright. Which single film is most sensitive for the finding you are looking for?", "options": [{"letter": "A", "text": "Supine abdomen"}, {"letter": "B", "text": "Upright abdomen"}, {"letter": "C", "text": "Upright PA chest"}, {"letter": "D", "text": "Right lateral decubitus abdomen"}], "answer": "C", "explanation": "The upright PA chest detects as little as 1–2 mL of free air after 5–10 minutes upright, while a plain abdominal film needs about 5 mL. Free air rises beneath the diaphragm and is easiest to see under the right hemidiaphragm, where the liver gives a solid background. Free air in an acute abdomen is a surgical emergency."}, {"id": "62a", "group": 62, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Free air", "stem": "If he could not be positioned upright, the alternative would be:", "options": [{"letter": "A", "text": "Prone abdominal film after 5 minutes"}, {"letter": "B", "text": "Left lateral decubitus for at least 5 minutes"}, {"letter": "C", "text": "Supine cross-table lateral abdomen"}, {"letter": "D", "text": "Right lateral decubitus for at least 5 minutes"}], "answer": "B", "explanation": "The patient lies on the LEFT side for at least 5 minutes so free air rises to the highest point on the patient's right — a black crescent over the outer edge of the liver where no bowel gas normally lies. Left is preferred because gas normally present in the stomach and descending colon makes a right decubitus film harder to read."}, {"id": "63", "group": 63, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Free-air mimics", "stem": "A chest film in an asymptomatic patient shows a lucency between the liver and the right hemidiaphragm. On close inspection the lucency contains haustral markings and a visible bowel wall. This is:", "options": [{"letter": "A", "text": "Football sign"}, {"letter": "B", "text": "Chilaiditi sign"}, {"letter": "C", "text": "Free air from a perforation"}, {"letter": "D", "text": "Rigler sign"}], "answer": "B", "explanation": "Chilaiditi sign is colon, usually the hepatic flexure, interposed between the liver and the right hemidiaphragm. The lucency contains haustra and bowel-wall markings, so it is inside the colon, not free. With symptoms it is called Chilaiditi syndrome. Rigler sign is gas on both sides of the bowel wall on a supine film."}, {"id": "64", "group": 64, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — RUQ US vs HIDA", "stem": "A 44-year-old woman has 8 hours of constant right upper quadrant pain that began after a fried meal. Her temperature is 100.9°F and she has maximal tenderness with inspiratory arrest on palpation of the RUQ. Which imaging study should be ordered first?", "options": [{"letter": "A", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "B", "text": "CT abdomen and pelvis with contrast"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "Hepatobiliary iminodiacetic acid scan"}], "answer": "C", "explanation": "Ultrasound is first for RUQ pain, every time — bedside-capable, no absolute contraindications, safe in pregnancy and children, and more sensitive than CT for gallstones and biliary dilatation. HIDA is the follow-up question, not the opening move."}, {"id": "64a", "group": 64, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — RUQ US vs HIDA", "stem": "Which ultrasound combination gives a positive predictive value near 90–95%?", "options": [{"letter": "A", "text": "Stones, wall over 3 mm, sonographic Murphy sign"}, {"letter": "B", "text": "Duct dilation with a contracted gallbladder"}, {"letter": "C", "text": "Echogenic material without acoustic shadowing"}, {"letter": "D", "text": "Stones alone with a normal gallbladder wall"}], "answer": "A", "explanation": "Gallstones plus wall thickening plus a positive sonographic Murphy sign together give a PPV of about 90–95% for acute cholecystitis. Option B is the picture of biliary colic. Option D describes sludge, which is echogenic but casts no acoustic shadow, while stones do."}, {"id": "64b", "group": 64, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — RUQ US vs HIDA", "stem": "Her ultrasound is equivocal, so a HIDA is done. Acute cholecystitis is shown by:", "options": [{"letter": "A", "text": "Ejection fraction below 35% after CCK"}, {"letter": "B", "text": "Tracer pooling outside the biliary tree"}, {"letter": "C", "text": "Gallbladder non-visualization at one hour"}, {"letter": "D", "text": "Gallbladder filling within 45 minutes"}], "answer": "C", "explanation": "Non-visualization of the gallbladder within about 1 hour, while the CBD and small bowel fill normally, indicates cystic duct obstruction — a photopenic area in the gallbladder fossa. A low ejection fraction after CCK is chronic cholecystitis or dyskinesia; tracer outside the tree is a bile leak; filling by 45 minutes is normal."}, {"id": "65", "group": 65, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — RUQ US vs HIDA", "stem": "A 39-year-old woman has 18 months of recurrent post-prandial right upper quadrant pain. Ultrasound has been repeatedly normal and her liver chemistries are normal. Which test and result would establish the likely diagnosis?", "options": [{"letter": "A", "text": "CT showing pericholecystic fat stranding"}, {"letter": "B", "text": "HIDA with CCK showing ejection fraction below 35%"}, {"letter": "C", "text": "MRCP showing a dilated common bile duct"}, {"letter": "D", "text": "HIDA showing gallbladder non-visualization at one hour"}], "answer": "B", "explanation": "HIDA is also indicated for chronic cholecystitis and biliary dyskinesia, where the finding is delayed filling or a low gallbladder ejection fraction below 35% after CCK stimulation. CCK is secreted by small-intestinal I cells after a meal and contracts the gallbladder, which is why it is used to measure ejection fraction."}, {"id": "66", "group": 66, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Test of choice", "stem": "A 28-year-old woman who is 22 weeks pregnant presents with 12 hours of right lower quadrant pain, anorexia, and a low-grade fever. Which imaging should be obtained first?", "options": [{"letter": "A", "text": "Abdominal ultrasound"}, {"letter": "B", "text": "Three-view acute abdominal series"}, {"letter": "C", "text": "CT abdomen and pelvis with contrast"}, {"letter": "D", "text": "MRI abdomen with gadolinium"}], "answer": "A", "explanation": "For suspected appendicitis in children and in pregnancy, ultrasound comes first to spare radiation, with CT or MRI only if the US is nondiagnostic. Ultrasound has no absolute contraindications and is safe in pregnancy and children. MRI is preferred in the second and third trimesters, but gadolinium is contraindicated in pregnancy."}, {"id": "67", "group": 67, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Test of choice", "stem": "A 62-year-old man has three days of left lower quadrant pain, a fever of 101.2°F, and a WBC of 14,500. What is the imaging study of choice?", "options": [{"letter": "A", "text": "Colonoscopy with biopsy"}, {"letter": "B", "text": "Graded-compression abdominal ultrasound"}, {"letter": "C", "text": "Double-contrast barium enema"}, {"letter": "D", "text": "CT with IV contrast"}], "answer": "D", "explanation": "CT with IV contrast is the test of choice for diverticulitis, showing inflamed diverticula, segmental colonic wall thickening with enhancement, and pericolic fat stranding with or without fluid or gas locules. These patients are usually older than 50, so know their renal function before ordering IV contrast."}, {"id": "67a", "group": 67, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §7 — Contraindication cluster", "stem": "A colleague suggests colonoscopy now to confirm it. Colonoscopy and barium enema are:", "options": [{"letter": "A", "text": "Acceptable, with barium enema the safer choice"}, {"letter": "B", "text": "Acceptable if performed without insufflation"}, {"letter": "C", "text": "Both contraindicated during the acute episode"}, {"letter": "D", "text": "Acceptable if limited to flexible sigmoidoscopy"}], "answer": "C", "explanation": "Suspected acute diverticulitis and fulminant colitis or toxic megacolon are contraindications to colonoscopy and flexible sigmoidoscopy, and the same logic forbids distending an acutely inflamed colon with barium and air. Image with CT instead."}, {"id": "68", "group": 68, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Test of choice", "stem": "A 41-year-old man has sudden severe left flank pain radiating to the groin, with gross hematuria. Which imaging is preferred?", "options": [{"letter": "A", "text": "Noncontrast helical CT"}, {"letter": "B", "text": "CT with IV and oral contrast"}, {"letter": "C", "text": "Plain abdominal radiograph"}, {"letter": "D", "text": "CT with IV contrast"}], "answer": "A", "explanation": "Noncontrast helical CT — the \"stone protocol\" — has replaced KUB as the preferred test for suspected nephrolithiasis, with a negative predictive value of about 98%. KUB is only 50–60% sensitive and misses small stones and radiolucent uric acid stones. The kidney stone is the exception to the CT-with-IV-contrast rule."}, {"id": "69", "group": 69, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Calcifications", "stem": "A KUB obtained to evaluate constipation shows amorphous, popcorn-like calcifications scattered across the epigastrium. These represent:", "options": [{"letter": "A", "text": "Gallstones"}, {"letter": "B", "text": "Renal calculi"}, {"letter": "C", "text": "Aortic atherosclerosis"}, {"letter": "D", "text": "Chronic pancreatitis"}], "answer": "D", "explanation": "Pancreatic calcification is a reliable sign of chronic pancreatitis and can frequently be picked up on plain film, appearing amorphous or popcorn-like in the epigastrium — the head projects into the RUQ and the tail into the LUQ. Laminated means a stone, track-like means an artery, and rim-like means the wall of something."}, {"id": "69a", "group": 69, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Calcifications", "stem": "The same film shows small round pelvic calcifications with lucent centers. These are:", "options": [{"letter": "A", "text": "Appendicoliths"}, {"letter": "B", "text": "Phleboliths"}, {"letter": "C", "text": "Calcified uterine fibroids"}, {"letter": "D", "text": "Distal ureteral stones"}], "answer": "B", "explanation": "Phleboliths are small, rounded calcifications with a lucent center, representing calcified venous thrombi. They occur with age, most often in the pelvic veins of women, and are NORMAL. An appendicolith is laminated and sits in the right iliac fossa; fibroids are large and round."}, {"id": "70", "group": 70, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — The numbers", "stem": "Which set of measurements gives the upper limits of normal bowel caliber on an abdominal plain film, for small bowel, colon, and cecum respectively?", "options": [{"letter": "A", "text": "3 cm, 6 cm, 9 cm"}, {"letter": "B", "text": "6 cm, 3 cm, 9 cm"}, {"letter": "C", "text": "2 cm, 4 cm, 6 cm"}, {"letter": "D", "text": "5 cm, 9 cm, 12 cm"}], "answer": "A", "explanation": "The 3/6/9 rule: small bowel above 3 cm, colon above 6 cm, and cecum above 9 cm are dilated, and a cecum over 9 cm carries a high risk of perforation. Distended — enough air to outline the lumen — is normal; dilated, exceeding normal caliber, is abnormal."}, {"id": "71", "group": 71, "section": "Acute abdomen & plain film", "objective": "Pattern Guide §6 — Named signs", "stem": "A supine abdominal film shows a single persistently dilated loop of small bowel in the left upper quadrant on multiple views, with the rest of the bowel normal and gas present throughout the colon and rectum. Which diagnosis does this point to?", "options": [{"letter": "A", "text": "Acute pancreatitis"}, {"letter": "B", "text": "Acute diverticulitis"}, {"letter": "C", "text": "Acute appendicitis"}, {"letter": "D", "text": "Acute cholecystitis"}], "answer": "A", "explanation": "This is a sentinel loop — a localized ileus in which focal irritation from an adjacent inflamed organ paralyzes one or two loops while the rest of the bowel looks normal. Read the quadrant: LUQ or epigastrium means pancreatitis, RUQ cholecystitis, RLQ appendicitis, LLQ diverticulitis. Gas still reaching the rectum separates it from obstruction."}, {"id": "72", "group": 72, "section": "Cross-cutting rules", "objective": "Pattern Guide §7 — Contrast safety", "stem": "A 74-year-old man with diabetes and an eGFR of 24 mL/min needs a CT with IV contrast for a suspected abdominal abscess. He takes metformin daily. The metformin should be:", "options": [{"letter": "A", "text": "Replaced permanently with a sulfonylurea agent"}, {"letter": "B", "text": "Held for 48 hours after contrast"}, {"letter": "C", "text": "Held for seven days before the scan"}, {"letter": "D", "text": "Continued without any interruption or monitoring"}], "answer": "B", "explanation": "If eGFR is below 30 or there is acute kidney injury, hold metformin at the time of contrast and for 48 hours, restarting once renal function is stable. Contrast-associated AKI risk is lower than once thought, but be cautious below eGFR 30; at stable CKD with eGFR 30 or above, contrast is usually acceptable with hydration."}, {"id": "73", "group": 73, "section": "Cross-cutting rules", "objective": "Pattern Guide §7 — Contrast safety", "stem": "During a contrast-enhanced CT a patient reports a wave of warmth and a metallic taste. She is hemodynamically stable with no rash, wheeze, or swelling. This is:", "options": [{"letter": "A", "text": "An early anaphylactoid reaction"}, {"letter": "B", "text": "A common non-allergic reaction"}, {"letter": "C", "text": "A true contrast allergy"}, {"letter": "D", "text": "An early sign of contrast nephropathy"}], "answer": "B", "explanation": "Warmth, metallic taste, and brief nausea are common and non-allergic — reassure the patient, and no premedication is needed for future studies. True allergy means prior hives, bronchospasm, hypotension, or anaphylaxis, and those patients get a steroid and antihistamine premedication protocol."}, {"id": "74", "group": 74, "section": "Cross-cutting rules", "objective": "Pattern Guide §7 — Radiation", "stem": "Which pair of imaging modalities involves NO ionizing radiation?", "options": [{"letter": "A", "text": "MRI and fluoroscopy"}, {"letter": "B", "text": "Ultrasound and HIDA scan"}, {"letter": "C", "text": "Plain radiography and MRCP"}, {"letter": "D", "text": "Ultrasound and MRI"}], "answer": "D", "explanation": "Ultrasound and MRI/MRCP use no ionizing radiation. Plain films, CT (by far the largest dose), fluoroscopy, and nuclear medicine studies such as HIDA, gastric emptying, and tagged-RBC scintigraphy all do. Nuclear medicine dose is modest and involves no iodinated contrast, so reactions are rare."}, {"id": "75", "group": 75, "section": "Cross-cutting rules", "objective": "Pattern Guide §7 — Seven reflexes to suppress", "stem": "A 33-year-old man has typical heartburn that partially improved with lifestyle changes. He has no epigastric pain, weight loss, anemia, or vomiting. He asks to be tested for H. pylori. Testing is:", "options": [{"letter": "A", "text": "Recommended, using a stool antigen test"}, {"letter": "B", "text": "Not recommended in typical GERD"}, {"letter": "C", "text": "Recommended, using serology"}, {"letter": "D", "text": "Recommended, using EGD with biopsy"}], "answer": "B", "explanation": "H. pylori testing is NOT recommended in the workup of typical GERD — a patient without epigastric pain in whom neither PUD nor gastritis is suspected. Typical GERD without red flags is a clinical diagnosis managed with lifestyle modification and a PPI. Always keep cardiac ischemia on the differential of \"heartburn.\""}]};


  // --- Reshuffle on every open: stack order and answer options ---
  (function reshuffle() {
    function shuf(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    var LET = ['A', 'B', 'C', 'D', 'E', 'F'];
    EXAM_DATA.questions.forEach(function (q) {
      var correct = null;
      q.options.forEach(function (o) { if (o.letter === q.answer) correct = o.text; });
      var texts = shuf(q.options.map(function (o) { return o.text; }));
      q.options = texts.map(function (txt, i) { return { letter: LET[i], text: txt }; });
      q.options.forEach(function (o) { if (o.text === correct) q.answer = o.letter; });
    });
    // shuffle the order of the stacks, keeping each stack's internal order intact
    var byGroup = {}, order = [];
    EXAM_DATA.questions.forEach(function (q) {
      if (!byGroup[q.group]) { byGroup[q.group] = []; order.push(q.group); }
      byGroup[q.group].push(q);
    });
    shuf(order);
    var out = [];
    order.forEach(function (g) { byGroup[g].forEach(function (q) { out.push(q); }); });
    EXAM_DATA.questions = out;
  })();

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
