<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:

const EXAM_DATA = {"title": "DI 2 · Exam 1 Practice Exam — GI and Liver Diagnostics", "questions": [{"id": "1", "group": 1, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Reading the liver panel", "stem": "A 37-year-old woman comes in for a routine physical with no complaints. BMI is 29 and BP is 145/90. A CMP shows AST 87 U/L, ALT 102 U/L, alkaline phosphatase 96 U/L, total bilirubin 0.8 mg/dL, and albumin 4.2 g/dL. Which pattern of liver injury is this?", "options": [{"letter": "A", "text": "No pattern; these values are normal"}, {"letter": "B", "text": "Hepatocellular"}, {"letter": "C", "text": "Cholestatic"}, {"letter": "D", "text": "Mixed hepatocellular and cholestatic"}], "answer": "B", "explanation": "AST and ALT elevations predominate and the AP is normal, so this is a hepatocellular pattern — the more common of the two. \"Predominates\" means relative magnitude: which value is furthest above its own upper limit of normal. Bilirubin plays no role in this decision."}, {"id": "1a", "group": 1, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Hepatocellular branch", "stem": "Which diagnosis best fits her numbers?", "options": [{"letter": "A", "text": "Primary biliary cholangitis (formerly cirrhosis)"}, {"letter": "B", "text": "MASLD (nonalcoholic fatty liver disease)"}, {"letter": "C", "text": "Alcohol-related (steatotic) liver disease"}, {"letter": "D", "text": "Acute viral hepatitis, A or B"}], "answer": "B", "explanation": "AST/ALT is less than 1 with values 2–5× ULN, in a patient with obesity and hypertension. MASLD is the most common cause of asymptomatic mildly elevated transaminases in the US. Mnemonic: there is more ALT than AST if the Liver is infiltrated with Lipids. Before settling on it, exclude alcohol and chronic viral hepatitis B and C."}, {"id": "2", "group": 2, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Hepatocellular branch", "stem": "A 47-year-old man is evaluated for fatigue. AST is 160 U/L, ALT is 80 U/L, and alkaline phosphatase is 88 U/L. Which additional laboratory finding would best corroborate the likely etiology?", "options": [{"letter": "A", "text": "A low serum ceruloplasmin"}, {"letter": "B", "text": "A positive anti-mitochondrial antibody"}, {"letter": "C", "text": "A transferrin saturation of 60%"}, {"letter": "D", "text": "An elevated MCV"}], "answer": "D", "explanation": "AST more than twice the ALT strongly suggests alcohol, and a ratio above 3 is 97% specific. Excess alcohol is a cause of macrocytosis, so a high MCV corroborates it. Screen consumption with the AUDIT-C; ultrasound typically shows a fatty liver, which reverses within about a month of abstinence."}, {"id": "3", "group": 3, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Hepatocellular branch", "stem": "A 52-year-old man with known alcohol use disorder presents with jaundice and malaise. AST is 1,450 U/L, ALT is 1,890 U/L, and alkaline phosphatase is 110 U/L. What is the correct interpretation?", "options": [{"letter": "A", "text": "Diagnostic of alcohol as the sole cause"}, {"letter": "B", "text": "Too high for alcohol, suggesting viral or toxic injury"}, {"letter": "C", "text": "Entirely typical of severe alcoholic hepatitis"}, {"letter": "D", "text": "A cholestatic pattern requiring urgent biliary imaging"}], "answer": "B", "explanation": "AST rarely exceeds 400 in alcohol-related hepatitis, and transaminases above 15× ULN indicate acute hepatocellular necrosis from a viral or toxic cause such as acetaminophen. Note the ratio here is actually below 1, which further argues against alcohol."}, {"id": "4", "group": 4, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — The three rules", "stem": "An asymptomatic 58-year-old woman has an alkaline phosphatase of 310 U/L on a routine CMP. AST, ALT, bilirubin, and albumin are all normal. What is the next best test?", "options": [{"letter": "A", "text": "Right upper quadrant ultrasound"}, {"letter": "B", "text": "ERCP"}, {"letter": "C", "text": "Anti-mitochondrial antibody"}, {"letter": "D", "text": "Gamma-glutamyl transferase"}], "answer": "D", "explanation": "An isolated elevated AP earns a GGT before anything else, because AP is also produced in bone, intestine, and placenta. GGT is not part of the CMP or the hepatic function panel and must be ordered separately — so a vignette reporting a GGT means someone deliberately went looking."}, {"id": "4a", "group": 4, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — The three rules", "stem": "Her GGT returns at 22 U/L (normal 6–50). The alkaline phosphatase is coming from:", "options": [{"letter": "A", "text": "Necrotic hepatocytes"}, {"letter": "B", "text": "Obstructed bile ducts"}, {"letter": "C", "text": "Inflamed intralobular ducts"}, {"letter": "D", "text": "Bone"}], "answer": "D", "explanation": "An elevated AP with a NORMAL GGT points to a non-hepatic source — think bone. GGT is not elevated in bone disease, and that single fact is the whole point of the test. AP isoenzymes can be fractionated but this is seldom needed."}, {"id": "5", "group": 5, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Cholestatic branch", "stem": "A 52-year-old woman reports several months of fatigue and diffuse itching. AST is 60 U/L, ALT is 75 U/L, alkaline phosphatase is 840 U/L, and total bilirubin is 1.6 mg/dL. Which antibody is most likely present in high titer?", "options": [{"letter": "A", "text": "Anti-tissue transglutaminase IgA"}, {"letter": "B", "text": "Anti-smooth muscle antibody"}, {"letter": "C", "text": "Anti-mitochondrial antibody"}, {"letter": "D", "text": "Perinuclear antineutrophil cytoplasmic antibody"}], "answer": "C", "explanation": "A markedly elevated AP with only mild transaminase elevation in a middle-aged woman with pruritus is primary biliary cholangitis, where AMA is present in 90–100% at high titer. PBC = AMA = cholestatic; AIH = ASMA = hepatocellular. Each antibody appears in the other disease at 10–20% and low titer, so titer height is the answer."}, {"id": "5a", "group": 5, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Cholestatic branch", "stem": "Before starting treatment, what must still be done?", "options": [{"letter": "A", "text": "Liver biopsy to stage fibrosis"}, {"letter": "B", "text": "Imaging to exclude biliary obstruction"}, {"letter": "C", "text": "Bone-specific alkaline phosphatase"}, {"letter": "D", "text": "Serum ceruloplasmin"}], "answer": "B", "explanation": "A cholestatic pattern always earns imaging as part of the initial evaluation. A cholestatic pattern is not automatically PBC — first exclude obstruction and neoplasm with ultrasound, CT, or MRI, because you cannot afford to miss pancreatic cancer or cholangiocarcinoma."}, {"id": "6", "group": 6, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Two antibody pairs", "stem": "A 45-year-old woman with autoimmune hypothyroidism has AST 280 U/L, ALT 400 U/L, and alkaline phosphatase 150 U/L. Her CMP also shows total protein 9.4 g/dL with albumin 4.0 g/dL. Which finding on this panel is the clue to her diagnosis?", "options": [{"letter": "A", "text": "Mildly elevated alkaline phosphatase"}, {"letter": "B", "text": "Normal albumin with elevated transaminases"}, {"letter": "C", "text": "AST to ALT ratio below one"}, {"letter": "D", "text": "High total protein with normal albumin"}], "answer": "D", "explanation": "More than 80% of autoimmune hepatitis patients have hypergammaglobulinemia, and the clue on a CMP is a high total protein with a normal albumin. Expect ANA and anti-smooth muscle antibody, present in about 90% at high titer; biopsy shows a periportal lymphocytic infiltrate. The lecture's AIH pattern is AST/ALT 7–10× ULN with AP only 1–3×."}, {"id": "7", "group": 7, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Hepatocellular branch", "stem": "A 45-year-old man reports lethargy and joint stiffness. On exam his skin looks bronzed and he cannot fully flex the index and middle fingers of either hand. His brother was recently diagnosed with a liver condition. AST is 68 U/L, ALT is 74 U/L, and AP is normal. Which panel should you order?", "options": [{"letter": "A", "text": "Anti-mitochondrial antibody and viral serologies"}, {"letter": "B", "text": "Ferritin, iron, TIBC, and transferrin saturation"}, {"letter": "C", "text": "ANA, anti-smooth muscle antibody, and IgG"}, {"letter": "D", "text": "Ceruloplasmin and 24-hour urine copper"}], "answer": "B", "explanation": "Bronzing plus the \"iron fist sign\" — hemochromatosis arthropathy of the 2nd and 3rd MCP joints — plus a family history is hereditary hemochromatosis, an autosomal recessive disorder on chromosome 6. Think of it as the opposite of iron deficiency anemia: ferritin HIGH, iron HIGH, TIBC LOW, transferrin saturation HIGH."}, {"id": "7a", "group": 7, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Hepatocellular branch", "stem": "Ferritin is 640 ng/mL and transferrin saturation is 58%. The confirmatory test is:", "options": [{"letter": "A", "text": "Liver biopsy with iron staining"}, {"letter": "B", "text": "Repeat fasting iron studies in 3 months"}, {"letter": "C", "text": "MRI with hepatic iron quantification"}, {"letter": "D", "text": "HFE gene mutation analysis"}], "answer": "D", "explanation": "A positive screen is ferritin >200 in premenopausal women or >300 in others, WITH a transferrin saturation >45%. Confirm with HFE genotyping — affected individuals are homozygotes, and variable penetrance is the rule. Note that genotyping does not establish the presence or degree of fibrosis."}, {"id": "8", "group": 8, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — The three rules", "stem": "Which value plays NO role in deciding whether a pattern of liver injury is hepatocellular or cholestatic?", "options": [{"letter": "A", "text": "Alkaline phosphatase"}, {"letter": "B", "text": "Serum ALT"}, {"letter": "C", "text": "Serum AST"}, {"letter": "D", "text": "Total bilirubin"}], "answer": "D", "explanation": "Serum bilirubin may be normal or elevated in either pattern, so disregard it when deciding. The Big Three — AST, ALT, and AP, all on the CMP — are the only pattern-deciding tests. Bilirubin is a cholestasis-associated test, not a pattern-deciding one."}, {"id": "9", "group": 9, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — The rare four", "stem": "A 22-year-old man is evaluated for a hepatocellular pattern of enzyme elevation. Over the past year his family has noticed a resting tremor, growing irritability, and a sharp decline in his school performance. Which test should you order?", "options": [{"letter": "A", "text": "Serum alpha-1 antitrypsin"}, {"letter": "B", "text": "Fasting transferrin saturation"}, {"letter": "C", "text": "Anti-hepatitis C antibody"}, {"letter": "D", "text": "Serum ceruloplasmin"}], "answer": "D", "explanation": "Suspect Wilson disease in a child or young adult with otherwise unexplained liver disease, especially with neurologic or psychiatric symptoms. Ceruloplasmin is below 20 mg/dL in about 90%. Hepatic copper on biopsy is the criterion standard, and a normal result effectively excludes the diagnosis. Kayser-Fleischer rings are seen in up to 90% of symptomatic patients."}, {"id": "10", "group": 10, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — The rare four", "stem": "A 41-year-old lifelong non-smoker was recently told he has emphysema. He is now found to have persistently elevated transaminases. Which single test best explains both problems?", "options": [{"letter": "A", "text": "Serum alpha-1 antitrypsin"}, {"letter": "B", "text": "HFE gene mutation analysis"}, {"letter": "C", "text": "Serum ceruloplasmin level"}, {"letter": "D", "text": "Anti-smooth muscle antibody"}], "answer": "A", "explanation": "Alpha-1 antitrypsin deficiency is autosomal recessive on chromosome 14; the enzyme accumulates in hepatocytes and disrupts liver function, and its absence in the lung permits emphysema. Suspect it in adults with both early liver disease and early emphysema, and in any emphysema under age 50, particularly in non-smokers."}, {"id": "11", "group": 11, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — The rare four", "stem": "A 24-year-old man notices yellowing of his eyes during a bout of influenza when he was eating very little. Total bilirubin is 2.8 mg/dL and fractionation shows it is predominantly indirect. AST, ALT, AP, albumin, CBC, reticulocyte count, and haptoglobin are all normal. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gilbert syndrome"}, {"letter": "B", "text": "Acute hepatitis A"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "Hemolytic anemia"}], "answer": "A", "explanation": "Gilbert syndrome is the common cause of isolated mild indirect hyperbilirubinemia — an inherited deficiency of glucuronyl transferase (UGT1A1) affecting roughly 5% of the population. Jaundice appears under stress, illness, fasting, or dehydration. All other liver tests are normal and there is no evidence of hemolysis, which is what the normal CBC, retic, and haptoglobin establish."}, {"id": "12", "group": 12, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — The synthetic-function clock", "stem": "Which statement correctly describes the time course of the two tests of hepatic synthetic function?", "options": [{"letter": "A", "text": "Albumin falls in hours to days; PT rises over weeks"}, {"letter": "B", "text": "PT rises in hours to days; albumin falls over weeks"}, {"letter": "C", "text": "Both change within hours of significant injury"}, {"letter": "D", "text": "Both change only after the transaminases normalize"}], "answer": "B", "explanation": "Clotting factors have short half-lives — factor VII is about 6 hours — so PT moves fast. Albumin's half-life is about 20 days and it takes 2–3 weeks to fall, so it will not be low in acute injury. Therefore a low albumin in a jaundiced patient means the process is chronic, and a normal albumin does not rule out acute injury."}, {"id": "13", "group": 13, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Cholestatic branch", "stem": "A 67-year-old man has three months of a dull epigastric ache radiating to his back and a 20-pound unintentional weight loss. He is jaundiced but his abdomen is non-tender. AST is 45, ALT 50, alkaline phosphatase 320, and total bilirubin 4.1 mg/dL with a direct fraction of 3.2. What is the best next step?", "options": [{"letter": "A", "text": "Anti-mitochondrial antibody testing"}, {"letter": "B", "text": "Percutaneous liver biopsy"}, {"letter": "C", "text": "Serum CA 19-9 tumor marker"}, {"letter": "D", "text": "CT abdomen with contrast"}], "answer": "D", "explanation": "Painless jaundice with weight loss is a classic presentation of pancreatic cancer, and a cholestatic pattern demands imaging early. The predominantly direct hyperbilirubinemia fits obstruction. CA 19-9 is NOT a screening test — it is used for prognostic information and to follow response to therapy, where ≥500 IU/mL predicts a worse post-operative prognosis."}, {"id": "14", "group": 14, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Cholestatic branch", "stem": "A 35-year-old woman with a five-year history of ulcerative colitis is found to have an alkaline phosphatase of 480 U/L with AST 55 and ALT 60. Which diagnosis belongs at the top of your differential?", "options": [{"letter": "A", "text": "Autoimmune hepatitis"}, {"letter": "B", "text": "Primary sclerosing cholangitis"}, {"letter": "C", "text": "Primary biliary cholangitis"}, {"letter": "D", "text": "Alcohol-related liver disease"}], "answer": "B", "explanation": "PSC is a chronic progressive cholestasis with inflammation, fibrosis, and stricturing of intra- and extrahepatic bile ducts. It is believed autoimmune, is associated with p-ANCA, and is strongly associated with inflammatory bowel disease — mainly ulcerative colitis. It can be complicated by cholangiocarcinoma."}, {"id": "15", "group": 15, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — DILI reflex", "stem": "Which group of drugs is most associated with a CHOLESTATIC pattern of drug-induced liver injury?", "options": [{"letter": "A", "text": "Proton pump inhibitors, bismuth, fluoroquinolones"}, {"letter": "B", "text": "Beta-blockers, cephalosporins, metformin"}, {"letter": "C", "text": "Penicillins, sulfa drugs, oral contraceptives"}, {"letter": "D", "text": "Acetaminophen, statins, isoniazid"}], "answer": "C", "explanation": "Cholestatic DILI comes from penicillins and derivatives, sulfa drugs, and estrogens or oral contraceptives. Hepatocellular DILI comes from acetaminophen, statins, isoniazid, methotrexate, and amoxicillin-clavulanate. Because DILI produces either pattern, ask every patient with an abnormal LFT about prescription drugs, OTC drugs, and supplements."}, {"id": "16", "group": 16, "section": "Liver panel & pattern recognition", "objective": "Pattern Guide §1 — Synthetic function", "stem": "A previously healthy 28-year-old woman is admitted with jaundice and confusion three days after an intentional acetaminophen overdose. Her INR is 2.4 and she is disoriented to place and time. What is her diagnosis?", "options": [{"letter": "A", "text": "Acute alcoholic hepatitis"}, {"letter": "B", "text": "Decompensated alcoholic cirrhosis"}, {"letter": "C", "text": "Acute liver failure"}, {"letter": "D", "text": "Hepatorenal syndrome type 1"}], "answer": "C", "explanation": "Acute liver failure is severe acute liver injury plus significant coagulopathy (INR >1.5) plus hepatic encephalopathy, usually in a patient without preexisting liver disease and evolving in under 24–26 weeks. Drug-induced injury, especially acetaminophen, is the most common cause in the US. Transplantation is the only curative treatment."}, {"id": "17", "group": 17, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — The acute panel", "stem": "A 42-year-old man presents with fatigue, abdominal pain, and loss of appetite. He denies any history of viral hepatitis or hepatitis vaccination and reports one recent new sexual partner. Exam shows scleral icterus and a slightly enlarged, tender liver. Which set of tests is best for diagnosing acute viral hepatitis?", "options": [{"letter": "A", "text": "Total anti-HAV, HBsAg, anti-HBs, HBeAg"}, {"letter": "B", "text": "Total anti-HAV, anti-HBs, HCV RNA"}, {"letter": "C", "text": "IgM anti-HAV, IgM anti-HCV, HBV DNA"}, {"letter": "D", "text": "IgM anti-HAV, HBsAg, IgM anti-HBc, anti-HCV"}], "answer": "D", "explanation": "The acute viral hepatitis panel is IgM anti-HAV for acute A; HBsAg AND IgM anti-HBc for acute B; and anti-HCV for C, which is included even though C is rarely diagnosed acutely. There is no clinically recommended HCV-specific IgM assay the way there is for hepatitis A or acute B."}, {"id": "17a", "group": 17, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — Why two tests for acute B", "stem": "Why are both HBsAg and IgM anti-HBc sent for hepatitis B?", "options": [{"letter": "A", "text": "IgM anti-HBc separates vaccination from infection"}, {"letter": "B", "text": "HBsAg must be confirmed to exclude hepatitis D"}, {"letter": "C", "text": "IgM anti-HBc covers the window period"}, {"letter": "D", "text": "HBsAg turns positive only in chronic infection"}], "answer": "C", "explanation": "HBsAg is detectable within about 2 weeks of exposure and is usually present while the patient is clinically ill, but in a milder case with delayed testing it may already have declined. IgM anti-HBc is the second chance at the diagnosis during the window period — after HBsAg has disappeared but before anti-HBs has appeared."}, {"id": "17b", "group": 17, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — HBV states", "stem": "His results: HBsAg positive, IgM anti-HBc positive, IgM anti-HAV negative, anti-HCV negative. The diagnosis is:", "options": [{"letter": "A", "text": "Successful hepatitis B immunization"}, {"letter": "B", "text": "Chronic hepatitis B"}, {"letter": "C", "text": "Acute hepatitis B"}, {"letter": "D", "text": "Resolved hepatitis B"}], "answer": "C", "explanation": "HBsAg positive with IgM anti-HBc positive is acute hepatitis B. Only about 5–10% of people infected as adults develop persistent infection, so he will most likely recover with supportive care. Chronic hepatitis B is defined by HBsAg persisting beyond six months, and those patients never develop anti-HBs."}, {"id": "18", "group": 18, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — The two rules", "stem": "A 39-year-old man brings in lab results drawn at a health fair: HBsAg negative, anti-HBs positive, anti-HBc positive, anti-HCV positive. His hepatitis B status is best described as:", "options": [{"letter": "A", "text": "Acute infection in the window period"}, {"letter": "B", "text": "Chronic hepatitis B infection"}, {"letter": "C", "text": "Immune from a previous resolved infection"}, {"letter": "D", "text": "Immune from vaccination"}], "answer": "C", "explanation": "You cannot get the core antibody without having had the infection. Vaccination produces anti-HBs only; resolved infection produces anti-HBs AND anti-HBc of the IgG class. A negative HBsAg excludes both acute and chronic infection."}, {"id": "18a", "group": 18, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — The two rules", "stem": "His hepatitis C result requires which next test?", "options": [{"letter": "A", "text": "HCV-specific IgM"}, {"letter": "B", "text": "Repeat anti-HCV in six weeks"}, {"letter": "C", "text": "HCV RNA"}, {"letter": "D", "text": "HCV genotype alone"}], "answer": "C", "explanation": "False-positive anti-HCV results occur, and roughly 20% of infected people clear the virus spontaneously. A positive anti-HCV must be followed by direct measurement of viral product in serum — HCV RNA by PCR — which definitively establishes active infection. RNA is detectable as early as 2–3 weeks after exposure."}, {"id": "19", "group": 19, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — A, C, D, E", "stem": "A 35-year-old man has nausea, vomiting, abdominal pain, and cola-colored urine. He returned from Mexico about a month ago and had no pre-travel vaccination or immune globulin. He has icteric sclerae and RUQ tenderness. Serology shows IgM anti-HAV positive, HBsAg negative, IgM anti-HBc negative, and anti-HCV negative. What is his prognosis?", "options": [{"letter": "A", "text": "About a 10% chance of chronic infection"}, {"letter": "B", "text": "Progression to cirrhosis over several years"}, {"letter": "C", "text": "About an 80% chance of chronic infection"}, {"letter": "D", "text": "Complete recovery after several weeks of illness"}], "answer": "D", "explanation": "There is no chronic hepatitis A — the vast majority of patients recover and are immune thereafter, though it may rarely be fulminant. Selective testing of IgM anti-HAV, rather than total anti-HAV, is required for an acute diagnosis, because total anti-HAV is positive with any exposure including vaccination."}, {"id": "20", "group": 20, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — HBV states", "stem": "Which serologic finding defines CHRONIC hepatitis B?", "options": [{"letter": "A", "text": "HBsAg persisting beyond six months"}, {"letter": "B", "text": "Anti-HBc positive with anti-HBs positive"}, {"letter": "C", "text": "HBeAg positive with HBsAg negative"}, {"letter": "D", "text": "IgM anti-HBc persisting beyond six months"}], "answer": "A", "explanation": "Chronic hepatitis B is long-lasting persistence of HBsAg, defined as greater than six months, with anti-HBs absent. No persistent HBsAg means no chronic hepatitis B, whatever else the panel shows. Option D describes resolved infection with immunity."}, {"id": "21", "group": 21, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — A, C, D, E", "stem": "A 44-year-old man with stable chronic hepatitis B for many years abruptly decompensates with rising transaminases and new jaundice. He takes no new medications, drinks no alcohol, and has had no recent travel. Which test should be added?", "options": [{"letter": "A", "text": "IgM anti-HEV"}, {"letter": "B", "text": "HCV-specific IgM"}, {"letter": "C", "text": "Total anti-HDV"}, {"letter": "D", "text": "Total anti-HAV"}], "answer": "C", "explanation": "Hepatitis D always goes along with hepatitis B — you must have B to have D. Consider super-infection with D when a person with stable chronic hepatitis B decompensates. The only test for the virus is total anti-HDV, and if you clear B, you clear D."}, {"id": "22", "group": 22, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — HBV states", "stem": "A patient known to have chronic hepatitis B is found to be HBeAg positive. This indicates:", "options": [{"letter": "A", "text": "Coinfection with hepatitis D"}, {"letter": "B", "text": "Active replication with higher infectivity"}, {"letter": "C", "text": "Resolving infection with developing immunity"}, {"letter": "D", "text": "Immunity acquired through vaccination"}], "answer": "B", "explanation": "The HBeAg/anti-HBe system is only relevant once HBsAg is chronically positive. HBeAg positivity marks active viral replication, higher infectivity, and significant ongoing liver injury. Loss of HBeAg with appearance of anti-HBe is associated with less replication, lower AST/ALT, and less hepatic inflammation."}, {"id": "23", "group": 23, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — Cross-course hooks", "stem": "A 36-year-old woman with many years of injection drug use is seen at her first prenatal visit. She has never received hepatitis A or hepatitis B vaccination. Serologies return: HBsAg negative, total anti-HBc positive, anti-HBs positive, total anti-HAV negative, anti-HCV positive. Which vaccination does she need?", "options": [{"letter": "A", "text": "Neither vaccine"}, {"letter": "B", "text": "Both hepatitis A and B vaccines"}, {"letter": "C", "text": "Hepatitis B vaccine"}, {"letter": "D", "text": "Hepatitis A vaccine"}], "answer": "D", "explanation": "Her hepatitis B panel shows prior resolved infection, so she is already immune to B. Her total anti-HAV is negative, so she is susceptible to A — and you do not want someone with a probable chronic liver disease such as chronic hepatitis C to acquire another viral hepatitis on top of it."}, {"id": "23a", "group": 23, "section": "Viral hepatitis serologies", "objective": "Pattern Guide §2 — Cross-course hooks", "stem": "Which follow-up test does she need?", "options": [{"letter": "A", "text": "HBV DNA"}, {"letter": "B", "text": "HCV RNA"}, {"letter": "C", "text": "Repeat total anti-HBc"}, {"letter": "D", "text": "HBeAg"}], "answer": "B", "explanation": "She cannot have chronic hepatitis B without persistent HBsAg, and hers is negative — so no HBV DNA or HBeAg is needed. Her positive anti-HCV needs reflex HCV RNA, which will likely be positive, since roughly 80% of those exposed to HCV develop chronic infection."}, {"id": "24", "group": 24, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Noninvasive fibrosis panel", "stem": "A 58-year-old man with chronic hepatitis C is compensated, with no ascites, encephalopathy, or known varices. You need to know how much fibrosis he has. Which is the appropriate first-line test?", "options": [{"letter": "A", "text": "MELD 3.0 score"}, {"letter": "B", "text": "FIB-4 score"}, {"letter": "C", "text": "Serum alpha-fetoprotein"}, {"letter": "D", "text": "Percutaneous liver biopsy"}], "answer": "B", "explanation": "Noninvasive assessment comes first and decides who actually needs a biopsy. FIB-4 was originally developed for hepatitis C and is thought to reduce the need for biopsy in about 70% of patients. MELD is a prognosis tool that presumes cirrhosis is already diagnosed — it is not a fibrosis test."}, {"id": "24a", "group": 24, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Noninvasive fibrosis panel", "stem": "His FIB-4 returns at 2.4. This result calls for:", "options": [{"letter": "A", "text": "Starting HCC and variceal surveillance now"}, {"letter": "B", "text": "Repeating the FIB-4 score in five years"}, {"letter": "C", "text": "Liver biopsy or a second noninvasive test"}, {"letter": "D", "text": "Primary care monitoring with no further testing"}], "answer": "C", "explanation": "FIB-4 below 1.45 is low risk and essentially excludes advanced fibrosis; above 3.25 is high risk; 1.45 to 3.25 is indeterminate. Noninvasive tests work best at the extremes and cannot reliably distinguish intermediate stages — which is exactly why an indeterminate result is itself the indication for biopsy."}, {"id": "25", "group": 25, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Noninvasive fibrosis panel", "stem": "Which variables make up the FIB-4 score?", "options": [{"letter": "A", "text": "Bilirubin, INR, albumin, sodium, creatinine"}, {"letter": "B", "text": "Age, BMI, diabetes, AST, ALT, platelets, albumin"}, {"letter": "C", "text": "Bilirubin, albumin, INR, ascites, encephalopathy"}, {"letter": "D", "text": "Age, AST, ALT, platelets"}], "answer": "D", "explanation": "FIB-4 uses only four variables: age, AST, ALT, and platelet count. Option B is the NAFLD Fibrosis Score, option C is MELD 3.0 (plus dialysis and age), and option D describes the Child-Turcotte-Pugh inputs, which mix serum and clinical variables."}, {"id": "26", "group": 26, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Biopsy route", "stem": "A patient with large-volume ascites, a BMI of 46, and an INR of 1.8 needs a liver biopsy because the etiology remains unclear. Which approach is preferred?", "options": [{"letter": "A", "text": "Percutaneous biopsy with ultrasound guidance"}, {"letter": "B", "text": "Transjugular biopsy"}, {"letter": "C", "text": "Percutaneous biopsy after fresh frozen plasma"}, {"letter": "D", "text": "Laparoscopic wedge biopsy"}], "answer": "B", "explanation": "Choose transjugular for massive ascites, morbid obesity, coagulopathy, or a failed percutaneous attempt. A catheter passes from the right internal jugular through the vena cava to the hepatic vein under fluoroscopy, and a TIPS can be placed in the same sitting. Percutaneous biopsy transects the liver capsule, so coagulopathic patients risk intraperitoneal hemorrhage."}, {"id": "27", "group": 27, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Ascites engine", "stem": "A 61-year-old woman reports two months of increasing abdominal girth and early satiety. She is afebrile with a non-tender abdomen, and ultrasound confirms moderate ascites. What is the appropriate next step?", "options": [{"letter": "A", "text": "Therapeutic large-volume paracentesis"}, {"letter": "B", "text": "Diagnostic paracentesis"}, {"letter": "C", "text": "Empiric diuretics with reassessment"}, {"letter": "D", "text": "CT abdomen and pelvis with contrast"}], "answer": "B", "explanation": "ALL patients with new-onset ascites should have a diagnostic paracentesis, as should cirrhotics at every hospital admission. Send cell count and differential, culture inoculated into blood culture bottles at the bedside, and albumin — and draw a serum albumin the SAME day so the SAAG can be calculated."}, {"id": "27a", "group": 27, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — SAAG", "stem": "Serum albumin is 3.0 g/dL and the ascitic fluid albumin is 1.2 g/dL. This indicates:", "options": [{"letter": "A", "text": "Peritoneal malignancy"}, {"letter": "B", "text": "Nephrotic syndrome"}, {"letter": "C", "text": "Tuberculous peritonitis"}, {"letter": "D", "text": "Portal hypertension"}], "answer": "D", "explanation": "SAAG is serum albumin minus ascitic albumin, here 1.8 g/dL. A SAAG of 1.1 or greater indicates portal hypertension with about 97% accuracy — cirrhosis of any etiology, or cardiac ascites from right heart failure or constrictive pericarditis. It is a gradient, a subtraction, not a ratio."}, {"id": "27b", "group": 27, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — SAAG", "stem": "She returns two months later for a repeat tap. What should be sent?", "options": [{"letter": "A", "text": "Cytology and a repeat SAAG"}, {"letter": "B", "text": "Cell count, culture, and a repeat SAAG"}, {"letter": "C", "text": "Cell count and culture only"}, {"letter": "D", "text": "A repeat SAAG only"}], "answer": "C", "explanation": "The SAAG does not need to be repeated after the initial measurement — it is used once to categorize the ascites. Repeat paracenteses are for cell count and culture, to look for spontaneous bacterial peritonitis."}, {"id": "28", "group": 28, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — SBP", "stem": "A 55-year-old man with cirrhosis is admitted confused and febrile with diffuse abdominal tenderness. Ascitic fluid returns a PMN count of 480 cells/mm³. Cultures are pending and the Gram stain is negative. What is the next step?", "options": [{"letter": "A", "text": "Repeat the paracentesis in 24 hours"}, {"letter": "B", "text": "Start a third-generation cephalosporin now"}, {"letter": "C", "text": "Obtain CT to find the intra-abdominal source"}, {"letter": "D", "text": "Await culture results before treating"}], "answer": "B", "explanation": "An ascitic PMN count of 250 cells/mm³ or greater, OR a positive culture, diagnoses SBP. Without early antibiotics mortality is high — treat off the PMN count and do not wait for cultures. Gram stain of ascitic fluid is low yield and a negative one must not reassure you. Empiric therapy is cefotaxime 2 g q8h or ceftriaxone."}, {"id": "28a", "group": 28, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — SBP", "stem": "His ascitic fluid culture grows three different enteric organisms. This suggests:", "options": [{"letter": "A", "text": "Bowel perforation"}, {"letter": "B", "text": "Specimen contamination"}, {"letter": "C", "text": "Unusually severe SBP"}, {"letter": "D", "text": "Concurrent hepatorenal syndrome"}], "answer": "A", "explanation": "A single organism is isolated in most cases of SBP; multiple organisms suggest bowel perforation or secondary peritonitis. By definition SBP is infection of ascitic fluid with NO identifiable intra-abdominal source. Usual SBP organisms are E. coli and Klebsiella, and anaerobes are uncommon."}, {"id": "29", "group": 29, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — SAAG", "stem": "A 64-year-old woman with new-onset ascites has a SAAG of 0.6 g/dL. Which set of causes should you now investigate?", "options": [{"letter": "A", "text": "Cirrhosis, right heart failure, constrictive pericarditis"}, {"letter": "B", "text": "Budd-Chiari syndrome, portal vein thrombosis"}, {"letter": "C", "text": "Peritoneal malignancy, pancreatitis, tuberculosis"}, {"letter": "D", "text": "Hepatorenal syndrome, SBP, hepatic encephalopathy"}], "answer": "C", "explanation": "A SAAG below 1.1 means the ascites is NOT from portal hypertension — serum and ascitic albumin are nearly equal, denoting an extra-hepatic source. Think peritoneal malignancy such as ovarian cancer spread into the peritoneum, a bad case of pancreatitis, or tuberculous peritonitis. A low SAAG is an answer, not a normal result."}, {"id": "30", "group": 30, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Surveillance machine", "stem": "What is the recommended hepatocellular carcinoma surveillance program for a patient with established cirrhosis?", "options": [{"letter": "A", "text": "Triple-phase CT every 12 months"}, {"letter": "B", "text": "Serum AFP every 6 months"}, {"letter": "C", "text": "Liver ultrasound every 12 months"}, {"letter": "D", "text": "Liver ultrasound every 6 months"}], "answer": "D", "explanation": "All cirrhotics warrant liver ultrasound every 6 months, with or without AFP. The interval is 6 months, not annually — a common distractor. AFP alone is not recommended because of poor sensitivity and specificity compared with imaging. Surveillance is cost-effective once annual HCC risk reaches 0.2%, which is why all cirrhotics qualify."}, {"id": "31", "group": 31, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Surveillance machine", "stem": "A 60-year-old woman is newly diagnosed with cirrhosis from MASH. She is compensated and feels well. Besides HCC surveillance, what should be arranged?", "options": [{"letter": "A", "text": "Screening MRCP"}, {"letter": "B", "text": "Screening EGD"}, {"letter": "C", "text": "Screening colonoscopy"}, {"letter": "D", "text": "Screening paracentesis"}], "answer": "B", "explanation": "EGD to screen for esophageal and gastric varices is recommended for all patients when the diagnosis of cirrhosis is made, and repeated every 2–3 years depending on findings. About 30% of compensated and 60% of decompensated cirrhotics have varices at diagnosis, and each variceal hemorrhage carries roughly 20% mortality."}, {"id": "31a", "group": 31, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Surveillance machine", "stem": "Her EGD shows small varices without red wale signs. Prophylaxis is:", "options": [{"letter": "A", "text": "A nonselective beta-blocker"}, {"letter": "B", "text": "Endoscopic variceal ligation"}, {"letter": "C", "text": "A portosystemic shunt procedure"}, {"letter": "D", "text": "A proton pump inhibitor"}], "answer": "A", "explanation": "Small varices get a nonselective beta-blocker — carvedilol, nadolol, or propranolol; large varices get endoscopic variceal ligation. NSBBs block beta-2 receptors in the GI tract, producing splanchnic vasoconstriction that lowers portal and collateral flow. A red wale sign marks recent or impending bleeding."}, {"id": "32", "group": 32, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Decompensation cascade", "stem": "A cirrhotic patient undergoes a large-volume therapeutic paracentesis. Two days later his creatinine has risen from 0.9 to 2.6 mg/dL. He is euvolemic on exam, the urinalysis is bland, and renal ultrasound is normal. What has most likely happened?", "options": [{"letter": "A", "text": "Hepatorenal syndrome"}, {"letter": "B", "text": "Acute tubular necrosis"}, {"letter": "C", "text": "Obstructive uropathy"}, {"letter": "D", "text": "Contrast-associated kidney injury"}], "answer": "A", "explanation": "Hepatorenal syndrome is kidney injury in a patient with cirrhosis and ascites in the ABSENCE of hypovolemia or other kidney pathology, likely from splanchnic vasodilation dropping renal arterial flow. The three named triggers are large-volume ascites drainage, GI bleeding, and SBP."}, {"id": "33", "group": 33, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §3 — Prognosis", "stem": "A patient with established cirrhosis has a MELD 3.0 score of 17. This indicates that he:", "options": [{"letter": "A", "text": "Should be referred for transplant evaluation"}, {"letter": "B", "text": "Has Child-Turcotte-Pugh class A disease"}, {"letter": "C", "text": "Requires an urgent diagnostic paracentesis"}, {"letter": "D", "text": "Has biopsy-proven stage F2 hepatic fibrosis"}], "answer": "A", "explanation": "MELD of 15 or greater triggers referral for transplant evaluation; the average national MELD at transplant is about 20. MELD 3.0 predicts roughly 3-month mortality on a range of 6 to 40, using bilirubin, INR, albumin, sodium, and creatinine plus dialysis status and age. Refer regardless of score if the patient is decompensated."}, {"id": "34", "group": 34, "section": "Cirrhosis, fibrosis & surveillance", "objective": "Pattern Guide §2/§3 — Cross-course hook", "stem": "A 44-year-old man has chronic hepatitis B. Noninvasive testing places him well below the threshold for advanced fibrosis and he has no cirrhosis. Which statement about his hepatocellular carcinoma risk is correct?", "options": [{"letter": "A", "text": "Surveillance applies only to hepatitis C patients"}, {"letter": "B", "text": "Surveillance depends on his alpha-fetoprotein level"}, {"letter": "C", "text": "HCC risk begins only once cirrhosis develops"}, {"letter": "D", "text": "Hepatitis B confers HCC risk without cirrhosis"}], "answer": "D", "explanation": "Patients with most forms of chronic hepatitis are not at increased HCC risk until cirrhosis develops — except chronic hepatitis B, which can cause HCC in the ABSENCE of cirrhosis. The highest overall risk is cirrhosis from hepatitis B, hepatitis C, NASH, and hemochromatosis."}, {"id": "35", "group": 35, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Red flags gate the workup", "stem": "A 24-year-old woman has two days of watery, non-bloody diarrhea and mild cramping. She is afebrile and well hydrated, has had no recent antibiotics or hospitalization, and is not immunosuppressed. What testing is indicated?", "options": [{"letter": "A", "text": "Stool C. difficile toxins A and B"}, {"letter": "B", "text": "Stool culture, leukocytes, and O&P"}, {"letter": "C", "text": "No testing"}, {"letter": "D", "text": "A multipathogen molecular stool panel"}], "answer": "C", "explanation": "Acute diarrhea without red flags needs no testing — most is self-limited viral gastroenteritis or preformed-toxin food poisoning. Red flags that trigger a workup: fever ≥100.4°F, bloody or FOBT-positive stool, immunosuppression, hospitalization or recent antibiotics, prominent pain, profuse diarrhea with dehydration, or failure to improve."}, {"id": "36", "group": 36, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Exposure to organism", "stem": "A 9-year-old boy develops bloody diarrhea and severe cramping three days after a family cookout where hamburgers were served. He is afebrile. Beyond a routine stool culture, what must be specifically requested?", "options": [{"letter": "A", "text": "Stool C. difficile toxin B by NAAT"}, {"letter": "B", "text": "Culture for Vibrio parahaemolyticus"}, {"letter": "C", "text": "Culture for E. coli O157:H7"}, {"letter": "D", "text": "Stool ova and parasites, three specimens"}], "answer": "C", "explanation": "The CDC recommends submitting for EHEC whenever a routine stool culture is ordered, and it should ALWAYS be ordered with bloody diarrhea. These organisms will grow on routine culture but are frequently overlooked unless their isolation is specified. Exposure is undercooked beef or contaminated water, and patients are frequently afebrile."}, {"id": "36a", "group": 36, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Exposure to organism", "stem": "The culture is positive. Management of the infection is:", "options": [{"letter": "A", "text": "Oral azithromycin"}, {"letter": "B", "text": "Supportive care alone"}, {"letter": "C", "text": "Metronidazole and loperamide"}, {"letter": "D", "text": "Intravenous ceftriaxone"}], "answer": "B", "explanation": "Antibiotics are NOT helpful for EHEC and may increase the risk of hemolytic uremic syndrome; care is supportive. About 10–20% develop HUS, usually children, typically 7–10 days after the diarrhea starts — often as the diarrhea is improving."}, {"id": "36b", "group": 36, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Exposure to organism", "stem": "On day 8 he is pale and oliguric: hemoglobin 7.2 g/dL, platelets 48,000, creatinine 2.9 mg/dL, schistocytes on smear. Which result separates this from DIC?", "options": [{"letter": "A", "text": "The presence of schistocytes"}, {"letter": "B", "text": "A normal PT and PTT"}, {"letter": "C", "text": "A positive direct Coombs test"}, {"letter": "D", "text": "The degree of thrombocytopenia"}], "answer": "B", "explanation": "HUS is microangiopathic hemolytic anemia, thrombocytopenia, and acute kidney injury, with a NEGATIVE Coombs because destruction is non-immune. PT/INR and PTT are typically normal in HUS and TTP, which is what separates them from DIC. If HUS is suspected, send stool culture for O157:H7 and stool for Shiga toxin."}, {"id": "37", "group": 37, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Exposure to organism", "stem": "A 78-year-old hospitalized man develops watery diarrhea 10 to 15 times daily with lower abdominal cramping, low-grade fever, and a WBC of 16,000. He finished a course of ceftriaxone eight days ago. What should be sent?", "options": [{"letter": "A", "text": "Flexible sigmoidoscopy looking for pseudomembranes"}, {"letter": "B", "text": "Stool C. difficile toxins A/B"}, {"letter": "C", "text": "Stool calprotectin and lactoferrin levels"}, {"letter": "D", "text": "Stool ova and parasites, three specimens"}], "answer": "B", "explanation": "Test any hospitalized patient who develops diarrhea, and any patient with significant diarrhea during or after antibiotics — usually within 2 weeks but up to 12 weeks after. Assays include NAAT for toxin B, EIA for toxins A and B, and EIA for GDH antigen. Endoscopy is not needed to make the diagnosis."}, {"id": "37a", "group": 37, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Critical pitfall", "stem": "A positive result obtained from a FORMED stool specimen would most likely reflect:", "options": [{"letter": "A", "text": "A false negative result"}, {"letter": "B", "text": "Early fulminant colitis"}, {"letter": "C", "text": "Asymptomatic colonization"}, {"letter": "D", "text": "Toxin degradation in transit"}], "answer": "C", "explanation": "Test only diarrheal, unformed stool. Stool studies may be positive in patients with asymptomatic colonization, so testing formed stool produces a meaningless positive. Perform the test only when there is clinical suspicion for CDI."}, {"id": "38", "group": 38, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Exposure to organism", "stem": "A 31-year-old man has three weeks of foul-smelling diarrhea, bloating, and flatulence that began after a backpacking trip on which he drank from untreated streams. Which test has the best sensitivity and specificity for the likely organism?", "options": [{"letter": "A", "text": "Stool Giardia antigen immunoassay"}, {"letter": "B", "text": "Stool ova and parasites, one specimen"}, {"letter": "C", "text": "Routine bacterial stool culture"}, {"letter": "D", "text": "Serum Giardia IgG antibody"}], "answer": "A", "explanation": "Stool antigen tests and PCR have better sensitivity and specificity than the O&P exam, with faster turnaround — use them when available. Giardia is classic for hikers and campers drinking untreated water, international travelers, daycare outbreaks, and chronic diarrhea. Symptoms usually appear 7–14 days after exposure."}, {"id": "38a", "group": 38, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Exposure to organism", "stem": "If an O&P exam is sent instead, the required collection is:", "options": [{"letter": "A", "text": "Two specimens twelve hours apart"}, {"letter": "B", "text": "Three specimens on three separate days"}, {"letter": "C", "text": "One specimen at any time"}, {"letter": "D", "text": "Three specimens on the same day"}], "answer": "B", "explanation": "Send specimens on three consecutive days, or each separated by at least 24 hours, because parasite excretion is intermittent. This contrasts with bacterial pathogens, where a single specimen suffices and repeats are rarely required."}, {"id": "39", "group": 39, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Exposure to organism", "stem": "A previously healthy 30-year-old man has several weeks of severe, high-volume watery diarrhea. Stool Cryptosporidium antigen is positive. Beyond treating the parasite, what should be done?", "options": [{"letter": "A", "text": "Screen him for celiac disease"}, {"letter": "B", "text": "Perform a hydrogen breath test"}, {"letter": "C", "text": "Screen him for HIV"}, {"letter": "D", "text": "Perform colonoscopy with biopsy"}], "answer": "C", "explanation": "The rule is bidirectional: check for Cryptosporidium in HIV patients with diarrhea, and screen for HIV in any patient with severe Cryptosporidium diarrhea. Cryptosporidium causes self-limited diarrhea in immunocompetent hosts but chronic, severe diarrhea in the immunocompromised."}, {"id": "40", "group": 40, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Paired-result reflexes", "stem": "A 26-year-old woman has six weeks of diarrhea with intermittent blood, crampy pain, and a 12-pound weight loss. Fecal leukocytes are positive; routine and special-order stool cultures are negative; C. difficile toxin is negative. What should you suspect?", "options": [{"letter": "A", "text": "An undetected parasitic infection"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Lactose intolerance"}, {"letter": "D", "text": "Inflammatory bowel disease"}], "answer": "D", "explanation": "Positive fecal leukocytes with NEGATIVE stool cultures should make you think of acute onset of IBD. Fecal leukocytes indicate bowel-wall inflammation but do not distinguish infectious from non-infectious causes. Blood, anemia, weight loss, and nocturnal diarrhea are not features of IBS."}, {"id": "40a", "group": 40, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Paired-result reflexes", "stem": "Which stool biomarker best separates those first two diagnoses?", "options": [{"letter": "A", "text": "Fecal calprotectin"}, {"letter": "B", "text": "Fecal occult blood"}, {"letter": "C", "text": "Fecal fat by Sudan stain"}, {"letter": "D", "text": "Fecal elastase-1"}], "answer": "A", "explanation": "Fecal calprotectin, a neutrophil-derived calcium- and zinc-binding protein, is 92% sensitive and 82% specific for IBD in patients with chronic diarrhea, and is used to distinguish IBD from IBS. Lactoferrin is the other neutrophil marker and is more sensitive and less variable than the fecal leukocyte smear."}, {"id": "41", "group": 41, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Enzyme cutoffs", "stem": "A 44-year-old woman has sudden severe epigastric pain radiating to the back, worse lying flat and better leaning forward, with prominent vomiting. Serum lipase is 1,240 U/L with an upper limit of normal of 60. Which statement is correct?", "options": [{"letter": "A", "text": "She meets diagnostic criteria without imaging"}, {"letter": "B", "text": "This level indicates necrotizing disease"}, {"letter": "C", "text": "CT is required to confirm before treatment"}, {"letter": "D", "text": "Daily lipase levels should be followed"}], "answer": "A", "explanation": "Diagnosis requires 2 of 3: characteristic abdominal pain, lipase and/or amylase at least 3× ULN, and characteristic inflammation on imaging — and imaging is not routinely needed to establish the diagnosis. Classic presentation plus an elevated lipase is usually all you need."}, {"id": "41a", "group": 41, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Enzyme cutoffs", "stem": "Her family asks whether the very high lipase means severe disease. The level:", "options": [{"letter": "A", "text": "Predicts pancreatic necrosis"}, {"letter": "B", "text": "Is scored in the Ranson criteria"}, {"letter": "C", "text": "Does not correlate with severity"}, {"letter": "D", "text": "Predicts the need for ERCP"}], "answer": "C", "explanation": "The degree of enzyme elevation does not correlate with severity, and no severity score — Ranson's or BISAP — includes the lipase level. Severity markers are a rising hematocrit or WBC, elevated LDH, CRP above 150 mg/L at 48–72 hours, and SIRS on day 1."}, {"id": "42", "group": 42, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Enzyme cutoffs", "stem": "A 58-year-old man with many years of heavy alcohol use has months of large, greasy, foul-smelling stools and a 25-pound weight loss. His serum lipase is normal. Which test best supports the likely diagnosis?", "options": [{"letter": "A", "text": "Repeat lipase and amylase"}, {"letter": "B", "text": "Serum CA 19-9"}, {"letter": "C", "text": "Fecal pancreatic elastase-1"}, {"letter": "D", "text": "Lactose hydrogen breath test"}], "answer": "C", "explanation": "Lipase may be NORMAL in advanced chronic pancreatitis, because parenchymal atrophy and fibrosis leave less enzyme to release. Fecal elastase-1 is a direct marker of exocrine function: normal is above 200 μg/g and below 100 μg/g indicates severe exocrine insufficiency. Enzyme supplementation does not interfere with the result."}, {"id": "42a", "group": 42, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Enzyme cutoffs", "stem": "His steatorrhea implies loss of at least how much exocrine function?", "options": [{"letter": "A", "text": "50%"}, {"letter": "B", "text": "75%"}, {"letter": "C", "text": "25%"}, {"letter": "D", "text": "90%"}], "answer": "D", "explanation": "In chronic pancreatitis, steatorrhea appears only once about 90% of exocrine function has been lost — it is a LATE manifestation, along with weight loss. Expect fat-soluble vitamin A, D, E, and K deficiencies, and remember that vitamin K deficiency can prolong the PT."}, {"id": "43", "group": 43, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — H. pylori", "stem": "A 34-year-old woman has three months of gnawing epigastric pain. She has no weight loss, anemia, vomiting, or family history of GI cancer, and she has been taking omeprazole daily for the past month. What is the preferred initial approach?", "options": [{"letter": "A", "text": "H. pylori serology now, while she is on the PPI"}, {"letter": "B", "text": "Hold the PPI two weeks, then stool antigen testing"}, {"letter": "C", "text": "Stool antigen testing now, while she is on the PPI"}, {"letter": "D", "text": "EGD with biopsy and a rapid urease test now"}], "answer": "B", "explanation": "Non-invasive testing is preferred for a patient this age with no alarm features — but PPIs cause false NEGATIVES, so hold them for 2 weeks first, and hold antibiotics or bismuth for 4 weeks. Serology is discouraged for lower sensitivity and specificity. Ideally the patient is also off PPIs for 2 weeks before a rapid urease test."}, {"id": "43a", "group": 43, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — H. pylori", "stem": "She completes eradication therapy. Cure should be confirmed with:", "options": [{"letter": "A", "text": "Serology immediately after therapy"}, {"letter": "B", "text": "Urea breath test four weeks after therapy"}, {"letter": "C", "text": "Serology four weeks after therapy"}, {"letter": "D", "text": "Repeat EGD with biopsy at six months"}], "answer": "B", "explanation": "Confirm eradication at least 4 weeks after completing therapy, using stool antigen or urea breath testing and documenting a negative result. Serology absolutely cannot be used to confirm eradication because antibodies remain positive for years."}, {"id": "44", "group": 44, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Alarm features", "stem": "A 66-year-old man reports new epigastric burning over the past two months, along with a 15-pound unintentional weight loss and dark, tarry stools. What is the appropriate initial approach?", "options": [{"letter": "A", "text": "Empiric high-dose PPI for eight weeks"}, {"letter": "B", "text": "EGD with biopsy"}, {"letter": "C", "text": "Stool antigen testing and empiric therapy"}, {"letter": "D", "text": "Upper GI series with double contrast"}], "answer": "B", "explanation": "Alarm features mandate EGD up front: age 60 or older per the ACG, unintentional weight loss or anorexia, iron deficiency anemia or melena, persistent vomiting, a palpable mass or Virchow node, or a family history of upper GI cancer. The purpose is to avoid missing gastric malignancy and to allow therapy in the same sitting."}, {"id": "45", "group": 45, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Paired-result reflexes", "stem": "A 29-year-old woman has chronic diarrhea, bloating, unexplained iron deficiency anemia, and an intensely itchy vesicular rash on her elbows. Six weeks ago she started a strict gluten-free diet on her own and reports feeling much better. What is the appropriate next step?", "options": [{"letter": "A", "text": "Proceed directly to duodenal biopsy at EGD"}, {"letter": "B", "text": "Resume a gluten-containing diet, then test tTG IgA"}, {"letter": "C", "text": "Accept the dietary response as diagnostic"}, {"letter": "D", "text": "Test tTG IgA now, while she remains gluten-free"}], "answer": "B", "explanation": "Do ALL celiac testing — serology AND biopsy — while the patient is eating gluten; a patient already gluten-free will test falsely negative on both. A definitive diagnosis matters because treatment is a lifelong gluten-free diet, and because compliance mitigates the increased risk of celiac-associated malignancy."}, {"id": "46", "group": 46, "section": "GI labs, stool & pancreas", "objective": "Pattern Guide §4 — Enzyme cutoffs", "stem": "On a lactose hydrogen breath test, which rise in breath hydrogen above baseline is diagnostic of lactose malabsorption?", "options": [{"letter": "A", "text": "More than 50 ppm"}, {"letter": "B", "text": "More than 35 ppm"}, {"letter": "C", "text": "More than 20 ppm"}, {"letter": "D", "text": "More than 10 ppm"}], "answer": "C", "explanation": "An increase over 20 ppm is diagnostic; 10–20 ppm is indeterminate unless accompanied by symptoms; up to 10 ppm is normal. Remember the breath test is not the first step — a 2-week lactose elimination diet with rechallenge makes the presumptive diagnosis in an otherwise healthy patient."}, {"id": "47", "group": 47, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Dysphagia engine", "stem": "A 63-year-old woman is three days out from a left middle cerebral artery stroke. Nursing reports that she coughs during meals, and she has spiked a fever to 100.8°F. Which study is most appropriate?", "options": [{"letter": "A", "text": "Upper endoscopy (EGD)"}, {"letter": "B", "text": "Modified barium swallow"}, {"letter": "C", "text": "Standard barium esophagram"}, {"letter": "D", "text": "High-resolution esophageal manometry"}], "answer": "B", "explanation": "Coughing with meals after a CVA is oropharyngeal or \"transfer\" dysphagia, most often due to CNS disorders. The modified barium swallow uses varying consistencies with a speech-language pathologist, and is ordered not only to name a diagnosis but to determine optimal feeding techniques and minimize aspiration risk."}, {"id": "48", "group": 48, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Dysphagia engine", "stem": "A 74-year-old man says food sticks \"in his throat.\" He regurgitates undigested food hours after meals, has noticeable halitosis, and finds food on his pillow in the morning. Which lesion is most likely?", "options": [{"letter": "A", "text": "Zenker diverticulum"}, {"letter": "B", "text": "Esophageal carcinoma"}, {"letter": "C", "text": "Schatzki ring"}, {"letter": "D", "text": "Achalasia"}], "answer": "A", "explanation": "Zenker diverticulum is an outpouching posteriorly, proximal to the upper esophageal sphincter at Killian's triangle. The classic story is a middle-aged or elderly patient with regurgitation of undigested food, halitosis, cough after eating, aspiration pneumonia, and food on the pillow in the morning."}, {"id": "48a", "group": 48, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — EGD vs barium", "stem": "Why is a barium study preferred over endoscopy here?", "options": [{"letter": "A", "text": "Only barium can obtain tissue for histology"}, {"letter": "B", "text": "Barium can size the lesion and endoscopy cannot"}, {"letter": "C", "text": "Only barium measures sphincter pressures"}, {"letter": "D", "text": "The scope may miss it and risks perforating it"}], "answer": "D", "explanation": "Barium swallow beats endoscopy for diverticula: small-mouthed diverticula are missed endoscopically, and there is a real risk of diverticular perforation with the scope. Upper endoscopy is in fact the most common cause of esophageal perforation, with higher risk in patients with esophageal diverticula."}, {"id": "49", "group": 49, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Dysphagia engine", "stem": "A 52-year-old man describes three episodes over the past year of meat lodging in his chest at a restaurant, each clearing after a few minutes. Between episodes he swallows normally, including liquids. He has lost no weight and has no anemia. Which diagnosis fits best?", "options": [{"letter": "A", "text": "Esophageal carcinoma"}, {"letter": "B", "text": "Peptic stricture"}, {"letter": "C", "text": "Schatzki ring"}, {"letter": "D", "text": "Diffuse esophageal spasm"}], "answer": "C", "explanation": "Intermittent, non-progressive, solid-food-only dysphagia in a patient over 40, with weeks between episodes and no bleeding or weight loss, is a Schatzki ring — \"steakhouse syndrome.\" Rings 13 mm or smaller are more likely symptomatic and meat impaction is a common complication. A peptic stricture causes progressively worsening dysphagia."}, {"id": "50", "group": 50, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Sign lexicon", "stem": "A 46-year-old woman has two years of slowly progressive difficulty swallowing both solids and liquids, with regurgitation of undigested food and a nocturnal cough. Barium swallow shows a dilated esophagus with abrupt distal narrowing. This appearance is called:", "options": [{"letter": "A", "text": "Corkscrew"}, {"letter": "B", "text": "Apple core"}, {"letter": "C", "text": "String sign"}, {"letter": "D", "text": "Bird's beak"}], "answer": "D", "explanation": "Dysphagia to both solids and liquids points to a motility disorder, and the bird's beak is achalasia — progressive dysphagia to solids in 91% and liquids in 85%, with chest pain, regurgitation, and cough from aspiration. Patients usually have mild symptoms for several years before seeking evaluation."}, {"id": "50a", "group": 50, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Related tests", "stem": "Which study confirms the diagnosis?", "options": [{"letter": "A", "text": "Repeat barium with a 13 mm tablet"}, {"letter": "B", "text": "Esophageal manometry"}, {"letter": "C", "text": "CT chest with contrast"}, {"letter": "D", "text": "Esophagogastroduodenoscopy"}], "answer": "B", "explanation": "Manometry measures pressure and contraction patterns while barium swallow assesses structure and movement. Aperistalsis plus incomplete LES relaxation without mechanical obstruction solidifies the diagnosis of achalasia. Manometry is also ordered for persistent dysphagia with no explanation on endoscopy, and for non-cardiac chest pain."}, {"id": "51", "group": 51, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Dysphagia engine", "stem": "A 55-year-old woman has episodes of severe retrosternal chest pain accompanied by difficulty swallowing both solids and liquids. A full cardiac workup including stress testing is negative. Which barium finding would you expect?", "options": [{"letter": "A", "text": "An annular constricting lesion"}, {"letter": "B", "text": "A bird's beak narrowing"}, {"letter": "C", "text": "A smooth tapered distal narrowing"}, {"letter": "D", "text": "A corkscrew esophagus"}], "answer": "D", "explanation": "Diffuse esophageal spasm produces the corkscrew esophagus and causes dysphagia to solids and liquids with severe retrosternal chest pain that can mimic cardiac pain. On manometry it shows simultaneous high-pressure non-peristaltic contractions."}, {"id": "52", "group": 52, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Dysphagia engine", "stem": "A 58-year-old man with a long smoking history reports dysphagia to solids that has worsened rapidly over eight weeks. He now has pain on swallowing, a 22-pound weight loss, and heme-positive stools. What is the best next step?", "options": [{"letter": "A", "text": "Barium esophagram"}, {"letter": "B", "text": "Esophageal manometry"}, {"letter": "C", "text": "EGD with biopsy"}, {"letter": "D", "text": "CT chest with contrast"}], "answer": "C", "explanation": "Rapidly progressive dysphagia with odynophagia, weight loss, anemia, and heme-positive stool is esophageal carcinoma until proven otherwise. Barium may show the apple-core lesion, but you still need tissue — so go to EGD with biopsy, which diagnoses and can palliate in the same sitting."}, {"id": "53", "group": 53, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Sign lexicon", "stem": "A 24-year-old man has months of crampy right lower quadrant pain, non-bloody diarrhea, and weight loss. Which study and finding would best support small bowel Crohn disease?", "options": [{"letter": "A", "text": "Capsule endoscopy showing an apple-core lesion"}, {"letter": "B", "text": "Upper GI series showing linitis plastica"}, {"letter": "C", "text": "Barium enema showing extensive pseudopolyposis"}, {"letter": "D", "text": "Small bowel follow-through showing a string sign"}], "answer": "D", "explanation": "SBFT is ordered for suspected small bowel Crohn disease and partial SBO. The string sign is a markedly narrowed terminal ileum; the \"proud loop\" stands apart from the other loops because transmural inflammation and creeping fat separate it. Enteric fistulae are a common complication of Crohn."}, {"id": "54", "group": 54, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Contrast rule", "stem": "A patient two days after esophagectomy develops fever and chest pain, and an anastomotic leak is suspected. A contrast study is ordered. Which agent should be used, and why?", "options": [{"letter": "A", "text": "Gastrografin, because barium is directly nephrotoxic"}, {"letter": "B", "text": "Barium with air, because subtle leaks need double contrast"}, {"letter": "C", "text": "Gastrografin, because barium causes mediastinitis"}, {"letter": "D", "text": "Barium, because it coats mucosa and shows small leaks"}], "answer": "C", "explanation": "Barium is contraindicated when perforation or anastomotic leak is suspected because it causes mediastinitis in the chest and peritonitis in the abdomen. Use water-soluble, iodine-based Gastrografin — and you must request it by name, because the default will be barium. Endoscopy is also contraindicated with suspected perforation."}, {"id": "55", "group": 55, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Contrast rule", "stem": "A patient with a suspected high-grade small bowel obstruction needs a contrast study; there is no concern for perforation. Why is Gastrografin still preferred over barium?", "options": [{"letter": "A", "text": "Barium is systemically absorbed in obstruction"}, {"letter": "B", "text": "Barium may inspissate proximal to the block"}, {"letter": "C", "text": "Gastrografin gives better mucosal detail"}, {"letter": "D", "text": "Barium cannot be given to a vomiting patient"}], "answer": "B", "explanation": "Barium is a poor choice with suspected high-grade obstruction because it is constipating and may inspissate proximal to the block. Gastrografin is water-soluble and can be therapeutic in SBO or partial SBO, although it more commonly causes diarrhea."}, {"id": "56", "group": 56, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Screening ladder", "stem": "A healthy 48-year-old man with no family history of colorectal cancer asks about screening. Which test does the American College of Gastroenterology prefer when available?", "options": [{"letter": "A", "text": "Flexible sigmoidoscopy every 5 years"}, {"letter": "B", "text": "Annual fecal immunochemical test"}, {"letter": "C", "text": "Barium enema every 5 years"}, {"letter": "D", "text": "Colonoscopy"}], "answer": "D", "explanation": "Colonoscopy is the ACG-preferred screening test when available, because it has the highest sensitivity for CRC and adenomatous polyps and allows diagnosis, biopsy, and polypectomy in one procedure. USPSTF 2021 alternatives include sigmoidoscopy every 5 years, or every 10 years with annual FIT."}, {"id": "56a", "group": 56, "section": "Contrast studies & endoscopy", "objective": "Pattern Guide §5 — Screening ladder", "stem": "He chooses sigmoidoscopy and a 7 mm sigmoid polyp is found. The next step is:", "options": [{"letter": "A", "text": "Repeat sigmoidoscopy in five years"}, {"letter": "B", "text": "Full colonoscopy"}, {"letter": "C", "text": "Annual fecal immunochemical testing"}, {"letter": "D", "text": "Double-contrast barium enema"}], "answer": "B", "explanation": "
