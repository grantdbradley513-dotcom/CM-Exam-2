teoblast activity is the 'other' mechanism.", "objective": "", "remediation": {"steps": [{"stem": "Osteoporosis is an imbalance of remodeling. Which direction tips the balance in MOST patients?", "options": [{"letter": "A", "text": "Too much resorption"}, {"letter": "B", "text": "Too little formation"}], "answer": "A", "explanation": "Most patients lose bone because osteoclasts resorb faster than osteoblasts rebuild.", "teach": "Osteoporosis = **imbalance of bone remodeling**. One side of the seesaw dominates in most patients."}], "checkpoints": [{"stem": "Which statement best describes osteoporosis as defined in the lecture?", "options": [{"letter": "A", "text": "Loss of trabecular and cortical bone mass → weakness and fracture risk"}, {"letter": "B", "text": "Failure to mineralize newly formed bone matrix"}, {"letter": "C", "text": "Focal disorganized remodeling of one bone"}, {"letter": "D", "text": "Autoimmune destruction of synovial joints"}], "answer": "A", "explanation": "Osteoporosis is loss of both trabecular and cortical mass → increased susceptibility to fragility fracture. It is the most common skeletal disorder."}]}}, {"id": "3", "group": 3, "section": "Bone physiology & treatment strategy", "topic": "Osteoporosis pathophysiology", "skill": "Identification", "stem": "What term describes decreased bone strength that is less severe than osteoporosis?", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Osteomalacia"}, {"letter": "C", "text": "Osteitis deformans"}, {"letter": "D", "text": "Osteopetrosis"}], "answer": "A", "explanation": "**Osteopenia** = decreased bone strength, less severe than osteoporosis (T-score −1.0 to −2.5).", "objective": "", "remediation": {"steps": [{"stem": "Which term is the lecture's name for the stage BEFORE osteoporosis?", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Osteomalacia"}], "answer": "A", "explanation": "Osteopenia is low bone mass short of the osteoporosis threshold; osteomalacia is a mineralization problem.", "teach": "The lecture names a milder, earlier stage of bone loss on the same spectrum."}], "checkpoints": [{"stem": "T-score range that defines osteopenia →", "options": [{"letter": "A", "text": "−1.0 to −2.5"}, {"letter": "B", "text": "≥ −1.0"}, {"letter": "C", "text": "≤ −2.5"}, {"letter": "D", "text": "−2.5 to −3.5"}], "answer": "A", "explanation": "Normal ≥ −1.0; osteopenia −1.0 to −2.5; osteoporosis ≤ −2.5."}]}}, {"id": "4", "group": 4, "section": "Bone physiology & treatment strategy", "topic": "Treatment strategies", "skill": "Pharmacology", "stem": "Which type of therapy decreases osteoclast-mediated bone loss?", "options": [{"letter": "A", "text": "Antiresorptive therapy"}, {"letter": "B", "text": "Anabolic therapy"}, {"letter": "C", "text": "Dual-action therapy"}, {"letter": "D", "text": "Replacement therapy"}], "answer": "A", "explanation": "**Antiresorptive** = ↓ osteoclast resorption (bisphosphonates, denosumab, SERMs, estrogen). Anabolic = ↑ formation. Dual-action = both.", "objective": "", "remediation": {"steps": [{"stem": "Which cell does an ANTI-resorptive drug target?", "options": [{"letter": "A", "text": "Osteoclast"}, {"letter": "B", "text": "Osteoblast"}], "answer": "A", "explanation": "Resorption is osteoclast work; 'anti-resorptive' blocks it.", "teach": "Break the word apart: **anti** + **resorptive**. Resorption is one specific cell's job."}], "checkpoints": [{"stem": "Which agent is the lecture's only DUAL-ACTION drug (↑ formation AND ↓ resorption)?", "options": [{"letter": "A", "text": "Romosozumab"}, {"letter": "B", "text": "Teriparatide"}, {"letter": "C", "text": "Alendronate"}, {"letter": "D", "text": "Raloxifene"}], "answer": "A", "explanation": "Romosozumab (sclerostin inhibitor) both builds bone and decreases resorption."}]}}, {"id": "5", "group": 5, "section": "Bone physiology & treatment strategy", "topic": "Treatment strategies", "skill": "Pharmacology", "stem": "To which treatment category do teriparatide and abaloparatide belong?", "options": [{"letter": "A", "text": "Anabolic"}, {"letter": "B", "text": "Antiresorptive"}, {"letter": "C", "text": "Dual-action"}, {"letter": "D", "text": "Hormone replacement"}], "answer": "A", "explanation": "PTH analogs **increase bone formation** — anabolic (bone-building) therapy.", "objective": "", "remediation": {"steps": [{"stem": "What does 'anabolic' mean for bone?", "options": [{"letter": "A", "text": "Builds new bone"}, {"letter": "B", "text": "Blocks bone breakdown"}], "answer": "A", "explanation": "Anabolic = building. PTH analogs stimulate osteoblasts.", "teach": "The TL;DR slide: *antiresorptives prevent bone loss; anabolic agents build bone; romosozumab does both.*"}], "checkpoints": [{"stem": "Which cell do PTH analogs primarily stimulate?", "options": [{"letter": "A", "text": "Osteoblast"}, {"letter": "B", "text": "Osteoclast"}, {"letter": "C", "text": "Osteocyte"}, {"letter": "D", "text": "Macrophage"}], "answer": "A", "explanation": "Intermittent PTH preferentially stimulates osteoblasts → net bone formation."}]}}, {"id": "6", "group": 6, "section": "Drug-induced & secondary osteoporosis", "topic": "Drug-induced osteoporosis", "skill": "Disease process", "stem": "What is the most common cause of drug-induced osteoporosis?", "options": [{"letter": "A", "text": "Long-term corticosteroids"}, {"letter": "B", "text": "Proton pump inhibitors"}, {"letter": "C", "text": "Heparin"}, {"letter": "D", "text": "Phenytoin"}], "answer": "A", "explanation": "Long-term **corticosteroids** (e.g., autoimmune patient on >5 mg prednisone >3 months) are the most common drug cause.", "objective": "", "remediation": {"steps": [{"stem": "Which patient population is the lecture's example for drug-induced osteoporosis?", "options": [{"letter": "A", "text": "Autoimmune patient on chronic prednisone"}, {"letter": "B", "text": "Reflux patient on omeprazole"}], "answer": "A", "explanation": "Chronic glucocorticoids are the classic and most common culprit.", "teach": "All four options CAN cause bone loss. The question asks which is **most common**."}], "checkpoints": [{"stem": "A 45-year-old woman with lupus has taken prednisone 10 mg daily for 2 years. Beyond osteoporosis risk, this exposure is also a reason to →", "options": [{"letter": "A", "text": "Screen her with DXA despite her age"}, {"letter": "B", "text": "Avoid all bisphosphonates"}, {"letter": "C", "text": "Start estrogen therapy"}, {"letter": "D", "text": "Check a FRAX only after age 65"}], "answer": "A", "explanation": "Chronic glucocorticoid use is an 'important risk factor' that justifies DXA in younger patients (and continuing therapy longer)."}]}}, {"id": "7", "group": 7, "section": "Drug-induced & secondary osteoporosis", "topic": "Drug-induced osteoporosis", "skill": "Disease process", "stem": "Which drug class includes phenytoin, carbamazepine, and barbiturates and can cause osteoporosis?", "options": [{"letter": "A", "text": "Anticonvulsants"}, {"letter": "B", "text": "Aromatase inhibitors"}, {"letter": "C", "text": "Immunosuppressants"}, {"letter": "D", "text": "Anticoagulants"}], "answer": "A", "explanation": "The **anticonvulsants** on the slide: phenytoin, carbamazepine, barbiturates.", "objective": "", "remediation": {"steps": [{"stem": "Phenytoin is used to treat →", "options": [{"letter": "A", "text": "Seizures"}, {"letter": "B", "text": "Breast cancer"}], "answer": "A", "explanation": "Phenytoin, carbamazepine and barbiturates are antiseizure drugs — the anticonvulsant class.", "teach": "Identify what these three drugs are used for; the class follows."}], "checkpoints": [{"stem": "Anastrozole and letrozole belong to which osteoporosis-causing class?", "options": [{"letter": "A", "text": "Aromatase inhibitors"}, {"letter": "B", "text": "Anticonvulsants"}, {"letter": "C", "text": "Immunosuppressants"}, {"letter": "D", "text": "Thyroid replacement"}], "answer": "A", "explanation": "Aromatase inhibitors (breast cancer) strip estrogen → bone loss."}]}}, {"id": "8", "group": 8, "section": "Drug-induced & secondary osteoporosis", "topic": "Drug-induced osteoporosis", "skill": "Disease process", "stem": "Which drug class includes cyclosporine and tacrolimus and can cause osteoporosis?", "options": [{"letter": "A", "text": "Immunosuppressants"}, {"letter": "B", "text": "Anticoagulants"}, {"letter": "C", "text": "Anticonvulsants"}, {"letter": "D", "text": "Androgen-deprivation therapy"}], "answer": "A", "explanation": "**Immunosuppressants** (transplant drugs) cyclosporine and tacrolimus cause bone loss.", "objective": "", "remediation": {"steps": [{"stem": "Cyclosporine and tacrolimus are primarily used for →", "options": [{"letter": "A", "text": "Preventing transplant rejection"}, {"letter": "B", "text": "Preventing blood clots"}], "answer": "A", "explanation": "They are calcineurin-inhibitor immunosuppressants.", "teach": "Think about the patient who takes these two drugs."}], "checkpoints": [{"stem": "Which anticoagulant is listed as a cause of drug-induced osteoporosis?", "options": [{"letter": "A", "text": "Heparin"}, {"letter": "B", "text": "Warfarin"}, {"letter": "C", "text": "Apixaban"}, {"letter": "D", "text": "Clopidogrel"}], "answer": "A", "explanation": "Heparin is the anticoagulant on the slide."}]}}, {"id": "9", "group": 9, "section": "Drug-induced & secondary osteoporosis", "topic": "Drug-induced osteoporosis", "skill": "Disease process", "stem": "How does excessive levothyroxine affect bone?", "options": [{"letter": "A", "text": "Causes osteoporosis"}, {"letter": "B", "text": "Protects against osteoporosis"}, {"letter": "C", "text": "No effect on bone"}, {"letter": "D", "text": "Causes osteomalacia"}], "answer": "A", "explanation": "**Over-replacement** of thyroid hormone (iatrogenic hyperthyroidism) causes bone loss — hyperthyroidism is also a secondary cause.", "objective": "", "remediation": {"steps": [{"stem": "Which endocrine state is listed as a SECONDARY cause of osteoporosis?", "options": [{"letter": "A", "text": "Hyperthyroidism"}, {"letter": "B", "text": "Hypothyroidism"}], "answer": "A", "explanation": "Excess thyroid hormone (endogenous or from too much levothyroxine) accelerates bone turnover.", "teach": "Too much levothyroxine mimics an endocrine disease on the secondary-causes slide."}], "checkpoints": [{"stem": "A patient's PPI, taken for years, is listed on the lecture's drug-induced osteoporosis slide. Which other GI-related mechanism on the secondary-causes slide also reduces bone mass?", "options": [{"letter": "A", "text": "Malabsorption such as celiac disease"}, {"letter": "B", "text": "Peptic ulcer disease"}, {"letter": "C", "text": "Gastroesophageal reflux"}, {"letter": "D", "text": "Irritable bowel syndrome"}], "answer": "A", "explanation": "Malabsorption (incl. celiac) is a secondary cause; PPIs are a drug cause."}]}}, {"id": "10", "group": 10, "section": "Drug-induced & secondary osteoporosis", "topic": "Secondary osteoporosis", "skill": "Disease process", "stem": "How are hypercortisolism, hypogonadism, hyperparathyroidism, chronic kidney disease, multiple myeloma, and rheumatoid arthritis related to osteoporosis?", "options": [{"letter": "A", "text": "Secondary causes of osteoporosis"}, {"letter": "B", "text": "Contraindications to bisphosphonates"}, {"letter": "C", "text": "Indications for teriparatide"}, {"letter": "D", "text": "FRAX exclusion criteria"}], "answer": "A", "explanation": "The **secondary osteoporosis** slide: hypercortisolism, hypogonadism, hyperthyroidism, hyperparathyroidism, CKD, malabsorption/celiac, myeloma, RA.", "objective": "", "remediation": {"steps": [{"stem": "'Secondary' osteoporosis means bone loss that is →", "options": [{"letter": "A", "text": "Caused by another disease or drug"}, {"letter": "B", "text": "Found on a second DXA scan"}], "answer": "A", "explanation": "Secondary = driven by an identifiable underlying condition; correcting it is part of treatment.", "teach": "These are all diseases. Ask what role a list of diseases plays in an osteoporosis lecture."}], "checkpoints": [{"stem": "Which lab on the baseline panel screens for the parathyroid cause on this list?", "options": [{"letter": "A", "text": "PTH"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "CBC"}, {"letter": "D", "text": "Alkaline phosphatase"}], "answer": "A", "explanation": "PTH screens for hyperparathyroidism."}]}}, {"id": "11", "group": 11, "section": "Screening, risk factors & diagnosis", "topic": "Fracture risk factors", "skill": "Disease process", "stem": "What do prior fragility fracture, parental hip fracture, low body weight, smoking, alcohol use, glucocorticoid use, and older age represent in an osteoporosis assessment?", "options": [{"letter": "A", "text": "Fracture risk factors independent of BMD"}, {"letter": "B", "text": "Contraindications to DXA"}, {"letter": "C", "text": "Secondary causes of osteoporosis"}, {"letter": "D", "text": "Indications for anabolic therapy"}], "answer": "A", "explanation": "The **fracture risk factor** slide — the clinical risks that raise fracture probability regardless of bone density (the FRAX inputs).", "objective": "", "remediation": {"steps": [{"stem": "These items are ALSO the questions asked by which tool?", "options": [{"letter": "A", "text": "FRAX"}, {"letter": "B", "text": "DXA"}], "answer": "A", "explanation": "FRAX combines these clinical risk factors (± femoral-neck BMD) into a 10-year fracture probability.", "teach": "Look at the list: none of them is a bone-density number. They describe the patient, not the scan."}], "checkpoints": [{"stem": "Which of these is a fracture risk factor independent of BMD?", "options": [{"letter": "A", "text": "Parental history of hip fracture"}, {"letter": "B", "text": "High body weight"}, {"letter": "C", "text": "Daily calcium supplementation"}, {"letter": "D", "text": "Female sex before menopause"}], "answer": "A", "explanation": "Parental hip fracture is on the risk-factor list."}]}}, {"id": "12", "group": 12, "section": "Screening, risk factors & diagnosis", "topic": "Screening", "skill": "Counseling & prevention", "stem": "At what age does routine DXA screening begin for all women?", "options": [{"letter": "A", "text": "65"}, {"letter": "B", "text": "50"}, {"letter": "C", "text": "60"}, {"letter": "D", "text": "70"}], "answer": "A", "explanation": "**Women ≥65** → screen with DXA. Postmenopausal women <65 → assess risk factors (FRAX) first.", "objective": "", "remediation": {"steps": [{"stem": "For a postmenopausal woman UNDER 65, what comes first?", "options": [{"letter": "A", "text": "Assess clinical risk factors (FRAX)"}, {"letter": "B", "text": "Routine DXA"}], "answer": "A", "explanation": "Under 65 → risk assessment; DXA only if risk is increased. At 65 → everyone gets DXA.", "teach": "The lecture splits women into two groups by age; one gets DXA automatically."}], "checkpoints": [{"stem": "A 58-year-old postmenopausal woman with no risk factors asks about bone density testing. Next step →", "options": [{"letter": "A", "text": "Assess clinical risk factors with FRAX"}, {"letter": "B", "text": "Order DXA now"}, {"letter": "C", "text": "Start alendronate empirically"}, {"letter": "D", "text": "Repeat the visit at 70"}], "answer": "A", "explanation": "Postmenopausal <65 → risk factors first."}]}}, {"id": "13", "group": 13, "section": "Screening, risk factors & diagnosis", "topic": "Screening", "skill": "Counseling & prevention", "stem": "At what age should DXA screening be considered in men?", "options": [{"letter": "A", "text": "≥70"}, {"letter": "B", "text": "≥65"}, {"letter": "C", "text": "≥60"}, {"letter": "D", "text": "≥50"}], "answer": "A", "explanation": "Men: routine screening uncertain; consider DXA in **men ≥70**, or younger men with glucocorticoid use or androgen-deprivation therapy.", "objective": "", "remediation": {"steps": [{"stem": "Which younger man should be considered for DXA?", "options": [{"letter": "A", "text": "A man on long-term glucocorticoids or ADT"}, {"letter": "B", "text": "Any man over 50"}], "answer": "A", "explanation": "Younger men need an important risk factor — chronic steroids or androgen-deprivation therapy.", "teach": "Men's screening age is later than women's, with exceptions for two specific exposures."}], "checkpoints": [{"stem": "A 62-year-old man with prostate cancer on leuprolide (androgen-deprivation therapy). Regarding bone density →", "options": [{"letter": "A", "text": "Consider DXA now"}, {"letter": "B", "text": "No DXA until 70"}, {"letter": "C", "text": "DXA only after a fracture"}, {"letter": "D", "text": "FRAX cannot be used in men"}], "answer": "A", "explanation": "ADT is an important risk factor that justifies DXA in a man under 70."}]}}, {"id": "14", "group": 14, "section": "Screening, risk factors & diagnosis", "topic": "Screening", "skill": "Diagnostics & imaging", "stem": "What are the preferred sites for DXA measurement?", "options": [{"letter": "A", "text": "Lumbar spine and hip/femoral neck"}, {"letter": "B", "text": "Wrist and heel"}, {"letter": "C", "text": "Skull and pelvis"}, {"letter": "D", "text": "Ribs and tibia"}], "answer": "A", "explanation": "Preferred DXA sites: **lumbar spine** and **total hip or femoral neck**.", "objective": "", "remediation": {"steps": [{"stem": "Which skeletal site carries the most feared osteoporotic fracture?", "options": [{"letter": "A", "text": "Hip"}, {"letter": "B", "text": "Wrist"}], "answer": "A", "explanation": "Hip and spine are where fragility fractures matter most — so that's where DXA measures.", "teach": "DXA measures where the dangerous fractures happen."}], "checkpoints": [{"stem": "Any adult who has a low-trauma fracture after age 50 should →", "options": [{"letter": "A", "text": "Be evaluated for osteoporosis"}, {"letter": "B", "text": "Be reassured if under 65"}, {"letter": "C", "text": "Receive DXA only if female"}, {"letter": "D", "text": "Wait for a second fracture"}], "answer": "A", "explanation": "Low-trauma fracture after 50 → evaluate for osteoporosis regardless of sex."}]}}, {"id": "15", "group": 15, "section": "Screening, risk factors & diagnosis", "topic": "DXA / T-score", "skill": "Diagnostics & imaging", "stem": "What T-score defines osteoporosis?", "options": [{"letter": "A", "text": "≤ −2.5"}, {"letter": "B", "text": "≤ −1.0"}, {"letter": "C", "text": "≤ −2.0"}, {"letter": "D", "text": "≤ −3.0"}], "answer": "A", "explanation": "Normal ≥ −1.0 · osteopenia −1.0 to −2.5 · **osteoporosis ≤ −2.5**.", "objective": "", "remediation": {"steps": [{"stem": "A T-score of −1.5 is →", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Osteoporosis"}], "answer": "A", "explanation": "Between −1.0 and −2.5 is osteopenia; osteoporosis starts at −2.5.", "teach": "Three bands on the T-score: normal, osteopenia, osteoporosis. Place the number."}], "checkpoints": [{"stem": "A 70-year-old woman's T-score is −2.1 at the femoral neck. Classification →", "options": [{"letter": "A", "text": "Osteopenia"}, {"letter": "B", "text": "Normal"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Severe osteoporosis"}], "answer": "A", "explanation": "−2.1 sits in the −1.0 to −2.5 band."}]}}, {"id": "16", "group": 16, "section": "Screening, risk factors & diagnosis", "topic": "DXA / T-score", "skill": "Diagnostics & imaging", "stem": "What finding allows osteoporosis to be diagnosed without a low T-score?", "options": [{"letter": "A", "text": "A major osteoporotic fragility fracture"}, {"letter": "B", "text": "A parental history of hip fracture"}, {"letter": "C", "text": "Chronic glucocorticoid use"}, {"letter": "D", "text": "Low body weight"}], "answer": "A", "explanation": "A **major osteoporotic fragility fracture** (hip or vertebral) = osteoporosis **regardless of BMD**.", "objective": "", "remediation": {"steps": [{"stem": "A 'fragility fracture' is a fracture from →", "options": [{"letter": "A", "text": "A fall from standing height or less"}, {"letter": "B", "text": "A high-speed motor vehicle crash"}], "answer": "A", "explanation": "Low-trauma fracture = bone that failed under normal stress, which is the clinical definition of osteoporosis.", "teach": "Three of these options are risk factors. Only one is an event that proves the bone is already weak."}], "checkpoints": [{"stem": "A 72-year-old woman fractures her hip stepping off a curb. Her T-score is −1.9. Diagnosis →", "options": [{"letter": "A", "text": "Osteoporosis"}, {"letter": "B", "text": "Osteopenia"}, {"letter": "C", "text": "Normal bone"}, {"letter": "D", "text": "Osteomalacia"}], "answer": "A", "explanation": "A hip fragility fracture makes the diagnosis regardless of a T-score in the osteopenia range."}]}}, {"id": "17", "group": 17, "section": "Screening, risk factors & diagnosis", "topic": "FRAX", "skill": "Diagnostics & imaging", "stem": "What does FRAX estimate?", "options": [{"letter": "A", "text": "10-year probability of hip and major osteoporotic fracture"}, {"letter": "B", "text": "Bone mineral density T-score"}, {"letter": "C", "text": "Serum bone turnover markers"}, {"letter": "D", "text": "Vertebral fracture grade"}], "answer": "A", "explanation": "FRAX gives a **10-year probability** of hip fracture and of major osteoporotic fracture; treatment thresholds are hip ≥3% or major ≥20%.", "objective": "", "remediation": {"steps": [{"stem": "FRAX is used to decide treatment in which group?", "options": [{"letter": "A", "text": "Osteopenia (T −1.0 to −2.5)"}, {"letter": "B", "text": "Osteoporosis (T ≤ −2.5)"}], "answer": "A", "explanation": "Osteoporosis by T-score is treated outright; FRAX decides whether osteopenia merits treatment.", "teach": "FRAX is a questionnaire, not a scan. It answers 'how likely is a fracture?' for the in-between patient."}], "checkpoints": [{"stem": "A woman with a T-score of −2.0 has a FRAX 10-year hip fracture probability of 4%. Pharmacotherapy is →", "options": [{"letter": "A", "text": "Appropriate — threshold met"}, {"letter": "B", "text": "Not indicated until T ≤ −2.5"}, {"letter": "C", "text": "Not indicated until a fracture occurs"}, {"letter": "D", "text": "Contraindicated with osteopenia"}], "answer": "A", "explanation": "Hip ≥3% (or major ≥20%) in osteopenia = treatment threshold."}]}}, {"id": "18", "group": 18, "section": "Lab evaluation & when to treat", "topic": "Lab evaluation", "skill": "Diagnostics & imaging", "stem": "What is the purpose of the baseline osteoporosis laboratory panel, including CBC, CMP, calcium, phosphate, alkaline phosphatase, PTH, 25-hydroxyvitamin D, and renal function?", "options": [{"letter": "A", "text": "Find secondary causes and treatment contraindications"}, {"letter": "B", "text": "Confirm the diagnosis of osteoporosis"}, {"letter": "C", "text": "Calculate the FRAX score"}, {"letter": "D", "text": "Measure bone mineral density"}], "answer": "A", "explanation": "Labs are for **secondary causes and treatment contraindications** (e.g., low Ca/vit D before antiresorptives, renal function before bisphosphonates). Diagnosis is by DXA or fracture.", "objective": "", "remediation": {"steps": [{"stem": "Which test diagnoses osteoporosis?", "options": [{"letter": "A", "text": "DXA"}, {"letter": "B", "text": "Serum calcium"}], "answer": "A", "explanation": "No blood test diagnoses osteoporosis; labs look for WHY and for what could make a drug unsafe.", "teach": "Separate the job of the scan from the job of the labs."}], "checkpoints": [{"stem": "Which baseline lab most directly determines whether a bisphosphonate can be given?", "options": [{"letter": "A", "text": "Renal function"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "CBC"}, {"letter": "D", "text": "Celiac serology"}], "answer": "A", "explanation": "Bisphosphonates carry a renal caution (eGFR <30); renal function gates the choice."}]}}, {"id": "19", "group": 19, "section": "Lab evaluation & when to treat", "topic": "Lab evaluation", "skill": "Diagnostics & imaging", "stem": "Which laboratory test should be added for a man with suspected hypogonadism?", "options": [{"letter": "A", "text": "Testosterone"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "Celiac serology"}, {"letter": "D", "text": "24-hour urine calcium"}], "answer": "A", "explanation": "History-directed labs: TSH, celiac serology, myeloma evaluation, **testosterone in men with suspected hypogonadism**, 24-h urine calcium in selected patients.", "objective": "", "remediation": {"steps": [{"stem": "Hypogonadism in men means a deficiency of →", "options": [{"letter": "A", "text": "Testosterone"}, {"letter": "B", "text": "Thyroid hormone"}], "answer": "A", "explanation": "Low testosterone is a leading secondary cause in men — so measure it when suspected.", "teach": "Match the suspected endocrine deficiency to the hormone you would measure."}], "checkpoints": [{"stem": "A 55-year-old woman with osteoporosis, chronic diarrhea and iron deficiency. Which added lab targets her likely secondary cause?", "options": [{"letter": "A", "text": "Celiac serology"}, {"letter": "B", "text": "Testosterone"}, {"letter": "C", "text": "24-hour urine calcium"}, {"letter": "D", "text": "Myeloma evaluation"}], "answer": "A", "explanation": "Malabsorption/celiac is a secondary cause; celiac serology is the history-guided add-on."}]}}, {"id": "20", "group": 20, "section": "Lab evaluation & when to treat", "topic": "Pre-treatment correction", "skill": "Pharmacology", "stem": "What must be corrected before starting antiresorptive therapy, especially denosumab?", "options": [{"letter": "A", "text": "Hypocalcemia and vitamin D deficiency"}, {"letter": "B", "text": "Hypertension"}, {"letter": "C", "text": "Hyperglycemia"}, {"letter": "D", "text": "Anemia"}], "answer": "A", "explanation": "Correct clinically significant **hypocalcemia and vitamin D deficiency** before antiresorptives — *particularly before denosumab*.", "objective": "", "remediation": {"steps": [{"stem": "Antiresorptives stop calcium from leaving bone. If serum calcium is already low, what happens?", "options": [{"letter": "A", "text": "It drops further"}, {"letter": "B", "text": "It normalizes"}], "answer": "A", "explanation": "Blocking resorption removes bone's contribution to serum calcium → hypocalcemia worsens.", "teach": "Think about where serum calcium comes from when bone resorption is switched off."}], "checkpoints": [{"stem": "Which osteoporosis drug carries the GREATEST hypocalcemia risk, especially in advanced CKD?", "options": [{"letter": "A", "text": "Denosumab"}, {"letter": "B", "text": "Raloxifene"}, {"letter": "C", "text": "Teriparatide"}, {"letter": "D", "text": "Calcium citrate"}], "answer": "A", "explanation": "Denosumab → hypocalcemia, worst with advanced kidney disease; check calcium before each dose."}]}}, {"id": "21", "group": 21, "section": "Lab evaluation & when to treat", "topic": "Treatment indications", "skill": "Management", "stem": "In addition to a T-score of −2.5 or lower or a major fragility fracture, what finding makes osteoporosis pharmacotherapy appropriate?", "options": [{"letter": "A", "text": "Osteopenia with FRAX at the treatment threshold"}, {"letter": "B", "text": "Any T-score below −1.0"}, {"letter": "C", "text": "Any woman over 65"}, {"letter": "D", "text": "Any patient on a PPI"}], "answer": "A", "explanation": "Three doors to treatment: **osteoporosis by DXA**, **major osteoporotic fragility fracture**, or **osteopenia with FRAX meeting threshold** (hip ≥3% / major ≥20%).", "objective": "", "remediation": {"steps": [{"stem": "Which group is the lecture's 'prevention' population?", "options": [{"letter": "A", "text": "Osteopenia with increased 10-year fracture probability"}, {"letter": "B", "text": "Everyone over 65"}], "answer": "A", "explanation": "Treatment = meets a diagnostic criterion; prevention = osteopenia + elevated FRAX risk.", "teach": "Two of these options would treat huge numbers of people who have normal bone. Find the one defined by risk."}], "checkpoints": [{"stem": "A 66-year-old woman: T-score −1.2, FRAX hip 1%, major 9%. Best plan →", "options": [{"letter": "A", "text": "Lifestyle measures, no drug therapy yet"}, {"letter": "B", "text": "Start alendronate"}, {"letter": "C", "text": "Start denosumab"}, {"letter": "D", "text": "Start teriparatide"}], "answer": "A", "explanation": "Osteopenia below both FRAX thresholds → optimize calcium/vit D, exercise, fall prevention; no pharmacotherapy."}]}}, {"id": "22", "group": 22, "section": "Lab evaluation & when to treat", "topic": "Non-pharmacologic treatment", "skill": "Counseling & prevention", "stem": "What is recommended for every patient with osteoporosis regardless of drug therapy?", "options": [{"letter": "A", "text": "Calcium/vitamin D, weight-bearing exercise, fall prevention, stop smoking, limit alcohol"}, {"letter": "B", "text": "Bed rest and activity restriction"}, {"letter": "C", "text": "High-dose vitamin D megadoses"}, {"letter": "D", "text": "Avoidance of all dairy"}], "answer": "A", "explanation": "For every patient: optimize **calcium and vitamin D**, **resistance/weight-bearing/balance exercise**, **address fall risk**, **stop smoking, limit alcohol**, correct reversible secondary causes.", "objective": "", "remediation": {"steps": [{"stem": "Which kind of exercise builds bone?", "options": [{"letter": "A", "text": "Weight-bearing and resistance"}, {"letter": "B", "text": "Swimming only"}], "answer": "A", "explanation": "Bone responds to mechanical stress — weight-bearing, resistance, plus balance work to prevent falls.", "teach": "Bone 'responds to stress' (slide 2). Which activity loads it?"}], "checkpoints": [{"stem": "Which non-pharmacologic measure most directly reduces the chance a weak bone actually breaks?", "options": [{"letter": "A", "text": "Fall-risk reduction"}, {"letter": "B", "text": "Smoking cessation"}, {"letter": "C", "text": "Limiting alcohol"}, {"letter": "D", "text": "Correcting hyperthyroidism"}], "answer": "A", "explanation": "Falls are the proximate cause of most fragility fractures; fall prevention is on every plan."}]}}, {"id": "23", "group": 23, "section": "Calcium & vitamin D", "topic": "Calcium supplementation", "skill": "Counseling & prevention", "stem": "What is the preferred source of calcium?", "options": [{"letter": "A", "text": "Dietary calcium"}, {"letter": "B", "text": "Calcium carbonate tablets"}, {"letter": "C", "text": "Calcium citrate tablets"}, {"letter": "D", "text": "IV calcium gluconate"}], "answer": "A", "explanation": "**Prefer dietary calcium**; supplement only the shortfall, in **divided doses** (absorption falls with large single doses).", "objective": "", "remediation": {"steps": [{"stem": "Why are calcium supplements split into divided doses?", "options": [{"letter": "A", "text": "Absorption is limited per dose"}, {"letter": "B", "text": "To reduce drug cost"}], "answer": "A", "explanation": "Larger single doses have lower fractional absorption — split the daily total.", "teach": "The lecture says 'if supplementation is needed' — meaning supplements are the backup, not the first choice."}], "checkpoints": [{"stem": "A patient takes her entire daily calcium supplement in one large morning dose. Counsel →", "options": [{"letter": "A", "text": "Split it into two or more smaller doses"}, {"letter": "B", "text": "Take it all at bedtime instead"}, {"letter": "C", "text": "Double the dose to compensate"}, {"letter": "D", "text": "Switch to IV calcium"}], "answer": "A", "explanation": "Absorption is capped per dose, so the total should be divided."}]}}, {"id": "24", "group": 24, "section": "Calcium & vitamin D", "topic": "Calcium carbonate vs citrate", "skill": "Pharmacology", "stem": "Which calcium salt requires stomach acid for absorption and should be taken with food?", "options": [{"letter": "A", "text": "Calcium carbonate"}, {"letter": "B", "text": "Calcium citrate"}, {"letter": "C", "text": "Calcium gluconate"}, {"letter": "D", "text": "Calcium chloride"}], "answer": "A", "explanation": "**Carbonate** requires acid → take with food; more elemental calcium (~40%), cheaper, but poorly absorbed with PPIs/H2 blockers. **Citrate** absorbs with or without food.", "objective": "", "remediation": {"steps": [{"stem": "Which salt still absorbs well when stomach acid is suppressed?", "options": [{"letter": "A", "text": "Calcium citrate"}, {"letter": "B", "text": "Calcium carbonate"}], "answer": "A", "explanation": "Citrate does not depend on gastric acid — hence its use with PPIs or achlorhydria.", "teach": "The two salts differ in ONE practical way: whether they need acid to dissolve."}], "checkpoints": [{"stem": "A patient on long-term omeprazole needs a calcium supplement. Best choice →", "options": [{"letter": "A", "text": "Calcium citrate"}, {"letter": "B", "text": "Calcium carbonate"}, {"letter": "C", "text": "Either, taken at bedtime"}, {"letter": "D", "text": "Neither — dietary calcium is impossible on a PPI"}], "answer": "A", "explanation": "Acid suppression → citrate (absorbs without acid, fewer GI effects)."}]}}, {"id": "25", "group": 25, "section": "Calcium & vitamin D", "topic": "Calcium carbonate vs citrate", "skill": "Pharmacology", "stem": "Which calcium salt contains more elemental calcium per tablet and is described as the calcium of choice?", "options": [{"letter": "A", "text": "Calcium carbonate (~40%)"}, {"letter": "B", "text": "Calcium citrate (~24%)"}, {"letter": "C", "text": "Both are equal"}, {"letter": "D", "text": "Neither contains elemental calcium"}], "answer": "A", "explanation": "Carbonate ≈ **40% elemental** calcium (Tums, Caltrate, Os-Cal); citrate ≈ 24% (Citracal).", "objective": "", "remediation": {"steps": [{"stem": "Which salt is the cheaper, more widely available option?", "options": [{"letter": "A", "text": "Calcium carbonate"}, {"letter": "B", "text": "Calcium citrate"}], "answer": "A", "explanation": "Carbonate: more calcium per pill, less expensive — the default when acid is adequate.", "teach": "Carbonate wins on density and cost; citrate wins on absorption without acid."}], "checkpoints": [{"stem": "Tums and Os-Cal are brands of →", "options": [{"letter": "A", "text": "Calcium carbonate"}, {"letter": "B", "text": "Calcium citrate"}, {"letter": "C", "text": "Vitamin D3"}, {"letter": "D", "text": "Calcium gluconate"}], "answer": "A", "explanation": "Tums, Caltrate, Os-Cal = carbonate; Citracal, Solgar = citrate."}]}}, {"id": "26", "group": 26, "section": "Calcium & vitamin D", "topic": "Calcium adverse effects", "skill": "Pharmacology", "stem": "What are the most common adverse effects of calcium supplements?", "options": [{"letter": "A", "text": "Constipation, bloating, flatulence"}, {"letter": "B", "text": "Diarrhea and cramping"}, {"letter": "C", "text": "Hypotension and bradycardia"}, {"letter": "D", "text": "Rash and pruritus"}], "answer": "A", "explanation": "Calcium → **constipation, bloating, gas**; possible kidney stones with excess (slightly higher with carbonate).", "objective": "", "remediation": {"steps": [{"stem": "Which salt causes FEWER GI side effects?", "options": [{"letter": "A", "text": "Calcium citrate"}, {"letter": "B", "text": "Calcium carbonate"}], "answer": "A", "explanation": "Citrate has fewer GI effects and lower stone risk.", "teach": "Calcium's side effects are gut-related and constipating, not loosening."}], "checkpoints": [{"stem": "Which calcium salt carries the slightly higher kidney-stone risk at high doses?", "options": [{"letter": "A", "text": "Calcium carbonate"}, {"letter": "B", "text": "Calcium citrate"}, {"letter": "C", "text": "Both equally"}, {"letter": "D", "text": "Neither"}], "answer": "A", "explanation": "Carbonate: slightly higher stone risk; citrate lower."}]}}, {"id": "27", "group": 27, "section": "Calcium & vitamin D", "topic": "Calcium interactions", "skill": "Pharmacology", "stem": "From which medications should calcium supplements be separated?", "options": [{"letter": "A", "text": "Levothyroxine, iron, tetracyclines, fluoroquinolones"}, {"letter": "B", "text": "Amlodipine, lisinopril, metoprolol"}, {"letter": "C", "text": "Metformin, glipizide, insulin"}, {"letter": "D", "text": "Acetaminophen, ibuprofen, naproxen"}], "answer": "A", "explanation": "Separate calcium from **levothyroxine, iron, tetracyclines, fluoroquinolones** (binding/↓ absorption). Calcium and antacids also ↓ bisphosphonate absorption.", "objective": "", "remediation": {"steps": [{"stem": "What does calcium do to these drugs in the gut?", "options": [{"letter": "A", "text": "Binds them and reduces absorption"}, {"letter": "B", "text": "Increases their absorption"}], "answer": "A", "explanation": "Divalent cations chelate/bind these drugs → lower levels.", "teach": "Calcium is a divalent cation. Think about which drugs are notorious for binding to cations in the gut."}], "checkpoints": [{"stem": "A patient takes levothyroxine at 7 AM and her calcium citrate at 7 AM. Counsel →", "options": [{"letter": "A", "text": "Separate the two by several hours"}, {"letter": "B", "text": "Take both together with breakfast"}, {"letter": "C", "text": "Stop the calcium"}, {"letter": "D", "text": "Switch to calcium carbonate"}], "answer": "A", "explanation": "Calcium binds levothyroxine — separate the doses."}]}}, {"id": "28", "group": 28, "section": "Calcium & vitamin D", "topic": "Vitamin D", "skill": "Pharmacology", "stem": "Which form of vitamin D is preferred for correcting deficiency?", "options": [{"letter": "A", "text": "Vitamin D3 (cholecalciferol)"}, {"letter": "B", "text": "Vitamin D2 (ergocalciferol)"}, {"letter": "C", "text": "Calcitriol"}, {"letter": "D", "text": "Calcitonin"}], "answer": "A", "explanation": "Use **D3 (cholecalciferol)** to correct deficiency and maintain sufficiency; fat-soluble → take with meals; dose to the measured 25-OH-D level.", "objective": "", "remediation": {"steps": [{"stem": "Vitamin D is fat-soluble. When should it be taken?", "options": [{"letter": "A", "text": "With a meal"}, {"letter": "B", "text": "On an empty stomach"}], "answer": "A", "explanation": "Fat-soluble → absorbed with dietary fat.", "teach": "Calcitonin is a hormone, not a vitamin. Of the vitamin D forms, the lecture names one as preferred."}], "checkpoints": [{"stem": "Vitamin D's main contribution to bone health is →", "options": [{"letter": "A", "text": "Increasing GI absorption of calcium and phosphate"}, {"letter": "B", "text": "Directly inhibiting osteoclasts"}, {"letter": "C", "text": "Binding RANKL"}, {"letter": "D", "text": "Stimulating PTH release"}], "answer": "A", "explanation": "Vitamin D ↑ intestinal absorption of calcium and phosphate."}]}}, {"id": "29", "group": 29, "section": "Calcium & vitamin D", "topic": "Vitamin D", "skill": "Pharmacology", "stem": "What toxicity can result from megadoses of vitamin D?", "options": [{"letter": "A", "text": "Hypercalcemia and hypercalciuria"}, {"letter": "B", "text": "Hypocalcemia"}, {"letter": "C", "text": "Hyperkalemia"}, {"letter": "D", "text": "Hypoglycemia"}], "answer": "A", "explanation": "Megadoses → **hypercalcemia and hypercalciuria**. Avoid; dose to the 25-OH-D level rather than a universal 'treatment dose'.", "objective": "", "remediation": {"steps": [{"stem": "Vitamin D raises calcium absorption. Too much vitamin D therefore drives serum calcium →", "options": [{"letter": "A", "text": "Up"}, {"letter": "B", "text": "Down"}], "answer": "A", "explanation": "More absorption → hypercalcemia; the kidney spills it → hypercalciuria.", "teach": "Follow the mechanism: vitamin D increases calcium absorption from the gut."}], "checkpoints": [{"stem": "How should a vitamin D dose be chosen, per the lecture?", "options": [{"letter": "A", "text": "By the measured 25-hydroxyvitamin D level and clinical context"}, {"letter": "B", "text": "A fixed universal dose for all adults"}, {"letter": "C", "text": "By the DXA T-score"}, {"letter": "D", "text": "By body weight alone"}], "answer": "A", "explanation": "Dosing reflects the measured level — 800–2,000 IU is not a universal treatment dose."}]}}, {"id": "30", "group": 30, "section": "Bisphosphonates", "topic": "Bisphosphonates", "skill": "Management", "stem": "What is the first-line drug class for osteoporosis?", "options": [{"letter": "A", "text": "Bisphosphonates"}, {"letter": "B", "text": "RANKL inhibitors"}, {"letter": "C", "text": "PTH analogs"}, {"letter": "D", "text": "SERMs"}], "answer": "A", "explanation": "**Bisphosphonates** (alendronate, risedronate, zoledronic acid) are the preferred initial treatment and prevention.", "objective": "", "remediation": {"steps": [{"stem": "Which agents are bisphosphonates?", "options": [{"letter": "A", "text": "Alendronate, risedronate, zoledronic acid"}, {"letter": "B", "text": "Denosumab, romosozumab"}], "answer": "A", "explanation": "The '-dronate' / '-dronic acid' drugs are bisphosphonates.", "teach": "The TL;DR slide labels one class '1st line'. The others are 'alternative therapies'."}], "checkpoints": [{"stem": "Which bisphosphonate's hip-fracture benefit has NOT been established in randomized trials?", "options": [{"letter": "A", "text": "Ibandronate"}, {"letter": "B", "text": "Alendronate"}, {"letter": "C", "text": "Risedronate"}, {"letter": "D", "text": "Zoledronic acid"}], "answer": "A", "explanation": "Oral ibandronate is convenient but lacks proven hip-fracture reduction."}]}}, {"id": "31", "group": 31, "section": "Bisphosphonates", "topic": "Bisphosphonates", "skill": "Pharmacology", "stem": "What is the mechanism of action of bisphosphonates?", "options": [{"letter": "A", "text": "Inhibit osteoclasts; bind bone matrix and persist for years"}, {"letter": "B", "text": "Block RANKL from activating osteoclasts"}, {"letter": "C", "text": "Stimulate osteoblasts via intermittent PTH-receptor activation"}, {"letter": "D", "text": "Inhibit sclerostin"}], "answer": "A", "explanation": "Bisphosphonates are taken up by osteoclasts → impaired function/apoptosis; they **bind bone matrix and are released slowly** over years (basis of the drug holiday).", "objective": "", "remediation": {"steps": [{"stem": "Bisphosphonates are which category of therapy?", "options": [{"letter": "A", "text": "Antiresorptive"}, {"letter": "B", "text": "Anabolic"}], "answer": "A", "explanation": "They stop osteoclast resorption; they do not build new bone.", "teach": "Three options describe other drugs (denosumab, teriparatide, romosozumab). Only one involves the drug sitting in bone."}], "checkpoints": [{"stem": "Which property of bisphosphonates makes a 'drug holiday' possible?", "options": [{"letter": "A", "text": "Long retention in bone matrix after stopping"}, {"letter": "B", "text": "Rapid renal clearance"}, {"letter": "C", "text": "Reversible RANKL binding"}, {"letter": "D", "text": "Short half-life requiring daily dosing"}], "answer": "A", "explanation": "The drug stays in bone and keeps providing some protection after it is stopped."}]}}, {"id": "32", "group": 32, "section": "Bisphosphonates", "topic": "Bisphosphonates", "skill": "Pharmacology", "stem": "What are the most common adverse effects of oral bisphosphonates?", "options": [{"letter": "A", "text": "GI: abdominal pain, reflux, esophagitis"}, {"letter": "B", "text": "Hot flashes and leg cramps"}, {"letter": "C", "text": "Hypercalcemia and dizziness"}, {"letter": "D", "text": "MI and stroke"}], "answer": "A", "explanation": "Mostly **GI** (abdominal pain, reflux, **esophagitis**); also hypocalcemia, osteonecrosis of the jaw, atypical femoral fractures.", "objective": "", "remediation": {"steps": [{"stem": "The administration rules (upright 30 min, full glass of water) exist to prevent which adverse effect?", "options": [{"letter": "A", "text": "Esophagitis"}, {"letter": "B", "text": "Hypocalcemia"}], "answer": "A", "explanation": "Pill contact with the esophagus causes esophagitis — hence water and staying upright.", "teach": "The other three options are the signature side effects of raloxifene, teriparatide, and romosozumab."}], "checkpoints": [{"stem": "Which pair of RARE skeletal adverse effects is shared by bisphosphonates, denosumab, and romosozumab?", "options": [{"letter": "A", "text": "Osteonecrosis of the jaw and atypical femoral fracture"}, {"letter": "B", "text": "Osteosarcoma and Paget's disease"}, {"letter": "C", "text": "Osteomalacia and rickets"}, {"letter": "D", "text": "Vertebral compression fracture and kyphosis"}], "answer": "A", "explanation": "ONJ and AFF come from over-suppressed bone turnover across the potent antiresorptives."}]}}, {"id": "33", "group": 33, "section": "Bisphosphonates", "topic": "Bisphosphonates", "skill": "Counseling & prevention", "stem": "How should an oral bisphosphonate be taken?", "options": [{"letter": "A", "text": "Morning, plain water, 30 min before food/meds, stay upright 30 min"}, {"letter": "B", "text": "With breakfast and a glass of milk"}, {"letter": "C", "text": "At bedtime, lying down"}, {"letter": "D", "text": "With an antacid to protect the stomach"}], "answer": "A", "explanation": "Take in the **morning with plenty of plain water**, ≥**30 minutes before** food or other medications, and stay **upright ≥30 minutes** to prevent esophagitis.", "objective": "", "remediation": {"steps": [{"stem": "Why must it be taken with PLAIN water and nothing else?", "options": [{"letter": "A", "text": "Food, calcium, antacids and minerals block its absorption"}, {"letter": "B", "text": "Water activates the drug"}], "answer": "A", "explanation": "Antacids, calcium, magnesium and iron salts decrease bisphosphonate absorption.", "teach": "Two problems are being prevented at once: poor absorption and esophageal injury."}], "checkpoints": [{"stem": "A patient takes alendronate with her morning coffee and calcium carbonate, then lies back down. The error MOST likely to cause esophagitis →", "options": [{"letter": "A", "text": "Lying down after the dose"}, {"letter": "B", "text": "Taking it with coffee"}, {"letter": "C", "text": "Taking it with calcium"}, {"letter": "D", "text": "Taking it in the morning"}], "answer": "A", "explanation": "Staying upright 30 min prevents esophageal exposure; coffee/calcium mainly reduce absorption."}]}}, {"id": "34", "group": 34, "section": "Bisphosphonates", "topic": "Bisphosphonates", "skill": "Pharmacology", "stem": "What are the contraindications to oral bisphosphonates?", "options": [{"letter": "A", "text": "Esophageal abnormalities, Roux-en-Y bypass, inability to stay upright 30 min"}, {"letter": "B", "text": "Hypertension and diabetes"}, {"letter": "C", "text": "History of DVT/PE"}, {"letter": "D", "text": "MI or stroke in the past year"}], "answer": "A", "explanation": "CI: **esophageal abnormalities, Roux-en-Y gastric bypass, inability to sit/stand upright ≥30 min** → use **IV** instead. Caution: eGFR <30, prior esophagitis.", "objective": "", "remediation": {"steps": [{"stem": "All three contraindications share what theme?", "options": [{"letter": "A", "text": "The pill cannot safely pass through or sit in the esophagus/stomach"}, {"letter": "B", "text": "The drug cannot be cleared by the kidney"}], "answer": "A", "explanation": "They are mechanical/GI problems with an oral tablet — an IV route sidesteps them.", "teach": "DVT/PE is raloxifene's CI; recent MI/stroke is romosozumab's. Find the GI-flavored set."}], "checkpoints": [{"stem": "A bedbound nursing-home patient with osteoporosis cannot sit upright. Best bisphosphonate route →", "options": [{"letter": "A", "text": "IV zoledronic acid"}, {"letter": "B", "text": "Oral alendronate weekly"}, {"letter": "C", "text": "Oral risedronate monthly"}, {"letter": "D", "text": "Oral ibandronate"}], "answer": "A", "explanation": "Inability to stay upright → oral is contraindicated → IV zoledronic acid."}]}}, {"id": "35", "group": 35, "section": "Bisphosphonates", "topic": "Bisphosphonates", "skill": "Pharmacology", "stem": "At what level of renal function should bisphosphonates be used with caution?", "options": [{"letter": "A", "text": "eGFR < 30"}, {"letter": "B", "text": "eGFR < 60"}, {"letter": "C", "text": "eGFR < 90"}, {"letter": "D", "text": "eGFR < 15 only"}], "answer": "A", "explanation": "Caution with **renal impairment eGFR <30** (TL;DR: 'must renal dose'). IV zoledronic acid avoids the esophagus but NOT the renal risk — denosumab is the renal alternative.", "objective": "", "remediation": {"steps": [{"stem": "Which osteoporosis drug is specifically listed for patients with IMPAIRED renal function?", "options": [{"letter": "A", "text": "Denosumab"}, {"letter": "B", "text": "Zoledronic acid"}], "answer": "A", "explanation": "Denosumab is the alternative when renal function limits bisphosphonates (watch calcium).", "teach": "The lecture gives a single eGFR number for bisphosphonates and names a different drug for kidney patients."}], "checkpoints": [{"stem": "Zoledronic acid IV compared with oral alendronate →", "options": [{"letter": "A", "text": "Avoids esophageal exposure but not renal or hypocalcemia risk"}, {"letter": "B", "text": "Eliminates all adverse effects"}, {"letter": "C", "text": "Avoids renal risk but not esophageal risk"}, {"letter": "D", "text": "Has no fracture-prevention data"}], "answer": "A", "explanation": "IV spares the esophagus; renal, hypocalcemia and rare skeletal effects remain."}]}}, {"id": "36", "group": 36, "section": "Bisphosphonates", "topic": "Bisphosphonates", "skill": "Pharmacology", "stem": "Which drug interactions worsen the gastrointestinal toxicity of bisphosphonates?", "options": [{"letter": "A", "text": "NSAIDs and alcohol"}, {"letter": "B", "text": "Beta-blockers and statins"}, {"letter": "C", "text": "Metformin and insulin"}, {"letter": "D", "text": "SSRIs and benzodiazepines"}], "answer": "A", "explanation": "**NSAIDs and alcohol** enhance GI side effects; antacids/calcium/Mg/iron ↓ absorption; ethanol also ↑ ulceration and osteoporosis itself.", "objective": "", "remediation": {"steps": [{"stem": "Which of these drugs also irritates the upper GI tract on its own?", "options": [{"letter": "A", "text": "NSAIDs"}, {"letter": "B", "text": "Statins"}], "answer": "A", "explanation": "Two GI irritants together → more esophagitis/ulceration.", "teach": "Look for the option whose drugs are themselves GI irritants."}], "checkpoints": [{"stem": "Antacids, calcium, magnesium and iron salts taken with a bisphosphonate →", "options": [{"letter": "A", "text": "Decrease its absorption"}, {"letter": "B", "text": "Increase its toxicity"}, {"letter": "C", "text": "Prolong its half-life"}, {"letter": "D", "text": "Have no interaction"}], "answer": "A", "explanation": "Polyvalent cations bind bisphosphonates → reduced absorption."}]}}, {"id": "37", "group": 37, "section": "Bisphosphonates", "topic": "Zoledronic acid", "skill": "Management", "stem": "What is the first-line alternative for a patient who cannot take or tolerate an oral bisphosphonate?", "options": [{"letter": "A", "text": "Zoledronic acid (Reclast) IV"}, {"letter": "B", "text": "Raloxifene"}, {"letter": "C", "text": "Teriparatide"}, {"letter": "D", "text": "Estrogen"}], "answer": "A", "explanation": "**Zoledronic acid IV** (once yearly for treatment) — for patients who cannot tolerate oral bisphosphonates; proven fracture prevention.", "objective": "", "remediation": {"steps": [{"stem": "Zoledronic acid is given how often for TREATMENT?", "options": [{"letter": "A", "text": "Once yearly IV"}, {"letter": "B", "text": "Daily by mouth"}], "answer": "A", "explanation": "5 mg IV once yearly (every 2 years for prevention).", "teach": "Stay inside the first-line class before jumping to an alternative class."}], "checkpoints": [{"stem": "A patient had an esophageal stricture dilated last year. She has osteoporosis and normal renal function. Best initial agent →", "options": [{"letter": "A", "text": "Zoledronic acid IV yearly"}, {"letter": "B", "text": "Alendronate weekly"}, {"letter": "C", "text": "Risedronate monthly"}, {"letter": "D", "text": "Raloxifene daily"}], "answer": "A", "explanation": "Esophageal abnormality → oral CI → IV bisphosphonate."}]}}, {"id": "38", "group": 38, "section": "Bisphosphonates", "topic": "Bisphosphonate drug holiday", "skill": "Management", "stem": "After how long should fracture risk be reassessed and a bisphosphonate drug holiday considered?", "options": [{"letter": "A", "text": "3–5 years"}, {"letter": "B", "text": "1 year"}, {"letter": "C", "text": "10 years"}, {"letter": "D", "text": "6 months"}], "answer": "A", "explanation": "Reassess after **3–5 years**; a holiday may be considered if risk is now low/moderate. Purpose: reduce the rare long-term effects (AFF, ONJ) while bone-bound drug keeps protecting.", "objective": "", "remediation": {"steps": [{"stem": "Why can a bisphosphonate be paused without immediately losing protection?", "options": [{"letter": "A", "text": "It remains bound in bone and is released slowly"}, {"letter": "B", "text": "The kidney recycles it"}], "answer": "A", "explanation": "Long skeletal half-life = residual protection during the holiday.", "teach": "The holiday exists because of a specific property of the drug and a specific pair of rare side effects."}], "checkpoints": [{"stem": "Which patient should CONTINUE a bisphosphonate rather than take a holiday?", "options": [{"letter": "A", "text": "Prior vertebral fracture and ongoing glucocorticoids"}, {"letter": "B", "text": "T-score improved to −1.5 with no fractures"}, {"letter": "C", "text": "Low FRAX risk after 5 years"}, {"letter": "D", "text": "Patient requesting a break"}], "answer": "A", "explanation": "Continue if very low BMD, prior vertebral/hip fracture, ongoing steroids, or persistently high risk."}]}}, {"id": "39", "group": 39, "section": "Bisphosphonates", "topic": "Atypical femoral fracture", "skill": "Complications", "stem": "What is a low-trauma, transverse subtrochanteric or femoral shaft fracture after years of bisphosphonate use called?", "options": [{"letter": "A", "text": "Atypical femoral fracture"}, {"letter": "B", "text": "Osteonecrosis of the jaw"}, {"letter": "C", "text": "Hip fragility fracture"}, {"letter": "D", "text": "Paget's disease"}], "answer": "A", "explanation": "**Atypical femoral fracture**: transverse, subtrochanteric/shaft, low-trauma; risk rises with duration (>3–5 yr) and falls after stopping. Caused by over-suppressed bone turnover.", "objective": "", "remediation": {"steps": [{"stem": "Why does long-term suppression of bone turnover weaken bone?", "options": [{"letter": "A", "text": "Microdamage accumulates and is not repaired"}, {"letter": "B", "text": "Bone becomes too thin"}], "answer": "A", "explanation": "Remodeling repairs microcracks; suppress it too long and damage accumulates → brittle bone.", "teach": "This fracture is a paradox: a bone-protecting drug causing a fracture. The mechanism is about repair."}], "checkpoints": [{"stem": "A woman on alendronate for 8 years reports weeks of dull thigh pain, then fractures her femur stepping off a curb. Most likely →", "options": [{"letter": "A", "text": "Atypical femoral fracture from prolonged turnover suppression"}, {"letter": "B", "text": "Typical osteoporotic hip fracture from treatment failure"}, {"letter": "C", "text": "Osteonecrosis"}, {"letter": "D", "text": "Osteosarcoma"}], "answer": "A", "explanation": "Prodromal thigh pain + low-trauma shaft fracture on long-term bisphosphonate = AFF."}]}}, {"id": "40", "group": 40, "section": "Denosumab", "topic": "Denosumab", "skill": "Pharmacology", "stem": "What is the mechanism of action of denosumab?", "options": [{"letter": "A", "text": "Monoclonal antibody against RANKL → inhibits osteoclast formation and activity"}, {"letter": "B", "text": "Binds bone matrix and poisons osteoclasts"}, {"letter": "C", "text": "Inhibits sclerostin"}, {"letter": "D", "text": "Intermittent PTH-receptor agonist"}], "answer": "A", "explanation": "**Anti-RANKL monoclonal antibody** — blocks the signal that tells osteoclasts to form and function. Antiresorptive.", "objective": "", "remediation": {"steps": [{"stem": "RANKL normally does what?", "options": [{"letter": "A", "text": "Activates osteoclasts via RANK"}, {"letter": "B", "text": "Activates osteoblasts"}], "answer": "A", "explanation": "RANKL → RANK receptor → osteoclast formation. Block RANKL → fewer, weaker osteoclasts.", "teach": "Denosumab's name ends in '-mab' — it's an antibody. The question is what it binds."}], "checkpoints": [{"stem": "Compared with a bisphosphonate, denosumab's distinct mechanism is that it →", "options": [{"letter": "A", "text": "Blocks the signal that makes osteoclasts form in the first place"}, {"letter": "B", "text": "Stimulates osteoblasts directly"}, {"letter": "C", "text": "Remains in bone for years after stopping"}, {"letter": "D", "text": "Increases intestinal calcium absorption"}], "answer": "A", "explanation": "Bisphosphonates impair existing osteoclasts after uptake; denosumab prevents RANKL signaling upstream."}]}}, {"id": "41", "group": 41, "section": "Denosumab", "topic": "Denosumab", "skill": "Management", "stem": "When is denosumab indicated?", "options": [{"letter": "A", "text": "Bisphosphonate contraindicated/not tolerated, impaired renal function, or high fracture risk"}, {"letter": "B", "text": "First-line for all postmenopausal women"}, {"letter": "C", "text": "Women with vasomotor symptoms"}, {"letter": "D", "text": "Breast-cancer risk reduction"}], "answer": "A", "explanation": "Alternative when **bisphosphonates are contraindicated or not tolerated**; **impaired renal function**; selected high-risk patients; men on ADT.", "objective": "", "remediation": {"steps": [{"stem": "Why is denosumab favored in kidney disease over a bisphosphonate?", "options": [{"letter": "A", "text": "No renal dosing restriction (though calcium must be watched)"}, {"letter": "B", "text": "It improves kidney function"}], "answer": "A", "explanation": "Bisphosphonates carry an eGFR <30 caution; denosumab does not — but hypocalcemia risk is higher in CKD.", "teach": "The TL;DR calls denosumab 'use if intolerant to bisphosphonates' — it is a second-tier drug with one organ-specific advantage."}], "checkpoints": [{"stem": "A 74-year-old woman with CKD stage 4 (eGFR 22) and a vertebral fragility fracture. Best agent →", "options": [{"letter": "A", "text": "Denosumab"}, {"letter": "B", "text": "Alendronate"}, {"letter": "C", "text": "Zoledronic acid"}, {"letter": "D", "text": "Ibandronate"}], "answer": "A", "explanation": "eGFR <30 → avoid/caution bisphosphonates → denosumab, with calcium monitoring."}]}}, {"id": "42", "group": 42, "section": "Denosumab", "topic": "Denosumab", "skill": "Pharmacology", "stem": "What is the dosing schedule for denosumab?", "options": [{"letter": "A", "text": "60 mg SC every 6 months"}, {"letter": "B", "text": "20 mcg SC daily"}, {"letter": "C", "text": "210 mg SC monthly"}, {"letter": "D", "text": "5 mg IV yearly"}], "answer": "A", "explanation": "**60 mg subcutaneously every 6 months** — requires reliable twice-yearly dosing.", "objective": "", "remediation": {"steps": [{"stem": "Denosumab is an antibody. Which route fits?", "options": [{"letter": "A", "text": "Subcutaneous injection"}, {"letter": "B", "text": "Oral tablet"}], "answer": "A", "explanation": "Monoclonal antibodies are injected; denosumab is SC twice a year.", "teach": "The other three are teriparatide, romosozumab, and zoledronic acid schedules."}], "checkpoints": [{"stem": "Which osteoporosis drug is given once MONTHLY by injection for 12 months?", "options": [{"letter": "A", "text": "Romosozumab"}, {"letter": "B", "text": "Denosumab"}, {"letter": "C", "text": "Teriparatide"}, {"letter": "D", "text": "Zoledronic acid"}], "answer": "A", "explanation": "Romosozumab 210 mg SC monthly × 12; denosumab is q6 months; teriparatide daily; zoledronic acid yearly."}]}}, {"id": "43", "group": 43, "section": "Denosumab", "topic": "Denosumab", "skill": "Complications", "stem": "Which adverse effect of denosumab is more severe in advanced kidney disease?", "options": [{"letter": "A", "text": "Hypocalcemia"}, {"letter": "B", "text": "Hypercalcemia"}, {"letter": "C", "text": "Esophagitis"}, {"letter": "D", "text": "Venous thromboembolism"}], "answer": "A", "explanation": "**Hypocalcemia** — greater risk in advanced CKD. Also ONJ, atypical femoral fracture, back/MSK pain. Check calcium before each dose; correct Ca/vit D first.", "objective": "", "remediation": {"steps": [{"stem": "Denosumab blocks resorption, so bone stops releasing calcium. Serum calcium goes →", "options": [{"letter": "A", "text": "Down"}, {"letter": "B", "text": "Up"}], "answer": "A", "explanation": "Potent antiresorption + poor renal activation of vitamin D in CKD = hypocalcemia.", "teach": "Hypercalcemia belongs to teriparatide; VTE to raloxifene; esophagitis to oral bisphosphonates."}], "checkpoints": [{"stem": "Before each denosumab injection, the lecture's case plan calls for checking →", "options": [{"letter": "A", "text": "Serum calcium"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "Liver enzymes"}, {"letter": "D", "text": "Hemoglobin A1c"}], "answer": "A", "explanation": "Calcium levels before each dose; monitor for signs of hypocalcemia and ONJ."}]}}, {"id": "44", "group": 44, "section": "Denosumab", "topic": "Denosumab discontinuation", "skill": "Counseling & prevention", "stem": "What is a critical counseling point for a patient receiving denosumab?", "options": [{"letter": "A", "text": "Never stop or delay it without starting another antiresorptive"}, {"letter": "B", "text": "Take it on an empty stomach"}, {"letter": "C", "text": "Stop after 2 years maximum"}, {"letter": "D", "text": "Avoid if MI within the past year"}], "answer": "A", "explanation": "**Do NOT stop or substantially delay denosumab without arranging another antiresorptive** — discontinuation → rapid loss of benefit and ↑ vertebral fracture risk. Duration is indefinite.", "objective": "", "remediation": {"steps": [{"stem": "Unlike a bisphosphonate, denosumab does NOT stay in bone. When it wears off, bone turnover →", "options": [{"letter": "A", "text": "Rebounds rapidly"}, {"letter": "B", "text": "Stays suppressed for years"}], "answer": "A", "explanation": "No skeletal reservoir → abrupt rebound resorption → vertebral fractures.", "teach": "Contrast with the bisphosphonate 'holiday' — ask why one drug can be paused and the other cannot."}], "checkpoints": [{"stem": "A patient on denosumab for 3 years wants to stop because of cost. Appropriate plan →", "options": [{"letter": "A", "text": "Transition to a bisphosphonate"}, {"letter": "B", "text": "Stop and recheck DXA in 2 years"}, {"letter": "C", "text": "Stop; the effect persists for years"}, {"letter": "D", "text": "Switch to calcium and vitamin D alone"}], "answer": "A", "explanation": "If denosumab is discontinued, transition to another antiresorptive."}]}}, {"id": "45", "group": 45, "section": "Anabolic therapy — PTH analogs", "topic": "Teriparatide / abaloparatide", "skill": "Pharmacology", "stem": "What is the mechanism of action of teriparatide (Forteo)?", "options": [{"letter": "A", "text": "Recombinant PTH; intermittent dosing stimulates osteoblasts → net bone formation"}, {"letter": "B", "text": "Anti-RANKL antibody"}, {"letter": "C", "text": "Inhibits osteoclasts by binding bone matrix"}, {"letter": "D", "text": "Estrogen agonist in bone"}], "answer": "A", "explanation": "**Recombinant human PTH**; brief daily pulses preferentially stimulate osteoblast differentiation and formation without persistently activating osteoclasts → **net anabolic**. Also ↑ Ca absorption and renal reabsorption.", "objective": "", "remediation": {"steps": [{"stem": "Why does once-daily (pulsatile) PTH BUILD bone when continuous PTH destroys it?", "options": [{"letter": "A", "text": "Brief exposure favors osteoblasts; osteoclasts aren't persistently activated"}, {"letter": "B", "text": "Daily injections deliver a higher total dose"}], "answer": "A", "explanation": "The pulse is the point: transient PTH → osteoblast activation; sustained PTH → resorption.", "teach": "Teriparatide is the lecture's example of ANABOLIC therapy. Find the option that builds bone."}], "checkpoints": [{"stem": "Teriparatide and abaloparatide are given by which route and frequency?", "options": [{"letter": "A", "text": "Subcutaneous injection once daily"}, {"letter": "B", "text": "Oral tablet once weekly"}, {"letter": "C", "text": "IV infusion once yearly"}, {"letter": "D", "text": "Subcutaneous injection every 6 months"}], "answer": "A", "explanation": "Daily SC injection (teriparatide 20 mcg; abaloparatide 80 mcg)."}]}}, {"id": "46", "group": 46, "section": "Anabolic therapy — PTH analogs", "topic": "Teriparatide / abaloparatide", "skill": "Management", "stem": "For which patient population are teriparatide and abaloparatide used?", "options": [{"letter": "A", "text": "High or very high fracture risk; glucocorticoid-induced osteoporosis"}, {"letter": "B", "text": "All newly diagnosed osteoporosis"}, {"letter": "C", "text": "Osteopenia with low FRAX risk"}, {"letter": "D", "text": "Women needing breast-cancer prophylaxis"}], "answer": "A", "explanation": "Consider for **high/very high fracture risk** (severe disease, multiple fractures); teriparatide also for **glucocorticoid-induced osteoporosis**. TL;DR: 'for severe/high-risk cases'.", "objective": "", "remediation": {"steps": [{"stem": "Are PTH analogs first-line for a typical new diagnosis?", "options": [{"letter": "A", "text": "No — reserved for high-risk patients"}, {"letter": "B", "text": "Yes — first-line for everyone"}], "answer": "A", "explanation": "Daily injections, 2-year limit, cost — reserved for the highest-risk patients.", "teach": "Anabolics are the heavy artillery. Match them to the sickest bones."}], "checkpoints": [{"stem": "A 66-year-old woman with three vertebral compression fractures and a T-score of −3.6 despite 4 years of alendronate. Best next step →", "options": [{"letter": "A", "text": "Switch to an anabolic agent (teriparatide or abaloparatide)"}, {"letter": "B", "text": "Continue alendronate another 5 years"}, {"letter": "C", "text": "Switch to raloxifene"}, {"letter": "D", "text": "Begin a drug holiday"}], "answer": "A", "explanation": "Very high risk / multiple fractures on therapy → anabolic therapy."}]}}, {"id": "47", "group": 47, "section": "Anabolic therapy — PTH analogs", "topic": "Teriparatide / abaloparatide", "skill": "Pharmacology", "stem": "What is the maximum lifetime treatment duration for teriparatide and abaloparatide?", "options": [{"letter": "A", "text": "2 years"}, {"letter": "B", "text": "1 year"}, {"letter": "C", "text": "5 years"}, {"letter": "D", "text": "Indefinite"}], "answer": "A", "explanation": "Treatment limited to approximately **2 years** (osteosarcoma observed in rats at high doses). Then transition to a bisphosphonate or denosumab.", "objective": "", "remediation": {"steps": [{"stem": "What must happen when the 2 years end?", "options": [{"letter": "A", "text": "Transition to an antiresorptive"}, {"letter": "B", "text": "Stop all therapy"}], "answer": "A", "explanation": "Anabolic gains are lost without a follow-on antiresorptive to hold them.", "teach": "Each drug has a duration on the slide-27 table: 1 year, 2 years, indefinite, or holiday-eligible."}], "checkpoints": [{"stem": "Which drug's duration is 1 YEAR, followed by an antiresorptive?", "options": [{"letter": "A", "text": "Romosozumab"}, {"letter": "B", "text": "Teriparatide"}, {"letter": "C", "text": "Denosumab"}, {"letter": "D", "text": "Alendronate"}], "answer": "A", "explanation": "Romosozumab 12 months; teriparatide/abaloparatide 2 years; denosumab indefinite."}]}}, {"id": "48", "group": 48, "section": "Anabolic therapy — PTH analogs", "topic": "Teriparatide / abaloparatide", "skill": "Complications", "stem": "What are the characteristic adverse effects of teriparatide?", "options": [{"letter": "A", "text": "Transient hypercalcemia, dizziness/orthostasis, leg cramps, arthralgia"}, {"letter": "B", "text": "Esophagitis and reflux"}, {"letter": "C", "text": "Hot flashes and DVT"}, {"letter": "D", "text": "MI and stroke"}], "answer": "A", "explanation": "**Transient hypercalcemia**, dizziness/orthostasis, leg cramps, arthralgia, general pain. (Monitor calcium if clinically indicated.)", "objective": "", "remediation": {"steps": [{"stem": "PTH raises serum calcium. Teriparatide, a PTH analog, therefore tends to cause →", "options": [{"letter": "A", "text": "Hypercalcemia"}, {"letter": "B", "text": "Hypocalcemia"}], "answer": "A", "explanation": "The anabolic PTH analog is the one osteoporosis drug that raises calcium; the antiresorptives lower it.", "teach": "Think about what the parathyroid hormone itself does to serum calcium."}], "checkpoints": [{"stem": "Which osteoporosis drug causes HYPERcalcemia rather than hypocalcemia?", "options": [{"letter": "A", "text": "Teriparatide"}, {"letter": "B", "text": "Denosumab"}, {"letter": "C", "text": "Zoledronic acid"}, {"letter": "D", "text": "Romosozumab"}], "answer": "A", "explanation": "PTH analog → hypercalcemia; the antiresorptives → hypocalcemia."}]}}, {"id": "49", "group": 49, "section": "Anabolic therapy — PTH analogs", "topic": "Teriparatide / abaloparatide", "skill": "Pharmacology", "stem": "In which patients should teriparatide be avoided?", "options": [{"letter": "A", "text": "Paget's disease/unexplained ↑ALP, bone malignancy or metastases, prior skeletal radiation"}, {"letter": "B", "text": "History of DVT/PE"}, {"letter": "C", "text": "Recent MI or stroke"}, {"letter": "D", "text": "Esophageal stricture"}], "answer": "A", "explanation": "Avoid (or specialist input) with **Paget disease / unexplained ALP elevation, skeletal malignancy or bone mets, prior radiation involving bone, other osteosarcoma risk factors**.", "objective": "", "remediation": {"steps": [{"stem": "What single cancer concern unites all of teriparatide's cautions?", "options": [{"letter": "A", "text": "Osteosarcoma"}, {"letter": "B", "text": "Breast cancer"}], "answer": "A", "explanation": "High-dose PTH caused osteosarcoma in rats; avoid anything that already raises bone-tumor risk.", "teach": "Every item in the correct option is a situation of abnormal or at-risk bone."}], "checkpoints": [{"stem": "A 70-year-old man with severe osteoporosis has an unexplained alkaline phosphatase elevation. Regarding teriparatide →", "options": [{"letter": "A", "text": "Avoid it until the ALP elevation is explained"}, {"letter": "B", "text": "Start it — ALP is irrelevant"}, {"letter": "C", "text": "Start it at half dose"}, {"letter": "D", "text": "Use it only with calcium"}], "answer": "A", "explanation": "Unexplained ↑ALP (possible Paget's/malignancy) is a reason to avoid teriparatide."}]}}, {"id": "50", "group": 50, "section": "Romosozumab", "topic": "Romosozumab", "skill": "Pharmacology", "stem": "What is the mechanism of action of romosozumab (Evenity)?", "options": [{"letter": "A", "text": "Monoclonal antibody inhibiting sclerostin → ↑ formation and ↓ resorption"}, {"letter": "B", "text": "Anti-RANKL antibody"}, {"letter": "C", "text": "Recombinant PTH"}, {"letter": "D", "text": "Selective estrogen receptor modulator"}], "answer": "A", "explanation": "**Sclerostin inhibitor** — the dual-action agent (anabolic + antiresorptive), with the greatest BMD increases.", "objective": "", "remediation": {"steps": [{"stem": "Sclerostin normally INHIBITS bone formation. Blocking sclerostin therefore →", "options": [{"letter": "A", "text": "Increases bone formation"}, {"letter": "B", "text": "Decreases bone formation"}], "answer": "A", "explanation": "Inhibit the inhibitor → osteoblasts build. Romosozumab also lowers resorption.", "teach": "Romosozumab is the only drug the lecture calls 'dual-action'. Which target gives both effects?"}], "checkpoints": [{"stem": "Which therapy produces the GREATEST increase in BMD per the lecture?", "options": [{"letter": "A", "text": "Romosozumab"}, {"letter": "B", "text": "Alendronate"}, {"letter": "C", "text": "Raloxifene"}, {"letter": "D", "text": "Calcium and vitamin D"}], "answer": "A", "explanation": "Notes: 'strong anabolic agent — greater BMD increases than other therapies.'"}]}}, {"id": "51", "group": 51, "section": "Romosozumab", "topic": "Romosozumab", "skill": "Pharmacology", "stem": "What is the boxed warning for romosozumab?", "options": [{"letter": "A", "text": "MI and stroke (cardiovascular events)"}, {"letter": "B", "text": "DVT/PE"}, {"letter": "C", "text": "Osteosarcoma"}, {"letter": "D", "text": "Esophageal cancer"}], "answer": "A", "explanation": "Black box: **increased risk of cardiovascular events — MI, stroke**. Do NOT use if MI or stroke within the previous year.", "objective": "", "remediation": {"steps": [{"stem": "Which patient must NOT receive romosozumab?", "options": [{"letter": "A", "text": "MI or stroke within the past year"}, {"letter": "B", "text": "History of DVT"}], "answer": "A", "explanation": "Recent (≤1 yr) MI/stroke is the contraindication.", "teach": "DVT/PE is raloxifene's box; osteosarcoma is teriparatide's caution. Romosozumab's is different."}], "checkpoints": [{"stem": "A 69-year-old woman with multiple vertebral fractures had an ischemic stroke 7 months ago. Best anabolic option →", "options": [{"letter": "A", "text": "Teriparatide"}, {"letter": "B", "text": "Romosozumab"}, {"letter": "C", "text": "Raloxifene"}, {"letter": "D", "text": "Estrogen"}], "answer": "A", "explanation": "Stroke within 1 year → no romosozumab → PTH analog."}]}}, {"id": "52", "group": 52, "section": "Romosozumab", "topic": "Romosozumab", "skill": "Management", "stem": "For whom is romosozumab indicated, and how long is it used?", "options": [{"letter": "A", "text": "Postmenopausal women at VERY high fracture risk; 12 monthly doses then an antiresorptive"}, {"letter": "B", "text": "First-line for men; indefinite"}, {"letter": "C", "text": "Osteopenia; 2 years"}, {"letter": "D", "text": "Breast-cancer-risk women; 5 years"}], "answer": "A", "explanation": "**Postmenopausal women with very high fracture risk** (e.g., multiple vertebral fractures); **210 mg SC monthly × 12 months**, then must transition to bisphosphonate or denosumab.", "objective": "", "remediation": {"steps": [{"stem": "After the 12th dose of romosozumab, what happens without follow-on therapy?", "options": [{"letter": "A", "text": "Rapid bone loss"}, {"letter": "B", "text": "Gains are maintained"}], "answer": "A", "explanation": "Must transition to maintenance antiresorptive therapy to avoid rapid loss.", "teach": "Romosozumab is time-limited like teriparatide, but shorter — and only studied in one population."}], "checkpoints": [{"stem": "Which TWO agents are the lecture's follow-on options after ANY anabolic course?", "options": [{"letter": "A", "text": "Bisphosphonate or denosumab"}, {"letter": "B", "text": "Raloxifene or estrogen"}, {"letter": "C", "text": "Calcium or vitamin D"}, {"letter": "D", "text": "Teriparatide or abaloparatide"}], "answer": "A", "explanation": "After anabolic therapy → transition to an antiresorptive (bisphosphonate or denosumab)."}]}}, {"id": "53", "group": 53, "section": "Romosozumab", "topic": "Romosozumab", "skill": "Complications", "stem": "Which contraindication is shared by romosozumab and, in practice, denosumab?", "options": [{"letter": "A", "text": "Hypocalcemia"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Hyperglycemia"}, {"letter": "D", "text": "Hypertension"}], "answer": "A", "explanation": "Romosozumab CI: **hypocalcemia** (and MI/stroke within 1 yr). Both antiresorptive antibodies require calcium correction first; both cause ONJ/atypical femoral fractures.", "objective": "", "remediation": {"steps": [{"stem": "Both drugs reduce bone resorption. What oup": 56, "section": "Raloxifene (SERM)", "topic": "Raloxifene", "skill": "Pharmacology", "stem": "What is the boxed warning for raloxifene?", "options": [{"letter": "A", "text": "Increased risk of DVT/PE"}, {"letter": "B", "text": "MI and stroke"}, {"letter": "C", "text": "Osteosarcoma"}, {"letter": "D", "text": "Endometrial cancer"}], "answer": "A", "explanation": "Black box: **DVT/PE** → contraindicated with history of or active thromboembolic disease, and in pregnancy / women who can become pregnant.", "objective": "", "remediation": {"steps": [{"stem": "Which of these also happens on raloxifene?", "options": [{"letter": "A", "text": "Hot flashes and leg cramps"}, {"letter": "B", "text": "Esophagitis"}], "answer": "A", "explanation": "Side effects: thromboembolism, hot flashes, leg cramps — it worsens, not relieves, vasomotor symptoms.", "teach": "Raloxifene behaves like estrogen in the clotting system even though it blocks estrogen in the breast."}], "checkpoints": [{"stem": "A 58-year-old woman had a pulmonary embolism 3 years ago. Which osteoporosis drug is contraindicated?", "options": [{"letter": "A", "text": "Raloxifene"}, {"letter": "B", "text": "Alendronate"}, {"letter": "C", "text": "Denosumab"}, {"letter": "D", "text": "Teriparatide"}], "answer": "A", "explanation": "Prior VTE → no raloxifene (and no estrogen)."}]}}, {"id": "57", "group": 57, "section": "Hormone therapy & men", "topic": "Estrogen therapy", "skill": "Management", "stem": "What is estrogen's FDA-approved role in osteoporosis?", "options": [{"letter": "A", "text": "Prevention only, not treatment"}, {"letter": "B", "text": "Treatment of established osteoporosis"}, {"letter": "C", "text": "First-line for all postmenopausal women"}, {"letter": "D", "text": "Treatment of osteoporosis in men"}], "answer": "A", "explanation": "Estrogen is FDA-approved for **prevention, not treatment**; primary indication is vasomotor/genitourinary symptoms (women <60 or <10 yr postmenopause). Use for bone alone : "No bone reservoir → rapid rebound when stopped.", "teach": "Match each drug to its clock: 1 year, 2 years, 3–5 years then holiday, or no stopping point."}], "checkpoints": [{"stem": "In women with NO history of vertebral fracture, the lecture suggests considering bisphosphonate discontinuation after →", "options": [{"letter": "A", "text": "5 years"}, {"letter": "B", "text": "1 year"}, {"letter": "C", "text": "2 years"}, {"letter": "D", "text": "15 years"}], "answer": "A", "explanation": "Consider discontinuing after 5 years in women without vertebral fracture history."}]}}, {"id": "63", "group": 63, "section": "Case application (Ms. Carter) & TL;DR", "topic": "Case: Ms. Carter", "skill": "Management", "stem": "A 68-year-old woman has GERD treated with omeprazole, a T-score of −2.7, and normal renal function. Which condition makes oral alendronate a questionable choice?", "options": [{"letter": "A", "text": "Clinically significant GERD"}, {"letter": "B", "text": "Her age"}, {"letter": "C", "text": "Her normal renal function"}, {"letter": "D", "text": "Her vitamin D insufficiency"}], "answer": "A", "explanation": "Alendronate is appropriate **if she can follow administration instructions and GERD is not clinically significant**; otherwise zoledronic acid IV (renal function adequate) or denosumab.", "objective": "", "remediation": {"steps": [{"stem": "If her GERD IS symptomatic, which bisphosphonate route avoids the esophagus?", "options": [{"letter": "A", "text": "IV zoledronic acid"}, {"letter": "B", "text": "Oral risedronate"}], "answer": "A", "explanation": "IV avoids esophageal exposure; renal function must be adequate (hers is).", "teach": "Oral bisphosphonates' main problem is the esophagus. Which item in her history lives there?"}], "checkpoints": [{"stem": "Ms. Carter's vitamin D is 24 ng/mL. Appropriate plan →", "options": [{"letter": "A", "text": "Cholecalciferol daily until >30 ng/mL, then a maintenance dose"}, {"letter": "B", "text": "No supplementation
