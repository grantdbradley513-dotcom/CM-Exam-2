<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  /* LQ-PATCH: two-across option grid + select-all-that-apply */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .opts .opt { margin-bottom: 0; height: 100%; }
  .opts .opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
  @media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
  .group.c3 .opts, .group.c4 .opts { gap: 5px; margin-bottom: 5px; }
  .group.c2 .opts { gap: 6px; margin-bottom: 6px; }
  .opt.picked { border-color: var(--accent); background: var(--accent-soft); }
  .opt .box { min-width: 1.25em; height: 1.25em; line-height: 1.15em; text-align: center;
    border: 2px solid var(--border); border-radius: 4px; font-size: 0.8em; font-weight: 700;
    color: transparent; flex: 0 0 auto; }
  .opt .box.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct .box.on { background: var(--green); border-color: var(--green); }
  .opt.incorrect .box.on { background: var(--red); border-color: var(--red); }
  .sata-note { font-size: 0.85em; font-weight: 700; color: var(--accent); margin: -6px 0 10px; }
  .sata-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .opt-submit { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 8px;
    padding: 8px 18px; background: var(--accent); color: #fff; }
  .opt-submit:disabled { opacity: 0.45; cursor: default; }
  .sata-count { font-size: 0.85em; color: var(--ink-soft); }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>

//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer

s"}, {"letter": "B", "text": "It rises"}], "answer": "A", "explanation": "Less free calcium means the **ionized level falls**."}]}, {"teach": "A falling ionized calcium is exactly the signal the calcium-sensing receptor responds to.", "stem": "How does the parathyroid gland respond when ionized calcium falls?", "options": [{"letter": "A", "text": "It secretes less PTH"}, {"letter": "B", "text": "It secretes more PTH"}], "answer": "B", "explanation": "A low ionized calcium **drives PTH up**.", "clarify": [{"stem": "How does acidosis change calcium binding by albumin?", "options": [{"letter": "A", "text": "It decreases binding, raising ionized calcium"}, {"letter": "B", "text": "It increases binding, lowering ionized calcium"}], "answer": "A", "explanation": "Acidosis frees calcium, so **ionized calcium rises and PTH falls**."}]}, {"teach": "Put the binding change and the gland's response together.", "stem": "Taken together, what does alkalosis do to ionized calcium and to PTH?", "options": [{"letter": "A", "text": "↑ ionized Ca, ↓ PTH"}, {"letter": "B", "text": "↑ ionized Ca, ↑ PTH"}, {"letter": "C", "text": "No change in either"}, {"letter": "D", "text": "↓ ionized Ca, ↑ PTH"}], "answer": "D", "explanation": "Alkalosis: **ionized calcium down, PTH up**."}], "checkpoints": [{"stem": "Why should the blood pH be reviewed during a hypocalcemia workup?", "options": [{"letter": "A", "text": "Acidosis lowers total calcium"}, {"letter": "B", "text": "pH interferes with the PTH assay"}, {"letter": "C", "text": "Alkalosis lowers ionized calcium"}, {"letter": "D", "text": "pH changes hepatic albumin synthesis"}], "answer": "C", "explanation": "**Alkalosis lowers ionized calcium** without changing the total."}, {"stem": "A hyperventilating patient has perioral tingling but a normal total calcium — what explains the symptoms?", "options": [{"letter": "A", "text": "The total calcium is falsely high"}, {"letter": "B", "text": "Acidosis has suppressed PTH"}, {"letter": "C", "text": "Magnesium is being renally wasted"}, {"letter": "D", "text": "Respiratory alkalosis has lowered the ionized calcium"}], "answer": "D", "explanation": "Acute **respiratory alkalosis** drops ionized calcium even when total calcium is normal."}]}}, {"id": "4", "group": 4, "section": "Interpreting a low total calcium", "topic": "Serum calcium", "skill": "Diagnostics & imaging", "stem": "What is the first step in evaluating a low total calcium level on a comprehensive metabolic panel?", "options": [{"letter": "A", "text": "Order intact PTH"}, {"letter": "B", "text": "Start oral calcium"}, {"letter": "C", "text": "Check albumin or ionized calcium"}, {"letter": "D", "text": "Order 1,25-dihydroxyvitamin D"}], "answer": "C", "explanation": "First **confirm that the hypocalcemia is real** — correct for **albumin** or measure **ionized calcium** — before ordering PTH.", "objective": "", "remediation": {"steps": [{"teach": "A low albumin drags the total calcium down while the active fraction stays normal. You do not want to work up an artifact.", "stem": "Which calcium value does a low serum albumin lower?", "options": [{"letter": "A", "text": "Total calcium only"}, {"letter": "B", "text": "Both total and ionized calcium"}], "answer": "A", "explanation": "Low albumin lowers **total calcium only**.", "clarify": [{"stem": "Should intact PTH be ordered before or after the hypocalcemia is confirmed?", "options": [{"letter": "A", "text": "Before, to save a visit"}, {"letter": "B", "text": "After it is confirmed"}], "answer": "B", "explanation": "Confirm the calcium **first**, then measure PTH."}]}, {"teach": "Confirm the number, then sort the differential with PTH.", "stem": "What should you do first when a metabolic panel shows a low total calcium?", "options": [{"letter": "A", "text": "Start oral calcium"}, {"letter": "B", "text": "Order calcitriol"}, {"letter": "C", "text": "Check albumin or measure ionized calcium"}, {"letter": "D", "text": "Order intact PTH"}], "answer": "C", "explanation": "**Albumin-correct the calcium, or measure the ionized calcium.**", "clarify": [{"stem": "Does this lecture treat albumin correction as being as accurate as measuring ionized calcium?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "B", "explanation": "Correcting for albumin is considered **as accurate** as the ionized measurement."}]}], "checkpoints": [{"stem": "Once true hypocalcemia has been confirmed, which single test sorts the differential?", "options": [{"letter": "A", "text": "Calcitriol"}, {"letter": "B", "text": "PTH-related peptide"}, {"letter": "C", "text": "Intact PTH"}, {"letter": "D", "text": "Alkaline phosphatase"}], "answer": "C", "explanation": "**Intact PTH** splits the hypocalcemia differential."}, {"stem": "A patient has a low total calcium, a low albumin and a normal ionized calcium — what is the diagnosis?", "options": [{"letter": "A", "text": "Hypoparathyroidism"}, {"letter": "B", "text": "True hypocalcemia"}, {"letter": "C", "text": "Pseudohypoparathyroidism"}, {"letter": "D", "text": "Pseudohypocalcemia"}], "answer": "D", "explanation": "This is **pseudohypocalcemia** — a lab artifact that needs no workup."}]}}, {"id": "4a", "group": 4, "section": "Interpreting a low total calcium", "topic": "Serum calcium", "skill": "Diagnostics & imaging", "stem": "A patient has a calcium of 7.8 mg/dL with an albumin of 2.0 g/dL — what is the albumin-corrected calcium?", "options": [{"letter": "A", "text": "7.8 mg/dL"}, {"letter": "B", "text": "9.4 mg/dL"}, {"letter": "C", "text": "8.6 mg/dL"}, {"letter": "D", "text": "10.2 mg/dL"}], "answer": "B", "explanation": "Corrected Ca = 7.8 + **0.8 × (4 − 2)** = 7.8 + 1.6 = **9.4 mg/dL**, which is normal — pseudohypocalcemia.", "objective": "", "remediation": {"steps": [{"teach": "The correction assumes a normal albumin of 4 g/dL and adds back the calcium that is missing its carrier.", "stem": "Which formula corrects a measured calcium for a low albumin?", "  in the outpatient setting?", "options": [{"letter": "A", "text": "Incidentally, on routine labs in an asymptomatic patient"}, {"letter": "B", "text": "During an admission for acute confusion"}], "answer": "A", "explanation": "PHPT is usually **asymptomatic and incidental**.", "clarify": [{"stem": "Which cause comes first when hypercalcemia is acute, severe and symptomatic in a hospitalized patient?", "options": [{"letter": "A", "text": "Primary hyperparathyroidism"}, {"letter": "B", "text": "Malignancy"}], "answer": "B", "explanation": "**Malignancy** dominates inpatient hypercalcemia."}]}, {"teach": "Match the setting to the cause.", "stem": "Which disorder accounts for most hypercalcemia found in the clinic?", "options": [{"letter": "A", "text": "Sarcoidosis"}, {"letter": "B", "text": "Thiazide use"}, {"letter": "C", "text": "Malignancy"}, {"letter": "D", "text": "Primary hyperparathyroidism"}], "answer": "D", "explanation": "**Primary hyperparathyroidism** is the outpatient leader."}], "checkpoints": [{"stem": "Which lesion accounts for roughly 85% of primary hyperparathyroidism?", "options": [{"letter": "A", "text": "A pituitary adenoma"}, {"letter": "B", "text": "Four-gland hyperplasia"}, {"letter": "C", "text": "A single parathyroid adenoma"}, {"letter": "D", "text": "Parathyroid carcinoma"}], "answer": "C", "explanation": "A **single adenoma** causes about 85%; hyperplasia or multiple adenomas about 15%, carcinoma rarely."}, {"stem": "In which situation should MEN genetic testing be ordered for primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Whenever the calcium exceeds 11 mg/dL"}, {"letter": "B", "text": "Only after parathyroidectomy fails"}, {"letter": "C", "text": "Any patient over 50"}, {"letter": "D", "text": "Age under 30, or multigland disease"}], "answer": "D", "explanation": "Test for **MEN** when PHPT appears under 30 or involves multiple glands."}]}}, {"id": "8", "group": 8, "section": "PHPT: clinical correlations", "topic": "Primary hyperparathyroidism", "skill": "Complications", "stem": "Which clinical findings are features of symptomatic hypercalcemia?", "options": [{"letter": "A", "text": "Polyuria from nephrogenic diabetes insipidus"}, {"letter": "B", "text": "Perioral and distal paresthesias"}, {"letter": "C", "text": "A prolonged QT interval with torsades"}, {"letter": "D", "text": "Carpopedal spasm and tetany"}, {"letter": "E", "text": "A shortened QT interval"}, {"letter": "F", "text": "Calcium nephrolithiasis"}], "answer": ["A", "E", "F"], "explanation": "Hypercalcemia gives **stones, bones, groans, thrones and psychiatric overtones**, with a **short QT** on the ECG. Tetany, paresthesias and a long QT belong to **hypocalcemia**.", "objective": "", "remediation": {"steps": [{"teach": "Hypercalcemia only declares itself once the level climbs — and how fast it rose matters as much as the number.", "stem": "At roughly what serum calcium level does hypercalcemia usually become symptomatic?", "options": [{"letter": "A", "text": ">16 mg/dL"}, {"letter": "B", "text": ">12–13 mg/dL"}, {"letter": "C", "text": ">11 mg/dL"}, {"letter": "D", "text": ">10.5 mg/dL"}], "answer": "B", "explanation": "Symptoms usually appear above **12–13 mg/dL**.", "clarify": [{"stem": "Besides the absolute level, what else decides how symptomatic a patient becomes?", "options": [{"letter": "A", "text": "How rapidly the calcium rose"}, {"letter": "B", "text": "The patient's serum albumin"}], "answer": "A", "explanation": "Severity depends on the **rapidity of the rise**, not only the level."}]}, {"teach": "The 'thrones' of the mnemonic are the piece students most often leave out — a renal concentrating defect.", "stem": "By what mechanism does hypercalcemia cause polyuria and polydipsia?", "options": [{"letter": "A", "text": "Syndrome of inappropriate ADH"}, {"letter": "B", "text": "Central diabetes insipidus"}, {"letter": "C", "text": "Osmotic diuresis from glucose"}, {"letter": "D", "text": "Nephrogenic diabetes insipidus"}], "answer": "D", "explanation": "Hypercalcemia impairs urinary concentration, producing a **nephrogenic diabetes insipidus**.", "clarify": [{"stem": "Does the polyuria of hypercalcemia respond to vasopressin?", "options": [{"letter": "A", "text": "Yes — it corrects promptly"}, {"letter": "B", "text": "No — the kidney is resistant to it"}], "answer": "B", "explanation": "The defect is **renal resistance**, so vasopressin does not fix it."}]}, {"teach": "The ECG mirrors the calcium: high calcium shortens repolarisation, low calcium lengthens it.", "stem": "What is the classic ECG change of hypercalcemia?", "options": [{"letter": "A", "text": "Peaked T waves"}, {"letter": "B", "text": "A delta wave"}, {"letter": "C", "text": "A short QT interval"}, {"letter": "D", "text": "A prolonged QT interval"}], "answer": "C", "explanation": "Hypercalcemia gives a **short QT**, with bradycardia and AV block."}], "checkpoints": [{"stem": "A 58-year-old with a calcium of 12.6 reports constipation, fatigue and poor concentration — which parts of the mnemonic are these?", "options": [{"letter": "A", "text": "Stones"}, {"letter": "B", "text": "Thrones"}, {"letter": "C", "text": "Bones"}, {"letter": "D", "text": "Groans and psychiatric overtones"}], "answer": "D", "explanation": "Abdominal **groans** and **psychiatric overtones** cover constipation, anorexia, fatigue and depression."}]}}, {"id": "9", "group": 9, "section": "PHPT: diagnosis and evaluation", "topic": "Primary hyperparathyroidism", "skill": "Diagnostics & imaging", "stem": "How should an intact PTH level of 50 pg/mL be interpreted when calcium is 11.0 mg/dL?", "options": [{"letter": "A", "text": "A suppressed PTH, pointing to malignancy"}, {"letter": "B", "text": "A laboratory error that should be repeated in a year"}, {"letter": "C", "text": "A normal PTH, which excludes primary hyperparathyroidism"}, {"letter": "D", "text": "Inappropriately normal PTH, consistent with primary hyperparathyroidism"}], "answer": "D", "explanation": "A high calcium should **suppress** PTH, so a mid-range value is **inappropriately normal** — a normal PTH does **not** exclude PHPT.", "objective": "", "remediation": {"steps": [{"teach": "Start from the reference range, then ask whether the value is appropriate for this patient's calcium.", "stem": "What is the normal reference range for intact PTH?", "options": [{"letter": "A", "text": "~10–65 pg/mL"}, {"letter": "B", "text": "~100–300 pg/mL"}, {"letter": "C", "text": "<2 pmol/L"}, {"letter": "D", "text": "30–100 ng/mL"}], "answer": "A", "explanation": "Intact PTH runs about **10–65 pg/mL**, lab-dependent.", "clarify": [{"stem": "What should a healthy parathyroid gland do with PTH when the serum calcium is high?", "options": [{"letter": "A", "text": "Raise it"}, {"letter": "B", "text": "Suppress it"}], "answer": "B", "explanation": "A high calcium should **shut PTH off**."}]}, {"teach": "The question is never 'is the PTH normal' but 'is the PTH appropriate for this calcium'.", "stem": "Why is a mid-range PTH inappropriate when the calcium is clearly elevated?", "options": [{"letter": "A", "text": "The assay is unreliable above 11 mg/dL"}, {"letter": "B", "text": "PTH is expected to rise whenever calcium rises"}, {"letter": "C", "text": "It should have been suppressed by the high calcium"}, {"letter": "D", "text": "A normal PTH always rules out parathyroid disease"}], "answer": "C", "explanation": "An unsuppressed PTH with hypercalcemia means the gland is **autonomous**."}], "checkpoints": [{"stem": "Does a PTH inside the reference range exclude primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Yes — the diagnosis requires a frankly high PTH"}, {"letter": "B", "text": "Only when the calcium is above 12 mg/dL"}, {"letter": "C", "text": "Only in patients over the age of 50"}, {"letter": "D", "text": "No — a normal value can still be inappropriate for the calcium"}], "answer": "D", "explanation": "A **normal PTH does not exclude PHPT** when the calcium is high."}, {"stem": "Which calcium and PTH combination defines parathyroid-mediated hypercalcemia?", "options": [{"letter": "A", "text": "Low calcium with low PTH"}, {"letter": "B", "text": "High calcium with suppressed PTH"}, {"letter": "C", "text": "High calcium with high or inappropriately normal PTH"}, {"letter": "D", "text": "Low calcium with high PTH"}], "answer": "C", "explanation": "High Ca with **high or inappropriately normal PTH** is parathyroid-mediated — primary or tertiary."}]}}, {"id": "10", "group": 10, "section": "PHPT: additional studies", "topic": "Primary hyperparathyroidism", "skill": "Diagnostics & imaging", "stem": "Which studies belong in the evaluation of a patient with confirmed primary hyperparathyroidism?", "options": [{"letter": "A", "text": "A serum PTH-related peptide level"}, {"letter": "B", "text": "Nuclear medicine parathyroid (sestamibi) scan"}, {"letter": "C", "text": "A 24-hour urine calcium and creatinine"}, {"letter": "D", "text": "Plain skull radiographs for granular lytic change"}, {"letter": "E", "text": "DXA with vertebral fracture assessment"}, {"letter": "F", "text": "Renal imaging for nephrolithiasis"}], "answer": ["B", "C", "E", "F"], "explanation": "Once PHPT is confirmed you **localize** the gland (sestamibi) and look for end-organ damage — **DXA with VFA**, **renal imaging**, and a **24-hour urine calcium/creatinine**. Plain films are not routine, and PTHrP is for hypercalcemia with a *suppressed* PTH.", "objective": "", "remediation": {"steps": [{"teach": "Imaging in PHPT answers 'which gland', never 'is this PHPT' — the diagnosis is already made in the lab.", "stem": "What is the purpose of a nuclear medicine parathyroid scan in primary hyperparathyroidism?", "options": [{"letter": "A", "text": "To localize the abnormal gland before surgery"}, {"letter": "B", "text": "To confirm the biochemical diagnosis"}, {"letter": "C", "text": "To grade the degree of bone loss"}, {"letter": "D", "text": "To screen for kidney stones"}], "answer": "A", "explanation": "The sestamibi scan **localizes**; glands vary in position, even into the mediastinum.", "clarify": [{"stem": "Is primary hyperparathyroidism diagnosed by imaging or by laboratory values?", "options": [{"letter": "A", "text": "By imaging"}, {"letter": "B", "text": "By laboratory values"}], "answer": "B", "explanation": "PHPT is diagnosed **biochemically, never by imaging**."}]}, {"teach": "The skeleton is the organ most consistently damaged, and it is assessed with bone densitometry rather than plain films.", "stem": "Which study is preferred for assessing the skeleton in primary hyperparathyroidism?", "options": [{"letter": "A", "text": "MRI of the lumbar spine"}, {"letter": "B", "text": "A plain skull radiograph"}, {"letter": "C", "text": "A nuclear bone scan"}, {"letter": "D", "text": "DXA with vertebral fracture assessment"}], "answer": "D", "explanation": "**DXA with VFA** finds osteopenia, osteoporosis and vertebral fractures."}, {"teach": "The 24-hour urine serves two purposes at once — stone risk and the FHH mimic.", "stem": "Why is a 24-hour urine calcium and creatinine collected in primary hyperparathyroidism?", "options": [{"letter": "A", "text": "To measure vitamin D stores"}, {"letter": "B", "text": "To localize the adenoma"}, {"letter": "C", "text": "To gauge stone risk and exclude familial hypocalciuric hypercalcemia"}, {"letter": "D", "text": "To validate the PTH assay"}], "answer": "C", "explanation": "A ratio **> 0.02** supports PHPT and predicts stones; **< 0.01** suggests FHH."}], "checkpoints": [{"stem": "A patient with confirmed PHPT develops flank pain — which imaging best evaluates it?", "options": [{"letter": "A", "text": "Non-contrast abdominal CT or renal ultrasound"}, {"letter": "B", "text": "DXA with vertebral fracture assessment"}, {"letter": "C", "text": "A skull radiograph"}, {"letter": "D", "text": "A sestamibi scan"}], "answer": "A", "explanation": "Renal imaging (**non-contrast CT, ultrasound or KUB**) looks for nephrolithiasis and nephrocalcinosis."}]}}, {"id": "11", "group": 11, "section": "PHPT: additional studies", "topic": "Other causes of hypercalcemia", "skill": "Identification", "stem": "Which diagnosis is suggested by elevated calcium, a normal or mildly elevated PTH, and a urine calcium-to-creatinine clearance ratio below 0.01?", "options": [{"letter": "A", "text": "Humoral hypercalcemia of malignancy"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "D", "text": "Tertiary hyperparathyroidism"}], "answer": "C", "explanation": "A **low urine calcium (ratio < 0.01)** separates **familial hypocalciuric hypercalcemia** — an inherited calcium-sensing receptor defect — from PHPT, where the ratio is **> 0.02**. FHH is not treated surgically.", "objective": "", "remediation": {"steps": [{"teach": "The serum numbers in these two disorders overlap almost completely; the urine is what tells them apart.", "stem": "What does a urine calcium-to-creatinine clearance ratio above 0.02 support?", "options": [{"letter": "A", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Vitamin D deficiency"}, {"letter": "D", "text": "Hypoparathyroidism"}], "answer": "B", "explanation": "A ratio **> 0.02** supports **PHPT**.", "clarify": [{"stem": "What else does a high urine calcium predict in primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Kidney stones"}, {"letter": "B", "text": "Skull fractures"}], "answer": "A", "explanation": "Hypercalciuria predicts **nephrolithiasis**."}]}, {"teach": "The mimic is inherited, and the defect sits in the sensor that tells the gland how much calcium is around.", "stem": "Which receptor is altered in the inherited disorder that mimics primary hyperparathyroidism?", "options": [{"letter": "A", "text": "The TSH receptor"}, {"letter": "B", "text": "The PTH receptor"}, {"letter": "C", "text": "The vitamin D receptor"}, {"letter": "D", "text": "The calcium-sensing receptor"}], "answer": "D", "explanation": "FHH is an inherited **calcium-sensing receptor** defect, so the gland tolerates a higher calcium."}], "checkpoints": [{"stem": "Why does separating these two disorders matter before a patient is referred for parathyroidectomy?", "options": [{"letter": "A", "text": "The mimic requires bilateral neck exploration"}, {"letter": "B", "text": "The mimic progresses to carcinoma"}, {"letter": "C", "text": "Surgery is not the treatment for the inherited mimic"}, {"letter": "D", "text": "Surgery must be done urgently"}], "answer": "C", "explanation": "**FHH is not a surgical disease** — missing it leads to an unnecessary neck exploration."}, {"stem": "Which single urine test distinguishes these two look-alike causes of hypercalcemia?", "options": [{"letter": "A", "text": "The protein-to-creatinine ratio"}, {"letter": "B", "text": "Urine osmolality"}, {"letter": "C", "text": "Urine phosphate excretion"}, {"letter": "D", "text": "The calcium-to-creatinine clearance ratio"}], "answer": "D", "explanation": "The **urine calcium/creatinine clearance ratio** is the discriminator."}]}}, {"id": "12", "group": 12, "section": "Radiographic signs of hyperparathyroidism", "topic": "Imaging signs of hyperparathyroidism", "skill": "Diagnostics & imaging", "stem": "Which radiographic finding points to renal osteodystrophy of advanced CKD rather than to the bone disease of primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Salt-and-pepper skull"}, {"letter": "B", "text": "Rugger-jersey spine"}, {"letter": "C", "text": "Brown tumors of bone"}, {"letter": "D", "text": "Subperiosteal resorption of the phalanges"}], "answer": "B", "explanation": "**Rugger-jersey spine** — alternating sclerotic and lucent endplate bands — is the sign of **renal osteodystrophy** in severe secondary or tertiary HPT. The other three are features of **osteitis fibrosa cystica** in advanced hyperparathyroidism.", "objective": "", "remediation": {"steps": [{"teach": "Each of these signs has its own appearance; start by matching the picture to the name.", "stem": "Which radiographic appearance describes a rugger-jersey spine?", "options": [{"letter": "A", "text": "Loss of cortical bone along the phalanges"}, {"letter": "B", "text": "Diffuse granular lytic foci throughout the skull"}, {"letter": "C", "text": "Alternating sclerotic and lucent vertebral endplate bands"}, {"letter": "D", "text": "An expansile lytic lesion within a long bone"}], "answer": "C", "explanation": "The vertebral endplates alternate **sclerotic and lucent**, like a striped rugby shirt.", "clarify": [{"stem": "In which patients is that spine appearance seen?", "options": [{"letter": "A", "text": "Those with advanced chronic kidney disease"}, {"letter": "B", "text": "Newly diagnosed outpatients with PHPT"}], "answer": "A", "explanation": "It is the spine of **renal osteodystrophy** in advanced CKD."}]}, {"teach": "The remaining three signs are different faces of one bone disease of long-standing PTH excess.", "stem": "What single term covers the skull, phalangeal and lytic bone changes of advanced hyperparathyroidism?", "options": [{"letter": "A", "text": "Osteomalacia"}, {"letter": "B", "text": "Osteitis fibrosa cystica"}, {"letter": "C", "text": "Renal osteodystrophy"}, {"letter": "D", "text": "Paget disease"}], "answer": "B", "explanation": "**Osteitis fibrosa cystica** is the bone disease of advanced hyperparathyroidism.", "clarify": [{"stem": "Are brown tumors true neoplasms?", "options": [{"letter": "A", "text": "Yes — they are low-grade sarcomas"}, {"letter": "B", "text": "No — they are lytic lesions containing hemosiderin"}], "answer": "B", "explanation": "**Brown tumors are not tumors**; they are expansile lytic lesions with hemosiderin."}]}], "checkpoints": [{"stem": "A skull film shows diffuse granular lytic foci — what is this appearance called?", "options": [{"letter": "A", "text": "Rugger-jersey spine"}, {"letter": "B", "text": "A brown tumor"}, {"letter": "C", "text": "Acro-osteolysis"}, {"letter": "D", "text": "Salt-and-pepper skull"}], "answer": "D", "explanation": "Granular lytic foci give the **salt-and-pepper (pepper-pot) skull**."}, {"stem": "Should plain radiographs be used to make the diagnosis of primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Yes — skull films confirm it"}, {"letter": "B", "text": "Yes, whenever DXA is unavailable"}, {"letter": "C", "text": "No — the diagnosis is biochemical"}, {"letter": "D", "text": "Only in patients over 70"}], "answer": "C", "explanation": "Plain films are **not routinely indicated**; PHPT is diagnosed in the lab."}]}}, {"id": "13", "group": 13, "section": "Humoral hypercalcemia of malignancy", "topic": "Hypercalcemia of malignancy", "skill": "Identification", "stem": "What diagnosis is suggested by elevated calcium, suppressed intact PTH, and elevated PTH-related peptide?", "options": [{"letter": "A", "text": "Humoral hypercalcemia of malignancy"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Tertiary hyperparathyroidism"}, {"letter": "D", "text": "Vitamin D intoxication"}], "answer": "A", "explanation": "**Humoral hypercalcemia of malignancy** — tumor PTHrP acts at PTH receptors, raising calcium and lowering phosphate while the normal glands shut PTH off. Skeletal metastases are not required.", "objective": "", "remediation": {"steps": [{"teach": "PTHrP is a tumor product, not a normal hormone, so the baseline expectation is that there is none to find.", "stem": "What PTH-related peptide level is expected in a healthy person?", "options": [{"letter": "A", "text": "Undetectable or very low"}, {"letter": "B", "text": "10–65 pg/mL"}, {"letter": "C", "text": "30–100 ng/mL"}, {"letter": "D", "text": "The same as the intact PTH"}], "answer": "A", "explanation": "PTHrP is normally **undetectable (< 2 pmol/L)**.", "clarify": [{"stem": "Is PTH-related peptide secretion regulated by the serum calcium?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "PTHrP is **not regulated by calcium**, so it keeps driving the calcium up."}]}, {"teach": "The suppressed PTH is the finding that redirects the whole workup.", "stem": "What does a suppressed intact PTH with a high calcium tell you about the source?", "options": [{"letter": "A", "text": "A parathyroid adenoma is likely"}, {"letter": "B", "text": "The hypercalcemia is not coming from the parathyroid glands"}, {"letter": "C", "text": "The assay should simply be repeated"}, {"letter": "D", "text": "The patient has tertiary hyperparathyroidism"}], "answer": "B", "explanation": "Suppressed PTH means a **non-parathyroid** source — malignancy, vitamin D, medications.", "clarify": [{"stem": "How does malignant hypercalcemia usually present compared with primary hyperparathyroidism?", "options": [{"letter": "A", "text": "Mild and incidental, usually in an outpatient"}, {"letter": "B", "text": "Acute, severe and symptomatic, usually in an inpatient"}], "answer": "B", "explanation": "Malignancy is the **leading inpatient cause** — acute and symptomatic, and it appears late in the disease."}]}, {"teach": "Certain histologies account for most PTHrP secretion.", "stem": "Which tumor type most classically secretes PTH-related peptide?", "options": [{"letter": "A", "text": "Multiple myeloma"}, {"letter": "B", "text": "Hodgkin lymphoma"}, {"letter": "C", "text": "Squamous cell carcinoma of lung, head or neck"}, {"letter": "D", "text": "Small cell lung carcinoma"}], "answer": "C", "explanation": "**Squamous cell carcinoma** (lung, head, neck) plus renal, bladder, breast and ovarian cancers."}], "checkpoints": [{"stem": "Does humoral hypercalcemia of malignancy require skeletal metastases to be present?", "options": [{"letter": "A", "text": "Yes — lytic lesions are required"}, {"letter": "B", "text": "Only in breast cancer"}, {"letter": "C", "text": "Only when the phosphate is high"}, {"letter": "D", "text": "No — PTHrP acts systemically"}], "answer": "D", "explanation": "PTHrP works through the circulation, so **no bone metastases are needed**."}, {"stem": "Which three mechanisms produce hypercalcemia of malignancy?", "options": [{"letter": "A", "text": "Humoral PTHrP, osteolytic metastases, and calcitriol excess"}, {"letter": "B", "text": "PTH excess, PTHrP, and calcitonin deficiency"}, {"letter": "C", "text": "Osteolysis, magnesium loss, and alkalosis"}, {"letter": "D", "text": "Vitamin D intoxication, thiazides, and immobilization"}], "answer": "A", "explanation": "**Humoral (PTHrP)**, **osteolytic** (myeloma, breast) and **calcitriol-mediated** (lymphoma) — PTH is suppressed in all three."}]}}, {"id": "14", "group": 14, "section": "Other causes of hypercalcemia", "topic": "Other causes of hypercalcemia", "skill": "Disease process", "stem": "Which causes of hypercalcemia are expected to show a suppressed intact PTH?", "options": [{"letter": "A", "text": "Tertiary hyperparathyroidism"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "D", "text": "Granulomatous disease such as sarcoidosis"}, {"letter": "E", "text": "Vitamin D intoxication"}, {"letter": "F", "text": "Humoral hypercalcemia of malignancy"}], "answer": ["D", "E", "F"], "explanation": "A **suppressed PTH** shifts the workup away from the parathyroid — malignancy, vitamin D excess and extrarenal calcitriol from granulomas. Primary and tertiary HPT raise PTH, and FHH leaves it normal or mildly high.", "objective": "", "remediation": {"steps": [{"teach": "Suppression is the normal response of a healthy gland to a high calcium — so a suppressed PTH means the glands are innocent.", "stem": "What does a suppressed PTH in the face of hypercalcemia say about the parathyroid glands?", "options": [{"letter": "A", "text": "They are autonomously overactive"}, {"letter": "B", "text": "They have become resistant to calcium"}, {"letter": "C", "text": "They are responding normally to the high calcium"}, {"letter": "D", "text": "They have been surgically removed"}], "answer": "C", "explanation": "The glands are doing their job; the calcium is coming from **somewhere else**.", "clarify": [{"stem": "Which test is ordered first when hypercalcemia comes with a suppressed PTH?", "options": [{"letter": "A", "text": "A repeat intact PTH"}, {"letter": "B", "text": "PTH-related peptide"}], "answer": "B", "explanation": "Go to **PTHrP** first to look for humoral hypercalcemia of malignancy."}]}, {"teach": "Granulomas make their own active vitamin D, outside the kidney and outside PTH control.", "stem": "By what mechanism does sarcoidosis raise the serum calcium?", "options": [{"letter": "A", "text": "Autonomous PTH secretion"}, {"letter": "B", "text": "Increased renal calcium retention"}, {"letter": "C", "text": "PTH-related peptide secretion"}, {"letter": "D", "text": "Extrarenal 1α-hydroxylase producing calcitriol"}], "answer": "D", "explanation": "Granulomas carry **extrarenal 1α-hydroxylase**, driving calcitriol up.", "clarify": [{"stem": "Which malignancy raises calcium by the same mechanism as granulomatous disease?", "options": [{"letter": "A", "text": "Lymphoma"}, {"letter": "B", "text": "Multiple myeloma"}], "answer": "A", "explanation": "**Lymphoma** is the calcitriol-mediated malignancy."}]}, {"teach": "When the first test in this branch comes back clean, you keep going down the same non-parathyroid branch.", "stem": "If PTH is suppressed and PTH-related peptide is normal, which tests come next?", "options": [{"letter": "A", "text": "A 24-hour urine cortisol"}, {"letter": "B", "text": "A parathyroid scan"}, {"letter": "C", "text": "Calcidiol and calcitriol levels"}, {"letter": "D", "text": "A repeat intact PTH only"}], "answer": "C", "explanation": "Check **calcidiol** (vitamin D intoxication) and **calcitriol** (granulomatous disease, lymphoma)."}], "checkpoints": [{"stem": "A patient with hypercalcemia turns out to have an elevated PTH — which group of causes does that rule out?", "options": [{"letter": "A", "text": "Familial hypocalciuric hypercalcemia"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Tertiary hyperparathyroidism"}, {"letter": "D", "text": "The non-parathyroid causes, such as malignancy and vitamin D excess"}], "answer": "D", "explanation": "An elevated PTH keeps you in the **parathyroid-mediated** branch, not the suppressed-PTH one."}]}}, {"id": "15", "group": 15, "section": "Other causes of hypercalcemia", "topic": "Other causes of hypercalcemia", "skill": "Diagnostics & imaging", "stem": "What is the next step for a patient taking hydrochlorothiazide who has a mildly elevated calcium?", "options": [{"letter": "A", "text": "Stop the thiazide and remeasure the calcium"}, {"letter": "B", "text": "Order a PTH-related peptide"}, {"letter": "C", "text": "Refer for immediate parathyroidectomy"}, {"letter": "D", "text": "Start intravenous saline"}], "answer": "A", "explanation": "Thiazides reduce urinary calcium excretion and can cause mild hypercalcemia **or unmask underlying PHPT** — stop the interfering drug and remeasure before working the patient up.", "objective": "", "remediation": {"steps": [{"teach": "Thiazides act on the kidney's handling of calcium, not on the parathyroid gland.", "stem": "How do thiazide diuretics raise the serum calcium?", "options": [{"letter": "A", "text": "By stimulating PTH release"}, {"letter": "B", "text": "By reducing urinary calcium excretion"}, {"letter": "C", "text": "By increasing intestinal absorption"}, {"letter": "D", "text": "By directly activating osteoclasts"}], "answer": "B", "explanation": "Thiazides **decrease urinary calcium excretion**.", "clarify": [{"stem": "What PTH pattern accompanies thiazide-related hypercalcemia?", "options": [{"letter": "A", "text": "Low or inappropriately normal"}, {"letter": "B", "text": "Markedly elevated"}], "answer": "A", "explanation": "PTH is **low or inappropriately normal** with thiazides and lithium."}]}, {"teach": "A drug effect and an unmasked disease look identical on the first panel, which is why the drug comes off first.", "stem": "Why should the drug be stopped and the calcium remeasured before any further workup?", "options": [{"letter": "A", "text": "Thiazides interfere with the calcium assay"}, {"letter": "B", "text": "Thiazides falsely lower the serum albumin"}, {"letter": "C", "text": "Thiazides can cause mild hypercalcemia or unmask an underlying PHPT"}, {"letter": "D", "text": "Thiazides must be stopped before any PTH assay is valid"}], "answer": "C", "explanation": "Remeasure after stopping the drug — persistent hypercalcemia means real disease."}], "checkpoints": [{"stem": "Which other medication raises calcium in the same way and should be reviewed?", "options": [{"letter": "A", "text": "Furosemide"}, {"letter": "B", "text": "Denosumab"}, {"letter": "C", "text": "Metformin"}, {"letter": "D", "text": "Lithium"}], "answer": "D", "explanation": "**Lithium** joins thiazides as a drug cause of hypercalcemia with a low or normal PTH."}]}}, {"id": "16", "group": 16, "section": "Emergency treatment of severe hypercalcemia", "topic": "Hypercalcemia of malignancy", "skill": "Management", "stem": "What serum calcium level defines severe hypercalcemia requiring emergency treatment?", "options": [{"letter": "A", "text": ">11 mg/dL"}, {"letter": "B", "text": ">12 mg/dL"}, {"letter": "C", "text": ">10 mg/dL"}, {"letter": "D", "text": ">14 mg/dL"}], "answer": "D", "explanation": "Calcium **above 14 mg/dL** is severe — treat with isotonic saline, salmon calcitonin and zoledronic acid; dialysis if refractory.", "objective": "", "remediation": {"steps": [{"teach": "Severe hypercalcemia is an emergency because of what it does to volume status, the brain and the heart.", "stem": "Why does severe hypercalcemia need immediate treatment rather than outpatient follow-up?", "options": [{"letter": "A", "text": "It causes tetany and laryngospasm"}, {"letter": "B", "text": "It causes permanent hypoparathyroidism"}, {"letter": "C", "text": "It causes volume depletion, altered mental status and arrhythmias"}, {"letter": "D", "text": "It permanently suppresses PTH secretion"}], "answer": "C", "explanation": "Severe hypercalcemia brings **dehydration, confusion and cardiac conduction problems**.", "clarify": [{"stem": "What is the first intervention in severe hypercalcemia?", "options": [{"letter": "A", "text": "A loop diuretic"}, {"letter": "B", "text": "Isotonic saline to restore volume"}], "answer": "B", "explanation": "Start with **isotonic saline 200–300 mL/h**; loop diuretics are only for volume overload."}]}, {"teach": "There are two thresholds to keep apart — the one where symptoms start, and the higher one that makes it an emergency.", "stem": "At what serum calcium does hypercalcemia become severe enough to need emergency therapy?", "options": [{"letter": "A", "text": ">11 mg/dL"}, {"letter": "B", "text": ">12 mg/dL"}, {"letter": "C", "text": ">10 mg/dL"}, {"letter": "D", "text": ">14 mg/dL"}], "answer": "D", "explanation": "**Above 14 mg/dL** is severe; symptoms usually begin above 12–13."}], "checkpoints": [{"stem": "Which combination is used to treat severe symptomatic hypercalcemia?", "options": [{"letter": "A", "text": "Isotonic saline, calcitonin and zoledronic acid"}, {"letter": "B", "text": "IV calcium gluconate with telemetry"}, {"letter": "C", "text": "A loop diuretic with oral calcium"}, {"letter": "D", "text": "A thiazide with calcitriol"}], "answer": "A", "explanation": "**Saline + salmon calcitonin + zoledronic acid**, with dialysis for refractory cases."}, {"stem": "When are loop diuretics appropriate in the treatment of hypercalcemia?", "options": [{"letter": "A", "text": "In place of a bisphosphonate"}, {"letter": "B", "text": "Only for volume overload"}, {"letter": "C", "text": "Routinely, to force calcium out"}, {"letter": "D", "text": "Before saline is started"}], "answer": "B", "explanation": "Loop diuretics are **not routine** — they are used only for volume overload."}]}}, {"id": "17", "group": 17, "section": "Secondary & tertiary hyperparathyroidism", "topic": "Secondary & tertiary hyperparathyroidism", "skill": "Identification", "stem": "Which diagnosis is suggested by an elevated PTH with a low or normal calcium?", "options": [{"letter": "A", "text": "Primary hyperparathyroidism"}, {"letter": "B", "text": "Secondary hyperparathyroidism"}, {"letter": "C", "text": "Tertiary hyperparathyroidism"}, {"letter": "D", "text": "Humoral hypercalcemia of malignancy"}], "answer": "B", "explanation": "**Secondary hyperparathyroidism** is a reactive PTH rise to a chronic hypocalcemic stimulus — CKD first, then vitamin D deficiency, malabsorption and cholestasis.", "objective": "", "remediation": {"steps": [{"teach": "Read the pair, not the single value: a high PTH alongside a low calcium is the gland doing its job.", "stem": "When the calcium is low and the PTH is high, is the parathyroid gland behaving appropriately?", "options": [{"letter": "A", "text": "Yes — it is responding to the low calcium"}, {"letter": "B", "text": "No — it is autonomous"}], "answer": "A", "explanation": "This is an **appropriate response**; find the external cause.", "clarify": [{"stem": "Which two causes account for most of this reactive PTH elevation?", "options": [{"letter": "A", "text": "Chronic kidney disease and vitamin D deficiency"}, {"letter": "B", "text": "Parathyroid adenoma and carcinoma"}], "answer": "A", "explanation": "**CKD is the leading cause**, followed by vitamin D deficiency."}]}, {"teach": "Once you know the PTH rise is reactive, the next job is to name the stimulus behind it.", "stem": "Which laboratory finding separates CKD from vitamin D deficiency as the cause?", "options": [{"letter": "A", "text": "A raised serum calcium"}, {"letter": "B", "text": "A suppressed PTH"}, {"letter": "C", "text": "An undetectable PTH-related peptide"}, {"letter": "D", "text": "A raised creatinine with a raised phosphate"}], "answer": "D", "explanation": "**CKD**: creatinine up, phosphate up. **Vitamin D deficiency**: 25(OH)D < 20 with a low or normal phosphate.", "clarify": [{"stem": "Why does calcitriol fall in CKD even when the 25-hydroxyvitamin D is normal?", "options": [{"letter": "A", "text": "The liver stops producing calcidiol"}, {"letter": "B", "text": "The failing kidney cannot 1α-hydroxylate it"}], "answer": "B", "explanation": "CKD impairs **1α-hydroxylation**, so calcitriol falls despite normal stores."}]}], "checkpoints": [{"stem": "A CKD stage 4 patient has a low-normal calcium, a high phosphate and a high PTH — what is the first management step?", "options": [{"letter": "A", "text": "Parathyroidectomy"}, {"letter": "B", "text": "IV calcium gluconate"}, {"letter": "C", "text": "Phosphate restriction and binders, with vitamin D"}, {"letter": "D", "text": "Stopping all vitamin D"}], "answer": "C", "explanation": "Treat the cause and the CKD-MBD: **phosphate restriction, binders, vitamin D**, calcimimetic on dialysis."}, {"stem": "Which hyperparathyroid states show a high PTH together with a high calcium?", "options": [{"letter": "A", "text": "Hypoparathyroidism"}, {"letter": "B", "text": "Pseudohypoparathyroidism"}, {"letter": "C", "text": "Secondary hyperparathyroidism"}, {"letter": "D", "text": "Primary and tertiary hyperparathyroidism"}], "answer": "D", "explanation": "The lecturer's rule: **high PTH + high Ca = primary or tertiary; high PTH + low/normal Ca = secondary**."}]}}, {"id": "18", "group": 18, "section": "Secondary & tertiary hyperparathyroidism", "topic": "Secondary & tertiary hyperparathyroidism", "skill": "Identification", "stem": "Which diagnosis is most likely in a dialysis patient with an elevated calcium, an elevated phosphate, and a very high PTH?", "options": [{"letter": "A", "text": "Secondary hyperparathyroidism"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Tertiary hyperparathyroidism"}, {"letter": "D", "text": "Pseudohypoparathyroidism"}], "answer": "C", "explanation": "**Tertiary hyperparathyroidism** — glands chronically stimulated by CKD become autonomous, so the calcium turns high with a very high PTH and a high phosphate. Parathyroidectomy is definitive.", "objective": "", "remediation": {"steps": [{"teach": "Chronic stimulation changes the glands themselves, and they do not switch off when the stimulus eases.", "stem": "What happens to chronically stimulated parathyroid glands in long-standing CKD?", "options": [{"letter": "A", "text": "They become autonomous and keep secreting PTH"}, {"letter": "B", "text": "They atrophy and stop secreting PTH"}], "answer": "A", "explanation": "Hyperplastic glands stay **autonomous** even after transplant or treatment.", "clarify": [{"stem": "In which two settings is this autonomous state typically seen?", "options": [{"letter": "A", "text": "Early CKD and nephrotic syndrome"}, {"letter": "B", "text": "Advanced CKD and after renal transplant"}], "answer": "B", "explanation": "**Advanced CKD and post-transplant** are the classic settings."}]}, {"teach": "The lab signature changes in one specific way as the disease evolves.", "stem": "Which laboratory change signals that secondary hyperparathyroidism has become autonomous?", "options": [{"letter": "A", "text": "PTH-related peptide becomes detectable"}, {"letter": "B", "text": "The PTH falls into the normal range"}, {"letter": "C", "text": "The calcium turns high instead of low or normal"}, {"letter": "D", "text": "The phosphate becomes low"}], "answer": "C", "explanation": "The **calcium flips from low/normal to high** while PTH climbs further."}], "checkpoints": [{"stem": "What is the definitive treatment for tertiary hyperparathyroidism?", "options": [{"letter": "A", "text": "Vitamin D repletion alone"}, {"letter": "B", "text": "Cinacalcet alone"}, {"letter": "C", "text": "Phosphate binders alone"}, {"letter": "D", "text": "Parathyroidectomy"}], "answer": "D", "explanation": "**Parathyroidectomy** is definitive; calcimimetics are used if surgery is deferred."}, {"stem": "Which skeletal finding is characteristic of severe secondary or tertiary hyperparathyroidism in CKD?", "options": [{"letter": "A", "text": "Osteopetrosis"}, {"letter": "B", "text": "Avascular necrosis of the hip"}, {"letter": "C", "text": "Renal osteodystrophy with a rugger-jersey spine"}, {"letter": "D", "text": "A solitary bone cyst"}], "answer": "C", "explanation": "**Renal osteodystrophy**, with bone pain, fractures and the rugger-jersey spine."}]}}, {"id": "19", "group": 19, "section": "Hypocalcemia: diagnostic approach", "topic": "Hypocalcemia differential", "skill": "Diagnostics & imaging", "stem": "Which studies belong to the confirmation step of a hypocalcemia workup, before intact PTH is ordered?", "options": [{"letter": "A", "text": "A serum PTH-related peptide"}, {"letter": "B", "text": "Serum magnesium"}, {"letter": "C", "text": "Ionized or albumin-corrected calcium"}, {"letter": "D", "text": "A nuclear medicine parathyroid scan"}, {"letter": "E", "text": "Arterial or venous blood pH"}, {"letter": "F", "text": "Serum phosphate"}], "answer": ["B", "C", "E", "F"], "explanation": "Confirm the calcium, then review the **pH, phosphate, magnesium, creatinine and 25(OH)D** — and only then measure intact PTH. PTHrP and parathyroid scans belong to a **hypercalcemia** workup.", "objective": "", "remediation": {"steps": [{"teach": "Step one of every hypocalcemia workup is proving the low value is real.", "stem": "Why is an ionized or albumin-corrected calcium checked before anything else?", "options": [{"letter": "A", "text": "To estimate vitamin D stores"}, {"letter": "B", "text": "To choose the dose of IV calcium"}, {"letter": "C", "text": "To be sure the hypocalcemia is real and not an albumin artifact"}, {"letter": "D", "text": "To localize the parathyroid glands"}], "answer": "C", "explanation": "Confirm first — a low albumin alone produces **pseudohypocalcemia**."}, {"teach": "Acid–base status changes the free fraction without changing the total, so it is checked alongside the confirmation.", "stem": "Why does the blood pH belong in this workup?", "options": [{"letter": "A", "text": "Alkalosis lowers ionized calcium by increasing albumin binding"}, {"letter": "B", "text": "Acidosis lowers the total calcium"}, {"letter": "C", "text": "pH interferes with the PTH assay"}, {"letter": "D", "text": "pH determines renal magnesium losses"}], "answer": "A", "explanation": "**Alkalosis lowers ionized calcium**, so pH can explain symptoms with a normal total calcium."}, {"teach": "One electrolyte can both cause the hypocalcemia and make it refractory to treatment.", "stem": "Why is magnesium measured in every patient with hypocalcemia?", "options": [{"letter": "A", "text": "A low magnesium raises PTH-related peptide"}, {"letter": "B", "text": "Severe hypomagnesemia produces a functional hypoparathyroidism"}, {"letter": "C", "text": "Magnesium binds calcium in the serum"}, {"letter": "D", "text": "Magnesium is required for the calcium assay"}], "answer": "B", "explanation": "Severe **hypomagnesemia blunts PTH**, and the calcium will not correct until the magnesium is repleted."}], "checkpoints": [{"stem": "Once the hypocalcemia is confirmed and these studies are back, which test sorts the differential?", "options": [{"letter": "A", "text": "PTH-related peptide"}, {"letter": "B", "text": "Calcitonin"}, {"letter": "C", "text": "Alkaline phosphatase"}, {"letter": "D", "text": "Intact PTH"}], "answer": "D", "explanation": "**Intact PTH** divides the differential into gland failure versus an appropriate secondary response."}]}}, {"id": "20", "group": 20, "section": "Hypocalcemia: diagnostic approach", "topic": "Hypocalcemia differential", "skill": "Identification", "stem": "What diagnosis is indicated by true hypocalcemia with a low PTH and an elevated phosphate?", "options": [{"letter": "A", "text": "Vitamin D deficiency"}, {"letter": "B", "text": "Chronic kidney disease"}, {"letter": "C", "text": "Pseudohypoparathyroidism"}, {"letter": "D", "text": "Hypoparathyroidism"}], "answer": "D", "explanation": "A low or inappropriately normal PTH with a low calcium and a **high phosphate** is **hypoparathyroidism** — postsurgical most often, and severe hypomagnesemia functionally.", "objective": "", "remediation": {"steps": [{"teach": "Judge the PTH against the calcium beside it, never on its own.", "stem": "In true hypocalcemia, what should a healthy parathyroid gland be doing?", "options": [{"letter": "A", "text": "Raising PTH"}, {"letter": "B", "text": "Suppressing PTH"}], "answer": "A", "explanation": "A low calcium should **drive PTH up**.", "clarify": [{"stem": "What does a low or inappropriately normal PTH in that setting tell you?", "options": [{"letter": "A", "text": "The gland is responding appropriately"}, {"letter": "B", "text": "The gland itself is failing"}], "answer": "B", "explanation": "An unraised PTH means the **gland (or magnesium) is the problem**."}]}, {"teach": "The phosphate moves in the opposite direction to the PTH, which is why it is such a useful second value.", "stem": "Why does the phosphate rise in hypoparathyroidism?", "options": [{"letter": "A", "text": "Without PTH the kidney wastes phosphate"}, {"letter": "B", "text": "Phosphate is released from resorbing bone"}, {"letter": "C", "text": "Calcitriol rises and drives phosphate absorption"}, {"letter": "D", "text": "Without PTH the proximal tubule reabsorbs more phosphate"}], "answer": "D", "explanation": "No PTH means **no phosphaturia**, so phosphate accumulates."}], "checkpoints": [{"stem": "How should this laboratory pattern be confirmed before it is called permanent?", "options": [{"letter": "A", "text": "Three measurements over 6 months"}, {"letter": "B", "text": "One measurement after IV calcium"}, {"letter": "C", "text": "Two measurements at least 2 weeks apart"}, {"letter": "D", "text": "A single low calcium is enough"}], "answer": "C", "explanation": "Confirm on **two measurements ≥ 2 weeks apart**."}, {"stem": "Which condition produces the same low PTH and must be excluded first?", "options": [{"letter": "A", "text": "Severe hypomagnesemia"}, {"letter": "B", "text": "Vitamin D deficiency"}, {"letter": "C", "text": "Chronic kidney disease"}, {"letter": "D", "text": "PTH resistance"}], "answer": "A", "explanation": "**Severe hypomagnesemia** causes a functional hypoparathyroidism — replete magnesium first."}]}}, {"id": "21", "group": 21, "section": "Hypocalcemia: diagnostic approach", "topic": "Hypocalcemia differential", "skill": "Identification", "stem": "What diagnosis is indicated by a low calcium with an elevated phosphate, an elevated PTH, and a normal creatinine?", "options": [{"letter": "A", "text": "Pseudohypoparathyroidism"}, {"letter": "B", "text": "Vitamin D deficiency"}, {"letter": "C", "text": "Primary hyperparathyroidism"}, {"letter": "D", "text": "Hypoparathyroidism"}], "answer": "A", "explanation": "A **high phosphate despite a high PTH** with normal kidneys means the target organs cannot hear the hormone — **pseudohypoparathyroidism (PTH resistance)**.", "objective": "", "remediation": {"steps": [{"teach": "A high PTH with a low calcium is usually the gland responding correctly — so the question becomes whether the hormone is working.", "stem": "What does an elevated PTH with a low calcium normally mean?", "options": [{"letter": "A", "text": "The gland is failing"}, {"letter": "B", "text": "The gland is responding to the low calcium"}], "answer": "B", "explanation": "This is normally an **appropriate secondary response**.", "clarify": [{"stem": "If that PTH were working on the kidney, what should happen to the phosphate?", "options": [{"letter": "A", "text": "It should fall"}, {"letter": "B", "text": "It should rise"}], "answer": "A", "explanation": "Working PTH **wastes phosphate**, so the phosphate should be low."}]}, {"teach": "The phosphate is therefore the giveaway: it is behaving as though no PTH were present at all.", "stem": "What does a high phosphate despite a high PTH imply about the target organs?", "options": [{"letter": "A", "text": "The kidneys have failed"}, {"letter": "B", "text": "The assay is picking up PTH-related peptide"}, {"letter": "C", "text": "They are over-responsive to PTH"}, {"letter": "D", "text": "They are resistant to PTH"}], "answer": "D", "explanation": "The tissues are **resistant to PTH**."}], "checkpoints": [{"stem": "Why does a normal creatinine matter in this laboratory pattern?", "options": [{"letter": "A", "text": "It confirms vitamin D deficiency"}, {"letter": "B", "text": "It rules out hypomagnesemia"}, {"letter": "C", "text": "It excludes CKD as the reason for the high phosphate"}, {"letter": "D", "text": "It proves the PTH assay is accurate"}], "answer": "C", "explanation": "CKD is the other cause of a high phosphate with a high PTH, so a **normal creatinine excludes it**."}, {"stem": "Which of these conditions is a laboratory artifact rather than a true disease?", "options": [{"letter": "A", "text": "Pseudohypoparathyroidism"}, {"letter": "B", "text": "Hypoparathyroidism"}, {"letter": "C", "text": "Pseudohypocalcemia from a low albumin"}, {"letter": "D", "text": "Secondary hyperparathyroidism"}], "answer": "C", "explanation": "**Pseudohypocalcemia** is an artifact; pseudohypoparathyroidism is a real resistance syndrome."}]}}, {"id": "22", "group": 22, "section": "Hypocalcemia: diagnostic approach", "topic": "Hypocalcemia differential", "skill": "Disease process", "stem": "How does severe hypomagnesemia affect PTH?", "options": [{"letter": "A", "text": "It produces a low or inappropriately normal PTH"}, {"letter": "B", "text": "It has no effect on PTH"}, {"letter": "C", "text": "It markedly elevates PTH"}, {"letter": "D", "text": "It raises PTH-related peptide"}], "answer": "A", "explanation": "Severe hypomagnesemia **blunts PTH secretion**, giving a functional hypoparathyroidism — the calcium will not correct until the magnesium is repleted.", "objective": "", "remediation": {"steps": [{"teach": "Certain histories should make you order a magnesium before anything else.", "stem": "Which electrolyte must be checked in a hypocalcemic patient with alcohol use, malnutrition or GI losses?", "options": [{"letter": "A", "text": "Chloride"}, {"letter": "B", "text": "Magnesium"}], "answer": "B", "explanation": "Check the **magnesium** in these patients.", "clarify": [{"stem": "Which should be repleted first in that patient?", "options": [{"letter": "A", "text": "Oral calcium"}, {"letter": "B", "text": "Magnesium"}], "answer": "B", "explanation": "**Replete magnesium first**, or the calcium will not come up."}]}, {"teach": "The gland is structurally intact but cannot release hormone, which is why the picture copies gland failure.", "stem": "Why is severe hypomagnesemia described as a functional hypoparathyroidism?", "options": [{"letter": "A", "text": "It destroys the parathyroid glands"}, {"letter": "B", "text": "It blocks the serum calcium assay"}, {"letter": "C", "text": "It causes PTH resistance in bone"}, {"letter": "D", "text": "It blunts PTH secretion despite a low calcium"}], "answer": "D", "explanation": "The gland cannot secrete, so the pattern **mimics hypoparathyroidism**."}], "checkpoints": [{"stem": "What happens to the calcium if the magnesium is not corrected first?", "options": [{"letter": "A", "text": "It has no relationship to the magnesium"}, {"letter": "B", "text": "It overshoots into hypercalcemia"}, {"letter": "C", "text": "It stays low despite calcium repletion"}, {"letter": "D", "text": "It corrects promptly anyway"}], "answer": "C", "explanation": "Hypocalcemia is **refractory** until the magnesium is replaced."}, {"stem": "How does mild hypomagnesemia differ from severe hypomagnesemia in its effect on PTH?", "options": [{"letter": "A", "text": "Mild depletion suppresses PTH, while severe raises it"}, {"letter": "B", "text": "Neither has any effect on PTH"}, {"letter": "C", "text": "Both suppress PTH equally"}, {"letter": "D", "text": "Mild depletion raises PTH, while severe depletion blunts it"}], "answer": "D", "explanation": "**Mild → PTH rises; severe → PTH is blunted** into the low or normal range."}]}}, {"id": "23", "group": 23, "section": "Clinical features of hypocalcemia", "topic": "Hypocalcemia differential", "skill": "Complications", "stem": "Which clinical findings would you expect in a patient with symptomatic hypocalcemia?", "options": [{"letter": "A", "text": "A shortened QT with bradycardia"}, {"letter": "B", "text": "Nephrolithiasis with polyuria"}, {"letter": "C", "text": "A prolonged QT interval"}, {"letter": "D", "text": "Constipation with anorexia and nausea"}, {"letter": "E", "text": "Perioral and distal paresthesias"}, {"letter": "F", "text": "Carpopedal spasm with a blood-pressure cuff"}], "answer": ["C", "E", "F"], "explanation": "Hypocalcemia is a syndrome of **neuromuscular irritability** — paresthesias, tetany and a positive **Trousseau sign**, with a **prolonged QT** that risks torsades. Stones, polyuria, a short QT and constipation belong to hypercalcemia.", "objective": "", "remediation": {"steps": [{"teach": "Two bedside signs are taught together, but only one is worth acting on.", "stem": "Which bedside sign is both sensitive and specific for hypocalcemia?", "options": [{"letter": "A", "text": "Trousseau sign"}, {"letter": "B", "text": "Chvostek sign"}, {"letter": "C", "text": "Kernig sign"}, {"letter": "D", "text": "Babinski sign"}], "answer": "A", "explanation": "**Trousseau sign** — carpopedal spasm with the cuff above systolic — is 94% sensitive and 99% specific.", "clarify": [{"stem": "Why   function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function pushStep(q, t, retry) {
