const EXAM_DATA = {"title": "Endocrine Emergencies — Lecture Quiz (Adaptive)", "questions": [{"id": "1", "group": 1, "slide": 9, "section": "Pituitary Emergencies", "topic": "SIADH", "skill": "Identification", "stem": "A patient with small cell lung cancer on carbamazepine has sodium 118, no edema, and concentrated urine. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Adrenal insufficiency"}, {"letter": "B", "text": "Diabetes insipidus"}, {"letter": "C", "text": "Heart failure hyponatremia"}, {"letter": "D", "text": "SIADH"}], "answer": "D", "explanation": "**SIADH** is the most common cause of euvolemic hypotonic hyponatremia — \"soaked inside, dry outside\"; small cell lung cancer and carbamazepine are classic causes of ectopic or excess ADH.", "objective": "", "hint": "Low sodium with a **euvolemic**, edema-free exam and inappropriately concentrated urine points to excess ADH rather than fluid overload or a salt-wasting gland; the cancer and the drug are both classic triggers."}, {"id": "2", "group": 2, "slide": 9, "section": "Pituitary Emergencies", "topic": "SIADH", "skill": "Diagnostics & imaging", "stem": "Which laboratory and exam findings support a diagnosis of SIADH in a hyponatremic patient?", "options": [{"letter": "A", "text": "Dilute urine with low specific gravity"}, {"letter": "B", "text": "Urine specific gravity above 1.015"}, {"letter": "C", "text": "Euvolemic exam without edema"}, {"letter": "D", "text": "Serum osmolality above 295"}, {"letter": "E", "text": "Peripheral edema"}, {"letter": "F", "text": "Serum osmolality below 275"}], "answer": "BCF", "explanation": "SIADH = hyponatremia + **serum osm <275** + inappropriately concentrated urine (SG >1.015, high urine osm and Na) in a euvolemic patient; exclude hypothyroidism, adrenal insufficiency, and diuretics.", "objective": "", "hint": "The body is holding on to **free water**, so the serum is dilute while the kidney keeps making concentrated urine; retained water spreads evenly through compartments, so there is no intravascular overload on exam."}, {"id": "3", "group": 3, "slide": 11, "section": "Pituitary Emergencies", "topic": "SIADH", "skill": "Management", "stem": "A patient with SIADH and a sodium of 112 begins seizing in the emergency department. What is the appropriate immediate treatment?", "options": [{"letter": "A", "text": "Hypertonic 3% saline bolus"}, {"letter": "B", "text": "Strict fluid restriction"}, {"letter": "C", "text": "Isotonic normal saline bolus"}, {"letter": "D", "text": "Oral tolvaptan"}], "answer": "A", "explanation": "Severe symptomatic hyponatremia gets **3% hypertonic saline** 100 mL over 10 minutes, repeatable up to three times; otherwise fluid restrict <1 L/day and raise Na no more than 8–10 mEq/L per 24 h to avoid osmotic demyelination.", "objective": "", "hint": "Fluid restriction is the default for stable patients, but a **seizing** patient needs the sodium raised within minutes; isotonic fluid can actually worsen the sodium in this disease, and vaptans are not emergency drugs."}, {"id": "4", "group": 4, "slide": 12, "section": "Pituitary Emergencies", "topic": "Diabetes insipidus", "skill": "Diagnostics & imaging", "stem": "Which laboratory pattern confirms diabetes insipidus in a patient with polyuria and polydipsia?", "options": [{"letter": "A", "text": "Dilute urine with hyperglycemia"}, {"letter": "B", "text": "Dilute urine with concentrated serum"}, {"letter": "C", "text": "Concentrated urine with hypernatremia"}, {"letter": "D", "text": "Concentrated urine with dilute serum"}], "answer": "B", "explanation": "DI = **urine osm <250** with serum osm >295 and urine output >3 L/day; it mimics diabetes mellitus but glucose is normal. Hypernatremia develops when intake cannot keep up with losses.", "objective": "", "hint": "ADH is absent or ignored, so the kidney cannot **reclaim water**; think about where the water ends up and where the solute is left behind, and remember glucose must be normal for this diagnosis."}, {"id": "5", "group": 5, "slide": 13, "section": "Pituitary Emergencies", "topic": "Diabetes insipidus", "skill": "Diagnostics & imaging", "stem": "During a water deprivation test, urine osmolality rises sharply after desmopressin is given. What does this indicate?", "options": [{"letter": "A", "text": "SIADH"}, {"letter": "B", "text": "Central diabetes insipidus"}, {"letter": "C", "text": "Primary polydipsia"}, {"letter": "D", "text": "Nephrogenic diabetes insipidus"}], "answer": "B", "explanation": "A rise after desmopressin means the kidneys still respond — **central DI** (pituitary not releasing ADH), treated with desmopressin; no rise = nephrogenic DI (lithium is the classic cause), which desmopressin will not fix.", "objective": "", "hint": "Desmopressin is synthetic ADH; a kidney that responds to it was never the problem, so the defect must sit **upstream** at the gland that failed to release the hormone. Lithium-type disease shows no response."}, {"id": "6", "group": 6, "slide": 20, "section": "Thyroid Emergencies", "topic": "Hyperthyroidism", "skill": "Identification", "stem": "A patient has palpitations, weight loss despite increased appetite, exophthalmos, and waxy lesions on the shins. What is the most likely cause?", "options": [{"letter": "A", "text": "Amiodarone toxicity"}, {"letter": "B", "text": "Graves disease"}, {"letter": "C", "text": "Subacute thyroiditis"}, {"letter": "D", "text": "Toxic thyroid nodule"}], "answer": "B", "explanation": "**Graves disease** (antibodies to the TSH receptor) is the most common cause of hyperthyroidism; exophthalmos and pretibial myxedema are Graves-specific. Labs: TSH low, T3/T4 high.", "objective": "", "hint": "Eye and skin findings are **autoimmune** signatures — antibodies stimulating the TSH receptor also act on orbital and pretibial tissue; a nodule or a drug effect raises hormone without those extrathyroidal signs."}, {"id": "7", "group": 7, "slide": 21, "section": "Thyroid Emergencies", "topic": "Hyperthyroidism", "skill": "Pharmacology", "stem": "In which patients is propranolol for hyperthyroid symptom control contraindicated?", "options": [{"letter": "A", "text": "Diabetics prone to hypoglycemia"}, {"letter": "B", "text": "Second- or third-degree heart block"}, {"letter": "C", "text": "Fine resting tremor"}, {"letter": "D", "text": "Essential hypertension"}, {"letter": "E", "text": "Asthma or COPD"}, {"letter": "F", "text": "Atrial fibrillation with rapid rate"}], "answer": "ABE", "explanation": "Propranolol is contraindicated in **asthma/COPD**, bradycardia or high-grade heart block, severe PAD/Raynaud, and hypoglycemia-prone diabetics (it masks the warning symptoms).", "objective": "", "hint": "Nonselective beta-blockade constricts **airways**, slows conduction further, and hides the adrenergic warning signs of a low glucose; the remaining options are things beta-blockade treats rather than worsens."}, {"id": "8", "group": 8, "slide": 21, "section": "Thyroid Emergencies", "topic": "Hyperthyroidism", "skill": "Pharmacology", "stem": "Why is methimazole preferred over propylthiouracil for routine hyperthyroidism outside of thyroid storm and early pregnancy?", "options": [{"letter": "A", "text": "PTU carries a boxed hepatotoxicity warning"}, {"letter": "B", "text": "PTU is ineffective in Graves disease"}, {"letter": "C", "text": "PTU causes irreversible hypothyroidism"}, {"letter": "D", "text": "PTU does not block hormone synthesis"}], "answer": "A", "explanation": "**PTU** has a black-box warning for hepatotoxicity; it is favored only in thyroid storm (it also blocks T4-to-T3 conversion) and in the first trimester of pregnancy.", "objective": "", "hint": "Both thionamides block new hormone synthesis; the difference is **organ toxicity**, which is why PTU is reserved for storm, first-trimester pregnancy, or methimazole intolerance."}, {"id": "9", "group": 9, "slide": 22, "section": "Thyroid Emergencies", "topic": "Thyroid storm", "skill": "Identification", "stem": "A thyrotoxic patient has a temperature of 105°F, heart rate 150, and agitation after missing methimazole. What is the diagnosis?", "options": [{"letter": "A", "text": "Uncomplicated thyrotoxicosis"}, {"letter": "B", "text": "Serotonin syndrome"}, {"letter": "C", "text": "Sepsis with tachycardia"}, {"letter": "D", "text": "Thyroid storm"}], "answer": "D", "explanation": "**Thyroid storm** is a clinical diagnosis (Burch-Wartofsky ≥45 highly suggestive, no lab cutoff) — hyperthermia 104–106°F, tachycardia out of proportion to fever, altered mentation, plus a precipitant such as medication withdrawal.", "objective": "", "hint": "Hyperthermia, a heart rate **out of proportion** to the fever, and altered mentation in a patient with a precipitant make up the classic triad of decompensated thyrotoxicosis; score it with the Burch-Wartofsky scale, since no lab cutoff defines it."}, {"id": "10", "group": 10, "slide": 24, "section": "Thyroid Emergencies", "topic": "Thyroid storm", "skill": "Management", "stem": "Which medication is given first in thyroid storm to control the adrenergic hyperactivity driving the tachycardia?", "options": [{"letter": "A", "text": "Propylthiouracil"}, {"letter": "B", "text": "Hydrocortisone"}, {"letter": "C", "text": "Potassium iodide"}, {"letter": "D", "text": "Propranolol"}], "answer": "D", "explanation": "**Propranolol** (or esmolol) is step one; then a thionamide, iodine at least 1 hour later, and hydrocortisone. Also treat the precipitant, cool, give fluids and benzodiazepines.", "objective": "", "hint": "The sequence is block the **receptor**, block synthesis, block release, block conversion; the drug that addresses the heart rate and tremor directly comes before anything acting on the gland."}, {"id": "11", "group": 11, "slide": 24, "section": "Thyroid Emergencies", "topic": "Thyroid storm", "skill": "Management", "stem": "Why must potassium iodide be given at least one hour after the thionamide in thyroid storm?", "options": [{"letter": "A", "text": "Iodine inactivates the thionamide"}, {"letter": "B", "text": "Iodine requires beta-blockade first"}, {"letter": "C", "text": "Iodine would fuel new hormone synthesis"}, {"letter": "D", "text": "Iodine causes severe hypotension"}], "answer": "C", "explanation": "Iodine before the thionamide gives the gland **substrate** for new synthesis — the classic exam trap; thionamide first, Lugol's solution at least 1 hour later. Use lithium instead in iodine- or amiodarone-induced storm.", "objective": "", "hint": "Iodine blocks **release** of preformed hormone, but it is also the raw material the gland uses; the thionamide must already be in place before the raw material arrives."}, {"id": "12", "group": 12, "slide": 24, "section": "Thyroid Emergencies", "topic": "Thyroid storm", "skill": "Pharmacology", "stem": "Which antipyretic should be used for hyperthermia in thyroid storm, and why?", "options": [{"letter": "A", "text": "Aspirin, because it also prevents thrombosis"}, {"letter": "B", "text": "Acetaminophen, because NSAIDs displace thyroid hormone from binding protein"}, {"letter": "C", "text": "Ibuprofen, because it lowers fever fastest"}, {"letter": "D", "text": "No antipyretic, because cooling blankets suffice"}], "answer": "B", "explanation": "Use **acetaminophen** plus cooling blankets and ice packs; aspirin and NSAIDs free thyroid hormone from thyroxine-binding globulin and worsen the storm.", "objective": "", "hint": "Salicylates and NSAIDs knock thyroid hormone off **TBG**, raising the free fraction and worsening the storm; the safe choice works centrally without touching protein binding."}, {"id": "13", "group": 13, "slide": 27, "section": "Thyroid Emergencies", "topic": "Myxedema coma", "skill": "Identification", "stem": "An elderly woman nonadherent to levothyroxine arrives in winter with HR 40, BP 70/35, temperature 94°F, confusion, and an Osborn wave. What is the diagnosis?", "options": [{"letter": "A", "text": "Myxedema coma"}, {"letter": "B", "text": "Uncomplicated hypothyroidism"}, {"letter": "C", "text": "Adrenal crisis"}, {"letter": "D", "text": "Septic shock"}], "answer": "A", "explanation": "**Myxedema coma** = hypothyroidism + altered mental status + hypothermia <95.9°F + a precipitating stressor; the Osborn J wave signals hypothermia. Mortality 30–60%; admit to ICU.", "objective": "", "hint": "Known hypothyroidism plus a stressor, **cold and slow** vitals, and altered mentation define the decompensated form; the J wave on the ECG confirms the hypothermia that drives its mortality."}, {"id": "14", "group": 14, "slide": 29, "section": "Thyroid Emergencies", "topic": "Myxedema coma", "skill": "Diagnostics & imaging", "stem": "Which laboratory abnormalities are expected in a patient with myxedema coma?", "options": [{"letter": "A", "text": "Hypercapnia on blood gas"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Hyperglycemia"}, {"letter": "D", "text": "Anion-gap metabolic acidosis"}, {"letter": "E", "text": "Hypoglycemia"}, {"letter": "F", "text": "Hyponatremia"}], "answer": "AEF", "explanation": "Myxedema coma shows **TSH high, T3/T4 low**, low sodium, low glucose, and a high PaCO₂ (respiratory acidosis from hypoventilation); also check cortisol for concomitant adrenal insufficiency.", "objective": "", "hint": "Everything is **hypo-** in this disease — ventilation, thermia, natremia, glycemia; think of which direction each value moves when metabolism and breathing slow down, and which abnormalities belong to a different crisis."}, {"id": "15", "group": 15, "slide": 29, "section": "Thyroid Emergencies", "topic": "Myxedema coma", "skill": "Management", "stem": "Why is hydrocortisone given with or before intravenous levothyroxine in myxedema coma?", "options": [{"letter": "A", "text": "Steroids prevent levothyroxine allergy"}, {"letter": "B", "text": "Steroids speed conversion of T4 to T3"}, {"letter": "C", "text": "Steroids reverse the hypothermia directly"}, {"letter": "D", "text": "Thyroid hormone alone can precipitate adrenal crisis"}], "answer": "D", "explanation": "**Hydrocortisone** 100 mg IV q8h covers concomitant adrenal insufficiency — thyroxine alone can precipitate adrenal crisis. Also: ventilate, passive rewarming only, cautious fluids, dextrose, empiric antibiotics.", "objective": "", "hint": "Restoring metabolism raises the body's demand for **cortisol**; if a second gland is also failing, replacing thyroid hormone first unmasks that deficiency. Steroids continue until it is ruled out."}, {"id": "16", "group": 16, "slide": 32, "section": "Parathyroid Emergencies", "topic": "Hyperparathyroidism", "skill": "Diagnostics & imaging", "stem": "A patient with kidney stones and confusion has elevated PTH, calcium 15, and low phosphate. Which process best explains these labs?", "options": [{"letter": "A", "text": "Secondary hyperparathyroidism from CKD"}, {"letter": "B", "text": "Primary hyperparathyroidism from adenoma"}, {"letter": "C", "text": "Ectopic ACTH from lung cancer"}, {"letter": "D", "text": "Hypoparathyroidism after thyroidectomy"}], "answer": "B", "explanation": "**Primary hyperparathyroidism** (adenoma or hyperplasia): PTH high, calcium high, phosphate low. Secondary (CKD): calcium low, phosphate high. ECG shows a short QTc.", "objective": "", "hint": "Primary versus secondary disease is a **phosphate** question — autonomous PTH drives calcium up and dumps phosphate, while kidney failure forces PTH up in response to calcium that is already low."}, {"id": "17", "group": 17, "slide": 32, "section": "Parathyroid Emergencies", "topic": "Hyperparathyroidism", "skill": "Management", "stem": "Which interventions are appropriate for a calcium of 15 mg/dL with a shortened QTc?", "options": [{"letter": "A", "text": "Thiazide diuretic"}, {"letter": "B", "text": "Calcitonin"}, {"letter": "C", "text": "IV calcium gluconate"}, {"letter": "D", "text": "Bisphosphonate"}, {"letter": "E", "text": "IV normal saline"}, {"letter": "F", "text": "Fluid restriction"}], "answer": "BDE", "explanation": "Calcium >14: **IV fluids** (normal saline), calcitonin (fast, short-lived), bisphosphonate (slower, durable); dialysis if anuric or Ca >18. Admit to telemetry with ECG changes; Ca <12 can go home.", "objective": "", "hint": "Severe hypercalcemia is treated by restoring volume to promote **calciuresis**, then a fast short-acting hormone and a slow durable bone agent; anything that retains or adds calcium is wrong, and dialysis is reserved for anuria or very high levels."}, {"id": "18", "group": 18, "slide": 33, "section": "Parathyroid Emergencies", "topic": "Hypoparathyroidism", "skill": "Identification", "stem": "One day after thyroidectomy a patient has perioral tingling, carpal spasm with a blood pressure cuff, and QTc 510. What is the cause?", "options": [{"letter": "A", "text": "Hypokalemia from vomiting"}, {"letter": "B", "text": "Hypocalcemia from hypoparathyroidism"}, {"letter": "C", "text": "Hypercalcemia from gland manipulation"}, {"letter": "D", "text": "Hypoglycemia from fasting"}], "answer": "B", "explanation": "Post-thyroidectomy **hypoparathyroidism** → PTH low, calcium low, QT prolongation (torsades risk). Trousseau sign is the sensitive one (94%); Chvostek is specific but misses most (26%). Correct calcium for albumin.", "objective": "", "hint": "Removing or devascularizing the glands behind the thyroid drops the hormone that keeps **calcium** up; the cuff-induced spasm is Trousseau sign, and a prolonged QT points the same direction."}, {"id": "19", "group": 19, "slide": 34, "section": "Parathyroid Emergencies", "topic": "Hypoparathyroidism", "skill": "Management", "stem": "A symptomatic hypocalcemic patient with tetany fails to improve after IV calcium gluconate. Which electrolyte must be checked and replaced?", "options": [{"letter": "A", "text": "Magnesium"}, {"letter": "B", "text": "Phosphate"}, {"letter": "C", "text": "Potassium"}, {"letter": "D", "text": "Sodium"}], "answer": "A", "explanation": "Replete **magnesium** — hypocalcemia will not correct otherwise. IV calcium gluconate for symptomatic or QT-prolonged patients; oral calcium plus calcitriol for mild disease.", "objective": "", "hint": "Hypocalcemia will not correct while a second **divalent cation** is depleted, because PTH release and action both depend on it; this is the standard add-on check in the hypocalcemia workup."}, {"id": "20", "group": 20, "slide": 42, "section": "Adrenal Emergencies", "topic": "Adrenal insufficiency", "skill": "Disease process", "stem": "A patient with adrenal insufficiency has hyperpigmentation and hyperkalemia. Why do these findings point to primary rather than secondary disease?", "options": [{"letter": "A", "text": "Cortisol is normal and ACTH is high"}, {"letter": "B", "text": "ACTH is high and aldosterone is lost"}, {"letter": "C", "text": "ACTH is low and aldosterone is normal"}, {"letter": "D", "text": "Cortisol is high and aldosterone is lost"}], "answer": "B", "explanation": "Primary AI (Addison): **ACTH high** (hyperpigmentation via MSH), aldosterone low (Na low, K high). Secondary: ACTH low, cortisol low only, K normal, no hyperpigmentation; MCC is chronic steroids stopped abruptly.", "objective": "", "hint": "Ask what the **pituitary** is doing and whether the salt hormone is still made; a destroyed gland leaves the pituitary and MSH unopposed and removes RAAS-driven potassium excretion, while a pituitary problem spares the zona glomerulosa."}, {"id": "21", "group": 21, "slide": 42, "section": "Adrenal Emergencies", "topic": "Adrenal insufficiency", "skill": "Diagnostics & imaging", "stem": "What result on a cosyntropin stimulation test confirms adrenal insufficiency?", "options": [{"letter": "A", "text": "Aldosterone rises sharply"}, {"letter": "B", "text": "Cortisol fails to double from baseline"}, {"letter": "C", "text": "ACTH fails to rise"}, {"letter": "D", "text": "Cortisol doubles from baseline"}], "answer": "B", "explanation": "After cosyntropin, cortisol should **double**; failure to rise = adrenal insufficiency. Draw the baseline cortisol around 8 am, its diurnal peak.", "objective": "", "hint": "Cosyntropin is synthetic **ACTH**; a healthy gland answers the signal with a brisk rise, so the diagnosis rests on the gland not responding."}, {"id": "22", "group": 22, "slide": 44, "section": "Adrenal Emergencies", "topic": "Adrenal crisis", "skill": "Identification", "stem": "A steroid-dependent patient who stopped prednisone has vomiting, abdominal pain, and hypotension unresponsive to 3 L of saline and pressors. What is the diagnosis?", "options": [{"letter": "A", "text": "Septic shock"}, {"letter": "B", "text": "Diabetic ketoacidosis"}, {"letter": "C", "text": "Adrenal crisis"}, {"letter": "D", "text": "Gastroenteritis with dehydration"}], "answer": "C", "explanation": "**Addisonian crisis**: distributive shock refractory to fluids and pressors + fever, N/V, abdominal pain, AMS; stopping glucocorticoids is the most common trigger. Expect Na low, K high, glucose low.", "objective": "", "hint": "Shock that ignores fluids and vasopressors is the signature — catecholamines cannot act on the heart and arterioles without **cortisol**; the GI prodrome and the medication history name the missing hormone."}, {"id": "23", "group": 23, "slide": 46, "section": "Adrenal Emergencies", "topic": "Adrenal crisis", "skill": "Diagnostics & imaging", "stem": "Which laboratory findings are expected in acute adrenal crisis?", "options": [{"letter": "A", "text": "Hyperkalemia"}, {"letter": "B", "text": "Hypoglycemia"}, {"letter": "C", "text": "Hypernatremia"}, {"letter": "D", "text": "Hyponatremia"}, {"letter": "E", "text": "Hypokalemia"}, {"letter": "F", "text": "Non-anion-gap metabolic acidosis"}], "answer": "ABDF", "explanation": "Adrenal crisis labs: **Na low, K high, glucose low**, non-anion-gap metabolic acidosis, hypercalcemia, eosinophilia; cortisol low with ACTH high in primary disease.", "objective": "", "hint": "Lose aldosterone and sodium leaves while potassium stays; lose cortisol and **gluconeogenesis** stops; the acidosis has no gap, which separates it from DKA in a hypotensive, low-glucose patient."}, {"id": "24", "group": 24, "slide": 47, "section": "Adrenal Emergencies", "topic": "Adrenal crisis", "skill": "Management", "stem": "In suspected adrenal crisis, when should high-dose hydrocortisone be given relative to confirmatory cortisol testing?", "options": [{"letter": "A", "text": "After the cosyntropin test is complete"}, {"letter": "B", "text": "Only after CT confirms adrenal disease"}, {"letter": "C", "text": "Immediately, without waiting for results"}, {"letter": "D", "text": "After the cortisol level returns low"}], "answer": "C", "explanation": "**Hydrocortisone** 100 mg IV bolus then 200 mg over 24 h — steroids first, labs second; hydrocortisone rather than dexamethasone because it has mineralocorticoid activity. Add D5NS, fix K and glucose, treat the trigger, ICU.", "objective": "", "hint": "This is a **clinical** diagnosis in which delay kills; draw the cortisol if it will not slow treatment, but the drug of choice has both glucocorticoid and mineralocorticoid activity and goes in with D5NS."}, {"id": "25", "group": 25, "slide": 47, "section": "Adrenal Emergencies", "topic": "Adrenal insufficiency", "skill": "Counseling & prevention", "stem": "What discharge instruction is most important for a patient with adrenal insufficiency or long-term glucocorticoid use?", "options": [{"letter": "A", "text": "Hold steroids during any fever or vomiting"}, {"letter": "B", "text": "Never stop steroids abruptly and stress-dose when ill"}, {"letter": "C", "text": "Take steroids only on symptomatic days"}, {"letter": "D", "text": "Stop steroids once blood pressure normalizes"}], "answer": "B", "explanation": "**Never stop glucocorticoids abruptly** (including Cushing patients being weaned); double or triple the dose for fever, vomiting, surgery, or trauma; medical alert ID and an IM hydrocortisone kit. Return for vomiting, syncope, abdominal pain, salt craving.", "objective": "", "hint": "Nearly every crisis in this lecture is precipitated by a **missed medication**; illness raises cortisol demand rather than lowering it, and the patient who cannot keep pills down must come in for the IV form."}, {"id": "26", "group": 26, "slide": 49, "section": "Adrenal Emergencies", "topic": "Cushing syndrome", "skill": "Management", "stem": "A patient on chronic prednisone for rheumatoid arthritis has moon face, striae, hypertension, and glucose 350. What is the appropriate ED approach?", "options": [{"letter": "A", "text": "Stop the prednisone and admit for monitoring"}, {"letter": "B", "text": "Treat the hyperglycemia and discharge; continue steroids"}, {"letter": "C", "text": "Order dexamethasone suppression testing in the ED"}, {"letter": "D", "text": "Start hydrocortisone for adrenal suppression"}], "answer": "B", "explanation": "**Cushing syndrome** (MCC chronic exogenous steroids) → treat the complication (hyperglycemia, HTN, infection, DVT) and discharge with endocrine follow-up; never stop steroids abruptly. Cushing disease = pituitary ACTH tumor; ectopic ACTH = small cell lung cancer.", "objective": "", "hint": "Hypercortisolism from **exogenous** steroids is rarely an emergency — manage the complication in front of you, and remember that abruptly removing the steroid turns this patient into the adrenal crisis patient."}, {"id": "27", "group": 27, "slide": 52, "section": "Diabetic Emergencies", "topic": "Hypoglycemia", "skill": "Disease process", "stem": "A diabetic on metoprolol is confused and sweaty with no tremor or palpitations. Why might hypoglycemia present this way?", "options": [{"letter": "A", "text": "Metoprolol causes neuroglycopenia directly"}, {"letter": "B", "text": "Beta-blockers raise the glucose threshold for symptoms"}, {"letter": "C", "text": "Beta-blockers mask adrenergic warning symptoms"}, {"letter": "D", "text": "Metoprolol blocks sweat gland function"}], "answer": "C", "explanation": "**Beta-blockers** mask the adrenergic symptoms of hypoglycemia; sweating may be the only clue. Levels: L1 glucose 54–70, L2 <54, L3 = altered mental or physical status at any glucose.", "objective": "", "hint": "Tremor, palpitations, and anxiety are **sympathetic** responses to a falling glucose; a drug that blunts those leaves diaphoresis as the only clue, so check a glucose on every altered patient."}, {"id": "28", "group": 28, "slide": 54, "section": "Diabetic Emergencies", "topic": "Hypoglycemia", "skill": "Management", "stem": "An unconscious hypoglycemic patient has no IV access. What is the appropriate treatment, and when does it fail?", "options": [{"letter": "A", "text": "Glucagon IM; fails in glycogen-depleted alcoholics"}, {"letter": "B", "text": "Oral glucose gel; fails if the patient vomits"}, {"letter": "C", "text": "Octreotide SC; fails without insulin on board"}, {"letter": "D", "text": "D50 IV push; fails in renal failure"}], "answer": "A", "explanation": "**Glucagon IM** when there is no IV; it fails in the glycogen-depleted (alcoholic, starved) patient — get access and give D50 50 mL IV. Give thiamine with dextrose in alcoholics.", "objective": "", "hint": "Without a line, the only route left is one that **mobilizes stored glucose** from the liver — which means a starved or alcoholic patient has nothing to release and needs IV dextrose instead."}, {"id": "29", "group": 29, "slide": 54, "section": "Diabetic Emergencies", "topic": "Hypoglycemia", "skill": "Pharmacology", "stem": "A patient on glipizide has recurrent hypoglycemia despite D50. Which adjunct treats it, and what is the disposition?", "options": [{"letter": "A", "text": "Glucagon; discharge after feeding"}, {"letter": "B", "text": "Hydrocortisone; admit to ICU"}, {"letter": "C", "text": "Octreotide; admit for observation"}, {"letter": "D", "text": "Dextrose infusion; discharge with glucose tabs"}], "answer": "C", "explanation": "**Octreotide** (somatostatin analogue) suppresses insulin release in sulfonylurea-induced hypoglycemia; admit and observe at least 24 h. Only reversible, stable hypoglycemia (missed meal on short-acting insulin) goes home.", "objective": "", "hint": "Sulfonylureas keep squeezing **insulin** out of the pancreas for many hours, so correction alone does not last; the adjunct is a somatostatin analogue that shuts that release off, and these patients are never sent home early."}, {"id": "30", "group": 30, "slide": 55, "section": "Diabetic Emergencies", "topic": "Hyperglycemia", "skill": "Disease process", "stem": "Which precipitants belong to the Five I's that explain a hyperglycemic ED presentation?", "options": [{"letter": "A", "text": "Infarction"}, {"letter": "B", "text": "Isotonic fluid overload"}, {"letter": "C", "text": "Iatrogenic steroid use"}, {"letter": "D", "text": "Infection"}, {"letter": "E", "text": "Insomnia"}, {"letter": "F", "text": "Insulin nonadherence"}], "answer": "ACDF", "explanation": "Five I's: **Infection, Infarction, Insulin lack, Initial (new-onset), Iatrogenic** (steroids, thiazides, sympathomimetics) — plus Infant (pregnancy) and Intoxication. Simple hyperglycemia without acidosis or hyperosmolarity needs no insulin drip.", "objective": "", "hint": "Every hyperglycemic vignette hides a **trigger** — a stressor raising counter-regulatory hormones, a missing drug, a new diagnosis, or a drug that raises glucose; sepsis is the one to hunt first."}, {"id": "31", "group": 31, "slide": 59, "section": "Diabetic Emergencies", "topic": "DKA", "skill": "Diagnostics & imaging", "stem": "A T1DM patient has glucose 450, HCO₃ 14, anion gap 20, ketones 4+, and pH 7.39. Why is this still DKA?", "options": [{"letter": "A", "text": "Ketones without acidosis is starvation"}, {"letter": "B", "text": "The gap reflects lactic acidosis only"}, {"letter": "C", "text": "Respiratory compensation has normalized the pH"}, {"letter": "D", "text": "The pH excludes DKA; this is HHS"}], "answer": "C", "explanation": "DKA = glucose ≥200 + pH <7.3 + **HCO₃ <18** + ketones (BHB ≥3), anion gap >12 — but marked respiratory compensation (Kussmaul, PCO₂ 24) can leave a near-normal pH. A VBG is adequate.", "objective": "", "hint": "Kussmaul breathing blows off CO₂ hard enough to pull a **ketoacidosis** pH back toward normal; read the bicarbonate, the gap, and the ketones rather than the pH alone."}, {"id": "32", "group": 32, "slide": 59, "section": "Diabetic Emergencies", "topic": "DKA", "skill": "Disease process", "stem": "A pregnant diabetic on an SGLT2 inhibitor has pH 7.2, large ketones, and glucose 180. What explains the near-normal glucose?", "options": [{"letter": "A", "text": "Starvation ketosis without acidosis"}, {"letter": "B", "text": "Euglycemic DKA from SGLT2 inhibition"}, {"letter": "C", "text": "Alcoholic ketoacidosis"}, {"letter": "D", "text": "Early HHS before glucose rises"}], "answer": "B", "explanation": "**Euglycemic DKA**: SGLT2 inhibitors, pregnancy, recent insulin, starvation, liver failure. Treat as DKA but start dextrose-containing fluids with the insulin from the outset; hold the SGLT2 inhibitor.", "objective": "", "hint": "The drug dumps glucose in the **urine** while insulin deficiency still drives ketone production, so the acidosis arrives without the hyperglycemia; pregnancy and recent insulin do the same."}, {"id": "33", "group": 33, "slide": 60, "section": "Diabetic Emergencies", "topic": "DKA", "skill": "Management", "stem": "A DKA patient's first potassium is 3.1 mEq/L after fluids have started. What must happen before insulin is begun?", "options": [{"letter": "A", "text": "Start insulin and add potassium to the fluids"}, {"letter": "B", "text": "Hold insulin and give IV potassium until above 3.5"}, {"letter": "C", "text": "Give bicarbonate to shift potassium out of cells"}, {"letter": "D", "text": "Start insulin at half dose with cardiac monitoring"}], "answer": "B", "explanation": "K <3.5 → **hold insulin**, replace potassium until >3.5. K 3.5–5.0 → add 20–40 mEq/L KCl and start insulin. K >5 → no potassium, start insulin once urine output is adequate. Fluids 20–30 mL/kg always come first.", "objective": "", "hint": "Insulin pushes potassium **into cells** via Na/K-ATPase, and total-body potassium is already depleted; hypokalemia is the most lethal derangement during treatment, so the drip waits for the number."}, {"id": "34", "group": 34, "slide": 61, "section": "Diabetic Emergencies", "topic": "DKA", "skill": "Management", "stem": "During DKA treatment glucose falls to 220 mg/dL but the anion gap is still 18. What is the correct next step?", "options": [{"letter": "A", "text": "Add dextrose to fluids and continue insulin"}, {"letter": "B", "text": "Stop the insulin infusion"}, {"letter": "C", "text": "Give bicarbonate to close the gap"}, {"letter": "D", "text": "Switch to subcutaneous insulin now"}], "answer": "A", "explanation": "At glucose <250 switch to **D5NS** and continue insulin until the anion gap closes (HCO₃ >18, pH >7.3). Stopping insulin when glucose normalizes is the classic error; bicarbonate only if pH <6.9–7.0 with hemodynamic compromise.", "objective": "", "hint": "Insulin is what shuts off **ketosis**, not just what lowers glucose; the endpoint is a closed gap, so you protect against hypoglycemia while the drip keeps running."}, {"id": "35", "group": 35, "slide": 62, "section": "Diabetic Emergencies", "topic": "DKA", "skill": "Complications", "stem": "Which complications arise from the treatment of DKA rather than from the disease itself?", "options": [{"letter": "A", "text": "Hypernatremia"}, {"letter": "B", "text": "Hypokalemia"}, {"letter": "C", "text": "Cerebral edema"}, {"letter": "D", "text": "Hyperkalemia"}, {"letter": "E", "text": "Hypoglycemia"}, {"letter": "F", "text": "Hypophosphatemia"}], "answer": "BCEF", "explanation": "Therapy complications: **hypokalemia** (most lethal — U waves, torsades, VT/VF), hypoglycemia, cerebral edema (young T1DM, rapid osmolar shifts), hypophosphatemia, fluid overload, hyperchloremic acidosis from NS.", "objective": "", "hint": "Insulin and fluids shift **electrolytes and water** rapidly — potassium and phosphate move into cells, glucose can overshoot downward, and rapid osmolar change swells the brain, especially in young type 1 patients."}, {"id": "36", "group": 36, "slide": 63, "section": "Diabetic Emergencies", "topic": "HHS", "skill": "Identification", "stem": "A nursing-home T2DM patient on glyburide and a new thiazide has 2 days of confusion, glucose 820, HCO₃ 22, and BUN 62. What is the diagnosis?", "options": [{"letter": "A", "text": "Simple hyperglycemia"}, {"letter": "B", "text": "Diabetic ketoacidosis"}, {"letter": "C", "text": "Sulfonylurea toxicity"}, {"letter": "D", "text": "Hyperosmolar hyperglycemic state"}], "answer": "D", "explanation": "**HHS** = glucose ≥600 + effective osm >300 (total >320) + pH ≥7.3 + HCO₃ ≥15 + minimal ketones; T2DM, days to weeks, 8–12 L deficit. Admit to ICU; stop the thiazide, hold the glyburide.", "objective": "", "hint": "Days of osmotic diuresis in an older type 2 patient with poor water access produce profound dehydration and altered mentation with **no acidosis**; the normal bicarbonate and the glucose over 600 settle it."}, {"id": "37", "group": 37, "slide": 64, "section": "Diabetic Emergencies", "topic": "HHS", "skill": "Complications", "stem": "Why must fluid resuscitation and osmolality correction be slower in HHS than in DKA?", "options": [{"letter": "A", "text": "Rapid correction causes hyperkalemic arrest"}, {"letter": "B", "text": "Rapid fluids precipitate ketoacidosis"}, {"letter": "C", "text": "Rapid correction causes cerebral edema or osmotic demyelination"}, {"letter": "D", "text": "HHS patients have a smaller fluid deficit"}], "answer": "C", "explanation": "HHS: replace about 50% of the deficit over 12–24 h; **Na fall ≤10 mEq/L/day**, osmolality fall 3–8 mOsm/kg/h; potassium before insulin at 0.05–0.1 U/kg/h. Over-rapid correction → cerebral edema or osmotic demyelination.", "objective": "", "hint": "The brain has adapted to a very high **osmolality** over days; dropping it faster than a few mOsm per hour, or sodium more than 10 per day, shifts water into neurons. HHS is a fluids disease with a larger deficit."}, {"id": "38", "group": 38, "slide": 67, "section": "Diabetic Emergencies", "topic": "Patient education", "skill": "Counseling & prevention", "stem": "Which sick-day rule should a diabetic hear before discharge to prevent a return visit with DKA?", "options": [{"letter": "A", "text": "Stop fluids to limit vomiting"}, {"letter": "B", "text": "Never stop basal insulin when ill or not eating"}, {"letter": "C", "text": "Check glucose only once daily when sick"}, {"letter": "D", "text": "Hold all insulin until able to eat normally"}], "answer": "B", "explanation": "**Never stop basal insulin** when sick; check glucose and ketones q4h, keep drinking, call early; hold SGLT2 inhibitors when ill or NPO. The lecture's closing line: crises are largely preventable.", "objective": "", "hint": "Illness raises insulin requirement even when intake falls; stopping the **long-acting** dose because the patient is not eating is exactly how the ketoacidosis starts. Check glucose and ketones often and call early."}, {"id": "39", "group": 39, "slide": 68, "section": "Diabetic Emergencies", "topic": "AKA", "skill": "Identification", "stem": "A chronic alcoholic with 2 days of vomiting after a binge has Kussmaul breathing, anion gap 24, glucose 85, and ethanol level zero. What is the diagnosis?", "options": [{"letter": "A", "text": "Hyperosmolar hyperglycemic state"}, {"letter": "B", "text": "Alcoholic ketoacidosis"}, {"letter": "C", "text": "Diabetic ketoacidosis"}, {"letter": "D", "text": "Methanol poisoning"}], "answer": "B", "explanation": "**AKA**: anion-gap ketoacidosis with normal or low glucose after a binge followed by vomiting and starvation. Order serum BHB (the urine nitroprusside dip misses it) and an osmolar gap to exclude toxic alcohols.", "objective": "", "hint": "Starvation and alcohol metabolism drive ketone production while blocking gluconeogenesis, so the gap acidosis arrives with a **normal glucose**; a toxic alcohol would add an osmolar gap. The urine dipstick can miss the ketones."}, {"id": "40", "group": 40, "slide": 69, "section": "Diabetic Emergencies", "topic": "AKA", "skill": "Management", "stem": "What is the treatment for alcoholic ketoacidosis, and which agent is deliberately withheld?", "options": [{"letter": "A", "text": "Bicarbonate and normal saline; no thiamine"}, {"letter": "B", "text": "Insulin infusion with potassium; no dextrose"}, {"letter": "C", "text": "Dextrose-saline with thiamine first; no insulin"}, {"letter": "D", "text": "Normal saline alone; no dextrose"}], "answer": "C", "explanation": "**D5NS plus thiamine** (thiamine before or with dextrose to prevent Wernicke encephalopathy), replete K, Mg, phosphate; insulin is NOT indicated. Resolves within 12–24 h; admit or observe until the gap closes.", "objective": "", "hint": "The patient is not insulin-deficient and glucose is not high, so the fix is to feed the pancreas **sugar** so its own insulin halts ketogenesis — and an alcoholic who gets sugar must be protected from Wernicke encephalopathy first."}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  const normAns = a => (Array.isArray(a) ? a.join('') : String(a == null ? '' : a))
    .toUpperCase().replace(/[^A-Z]/g, '').split('')
    .filter((v, i, z) => z.indexOf(v) === i).sort().join('');
  questions.forEach(q => { const n = normAns(q.answer); q.multi = q.multi === true || n.length > 1; q.answer = n; });
  const picks = {};          // question id -> letters picked but not yet submitted (multi only)
  const second = {};         // question id -> second-attempt answer (NOT scored)
  const flagged = {};        // question id -> true, set by the student at any point
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const keys = new Set(String(item.answer).split('').map(l => (item.options.find(o => o.letter === l) || {}).text));
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = item.options.filter(o => keys.has(o.text)).map(o => o.letter).join('');
  }
  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letters) => String(letters == null ? '' : letters).split('')
    .map(l => { const o = item.options.find(x => x.letter === l); return o ? o.text : ''; })
    .filter(Boolean).join(' \u00b7 ');
  const letters = v => String(v == null ? '' : v).split('').join(', ');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Hint, then the same question again =================
  // A missed question is never replaced by new questions. The student gets a hint
  // that points hard at the answer without naming it, then the SAME question again.
  // The FIRST attempt is what is scored; the second only decides whether the concept
  // is recorded as relearned or still shaky.
  function hintOf(q) {
    const r = q.remediation || {};
    return q.hint || r.hint || ((r.steps || [])[0] || {}).teach || '';
  }
  function hasTutor(q) { return !!hintOf(q); }

  function startTutor(q) {
    tutor[q.id] = { status: 'active', first: answers[q.id] };
    delete picks[q.id];
  }

  function isRetrying(q) { const t = tutor[q.id]; return !!(t && t.status === 'active'); }

  function secondAnswer(q, picked) {
    const t = tutor[q.id];
    if (!t || t.status !== 'active') return;
    second[q.id] = picked;
    t.status = picked === q.answer ? 'mastered' : 'review';
  }

  // The option already shown to be wrong is struck out on the retry. A select-all
  // answer is a set rather than one claim, so there every option stays live.
  function elimOf(q) { const t = tutor[q.id]; return (t && !q.multi && t.first) ? t.first : ''; }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong with no hint to give, or the second attempt is in.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return !isRetrying(q);
  }

  function tutorStatus(q) { const t = tutor[q.id]; return t ? t.status : null; }

  function hintHtml(q) {
    return '<div class="tutor"><div class="tutor-head">Hint</div>' +
      '<div class="tnode active hint"><span class="tlabel">Try again \u2014 same question</span>' +
      '<div class="teach">' + fmt(hintOf(q)) + '</div></div></div>';
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly can still be carried into the next round of study.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">\u2691 ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '\u2691 ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  // Collapsed record of the retry, shown in the review screens
  function trailHtml(q) {
    const t = tutor[q.id];
    if (!t) return '';
    const sec = second[q.id];
    let html = '<div class="tutor"><div class="tutor-head">Hint and second attempt</div>' +
      '<div class="tnode done"><div class="teach">' + fmt(hintOf(q)) + '</div>' +
      '<div class="firstpick">First answer: ' + esc(letters(t.first)) + '. ' + fmt(optText(q, t.first)) + '</div>';
    if (sec === undefined) html += '<div class="nudge">Second attempt not taken.</div>';
    else html += '<div class="feedback ' + (t.status === 'mastered' ? 'good' : 'bad') + '"><div class="verdict">' +
      (t.status === 'mastered' ? '\u2713 Correct on the second attempt'
        : '\u2717 Second attempt: ' + esc(letters(sec)) + '. ' + fmt(optText(q, sec))) + '</div></div>';
    return html + '</div></div>';
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen, first) {
    const good = chosen === q.answer;
    const keyTxt = optText(q, q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '\u2713 Correct' : '\u2717 Incorrect \u2014 correct answer' +
      (q.multi ? 's' : '') + ': ' + esc(letters(q.answer)) + (keyTxt ? '. ' + fmt(keyTxt) : '')) + '</div>';
    if (!good && q.multi) {
      const got = String(chosen || '').split('').filter(Boolean);
      const missed = String(q.answer).split('').filter(l => got.indexOf(l) === -1);
      const extra = got.filter(l => q.answer.indexOf(l) === -1), bits = [];
      if (missed.length) bits.push('missed ' + missed.join(', '));
      if (extra.length) bits.push('wrongly included ' + extra.join(', '));
      if (bits.length) html += '<div class="obj" style="font-style:normal">You ' + esc(bits.join(' and ')) + '.</div>';
    }
    if (first !== undefined && first !== chosen) {
      html += '<div class="firstpick">First attempt: ' + esc(letters(first)) + '. ' + fmt(optText(q, first)) +
        (good ? ' \u2014 corrected after the hint.' : ' \u2014 also incorrect.') + '</div>';
    }
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const first = answers[q.id];
    const sec = second[q.id];
    const retry = isRetrying(q) && mode === 'exam';
    const answered = first !== undefined && !retry;
    const chosen = sec !== undefined ? sec : first;
    const status = tutorStatus(q);
    const sel = answered ? String(chosen || '') : (q.multi ? (picks[q.id] || []).join('') : '');
    const dead = retry ? elimOf(q) : '';

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Right on the second try</span>';
    else if (status === 'review') html += '<span class="badge review">Missed twice</span>';
    else if (status === 'active') html += '<span class="badge active">Second attempt</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';

    if (retry) {
      html += '<div class="feedback tutoring"><div class="verdict">\u2717 Not quite \u2014 ' +
        esc(letters(first)) + '. ' + fmt(optText(q, first)) + '</div>' +
        '<div>Read the hint, then answer the same question again. Your first answer is the one that is scored.</div></div>';
      html += hintHtml(q);
    }

    if (q.multi && !answered) html += '<div class="sata-note">Select all that apply.</div>';
    html += '<div class="opts">';
    q.options.forEach(o => {
      let cls = 'opt';
      const hit = sel.indexOf(o.letter) !== -1;
      const out = dead.indexOf(o.letter) !== -1;
      if (answered) {
        if (hit) cls += q.answer.indexOf(o.letter) !== -1 ? ' correct' : ' incorrect';
        else if (q.answer.indexOf(o.letter) !== -1) cls += ' correct';
        else cls += ' dim';
      } else if (out) cls += ' incorrect elim';
      else if (hit) cls += ' picked';
      const mark = (q.multi ? '<span class="box' + (hit ? ' on' : '') + '">' + (hit ? '\u2713' : '') + '</span>' : '') +
        '<span class="letter">' + esc(o.letter) + '.</span>';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered || out || mode !== 'exam' ? ' disabled' : '') + '>' +
        mark + '<span>' + fmt(o.text) + '</span></button>';
    });
    html += '</div>';
    if (q.multi && !answered) {
      const n = (picks[q.id] || []).length;
      html += '<div class="sata-bar"><button class="opt-submit" data-submit="' + esc(q.id) + '"' +
        (n ? '' : ' disabled') + '>Submit answer</button><span class="sata-count">' +
        (n ? n + ' selected' : 'Choose one or more') + '</span></div>';
    }
    if (answered) html += feedbackHtml(q, chosen, sec !== undefined ? first : undefined);
    html += flagHtml(q);
    if (mode !== 'exam' && tutor[q.id]) {
      html += '<details class="trail"><summary>Hint and second attempt</summary>' + trailHtml(q) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'take the second attempt above to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Option clicks: first attempt, then the second attempt on the same question
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      const commit = picked => {
        const q = byId[qid];
        if (answers[qid] === undefined) {
          answers[qid] = picked;
          if (picked !== q.answer && hasTutor(q)) startTutor(q);
        } else if (isRetrying(q)) secondAnswer(q, picked);
        renderPage(true);
      };
      card.querySelectorAll(':scope > .opts > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          const q = byId[qid];
          if (answers[qid] !== undefined && !isRetrying(q)) return;
          const letter = btn.getAttribute('data-letter');
          if (q.multi) {                       // toggle; nothing is committed until Submit
            const cur = picks[qid] || (picks[qid] = []);
            const at = cur.indexOf(letter);
            if (at === -1) cur.push(letter); else cur.splice(at, 1);
            return renderPage(true);
          }
          commit(letter);
        });
      });
      const sub = card.querySelector(':scope > .sata-bar > .opt-submit');
      if (sub) sub.addEventListener('click', () => {
        if (mode !== 'exam') return;
        const cur = picks[qid] || [];
        if (cur.length) commit(cur.slice().sort().join(''));
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.qcard > .feedback');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      if (second[id] !== undefined) { ts.tq++; if (t.status === 'mastered') ts.tqRight++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {                 // wrong on the first attempt, or flagged
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' still shaky');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' right on the second try');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed question' + (r.ts.started === 1 ? '' : 's') + ' answered right on the second attempt</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try, plus anything you flagged</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed or flagged — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, flagged: 2, mastered: 3 };
      const items = missed.map(q => {
        const wrong = answers[q.id] !== undefined && answers[q.id] !== q.answer;
        let st = wrong ? (tutor[q.id] ? tutor[q.id].status : 'missed') : 'flagged';
        if (st === 'active') st = 'review';
        return { q, st: st, flag: !!flagged[q.id] };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', flagged: 'Flagged', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + (it.flag && it.st !== 'flagged' ? '⚑ ' : '') +
          label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Second attempts</h2><div class="sub" style="margin-bottom:12px">How the hint-and-retry went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>missed on the first try</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>right after the hint</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>second attempts right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered'
        : 'My answer (first attempt, scored): ' + letters(answers[q.id]));
      lines.push('Correct answer: ' + letters(q.answer) + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        lines.push('Hint shown: ' + plain(hintOf(q)));
        lines.push('Second attempt: ' + { mastered: 'CORRECT after the hint', review: 'still wrong \u2014 needs review',
          active: 'not taken' }[t.status]);
        if (second[q.id] !== undefined && t.status !== 'mastered')
          lines.push('  picked ' + letters(second[q.id]) + '. ' + plain(optText(q, second[q.id])));
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(second).forEach(k => delete second[k]);
    Object.keys(picks).forEach(k => delete picks[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
