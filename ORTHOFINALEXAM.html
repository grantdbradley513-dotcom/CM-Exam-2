<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; max-height: 540px; width: auto; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, image?}] }
const EXAM_DATA = (function (raw) {
  // Reshuffle stack order and option order on every open; renumber ids.
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const groups = {}; const order = [];
  raw.questions.forEach(q => { if (!groups[q.group]) { groups[q.group] = []; order.push(q.group); } groups[q.group].push(q); });
  shuffle(order);
  const out = []; const letters = ['A','B','C','D','E','F'];
  order.forEach((g, gi) => {
    groups[g].forEach((q, qi) => {
      const correct = q.options.find(o => o.letter === q.answer).text;
      const opts = shuffle(q.options.map(o => o.text)).map((t, i) => ({ letter: letters[i], text: t }));
      const ans = opts.find(o => o.text === correct).letter;
      out.push(Object.assign({}, q, { id: String(gi + 1) + (qi === 0 ? '' : letters[qi - 1]), group: gi + 1, options: opts, answer: ans }));
    });
  });
  return { title: raw.title, questions: out };
})({"title": "Ortho Exam 3 Practice C", "questions": [{"id": "1", "group": 1, "section": "Special Tests", "objective": "Special Tests", "stem": "Patient lifts both arms in scaption with thumbs UP and resists downward pressure → Test and muscle isolated:", "options": [{"letter": "A", "text": "Full can — supraspinatus"}, {"letter": "B", "text": "Empty can — infraspinatus"}, {"letter": "C", "text": "Drop arm — subscapularis"}, {"letter": "D", "text": "Hornblower — teres minor"}], "answer": "A", "explanation": "Full can = thumb up in scaption (anatomic line of pull of supraspinatus, not an impinged position). Empty can = thumb down (impingement position). Both test supraspinatus."}, {"id": "2", "group": 2, "section": "Special Tests", "objective": "Special Tests", "stem": "Examiner passively raises both arms parallel to the floor, lets go, and the patient's right arm suddenly falls → Positive test and meaning:", "options": [{"letter": "A", "text": "Drop arm — rotator cuff tear"}, {"letter": "B", "text": "Empty can — impingement"}, {"letter": "C", "text": "Apley's scratch — adhesive capsulitis"}, {"letter": "D", "text": "Hawkins — subacromial bursitis"}], "answer": "A", "explanation": "Drop arm: inability to lower the arm slowly (no eccentric control) = full-thickness rotator cuff (supraspinatus) tear."}, {"id": "3", "group": 3, "section": "Special Tests", "objective": "Special Tests", "stem": "Patient cannot hold the arm in abduction + external rotation as if holding a trumpet → Structures tested:", "options": [{"letter": "A", "text": "Infraspinatus and teres minor"}, {"letter": "B", "text": "Supraspinatus and deltoid"}, {"letter": "C", "text": "Subscapularis and pectoralis major"}, {"letter": "D", "text": "Biceps and coracobrachialis"}], "answer": "A", "explanation": "Hornblower sign = external rotators (teres minor/infraspinatus) of the rotator cuff."}, {"id": "4", "group": 4, "section": "Special Tests", "objective": "Special Tests", "stem": "Palm on the opposite shoulder, elbow forward; examiner pulls the hand off while the patient resists; the hand comes away easily → Diagnosis:", "options": [{"letter": "A", "text": "Subscapularis tear"}, {"letter": "B", "text": "Supraspinatus tear"}, {"letter": "C", "text": "SLAP lesion"}, {"letter": "D", "text": "Biceps tendonitis"}], "answer": "A", "explanation": "Bear hug = subscapularis (more sensitive than lift-off or belly press). Internal rotation strength against a perpendicular pull."}, {"id": "5", "group": 5, "section": "Special Tests", "objective": "Special Tests", "stem": "Arm forward-flexed, adducted, thumb DOWN, resisting a downward force → deep shoulder pain that resolves with thumb UP → Diagnosis:", "options": [{"letter": "A", "text": "SLAP (superior labral) tear"}, {"letter": "B", "text": "AC joint sprain"}, {"letter": "C", "text": "Supraspinatus tendinopathy"}, {"letter": "D", "text": "Anterior instability"}], "answer": "A", "explanation": "O'Brien's active compression: deep pain with thumb down relieved with thumb up = labrum; pain on TOP of the shoulder = AC joint."}, {"id": "5a", "group": 5, "section": "Special Tests", "objective": "Special Tests", "stem": "Same test, but the pain is felt on top of the shoulder at the AC joint rather than deep inside → Suggests:", "options": [{"letter": "A", "text": "AC joint pathology"}, {"letter": "B", "text": "SLAP tear"}, {"letter": "C", "text": "Biceps tendonitis"}, {"letter": "D", "text": "Impingement"}], "answer": "A", "explanation": "O'Brien's localizes: superficial/top = AC joint; deep = labrum."}, {"id": "6", "group": 6, "section": "Special Tests", "objective": "Special Tests", "stem": "Which two tests should NOT be performed on a shoulder that was dislocated and reduced yesterday →", "options": [{"letter": "A", "text": "Apprehension and relocation"}, {"letter": "B", "text": "Hawkins-Kennedy and Neer"}, {"letter": "C", "text": "Empty can and drop arm"}, {"letter": "D", "text": "Speed's and Yergason's"}], "answer": "A", "explanation": "Apprehension (abduction + ER) places the shoulder back into the dislocation position — never on an acute/recent dislocation."}, {"id": "7", "group": 7, "section": "Special Tests", "objective": "Special Tests", "stem": "Thrower with medial elbow pain; examiner grasps the thumb and pulls it away from midline with the elbow stabilized → Test:", "options": [{"letter": "A", "text": "Milking maneuver"}, {"letter": "B", "text": "Cozen's test"}, {"letter": "C", "text": "Hook test"}, {"letter": "D", "text": "Tinel's at the elbow"}], "answer": "A", "explanation": "Milking maneuver = valgus load to test the UCL (ulnar collateral ligament). May also provoke ulnar nerve symptoms."}, {"id": "8", "group": 8, "section": "Special Tests", "objective": "Special Tests", "stem": "Examiner's index finger cannot catch a cord-like tendon in the antecubital fossa → Diagnosis:", "options": [{"letter": "A", "text": "Distal biceps tendon rupture"}, {"letter": "B", "text": "Proximal biceps tendon rupture"}, {"letter": "C", "text": "Lateral epicondylitis"}, {"letter": "D", "text": "Triceps rupture"}], "answer": "A", "explanation": "Negative hook = distal biceps rupture (the 'reverse Popeye'). Proximal rupture gives the classic Popeye bulge with an intact distal tendon."}, {"id": "9", "group": 9, "section": "Special Tests", "objective": "Special Tests", "stem": "Thumb pressed over the lateral epicondyle while the patient extends the wrist against resistance → pain → Test:", "options": [{"letter": "A", "text": "Cozen's test"}, {"letter": "B", "text": "Finkelstein's test"}, {"letter": "C", "text": "Phalen's test"}, {"letter": "D", "text": "Mill's test"}], "answer": "A", "explanation": "Cozen's = resisted wrist extension for lateral epicondylitis (common extensor origin, ECRB)."}, {"id": "10", "group": 10, "section": "Special Tests", "objective": "Special Tests", "stem": "Which test is positive only after holding the position for 30–60 seconds →", "options": [{"letter": "A", "text": "Phalen's"}, {"letter": "B", "text": "Tinel's"}, {"letter": "C", "text": "Finkelstein's"}, {"letter": "D", "text": "Allen's"}], "answer": "A", "explanation": "Phalen's (wrist flexion, backs of hands together) takes 30–60 s to provoke median-nerve paresthesias. Tinel's is immediate percussion."}, {"id": "11", "group": 11, "section": "Special Tests", "objective": "Special Tests", "stem": "Both wrist arteries compressed, fist pumped, ULNAR artery released and the hand stays pale → Interpretation:", "options": [{"letter": "A", "text": "Ulnar artery not patent — avoid a radial puncture"}, {"letter": "B", "text": "Radial artery not patent — avoid an ulnar puncture"}, {"letter": "C", "text": "Normal result — safe for a radial line"}, {"letter": "D", "text": "Median nerve compression — not a vascular test"}], "answer": "A", "explanation": "Allen's: no color return when ONE artery is released = that vessel is not patent; a radial ABG/line would leave the hand dependent on an inadequate ulnar supply."}, {"id": "12", "group": 12, "section": "Special Tests", "objective": "Special Tests", "stem": "Palpating the radial pulse while the patient extends and rotates the head toward the arm and inhales; the pulse disappears → Diagnosis:", "options": [{"letter": "A", "text": "Thoracic outlet syndrome"}, {"letter": "B", "text": "Cervical radiculopathy"}, {"letter": "C", "text": "Carpal tunnel syndrome"}, {"letter": "D", "text": "Subclavian steal"}], "answer": "A", "explanation": "Adson's = loss/diminution of the radial pulse = thoracic outlet syndrome (also Roos/EAST, Wright's)."}, {"id": "13", "group": 13, "section": "Special Tests", "objective": "Special Tests", "stem": "Which cervical test should be avoided when fracture or instability is suspected →", "options": [{"letter": "A", "text": "Cervical compression/distraction"}, {"letter": "B", "text": "Adson's"}, {"letter": "C", "text": "Phalen's"}, {"letter": "D", "text": "Hoover"}], "answer": "A", "explanation": "Axial compression and distraction of an unstable cervical spine can cause cord injury — clear the C-spine (NEXUS/CT) first."}, {"id": "14", "group": 14, "section": "Special Tests", "objective": "Special Tests", "stem": "Lifting the patient's head RELIEVES the arm pain → Test and meaning:", "options": [{"letter": "A", "text": "Cervical distraction — foraminal compression of a nerve root"}, {"letter": "B", "text": "Spurling's — specific for radiculopathy"}, {"letter": "C", "text": "Valsalva — disc herniation"}, {"letter": "D", "text": "Adson's — thoracic outlet"}], "answer": "A", "explanation": "Distraction opens the foramina; relief of radicular symptoms is a positive distraction test. Spurling's (extension + rotation + axial load) REPRODUCES the pain."}, {"id": "15", "group": 15, "section": "Special Tests", "objective": "Special Tests", "stem": "Regarding Spurling's and the straight-leg raise, which statement is correct →", "options": [{"letter": "A", "text": "Spurling's is specific; SLR is sensitive"}, {"letter": "B", "text": "Both are highly sensitive"}, {"letter": "C", "text": "Both are highly specific"}, {"letter": "D", "text": "Spurling's is sensitive; SLR is specific"}], "answer": "A", "explanation": "Spurling's: specific, not sensitive (positive rules IN). SLR: sensitive, not specific — crossed SLR adds specificity."}, {"id": "16", "group": 16, "section": "Special Tests", "objective": "Special Tests", "stem": "Supine SLR: back pain only, no leg pain, at 50° → Interpretation:", "options": [{"letter": "A", "text": "Negative test"}, {"letter": "B", "text": "Positive for L5/S1 radiculopathy"}, {"letter": "C", "text": "Positive for hip pathology"}, {"letter": "D", "text": "Positive for central disc herniation"}], "answer": "A", "explanation": "SLR is positive only when radicular LEG pain is reproduced between 30–70°. Back pain alone = negative."}, {"id": "17", "group": 17, "section": "Special Tests", "objective": "Special Tests", "stem": "Supine, both heels in the examiner's palms; patient raises the 'good' leg and NO downward pressure is felt from the 'weak' heel → Interpretation:", "options": [{"letter": "A", "text": "Functional weakness or malingering"}, {"letter": "B", "text": "True L4 radiculopathy with foot drop"}, {"letter": "C", "text": "Iliopsoas contracture on the weak side"}, {"letter": "D", "text": "Gluteus medius weakness on the weak side"}], "answer": "A", "explanation": "Hoover sign: genuine effort to lift one leg produces involuntary downward pressure of the other heel; its absence suggests lack of effort."}, {"id": "18", "group": 18, "section": "Special Tests", "objective": "Special Tests", "stem": "Supine, patient hugs one knee to the chest and the opposite thigh rises off the table → Tight structure:", "options": [{"letter": "A", "text": "Iliopsoas (hip flexor)"}, {"letter": "B", "text": "Hamstrings"}, {"letter": "C", "text": "IT band"}, {"letter": "D", "text": "Gluteus medius"}], "answer": "A", "explanation": "Thomas test = hip flexor contracture. Variants: hip abducts = TFL; knee extends = rectus femoris."}, {"id": "18a", "group": 18, "section": "Special Tests", "objective": "Special Tests", "stem": "During the same test the knee of the hanging leg extends as the thigh lifts → Additional tight structure:", "options": [{"letter": "A", "text": "Rectus femoris"}, {"letter": "B", "text": "Iliopsoas"}, {"letter": "C", "text": "Tensor fasciae latae"}, {"letter": "D", "text": "Biceps femoris"}], "answer": "A", "explanation": "Knee extension during Thomas = tight rectus femoris (two-joint muscle)."}, {"id": "19", "group": 19, "section": "Special Tests", "objective": "Special Tests", "stem": "Side-lying, hip extended and abducted, then released — the leg stays up instead of dropping to the table → Test:", "options": [{"letter": "A", "text": "Ober's"}, {"letter": "B", "text": "Noble's"}, {"letter": "C", "text": "Thomas"}, {"letter": "D", "text": "FABER"}], "answer": "A", "explanation": "Ober's = IT band TIGHTNESS. Noble's = pressure over the lateral femoral epicondyle during flexion/extension reproduces IT band FRICTION pain (~30°)."}, {"id": "20", "group": 20, "section": "Special Tests", "objective": "Special Tests", "stem": "Patient stands on the LEFT leg and the RIGHT hip drops → Weak muscle and side:", "options": [{"letter": "A", "text": "Left gluteus medius"}, {"letter": "B", "text": "Right gluteus medius"}, {"letter": "C", "text": "Left gluteus maximus"}, {"letter": "D", "text": "Right hip adductors"}], "answer": "A", "explanation": "Trendelenburg: the pelvis drops on the non-stance side when the STANCE-side gluteus medius (superior gluteal nerve) is weak."}, {"id": "21", "group": 21, "section": "Special Tests", "objective": "Special Tests", "stem": "Figure-4 position with pressure on the knee and opposite ASIS produces posterior buttock pain → Localizes to:", "options": [{"letter": "A", "text": "Sacroiliac joint"}, {"letter": "B", "text": "Hip joint / FAI"}, {"letter": "C", "text": "Lumbar disc"}, {"letter": "D", "text": "Iliopsoas"}], "answer": "A", "explanation": "FABER: groin pain = hip joint; posterior/buttock pain = SI joint. FADIR (flexion-adduction-IR) is the FAI/labral test."}, {"id": "22", "group": 22, "section": "Special Tests", "objective": "Special Tests", "stem": "ASIS-to-medial-malleolus lengths are equal, but umbilicus-to-medial-malleolus lengths differ → Interpretation:", "options": [{"letter": "A", "text": "Apparent (functional) discrepancy — pelvic obliquity or contracture"}, {"letter": "B", "text": "True (structural) discrepancy — bone length"}, {"letter": "C", "text": "Measurement error"}, {"letter": "D", "text": "Hip dislocation"}], "answer": "A", "explanation": "True (ASIS) equal + apparent (umbilicus) unequal = functional cause (pelvic tilt, scoliosis, contracture), not bone length."}, {"id": "23", "group": 23, "section": "Special Tests", "objective": "Special Tests", "stem": "Why should the posterior drawer be performed BEFORE the anterior drawer →", "options": [{"letter": "A", "text": "A PCL tear causes posterior sag that mimics a positive anterior drawer"}, {"letter": "B", "text": "The ACL is more painful to test"}, {"letter": "C", "text": "Anterior drawer loosens the PCL"}, {"letter": "D", "text": "Hamstring guarding prevents posterior testing"}], "answer": "A", "explanation": "With a PCL tear the tibia rests sagged posteriorly; pulling it forward to neutral feels like anterior laxity — a false-positive ACL test."}, {"id": "24", "group": 24, "section": "Special Tests", "objective": "Special Tests", "stem": "Most sensitive bedside test for an ACL tear, and the knee angle used →", "options": [{"letter": "A", "text": "Lachman at 30°"}, {"letter": "B", "text": "Anterior drawer at 90°"}, {"letter": "C", "text": "Pivot shift at 90°"}, {"letter": "D", "text": "McMurray at full extension"}], "answer": "A", "explanation": "Lachman (20–30° flexion) is the most sensitive ACL test; anterior drawer is done at 90°; pivot shift clunks at 20–30°."}, {"id": "25", "group": 25, "section": "Special Tests", "objective": "Special Tests", "stem": "McMurray: pain/click when extending the knee with the tibia INTERNALLY rotated and varus stress → Structure:", "options": [{"letter": "A", "text": "Lateral meniscus"}, {"letter": "B", "text": "Medial meniscus"}, {"letter": "C", "text": "MCL"}, {"letter": "D", "text": "Lateral collateral ligament"}], "answer": "A", "explanation": "ER of the foot loads the medial meniscus; IR loads the lateral meniscus."}, {"id": "26", "group": 26, "section": "Special Tests", "objective": "Special Tests", "stem": "Valgus stress produces medial gapping at 30° of flexion but the knee is stable at 0° → Interpretation:", "options": [{"letter": "A", "text": "Isolated MCL injury"}, {"letter": "B", "text": "MCL plus cruciate/capsular injury"}, {"letter": "C", "text": "Isolated LCL injury"}, {"letter": "D", "text": "Normal knee"}], "answer": "A", "explanation": "Laxity at 30° only = isolated MCL; laxity at full extension too = posteromedial capsule/cruciate involvement."}, {"id": "27", "group": 27, "section": "Special Tests", "objective": "Special Tests", "stem": "Flat hand sweeps upward along the medial knee, then down the lateral side; a wave of fluid appears medially → Test and what it detects:", "options": [{"letter": "A", "text": "Sweep (bulge) test — small effusion"}, {"letter": "B", "text": "Ballotable patella — large effusion"}, {"letter": "C", "text": "Patellar grind — chondromalacia"}, {"letter": "D", "text": "Apley's — meniscal tear"}], "answer": "A", "explanation": "Sweep/bulge picks up SMALL effusions; ballottement (patella rebounds when pressed) needs a larger effusion."}, {"id": "28", "group": 28, "section": "Special Tests", "objective": "Special Tests", "stem": "Examiner pushes the patella laterally with the knee extended; patient grabs the examiner's hand → Diagnosis:", "options": [{"letter": "A", "text": "Patellar instability / prior subluxation"}, {"letter": "B", "text": "Patellofemoral pain syndrome"}, {"letter": "C", "text": "Prepatellar bursitis"}, {"letter": "D", "text": "Osgood-Schlatter"}], "answer": "A", "explanation": "Patellar apprehension = fear/guarding, not merely pain — instability (lateral dislocation history)."}, {"id": "29", "group": 29, "section": "Special Tests", "objective": "Special Tests", "stem": "Stabilize the distal leg and INVERT the hindfoot in neutral; excessive tilt without end-feel → Ligaments tested:", "options": [{"letter": "A", "text": "Calcaneofibular (± ATFL)"}, {"letter": "B", "text": "Deltoid"}, {"letter": "C", "text": "Syndesmosis"}, {"letter": "D", "text": "Posterior talofibular only"}], "answer": "A", "explanation": "Talar tilt in neutral = CFL (and ATFL). Ankle anterior drawer isolates the ATFL; eversion tilt tests the deltoid."}, {"id": "30", "group": 30, "section": "Special Tests", "objective": "Special Tests", "stem": "Squeeze the calf of a prone patient — the foot plantarflexes normally despite severe Achilles pain → Interpretation:", "options": [{"letter": "A", "text": "Negative Thompson — rupture unlikely, consider tendinitis"}, {"letter": "B", "text": "Positive Thompson — complete rupture"}, {"letter": "C", "text": "Partial rupture confirmed"}, {"letter": "D", "text": "Test invalid in prone position"}], "answer": "A", "explanation": "Thompson detects COMPLETE rupture (no plantarflexion). A normal response = negative; tendinitis gives a negative test."}, {"id": "31", "group": 31, "section": "Special Tests", "objective": "Special Tests", "stem": "Abrupt forced dorsiflexion of the foot causes calf pain in a patient with unilateral leg swelling → Correct next step:", "options": [{"letter": "A", "text": "Venous duplex ultrasound — the sign is unreliable"}, {"letter": "B", "text": "Diagnose DVT and anticoagulate"}, {"letter": "C", "text": "Reassure — negative Homan's rules out DVT"}, {"letter": "D", "text": "Thompson test"}], "answer": "A", "explanation": "Homan's sign is neither sensitive nor specific; suspected DVT → duplex ultrasound."}, {"id": "32", "group": 32, "section": "Special Tests", "objective": "Special Tests", "stem": "Correct ORDER of an orthopedic examination →", "options": [{"letter": "A", "text": "History → observation → palpation → ROM → strength → special tests → neuro"}, {"letter": "B", "text": "Special tests → palpation → observation → history"}, {"letter": "C", "text": "Palpation → history → special tests → observation"}, {"letter": "D", "text": "ROM → history → neuro → observation"}], "answer": "A", "explanation": "History, observation, palpation, then the special-test portion (ROM → MMT → ortho special tests → neurologic). Always compare to and test the uninjured side first."}, {"id": "33", "group": 33, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Warm, red, boggy prepatellar bursa with surrounding streaky cellulitis of the skin → Correct action:", "options": [{"letter": "A", "text": "Do not aspirate through infected skin — treat the cellulitis first"}, {"letter": "B", "text": "Aspirate at the point of maximal fluctuance"}, {"letter": "C", "text": "Aspirate, then inject corticosteroid"}, {"letter": "D", "text": "Inject corticosteroid only"}], "answer": "A", "explanation": "Overlying cellulitis/skin infection is a contraindication — a needle can seed the joint or bursa."}, {"id": "34", "group": 34, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Which patient's knee effusion should be drained by the orthopedist rather than in your clinic →", "options": [{"letter": "A", "text": "Total knee arthroplasty in place"}, {"letter": "B", "text": "Monoarticular osteoarthritis flare"}, {"letter": "C", "text": "Suspected gout"}, {"letter": "D", "text": "Hemarthrosis after a twisting injury"}], "answer": "A", "explanation": "Prosthesis/hardware = contraindication to office aspiration/injection; infection of a prosthetic joint is a disaster."}, {"id": "35", "group": 35, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Needle gauge used to ASPIRATE a large knee effusion vs. to INJECT →", "options": [{"letter": "A", "text": "18 g to aspirate; 22–25 g to inject"}, {"letter": "B", "text": "25 g to aspirate; 18 g to inject"}, {"letter": "C", "text": "18 g for both"}, {"letter": "D", "text": "25 g for both"}], "answer": "A", "explanation": "Thick/viscous fluid needs a large bore (18 g); injections use 22–25 g. Syringe 20–60 cc for aspiration, 5–10 cc for injection."}, {"id": "36", "group": 36, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Knee aspiration: patient position and knee position →", "options": [{"letter": "A", "text": "Supine, knee extended, slight external rotation"}, {"letter": "B", "text": "Seated, knee flexed to 90°, foot flat"}, {"letter": "C", "text": "Prone, knee flexed to 45°, hip neutral"}, {"letter": "D", "text": "Supine, knee flexed to 90°, hip flexed"}], "answer": "A", "explanation": "Supine with the knee extended and slightly externally rotated; chux under the knee; mark the site with a fingernail or capped pen."}, {"id": "37", "group": 37, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Standard entry point for a suprapatellar knee aspiration →", "options": [{"letter": "A", "text": "~2 cm proximal and lateral to the patella"}, {"letter": "B", "text": "Directly through the patellar tendon"}, {"letter": "C", "text": "2 cm distal to the medial joint line"}, {"letter": "D", "text": "Through the popliteal fossa"}], "answer": "A", "explanation": "2 cm proximal + lateral to the patella into the suprapatellar pouch (where knee fluid 'horseshoes'); medial or lateral joint-line approaches are alternatives."}, {"id": "38", "group": 38, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "The syringe is full but effusion remains. Correct technique →", "options": [{"letter": "A", "text": "Hemostat on the hub, swap syringes, keep the needle in"}, {"letter": "B", "text": "Withdraw the needle and re-enter at a new site"}, {"letter": "C", "text": "Push fluid back into the joint and re-aspirate"}, {"letter": "D", "text": "Stop the procedure — one syringe is the maximum"}], "answer": "A", "explanation": "Hemostat on the hub keeps the needle in the joint while syringes are exchanged; new syringe screws on clockwise."}, {"id": "39", "group": 39, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Aspirate from a knee is sent for which studies →", "options": [{"letter": "A", "text": "Cell count, Gram stain, culture, crystals"}, {"letter": "B", "text": "CBC, ESR, CRP, and uric acid level"}, {"letter": "C", "text": "Glucose, protein, LDH, and pH"}, {"letter": "D", "text": "Cytology, flow cytometry, and viral PCR"}], "answer": "A", "explanation": "The four tubes: cell count/differential, Gram stain, culture, crystal analysis — differentiates septic vs inflammatory vs crystal."}, {"id": "40", "group": 40, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Olecranon bursa aspirate returns frank pus → Regarding the planned corticosteroid injection:", "options": [{"letter": "A", "text": "Skip the injection — send fluid for culture"}, {"letter": "B", "text": "Inject the steroid as planned"}, {"letter": "C", "text": "Inject half the dose"}, {"letter": "D", "text": "Inject lidocaine only"}], "answer": "A", "explanation": "Purulent aspirate = septic bursitis; steroid into infection is contraindicated. Inject only if the aspirate is clear."}, {"id": "41", "group": 41, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Shoulder (glenohumeral) injection landmark used in lab →", "options": [{"letter": "A", "text": "Infraspinatus fossa: 2 cm below and 2 cm medial to the angle of the acromion, aim toward the coracoid"}, {"letter": "B", "text": "Anterior: 1 cm lateral to the coracoid, aim posteriorly"}, {"letter": "C", "text": "Directly inferior to the acromion laterally into the subacromial space"}, {"letter": "D", "text": "Through the bicipital groove"}], "answer": "A", "explanation": "Posterior approach: thumb on the acromion angle, finger on the coracoid, needle at ~90° directed toward the coracoid."}, {"id": "42", "group": 42, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Position of the elbow for an olecranon bursa aspiration, and depth of needle insertion →", "options": [{"letter": "A", "text": "Flexed 45–90°; insert only until fluid is obtained"}, {"letter": "B", "text": "Fully extended; advance to bone"}, {"letter": "C", "text": "Fully flexed; advance 3 cm"}, {"letter": "D", "text": "Pronated and extended; advance until a pop is felt"}], "answer": "A", "explanation": "The bursa is superficial and outside the joint capsule — minimal insertion at the point of maximal fluctuance, lateral or oblique approach."}, {"id": "43", "group": 43, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Patient on warfarin just had a knee aspirated → Post-procedure addition:", "options": [{"letter": "A", "text": "Pressure bandage"}, {"letter": "B", "text": "Prophylactic antibiotics"}, {"letter": "C", "text": "Immediate ice bath"}, {"letter": "D", "text": "Splint for 1 week"}], "answer": "A", "explanation": "Anticoagulation isn't an absolute contraindication (uncontrolled coagulopathy is) — apply a pressure dressing to limit bleeding/recurrence."}, {"id": "44", "group": 44, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Post-injection instructions: which symptom should prompt a call or ED visit →", "options": [{"letter": "A", "text": "Fever, warmth, or sudden re-swelling"}, {"letter": "B", "text": "Mild soreness for the first 24 hours"}, {"letter": "C", "text": "Small bruise at the needle entry site"}, {"letter": "D", "text": "Stiffness in the joint for one day"}], "answer": "A", "explanation": "Rest 1 day, ice 15 min 3×/day, no swimming for a few days. Fever, erythema/warmth, severe pain, or rapid re-effusion = possible infection."}, {"id": "45", "group": 45, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Patient reports the knee hurt MORE for a day after a steroid injection, then improved → Explanation:", "options": [{"letter": "A", "text": "Expected post-injection flare"}, {"letter": "B", "text": "Septic arthritis"}, {"letter": "C", "text": "Cartilage damage"}, {"letter": "D", "text": "Allergic reaction"}], "answer": "A", "explanation": "Transient increase in pain for ~1 day is a known complication; infection risk with good technique is <1:10,000."}, {"id": "46", "group": 46, "section": "Joint Injection & Aspiration", "objective": "Joint Injection & Aspiration", "stem": "Which injection carries the highest risk of tendon rupture and should be avoided →", "options": [{"letter": "A", "text": "Achilles tendon"}, {"letter": "B", "text": "Subacromial bursa"}, {"letter": "C", "text": "Knee joint"}, {"letter": "D", "text": "Olecranon bursa"}], "answer": "A", "explanation": "Steroid into/around the Achilles (and patellar tendon) weakens collagen → rupture risk."}, {"id": "47", "group": 47, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Main advantage of a splint over a cast in the first 3–4 days after a fracture →", "options": [{"letter": "A", "text": "Accommodates soft-tissue swelling"}, {"letter": "B", "text": "Provides more mechanical support"}, {"letter": "C", "text": "Cannot be removed by the patient"}, {"letter": "D", "text": "Allows earlier weight-bearing"}], "answer": "A", "explanation": "Circumferential casts cannot expand — acute swelling under a cast → compartment syndrome. Splint first, cast later."}, {"id": "48", "group": 48, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Which is a CONTRAINDICATION to applying a circumferential cast →", "options": [{"letter": "A", "text": "Open wound that the cast would conceal"}, {"letter": "B", "text": "Reduced dislocation"}, {"letter": "C", "text": "Unstable fracture"}, {"letter": "D", "text": "Chronic foot ulcer"}], "answer": "A", "explanation": "Never cast over an open wound, infection, or known skin condition; acute swelling phase is also a contraindication. Reduced dislocations and unstable fractures are indications."}, {"id": "49", "group": 49, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Plaster vs fiberglass: which statement is true →", "options": [{"letter": "A", "text": "Plaster molds better and has more 'give'; fiberglass is lighter and stronger"}, {"letter": "B", "text": "Fiberglass molds better; plaster is lighter"}, {"letter": "C", "text": "Plaster sets without heat; fiberglass is exothermic"}, {"letter": "D", "text": "Fiberglass needs more layers than plaster"}], "answer": "A", "explanation": "Plaster = moldable, heavy, needs more layers, exothermic (burn risk). Fiberglass = light, rigid, little give, less moldable."}, {"id": "50", "group": 50, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Which combination MOST increases the risk of a thermal burn during splinting →", "options": [{"letter": "A", "text": "Hot water + many layers + extra-fast-set plaster + thin padding"}, {"letter": "B", "text": "Cold water + few layers + Orthoglass"}, {"letter": "C", "text": "Room-temperature water + 8 layers + thick padding"}, {"letter": "D", "text": "Fiberglass + cool water"}], "answer": "A", "explanation": "Plaster recrystallization is exothermic; heat rises with water temperature, layer count, fast-set formulas and poor padding. Significant pain during setting → remove and cool."}, {"id": "51", "group": 51, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Number of plaster layers for an upper vs. lower extremity splint →", "options": [{"letter": "A", "text": "8–10 upper; 12–15 lower"}, {"letter": "B", "text": "12–15 upper; 8–10 lower"}, {"letter": "C", "text": "4–6 upper; 8–10 lower"}, {"letter": "D", "text": "20 upper; 20 lower"}], "answer": "A", "explanation": "Lower extremities bear weight and need more layers."}, {"id": "52", "group": 52, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Scaphoid tenderness after FOOSH, X-ray negative → Splint and position:", "options": [{"letter": "A", "text": "Thumb spica in wine-glass position"}, {"letter": "B", "text": "Volar cockup in slight extension"}, {"letter": "C", "text": "Ulnar gutter in intrinsic-plus"}, {"letter": "D", "text": "Sugar-tong in neutral rotation"}], "answer": "A", "explanation": "Suspected or confirmed scaphoid fracture (and De Quervain's) = thumb spica. Re-image in 7–10 days."}, {"id": "53", "group": 53, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Boxer's fracture (5th metacarpal neck) → Splint:", "options": [{"letter": "A", "text": "Ulnar gutter"}, {"letter": "B", "text": "Radial gutter"}, {"letter": "C", "text": "Thumb spica"}, {"letter": "D", "text": "Volar cockup"}], "answer": "A", "explanation": "Ulnar gutter = 4th/5th metacarpal and phalangeal fractures and small/ring finger soft-tissue injuries; radial gutter = index/long fingers."}, {"id": "54", "group": 54, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Index-finger proximal phalanx fracture → Splint:", "options": [{"letter": "A", "text": "Radial gutter"}, {"letter": "B", "text": "Ulnar gutter"}, {"letter": "C", "text": "Thumb spica"}, {"letter": "D", "text": "Buddy taping only"}], "answer": "A", "explanation": "Radial gutter covers the index and long fingers."}, {"id": "55", "group": 55, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Distal radius AND ulna fracture where you specifically want to block pronation/supination → Splint:", "options": [{"letter": "A", "text": "Forearm sugar-tong"}, {"letter": "B", "text": "Volar cockup"}, {"letter": "C", "text": "Long-arm posterior alone"}, {"letter": "D", "text": "Ulnar gutter"}], "answer": "A", "explanation": "Sugar-tong wraps around the elbow → blocks pronation/supination and wrist motion. Volar cockup does not."}, {"id": "56", "group": 56, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Unstable or complex distal forearm fracture in which a long-arm posterior splint alone is insufficient → Better choice:", "options": [{"letter": "A", "text": "Double sugar-tong"}, {"letter": "B", "text": "Volar cockup with dorsal 'sandwich'"}, {"letter": "C", "text": "Thumb spica"}, {"letter": "D", "text": "Stirrup"}], "answer": "A", "explanation": "Long-arm posterior does not fully stop supination/pronation; add an anterior slab or use a double sugar-tong for complex/unstable forearm or elbow fractures."}, {"id": "57", "group": 57, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Night splint for carpal tunnel syndrome, or a wrist sprain → Splint:", "options": [{"letter": "A", "text": "Volar forearm (cockup) splint"}, {"letter": "B", "text": "Sugar-tong"}, {"letter": "C", "text": "Thumb spica"}, {"letter": "D", "text": "Long-arm posterior"}], "answer": "A", "explanation": "Volar cockup = soft-tissue wrist/hand injuries, carpal tunnel night splints, most wrist fractures, 2nd–5th metacarpal fractures."}, {"id": "58", "group": 58, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Reduced ankle dislocation or distal tibia/fibula fracture → Splint, and what to add to stop inversion/eversion:", "options": [{"letter": "A", "text": "Posterior splint + stirrup (Cadillac)"}, {"letter": "B", "text": "Stirrup splint alone, no posterior slab"}, {"letter": "C", "text": "Hard post-op shoe with ACE wrap"}, {"letter": "D", "text": "Knee immobilizer extended to the foot"}], "answer": "A", "explanation": "Posterior ankle splint (12–15 layers) for distal tib/fib fractures, reduced dislocations, severe sprains, tarsal/MT fractures; adding a stirrup eliminates inversion/eversion."}, {"id": "59", "group": 59, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Simple lateral ankle sprain where you want to limit inversion/eversion but allow some plantarflexion → Splint:", "options": [{"letter": "A", "text": "Stirrup splint"}, {"letter": "B", "text": "Posterior ankle splint"}, {"letter": "C", "text": "Bulky Jones"}, {"letter": "D", "text": "Hard shoe"}], "answer": "A", "explanation": "Stirrup (U-shaped medial/lateral) = ankle sprains and simple ankle fractures; less plantarflexion control than a posterior splint."}, {"id": "60", "group": 60, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Non-displaced metatarsal shaft fracture → Orthosis:", "options": [{"letter": "A", "text": "Hard (post-op) shoe"}, {"letter": "B", "text": "Knee immobilizer"}, {"letter": "C", "text": "Stirrup"}, {"letter": "D", "text": "Thumb spica"}], "answer": "A", "explanation": "Hard shoe for foot fractures and foot soft-tissue injuries; boots for sprains/stable fractures."}, {"id": "61", "group": 61, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Ligamentous knee injury where you want adjustable, controlled flexion/extension → Orthosis:", "options": [{"letter": "A", "text": "Hinged knee brace"}, {"letter": "B", "text": "Knee immobilizer"}, {"letter": "C", "text": "Bulky Jones dressing"}, {"letter": "D", "text": "Hard shoe"}], "answer": "A", "explanation": "Hinged/articulated brace = ligament injuries and post-op; immobilizer = rigid straight-leg Velcro device."}, {"id": "62", "group": 62, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Essential step BEFORE applying cast padding →", "options": [{"letter": "A", "text": "Inspect the skin and apply stockinette"}, {"letter": "B", "text": "Wet the plaster"}, {"letter": "C", "text": "Apply the ACE wrap"}, {"letter": "D", "text": "Mark the fracture site"}], "answer": "A", "explanation": "Always check the skin first; stockinette (cut longer than the splint) protects it; then 2–3 layers of Webril, extra over bony prominences."}, {"id": "63", "group": 63, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "When buddy-taping or splinting fingers/toes, what must always be done →", "options": [{"letter": "A", "text": "Pad between the digits"}, {"letter": "B", "text": "Tape directly skin-to-skin"}, {"letter": "C", "text": "Include the DIP in extension"}, {"letter": "D", "text": "Leave the small finger free"}], "answer": "A", "explanation": "Pad between digits to prevent maceration/pressure sores; never leave a small finger hanging free."}, {"id": "64", "group": 64, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Patient in a splint reports worsening pain under the splint → Correct response:", "options": [{"letter": "A", "text": "Remove the splint and look"}, {"letter": "B", "text": "Increase analgesics and recheck in a week"}, {"letter": "C", "text": "Tighten the ACE wrap"}, {"letter": "D", "text": "Elevate and reassure"}], "answer": "A", "explanation": "'Any complaint of worsening pain — take the splint off and look.' Loss of pulse is a LATE finding of ischemia/compartment syndrome."}, {"id": "65", "group": 65, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Which post-application check indicates the splint is too tight →", "options": [{"letter": "A", "text": "Your fingers cannot slide under the wrap without effort"}, {"letter": "B", "text": "Patient can wiggle fingers comfortably"}, {"letter": "C", "text": "Capillary refill <2 s"}, {"letter": "D", "text": "Skin is not bunched"}], "answer": "A", "explanation": "Fit: pulse/motor/sensory/cap refill before and after, fingers slide in easily, digits move freely, no wrinkles or bunching."}, {"id": "66", "group": 66, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Cast care instruction that is CORRECT →", "options": [{"letter": "A", "text": "Re-image in 7–10 days even if the first film was normal"}, {"letter": "B", "text": "Scratch inside the cast with a thin coat hanger"}, {"letter": "C", "text": "Soak the cast in warm water to clean it"}, {"letter": "D", "text": "Keep the limb hanging down to reduce swelling"}], "answer": "A", "explanation": "Nothing in the cast, keep it dry, RICE/elevate, know compartment-syndrome signs, repeat films at 7–10 days (occult fractures)."}, {"id": "67", "group": 67, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Using an oscillating cast saw safely →", "options": [{"letter": "A", "text": "Brisk in-and-out motions; the blade vibrates rather than cuts"}, {"letter": "B", "text": "Drag the blade continuously along the cast"}, {"letter": "C", "text": "Use only over bony prominences"}, {"letter": "D", "text": "Saw through the stockinette"}], "answer": "A", "explanation": "In-and-out strokes, a tongue depressor can shield the skin, warn the patient it vibrates."}, {"id": "68", "group": 68, "section": "Casting & Splinting", "objective": "Casting & Splinting", "stem": "Condition that may be treated with casting that is NOT a fracture →", "options": [{"letter": "A", "text": "Chronic diabetic foot ulcer"}, {"letter": "B", "text": "Acute gout flare of the ankle"}, {"letter": "C", "text": "Laceration over a joint"}, {"letter": "D", "text": "Septic arthritis of the knee"}], "answer": "A", "explanation": "Casting indications include some congenital deformities (clubfoot) and chronic diabetic foot ulcers (total contact cast); gout, joint infections and lacerations over joints are SPLINT indications."}, {"id": "69", "group": 69, "section": "Vignettes", "objective": "Vignettes", "stem": "20-year-old FOOSH, wrist swelling, tender in the anatomic snuffbox; X-rays are normal → Next step:", "options": [{"letter": "A", "text": "Thumb spica; repeat films in 10–14 days"}, {"letter": "B", "text": "Wrist brace; return only if worse"}, {"letter": "C", "text": "CT today; no immobilization"}, {"letter": "D", "text": "Buddy tape; return as needed"}], "answer": "A", "explanation": "Treat a clinically suspected scaphoid fracture as a fracture even with negative films; MRI is the most sensitive early study."}, {"id": "69a", "group": 69, "section": "Vignettes", "objective": "Vignettes", "stem": "The fracture is at the proximal pole → Main concern:", "options": [{"letter": "A", "text": "Avascular necrosis / nonunion"}, {"letter": "B", "text": "Malunion with shortening"}, {"letter": "C", "text": "Ulnar nerve injury"}, {"letter": "D", "text": "Compartment syndrome"}], "answer": "A", "explanation": "Retrograde blood supply enters distally; proximal-pole fractures have the highest AVN/nonunion rate."}, {"id": "70", "group": 70, "section": "Vignettes", "objective": "Vignettes", "stem": "40-year-old felt a pop jumping; cannot extend the knee; palpable defect ABOVE the patella; lateral X-ray shows the patella sitting LOW → Diagnosis:", "options": [{"letter": "A", "text": "Quadriceps tendon rupture"}, {"letter": "B", "text": "Patellar tendon rupture"}, {"letter": "C", "text": "Patellar fracture"}, {"letter": "D", "text": "Osgood-Schlatter"}], "answer": "A", "explanation": "Suprapatellar defect + patella baja = quadriceps rupture. Patellar tendon rupture → patella alta (high-riding). Treat with knee immobilizer and surgical repair."}, {"id": "71", "group": 71, "section": "Vignettes", "objective": "Vignettes", "stem": "76-year-old lifting furniture, pop, bulge in the distal upper arm, no tendon palpable in the bicipital groove → Deformity and typical management:", "options": [{"letter": "A", "text": "Popeye deformity — nonoperative in the elderly"}, {"letter": "B", "text": "Popeye deformity — urgent surgical repair"}, {"letter": "C", "text": "Reverse Popeye — urgent repair"}, {"letter": "D", "text": "Boutonnière — splinting"}], "answer": "A", "explanation": "Proximal (long head) biceps rupture: Popeye sign; clinical diagnosis (ultrasound/MRI if unsure); Speed's and Yergason's; conservative in older patients, repair in young athletes/distal ruptures."}, {"id": "72", "group": 72, "section": "Vignettes", "objective": "Vignettes", "stem": "Runner with 6–7 weeks of forefoot pain, tender over the 2nd metatarsal, initial X-ray normal → Study that is most sensitive now:", "options": [{"letter": "A", "text": "MRI (or bone scan)"}, {"letter": "B", "text": "CT"}, {"letter": "C", "text": "Repeat plain films in 6 months"}, {"letter": "D", "text": "Ultrasound"}], "answer": "A", "explanation": "Stress fractures: X-rays often negative early, show callus/periosteal reaction at 2–4 weeks; MRI/bone scan detect early."}, {"id": "72a", "group": 72, "section": "Vignettes", "objective": "Vignettes", "stem": "Management of this metatarsal stress fracture →", "options": [{"letter": "A", "text": "Rest from running; hard-soled shoe or boot"}, {"letter": "B", "text": "Open reduction and internal fixation"}, {"letter": "C", "text": "Non-weight-bearing cast for 12 weeks"}, {"letter": "D", "text": "Corticosteroid injection at the site"}], "answer": "A", "explanation": "Activity modification and protected weight-bearing; 5th MT base (Jones) and navicular stress fractures are the exceptions needing stricter NWB/surgery."}, {"id": "73", "group": 73, "section": "Vignettes", "objective": "Vignettes", "stem": "Three terms: natural age-related degeneration of discs/facets; a pars defect; forward slip of one vertebra on another → In order:", "options": [{"letter": "A", "text": "Spondylosis; spondylolysis; spondylolisthesis"}, {"letter": "B", "text": "Spondylolisthesis; spondylosis; spondylolysis"}, {"letter": "C", "text": "Spondylolysis; spondylolisthesis; spondylosis"}, {"letter": "D", "text": "Spondylitis; spondylosis; spondylolysis"}], "answer": "A", "explanation": "Spondyl-OSIS = degeneration; spondyl-OLYSIS = pars fracture; spondyl-OLISTHESIS = slippage. Spondylitis = inflammatory (AS)."}, {"id": "74", "group": 74, "section": "Vignettes", "objective": "Vignettes", "stem": "Finkelstein's test reproduces radial wrist pain → Compartment and tendons involved:", "options": [{"letter": "A", "text": "1st dorsal compartment — APL and EPB"}, {"letter": "B", "text": "2nd dorsal compartment — ECRL and ECRB"}, {"letter": "C", "text": "3rd dorsal compartment — EPL"}, {"letter": "D", "text": "Flexor compartment — FCR"}], "answer": "A", "explanation": "De Quervain's = stenosing tenosynovitis of abductor pollicis longus and extensor pollicis brevis. Treat with thumb spica, NSAIDs, steroid injection."}, {"id": "75", "group": 75, "section": "Vignettes", "objective": "Vignettes", "stem": "Skier felt a pop, immediate swelling, knee feels unstable; Lachman is positive → Best diagnostic imaging:", "options": [{"letter": "A", "text": "MRI of the knee"}, {"letter": "B", "text": "Plain X-rays only"}, {"letter": "C", "text": "CT arthrogram"}, {"letter": "D", "text": "Ultrasound"}], "answer": "A", "explanation": "MRI is sensitive and specific for ACL tears (and associated meniscal injury). X-ray first can show an effusion or Segond fracture."}, {"id": "76", "group": 76, "section": "Vignettes", "objective": "Vignettes", "stem": "30-year-old FOOSH with wrist deformity; X-ray shows the distal radius fragment displaced VOLARLY → Name:", "options": [{"letter": "A", "text": "Smith's fracture"}, {"letter": "B", "text": "Colles fracture"}, {"letter": "C", "text": "Barton's fracture"}, {"letter": "D", "text": "Chauffeur's fracture"}], "answer": "A", "explanation": "Smith's (reverse Colles) = volar/palmar angulation (fall on a FLEXED wrist); Colles = dorsal ('dinner fork')."}, {"id": "76a", "group": 76, "section": "Vignettes", "objective": "Vignettes", "stem": "Nerve most at risk with a displaced distal radius fracture, and where to test it →", "options": [{"letter": "A", "text": "Median — sensation of the index fingertip / thumb opposition"}, {"letter": "B", "text": "Ulnar — sensation of the small finger"}, {"letter": "C", "text": "Radial — sensation of the 1st dorsal web space"}, {"letter": "D", "text": "Anterior interosseous — 'OK' sign"}], "answer": "A", "explanation": "Acute carpal tunnel/median neuropathy is the classic complication; also check ulnar (small finger) and radial (dorsal web) distributions."}, {"id": "76b", "group": 76, "section": "Vignettes", "objective": "Vignettes", "stem": "Injury that often co-exists with a distal radius fracture and is frequently missed →", "options": [{"letter": "A", "text": "DRUJ disruption or ulnar styloid/TFCC injury"}, {"letter": "B", "text": "Perilunate or scaphoid dislocation"}, {"letter": "C", "text": "Boxer's fracture of the 5th metacarpal"}, {"letter": "D", "text": "Mallet finger of the ring finger"}], "answer": "A", "explanation": "Check the distal radioulnar joint and ulnar styloid on every distal radius fracture."}, {"id": "77", "group": 77, "section": "Vignettes", "objective": "Vignettes", "stem": "Patient rolled the ankle on stairs, heard a pop, cannot bear weight, obvious deformity → FIRST exam priority:", "options": [{"letter": "A", "text": "Neurovascular status and skin integrity"}, {"letter": "B", "text": "Anterior drawer of the ankle for ATFL"}, {"letter": "C", "text": "Talar tilt for the calcaneofibular ligament"}, {"letter": "D", "text": "Thompson test for the Achilles tendon"}], "answer": "A", "explanation": "A deformed ankle may be dislocated; document neurovascular status before and after any reduction, and look for open wounds/skin tenting."}, {"id": "78", "group": 78, "section": "Vignettes", "objective": "Vignettes", "stem": "Football player, blow to the OUTSIDE of the knee, medial pain and swelling; valgus stress at 30° gaps → Initial management:", "options": [{"letter": "A", "text": "Hinged knee brace, protected weight-bearing, NSAIDs, PT"}, {"letter": "B", "text": "Immediate ACL reconstruction"}, {"letter": "C", "text": "Knee aspiration and steroid injection"}, {"letter": "D", "text": "Non-weight-bearing cast 8 weeks"}], "answer": "A", "explanation": "Isolated MCL sprains heal with bracing and rehab; surgery is reserved for grade III with other ligament injury. MRI confirms if a large hemarthrosis suggests a cruciate tear."}, {"id": "79", "group": 79, "section": "Vignettes", "objective": "Vignettes", "stem": "Which patient meets Ottawa KNEE rule criteria for an X-ray →", "options": [{"letter": "A", "text": "Age 55 with knee injury"}, {"letter": "B", "text": "Age 30 who can walk 4 steps"}, {"letter": "C", "text": "Tenderness over the medial joint line only"}, {"letter": "D", "text": "Able to flex the knee to 90°"}], "answer": "A", "explanation": "Ottawa knee: age ≥55, isolated patellar tenderness, fibular head tenderness, inability to flex to 90°, or inability to bear weight 4 steps both immediately and in the ED."}, {"id": "80", "group": 80, "section": "Vignettes", "objective": "Vignettes", "stem": "Ankle injury: tender over the posterior edge of the lateral malleolus, able to walk 4 steps → Ottawa ankle rule result:", "options": [{"letter": "A", "text": "X-ray the ankle"}, {"letter": "B", "text": "No imaging"}, {"letter": "C", "text": "X-ray the foot"}, {"letter": "D", "text": "MRI"}], "answer": "A", "explanation": "Ankle series if pain in the malleolar zone AND bone tenderness at the posterior edge/tip of either malleolus OR inability to bear weight 4 steps. Foot series: navicular or 5th MT base tenderness."}, {"id": "81", "group": 81, "section": "Vignettes", "objective": "Vignettes", "stem": "Front-end collision braking hard; dorsal midfoot swelling, pain at the 1st–2nd TMT joints, PLANTAR ecchymosis → Diagnosis and stability:", "options": [{"letter": "A", "text": "Lisfranc injury — unstable, usually operative"}, {"letter": "B", "text": "Jones fracture — stable"}, {"letter": "C", "text": "Midfoot sprain — stable"}, {"letter": "D", "text": "Navicular stress fracture — stable"}], "answer": "A", "explanation": "Plantar midfoot bruising is pathognomonic for Lisfranc injury; weight-bearing films show widening between the 1st and 2nd metatarsal bases ('fleck sign'). Displacement >2 mm → ORIF."}, {"id": "82", "group": 82, "section": "Vignettes", "objective": "Vignettes", "stem": "12-year-old, months of leg pain, night pain, malaise; X-ray: moth-eaten proximal tibia with onion-skin periosteal reaction → Treatment plan:", "options": [{"letter": "A", "text": "Chemotherapy + resection ± radiation"}, {"letter": "B", "text": "Observation with films every 6 months"}, {"letter": "C", "text": "IV then oral antibiotics for 6 weeks"}, {"letter": "D", "text": "Curettage and bone graft of the lesion"}], "answer": "A", "explanation": "Ewing sarcoma (diaphyseal, onion-skin, t(11;22)) — multimodal: neoadjuvant chemo, resection, radiation for unresectable disease; it is radiosensitive, unlike osteosarcoma."}, {"id": "83", "group": 83, "section": "Vignettes", "objective": "Vignettes", "stem": "Posturing: leg shortened, FLEXED, ADDUCTED, internally rotated; vs. arm held ADDUCTED and internally rotated; vs. toddler's arm held pronated and slightly flexed → In order:", "options": [{"letter": "A", "text": "Posterior hip dislocation; posterior shoulder dislocation; nursemaid's elbow"}, {"letter": "B", "text": "Anterior hip dislocation; anterior shoulder dislocation; supracondylar fracture"}, {"letter": "C", "text": "Posterior hip; anterior shoulder; nursemaid's elbow"}, {"letter": "D", "text": "Anterior hip; posterior shoulder; Monteggia"}], "answer": "A", "explanation": "Posterior hip = short/flexed/adducted/IR. Anterior hip = abducted/ER. Anterior shoulder = abducted/ER, squared off. Posterior shoulder = adducted/IR, locked. Nursemaid's = pronated, elbow slightly flexed."}, {"id": "84", "group": 84, "section": "Vignettes", "objective": "Vignettes", "stem": "48-year-old lifted a barrel 13 hours ago, severe back pain radiating to BOTH legs → Finding that most strongly suggests cauda equina:", "options": [{"letter": "A", "text": "Urinary retention with saddle anesthesia"}, {"letter": "B", "text": "Unilateral positive straight-leg raise"}, {"letter": "C", "text": "Back pain that is worse with Valsalva"}, {"letter": "D", "text": "Diminished patellar reflex on one side"}], "answer": "A", "explanation": "Bilateral sciatica + saddle anesthesia + bladder/bowel dysfunction (retention first) + decreased rectal tone = cauda equina → emergent MRI and surgical decompression."}, {"id": "84a", "group": 84, "section": "Vignettes", "objective": "Vignettes", "stem": "Mandatory diagnostic test →", "options": [{"letter": "A", "text": "Emergent MRI of the lumbar spine"}, {"letter": "B", "text": "Lumbar X-rays"}, {"letter": "C", "text": "CT of the lumbar spine without contrast"}, {"letter": "D", "text": "EMG/nerve conduction"}], "answer": "A", "explanation": "MRI (CT myelogram if MRI is contraindicated) — decompression within 24–48 h."}, {"id": "85", "group": 85, "section": "Vignettes", "objective": "Vignettes", "stem": "Fractures discussed in lecture that carry a high risk of avascular necrosis → Correct set:", "options": [{"letter": "A", "text": "Scaphoid, femoral neck, talar neck"}, {"letter": "B", "text": "Clavicle, olecranon, patella"}, {"letter": "C", "text": "Distal radius, metacarpal, fibula"}, {"letter": "D", "text": "Tibial plateau, calcaneus, 5th MT"}], "answer": "A", "explanation": "AVN-prone: scaphoid, femoral head/neck (and hip dislocation), talus, lunate (Kienböck), humeral head; also SCFE/Perthes in kids."}, {"id": "86", "group": 86, "section": "Vignettes", "objective": "Vignettes", "stem": "Pickleball player with lateral elbow pain picking up a water bottle; tender lateral epicondyle, no swelling → Tendon involved and mechanism:", "options": [{"letter": "A", "text": "Extensor carpi radialis brevis — repetitive wrist extension/overuse"}, {"letter": "B", "text": "Flexor carpi radialis — repetitive wrist flexion"}, {"letter": "C", "text": "Biceps — eccentric overload"}, {"letter": "D", "text": "Triceps — direct blow"}], "answer": "A", "explanation": "Lateral epicondylitis = overuse tendinosis of the common extensor origin (ECRB). Tests: Cozen's, Mill's, resisted middle-finger extension."}, {"id": "87", "group": 87, "section": "Vignettes", "objective": "Vignettes", "stem": "Match: sunburst + Codman triangle, teen distal femur / onion-skin diaphysis, child / soap-bubble epiphysis, young adult / cortical lesion with sclerotic rim, child →", "options": [{"letter": "A", "text": "Osteosarcoma / Ewing / giant cell tumor / non-ossifying fibroma"}, {"letter": "B", "text": "Ewing / osteosarcoma / enchondroma / GCT"}, {"letter": "C", "text": "GCT / osteosarcoma / Ewing / osteochondroma"}, {"letter": "D", "text": "Osteosarcoma / chondrosarcoma / UBC / Ewing"}], "answer": "A", "explanation": "Key terms: sunburst/Codman = osteosarcoma; onion-skin = Ewing; soap-bubble epiphyseal = GCT; cortical sclerotic-rim = NOF; fallen leaf = UBC; cartilage cap = osteochondroma; stippled hand = enchondroma; nidus + sclerosis = osteoid osteoma."}, {"id": "88", "group": 88, "section": "Vignettes", "objective": "Vignettes", "stem": "4-year-old playing 'helicopter', now holds the arm pronated and slightly flexed, no swelling → Treatment:", "options": [{"letter": "A", "text": "Supination-flexion reduction; no imaging"}, {"letter": "B", "text": "X-ray, then long-arm cast for 3 weeks"}, {"letter": "C", "text": "Sling for 3 weeks, then repeat films"}, {"letter": "D", "text": "Urgent orthopedic referral for ORIF"}], "answer": "A", "explanation": "Nursemaid's elbow = radial head subluxation through the annular ligament. Reduce at bedside; the child uses the arm within minutes. No immobilization needed."}, {"id": "89", "group": 89, "section": "Vignettes", "objective": "Vignettes", "stem": "Most common organism in osteomyelitis and septic arthritis overall; and the organism to add in a sexually active young adult with a migratory arthritis →", "options": [{"letter": "A", "text": "Staphylococcus aureus; Neisseria gonorrhoeae"}, {"letter": "B", "text": "Streptococcus pyogenes; E. coli"}, {"letter": "C", "text": "Pseudomonas; Salmonella"}, {"letter": "D", "text": "Kingella; Borrelia"}], "answer": "A", "explanation": "S. aureus overall; gonococcus in sexually active adults; Salmonella in sickle cell; Pseudomonas after a puncture through a shoe; Kingella in young children; Pasteurella after cat/dog bites."}, {"id": "90", "group": 90, "section": "Vignettes", "objective": "Vignettes", "stem": "Synovial fluid result most consistent with a SEPTIC joint →", "options": [{"letter": "A", "text": "WBC >50,000/µL with >75% neutrophils, low glucose, positive Gram stain/culture"}, {"letter": "B", "text": "WBC 2,000–50,000 with negatively birefringent crystals"}, {"letter": "C", "text": "WBC <2,000, clear, viscous"}, {"letter": "D", "text": "Bloody fluid with fat globules"}], "answer": "A", "explanation": "Septic: >50k (often >100k) PMN-predominant, glucose low, culture positive. Inflammatory (gout/RA): 2–50k. Non-inflammatory (OA): <2k. Fat globules = intra-articular fracture."}, {"id": "91", "group": 91, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "X-ray shows 'sunburst' periosteal reaction and a Codman triangle at a teenager's distal femoral metaphysis. Biopsy is planned. Which staging study must be obtained because of where this tumor spreads first →", "options": [{"letter": "A", "text": "CT of the chest"}, {"letter": "B", "text": "Bone marrow biopsy"}, {"letter": "C", "text": "PET-CT of the abdomen"}, {"letter": "D", "text": "Lumbar puncture"}], "answer": "A", "explanation": "Osteosarcoma metastasizes hematogenously to the LUNGS → chest CT; MRI of the whole bone defines local extent and skip lesions.", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAJMAbMDASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAAAAECAwQFBgcICf/EAEcQAAEDAwIEBAQEBAUDAwIFBQEAAgMEBRESIQYTMUEHIlFhFDJxkSMzUoEIFRZCJFVicqE0scElQ0U14Rc3gtHwOHWSs8L/xAAUAQEAAAAAAAAAAAAAAAAAAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8A8Ibxpfnt1fzGYZPQFL/WN+/zGb7rDh/KanoNn+sb9/mM33R/WN+/zGb7rGQg2f6xv3+YzfdH9Y37/MZvusbdOYx0jg1jS4+gCDX/AKxv3+YzZ+qVnF3EEpwy4TOJUFNZJHDVOdA/T3V9lPHA0iNuB6oGy8S8QwsD33OTfsDuof6wv3+ZTfdUri/zhn7qog2Bxhfv8xl+6cOLb8f/AJOQfUrFSZQb7eJ7+7/5V+D7qdl74hfGX/zkBo9XFc6yTB3Uj6guboHyZQbcfEPEEgP/AKxg+5KeL5f8b3sf/wCRWAJdWBndOfK0EAdkG26/8QNbq/nQP7lVXcXX5pI/mch+hWVJNk5Cj6oNkcX37Gf5lL909nFN+ewuF1eB6ErGLDoJAOAgHDWkfug6Wou/EVPAJjexICPlYTlUDxhfun8yl+6ssp3TwMcOhas+os0jWuewjbsgsN4
