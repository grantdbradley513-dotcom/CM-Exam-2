ceps with a diminished triceps reflex and middle-finger numbness →", "options": [{"letter": "A", "text": "C6; C7"}, {"letter": "B", "text": "C5; C6"}, {"letter": "C", "text": "C7; C8"}, {"letter": "D", "text": "C6; C8"}], "answer": "A", "explanation": "C5 = deltoid/biceps reflex; C6 = biceps/wrist extensors, brachioradialis reflex, thumb; C7 = triceps, middle finger; C8 = finger flexors, small finger."}, {"id": "106", "group": 106, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Raising the UNaffected leg reproduces pain in the affected leg → Test and what it adds:", "options": [{"letter": "A", "text": "Crossed SLR — more specific for disc herniation"}, {"letter": "B", "text": "Ipsilateral SLR — more sensitive"}, {"letter": "C", "text": "Hoover — malingering"}, {"letter": "D", "text": "FABER — SI joint"}], "answer": "A", "explanation": "Crossed (contralateral) SLR is less sensitive but much more specific for a herniated disc."}, {"id": "107", "group": 107, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Teen gymnast with extension-provoked low back pain; the pars defect has allowed L5 to slip 60% on S1 → Meyerding grade:", "options": [{"letter": "A", "text": "Grade III"}, {"letter": "B", "text": "Grade II"}, {"letter": "C", "text": "Grade I"}, {"letter": "D", "text": "Grade IV"}], "answer": "A", "explanation": "Grade I 0–25%, II 26–50%, III 51–75%, IV 76–100%, V = spondyloptosis."}, {"id": "108", "group": 108, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "IV drug user with 3 weeks of back pain, fever, and point tenderness at L3 → First test and most likely organism:", "options": [{"letter": "A", "text": "MRI with contrast; Staphylococcus aureus"}, {"letter": "B", "text": "Lumbar X-ray; Pseudomonas aeruginosa"}, {"letter": "C", "text": "CT without contrast; Salmonella species"}, {"letter": "D", "text": "Bone scan; Streptococcus pyogenes"}], "answer": "A", "explanation": "Vertebral osteomyelitis/discitis: MRI with gadolinium is the study of choice; S. aureus most common (Pseudomonas classic in IVDU but still less common than Staph). Blood cultures/biopsy guide therapy."}, {"id": "109", "group": 109, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Skier's thumb with the torn UCL flipped superficial to the adductor aponeurosis on MRI → Name of this finding and why it changes management:", "options": [{"letter": "A", "text": "Stener lesion — requires surgical repair"}, {"letter": "B", "text": "Bennett lesion — thumb spica cast only"}, {"letter": "C", "text": "Rolando lesion — percutaneous pinning"}, {"letter": "D", "text": "Boutonnière lesion — extension splint"}], "answer": "A", "explanation": "Stener lesion: the aponeurosis blocks the ligament from reaching its insertion → surgery. Partial tears without Stener → thumb spica 4–6 weeks."}, {"id": "110", "group": 110, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Painless hard bump at the distal femur for a year; X-ray shows a pedunculated exostosis pointing away from the joint → When would you operate →", "options": [{"letter": "A", "text": "Pain, growth after maturity, or nerve/vessel compression"}, {"letter": "B", "text": "Always, because malignant change is common"}, {"letter": "C", "text": "Never — osteochondromas are left alone"}, {"letter": "D", "text": "Only when it occurs in the hand or foot"}], "answer": "A", "explanation": "Osteochondroma: observation; excise for symptoms, growth after maturity, or a cartilage cap >2 cm (chondrosarcoma concern)."}, {"id": "111", "group": 111, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Eccentric lytic epiphyseal lesion reaching the subchondral bone in a 34-year-old → Treatment:", "options": [{"letter": "A", "text": "Curettage with adjuvant ± bone graft"}, {"letter": "B", "text": "Chemotherapy followed by amputation"}, {"letter": "C", "text": "Observation with serial radiographs"}, {"letter": "D", "text": "External-beam radiation alone"}], "answer": "A", "explanation": "Giant cell tumor is benign but locally aggressive with high recurrence; curettage + adjuvant; denosumab for unresectable; check chest (rare benign lung mets)."}, {"id": "112", "group": 112, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Inversion ankle sprain; the examiner cups the heel and pulls the foot forward with excessive translation → Ligament and grade concept:", "options": [{"letter": "A", "text": "ATFL — laxity without end-feel"}, {"letter": "B", "text": "CFL — pain without laxity"}, {"letter": "C", "text": "Deltoid — medial gapping"}, {"letter": "D", "text": "Syndesmosis — pain with squeeze"}], "answer": "A", "explanation": "Ankle anterior drawer isolates the ATFL (first ligament torn in inversion/plantarflexion). Talar tilt adds the CFL."}, {"id": "113", "group": 113, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Young athlete with complete Achilles rupture → Preferred definitive management and the trade-off:", "options": [{"letter": "A", "text": "Surgical repair — lower re-rupture rate"}, {"letter": "B", "text": "Cast in dorsiflexion — faster return to play"}, {"letter": "C", "text": "Walking boot in neutral — equal outcomes"}, {"letter": "D", "text": "Steroid injection — reduces tendon pain"}], "answer": "A", "explanation": "Athletes/young → operative repair (re-rupture ~2–5% vs ~10% nonoperative); nonoperative = functional bracing in plantarflexion for older/sedentary patients."}, {"id": "114", "group": 114, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Night-stick injury: proximal ulna fracture with radial head dislocation → Nerve at risk and the deficit:", "options": [{"letter": "A", "text": "Posterior interosseous — finger drop, no sensory loss"}, {"letter": "B", "text": "Median — thenar weakness, palmar numbness"}, {"letter": "C", "text": "Ulnar — claw hand, small-finger numbness"}, {"letter": "D", "text": "Axillary — deltoid weakness, lateral arm numbness"}], "answer": "A", "explanation": "Monteggia: the dislocated radial head stretches the PIN (deep radial branch) → finger drop, sensation spared (superficial radial intact)."}, {"id": "115", "group": 115, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "6-year-old boy, painless limp, limited abduction/IR; X-ray shows a flattened, fragmented femoral head → Management goal and first step:", "options": [{"letter": "A", "text": "Containment — activity restriction, PT, bracing"}, {"letter": "B", "text": "In-situ screw pinning of the epiphysis"}, {"letter": "C", "text": "Pavlik harness and ultrasound follow-up"}, {"letter": "D", "text": "Core decompression of the femoral head"}], "answer": "A", "explanation": "Legg-Calvé-Perthes: keep the head contained in the acetabulum while it revascularizes; surgery (osteotomy) for older children/severe disease. Pinning = SCFE; Pavlik = DDH."}, {"id": "116", "group": 116, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Postpartum woman with radial-sided wrist pain and a positive Finkelstein's → Initial management:", "options": [{"letter": "A", "text": "Thumb spica and NSAIDs; injection if persistent"}, {"letter": "B", "text": "Carpal tunnel release; night splints after"}, {"letter": "C", "text": "Ulnar gutter splint; NSAIDs for 2 weeks"}, {"letter": "D", "text": "Buddy taping; activity modification"}], "answer": "A", "explanation": "De Quervain's: thumb spica + NSAIDs → corticosteroid injection into the 1st dorsal compartment → surgical release if refractory."}, {"id": "117", "group": 117, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Diabetic woman with a shoulder that lacks BOTH active and passive motion → Labs to consider and treatment mainstay:", "options": [{"letter": "A", "text": "A1c and TSH; physical therapy ± steroid injection"}, {"letter": "B", "text": "ESR and CRP; IV antibiotics and washout"}, {"letter": "C", "text": "RF and anti-CCP; methotrexate and PT"}, {"letter": "D", "text": "Uric acid; colchicine and NSAIDs"}], "answer": "A", "explanation": "Adhesive capsulitis is associated with diabetes and thyroid disease; it is self-limited over 1–3 years — PT, NSAIDs, steroid injection; manipulation/arthroscopic release if refractory."}, {"id": "118", "group": 118, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Swimmer with painful arc, positive Neer and Hawkins → Mainstay of treatment and the structure most often inflamed:", "options": [{"letter": "A", "text": "PT (scapular/rotator cuff strengthening) + NSAIDs; supraspinatus tendon"}, {"letter": "B", "text": "Arthroscopic acromioplasty first; subscapularis"}, {"letter": "C", "text": "Sling immobilization; biceps"}, {"letter": "D", "text": "Steroid injection only; teres minor"}], "answer": "A", "explanation": "Impingement: conservative first — PT, NSAIDs, activity modification, subacromial steroid injection; surgery if refractory. Supraspinatus passes under the acromion."}, {"id": "119", "group": 119, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Closed midshaft humeral shaft fracture, neurovascularly intact → Initial management and the nerve to document:", "options": [{"letter": "A", "text": "Coaptation (sugar-tong) splint + sling; radial nerve"}, {"letter": "B", "text": "ORIF; ulnar nerve"}, {"letter": "C", "text": "Hanging arm cast; median nerve"}, {"letter": "D", "text": "Shoulder immobilizer; axillary nerve"}], "answer": "A", "explanation": "Most humeral shaft fractures heal nonoperatively (coaptation splint → functional brace). Radial nerve runs in the spiral groove — wrist drop."}, {"id": "120", "group": 120, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Steroid-using patient with hip pain; MRI shows early osteonecrosis WITHOUT femoral head collapse → Joint-preserving option:", "options": [{"letter": "A", "text": "Core decompression"}, {"letter": "B", "text": "Total hip arthroplasty"}, {"letter": "C", "text": "Hemiarthroplasty"}, {"letter": "D", "text": "Hip arthroscopy and labral repair"}], "answer": "A", "explanation": "Pre-collapse AVN → core decompression (± bone graft); post-collapse → arthroplasty."}, {"id": "121", "group": 121, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Patient jumped from a wall onto extended legs; tense knee hemarthrosis; AP film looks normal → Next study and why:", "options": [{"letter": "A", "text": "CT of the knee — occult plateau fracture"}, {"letter": "B", "text": "MRI of the knee — meniscal tear"}, {"letter": "C", "text": "Repeat X-ray in 2 weeks — occult fracture"}, {"letter": "D", "text": "Ultrasound of the knee — effusion"}], "answer": "A", "explanation": "Axial loading + hemarthrosis (fat globules on aspiration) = tibial plateau fracture until proven otherwise; CT shows depression and guides surgery."}, {"id": "122", "group": 122, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Boxer's fracture: the fingers overlap toward the thumb when the patient makes a fist → Finding and significance:", "options": [{"letter": "A", "text": "Rotational malalignment — must be corrected"}, {"letter": "B", "text": "Dorsal angulation — acceptable to 40°"}, {"letter": "C", "text": "Normal physiologic finger scissoring"}, {"letter": "D", "text": "Extensor tendon rupture — surgical repair"}], "answer": "A", "explanation": "Up to ~40° of apex-dorsal angulation is tolerated at the 5th MC neck, but ANY rotational deformity (scissoring) requires correction."}, {"id": "123", "group": 123, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Lisfranc injury with 3 mm of displacement on weight-bearing films → Management:", "options": [{"letter": "A", "text": "ORIF (or primary arthrodesis)"}, {"letter": "B", "text": "Hard shoe and weight-bearing as tolerated"}, {"letter": "C", "text": "Non-weight-bearing cast 6 weeks"}, {"letter": "D", "text": "Stirrup splint"}], "answer": "A", "explanation": "Displacement >2 mm or any instability → operative; truly non-displaced, stable injuries → NWB cast 6 weeks."}, {"id": "124", "group": 124, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Teen with nocturnal tibial pain relieved by aspirin; X-ray suggests a small lucent nidus with dense sclerosis → Study to confirm and the mediator of the pain:", "options": [{"letter": "A", "text": "Thin-cut CT; prostaglandins"}, {"letter": "B", "text": "MRI; bradykinin"}, {"letter": "C", "text": "Bone scan; substance P"}, {"letter": "D", "text": "Ultrasound; histamine"}], "answer": "A", "explanation": "Osteoid osteoma: CT best shows the nidus; the nidus secretes prostaglandins (hence the dramatic NSAID response). Treat with NSAIDs or RF ablation."}, {"id": "125", "group": 125, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Growing 12-year-old girl with a 32° Cobb angle; vs. a skeletally mature patient with 15°; vs. a growing child with 50° → Management in order:", "options": [{"letter": "A", "text": "Bracing; observation; surgery"}, {"letter": "B", "text": "Observation; bracing; surgery"}, {"letter": "C", "text": "Surgery; observation; bracing"}, {"letter": "D", "text": "Bracing; bracing; observation"}], "answer": "A", "explanation": "<20–25° observe (any ≥10° = scoliosis); 25–40/45° brace if still growing; >45–50° surgical fusion."}, {"id": "126", "group": 126, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Sexually active 22-year-old with a hot, swollen knee, migratory arthralgias and pustular skin lesions → Empiric treatment:", "options": [{"letter": "A", "text": "Ceftriaxone plus doxycycline"}, {"letter": "B", "text": "Vancomycin plus rifampin"}, {"letter": "C", "text": "Amoxicillin-clavulanate orally"}, {"letter": "D", "text": "Prednisone plus colchicine"}], "answer": "A", "explanation": "Disseminated gonococcal infection → IV ceftriaxone; add doxycycline for concomitant chlamydia. Non-gonococcal septic joint → vancomycin ± anti-pseudomonal coverage, surgical washout."}, {"id": "127", "group": 127, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "3-week-old breech first-born girl with a hip 'clunk' on Ortolani → Imaging and first treatment:", "options": [{"letter": "A", "text": "Ultrasound of the hips; Pavlik harness"}, {"letter": "B", "text": "AP pelvis X-ray; spica cast"}, {"letter": "C", "text": "MRI; closed reduction"}, {"letter": "D", "text": "CT; observation"}], "answer": "A", "explanation": "Before ~4–6 months the femoral head is unossified → ultrasound; Pavlik harness (<6 months), closed/open reduction + spica cast later."}, {"id": "128", "group": 128, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Elderly woman with a shortened, externally rotated leg after a fall → Initial imaging; and the study if films are negative but she cannot bear weight →", "options": [{"letter": "A", "text": "AP pelvis + AP/cross-table lateral hip; MRI"}, {"letter": "B", "text": "CT pelvis; bone scan"}, {"letter": "C", "text": "Lateral hip only; ultrasound"}, {"letter": "D", "text": "Frog-leg views only; repeat X-ray in 1 week"}], "answer": "A", "explanation": "Standard hip trauma series first; occult femoral neck fracture → MRI (most sensitive), CT if MRI unavailable."}, {"id": "129", "group": 129, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Jammed fingertip, DIP rests in 45° flexion, cannot actively extend → Treatment and the mistake to avoid:", "options": [{"letter": "A", "text": "Continuous DIP extension splint 6–8 weeks"}, {"letter": "B", "text": "Buddy tape to the adjacent finger 2 weeks"}, {"letter": "C", "text": "Immediate surgical repair in every case"}, {"letter": "D", "text": "Volar splint with the DIP in flexion"}], "answer": "A", "explanation": "Mallet finger: strict uninterrupted extension splinting; surgery if a large bony fragment with DIP subluxation."}, {"id": "130", "group": 130, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Linebacker's planted foot forcefully externally rotated; pain ABOVE the ankle, worse with Kleiger's test → Injury; and management if the mortise shows widened tibiofibular clear space →", "options": [{"letter": "A", "text": "Syndesmotic sprain; screw or suture-button fixation"}, {"letter": "B", "text": "Lateral ankle sprain; stirrup splint and PT"}, {"letter": "C", "text": "Deltoid sprain; walking boot for 4 weeks"}, {"letter": "D", "text": "Achilles tear; open surgical repair"}], "answer": "A", "explanation": "Syndesmosis injury = external rotation/dorsiflexion mechanism, squeeze test and Kleiger's positive; stable → boot NWB; unstable (diastasis) → surgical fixation."}, {"id": "131", "group": 131, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Distal radius fracture with DORSAL displacement and 'dinner-fork' deformity → Name, and the typical patient:", "options": [{"letter": "A", "text": "Colles — osteoporotic woman after FOOSH on an extended wrist"}, {"letter": "B", "text": "Smith's — young man after a fall on a flexed wrist"}, {"letter": "C", "text": "Barton's — intra-articular shear"}, {"letter": "D", "text": "Galeazzi — radial shaft with DRUJ"}], "answer": "A", "explanation": "Colles = dorsal angulation, most common wrist fracture; Smith's = volar; Barton's = intra-articular rim with carpal subluxation."}, {"id": "132", "group": 132, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Which Cobb angle DEFINES scoliosis →", "options": [{"letter": "A", "text": ">10°"}, {"letter": "B", "text": ">25°"}, {"letter": "C", "text": ">40°"}, {"letter": "D", "text": ">5°"}], "answer": "A", "explanation": "Scoliosis = coronal curvature with a Cobb angle greater than 10° (with rotation)."}, {"id": "133", "group": 133, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Quadriceps tendon rupture is suspected — what does the lateral X-ray typically show →", "options": [{"letter": "A", "text": "Patella baja with a suprapatellar defect"}, {"letter": "B", "text": "Patella alta with an infrapatellar defect"}, {"letter": "C", "text": "Segond fragment off the lateral tibia"}, {"letter": "D", "text": "Avulsion of the tibial tubercle"}], "answer": "A", "explanation": "Quad rupture: patella pulled DOWN by the intact patellar tendon (baja). Patellar tendon rupture: patella pulled UP (alta)."}, {"id": "134", "group": 134, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "FOOSH, elbow pain and swelling, limited supination/pronation; lateral elbow shows an anterior 'sail sign' and a posterior fat pad in an ADULT → Most likely diagnosis:", "options": [{"letter": "A", "text": "Radial head fracture"}, {"letter": "B", "text": "Supracondylar fracture"}, {"letter": "C", "text": "Olecranon fracture"}, {"letter": "D", "text": "Elbow dislocation"}], "answer": "A", "explanation": "Fat pads = occult fracture: in adults usually radial head; in children supracondylar."}, {"id": "134a", "group": 134, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Non-displaced radial head fracture → Management:", "options": [{"letter": "A", "text": "Sling and early range of motion"}, {"letter": "B", "text": "Long-arm cast for 6 weeks"}, {"letter": "C", "text": "Open reduction and internal fixation"}, {"letter": "D", "text": "Radial head excision"}], "answer": "A", "explanation": "Mason type I → brief sling and early motion to prevent stiffness."}, {"id": "135", "group": 135, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Young adult with hip/thigh pain worse at night, relieved by NSAIDs; imaging shows an osteoid osteoma → Besides NSAIDs, definitive minimally invasive option:", "options": [{"letter": "A", "text": "CT-guided radiofrequency ablation"}, {"letter": "B", "text": "Chemotherapy"}, {"letter": "C", "text": "Wide resection"}, {"letter": "D", "text": "Radiation"}], "answer": "A", "explanation": "RFA of the nidus is the standard definitive treatment when NSAIDs are insufficient."}, {"id": "136", "group": 136, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Proximal (long-head) biceps rupture in an older adult → Management and what deficit remains:", "options": [{"letter": "A", "text": "Conservative — minor strength loss, cosmetic bulge"}, {"letter": "B", "text": "Urgent tenodesis — otherwise 50% strength loss"}, {"letter": "C", "text": "Cast in flexion 6 weeks — tendon reattaches"}, {"letter": "D", "text": "Steroid injection — restores tendon function"}], "answer": "A", "explanation": "Long-head rupture loses ~10–20% supination/flexion strength; treat nonoperatively in older patients; distal ruptures need repair."}, {"id": "137", "group": 137, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Which shoulder tests evaluate the biceps tendon →", "options": [{"letter": "A", "text": "Speed's and Yergason's"}, {"letter": "B", "text": "Neer and Hawkins"}, {"letter": "C", "text": "Drop arm and empty can"}, {"letter": "D", "text": "Sulcus and apprehension"}], "answer": "A", "explanation": "Speed's = resisted shoulder flexion with supinated arm; Yergason's = resisted supination with elbow at 90° → bicipital groove pain."}, {"id": "138", "group": 138, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Runner with 2nd metatarsal tenderness; X-ray 3 weeks later shows periosteal reaction → Why was the first film normal →", "options": [{"letter": "A", "text": "Callus takes 2–4 weeks to appear on film"}, {"letter": "B", "text": "The wrong radiographic view was obtained"}, {"letter": "C", "text": "It was a soft-tissue injury that calcified"}, {"letter": "D", "text": "The fracture had already healed completely"}], "answer": "A", "explanation": "Early stress fractures are radiographically occult; repeat films or MRI/bone scan."}, {"id": "139", "group": 139, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Suspected SCFE → X-ray views; and definitive treatment →", "options": [{"letter": "A", "text": "AP and frog-leg lateral of BOTH hips; percutaneous in-situ screw"}, {"letter": "B", "text": "Single AP of the affected hip; Pavlik harness"}, {"letter": "C", "text": "Judet views; closed reduction and spica"}, {"letter": "D", "text": "CT; core decompression"}], "answer": "A", "explanation": "Bilateral views (slip is bilateral in ~20–40%); Klein's line on AP, frog-leg shows the slip best; pin in situ without reduction."}, {"id": "140", "group": 140, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Patient with a suspected posterior shoulder dislocation after a seizure; AP looks 'nearly normal' → View that confirms it:", "options": [{"letter": "A", "text": "Axillary lateral (or scapular Y)"}, {"letter": "B", "text": "Grashey AP"}, {"letter": "C", "text": "Zanca"}, {"letter": "D", "text": "Stryker notch"}], "answer": "A", "explanation": "Posterior dislocations are missed on AP (lightbulb sign is subtle); the axillary view shows the head behind the glenoid."}, {"id": "141", "group": 141, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Hip dislocation without fracture → Why reduce within 6 (max 12) hours →", "options": [{"letter": "A", "text": "AVN risk rises sharply with delay"}, {"letter": "B", "text": "To prevent sciatic nerve regeneration"}, {"letter": "C", "text": "To allow early weight-bearing"}, {"letter": "D", "text": "Dislocations are irreducible after 2 hours"}], "answer": "A", "explanation": "Early reduction protects the femoral head's blood supply; sciatic nerve injury is checked before/after reduction."}, {"id": "142", "group": 142, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Fracture at the metaphyseal–diaphyseal junction of the 5th metatarsal → Name and management:", "options": [{"letter": "A", "text": "Jones fracture — non-weight-bearing cast or screw"}, {"letter": "B", "text": "Avulsion fracture — hard shoe, weight-bearing"}, {"letter": "C", "text": "Dancer's fracture — walking boot, weight-bearing"}, {"letter": "D", "text": "Lisfranc injury — ORIF of the TMT joints"}], "answer": "A", "explanation": "Jones fractures lie in a watershed zone → nonunion risk → NWB cast or early screw; base avulsion fractures (peroneus brevis) heal with a hard shoe."}, {"id": "143", "group": 143, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Ankle sprain with a pop, instability, and tenderness BEHIND the lateral malleolus; the tendon snaps over the fibula with eversion → Diagnosis:", "options": [{"letter": "A", "text": "Peroneal tendon subluxation/injury"}, {"letter": "B", "text": "ATFL sprain"}, {"letter": "C", "text": "Achilles rupture"}, {"letter": "D", "text": "Os trigonum"}], "answer": "A", "explanation": "Retromalleolar tenderness and snapping = peroneal tendon injury (superior retinaculum). ATFL tenderness is anterior/inferior to the lateral malleolus."}, {"id": "144", "group": 144, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Stiff, painful great-toe MTP with dorsal osteophytes and limited dorsiflexion → Diagnosis and initial treatment:", "options": [{"letter": "A", "text": "Hallux rigidus — stiff-soled shoe, NSAIDs"}, {"letter": "B", "text": "Hallux valgus — wide toe-box shoe, padding"}, {"letter": "C", "text": "Turf toe — taping and rest from sport"}, {"letter": "D", "text": "Gout — colchicine and urate lowering"}], "answer": "A", "explanation": "Hallux rigidus = degenerative OA of the 1st MTP; cheilectomy or fusion if refractory."}, {"id": "145", "group": 145, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Anterolateral thigh burning/numbness with normal strength and reflexes in a patient who wears a tight tool belt → Diagnosis, nerve, and treatment:", "options": [{"letter": "A", "text": "Meralgia paresthetica — lateral femoral cutaneous — remove compression"}, {"letter": "B", "text": "L3 radiculopathy — femoral root — MRI of the lumbar spine"}, {"letter": "C", "text": "Femoral neuropathy — femoral nerve — EMG and nerve conduction"}, {"letter": "D", "text": "Trochanteric bursitis — no nerve — corticosteroid injection"}], "answer": "A", "explanation": "Pure sensory mononeuropathy from compression at the inguinal ligament; loosen belts, weight loss; injection or decompression if refractory."}, {"id": "146", "group": 146, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Intra-articular fracture-dislocation at the base of the 1st metacarpal with the volar fragment still attached to the trapezium → Name and why it needs fixation:", "options": [{"letter": "A", "text": "Bennett's — APL pulls the shaft, destabilizing the joint"}, {"letter": "B", "text": "Rolando's — comminution makes casting impossible"}, {"letter": "C", "text": "Boxer's — rotational deformity blocks fist closure"}, {"letter": "D", "text": "Gamekeeper's — ligament retracts above the aponeurosis"}], "answer": "A", "explanation": "Bennett's: unstable because of the APL pull → closed reduction with percutaneous pinning or ORIF."}, {"id": "147", "group": 147, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "ACL tear in a pivoting athlete → Meniscus more commonly torn ACUTELY with the ACL; and the one torn in CHRONIC ACL deficiency →", "options": [{"letter": "A", "text": "Lateral; medial"}, {"letter": "B", "text": "Medial; lateral"}, {"letter": "C", "text": "Both equally"}, {"letter": "D", "text": "Neither"}], "answer": "A", "explanation": "Acute ACL → lateral meniscus; chronic ACL-deficient knee → medial meniscus (and the classic 'unhappy triad' names the medial)."}, {"id": "148", "group": 148, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Corticosteroid injection is relatively contraindicated around which structure because of rupture risk →", "options": [{"letter": "A", "text": "Achilles / patellar tendon"}, {"letter": "B", "text": "Subacromial bursa"}, {"letter": "C", "text": "Greater trochanteric bursa"}, {"letter": "D", "text": "Knee joint"}], "answer": "A", "explanation": "Weight-bearing tendons (Achilles, patellar) — rupture. Also avoid repeated intra-articular injections (cartilage damage, >3–4/year)."}, {"id": "149", "group": 149, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Open distal radius fracture needing reduction → Anesthesia technique to AVOID and why:", "options": [{"letter": "A", "text": "Hematoma block — seeds the open fracture"}, {"letter": "B", "text": "Bier block — causes prolonged limb ischemia"}, {"letter": "C", "text": "Procedural sedation — risks aspiration"}, {"letter": "D", "text": "Regional nerve block — risks nerve injury"}], "answer": "A", "explanation": "Hematoma blocks are for CLOSED fractures; open fractures get IV antibiotics, tetanus, and OR debridement."}, {"id": "150", "group": 150, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Hot, red, fluctuant swelling over the olecranon with full, painless elbow ROM → Next step and the finding that would instead suggest septic ARTHRITIS:", "options": [{"letter": "A", "text": "Aspirate the bursa; painful limited joint motion"}, {"letter": "B", "text": "Start IV vancomycin; fever above 38.5 °C"}, {"letter": "C", "text": "Inject corticosteroid; swelling over the joint"}, {"letter": "D", "text": "Splint and NSAIDs; erythema over the elbow"}], "answer": "A", "explanation": "Bursitis spares joint motion; septic arthritis causes severe pain with any ROM. Bursal fluid WBC >1,000–2,000 with organisms = septic bursitis."}, {"id": "151", "group": 151, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Older Northern-European man with palmar cords and a positive tabletop test → Treatment options:", "options": [{"letter": "A", "text": "Collagenase, needle aponeurotomy, or fasciectomy"}, {"letter": "B", "text": "Corticosteroid injection and night splinting"}, {"letter": "C", "text": "Carpal tunnel release and tendon gliding"}, {"letter": "D", "text": "Tendon transfer and dynamic splinting"}], "answer": "A", "explanation": "Dupuytren's: observation if mild; intervention for functional contracture (MCP >30°, any PIP contracture)."}, {"id": "152", "group": 152, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Inversion + plantarflexion ankle roll → Order in which the lateral ligaments tear:", "options": [{"letter": "A", "text": "ATFL → CFL → PTFL"}, {"letter": "B", "text": "CFL → ATFL → PTFL"}, {"letter": "C", "text": "PTFL → CFL → ATFL"}, {"letter": "D", "text": "Deltoid → ATFL → CFL"}], "answer": "A", "explanation": "Anterior talofibular first (weakest, taut in plantarflexion), then calcaneofibular, rarely posterior talofibular."}, {"id": "153", "group": 153, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "With hips and knees flexed to 90°, the tibial tubercle sits visibly lower on one side → Sign and ligament:", "options": [{"letter": "A", "text": "Posterior sag (Godfrey) sign — PCL"}, {"letter": "B", "text": "Anterior drawer — ACL"}, {"letter": "C", "text": "Lachman — ACL"}, {"letter": "D", "text": "Pivot shift — ACL"}], "answer": "A", "explanation": "Posterior sag = PCL tear (dashboard injury or fall on a flexed knee); confirm with posterior drawer."}, {"id": "154", "group": 154, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Obese 12-year-old with knee pain and a NORMAL knee exam → Next step:", "options": [{"letter": "A", "text": "Image the hips (AP and frog-leg)"}, {"letter": "B", "text": "MRI of the knee for a meniscal tear"}, {"letter": "C", "text": "Reassure — growing pains are likely"}, {"letter": "D", "text": "Knee X-rays and return in 6 weeks"}], "answer": "A", "explanation": "Hip pathology (SCFE, Perthes) refers to the knee via the obturator nerve; a normal knee exam in a child with knee pain = look at the hip."}, {"id": "155", "group": 155, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Infant with DDH diagnosed at 2 months → First treatment; and treatment if diagnosed at 10 months →", "options": [{"letter": "A", "text": "Pavlik harness; closed reduction and spica cast"}, {"letter": "B", "text": "Spica cast; Pavlik harness at night only"}, {"letter": "C", "text": "Observation; Pavlik harness if still unstable"}, {"letter": "D", "text": "Pelvic osteotomy; Pavlik harness afterward"}], "answer": "A", "explanation": "Pavlik works while the hip is reducible and the child is <6 months; after that, reduction under anesthesia + spica; osteotomies after ~18 months."}, {"id": "156", "group": 156, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Chronic infection of a total knee arthroplasty → Gold-standard surgical strategy:", "options": [{"letter": "A", "text": "Two-stage exchange with an antibiotic spacer"}, {"letter": "B", "text": "Lifelong suppressive oral antibiotics alone"}, {"letter": "C", "text": "Single arthroscopic washout and antibiotics"}, {"letter": "D", "text": "Above-knee amputation and prosthesis"}], "answer": "A", "explanation": "Chronic prosthetic joint infection → two-stage revision; acute (<3 weeks) may be treated with debridement, antibiotics and implant retention (DAIR)."}, {"id": "157", "group": 157, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Ankle injury: tenderness only over the ATFL, no malleolar bone tenderness, walked 4 steps → Decision and the two foot zones that WOULD require a foot series:", "options": [{"letter": "A", "text": "No X-ray; navicular and 5th MT base"}, {"letter": "B", "text": "Ankle X-ray; heel and 1st MT head"}, {"letter": "C", "text": "Foot X-ray; cuboid and talar neck"}, {"letter": "D", "text": "MRI; calcaneus and talar dome"}], "answer": "A", "explanation": "Ottawa: ligament tenderness alone does not trigger imaging; foot series for navicular or 5th MT base tenderness."}, {"id": "158", "group": 158, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Most common primary bone malignancy OVERALL (lecture), vs. most common in children/adolescents, vs. most common malignant tumor found IN bone →", "options": [{"letter": "A", "text": "Multiple myeloma; osteosarcoma; metastasis"}, {"letter": "B", "text": "Osteosarcoma; Ewing; myeloma"}, {"letter": "C", "text": "Chondrosarcoma; osteosarcoma; lymphoma"}, {"letter": "D", "text": "Ewing; osteosarcoma; myeloma"}], "answer": "A", "explanation": "Myeloma (plasma cells) is the most common primary bone malignancy overall; osteosarcoma in teens; metastases (breast, prostate, lung, kidney, thyroid) outnumber all primaries."}, {"id": "159", "group": 159, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Which bone sarcoma is treated with radiation because it is radiosensitive, and which is radioRESISTANT →", "options": [{"letter": "A", "text": "Ewing sarcoma radiosensitive; osteosarcoma resistant"}, {"letter": "B", "text": "Osteosarcoma sensitive; Ewing resistant"}, {"letter": "C", "text": "Both sensitive"}, {"letter": "D", "text": "Chondrosarcoma sensitive; Ewing resistant"}], "answer": "A", "explanation": "Ewing: chemo + surgery ± radiation. Osteosarcoma and chondrosarcoma are radio- (and chondrosarcoma chemo-) resistant → surgery is the mainstay."}, {"id": "160", "group": 160, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Older adult with leg pain after walking that improves when leaning forward on a shopping cart → Diagnosis and best imaging:", "options": [{"letter": "A", "text": "Lumbar spinal stenosis — MRI"}, {"letter": "B", "text": "Vascular claudication — ABI"}, {"letter": "C", "text": "Hip OA — X-ray"}, {"letter": "D", "text": "Disc herniation — CT"}], "answer": "A", "explanation": "Neurogenic claudication: relief with flexion (shopping-cart sign), unlike vascular claudication which improves with standing still; MRI shows central canal narrowing."}, {"id": "161", "group": 161, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Preteen girl with a rib hump on forward bending → Diagnosis-defining study:", "options": [{"letter": "A", "text": "Standing PA/lateral spine films with Cobb angle"}, {"letter": "B", "text": "MRI of the whole spine with contrast"}, {"letter": "C", "text": "Supine AP spine film with Risser grade"}, {"letter": "D", "text": "CT of the thoracic spine with reconstructions"}], "answer": "A", "explanation": "Adams forward-bend test screens; standing full-length films measure the Cobb angle; MRI only for atypical (left thoracic, pain, neuro signs)."}, {"id": "162", "group": 162, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Teen with lumbar pain reproduced by single-leg standing extension (Stork test) → Diagnosis and best initial imaging:", "options": [{"letter": "A", "text": "Spondylolysis — X-rays with obliques (Scotty-dog collar)"}, {"letter": "B", "text": "Spondylolisthesis — MRI with Meyerding grading"}, {"letter": "C", "text": "Disc herniation — MRI with contrast"}, {"letter": "D", "text": "SI joint dysfunction — AP pelvis X-ray"}], "answer": "A", "explanation": "Pars stress fracture (L5, gymnasts/football linemen); bracing and activity restriction; bone scan/SPECT is sensitive for an acute stress reaction."}, {"id": "163", "group": 163, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Arm heaviness and paresthesias with overhead work, positive Adson's → Initial management:", "options": [{"letter": "A", "text": "Physical therapy and activity modification"}, {"letter": "B", "text": "First-rib resection and scalenectomy"}, {"letter": "C", "text": "Carpal tunnel release and night splints"}, {"letter": "D", "text": "Soft cervical collar and NSAIDs"}], "answer": "A", "explanation": "Thoracic outlet syndrome: PT first-line; surgery (scalenectomy/first-rib resection) for refractory neurogenic or any vascular TOS."}, {"id": "164", "group": 164, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Second toe: MTP hyperextended, PIP flexed AND DIP flexed → Deformity (vs. hammer toe):", "options": [{"letter": "A", "text": "Claw toe"}, {"letter": "B", "text": "Hammer toe"}, {"letter": "C", "text": "Mallet toe"}, {"letter": "D", "text": "Turf toe"}], "answer": "A", "explanation": "Claw = MTP extension + PIP + DIP flexion (often neurologic); hammer = PIP flexion only; mallet = DIP only."}, {"id": "165", "group": 165, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Central slip rupture at the PIP that is NOT splinted → Resulting deformity:", "options": [{"letter": "A", "text": "Boutonnière — PIP flexed, DIP hyperextended"}, {"letter": "B", "text": "Swan-neck — PIP hyperextended, DIP flexed"}, {"letter": "C", "text": "Mallet — DIP flexed"}, {"letter": "D", "text": "Jersey — cannot flex the DIP"}], "answer": "A", "explanation": "Lateral bands slip volarly → PIP flexion + DIP hyperextension. Treat with PIP extension splint 4–6 weeks."}, {"id": "166", "group": 166, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Which nerve roots supply hip flexion (iliopsoas) and sensation of the anterior thigh →", "options": [{"letter": "A", "text": "L2–L3"}, {"letter": "B", "text": "L4"}, {"letter": "C", "text": "L5"}, {"letter": "D", "text": "S1"}], "answer": "A", "explanation": "L2–L3 = hip flexion/anterior thigh; L4 = knee extension, medial leg, patellar reflex; L5 = dorsiflexion/EHL, dorsum of foot; S1 = plantarflexion, lateral foot, Achilles reflex."}, {"id": "167", "group": 167, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Pain under the 1st metatarsal head, worse with push-off and great-toe dorsiflexion; 'sesamoid view' shows an irregular edge → Diagnosis and the normal variant to not confuse it with:", "options": [{"letter": "A", "text": "Sesamoid fracture; bipartite sesamoid (smooth edges)"}, {"letter": "B", "text": "Turf toe; os trigonum (posterior talus)"}, {"letter": "C", "text": "Morton's neuroma; accessory navicular"}, {"letter": "D", "text": "Gout; os peroneum (within peroneus longus)"}], "answer": "A", "explanation": "Fractured sesamoid = irregular edge; bipartite = smooth rounded edges, often bilateral."}, {"id": "168", "group": 168, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Most common level of lumbar disc herniation and the root it typically compresses →", "options": [{"letter": "A", "text": "L5–S1 disc → S1 root"}, {"letter": "B", "text": "L4–L5 disc → L4 root"}, {"letter": "C", "text": "L3–L4 disc → L5 root"}, {"letter": "D", "text": "L5–S1 disc → L4 root"}], "answer": "A", "explanation": "Posterolateral herniation at L5–S1 hits the traversing S1 root; L4–L5 hits L5."}, {"id": "169", "group": 169, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Posterior knee swelling in a patient with OA; it suddenly ruptures causing calf pain and swelling → Mimics which diagnosis and how to distinguish →", "options": [{"letter": "A", "text": "DVT — venous duplex ultrasound"}, {"letter": "B", "text": "Achilles rupture — Thompson test"}, {"letter": "C", "text": "Compartment syndrome — compartment pressures"}, {"letter": "D", "text": "Cellulitis — CBC and blood cultures"}], "answer": "A", "explanation": "Ruptured Baker's cyst = 'pseudothrombophlebitis'; ultrasound differentiates."}, {"id": "170", "group": 170, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Kahoot pearl: dead bone (sequestrum), surrounding new bone (involucrum), and the opening through which pus drains → the drainage tract is called:", "options": [{"letter": "A", "text": "Cloaca"}, {"letter": "B", "text": "Sinus nidus"}, {"letter": "C", "text": "Brodie's canal"}, {"letter": "D", "text": "Involucrum"}], "answer": "A", "explanation": "Cloaca = cortical defect through which pus/sequestrum escapes; may form a draining sinus to skin."}, {"id": "171", "group": 171, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "X-ray view used to evaluate the AC joint; vs. the view used to diagnose a posterior shoulder dislocation; vs. the standard view for a clavicle fracture →", "options": [{"letter": "A", "text": "Zanca; axillary; AP"}, {"letter": "B", "text": "Axillary; Zanca; scapular Y"}, {"letter": "C", "text": "Scapular Y; AP; Zanca"}, {"letter": "D", "text": "AP; Zanca; axillary"}], "answer": "A", "explanation": "Zanca = AC joint (cephalic tilt); axillary/scapular Y = dislocations; AP ± cephalic tilt = clavicle."}, {"id": "172", "group": 172, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Artery whose disruption causes femoral head AVN after a femoral neck fracture →", "options": [{"letter": "A", "text": "Medial femoral circumflex"}, {"letter": "B", "text": "Lateral femoral circumflex"}, {"letter": "C", "text": "Obturator (ligamentum teres)"}, {"letter": "D", "text": "Deep femoral trunk"}], "answer": "A", "explanation": "Medial femoral circumflex (retinacular branches) supplies most of the adult femoral head; the ligamentum teres artery is minor."}, {"id": "173", "group": 173, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Weak quadriceps reflex → root; and the root for a diminished Achilles reflex →", "options": [{"letter": "A", "text": "L4; S1"}, {"letter": "B", "text": "L5; S1"}, {"letter": "C", "text": "L4; L5"}, {"letter": "D", "text": "L2; S1"}], "answer": "A", "explanation": "Patellar = L4, Achilles = S1; L5 has no reflex (test EHL/dorsiflexion strength instead)."}, {"id": "174", "group": 174, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Risk factor for hallux valgus; and the hand condition strongly associated with diabetes →", "options": [{"letter": "A", "text": "Narrow shoes; Dupuytren's contracture"}, {"letter": "B", "text": "Flat feet; trigger finger only"}, {"letter": "C", "text": "High arches; carpal tunnel"}, {"letter": "D", "text": "Running; De Quervain's"}], "answer": "A", "explanation": "Bunions: tight shoes, female, family history, pes planus. Dupuytren's: diabetes, alcohol, smoking, Northern-European ancestry."}, {"id": "175", "group": 175, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Apley's compression vs distraction →", "options": [{"letter": "A", "text": "Compression pain = meniscus; distraction pain = ligament"}, {"letter": "B", "text": "Compression pain = ligament; distraction pain = meniscus"}, {"letter": "C", "text": "Both test the ACL"}, {"letter": "D", "text": "Both test the patella"}], "answer": "A", "explanation": "Prone, knee 90°: compress + rotate → meniscus; distract + rotate → ligaments."}, {"id": "176", "group": 176, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Pain over the AC joint after a fall on the point of the shoulder → Most helpful special test; and the exam finding that indicates a HIGH-grade separation →", "options": [{"letter": "A", "text": "Cross-body adduction; skin tenting or step-off"}, {"letter": "B", "text": "Neer's test; pain with abduction past 90°"}, {"letter": "C", "text": "Hawkins test; localized swelling over the joint"}, {"letter": "D", "text": "Apprehension test; point tenderness over the joint"}], "answer": "A", "explanation": "Crossover test compresses the AC joint; tenting/deformity = grade III+ (Rockwood IV–VI often surgical)."}, {"id": "177", "group": 177, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Legg-Calvé-Perthes vs SCFE: ages, body habitus, and pathology →", "options": [{"letter": "A", "text": "LCP 4–8 y, thin boy, AVN; SCFE 10–16 y, obese, physeal slip"}, {"letter": "B", "text": "LCP 10–16 y, obese, AVN; SCFE 4–8 y, thin, physeal slip"}, {"letter": "C", "text": "LCP 4–8 y, obese, slip; SCFE 10–16 y, thin, AVN"}, {"letter": "D", "text": "LCP 10–16 y, thin, slip; SCFE 4–8 y, obese, AVN"}], "answer": "A", "explanation": "Perthes = younger, osteonecrosis of the capital epiphysis; SCFE = adolescent, obesity/endocrinopathy, epiphysis slips posteriorly."}, {"id": "178", "group": 178, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Most common direction of hip dislocation vs. shoulder dislocation →", "options": [{"letter": "A", "text": "Hip posterior (~90%); shoulder anterior (~97%)"}, {"letter": "B", "text": "Hip anterior; shoulder posterior"}, {"letter": "C", "text": "Both posterior"}, {"letter": "D", "text": "Both anterior"}], "answer": "A", "explanation": "Opposite directions — a common trap."}, {"id": "179", "group": 179, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Which modality is most sensitive for EARLY avascular necrosis, early osteomyelitis, early stress fracture, and early scaphoid fracture →", "options": [{"letter": "A", "text": "MRI for all four"}, {"letter": "B", "text": "CT for all four"}, {"letter": "C", "text": "Bone scan for all four"}, {"letter": "D", "text": "Plain X-ray for all four"}], "answer": "A", "explanation": "MRI detects marrow edema before any plain-film change; bone scan is an alternative when MRI is unavailable (less specific)."}, {"id": "180", "group": 180, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Most common mechanism of lumbar disc herniation →", "options": [{"letter": "A", "text": "Lifting while twisting (flexion + rotation)"}, {"letter": "B", "text": "Direct blow to the lumbar spine"}, {"letter": "C", "text": "Hyperextension injury of the back"}, {"letter": "D", "text": "Hematogenous infection of the disc"}], "answer": "A", "explanation": "Torsional/flexion strain tears the posterolateral annulus → nucleus herniates toward the traversing root."}, {"id": "181", "group": 181, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Dermatome: pain down the LATERAL leg to the dorsum of the foot and great toe, weak great-toe extension →", "options": [{"letter": "A", "text": "L5"}, {"letter": "B", "text": "S1"}, {"letter": "C", "text": "L4"}, {"letter": "D", "text": "L3"}], "answer": "A", "explanation": "L5 = lateral leg/dorsum of foot, EHL and dorsiflexion weakness, no reflex loss. S1 = posterior leg, lateral/plantar foot, Achilles reflex."}, {"id": "182", "group": 182, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Thoracic outlet syndrome vs carpal tunnel syndrome — the distinguishing feature →", "options": [{"letter": "A", "text": "TOS: whole arm, worse overhead; CTS: median digits, worse at night"}, {"letter": "B", "text": "TOS: median digits, worse at night; CTS: whole arm, worse overhead"}, {"letter": "C", "text": "TOS: ulnar digits, worse at night; CTS: whole arm, worse overhead"}, {"letter": "D", "text": "TOS: whole arm, worse at night; CTS: ulnar digits, worse overhead"}], "answer": "A", "explanation": "TOS = compression of the brachial plexus/subclavian vessels between the scalenes, 1st rib, or pec minor; provoked by elevation (Roos, Adson's, Wright's)."}, {"id": "183", "group": 183, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Which test detects anterior glenohumeral INSTABILITY vs. inferior/multidirectional instability →", "options": [{"letter": "A", "text": "Apprehension-relocation; sulcus sign"}, {"letter": "B", "text": "Sulcus; apprehension"}, {"letter": "C", "text": "Hawkins; Neer"}, {"letter": "D", "text": "Drop arm; empty can"}], "answer": "A", "explanation": "Apprehension/relocation = anterior; sulcus (gap under the acromion with inferior traction) = inferior/multidirectional laxity."}, {"id": "184", "group": 184, "section": "Re-tested Concepts", "objective": "Re-tested Concepts", "stem": "Most common primary malignant bone tumor in ADULTS over 50 →", "options": [{"letter": "A", "text": "Multiple myeloma"}, {"letter": "B", "text": "Osteosarcoma"}, {"letter": "C", "text": "Ewing sarcoma"}, {"letter": "D", "text": "Giant cell tumor"}], "answer": "A", "explanation": "Myeloma: punched-out lytic lesions, bone pain, anemia, hypercalcemia, renal failure; osteosarcoma has a second peak in the elderly with Paget's disease but myeloma remains more common."}]});

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
