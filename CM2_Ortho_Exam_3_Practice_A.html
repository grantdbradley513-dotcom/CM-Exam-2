<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, image?}] }
const EXAM_DATA = (function (raw) {
  // Reshuffle stack order and option order on every open; renumber ids.
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const groups = {}; const order = [];
  raw.questions.forEach(q => { if (!groups[q.group]) { groups[q.group] = []; order.push(q.group); } groups[q.group].push(q); });
  shuffle(order);
  const out = []; const letters = ['A','B','C','D','E','F'];
  order.forEach((g, gi) => {
    groups[g].forEach((q, qi) => {
      const correct = q.options.find(o => o.letter === q.answer).text;
      const opts = shuffle(q.options.map(o => o.text)).map((t, i) => ({ letter: letters[i], text: t }));
      const ans = opts.find(o => o.text === correct).letter;
      out.push(Object.assign({}, q, { id: String(gi + 1) + (qi === 0 ? '' : letters[qi - 1]), group: gi + 1, options: opts, answer: ans }));
    });
  });
  return { title: raw.title, questions: out };
})({"title": "Ortho Exam 3 Practice A", "questions": [{"id": "1", "group": 1, "stem": "A 44-year-old man has had intermittent low back pain for months. This morning he lifted a box of floor tile and felt severe pain shoot down both legs. Tonight he notes numbness of his buttocks and inner thighs and has not urinated since noon despite the urge. Rectal tone is decreased and there is bilateral ankle plantarflexion weakness. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cauda equina syndrome"}, {"letter": "B", "text": "Lumbar spinal stenosis"}, {"letter": "C", "text": "L5–S1 lumbar radiculopathy"}, {"letter": "D", "text": "Vertebral compression fracture"}, {"letter": "E", "text": "Sacroiliac joint dysfunction"}], "answer": "A", "explanation": "Saddle anesthesia + bladder/bowel dysfunction + ↓ rectal tone + bilateral deficits after a lift/sneeze = cauda equina — a can't-miss, critical diagnosis.", "objective": "Spine Disorders — Cauda Equina Syndrome", "section": "Spine Disorders"}, {"id": "1A", "group": 1, "stem": "What is the diagnostic study of choice?", "options": [{"letter": "A", "text": "Emergent MRI of the lumbar spine"}, {"letter": "B", "text": "Flexion-extension lumbar X-rays"}, {"letter": "C", "text": "Outpatient MRI within 6 weeks"}, {"letter": "D", "text": "EMG/nerve conduction studies"}, {"letter": "E", "text": "CT myelogram after PT trial"}], "answer": "A", "explanation": "Emergent MRI shows severe compression of the lumbar roots — typically a large central disc herniation.", "objective": "Spine Disorders — Cauda Equina Syndrome", "section": "Spine Disorders"}, {"id": "1B", "group": 1, "stem": "The study confirms a massive central L4–L5 disc herniation. What is the definitive management?", "options": [{"letter": "A", "text": "Emergent surgical decompression"}, {"letter": "B", "text": "High-dose oral prednisone taper"}, {"letter": "C", "text": "Physical therapy and NSAIDs"}, {"letter": "D", "text": "Epidural steroid injection"}, {"letter": "E", "text": "Lumbar bracing and bed rest"}], "answer": "A", "explanation": "Cauda equina → emergent decompression; delay causes permanent bowel/bladder and motor loss.", "objective": "Spine Disorders — Cauda Equina Syndrome", "section": "Spine Disorders"}, {"id": "2", "group": 2, "stem": "A 46-year-old warehouse worker felt a sharp pain in his low back while twisting to lift a pallet; the next day he sneezed and pain shot down the back of his right leg to the lateral foot. He has weak plantarflexion and cannot toe-walk on the right; sensation is decreased over the lateral foot. Which nerve root is most likely compressed?", "options": [{"letter": "A", "text": "S1"}, {"letter": "B", "text": "L3"}, {"letter": "C", "text": "L4"}, {"letter": "D", "text": "L5"}, {"letter": "E", "text": "S3"}], "answer": "A", "explanation": "S1: plantarflexion weakness, posterior calf/lateral foot sensory loss, ↓ Achilles reflex.", "objective": "Spine Disorders — Lumbar Radiculopathy / HNP", "section": "Spine Disorders"}, {"id": "2A", "group": 2, "stem": "Which reflex finding is expected?", "options": [{"letter": "A", "text": "Diminished right Achilles reflex"}, {"letter": "B", "text": "Diminished right patellar reflex"}, {"letter": "C", "text": "Absent right biceps reflex"}, {"letter": "D", "text": "Upgoing right plantar response"}, {"letter": "E", "text": "Diminished cremasteric reflex"}], "answer": "A", "explanation": "Only L4 (patellar) and S1 (Achilles) have testable reflexes in the leg; L5 has none.", "objective": "Spine Disorders — Lumbar Radiculopathy / HNP", "section": "Spine Disorders"}, {"id": "2B", "group": 2, "stem": "Which exam maneuver is most specific for a herniated disc as the cause?", "options": [{"letter": "A", "text": "Crossed straight-leg raise"}, {"letter": "B", "text": "Ipsilateral straight-leg raise"}, {"letter": "C", "text": "FABER (Patrick) test"}, {"letter": "D", "text": "Stork test"}, {"letter": "E", "text": "Hoover test"}], "answer": "A", "explanation": "SLR is sensitive but not specific; the crossed SLR (pain in the affected leg when raising the opposite leg) is more specific.", "objective": "Spine Disorders — Lumbar Radiculopathy / HNP", "section": "Spine Disorders"}, {"id": "2C", "group": 2, "stem": "He has no red flags. What is the most appropriate initial management?", "options": [{"letter": "A", "text": "NSAIDs, activity modification, and physical therapy"}, {"letter": "B", "text": "Urgent MRI and microdiscectomy referral"}, {"letter": "C", "text": "Strict bed rest for two weeks with opioids"}, {"letter": "D", "text": "Oral opioids and a rigid lumbar corset"}, {"letter": "E", "text": "Epidural steroid injection within the week"}], "answer": "A", "explanation": "Uncomplicated radiculopathy: conservative care first; MRI only if severe, refractory, or red flags; discectomy if failed >6 wk or progressive weakness.", "objective": "Spine Disorders — Lumbar Radiculopathy / HNP", "section": "Spine Disorders"}, {"id": "3", "group": 3, "stem": "A 51-year-old man has 3 weeks of right neck pain radiating to the thumb with numbness of the radial forearm. Extending the neck, laterally flexing, and rotating it toward the right reproduces his arm pain. Which nerve root is most likely involved?", "options": [{"letter": "A", "text": "C6"}, {"letter": "B", "text": "C4"}, {"letter": "C", "text": "C5"}, {"letter": "D", "text": "C7"}, {"letter": "E", "text": "C8"}], "answer": "A", "explanation": "C6: brachioradialis/wrist extensor weakness, ↓ brachioradialis reflex, thumb/radial forearm sensation.", "objective": "Spine Disorders — Cervical Radiculopathy", "section": "Spine Disorders"}, {"id": "3A", "group": 3, "stem": "What is the name of the maneuver that reproduced his pain?", "options": [{"letter": "A", "text": "Spurling's test"}, {"letter": "B", "text": "Adson's test"}, {"letter": "C", "text": "Lhermitte's sign"}, {"letter": "D", "text": "Hoffmann's sign"}, {"letter": "E", "text": "Roos test"}], "answer": "A", "explanation": "Spurling's: extension + lateral flexion + rotation toward the affected side → ipsilateral radicular pain. Specific but not sensitive.", "objective": "Spine Disorders — Cervical Radiculopathy", "section": "Spine Disorders"}, {"id": "4", "group": 4, "stem": "A 24-year-old man has had 8 months of low back and buttock pain with an hour of morning stiffness. The pain improves when he plays basketball and is worse after sitting through lectures. Last year he was treated for a painful red eye with photophobia. Lumbar flexion increases by only 2 cm on the Schober test. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ankylosing spondylitis"}, {"letter": "B", "text": "Lumbar spinal stenosis"}, {"letter": "C", "text": "Herniated nucleus pulposus"}, {"letter": "D", "text": "Spondylolysis"}, {"letter": "E", "text": "Mechanical lumbar strain"}], "answer": "A", "explanation": "Inflammatory back pain (better with exercise, worse with rest) in a young man + uveitis + Schober <4 cm = AS.", "objective": "Spine Disorders — Ankylosing Spondylitis", "section": "Spine Disorders"}, {"id": "4A", "group": 4, "stem": "Which study should be ordered first?", "options": [{"letter": "A", "text": "X-ray of the SI joints and lumbar spine"}, {"letter": "B", "text": "HLA-B27 testing before any imaging"}, {"letter": "C", "text": "MRI of the lumbar spine with contrast"}, {"letter": "D", "text": "Rheumatoid factor and anti-CCP antibody"}, {"letter": "E", "text": "CT of the pelvis and sacroiliac joints"}], "answer": "A", "explanation": "Order SI joint + lumbar X-rays FIRST; MRI SI joints if films negative; HLA-B27 only if imaging unrevealing (6% of the general population carry it).", "objective": "Spine Disorders — Ankylosing Spondylitis", "section": "Spine Disorders"}, {"id": "4B", "group": 4, "stem": "Which finding is the earliest expected on imaging?", "options": [{"letter": "A", "text": "Bilateral, symmetric sacroiliitis"}, {"letter": "B", "text": "Bamboo spine"}, {"letter": "C", "text": "Unilateral sacroiliitis"}, {"letter": "D", "text": "Syndesmophytes at T12–L1"}, {"letter": "E", "text": "Anterior vertebral wedging"}], "answer": "A", "explanation": "Progression: bilateral symmetric sacroiliitis (earliest) → syndesmophytes → bamboo spine.", "objective": "Spine Disorders — Ankylosing Spondylitis", "section": "Spine Disorders"}, {"id": "4C", "group": 4, "stem": "What is the first-line treatment?", "options": [{"letter": "A", "text": "NSAIDs plus physical therapy"}, {"letter": "B", "text": "Oral prednisone taper"}, {"letter": "C", "text": "Methotrexate monotherapy"}, {"letter": "D", "text": "Lumbar spinal fusion"}, {"letter": "E", "text": "Bed rest and opioids"}], "answer": "A", "explanation": "NSAIDs + PT (key) first line; surgery only for instability/neuro deficit.", "objective": "Spine Disorders — Ankylosing Spondylitis", "section": "Spine Disorders"}, {"id": "5", "group": 5, "stem": "A 14-year-old gymnast has 2 months of low back pain that is worse with back walkovers and arching. Standing on one leg and extending the spine reproduces the pain. Which structure is most likely injured?", "options": [{"letter": "A", "text": "Pars interarticularis"}, {"letter": "B", "text": "Intervertebral disc annulus"}, {"letter": "C", "text": "Vertebral body end plate"}, {"letter": "D", "text": "Spinous process"}, {"letter": "E", "text": "Sacroiliac joint"}], "answer": "A", "explanation": "Repetitive extension in an adolescent athlete + positive Stork test = spondylolysis (pars defect).", "objective": "Spine Disorders — Spondylolysis", "section": "Spine Disorders"}, {"id": "5A", "group": 5, "stem": "If the defect progresses to forward slippage of L5 on S1 by 40%, what grade is the spondylolisthesis?", "options": [{"letter": "A", "text": "Grade II"}, {"letter": "B", "text": "Grade I"}, {"letter": "C", "text": "Grade III"}, {"letter": "D", "text": "Grade IV"}, {"letter": "E", "text": "Grade V"}], "answer": "A", "explanation": "Grade I <25%, II 25–50%, III 50–75%, IV 75–100%, V spondyloptosis.", "objective": "Spine Disorders — Spondylolysis", "section": "Spine Disorders"}, {"id": "6", "group": 6, "stem": "A 12-year-old girl is noted to have one shoulder higher than the other at a school screening. When she bends forward at the waist, a right thoracic rib hump appears. She has no pain. Which study confirms the diagnosis?", "options": [{"letter": "A", "text": "Standing PA and lateral spine X-ray"}, {"letter": "B", "text": "MRI of the thoracic and lumbar spine"}, {"letter": "C", "text": "CT of the chest and thoracic spine"}, {"letter": "D", "text": "Whole-body bone scan (scintigraphy)"}, {"letter": "E", "text": "Pulmonary function testing first"}], "answer": "A", "explanation": "Adams forward bend is the screen; PA/lateral X-ray with Cobb angle makes the diagnosis.", "objective": "Spine Disorders — Scoliosis", "section": "Spine Disorders"}, {"id": "6A", "group": 6, "stem": "Her Cobb angle measures 32°. What is the appropriate management?", "options": [{"letter": "A", "text": "Bracing"}, {"letter": "B", "text": "Observation alone"}, {"letter": "C", "text": "Spinal fusion"}, {"letter": "D", "text": "Physical therapy only"}, {"letter": "E", "text": "Repeat X-ray in 5 years"}], "answer": "A", "explanation": "Cobb <20° observe; 20–50° brace; >50° surgical fusion. (>10° = diagnostic.)", "objective": "Spine Disorders — Scoliosis", "section": "Spine Disorders"}, {"id": "7", "group": 7, "stem": "A 31-year-old restrained back-seat passenger wearing only a lap belt is in a head-on collision. She has mid-back pain, midline tenderness at L1, and a band of abdominal bruising across her lower abdomen. Which of the following is the most likely spinal injury?", "options": [{"letter": "A", "text": "Chance (flexion-distraction) fracture"}, {"letter": "B", "text": "Jefferson (C1 burst) fracture"}, {"letter": "C", "text": "Clay-shoveler (spinous process) fracture"}, {"letter": "D", "text": "Hangman's (C2 pars) fracture"}, {"letter": "E", "text": "Teardrop (anteroinferior body) fracture"}], "answer": "A", "explanation": "Lap belt acts as a fulcrum → flexion-distraction → anterior compression with posterior column failure.", "objective": "Spine Disorders — Chance Fracture", "section": "Spine Disorders"}, {"id": "7A", "group": 7, "stem": "Besides the spine, what injury must be actively looked for?", "options": [{"letter": "A", "text": "Intra-abdominal (hollow viscus) injury"}, {"letter": "B", "text": "Vertebral artery dissection"}, {"letter": "C", "text": "Calcaneus (heel) fracture"}, {"letter": "D", "text": "Brachial plexus traction injury"}, {"letter": "E", "text": "Tension pneumothorax on the left"}], "answer": "A", "explanation": "Seatbelt sign + Chance fracture → always look for intra-abdominal injury; trauma surgery evaluation.", "objective": "Spine Disorders — Chance Fracture", "section": "Spine Disorders"}, {"id": "8", "group": 8, "stem": "A 72-year-old man has a year of low back pain and bilateral buttock and thigh pain that comes on after walking two blocks and is relieved by sitting or leaning forward on a shopping cart. Pedal pulses are normal. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Lumbar spinal stenosis"}, {"letter": "B", "text": "Peripheral arterial disease"}, {"letter": "C", "text": "Cauda equina syndrome"}, {"letter": "D", "text": "Ankylosing spondylitis"}, {"letter": "E", "text": "Trochanteric bursitis"}], "answer": "A", "explanation": "Neurogenic claudication: worse with walking/standing/extension, relieved by flexion ('shopping cart sign'); normal pulses argue against vascular claudication.", "objective": "Spine Disorders — Spinal Stenosis", "section": "Spine Disorders"}, {"id": "8A", "group": 8, "stem": "He has no red flags. What is the appropriate first step?", "options": [{"letter": "A", "text": "NSAIDs and physical therapy"}, {"letter": "B", "text": "Emergent MRI of the lumbar spine"}, {"letter": "C", "text": "Decompressive laminectomy"}, {"letter": "D", "text": "Lumbar X-ray series"}, {"letter": "E", "text": "Ankle-brachial index"}], "answer": "A", "explanation": "Clinical diagnosis; X-ray not typically helpful; MRI only if refractory or red flags; decompression if 3–6 mo failed conservative care.", "objective": "Spine Disorders — Spinal Stenosis", "section": "Spine Disorders"}, {"id": "9", "group": 9, "stem": "A 19-year-old female soccer player planted her right foot to cut around a defender, heard a pop, and fell. She could not continue playing, and the knee swelled markedly within two hours. Today the knee 'gives out' when she pivots. Which structure is most likely injured?", "options": [{"letter": "A", "text": "Anterior cruciate ligament"}, {"letter": "B", "text": "Medial collateral ligament"}, {"letter": "C", "text": "Posterior cruciate ligament"}, {"letter": "D", "text": "Patellar tendon"}, {"letter": "E", "text": "Lateral collateral ligament"}], "answer": "A", "explanation": "Non-contact plant-and-cut + pop + rapid hemarthrosis + instability = ACL.", "objective": "Knee Disorders — ACL Sprain / Tear", "section": "Knee Disorders"}, {"id": "9A", "group": 9, "stem": "Which special test is most sensitive for this injury?", "options": [{"letter": "A", "text": "Lachman test"}, {"letter": "B", "text": "Posterior sag sign"}, {"letter": "C", "text": "McMurray test"}, {"letter": "D", "text": "Varus stress at 30°"}, {"letter": "E", "text": "Patellar apprehension test"}], "answer": "A", "explanation": "Lachman (30° flexion, no firm end-feel) is the most sensitive; anterior drawer is negative in ~half of acute tears; pivot shift 'clunk' is specific.", "objective": "Knee Disorders — ACL Sprain / Tear", "section": "Knee Disorders"}, {"id": "9B", "group": 9, "stem": "Her AP knee X-ray shows a small avulsion fragment off the lateral tibial plateau. What is this finding called?", "options": [{"letter": "A", "text": "Segond fracture"}, {"letter": "B", "text": "Fleck sign"}, {"letter": "C", "text": "Hill-Sachs lesion"}, {"letter": "D", "text": "Tibial plateau fracture"}, {"letter": "E", "text": "Pellegrini-Stieda lesion"}], "answer": "A", "explanation": "Segond fracture = avulsion of the lateral tibial plateau just distal to the joint line — pathognomonic for ACL tear. MRI confirms the tear.", "objective": "Knee Disorders — ACL Sprain / Tear", "section": "Knee Disorders"}, {"id": "9C", "group": 9, "stem": "She wants to return to competitive soccer. What is the most appropriate definitive management?", "options": [{"letter": "A", "text": "ACL reconstruction followed by rehabilitation"}, {"letter": "B", "text": "Long-leg cast for 6 weeks"}, {"letter": "C", "text": "Intra-articular corticosteroid injection"}, {"letter": "D", "text": "Hinged brace and return to play now"}, {"letter": "E", "text": "Partial meniscectomy alone"}], "answer": "A", "explanation": "Active/unstable patients → ACL reconstruction (patellar tendon BTB, hamstring, quad tendon, or allograft); others PT/bracing.", "objective": "Knee Disorders — ACL Sprain / Tear", "section": "Knee Disorders"}, {"id": "10", "group": 10, "stem": "A 22-year-old football player was clipped on the outside of his left knee. He has medial knee pain and tenderness along the medial femoral epicondyle, a small effusion, and pain with valgus stress at 30° of flexion. Which structure is injured?", "options": [{"letter": "A", "text": "Medial collateral ligament"}, {"letter": "B", "text": "Lateral collateral ligament"}, {"letter": "C", "text": "Anterior cruciate ligament"}, {"letter": "D", "text": "Lateral meniscus"}, {"letter": "E", "text": "Iliotibial band"}], "answer": "A", "explanation": "Blow to the lateral knee = valgus force = MCL (most commonly injured collateral).", "objective": "Knee Disorders — MCL Sprain", "section": "Knee Disorders"}, {"id": "10A", "group": 10, "stem": "Valgus laxity is also present with the knee in full extension. What does this indicate?", "options": [{"letter": "A", "text": "MCL plus cruciate and capsular injury"}, {"letter": "B", "text": "Isolated grade I MCL sprain"}, {"letter": "C", "text": "Isolated lateral meniscus tear"}, {"letter": "D", "text": "Normal physiologic laxity"}, {"letter": "E", "text": "Isolated LCL sprain"}], "answer": "A", "explanation": "Laxity at 30° isolates the MCL; laxity at full extension = MCL + cruciate(s) + capsule.", "objective": "Knee Disorders — MCL Sprain", "section": "Knee Disorders"}, {"id": "11", "group": 11, "stem": "A 34-year-old unrestrained driver struck his flexed right knee on the dashboard in a collision. He has posterior knee pain. With the hips and knees flexed to 90°, the right tibia drops back relative to the left. Which structure is injured?", "options": [{"letter": "A", "text": "Posterior cruciate ligament"}, {"letter": "B", "text": "Anterior cruciate ligament"}, {"letter": "C", "text": "Medial meniscus"}, {"letter": "D", "text": "Medial collateral ligament"}, {"letter": "E", "text": "Quadriceps tendon"}], "answer": "A", "explanation": "Dashboard injury (blow to the anterior proximal tibia) + posterior sag sign = PCL.", "objective": "Knee Disorders — PCL Sprain / Tear", "section": "Knee Disorders"}, {"id": "11A", "group": 11, "stem": "He has an isolated grade 2 injury. What is the appropriate management?", "options": [{"letter": "A", "text": "Protective weight bearing and physical therapy"}, {"letter": "B", "text": "Emergent PCL reconstruction"}, {"letter": "C", "text": "Extension immobilization for 12 weeks"}, {"letter": "D", "text": "Arthroscopic meniscectomy"}, {"letter": "E", "text": "No activity restriction needed"}], "answer": "A", "explanation": "Grade 1–2: protective WB + PT; grade 3: extension immobilization × 4 wk; surgery for bony avulsion, failed non-op, or multiligament injury.", "objective": "Knee Disorders — PCL Sprain / Tear", "section": "Knee Disorders"}, {"id": "12", "group": 12, "stem": "A 27-year-old man twisted his knee with his foot planted during a basketball game. He had mild swelling the next day. He now reports that the knee catches and occasionally locks so he cannot fully straighten it. Which exam finding is most sensitive for his injury?", "options": [{"letter": "A", "text": "Joint-line tenderness"}, {"letter": "B", "text": "Posterior sag sign"}, {"letter": "C", "text": "Positive Thompson test"}, {"letter": "D", "text": "Patellar apprehension"}, {"letter": "E", "text": "Tender tibial tubercle"}], "answer": "A", "explanation": "Meniscal tear: twisting with planted foot, delayed mild swelling, mechanical catching/locking; joint-line tenderness is the most sensitive finding.", "objective": "Knee Disorders — Meniscal Tear", "section": "Knee Disorders"}, {"id": "12A", "group": 12, "stem": "Pain and a palpable click occur when the knee is extended from full flexion with the tibia externally rotated. Which structure is torn?", "options": [{"letter": "A", "text": "Medial meniscus"}, {"letter": "B", "text": "Lateral meniscus"}, {"letter": "C", "text": "Anterior cruciate ligament"}, {"letter": "D", "text": "Lateral collateral ligament"}, {"letter": "E", "text": "Patellar cartilage"}], "answer": "A", "explanation": "McMurray: ER + extend = medial meniscus; IR + extend = lateral meniscus.", "objective": "Knee Disorders — Meniscal Tear", "section": "Knee Disorders"}, {"id": "12B", "group": 12, "stem": "Which study confirms the diagnosis?", "options": [{"letter": "A", "text": "MRI of the knee"}, {"letter": "B", "text": "Weight-bearing knee X-rays"}, {"letter": "C", "text": "CT of the knee"}, {"letter": "D", "text": "Knee ultrasound"}, {"letter": "E", "text": "Arthrocentesis"}], "answer": "A", "explanation": "MRI confirms the meniscal tear; acute tears → partial meniscectomy vs repair.", "objective": "Knee Disorders — Meniscal Tear", "section": "Knee Disorders"}, {"id": "13", "group": 13, "stem": "A 58-year-old man missed a step coming down his porch stairs and felt a tearing pain above his kneecap. He has a large effusion, a palpable gap just above the patella, and cannot perform a straight-leg raise. What is the expected finding on the lateral knee X-ray?", "options": [{"letter": "A", "text": "Patella baja (low-riding patella)"}, {"letter": "B", "text": "Patella alta (high-riding patella)"}, {"letter": "C", "text": "Segond avulsion fragment"}, {"letter": "D", "text": "Lipohemarthrosis with plateau fracture"}, {"letter": "E", "text": "Normal patellar position"}], "answer": "A", "explanation": "Quad tendon rupture (>40 y) → patella baja; patellar tendon rupture (<40 y) → patella alta.", "objective": "Knee Disorders — Patellar / Quadriceps Tendon Rupture", "section": "Knee Disorders"}, {"id": "13A", "group": 13, "stem": "What is the appropriate management of a complete rupture?", "options": [{"letter": "A", "text": "Surgical repair"}, {"letter": "B", "text": "Knee immobilizer and early PT"}, {"letter": "C", "text": "Intra-articular corticosteroid"}, {"letter": "D", "text": "Hinged brace for 2 weeks"}, {"letter": "E", "text": "Observation and NSAIDs"}], "answer": "A", "explanation": "Complete extensor mechanism rupture → surgical repair; don't delay the ortho consult.", "objective": "Knee Disorders — Patellar / Quadriceps Tendon Rupture", "section": "Knee Disorders"}, {"id": "14", "group": 14, "stem": "A 13-year-old boy who plays basketball year-round has anterior knee pain that worsens with jumping and kneeling. There is a prominent, tender bump just below the kneecap, and resisted knee extension is painful. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Osgood-Schlatter disease"}, {"letter": "B", "text": "Sinding-Larsen-Johansson syndrome"}, {"letter": "C", "text": "Patellar tendon rupture"}, {"letter": "D", "text": "Osteochondritis dissecans"}, {"letter": "E", "text": "Prepatellar bursitis"}], "answer": "A", "explanation": "Traction apophysitis of the tibial tubercle in an active adolescent during a growth spurt.", "objective": "Knee Disorders — Osgood-Schlatter Disease", "section": "Knee Disorders"}, {"id": "14A", "group": 14, "stem": "What is the appropriate management?", "options": [{"letter": "A", "text": "Rest, ice, activity modification, and NSAIDs"}, {"letter": "B", "text": "Surgical excision of the ossicle now"}, {"letter": "C", "text": "Long-leg cast for 3 months"}, {"letter": "D", "text": "Corticosteroid injection at the tubercle"}, {"letter": "E", "text": "Complete cessation of all sports for a year"}], "answer": "A", "explanation": "Conservative care; cast × 6 wk only if severe; ossicle removal rarely, after skeletal maturity.", "objective": "Knee Disorders — Osgood-Schlatter Disease", "section": "Knee Disorders"}, {"id": "15", "group": 15, "stem": "A 29-year-old motorcyclist is brought in after a high-speed crash. His left knee was grossly deformed at the scene, but EMS reports it 'popped back in' during transport. The knee is now aligned but globally unstable to varus, valgus, and anterior-posterior stress. Dorsalis pedis pulses are palpable. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Measure ankle-brachial index"}, {"letter": "B", "text": "Discharge with a knee immobilizer"}, {"letter": "C", "text": "Outpatient MRI within 1 week"}, {"letter": "D", "text": "Aspirate the knee hemarthrosis"}, {"letter": "E", "text": "Apply a long-leg cast"}], "answer": "A", "explanation": "Half of knee dislocations reduce spontaneously — believe the history. Normal pulses don't clear the popliteal artery (injured in ~1/3); ABI <0.9 → CT angiography.", "objective": "Knee Disorders — Knee (Tibiofemoral) Dislocation", "section": "Knee Disorders"}, {"id": "15A", "group": 15, "stem": "His ABI is 0.8. What is the next study?", "options": [{"letter": "A", "text": "CT angiography"}, {"letter": "B", "text": "MRI of the knee"}, {"letter": "C", "text": "Venous duplex ultrasound"}, {"letter": "D", "text": "Repeat ABI in 24 hours"}, {"letter": "E", "text": "Plain films of the femur"}], "answer": "A", "explanation": "ABI <0.9 or abnormal pulses → CT angiogram for popliteal artery injury; immediate vascular/ortho involvement.", "objective": "Knee Disorders — Knee (Tibiofemoral) Dislocation", "section": "Knee Disorders"}, {"id": "15B", "group": 15, "stem": "Which nerve is most commonly injured with this injury?", "options": [{"letter": "A", "text": "Common peroneal nerve"}, {"letter": "B", "text": "Tibial nerve"}, {"letter": "C", "text": "Femoral nerve"}, {"letter": "D", "text": "Saphenous nerve"}, {"letter": "E", "text": "Obturator nerve"}], "answer": "A", "explanation": "Peroneal (foot drop) > tibial.", "objective": "Knee Disorders — Knee (Tibiofemoral) Dislocation", "section": "Knee Disorders"}, {"id": "16", "group": 16, "stem": "A 45-year-old woman jumped from a 6-foot wall and landed on extended legs. She has a tense, swollen right knee and cannot bear weight. The AP X-ray is equivocal, but the cross-table lateral shows a fat-fluid level. What is the most appropriate next imaging study?", "options": [{"letter": "A", "text": "CT of the knee"}, {"letter": "B", "text": "MRI of the lumbar spine"}, {"letter": "C", "text": "Bone scan"}, {"letter": "D", "text": "Repeat X-ray in 2 weeks"}, {"letter": "E", "text": "Knee ultrasound"}], "answer": "A", "explanation": "Axial load → tibial plateau fracture (lateral 70–80%); often subtle on X-ray, lipohemarthrosis is a clue, CT defines it.", "objective": "Knee Disorders — Tibial Plateau Fracture", "section": "Knee Disorders"}, {"id": "16A", "group": 16, "stem": "Which complication must be monitored for in the first 24–48 hours?", "options": [{"letter": "A", "text": "Compartment syndrome of the leg"}, {"letter": "B", "text": "Avascular necrosis of the femoral head"}, {"letter": "C", "text": "Fat pad impingement"}, {"letter": "D", "text": "Osteochondritis dissecans"}, {"letter": "E", "text": "Patellar tendinitis"}], "answer": "A", "explanation": "High risk of compartment syndrome; check peroneal nerve function; discuss with ortho from the ED.", "objective": "Knee Disorders — Tibial Plateau Fracture", "section": "Knee Disorders"}, {"id": "17", "group": 17, "stem": "A 38-year-old driver's knee struck the dashboard in a head-on collision. He has severe right hip pain, and the right leg is shortened, internally rotated, and adducted. Which of the following is the most likely injury?", "options": [{"letter": "A", "text": "Posterior hip dislocation"}, {"letter": "B", "text": "Anterior hip dislocation"}, {"letter": "C", "text": "Femoral neck fracture"}, {"letter": "D", "text": "Intertrochanteric fracture"}, {"letter": "E", "text": "Pubic ramus fracture"}], "answer": "A", "explanation": "Axial load on a flexed, adducted hip → posterior dislocation (most common): shortened, IR, adducted. Anterior = ER, abducted.", "objective": "Hip Disorders — Posterior Hip Dislocation", "section": "Hip Disorders"}, {"id": "17A", "group": 17, "stem": "Which nerve must be documented before and after reduction?", "options": [{"letter": "A", "text": "Sciatic nerve"}, {"letter": "B", "text": "Femoral nerve"}, {"letter": "C", "text": "Obturator nerve"}, {"letter": "D", "text": "Lateral femoral cutaneous nerve"}, {"letter": "E", "text": "Pudendal nerve"}], "answer": "A", "explanation": "Check sciatic function (foot drop, sensory loss) before and after.", "objective": "Hip Disorders — Posterior Hip Dislocation", "section": "Hip Disorders"}, {"id": "17B", "group": 17, "stem": "Imaging confirms the dislocation without fracture. Within what time frame should closed reduction occur?", "options": [{"letter": "A", "text": "Within 12 hours"}, {"letter": "B", "text": "Within 72 hours"}, {"letter": "C", "text": "After 1 week of traction"}, {"letter": "D", "text": "Within 30 days"}, {"letter": "E", "text": "Only after MRI"}], "answer": "A", "explanation": "True emergency — reduce within 12 h (ideally ≤6 h); delay ↑ osteonecrosis risk.", "objective": "Hip Disorders — Posterior Hip Dislocation", "section": "Hip Disorders"}, {"id": "17C", "group": 17, "stem": "What is the most feared long-term complication of delayed reduction?", "options": [{"letter": "A", "text": "Avascular necrosis of the femoral head"}, {"letter": "B", "text": "Meralgia paresthetica"}, {"letter": "C", "text": "Trochanteric bursitis"}, {"letter": "D", "text": "Heterotopic hip snapping"}, {"letter": "E", "text": "Slipped capital femoral epiphysis"}], "answer": "A", "explanation": "Delayed reduction ↑ AVN; also post-traumatic arthritis and recurrent dislocation.", "objective": "Hip Disorders — Posterior Hip Dislocation", "section": "Hip Disorders"}, {"id": "18", "group": 18, "stem": "An 81-year-old woman with osteoporosis tripped on a rug at home and cannot stand. Her left leg is shortened and externally rotated, and she has groin pain with any hip motion. What is the most appropriate initial imaging?", "options": [{"letter": "A", "text": "AP pelvis and AP/cross-table lateral hip X-rays"}, {"letter": "B", "text": "Frog-leg lateral X-ray of the injured hip"}, {"letter": "C", "text": "MRI of the hip before any plain films"}, {"letter": "D", "text": "Whole-body bone scan within 72 hours"}, {"letter": "E", "text": "CT of the lumbar spine and sacrum"}], "answer": "A", "explanation": "Hip fracture: AP pelvis + AP/cross-table lateral (no frog-leg if fracture suspected); CT/MRI if negative with high suspicion.", "objective": "Hip Disorders — Femoral Neck Fracture", "section": "Hip Disorders"}, {"id": "18A", "group": 18, "stem": "Films show a displaced subcapital fracture. Why is this location concerning?", "options": [{"letter": "A", "text": "Highest risk of avascular necrosis"}, {"letter": "B", "text": "Highest risk of fat embolism"}, {"letter": "C", "text": "Highest risk of sciatic nerve injury"}, {"letter": "D", "text": "It always requires traction alone"}, {"letter": "E", "text": "It is extracapsular and heals poorly"}], "answer": "A", "explanation": "Intracapsular femoral neck fractures disrupt the femoral head's blood supply → highest AVN risk; intertrochanteric (extracapsular) rarely causes AVN.", "objective": "Hip Disorders — Femoral Neck Fracture", "section": "Hip Disorders"}, {"id": "18B", "group": 18, "stem": "What is the appropriate definitive management?", "options": [{"letter": "A", "text": "Hemiarthroplasty or total hip arthroplasty"}, {"letter": "B", "text": "Cannulated screw fixation"}, {"letter": "C", "text": "Sliding hip compression screw"}, {"letter": "D", "text": "Bed rest and traction for 8 weeks"}, {"letter": "E", "text": "Closed reduction and spica cast"}], "answer": "A", "explanation": "Displaced femoral neck → arthroplasty; nondisplaced → cannulated screws; intertrochanteric → sliding hip screw or IM nail.", "objective": "Hip Disorders — Femoral Neck Fracture", "section": "Hip Disorders"}, {"id": "19", "group": 19, "stem": "A 13-year-old obese boy has had 4 weeks of a limp and vague left knee pain. The knee exam is normal. When the left hip is passively flexed, the thigh rolls into external rotation. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Slipped capital femoral epiphysis"}, {"letter": "B", "text": "Legg-Calvé-Perthes disease"}, {"letter": "C", "text": "Osgood-Schlatter disease"}, {"letter": "D", "text": "Transient synovitis"}, {"letter": "E", "text": "Developmental dysplasia of the hip"}], "answer": "A", "explanation": "Obese adolescent (10–16) + knee/hip pain + obligate ER with passive flexion = SCFE. Knee pain in a child → examine the hip.", "objective": "Hip Disorders — Slipped Capital Femoral Epiphysis", "section": "Hip Disorders"}, {"id": "19A", "group": 19, "stem": "Which imaging should be ordered?", "options": [{"letter": "A", "text": "AP and frog-leg lateral X-rays of both hips"}, {"letter": "B", "text": "MRI of the left knee with contrast"}, {"letter": "C", "text": "Ultrasound of the left hip joint"}, {"letter": "D", "text": "CT of the pelvis without contrast"}, {"letter": "E", "text": "AP and lateral X-rays of the left knee"}], "answer": "A", "explanation": "AP + frog-leg lateral hips; Klein's line fails to intersect the femoral head.", "objective": "Hip Disorders — Slipped Capital Femoral Epiphysis", "section": "Hip Disorders"}, {"id": "19B", "group": 19, "stem": "The diagnosis is confirmed. What is the appropriate management?", "options": [{"letter": "A", "text": "Non-weight bearing and percutaneous screw pinning"}, {"letter": "B", "text": "Pavlik harness and serial ultrasound"}, {"letter": "C", "text": "Observation and activity restriction only"}, {"letter": "D", "text": "Physical therapy and scheduled NSAIDs"}, {"letter": "E", "text": "Hip spica cast for 12 weeks, then PT"}], "answer": "A", "explanation": "Non-weight bearing + surgical in-situ pinning (single cannulated screw).", "objective": "Hip Disorders — Slipped Capital Femoral Epiphysis", "section": "Hip Disorders"}, {"id": "20", "group": 20, "stem": "A 6-year-old boy has a painless limp that has developed over several weeks and mild intermittent thigh pain after playing. He has limited hip internal rotation and a Trendelenburg gait. Hip X-ray shows flattening and sclerosis of the femoral head. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Legg-Calvé-Perthes disease"}, {"letter": "B", "text": "Slipped capital femoral epiphysis"}, {"letter": "C", "text": "Septic arthritis of the hip"}, {"letter": "D", "text": "Developmental dysplasia of the hip"}, {"letter": "E", "text": "Osteoid osteoma"}], "answer": "A", "explanation": "Idiopathic AVN of the femoral head in boys 4–8; SCFE is the older (10–16), obese child.", "objective": "Hip Disorders — Legg-Calvé-Perthes Disease", "section": "Hip Disorders"}, {"id": "21", "group": 21, "stem": "A 3-week-old first-born girl delivered breech has asymmetric thigh folds. With the hip flexed and abducted, a clunk is felt as the femoral head relocates. What is the best imaging study?", "options": [{"letter": "A", "text": "Ultrasound of the hips"}, {"letter": "B", "text": "AP pelvis X-ray"}, {"letter": "C", "text": "MRI of the pelvis"}, {"letter": "D", "text": "CT of the hips"}, {"letter": "E", "text": "Bone scan"}], "answer": "A", "explanation": "Positive Ortolani (clunk of reduction) — DDH. Young infant → ultrasound; older infant → X-ray.", "objective": "Hip Disorders — Developmental Dysplasia of the Hip", "section": "Hip Disorders"}, {"id": "21A", "group": 21, "stem": "What is the first-line treatment?", "options": [{"letter": "A", "text": "Pavlik harness"}, {"letter": "B", "text": "Closed reduction and spica cast"}, {"letter": "C", "text": "Observation until walking age"}, {"letter": "D", "text": "Percutaneous screw fixation"}, {"letter": "E", "text": "Triple diapering"}], "answer": "A", "explanation": "Pavlik harness first line; closed/open reduction + spica if failed or late.", "objective": "Hip Disorders — Developmental Dysplasia of the Hip", "section": "Hip Disorders"}, {"id": "22", "group": 22, "stem": "A 42-year-old man with a history of heavy alcohol use and several prednisone courses for asthma has 3 months of deep groin pain that is worse with stairs. Hip X-rays are normal. Which study is most appropriate next?", "options": [{"letter": "A", "text": "MRI of both hips"}, {"letter": "B", "text": "Repeat hip X-ray in 1 year"}, {"letter": "C", "text": "Hip ultrasound"}, {"letter": "D", "text": "Serum CK"}, {"letter": "E", "text": "Arthrocentesis"}], "answer": "A", "explanation": "X-ray is normal early; MRI detects early osteonecrosis and is often bilateral (~80%) — look at both hips.", "objective": "Hip Disorders — Avascular Necrosis of the Femoral Head", "section": "Hip Disorders"}, {"id": "22A", "group": 22, "stem": "MRI shows early disease without subchondral collapse. Which intervention is appropriate at this stage?", "options": [{"letter": "A", "text": "Core decompression"}, {"letter": "B", "text": "Total hip replacement"}, {"letter": "C", "text": "Hip resurfacing"}, {"letter": "D", "text": "Observation without restriction"}, {"letter": "E", "text": "Femoral osteotomy only"}], "answer": "A", "explanation": "Core decompression ± bone graft only before subchondral collapse; collapse → total hip replacement.", "objective": "Hip Disorders — Avascular Necrosis of the Femoral Head", "section": "Hip Disorders"}, {"id": "23", "group": 23, "stem": "A 39-year-old obese man who recently started wearing a heavy tool belt at work has burning and numbness over the upper outer thigh. Strength and reflexes are normal. Which nerve is compressed?", "options": [{"letter": "A", "text": "Lateral femoral cutaneous nerve"}, {"letter": "B", "text": "Femoral nerve (motor branch)"}, {"letter": "C", "text": "Obturator nerve"}, {"letter": "D", "text": "Sciatic nerve (peroneal division)"}, {"letter": "E", "text": "Genitofemoral nerve"}], "answer": "A", "explanation": "Pure sensory anterolateral thigh symptoms with tight belts/obesity = LFCN compression. Motor weakness means another lesion.", "objective": "Hip Disorders — Meralgia Paresthetica", "section": "Hip Disorders"}, {"id": "23A", "group": 23, "stem": "What is the management?", "options": [{"letter": "A", "text": "Loosen the tool belt and clothing; lose weight"}, {"letter": "B", "text": "Lumbar MRI and L3–L4 discectomy"}, {"letter": "C", "text": "Femoral nerve block series every month"}, {"letter": "D", "text": "Hip arthroscopy with labral debridement"}, {"letter": "E", "text": "Oral corticosteroid taper for 3 weeks"}], "answer": "A", "explanation": "Treat by removing the compression.", "objective": "Hip Disorders — Meralgia Paresthetica", "section": "Hip Disorders"}, {"id": "24", "group": 24, "stem": "A 26-year-old woman is ejected in a rollover crash. BP is 82/50 and HR 128. The pelvis is unstable to gentle compression of the iliac crests, and there is blood at the urethral meatus. Besides resuscitation, what is the most appropriate immediate intervention?", "options": [{"letter": "A", "text": "Apply a pelvic binder"}, {"letter": "B", "text": "Insert a Foley catheter"}, {"letter": "C", "text": "Obtain an MRI of the pelvis"}, {"letter": "D", "text": "Perform a FABER test"}, {"letter": "E", "text": "Apply skin traction to the legs"}], "answer": "A", "explanation": "Unstable pelvis with hemorrhage → pelvic binder immediately, trauma center, angiography.", "objective": "Hip Disorders — Pelvic Fracture", "section": "Hip Disorders"}, {"id": "24A", "group": 24, "stem": "Before a Foley is placed, which study is required?", "options": [{"letter": "A", "text": "Retrograde urethrogram"}, {"letter": "B", "text": "Renal ultrasound"}, {"letter": "C", "text": "Cystoscopy"}, {"letter": "D", "text": "Voiding cystourethrogram in 6 weeks"}, {"letter": "E", "text": "Urinalysis"}], "answer": "A", "explanation": "Blood at the meatus → no Foley until retrograde urethrogram (anterior ring → urogenital injury).", "objective": "Hip Disorders — Pelvic Fracture", "section": "Hip Disorders"}, {"id": "25", "group": 25, "stem": "A 22-year-old wrestler had his arm forced into abduction and external rotation during a takedown and felt a pop. He holds the arm slightly abducted and externally rotated, and the shoulder looks squared off. Which nerve must be tested before reduction?", "options": [{"letter": "A", "text": "Axillary nerve"}, {"letter": "B", "text": "Radial nerve"}, {"letter": "C", "text": "Musculocutaneous nerve"}, {"letter": "D", "text": "Long thoracic nerve"}, {"letter": "E", "text": "Suprascapular nerve"}], "answer": "A", "explanation": "Anterior dislocation: check axillary nerve ('military patch' over the lateral deltoid) before and after reduction.", "objective": "Shoulder Disorders — Anterior Shoulder Dislocation", "section": "Shoulder Disorders"}, {"id": "25A", "group": 25, "stem": "Which X-ray views should be obtained?", "options": [{"letter": "A", "text": "AP and scapular Y views"}, {"letter": "B", "text": "AP view only"}, {"letter": "C", "text": "Bilateral AC joint views"}, {"letter": "D", "text": "Zanca and stress views"}, {"letter": "E", "text": "Supine chest X-ray"}], "answer": "A", "explanation": "AP + scapular Y: humeral head under the coracoid, humerus anterior to the scapula on Y.", "objective": "Shoulder Disorders — Anterior Shoulder Dislocation", "section": "Shoulder Disorders"}, {"id": "25B", "group": 25, "stem": "Post-reduction films show a compression defect of the posterolateral humeral head. What is this lesion called?", "options": [{"letter": "A", "text": "Hill-Sachs lesion"}, {"letter": "B", "text": "Bankart lesion"}, {"letter": "C", "text": "Reverse Hill-Sachs lesion"}, {"letter": "D", "text": "SLAP lesion"}, {"letter": "E", "text": "Segond lesion"}], "answer": "A", "explanation": "Hill-Sachs = posterolateral humeral head compression fracture (impacts the anterior glenoid rim); Bankart = anterior-inferior glenoid labrum tear.", "objective": "Shoulder Disorders — Anterior Shoulder Dislocation", "section": "Shoulder Disorders"}, {"id": "25C", "group": 25, "stem": "After successful reduction, what is the appropriate next management?", "options": [{"letter": "A", "text": "Post-reduction X-ray and sling for 3–4 weeks"}, {"letter": "B", "text": "Immediate surgical stabilization"}, {"letter": "C", "text": "Apprehension test to confirm stability"}, {"letter": "D", "text": "Shoulder spica cast for 8 weeks"}, {"letter": "E", "text": "Return to wrestling the same day"}], "answer": "A", "explanation": "Post-reduction X-ray → sling 3–4 wk; recurrent → surgical stabilization. Never do an apprehension test on an acutely relocated shoulder.", "objective": "Shoulder Disorders — Anterior Shoulder Dislocation", "section": "Shoulder Disorders"}, {"id": "26", "group": 26, "stem": "A 30-year-old man is evaluated after a generalized tonic-clonic seizure. His right arm is held adducted and internally rotated, and he cannot externally rotate it. The AP X-ray is read as 'possibly normal' but the humeral head looks symmetric and rounded. Which additional view is best for the diagnosis?", "options": [{"letter": "A", "text": "Axillary view"}, {"letter": "B", "text": "Scapular Y view only"}, {"letter": "C", "text": "Bilateral AC joint view"}, {"letter": "D", "text": "Repeat AP view in 1 week"}, {"letter": "E", "text": "Apical oblique of the clavicle"}], "answer": "A", "explanation": "Seizure/electrocution → posterior dislocation; 'lightbulb sign' on AP; axillary view is the best view — easily missed on AP alone.", "objective": "Shoulder Disorders — Posterior Shoulder Dislocation", "section": "Shoulder Disorders"}, {"id": "26A", "group": 26, "stem": "Which reduction technique is inappropriate for this injury?", "options": [{"letter": "A", "text": "Kocher maneuver"}, {"letter": "B", "text": "Axial traction with internal-to-external rotation"}, {"letter": "C", "text": "Traction/counter-traction"}, {"letter": "D", "text": "Reduction under procedural sedation"}, {"letter": "E", "text": "Gentle lateral traction on the adducted arm"}], "answer": "A", "explanation": "Kocher and FARES are for anterior dislocations only. After reduction, immobilize in slight ER 4–6 wk.", "objective": "Shoulder Disorders — Posterior Shoulder Dislocation", "section": "Shoulder Disorders"}, {"id": "27", "group": 27, "stem": "A 63-year-old retired carpenter has months of lateral shoulder pain with overhead reaching and at night when lying on the shoulder. When his arm is passively abducted to 90° and released, he cannot lower it smoothly and it falls to his side. Which structure is most likely involved?", "options": [{"letter": "A", "text": "Supraspinatus tendon"}, {"letter": "B", "text": "Long head of the biceps"}, {"letter": "C", "text": "Glenoid labrum"}, {"letter": "D", "text": "Acromioclavicular ligament"}, {"letter": "E", "text": "Deltoid muscle"}], "answer": "A", "explanation": "Positive drop-arm test = full-thickness rotator cuff (most often supraspinatus) tear.", "objective": "Shoulder Disorders — Rotator Cuff Strain / Tear", "section": "Shoulder Disorders"}, {"id": "27A", "group": 27, "stem": "Which study is the gold standard to confirm the injury?", "options": [{"letter": "A", "text": "MRI of the shoulder"}, {"letter": "B", "text": "Shoulder X-ray series"}, {"letter": "C", "text": "CT of the shoulder"}, {"letter": "D", "text": "EMG/NCS"}, {"letter": "E", "text": "Arthrocentesis"}], "answer": "A", "explanation": "MRI is gold standard (± POCUS).", "objective": "Shoulder Disorders — Rotator Cuff Strain / Tear", "section": "Shoulder Disorders"}, {"id": "28", "group": 28, "stem": "A 35-year-old swimmer has shoulder pain with overhead strokes. Pain is reproduced when the examiner passively forward-flexes his arm above 90°, and again with internal rotation at 90° of forward flexion. Strength is full. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Subacromial impingement syndrome"}, {"letter": "B", "text": "Adhesive capsulitis"}, {"letter": "C", "text": "Full-thickness rotator cuff tear"}, {"letter": "D", "text": "Acromioclavicular separation"}, {"letter": "E", "text": "Glenohumeral osteoarthritis"}], "answer": "A", "explanation": "Positive Neer and Hawkins-Kennedy with preserved strength = impingement (most common cause of shoulder pain).", "objective": "Shoulder Disorders — Impingement Syndrome", "section": "Shoulder Disorders"}, {"id": "28A", "group": 28, "stem": "What is the mainstay of treatment?", "options": [{"letter": "A", "text": "Physical therapy and NSAIDs"}, {"letter": "B", "text": "Subacromial decompression now"}, {"letter": "C", "text": "Shoulder immobilization 6 weeks"}, {"letter": "D", "text": "Intra-articular hyaluronic acid"}, {"letter": "E", "text": "Reverse shoulder arthroplasty"}], "answer": "A", "explanation": "PT is the mainstay; decompression only after 4–6 mo of failed conservative care (surgery not superior).", "objective": "Shoulder Disorders — Impingement Syndrome", "section": "Shoulder Disorders"}, {"id": "29", "group": 29, "stem": "A 54-year-old woman with type 2 diabetes has 4 months of gradually worsening shoulder pain and stiffness without injury. She cannot reach behind her back to fasten her bra. Which exam finding best distinguishes her condition from a rotator cuff tear?", "options": [{"letter": "A", "text": "Loss of both active and passive range of motion"}, {"letter": "B", "text": "Loss of active ROM with full passive ROM"}, {"letter": "C", "text": "Positive drop-arm test"}, {"letter": "D", "text": "Positive Speed's test"}, {"letter": "E", "text": "Weakness with resisted external rotation"}], "answer": "A", "explanation": "Adhesive capsulitis = global loss of active AND passive ROM; cuff tear/impingement preserves passive ROM.", "objective": "Shoulder Disorders — Adhesive Capsulitis", "section": "Shoulder Disorders"}, {"id": "29A", "group": 29, "stem": "Besides shoulder X-rays, which labs are appropriate?", "options": [{"letter": "A", "text": "TSH and hemoglobin A1c"}, {"letter": "B", "text": "ESR and rheumatoid factor"}, {"letter": "C", "text": "CK and aldolase"}, {"letter": "D", "text": "Uric acid and CRP"}, {"letter": "E", "text": "HLA-B27 and ANA"}], "answer": "A", "explanation": "Associated with diabetes and thyroid disease → TSH, A1c; X-ray is normal.", "objective": "Shoulder Disorders — Adhesive Capsulitis", "section": "Shoulder Disorders"}, {"id": "30", "group": 30, "stem": "A 20-year-old rugby player was tackled and landed directly on the point of his right shoulder. He has pain on top of the shoulder, point tenderness over the AC joint, and pain when the examiner passively adducts his arm across his chest. Which imaging is most appropriate?", "options": [{"letter": "A", "text": "Bilateral AC joint X-rays"}, {"letter": "B", "text": "MRI of the right shoulder"}, {"letter": "C", "text": "Axillary view of the right shoulder"}, {"letter": "D", "text": "CT of the chest"}, {"letter": "E", "text": "Right shoulder ultrasound"}], "answer": "A", "explanation": "AC separation: direct blow to the shoulder; positive crossover test; bilateral AC views compare clavicle elevation.", "objective": "Shoulder Disorders — AC Sprain / Separation", "section": "Shoulder Disorders"}, {"id": "30A", "group": 30, "stem": "Films show the right clavicle elevated about one clavicle width above the left, with AC and coracoclavicular ligament disruption and no marked superior, posterior, or inferior displacement. What is the appropriate management?", "options": [{"letter": "A", "text": "Brief sling immobilization, then early ROM"}, {"letter": "B", "text": "Open reduction and internal fixation"}, {"letter": "C", "text": "Figure-of-eight brace for 12 weeks"}, {"letter": "D", "text": "Shoulder spica cast"}, {"letter": "E", "text": "Arthroscopic labral repair"}], "answer": "A", "explanation": "Rockwood III here. Rockwood I–III: brief immobilization (≤1 wk) → early ROM; IV–VI surgical.", "objective": "Shoulder Disorders — AC Sprain / Separation", "section": "Shoulder Disorders"}, {"id": "31", "group": 31, "stem": "A 47-year-old man fell from a ladder onto his outstretched arm and has a deformed, swollen mid-upper arm. He cannot extend his wrist or fingers. Which nerve is injured?", "options": [{"letter": "A", "text": "Radial nerve"}, {"letter": "B", "text": "Median nerve"}, {"letter": "C", "text": "Ulnar nerve"}, {"letter": "D", "text": "Axillary nerve"}, {"letter": "E", "text": "Musculocutaneous nerve"}], "answer": "A", "explanation": "Humeral shaft fracture → radial nerve (spiral groove) → wrist drop ± dorsal hand numbness.", "objective": "Shoulder Disorders — Humeral Shaft Fracture", "section": "Shoulder Disorders"}, {"id": "31A", "group": 31, "stem": "X-ray confirms a closed midshaft fracture. What is the initial management?", "options": [{"letter": "A", "text": "Coaptation (sugar-tong) splint and sling"}, {"letter": "B", "text": "Immediate intramedullary nailing"}, {"letter": "C", "text": "Long-arm cast to the shoulder"}, {"letter": "D", "text": "Figure-of-eight strap"}, {"letter": "E", "text": "Skeletal traction"}], "answer": "A", "explanation": "Coaptation splint + sling → functional brace at 1–2 wk; most heal nonoperatively; document radial nerve before and after splinting.", "objective": "Shoulder Disorders — Humeral Shaft Fracture", "section": "Shoulder Disorders"}, {"id": "32", "group": 32, "stem": "A 9-year-old fell off his bike onto his right shoulder. He has a tender, swollen bump over the middle of the collarbone. X-ray shows a displaced, overlapping midshaft clavicle fracture. Skin is intact and the neurovascular exam is normal. What is the appropriate management?", "options": [{"letter": "A", "text": "Sling immobilization (nonoperative)"}, {"letter": "B", "text": "Open reduction and plate fixation"}, {"letter": "C", "text": "Closed reduction under sedation"}, {"letter": "D", "text": "Emergent vascular imaging"}, {"letter": "E", "text": "Shoulder spica cast"}], "answer": "A", "explanation": "Children: nonoperative even with marked displacement — 'if it's in the same room, it will heal.' Middle third is most common.", "objective": "Shoulder Disorders — Clavicle Fracture", "section": "Shoulder Disorders"}, {"id": "33", "group": 33, "stem": "A 61-year-old man felt a pop in his anterior shoulder while lifting a heavy bag of mulch. He now has a bulge in his distal upper arm when he flexes his elbow; elbow strength is nearly normal. What is the appropriate management?", "options": [{"letter": "A", "text": "Conservative care with physical therapy"}, {"letter": "B", "text": "Urgent surgical reattachment"}, {"letter": "C", "text": "Long-arm cast for 6 weeks"}, {"letter": "D", "text": "Hook test and surgical repair"}, {"letter": "E", "text": "Corticosteroid injection into the tendon"}], "answer": "A", "explanation": "Long head rupture → 'Popeye' deformity; little strength loss → nonoperative. Distal rupture (reverse Popeye, abnormal hook test) is the one repaired.", "objective": "Shoulder Disorders — Proximal Biceps Tendon Rupture", "section": "Shoulder Disorders"}, {"id": "34", "group": 34, "stem": "A 21-year-old man fell onto his outstretched, extended hand while skateboarding. He has radial-sided wrist pain with tenderness between the extensor pollicis longus and brevis tendons. Wrist X-rays, including a scaphoid view, show no fracture. What is the most appropriate management today?", "options": [{"letter": "A", "text": "Thumb spica splint and orthopedic referral"}, {"letter": "B", "text": "Reassurance and an elastic wrap"}, {"letter": "C", "text": "Volar cock-up wrist splint for comfort"}, {"letter": "D", "text": "Corticosteroid injection of the 1st compartment"}, {"letter": "E", "text": "Return to activity as tolerated"}], "answer": "A", "explanation": "Snuffbox tenderness after FOOSH = treat as scaphoid fracture regardless of X-ray: thumb spica, refer, document.", "objective": "Elbow, Wrist & Hand — Scaphoid Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "34A", "group": 34, "stem": "If symptoms persist, when should plain films be repeated?", "options": [{"letter": "A", "text": "In 7–10 days"}, {"letter": "B", "text": "In 24 hours"}, {"letter": "C", "text": "In 6 months"}, {"letter": "D", "text": "Only if numbness develops"}, {"letter": "E", "text": "Repeat films are not useful"}], "answer": "A", "explanation": "Fracture line appears once resorption begins (7–10 d); MRI is most sensitive for occult fracture.", "objective": "Elbow, Wrist & Hand — Scaphoid Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "34B", "group": 34, "stem": "Which fracture location carries the highest risk of avascular necrosis?", "options": [{"letter": "A", "text": "Proximal pole"}, {"letter": "B", "text": "Distal pole"}, {"letter": "C", "text": "Waist"}, {"letter": "D", "text": "Tubercle"}, {"letter": "E", "text": "Distal radius articular surface"}], "answer": "A", "explanation": "Retrograde blood supply (dorsal branch of the radial artery) → proximal pole has the highest AVN risk; waist is the most common site.", "objective": "Elbow, Wrist & Hand — Scaphoid Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "35", "group": 35, "stem": "A 17-year-old punched a locker after losing a game. He has swelling over the ulnar side of the dorsal right hand and a depressed fifth knuckle. When he makes a fist, the small finger overlaps the ring finger. X-ray shows a fifth metacarpal neck fracture with 30° of volar angulation. Which finding mandates reduction or surgery?", "options": [{"letter": "A", "text": "Rotational malalignment of the finger"}, {"letter": "B", "text": "30° of angulation of the 5th MC neck"}, {"letter": "C", "text": "Swelling of the dorsal hand"}, {"letter": "D", "text": "Tenderness over the 4th metacarpal"}, {"letter": "E", "text": "Inability to make a full fist due to pain"}], "answer": "A", "explanation": "Any malrotation (finger overlap on flexion) needs reduction/ORIF; up to ~40° angulation is tolerated in the 5th MC.", "objective": "Elbow, Wrist & Hand — Boxer's Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "35A", "group": 35, "stem": "Once alignment is acceptable, how should the hand be immobilized?", "options": [{"letter": "A", "text": "Ulnar gutter splint in the intrinsic-plus position"}, {"letter": "B", "text": "Thumb spica splint with the wrist neutral"}, {"letter": "C", "text": "Volar cock-up splint with fingers free"}, {"letter": "D", "text": "Sugar-tong splint with the elbow at 90°"}, {"letter": "E", "text": "Buddy taping of the 4th and 5th fingers alone"}], "answer": "A", "explanation": "Ulnar gutter splint, MCPs flexed (intrinsic-plus).", "objective": "Elbow, Wrist & Hand — Boxer's Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "36", "group": 36, "stem": "A 68-year-old woman with osteoporosis slipped on ice and landed on her outstretched hand with the wrist extended. Her wrist has a 'dinner fork' deformity. Which finding is expected on the lateral X-ray?", "options": [{"letter": "A", "text": "Dorsal displacement of the distal radius fragment"}, {"letter": "B", "text": "Volar displacement of the distal radius fragment"}, {"letter": "C", "text": "Proximal ulnar fracture with radial head dislocation"}, {"letter": "D", "text": "Widened scapholunate interval"}, {"letter": "E", "text": "Fracture of the 5th metacarpal neck"}], "answer": "A", "explanation": "Colles = distal radius with DORSAL displacement (extension injury); Smith = volar ('garden spade').", "objective": "Elbow, Wrist & Hand — Colles Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "36A", "group": 36, "stem": "Which nerve should be reassessed after closed reduction?", "options": [{"letter": "A", "text": "Median nerve"}, {"letter": "B", "text": "Ulnar nerve"}, {"letter": "C", "text": "Radial nerve"}, {"letter": "D", "text": "Axillary nerve"}, {"letter": "E", "text": "Musculocutaneous nerve"}], "answer": "A", "explanation": "Closed reduction (± hematoma block) → sugar-tong splint; recheck the median nerve.", "objective": "Elbow, Wrist & Hand — Colles Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "37", "group": 37, "stem": "A 6-year-old fell off the monkey bars onto his outstretched arm. His elbow is swollen and he refuses to move it. On the lateral X-ray, there is a posterior fat pad and the anterior humeral line passes anterior to the capitellum. Which nerve deficit must be checked by asking him to make an 'OK' sign?", "options": [{"letter": "A", "text": "Anterior interosseous nerve"}, {"letter": "B", "text": "Posterior interosseous nerve"}, {"letter": "C", "text": "Ulnar nerve"}, {"letter": "D", "text": "Axillary nerve"}, {"letter": "E", "text": "Musculocutaneous nerve"}], "answer": "A", "explanation": "Supracondylar fracture: AIN = can't make the OK sign; radial nerve = wrist drop; always check pulses.", "objective": "Elbow, Wrist & Hand — Supracondylar Humerus Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "37A", "group": 37, "stem": "Hours after casting, he has severe forearm pain with passive finger extension. What is the immediate management?", "options": [{"letter": "A", "text": "Remove the cast and arrange emergency fasciotomy"}, {"letter": "B", "text": "Elevate the arm above the heart and give opioids"}, {"letter": "C", "text": "Reassess pulses and pain again in 24 hours"}, {"letter": "D", "text": "Overwrap the cast to limit further swelling"}, {"letter": "E", "text": "Obtain a bone scan of the forearm"}], "answer": "A", "explanation": "Compartment syndrome → remove all dressings/casts + emergency fasciotomy; missed → Volkmann's ischemic contracture.", "objective": "Elbow, Wrist & Hand — Supracondylar Humerus Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "38", "group": 38, "stem": "A 3-year-old refuses to use her left arm after her father lifted her by the hand to keep her from tripping on a curb. She holds the arm slightly flexed and pronated. There is no swelling or deformity. What is the most appropriate management?", "options": [{"letter": "A", "text": "Closed reduction by hyperpronation or supination-flexion"}, {"letter": "B", "text": "Elbow X-rays before any manipulation is attempted"}, {"letter": "C", "text": "Long-arm cast at 90° of flexion for 3 weeks"}, {"letter": "D", "text": "Sling immobilization and recheck in 1 week"}, {"letter": "E", "text": "MRI of the elbow to assess the annular ligament"}], "answer": "A", "explanation": "Radial head subluxation (annular ligament): reduce without imaging when the history is classic; immediate return of use confirms.", "objective": "Elbow, Wrist & Hand — Nursemaid's Elbow", "section": "Elbow, Wrist & Hand"}, {"id": "39", "group": 39, "stem": "A 44-year-old mechanic has 2 months of lateral elbow pain that worsens when he grips wrenches. There is tenderness just distal to the lateral epicondyle, and resisted wrist extension with the elbow extended reproduces the pain. Which tendon is primarily involved?", "options": [{"letter": "A", "text": "Extensor carpi radialis brevis"}, {"letter": "B", "text": "Flexor carpi radialis"}, {"letter": "C", "text": "Pronator teres"}, {"letter": "D", "text": "Extensor pollicis brevis"}, {"letter": "E", "text": "Brachioradialis"}], "answer": "A", "explanation": "Tennis elbow = ECRB degeneration (angiofibroblastic hyperplasia); positive Cozen's test.", "objective": "Elbow, Wrist & Hand — Lateral Epicondylitis", "section": "Elbow, Wrist & Hand"}, {"id": "39A", "group": 39, "stem": "What is the first-line management?", "options": [{"letter": "A", "text": "Stop the aggravating activity, counterforce brace, PT, NSAIDs"}, {"letter": "B", "text": "Corticosteroid injection at the first visit, then return to work"}, {"letter": "C", "text": "Surgical release of the common extensor origin"}, {"letter": "D", "text": "Long-arm cast with the wrist extended for 6 weeks"}, {"letter": "E", "text": "MRI of the elbow before any treatment is started"}], "answer": "A", "explanation": "Conservative first; injection is controversial; surgery for chronic failures. Noncompliance with activity cessation is the common cause of failure.", "objective": "Elbow, Wrist & Hand — Lateral Epicondylitis", "section": "Elbow, Wrist & Hand"}, {"id": "40", "group": 40, "stem": "A 34-year-old woman in her third trimester has nighttime numbness of the thumb, index, and middle fingers that wakes her. Holding her wrists in full flexion for 60 seconds reproduces the symptoms. Which nerve is compressed?", "options": [{"letter": "A", "text": "Median nerve"}, {"letter": "B", "text": "Ulnar nerve"}, {"letter": "C", "text": "Radial nerve"}, {"letter": "D", "text": "Anterior interosseous nerve"}, {"letter": "E", "text": "Posterior interosseous nerve"}], "answer": "A", "explanation": "Carpal tunnel: median nerve, Phalen's/Tinel's; pregnancy, DM, hypothyroidism, RA are risk factors.", "objective": "Elbow, Wrist & Hand — Carpal Tunnel Syndrome", "section": "Elbow, Wrist & Hand"}, {"id": "40A", "group": 40, "stem": "Which late finding indicates more advanced disease?", "options": [{"letter": "A", "text": "Thenar (abductor pollicis brevis) atrophy"}, {"letter": "B", "text": "Hypothenar atrophy"}, {"letter": "C", "text": "Clawing of the 4th and 5th fingers"}, {"letter": "D", "text": "Wrist drop"}, {"letter": "E", "text": "Swan neck deformity"}], "answer": "A", "explanation": "Late: thenar wasting and weakness. Hypothenar atrophy/claw = ulnar.", "objective": "Elbow, Wrist & Hand — Carpal Tunnel Syndrome", "section": "Elbow, Wrist & Hand"}, {"id": "40B", "group": 40, "stem": "What is the first-line treatment?", "options": [{"letter": "A", "text": "Wrist splinting, activity modification, NSAIDs"}, {"letter": "B", "text": "Surgical carpal tunnel release"}, {"letter": "C", "text": "Wrist MRI"}, {"letter": "D", "text": "Corticosteroid injection into the tendon"}, {"letter": "E", "text": "Oral gabapentin only"}], "answer": "A", "explanation": "Splint first; steroid injection near (not into) the tendons if refractory; release if failed conservative care. Imaging not indicated.", "objective": "Elbow, Wrist & Hand — Carpal Tunnel Syndrome", "section": "Elbow, Wrist & Hand"}, {"id": "41", "group": 41, "stem": "A 31-year-old mother of a 2-month-old has radial-sided wrist pain that worsens when she lifts her baby. Pain is reproduced when she tucks her thumb into her fist and the examiner ulnarly deviates her wrist. Which tendons are involved?", "options": [{"letter": "A", "text": "Abductor pollicis longus and extensor pollicis brevis"}, {"letter": "B", "text": "Extensor pollicis longus and extensor indicis"}, {"letter": "C", "text": "Flexor pollicis longus and flexor carpi radialis"}, {"letter": "D", "text": "Extensor carpi radialis longus and brevis"}, {"letter": "E", "text": "Extensor carpi ulnaris and extensor digiti minimi"}], "answer": "A", "explanation": "First dorsal compartment (APL + EPB); positive Finkelstein's.", "objective": "Elbow, Wrist & Hand — De Quervain's Tenosynovitis", "section": "Elbow, Wrist & Hand"}, {"id": "41A", "group": 41, "stem": "What is the initial management?", "options": [{"letter": "A", "text": "Thumb spica splint and NSAIDs"}, {"letter": "B", "text": "Surgical release of the 1st compartment"}, {"letter": "C", "text": "Ulnar gutter splint"}, {"letter": "D", "text": "Wrist MRI"}, {"letter": "E", "text": "Long-arm cast"}], "answer": "A", "explanation": "Thumb spica + activity modification; steroid injection if refractory; surgical release last.", "objective": "Elbow, Wrist & Hand — De Quervain's Tenosynovitis", "section": "Elbow, Wrist & Hand"}, {"id": "42", "group": 42, "stem": "A 29-year-old skier fell with her ski pole in her hand, forcing her thumb away from the index finger. She has swelling and tenderness on the ulnar side of the thumb MCP, and valgus stress of the MCP shows laxity. Which structure is injured?", "options": [{"letter": "A", "text": "Ulnar collateral ligament of the thumb MCP"}, {"letter": "B", "text": "Radial collateral ligament of the thumb MCP"}, {"letter": "C", "text": "Scapholunate ligament"}, {"letter": "D", "text": "Triangular fibrocartilage complex"}, {"letter": "E", "text": "First dorsal compartment tendons"}], "answer": "A", "explanation": "Forced radial deviation (abduction) of the thumb → UCL injury ± avulsion at the base of the proximal phalanx.", "objective": "Elbow, Wrist & Hand — Gamekeeper's Thumb", "section": "Elbow, Wrist & Hand"}, {"id": "42A", "group": 42, "stem": "MRI shows the torn ligament displaced superficial to the adductor aponeurosis. What is the management?", "options": [{"letter": "A", "text": "Surgical repair"}, {"letter": "B", "text": "Thumb spica for 4–6 weeks"}, {"letter": "C", "text": "Buddy taping"}, {"letter": "D", "text": "Observation"}, {"letter": "E", "text": "Corticosteroid injection"}], "answer": "A", "explanation": "Stener lesion can't heal → surgery; partial/non-Stener injuries → thumb spica 4–6 wk.", "objective": "Elbow, Wrist & Hand — Gamekeeper's Thumb", "section": "Elbow, Wrist & Hand"}, {"id": "43", "group": 43, "stem": "A 25-year-old basketball player jammed his right ring fingertip on the ball. The DIP rests in about 45° of flexion and he cannot actively extend it. X-ray shows no fracture. What is the appropriate treatment?", "options": [{"letter": "A", "text": "Continuous DIP extension splint for 6–8 weeks"}, {"letter": "B", "text": "Buddy taping to the middle finger for 1 week"}, {"letter": "C", "text": "PIP extension splint for 6 weeks, DIP free"}, {"letter": "D", "text": "DIP extension splint at night only for 2 weeks"}, {"letter": "E", "text": "Immediate surgical pinning of the DIP joint"}], "answer": "A", "explanation": "Extensor tendon avulsion at the DIP: continuous extension splint 6–8 wk — any flexion restarts the clock.", "objective": "Elbow, Wrist & Hand — Mallet Finger", "section": "Elbow, Wrist & Hand"}, {"id": "44", "group": 44, "stem": "A 35-year-old man raised his forearm to block a nightstick blow. He has elbow pain and swelling, and the radial head is palpably displaced. Forearm X-ray shows a proximal ulnar shaft fracture. What associated injury defines this fracture pattern?", "options": [{"letter": "A", "text": "Radial head dislocation"}, {"letter": "B", "text": "Distal radioulnar joint dislocation"}, {"letter": "C", "text": "Olecranon fracture"}, {"letter": "D", "text": "Distal radius fracture"}, {"letter": "E", "text": "Coronoid fracture"}], "answer": "A", "explanation": "Monteggia = proximal ulna fracture + radial head dislocation; Galeazzi = distal radius fracture + DRUJ dislocation (MUGR).", "objective": "Elbow, Wrist & Hand — Monteggia Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "44A", "group": 44, "stem": "Which nerve is at risk with this injury?", "options": [{"letter": "A", "text": "Posterior interosseous nerve"}, {"letter": "B", "text": "Anterior interosseous nerve"}, {"letter": "C", "text": "Ulnar nerve at the cubital tunnel"}, {"letter": "D", "text": "Median nerve at the carpal tunnel"}, {"letter": "E", "text": "Axi
