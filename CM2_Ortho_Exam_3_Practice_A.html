llary nerve"}], "answer": "A", "explanation": "Check PIN (finger drop). Adults → ORIF; always image the joint above and below.", "objective": "Elbow, Wrist & Hand — Monteggia Fracture", "section": "Elbow, Wrist & Hand"}, {"id": "45", "group": 45, "stem": "A 52-year-old roofer scraped his elbow 3 days ago. He now has a red, warm, tender, fluctuant swelling over the tip of the elbow. Elbow flexion and extension are full and painless. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Aspirate the bursa for cell count, Gram stain, and culture"}, {"letter": "B", "text": "Arthrocentesis of the elbow joint through the lateral portal"}, {"letter": "C", "text": "Intrabursal corticosteroid injection and compression wrap"}, {"letter": "D", "text": "Compression wrap, NSAIDs, and recheck in two weeks"}, {"letter": "E", "text": "MRI of the elbow with contrast before any procedure"}], "answer": "A", "explanation": "Septic bursitis must be ruled out before calling it aseptic; preserved ROM = bursa, not joint. Aspirate, then antibiotics; never inject steroid into a possibly infected bursa.", "objective": "Elbow, Wrist & Hand — Septic Olecranon Bursitis", "section": "Elbow, Wrist & Hand"}, {"id": "46", "group": 46, "stem": "A 40-year-old software developer who rests his elbows on his desk has numbness of the ring and small fingers and medial elbow aching. Tapping behind the medial epicondyle reproduces the tingling. Which treatment is NOT recommended?", "options": [{"letter": "A", "text": "Corticosteroid injection at the cubital tunnel"}, {"letter": "B", "text": "Nighttime elbow extension splint"}, {"letter": "C", "text": "Avoid leaning on the elbow"}, {"letter": "D", "text": "NSAIDs"}, {"letter": "E", "text": "Ulnar nerve decompression if refractory"}], "answer": "A", "explanation": "Ulnar nerve compression at the elbow: activity modification + night extension splint; steroid injection not recommended.", "objective": "Elbow, Wrist & Hand — Cubital Tunnel Syndrome", "section": "Elbow, Wrist & Hand"}, {"id": "47", "group": 47, "stem": "A 41-year-old man playing weekend pickup basketball felt like someone kicked him in the back of the leg as he pushed off. He has a palpable gap about 5 cm above the heel. Two weeks ago he finished a course of ciprofloxacin. Which exam finding confirms the diagnosis?", "options": [{"letter": "A", "text": "No plantarflexion when the calf is squeezed"}, {"letter": "B", "text": "Pain with external rotation of the foot"}, {"letter": "C", "text": "Increased anterior translation of the talus"}, {"letter": "D", "text": "Pain on compressing the metatarsal heads"}, {"letter": "E", "text": "Tingling with percussion behind the medial malleolus"}], "answer": "A", "explanation": "Positive Thompson test; fluoroquinolones and steroids are risk factors for rupture.", "objective": "Ankle & Foot — Achilles Tendon Rupture", "section": "Ankle & Foot"}, {"id": "47A", "group": 47, "stem": "He is an avid athlete. What is the preferred definitive management?", "options": [{"letter": "A", "text": "Open surgical repair"}, {"letter": "B", "text": "Corticosteroid injection and rest"}, {"letter": "C", "text": "Walking boot in neutral and PT now"}, {"letter": "D", "text": "Ankle brace and return to play"}, {"letter": "E", "text": "Physical therapy only"}], "answer": "A", "explanation": "Athletes → open repair; less active/elderly/comorbid → splint/cast in plantarflexion. Non-op has higher re-rupture risk.", "objective": "Ankle & Foot — Achilles Tendon Rupture", "section": "Ankle & Foot"}, {"id": "48", "group": 48, "stem": "A 24-year-old woman rolled her right ankle inward stepping off a curb. She has swelling and tenderness anterior to the lateral malleolus but no bony tenderness at the posterior edges or tips of either malleolus, the navicular, or the base of the fifth metatarsal. She walked four steps in the ED. Which ligament is most likely injured?", "options": [{"letter": "A", "text": "Anterior talofibular ligament"}, {"letter": "B", "text": "Deltoid ligament"}, {"letter": "C", "text": "Calcaneofibular ligament alone"}, {"letter": "D", "text": "Anterior inferior tibiofibular ligament"}, {"letter": "E", "text": "Spring ligament"}], "answer": "A", "explanation": "Inversion → ATFL first (most common), then CFL, PTFL. Eversion → deltoid.", "objective": "Ankle & Foot — Lateral Ankle Sprain / Ottawa Rules", "section": "Ankle & Foot"}, {"id": "48A", "group": 48, "stem": "Which imaging is indicated?", "options": [{"letter": "A", "text": "No imaging — Ottawa rules are negative"}, {"letter": "B", "text": "Ankle X-ray series (AP, lateral, mortise)"}, {"letter": "C", "text": "Foot X-ray series (AP, lateral, oblique)"}, {"letter": "D", "text": "MRI of the ankle to grade the ligament"}, {"letter": "E", "text": "CT of the ankle to exclude occult fracture"}], "answer": "A", "explanation": "Ottawa: X-ray only for malleolar posterior-edge/tip tenderness, navicular or 5th MT base tenderness, or inability to bear weight 4 steps.", "objective": "Ankle & Foot — Lateral Ankle Sprain / Ottawa Rules", "section": "Ankle & Foot"}, {"id": "48B", "group": 48, "stem": "Which special test assesses the injured ligament's integrity?", "options": [{"letter": "A", "text": "Anterior drawer of the ankle"}, {"letter": "B", "text": "Kleiger external rotation test"}, {"letter": "C", "text": "Thompson test"}, {"letter": "D", "text": "Mulder's click"}, {"letter": "E", "text": "Squeeze test of the forefoot"}], "answer": "A", "explanation": "Anterior drawer = ATFL; talar tilt = CFL; Kleiger = syndesmosis/deltoid.", "objective": "Ankle & Foot — Lateral Ankle Sprain / Ottawa Rules", "section": "Ankle & Foot"}, {"id": "49", "group": 49, "stem": "A 20-year-old linebacker had his planted foot forcefully externally rotated during a tackle. He has pain above the ankle joint that worsens with pivoting, minimal swelling, and tenderness over the anterior tibiofibular ligament. Externally rotating the foot with the knee flexed reproduces the pain. Which special test was performed?", "options": [{"letter": "A", "text": "Kleiger's test"}, {"letter": "B", "text": "Anterior drawer test"}, {"letter": "C", "text": "Talar tilt test"}, {"letter": "D", "text": "Thompson test"}, {"letter": "E", "text": "Tinel's sign at the tarsal tunnel"}], "answer": "A", "explanation": "External rotation mechanism → syndesmotic (high ankle) sprain; Kleiger's test. Recovery takes far longer than a lateral sprain.", "objective": "Ankle & Foot — High Ankle Sprain", "section": "Ankle & Foot"}, {"id": "49A", "group": 49, "stem": "Mortise X-rays show widening of the tibiofibular clear space. What is the management?", "options": [{"letter": "A", "text": "Syndesmotic screw or suture-button fixation"}, {"letter": "B", "text": "Boot and crutches for 2 weeks, then return"}, {"letter": "C", "text": "Lace-up ankle brace and return to play"}, {"letter": "D", "text": "Achilles tendon lengthening procedure"}, {"letter": "E", "text": "Corticosteroid injection of the syndesmosis"}], "answer": "A", "explanation": "Unstable syndesmosis (mortise widening) → syndesmotic screw/tightrope fixation.", "objective": "Ankle & Foot — High Ankle Sprain", "section": "Ankle & Foot"}, {"id": "50", "group": 50, "stem": "A 26-year-old soccer player has had lateral foot pain for weeks that suddenly worsened during a game. X-ray shows a transverse fracture at the metaphyseal–diaphyseal junction of the fifth metatarsal, about 2 cm distal to the tuberosity. What is the most appropriate management?", "options": [{"letter": "A", "text": "Non-weight bearing in a cast and orthopedic referral"}, {"letter": "B", "text": "Hard-soled shoe and weight bearing as tolerated"}, {"letter": "C", "text": "Buddy taping to the 4th toe"}, {"letter": "D", "text": "Ankle brace and return to play"}, {"letter": "E", "text": "Elastic wrap and NSAIDs only"}], "answer": "A", "explanation": "Jones fracture (watershed zone) → NWB + ortho (nonunion risk). Avulsion of the tuberosity (inversion) → hard-soled shoe, WBAT.", "objective": "Ankle & Foot — 5th Metatarsal Fracture", "section": "Ankle & Foot"}, {"id": "51", "group": 51, "stem": "A 33-year-old woman missed a step with her foot pointed downward and twisted it. She cannot bear weight and has midfoot swelling with bruising on the plantar arch. AP foot X-ray is expected to show what?", "options": [{"letter": "A", "text": "Widening between the 1st and 2nd metatarsal bases"}, {"letter": "B", "text": "Transverse fracture of the 5th MT base"}, {"letter": "C", "text": "Lateral subluxation of the talus"}, {"letter": "D", "text": "Avulsion of the posterior calcaneus"}, {"letter": "E", "text": "Narrowing of the 1st MTP joint"}], "answer": "A", "explanation": "Plantar arch ecchymosis after a midfoot injury = Lisfranc until proven otherwise; fleck sign is pathognomonic.", "objective": "Ankle & Foot — Lisfranc Injury", "section": "Ankle & Foot"}, {"id": "51A", "group": 51, "stem": "Films show 3 mm of displacement. What is the management?", "options": [{"letter": "A", "text": "Open reduction and internal fixation"}, {"letter": "B", "text": "Hard-soled shoe and weight bearing as tolerated"}, {"letter": "C", "text": "Lace-up ankle brace for 2 weeks"}, {"letter": "D", "text": "Metatarsal pad and custom orthotic"}, {"letter": "E", "text": "Buddy taping of the 1st and 2nd toes"}], "answer": "A", "explanation": "Displaced/dislocated → ORIF; nondisplaced → NWB cast 6–8 wk. >1 mm malalignment is pathologic.", "objective": "Ankle & Foot — Lisfranc Injury", "section": "Ankle & Foot"}, {"id": "52", "group": 52, "stem": "A 47-year-old obese man has sharp heel pain that is worst with his first steps out of bed and eases after walking a few minutes. He has point tenderness over the medial calcaneal tubercle and tight calves. What is the most appropriate first-line treatment?", "options": [{"letter": "A", "text": "Stretching, night splints, supportive shoes, and NSAIDs"}, {"letter": "B", "text": "Plantar fascia release at the first visit"}, {"letter": "C", "text": "Corticosteroid injection into the Achilles tendon"}, {"letter": "D", "text": "Short-leg non-weight-bearing cast for 6 weeks"}, {"letter": "E", "text": "Bone scan before any treatment is started"}], "answer": "A", "explanation": "Most common cause of heel pain; conservative course is prolonged; shockwave for refractory; release surgery last.", "objective": "Ankle & Foot — Plantar Fasciitis", "section": "Ankle & Foot"}, {"id": "53", "group": 53, "stem": "A 45-year-old woman who wears narrow dress shoes has burning forefoot pain radiating into the third and fourth toes. Squeezing the metatarsal heads together produces a painful click in the third interspace. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Morton (interdigital) neuroma"}, {"letter": "B", "text": "Metatarsal stress fracture"}, {"letter": "C", "text": "Tarsal tunnel syndrome"}, {"letter": "D", "text": "Sesamoiditis"}, {"letter": "E", "text": "Hallux rigidus"}], "answer": "A", "explanation": "Perineural fibrosis of the common digital nerve (3rd–4th interspace); Mulder's click.", "objective": "Ankle & Foot — Morton's Neuroma", "section": "Ankle & Foot"}, {"id": "53A", "group": 53, "stem": "What is the first-line management?", "options": [{"letter": "A", "text": "Wide toe-box shoes and metatarsal pads"}, {"letter": "B", "text": "Surgical excision"}, {"letter": "C", "text": "Corticosteroid injection as first step"}, {"letter": "D", "text": "Short-leg walking cast"}, {"letter": "E", "text": "Bone scan"}], "answer": "A", "explanation": "Footwear/pads first; steroid injection if persistent; excision if conservative care fails. Ultrasound localizes the neuroma.", "objective": "Ankle & Foot — Morton's Neuroma", "section": "Ankle & Foot"}, {"id": "54", "group": 54, "stem": "A 19-year-old military recruit has 2 weeks of forefoot pain that worsens during marches and improves with rest. There is point tenderness over the second metatarsal shaft. Initial X-ray is normal. Which of the following is true?", "options": [{"letter": "A", "text": "A normal X-ray does not rule out the fracture"}, {"letter": "B", "text": "A normal X-ray excludes a stress fracture"}, {"letter": "C", "text": "CT is the first-line study"}, {"letter": "D", "text": "He should continue training as tolerated"}, {"letter": "E", "text": "Callus is usually visible within 2 days"}], "answer": "A", "explanation": "X-ray often negative early; callus/periosteal reaction at repeat films; MRI/bone scan if unclear.", "objective": "Ankle & Foot — Metatarsal Stress Fracture", "section": "Ankle & Foot"}, {"id": "54A", "group": 54, "stem": "What is the management?", "options": [{"letter": "A", "text": "Walking boot or post-op shoe and activity modification"}, {"letter": "B", "text": "Open reduction and plate fixation of the 2nd MT"}, {"letter": "C", "text": "Long-leg cast and strict bed rest for 6 weeks"}, {"letter": "D", "text": "Corticosteroid injection at the fracture site"}, {"letter": "E", "text": "Immediate return to full duty with NSAIDs"}], "answer": "A", "explanation": "Immobilize 2–4 wk in post-op shoe/boot ± crutches; goal is to prevent a complete fracture.", "objective": "Ankle & Foot — Metatarsal Stress Fracture", "section": "Ankle & Foot"}, {"id": "55", "group": 55, "stem": "A 50-year-old woman with flat, pronated feet has burning and tingling along the medial ankle and sole, worse after standing all day. Tapping behind the medial malleolus reproduces the symptoms. Which nerve is compressed?", "options": [{"letter": "A", "text": "Tibial nerve"}, {"letter": "B", "text": "Deep peroneal nerve"}, {"letter": "C", "text": "Sural nerve"}, {"letter": "D", "text": "Superficial peroneal nerve"}, {"letter": "E", "text": "Saphenous nerve"}], "answer": "A", "explanation": "Lower-extremity analog of carpal tunnel; EMG/NCS confirms; orthotics first.", "objective": "Ankle & Foot — Tarsal Tunnel Syndrome", "section": "Ankle & Foot"}, {"id": "56", "group": 56, "stem": "A 15-year-old boy has 2 months of progressive pain above his right knee that wakes him at night and is not relieved by ibuprofen. There is a tender, firm mass over the distal femur. X-ray shows a destructive metaphyseal lesion with a 'sunburst' periosteal reaction and a Codman triangle. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Osteosarcoma"}, {"letter": "B", "text": "Ewing sarcoma"}, {"letter": "C", "text": "Osteoid osteoma"}, {"letter": "D", "text": "Osteochondroma"}, {"letter": "E", "text": "Giant cell tumor"}], "answer": "A", "explanation": "Most common primary malignant bone tumor in teens; metaphyseal distal femur; sunburst + Codman triangle.", "objective": "Orthopedic Neoplasms — Osteosarcoma", "section": "Orthopedic Neoplasms"}, {"id": "56A", "group": 56, "stem": "Which study is required for staging?", "options": [{"letter": "A", "text": "CT of the chest"}, {"letter": "B", "text": "Serum protein electrophoresis"}, {"letter": "C", "text": "Bone marrow biopsy"}, {"letter": "D", "text": "Skeletal survey only"}, {"letter": "E", "text": "Colonoscopy"}], "answer": "A", "explanation": "Staging: chest CT (lung mets) + bone scan or PET; MRI of the entire bone; biopsy for diagnosis.", "objective": "Orthopedic Neoplasms — Osteosarcoma", "section": "Orthopedic Neoplasms"}, {"id": "56B", "group": 56, "stem": "What is the treatment?", "options": [{"letter": "A", "text": "Chemotherapy with limb-salvage resection or amputation"}, {"letter": "B", "text": "External beam radiation therapy as monotherapy"}, {"letter": "C", "text": "Intralesional curettage and bone grafting"}, {"letter": "D", "text": "Observation with serial X-rays every 6 months"}, {"letter": "E", "text": "CT-guided radiofrequency ablation of the lesion"}], "answer": "A", "explanation": "Chemo + surgical resection (limb salvage) vs amputation; poorly radiosensitive.", "objective": "Orthopedic Neoplasms — Osteosarcoma", "section": "Orthopedic Neoplasms"}, {"id": "57", "group": 57, "stem": "A 12-year-old girl has 6 weeks of worsening thigh pain, fevers, and night sweats. Labs show leukocytosis, anemia, and an elevated ESR. X-ray shows a moth-eaten lesion in the femoral diaphysis with a layered 'onion-skin' periosteal reaction. Which biopsy finding is expected?", "options": [{"letter": "A", "text": "Small round blue cells"}, {"letter": "B", "text": "Malignant osteoid-forming cells"}, {"letter": "C", "text": "Spindle cells with numerous giant cells"}, {"letter": "D", "text": "Malignant cartilage with rings and arcs"}, {"letter": "E", "text": "Sheets of plasma cells"}], "answer": "A", "explanation": "Ewing: diaphyseal, onion skin, systemic symptoms (mimics osteomyelitis), small round blue cells, t(11;22). Radiosensitive, unlike osteosarcoma.", "objective": "Orthopedic Neoplasms — Ewing Sarcoma", "section": "Orthopedic Neoplasms"}, {"id": "58", "group": 58, "stem": "A 17-year-old boy has months of dull aching pain in his right tibia that is worst at night and dramatically relieved by aspirin. X-ray shows a small lucent nidus surrounded by dense reactive sclerosis. Which study best defines the lesion?", "options": [{"letter": "A", "text": "CT of the tibia"}, {"letter": "B", "text": "Bone scan only"}, {"letter": "C", "text": "PET scan"}, {"letter": "D", "text": "Ultrasound"}, {"letter": "E", "text": "Serum alkaline phosphatase"}], "answer": "A", "explanation": "Night pain relieved by NSAIDs/aspirin (prostaglandin-mediated) = osteoid osteoma; CT defines the <1 cm nidus.", "objective": "Orthopedic Neoplasms — Osteoid Osteoma", "section": "Orthopedic Neoplasms"}, {"id": "58A", "group": 58, "stem": "Pain persists despite NSAIDs. What is the preferred treatment?", "options": [{"letter": "A", "text": "CT-guided radiofrequency ablation"}, {"letter": "B", "text": "Above-knee amputation"}, {"letter": "C", "text": "Systemic chemotherapy"}, {"letter": "D", "text": "External beam radiation"}, {"letter": "E", "text": "Long-leg casting for 12 weeks"}], "answer": "A", "explanation": "RFA (1–2 sessions) for refractory pain; resection is the alternative.", "objective": "Orthopedic Neoplasms — Osteoid Osteoma", "section": "Orthopedic Neoplasms"}, {"id": "59", "group": 59, "stem": "A 34-year-old woman has several months of knee pain at rest and at night with swelling around the joint. X-ray shows an eccentric lytic lesion in the epiphysis of the distal femur extending toward the subchondral bone. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Giant cell tumor of bone"}, {"letter": "B", "text": "Non-ossifying fibroma"}, {"letter": "C", "text": "Unicameral bone cyst"}, {"letter": "D", "text": "Osteochondroma"}, {"letter": "E", "text": "Chondrosarcoma"}], "answer": "A", "explanation": "Epiphyseal location in an adult 30–50 distinguishes GCT; biopsy required; curettage with graft/cement; tends to recur.", "objective": "Orthopedic Neoplasms — Giant Cell Tumor", "section": "Orthopedic Neoplasms"}, {"id": "60", "group": 60, "stem": "A 68-year-old man has back and rib pain, fatigue, and a recent rib fracture after a cough. Labs show calcium 11.8 mg/dL, creatinine 2.1 mg/dL, and hemoglobin 9.4 g/dL. Which X-ray finding is expected on skeletal survey?", "options": [{"letter": "A", "text": "Multiple punched-out lytic lesions"}, {"letter": "B", "text": "Sunburst periosteal reaction"}, {"letter": "C", "text": "Onion-skin periosteal layering"}, {"letter": "D", "text": "Diffuse osteoblastic lesions"}, {"letter": "E", "text": "Bamboo spine"}], "answer": "A", "explanation": "CRAB: hypercalcemia, renal insufficiency, anemia, bone lesions (punched-out lytic). Most common primary bone malignancy overall.", "objective": "Orthopedic Neoplasms — Multiple Myeloma", "section": "Orthopedic Neoplasms"}, {"id": "60A", "group": 60, "stem": "Which urine finding is expected?", "options": [{"letter": "A", "text": "Bence Jones proteins"}, {"letter": "B", "text": "Myoglobin"}, {"letter": "C", "text": "Red cell casts"}, {"letter": "D", "text": "Calcium oxalate crystals"}, {"letter": "E", "text": "Nitrites"}], "answer": "A", "explanation": "Urine protein electrophoresis shows Bence Jones (light-chain) proteins.", "objective": "Orthopedic Neoplasms — Multiple Myeloma", "section": "Orthopedic Neoplasms"}, {"id": "61", "group": 61, "stem": "A 16-year-old boy has a painless, hard bump near his knee that he has noticed for a year. X-ray shows a bony projection from the distal femoral metaphysis, capped by cartilage and pointing away from the joint. What is the appropriate management?", "options": [{"letter": "A", "text": "Observation with serial X-rays"}, {"letter": "B", "text": "Wide surgical resection now"}, {"letter": "C", "text": "Chemotherapy"}, {"letter": "D", "text": "Radiation therapy"}, {"letter": "E", "text": "CT-guided ablation"}], "answer": "A", "explanation": "Osteochondroma: observe; resect only for symptoms/deformity/fracture.", "objective": "Orthopedic Neoplasms — Osteochondroma / Chondrosarcoma", "section": "Orthopedic Neoplasms"}, {"id": "61A", "group": 61, "stem": "Which later change would raise concern for malignant transformation?", "options": [{"letter": "A", "text": "Growth or new pain after skeletal maturity"}, {"letter": "B", "text": "Lesion stops growing at puberty end"}, {"letter": "C", "text": "Lesion remains painless for decades"}, {"letter": "D", "text": "Lesion points away from the joint"}, {"letter": "E", "text": "A cartilage cap is present"}], "answer": "A", "explanation": "Growth after maturity or new pain → concern for chondrosarcoma conversion.", "objective": "Orthopedic Neoplasms — Osteochondroma / Chondrosarcoma", "section": "Orthopedic Neoplasms"}, {"id": "62", "group": 62, "stem": "A 10-year-old boy has sudden left upper arm pain after a minor fall from a bench. X-ray shows a fracture through a central lytic lesion of the proximal humeral metaphysis with a cortical fragment settled at the bottom of the cyst. What is this finding called?", "options": [{"letter": "A", "text": "Fallen leaf sign"}, {"letter": "B", "text": "Codman triangle"}, {"letter": "C", "text": "Fleck sign"}, {"letter": "D", "text": "Soap-bubble sign"}, {"letter": "E", "text": "Onion-skin sign"}], "answer": "A", "explanation": "Unicameral bone cyst: most frequent cause of pathologic fracture in children; 'fallen leaf' sign.", "objective": "Orthopedic Neoplasms — Unicameral Bone Cyst", "section": "Orthopedic Neoplasms"}, {"id": "63", "group": 63, "stem": "A 66-year-old man with rheumatoid arthritis on prednisone has 2 days of a hot, swollen, exquisitely painful right knee and a temperature of 102.1°F. He cannot bear weight. What is the most important next step?", "options": [{"letter": "A", "text": "Arthrocentesis with Gram stain, cell count, and culture"}, {"letter": "B", "text": "MRI of the right knee with and without contrast"}, {"letter": "C", "text": "Serum uric acid level and outpatient follow-up"}, {"letter": "D", "text": "Knee X-ray and reassessment in one week"}, {"letter": "E", "text": "Empiric colchicine trial and recheck in 48 hours"}], "answer": "A", "explanation": "Arthrocentesis is THE key to diagnosis; imaging has limited value early.", "objective": "Osteomyelitis & Infectious Arthritis — Septic Arthritis (Nongonococcal)", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "63A", "group": 63, "stem": "Which synovial fluid result is most consistent with his suspected diagnosis?", "options": [{"letter": "A", "text": "WBC 85,000/µL with neutrophil predominance"}, {"letter": "B", "text": "WBC 600/µL, mononuclear predominance"}, {"letter": "C", "text": "WBC 6,000/µL, clear straw-colored"}, {"letter": "D", "text": "WBC 1,500/µL with blood"}, {"letter": "E", "text": "WBC 300/µL with high viscosity"}], "answer": "A", "explanation": "Septic: turbid/purulent, WBC >50,000, neutrophils, culture positive. Crystals do not exclude infection.", "objective": "Osteomyelitis & Infectious Arthritis — Septic Arthritis (Nongonococcal)", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "63B", "group": 63, "stem": "What is the appropriate empiric antibiotic regimen after the joint is aspirated?", "options": [{"letter": "A", "text": "Vancomycin plus ceftriaxone"}, {"letter": "B", "text": "Oral cephalexin"}, {"letter": "C", "text": "Oral doxycycline alone"}, {"letter": "D", "text": "Nafcillin plus fluconazole"}, {"letter": "E", "text": "Ciprofloxacin alone"}], "answer": "A", "explanation": "Empiric vancomycin + ceftriaxone + joint drainage; S. aureus is the most common organism.", "objective": "Osteomyelitis & Infectious Arthritis — Septic Arthritis (Nongonococcal)", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "64", "group": 64, "stem": "A 22-year-old sexually active woman has 4 days of migrating pain in her wrists and knees, pain and swelling along the dorsal hand tendon sheaths, and a few painless pustules on her forearms. Synovial Gram stain is negative. Which test is most likely to identify the organism?", "options": [{"letter": "A", "text": "NAAT of the cervix, urethra, pharynx, and rectum"}, {"letter": "B", "text": "Repeat synovial fluid Gram stain and culture"}, {"letter": "C", "text": "Serum ANA and anti-double-stranded DNA"}, {"letter": "D", "text": "Antistreptolysin O titer and throat culture"}, {"letter": "E", "text": "Lyme serology with reflex Western blot"}], "answer": "A", "explanation": "DGI: tenosynovitis + pustules + migratory arthralgias; synovial Gram stain and blood cultures usually negative — swab all mucosal sites.", "objective": "Osteomyelitis & Infectious Arthritis — Gonococcal Arthritis", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "64A", "group": 64, "stem": "What is the appropriate treatment?", "options": [{"letter": "A", "text": "Ceftriaxone plus doxycycline"}, {"letter": "B", "text": "Vancomycin alone"}, {"letter": "C", "text": "Oral penicillin VK"}, {"letter": "D", "text": "Azithromycin alone"}, {"letter": "E", "text": "Nafcillin plus gentamicin"}], "answer": "A", "explanation": "Ceftriaxone IM/IV ≥7 d plus doxycycline × 7 d (chlamydia); step down once improved.", "objective": "Osteomyelitis & Infectious Arthritis — Gonococcal Arthritis", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "65", "group": 65, "stem": "An 8-year-old boy was struck in the shin by a soccer ball last week. He now has fever, a limp, and point tenderness with swelling over the proximal tibia. CRP and ESR are elevated. Tibial X-ray is normal. Which study is the diagnostic study of choice?", "options": [{"letter": "A", "text": "MRI of the tibia"}, {"letter": "B", "text": "Repeat X-ray in 6 weeks"}, {"letter": "C", "text": "Bone scan"}, {"letter": "D", "text": "CT without contrast"}, {"letter": "E", "text": "Ultrasound"}], "answer": "A", "explanation": "X-ray is normal early (needs ~2 wk / 50–75% matrix loss); MRI shows marrow edema and is the study of choice in the young.", "objective": "Osteomyelitis & Infectious Arthritis — Osteomyelitis in Children", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "65A", "group": 65, "stem": "What is the most likely organism?", "options": [{"letter": "A", "text": "Staphylococcus aureus"}, {"letter": "B", "text": "Salmonella species"}, {"letter": "C", "text": "Pseudomonas aeruginosa"}, {"letter": "D", "text": "Pasteurella multocida"}, {"letter": "E", "text": "Neisseria gonorrhoeae"}], "answer": "A", "explanation": "S. aureus (MSSA/MRSA) → empiric vancomycin. Sickle cell → Salmonella.", "objective": "Osteomyelitis & Infectious Arthritis — Osteomyelitis in Children", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "66", "group": 66, "stem": "A 34-year-old man who injects heroin has 3 weeks of worsening low back pain and fevers. He has point tenderness over L3 and track marks on both arms. Neurologic exam is normal. Which imaging study is most appropriate?", "options": [{"letter": "A", "text": "MRI of the lumbar spine"}, {"letter": "B", "text": "Lumbar flexion-extension X-rays"}, {"letter": "C", "text": "CT myelogram"}, {"letter": "D", "text": "Bone densitometry"}, {"letter": "E", "text": "No imaging; treat as strain"}], "answer": "A", "explanation": "MRI shows vertebral/disc involvement and excludes epidural abscess; also get blood cultures and evaluate for endocarditis.", "objective": "Osteomyelitis & Infectious Arthritis — Vertebral Osteomyelitis", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "66A", "group": 66, "stem": "Blood cultures grow MSSA. Why is a bone biopsy still recommended?", "options": [{"letter": "A", "text": "Transient bacteremia in IVDU may not match the bone pathogen"}, {"letter": "B", "text": "Blood cultures are never accurate in patients with back pain"}, {"letter": "C", "text": "Biopsy replaces the need for any antibiotic therapy"}, {"letter": "D", "text": "MRI cannot show vertebral body or disc involvement"}, {"letter": "E", "text": "Biopsy is required to exclude gout of the spine"}], "answer": "A", "explanation": "Normally skip biopsy if blood cx positive — EXCEPT in IVDU.", "objective": "Osteomyelitis & Infectious Arthritis — Vertebral Osteomyelitis", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "67", "group": 67, "stem": "A 61-year-old man with poorly controlled diabetes and peripheral neuropathy has a 2-month-old ulcer under the first metatarsal head with surrounding erythema. A sterile metal probe placed into the ulcer strikes a hard, gritty surface. What is the gold standard for diagnosis?", "options": [{"letter": "A", "text": "Bone biopsy with culture"}, {"letter": "B", "text": "Superficial wound swab culture"}, {"letter": "C", "text": "ESR greater than 70 mm/h"}, {"letter": "D", "text": "Plain X-ray of the foot"}, {"letter": "E", "text": "Ankle-brachial index"}], "answer": "A", "explanation": "Positive probe-to-bone suggests osteomyelitis; bone biopsy (at debridement) is gold standard. Polymicrobial; S. aureus/MRSA most common.", "objective": "Osteomyelitis & Infectious Arthritis — Diabetic Foot Osteomyelitis", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "68", "group": 68, "stem": "A 71-year-old woman had a total knee arthroplasty 14 months ago and has never been pain-free since. A small sinus tract now drains over the incision. X-ray shows lucency around the tibial component. Which finding establishes definite prosthetic joint infection?", "options": [{"letter": "A", "text": "A sinus tract communicating with the prosthesis"}, {"letter": "B", "text": "An elevated peripheral white blood cell count"}, {"letter": "C", "text": "A positive three-phase technetium bone scan"}, {"letter": "D", "text": "A temperature above 100.4°F on two occasions"}, {"letter": "E", "text": "An elevated ESR without other findings"}], "answer": "A", "explanation": "Definite PJI: communicating sinus tract, purulence, acute inflammation on histology, ≥2 matching cultures, or one virulent organism.", "objective": "Osteomyelitis & Infectious Arthritis — Prosthetic Joint Infection", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "68A", "group": 68, "stem": "What is the preferred management of this chronic infection?", "options": [{"letter": "A", "text": "Two-stage exchange with antibiotic spacer"}, {"letter": "B", "text": "Debridement with retention of the implant"}, {"letter": "C", "text": "Oral antibiotics alone for 2 weeks"}, {"letter": "D", "text": "Arthroscopic washout"}, {"letter": "E", "text": "Observation"}], "answer": "A", "explanation": "Chronic hip/knee PJI → two-stage exchange (gold standard); DAIR only for early, well-fixed implants without a sinus tract.", "objective": "Osteomyelitis & Infectious Arthritis — Prosthetic Joint Infection", "section": "Osteomyelitis & Infectious Arthritis"}, {"id": "69", "group": 69, "stem": "A 66-year-old obese woman has years of bilateral knee pain that worsens after walking and climbing stairs, with 15 minutes of morning stiffness. There is crepitus, bony enlargement, and a mild varus deformity. Which imaging should be ordered?", "options": [{"letter": "A", "text": "Weight-bearing knee X-rays"}, {"letter": "B", "text": "Non-weight-bearing knee X-rays"}, {"letter": "C", "text": "MRI of both knees"}, {"letter": "D", "text": "CT of both knees"}, {"letter": "E", "text": "Bone scan"}], "answer": "A", "explanation": "Weight-bearing films show true joint-space narrowing (medial > lateral) and alignment; CT/MRI not routine.", "objective": "Osteoarthritis — Osteoarthritis of the Knee", "section": "Osteoarthritis"}, {"id": "69A", "group": 69, "stem": "Which finding is expected on imaging?", "options": [{"letter": "A", "text": "Asymmetric medial joint-space narrowing with osteophytes"}, {"letter": "B", "text": "Symmetric joint-space narrowing with periarticular osteopenia"}, {"letter": "C", "text": "Marginal erosions with pencil-in-cup changes"}, {"letter": "D", "text": "Chondrocalcinosis of the menisci only"}, {"letter": "E", "text": "Normal joint space with large effusion"}], "answer": "A", "explanation": "OA: asymmetric narrowing on the weight-bearing side, osteophytes, subchondral sclerosis/cysts.", "objective": "Osteoarthritis — Osteoarthritis of the Knee", "section": "Osteoarthritis"}, {"id": "69B", "group": 69, "stem": "What is the most appropriate first-line management?", "options": [{"letter": "A", "text": "Weight loss, quadriceps strengthening, and topical diclofenac"}, {"letter": "B", "text": "Total knee arthroplasty at this visit"}, {"letter": "C", "text": "Daily tramadol with scheduled acetaminophen"}, {"letter": "D", "text": "Monthly intra-articular corticosteroid injections"}, {"letter": "E", "text": "Oral prednisone taper and bed rest for 2 weeks"}], "answer": "A", "explanation": "Always start with weight loss, exercise/PT, topical NSAID; acetaminophen and steroid injection second line; TKA refractory.", "objective": "Osteoarthritis — Osteoarthritis of the Knee", "section": "Osteoarthritis"}, {"id": "70", "group": 70, "stem": "A 70-year-old woman has stiff, achy fingers with hard, bony enlargements at the distal interphalangeal joints. Morning stiffness lasts 10 minutes. What are these enlargements called?", "options": [{"letter": "A", "text": "Heberden's nodes"}, {"letter": "B", "text": "Bouchard's nodes"}, {"letter": "C", "text": "Rheumatoid nodules"}, {"letter": "D", "text": "Tophi"}, {"letter": "E", "text": "Dupuytren's nodules"}], "answer": "A", "explanation": "Heberden = DIP (more common); Bouchard = PIP. OA spares the MCPs and wrists.", "objective": "Osteoarthritis — Osteoarthritis of the Hand", "section": "Osteoarthritis"}]});

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
