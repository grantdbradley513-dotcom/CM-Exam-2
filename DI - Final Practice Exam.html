<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DI Exam 4 — Self-Grading Practice Exam</title>
<style>
:root {
  --bg:#f4f7fb; --card:#ffffff; --ink:#142033; --muted:#617087;
  --accent:#3157d5; --accent2:#203da6; --line:#dce3ee;
  --good:#177245; --good-bg:#e9f7ef; --bad:#b42318; --bad-bg:#fdecec;
  --warn:#8a5a00; --warn-bg:#fff7df;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.header-inner{max-width:1180px;margin:auto;padding:12px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.title-wrap h1{font-size:18px;margin:0 0 2px;font-weight:750}
.title-wrap p{font-size:12px;margin:0;color:var(--muted)}
.progress-wrap{min-width:250px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.progress{height:8px;border-radius:999px;background:#e8edf5;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0%;transition:.2s}
main{max-width:1180px;margin:18px auto;padding:0 18px 110px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
button.primary{background:var(--accent);color:white}
button.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
button.danger{background:#6f1d1b;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.page{display:none}
.page.active{display:block}
.group-grid{display:grid;grid-template-columns:1fr;gap:12px}
.group-grid.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.question-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 20px rgba(25,44,83,.05);break-inside:avoid}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}
.qnum{font-size:16px;font-weight:800}
.status-pill{font-size:11px;font-weight:800;border-radius:999px;padding:4px 8px;background:#edf1f7;color:var(--muted)}
.stem{font-size:14px;line-height:1.4;margin:0 0 10px}
.options{display:grid;gap:6px}
.option{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:white;cursor:pointer;transition:.15s;font-size:13px;line-height:1.3}
.option:hover{border-color:#9fb0d4;background:#f9fbff}
.option input{margin-top:2px;flex:0 0 auto}
.option.correct{border-color:var(--good);background:var(--good-bg)}
.option.incorrect{border-color:var(--bad);background:var(--bad-bg)}
.feedback{display:none;margin-top:9px;padding:9px 10px;border-radius:9px;font-size:12px;line-height:1.35}
.feedback.show{display:block}
.feedback.good{background:var(--good-bg);color:#0e5a35;border:1px solid #a8d8bd}
.feedback.bad{background:var(--bad-bg);color:#8c1d15;border:1px solid #efb3ae}
.feedback .meta{margin-top:5px;color:var(--muted)}
.navbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 16px;z-index:25}
.navbar-inner{max-width:1180px;margin:auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.nav-left,.nav-right{display:flex;gap:8px;flex-wrap:wrap}
.result-panel{display:none;background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.result-panel.show{display:block}
.score-big{font-size:30px;font-weight:850;margin:0}
.score-sub{color:var(--muted);margin:2px 0 14px}
.section-table{width:100%;border-collapse:collapse;font-size:13px}
.section-table th,.section-table td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.section-table th{color:var(--muted);font-size:12px}
.missed-banner{display:none;background:var(--warn-bg);color:var(--warn);border:1px solid #ead59c;padding:10px;border-radius:10px;margin-bottom:12px;font-size:13px}
.missed-banner.show{display:block}
@media (max-width:760px){
  .header-inner{align-items:flex-start;flex-direction:column}
  .progress-wrap{width:100%;min-width:0}
  .group-grid.two-col{grid-template-columns:1fr}
  main{padding:0 10px 120px}
  .question-card{padding:12px}
  .stem{font-size:14px}
  .option{font-size:13px}
  .navbar-inner{align-items:stretch;flex-direction:column}
  .nav-left,.nav-right{justify-content:space-between}
}
@media (min-width:900px){
  .group-grid.two-col .question-card{padding:12px}
  .group-grid.two-col .stem{font-size:13px}
  .group-grid.two-col .option{font-size:12.5px;padding:7px 8px}
}
@media print{
 header,.navbar,.toolbar{display:none!important}
 main{max-width:none;margin:0;padding:0}
 .page{display:block!important;page-break-after:always}
 .question-card{box-shadow:none}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="title-wrap">
      <h1>DI Exam 4 — Self-Grading Practice Exam</h1>
      <p>71 single-best-answer items • clustered follow-ups stay together</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="progressText">Page 1 of 43</span><span id="answeredText">0 / 71 answered</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </div>
</header>
<main>
  <div id="results" class="result-panel"></div>
  <div id="missedBanner" class="missed-banner">Review mode: showing only missed questions.</div>
  <div class="toolbar">
    <button class="secondary" onclick="restartExam()">Restart Exam</button>
    <button class="secondary" onclick="reviewMissed()">Review Missed Questions</button>
  </div>
  <div id="pages"></div>
</main>
<div class="navbar">
  <div class="navbar-inner">
    <div class="nav-left">
      <button id="prevBtn" class="secondary" onclick="goPrev()">Previous</button>
      <button id="nextBtn" class="primary" onclick="goNext()">Next</button>
    </div>
    <div class="nav-right">
      <button class="secondary" onclick="gradeCurrentProgress()">Submit (Grade from current place)</button>
      <button id="finalSubmitBtn" class="danger" onclick="gradeAll()">Submit Exam</button>
    </div>
  </div>
</div>
<script>
const EXAM = {"title": "DI Exam 4 — High-Yield Final Practice Exam", "questions": [{"id": "1", "stem": "A 61-year-old patient receiving chemotherapy presents with a temperature of 38.6°C (101.5°F) and malaise. The WBC count is 1,200/µL, with 20% segmented neutrophils and 5% bands. What is the patient’s absolute neutrophil count?", "options": [{"letter": "A", "text": "300/µL"}, {"letter": "B", "text": "900/µL"}, {"letter": "C", "text": "1,200/µL"}, {"letter": "D", "text": "60/µL"}, {"letter": "E", "text": "600/µL"}], "correct": "A", "answer_text": "300/µL", "rationale": "300/µL", "mapping": "Section / Learning Objective: Neutropenia and ANC — LO 2", "section": "Neutropenia and ANC", "objective": "LO 2"}, {"id": "1A", "stem": "How should the ANC calculated in the preceding question be classified?", "options": [{"letter": "A", "text": "Mild neutropenia"}, {"letter": "B", "text": "Moderate neutropenia"}, {"letter": "C", "text": "Severe neutropenia"}, {"letter": "D", "text": "Normal neutrophil count"}, {"letter": "E", "text": "Leukopenia without neutropenia"}], "correct": "C", "answer_text": "Severe neutropenia", "rationale": "Severe neutropenia", "mapping": "Section / Learning Objective: Neutropenia and ANC — LO 2", "section": "Neutropenia and ANC", "objective": "LO 2"}, {"id": "1B", "stem": "Which interpretation of the patient’s fever is most appropriate?", "options": [{"letter": "A", "text": "It is a medical emergency requiring immediate evaluation"}, {"letter": "B", "text": "It is most consistent with isolated viral lymphopenia"}, {"letter": "C", "text": "It is expected after chemotherapy and requires no further assessment"}, {"letter": "D", "text": "The CBC should be repeated in one week before deciding what to do"}, {"letter": "E", "text": "It can be reassessed at the next scheduled oncology visit"}], "correct": "A", "answer_text": "It is a medical emergency requiring immediate evaluation", "rationale": "It is a medical emergency requiring immediate evaluation", "mapping": "Section / Learning Objective: Severe neutropenia — LO 1", "section": "Severe neutropenia", "objective": "LO 1"}, {"id": "2", "stem": "Which benign condition commonly raises the PSA and reduces its specificity?", "options": [{"letter": "A", "text": "Iron deficiency anemia"}, {"letter": "B", "text": "Hypothyroidism"}, {"letter": "C", "text": "Osteoarthritis"}, {"letter": "D", "text": "Benign prostatic hyperplasia"}, {"letter": "E", "text": "Gallstones"}], "correct": "D", "answer_text": "Benign prostatic hyperplasia", "rationale": "PSA is organ-specific but not cancer-specific; BPH, prostatitis, and even bicycle riding can raise it. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}, {"id": "3", "stem": "A 68-year-old woman with painless jaundice and weight loss is found to have a pancreatic head mass. Which serum tumor marker is most associated with pancreatic and biliary tract malignancy and may help estimate prognosis and follow treatment?", "options": [{"letter": "A", "text": "CA 125"}, {"letter": "B", "text": "Alpha-fetoprotein (AFP)"}, {"letter": "C", "text": "Beta-hCG"}, {"letter": "D", "text": "CA 19-9"}, {"letter": "E", "text": "Carcinoembryonic antigen (CEA)"}], "correct": "D", "answer_text": "CA 19-9", "rationale": "This marker is primarily associated with pancreatic cancer and cholangiocarcinoma; because of low specificity and low positive predictive value it is not used for screening. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}, {"id": "3A", "stem": "Which benign condition could also raise this marker and lower its specificity?", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Seasonal allergies"}, {"letter": "C", "text": "Benign prostatic hyperplasia"}, {"letter": "D", "text": "Cholangitis or gallstones"}, {"letter": "E", "text": "Migraine headache"}], "correct": "D", "answer_text": "Cholangitis or gallstones", "rationale": "Cirrhosis, gallstones, cholangitis, and pancreatitis can all elevate this marker, which is why it lacks specificity for cancer. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}, {"id": "4", "stem": "A 24-year-old man of African descent develops fatigue, jaundice, and dark urine 2 days after starting trimethoprim-sulfamethoxazole for a urinary infection. Labs show a falling hemoglobin, an elevated reticulocyte count, elevated LDH, elevated indirect bilirubin, and low haptoglobin. The direct antiglobulin test is negative, and the smear shows bite cells with dark red-cell inclusions. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Warm autoimmune hemolytic anemia"}, {"letter": "B", "text": "Microangiopathic hemolytic anemia"}, {"letter": "C", "text": "G6PD deficiency"}, {"letter": "D", "text": "Hereditary spherocytosis"}, {"letter": "E", "text": "Beta thalassemia trait"}], "correct": "C", "answer_text": "G6PD deficiency", "rationale": "Episodic nonimmune hemolysis triggered by an oxidant drug in a man of African descent, with bite cells and Heinz bodies and a negative Coombs, is classic for the most common red-cell enzymopathy. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "4A", "stem": "An enzyme assay obtained during brisk hemolysis is normal, but suspicion remains high. What is the best next step?", "options": [{"letter": "A", "text": "Repeat the enzyme assay after the acute episode resolves"}, {"letter": "B", "text": "Order direct Coombs testing every month"}, {"letter": "C", "text": "Exclude the diagnosis permanently based on the level"}, {"letter": "D", "text": "Diagnose a microcytic disorder from the normal level"}, {"letter": "E", "text": "Confirm the diagnosis using hemoglobin electrophoresis testing"}], "correct": "A", "answer_text": "Repeat the enzyme assay after the acute episode resolves", "rationale": "The most deficient cells are destroyed during an episode and residual young cells have higher enzyme activity, so testing after recovery avoids a false-normal result. (Objective 1)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 1"}, {"id": "5", "stem": "A patient with septic shock develops disseminated intravascular coagulation with diffuse oozing from line sites. Laboratory studies show a critically low fibrinogen. Which product most specifically replaces the deficient fibrinogen?", "options": [{"letter": "A", "text": "Albumin"}, {"letter": "B", "text": "Packed red blood cells"}, {"letter": "C", "text": "Recombinant factor IX"}, {"letter": "D", "text": "Platelet concentrate"}, {"letter": "E", "text": "Cryoprecipitate"}], "correct": "E", "answer_text": "Cryoprecipitate", "rationale": "Cryoprecipitate is rich in fibrinogen (as well as factor VIII and von Willebrand factor) and is used when bleeding from low fibrinogen predominates, as in DIC. (Objective 5)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 5"}, {"id": "5A", "stem": "Besides fibrinogen, this product is notably concentrated in which of the following?", "options": [{"letter": "A", "text": "Antithrombin and plasminogen"}, {"letter": "B", "text": "Platelets and leukocytes"}, {"letter": "C", "text": "Albumin and immunoglobulin"}, {"letter": "D", "text": "Factor IX and protein C"}, {"letter": "E", "text": "Factor VIII and von Willebrand factor"}], "correct": "E", "answer_text": "Factor VIII and von Willebrand factor", "rationale": "Cryoprecipitate contains high concentrations of fibrinogen, factor VIII, and von Willebrand factor, so it can also be used in severe von Willebrand disease with bleeding. (Objective 5)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 5"}, {"id": "6", "stem": "Both DIC and TTP can produce thrombocytopenia, schistocytes, and organ injury. Which laboratory finding favors TTP over DIC?", "options": [{"letter": "A", "text": "Typically normal PT and aPTT with a normal or only mildly elevated D-dimer"}, {"letter": "B", "text": "Markedly elevated D-dimer with low fibrinogen"}, {"letter": "C", "text": "Marked prolongation of PT and aPTT with low fibrinogen"}, {"letter": "D", "text": "A septic trigger with bleeding from venipuncture sites"}, {"letter": "E", "text": "Widespread consumption of coagulation factors"}], "correct": "A", "answer_text": "Typically normal PT and aPTT with a normal or only mildly elevated D-dimer", "rationale": "Typically normal PT and aPTT with a normal or only mildly elevated D-dimer", "mapping": "Section / Objective: DIC versus TTP | Learning Objective(s) 3, 4, 5", "section": "DIC versus TTP", "objective": "LO 3, 4, 5"}, {"id": "7", "stem": "A 62-year-old man is newly diagnosed with colorectal cancer confirmed by colonoscopic biopsy. He has not yet started any therapy. Which serum tumor marker should be measured now to guide his subsequent care?", "options": [{"letter": "A", "text": "Alpha-fetoprotein (AFP)"}, {"letter": "B", "text": "CA 125"}, {"letter": "C", "text": "Carcinoembryonic antigen (CEA)"}, {"letter": "D", "text": "CA 19-9"}, {"letter": "E", "text": "Prostate-specific antigen (PSA)"}], "correct": "C", "answer_text": "Carcinoembryonic antigen (CEA)", "rationale": "Every patient with newly diagnosed colorectal cancer should have this marker drawn before treatment to establish a baseline, as it is the marker most associated with colorectal adenocarcinoma. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}, {"id": "7A", "stem": "What is the primary reason to obtain this baseline value before treatment begins?", "options": [{"letter": "A", "text": "To screen his relatives for colorectal cancer"}, {"letter": "B", "text": "To monitor response and detect recurrence"}, {"letter": "C", "text": "To replace the need for a biopsy"}, {"letter": "D", "text": "To determine the tumor's histologic grade"}, {"letter": "E", "text": "To confirm the diagnosis of colorectal cancer"}], "correct": "B", "answer_text": "To monitor response and detect recurrence", "rationale": "The baseline lets later values be compared: a fall indicates response, while maintained or rising values indicate nonresponse, progression, or recurrence. (Objective 2)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 2"}, {"id": "7B", "stem": "After successful resection the marker normalized, but on serial surveillance testing it is now steadily rising. What does this most likely indicate?", "options": [{"letter": "A", "text": "Successful cure of the cancer"}, {"letter": "B", "text": "Tumor recurrence"}, {"letter": "C", "text": "A normal post-surgical response"}, {"letter": "D", "text": "Laboratory contamination"}, {"letter": "E", "text": "A benign cause requiring no follow-up"}], "correct": "B", "answer_text": "Tumor recurrence", "rationale": "The marker should normalize within about 4-6 weeks of complete resection; a rising trend on serial testing suggests recurrence and warrants imaging. (Objective 2)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 2"}, {"id": "8", "stem": "A hospitalized patient receiving unfractionated heparin has a platelet decline from 240,000/mcL to 105,000/mcL on treatment day 7. He develops a new proximal DVT and has no significant bleeding. Which next step is most appropriate?", "options": [{"letter": "A", "text": "Continue unfractionated heparin and monitor the aPTT"}, {"letter": "B", "text": "Order factor VIII and factor IX activity assays"}, {"letter": "C", "text": "Switch from unfractionated heparin to low-molecular-weight heparin"}, {"letter": "D", "text": "Stop all heparin exposure and send a platelet factor 4-heparin antibody assay"}, {"letter": "E", "text": "Order a von Willebrand factor panel"}], "correct": "D", "answer_text": "Stop all heparin exposure and send a platelet factor 4-heparin antibody assay", "rationale": "Stop all heparin exposure and send a platelet factor 4-heparin antibody assay", "mapping": "Section / Objective: Heparin-Induced Thrombocytopenia and Thrombosis | Learning Objective(s) 3, 4", "section": "Heparin-Induced Thrombocytopenia and Thrombosis", "objective": "LO 3, 4"}, {"id": "9", "stem": "A 20-year-old college student has fever, severe fatigue, sore throat, posterior cervical lymphadenopathy, and splenomegaly. The WBC count is 14,000/µL with 55% lymphocytes. The peripheral smear report notes large atypical lymphocytes with abundant basophilic cytoplasm. Which interpretation is most appropriate?", "options": [{"letter": "A", "text": "Absolute monocytosis from chronic bacterial infection"}, {"letter": "B", "text": "Bone marrow failure from aplastic anemia"}, {"letter": "C", "text": "Reactive atypical lymphocytosis caused by EBV"}, {"letter": "D", "text": "Chronic lymphocytic leukemia with smudge cells"}, {"letter": "E", "text": "Neutrophilia caused by a pyogenic bacterial infection"}], "correct": "C", "answer_text": "Reactive atypical lymphocytosis caused by EBV", "rationale": "Reactive atypical lymphocytosis caused by EBV", "mapping": "Section / Learning Objective: Lymphocytosis and atypical lymphocytes — LO 3", "section": "Lymphocytosis and atypical lymphocytes", "objective": "LO 3"}, {"id": "10", "stem": "Two patients have a microcytic anemia. Patient 1 has a low serum iron, low ferritin, high TIBC, and low transferrin saturation. Patient 2 has a low serum iron, high ferritin, low-normal TIBC, and normal saturation. Which interpretation is correct?", "options": [{"letter": "A", "text": "Patient 1 has iron deficiency and patient 2 has anemia of chronic inflammation"}, {"letter": "B", "text": "Both patients have anemia of chronic inflammation"}, {"letter": "C", "text": "Both patients have iron deficiency"}, {"letter": "D", "text": "Neither pattern reflects a disorder of iron metabolism"}, {"letter": "E", "text": "Patient 1 has anemia of chronic inflammation and patient 2 has iron deficiency"}], "correct": "A", "answer_text": "Patient 1 has iron deficiency and patient 2 has anemia of chronic inflammation", "rationale": "Low ferritin with high TIBC and low saturation indicates true iron deficiency, whereas high/normal ferritin with low-normal TIBC and normal saturation reflects sequestration in chronic inflammation. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "11", "stem": "An 8-year-old boy has recurrent painful knee swelling after minor trauma and delayed rebleeding after procedures. His platelet count and PT are normal, while his aPTT is prolonged. The aPTT corrects after a 1:1 mixing study, and a von Willebrand panel is normal. Which test is the most appropriate next step?", "options": [{"letter": "A", "text": "A platelet factor 4-heparin ELISA"}, {"letter": "B", "text": "A plasma D-dimer level"}, {"letter": "C", "text": "A platelet function analyzer assay"}, {"letter": "D", "text": "An antiphospholipid antibody panel"}, {"letter": "E", "text": "Factor VIII and factor IX activity assays"}], "correct": "E", "answer_text": "Factor VIII and factor IX activity assays", "rationale": "Factor VIII and factor IX activity assays", "mapping": "Section / Objective: Mixing Studies, Factor Assays, and Hemophilia | Learning Objective(s) 2, 3, 4", "section": "Mixing Studies, Factor Assays, and Hemophilia", "objective": "LO 2, 3, 4"}, {"id": "12", "stem": "A 5-year-old child is brought in for progressive fatigue, pallor, easy bruising, fever, and a new limp without a history of trauma. Examination reveals lymphadenopathy and splenomegaly. The CBC shows anemia and thrombocytopenia, and the peripheral smear contains circulating blasts. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Chronic lymphocytic leukemia"}, {"letter": "B", "text": "Acute lymphocytic leukemia"}, {"letter": "C", "text": "Chronic myelogenous leukemia"}, {"letter": "D", "text": "Hodgkin lymphoma"}, {"letter": "E", "text": "Acute myelogenous leukemia"}], "correct": "B", "answer_text": "Acute lymphocytic leukemia", "rationale": "Acute lymphocytic leukemia", "mapping": "Section / Learning Objective: Leukemias — ALL — LO 5", "section": "Leukemias — ALL", "objective": "LO 5"}, {"id": "12A", "stem": "Which laboratory finding would establish the diagnosis?", "options": [{"letter": "A", "text": "Bone marrow containing more than 20% lymphoblasts"}, {"letter": "B", "text": "Bone marrow containing fewer than 5% lymphoblasts"}, {"letter": "C", "text": "BCR-ABL1 detected in maturing granulocytes"}, {"letter": "D", "text": "Auer rods identified within myeloblasts"}, {"letter": "E", "text": "Peripheral smear showing numerous mature lymphocytes and smudge cells"}], "correct": "A", "answer_text": "Bone marrow containing more than 20% lymphoblasts", "rationale": "Bone marrow containing more than 20% lymphoblasts", "mapping": "Section / Learning Objective: Leukemias — ALL diagnosis — LO 5", "section": "Leukemias — ALL diagnosis", "objective": "LO 5"}, {"id": "13", "stem": "A 54-year-old woman receives packed RBCs for symptomatic anemia. About fifteen minutes into the first unit she develops shaking chills, fever, severe flank and back pain, and a sense of impending doom. Her blood pressure falls to 82/50 mm Hg. This is the first transfusion she has ever received. Which type of transfusion reaction is most likely?", "options": [{"letter": "A", "text": "Febrile nonhemolytic transfusion reaction"}, {"letter": "B", "text": "Mild allergic reaction"}, {"letter": "C", "text": "Transfusion-associated circulatory overload"}, {"letter": "D", "text": "Acute hemolytic transfusion reaction"}, {"letter": "E", "text": "Transfusion-related acute lung injury"}], "correct": "D", "answer_text": "Acute hemolytic transfusion reaction", "rationale": "Fever, rigors, flank pain, and hypotension developing minutes into a transfusion point to acute intravascular hemolysis from preformed recipient antibodies against donor antigens. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "13A", "stem": "What is the single most important immediate action?", "options": [{"letter": "A", "text": "Slow the transfusion and give acetaminophen"}, {"letter": "B", "text": "Stop the transfusion and notify the blood bank"}, {"letter": "C", "text": "Administer furosemide and continue"}, {"letter": "D", "text": "Obtain a chest radiograph before doing anything"}, {"letter": "E", "text": "Give diphenhydramine and continue the unit"}], "correct": "B", "answer_text": "Stop the transfusion and notify the blood bank", "rationale": "Any suspected reaction requires immediately stopping the transfusion and contacting the blood bank; for a hemolytic reaction this is lifesaving and begins the investigation. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "14", "stem": "A 27-year-old asymptomatic man of Mediterranean descent is found to have a mild anemia on a routine preoperative CBC. Hgb is 12.1 g/dL, MCV 66 fL, RDW 13.0%, and the RBC count is 6.1 million/µL. Records show similar values 4 years ago, and his father has 'low blood counts.' Iron studies are normal. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Anemia of chronic inflammation"}, {"letter": "B", "text": "Sideroblastic anemia"}, {"letter": "C", "text": "Aplastic anemia"}, {"letter": "D", "text": "Iron deficiency anemia"}, {"letter": "E", "text": "Beta thalassemia trait"}], "correct": "E", "answer_text": "Beta thalassemia trait", "rationale": "Profound microcytosis with only mild anemia, a normal-to-high RBC count, normal RDW, normal iron studies, family history, and ancestry all point to beta thalassemia trait. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "15", "stem": "A healthy 55-year-old woman at average risk, with no family history of cancer, asks for annual CA 125 and transvaginal ultrasound to screen for ovarian cancer. Based on the evidence, what is the best response?", "options": [{"letter": "A", "text": "CA 125 alone is an excellent screening test"}, {"letter": "B", "text": "A normal CA 125 will reliably exclude ovarian cancer"}, {"letter": "C", "text": "Annual screening clearly reduces ovarian cancer mortality"}, {"letter": "D", "text": "Not recommended; may cause net harm"}, {"letter": "E", "text": "Screening is mandatory after age 50"}], "correct": "D", "answer_text": "Not recommended; may cause net harm", "rationale": "A large randomized trial (PLCO) showed that CA 125 plus ultrasound screening did not reduce ovarian cancer mortality in average-risk women and caused harm from unnecessary invasive procedures. (Objective 2)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 2"}, {"id": "16", "stem": "A 58-year-old woman with a 6-year history of rheumatoid arthritis reports increasing fatigue during a 2-month flare of swollen, painful wrists and MCP joints. CBC shows Hgb 10.6 g/dL, MCV 88 fL, RDW 13.5%, and a low reticulocyte count. ESR and CRP are both elevated. Which of the following best explains her anemia?", "options": [{"letter": "A", "text": "Folate deficiency"}, {"letter": "B", "text": "Iron deficiency anemia"}, {"letter": "C", "text": "Anemia of chronic inflammation"}, {"letter": "D", "text": "Warm autoimmune hemolytic anemia"}, {"letter": "E", "text": "G6PD deficiency"}], "correct": "C", "answer_text": "Anemia of chronic inflammation", "rationale": "A mild normocytic anemia developing during active inflammatory disease with elevated acute-phase reactants is characteristic of anemia of chronic inflammation. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "17", "stem": "A 38-year-old man has had easy bruising and recurrent epistaxis since adolescence. He bled excessively after dental extractions, and a recent dose of aspirin was followed by a severe nosebleed. His mother and sister have anemia attributed to heavy menstrual bleeding. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "An acquired factor VIII inhibitor"}, {"letter": "B", "text": "Immune thrombocytopenia"}, {"letter": "C", "text": "Disseminated intravascular coagulation"}, {"letter": "D", "text": "Von Willebrand disease"}, {"letter": "E", "text": "Hemophilia A"}], "correct": "D", "answer_text": "Von Willebrand disease", "rationale": "Von Willebrand disease", "mapping": "Section / Objective: Von Willebrand Disease | Learning Objective(s) 2, 3, 4", "section": "Von Willebrand Disease", "objective": "LO 2, 3, 4"}, {"id": "17A", "stem": "Assume the previous question was answered correctly. Which initial laboratory pattern is most characteristic of this disorder?", "options": [{"letter": "A", "text": "Low platelet count with prolonged PT and prolonged aPTT"}, {"letter": "B", "text": "Normal platelet count, normal PT, and normal or prolonged aPTT"}, {"letter": "C", "text": "Normal platelet count with prolonged PT and normal aPTT"}, {"letter": "D", "text": "Normal platelet count with prolonged PT and prolonged aPTT"}, {"letter": "E", "text": "Low platelet count with normal PT and aPTT"}], "correct": "B", "answer_text": "Normal platelet count, normal PT, and normal or prolonged aPTT", "rationale": "Normal platelet count, normal PT, and normal or prolonged aPTT", "mapping": "Section / Objective: Testing for Von Willebrand Disease | Learning Objective(s) 3, 4", "section": "Testing for Von Willebrand Disease", "objective": "LO 3, 4"}, {"id": "17B", "stem": "The initial platelet count, PT, and aPTT are normal, but clinical suspicion remains high. Which follow-up testing is most appropriate?", "options": [{"letter": "A", "text": "Platelet factor 4-heparin antibody testing"}, {"letter": "B", "text": "Routine antiplatelet antibody testing"}, {"letter": "C", "text": "Von Willebrand factor antigen, von Willebrand factor activity, and factor VIII activity"}, {"letter": "D", "text": "Fibrinogen and D-dimer levels"}, {"letter": "E", "text": "Factor V Leiden genetic testing"}], "correct": "C", "answer_text": "Von Willebrand factor antigen, von Willebrand factor activity, and factor VIII activity", "rationale": "Von Willebrand factor antigen, von Willebrand factor activity, and factor VIII activity", "mapping": "Section / Objective: Testing for Von Willebrand Disease | Learning Objective(s) 4", "section": "Testing for Von Willebrand Disease", "objective": "LO 4"}, {"id": "18", "stem": "A 43-year-old woman presents with a large spontaneous thigh hematoma. She had no excessive bleeding with prior surgeries or two vaginal deliveries, takes no anticoagulant, and has no family history of bleeding. Which broad explanation is most likely?", "options": [{"letter": "A", "text": "A hereditary hypercoagulable state"}, {"letter": "B", "text": "Isolated thrombocytopenia"}, {"letter": "C", "text": "Benign easy bruising without a hemostatic disorder"}, {"letter": "D", "text": "An inherited platelet-adhesion disorder"}, {"letter": "E", "text": "An acquired coagulation-factor inhibitor"}], "correct": "E", "answer_text": "An acquired coagulation-factor inhibitor", "rationale": "An acquired coagulation-factor inhibitor", "mapping": "Section / Objective: Acquired Factor Inhibitors | Learning Objective(s) 2, 3, 4", "section": "Acquired Factor Inhibitors", "objective": "LO 2, 3, 4"}, {"id": "18A", "stem": "Assume the previous question was answered correctly. Which initial pattern is most likely?", "options": [{"letter": "A", "text": "Normal platelet count, normal PT, and prolonged aPTT"}, {"letter": "B", "text": "Normal platelet count with prolonged PT and normal aPTT"}, {"letter": "C", "text": "Normal platelet count with normal PT and normal aPTT"}, {"letter": "D", "text": "Low platelet count with prolonged PT and prolonged aPTT"}, {"letter": "E", "text": "Low platelet count with normal PT and aPTT"}], "correct": "A", "answer_text": "Normal platelet count, normal PT, and prolonged aPTT", "rationale": "Normal platelet count, normal PT, and prolonged aPTT", "mapping": "Section / Objective: aPTT Prolongation Differential Diagnosis | Learning Objective(s) 3, 4", "section": "aPTT Prolongation Differential Diagnosis", "objective": "LO 3, 4"}, {"id": "18B", "stem": "A 1:1 mixing study is performed, and the aPTT remains prolonged. How should this result be interpreted?", "options": [{"letter": "A", "text": "The result establishes severe vitamin K deficiency"}, {"letter": "B", "text": "A factor deficiency is present because normal plasma corrected the result"}, {"letter": "C", "text": "A circulating inhibitor is present, so targeted inhibitor testing should follow"}, {"letter": "D", "text": "The abnormality is caused by a low platelet count"}, {"letter": "E", "text": "Von Willebrand disease is confirmed by the noncorrecting result"}], "correct": "C", "answer_text": "A circulating inhibitor is present, so targeted inhibitor testing should follow", "rationale": "A circulating inhibitor is present, so targeted inhibitor testing should follow", "mapping": "Section / Objective: Mixing Studies | Learning Objective(s) 4", "section": "Mixing Studies", "objective": "LO 4"}, {"id": "19", "stem": "A 42-year-old woman receives a red cell transfusion for anemia from heavy vaginal bleeding. Four hours after the transfusion begins she becomes acutely breathless with a dry cough, and her temperature is 38.1 C. She is hypoxic, and a chest radiograph shows bilateral pulmonary infiltrates. She has no prior cardiac disease, her jugular venous pressure is normal, and there is no peripheral edema. Which is the most likely diagnosis?", "options": [{"letter": "A", "text": "Transfusion-related acute lung injury"}, {"letter": "B", "text": "Acute hemolytic transfusion reaction"}, {"letter": "C", "text": "Transfusion-associated circulatory overload"}, {"letter": "D", "text": "Febrile nonhemolytic transfusion reaction"}, {"letter": "E", "text": "Anaphylactic transfusion reaction"}], "correct": "A", "answer_text": "Transfusion-related acute lung injury", "rationale": "Hypoxia with bilateral infiltrates within six hours of transfusion, without evidence of volume overload, is the classic non-cardiogenic pulmonary edema of this donor-antibody-mediated lung injury. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "19A", "stem": "What is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive oxygen and ventilation"}, {"letter": "B", "text": "Aggressive diuresis with furosemide"}, {"letter": "C", "text": "Urgent plasmapheresis"}, {"letter": "D", "text": "Intravenous corticosteroids"}, {"letter": "E", "text": "Epinephrine and antihistamines"}], "correct": "A", "answer_text": "Supportive oxygen and ventilation", "rationale": "Care is supportive with oxygen and, if needed, ventilation; diuretics are not helpful because this is not volume overload, and most patients recover fully. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "20", "stem": "A 38-year-old man develops abrupt fatigue, jaundice, and dark urine. His hemoglobin has fallen from 14.1 to 9.2 g/dL over 4 days, the MCV is 92 fL, and the reticulocyte count is elevated. Examination shows mild splenomegaly. Which broad mechanism of anemia is most likely?", "options": [{"letter": "A", "text": "Pluripotent stem-cell failure"}, {"letter": "B", "text": "Premature red blood cell destruction"}, {"letter": "C", "text": "Impaired DNA synthesis in precursors"}, {"letter": "D", "text": "Inadequate iron availability for heme"}, {"letter": "E", "text": "Reduced beta-globin chain synthesis"}], "correct": "B", "answer_text": "Premature red blood cell destruction", "rationale": "Acute normocytic anemia with jaundice, dark urine, splenomegaly, and reticulocytosis strongly suggests hemolysis from shortened red-cell survival. (Objective 3)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 3"}, {"id": "20A", "stem": "Which laboratory pattern would best support this mechanism?", "options": [{"letter": "A", "text": "Low methylmalonic acid, high homocysteine, normal haptoglobin"}, {"letter": "B", "text": "High ferritin, high TIBC, and low ESR"}, {"letter": "C", "text": "High LDH, high indirect bilirubin, and low haptoglobin"}, {"letter": "D", "text": "Low LDH, low indirect bilirubin, and high haptoglobin"}, {"letter": "E", "text": "Low serum iron, high TIBC, and low ferritin"}], "correct": "C", "answer_text": "High LDH, high indirect bilirubin, and low haptoglobin", "rationale": "Hemolysis releases intracellular LDH, raises indirect bilirubin from heme breakdown, and consumes haptoglobin as it binds free hemoglobin. (Objective 1)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 1"}, {"id": "20B", "stem": "This patient's hematocrit is 27% and the lab reports a reticulocyte count of 8%. Using a normal hematocrit of 45%, what is the corrected reticulocyte percentage?", "options": [{"letter": "A", "text": "About 2.2%"}, {"letter": "B", "text": "About 4.8%"}, {"letter": "C", "text": "About 8.0%"}, {"letter": "D", "text": "About 1.3%"}, {"letter": "E", "text": "About 13.3%"}], "correct": "B", "answer_text": "About 4.8%", "rationale": "Corrected reticulocyte % = measured % × (patient Hct / normal Hct) = 8 × 27/45 = 4.8%, an appropriately increased marrow response. (Objective 1)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 1"}, {"id": "21", "stem": "Orchiectomy histology shows pure seminoma, yet his AFP was clearly elevated preoperatively. What is the best interpretation?", "options": [{"letter": "A", "text": "The elevated AFP indicates a benign process"}, {"letter": "B", "text": "The AFP result must be a laboratory error"}, {"letter": "C", "text": "Pure seminoma commonly secretes AFP"}, {"letter": "D", "text": "AFP elevation rules out germ cell tumor entirely"}, {"letter": "E", "text": "Occult nonseminomatous element is present"}], "correct": "E", "answer_text": "Occult nonseminomatous element is present", "rationale": "Pure seminoma never secretes AFP, so an elevated AFP with seminoma-only histology implies an unidentified nonseminomatous component, and the patient is treated as a mixed germ cell tumor. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}, {"id": "22", "stem": "A 67-year-old man is about one hour into a unit of packed RBCs when his temperature rises from 37.0 to 38.4 C with mild chills. He feels uncomfortable but has no back or flank pain, no hypotension, no urticaria, and no respiratory distress. His vital signs are otherwise stable. Which reaction is most likely?", "options": [{"letter": "A", "text": "Acute hemolytic transfusion reaction"}, {"letter": "B", "text": "Febrile nonhemolytic transfusion reaction"}, {"letter": "C", "text": "Anaphylactic reaction"}, {"letter": "D", "text": "Transfusion-related acute lung injury"}, {"letter": "E", "text": "Transfusion-associated circulatory overload"}], "correct": "B", "answer_text": "Febrile nonhemolytic transfusion reaction", "rationale": "An isolated low-grade fever with chills and no hemolysis, hypotension, or respiratory findings is the most common reaction and is driven by cytokines from donor leukocytes. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "22A", "stem": "What is the appropriate next step when this fever develops?", "options": [{"letter": "A", "text": "Start broad-spectrum antibiotics and cultures as the first move"}, {"letter": "B", "text": "Give epinephrine immediately"}, {"letter": "C", "text": "Continue the transfusion and observe"}, {"letter": "D", "text": "Stop the transfusion and rule out a hemolytic reaction"}, {"letter": "E", "text": "Begin aggressive diuresis"}], "correct": "D", "answer_text": "Stop the transfusion and rule out a hemolytic reaction", "rationale": "Even though this reaction is benign, the transfusion is stopped and a hemolytic reaction excluded before attributing the fever to a febrile nonhemolytic cause; acetaminophen then treats it. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "23", "stem": "A 22-year-old woman presents with new petechiae, gingival bleeding, and easy bruising. Her platelet count is 16,000/mcL; hemoglobin and leukocyte counts are normal. PT and aPTT are normal. Which abnormality most directly explains her bleeding pattern?", "options": [{"letter": "A", "text": "Factor VII deficiency impairing the extrinsic pathway"}, {"letter": "B", "text": "Lupus anticoagulant causing in-vivo anticoagulation"}, {"letter": "C", "text": "Severe thrombocytopenia impairing primary hemostasis"}, {"letter": "D", "text": "Factor VIII deficiency impairing the intrinsic pathway"}, {"letter": "E", "text": "Excess fibrinolysis from increased plasmin activity"}], "correct": "C", "answer_text": "Severe thrombocytopenia impairing primary hemostasis", "rationale": "Severe thrombocytopenia impairing primary hemostasis", "mapping": "Section / Objective: Thrombocytopenia and Primary Hemostasis | Learning Objective(s) 2, 3, 4", "section": "Thrombocytopenia and Primary Hemostasis", "objective": "LO 2, 3, 4"}, {"id": "24", "stem": "A 29-year-old woman presents with an unprovoked DVT. She has had two miscarriages and reports new stiffness and pain in the small joints of her hands. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Factor V Leiden"}, {"letter": "B", "text": "Von Willebrand disease"}, {"letter": "C", "text": "Immune thrombocytopenia"}, {"letter": "D", "text": "Antiphospholipid syndrome"}, {"letter": "E", "text": "Hemophilia B"}], "correct": "D", "answer_text": "Antiphospholipid syndrome", "rationale": "Antiphospholipid syndrome", "mapping": "Section / Objective: Antiphospholipid Syndrome | Learning Objective(s) 5", "section": "Antiphospholipid Syndrome", "objective": "LO 5"}, {"id": "24A", "stem": "Which additional requirement is necessary to satisfy the laboratory component of the diagnostic criteria described in the lecture?", "options": [{"letter": "A", "text": "The plasma fibrinogen level must be low"}, {"letter": "B", "text": "The prolonged aPTT must correct on mixing"}, {"letter": "C", "text": "A single elevated D-dimer must be documented"}, {"letter": "D", "text": "A factor V activity assay must be decreased"}, {"letter": "E", "text": "An antiphospholipid antibody must remain positive on two occasions at least 12 weeks apart"}], "correct": "E", "answer_text": "An antiphospholipid antibody must remain positive on two occasions at least 12 weeks apart", "rationale": "An antiphospholipid antibody must remain positive on two occasions at least 12 weeks apart", "mapping": "Section / Objective: Antiphospholipid Syndrome Diagnostic Criteria | Learning Objective(s) 5", "section": "Antiphospholipid Syndrome Diagnostic Criteria", "objective": "LO 5"}, {"id": "25", "stem": "A 34-year-old woman is admitted with fatigue. She is hemodynamically stable, has no chest pain, and has no history of cardiac or pulmonary disease. Labs show a hemoglobin of 7.4 g/dL with a low MCV and low ferritin consistent with iron deficiency from heavy menses. She is asymptomatic at rest. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Transfuse two units of packed RBCs"}, {"letter": "B", "text": "Transfuse one unit of packed RBCs"}, {"letter": "C", "text": "Withhold transfusion and start iron repletion"}, {"letter": "D", "text": "Transfuse to a hemoglobin goal of 10 g/dL"}, {"letter": "E", "text": "Give fresh frozen plasma"}], "correct": "C", "answer_text": "Withhold transfusion and start iron repletion", "rationale": "For a stable patient whose anemia has an easily treatable cause, replacing the deficient nutrient is preferred over transfusion; the general medical trigger is a hemoglobin near 7 g/dL and she is asymptomatic. (Objective 1)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 1"}, {"id": "26", "stem": "A 58-year-old woman is scheduled for an elective procedure with a low expected blood loss. Her surgeon does not expect she will need blood but wants the blood bank prepared to provide compatible units quickly if bleeding occurs. Which pretransfusion test is most appropriate to order now?", "options": [{"letter": "A", "text": "Indirect bilirubin and haptoglobin"}, {"letter": "B", "text": "Release of O-negative units"}, {"letter": "C", "text": "Type and screen"}, {"letter": "D", "text": "Direct antiglobulin test"}, {"letter": "E", "text": "Full crossmatch of four units"}], "correct": "C", "answer_text": "Type and screen", "rationale": "When blood is unlikely but possible, this test determines ABO/Rh(D) type and screens for alloantibodies without committing specific units, and can be completed in about 10-15 minutes. (Objective 7)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 7"}, {"id": "26A", "stem": "The antibody screen portion of this test is designed to detect which of the following?", "options": [{"letter": "A", "text": "Antigens on the recipient's red cells only"}, {"letter": "B", "text": "Unexpected alloantibodies in the recipient's serum"}, {"letter": "C", "text": "Coagulation factor deficiencies"}, {"letter": "D", "text": "Bacterial contamination of the unit"}, {"letter": "E", "text": "Platelet HLA antibodies"}], "correct": "B", "answer_text": "Unexpected alloantibodies in the recipient's serum", "rationale": "The screen uses reagent type O cells to detect atypical or unexpected alloantibodies in the recipient's serum. (Objective 7)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 7"}, {"id": "26B", "stem": "The patient begins hemorrhaging intraoperatively. Before a specific unit of blood is released and hung for her, which step is required?", "options": [{"letter": "A", "text": "A bacterial culture of the unit"}, {"letter": "B", "text": "Crossmatch the specific donor unit"}, {"letter": "C", "text": "Repeat ABO typing only"}, {"letter": "D", "text": "Irradiation of the unit"}, {"letter": "E", "text": "Leukoreduction of the unit"}], "correct": "B", "answer_text": "Crossmatch the specific donor unit", "rationale": "Releasing a specific unit requires testing the patient's serum against that donor's cells for compatibility; this crossmatch takes roughly 30-45 minutes when no unexpected antibodies are present. (Objective 7)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 7"}, {"id": "27", "stem": "A 46-year-old woman with systemic lupus erythematosus develops fatigue, jaundice, and splenomegaly over several days. Hgb is 8.6 g/dL, the reticulocyte count is elevated, LDH and indirect bilirubin are increased, and haptoglobin is low. The smear shows small, dense red cells lacking central pallor. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Beta thalassemia trait"}, {"letter": "B", "text": "Iron deficiency anemia"}, {"letter": "C", "text": "Warm autoimmune hemolytic anemia"}, {"letter": "D", "text": "Microangiopathic hemolytic anemia"}, {"letter": "E", "text": "G6PD deficiency"}], "correct": "C", "answer_text": "Warm autoimmune hemolytic anemia", "rationale": "Extravascular hemolysis with spherocytes, jaundice, and splenomegaly in a patient with an autoimmune disease is characteristic of warm (IgG-mediated) autoimmune hemolysis. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "27A", "stem": "Which direct antiglobulin (Coombs) result is most likely in this patient?", "options": [{"letter": "A", "text": "Positive only for hemoglobin A2"}, {"letter": "B", "text": "Negative, because spherocytes indicate a nonimmune process"}, {"letter": "C", "text": "Negative for both IgG and C3"}, {"letter": "D", "text": "Positive for C3 only, with no IgG in any case"}, {"letter": "E", "text": "Positive for IgG, with or without C3"}], "correct": "E", "answer_text": "Positive for IgG, with or without C3", "rationale": "Warm autoimmune hemolysis is usually IgG-mediated; the direct Coombs detects IgG and sometimes complement coating the cells. (Objective 1)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 1"}, {"id": "28", "stem": "A 55-year-old man is found to have a WBC count of 98,000/µL during evaluation of fatigue and early satiety. Examination reveals marked splenomegaly without significant lymphadenopathy. The peripheral smear shows myelocytes, metamyelocytes, bands, and mature neutrophils, along with increased basophils. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Chronic myelogenous leukemia"}, {"letter": "B", "text": "Chronic lymphocytic leukemia with mature lymphocytosis"}, {"letter": "C", "text": "Non-Hodgkin lymphoma"}, {"letter": "D", "text": "Acute myelogenous leukemia with predominantly myeloblasts"}, {"letter": "E", "text": "Leukemoid reaction caused by severe infection"}], "correct": "A", "answer_text": "Chronic myelogenous leukemia", "rationale": "Chronic myelogenous leukemia", "mapping": "Section / Learning Objective: Leukemias — CML — LO 5", "section": "Leukemias — CML", "objective": "LO 5"}, {"id": "28A", "stem": "Which finding would confirm the diagnosis in the preceding patient?", "options": [{"letter": "A", "text": "A monoclonal spike on serum electrophoresis"}, {"letter": "B", "text": "More than 20% lymphoblasts in bone marrow"}, {"letter": "C", "text": "BCR-ABL1 fusion from t(9;22)"}, {"letter": "D", "text": "Deletion of chromosome 13q"}, {"letter": "E", "text": "CD15 and CD30 expression"}], "correct": "C", "answer_text": "BCR-ABL1 fusion from t(9;22)", "rationale": "BCR-ABL1 fusion from t(9;22)", "mapping": "Section / Learning Objective: Leukemias — CML cytogenetics — LO 5", "section": "Leukemias — CML cytogenetics", "objective": "LO 5"}, {"id": "29", "stem": "A 22-year-old woman presents with 3 weeks of fatigue, easy bruising, gum bleeding, and a recent febrile illness. Exam shows scattered petechiae and pallor but no splenomegaly or lymphadenopathy. CBC shows Hgb 8.0 g/dL, WBC 2,100/µL with neutropenia, and platelets 22,000/µL; the reticulocyte count is low. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Folate deficiency"}, {"letter": "B", "text": "Aplastic anemia"}, {"letter": "C", "text": "Autoimmune hemolytic anemia"}, {"letter": "D", "text": "Iron deficiency anemia"}, {"letter": "E", "text": "Anemia of chronic inflammation"}], "correct": "B", "answer_text": "Aplastic anemia", "rationale": "Pancytopenia with a low reticulocyte count and no organomegaly points to marrow failure from injury to the pluripotent stem cell. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "29A", "stem": "Which bone marrow finding would be expected in this patient?", "options": [{"letter": "A", "text": "Megaloblastic erythroid precursors"}, {"letter": "B", "text": "A hypercellular marrow packed with blasts"}, {"letter": "C", "text": "Marrow fibrosis with tear-drop red cells"}, {"letter": "D", "text": "A profoundly hypocellular, 'empty' marrow"}, {"letter": "E", "text": "Ringed sideroblasts on the iron stain"}], "correct": "D", "answer_text": "A profoundly hypocellular, 'empty' marrow", "rationale": "The diagnosis is confirmed by a markedly hypocellular marrow with decreased precursors of all cell lines. (Objective 1)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 1"}, {"id": "30", "stem": "A 67-year-old man is hospitalized with severe bacterial pneumonia. His WBC count is 44,000/µL and consists predominantly of mature neutrophils with some bands; no blasts are identified. The WBC count falls substantially as the infection improves. Which term best describes this hematologic response?", "options": [{"letter": "A", "text": "Chronic myelogenous leukemia"}, {"letter": "B", "text": "Lymphopenia"}, {"letter": "C", "text": "Chronic lymphocytic leukemia"}, {"letter": "D", "text": "Leukemoid reaction"}, {"letter": "E", "text": "Acute myelogenous leukemia"}], "correct": "D", "answer_text": "Leukemoid reaction", "rationale": "Leukemoid reaction", "mapping": "Section / Learning Objective: Leukocytosis and leukemoid reaction — LO 1", "section": "Leukocytosis and leukemoid reaction", "objective": "LO 1"}, {"id": "31", "stem": "A 72-year-old man is evaluated after a routine CBC shows a WBC count of 42,000/µL with an absolute lymphocyte count of 31,000/µL. He reports mild early satiety but no acute illness. Examination shows painless cervical adenopathy and splenomegaly. The peripheral smear shows numerous small, mature-appearing lymphocytes and smudge cells. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Leukemoid reaction"}, {"letter": "B", "text": "Infectious mononucleosis with reactive atypical lymphocytes"}, {"letter": "C", "text": "Chronic lymphocytic leukemia"}, {"letter": "D", "text": "Chronic myelogenous leukemia with a myeloid left shift"}, {"letter": "E", "text": "Acute lymphocytic leukemia"}], "correct": "C", "answer_text": "Chronic lymphocytic leukemia", "rationale": "Chronic lymphocytic leukemia", "mapping": "Section / Learning Objective: Leukemias — CLL — LO 5", "section": "Leukemias — CLL", "objective": "LO 5"}, {"id": "31A", "stem": "Assuming the preceding diagnosis is correct, which test is most important for confirming the clonal lymphocyte population and classifying the disease?", "options": [{"letter": "A", "text": "Serum protein electrophoresis"}, {"letter": "B", "text": "Bone marrow biopsy as the only acceptable confirmatory test"}, {"letter": "C", "text": "Peripheral blood flow cytometry with immunophenotyping"}, {"letter": "D", "text": "Heterophile antibody testing"}, {"letter": "E", "text": "Fluorescence in situ hybridization alone"}], "correct": "C", "answer_text": "Peripheral blood flow cytometry with immunophenotyping", "rationale": "Peripheral blood flow cytometry with immunophenotyping", "mapping": "Section / Learning Objective: Flow cytometry and CLL — LO 4", "section": "Flow cytometry and CLL", "objective": "LO 4"}, {"id": "32", "stem": "A 66-year-old woman reports several months of fatigue, tingling in both feet, and unsteadiness in the dark. On exam she has a smooth, sore, 'beefy' red tongue, decreased vibratory sensation in the toes, and a positive Romberg sign. CBC shows Hgb 9.8 g/dL and MCV 114 fL; the smear shows macro-ovalocytes and hypersegmented neutrophils. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Folate deficiency"}, {"letter": "B", "text": "Anemia of chronic inflammation"}, {"letter": "C", "text": "Vitamin B12 deficiency"}, {"letter": "D", "text": "Iron deficiency anemia"}, {"letter": "E", "text": "Myelodysplastic syndrome"}], "correct": "C", "answer_text": "Vitamin B12 deficiency", "rationale": "A macrocytic, megaloblastic anemia with glossitis plus posterior-column neurologic findings points to B12 deficiency; folate deficiency does not cause neurologic disease. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "32A", "stem": "If the serum level of the deficient vitamin is borderline, which metabolic pattern is most sensitive and specific for confirming this deficiency?", "options": [{"letter": "A", "text": "Elevated methylmalonic acid and elevated homocysteine"}, {"letter": "B", "text": "A low lactate dehydrogenase level"}, {"letter": "C", "text": "Elevated homocysteine with a normal methylmalonic acid"}, {"letter": "D", "text": "An elevated serum ferritin level"}, {"letter": "E", "text": "A reduced serum haptoglobin level"}], "correct": "A", "answer_text": "Elevated methylmalonic acid and elevated homocysteine", "rationale": "Methylmalonic acid and homocysteine both rise in cobalamin deficiency; with folate deficiency MMA stays normal. (Objective 1)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 1"}, {"id": "33", "stem": "An 82-year-old man with heart failure and chronic kidney disease is receiving his second unit of packed RBCs. Partway through the unit he becomes dyspneic and anxious. He is hypertensive, has distended neck veins and bibasilar crackles, and an S3 is heard. Which reaction is most likely?", "options": [{"letter": "A", "text": "Acute hemolytic transfusion reaction"}, {"letter": "B", "text": "Transfusion-associated circulatory overload"}, {"letter": "C", "text": "Anaphylactic reaction"}, {"letter": "D", "text": "Febrile nonhemolytic transfusion reaction"}, {"letter": "E", "text": "Transfusion-related acute lung injury"}], "correct": "B", "answer_text": "Transfusion-associated circulatory overload", "rationale": "Dyspnea with hypertension, elevated neck veins, crackles, and an S3 during transfusion in a volume-prone patient indicates hydrostatic pulmonary edema from circulatory overload. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "33A", "stem": "In addition to stopping or slowing the transfusion, what is the most appropriate treatment?", "options": [{"letter": "A", "text": "Intravenous corticosteroids"}, {"letter": "B", "text": "Plasmapheresis"}, {"letter": "C", "text": "Epinephrine"}, {"letter": "D", "text": "Loop diuretics"}, {"letter": "E", "text": "Broad-spectrum antibiotics"}], "correct": "D", "answer_text": "Loop diuretics", "rationale": "This is a volume problem; slowing the rate and giving a loop diuretic offloads the excess volume, and future units can be given slowly. (Objective 6)", "mapping": "Transfusion Medicine — objective reference retained in the source rationale", "section": "Transfusion Medicine", "objective": "Objective 6"}, {"id": "34", "stem": "You are reviewing a patient's medication list for agents that could impair vitamin B12 status. Which combination contains only agents identified as potentially impairing vitamin B12 absorption or utilization?", "options": [{"letter": "A", "text": "Prednisone, doxycycline, and over-the-counter acetaminophen"}, {"letter": "B", "text": "Warfarin, aspirin, and clopidogrel"}, {"letter": "C", "text": "Ferrous sulfate, folic acid, and cyanocobalamin"}, {"letter": "D", "text": "Metformin plus a proton pump inhibitor and an H2 blocker"}, {"letter": "E", "text": "Hydrochlorothiazide, lisinopril, and amlodipine"}], "correct": "D", "answer_text": "Metformin plus a proton pump inhibitor and an H2 blocker", "rationale": "Metformin, proton pump inhibitors, and H2 receptor antagonists are the agents specifically associated with impaired B12 absorption or utilization. (Objective 6)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 6"}, {"id": "35", "stem": "A patient with severe gram-negative sepsis develops oozing from intravenous sites and ischemic changes in several fingers. Laboratory studies show platelets 42,000/mcL, prolonged PT and aPTT, low fibrinogen, elevated D-dimer, and schistocytes. Which interpretation best explains these findings?", "options": [{"letter": "A", "text": "Widespread coagulation activation has caused thrombosis followed by consumption of platelets and clotting factors"}, {"letter": "B", "text": "An isolated primary-hemostasis defect has impaired platelet plug formation"}, {"letter": "C", "text": "ADAMTS13 deficiency has caused platelet-rich microthrombi with preserved coagulation tests"}, {"letter": "D", "text": "An isolated factor VII deficiency has impaired the extrinsic pathway"}, {"letter": "E", "text": "Benign bruising has produced nonspecific laboratory abnormalities"}], "correct": "A", "answer_text": "Widespread coagulation activation has caused thrombosis followed by consumption of platelets and clotting factors", "rationale": "Widespread coagulation activation has caused thrombosis followed by consumption of platelets and clotting factors", "mapping": "Section / Objective: Disseminated Intravascular Coagulation | Learning Objective(s) 3, 4, 5", "section": "Disseminated Intravascular Coagulation", "objective": "LO 3, 4, 5"}, {"id": "36", "stem": "A 17-year-old boy has recurrent hemarthroses. Platelet count and PT are normal, aPTT is prolonged, and the aPTT corrects with a 1:1 mixing study. A von Willebrand panel is normal. Which testing should follow?", "options": [{"letter": "A", "text": "Antiphospholipid antibody testing"}, {"letter": "B", "text": "Platelet function analyzer testing"}, {"letter": "C", "text": "Specific factor VIII, IX, and XI activity assays"}, {"letter": "D", "text": "Plasma D-dimer testing"}, {"letter": "E", "text": "Platelet factor 4-heparin antibody testing"}], "correct": "C", "answer_text": "Specific factor VIII, IX, and XI activity assays", "rationale": "Specific factor VIII, IX, and XI activity assays", "mapping": "Section / Objective: Mixing Studies and Factor Assays | Learning Objective(s) 3, 4", "section": "Mixing Studies and Factor Assays", "objective": "LO 3, 4"}, {"id": "37", "stem": "Two patients each have a megaloblastic macrocytic anemia. One has numbness, impaired vibratory sense, and gait ataxia; the other has no neurologic findings. Which statement best distinguishes the causes?", "options": [{"letter": "A", "text": "Neither deficiency can produce any neurologic findings"}, {"letter": "B", "text": "Neurologic findings point to folate deficiency, not B12"}, {"letter": "C", "text": "Both deficiencies produce essentially identical neurologic disease"}, {"letter": "D", "text": "Neurologic findings point to B12 deficiency, not folate deficiency"}, {"letter": "E", "text": "Neurologic findings instead indicate an iron deficiency state"}], "correct": "D", "answer_text": "Neurologic findings point to B12 deficiency, not folate deficiency", "rationale": "Both cause megaloblastic anemia, but only B12 deficiency causes neurologic changes such as paresthesias and loss of vibration/position sense. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "38", "stem": "A patient has persistent lymphocytosis, and a hematologic malignancy is suspected. Which statement best describes the diagnostic role of flow cytometry?", "options": [{"letter": "A", "text": "Monoclonal antibodies identify cell-surface CD markers and establish lineage, maturity, and clonality"}, {"letter": "B", "text": "It measures circulating HIV RNA to assess viral replication and treatment response"}, {"letter": "C", "text": "It classifies leukocytes only by their size and nuclear shape on a stained peripheral smear"}, {"letter": "D", "text": "It detects chromosomal translocations and deletions without evaluating cell-surface proteins"}, {"letter": "E", "text": "It separates monoclonal and polyclonal serum proteins by their electrophoretic migration"}], "correct": "A", "answer_text": "Monoclonal antibodies identify cell-surface CD markers and establish lineage, maturity, and clonality", "rationale": "Monoclonal antibodies identify cell-surface CD markers and establish lineage, maturity, and clonality", "mapping": "Section / Learning Objective: Flow cytometry — LO 4", "section": "Flow cytometry", "objective": "LO 4"}, {"id": "39", "stem": "A 48-year-old woman is admitted for an asthma exacerbation and receives high-dose prednisone. The next morning, her WBC count has increased from 8,200/µL to 14,900/µL, with a predominant neutrophilia. She is afebrile, her respiratory symptoms are improving, and the differential shows no significant bandemia. Which explanation best accounts for the change in her WBC count?", "options": [{"letter": "A", "text": "Splenic sequestration of neutrophils"}, {"letter": "B", "text": "Acute lymphocytic leukemia"}, {"letter": "C", "text": "New bacterial pneumonia causing a reactive left shift"}, {"letter": "D", "text": "Steroid-induced neutrophil demargination"}, {"letter": "E", "text": "Helminth infection"}], "correct": "D", "answer_text": "Steroid-induced neutrophil demargination", "rationale": "Steroid-induced neutrophil demargination", "mapping": "Section / Learning Objective: Reactive leukocyte abnormalities — LO 3", "section": "Reactive leukocyte abnormalities", "objective": "LO 3"}, {"id": "40", "stem": "A 28-year-old woman reports several months of painless left cervical and supraclavicular lymph node enlargement. She has drenching night sweats, generalized pruritus, and unintentional weight loss. Chest imaging shows a mediastinal mass. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Hodgkin lymphoma"}, {"letter": "B", "text": "Infectious mononucleosis"}, {"letter": "C", "text": "Chronic lymphocytic leukemia"}, {"letter": "D", "text": "Non-Hodgkin lymphoma"}, {"letter": "E", "text": "Chronic myelogenous leukemia"}], "correct": "A", "answer_text": "Hodgkin lymphoma", "rationale": "Hodgkin lymphoma", "mapping": "Section / Learning Objective: Lymphomas — Hodgkin lymphoma — LO 5", "section": "Lymphomas — Hodgkin lymphoma", "objective": "LO 5"}, {"id": "40A", "stem": "Which diagnostic procedure is most appropriate to establish the diagnosis in this patient?", "options": [{"letter": "A", "text": "Serum protein electrophoresis"}, {"letter": "B", "text": "Bone marrow aspiration as the first test"}, {"letter": "C", "text": "Fine-needle aspiration of the node"}, {"letter": "D", "text": "Peripheral blood smear"}, {"letter": "E", "text": "Excisional lymph node biopsy"}], "correct": "E", "answer_text": "Excisional lymph node biopsy", "rationale": "Excisional lymph node biopsy", "mapping": "Section / Learning Objective: Lymphomas — Hodgkin lymphoma diagnosis — LO 5", "section": "Lymphomas — Hodgkin lymphoma diagnosis", "objective": "LO 5"}, {"id": "41", "stem": "A 50-year-old man undergoes meniscal repair and is largely immobile for two weeks. He then takes a six-hour flight and develops a painful swollen calf; ultrasonography confirms his first DVT. He has no personal or family history of thrombosis. What is the best approach to hereditary thrombophilia testing?", "options": [{"letter": "A", "text": "Defer testing because the DVT is strongly provoked and no thrombophilia red flags are present"}, {"letter": "B", "text": "Test only protein C, protein S, and antithrombin levels"}, {"letter": "C", "text": "Order antiphospholipid testing because any DVT may be autoimmune"}, {"letter": "D", "text": "Test only factor V Leiden and the prothrombin gene mutation"}, {"letter": "E", "text": "Order the complete inherited thrombophilia panel for every first DVT"}], "correct": "A", "answer_text": "Defer testing because the DVT is strongly provoked and no thrombophilia red flags are present", "rationale": "Defer testing because the DVT is strongly provoked and no thrombophilia red flags are present", "mapping": "Section / Objective: When to Test for Hereditary Thrombophilias | Learning Objective(s) 5", "section": "When to Test for Hereditary Thrombophilias", "objective": "LO 5"}, {"id": "42", "stem": "A 28-year-old patient is evaluated for possible pulmonary embolism. Clinical assessment indicates a low pretest probability, and the D-dimer result is normal. Which interpretation is most appropriate?", "options": [{"letter": "A", "text": "The result confirms pulmonary embolism"}, {"letter": "B", "text": "Chest CT is mandatory despite the low probability and normal D-dimer"}, {"letter": "C", "text": "D-dimer has no useful role in the evaluation of pulmonary embolism"}, {"letter": "D", "text": "A positive D-dimer would be required to exclude pulmonary embolism"}, {"letter": "E", "text": "The normal D-dimer effectively excludes pulmonary embolism in this low-risk patient"}], "correct": "E", "answer_text": "The normal D-dimer effectively excludes pulmonary embolism in this low-risk patient", "rationale": "The normal D-dimer effectively excludes pulmonary embolism in this low-risk patient", "mapping": "Section / Objective: D-Dimer Testing | Learning Objective(s) 5", "section": "D-Dimer Testing", "objective": "LO 5"}, {"id": "43", "stem": "A 34-year-old woman reports 3 months of progressive fatigue, exertional dyspnea, and an irresistible urge to chew ice. Her menstrual periods last 7 days with frequent clot passage. On exam she is pale with mild conjunctival pallor and smooth, spoon-shaped nails. CBC shows Hgb 9.4 g/dL, MCV 74 fL, RDW 17.5%, and platelets 465,000/µL. Which of the following best explains her anemia?", "options": [{"letter": "A", "text": "Folate deficiency"}, {"letter": "B", "text": "Beta thalassemia trait"}, {"letter": "C", "text": "Anemia of chronic inflammation"}, {"letter": "D", "text": "Iron deficiency anemia"}, {"letter": "E", "text": "Aplastic anemia"}], "correct": "D", "answer_text": "Iron deficiency anemia", "rationale": "Chronic menstrual blood loss with pica/pagophagia, koilonychia, microcytosis, a high RDW, and reactive thrombocytosis is classic for iron deficiency. (Objective 4)", "mapping": "Anemia — objective reference retained in the source rationale", "section": "Anemia", "objective": "Objective 4"}, {"id": "43A", "stem": "Which single laboratory test is most useful to confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "Direct antiglobulin test"}, {"letter": "B", "text": "Serum ferritin"}, {"letter": "C", "text": "Corrected reticulocyte count"}, {"letter": "D", "text": "Serum lactate dehydrogenase"}, {"letter": "E", "text": "Hemoglobin electrophoresis"}], "correct": "B", "answer_text": "Serum ferritin", "rationale": "Ferritin reflects total-body iron stores and is the single most useful confirmatory test; a low value strongly supports the diagnosis. (Objective 1)", "mapping": "Anemia — objective reference retained in the source rationale Selection Blueprint The exam was weighted using the professor’s Kahoot practice-question distribution and then refined for objective coverage and clinical usefulness: Anemia: 18 scored items Leukocytic Disorders: 15 scored items Hemostasis: 16 scored items Transfusion Medicine: 14 scored items Tumor Markers: 8 scored items", "section": "Anemia", "objective": "Objective 1"}], "groups": [{"base": "1", "items": [{"id": "1", "stem": "A 61-year-old patient receiving chemotherapy presents with a temperature of 38.6°C (101.5°F) and malaise. The WBC count is 1,200/µL, with 20% segmented neutrophils and 5% bands. What is the patient’s absolute neutrophil count?", "options": [{"letter": "A", "text": "300/µL"}, {"letter": "B", "text": "900/µL"}, {"letter": "C", "text": "1,200/µL"}, {"letter": "D", "text": "60/µL"}, {"letter": "E", "text": "600/µL"}], "correct": "A", "answer_text": "300/µL", "rationale": "300/µL", "mapping": "Section / Learning Objective: Neutropenia and ANC — LO 2", "section": "Neutropenia and ANC", "objective": "LO 2"}, {"id": "1A", "stem": "How should the ANC calculated in the preceding question be classified?", "options": [{"letter": "A", "text": "Mild neutropenia"}, {"letter": "B", "text": "Moderate neutropenia"}, {"letter": "C", "text": "Severe neutropenia"}, {"letter": "D", "text": "Normal neutrophil count"}, {"letter": "E", "text": "Leukopenia without neutropenia"}], "correct": "C", "answer_text": "Severe neutropenia", "rationale": "Severe neutropenia", "mapping": "Section / Learning Objective: Neutropenia and ANC — LO 2", "section": "Neutropenia and ANC", "objective": "LO 2"}, {"id": "1B", "stem": "Which interpretation of the patient’s fever is most appropriate?", "options": [{"letter": "A", "text": "It is a medical emergency requiring immediate evaluation"}, {"letter": "B", "text": "It is most consistent with isolated viral lymphopenia"}, {"letter": "C", "text": "It is expected after chemotherapy and requires no further assessment"}, {"letter": "D", "text": "The CBC should be repeated in one week before deciding what to do"}, {"letter": "E", "text": "It can be reassessed at the next scheduled oncology visit"}], "correct": "A", "answer_text": "It is a medical emergency requiring immediate evaluation", "rationale": "It is a medical emergency requiring immediate evaluation", "mapping": "Section / Learning Objective: Severe neutropenia — LO 1", "section": "Severe neutropenia", "objective": "LO 1"}]}, {"base": "2", "items": [{"id": "2", "stem": "Which benign condition commonly raises the PSA and reduces its specificity?", "options": [{"letter": "A", "text": "Iron deficiency anemia"}, {"letter": "B", "text": "Hypothyroidism"}, {"letter": "C", "text": "Osteoarthritis"}, {"letter": "D", "text": "Benign prostatic hyperplasia"}, {"letter": "E", "text": "Gallstones"}], "correct": "D", "answer_text": "Benign prostatic hyperplasia", "rationale": "PSA is organ-specific but not cancer-specific; BPH, prostatitis, and even bicycle riding can raise it. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}]}, {"base": "3", "items": [{"id": "3", "stem": "A 68-year-old woman with painless jaundice and weight loss is found to have a pancreatic head mass. Which serum tumor marker is most associated with pancreatic and biliary tract malignancy and may help estimate prognosis and follow treatment?", "options": [{"letter": "A", "text": "CA 125"}, {"letter": "B", "text": "Alpha-fetoprotein (AFP)"}, {"letter": "C", "text": "Beta-hCG"}, {"letter": "D", "text": "CA 19-9"}, {"letter": "E", "text": "Carcinoembryonic antigen (CEA)"}], "correct": "D", "answer_text": "CA 19-9", "rationale": "This marker is primarily associated with pancreatic cancer and cholangiocarcinoma; because of low specificity and low positive predictive value it is not used for screening. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}, {"id": "3A", "stem": "Which benign condition could also raise this marker and lower its specificity?", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Seasonal allergies"}, {"letter": "C", "text": "Benign prostatic hyperplasia"}, {"letter": "D", "text": "Cholangitis or gallstones"}, {"letter": "E", "text": "Migraine headache"}], "correct": "D", "answer_text": "Cholangitis or gallstones", "rationale": "Cirrhosis, gallstones, cholangitis, and pancreatitis can all elevate this marker, which is why it lacks specificity for cancer. (Objective 1)", "mapping": "Tumor Markers — objective reference retained in the source rationale", "section": "Tumor Markers", "objective": "Objective 1"}]}, {"base": "4", "items": [{"id": "4", "stem": "A 24-year-old man of African descent develops fatigue, jaundice, and dark urine 2 days after starting trimethoprim-sulfamethoxazole for a urinary infection. Labs show a falling hemoglobin, an elevated reticulocyte count, elevated LDH, elevated indirect bilirubin, and low haptoglobin. The direct antiglobulin test is negative, and the smear shows bite cells with dark red-cell inclusions. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Warm autoimmune hemolytic anemia"}, {"letter": "B", "text": "Microangiopathic hemolytic anemia"}, {"letter": "C", "text": "G6PD deficiency"}, {"letter": "D", "text": "Hereditary spherocytosis"}, {"letter": "E", "text": "Beta thalassemia trait"}], "correct": "C", "answer_text": "G6PD deficiency", "rationale": "Episodic nonimmune hemolysis triggered by an oxidant drug in a man of African descent, with bite cells and
