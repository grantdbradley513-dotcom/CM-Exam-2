n. He has no jugular venous distention, no loud P2, and no clubbing.", "labs_workup": [], "vignette_recog": "A 66-year-old man presents to the emergency department with five days of worsening breathlessness, a dry cough, and right-sided chest fullness; this is his third such episode this year. He has cirrhosis with ascites and takes spironolactone and furosemide, and two right-sided effusions have been drained in the past six months. He has never smoked and has no heart failure and no prior pneumonia. His temperature is 36.9°C (98.4°F), blood pressure is 110/68 mm Hg, pulse is 94/min, respirations are 24/min, and oxygen saturation is 90% on room air. There is dullness to percussion with decreased breath sounds and reduced tactile fremitus over the right lower chest, and shifting dullness in the abdomen. He has no jugular venous distention, no loud P2, and no clubbing. A chest radiograph, an echocardiogram with Doppler and bubble study, and a diagnostic thoracentesis are obtained.", "labs_recog": [["Chest radiograph", "Large right pleural effusion with no infiltrate"], ["Echocardiogram", "Bubble study negative; estimated right ventricular systolic pressure 24 mm Hg"], ["Pleural fluid", "Transudative by Light's criteria — protein 1.1 g/dL against serum 6.2 g/dL (ratio 0.18), LDH 68 U/L against serum 190 U/L (ratio 0.36); 90 PMN/mm³, culture negative"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Chest radiograph"}, {"letter": "B", "text": "Arterial blood gas on room air"}, {"letter": "C", "text": "Serum natriuretic peptide"}, {"letter": "D", "text": "Right heart catheterization"}, {"letter": "E", "text": "Abdominal ultrasound"}], "answer": "A", "explanation": "Dullness with absent breath sounds over one base is answered by the plain film before anything invasive, and it decides whether the chest holds fluid, consolidation, or neither. The echocardiogram with a bubble study follows in the same visit, since every breathless cirrhotic needs both."}, {"key": "result", "path": "W", "stem": "Which of the following initial test results is most likely to be present?", "options": [{"letter": "A", "text": "A clear chest radiograph with microbubbles in the left atrium after 5 heartbeats"}, {"letter": "B", "text": "A large right pleural effusion with a negative bubble study and normal right-sided pressures"}, {"letter": "C", "text": "A tense abdomen with an albumin gradient of 2.2 g/dL and 60 PMN/mm³"}, {"letter": "D", "text": "A right ventricular systolic pressure of 62 mm Hg with a dilated right ventricle"}, {"letter": "E", "text": "A reduced ejection fraction with raised filling pressures"}], "answer": "B", "explanation": "Late-appearing microbubbles in the left atrium mark an intrapulmonary shunt, and a high right ventricular systolic pressure marks a pressure problem in the pulmonary arteries. Neither is present when the hypoxia comes simply from lung compressed by fluid."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Portopulmonary hypertension"}, {"letter": "B", "text": "Hepatopulmonary syndrome"}, {"letter": "C", "text": "Hepatohydrothorax"}, {"letter": "D", "text": "Portal hypertensive ascites"}, {"letter": "E", "text": "Decompensated heart failure"}], "answer": "C", "explanation": "Fluid in the pleural space with a negative bubble study and normal right-sided pressures is not a shunt and not a pressure problem. The absence of jugular venous distention and a loud P2 argues against the right heart, and clear lungs would be needed for a shunt."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Decompensated heart failure"}, {"letter": "B", "text": "Portal hypertensive ascites"}, {"letter": "C", "text": "Portopulmonary hypertension"}, {"letter": "D", "text": "Hepatohydrothorax"}, {"letter": "E", "text": "Hepatopulmonary syndrome"}], "answer": "D", "explanation": "A transudate in a cirrhotic with ascites, with a negative bubble study and a normal right ventricular systolic pressure, is ascitic fluid that has crossed small diaphragmatic defects into the chest. It is usually right-sided and recurs, as it has here."}, {"key": "mgmt", "path": "both", "stem": "He has a hepatohydrothorax. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Diuresis with guideline-directed heart failure therapy"}, {"letter": "B", "text": "Supplemental oxygen with referral for liver transplantation"}, {"letter": "C", "text": "Sodium restriction and diuretics with tube thoracostomy"}, {"letter": "D", "text": "Pulmonary vasodilator therapy with transplantation once controlled"}, {"letter": "E", "text": "Sodium restriction and diuretics with therapeutic thoracentesis"}], "answer": "E", "explanation": "The fluid is ascites in a different cavity, so it is treated the way ascites is treated, with a therapeutic tap for the breathlessness. A chest tube is the trap a recurrent effusion invites: it drains protein and fluid continuously and seeds the space with infection."}, {"key": "escalate", "path": "both", "stem": "The effusion reaccumulates despite sodium restriction and diuretics. Which of the following should be done next?", "options": [{"letter": "A", "text": "A transjugular intrahepatic portosystemic shunt"}, {"letter": "B", "text": "Pulmonary vasodilator therapy"}, {"letter": "C", "text": "Guideline-directed heart failure therapy"}, {"letter": "D", "text": "Supplemental oxygen with observation"}, {"letter": "E", "text": "Tube thoracostomy with continued diuretics"}], "answer": "A", "explanation": "This is harder to clear than abdominal ascites, and refractory disease is treated by lowering portal pressure with a shunt, with transplantation behind it. Repeated taps alone do not keep pace with reaccumulation."}, {"key": "counsel", "path": "both", "stem": "He has a hepatohydrothorax. Which of the following is the most appropriate approach to obtaining an echocardiogram with a bubble study?", "options": [{"letter": "A", "text": "Obtain it only when the chest radiograph is clear"}, {"letter": "B", "text": "Obtain it in every cirrhotic patient who is short of breath"}, {"letter": "C", "text": "Obtain it only when the effusion is left-sided"}, {"letter": "D", "text": "Obtain it only when the pleural fluid proves to be an exudate"}, {"letter": "E", "text": "Obtain it only when the oxygen saturation falls below 90%"}], "answer": "B", "explanation": "Breathlessness in cirrhosis has three hepatic explanations, and two of them are settled by the echocardiogram with Doppler and a bubble study. Waiting for a clear film or for a saturation threshold misses the patient whose effusion and shunt coexist."}]}, {"case": "VH-A1", "group": "VH-A", "section": "acute icteric illness with transaminases in the thousands", "objective": "", "vignette_workup": "A 41-year-old man presents to the emergency department with four days of yellow eyes and cola-colored urine. For about two weeks before that he felt tired and nauseated, vomited most mornings, and lost his appetite entirely; his stools have turned pale and he has a dull ache in the right upper quadrant. He injected heroin until three months ago and shared equipment, and he returned from Honduras six weeks ago. He drinks no alcohol and takes no prescription medications. His temperature is 38.1°C (100.6°F), blood pressure is 118/72 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has icteric sclera and jaundiced skin, a tender liver edge 4 cm below the costal margin, and scattered urticarial wheals over the trunk. He is alert, with no asterixis and no ascites.", "labs_workup": [["WBC", "6,200/mm³"], ["Hemoglobin / hematocrit", "14.2 g/dL / 42%"], ["Platelets", "232,000/mm³"], ["PT / INR", "13.2 s / 1.1 (reference 11–14 s)"]], "vignette_recog": "A 41-year-old man presents to the emergency department with four days of yellow eyes and cola-colored urine. For about two weeks before that he felt tired and nauseated, vomited most mornings, and lost his appetite entirely; his stools have turned pale and he has a dull ache in the right upper quadrant. He injected heroin until three months ago and shared equipment, and he returned from Honduras six weeks ago. He drinks no alcohol and takes no prescription medications. His temperature is 38.1°C (100.6°F), blood pressure is 118/72 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has icteric sclera and jaundiced skin, a tender liver edge 4 cm below the costal margin, and scattered urticarial wheals over the trunk. He is alert, with no asterixis and no ascites. A hepatic function panel and an acute hepatitis panel are sent.", "labs_recog": [["WBC", "6,200/mm³"], ["Hemoglobin / hematocrit", "14.2 g/dL / 42%"], ["Platelets", "232,000/mm³"], ["PT / INR", "13.2 s / 1.1 (reference 11–14 s)"], ["AST / ALT", "1,420 U/L / 1,880 U/L (reference AST 12–38, ALT 10–40)"], ["Alkaline phosphatase", "165 U/L (reference 30–125)"], ["Total bilirubin", "8.4 mg/dL, direct 5.9 mg/dL (reference 0.1–1.1)"], ["Albumin", "3.9 g/dL"], ["Acute hepatitis panel", "Positive, with the serology naming the type"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Right upper quadrant ultrasound"}, {"letter": "B", "text": "CMV DNA polymerase chain reaction"}, {"letter": "C", "text": "Hepatitis E antibody, sent out"}, {"letter": "D", "text": "A hepatic function panel with an acute hepatitis panel"}, {"letter": "E", "text": "Hepatitis B virus DNA polymerase chain reaction"}], "answer": "D", "explanation": "The first question in a jaundiced patient is whether the injury is hepatocellular or cholestatic, and the enzyme panel answers it in one draw. The serologic panel is sent alongside because parenteral and developing-country exposures both sit in this history."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Hepatitis A IgM positive with hepatitis A IgG negative and an ALT of 1,340 U/L"}, {"letter": "B", "text": "A negative A, B, and C panel with an AST of 720 and an ALT of 1,050 U/L"}, {"letter": "C", "text": "An AST to ALT ratio above 2:1 with transaminases below 400 U/L"}, {"letter": "D", "text": "Negative A, B, and C serologies with an AST of 210 and an ALT of 340 U/L"}, {"letter": "E", "text": "An AST of 1,420 U/L and an ALT of 1,880 U/L with a bilirubin of 8.4 mg/dL"}], "answer": "E", "explanation": "Diffuse hepatocyte injury releases aminotransferases in the thousands, with the ALT above the AST, and the conjugated fraction rises because damaged hepatocytes cannot excrete bile. Transaminases in the hundreds point instead at a herpesvirus in an immunosuppressed host."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute viral hepatitis"}, {"letter": "B", "text": "Alcohol-associated hepatitis"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "Hepatitis A"}, {"letter": "E", "text": "CMV hepatitis"}], "answer": "A", "explanation": "An ALT above the AST at more than ten times the upper limit of normal, with a conjugated hyperbilirubinemia and a tender liver, is acute hepatocellular viral injury. Alcohol-associated disease runs a ratio above 2:1 with transaminases under 400 U/L, and a stone in the duct gives a cholestatic pattern instead."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "CMV hepatitis"}, {"letter": "B", "text": "Choledocholithiasis"}, {"letter": "C", "text": "Hepatitis A"}, {"letter": "D", "text": "Acute viral hepatitis"}, {"letter": "E", "text": "Alcohol-associated hepatitis"}], "answer": "D", "explanation": "A positive acute hepatitis panel in a patient with transaminases above ten times normal and a direct hyperbilirubinemia names the illness as acute viral hepatitis; the serology on that panel identifies which virus. Hepatitis A specifically would require a positive HAV IgM, which is not what is reported."}, {"key": "mgmt", "path": "both", "stem": "He has acute viral hepatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Entecavir or tenofovir alongside supportive care"}, {"letter": "B", "text": "Bed rest, hydration, and avoidance of alcohol and acetaminophen"}, {"letter": "C", "text": "Supportive care with antiviral treatment directed at the virus"}, {"letter": "D", "text": "Alcohol cessation with nutritional support"}, {"letter": "E", "text": "Supportive care with vaccine and immune globulin for his contacts"}], "answer": "B", "explanation": "There is no antiviral for acute hepatitis A or E; the treatment is rest, calories, and fluids while the liver regenerates. Hepatotoxins are withdrawn completely, since a second insult on an already injured liver is what turns a self-limited illness into failure."}, {"key": "counsel", "path": "both", "stem": "He has acute viral hepatitis. Which of the following would most appropriately prompt admission rather than management at home?", "options": [{"letter": "A", "text": "A total bilirubin above 10 mg/dL"}, {"letter": "B", "text": "Jaundice persisting beyond six weeks"}, {"letter": "C", "text": "A temperature above 38.5°C"}, {"letter": "D", "text": "Transaminases above 2,000 U/L"}, {"letter": "E", "text": "An INR above 1.5 with altered mental status"}], "answer": "E", "explanation": "Loss of synthetic function together with encephalopathy defines hepatic failure, and that patient is not managed at home. The height of the transaminases and the bilirubin track injury rather than function, and the icteric phase normally runs one to six weeks."}]}, {"case": "VH-A2", "group": "VH-A", "section": "acute icteric illness with transaminases in the thousands", "objective": "", "vignette_workup": "A 26-year-old woman presents to the primary care clinic with five days of jaundice and dark urine, preceded by ten days of malaise and fever. She has nausea, right upper quadrant pain, and a poor appetite. She returned five weeks ago from a month in rural Guatemala, where she ate raw oysters at a coastal market, and two of her travel companions became jaundiced last week. She does not inject drugs. Her temperature is 38.4°C (101.1°F), blood pressure is 112/70 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 99% on room air. She is jaundiced with icteric sclera, has a tender liver edge 3 cm below the costal margin and an urticarial rash over the forearms, and has no asterixis, no splenomegaly, and no stigmata of chronic liver disease.", "labs_workup": [["AST / ALT", "980 U/L / 1,340 U/L"], ["Alkaline phosphatase", "210 U/L"], ["Total bilirubin", "6.2 mg/dL, direct 4.3 mg/dL"], ["Albumin", "4.0 g/dL"], ["PT / INR", "12.6 s / 1.0"], ["WBC", "5,900/mm³"], ["Hemoglobin / hematocrit", "13.1 g/dL / 39%"], ["Platelets", "251,000/mm³"]], "vignette_recog": "A 26-year-old woman presents to the primary care clinic with five days of jaundice and dark urine, preceded by ten days of malaise and fever. She has nausea, right upper quadrant pain, and a poor appetite. She returned five weeks ago from a month in rural Guatemala, where she ate raw oysters at a coastal market, and two of her travel companions became jaundiced last week. She does not inject drugs. Her temperature is 38.4°C (101.1°F), blood pressure is 112/70 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 99% on room air. She is jaundiced with icteric sclera, has a tender liver edge 3 cm below the costal margin and an urticarial rash over the forearms, and has no asterixis, no splenomegaly, and no stigmata of chronic liver disease She has never been vaccinated against hepatitis A. An acute hepatitis panel is sent.", "labs_recog": [["AST / ALT", "980 U/L / 1,340 U/L"], ["Alkaline phosphatase", "210 U/L"], ["Total bilirubin", "6.2 mg/dL, direct 4.3 mg/dL"], ["Albumin", "4.0 g/dL"], ["PT / INR", "12.6 s / 1.0"], ["WBC", "5,900/mm³"], ["Hemoglobin / hematocrit", "13.1 g/dL / 39%"], ["Platelets", "251,000/mm³"], ["Hepatitis A serology", "IgM positive, IgG negative"], ["Hepatitis B serology", "HBsAg negative, HBsAb positive, HBcAb negative"], ["Hepatitis C antibody", "Negative"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CMV DNA polymerase chain reaction"}, {"letter": "B", "text": "Cholangiography by MRCP"}, {"letter": "C", "text": "Hepatitis B virus DNA polymerase chain reaction"}, {"letter": "D", "text": "Hepatitis A IgM"}, {"letter": "E", "text": "Total hepatitis A antibody"}], "answer": "D", "explanation": "A fecal-oral exposure with a cluster of jaundiced contacts calls for the assay that dates the infection. The total antibody combines IgM and IgG and therefore cannot separate acute infection from remote immunity, which is the error that wastes the two-week window for protecting her contacts."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg positive and HBcAb IgM positive with HBsAb negative"}, {"letter": "B", "text": "A negative A, B, and C panel with an AST of 720 and an ALT of 1,050 U/L"}, {"letter": "C", "text": "An AST of 1,420 and an ALT of 1,880 U/L with a viral serology naming the type"}, {"letter": "D", "text": "Hepatitis A IgM positive with hepatitis A IgG negative"}, {"letter": "E", "text": "Negative A, B, and C serologies with an AST of 210 and an ALT of 340 U/L"}], "answer": "D", "explanation": "IgM appears with the acute illness and IgG follows to give lifelong immunity, so IgM present without IgG dates the infection to now. IgG alone would mean prior infection and immunity rather than the illness in front of you."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B"}, {"letter": "B", "text": "Hepatitis A"}, {"letter": "C", "text": "Hepatitis E"}, {"letter": "D", "text": "Alcohol-associated hepatitis"}, {"letter": "E", "text": "CMV hepatitis"}], "answer": "B", "explanation": "A month in a developing country, raw shellfish, and a cluster of jaundiced travel companions is fecal-oral transmission, and the virus is shed for two weeks before anyone feels ill. Hepatitis B follows parenteral or sexual exposure, and a herpesvirus would need immunosuppression and transaminases in the hundreds."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B"}, {"letter": "B", "text": "CMV hepatitis"}, {"letter": "C", "text": "Hepatitis E"}, {"letter": "D", "text": "Alcohol-associated hepatitis"}, {"letter": "E", "text": "Hepatitis A"}], "answer": "E", "explanation": "IgM positive with IgG negative is acute infection, and the negative B and C serologies close the rest of the panel. Hepatitis E is the diagnosis when the whole A, B, and C panel comes back negative, which is not the case here."}, {"key": "mgmt", "path": "both", "stem": "She has hepatitis A. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with household hygiene measures"}, {"letter": "B", "text": "Alcohol cessation with nutritional support"}, {"letter": "C", "text": "Endoscopic stone extraction"}, {"letter": "D", "text": "Supportive care with antiviral treatment directed at the virus"}, {"letter": "E", "text": "Entecavir or tenofovir alongside supportive care"}], "answer": "A", "explanation": "The illness is self-limited and never becomes chronic, so there is no antiviral to give and the work is rest, fluids, and hepatotoxin avoidance. Sanitation and handwashing matter because the route out of this patient is the same route into the next one."}, {"key": "counsel", "path": "both", "stem": "She has hepatitis A. Which of the following is the most appropriate approach to protecting her unvaccinated household contacts?", "options": [{"letter": "A", "text": "Vaccine or immune globulin once the contact's serology returns"}, {"letter": "B", "text": "Vaccine or immune globulin within 2 weeks of exposure"}, {"letter": "C", "text": "Vaccine or immune globulin for contacts who travelled with her"}, {"letter": "D", "text": "Vaccine or immune globulin at 6 months, when her booster is due"}, {"letter": "E", "text": "Vaccine or immune globulin once a contact becomes jaundiced"}], "answer": "B", "explanation": "Post-exposure prophylaxis works only inside a two-week window, and the vaccine is close to 100% effective when given in time. Waiting for a contact's serology, or for a contact to turn yellow, forfeits the only opportunity to prevent the illness."}]}, {"case": "IB-A3", "group": "IB-A", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "objective": "", "vignette_workup": "A 20-year-old man presents to the gastroenterology clinic with four months of four loose stools daily with intermittent blood, and crampy periumbilical pain. His older sister has Crohn's disease, and he has had two prior colitis flares treated with steroids at another hospital. He is a college student. His temperature is 37.1°C (98.8°F), blood pressure is 116/72 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has mild diffuse abdominal tenderness without guarding, no perianal fistula or fissure, no oral ulcers, and no palpable mass.", "labs_workup": [["Hemoglobin / hematocrit", "12.6 g/dL / 38%"], ["MCV", "86 fL"], ["Albumin", "3.8 g/dL"], ["CRP", "18 mg/L"], ["ESR", "22 mm/h"], ["WBC", "7,600/mm³"], ["Fecal calprotectin", "410 µg/g"]], "vignette_recog": "A 20-year-old man presents to the gastroenterology clinic with four months of four loose stools daily with intermittent blood, and crampy periumbilical pain. His older sister has Crohn's disease, and he has had two prior colitis flares treated with steroids at another hospital. He is a college student. His temperature is 37.1°C (98.8°F), blood pressure is 116/72 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has mild diffuse abdominal tenderness without guarding, no perianal fistula or fissure, no oral ulcers, and no palpable mass. He undergoes colonoscopy with biopsy, serologic testing, and CT enterography.", "labs_recog": [["Hemoglobin / hematocrit", "12.6 g/dL / 38%"], ["MCV", "86 fL"], ["Albumin", "3.8 g/dL"], ["CRP", "18 mg/L"], ["ESR", "22 mm/h"], ["WBC", "7,600/mm³"], ["Fecal calprotectin", "410 µg/g"], ["Colonoscopy", "Colitis with no terminal ileal disease and no clear rectal-sparing or skip pattern"], ["Biopsies", "Chronic active colitis with crypt distortion and no granulomas"], ["Serology", "ASCA negative and p-ANCA negative"], ["CT enterography", "Normal small bowel"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT or MR enterography"}, {"letter": "B", "text": "ASCA and p-ANCA serology"}, {"letter": "C", "text": "Pelvic magnetic resonance imaging"}, {"letter": "D", "text": "Colonoscopy with biopsy"}, {"letter": "E", "text": "Stool Clostridioides difficile testing"}], "answer": "D", "explanation": "Months of bloody diarrhea with a raised calprotectin and inflammatory markers is chronic colitis until the mucosa is looked at, and the pattern plus the histology is what assigns the label. Serology and enterography refine a picture the endoscopy has to produce first."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Chronic active colitis with no ileal disease and no skip or rectal-sparing pattern"}, {"letter": "B", "text": "Flat high-grade dysplasia in inflamed mucosa with no visible polyp"}, {"letter": "C", "text": "Segmental colitis at a watershed segment with an abrupt transition"}, {"letter": "D", "text": "Continuous rectal-based inflammation with crypt abscesses and mucin depletion"}, {"letter": "E", "text": "Skip lesions with cobblestoning and rectal sparing, with non-caseating granulomas"}], "answer": "A", "explanation": "The two named forms of inflammatory bowel disease are separated by distribution and depth: patchy full-thickness disease reaching the ileum on one side, continuous mucosal disease beginning at the rectum on the other. When neither pattern is present, the endoscopy reports colitis without the features that decide it."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ulcerative colitis"}, {"letter": "B", "text": "IBD-associated colorectal cancer"}, {"letter": "C", "text": "Indeterminate colitis"}, {"letter": "D", "text": "Clostridioides difficile colitis"}, {"letter": "E", "text": "Crohn's disease"}], "answer": "C", "explanation": "About 10% of colitis cannot be classified at first presentation, and this is the answer when the full evaluation establishes neither pattern rather than the closer of the two. The absent granulomas and ileal disease argue against one, and the absent continuous rectal gradient against the other."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Clostridioides difficile colitis"}, {"letter": "B", "text": "IBD-associated colorectal cancer"}, {"letter": "C", "text": "Ulcerative colitis"}, {"letter": "D", "text": "Crohn's disease"}, {"letter": "E", "text": "Indeterminate colitis"}], "answer": "E", "explanation": "Colitis with no ileal involvement, no skip or rectal-sparing pattern, no granulomas, and a doubly negative serology has failed to declare itself. Many such patients are reclassified over time, and roughly 15% of patients carry a label that changes."}, {"key": "mgmt", "path": "both", "stem": "He has indeterminate colitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Colectomy with an ileal pouch–anal anastomosis"}, {"letter": "B", "text": "5-ASA with serial reassessment"}, {"letter": "C", "text": "Budesonide with smoking cessation"}, {"letter": "D", "text": "A mesalamine enema with an oral aminosalicylate"}, {"letter": "E", "text": "Anti-TNF therapy with an immunomodulator"}], "answer": "B", "explanation": "The colitis is treated on its own terms while repeat endoscopy over time settles the label. The pouch is the trap here: it is a ulcerative colitis operation and does badly in Crohn's, so committing to it before the diagnosis is settled risks an outcome that cannot be undone."}, {"key": "escalate", "path": "both", "stem": "He continues to pass four loose stools daily with blood despite 5-ASA and a course of corticosteroids. Which of the following should be done next?", "options": [{"letter": "A", "text": "Budesonide with smoking cessation"}, {"letter": "B", "text": "A mesalamine enema with an oral aminosalicylate"}, {"letter": "C", "text": "Anti-TNF therapy with an immunomodulator"}, {"letter": "D", "text": "Colectomy with an ileal pouch–anal anastomosis"}, {"letter": "E", "text": "An oral antibiotic directed at Clostridioides difficile"}], "answer": "C", "explanation": "Steroids suppress a flare but are not maintenance, so disease that breaks through an aminosalicylate moves to an immunomodulator or a biologic. Surgery is not the escalation step while the diagnosis is still open."}, {"key": "counsel", "path": "both", "stem": "He has indeterminate colitis. Which of the following is the most appropriate approach to establishing his final diagnosis?", "options": [{"letter": "A", "text": "Defer further evaluation until a surgical specimen is available"}, {"letter": "B", "text": "Settle the diagnosis on the serology panel alone"}, {"letter": "C", "text": "Repeat endoscopy over time, since the label may change"}, {"letter": "D", "text": "Settle the diagnosis on the family history of colitis"}, {"letter": "E", "text": "Accept whichever of the two named forms fits more closely"}], "answer": "C", "explanation": "Roughly one colitis in ten is unclassifiable at presentation, and many are reclassified as the disease declares itself; about 15% of patients see their label drift. Forcing a label now, on serology or on a relative's diagnosis, is what leads to the wrong operation later."}]}, {"case": "IB-B2", "group": "IB-B", "section": "acute deterioration in a patient with known inflammatory bowel disease", "objective": "", "vignette_workup": "A 38-year-old woman presents to the emergency department with three months of cramping periumbilical pain 30 to 60 minutes after meals, and twelve hours of vomiting with no flatus and no stool. She has had Crohn's disease for fifteen years and two prior ileocecal resections, and she stopped her biologic a year ago when her insurance lapsed. She has three children. Her temperature is 37.3°C (99.1°F), blood pressure is 108/68 mm Hg, pulse is 106/min, respirations are 18/min, and oxygen saturation is 98% on room air. Her abdomen is distended and tympanitic with high-pitched bowel sounds and diffuse tenderness without rebound or guarding, and she has a well-healed midline scar.", "labs_workup": [["Abdominal radiographs", "Dilated small-bowel loops with air-fluid levels and no colonic gas"], ["WBC", "10,800/mm³"], ["Hemoglobin / hematocrit", "12.8 g/dL / 38%"], ["Potassium", "3.2 mEq/L"], ["Chloride", "96 mEq/L"], ["Creatinine", "1.3 mg/dL"], ["CRP", "9 mg/L"], ["Albumin", "3.6 g/dL"]], "vignette_recog": "A 38-year-old woman presents to the emergency department with three months of cramping periumbilical pain 30 to 60 minutes after meals, and twelve hours of vomiting with no flatus and no stool. She has had Crohn's disease for fifteen years and two prior ileocecal resections, and she stopped her biologic a year ago when her insurance lapsed. She has three children. Her temperature is 37.3°C (99.1°F), blood pressure is 108/68 mm Hg, pulse is 106/min, respirations are 18/min, and oxygen saturation is 98% on room air. Her abdomen is distended and tympanitic with high-pitched bowel sounds and diffuse tenderness without rebound or guarding, and she has a well-healed midline scar. CT enterography is obtained.", "labs_recog": [["Abdominal radiographs", "Dilated small-bowel loops with air-fluid levels and no colonic gas"], ["WBC", "10,800/mm³"], ["Hemoglobin / hematocrit", "12.8 g/dL / 38%"], ["Potassium", "3.2 mEq/L"], ["Chloride", "96 mEq/L"], ["Creatinine", "1.3 mg/dL"], ["CRP", "9 mg/L"], ["Albumin", "3.6 g/dL"], ["CT enterography", "A 5-cm segment of neoterminal ileal narrowing with the bowel dilated to 4.2 cm above it, minimal mural enhancement and no mesenteric hyperemia; no free air and no abscess"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Video capsule endoscopy"}, {"letter": "B", "text": "Stool Clostridioides difficile testing"}, {"letter": "C", "text": "CT of the abdomen and pelvis"}, {"letter": "D", "text": "CT or MR enterography"}, {"letter": "E", "text": "Ileocolonoscopy with ileal intubation and biopsy"}], "answer": "D", "explanation": "Enterography images the wall as well as the lumen, which is what distinguishes an inflamed segment that will respond to drugs from a scarred one that will not. Capsule endoscopy is the trap in a patient with obstructive symptoms — the capsule impacts at the narrowing it was sent to find."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A tract from a distal ileal loop to the bladder dome with intravesical air"}, {"letter": "B", "text": "Skip lesions with cobblestoning and rectal sparing"}, {"letter": "C", "text": "Luminal narrowing with proximal dilation and minimal mural enhancement"}, {"letter": "D", "text": "Free intraperitoneal air under both hemidiaphragms"}, {"letter": "E", "text": "A transverse colon dilated to 9 cm with loss of haustra and thumbprinting"}], "answer": "C", "explanation": "Repeated cycles of inflammation and healing lay down collagen, and the scarred segment narrows and stops distending; the bowel above it dilates against the fixed point. Little mural enhancement and no mesenteric hyperemia mark the segment as fibrotic rather than actively inflamed."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Colon perforation in inflammatory bowel disease"}, {"letter": "B", "text": "Toxic megacolon"}, {"letter": "C", "text": "Clostridioides difficile colitis"}, {"letter": "D", "text": "Fistulizing Crohn's disease"}, {"letter": "E", "text": "Stricturing Crohn's disease"}], "answer": "E", "explanation": "Colic timed to meals for months, then obstipation with vomiting and air-fluid levels, is mechanical obstruction of the small bowel in a patient whose disease is transmural. A penetrating complication would give a tract and drainage, and a toxic colon would give a dilated colon with systemic toxicity."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Stricturing Crohn's disease"}, {"letter": "B", "text": "Toxic megacolon"}, {"letter": "C", "text": "Colon perforation in inflammatory bowel disease"}, {"letter": "D", "text": "Fistulizing Crohn's disease"}, {"letter": "E", "text": "Clostridioides difficile colitis"}], "answer": "A", "explanation": "Fixed narrowing at the neoterminal ileum with proximal dilation, in a woman with two prior resections and no biologic for a year, is a stricture that has obstructed. The poorly enhancing wall says the narrowing is scar, which matters because scar does not respond to drugs."}, {"key": "mgmt", "path": "both", "stem": "She has a fibrotic stricture with small bowel obstruction. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Emergent colectomy with broad-spectrum antibiotics"}, {"letter": "B", "text": "Bowel rest with nasogastric decompression, then balloon dilation"}, {"letter": "C", "text": "Intravenous corticosteroids with rescue infliximab"}, {"letter": "D", "text": "Anti-TNF therapy with an immunomodulator and seton placement"}, {"letter": "E", "text": "Intravenous steroids, antibiotics, fluids, and nasogastric and rectal tubes"}], "answer": "B", "explanation": "The obstructed bowel is decompressed first, and the narrowing itself is then opened mechanically. Corticosteroids will not open scar, so escalating medical therapy here only delays the treatment that works; anti-diarrheals and anticholinergics are avoided for the risk of toxic dilation."}, {"key": "escalate", "path": "both", "stem": "Endoscopic balloon dilation is performed, and her postprandial pain and obstruction return. Which of the following should be done next?", "options": [{"letter": "A", "text": "Stricturoplasty of the narrowed segment"}, {"letter": "B", "text": "Intravenous corticosteroids with rescue infliximab"}, {"letter": "C", "text": "Emergent colectomy with broad-spectrum antibiotics"}, {"letter": "D", "text": "Intravenous steroids, antibiotics, fluids, and nasogastric and rectal tubes"}, {"letter": "E", "text": "Anti-TNF therapy with an immunomodulator"}], "answer": "A", "explanation": "When dilation fails, the segment is widened surgically without being removed, because bowel length is the currency in a disease that recurs and operates again. Resection is kept for the stricture that cannot be reconstructed."}, {"key": "counsel", "path": "both", "stem": "She has stricturing Crohn's disease. Which of the following is the most appropriate approach to bowel resection?", "options": [{"letter": "A", "text": "Resect once the disease has been present for 20 years"}, {"letter": "B", "text": "Resect every stricture at the time it is identified"}, {"letter": "C", "text": "Resect once a second course of biologic therapy has failed"}, {"letter": "D", "text": "Resect only when stricturoplasty is not feasible"}, {"letter": "E", "text": "Resect only once free perforation has occurred"}], "answer": "D", "explanation": "About three quarters of patients need an operation within twenty years and surgery is not curative, so each resection has to be justified against the length it costs. Every surgical indication in this disease is a complication rather than the disease itself."}]}, {"case": "IB-E1", "group": "IB-E", "section": "the silent systemic cost of long-standing IBD and its treatment", "objective": "", "vignette_workup": "A 63-year-old woman presents to the primary care clinic three weeks after breaking her left wrist in a fall from standing height on a level sidewalk. She has no other symptoms apart from a mild mid-back ache. She has had Crohn's disease for twenty-two years and has taken at least six courses of prednisone in the last five years. She went through menopause at 51, and her mother broke a hip in her seventies. She is a retired librarian. Her temperature is 36.7°C (98.1°F), blood pressure is 132/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. Her left wrist is in a cast, she has lost 3 cm of height since her forties, and she has mild thoracic kyphosis; her abdomen is soft and nontender.", "labs_workup": [["25-hydroxyvitamin D", "14 ng/mL"], ["Calcium", "8.4 mg/dL"], ["Albumin", "3.6 g/dL"], ["Creatinine", "0.9 mg/dL"], ["Alkaline phosphatase", "96 U/L"]], "vignette_recog": "A 63-year-old woman presents to the primary care clinic three weeks after breaking her left wrist in a fall from standing height on a level sidewalk. She has no other symptoms apart from a mild mid-back ache. She has had Crohn's disease for twenty-two years and has taken at least six courses of prednisone in the last five years. She went through menopause at 51, and her mother broke a hip in her seventies. She is a retired librarian. Her temperature is 36.7°C (98.1°F), blood pressure is 132/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. Her left wrist is in a cast, she has lost 3 cm of height since her forties, and she has mild thoracic kyphosis; her abdomen is soft and nontender. A DEXA scan is obtained.", "labs_recog": [["25-hydroxyvitamin D", "14 ng/mL"], ["Calcium", "8.4 mg/dL"], ["Albumin", "3.6 g/dL"], ["Creatinine", "0.9 mg/dL"], ["Alkaline phosphatase", "96 U/L"], ["DEXA", "T-score −2.9 at the lumbar spine and −2.5 at the femoral neck"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Breath testing after a carbohydrate load"}, {"letter": "B", "text": "Ileocolonoscopy with ileal intubation and biopsy"}, {"letter": "C", "text": "Tissue transglutaminase IgA with a total IgA"}, {"letter": "D", "text": "A DEXA scan"}, {"letter": "E", "text": "Surveillance colonoscopy with four-quadrant biopsies"}], "answer": "D", "explanation": "A fracture from standing height, height loss, and kyphosis in a woman with two decades of inflammation and repeated steroid courses is a bone question, and bone density is measured directly. Endoscopy would answer a question her quiet abdomen is not asking."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Flat high-grade dysplasia in inflamed mucosa with no visible polyp"}, {"letter": "B", "text": "A T-score of −2.9 at the lumbar spine and −2.5 at the femoral neck"}, {"letter": "C", "text": "An early rise in exhaled hydrogen after the carbohydrate load"}, {"letter": "D", "text": "An MCV of 106 fL with a B12 of 118 pg/mL and normal folate and iron"}, {"letter": "E", "text": "Skip lesions with cobblestoning and non-caseating granulomas"}], "answer": "B", "explanation": "Steroids inhibit bone formation and increase resorption while calcium and vitamin D absorption falls, and cytokines from active inflammation drive resorption further. The trabecular spine loses density before the femoral neck does, which is why the spinal T-score is the lower of the two."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small intestinal bacterial overgrowth"}, {"letter": "B", "text": "Nutritional deficiency and malabsorption"}, {"letter": "C", "text": "IBD-associated osteoporosis"}, {"letter": "D", "text": "Crohn's disease with active ileitis"}, {"letter": "E", "text": "IBD-associated colorectal cancer"}], "answer": "C", "explanation": "The condition affects between 18 and 42% of patients with inflammatory bowel disease, and its first sign is usually a fracture rather than a symptom. A normal blood count and a normal MCV argue against a deficiency state, and the quiet abdomen argues against active bowel disease."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small intestinal bacterial overgrowth"}, {"letter": "B", "text": "Crohn's disease with active ileitis"}, {"letter": "C", "text": "IBD-associated colorectal cancer"}, {"letter": "D", "text": "IBD-associated osteoporosis"}, {"letter": "E", "text": "Nutritional deficiency and malabsorption"}], "answer": "D", "explanation": "A T-score at or below −2.5 with a fragility fracture is osteoporosis, and the twenty-two years of inflammation, six steroid courses, malabsorption of vitamin D, and post-menopausal state are the parallel mechanisms behind it. A deficiency panel would show a macrocytic anemia, which she does not have."}, {"key": "mgmt", "path": "both", "stem": "She has osteoporosis related to her inflammatory bowel disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "An antibiotic course directed at enteric flora"}, {"letter": "B", "text": "A further course of prednisone with calcium supplementation"}, {"letter": "C", "text": "Repletion of B12, iron, folate, and vitamin D"}, {"letter": "D", "text": "Vitamin D and calcium with weight-bearing exercise"}, {"letter": "E", "text": "A lifelong gluten-free diet"}], "answer": "D", "explanation": "Replacing what is not absorbed and loading the skeleton are the two things that act on the bone directly, and the steroid exposure is the modifiable driver that has to come down. Reaching for prednisone again is the trap: steroids suppress a flare and are not maintenance, and each course costs more bone."}, {"key": "counsel", "path": "both", "stem": "She has osteoporosis related to her inflammatory bowel disease. Which of the following is the most appropriate approach to repeating her DEXA scan?", "options": [{"letter": "A", "text": "Repeat it only after another course of corticosteroids"}, {"letter": "B", "text": "Repeat it sooner than the routine 2- to 3-year interval"}, {"letter": "C", "text": "Repeat it every 2 to 3 years, as for a patient with a normal scan"}, {"letter": "D", "text": "Repeat it only if she sustains another fragility fracture"}, {"letter": "E", "text": "Repeat it only if her vitamin D remains below 20 ng/mL"}], "answer": "B", "explanation": "The routine interval assumes a normal baseline scan and no accelerating risk. Recurrent steroid courses, a fracture already sustained, and post-menopausal status all shorten it, and waiting for the next fracture makes the scan a record rather than a warning."}]}, {"case": "MA-A1", "group": "MA-A", "section": "rapidly progressive solid-food dysphagia with weight loss", "objective": "", "vignette_workup": "A 71-year-old man presents to the gastroenterology clinic because swallowing has become difficult over the past four months. It began with meat and bread, then rice, and for the last two weeks he has been unable to keep water down without regurgitating it. Swallowing hurts, his voice has been hoarse for a month, and he has lost 22 pounds. He smoked a pack a day for forty-five years, drinks three to four beers daily, and has had heartburn most evenings for two decades. He is a retired machinist. His temperature is 36.8°C, blood pressure is 118/72 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 97% on room air. He has temporal wasting with a body mass index of 19, a firm fixed left supraclavicular node, and a hoarse voice; his stool is heme-positive and there is no palpable abdominal mass.", "labs_workup": [["Barium swallow", "Annular constricting apple-core lesion"], ["Hemoglobin / hematocrit", "10.2 g/dL / 31%"], ["MCV", "74 fL"], ["Ferritin", "8 ng/mL"], ["Platelets", "288,000/mm³"]], "vignette_recog": "A 71-year-old man presents to the gastroenterology clinic because swallowing has become difficult over the past four months. It began with meat and bread, then rice, and for the last two weeks he has been unable to keep water down without regurgitating it. Swallowing hurts, his voice has been hoarse for a month, and he has lost 22 pounds. He smoked a pack a day for forty-five years, drinks three to four beers daily, and has had heartburn most evenings for two decades. He is a retired machinist. His temperature is 36.8°C, blood pressure is 118/72 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 97% on room air. He has temporal wasting with a body mass index of 19, a firm fixed left supraclavicular node, and a hoarse voice; his stool is heme-positive and there is no palpable abdominal mass. He undergoes upper endoscopy with biopsy.", "labs_recog": [["Barium swallow", "Annular constricting apple-core lesion"], ["Hemoglobin / hematocrit", "10.2 g/dL / 31%"], ["MCV", "74 fL"], ["Ferritin", "8 ng/mL"], ["Platelets", "288,000/mm³"], ["Upper endoscopy", "Ulcerated circumferential mass at 32 cm from the incisors, residual lumen 6 mm, the scope will not pass; biopsy-proven carcinoma"], ["CT chest and abdomen", "Periesophageal nodes, no liver lesions"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Esophageal manometry"}, {"letter": "B", "text": "Endoscopic ultrasound with staging PET"}, {"letter": "C", "text": "Upper endoscopy with biopsy"}, {"letter": "D", "text": "Multiphasic contrast MRI of the liver"}, {"letter": "E", "text": "CT or MR enterography"}], "answer": "C", "explanation": "A contrast study can outline a narrowing but never establishes what it is, and treating or dilating on the strength of the barium alone is the error the case turns on. Tissue is the gold standard, and the scope is what obtains it."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A mid-esophageal mass at 26 cm with irregular rigid narrowing"}, {"letter": "B", "text": "A dilated body with a smooth tapered narrowing at the gastroesophageal junction"}, {"letter": "C", "text": "An ulcerated circumferential mass at 32 cm with a residual lumen of 6 mm"}, {"letter": "D", "text": "A distal mass at the gastroesophageal junction with adjacent salmon-colored mucosa"}, {"letter": "E", "text": "A short smooth tapered narrowing at the gastroesophageal junction with no mass"}], "answer": "C", "explanation": "A tumor growing circumferentially leaves a rigid residual lumen that neither food nor a scope will pass, and ulceration within it is what makes the stool heme-positive. A smooth tapered narrowing that the scope passes with gentle pressure is a motility or reflux problem, not a mass."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the extent of disease?", "options": [{"letter": "A", "text": "Esophageal manometry"}, {"letter": "B", "text": "Biopsy of the stricture margin"}, {"letter": "C", "text": "ERCP with brushings of the duct"}, {"letter": "D", "text": "Urea breath test for Helicobacter pylori"}, {"letter": "E", "text": "Endoscopic ultrasound with staging PET"}], "answer": "E", "explanation": "Endoscopic ultrasound reads depth of invasion and regional nodes with 80 to 90% accuracy, and PET answers whether disease has spread beyond the field a surgeon can resect. Together they decide whether the operation is possible at all."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Achalasia"}, {"letter": "B", "text": "Esophageal squamous cell carcinoma"}, {"letter": "C", "text": "Esophageal cancer"}, {"letter": "D", "text": "Esophageal adenocarcinoma"}, {"letter": "E", "text": "Peptic (reflux) stricture"}], "answer": "C", "explanation": "Dysphagia progressing from solids to liquids over months, with weight loss, odynophagia, hoarseness, a fixed supraclavicular node, and iron deficiency, is malignant obstruction. A reflux stricture leaves the weight stable, and achalasia gives dysphagia to solids and liquids together from the start."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peptic (reflux) stricture"}, {"letter": "B", "text": "Esophageal squamous cell carcinoma"}, {"letter": "C", "text": "Esophageal cancer"}, {"letter": "D", "text": "Esophageal adenocarcinoma"}, {"letter": "E", "text": "Achalasia"}], "answer": "C", "explanation": "Biopsy-proven carcinoma in a circumferential obstructing mass settles the diagnosis. He carries both risk profiles — four decades of tobacco and alcohol on one side, two decades of reflux on the other — so the history does not predict which cell type the pathology will show."}, {"key": "mgmt", "path": "both", "stem": "He has esophageal cancer with locally advanced disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Pneumatic dilation or myotomy"}, {"letter": "B", "text": "Endoscopic mucosal resection with ablation"}, {"letter": "C", "text": "Dilation with acid suppression"}, {"letter": "D", "text": "Esophagectomy after neoadjuvant chemoradiation"}, {"letter": "E", "text": "Subtotal gastrectomy with regional nodes"}], "answer": "D", "explanation": "Disease that has invaded through the muscularis with involved regional nodes is treated with chemoradiation first and then resection. Endoscopic resection belongs to early superficial disease, and dilating a malignant narrowing treats the symptom while leaving the tumor."}, {"key": "escalate", "path": "both", "stem": "While he is awaiting treatment he becomes unable to handle his own secretions. Which of the following should be done next?", "options": [{"letter": "A", "text": "Dilation with acid suppression"}, {"letter": "B", "text": "Esophageal stent placement"}, {"letter": "C", "text": "Subtotal gastrectomy with regional nodes"}, {"letter": "D", "text": "Esophagectomy after neoadjuvant chemoradiation"}, {"letter": "E", "text": "Pneumatic dilation or myotomy"}], "answer": "B", "explanation": "Complete obstruction with an inability to clear secretions is an emergency, because the next event is aspiration. A stent restores a lumen immediately and a feeding tube restores nutrition, neither of which waits for the oncologic plan."}, {"key": "counsel", "path": "both", "stem": "He has esophageal cancer. Which of the following is the most appropriate approach to dilating an esophageal narrowing?", "options": [{"letter": "A", "text": "Dilate only once weight loss exceeds 20 pounds"}, {"letter": "B", "text": "Dilate whenever a barium study shows an annular narrowing"}, {"letter": "C", "text": "Dilate whenever the patient can no longer swallow liquids"}, {"letter": "D", "text": "Dilate only if the narrowing lies below 30 cm from the incisors"}, {"letter": "E", "text": "Dilate only after endoscopic biopsy has excluded malignancy"}], "answer": "E", "explanation": "A narrowing is not a diagnosis, and dilating one that turns out to be tumor risks perforating it and delays staging. Symptoms and radiographic appearance do not separate a benign stricture from a malignant one; only the biopsy does."}]}, {"case": "MA-C2", "group": "MA-C", "section": "weight loss with an abdominal mass and one systemic clue", "objective": "", "vignette_workup": "A 67-year-old man presents to the gastroenterology clinic with two months of crampy abdominal pain, a 20-pound weight loss, and two episodes of melena. He was diagnosed with celiac disease at 55 and has adhered poorly to a gluten-free diet. He is HIV-negative and takes no immunosuppressive medication. His temperature is 37.1°C, blood pressure is 118/72 mm Hg, pulse is 90/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has a palpable tender mass in the right lower quadrant, no peritoneal signs, and heme-positive stool.", "labs_workup": [["Hemoglobin / hematocrit", "10.4 g/dL / 31%"], ["MCV", "79 fL"], ["Platelets", "264,000/mm³"], ["WBC", "7,100/mm³"]], "vignette_recog": "A 67-year-old man presents to the gastroenterology clinic with two months of crampy abdominal pain, a 20-pound weight loss, and two episodes of melena. He was diagnosed with celiac disease at 55 and has adhered poorly to a gluten-free diet. He is HIV-negative and takes no immunosuppressive medication. His temperature is 37.1°C, blood pressure is 118/72 mm Hg, pulse is 90/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has a palpable tender mass in the right lower quadrant, no peritoneal signs, and heme-positive stool. He undergoes small bowel imaging and endoscopy with biopsy.", "labs_recog": [["Hemoglobin / hematocrit", "10.4 g/dL / 31%"], ["MCV", "79 fL"], ["Platelets", "264,000/mm³"], ["WBC", "7,100/mm³"], ["CT enterography", "Circumferential bowel-wall thickening with a mass at the ileocecal valve, no perforation"], ["Biopsy", "Lymphoma"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Upper endoscopy with biopsy"}, {"letter": "B", "text": "Right upper quadrant ultrasound"}, {"letter": "C", "text": "Multiphasic contrast MRI of the liver"}, {"letter": "D", "text": "24-hour urinary 5-HIAA"}, {"letter": "E", "text": "CT or MR enterography"}], "answer": "E", "explanation": "A palpable right lower quadrant mass with melena and weight loss puts the lesion in the small bowel, which neither scope reaches routinely. Enterography distends the lumen and images the wall, so it shows both the mass and whether the bowel has perforated."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An ulcerated mass in the second duodenum at the ampulla"}, {"letter": "B", "text": "Bowel-wall thickening with a mass at the ileocecal valve"}, {"letter": "C", "text": "A 2.5-cm ileal mass 40 cm from the ileocecal valve with hepatic lesions"}, {"letter": "D", "text": "An 8-cm exophytic jejunal mass with central necrosis"}, {"letter": "E", "text": "A polypoid antral filling defect, ulcerated within the mass"}], "answer": "B", "explanation": "The tumor infiltrates the wall circumferentially rather than encircling and choking the lumen, which is why it grows to a palpable size and bleeds before it obstructs. The ileocecal region is one of its recognized sites below the stomach."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Carcinoid tumor"}, {"letter": "B", "text": "Gastric adenocarcinoma"}, {"letter": "C", "text": "Small-bowel leiomyosarcoma"}, {"letter": "D", "text": "Small bowel lymphoma"}, {"letter": "E", "text": "Small-bowel adenocarcinoma"}], "answer": "D", "explanation": "Poorly controlled celiac disease is a named risk condition, the seventh decade and male sex fit the demographic, and the ileocecal region is a recognized site. A gastric primary would announce itself with early satiety and a left supraclavicular node, and a neuroendocrine tumor with flushing and secretory diarrhea."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small bowel lymphoma"}, {"letter": "B", "text": "Small-bowel adenocarcinoma"}, {"letter": "C", "text": "Small-bowel leiomyosarcoma"}, {"letter": "D", "text": "Gastric adenocarcinoma"}, {"letter": "E", "text": "Carcinoid tumor"}], "answer": "A", "explanation": "The biopsy settles it, and the setting explains it: long-standing untreated celiac disease is one of the two named risk conditions, the other being HIV, which he does not have. Infiltration of the wall rather than encirclement of the lumen is why the wall thins and can eventually perforate."}, {"key": "mgmt", "path": "both", "stem": "He has small bowel lymphoma. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Chemotherapy with radiation and no resection"}, {"letter": "B", "text": "Subtotal gastrectomy with regional nodes plus H. pylori eradication"}, {"letter": "C", "text": "Surgical resection plus chemotherapy"}, {"letter": "D", "text": "A proton pump inhibitor plus H. pylori eradication"}, {"letter": "E", "text": "Surgical resection plus a somatostatin analog"}], "answer": "C", "explanation": "The tumour is resected and chemotherapy follows it — the two together are the management, not one or the other. Gastrectomy with nodal clearance and eradication belongs to the gastric epithelial tumour, a somatostatin analog to the neuroendocrine one, and chemotherapy without resection to advanced gastric disease."}]}, {"case": "MA-C3", "group": "MA-C", "section": "weight loss with an abdominal mass and one systemic clue", "objective": "", "vignette_workup": "A 52-year-old white woman presents to the primary care clinic with a year of episodic facial flushing and watery diarrhea, worse over the last three months, with crampy abdominal pain, nausea, and occasional vomiting. She has been treated as irritable bowel syndrome for two years. She has no MEN1 or MEN2 and no family history of endocrine tumors. Her temperature is 36.8°C, blood pressure is 108/66 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 99% on room air. Facial and upper-chest flushing is observed during the visit, and she has mild right lower quadrant tenderness with no palpable mass.", "labs_workup": [["Hemoglobin / hematocrit", "12.6 g/dL / 38%"]], "vignette_recog": "A 52-year-old white woman presents to the primary care clinic with a year of episodic facial flushing and watery diarrhea, worse over the last three months, with crampy abdominal pain, nausea, and occasional vomiting. She has been treated as irritable bowel syndrome for two years. She has no MEN1 or MEN2 and no family history of endocrine tumors. Her temperature is 36.8°C, blood pressure is 108/66 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 99% on room air. Facial and upper-chest flushing is observed during the visit, and she has mild right lower quadrant tenderness with no palpable mass. Biochemical testing and cross-sectional imaging are obtained.", "labs_recog": [["Hemoglobin / hematocrit", "12.6 g/dL / 38%"], ["24-hour urinary 5-HIAA", "68 mg (reference <6)"], ["Chromogranin A", "480 ng/mL, elevated"], ["CT", "2.5-cm ileal mass 40 cm proximal to the ileocecal valve, with multiple hepatic lesions"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Upper endoscopy for a duodenal lesion"}, {"letter": "B", "text": "Upper endoscopy with biopsy"}, {"letter": "C", "text": "CT or MR enterography"}, {"letter": "D", "text": "24-hour urinary 5-HIAA"}, {"letter": "E", "text": "CT of the small bowel"}], "answer": "D", "explanation": "Flushing with secretory diarrhea in a woman carrying a two-year functional label is a biochemical question before it is an imaging one, and the urinary breakdown product of serotonin is the test that asks it. A negative result would send the workup somewhere else entirely."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A 2.5-cm ileal mass near the ileocecal valve with hepatic lesions"}, {"letter": "B", "text": "A polypoid antral filling defect, ulcerated within the mass"}, {"letter": "C", "text": "An 8-cm exophytic jejunal mass with central necrosis"}, {"letter": "D", "text": "Bowel-wall thickening with a mass at the ileocecal valve"}, {"letter": "E", "text": "An ulcerated mass in the second duodenum at the ampulla"}], "answer": "A", "explanation": "Within the small bowel these tumors sit in the ileum, within about 60 cm of the ileocecal valve, and by the time the syndrome is florid there are usually hepatic deposits as well. A gastric or duodenal primary sits proximally, and a leiomyosarcoma is a bulky jejunal mass with central necrosis."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "MRCP of the biliary tree"}, {"letter": "B", "text": "Urea breath test for Helicobacter pylori"}, {"letter": "C", "text": "Endoscopic ultrasound with staging PET"}, {"letter": "D", "text": "Biopsy of the lesion"}, {"letter": "E", "text": "ERCP with brushings of the duct"}], "answer": "D", "explanation": "Biochemistry and imaging together make the diagnosis very likely, but histology is what names the cell of origin. The other assays confirm entirely different tumors and would return nothing informative here."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gastric adenocarcinoma"}, {"letter": "B", "text": "Carcinoid tumor"}, {"letter": "C", "text": "Small bowel lymphoma"}, {"letter": "D", "text": "Small-bowel adenocarcinoma"}, {"letter": "E", "text": "Small-bowel leiomyosarcoma"}], "answer": "B", "explanation": "Episodic flushing, watery diarrhea, and cramping driven by tumor-produced serotonin is carcinoid syndrome, and a raised urinary 5-HIAA is its biochemical signature. The other tumours in this differential present as a mass with bleeding or obstruction and produce nothing."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gastric adenocarcinoma"}, {"letter": "B", "text": "Carcinoid tumor"}, {"letter": "C", "text": "Small-bowel adenocarcinoma"}, {"letter": "D", "text": "Small bowel lymphoma"}, {"letter": "E", "text": "Small-bowel leiomyosarcoma"}], "answer": "B", "explanation": "An ileal mass near the ileocecal valve with a markedly raised urinary 5-HIAA and an elevated chromogranin A is a neuroendocrine tumor of the small intestine. The hepatic lesions are what allow the syndrome to appear at all."}, {"key": "mgmt", "path": "both", "stem": "She has a carcinoid tumor of the ileum. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Chemotherapy with radiation and no resection"}, {"letter": "B", "text": "Surgical resection with chemotherapy"}, {"letter": "C", "text": "Subtotal gastrectomy with regional nodes"}, {"letter": "D", "text": "A proton pump inhibitor with Helicobacter pylori eradication"}, {"letter": "E", "text": "Surgical resection of the ileal mass"}], "answer": "E", "explanation": "The primary is removed — resection is the first-line treatment for a neuroendocrine tumour of the small bowel. Gastrectomy with nodal clearance treats the gastric epithelial tumour, resection with chemotherapy the lymphoid one, and acid suppression with eradication a benign ulcer."}, {"key": "escalate", "path": "both", "stem": "She undergoes resection of her carcinoid tumor, and her hepatic lesions progress on follow-up imaging. Which of the following should be given next?", "options": [{"letter": "A", "text": "A proton pump inhibitor with Helicobacter pylori eradication"}, {"letter": "B", "text": "Subtotal gastrectomy with regional nodes"}, {"letter": "C", "text": "Repeat surgical resection of the primary lesion"}, {"letter": "D", "text": "Surgical resection with chemotherapy"}, {"letter": "E", "text": "A somatostatin analog"}], "answer": "E", "explanation": "Once disease is metastatic and no longer resectable, a somatostatin analog suppresses hormone release and slows progression, with chemotherapy behind it. Operating again on a primary that has already been removed does nothing for hepatic disease."}, {"key": "counsel", "path": "both", "stem": "She has a small intestinal neuroendocrine tumor. Which of the following is the most appropriate expectation about her flushing and diarrhea?", "options": [{"letter": "A", "text": "They appear only once the primary tumor exceeds 5 cm"}, {"letter": "B", "text": "They appear only once the tumor has spread to the liver"}, {"letter": "C", "text": "They appear as // Rotating stack builder for a Clinical Vignette practice exam.
//
// Injected immediately after the `const EXAM_DATA = ...;` line of the
// interactive-exam template, before the main IIFE.
//
// EXAM_DATA.pool is an array of CASES. Each case carries two possible opening
// vignettes and an ordered pool of question nodes. On every page load this
// script picks one path per case, draws 2-4 nodes from it in clinical order,
// shuffles the options, shuffles the case order under the adjacency rule, and
// writes a normal EXAM_DATA.questions array for the template to render.
//
// Case shape:
//   { case, group, section, objective,
//     vignette_workup, vignette_recog,      // parent stems (full vignette + lead-in)
//     labs_workup, labs_recog,              // optional [[test,result],...]
//     nodes: [ { key, path, stem, options:[{letter,text}], answer, explanation } ] }
//
// node.key    next_step | result | confirm | dx | dx_direct | mgmt | escalate | counsel
// node.path   "W" workup-first | "R" recognition-first | "both"
//
// Invariants held on every draw:
//   1. the parent node (next_step or dx_direct) is always first and carries the vignette
//   2. `result` — the held-back finding — may only sit immediately after the parent
//   3. `confirm` is drawn only when `result` is also drawn
//   4. nodes keep their pool order, which is clinical order
//   5. no two adjacent cases share a differential group
(function buildExam() {
  var pool = EXAM_DATA.pool;
  if (!pool || !pool.length) return;             // no pool: leave EXAM_DATA.questions alone

  var LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  var W_ORDER = ['next_step', 'result', 'confirm', 'dx', 'mgmt', 'escalate', 'counsel'];
  var R_ORDER = ['dx_direct', 'mgmt', 'escalate', 'counsel'];

  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function nodesFor(c, path) {
    var order = path === 'R' ? R_ORDER : W_ORDER;
    var out = [];
    order.forEach(function (k) {
      for (var i = 0; i < c.nodes.length; i++) {
        var n = c.nodes[i];
        if (n.key !== k) continue;
        if (n.path && n.path !== 'both' && n.path !== path) continue;
        out.push(n); break;
      }
    });
    return out;
  }

  // Every ordered subset of `rest` of exactly size m that satisfies the two
  // structural rules. `rest` is at most six nodes, so enumeration is cheap and
  // gives a genuinely uniform draw rather than a length-biased one.
  function validSubsets(rest, m) {
    var out = [];
    var total = 1 << rest.length;
    for (var mask = 0; mask < total; mask++) {
      var take = [], bits = 0;
      for (var i = 0; i < rest.length; i++) {
        if (mask & (1 << i)) { take.push(rest[i]); bits++; }
      }
      if (bits !== m) continue;
      var keys = take.map(function (n) { return n.key; });
      if (keys.indexOf('result') !== -1 && keys[0] !== 'result') continue;            // rule 2
      if (keys.indexOf('confirm') !== -1 && keys.indexOf('result') === -1) continue;  // rule 3
      out.push(take);
    }
    return out;
  }

  function drawFollowers(rest, k) {
    var m = k - 1;
    while (m > 0) {
      var sets = validSubsets(rest, m);
      if (sets.length) return pick(sets);
      m--;
    }
    return rest.slice(0, 1);
  }

  // The template escapes the stem and renders it with white-space: pre-wrap,
  // so studies are laid out as plain indented lines, not a markdown table.
  function labTable(rows) {
    if (!rows || !rows.length) return '';
    var s = '\n\nStudies:';
    rows.forEach(function (r) { s += '\n    ' + r[0] + ' — ' + r[1]; });
    return s;
  }

  // ---- build one stack per case -------------------------------------------
  var stacks = [];
  pool.forEach(function (c) {
    var paths = [];
    if (nodesFor(c, 'W').length >= 2) paths.push('W');
    var rNodes = nodesFor(c, 'R');
    if (rNodes.length >= 2 && c.vignette_recog) paths.push('R');
    if (!paths.length) return;
    var path = pick(paths);

    var ns = nodesFor(c, path);
    var parent = ns[0], rest = ns.slice(1);
    var k = Math.min(2 + Math.floor(Math.random() * 3), rest.length + 1);  // 2..4
    var chosen = [parent].concat(drawFollowers(rest, k));

    var vign = path === 'R' ? c.vignette_recog : c.vignette_workup;
    var labs = path === 'R' ? c.labs_recog : c.labs_workup;

    var qs = chosen.map(function (n, i) {
      return {
        stem: i === 0 ? vign + labTable(labs) + '\n\n' + n.stem : n.stem,
        options: (n.options || []).map(function (o) { return { letter: o.letter, text: o.text }; }),
        answer: n.answer,
        explanation: n.explanation || '',
        objective: c.objective || '',
        section: c.section || 'All questions',
        pcase: c.case,
        pgroup: c.group
      };
    });
    stacks.push({ qs: qs, pgroup: c.group, pcase: c.case });
  });
  if (!stacks.length) return;

  // ---- shuffle options inside each question -------------------------------
  stacks.forEach(function (s) {
    s.qs.forEach(function (q) {
      if (!q.options || q.options.length < 2) return;
      var keyText = null;
      q.options.forEach(function (o) { if (o.letter === q.answer) keyText = o.text; });
      var texts = shuffled(q.options.map(function (o) { return o.text; }));
      q.options = texts.map(function (t, i) { return { letter: LET[i], text: t }; });
      for (var i = 0; i < q.options.length; i++) {
        if (q.options[i].text === keyText) { q.answer = q.options[i].letter; break; }
      }
    });
  });

  // ---- order the stacks, no two group-mates adjacent ----------------------
  function adjacent(seq) {
    for (var i = 0; i < seq.length - 1; i++) if (seq[i].pgroup === seq[i + 1].pgroup) return true;
    return false;
  }
  var seq = shuffled(stacks);
  for (var attempt = 0; attempt < 4000 && adjacent(seq); attempt++) seq = shuffled(stacks);
  if (adjacent(seq)) {                     // greedy repair if random never lands it
    var remaining = stacks.slice(), built = [];
    while (remaining.length) {
      var idx = 0;
      for (var i = 0; i < remaining.length; i++) {
        if (!built.length || remaining[i].pgroup !== built[built.length - 1].pgroup) { idx = i; break; }
      }
      built.push(remaining.splice(idx, 1)[0]);
    }
    seq = built;
  }

  // ---- number and hand off -------------------------------------------------
  var out = [];
  seq.forEach(function (s, i) {
    var n = i + 1;
    s.qs.forEach(function (q, j) {
      q.group = n;
      q.id = j === 0 ? String(n) : String(n) + LET[j - 1];
      out.push(q);
    });
  });
  EXAM_DATA.questions = out;
})();


(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;

    const sections = {};
    graded.forEach(q => {

      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };

      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };

    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
