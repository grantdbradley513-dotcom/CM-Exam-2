<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>

const EXAM_DATA = {"title": "GI Exam 1 — Practice Exam 2 of 6", "questions": [{"id": "1", "group": 1, "stem": "A 56-year-old man is referred to the gastroenterology clinic with a year of episodes of severe crushing retrosternal chest pain lasting several minutes, during which he cannot swallow solids or liquids; between the episodes he swallows normally. He also has heartburn and regurgitation. The episodes come and go and have not worsened. He has been to the emergency department twice for chest pain, with negative troponins and a normal stress test, and he takes no cardiac medications. He has lost no weight. His temperature is 36.6°C (97.9°F), blood pressure is 134/82 mm Hg, pulse is 80/min, respirations are 16/min, and oxygen saturation is 98% on room air. Examination is normal, with no epigastric tenderness and no chest wall tenderness reproducing the pain.\n\nStudies:\n    Upper endoscopy with biopsy — Normal mucosa with no ring, stricture, or mass; biopsies with no eosinophilia\n    Barium swallow — \"Corkscrew\" esophagus with simultaneous tertiary contractions\n    Esophageal pH study — Acid exposure time 3.1%, negative for pathologic reflux\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "EGD with biopsy of the gastroesophageal junction"}, {"letter": "B", "text": "Esophageal biopsy histology"}, {"letter": "C", "text": "Ambulatory esophageal pH study with a BRAVO capsule"}, {"letter": "D", "text": "An empiric proton pump inhibitor trial for 8 weeks"}, {"letter": "E", "text": "Esophageal manometry"}], "answer": "E", "explanation": "Endoscopy and barium have already excluded a structural lesion, so what remains is a motor question, and manometry is the study that measures contraction timing and sphincter relaxation directly. A pH study has already been done and was negative, and repeat biopsies answer a question the first set settled.", "objective": "", "section": "dysphagia to solids AND liquids from a disordered esophageal muscle", "pcase": "ES-B2", "pgroup": "ES-B"}, {"id": "1A", "group": 1, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "More than 15 eosinophils per high-power field"}, {"letter": "B", "text": "Pathologic acid exposure correlating with symptoms"}, {"letter": "C", "text": "An infiltrating tumor at the gastroesophageal junction"}, {"letter": "D", "text": "Premature simultaneous distal contractions with normal sphincter relaxation"}, {"letter": "E", "text": "Absent peristalsis with incomplete sphincter relaxation and an IRP of 26 mm Hg"}], "answer": "D", "explanation": "The disorder is one of timing rather than of outflow: the distal esophagus contracts all at once instead of in sequence, which produces the pain and the transient dysphagia, while the sphincter itself opens normally. Incomplete sphincter relaxation with a raised integrated relaxation pressure is the pattern of obstruction at the outlet, not of a disordered body.", "objective": "", "section": "dysphagia to solids AND liquids from a disordered esophageal muscle", "pcase": "ES-B2", "pgroup": "ES-B"}, {"id": "1B", "group": 1, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Diffuse esophageal spasm"}, {"letter": "B", "text": "Eosinophilic esophagitis"}, {"letter": "C", "text": "Gastroesophageal reflux disease"}, {"letter": "D", "text": "Achalasia"}, {"letter": "E", "text": "Pseudoachalasia from a gastroesophageal junction malignancy"}], "answer": "A", "explanation": "Intermittent, non-progressive symptoms with chest pain leading and normal swallowing between attacks fit a spasm rather than a fixed obstruction. Achalasia progresses and retains food behind a sphincter that will not open; pseudoachalasia adds a short history with rapid weight loss in an older patient.", "objective": "", "section": "dysphagia to solids AND liquids from a disordered esophageal muscle", "pcase": "ES-B2", "pgroup": "ES-B"}, {"id": "1C", "group": 1, "stem": "He has diffuse esophageal spasm. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "B", "text": "A twice-daily proton pump inhibitor"}, {"letter": "C", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "D", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "E", "text": "A once-daily proton pump inhibitor for 8 weeks with lifestyle change"}], "answer": "B", "explanation": "Acid is a common trigger and he has coexisting reflux, so the opening move is twice-daily acid suppression rather than anything mechanical. Dilation treats a sphincter that will not open or a fixed narrowing, and neither is present here.", "objective": "", "section": "dysphagia to solids AND liquids from a disordered esophageal muscle", "pcase": "ES-B2", "pgroup": "ES-B"}, {"id": "2", "group": 2, "stem": "A 52-year-old woman comes to the primary care clinic with three episodes of difficulty swallowing solid food over the past six months. Each began with steak or fresh bread and brought brief chest discomfort while the bite was stuck; the bite then cleared and she ate normally for weeks afterward, and one episode required her to bring the bite back up. The episodes have not become more frequent or more severe. She has chronic heartburn and takes an antacid a few times a month. She has had no bleeding and has lost no weight. Her temperature is 36.6°C (97.9°F), blood pressure is 122/74 mm Hg, pulse is 70/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination is normal, with no pallor and no cervical adenopathy.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A modified barium swallow for a cervical web"}, {"letter": "B", "text": "CBC with iron studies"}, {"letter": "C", "text": "Barium swallow with a 13 mm barium tablet"}, {"letter": "D", "text": "High-resolution esophageal manometry"}, {"letter": "E", "text": "EGD with proximal and distal biopsies"}], "answer": "C", "explanation": "Intermittent solid-food dysphagia points at a fixed narrowing, and a swallowed tablet of known diameter both demonstrates the narrowing and measures whether the lumen is tight enough to matter. Manometry is for a motor problem, and iron studies address a different level of the esophagus altogether.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C2", "pgroup": "ES-C"}, {"id": "2A", "group": 2, "stem": "Which of the following initial results is most likely to be present?", "options": [{"letter": "A", "text": "A thin web in the upper, anterior cervical esophagus"}, {"letter": "B", "text": "Concentric rings and linear furrows with white exudates"}, {"letter": "C", "text": "A \"bird's beak\" narrowing with a dilated esophagus and retained food"}, {"letter": "D", "text": "A thin ring at the gastroesophageal junction with a lumen of 11 mm and a hiatal hernia"}, {"letter": "E", "text": "A smooth, tapered, concentric distal narrowing 2.5 cm long with a lumen of 9 mm"}], "answer": "D", "explanation": "A shelf of mucosa at the squamocolumnar junction narrows the lumen without shortening or scarring the esophagus, so a large bite lodges and everything smaller passes. A tapered segment centimetres long is scar from acid injury and gives steadily progressive rather than episodic symptoms.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C2", "pgroup": "ES-C"}, {"id": "2B", "group": 2, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Esophageal web with Plummer-Vinson syndrome"}, {"letter": "B", "text": "Eosinophilic esophagitis"}, {"letter": "C", "text": "Peptic stricture"}, {"letter": "D", "text": "Schatzki ring"}, {"letter": "E", "text": "Esophageal carcinoma"}], "answer": "D", "explanation": "Episodic, non-progressive solid-food dysphagia in a middle-aged patient with weeks of normal swallowing in between is a ring rather than a stricture or a tumour. A web sits in the cervical esophagus with iron deficiency, and carcinoma progresses over weeks with weight loss.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C2", "pgroup": "ES-C"}, {"id": "2C", "group": 2, "stem": "She has a Schatzki ring. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "B", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "C", "text": "Oncologic staging with surgical resection"}, {"letter": "D", "text": "Endoscopic dilation with dietary modification"}, {"letter": "E", "text": "Oral iron replacement"}], "answer": "D", "explanation": "Disrupting the ring restores the lumen, and changing how she eats keeps the next large bite from lodging while the ring is still there. A proton pump inhibitor follows the dilation, since the pathogenesis is thought to be chronic acid injury.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C2", "pgroup": "ES-C"}, {"id": "3", "group": 3, "stem": "A 41-year-old woman comes to the primary care clinic with two years of burning behind the breastbone. It comes on within an hour of a meal and again when she lies down at night, and twice a week she wakes with a sour, bitter fluid at the back of her throat. She has a morning cough, her voice is hoarse by the end of the day, and she has a sensation of a lump in her throat. She has hypertension and takes amlodipine, which she began three years ago. Her body mass index is 33 kg/m². She has not lost weight, has never vomited blood, and swallows normally. Her temperature is 36.7°C (98.1°F), blood pressure is 128/80 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination is normal, with no epigastric tenderness, no pallor, and no cervical adenopathy.\n\nStudies:\n    Medication review — Amlodipine identified as an agent that lowers lower esophageal sphincter tone\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Barium swallow with a 13 mm barium tablet"}, {"letter": "B", "text": "EGD with proximal and distal biopsies"}, {"letter": "C", "text": "EGD with four-quadrant biopsies"}, {"letter": "D", "text": "An empiric proton pump inhibitor trial for 8 weeks"}, {"letter": "E", "text": "Barium swallow (esophagram)"}], "answer": "D", "explanation": "With typical symptoms and no alarm feature, the diagnosis is made clinically and the therapeutic trial is both the test and the treatment. Endoscopy is reserved for alarm features or for failure after eight weeks, and contrast radiography answers an anatomic question she has not raised.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D1", "pgroup": "ES-D"}, {"id": "3A", "group": 3, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Concentric rings and linear furrows with white exudates"}, {"letter": "B", "text": "Confluent linear erosions in the distal esophagus"}, {"letter": "C", "text": "Gastric folds above the diaphragmatic pinch with the junction below it"}, {"letter": "D", "text": "Salmon-colored mucosa extending 4 cm above the gastroesophageal junction"}, {"letter": "E", "text": "Complete relief of symptoms on the trial"}], "answer": "E", "explanation": "Blocking the final step of acid secretion removes the injurious refluxate, and symptoms that are driven by acid disappear with it. About two-thirds of these patients have a normal endoscopy, so the absence of visible mucosal damage is expected rather than reassuring against the diagnosis.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D1", "pgroup": "ES-D"}, {"id": "3B", "group": 3, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Barium swallow with a 13 mm tablet"}, {"letter": "B", "text": "Esophageal biopsy histology"}, {"letter": "C", "text": "Histology of four-quadrant biopsies"}, {"letter": "D", "text": "Ambulatory esophageal pH study"}, {"letter": "E", "text": "Upper endoscopy with biopsy"}], "answer": "D", "explanation": "Only ambulatory pH monitoring measures the thing itself — how long the distal esophagus is acidic and whether her symptoms fall during those periods. It is reserved for an unclear picture and is not needed when a typical presentation resolves on a trial, which is why it was not performed here.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D1", "pgroup": "ES-D"}, {"id": "3C", "group": 3, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peptic stricture"}, {"letter": "B", "text": "Paraesophageal hiatal hernia"}, {"letter": "C", "text": "Erosive reflux esophagitis"}, {"letter": "D", "text": "Gastroesophageal reflux disease"}, {"letter": "E", "text": "Barrett's esophagus"}], "answer": "D", "explanation": "Postprandial and recumbent burning with regurgitation, cough, and hoarseness in an obese patient on an agent that lowers sphincter tone is reflux disease, and the response to therapy settles it. A stricture would have given progressive solid-food dysphagia, and a paraesophageal hernia gives postprandial fullness with little heartburn.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D1", "pgroup": "ES-D"}, {"id": "4", "group": 4, "stem": "A 45-year-old woman presents to the emergency department with steady severe right upper quadrant pain that began about ten hours ago, roughly an hour after a fried meal, and has not let up. The pain radiates to her right scapula, and she has been vomiting and cannot eat. She has had two shorter attacks after fatty meals in the past year, both of which resolved within a few hours. She takes a combined oral contraceptive and has four children. Her temperature is 38.6°C (101.5°F), blood pressure is 128/78 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 98% on room air. She is ill-appearing and lies still on the stretcher. Palpation beneath the right costal margin during deep inspiration produces pain and a catch of her breath, and she guards the right upper quadrant. She is not jaundiced.\n\nStudies:\n    WBC — 15,600/mm³ with 84% neutrophils and a left shift\n    AST / ALT — 48 U/L / 52 U/L\n    Alkaline phosphatase — 96 U/L\n    Total bilirubin — 0.9 mg/dL\n    Lipase — 34 U/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HIDA scan"}, {"letter": "B", "text": "Right upper quadrant ultrasound"}, {"letter": "C", "text": "Abdominal CT"}, {"letter": "D", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "E", "text": "Blood cultures"}], "answer": "B", "explanation": "Ultrasound is the first study in the right upper quadrant every time — it is fast, needs no contrast, and shows both stones and wall inflammation. CT is unreliable here, because cholesterol stones are hypoattenuating and the rest are isodense to bile, and it detects only about half of these cases.", "objective": "", "section": "the acutely ill patient with a gallbladder complication", "pcase": "BI-B1", "pgroup": "BI-B"}, {"id": "4A", "group": 4, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Stones with a 2 mm wall, no fluid, and a negative sonographic Murphy's sign"}, {"letter": "B", "text": "Stones with a 5 mm wall, pericholecystic fluid, and a positive sonographic Murphy's sign"}, {"letter": "C", "text": "Small bowel obstruction with an ectopic gallstone and pneumobilia"}, {"letter": "D", "text": "A 6 mm wall with pericholecystic fluid and a positive sonographic Murphy's sign, with no stones"}, {"letter": "E", "text": "A common bile duct dilated to 12 mm with alkaline phosphatase out of proportion to the aminotransferases"}], "answer": "B", "explanation": "Total obstruction of the cystic duct by a stone inflames the wall, which thickens and weeps fluid into the pericholecystic space, and pressing directly on the inflamed organ arrests inspiration. That triad carries a positive predictive value of 90 to 95%, and a normal 4 mm duct with a normal bilirubin places the obstruction above the common duct.", "objective": "", "section": "the acutely ill patient with a gallbladder complication", "pcase": "BI-B1", "pgroup": "BI-B"}, {"id": "4B", "group": 4, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "HIDA scan"}, {"letter": "B", "text": "Abdominal CT"}, {"letter": "C", "text": "Blood cultures"}, {"letter": "D", "text": "Antimitochondrial antibody testing"}, {"letter": "E", "text": "Magnetic resonance cholangiopancreatography"}], "answer": "A", "explanation": "Cholescintigraphy tests cystic duct patency directly: tracer that fills the duct and the bowel but never enters the gallbladder proves the duct is obstructed, with a sensitivity of about 95%. It is the study for an inconclusive ultrasound, not a routine addition to a conclusive one.", "objective": "", "section": "the acutely ill patient with a gallbladder complication", "pcase": "BI-B1", "pgroup": "BI-B"}, {"id": "4C", "group": 4, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Biliary colic"}, {"letter": "B", "text": "Cholangitis"}, {"letter": "C", "text": "Gallstone ileus"}, {"letter": "D", "text": "Acute cholecystitis"}, {"letter": "E", "text": "Acalculous cholecystitis"}], "answer": "D", "explanation": "Pain that began after a fatty meal and has not resolved in ten hours, with fever and leukocytosis, has moved past colic into inflammation of the wall. Cholangitis brings jaundice with hypotension and confusion, and gallstone ileus obstructs the bowel rather than the cystic duct.", "objective": "", "section": "the acutely ill patient with a gallbladder complication", "pcase": "BI-B1", "pgroup": "BI-B"}, {"id": "5", "group": 5, "stem": "A 21-year-old man comes to the primary care clinic because his roommate noticed two days ago that his eyes had turned yellow, during a flu-like illness. He has had no pain, no dark urine, and no itching. He has had two similar brief episodes before, one after a religious fast and one during final examinations. He has eaten and drunk very little for three days with the viral illness, and he ran a half-marathon two weeks ago. He does not drink alcohol. A maternal uncle has had episodes of yellow eyes. His temperature is 37.2°C (99.0°F), blood pressure is 116/72 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has scleral icterus; there is no hepatomegaly, no splenomegaly, no right upper quadrant tenderness, and no excoriations.\n\nStudies:\n    AST / ALT — 22 U/L / 20 U/L\n    Alkaline phosphatase — 66 U/L\n    Albumin — 4.4 g/dL\n    Hemoglobin / hematocrit — 14.8 g/dL / 44%\n    Reticulocytes — 1.2%\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "B", "text": "Fractionated total bilirubin"}, {"letter": "C", "text": "Antimitochondrial antibody testing"}, {"letter": "D", "text": "Right upper quadrant ultrasound"}, {"letter": "E", "text": "Liver function tests with alkaline phosphatase and GGT"}], "answer": "B", "explanation": "Splitting the bilirubin into its conjugated and unconjugated fractions is the branch point of every jaundice workup, and it costs nothing. Imaging the ducts answers a question that only arises once the conjugated fraction is raised, and the transaminases and alkaline phosphatase here are already normal.", "objective": "", "section": "jaundice", "pcase": "BI-C3", "pgroup": "BI-C"}, {"id": "5A", "group": 5, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An alkaline phosphatase of 540 U/L with a normal bilirubin and an elevated IgM"}, {"letter": "B", "text": "An alkaline phosphatase of 612 U/L with a positive p-ANCA and a negative antimitochondrial antibody"}, {"letter": "C", "text": "A common bile duct dilated to 12 mm with an alkaline phosphatase of 468 U/L and a white count of 21,400/mm³"}, {"letter": "D", "text": "An indirect bilirubin of 2.5 mg/dL with a normal direct fraction"}, {"letter": "E", "text": "A common bile duct dilated to 9 mm with a total bilirubin of 5.2 mg/dL and an alkaline phosphatase of 396 U/L"}], "answer": "D", "explanation": "The defect is in conjugation, so bilirubin accumulates before it is joined to glucuronic acid and the direct fraction stays normal. Nothing obstructs and nothing is inflamed, which is why the alkaline phosphatase, transaminases, and albumin are untouched.", "objective": "", "section": "jaundice", "pcase": "BI-C3", "pgroup": "BI-C"}, {"id": "5B", "group": 5, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cholangitis"}, {"letter": "B", "text": "Choledocholithiasis"}, {"letter": "C", "text": "Primary sclerosing cholangitis"}, {"letter": "D", "text": "Gilbert's syndrome"}, {"letter": "E", "text": "Primary biliary cholangitis"}], "answer": "D", "explanation": "Brief, painless, recurrent jaundice brought on by fasting, dehydration, illness, and overexertion in a well young man with a family history is the benign conjugation defect. A stone in the duct hurts and raises the cholestatic enzymes, and cholangitis adds fever and hypotension.", "objective": "", "section": "jaundice", "pcase": "BI-C3", "pgroup": "BI-C"}, {"id": "5C", "group": 5, "stem": "He has Gilbert's syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Surveillance with ursodeoxycholic acid"}, {"letter": "B", "text": "Ursodeoxycholic acid 12 to 15 mg/kg daily"}, {"letter": "C", "text": "ERCP with sphincterotomy and stone extraction"}, {"letter": "D", "text": "Reassurance with no treatment"}, {"letter": "E", "text": "Intravenous antibiotics followed by urgent ERCP"}], "answer": "D", "explanation": "The condition is benign, the liver is structurally normal, and the jaundice is cosmetic — there is nothing to treat. It is the most common inherited disorder of bilirubin processing, present in roughly 5% of the population.", "objective": "", "section": "jaundice", "pcase": "BI-C3", "pgroup": "BI-C"}, {"id": "6", "group": 6, "stem": "A 71-year-old woman is referred from the primary care clinic for endoscopy after four months of epigastric pain that comes on with meals, with belching and fullness after eating, early satiety, and nausea. She has lost 6 kg without trying. She takes naproxen twice daily and low-dose aspirin, and she was recently on prednisone for a rheumatoid arthritis flare. She has never smoked, does not drink alcohol, and takes no anticoagulant. Her temperature is 36.7°C (98.1°F), blood pressure is 128/76 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. She has epigastric tenderness without rebound or guarding, no palpable mass, and no supraclavicular node; her stool is brown.\n\nStudies:\n    Hemoglobin / hematocrit — 10.4 g/dL / 31%\n    MCV — 76 fL\n    Ferritin — 8 ng/mL\n    Transferrin saturation — 7%\n    BUN / creatinine — 16 mg/dL / 0.9 mg/dL\n    Fecal occult blood test — Positive\n    H. pylori stool antigen — Negative\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}, {"letter": "B", "text": "Repeat H. pylori stool antigen testing"}, {"letter": "C", "text": "EGD with biopsy"}, {"letter": "D", "text": "Urea breath test"}, {"letter": "E", "text": "Secretin stimulation test"}], "answer": "C", "explanation": "Endoscopy is the only study that both finds the lesion and takes tissue from it, and at 71 with weight loss, anemia, and a positive occult blood test she has every reason to go up front. A second organism test repeats an answer she already has, and gastrin studies are for refractory multiple distal duodenal ulcers with diarrhea.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A4", "pgroup": "GA-A"}, {"id": "6A", "group": 6, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Inflamed, eroded gastric mucosa with no ulcer crater"}, {"letter": "B", "text": "A hypokalemic, hypochloremic metabolic alkalosis"}, {"letter": "C", "text": "No organic lesion, with biopsies negative for H. pylori"}, {"letter": "D", "text": "A paradoxical gastrin rise of more than 200 pg/mL after intravenous secretin"}, {"letter": "E", "text": "An antral ulcer with a smooth base and radiating folds, with benign biopsies"}], "answer": "E", "explanation": "Prostaglandin blockade strips the mucosa of its bicarbonate and mucus defence, and a defect that erodes past the muscularis mucosae is a crater rather than an erosion — which is what bleeds enough to make her iron deficient. Radiating folds converging on a smooth base is the benign morphology, but appearance alone never settles a gastric ulcer.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A4", "pgroup": "GA-A"}, {"id": "6B", "group": 6, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "H. pylori gastritis"}, {"letter": "B", "text": "Functional dyspepsia"}, {"letter": "C", "text": "Peptic ulcer disease"}, {"letter": "D", "text": "Zollinger-Ellison syndrome"}, {"letter": "E", "text": "NSAID-induced gastritis"}], "answer": "C", "explanation": "Pain that arrives with the meal, early satiety, and weight loss is the gastric ulcer pattern, and iron deficiency anemia with a positive occult blood test means a lesion that bleeds. Functional dyspepsia has no lesion and no anemia, and gastritis produces erosions rather than a crater.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A4", "pgroup": "GA-A"}, {"id": "6C", "group": 6, "stem": "She has an NSAID-induced gastric ulcer. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "High-dose proton pump inhibitor with surgical resection of the tumor"}, {"letter": "B", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}, {"letter": "C", "text": "Quadruple therapy for 14 days with a twice-daily proton pump inhibitor"}, {"letter": "D", "text": "Diet and lifestyle change with a proton pump inhibitor"}, {"letter": "E", "text": "Withdrawal of the offending agent with a proton pump inhibitor for 8 weeks"}], "answer": "E", "explanation": "The drug that caused the ulcer has to stop before acid suppression can heal it, and smoking and alcohol come out at the same time. Eradication therapy treats an organism she does not have, on stool antigen and on biopsy.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A4", "pgroup": "GA-A"}, {"id": "7", "group": 7, "stem": "A 47-year-old man is referred to the gastroenterology clinic with two months of dull upper abdominal pain that came on insidiously, with nausea and occasional vomiting, a poor appetite, and a feeling of fullness after a few bites. He has lost 5 kg. He had a partial gastrectomy for a bleeding ulcer six years ago and his stomach has ground food poorly ever since, and he eats large amounts of raw vegetable and fruit fiber. He has no psychiatric history and does not pull his hair. His temperature is 36.8°C (98.2°F), blood pressure is 122/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 98% on room air. His abdomen is soft with a vague epigastric fullness and no discrete mass; he has halitosis, no distension, and no succussion splash.\n\nStudies:\n    Hemoglobin / hematocrit — 13.0 g/dL / 39%\n    MCV — 88 fL\n    WBC — 6,400/mm³\n    Platelets — 232,000/mm³\n    Albumin — 3.6 g/dL\n    Comprehensive metabolic panel — Otherwise normal\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}, {"letter": "B", "text": "Urea breath test"}, {"letter": "C", "text": "Gastric emptying scintigraphy"}, {"letter": "D", "text": "Upper endoscopy"}, {"letter": "E", "text": "Secretin stimulation test"}], "answer": "D", "explanation": "Endoscopy looks directly at the stomach and separates an obstructing lesion from a stomach that empties poorly, which is the branch point in a patient with early satiety and weight loss. A functional emptying study measures transit but cannot tell you what is sitting in the antrum.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C2", "pgroup": "GA-C"}, {"id": "7A", "group": 7, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A dark green-brown ball of matted material in the antrum"}, {"letter": "B", "text": "An antral ulcer with iron deficiency anemia"}, {"letter": "C", "text": "A narrowed, scarred pylorus with retained gastric contents"}, {"letter": "D", "text": "Retained food with a patent pylorus and no obstructing lesion"}, {"letter": "E", "text": "A normal endoscopy with a hypokalemic alkalosis"}], "answer": "A", "explanation": "A stomach that can no longer grind after a partial gastrectomy leaves indigestible plant fiber to mat together into a single mass, which fills the antrum and produces fullness after a few bites. The mucosa beneath is intact, which is what separates this from an ulcerating or scarring lesion.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C2", "pgroup": "GA-C"}, {"id": "7B", "group": 7, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gastroparesis"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "Cyclical vomiting syndrome"}, {"letter": "D", "text": "Peptic ulcer disease"}, {"letter": "E", "text": "Gastric bezoar"}], "answer": "E", "explanation": "Impaired grinding after gastric surgery plus a high load of raw plant fiber is how a mass of indigestible material forms, and it obstructs the lumen with material rather than with scar. Gastroparesis leaves an empty stomach that empties slowly, and cyclical vomiting comes in discrete bouts with normal health between.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C2", "pgroup": "GA-C"}, {"id": "7C", "group": 7, "stem": "He has a gastric phytobezoar. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Tight glycemic control with small low-fat, low-fiber meals"}, {"letter": "B", "text": "Diet and lifestyle change with a proton pump inhibitor"}, {"letter": "C", "text": "Intravenous fluid repletion with ondansetron"}, {"letter": "D", "text": "Chemical dissolution with Coca-Cola lavage"}, {"letter": "E", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}], "answer": "D", "explanation": "Dissolution is noninvasive and inexpensive, and it is tried first: the low pH softens the mass, the high sodium bicarbonate content is mucolytic, and the carbon dioxide bubbles work their way into it. Cellulase, papain, and acetylcysteine act on the same principle.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C2", "pgroup": "GA-C"}, {"id": "8", "group": 8, "stem": "A 61-year-old woman presents to the emergency department with watery diarrhea and cramping that began about twelve hours after a meal at a catered banquet. She has vomited very little and has had no fever. Several other guests who ate at the banquet have the same illness. She takes atorvastatin. Her temperature is 37.2°C (99.0°F), blood pressure is 128/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. She is afebrile, with mild diffuse abdominal tenderness and no rebound; her mucous membranes are moist and her skin turgor is normal.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool multiplex PCR panel"}, {"letter": "B", "text": "Stool ova and parasite exam on three separate days"}, {"letter": "C", "text": "Clinical diagnosis with no stool study"}, {"letter": "D", "text": "Stool culture for enteric pathogens"}, {"letter": "E", "text": "Stool Giardia antigen immunoassay"}], "answer": "C", "explanation": "Mild, afebrile, self-limited illness in several people who shared one meal is diagnosed by the interval between the meal and the symptoms, and no stool study changes what is done. Testing is reserved for illness that is severe, febrile, bloody, or prolonged.", "objective": "", "section": "vomiting or diarrhea within hours of a shared meal (preformed and in-gut toxin)", "pcase": "DI-B3", "pgroup": "DI-B"}, {"id": "8A", "group": 8, "stem": "Which of the following additional features is most likely to be elicited on further history?", "options": [{"letter": "A", "text": "The meal was eggs or poultry, and she has had fever with mucoid stool"}, {"letter": "B", "text": "The meal was mayonnaise, egg salad, or a cream pastry"}, {"letter": "C", "text": "The meal was rice that had been reheated"}, {"letter": "D", "text": "The meal was meat or gravy that had been poorly reheated"}, {"letter": "E", "text": "The meal was raw shellfish eaten one to three days earlier"}], "answer": "D", "explanation": "Spores survive normal cooking and germinate in food that is cooled and held badly, and the illness comes from enterotoxin released in the gut rather than from toxin already in the food — which is why the delay runs 6 to 24 hours instead of 1 to 8. Diarrhea rather than vomiting is the dominant symptom for the same reason.", "objective": "", "section": "vomiting or diarrhea within hours of a shared meal (preformed and in-gut toxin)", "pcase": "DI-B3", "pgroup": "DI-B"}, {"id": "8B", "group": 8, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Clostridium perfringens food poisoning"}, {"letter": "B", "text": "Norovirus gastroenteritis"}, {"letter": "C", "text": "Salmonella gastroenteritis"}, {"letter": "D", "text": "Bacillus cereus food poisoning"}, {"letter": "E", "text": "Staphylococcus aureus food poisoning"}], "answer": "A", "explanation": "A twelve-hour interval with diarrhea leading and almost no vomiting, in an afebrile patient at a shared meal, is the in-gut toxin rather than a preformed one. Staphylococcal and Bacillus illness begin within hours and are dominated by vomiting, and Salmonella brings fever with blood-tinged stool.", "objective": "", "section": "vomiting or diarrhea within hours of a shared meal (preformed and in-gut toxin)", "pcase": "DI-B3", "pgroup": "DI-B"}, {"id": "8C", "group": 8, "stem": "She has Clostridium perfringens food poisoning. Which of the following is the most appropriate advice for the caterer?", "options": [{"letter": "A", "text": "Store cooked meat and gravy properly only when it cannot be reheated thoroughly"}, {"letter": "B", "text": "Store cooked meat and gravy properly only when it will be held more than a day"}, {"letter": "C", "text": "Store cooked meat and gravy properly in every case, since cooking does not kill the spores"}, {"letter": "D", "text": "Store cooked meat and gravy properly only after a guest has become ill"}, {"letter": "E", "text": "Store cooked meat and gravy properly only when it will be served to a large group"}], "answer": "C", "explanation": "The spores survive ordinary cooking temperatures, so heat is not the control point — how the food is held between cooking and serving is. Relying on a second heating to make cooked meat safe is the error that produced this outbreak.", "objective": "", "section": "vomiting or diarrhea within hours of a shared meal (preformed and in-gut toxin)", "pcase": "DI-B3", "pgroup": "DI-B"}, {"id": "9", "group": 9, "stem": "A 71-year-old woman presents to the emergency department with four days of diarrhea, now eight stools a day with mucus and a blood tinge. She has fever and nausea and has vomited twice. Three days before the diarrhea began she ate a homemade custard made with raw eggs at a family gathering, and two relatives who ate it have the same illness. She had a bioprosthetic aortic valve placed four years ago and takes amlodipine. Her temperature is 38.6°C (101.5°F), blood pressure is 108/66 mm Hg, pulse is 110/min, respirations are 18/min, and oxygen saturation is 97% on room air. She is febrile with dry mucous membranes and a fall in blood pressure on standing, and her abdomen is diffusely tender with cramping and no rebound and no right lower quadrant localization.\n\nStudies:\n    WBC — 15,600/mm³ with a left shift\n    Hemoglobin / hematocrit — 12.9 g/dL / 39%\n    Platelets — 254,000/mm³\n    Sodium — 132 mEq/L\n    Potassium — 3.1 mEq/L\n    Bicarbonate — 20 mEq/L\n    BUN / creatinine — 32 mg/dL / 1.4 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool PCR with a stool and serum antigen assay"}, {"letter": "B", "text": "Stool Giardia antigen test"}, {"letter": "C", "text": "Stool ova and parasite exam on three separate days"}, {"letter": "D", "text": "Fecal calprotectin with CRP and IgA anti-tissue transglutaminase"}, {"letter": "E", "text": "Stool multiplex PCR"}], "answer": "E", "explanation": "Fever with blood or mucus in the stool moves this out of the self-limited category and into one where the organism decides whether antibiotics are given at all. A multiplex panel names the invasive bacterial pathogens in hours; protozoal and serologic testing answers a question raised by weeks of illness, not four days.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C1", "pgroup": "DI-C"}, {"id": "9A", "group": 9, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Bloody stool with minimal fever and a panel positive for Shiga-toxin-producing E. coli"}, {"letter": "B", "text": "Right lower quadrant tenderness and a panel positive for Yersinia"}, {"letter": "C", "text": "Severe periumbilical pain with ten or more stools and a panel positive for Campylobacter"}, {"letter": "D", "text": "Blood-tinged mucoid stool with a panel positive for Salmonella"}, {"letter": "E", "text": "Bloody mucoid stool with tenesmus and a panel positive for Shigella"}], "answer": "D", "explanation": "The organism reaches the gut in food contaminated by fecal matter — eggs, poultry, and milk products above all — and invades the mucosa, which is why the stool carries mucus and a blood tinge and why she has a fever and a left shift. Onset 8 to 72 hours after the exposure fits the three-day interval here.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C1", "pgroup": "DI-C"}, {"id": "9B", "group": 9, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "EGD with duodenal biopsy"}, {"letter": "B", "text": "Serum antigen assay for E. histolytica"}, {"letter": "C", "text": "Stool microscopic exam for cysts and trophozoites"}, {"letter": "D", "text": "Small bowel aspirate culture"}, {"letter": "E", "text": "Stool culture"}], "answer": "E", "explanation": "Culture isolates the organism itself and gives the susceptibilities that matter once a decision to treat has been made. A single stool specimen is enough for a bacterial pathogen, unlike the parasitic studies, which need repeated collections.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C1", "pgroup": "DI-C"}, {"id": "9C", "group": 9, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Salmonella gastroenteritis"}, {"letter": "C", "text": "Campylobacter jejuni enteritis"}, {"letter": "D", "text": "Enterohemorrhagic E. coli infection"}, {"letter": "E", "text": "Shigellosis"}], "answer": "B", "explanation": "A raw-egg vehicle, a three-day interval, and a cluster among the people who shared the dish point at the egg-borne invasive pathogen. Shigella brings tenesmus and spreads fecal-orally in daycare, Campylobacter brings severe periumbilical pain, and Shiga-toxin-producing E. coli brings bloody stool with little or no fever.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C1", "pgroup": "DI-C"}, {"id": "10", "group": 10, "stem": "A 47-year-old man comes to the primary care clinic with two days of watery diarrhea, cramping, nausea, and vomiting; one stool was streaked with blood. He ate raw oysters at a coastal restaurant two days before the symptoms began, and his wife, who ate the same oysters, is also ill. He works as a boat mechanic, has not travelled abroad, and has taken no antibiotics. His temperature is 38.1°C (100.6°F), blood pressure is 126/78 mm Hg, pulse is 94/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has a low-grade fever and diffuse abdominal tenderness without rebound; his mucous membranes are moist and his skin turgor is normal.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Empiric azithromycin with no stool study"}, {"letter": "B", "text": "Stool ova and parasite exam on three separate days"}, {"letter": "C", "text": "Fecal calprotectin with CRP and IgA anti-tissue transglutaminase"}, {"letter": "D", "text": "Stool multiplex PCR"}, {"letter": "E", "text": "Stool Giardia antigen test"}], "answer": "D", "explanation": "Blood in the stool with fever after a discrete food exposure calls for the panel that names the invasive bacterial pathogens, because which organism it is decides whether he is treated and whether anything must be reported. Empiric therapy without testing belongs to watery, non-bloody traveller's diarrhea.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D3", "pgroup": "DI-D"}, {"id": "10A", "group": 10, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Bloody mucoid stool with tenesmus and high fever, with a panel positive for Shigella"}, {"letter": "B", "text": "Watery stool turning bloody with fecal leukocytes present, with a panel positive for enteroinvasive E. coli"}, {"letter": "C", "text": "Bloody stool with minimal or no fever, with a panel positive for Shiga-toxin-producing E. coli"}, {"letter": "D", "text": "Watery, sometimes bloody diarrhea 1 to 3 days after raw shellfish, with a panel positive for V. parahaemolyticus"}, {"letter": "E", "text": "Severe periumbilical pain with ten or more stools, with a panel positive for Campylobacter"}], "answer": "D", "explanation": "The organism lives in warm coastal water and concentrates in filter-feeding shellfish, so raw oysters are the vehicle and the incubation runs 1 to 3 days. The illness is largely watery with only a streak of blood, which is why the fever stays low-grade.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D3", "pgroup": "DI-D"}, {"id": "10B", "group": 10, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Blood cultures"}, {"letter": "B", "text": "Stool culture"}, {"letter": "C", "text": "Stool antigen assay for Giardia"}, {"letter": "D", "text": "Serum antigen assay for E. histolytica"}, {"letter": "E", "text": "A specially ordered O157:H7 culture"}], "answer": "B", "explanation": "Isolating the organism on culture confirms what the molecular panel detected and gives an isolate for public health follow-up of a shellfish-associated cluster. A specially ordered O157:H7 culture is added only when Shiga-toxin-producing E. coli is the concern.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D3", "pgroup": "DI-D"}, {"id": "10C", "group": 10, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Enterohemorrhagic E. coli (O157:H7) infection"}, {"letter": "B", "text": "Shigellosis"}, {"letter": "C", "text": "Vibrio parahaemolyticus infection"}, {"letter": "D", "text": "Campylobacter jejuni enteritis"}, {"letter": "E", "text": "Enteroinvasive E. coli infection"}], "answer": "C", "explanation": "Raw oysters at the coast, a two-day interval, and a second case in the person who shared the meal is the shellfish organism. Shiga-toxin-producing E. coli gives bloody stool with little or no fever, and enteroinvasive disease follows travel with fecal leukocytes in the stool.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D3", "pgroup": "DI-D"}, {"id": "11", "group": 11, "stem": "A 36-year-old man presents to the emergency department with three weeks of watery diarrhea that has become bloody, with cramping abdominal pain, tenesmus, and painful defecation; he has had fever for the past week. He returned six weeks ago from two months in India, where he drank untreated water and ate from street stalls. He has taken no antibiotics and was healthy before this. His temperature is 38.7°C (101.7°F), blood pressure is 118/72 mm Hg, pulse is 100/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is febrile with diffuse abdominal tenderness, right upper quadrant tenderness, and hepatomegaly with the liver edge 4 cm below the costal margin. There is gross blood on rectal examination.\n\nStudies:\n    WBC — 15,300/mm³ with a left shift\n    Hemoglobin / hematocrit — 13.2 g/dL / 40%\n    Platelets — 356,000/mm³\n    Alkaline phosphatase — 218 U/L\n    AST / ALT — 46 U/L / 52 U/L\n    Total bilirubin — 1.0 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool PCR with a stool and serum antigen assay"}, {"letter": "B", "text": "Stool antigen test or PCR for Cryptosporidium"}, {"letter": "C", "text": "IgA anti-tissue transglutaminase with a total IgA"}, {"letter": "D", "text": "Stool ova and parasite exam on multiple collections"}, {"letter": "E", "text": "Stool Giardia antigen test"}], "answer": "A", "explanation": "Weeks of bloody diarrhea after travel to an endemic region, with tender hepatomegaly, calls for the organism-specific assays that detect both intestinal and tissue-invasive disease. A serum antigen assay is the one that speaks to spread beyond the bowel, which the liver findings raise.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G4", "pgroup": "DI-G"}, {"id": "11A", "group": 11, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Bloody mucoid stool with tenesmus and high fever, with a panel positive for Shigella"}, {"letter": "B", "text": "High-volume watery non-bloody diarrhea with a CD4 count of 58/µL"}, {"letter": "C", "text": "Greasy, foul-smelling, non-bloody stool with a normal white count"}, {"letter": "D", "text": "Trophozoites and cysts on a repeat collection after a negative first exam"}, {"letter": "E", "text": "Bloody stool with tenesmus and tender hepatomegaly, with assays positive for E. histolytica"}], "answer": "E", "explanation": "This protozoan invades the colonic mucosa, which is what produces blood, tenesmus, and painful defecation rather than the greasy non-bloody stool of the malabsorptive protozoa. Spread through the portal circulation gives the tender liver and the mild cholestatic pattern.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G4", "pgroup": "DI-G"}, {"id": "11B", "group": 11, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Celiac disease"}, {"letter": "B", "text": "Amebiasis"}, {"letter": "C", "text": "Giardiasis"}, {"letter": "D", "text": "Shigellosis"}, {"letter": "E", "text": "Cryptosporidiosis"}], "answer": "B", "explanation": "Weeks rather than days of illness, invasive bloody colitis, and hepatic involvement after untreated water in an endemic region is the invasive protozoan. Giardia produces greasy non-bloody stool with a normal white count, and Cryptosporidium high-volume watery stool in advanced HIV.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G4", "pgroup": "DI-G"}, {"id": "11C", "group": 11, "stem": "He has intestinal amebiasis. Which of the following is the most appropriate initial treatment?", "options": [{"letter": "A", "text": "A lifelong gluten-free diet"}, {"letter": "B", "text": "Supportive care with oral rehydration and antiretroviral therapy"}, {"letter": "C", "text": "Metronidazole or tinidazole"}, {"letter": "D", "text": "Ciprofloxacin or azithromycin with supportive care"}, {"letter": "E", "text": "A low FODMAP diet with alcohol and caffeine avoidance"}], "answer": "C", "explanation": "Every case is treated, symptomatic or not, because of the risk of invasive disease, and a nitroimidazole is the agent that reaches the organisms in the tissue. Ninety percent of infections are asymptomatic, which is why treatment is not reserved for the ones that declare themselves.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G4", "pgroup": "DI-G"}, {"id": "12", "group": 12, "stem": "A 15-year-old boy presents to the primary care clinic with about a year of bloating, cramping, flatulence, and watery diarrhea that begins half an hour to two hours after he drinks milk or eats ice cream. Larger amounts make it worse and a small piece of aged cheddar does nothing at all. There is no blood in the stool, no fever, and no weight loss, and his father avoids milk for the same reason. He takes no medications. His temperature is 36.8°C (98.2°F), blood pressure is 114/70 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. His examination is normal — the abdomen is soft and non-tender with no distention at rest — and he is growing along his prior percentiles, with no pallor and no rash.\n\nStudies:\n    Two-week lactose-free diet trial — Symptoms resolve completely, and return on rechallenge\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fecal calprotectin with CRP and IgA anti-tissue transglutaminase"}, {"letter": "B", "text": "Small bowel aspirate culture"}, {"letter": "C", "text": "Hydrogen breath test"}, {"letter": "D", "text": "EGD with duodenal biopsy"}, {"letter": "E", "text": "Stool microscopic exam for cysts and trophozoites"}], "answer": "C", "explanation": "The dietary trial has already answered the clinical question, and the breath test is what puts an objective number on it. Endoscopy and serology look for a mucosal disease that his normal growth and absent deficiencies argue against.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I1", "pgroup": "DI-I"}, {"id": "12A", "group": 12, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A rise in breath hydrogen after a lactose load"}, {"letter": "B", "text": "Rome IV criteria met with no alarm feature"}, {"letter": "C", "text": "Bacterial overgrowth on aspirate culture"}, {"letter": "D", "text": "Cysts and trophozoites of Giardia identified"}, {"letter": "E", "text": "Villous atrophy, crypt hyperplasia, and intraepithelial lymphocytosis"}], "answer": "A", "explanation": "Unsplit sugar reaching the colon is fermented by resident bacteria, and the hydrogen they produce is absorbed and exhaled — which is what the test measures. A rise above 20 ppm is positive, 10 to 20 ppm indeterminate, and 10 ppm or less normal.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I1", "pgroup": "DI-I"}, {"id": "12B", "group": 12, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Irritable bowel syndrome"}, {"letter": "B", "text": "Celiac disease"}, {"letter": "C", "text": "Lactose intolerance"}, {"letter": "D", "text": "Short bowel syndrome"}, {"letter": "E", "text": "Small intestinal bacterial overgrowth"}], "answer": "C", "explanation": "Symptoms tied to the dose of one sugar, arriving 30 minutes to 2 hours after it, and abolished by removing that sugar alone is an enzyme problem rather than a mucosal or bacterial one. Aged cheese carries little lactose, which is why it causes nothing.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I1", "pgroup": "DI-I"}, {"id": "12C", "group": 12, "stem": "He has lactose intolerance. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "B", "text": "Treating the underlying driver with rifaximin"}, {"letter": "C", "text": "Complete elimination of dairy from the diet"}, {"letter": "D", "text": "A high-complex-carbohydrate diet with hydration and antidiarrheals"}, {"letter": "E", "text": "Limiting lactose to his own threshold with lactase replacement"}], "answer": "E", "explanation": "Severity depends on both the degree of deficiency and the amount ingested, so the treatment is a threshold rather than a prohibition, with the enzyme supplied for the meals where he wants more. Aged cheese and unpasteurized yogurt are better tolerated and need not be given up.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I1", "pgroup": "DI-I"}, {"id": "13", "group": 13, "stem": "A 55-year-old woman presents to the emergency department with a third episode in four years of crampy abdominal pain and bloating, this time with vomiting and no flatus since yesterday. She had two cesarean deliveries in her thirties and an appendectomy at 16, and a pelvic infection treated in hospital fifteen years ago. She has had no radiation and has no known malignancy. Her temperature is 37.1°C (98.8°F), blood pressure is 130/78 mm Hg, pulse is 94/min, respirations are 18/min, and oxygen saturation is 98% on room air. Her abdomen is distended with two well-healed surgical scars and is diffusely but mildly tender, with no palpable mass, no groin bulge, and no guarding or rebound.\n\nStudies:\n    CT abdomen and pelvis — Transition point in the mid-ileum with no discrete mass, no tumor, and no hernia sac\n    WBC — 8,900/mm³\n    Hemoglobin / hematocrit — 12.9 g/dL / 39%\n    Platelets — 248,000/mm³\n    Sodium / potassium — 138 mEq/L / 3.5 mEq/L\n    BUN / creatinine — 18 mg/dL / 0.8 mg/dL\n    Lactate — 1.2 mmol/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Diagnostic laparoscopy"}, {"letter": "B", "text": "CT of the abdomen and pelvis with Valsalva"}, {"letter": "C", "text": "Colonoscopy"}, {"letter": "D", "text": "Upright and supine abdominal radiographs"}, {"letter": "E", "text": "Air or water-soluble contrast enema"}], "answer": "A", "explanation": "Imaging here shows the consequence but not the culprit — the cross-sectional study located a transition point and excluded the alternatives without demonstrating anything at that point. Only direct visualization of the peritoneal cavity shows the structure responsible.", "objective": "", "section": "the named structural culprit behind an obstruction", "pcase": "CO-B1", "pgroup": "CO-B"}, {"id": "13A", "group": 13, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Sac contents lateral to the inferior epigastric vessels with proximal dilation"}, {"letter": "B", "text": "Irregular scar bands tethering loops of bowel"}, {"letter": "C", "text": "A telescoped segment reduced under fluoroscopy"}, {"letter": "D", "text": "An obstructing circumferential sigmoid mass"}, {"letter": "E", "text": "A whirl pattern with bird-beak tapering"}], "answer": "B", "explanation": "Peritoneal injury from surgery and from infection heals with fibrous bands, and a loop caught over one kinks and obstructs. The bands are what the imaging cannot see, which is why the diagnosis otherwise rests on the history plus the absence of any other cause.", "objective": "", "section": "the named structural culprit behind an obstruction", "pcase": "CO-B1", "pgroup": "CO-B"}, {"id": "13B", "group": 13, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Incarcerated abdominal hernia"}, {"letter": "B", "text": "Adhesions"}, {"letter": "C", "text": "Intussusception"}, {"letter": "D", "text": "Obstructing colorectal mass"}, {"letter": "E", "text": "Sigmoid volvulus"}], "answer": "B", "explanation": "Two abdominal operations and a hospitalized pelvic infection, with recurrent obstruction and a transition point but no mass, tumor, or hernia sac, is the commonest cause of small bowel obstruction — it accounts for up to 70% of all obstructions. Each prior episode raises the odds of the next, which is why she is here for a third time.", "objective": "", "section": "the named structural culprit behind an obstruction", "pcase": "CO-B1", "pgroup": "CO-B"}, {"id": "13C", "group": 13, "stem": "She has adhesive small bowel obstruction. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Non-operative enema reduction with surgery on standby"}, {"letter": "B", "text": "Nasogastric decompression with fluid resuscitation"}, {"letter": "C", "text": "Immediate laparoscopic lysis of adhesions"}, {"letter": "D", "text": "Urgent surgical repair with intravenous fluids and analgesia"}, {"letter": "E", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}], "answer": "B", "explanation": "Most of these obstructions resolve with decompression and fluids, and she is soft, afebrile, with a normal white count and a lactate of 1.2 mmol/L — nothing suggests compromised bowel. Operating now would cut the bands and lay down new ones in their place.", "objective": "", "section": "the named structural culprit behind an obstruction", "pcase": "CO-B1", "pgroup": "CO-B"}, {"id": "14", "group": 14, "stem": "A 16-year-old boy presents to the emergency department with 18 hours of abdominal pain that began around his navel and has settled into the right lower quadrant. He felt nauseated and vomited twice after the pain started, has eaten nothing since yesterday, and developed a low-grade fever this afternoon. He has had no previous abdominal surgery and no similar episodes. His temperature is 37.9°C (100.2°F), blood pressure is 118/70 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 99% on room air. He has tenderness at McBurney's point with voluntary guarding, a positive Rovsing's sign, and pain on right hip extension; the abdomen is not rigid, there is no rebound over the left side, and bowel sounds are present.\n\nStudies:\n    WBC — 14,200/mm³ with 84% neutrophils\n    Hemoglobin / hematocrit — 14.0 g/dL / 42%\n    Platelets — 250,000/mm³\n    CRP — 42 mg/L\n    Alvarado score — 9\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Colonoscopy with biopsy"}, {"letter": "B", "text": "Tagged-RBC scan followed by angiography"}, {"letter": "C", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "D", "text": "Upright and supine abdominal radiographs"}, {"letter": "E", "text": "Interval colonoscopy in 6 to 8 weeks"}], "answer": "C", "explanation": "Cross-sectional imaging with contrast is the study that visualizes the structure itself and the tissue around it, and no laboratory value can take its place — a white count above 10,000 roughly doubles the odds and that is all it does. Endoscopic studies answer questions raised by chronic bleeding or a change in bowel habit.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E1", "pgroup": "CO-E"}, {"id": "14A", "group": 14, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Localized sigmoid wall thickening with pericolonic fat stranding and diverticula"}, {"letter": "B", "text": "A U-shaped dilated sigmoid loop with a coffee bean sign and absent rectal gas"}, {"letter": "C", "text": "Segmental wall thickening with thumbprinting at the splenic flexure"}, {"letter": "D", "text": "An appendiceal outer diameter of 11 mm with a non-filling lumen and fat stranding"}, {"letter": "E", "text": "Outpouchings through the muscularis propria, sigmoid predominant, with no inflammation"}], "answer": "D", "explanation": "Obstruction of a blind-ended tube raises the pressure inside it, so the lumen will not fill, the wall thickens and enhances, and the inflammation spreads into the surrounding fat. Pain that started periumbilically and migrated is the visceral-to-parietal transition as that inflammation reaches the peritoneum.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E1", "pgroup": "CO-E"}, {"id": "14B", "group": 14, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "Diverticulitis"}, {"letter": "C", "text": "Diverticular disease"}, {"letter": "D", "text": "Ischemic colitis"}, {"letter": "E", "text": "Appendicitis"}], "answer": "E", "explanation": "Pain before vomiting, migration to the right lower quadrant, anorexia, and a low-grade fever within 36 hours in a teenager is the classic sequence; the reverse order suggests gastroenteritis or obstruction. An Alvarado score of 8 to 10 carries a 93% probability.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E1", "pgroup": "CO-E"}, {"id": "14C", "group": 14, "stem": "He has acute appendicitis with an appendicolith. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "B", "text": "Bowel rest, intravenous fluids, and ciprofloxacin plus metronidazole"}, {"letter": "C", "text": "Clear liquids with selective ciprofloxacin plus metronidazole"}, {"letter": "D", "text": "High-fiber diet with weight loss, exercise, and tobacco cessation"}, {"letter": "E", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}], "answer": "A", "explanation": "Removal is the standard of care, and the laparoscopic approach gives a shorter stay, faster recovery, and fewer narcotics. An appendicolith is an explicit exception to the antibiotics-alone route and predicts that it will fail, so he is not a candidate for it.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E1", "pgroup": "CO-E"}, {"id": "15", "group": 15, "stem": "A 64-year-old man presents to the emergency department with two days of left lower quadrant pain that came on suddenly and has progressively worsened, with a low-grade fever, constipation, and nausea; for the past day he has also had urinary frequency. He has had two prior episodes of the same pain, the last three years ago, and eats a low-fiber diet. He is not immunosuppressed, is tolerating oral intake, and lives independently. His temperature is 38.1°C (100.6°F), blood pressure is 136/82 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has left lower quadrant tenderness with mild voluntary guarding and bloating with mild distention; there is no rebound, no rigidity, and no palpable mass, and bowel sounds are present.\n\nStudies:\n    WBC — 13,600/mm³ with 80% neutrophils\n    Hemoglobin / hematocrit — 14.2 g/dL / 43%\n    Platelets — 288,000/mm³\n    CRP — 96 mg/L\n    ESR — 38 mm/h\n    Sodium / potassium — 139 mEq/L / 4.1 mEq/L\n    BUN / creatinine — 20 mg/dL / 1.0 mg/dL\n    Urinalysis — 12 WBC/hpf with no bacteria\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Tagged-RBC scan followed by angiography"}, {"letter": "B", "text": "CT of the abdomen and pelvis with contrast"}, {"letter": "C", "text": "Colonoscopy with biopsy"}, {"letter": "D", "text": "Graded-compression ultrasound of the abdomen"}, {"letter": "E", "text": "Upright and supine abdominal radiographs"}], "answer": "B", "explanation": "Cross-sectional imaging with contrast is the preferred initial study because it grades severity as well as making the diagnosis — abscess, free air, and fistula are what change the management. Endoscopy is contraindicated during an acute attack, when insufflating an inflamed segment risks perforating it.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E3", "pgroup": "CO-E"}, {"id": "15A", "group": 15, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Segmental wall thickening with thumbprinting at the splenic flexure"}, {"letter": "B", "text": "An appendiceal outer diameter of 11 mm with a non-filling lumen and fat stranding"}, {"letter": "C", "text": "Localized sigmoid wall thickening with pericolonic fat stranding and diverticula"}, {"letter": "D", "text": "A U-shaped dilated sigmoid loop with a coffee bean sign and absent rectal gas"}, {"letter": "E", "text": "Outpouchings through the muscularis propria, sigmoid predominant, with no inflammation"}], "answer": "C", "explanation": "A micro-perforation at the neck of one pouch inflames the wall and the fat around it, which stays localized when the perforation seals — hence stranding without abscess, free air, or fistula. Quiet pouches with no surrounding inflammation are the asymptomatic state, not an attack.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E3", "pgroup": "CO-E"}, {"id": "15B", "group": 15, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "Appendicitis"}, {"letter": "C", "text": "Ischemic colitis"}, {"letter": "D", "text": "Diverticular disease"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "E", "explanation": "Left lower quadrant pain with fever, leukocytosis, and a raised CRP in an older adult with prior identical episodes is an inflamed sigmoid. The sterile pyuria is the inflamed loop irritating the bladder, which happens in 10 to 15% of cases, and it should not be read as a urinary infection.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E3", "pgroup": "CO-E"}, {"id": "15C", "group": 15, "stem": "He has uncomplicated diverticulitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Bowel rest with intravenous fluids and ciprofloxacin plus metronidazole"}, {"letter": "B", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "C", "text": "Clear liquids with ciprofloxacin plus metronidazole"}, {"letter": "D", "text": "Clear liquids with outpatient follow-up and no antibiotics"}, {"letter": "E", "text": "Intravenous piperacillin-tazobactam with admission"}], "answer": "D", "explanation": "Antibiotics are given selectively rather than routinely in uncomplicated disease, and his CRP of 96 mg/L and white count of 13,600 both sit below the thresholds of 140 mg/L and 15 × 10⁹/L that would prompt them. Clear liquids for 24 to 72 hours,
