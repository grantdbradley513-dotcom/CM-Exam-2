er quadrant pain, fever, and tender hepatomegaly — sometimes with pleuritic chest or referred shoulder pain. In extraintestinal disease the fever is more prominent than the bowel symptoms, so waiting for diarrhea to recur would miss it."}]}, {"case": "DI-I1", "group": "DI-I", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "objective": "", "vignette_workup": "A 15-year-old boy presents to the primary care clinic with about a year of bloating, cramping, flatulence, and watery diarrhea that begins half an hour to two hours after he drinks milk or eats ice cream. Larger amounts make it worse and a small piece of aged cheddar does nothing at all. There is no blood in the stool, no fever, and no weight loss, and his father avoids milk for the same reason. He takes no medications. His temperature is 36.8°C (98.2°F), blood pressure is 114/70 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. His examination is normal — the abdomen is soft and non-tender with no distention at rest — and he is growing along his prior percentiles, with no pallor and no rash.", "labs_workup": [["Two-week lactose-free diet trial", "Symptoms resolve completely, and return on rechallenge"]], "vignette_recog": "A 15-year-old boy presents to the primary care clinic with about a year of bloating, cramping, flatulence, and watery diarrhea that begins half an hour to two hours after he drinks milk or eats ice cream. Larger amounts make it worse and a small piece of aged cheddar does nothing at all. There is no blood in the stool, no fever, and no weight loss, and his father avoids milk for the same reason. He takes no medications. His temperature is 36.8°C (98.2°F), blood pressure is 114/70 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. His examination is normal — the abdomen is soft and non-tender with no distention at rest — and he is growing along his prior percentiles, with no pallor and no rash.", "labs_recog": [["Two-week lactose-free diet trial", "Symptoms resolve completely, and return on rechallenge"], ["Hydrogen breath test", "Breath hydrogen rises 34 ppm within 90 minutes after a 50 g load (cutoff greater than 20 ppm; 10–20 ppm indeterminate)"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fecal calprotectin with CRP and IgA anti-tissue transglutaminase"}, {"letter": "B", "text": "Small bowel aspirate culture"}, {"letter": "C", "text": "Hydrogen breath test"}, {"letter": "D", "text": "EGD with duodenal biopsy"}, {"letter": "E", "text": "Stool microscopic exam for cysts and trophozoites"}], "answer": "C", "explanation": "The dietary trial has already answered the clinical question, and the breath test is what puts an objective number on it. Endoscopy and serology look for a mucosal disease that his normal growth and absent deficiencies argue against."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A rise in breath hydrogen after a lactose load"}, {"letter": "B", "text": "Rome IV criteria met with no alarm feature"}, {"letter": "C", "text": "Bacterial overgrowth on aspirate culture"}, {"letter": "D", "text": "Cysts and trophozoites of Giardia identified"}, {"letter": "E", "text": "Villous atrophy, crypt hyperplasia, and intraepithelial lymphocytosis"}], "answer": "A", "explanation": "Unsplit sugar reaching the colon is fermented by resident bacteria, and the hydrogen they produce is absorbed and exhaled — which is what the test measures. A rise above 20 ppm is positive, 10 to 20 ppm indeterminate, and 10 ppm or less normal."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Irritable bowel syndrome"}, {"letter": "B", "text": "Celiac disease"}, {"letter": "C", "text": "Lactose intolerance"}, {"letter": "D", "text": "Short bowel syndrome"}, {"letter": "E", "text": "Small intestinal bacterial overgrowth"}], "answer": "C", "explanation": "Symptoms tied to the dose of one sugar, arriving 30 minutes to 2 hours after it, and abolished by removing that sugar alone is an enzyme problem rather than a mucosal or bacterial one. Aged cheese carries little lactose, which is why it causes nothing."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Irritable bowel syndrome"}, {"letter": "B", "text": "Lactose intolerance"}, {"letter": "C", "text": "Short bowel syndrome"}, {"letter": "D", "text": "Small intestinal bacterial overgrowth"}, {"letter": "E", "text": "Celiac disease"}], "answer": "B", "explanation": "A rise of 34 ppm after a lactose load, in a boy whose symptoms clear on a lactose-free trial and return on rechallenge, is brush-border lactase deficiency. Bacterial overgrowth follows surgery or slowed transit and comes with a low B12, neither of which he has."}, {"key": "mgmt", "path": "both", "stem": "He has lactose intolerance. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "B", "text": "Treating the underlying driver with rifaximin"}, {"letter": "C", "text": "Complete elimination of dairy from the diet"}, {"letter": "D", "text": "A high-complex-carbohydrate diet with hydration and antidiarrheals"}, {"letter": "E", "text": "Limiting lactose to his own threshold with lactase replacement"}], "answer": "E", "explanation": "Severity depends on both the degree of deficiency and the amount ingested, so the treatment is a threshold rather than a prohibition, with the enzyme supplied for the meals where he wants more. Aged cheese and unpasteurized yogurt are better tolerated and need not be given up."}, {"key": "escalate", "path": "both", "stem": "He finds even small amounts of milk bring the symptoms on and gives up dairy altogether. Which of the following should be added?", "options": [{"letter": "A", "text": "A lifelong gluten-free diet"}, {"letter": "B", "text": "Calcium supplementation"}, {"letter": "C", "text": "Tinidazole as a single dose"}, {"letter": "D", "text": "Rifaximin"}, {"letter": "E", "text": "A low FODMAP diet"}], "answer": "B", "explanation": "Dairy is the main dietary source of calcium, and dropping it entirely leaves a gap that has to be filled. It matters most at his age, while bone is still being laid down."}, {"key": "counsel", "path": "both", "stem": "He has lactose intolerance. Which of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Limit lactose only to aged cheese and unpasteurized yogurt"}, {"letter": "B", "text": "Limit lactose only to servings under 8 ounces of milk daily"}, {"letter": "C", "text": "Limit lactose only until the breath hydrogen falls below 20 ppm"}, {"letter": "D", "text": "Limit lactose to the amount he tolerates, with no need to eliminate dairy"}, {"letter": "E", "text": "Limit lactose only while he is still growing"}], "answer": "D", "explanation": "The goal of treatment is comfort, not elimination, and most patients tolerate at least one 8-ounce serving of milk a day — the threshold is found by the patient rather than set by a rule. The breath hydrogen is a diagnostic measurement and is not repeated to guide the diet."}]}, {"case": "CO-B1", "group": "CO-B", "section": "the named structural culprit behind an obstruction", "objective": "", "vignette_workup": "A 55-year-old woman presents to the emergency department with a third episode in four years of crampy abdominal pain and bloating, this time with vomiting and no flatus since yesterday. She had two cesarean deliveries in her thirties and an appendectomy at 16, and a pelvic infection treated in hospital fifteen years ago. She has had no radiation and has no known malignancy. Her temperature is 37.1°C (98.8°F), blood pressure is 130/78 mm Hg, pulse is 94/min, respirations are 18/min, and oxygen saturation is 98% on room air. Her abdomen is distended with two well-healed surgical scars and is diffusely but mildly tender, with no palpable mass, no groin bulge, and no guarding or rebound.", "labs_workup": [["CT abdomen and pelvis", "Transition point in the mid-ileum with no discrete mass, no tumor, and no hernia sac"], ["WBC", "8,900/mm³"], ["Hemoglobin / hematocrit", "12.9 g/dL / 39%"], ["Platelets", "248,000/mm³"], ["Sodium / potassium", "138 mEq/L / 3.5 mEq/L"], ["BUN / creatinine", "18 mg/dL / 0.8 mg/dL"], ["Lactate", "1.2 mmol/L"]], "vignette_recog": "A 55-year-old woman presents to the emergency department with a third episode in four years of crampy abdominal pain and bloating, this time with vomiting and no flatus since yesterday. She had two cesarean deliveries in her thirties and an appendectomy at 16, and a pelvic infection treated in hospital fifteen years ago. She has had no radiation and has no known malignancy. Her temperature is 37.1°C (98.8°F), blood pressure is 130/78 mm Hg, pulse is 94/min, respirations are 18/min, and oxygen saturation is 98% on room air. Her abdomen is distended with two well-healed surgical scars and is diffusely but mildly tender, with no palpable mass, no groin bulge, and no guarding or rebound. She is taken for direct visualization of the peritoneal cavity.", "labs_recog": [["CT abdomen and pelvis", "Transition point in the mid-ileum with no discrete mass, no tumor, and no hernia sac"], ["WBC", "8,900/mm³"], ["Hemoglobin / hematocrit", "12.9 g/dL / 39%"], ["Platelets", "248,000/mm³"], ["Sodium / potassium", "138 mEq/L / 3.5 mEq/L"], ["BUN / creatinine", "18 mg/dL / 0.8 mg/dL"], ["Lactate", "1.2 mmol/L"], ["Diagnostic laparoscopy", "Irregular bands of scar tethering loops of bowel not normally bound together, with no mass and no hernia"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Diagnostic laparoscopy"}, {"letter": "B", "text": "CT of the abdomen and pelvis with Valsalva"}, {"letter": "C", "text": "Colonoscopy"}, {"letter": "D", "text": "Upright and supine abdominal radiographs"}, {"letter": "E", "text": "Air or water-soluble contrast enema"}], "answer": "A", "explanation": "Imaging here shows the consequence but not the culprit — the cross-sectional study located a transition point and excluded the alternatives without demonstrating anything at that point. Only direct visualization of the peritoneal cavity shows the structure responsible."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Sac contents lateral to the inferior epigastric vessels with proximal dilation"}, {"letter": "B", "text": "Irregular scar bands tethering loops of bowel"}, {"letter": "C", "text": "A telescoped segment reduced under fluoroscopy"}, {"letter": "D", "text": "An obstructing circumferential sigmoid mass"}, {"letter": "E", "text": "A whirl pattern with bird-beak tapering"}], "answer": "B", "explanation": "Peritoneal injury from surgery and from infection heals with fibrous bands, and a loop caught over one kinks and obstructs. The bands are what the imaging cannot see, which is why the diagnosis otherwise rests on the history plus the absence of any other cause."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Incarcerated abdominal hernia"}, {"letter": "B", "text": "Adhesions"}, {"letter": "C", "text": "Intussusception"}, {"letter": "D", "text": "Obstructing colorectal mass"}, {"letter": "E", "text": "Sigmoid volvulus"}], "answer": "B", "explanation": "Two abdominal operations and a hospitalized pelvic infection, with recurrent obstruction and a transition point but no mass, tumor, or hernia sac, is the commonest cause of small bowel obstruction — it accounts for up to 70% of all obstructions. Each prior episode raises the odds of the next, which is why she is here for a third time."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Intussusception"}, {"letter": "B", "text": "Sigmoid volvulus"}, {"letter": "C", "text": "Obstructing colorectal mass"}, {"letter": "D", "text": "Adhesions"}, {"letter": "E", "text": "Incarcerated abdominal hernia"}], "answer": "D", "explanation": "Bands of scar tethering loops that are not normally bound together, with no mass and no hernia, is the direct demonstration. A volvulus would show a twisted closed loop, and an incarcerated hernia a wall defect with bowel inside the sac."}, {"key": "mgmt", "path": "both", "stem": "She has adhesive small bowel obstruction. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Non-operative enema reduction with surgery on standby"}, {"letter": "B", "text": "Nasogastric decompression with fluid resuscitation"}, {"letter": "C", "text": "Immediate laparoscopic lysis of adhesions"}, {"letter": "D", "text": "Urgent surgical repair with intravenous fluids and analgesia"}, {"letter": "E", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}], "answer": "B", "explanation": "Most of these obstructions resolve with decompression and fluids, and she is soft, afebrile, with a normal white count and a lactate of 1.2 mmol/L — nothing suggests compromised bowel. Operating now would cut the bands and lay down new ones in their place."}, {"key": "escalate", "path": "both", "stem": "After 48 hours of nasogastric decompression and intravenous fluids she still has no flatus and remains distended. Which of the following should be done next?", "options": [{"letter": "A", "text": "Operative lysis of adhesions"}, {"letter": "B", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "C", "text": "Urgent surgical repair with intravenous fluids and analgesia"}, {"letter": "D", "text": "Non-operative enema reduction with surgery on standby"}, {"letter": "E", "text": "Continued nasogastric decompression with fluid resuscitation"}], "answer": "A", "explanation": "An obstruction that will not resolve on decompression is the indication for operation, and it is the only indication — the trade is a new set of adhesions against an obstruction that is not going to open. Water-soluble contrast down the tube with serial radiographs is both a way of predicting resolution and a way of achieving it."}, {"key": "counsel", "path": "both", "stem": "She has adhesive small bowel obstruction. Which of the following is the most appropriate approach to operative lysis of adhesions?", "options": [{"letter": "A", "text": "Offer it once imaging shows a transition point"}, {"letter": "B", "text": "Offer it at the time of any future abdominal operation"}, {"letter": "C", "text": "Offer it for chronic abdominal pain between episodes"}, {"letter": "D", "text": "Reserve it for obstruction that will not resolve"}, {"letter": "E", "text": "Offer it after a third episode of obstruction"}], "answer": "D", "explanation": "The operation that divides adhesions creates new ones, so the indication has to be an obstruction that will not open rather than a count of episodes or a symptom. Pain alone is the commonest reason patients ask for it and the commonest reason it should be declined."}]}, {"case": "CO-E1", "group": "CO-E", "section": "focal lower abdominal pain, and the colonic disease underneath it", "objective": "", "vignette_workup": "A 16-year-old boy presents to the emergency department with 18 hours of abdominal pain that began around his navel and has settled into the right lower quadrant. He felt nauseated and vomited twice after the pain started, has eaten nothing since yesterday, and developed a low-grade fever this afternoon. He has had no previous abdominal surgery and no similar episodes. His temperature is 37.9°C (100.2°F), blood pressure is 118/70 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 99% on room air. He has tenderness at McBurney's point with voluntary guarding, a positive Rovsing's sign, and pain on right hip extension; the abdomen is not rigid, there is no rebound over the left side, and bowel sounds are present.", "labs_workup": [["WBC", "14,200/mm³ with 84% neutrophils"], ["Hemoglobin / hematocrit", "14.0 g/dL / 42%"], ["Platelets", "250,000/mm³"], ["CRP", "42 mg/L"], ["Alvarado score", "9"]], "vignette_recog": "A 16-year-old boy presents to the emergency department with 18 hours of abdominal pain that began around his navel and has settled into the right lower quadrant. He felt nauseated and vomited twice after the pain started, has eaten nothing since yesterday, and developed a low-grade fever this afternoon. He has had no previous abdominal surgery and no similar episodes. His temperature is 37.9°C (100.2°F), blood pressure is 118/70 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 99% on room air. He has tenderness at McBurney's point with voluntary guarding, a positive Rovsing's sign, and pain on right hip extension; the abdomen is not rigid, there is no rebound over the left side, and bowel sounds are present.", "labs_recog": [["WBC", "14,200/mm³ with 84% neutrophils"], ["Hemoglobin / hematocrit", "14.0 g/dL / 42%"], ["Platelets", "250,000/mm³"], ["CRP", "42 mg/L"], ["Alvarado score", "9"], ["CT abdomen and pelvis with IV contrast", "Appendiceal outer diameter 11 mm with a non-filling lumen, wall thickening and enhancement, periappendiceal fat stranding with a small volume of free fluid, and an appendicolith at the base; no extraluminal air"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Colonoscopy with biopsy"}, {"letter": "B", "text": "Tagged-RBC scan followed by angiography"}, {"letter": "C", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "D", "text": "Upright and supine abdominal radiographs"}, {"letter": "E", "text": "Interval colonoscopy in 6 to 8 weeks"}], "answer": "C", "explanation": "Cross-sectional imaging with contrast is the study that visualizes the structure itself and the tissue around it, and no laboratory value can take its place — a white count above 10,000 roughly doubles the odds and that is all it does. Endoscopic studies answer questions raised by chronic bleeding or a change in bowel habit."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Localized sigmoid wall thickening with pericolonic fat stranding and diverticula"}, {"letter": "B", "text": "A U-shaped dilated sigmoid loop with a coffee bean sign and absent rectal gas"}, {"letter": "C", "text": "Segmental wall thickening with thumbprinting at the splenic flexure"}, {"letter": "D", "text": "An appendiceal outer diameter of 11 mm with a non-filling lumen and fat stranding"}, {"letter": "E", "text": "Outpouchings through the muscularis propria, sigmoid predominant, with no inflammation"}], "answer": "D", "explanation": "Obstruction of a blind-ended tube raises the pressure inside it, so the lumen will not fill, the wall thickens and enhances, and the inflammation spreads into the surrounding fat. Pain that started periumbilically and migrated is the visceral-to-parietal transition as that inflammation reaches the peritoneum."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "Diverticulitis"}, {"letter": "C", "text": "Diverticular disease"}, {"letter": "D", "text": "Ischemic colitis"}, {"letter": "E", "text": "Appendicitis"}], "answer": "E", "explanation": "Pain before vomiting, migration to the right lower quadrant, anorexia, and a low-grade fever within 36 hours in a teenager is the classic sequence; the reverse order suggests gastroenteritis or obstruction. An Alvarado score of 8 to 10 carries a 93% probability."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "Diverticular disease"}, {"letter": "C", "text": "Ischemic colitis"}, {"letter": "D", "text": "Appendicitis"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "D", "explanation": "An appendix over 6 mm in outer diameter with a lumen that will not fill, an enhancing thickened wall, and periappendiceal stranding is the diagnosis, and the appendicolith at the base names the obstruction that caused it. There is no extraluminal air, so it has not perforated."}, {"key": "mgmt", "path": "both", "stem": "He has acute appendicitis with an appendicolith. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "B", "text": "Bowel rest, intravenous fluids, and ciprofloxacin plus metronidazole"}, {"letter": "C", "text": "Clear liquids with selective ciprofloxacin plus metronidazole"}, {"letter": "D", "text": "High-fiber diet with weight loss, exercise, and tobacco cessation"}, {"letter": "E", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}], "answer": "A", "explanation": "Removal is the standard of care, and the laparoscopic approach gives a shorter stay, faster recovery, and fewer narcotics. An appendicolith is an explicit exception to the antibiotics-alone route and predicts that it will fail, so he is not a candidate for it."}, {"key": "escalate", "path": "both", "stem": "He is treated with intravenous antibiotics instead of surgery, and his pain and fever return on the fourth day. Which of the following should be done next?", "options": [{"letter": "A", "text": "Clear liquids with selective ciprofloxacin plus metronidazole"}, {"letter": "B", "text": "Appendectomy"}, {"letter": "C", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "D", "text": "Bowel rest with intravenous fluids and antibiotics"}, {"letter": "E", "text": "High-fiber diet with weight loss and exercise"}], "answer": "B", "explanation": "Failure of antibiotic therapy is an indication for operation, and roughly three in ten patients managed this way come to appendectomy within 90 days even without an appendicolith. Perforation risk is 2% at 36 hours and climbs about 5% every 12 hours after that, so a second course is not the answer."}, {"key": "counsel", "path": "both", "stem": "He has acute appendicitis. Which of the following is the most appropriate approach to first-line imaging?", "options": [{"letter": "A", "text": "Ultrasound first in every patient with right lower quadrant pain"}, {"letter": "B", "text": "Ultrasound first in children and in pregnancy"}, {"letter": "C", "text": "Ultrasound first only when the Alvarado score is below 5"}, {"letter": "D", "text": "Ultrasound first only when the white blood cell count is normal"}, {"letter": "E", "text": "Ultrasound first only when symptoms have lasted less than 36 hours"}], "answer": "B", "explanation": "Radiation matters most in a growing child and in a fetus, so ultrasound leads in those two groups, with MRI when it is nondiagnostic; cross-sectional imaging with contrast is preferred otherwise. Neither the score nor the white count decides which study is ordered, since no laboratory value can confirm or exclude the disease."}]}, {"case": "CO-E3", "group": "CO-E", "section": "focal lower abdominal pain, and the colonic disease underneath it", "objective": "", "vignette_workup": "A 64-year-old man presents to the emergency department with two days of left lower quadrant pain that came on suddenly and has progressively worsened, with a low-grade fever, constipation, and nausea; for the past day he has also had urinary frequency. He has had two prior episodes of the same pain, the last three years ago, and eats a low-fiber diet. He is not immunosuppressed, is tolerating oral intake, and lives independently. His temperature is 38.1°C (100.6°F), blood pressure is 136/82 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has left lower quadrant tenderness with mild voluntary guarding and bloating with mild distention; there is no rebound, no rigidity, and no palpable mass, and bowel sounds are present.", "labs_workup": [["WBC", "13,600/mm³ with 80% neutrophils"], ["Hemoglobin / hematocrit", "14.2 g/dL / 43%"], ["Platelets", "288,000/mm³"], ["CRP", "96 mg/L"], ["ESR", "38 mm/h"], ["Sodium / potassium", "139 mEq/L / 4.1 mEq/L"], ["BUN / creatinine", "20 mg/dL / 1.0 mg/dL"], ["Urinalysis", "12 WBC/hpf with no bacteria"]], "vignette_recog": "A 64-year-old man presents to the emergency department with two days of left lower quadrant pain that came on suddenly and has progressively worsened, with a low-grade fever, constipation, and nausea; for the past day he has also had urinary frequency. He has had two prior episodes of the same pain, the last three years ago, and eats a low-fiber diet. He is not immunosuppressed, is tolerating oral intake, and lives independently. His temperature is 38.1°C (100.6°F), blood pressure is 136/82 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has left lower quadrant tenderness with mild voluntary guarding and bloating with mild distention; there is no rebound, no rigidity, and no palpable mass, and bowel sounds are present.", "labs_recog": [["WBC", "13,600/mm³ with 80% neutrophils"], ["Hemoglobin / hematocrit", "14.2 g/dL / 43%"], ["Platelets", "288,000/mm³"], ["CRP", "96 mg/L"], ["ESR", "38 mm/h"], ["Sodium / potassium", "139 mEq/L / 4.1 mEq/L"], ["BUN / creatinine", "20 mg/dL / 1.0 mg/dL"], ["Urinalysis", "12 WBC/hpf with no bacteria"], ["CT abdomen and pelvis with contrast", "Localized sigmoid bowel wall thickening with pericolonic fat stranding and multiple colonic diverticula; no abscess, no free air, no fistula"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Tagged-RBC scan followed by angiography"}, {"letter": "B", "text": "CT of the abdomen and pelvis with contrast"}, {"letter": "C", "text": "Colonoscopy with biopsy"}, {"letter": "D", "text": "Graded-compression ultrasound of the abdomen"}, {"letter": "E", "text": "Upright and supine abdominal radiographs"}], "answer": "B", "explanation": "Cross-sectional imaging with contrast is the preferred initial study because it grades severity as well as making the diagnosis — abscess, free air, and fistula are what change the management. Endoscopy is contraindicated during an acute attack, when insufflating an inflamed segment risks perforating it."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Segmental wall thickening with thumbprinting at the splenic flexure"}, {"letter": "B", "text": "An appendiceal outer diameter of 11 mm with a non-filling lumen and fat stranding"}, {"letter": "C", "text": "Localized sigmoid wall thickening with pericolonic fat stranding and diverticula"}, {"letter": "D", "text": "A U-shaped dilated sigmoid loop with a coffee bean sign and absent rectal gas"}, {"letter": "E", "text": "Outpouchings through the muscularis propria, sigmoid predominant, with no inflammation"}], "answer": "C", "explanation": "A micro-perforation at the neck of one pouch inflames the wall and the fat around it, which stays localized when the perforation seals — hence stranding without abscess, free air, or fistula. Quiet pouches with no surrounding inflammation are the asymptomatic state, not an attack."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "Appendicitis"}, {"letter": "C", "text": "Ischemic colitis"}, {"letter": "D", "text": "Diverticular disease"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "E", "explanation": "Left lower quadrant pain with fever, leukocytosis, and a raised CRP in an older adult with prior identical episodes is an inflamed sigmoid. The sterile pyuria is the inflamed loop irritating the bladder, which happens in 10 to 15% of cases, and it should not be read as a urinary infection."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Appendicitis"}, {"letter": "B", "text": "Diverticulitis"}, {"letter": "C", "text": "Ischemic colitis"}, {"letter": "D", "text": "Diverticular disease"}, {"letter": "E", "text": "Sigmoid volvulus"}], "answer": "B", "explanation": "Wall thickening with pericolonic stranding alongside diverticula is inflammation of the pouches; the same pouches without inflammation would be the asymptomatic disease. No abscess, free air, or fistula makes this uncomplicated, which is what allows outpatient management."}, {"key": "mgmt", "path": "both", "stem": "He has uncomplicated diverticulitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Bowel rest with intravenous fluids and ciprofloxacin plus metronidazole"}, {"letter": "B", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "C", "text": "Clear liquids with ciprofloxacin plus metronidazole"}, {"letter": "D", "text": "Clear liquids with outpatient follow-up and no antibiotics"}, {"letter": "E", "text": "Intravenous piperacillin-tazobactam with admission"}], "answer": "D", "explanation": "Antibiotics are given selectively rather than routinely in uncomplicated disease, and his CRP of 96 mg/L and white count of 13,600 both sit below the thresholds of 140 mg/L and 15 × 10⁹/L that would prompt them. Clear liquids for 24 to 72 hours, then a low-residue diet, with follow-up in 2 to 4 days; acetaminophen and NSAIDs for pain, and no narcotics."}, {"key": "escalate", "path": "both", "stem": "He returns three days later with worsening pain and can no longer keep fluids down. Which of the following should be done next?", "options": [{"letter": "A", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "B", "text": "Admission with intravenous piperacillin-tazobactam"}, {"letter": "C", "text": "Clear liquids with ciprofloxacin plus metronidazole"}, {"letter": "D", "text": "High-fiber diet with weight loss and exercise"}, {"letter": "E", "text": "Appendectomy with pre-operative intravenous antibiotics"}], "answer": "B", "explanation": "Failure of outpatient therapy and an inability to tolerate oral intake are each admission criteria on their own, and the intravenous regimen is piperacillin-tazobactam, or ceftriaxone with metronidazole. Improvement should have come within 48 to 72 hours; when it does not, the abdomen is re-imaged rather than the antibiotics simply escalated."}, {"key": "counsel", "path": "both", "stem": "He has uncomplicated diverticulitis. Which of the following is the most appropriate approach to colonoscopy?", "options": [{"letter": "A", "text": "Colonoscopy during the acute episode"}, {"letter": "B", "text": "Colonoscopy only if the pain fails to settle in 48 to 72 hours"}, {"letter": "C", "text": "Colonoscopy only if a further episode occurs"}, {"letter": "D", "text": "Colonoscopy 6 to 8 weeks after the episode resolves"}, {"letter": "E", "text": "Colonoscopy only if an abscess larger than 2 cm is found"}], "answer": "D", "explanation": "The interval study exists to exclude the cancer that can produce an identical attack, and it waits until the inflammation has settled because scoping an acutely inflamed segment risks perforation. Barium enema is contraindicated during the attack for the same reason."}]}, {"case": "CO-G1", "group": "CO-G", "section": "bright red blood per rectum", "objective": "", "vignette_workup": "A 73-year-old man presents to the emergency department after three episodes of large-volume maroon and bright red blood per rectum in the past two hours. He has no abdominal pain at all, and became lightheaded standing up in the bathroom. He is chronically constipated, eats little fiber and a lot of red meat, and takes low-dose aspirin along with naproxen for back pain; a colonoscopy four years ago showed diverticulosis. He has had no prior gastrointestinal bleed and takes no anticoagulant. His temperature is 36.8°C (98.2°F), blood pressure is 104/62 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 97% on room air. His conjunctivae are pale, his abdomen is soft and completely non-tender with no guarding or mass, and there is gross blood on rectal examination with no fissure, no prolapsing hemorrhoid, and no palpable rectal mass.", "labs_workup": [["Hemoglobin / hematocrit", "9.2 g/dL / 28% (13.8 g/dL four months ago)"], ["Platelets", "210,000/mm³"], ["INR", "1.0"], ["BUN / creatinine", "18 mg/dL / 1.1 mg/dL"], ["Nasogastric lavage", "Clear"]], "vignette_recog": "A 73-year-old man presents to the emergency department after three episodes of large-volume maroon and bright red blood per rectum in the past two hours. He has no abdominal pain at all, and became lightheaded standing up in the bathroom. He is chronically constipated, eats little fiber and a lot of red meat, and takes low-dose aspirin along with naproxen for back pain; a colonoscopy four years ago showed diverticulosis. He has had no prior gastrointestinal bleed and takes no anticoagulant. His temperature is 36.8°C (98.2°F), blood pressure is 104/62 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 97% on room air. His conjunctivae are pale, his abdomen is soft and completely non-tender with no guarding or mass, and there is gross blood on rectal examination with no fissure, no prolapsing hemorrhoid, and no palpable rectal mass. He is resuscitated and an upper source is excluded before he is examined further.", "labs_recog": [["Hemoglobin / hematocrit", "9.2 g/dL / 28% (13.8 g/dL four months ago)"], ["Platelets", "210,000/mm³"], ["INR", "1.0"], ["BUN / creatinine", "18 mg/dL / 1.1 mg/dL"], ["Nasogastric lavage", "Clear"], ["Colonoscopy", "Multiple colonic diverticula without inflammation, most of them sigmoid, with a non-bleeding visible vessel at the mouth of one left-sided diverticulum; no mass and no colitis"]], "nodes": [{"key": "next_step", "path": "W", "stem": "After resuscitation, which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Anoscopy"}, {"letter": "B", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "C", "text": "Perineal inspection while straining or squatting"}, {"letter": "D", "text": "Inspection with gentle anal stretching"}, {"letter": "E", "text": "Colonoscopy"}], "answer": "E", "explanation": "Large-volume painless bleeding with a hemoglobin drop and a rise in pulse comes from above the anorectum, and the rectal examination has already shown no local source. Colonoscopy has a 69 to 90% yield for localizing the bleeding point and can treat it in the same sitting."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A posterior midline crack with raised edges and a sentinel tag"}, {"letter": "B", "text": "Segmental wall thickening with thumbprinting at the splenic flexure, rectum spared"}, {"letter": "C", "text": "Full-thickness rectal wall protruding with concentric stacked-coin folds"}, {"letter": "D", "text": "An engorged plexus above the dentate line that reduces spontaneously"}, {"letter": "E", "text": "Multiple colonic diverticula without inflammation, with a visible vessel"}], "answer": "E", "explanation": "A pouch herniates where a vessel penetrates the wall, so the artery ends up draped over the neck of the sac with only mucosa covering it; when it gives way the bleeding is arterial, brisk, and painless. Ninety percent stop on their own, which is why a vessel can be seen without active bleeding."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ischemic colitis"}, {"letter": "B", "text": "Rectal prolapse"}, {"letter": "C", "text": "Diverticular bleed"}, {"letter": "D", "text": "Internal hemorrhoids"}, {"letter": "E", "text": "Anal fissure"}], "answer": "C", "explanation": "Painless, large-volume bleeding with hemodynamic change in a man over 60 on aspirin and an NSAID is a colonic arterial source, and his anorectum is normal on examination. Ischemic colitis is preceded by crampy left-sided pain, and hemorrhoids and fissures streak the stool rather than filling the toilet."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Rectal prolapse"}, {"letter": "B", "text": "Anal fissure"}, {"letter": "C", "text": "Internal hemorrhoids"}, {"letter": "D", "text": "Diverticular bleed"}, {"letter": "E", "text": "Ischemic colitis"}], "answer": "D", "explanation": "A visible vessel at the mouth of a left-sided pouch with no colitis and no mass identifies both the lesion and the side. Arteriovenous malformations bleed on the right and diverticula on the left, though diverticulosis is common enough that a right-sided diverticular bleed is not rare."}, {"key": "mgmt", "path": "both", "stem": "He has had a diverticular bleed that has stopped. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Manual reduction, with surgical repair for full-thickness disease"}, {"letter": "B", "text": "Water, fiber, and sitz baths with stool softeners and topical astringents"}, {"letter": "C", "text": "Fiber 20 to 35 g, fluids, and sitz baths with stool softeners"}, {"letter": "D", "text": "Bowel rest, intravenous fluids, and ciprofloxacin plus metronidazole"}, {"letter": "E", "text": "A high-fiber diet with increased fluids and exercise after resuscitation"}], "answer": "E", "explanation": "Nine in ten of these bleeds stop without intervention, so once he is resuscitated the treatment addresses the constipation and the low-fiber, high-red-meat diet that drove the pouches in the first place. Sitz baths and astringents treat an anorectal source he does not have."}, {"key": "escalate", "path": "both", "stem": "The bleeding continues after localization and optimal management, and he has received six units of packed red cells. Which of the following should be done next?", "options": [{"letter": "A", "text": "Blind segmental colectomy without localization"}, {"letter": "B", "text": "Segmental colectomy based on the localization"}, {"letter": "C", "text": "Water, fiber, and sitz baths with stool softeners"}, {"letter": "D", "text": "Bowel rest with intravenous fluids and antibiotics"}, {"letter": "E", "text": "Manual reduction with surgical repair"}], "answer": "B", "explanation": "Continued bleeding after localization, optimal management, and six units of blood is the threshold for resection, and the segment is chosen by where the bleeding was shown to be. Operating without localization rebleeds more than half the time, against 5 to 10% for an empiric total abdominal colectomy."}, {"key": "counsel", "path": "both", "stem": "He has had a diverticular bleed. Which of the following is the most appropriate dietary recommendation?", "options": [{"letter": "A", "text": "Resume a high-fiber diet but avoid nuts, seeds, and berries"}, {"letter": "B", "text": "Resume a high-fiber diet only if a repeat colonoscopy is normal"}, {"letter": "C", "text": "Resume a high-fiber diet only once the hemoglobin returns to baseline"}, {"letter": "D", "text": "Resume a high-fiber diet only if the bleeding does not recur"}, {"letter": "E", "text": "Resume a high-fiber diet with no need to avoid nuts, seeds, or berries"}], "answer": "E", "explanation": "The pouches are acquired under raised intraluminal pressure, so fiber is the treatment rather than a hazard, and the traditional advice to avoid particulate foods has no basis. Delaying it until a hemoglobin or a repeat study catches up leaves the constipation that drove the disease untreated."}]}, {"case": "PA-B3", "group": "PA-B", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "objective": "", "vignette_workup": "A 61-year-old man is on the step-down unit on hospital day 12. He was admitted with necrotizing alcohol-related acute pancreatitis and still has ongoing epigastric pain; he has not turned the corner. His temperature is 38.2°C (100.8°F), blood pressure is 118/70 mm Hg, pulse is 106/min, respirations are 20/min, and oxygen saturation is 95% on room air. He has persistent fever and tachycardia with diffuse abdominal tenderness, no palpable mass, and no flank or periumbilical bruising.", "labs_workup": [["WBC", "15,800/mm³ with 84% neutrophils"], ["Creatinine / BUN", "1.3 mg/dL / 26 mg/dL"], ["Albumin", "2.8 g/dL"], ["Hemoglobin / hematocrit", "11.4 g/dL / 34%"], ["Blood cultures", "Negative at 48 hours"]], "vignette_recog": "A 61-year-old man is on the step-down unit on hospital day 12. He was admitted with necrotizing alcohol-related acute pancreatitis and still has ongoing epigastric pain; he has not turned the corner. His temperature is 38.2°C (100.8°F), blood pressure is 118/70 mm Hg, pulse is 106/min, respirations are 20/min, and oxygen saturation is 95% on room air. He has persistent fever and tachycardia with diffuse abdominal tenderness, no palpable mass, and no flank or periumbilical bruising. A staging contrast-enhanced CT of the abdomen is obtained.", "labs_recog": [["WBC", "15,800/mm³ with 84% neutrophils"], ["Creatinine / BUN", "1.3 mg/dL / 26 mg/dL"], ["Albumin", "2.8 g/dL"], ["Hemoglobin / hematocrit", "11.4 g/dL / 34%"], ["Blood cultures", "Negative at 48 hours"], ["CT abdomen with IV contrast", "Heterogeneous collection containing both fluid and non-liquefied necrotic tissue with no defined wall, involving the pancreatic body and the left anterior pararenal space; no gas within the collection"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "B", "text": "Serum lipase with right upper quadrant ultrasound"}, {"letter": "C", "text": "Repeat contrast-enhanced CT in 5 to 7 days"}, {"letter": "D", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "E", "text": "Blood cultures"}], "answer": "A", "explanation": "Contrast-enhanced CT is the study that characterizes a collection after an attack of pancreatitis, because the whole differential here is imaging morphology — whether the contents are fluid or necrotic debris and whether a wall has formed. Fine-needle aspiration and blood cultures answer a question about infection that the morphology has not yet raised."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An encapsulated heterogeneous collection with a defined enhancing wall containing necrotic debris"}, {"letter": "B", "text": "A homogeneous fluid collection with no encapsulating wall and no necrosis"}, {"letter": "C", "text": "Gas within necrotic pancreatic tissue with a persistent leukocytosis and left shift"}, {"letter": "D", "text": "A heterogeneous collection of fluid and non-liquefied necrotic tissue with no defined wall"}, {"letter": "E", "text": "An encapsulated fluid collection with a well-defined enhancing wall and minimal necrosis"}], "answer": "D", "explanation": "Necrosis of the gland and the peripancreatic fat liquefies unevenly, so the collection contains solid debris as well as fluid, and an inflammatory capsule takes about four weeks to form. Gas inside the collection would mean infection, which negative cultures and the absence of sepsis physiology argue against here."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Infected pancreatic necrosis"}, {"letter": "B", "text": "Walled-off necrosis"}, {"letter": "C", "text": "Pancreatic pseudocyst"}, {"letter": "D", "text": "Acute peripancreatic fluid collection"}, {"letter": "E", "text": "Acute necrotic collection"}], "answer": "E", "explanation": "Necrosis within the first four weeks of an attack, before an inflammatory capsule has formed, is an acute necrotic collection. Walled-off necrosis carries the same debris inside a mature enhancing wall and is a later lesion, and a peripancreatic fluid collection is homogeneous fluid with no necrotic content."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Infected pancreatic necrosis"}, {"letter": "B", "text": "Pancreatic pseudocyst"}, {"letter": "C", "text": "Walled-off necrosis"}, {"letter": "D", "text": "Acute peripancreatic fluid collection"}, {"letter": "E", "text": "Acute necrotic collection"}], "answer": "E", "explanation": "Heterogeneous content — fluid mixed with non-liquefied necrotic tissue — with no defined wall, twelve days into an attack, is an acute necrotic collection. The necrotic content separates it from a peripancreatic fluid collection, and the absent wall separates it from walled-off necrosis and from a pseudocyst."}, {"key": "mgmt", "path": "both", "stem": "He has an acute necrotic collection. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Endoscopic transmural drainage with necrosectomy"}, {"letter": "B", "text": "Imipenem-cilastatin 500 mg intravenously every 6 hours"}, {"letter": "C", "text": "Supportive care and observation, with drainage deferred"}, {"letter": "D", "text": "Surgical resection or surveillance according to cyst type"}, {"letter": "E", "text": "Endoscopic drainage of the collection"}], "answer": "C", "explanation": "An unwalled collection has no capsule to drain against, and drainage of sterile necrosis does not reduce mortality. Antibiotics are the reflex trap: negative cultures and no gas in the collection make this sterile necrosis, and treating it with a carbapenem selects resistant organisms without changing the course."}, {"key": "counsel", "path": "both", "stem": "He has an acute necrotic collection. Which of the following is the most appropriate approach to drainage?", "options": [{"letter": "A", "text": "Drain only once the white cell count rises above 15,000/mm³"}, {"letter": "B", "text": "Drain now, at the time the collection is identified"}, {"letter": "C", "text": "Drain only once an inflammatory capsule has formed around the collection"}, {"letter": "D", "text": "Drain at 72 hours from the onset of the attack"}, {"letter": "E", "text": "Drain only once blood cultures become positive"}], "answer": "C", "explanation": "The collection becomes walled-off necrosis once a fibrous capsule matures, and that wall is what makes transmural drainage or necrosectomy possible and safe. A leukocytosis is expected in the inflammatory phase and does not by itself call for an intervention."}]}, {"case": "PA-C1", "group": "PA-C", "section": "severe pancreatitis that fails to improve or deteriorates", "objective": "", "vignette_workup": "A 68-year-old woman is in the intensive care unit on hospital day 5 after admission for severe gallstone pancreatitis. Her pain is unchanged, she has been febrile every day, and she has been sicker than her admission picture predicted; she takes lisinopril for hypertension. Her temperature is 38.6°C (101.5°F), blood pressure is 104/64 mm Hg, pulse is 118/min, respirations are 24/min, and oxygen saturation is 93% on room air. She has diffuse abdominal tenderness with persistent fever and tachycardia, no palpable mass, and no flank or periumbilical bruising.", "labs_workup": [["WBC", "19,400/mm³ with a left shift"], ["Creatinine", "2.1 mg/dL, risen from 0.9 on admission"], ["BUN", "38 mg/dL"], ["Calcium", "7.6 mg/dL"], ["Hemoglobin / hematocrit", "11.0 g/dL / 33%"], ["Blood cultures", "Negative"]], "vignette_recog": "A 68-year-old woman is in the intensive care unit on hospital day 5 after admission for severe gallstone pancreatitis. Her pain is unchanged, she has been febrile every day, and she has been sicker than her admission picture predicted; she takes lisinopril for hypertension. Her temperature is 38.6°C (101.5°F), blood pressure is 104/64 mm Hg, pulse is 118/min, respirations are 24/min, and oxygen saturation is 93% on room air. She has diffuse abdominal tenderness with persistent fever and tachycardia, no palpable mass, and no flank or periumbilical bruising. A contrast-enhanced CT of the abdomen is obtained on day 5.", "labs_recog": [["WBC", "19,400/mm³ with a left shift"], ["Creatinine", "2.1 mg/dL, risen from 0.9 on admission"], ["BUN", "38 mg/dL"], ["Calcium", "7.6 mg/dL"], ["Hemoglobin / hematocrit", "11.0 g/dL / 33%"], ["Blood cultures", "Negative"], ["CT abdomen with IV contrast", "Non-enhancing pancreatic parenchyma involving roughly 40% of the body and tail, with no gas within the necrosis"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "B", "text": "Blood cultures"}, {"letter": "C", "text": "Serial hematocrit measurement"}, {"letter": "D", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "E", "text": "Serum lipase with right upper quadrant ultrasound"}], "answer": "D", "explanation": "A patient who is not improving by day 5 needs the gland imaged with intravenous contrast, because only perfusion tells you whether parenchyma has died. The scan is deliberately timed: obtained before 72 hours it underestimates the extent of necrosis, and the informative window is 5 to 7 days."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Gas within necrotic pancreatic tissue with 24,600 white cells and 18% bands"}, {"letter": "B", "text": "A hematocrit falling from 44% to 26% with retroperitoneal hemorrhage"}, {"letter": "C", "text": "An encapsulated heterogeneous collection with a defined enhancing wall containing necrotic debris"}, {"letter": "D", "text": "Non-enhancing pancreatic parenchyma with no gas within the necrosis"}, {"letter": "E", "text": "A homogeneous fluid collection with no wall in a patient who is otherwise improving"}], "answer": "D", "explanation": "Contrast reaches only living tissue, so dead parenchyma fails to enhance. Gas within the necrosis would mark infection by gas-forming enteric organisms; with negative cultures and no gas, this is sterile necrosis, which is the far more common state early on."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Walled-off necrosis"}, {"letter": "B", "text": "Hemorrhagic pancreatitis"}, {"letter": "C", "text": "Acute peripancreatic fluid collection"}, {"letter": "D", "text": "Infected pancreatic necrosis"}, {"letter": "E", "text": "Necrotizing pancreatitis"}], "answer": "E", "explanation": "Persistent pain and fever with organ dysfunction beyond the first few days marks necrosis rather than interstitial disease, and non-enhancing gland is the radiographic definition. Infected necrosis needs gas in the collection or positive cultures, and hemorrhagic disease announces itself with a falling hematocrit and ecchymoses."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Walled-off necrosis"}, {"letter": "B", "text": "Necrotizing pancreatitis"}, {"letter": "C", "text": "Acute peripancreatic fluid collection"}, {"letter": "D", "text": "Hemorrhagic pancreatitis"}, {"letter": "E", "text": "Infected pancreatic necrosis"}], "answer": "B", "explanation": "Non-enhancing parenchyma involving nearly half the gland, with a rising creatinine and persistent leukocytosis, is necrotizing pancreatitis. The absence of gas and the negative cultures keep it sterile, and a discrete encapsulated collection is a later and different lesion."}, {"key": "mgmt", "path": "both", "stem": "She has sterile necrotizing pancreatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Imipenem-cilastatin 500 mg intravenously every 6 hours"}, {"letter": "B", "text": "Conservative supportive care with ICU-level monitoring"}, {"letter": "C", "text": "Endoscopic transmural drainage with necrosectomy"}, {"letter": "D", "text": "Blood product resuscitation with angioembolization"}, {"letter": "E", "text": "Endoscopic drainage of the collection when it is large or symptomatic"}], "answer": "B", "explanation": "Sterile necrosis usually stays sterile and may resorb, and hypotension, hypoxemia, and organ failure are what put her in the unit. Prophylactic antibiotics do not prevent infection of necrosis, and draining sterile necrosis does not reduce mortality while it does introduce organisms."}, {"key": "escalate", "path": "both", "stem": "Ten days later she remains febrile, her white cell count has risen further, and blood cultures grow Escherichia coli. Which of the following should be done next?", "options": [{"letter": "A", "text": "Endoscopic or percutaneous necrosectomy with imipenem"}, {"letter": "B", "text": "Observation only, with no drainage and no antibiotics"}, {"letter": "C", "text": "Lactated Ringer's with early enteral feeding"}, {"letter": "D", "text": "Blood product resuscitation with angioembolization"}, {"letter": "E", "text": "Continued conservative supportive care with ICU-level monitoring"}], "answer": "A", "explanation": "Infection develops in about one third of patients with necrotizing pancreatitis, and once it is confirmed the necrosis has to come out. Debridement is attempted endoscopically or percutaneously before open surgery, with a carbapenem covering the enteric organisms that seed it."}, {"key": "counsel", "path": "both", "stem": "She has necrotizing pancreatitis. Which of the following is the most appropriate approach to obtaining the staging contrast-enhanced CT?", "options": [{"letter": "A", "text": "Obtain it at 5 to 7 days after the onset of the attack"}, {"letter": "B", "text": "Obtain it within the first 24 hours in every patient"}, {"letter": "C", "text": "Obtain it only once the creatinine has returned to baseline"}, {"letter": "D", "text": "Obtain it only once blood cultures have become positive"}, {"letter": "E", "text": "Obtain it at presentation, before fluid resuscitation begins"}], "answer": "A", "explanation": "Necrosis declares itself radiographically over days, so a scan obtained inside the first 72 hours underestimates how much gland has died and invites false reassurance. Waiting for cultures or for renal recovery delays the one study that changes management."}]}, {"case": "LI-A3", "group": "LI-A", "section": "the scarred liver, recognized at three stages", "objective": "", "vignette_workup": "A 57-year-old man is brought to the emergency department with three weeks of abdominal distension and an 8 kg weight gain, and two days of daytime sleepiness and muddled thinking; his wife says his days and nights are reversed. He has had alcohol-related cirrhosis for four years and is still drinking. He took ibuprofen twice daily for ten days for back pain and has eaten poorly since, and he has never had a variceal bleed. His temperature is 37.2°C (99.0°F), blood pressure is 102/64 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 96% on room air. He has tense ascites with shifting dullness and bulging flanks, jaundice with scleral icterus, asterixis, caput medusae, a spleen palpable to 16 cm, temporal and proximal muscle wasting, and 2+ pitting edema to the knees.", "labs_workup": [["Total bilirubin", "6.8 mg/dL"], ["INR", "2.1"], ["Albumin", "2.4 g/dL"], ["Sodium", "128 mEq/L"], ["Creatinine", "1.6 mg/dL"], ["Platelets", "74,000/mm³"], ["Ammonia", "96 µmol/L"], ["Blood and urine cultures", "Negative"]], "vignette_recog": "A 57-year-old man is brought to the emergency department with three weeks of abdominal distension and an 8 kg weight gain, and two days of daytime sleepiness and muddled thinking; his wife says his days and nights are reversed. He has had alcohol-related cirrhosis for four years and is still drinking. He took ibuprofen twice daily for ten days for back pain and has eaten poorly since, and he has never had a variceal bleed. His temperature is 37.2°C (99.0°F), blood pressure is 102/64 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 96% on room air. He has tense ascites with shifting dullness and bulging flanks, jaundice with scleral icterus, asterixis, caput medusae, a spleen palpable to 16 cm, temporal and proximal muscle wasting, and 2+ pitting edema to the knees. A diagnostic paracentesis is performed on arrival.", "labs_recog": [["Total bilirubin", "6.8 mg/dL"], ["INR", "2.1"], ["Albumin", "2.4 g/dL"], ["Sodium", "128 mEq/L"], ["Creatinine", "1.6 mg/dL"], ["Platelets", "74,000/mm³"], ["Ammonia", "96 µmol/L"], ["Blood and urine cultures", "Negative"], ["Ascitic fluid", "180 PMN/mm³ with a serum–ascites albumin gradient of 1.8 g/dL and a low ascitic total protein"], ["MELD 3.0", "28"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Serum ceruloplasmin"}, {"letter": "B", "text": "Liver ultrasound"}, {"letter": "C", "text": "Diagnostic paracentesis"}, {"letter": "D", "text": "Serum transferrin saturation"}, {"letter": "E", "text": "Transient elastography"}], "answer": "C", "explanation": "Every cirrhotic admission gets the belly tapped, and a patient who has deteriorated gets it before anything else: the fluid answers whether the peritoneum is infected and whether the fluid is a pressure problem at all. Elastography stages fibrosis, which is not the question in a patient whose disease has already declared itself."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A liver stiffness of 21 kPa with platelets of 96,000/mm³ and an INR of 1.4"}, {"letter": "B", "text": "A liver stiffness of 16.4 kPa with a normal albumin, INR, and bilirubin"}, {"letter": "C", "text": "An ascitic count of 180 PMN/mm³ with a gradient of 1.8 g/dL"}, {"letter": "D", "text": "An AST of 118 U/L and an ALT of 48 U/L with a GGT of 310 U/L"}, {"letter": "E", "text": "Hepatic steatosis with an ALT of 96 U/L and an AST of 58 U/L"}], "answer": "C", "explanation": "A gradient of 1.1 g/dL or more means the fluid is driven by portal pressure, and a count below 250 PMN/mm³ excludes spontaneous bacterial peritonitis. Elastography values describe a liver that has not yet failed, which is not this patient."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Decompensated cirrhosis"}, {"letter": "B", "text": "Compensated cirrhosis"}, {"letter": "C", "text": "Alcohol-related fatty liver"}, {"letter": "D", "text": "Cirrhosis"}, {"letter": "E", "text": "MASLD with steatohepatitis (MASH)"}], "answer": "A", "explanation": "Ascites, jaundice, and encephalopathy are decompensating events, and each of them separately defines the transition out of the compensated state. A compensated patient still has a normal albumin, INR, and bilirubin and has had no such event."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "MASLD with steatohepatitis (MASH)"}, {"letter": "B", "text": "Cirrhosis"}, {"letter": "C", "text": "Decompensated cirrhosis"}, {"letter": "D", "text": "Compensated cirrhosis"}, {"letter": "E", "text": "Alcohol-related fatty liver"}], "answer": "C", "explanation": "A high gradient with a sterile fluid confirms portal hypertensive ascites, and the bilirubin, INR, and MELD record the loss of synthetic function. Every marker of compensation has been lost, which is what the label decompensated means."}, {"key": "mgmt", "path": "both", "stem": "He has decompensated cirrhosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Treat the precipitant, restrict sodium, and refer for transplantation"}, {"letter": "B", "text": "Cause-directed therapy with vaccination and surveillance"}, {"letter": "C", "text": "Alcohol abstinence, vaccination, and six-month imaging for hepatocellular carcinoma"}, {"letter": "D", "text": "Diet and exercise aiming at 10% body-weight loss"}, {"letter": "E", "text": "Abstinence with counseling and naltrexone 50 mg daily"}], "answer": "A", "explanation": "Every decompensation is a hunt for a precipitant — infection, bleeding, dehydration, alcohol, or a new medication — and here the nonsteroidal drug is the one that can be withdrawn today. Surveillance and vaccination belong to a patient who is still compensated; this one needs a transplant referral regardless of score after a decompensating event."}, {"key": "counsel", "path": "both", "stem": "He has decompensated cirrhosis. Which of the following is the most appropriate approach to analgesia?", "options": [{"letter": "A", "text": "Acetaminophen at full dose while the ammonia remains normal"}, {"letter": "B", "text": "Acetaminophen at full dose once the bilirubin falls below 2 mg/dL"}, {"letter": "C", "text": "A nonsteroidal anti-inflammatory drug at the lowest effective dose"}, {"letter": "D", "text": "Acetaminophen, no more than 2 g daily"}, {"letter": "E", "text": "Acetaminophen, no more than 4 g daily"}], "answer": "D", "explanation": "Acetaminophen is tolerated in cirrhosis at a reduced ceiling of 2 g daily. Nonsteroidal drugs are avoided entirely because they precipitate renal failure and variceal bleeding, which is exactly the sequence that brought him in."}]}, {"case": "LI-B1", "group": "LI-B", "section": "the cirrhotic with ascites who gets worse", "objective": "", "vignette_workup": "A 63-year-old man presents to the primary care clinic with six weeks of increasing abdominal girth and a 9 kg weight gain. He fills up after a few bites and is breathless lying flat. He has cirrhosis from metabolic dysfunction–associated steatotic liver disease and takes lisinopril for hypertension; he eats canned soup and takeout most days and has never had a paracentesis. His temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 88/min, respirations are 18/min, and oxygen saturation is 96% on room air. His flanks bulge, there is shifting dullness and a fluid wave, and he has 2+ pitting edema to mid-shin. His abdomen is not tender, he has no fever, and there is no asterixis.", "labs_workup": [["Serum sodium", "133 mEq/L"], ["Creatinine", "1.0 mg/dL"], ["Abdominal ultrasound", "Large-volume ascites around a nodular liver, spleen 15 cm"]], "vignette_recog": "A 63-year-old man presents to the primary care clinic with six weeks of increasing abdominal girth and a 9 kg weight gain. He fills up after a few bites and is breathless lying flat. He has cirrhosis from metabolic dysfunction–associated steatotic liver disease and takes lisinopril for hypertension; he eats canned soup and takeout most days and has never had a paracentesis. His temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 88/min, respirations are 18/min, and oxygen saturation is 96% on room air. His flanks bulge, there is shifting dullness and a fluid wave, and he has 2+ pitting edema to mid-shin. His abdomen is not tender, he has no fever, and there is no asterixis. He is sent the same day for a diagnostic paracentesis with a simultaneous serum albumin.", "labs_recog": [["Serum sodium", "133 mEq/L"], ["Creatinine", "1.0 mg/dL"], ["Abdominal ultrasound", "Large-volume ascites around a nodular liver, spleen 15 cm"], ["Serum albumin / ascitic albumin", "3.1 g/dL / 0.9 g/dL (gradient 2.2 g/dL)"], ["Ascitic total protein", "1.2 g/dL"], ["Ascitic cell count", "60 PMN/mm³, culture negative"], ["Ascitic cytology", "Negative for malignant cells"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Echocardiogram with Doppler and bubble study"}, {"letter": "B", "text": "Right heart catheterization"}, {"letter": "C", "text": "Diagnostic paracentesis with a same-day serum albumin"}, {"letter": "D", "text": "Doppler ultrasound of the hepatic veins"}, {"letter": "E", "text": "Urine sodium with serum creatinine and creatinine clearance"}], "answer": "C", "explanation": "New-onset ascites is tapped, and the serum albumin has to be drawn the same day for the gradient to mean anything. The tap also answers the two questions that change management today — whether the fluid is infected and whether it is malignant."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A right-sided transudative effusion in a cirrhotic patient with ascites"}, {"letter": "B", "text": "A creatinine of 2.6 mg/dL with a urine sodium of 6 mEq/L and a urine osmolality of 640 mOsm/kg"}, {"letter": "C", "text": "A gradient of 2.2 g/dL with 60 PMN/mm³ and an ascitic protein of 1.2 g/dL"}, {"letter": "D", "text": "Hepatic vein flow not demonstrated, with tender hepatomegaly and new ascites"}, {"letter": "E", "text": "An ascitic count of 620 PMN/mm³ with a creatinine risen from 1.0 to 1.9 mg/dL"}], "answer": "C", "explanation": "A gradient of 1.1 g/dL or more identifies portal hypertension with about 97% accuracy, and the low ascitic total protein is what cirrhosis gives — heart failure raises it. A count below 250 PMN/mm³ excludes spontaneous bacterial peritonitis."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hepatorenal syndrome"}, {"letter": "B", "text": "Spontaneous bacterial peritonitis"}, {"letter": "C", "text": "Hepatohydrothorax"}, {"letter": "D", "text": "Budd-Chiari syndrome"}, {"letter": "E", "text": "Portal hypertensive ascites"}], "answer": "E", "explanation": "A non-tender abdomen without fever, a sterile fluid with a low cell count, and a normal creatinine leave uncomplicated portal hypertensive ascites. Peritonitis needs 250 PMN/mm³ or more, and hepatorenal syndrome needs kidney failure that persists after volume is replaced."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Budd-Chiari syndrome"}, {"letter": "B", "text": "Hepatohydrothorax"}, {"letter": "C", "text": "Hepatorenal syndrome"}, {"letter": "D", "text": "Spontaneous bacterial peritonitis"}, {"letter": "E", "text": "Portal hypertensive ascites"}], "answer": "E", "explanation": "A high gradient places the problem in the portal circulation, and the low ascitic total protein places it in the liver rather than the right heart. The sterile fluid and normal creatinine exclude the two complications that would change treatment today."}, {"key": "mgmt", "path": "both", "stem": "He has portal hypertensive ascites. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "B", "text": "Stopping diuretics with intravenous albumin, then terlipressin"}, {"letter": "C", "text": "Cefotaxime 2 g intravenously every 8 hours with intravenous albumin"}, {"letter": "D", "text": "Anticoagulation with urgent referral for a portosystemic shunt"}, {"letter": "E", "text": "Sodium restriction and diuretics with therapeutic thoracentesis"}], "answer": "A", "explanation": "Sodium drives the fluid, so restriction below 2 g daily plus a distal-and-loop diuretic pair is first-line, and the sodium of 133 mEq/L adds free water restriction. The angiotensin-converting-enzyme inhibitor is stopped rather than continued alongside diuretics, because the two together drop renal perfusion."}, {"key": "escalate", "path": "both", "stem": "After eight weeks of sodium restriction with spironolactone and furosemide his ascites continues to reaccumulate. Which of the following should be done next?", "options": [{"letter": "A", "text": "Stopping diuretics with intravenous albumin, then terlipressin"}, {"letter": "B", "text": "Cefotaxime 2 g intravenously every 8 hours with intravenous albumin"}, {"letter": "C", "text": "Therapeutic thoracentesis with continued sodium restriction"}, {"letter": "D", "text": "Serial large-volume paracentesis with albumin replacement"}, {"letter": "E", "text": "Anticoagulation with urgent referral for a portosystemic shunt"}], "answer": "D", "explanation": "Ascites that no longer responds to salt restriction and diuretics is refractory, and the fluid then has to be removed mechanically while transplant assessment proceeds. Albumin accompanies the taps, and a shunt is considered only if the bilirubin, INR, and mental status allow it."}, {"key": "counsel", "path": "both", "stem": "He has portal hypertensive ascites. Which of the following is the most appropriate approach to albumin replacement at the time of paracentesis?", "options": [{"letter": "A", "text": "Give albumin whenever 4 L or more of fluid is removed"}, {"letter": "B", "text": "Give albumin only if the serum sodium falls below 130 mEq/L"}, {"letter": "C", "text": "Give albumin at every paracentesis regardless of the volume removed"}, {"letter": "D", "text": "Give albumin only if the serum albumin is below 2 g/dL"}, {"letter": "E", "text": "Give albumin only if the creatinine rises after the procedure"}], "answer": "A", "explanation": "Removing a large volume collapses the effective circulating volume, and the resulting circulatory dysfunction produces acute kidney injury, hyponatremia, and encephalopathy. Waiting for the creatinine to rise means treating the complication instead of preventing it."}]}, {"case": "LI-B3", "group": "LI-B", "section": "the cirrhotic with ascites who gets worse", "objective": "", "vignette_workup": "A 48-year-old man on the hepatology unit has had falling urine output for four days and a creatinine that keeps climbing despite volume, and his ascites no longer responds to diuretics. He has advanced alcohol-related cirrhosis, was treated for spontaneous bacterial peritonitis one week ago, and had 6 L removed by paracentesis at an outside hospital two weeks ago without albumin replacement. He has taken no nonsteroidal anti-inflammatory drugs and has received no contrast and no aminoglycosides. His temperature is 36.6°C (97.9°F), blood pressure is 88/54 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 96% on room air. He has tense ascites, jaundice, and hypotension, with no flank tenderness and no rash.", "labs_workup": [["Creatinine", "2.6 mg/dL, risen from 1.0"], ["Creatinine clearance", "22 mL/min"], ["Urine sodium", "6 mEq/L"], ["Urine osmolality", "640 mOsm/kg"], ["Urine protein", "190 mg/dL"], ["Urine sediment", "No eosinophils, fewer than 50 RBC/hpf"], ["Urine volume", "380 mL/24 h"], ["Serum sodium", "126 mEq/L"], ["Renal ultrasound", "Normal, with no hydronephrosis"]], "vignette_recog": "A 48-year-old man on the hepatology unit has had falling urine output for four days and a creatinine that keeps climbing despite volume, and his ascites no longer responds to diuretics. He has advanced alcohol-related cirrhosis, was treated for spontaneous bacterial peritonitis one week ago, and had 6 L removed by paracentesis at an outside hospital two weeks ago without albumin replacement. He has taken no nonsteroidal anti-inflammatory drugs and has received no contrast and no aminoglycosides. His temperature is 36.6°C (97.9°F), blood pressure is 88/54 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 96% on room air. He has tense ascites, jaundice, and hypotension, with no flank tenderness and no rash. His diuretics are stopped and he is given intravenous albumin.", "labs_recog": [["Creatinine", "2.6 mg/dL, risen from 1.0"], ["Creatinine clearance", "22 mL/min"], ["Urine sodium", "6 mEq/L"], ["Urine osmolality", "640 mOsm/kg"], ["Urine protein", "190 mg/dL"], ["Urine sediment", "No eosinophils, fewer than 50 RBC/hpf"], ["Urine volume", "380 mL/24 h"], ["Serum sodium", "126 mEq/L"], ["Renal ultrasound", "Normal, with no hydronephrosis"], ["Volume challenge", "Creatinine 2.5 mg/dL after 48 hours of diuretic withdrawal and 1.5 L of albumin"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Echocardiogram with Doppler and bubble study"}, {"letter": "B", "text": "A volume challenge with albumin after stopping diuretics"}, {"letter": "C", "text": "Ascitic culture inoculated into blood culture bottles at the bedside"}, {"letter": "D", "text": "Direct venography of the hepatic veins"}, {"letter": "E", "text": "Abdominal ultrasound of the liver and spleen"}], "answer": "B", "explanation": "The kidneys here are structurally normal, so the question is whether they are simply underfilled. Withdrawing diuretics and expanding the plasma volume separates prerenal azotemia, which corrects, from the diagnosis of exclusion, which does not."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A negative bubble study with normal right heart pressures"}, {"letter": "B", "text": "Obstructed hepatic venous outflow"}, {"letter": "C", "text": "Large-volume ascites around a nodular liver with splenomegaly"}, {"letter": "D", "text": "No sustained fall in the creatinine, which remains at 2.5 mg/dL"}, {"letter": "E", "text": "Single-organism growth of Escherichia coli"}], "answer": "D", "explanation": "Splanchnic vasodilation in advanced cirrhosis leaves the renal circulation vasoconstricted no matter how much volume is given, so plasma expansion does not correct the creatinine. A fall would have named the failure prerenal and ended the workup."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Portal hypertensive ascites"}, {"letter": "B", "text": "Budd-Chiari syndrome"}, {"letter": "C", "text": "Spontaneous bacterial peritonitis"}, {"letter": "D", "text": "Hepatorenal syndrome"}, {"letter": "E", "text": "Hepatohydrothorax"}], "answer": "D", "explanation": "This is renal failure diagnosed by exclusion: shock, fluid losses, nephrotoxins, parenchymal disease, and obstruction have all been ruled out, and the kidneys are sonographically normal. A urine sodium under 10 mEq/L with a concentrated urine and a bland sediment is the avid, structurally intact kidney."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Spontaneous bacterial peritonitis"}, {"letter": "B", "text": "Portal hypertensive ascites"}, {"letter": "C", "text": "Budd-Chiari syndrome"}, {"letter": "D", "text": "Hepatorenal syndrome"}, {"letter": "E", "text": "Hepatohydrothorax"}], "answer": "D", "explanation": "A creatinine above 1.5 mg/dL that does not improve after diuretics are stopped and plasma is expanded, in a cirrhotic with a normal renal ultrasound and a bland sediment, is hepatorenal syndrome. The ascitic fluid is sterile and the infection was treated, so the kidney failure is not septic."}, {"key": "mgmt", "path": "both", "stem": "He has hepatorenal syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "B", "text": "Anticoagulation with urgent referral for a portosystemic shunt"}, {"letter": "C", "text": "Stopping the diuretics with intravenous albumin"}, {"letter": "D", "text": "Therapeutic thoracentesis with sodium restriction"}, {"letter": "E", "text": "Cefotaxime 2 g intravenously every 8 hours with intravenous albumin"}], "answer": "C", "explanation": "Diuretics are part of the problem, not the treatment, and 25% albumin restores the effective circulating volume the splanchnic bed has stolen. Pushing more diuretic at diuretic-resistant ascites is the reflex that produced this syndrome in the first place."}, {"key": "escalate", "path": "both", "stem": "After 48 hours of diuretic withdrawal and intravenous albumin his creatinine remains at 2.5 mg/dL. Which of the following should be added next?", "options": [{"letter": "A", "text": "Anticoagulation with a portosystemic shunt"}, {"letter": "B", "text": "Therapeutic thoracentesis"}, {"letter": "C", "text": "Cefotaxime 2 g intravenously every 8 hours"}, {"letter": "D", "text": "Spironolactone with furosemide"}, {"letter": "E", "text": "Terlipressin"}], "answer": "E", "explanation": "When the creatinine stays above 1.5 mg/dL despite albumin, a splanchnic vasoconstrictor is added to redirect blood back toward the kidney; midodrine with octreotide is the alternative. Dialysis is only a bridge, and transplantation is the definitive treatment."}, {"key": "counsel", "path": "both", "stem": "He has hepatorenal syndrome. Which of the following is the most appropriate approach to starting terlipressin?", "options": [{"letter": "A", "text": "Start it only once the MELD score exceeds 35"}, {"letter": "B", "text": "Start it when the creatinine stays above 1.5 mg/dL despite albumin"}, {"letter": "C", "text": "Start it when the diuretics are stopped, before albumin is given"}, {"letter": "D", "text": "Start it only if the urine sodium rises above 10 mEq/L"}, {"letter": "E", "text": "Start it only once hemodialysis has been begun"}], "answer": "B", "explanation": "Albumin comes first, and the vasoconstrictor is added for the creatinine that does not answer it. Above a MELD of 35 the drug is withheld rather than started, because that patient needs a transplant; it is also stopped for abdominal pain suggesting ischemia and for hypoxia or pulmonary edema."}]}, {"case": "LI-C3", "group": "LI-C", "section": "the cirrhotic who is short of breath", "objective": "", "vignette_workup": "A 66-year-old man presents to the emergency department with five days of worsening breathlessness, a dry cough, and right-sided chest fullness; this is his third such episode this year. He has cirrhosis with ascites and takes spironolactone and furosemide, and two right-sided effusions have been drained in the past six months. He has never smoked and has no heart failure and no prior pneumonia. His temperature is 36.9°C (98.4°F), blood pressure is 110/68 mm Hg, pulse is 94/min, respirations are 24/min, and oxygen saturation is 90% on room air. There is dullness to percussion with decreased breath sounds and reduced tactile fremitus over the right lower chest, and shifting dullness in the abdome
