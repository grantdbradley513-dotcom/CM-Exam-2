 common trigger and he has coexisting reflux, so the opening move is twice-daily acid suppression rather than anything mechanical. Dilation treats a sphincter that will not open or a fixed narrowing, and neither is present here."}, {"key": "escalate", "path": "both", "stem": "After eight weeks of a twice-daily proton pump inhibitor his chest pain is unchanged. Which of the following should be added?", "options": [{"letter": "A", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "B", "text": "Oncologic staging with surgical resection"}, {"letter": "C", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "D", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "E", "text": "A tricyclic antidepressant"}], "answer": "E", "explanation": "A tricyclic is the agent of choice when chest pain rather than dysphagia is the leading complaint. The alternative additions — hyoscyamine, dicyclomine, diltiazem, isosorbide dinitrate — all relax the lower esophageal sphincter, which is exactly what should not be done in a patient who already has heartburn and regurgitation."}, {"key": "counsel", "path": "both", "stem": "He has diffuse esophageal spasm. Which of the following is the most appropriate approach to excluding cardiac disease and a structural esophageal lesion?", "options": [{"letter": "A", "text": "Exclude both only after a trial of twice-daily acid suppression fails"}, {"letter": "B", "text": "Exclude both only when the episodes last longer than several minutes"}, {"letter": "C", "text": "Exclude both in every patient before this diagnosis is made"}, {"letter": "D", "text": "Exclude both only when the symptoms have lasted more than a year"}, {"letter": "E", "text": "Exclude both only when the barium swallow is normal"}], "answer": "C", "explanation": "This is a diagnosis of exclusion, and the exclusion comes first rather than after a therapeutic trial has failed. Crushing retrosternal pain is a cardiac presentation until it is proved otherwise, and a structural lesion can reproduce every one of his symptoms."}]}, {"case": "ES-C2", "group": "ES-C", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "objective": "", "vignette_workup": "A 52-year-old woman comes to the primary care clinic with three episodes of difficulty swallowing solid food over the past six months. Each began with steak or fresh bread and brought brief chest discomfort while the bite was stuck; the bite then cleared and she ate normally for weeks afterward, and one episode required her to bring the bite back up. The episodes have not become more frequent or more severe. She has chronic heartburn and takes an antacid a few times a month. She has had no bleeding and has lost no weight. Her temperature is 36.6°C (97.9°F), blood pressure is 122/74 mm Hg, pulse is 70/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination is normal, with no pallor and no cervical adenopathy.", "labs_workup": [], "vignette_recog": "A 52-year-old woman comes to the primary care clinic with three episodes of difficulty swallowing solid food over the past six months. Each began with steak or fresh bread and brought brief chest discomfort while the bite was stuck; the bite then cleared and she ate normally for weeks afterward, and one episode required her to bring the bite back up. The episodes have not become more frequent or more severe. She has chronic heartburn and takes an antacid a few times a month. She has had no bleeding and has lost no weight. Her temperature is 36.6°C (97.9°F), blood pressure is 122/74 mm Hg, pulse is 70/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination is normal, with no pallor and no cervical adenopathy. She undergoes contrast radiography followed by endoscopy.", "labs_recog": [["Barium swallow with a 13 mm tablet", "Thin ring at the gastroesophageal junction with a lumen of about 11 mm; the 13 mm tablet arrests at it; a small sliding hiatal hernia is present"], ["Upper endoscopy", "Thin mucosal ring at the gastroesophageal junction, with no stricture and no mass"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A modified barium swallow for a cervical web"}, {"letter": "B", "text": "CBC with iron studies"}, {"letter": "C", "text": "Barium swallow with a 13 mm barium tablet"}, {"letter": "D", "text": "High-resolution esophageal manometry"}, {"letter": "E", "text": "EGD with proximal and distal biopsies"}], "answer": "C", "explanation": "Intermittent solid-food dysphagia points at a fixed narrowing, and a swallowed tablet of known diameter both demonstrates the narrowing and measures whether the lumen is tight enough to matter. Manometry is for a motor problem, and iron studies address a different level of the esophagus altogether."}, {"key": "result", "path": "W", "stem": "Which of the following initial results is most likely to be present?", "options": [{"letter": "A", "text": "A thin web in the upper, anterior cervical esophagus"}, {"letter": "B", "text": "Concentric rings and linear furrows with white exudates"}, {"letter": "C", "text": "A \"bird's beak\" narrowing with a dilated esophagus and retained food"}, {"letter": "D", "text": "A thin ring at the gastroesophageal junction with a lumen of 11 mm and a hiatal hernia"}, {"letter": "E", "text": "A smooth, tapered, concentric distal narrowing 2.5 cm long with a lumen of 9 mm"}], "answer": "D", "explanation": "A shelf of mucosa at the squamocolumnar junction narrows the lumen without shortening or scarring the esophagus, so a large bite lodges and everything smaller passes. A tapered segment centimetres long is scar from acid injury and gives steadily progressive rather than episodic symptoms."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Esophageal web with Plummer-Vinson syndrome"}, {"letter": "B", "text": "Eosinophilic esophagitis"}, {"letter": "C", "text": "Peptic stricture"}, {"letter": "D", "text": "Schatzki ring"}, {"letter": "E", "text": "Esophageal carcinoma"}], "answer": "D", "explanation": "Episodic, non-progressive solid-food dysphagia in a middle-aged patient with weeks of normal swallowing in between is a ring rather than a stricture or a tumour. A web sits in the cervical esophagus with iron deficiency, and carcinoma progresses over weeks with weight loss."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Esophageal web with Plummer-Vinson syndrome"}, {"letter": "B", "text": "Esophageal carcinoma"}, {"letter": "C", "text": "Peptic stricture"}, {"letter": "D", "text": "Eosinophilic esophagitis"}, {"letter": "E", "text": "Schatzki ring"}], "answer": "E", "explanation": "A thin mucosal shelf at the gastroesophageal junction with a hiatal hernia and a lumen under 13 mm is the ring, and a lumen at or below 13 mm is what makes one symptomatic. A stricture is a tapered segment 1 to 4 cm long, and eosinophilic disease shows rings and furrows through the length of the esophagus with more than 15 eosinophils per high-power field."}, {"key": "mgmt", "path": "both", "stem": "She has a Schatzki ring. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "B", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "C", "text": "Oncologic staging with surgical resection"}, {"letter": "D", "text": "Endoscopic dilation with dietary modification"}, {"letter": "E", "text": "Oral iron replacement"}], "answer": "D", "explanation": "Disrupting the ring restores the lumen, and changing how she eats keeps the next large bite from lodging while the ring is still there. A proton pump inhibitor follows the dilation, since the pathogenesis is thought to be chronic acid injury."}, {"key": "counsel", "path": "both", "stem": "She has a Schatzki ring. Which of the following is the most appropriate dietary recommendation?", "options": [{"letter": "A", "text": "Chew thoroughly, cut food small, and eat slowly at every meal"}, {"letter": "B", "text": "Do so only until the endoscopic dilation has been performed"}, {"letter": "C", "text": "Do so only while the measured lumen remains below 13 mm"}, {"letter": "D", "text": "Do so only if a second food impaction occurs"}, {"letter": "E", "text": "Do so only at meals containing steak, crackers, rice, or fresh bread"}], "answer": "A", "explanation": "The mechanical advice applies to eating generally, not to a list of trigger foods, because any bite large enough will lodge at a ring. It is also not a temporary measure that stops at dilation — rings recur, and the habit is what prevents the next impaction."}]}, {"case": "ES-D1", "group": "ES-D", "section": "chronic heartburn and what years of it produce", "objective": "", "vignette_workup": "A 41-year-old woman comes to the primary care clinic with two years of burning behind the breastbone. It comes on within an hour of a meal and again when she lies down at night, and twice a week she wakes with a sour, bitter fluid at the back of her throat. She has a morning cough, her voice is hoarse by the end of the day, and she has a sensation of a lump in her throat. She has hypertension and takes amlodipine, which she began three years ago. Her body mass index is 33 kg/m². She has not lost weight, has never vomited blood, and swallows normally. Her temperature is 36.7°C (98.1°F), blood pressure is 128/80 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination is normal, with no epigastric tenderness, no pallor, and no cervical adenopathy.", "labs_workup": [["Medication review", "Amlodipine identified as an agent that lowers lower esophageal sphincter tone"]], "vignette_recog": "A 41-year-old woman comes to the primary care clinic with two years of burning behind the breastbone. It comes on within an hour of a meal and again when she lies down at night, and twice a week she wakes with a sour, bitter fluid at the back of her throat. She has a morning cough, her voice is hoarse by the end of the day, and she has a sensation of a lump in her throat. She has hypertension and takes amlodipine, which she began three years ago. Her body mass index is 33 kg/m². She has not lost weight, has never vomited blood, and swallows normally. Her temperature is 36.7°C (98.1°F), blood pressure is 128/80 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. Examination is normal, with no epigastric tenderness, no pallor, and no cervical adenopathy. She is treated and returns eight weeks later.", "labs_recog": [["Medication review", "Amlodipine identified as an agent that lowers lower esophageal sphincter tone, and changed"], ["Response to an 8-week empiric trial", "Complete relief of the burning and the regurgitation on a once-daily agent taken 30 minutes before breakfast"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Barium swallow with a 13 mm barium tablet"}, {"letter": "B", "text": "EGD with proximal and distal biopsies"}, {"letter": "C", "text": "EGD with four-quadrant biopsies"}, {"letter": "D", "text": "An empiric proton pump inhibitor trial for 8 weeks"}, {"letter": "E", "text": "Barium swallow (esophagram)"}], "answer": "D", "explanation": "With typical symptoms and no alarm feature, the diagnosis is made clinically and the therapeutic trial is both the test and the treatment. Endoscopy is reserved for alarm features or for failure after eight weeks, and contrast radiography answers an anatomic question she has not raised."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Concentric rings and linear furrows with white exudates"}, {"letter": "B", "text": "Confluent linear erosions in the distal esophagus"}, {"letter": "C", "text": "Gastric folds above the diaphragmatic pinch with the junction below it"}, {"letter": "D", "text": "Salmon-colored mucosa extending 4 cm above the gastroesophageal junction"}, {"letter": "E", "text": "Complete relief of symptoms on the trial"}], "answer": "E", "explanation": "Blocking the final step of acid secretion removes the injurious refluxate, and symptoms that are driven by acid disappear with it. About two-thirds of these patients have a normal endoscopy, so the absence of visible mucosal damage is expected rather than reassuring against the diagnosis."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Barium swallow with a 13 mm tablet"}, {"letter": "B", "text": "Esophageal biopsy histology"}, {"letter": "C", "text": "Histology of four-quadrant biopsies"}, {"letter": "D", "text": "Ambulatory esophageal pH study"}, {"letter": "E", "text": "Upper endoscopy with biopsy"}], "answer": "D", "explanation": "Only ambulatory pH monitoring measures the thing itself — how long the distal esophagus is acidic and whether her symptoms fall during those periods. It is reserved for an unclear picture and is not needed when a typical presentation resolves on a trial, which is why it was not performed here."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peptic stricture"}, {"letter": "B", "text": "Paraesophageal hiatal hernia"}, {"letter": "C", "text": "Erosive reflux esophagitis"}, {"letter": "D", "text": "Gastroesophageal reflux disease"}, {"letter": "E", "text": "Barrett's esophagus"}], "answer": "D", "explanation": "Postprandial and recumbent burning with regurgitation, cough, and hoarseness in an obese patient on an agent that lowers sphincter tone is reflux disease, and the response to therapy settles it. A stricture would have given progressive solid-food dysphagia, and a paraesophageal hernia gives postprandial fullness with little heartburn."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Barrett's esophagus"}, {"letter": "B", "text": "Peptic stricture"}, {"letter": "C", "text": "Gastroesophageal reflux disease"}, {"letter": "D", "text": "Erosive reflux esophagitis"}, {"letter": "E", "text": "Paraesophageal hiatal hernia"}], "answer": "C", "explanation": "Complete resolution on an eight-week empiric trial in a patient with typical symptoms and no alarm feature is what makes the diagnosis clinically — no endoscopy is required. Metaplastic columnar mucosa above the junction and confluent erosions are endoscopic diagnoses that were never sought here because nothing indicated a scope."}, {"key": "mgmt", "path": "both", "stem": "She has gastroesophageal reflux disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Surgical repair with fundoplication"}, {"letter": "B", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "C", "text": "Long-term daily proton pump inhibitor with endoscopic surveillance"}, {"letter": "D", "text": "Long-term daily proton pump inhibitor"}, {"letter": "E", "text": "Lifestyle change with a daily proton pump inhibitor for 8 weeks"}], "answer": "E", "explanation": "Weight loss, an elevated head of the bed, no food for two to three hours before lying down, and review of agents that lower sphincter tone treat the mechanism, and the acid suppression is time-limited with an attempt at discontinuation afterward. Indefinite therapy belongs to erosive disease and to metaplasia, and surgery is for failure of medical therapy."}, {"key": "escalate", "path": "both", "stem": "Her nighttime symptoms persist after eight weeks of a once-daily proton pump inhibitor. Which of the following should be done next?", "options": [{"letter": "A", "text": "A twice-daily proton pump inhibitor with a bedtime H2 antagonist"}, {"letter": "B", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "C", "text": "Surgical repair with fundoplication"}, {"letter": "D", "text": "Long-term daily proton pump inhibitor with endoscopic surveillance"}, {"letter": "E", "text": "An elimination diet with swallowed topical fluticasone"}], "answer": "A", "explanation": "H2 antagonists competitively block the parietal-cell receptor and have their largest effect on nocturnal acid, which is why they are the bedtime addition to a twice-daily pump inhibitor. Fundoplication is reserved for disease refractory to medical therapy, and she has not yet had it."}, {"key": "counsel", "path": "both", "stem": "She has gastroesophageal reflux disease. Which of the following is the most appropriate approach to upper endoscopy?", "options": [{"letter": "A", "text": "Endoscopy first only when symptoms have lasted more than 2 years"}, {"letter": "B", "text": "Endoscopy first only when the heartburn is nocturnal"}, {"letter": "C", "text": "Endoscopy first in any patient who has an alarm feature"}, {"letter": "D", "text": "Endoscopy first only when the body mass index exceeds 30 kg/m²"}, {"letter": "E", "text": "Endoscopy first in every patient who reports heartburn"}], "answer": "C", "explanation": "Dysphagia, odynophagia, weight loss, gastrointestinal bleeding, anemia, vomiting, or new onset at an older age mean the scope comes before empiric therapy, because a trial of acid suppression can mask a malignancy while it grows. Nocturnal symptoms, obesity, and duration are ordinary features of reflux and do not by themselves buy an endoscopy."}]}, {"case": "BI-B1", "group": "BI-B", "section": "the acutely ill patient with a gallbladder complication", "objective": "", "vignette_workup": "A 45-year-old woman presents to the emergency department with steady severe right upper quadrant pain that began about ten hours ago, roughly an hour after a fried meal, and has not let up. The pain radiates to her right scapula, and she has been vomiting and cannot eat. She has had two shorter attacks after fatty meals in the past year, both of which resolved within a few hours. She takes a combined oral contraceptive and has four children. Her temperature is 38.6°C (101.5°F), blood pressure is 128/78 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 98% on room air. She is ill-appearing and lies still on the stretcher. Palpation beneath the right costal margin during deep inspiration produces pain and a catch of her breath, and she guards the right upper quadrant. She is not jaundiced.", "labs_workup": [["WBC", "15,600/mm³ with 84% neutrophils and a left shift"], ["AST / ALT", "48 U/L / 52 U/L"], ["Alkaline phosphatase", "96 U/L"], ["Total bilirubin", "0.9 mg/dL"], ["Lipase", "34 U/L"]], "vignette_recog": "A 45-year-old woman presents to the emergency department with steady severe right upper quadrant pain that began about ten hours ago, roughly an hour after a fried meal, and has not let up. The pain radiates to her right scapula, and she has been vomiting and cannot eat. She has had two shorter attacks after fatty meals in the past year, both of which resolved within a few hours. She takes a combined oral contraceptive and has four children. Her temperature is 38.6°C (101.5°F), blood pressure is 128/78 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 98% on room air. She is ill-appearing and lies still on the stretcher. Palpation beneath the right costal margin during deep inspiration produces pain and a catch of her breath, and she guards the right upper quadrant. She is not jaundiced.", "labs_recog": [["WBC", "15,600/mm³ with 84% neutrophils and a left shift"], ["AST / ALT", "48 U/L / 52 U/L"], ["Alkaline phosphatase", "96 U/L"], ["Total bilirubin", "0.9 mg/dL"], ["Lipase", "34 U/L"], ["Right upper quadrant ultrasound", "Gallstones with a gallbladder wall of 5 mm, a distended lumen, pericholecystic fluid, and a positive sonographic Murphy's sign; common bile duct 4 mm"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HIDA scan"}, {"letter": "B", "text": "Right upper quadrant ultrasound"}, {"letter": "C", "text": "Abdominal CT"}, {"letter": "D", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "E", "text": "Blood cultures"}], "answer": "B", "explanation": "Ultrasound is the first study in the right upper quadrant every time — it is fast, needs no contrast, and shows both stones and wall inflammation. CT is unreliable here, because cholesterol stones are hypoattenuating and the rest are isodense to bile, and it detects only about half of these cases."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Stones with a 2 mm wall, no fluid, and a negative sonographic Murphy's sign"}, {"letter": "B", "text": "Stones with a 5 mm wall, pericholecystic fluid, and a positive sonographic Murphy's sign"}, {"letter": "C", "text": "Small bowel obstruction with an ectopic gallstone and pneumobilia"}, {"letter": "D", "text": "A 6 mm wall with pericholecystic fluid and a positive sonographic Murphy's sign, with no stones"}, {"letter": "E", "text": "A common bile duct dilated to 12 mm with alkaline phosphatase out of proportion to the aminotransferases"}], "answer": "B", "explanation": "Total obstruction of the cystic duct by a stone inflames the wall, which thickens and weeps fluid into the pericholecystic space, and pressing directly on the inflamed organ arrests inspiration. That triad carries a positive predictive value of 90 to 95%, and a normal 4 mm duct with a normal bilirubin places the obstruction above the common duct."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "HIDA scan"}, {"letter": "B", "text": "Abdominal CT"}, {"letter": "C", "text": "Blood cultures"}, {"letter": "D", "text": "Antimitochondrial antibody testing"}, {"letter": "E", "text": "Magnetic resonance cholangiopancreatography"}], "answer": "A", "explanation": "Cholescintigraphy tests cystic duct patency directly: tracer that fills the duct and the bowel but never enters the gallbladder proves the duct is obstructed, with a sensitivity of about 95%. It is the study for an inconclusive ultrasound, not a routine addition to a conclusive one."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Biliary colic"}, {"letter": "B", "text": "Cholangitis"}, {"letter": "C", "text": "Gallstone ileus"}, {"letter": "D", "text": "Acute cholecystitis"}, {"letter": "E", "text": "Acalculous cholecystitis"}], "answer": "D", "explanation": "Pain that began after a fatty meal and has not resolved in ten hours, with fever and leukocytosis, has moved past colic into inflammation of the wall. Cholangitis brings jaundice with hypotension and confusion, and gallstone ileus obstructs the bowel rather than the cystic duct."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gallstone ileus"}, {"letter": "B", "text": "Acalculous cholecystitis"}, {"letter": "C", "text": "Cholangitis"}, {"letter": "D", "text": "Biliary colic"}, {"letter": "E", "text": "Acute cholecystitis"}], "answer": "E", "explanation": "Stones with a thickened wall, pericholecystic fluid, and a positive sonographic Murphy's sign in a febrile patient with leukocytosis is calculous inflammation of the gallbladder. The acalculous form carries the same wall findings without stones and arises in the critically ill, and colic resolves within hours with a thin wall and no fever."}, {"key": "mgmt", "path": "both", "stem": "She has acute calculous cholecystitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Nasogastric decompression followed by enterolithotomy"}, {"letter": "B", "text": "Intravenous antibiotics followed by urgent ERCP"}, {"letter": "C", "text": "Percutaneous cholecystostomy drainage with intravenous antibiotics"}, {"letter": "D", "text": "Dietary fat avoidance with analgesia"}, {"letter": "E", "text": "Intravenous antibiotics with laparoscopic cholecystectomy in 24 to 48 hours"}], "answer": "E", "explanation": "She is kept nothing by mouth with intravenous fluids and antibiotics, and the diseased organ comes out on the same admission, most within 24 to 48 hours. Recurrence is high if the gallbladder is left in place, and NSAIDs rather than opioids are the first-line analgesic."}, {"key": "escalate", "path": "both", "stem": "She becomes hypotensive with a rising lactate and is judged too unstable for the operating room. Which of the following should be done next?", "options": [{"letter": "A", "text": "Dietary fat avoidance with analgesia"}, {"letter": "B", "text": "Elective laparoscopic cholecystectomy"}, {"letter": "C", "text": "Nasogastric decompression followed by enterolithotomy"}, {"letter": "D", "text": "Urgent ERCP after intravenous antibiotics"}, {"letter": "E", "text": "Percutaneous cholecystostomy with delayed cholecystectomy"}], "answer": "E", "explanation": "The obstructed, infected gallbladder still has to be drained, and a tube placed through the skin achieves source control without an anesthetic. The operation is deferred until she can tolerate it rather than abandoned."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to imaging an older adult with right upper quadrant pain?", "options": [{"letter": "A", "text": "Ultrasound only once the patient has a documented fever"}, {"letter": "B", "text": "Ultrasound only once the bilirubin or alkaline phosphatase is raised"}, {"letter": "C", "text": "Ultrasound only once the white blood cell count is elevated"}, {"letter": "D", "text": "Ultrasound only once the pain has lasted more than 24 hours"}, {"letter": "E", "text": "Ultrasound even when the patient is afebrile"}], "answer": "E", "explanation": "Up to 90% of elderly patients with this disease are afebrile, so a normal temperature does not exclude it — and it is the most common surgical cause of abdominal pain in that age group. A raised bilirubin or alkaline phosphatase is a signal to look further for a stone in the common duct, not the threshold for looking at all."}]}, {"case": "BI-C3", "group": "BI-C", "section": "jaundice", "objective": "", "vignette_workup": "A 21-year-old man comes to the primary care clinic because his roommate noticed two days ago that his eyes had turned yellow, during a flu-like illness. He has had no pain, no dark urine, and no itching. He has had two similar brief episodes before, one after a religious fast and one during final examinations. He has eaten and drunk very little for three days with the viral illness, and he ran a half-marathon two weeks ago. He does not drink alcohol. A maternal uncle has had episodes of yellow eyes. His temperature is 37.2°C (99.0°F), blood pressure is 116/72 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has scleral icterus; there is no hepatomegaly, no splenomegaly, no right upper quadrant tenderness, and no excoriations.", "labs_workup": [["AST / ALT", "22 U/L / 20 U/L"], ["Alkaline phosphatase", "66 U/L"], ["Albumin", "4.4 g/dL"], ["Hemoglobin / hematocrit", "14.8 g/dL / 44%"], ["Reticulocytes", "1.2%"]], "vignette_recog": "A 21-year-old man comes to the primary care clinic because his roommate noticed two days ago that his eyes had turned yellow, during a flu-like illness. He has had no pain, no dark urine, and no itching. He has had two similar brief episodes before, one after a religious fast and one during final examinations. He has eaten and drunk very little for three days with the viral illness, and he ran a half-marathon two weeks ago. He does not drink alcohol. A maternal uncle has had episodes of yellow eyes. His temperature is 37.2°C (99.0°F), blood pressure is 116/72 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has scleral icterus; there is no hepatomegaly, no splenomegaly, no right upper quadrant tenderness, and no excoriations.", "labs_recog": [["Total bilirubin", "2.8 mg/dL"], ["Direct (conjugated) bilirubin", "0.3 mg/dL"], ["Indirect (unconjugated) bilirubin", "2.5 mg/dL"], ["AST / ALT", "22 U/L / 20 U/L"], ["Alkaline phosphatase", "66 U/L"], ["Albumin", "4.4 g/dL"], ["Hemoglobin / hematocrit", "14.8 g/dL / 44%"], ["Reticulocytes", "1.2%"], ["Panels repeated over 12 to 18 months", "Unchanged"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Magnetic resonance cholangiopancreatography"}, {"letter": "B", "text": "Fractionated total bilirubin"}, {"letter": "C", "text": "Antimitochondrial antibody testing"}, {"letter": "D", "text": "Right upper quadrant ultrasound"}, {"letter": "E", "text": "Liver function tests with alkaline phosphatase and GGT"}], "answer": "B", "explanation": "Splitting the bilirubin into its conjugated and unconjugated fractions is the branch point of every jaundice workup, and it costs nothing. Imaging the ducts answers a question that only arises once the conjugated fraction is raised, and the transaminases and alkaline phosphatase here are already normal."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An alkaline phosphatase of 540 U/L with a normal bilirubin and an elevated IgM"}, {"letter": "B", "text": "An alkaline phosphatase of 612 U/L with a positive p-ANCA and a negative antimitochondrial antibody"}, {"letter": "C", "text": "A common bile duct dilated to 12 mm with an alkaline phosphatase of 468 U/L and a white count of 21,400/mm³"}, {"letter": "D", "text": "An indirect bilirubin of 2.5 mg/dL with a normal direct fraction"}, {"letter": "E", "text": "A common bile duct dilated to 9 mm with a total bilirubin of 5.2 mg/dL and an alkaline phosphatase of 396 U/L"}], "answer": "D", "explanation": "The defect is in conjugation, so bilirubin accumulates before it is joined to glucuronic acid and the direct fraction stays normal. Nothing obstructs and nothing is inflamed, which is why the alkaline phosphatase, transaminases, and albumin are untouched."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cholangitis"}, {"letter": "B", "text": "Choledocholithiasis"}, {"letter": "C", "text": "Primary sclerosing cholangitis"}, {"letter": "D", "text": "Gilbert's syndrome"}, {"letter": "E", "text": "Primary biliary cholangitis"}], "answer": "D", "explanation": "Brief, painless, recurrent jaundice brought on by fasting, dehydration, illness, and overexertion in a well young man with a family history is the benign conjugation defect. A stone in the duct hurts and raises the cholestatic enzymes, and cholangitis adds fever and hypotension."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Choledocholithiasis"}, {"letter": "B", "text": "Primary sclerosing cholangitis"}, {"letter": "C", "text": "Gilbert's syndrome"}, {"letter": "D", "text": "Primary biliary cholangitis"}, {"letter": "E", "text": "Cholangitis"}], "answer": "C", "explanation": "An isolated unconjugated hyperbilirubinemia with entirely normal liver tests and no evidence of hemolysis, unchanged on panels repeated over a year and a half, is a diagnosis of exclusion reached by ruling everything else out. A reticulocyte count of 1.2% with a normal hemoglobin excludes the other cause of an unconjugated rise."}, {"key": "mgmt", "path": "both", "stem": "He has Gilbert's syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Surveillance with ursodeoxycholic acid"}, {"letter": "B", "text": "Ursodeoxycholic acid 12 to 15 mg/kg daily"}, {"letter": "C", "text": "ERCP with sphincterotomy and stone extraction"}, {"letter": "D", "text": "Reassurance with no treatment"}, {"letter": "E", "text": "Intravenous antibiotics followed by urgent ERCP"}], "answer": "D", "explanation": "The condition is benign, the liver is structurally normal, and the jaundice is cosmetic — there is nothing to treat. It is the most common inherited disorder of bilirubin processing, present in roughly 5% of the population."}, {"key": "counsel", "path": "both", "stem": "He has Gilbert's syndrome. Which of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Reassurance alone only if he avoids drugs cleared by glucuronidation"}, {"letter": "B", "text": "Reassurance alone only while the total bilirubin stays below 2.5 mg/dL"}, {"letter": "C", "text": "Reassurance alone only while the episodes follow fasting or dehydration"}, {"letter": "D", "text": "Reassurance alone only until a repeat panel at 18 months is unchanged"}, {"letter": "E", "text": "Reassurance alone, whatever the frequency of the episodes"}], "answer": "E", "explanation": "Fasting, dehydration, illness, menstruation, alcohol, and overexertion all bring the jaundice out, and none of them changes the management — the yellow simply becomes visible once the total passes about 2.5 mg/dL. The same conjugation defect is worth knowing about before a drug cleared by glucuronidation such as irinotecan is given, but that is a caution rather than a condition on reassurance."}]}, {"case": "GA-A4", "group": "GA-A", "section": "chronic epigastric pain or burning with meals", "objective": "", "vignette_workup": "A 71-year-old woman is referred from the primary care clinic for endoscopy after four months of epigastric pain that comes on with meals, with belching and fullness after eating, early satiety, and nausea. She has lost 6 kg without trying. She takes naproxen twice daily and low-dose aspirin, and she was recently on prednisone for a rheumatoid arthritis flare. She has never smoked, does not drink alcohol, and takes no anticoagulant. Her temperature is 36.7°C (98.1°F), blood pressure is 128/76 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. She has epigastric tenderness without rebound or guarding, no palpable mass, and no supraclavicular node; her stool is brown.", "labs_workup": [["Hemoglobin / hematocrit", "10.4 g/dL / 31%"], ["MCV", "76 fL"], ["Ferritin", "8 ng/mL"], ["Transferrin saturation", "7%"], ["BUN / creatinine", "16 mg/dL / 0.9 mg/dL"], ["Fecal occult blood test", "Positive"], ["H. pylori stool antigen", "Negative"]], "vignette_recog": "A 71-year-old woman is referred from the primary care clinic for endoscopy after four months of epigastric pain that comes on with meals, with belching and fullness after eating, early satiety, and nausea. She has lost 6 kg without trying. She takes naproxen twice daily and low-dose aspirin, and she was recently on prednisone for a rheumatoid arthritis flare. She has never smoked, does not drink alcohol, and takes no anticoagulant. Her temperature is 36.7°C (98.1°F), blood pressure is 128/76 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. She has epigastric tenderness without rebound or guarding, no palpable mass, and no supraclavicular node; her stool is brown. She proceeds to upper endoscopy.", "labs_recog": [["Hemoglobin / hematocrit", "10.4 g/dL / 31%"], ["MCV", "76 fL"], ["Ferritin", "8 ng/mL"], ["Transferrin saturation", "7%"], ["Fecal occult blood test", "Positive"], ["H. pylori stool antigen", "Negative"], ["Upper endoscopy with biopsy", "A 2 cm ulcer on the lesser curvature of the gastric antrum with a smooth base and radiating folds, clean base with no stigmata; biopsies benign and negative for H. pylori"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}, {"letter": "B", "text": "Repeat H. pylori stool antigen testing"}, {"letter": "C", "text": "EGD with biopsy"}, {"letter": "D", "text": "Urea breath test"}, {"letter": "E", "text": "Secretin stimulation test"}], "answer": "C", "explanation": "Endoscopy is the only study that both finds the lesion and takes tissue from it, and at 71 with weight loss, anemia, and a positive occult blood test she has every reason to go up front. A second organism test repeats an answer she already has, and gastrin studies are for refractory multiple distal duodenal ulcers with diarrhea."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Inflamed, eroded gastric mucosa with no ulcer crater"}, {"letter": "B", "text": "A hypokalemic, hypochloremic metabolic alkalosis"}, {"letter": "C", "text": "No organic lesion, with biopsies negative for H. pylori"}, {"letter": "D", "text": "A paradoxical gastrin rise of more than 200 pg/mL after intravenous secretin"}, {"letter": "E", "text": "An antral ulcer with a smooth base and radiating folds, with benign biopsies"}], "answer": "E", "explanation": "Prostaglandin blockade strips the mucosa of its bicarbonate and mucus defence, and a defect that erodes past the muscularis mucosae is a crater rather than an erosion — which is what bleeds enough to make her iron deficient. Radiating folds converging on a smooth base is the benign morphology, but appearance alone never settles a gastric ulcer."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "H. pylori gastritis"}, {"letter": "B", "text": "Functional dyspepsia"}, {"letter": "C", "text": "Peptic ulcer disease"}, {"letter": "D", "text": "Zollinger-Ellison syndrome"}, {"letter": "E", "text": "NSAID-induced gastritis"}], "answer": "C", "explanation": "Pain that arrives with the meal, early satiety, and weight loss is the gastric ulcer pattern, and iron deficiency anemia with a positive occult blood test means a lesion that bleeds. Functional dyspepsia has no lesion and no anemia, and gastritis produces erosions rather than a crater."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "NSAID-induced gastritis"}, {"letter": "B", "text": "Peptic ulcer disease"}, {"letter": "C", "text": "Zollinger-Ellison syndrome"}, {"letter": "D", "text": "H. pylori gastritis"}, {"letter": "E", "text": "Functional dyspepsia"}], "answer": "B", "explanation": "A 2 cm antral crater in a woman on a twice-daily NSAID, low-dose aspirin, and recent corticosteroids is NSAID ulcer disease, and the negative organism test on both stool and biopsy removes the alternative cause. Age over 60, antithrombotics, corticosteroids, and a high-dose NSAID are four of her risk factors at once."}, {"key": "mgmt", "path": "both", "stem": "She has an NSAID-induced gastric ulcer. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "High-dose proton pump inhibitor with surgical resection of the tumor"}, {"letter": "B", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}, {"letter": "C", "text": "Quadruple therapy for 14 days with a twice-daily proton pump inhibitor"}, {"letter": "D", "text": "Diet and lifestyle change with a proton pump inhibitor"}, {"letter": "E", "text": "Withdrawal of the offending agent with a proton pump inhibitor for 8 weeks"}], "answer": "E", "explanation": "The drug that caused the ulcer has to stop before acid suppression can heal it, and smoking and alcohol come out at the same time. Eradication therapy treats an organism she does not have, on stool antigen and on biopsy."}, {"key": "escalate", "path": "both", "stem": "She has completed eight weeks of a proton pump inhibitor with the naproxen stopped, and her epigastric pain persists. Which of the following should be done next?", "options": [{"letter": "A", "text": "Repeat upper endoscopy with biopsy"}, {"letter": "B", "text": "High-dose proton pump inhibitor with surgical resection of the tumor"}, {"letter": "C", "text": "Diet and lifestyle change with a proton pump inhibitor"}, {"letter": "D", "text": "Quadruple therapy for 14 days with a twice-daily proton pump inhibitor"}, {"letter": "E", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}], "answer": "A", "explanation": "Every gastric ulcer is re-scoped to prove that it healed and that the lesion was benign, and an ulcer that has not healed after the agent was withdrawn is the one that most needs looking at again. A benign appearance and a benign first set of biopsies do not close the question."}, {"key": "counsel", "path": "both", "stem": "She has an NSAID-induced gastric ulcer and still needs an anti-inflammatory for her rheumatoid arthritis. Which of the following is the most appropriate approach to choosing one?", "options": [{"letter": "A", "text": "Celecoxib alone, since she is already taking low-dose aspirin"}, {"letter": "B", "text": "Naproxen whatever the cardiovascular risk, with no acid suppression"}, {"letter": "C", "text": "Celecoxib whatever the cardiovascular risk, with no acid suppression"}, {"letter": "D", "text": "Celecoxib when cardiovascular risk is low and naproxen when it is high"}, {"letter": "E", "text": "Naproxen when cardiovascular risk is low and celecoxib when it is high"}], "answer": "D", "explanation": "The agent is chosen by cardiovascular risk rather than by gastrointestinal risk, because the gastrointestinal risk can be covered with a proton pump inhibitor and the cardiovascular risk cannot. Her concurrent low-dose aspirin cancels celecoxib's gastrointestinal advantage outright, so acid suppression is added whichever agent is used."}]}, {"case": "GA-C2", "group": "GA-C", "section": "early satiety and vomiting of retained food", "objective": "", "vignette_workup": "A 47-year-old man is referred to the gastroenterology clinic with two months of dull upper abdominal pain that came on insidiously, with nausea and occasional vomiting, a poor appetite, and a feeling of fullness after a few bites. He has lost 5 kg. He had a partial gastrectomy for a bleeding ulcer six years ago and his stomach has ground food poorly ever since, and he eats large amounts of raw vegetable and fruit fiber. He has no psychiatric history and does not pull his hair. His temperature is 36.8°C (98.2°F), blood pressure is 122/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 98% on room air. His abdomen is soft with a vague epigastric fullness and no discrete mass; he has halitosis, no distension, and no succussion splash.", "labs_workup": [["Hemoglobin / hematocrit", "13.0 g/dL / 39%"], ["MCV", "88 fL"], ["WBC", "6,400/mm³"], ["Platelets", "232,000/mm³"], ["Albumin", "3.6 g/dL"], ["Comprehensive metabolic panel", "Otherwise normal"]], "vignette_recog": "A 47-year-old man is referred to the gastroenterology clinic with two months of dull upper abdominal pain that came on insidiously, with nausea and occasional vomiting, a poor appetite, and a feeling of fullness after a few bites. He has lost 5 kg. He had a partial gastrectomy for a bleeding ulcer six years ago and his stomach has ground food poorly ever since, and he eats large amounts of raw vegetable and fruit fiber. He has no psychiatric history and does not pull his hair. His temperature is 36.8°C (98.2°F), blood pressure is 122/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 98% on room air. His abdomen is soft with a vague epigastric fullness and no discrete mass; he has halitosis, no distension, and no succussion splash.", "labs_recog": [["Hemoglobin / hematocrit", "13.0 g/dL / 39%"], ["MCV", "88 fL"], ["WBC", "6,400/mm³"], ["Platelets", "232,000/mm³"], ["Albumin", "3.6 g/dL"], ["Upper endoscopy", "A dark green-brown ball of amorphous matted material filling the gastric antrum, with intact mucosa beneath"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}, {"letter": "B", "text": "Urea breath test"}, {"letter": "C", "text": "Gastric emptying scintigraphy"}, {"letter": "D", "text": "Upper endoscopy"}, {"letter": "E", "text": "Secretin stimulation test"}], "answer": "D", "explanation": "Endoscopy looks directly at the stomach and separates an obstructing lesion from a stomach that empties poorly, which is the branch point in a patient with early satiety and weight loss. A functional emptying study measures transit but cannot tell you what is sitting in the antrum."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A dark green-brown ball of matted material in the antrum"}, {"letter": "B", "text": "An antral ulcer with iron deficiency anemia"}, {"letter": "C", "text": "A narrowed, scarred pylorus with retained gastric contents"}, {"letter": "D", "text": "Retained food with a patent pylorus and no obstructing lesion"}, {"letter": "E", "text": "A normal endoscopy with a hypokalemic alkalosis"}], "answer": "A", "explanation": "A stomach that can no longer grind after a partial gastrectomy leaves indigestible plant fiber to mat together into a single mass, which fills the antrum and produces fullness after a few bites. The mucosa beneath is intact, which is what separates this from an ulcerating or scarring lesion."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gastroparesis"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "Cyclical vomiting syndrome"}, {"letter": "D", "text": "Peptic ulcer disease"}, {"letter": "E", "text": "Gastric bezoar"}], "answer": "E", "explanation": "Impaired grinding after gastric surgery plus a high load of raw plant fiber is how a mass of indigestible material forms, and it obstructs the lumen with material rather than with scar. Gastroparesis leaves an empty stomach that empties slowly, and cyclical vomiting comes in discrete bouts with normal health between."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gastric outlet obstruction"}, {"letter": "B", "text": "Cyclical vomiting syndrome"}, {"letter": "C", "text": "Peptic ulcer disease"}, {"letter": "D", "text": "Gastric bezoar"}, {"letter": "E", "text": "Gastroparesis"}], "answer": "D", "explanation": "An intraluminal ball of amorphous matted material with intact mucosa beneath is a bezoar, and vegetable matter is the most common kind — typically in men in their forties and fifties. Hair bezoars occur in women in their twenties and carry a psychiatric association he does not have."}, {"key": "mgmt", "path": "both", "stem": "He has a gastric phytobezoar. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Tight glycemic control with small low-fat, low-fiber meals"}, {"letter": "B", "text": "Diet and lifestyle change with a proton pump inhibitor"}, {"letter": "C", "text": "Intravenous fluid repletion with ondansetron"}, {"letter": "D", "text": "Chemical dissolution with Coca-Cola lavage"}, {"letter": "E", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}], "answer": "D", "explanation": "Dissolution is noninvasive and inexpensive, and it is tried first: the low pH softens the mass, the high sodium bicarbonate content is mucolytic, and the carbon dioxide bubbles work their way into it. Cellulase, papain, and acetylcysteine act on the same principle."}, {"key": "escalate", "path": "both", "stem": "After twelve hours of lavage the mass is unchanged. Which of the following should be done next?", "options": [{"letter": "A", "text": "Endoscopic removal with a prokinetic"}, {"letter": "B", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}, {"letter": "C", "text": "Intravenous fluid repletion with ondansetron"}, {"letter": "D", "text": "Tight glycemic control with small low-fat, low-fiber meals"}, {"letter": "E", "text": "A proton pump inhibitor for 8 weeks with agent withdrawal"}], "answer": "A", "explanation": "Endoscopic fragmentation and retrieval is the adjuvant when dissolution alone does not work, and metoclopramide shortens the time to clearance by moving the softened fragments along. Surgery is held back for outright treatment failure or for a hardened bezoar."}, {"key": "counsel", "path": "both", "stem": "He has a gastric phytobezoar. Which of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Watch for obstructive symptoms only if the bezoar recurs"}, {"letter": "B", "text": "Watch for obstructive symptoms only during the hours of lavage"}, {"letter": "C", "text": "Watch for obstructive symptoms only until the endoscopy is repeated"}, {"letter": "D", "text": "Watch for obstructive symptoms only if surgery becomes necessary"}, {"letter": "E", "text": "Watch for obstructive symptoms for up to 6 weeks after dissolution"}], "answer": "E", "explanation": "Fragments that break loose can lodge downstream, and small bowel obstruction has followed dissolution by as much as six weeks. Recurrence runs at about one in five, so the watch does not end when the antrum clears."}]}, {"case": "DI-B3", "group": "DI-B", "section": "vomiting or diarrhea within hours of a shared meal (preformed and in-gut toxin)", "objective": "", "vignette_workup": "A 61-year-old woman presents to the emergency department with watery diarrhea and cramping that began about twelve hours after a meal at a catered banquet. She has vomited very little and has had no fever. Several other guests who ate at the banquet have the same illness. She takes atorvastatin. Her temperature is 37.2°C (99.0°F), blood pressure is 128/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. She is afebrile, with mild diffuse abdominal tenderness and no rebound; her mucous membranes are moist and her skin turgor is normal.", "labs_workup": [], "vignette_recog": "A 61-year-old woman presents to the emergency department with watery diarrhea and cramping that began about twelve hours after a meal at a catered banquet. She has vomited very little and has had no fever. The meal was turkey and gravy that had been cooked the day before, cooled, and reheated on a steam table, and several other guests who ate it have the same illness. She takes atorvastatin. Her temperature is 37.2°C (99.0°F), blood pressure is 128/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. She is afebrile, with mild diffuse abdominal tenderness and no rebound; her mucous membranes are moist and her skin turgor is normal.", "labs_recog": [], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool multiplex PCR panel"}, {"letter": "B", "text": "Stool ova and parasite exam on three separate days"}, {"letter": "C", "text": "Clinical diagnosis with no stool study"}, {"letter": "D", "text": "Stool culture for enteric pathogens"}, {"letter": "E", "text": "Stool Giardia antigen immunoassay"}], "answer": "C", "explanation": "Mild, afebrile, self-limited illness in several people who shared one meal is diagnosed by the interval between the meal and the symptoms, and no stool study changes what is done. Testing is reserved for illness that is severe, febrile, bloody, or prolonged."}, {"key": "result", "path": "W", "stem": "Which of the following additional features is most likely to be elicited on further history?", "options": [{"letter": "A", "text": "The meal was eggs or poultry, and she has had fever with mucoid stool"}, {"letter": "B", "text": "The meal was mayonnaise, egg salad, or a cream pastry"}, {"letter": "C", "text": "The meal was rice that had been reheated"}, {"letter": "D", "text": "The meal was meat or gravy that had been poorly reheated"}, {"letter": "E", "text": "The meal was raw shellfish eaten one to three days earlier"}], "answer": "D", "explanation": "Spores survive normal cooking and germinate in food that is cooled and held badly, and the illness comes from enterotoxin released in the gut rather than from toxin already in the food — which is why the delay runs 6 to 24 hours instead of 1 to 8. Diarrhea rather than vomiting is the dominant symptom for the same reason."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Clostridium perfringens food poisoning"}, {"letter": "B", "text": "Norovirus gastroenteritis"}, {"letter": "C", "text": "Salmonella gastroenteritis"}, {"letter": "D", "text": "Bacillus cereus food poisoning"}, {"letter": "E", "text": "Staphylococcus aureus food poisoning"}], "answer": "A", "explanation": "A twelve-hour interval with diarrhea leading and almost no vomiting, in an afebrile patient at a shared meal, is the in-gut toxin rather than a preformed one. Staphylococcal and Bacillus illness begin within hours and are dominated by vomiting, and Salmonella brings fever with blood-tinged stool."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Norovirus gastroenteritis"}, {"letter": "B", "text": "Clostridium perfringens food poisoning"}, {"letter": "C", "text": "Bacillus cereus food poisoning"}, {"letter": "D", "text": "Salmonella gastroenteritis"}, {"letter": "E", "text": "Staphylococcus aureus food poisoning"}], "answer": "B", "explanation": "Meat and gravy cooked ahead, cooled, and reheated on a steam table is the classic vehicle, and the twelve-hour interval with diarrhea rather than vomiting fits the enterotoxin released in the gut. Reheated rice points instead at Bacillus cereus, which begins within 30 minutes to 6 hours and vomits."}, {"key": "counsel", "path": "both", "stem": "She has Clostridium perfringens food poisoning. Which of the following is the most appropriate advice for the caterer?", "options": [{"letter": "A", "text": "Store cooked meat and gravy properly only when it cannot be reheated thoroughly"}, {"letter": "B", "text": "Store cooked meat and gravy properly only when it will be held more than a day"}, {"letter": "C", "text": "Store cooked meat and gravy properly in every case, since cooking does not kill the spores"}, {"letter": "D", "text": "Store cooked meat and gravy properly only after a guest has become ill"}, {"letter": "E", "text": "Store cooked meat and gravy properly only when it will be served to a large group"}], "answer": "C", "explanation": "The spores survive ordinary cooking temperatures, so heat is not the control point — how the food is held between cooking and serving is. Relying on a second heating to make cooked meat safe is the error that produced this outbreak."}]}, {"case": "DI-C1", "group": "DI-C", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "objective": "", "vignette_workup": "A 71-year-old woman presents to the emergency department with four days of diarrhea, now eight stools a day with mucus and a blood tinge. She has fever and nausea and has vomited twice. Three days before the diarrhea began she ate a homemade custard made with raw eggs at a family gathering, and two relatives who ate it have the same illness. She had a bioprosthetic aortic valve placed four years ago and takes amlodipine. Her temperature is 38.6°C (101.5°F), blood pressure is 108/66 mm Hg, pulse is 110/min, respirations are 18/min, and oxygen saturation is 97% on room air. She is febrile with dry mucous membranes and a fall in blood pressure on standing, and her abdomen is diffusely tender with cramping and no rebound and no right lower quadrant localization.", "labs_workup": [["WBC", "15,600/mm³ with a left shift"], ["Hemoglobin / hematocrit", "12.9 g/dL / 39%"], ["Platelets", "254,000/mm³"], ["Sodium", "132 mEq/L"], ["Potassium", "3.1 mEq/L"], ["Bicarbonate", "20 mEq/L"], ["BUN / creatinine", "32 mg/dL / 1.4 mg/dL"]], "vignette_recog": "A 71-year-old woman presents to the emergency department with four days of diarrhea, now eight stools a day with mucus and a blood tinge. She has fever and nausea and has vomited twice. Three days before the diarrhea began she ate a homemade custard made with raw eggs at a family gathering, and two relatives who ate it have the same illness. She had a bioprosthetic aortic valve placed four years ago and takes amlodipine. Her temperature is 38.6°C (101.5°F), blood pressure is 108/66 mm Hg, pulse is 110/min, respirations are 18/min, and oxygen saturation is 97% on room air. She is febrile with dry mucous membranes and a fall in blood pressure on standing, and her abdomen is diffusely tender with cramping and no rebound and no right lower quadrant localization.", "labs_recog": [["Stool multiplex PCR", "Positive for Salmonella"], ["WBC", "15,600/mm³ with a left shift"], ["Hemoglobin / hematocrit", "12.9 g/dL / 39%"], ["Platelets", "254,000/mm³"], ["Sodium", "132 mEq/L"], ["Potassium", "3.1 mEq/L"], ["Bicarbonate", "20 mEq/L"], ["BUN / creatinine", "32 mg/dL / 1.4 mg/dL"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool PCR with a stool and serum antigen assay"}, {"letter": "B", "text": "Stool Giardia antigen test"}, {"letter": "C", "text": "Stool ova and parasite exam on three separate days"}, {"letter": "D", "text": "Fecal calprotectin with CRP and IgA anti-tissue transglutaminase"}, {"letter": "E", "text": "Stool multiplex PCR"}], "answer": "E", "explanation": "Fever with blood or mucus in the stool moves this out of the self-limited category and into one where the organism decides whether antibiotics are given at all. A multiplex panel names the invasive bacterial pathogens in hours; protozoal and serologic testing answers a question raised by weeks of illness, not four days."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Bloody stool with minimal fever and a panel positive for Shiga-toxin-producing E. coli"}, {"letter": "B", "text": "Right lower quadrant tenderness and a panel positive for Yersinia"}, {"letter": "C", "text": "Severe periumbilical pain with ten or more stools and a panel positive for Campylobacter"}, {"letter": "D", "text": "Blood-tinged mucoid stool with a panel positive for Salmonella"}, {"letter": "E", "text": "Bloody mucoid stool with tenesmus and a panel positive for Shigella"}], "answer": "D", "explanation": "The organism reaches the gut in food contaminated by fecal matter — eggs, poultry, and milk products above all — and invades the mucosa, which is why the stool carries mucus and a blood tinge and why she has a fever and a left shift. Onset 8 to 72 hours after the exposure fits the three-day interval here."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "EGD with duodenal biopsy"}, {"letter": "B", "text": "Serum antigen assay for E. histolytica"}, {"letter": "C", "text": "Stool microscopic exam for cysts and trophozoites"}, {"letter": "D", "text": "Small bowel aspirate culture"}, {"letter": "E", "text": "Stool culture"}], "answer": "E", "explanation": "Culture isolates the organism itself and gives the susceptibilities that matter once a decision to treat has been made. A single stool specimen is enough for a bacterial pathogen, unlike the parasitic studies, which need repeated collections."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Salmonella gastroenteritis"}, {"letter": "C", "text": "Campylobacter jejuni enteritis"}, {"letter": "D", "text": "Enterohemorrhagic E. coli infection"}, {"letter": "E", "text": "Shigellosis"}], "answer": "B", "explanation": "A raw-egg vehicle, a three-day interval, and a cluster among the people who shared the dish point at the egg-borne invasive pathogen. Shigella brings tenesmus and spreads fecal-orally in daycare, Campylobacter brings severe periumbilical pain, and Shiga-toxin-producing E. coli brings bloody stool with little or no fever."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Campylobacter jejuni enteritis"}, {"letter": "B", "text": "Enterohemorrhagic E. coli infection"}, {"letter": "C", "text": "Salmonella gastroenteritis"}, {"letter": "D", "text": "Yersinia enterocolitica enteritis"}, {"letter": "E", "text": "Shigellosis"}], "answer": "C", "explanation": "The panel names the organism, and the raw-egg custard with a three-day interval and two other affected diners is the matching exposure. The fever generally settles within 48 to 72 hours and the diarrhea within 4 to 10 days."}, {"key": "mgmt", "path": "both", "stem": "She has non-typhoidal Salmonella gastroenteritis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Fluid and electrolyte replacement with ciprofloxacin"}, {"letter": "B", "text": "Supportive care with azithromycin for three days"}, {"letter": "C", "text": "Metronidazole followed by paromomycin"}, {"letter": "D", "text": "Supportive care and hydration with monitoring for hemolytic uremic syndrome"}, {"letter": "E", "text": "Fluid and electrolyte replacement alone, with antibiotics withheld"}], "answer": "A", "explanation": "Most patients with this infection are not given antibiotics, and withholding them is the reflex the case is testing — but she is over 50 and has a prosthetic valve, and each of those alone puts her in the treat category. Her potassium of 3.1 mEq/L and creatinine of 1.4 mg/dL are repleted alongside."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to antibiotics in non-typhoidal Salmonella gastroenteritis?", "options": [{"letter": "A", "text": "Withhold them only from patients with no cardiac or valvular abnormality"}, {"letter": "B", "text": "Withhold them only from patients whose fever has already resolved"}, {"letter": "C", "text": "Withhold them only until the stool culture has isolated the organism"}, {"letter": "D", "text": "Withhold them from most patients, since they prolong excretion of the organism"}, {"letter": "E", "text": "Withhold them only from patients under 50 years of age"}], "answer": "D", "explanation": "Treatment lengthens the time the organism is shed in the stool, so the default in an otherwise well patient is to treat the losses and not the bug. The exceptions are defined and narrow: age under 12 months or over 50, toxicity, bacteremia, immunocompromise, cardiac, valvular, or endovascular abnormality, and substantial joint disease."}]}, {"case": "DI-D3", "group": "DI-D", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "objective": "", "vignette_workup": "A 47-year-old man comes to the primary care clinic with two days of watery diarrhea, cramping, nausea, and vomiting; one stool was streaked with blood. He ate raw oysters at a coastal restaurant two days before the symptoms began, and his wife, who ate the same oysters, is also ill. He works as a boat mechanic, has not travelled abroad, and has taken no antibiotics. His temperature is 38.1°C (100.6°F), blood pressure is 126/78 mm Hg, pulse is 94/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has a low-grade fever and diffuse abdominal tenderness without rebound; his mucous membranes are moist and his skin turgor is normal.", "labs_workup": [], "vignette_recog": "A 47-year-old man comes to the primary care clinic with two days of watery diarrhea, cramping, nausea, and vomiting; one stool was streaked with blood. He ate raw oysters at a coastal restaurant two days before the symptoms began, and his wife, who ate the same oysters, is also ill. He works as a boat mechanic, has not travelled abroad, and has taken no antibiotics. His temperature is 38.1°C (100.6°F), blood pressure is 126/78 mm Hg, pulse is 94/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has a low-grade fever and diffuse abdominal tenderness without rebound; his mucous membranes are moist and his skin turgor is normal.", "labs_recog": [["Stool multiplex PCR", "Positive for Vibrio parahaemolyticus"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Empiric azithromycin with no stool study"}, {"letter": "B", "text": "Stool ova and parasite exam on three separate days"}, {"letter": "C", "text": "Fecal calprotectin with CRP and IgA anti-tissue transglutaminase"}, {"letter": "D", "text": "Stool multiplex PCR"}, {"letter": "E", "text": "Stool Giardia antigen test"}], "answer": "D", "explanation": "Blood in the stool with fever after a discrete food exposure calls for the panel that names the invasive bacterial pathogens, because which organism it is decides whether he is treated and whether anything must be reported. Empiric therapy without testing belongs to watery, non-bloody traveller's diarrhea."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Bloody mucoid stool with tenesmus and high fever, with a panel positive for Shigella"}, {"letter": "B", "text": "Watery stool turning bloody with fecal leukocytes present, with a panel positive for enteroinvasive E. coli"}, {"letter": "C", "text": "Bloody stool with minimal or no fever, with a panel positive for Shiga-toxin-producing E. coli"}, {"letter": "D", "text": "Watery, sometimes bloody diarrhea 1 to 3 days after raw shellfish, with a panel positive for V. parahaemolyticus"}, {"letter": "E", "text": "Severe periumbilical pain with ten or more stools, with a panel positive for Campylobacter"}], "answer": "D", "explanation": "The organism lives in warm coastal water and concentrates in filter-feeding shellfish, so raw oysters are the vehicle and the incubation runs 1 to 3 days. The illness is largely watery with only a streak of blood, which is why the fever stays low-grade."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Blood cultures"}, {"letter": "B", "text": "Stool culture"}, {"letter": "C", "text": "Stool antigen assay for Giardia"}, {"letter": "D", "text": "Serum antigen assay for E. histolytica"}, {"letter": "E", "text": "A specially ordered O157:H7 culture"}], "answer": "B", "explanation": "Isolating the organism on culture confirms what the molecular panel detected and gives an isolate for public health follow-up of a shellfish-associated cluster. A specially ordered O157:H7 culture is added only when Shiga-toxin-producing E. coli is the concern."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Enterohemorrhagic E. coli (O157:H7) infection"}, {"letter": "B", "text": "Shigellosis"}, {"letter": "C", "text": "Vibrio parahaemolyticus infection"}, {"letter": "D", "text": "Campylobacter jejuni enteritis"}, {"letter": "E", "text": "Enteroinvasive E. coli infection"}], "answer": "C", "explanation": "Raw oysters at the coast, a two-day interval, and a second case in the person who shared the meal is the shellfish organism. Shiga-toxin-producing E. coli gives bloody stool with little or no fever, and enteroinvasive disease follows travel with fecal leukocytes in the stool."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Enteroinvasive E. coli infection"}, {"letter": "B", "text": "Enterohemorrhagic E. coli (O157:H7) infection"}, {"letter": "C", "text": "Campylobacter jejuni enteritis"}, {"letter": "D", "text": "Shigellosis"}, {"letter": "E", "text": "Vibrio parahaemolyticus infection"}], "answer": "E", "explanation": "The panel names the organism and the raw-oyster exposure two days before onset matches its 1 to 3 day incubation. Shigella would bring tenesmus with a high fever, and Campylobacter follows poultry and brings severe periumbilical pain."}, {"key": "mgmt", "path": "both", "stem": "He has Vibrio parahaemolyticus infection. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Azithromycin 1000 mg once with loperamide"}, {"letter": "B", "text": "Ciprofloxacin or azithromycin with supportive care"}, {"letter": "C", "text": "Rehydration alone"}, {"letter": "D", "text": "Azithromycin 500 mg daily for three days"}, {"letter": "E", "text": "Supportive care with monitoring for hemolytic uremic syndrome"}], "answer": "C", "explanation": "He is not toxic, not immunocompromised, and not volume-depleted on examination, and the illness is self-limited — replacing losses is the whole of the treatment. It sits in the same treat-only-if-severe tier as Campylobacter, Yersinia, and Salmonella."}, {"key": "escalate", "path": "both", "stem": "He returns the next day toxic-appearing, with a rising fever and hypotension despite oral rehydration. Which of the following should be done next?", "options": [{"letter": "A", "text": "Metronidazole followed by paromomycin"}, {"letter": "B", "text": "Azithromycin 1000 mg once with loperamide"}, {"letter": "C", "text": "Supportive care with monitoring for hemolytic uremic syndrome"}, {"letter": "D", "text": "Add doxycycline"}, {"letter": "E", "text": "Continue rehydration alone"}], "answer": "D", "explanation": "Severe infection is the indication that moves this organism out of supportive care alone; doxycycline, azithromycin, or a fluoroquinolone are the agents. Continuing to rehydrate a patient who is now toxic and hypotensive treats the losses and ignores the infection."}, {"key": "counsel", "path": "both", "stem": "He has Vibrio parahaemolyticus infection. Which of the following is the most appropriate approach to antibiotic therapy?", "options": [{"letter": "A", "text": "Give them only once the stool culture has isolated the organism"}, {"letter": "B", "text": "Give them only for severe infection or an immunocompromised host"}, {"letter": "C", "text": "Give them to every patient with a positive stool panel"}, {"letter": "D", "text": "Give them only once the diarrhea has lasted more than 3 days"}, {"letter": "E", "text": "Give them only once blood has appeared in the stool"}], "answer": "B", "explanation": "Severity and host immunity, not the presence of the organism or of blood, decide whether this infection is treated — a streak of blood is part of the ordinary illness. Waiting for the culture would delay therapy in exactly the patient who needs it."}]}, {"case": "DI-G4", "group": "DI-G", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "objective": "", "vignette_workup": "A 36-year-old man presents to the emergency department with three weeks of watery diarrhea that has become bloody, with cramping abdominal pain, tenesmus, and painful defecation; he has had fever for the past week. He returned six weeks ago from two months in India, where he drank untreated water and ate from street stalls. He has taken no antibiotics and was healthy before this. His temperature is 38.7°C (101.7°F), blood pressure is 118/72 mm Hg, pulse is 100/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is febrile with diffuse abdominal tenderness, right upper quadrant tenderness, and hepatomegaly with the liver edge 4 cm below the costal margin. There is gross blood on rectal examination.", "labs_workup": [["WBC", "15,300/mm³ with a left shift"], ["Hemoglobin / hematocrit", "13.2 g/dL / 40%"], ["Platelets", "356,000/mm³"], ["Alkaline phosphatase", "218 U/L"], ["AST / ALT", "46 U/L / 52 U/L"], ["Total bilirubin", "1.0 mg/dL"]], "vignette_recog": "A 36-year-old man presents to the emergency department with three weeks of watery diarrhea that has become bloody, with cramping abdominal pain, tenesmus, and painful defecation; he has had fever for the past week. He returned six weeks ago from two months in India, where he drank untreated water and ate from street stalls. He has taken no antibiotics and was healthy before this. His temperature is 38.7°C (101.7°F), blood pressure is 118/72 mm Hg, pulse is 100/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is febrile with diffuse abdominal tenderness, right upper quadrant tenderness, and hepatomegaly with the liver edge 4 cm below the costal margin. There is gross blood on rectal examination.", "labs_recog": [["Stool PCR", "Positive for E. histolytica"], ["Stool and serum antigen assay", "Both positive"], ["WBC", "15,300/mm³ with a left shift"], ["Hemoglobin / hematocrit", "13.2 g/dL / 40%"], ["Platelets", "356,000/mm³"], ["Alkaline phosphatase", "218 U/L"], ["AST / ALT", "46 U/L / 52 U/L"], ["Total bilirubin", "1.0 mg/dL"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool PCR with a stool and serum antigen assay"}, {"letter": "B", "text": "Stool antigen test or PCR for Cryptosporidium"}, {"letter": "C", "text": "IgA anti-tissue transglutaminase with a total IgA"}, {"letter": "D", "text": "Stool ova and parasite exam on multiple collections"}, {"letter": "E", "text": "Stool Giardia antigen test"}], "answer": "A", "explanation": "Weeks of bloody diarrhea after travel to an endemic region, with tender hepatomegaly, calls for the organism-specific assays that detect both intestinal and tissue-invasive disease. A serum antigen assay is the one that speaks to spread beyond the bowel, which the liver findings raise."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Bloody mucoid stool with tenesmus and high fever, with a panel positive for Shigella"}, {"letter": "B", "text": "High-volume watery non-bloody diarrhea with a CD4 count of 58/µL"}, {"letter": "C", "text": "Greasy, foul-smelling, non-bloody stool with a normal white count"}, {"letter": "D", "text": "Trophozoites and cysts on a repeat collection after a negative first exam"}, {"letter": "E", "text": "Bloody stool with tenesmus and tender hepatomegaly, with assays positive for E. histolytica"}], "answer": "E", "explanation": "This protozoan invades the colonic mucosa, which is what produces blood, tenesmus, and painful defecation rather than the greasy non-bloody stool of the malabsorptive protozoa. Spread through the portal circulation gives the tender liver and the mild cholestatic pattern."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Celiac disease"}, {"letter": "B", "text": "Amebiasis"}, {"letter": "C", "text": "Giardiasis"}, {"letter": "D", "text": "Shigellosis"}, {"letter": "E", "text": "Cryptosporidiosis"}], "answer": "B", "explanation": "Weeks rather than days of illness, invasive bloody colitis, and hepatic involvement after untreated water in an endemic region is the invasive protozoan. Giardia produces greasy non-bloody stool with a normal white count, and Cryptosporidium high-volume watery stool in advanced HIV."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Celiac disease"}, {"letter": "B", "text": "Amebiasis"}, {"letter": "C", "text": "Giardiasis"}, {"letter": "D", "text": "Cryptosporidiosis"}, {"letter": "E", "text": "Shigellosis"}], "answer": "B", "explanation": "Positive stool and serum antigen with a positive PCR names the organism, and the travel history is the entry point — the disease is common in India, Southeast Asia, and Mexico and relatively rare in the United States. Shigella runs for days rather than weeks and does not enlarge the liver."}, {"key": "mgmt", "path": "both", "stem": "He has intestinal amebiasis. Which of the following is the most appropriate initial treatment?", "options": [{"letter": "A", "text": "A lifelong gluten-free diet"}, {"letter": "B", "text": "Supportive care with oral rehydration and antiretroviral therapy"}, {"letter": "C", "text": "Metronidazole or tinidazole"}, {"letter": "D", "text": "Ciprofloxacin or azithromycin with supportive care"}, {"letter": "E", "text": "A low FODMAP diet with alcohol and caffeine avoidance"}], "answer": "C", "explanation": "Every case is treated, symptomatic or not, because of the risk of invasive disease, and a nitroimidazole is the agent that reaches the organisms in the tissue. Ninety percent of infections are asymptomatic, which is why treatment is not reserved for the ones that declare themselves."}, {"key": "escalate", "path": "both", "stem": "He completes a course of metronidazole, improves, and returns three weeks later with the same bloody diarrhea. Which of the following should be added?", "options": [{"letter": "A", "text": "Nitazoxanide"}, {"letter": "B", "text": "Paromomycin"}, {"letter": "C", "text": "Supportive care with antiretroviral therapy"}, {"letter": "D", "text": "A lifelong gluten-free diet"}, {"letter": "E", "text": "Ciprofloxacin or azithromycin"}], "answer": "B", "explanation": "The tissue agent does not clear cysts sitting in the lumen, so a luminal agent has to follow it or the infection relapses from the patient's own bowel. This is the single most common error in treating the disease."}, {"key": "counsel", "path": "both", "stem": "He has intestinal amebiasis. Which of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Return for right upper quadrant pain and fever over the coming months"}, {"letter": "B", "text": "Return only if the tenesmus and painful defecation fail to settle"}, {"letter": "C", "text": "Return only if the fever persists beyond the treatment course"}, {"letter": "D", "text": "Return only if he travels to an endemic region again"}, {"letter": "E", "text": "Return only if the bloody diarrhea recurs after treatment"}], "answer": "A", "explanation": "The liver abscess is the complication to watch for, and it arrives weeks to months after the travel with right upp
