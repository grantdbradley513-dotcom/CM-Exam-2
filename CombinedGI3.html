then a low-residue diet, with follow-up in 2 to 4 days; acetaminophen and NSAIDs for pain, and no narcotics.", "objective": "", "section": "focal lower abdominal pain, and the colonic disease underneath it", "pcase": "CO-E3", "pgroup": "CO-E"}, {"id": "16", "group": 16, "stem": "A 73-year-old man presents to the emergency department after three episodes of large-volume maroon and bright red blood per rectum in the past two hours. He has no abdominal pain at all, and became lightheaded standing up in the bathroom. He is chronically constipated, eats little fiber and a lot of red meat, and takes low-dose aspirin along with naproxen for back pain; a colonoscopy four years ago showed diverticulosis. He has had no prior gastrointestinal bleed and takes no anticoagulant. His temperature is 36.8°C (98.2°F), blood pressure is 104/62 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 97% on room air. His conjunctivae are pale, his abdomen is soft and completely non-tender with no guarding or mass, and there is gross blood on rectal examination with no fissure, no prolapsing hemorrhoid, and no palpable rectal mass.\n\nStudies:\n    Hemoglobin / hematocrit — 9.2 g/dL / 28% (13.8 g/dL four months ago)\n    Platelets — 210,000/mm³\n    INR — 1.0\n    BUN / creatinine — 18 mg/dL / 1.1 mg/dL\n    Nasogastric lavage — Clear\n\nAfter resuscitation, which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Anoscopy"}, {"letter": "B", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "C", "text": "Perineal inspection while straining or squatting"}, {"letter": "D", "text": "Inspection with gentle anal stretching"}, {"letter": "E", "text": "Colonoscopy"}], "answer": "E", "explanation": "Large-volume painless bleeding with a hemoglobin drop and a rise in pulse comes from above the anorectum, and the rectal examination has already shown no local source. Colonoscopy has a 69 to 90% yield for localizing the bleeding point and can treat it in the same sitting.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G1", "pgroup": "CO-G"}, {"id": "16A", "group": 16, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A posterior midline crack with raised edges and a sentinel tag"}, {"letter": "B", "text": "Segmental wall thickening with thumbprinting at the splenic flexure, rectum spared"}, {"letter": "C", "text": "Full-thickness rectal wall protruding with concentric stacked-coin folds"}, {"letter": "D", "text": "An engorged plexus above the dentate line that reduces spontaneously"}, {"letter": "E", "text": "Multiple colonic diverticula without inflammation, with a visible vessel"}], "answer": "E", "explanation": "A pouch herniates where a vessel penetrates the wall, so the artery ends up draped over the neck of the sac with only mucosa covering it; when it gives way the bleeding is arterial, brisk, and painless. Ninety percent stop on their own, which is why a vessel can be seen without active bleeding.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G1", "pgroup": "CO-G"}, {"id": "16B", "group": 16, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ischemic colitis"}, {"letter": "B", "text": "Rectal prolapse"}, {"letter": "C", "text": "Diverticular bleed"}, {"letter": "D", "text": "Internal hemorrhoids"}, {"letter": "E", "text": "Anal fissure"}], "answer": "C", "explanation": "Painless, large-volume bleeding with hemodynamic change in a man over 60 on aspirin and an NSAID is a colonic arterial source, and his anorectum is normal on examination. Ischemic colitis is preceded by crampy left-sided pain, and hemorrhoids and fissures streak the stool rather than filling the toilet.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G1", "pgroup": "CO-G"}, {"id": "16C", "group": 16, "stem": "He has had a diverticular bleed that has stopped. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Manual reduction, with surgical repair for full-thickness disease"}, {"letter": "B", "text": "Water, fiber, and sitz baths with stool softeners and topical astringents"}, {"letter": "C", "text": "Fiber 20 to 35 g, fluids, and sitz baths with stool softeners"}, {"letter": "D", "text": "Bowel rest, intravenous fluids, and ciprofloxacin plus metronidazole"}, {"letter": "E", "text": "A high-fiber diet with increased fluids and exercise after resuscitation"}], "answer": "E", "explanation": "Nine in ten of these bleeds stop without intervention, so once he is resuscitated the treatment addresses the constipation and the low-fiber, high-red-meat diet that drove the pouches in the first place. Sitz baths and astringents treat an anorectal source he does not have.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G1", "pgroup": "CO-G"}, {"id": "17", "group": 17, "stem": "A 61-year-old man is on the step-down unit on hospital day 12. He was admitted with necrotizing alcohol-related acute pancreatitis and still has ongoing epigastric pain; he has not turned the corner. His temperature is 38.2°C (100.8°F), blood pressure is 118/70 mm Hg, pulse is 106/min, respirations are 20/min, and oxygen saturation is 95% on room air. He has persistent fever and tachycardia with diffuse abdominal tenderness, no palpable mass, and no flank or periumbilical bruising.\n\nStudies:\n    WBC — 15,800/mm³ with 84% neutrophils\n    Creatinine / BUN — 1.3 mg/dL / 26 mg/dL\n    Albumin — 2.8 g/dL\n    Hemoglobin / hematocrit — 11.4 g/dL / 34%\n    Blood cultures — Negative at 48 hours\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "B", "text": "Serum lipase with right upper quadrant ultrasound"}, {"letter": "C", "text": "Repeat contrast-enhanced CT in 5 to 7 days"}, {"letter": "D", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "E", "text": "Blood cultures"}], "answer": "A", "explanation": "Contrast-enhanced CT is the study that characterizes a collection after an attack of pancreatitis, because the whole differential here is imaging morphology — whether the contents are fluid or necrotic debris and whether a wall has formed. Fine-needle aspiration and blood cultures answer a question about infection that the morphology has not yet raised.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B3", "pgroup": "PA-B"}, {"id": "17A", "group": 17, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An encapsulated heterogeneous collection with a defined enhancing wall containing necrotic debris"}, {"letter": "B", "text": "A homogeneous fluid collection with no encapsulating wall and no necrosis"}, {"letter": "C", "text": "Gas within necrotic pancreatic tissue with a persistent leukocytosis and left shift"}, {"letter": "D", "text": "A heterogeneous collection of fluid and non-liquefied necrotic tissue with no defined wall"}, {"letter": "E", "text": "An encapsulated fluid collection with a well-defined enhancing wall and minimal necrosis"}], "answer": "D", "explanation": "Necrosis of the gland and the peripancreatic fat liquefies unevenly, so the collection contains solid debris as well as fluid, and an inflammatory capsule takes about four weeks to form. Gas inside the collection would mean infection, which negative cultures and the absence of sepsis physiology argue against here.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B3", "pgroup": "PA-B"}, {"id": "17B", "group": 17, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Infected pancreatic necrosis"}, {"letter": "B", "text": "Walled-off necrosis"}, {"letter": "C", "text": "Pancreatic pseudocyst"}, {"letter": "D", "text": "Acute peripancreatic fluid collection"}, {"letter": "E", "text": "Acute necrotic collection"}], "answer": "E", "explanation": "Necrosis within the first four weeks of an attack, before an inflammatory capsule has formed, is an acute necrotic collection. Walled-off necrosis carries the same debris inside a mature enhancing wall and is a later lesion, and a peripancreatic fluid collection is homogeneous fluid with no necrotic content.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B3", "pgroup": "PA-B"}, {"id": "17C", "group": 17, "stem": "He has an acute necrotic collection. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Endoscopic transmural drainage with necrosectomy"}, {"letter": "B", "text": "Imipenem-cilastatin 500 mg intravenously every 6 hours"}, {"letter": "C", "text": "Supportive care and observation, with drainage deferred"}, {"letter": "D", "text": "Surgical resection or surveillance according to cyst type"}, {"letter": "E", "text": "Endoscopic drainage of the collection"}], "answer": "C", "explanation": "An unwalled collection has no capsule to drain against, and drainage of sterile necrosis does not reduce mortality. Antibiotics are the reflex trap: negative cultures and no gas in the collection make this sterile necrosis, and treating it with a carbapenem selects resistant organisms without changing the course.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B3", "pgroup": "PA-B"}, {"id": "18", "group": 18, "stem": "A 68-year-old woman is in the intensive care unit on hospital day 5 after admission for severe gallstone pancreatitis. Her pain is unchanged, she has been febrile every day, and she has been sicker than her admission picture predicted; she takes lisinopril for hypertension. Her temperature is 38.6°C (101.5°F), blood pressure is 104/64 mm Hg, pulse is 118/min, respirations are 24/min, and oxygen saturation is 93% on room air. She has diffuse abdominal tenderness with persistent fever and tachycardia, no palpable mass, and no flank or periumbilical bruising.\n\nStudies:\n    WBC — 19,400/mm³ with a left shift\n    Creatinine — 2.1 mg/dL, risen from 0.9 on admission\n    BUN — 38 mg/dL\n    Calcium — 7.6 mg/dL\n    Hemoglobin / hematocrit — 11.0 g/dL / 33%\n    Blood cultures — Negative\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "B", "text": "Blood cultures"}, {"letter": "C", "text": "Serial hematocrit measurement"}, {"letter": "D", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "E", "text": "Serum lipase with right upper quadrant ultrasound"}], "answer": "D", "explanation": "A patient who is not improving by day 5 needs the gland imaged with intravenous contrast, because only perfusion tells you whether parenchyma has died. The scan is deliberately timed: obtained before 72 hours it underestimates the extent of necrosis, and the informative window is 5 to 7 days.", "objective": "", "section": "severe pancreatitis that fails to improve or deteriorates", "pcase": "PA-C1", "pgroup": "PA-C"}, {"id": "18A", "group": 18, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Gas within necrotic pancreatic tissue with 24,600 white cells and 18% bands"}, {"letter": "B", "text": "A hematocrit falling from 44% to 26% with retroperitoneal hemorrhage"}, {"letter": "C", "text": "An encapsulated heterogeneous collection with a defined enhancing wall containing necrotic debris"}, {"letter": "D", "text": "Non-enhancing pancreatic parenchyma with no gas within the necrosis"}, {"letter": "E", "text": "A homogeneous fluid collection with no wall in a patient who is otherwise improving"}], "answer": "D", "explanation": "Contrast reaches only living tissue, so dead parenchyma fails to enhance. Gas within the necrosis would mark infection by gas-forming enteric organisms; with negative cultures and no gas, this is sterile necrosis, which is the far more common state early on.", "objective": "", "section": "severe pancreatitis that fails to improve or deteriorates", "pcase": "PA-C1", "pgroup": "PA-C"}, {"id": "18B", "group": 18, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Walled-off necrosis"}, {"letter": "B", "text": "Hemorrhagic pancreatitis"}, {"letter": "C", "text": "Acute peripancreatic fluid collection"}, {"letter": "D", "text": "Infected pancreatic necrosis"}, {"letter": "E", "text": "Necrotizing pancreatitis"}], "answer": "E", "explanation": "Persistent pain and fever with organ dysfunction beyond the first few days marks necrosis rather than interstitial disease, and non-enhancing gland is the radiographic definition. Infected necrosis needs gas in the collection or positive cultures, and hemorrhagic disease announces itself with a falling hematocrit and ecchymoses.", "objective": "", "section": "severe pancreatitis that fails to improve or deteriorates", "pcase": "PA-C1", "pgroup": "PA-C"}, {"id": "18C", "group": 18, "stem": "She has sterile necrotizing pancreatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Imipenem-cilastatin 500 mg intravenously every 6 hours"}, {"letter": "B", "text": "Conservative supportive care with ICU-level monitoring"}, {"letter": "C", "text": "Endoscopic transmural drainage with necrosectomy"}, {"letter": "D", "text": "Blood product resuscitation with angioembolization"}, {"letter": "E", "text": "Endoscopic drainage of the collection when it is large or symptomatic"}], "answer": "B", "explanation": "Sterile necrosis usually stays sterile and may resorb, and hypotension, hypoxemia, and organ failure are what put her in the unit. Prophylactic antibiotics do not prevent infection of necrosis, and draining sterile necrosis does not reduce mortality while it does introduce organisms.", "objective": "", "section": "severe pancreatitis that fails to improve or deteriorates", "pcase": "PA-C1", "pgroup": "PA-C"}, {"id": "19", "group": 19, "stem": "A 57-year-old man is brought to the emergency department with three weeks of abdominal distension and an 8 kg weight gain, and two days of daytime sleepiness and muddled thinking; his wife says his days and nights are reversed. He has had alcohol-related cirrhosis for four years and is still drinking. He took ibuprofen twice daily for ten days for back pain and has eaten poorly since, and he has never had a variceal bleed. His temperature is 37.2°C (99.0°F), blood pressure is 102/64 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 96% on room air. He has tense ascites with shifting dullness and bulging flanks, jaundice with scleral icterus, asterixis, caput medusae, a spleen palpable to 16 cm, temporal and proximal muscle wasting, and 2+ pitting edema to the knees.\n\nStudies:\n    Total bilirubin — 6.8 mg/dL\n    INR — 2.1\n    Albumin — 2.4 g/dL\n    Sodium — 128 mEq/L\n    Creatinine — 1.6 mg/dL\n    Platelets — 74,000/mm³\n    Ammonia — 96 µmol/L\n    Blood and urine cultures — Negative\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Serum ceruloplasmin"}, {"letter": "B", "text": "Liver ultrasound"}, {"letter": "C", "text": "Diagnostic paracentesis"}, {"letter": "D", "text": "Serum transferrin saturation"}, {"letter": "E", "text": "Transient elastography"}], "answer": "C", "explanation": "Every cirrhotic admission gets the belly tapped, and a patient who has deteriorated gets it before anything else: the fluid answers whether the peritoneum is infected and whether the fluid is a pressure problem at all. Elastography stages fibrosis, which is not the question in a patient whose disease has already declared itself.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A3", "pgroup": "LI-A"}, {"id": "19A", "group": 19, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A liver stiffness of 21 kPa with platelets of 96,000/mm³ and an INR of 1.4"}, {"letter": "B", "text": "A liver stiffness of 16.4 kPa with a normal albumin, INR, and bilirubin"}, {"letter": "C", "text": "An ascitic count of 180 PMN/mm³ with a gradient of 1.8 g/dL"}, {"letter": "D", "text": "An AST of 118 U/L and an ALT of 48 U/L with a GGT of 310 U/L"}, {"letter": "E", "text": "Hepatic steatosis with an ALT of 96 U/L and an AST of 58 U/L"}], "answer": "C", "explanation": "A gradient of 1.1 g/dL or more means the fluid is driven by portal pressure, and a count below 250 PMN/mm³ excludes spontaneous bacterial peritonitis. Elastography values describe a liver that has not yet failed, which is not this patient.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A3", "pgroup": "LI-A"}, {"id": "19B", "group": 19, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Decompensated cirrhosis"}, {"letter": "B", "text": "Compensated cirrhosis"}, {"letter": "C", "text": "Alcohol-related fatty liver"}, {"letter": "D", "text": "Cirrhosis"}, {"letter": "E", "text": "MASLD with steatohepatitis (MASH)"}], "answer": "A", "explanation": "Ascites, jaundice, and encephalopathy are decompensating events, and each of them separately defines the transition out of the compensated state. A compensated patient still has a normal albumin, INR, and bilirubin and has had no such event.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A3", "pgroup": "LI-A"}, {"id": "19C", "group": 19, "stem": "He has decompensated cirrhosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Treat the precipitant, restrict sodium, and refer for transplantation"}, {"letter": "B", "text": "Cause-directed therapy with vaccination and surveillance"}, {"letter": "C", "text": "Alcohol abstinence, vaccination, and six-month imaging for hepatocellular carcinoma"}, {"letter": "D", "text": "Diet and exercise aiming at 10% body-weight loss"}, {"letter": "E", "text": "Abstinence with counseling and naltrexone 50 mg daily"}], "answer": "A", "explanation": "Every decompensation is a hunt for a precipitant — infection, bleeding, dehydration, alcohol, or a new medication — and here the nonsteroidal drug is the one that can be withdrawn today. Surveillance and vaccination belong to a patient who is still compensated; this one needs a transplant referral regardless of score after a decompensating event.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A3", "pgroup": "LI-A"}, {"id": "20", "group": 20, "stem": "A 63-year-old man presents to the primary care clinic with six weeks of increasing abdominal girth and a 9 kg weight gain. He fills up after a few bites and is breathless lying flat. He has cirrhosis from metabolic dysfunction–associated steatotic liver disease and takes lisinopril for hypertension; he eats canned soup and takeout most days and has never had a paracentesis. His temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 88/min, respirations are 18/min, and oxygen saturation is 96% on room air. His flanks bulge, there is shifting dullness and a fluid wave, and he has 2+ pitting edema to mid-shin. His abdomen is not tender, he has no fever, and there is no asterixis.\n\nStudies:\n    Serum sodium — 133 mEq/L\n    Creatinine — 1.0 mg/dL\n    Abdominal ultrasound — Large-volume ascites around a nodular liver, spleen 15 cm\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Echocardiogram with Doppler and bubble study"}, {"letter": "B", "text": "Right heart catheterization"}, {"letter": "C", "text": "Diagnostic paracentesis with a same-day serum albumin"}, {"letter": "D", "text": "Doppler ultrasound of the hepatic veins"}, {"letter": "E", "text": "Urine sodium with serum creatinine and creatinine clearance"}], "answer": "C", "explanation": "New-onset ascites is tapped, and the serum albumin has to be drawn the same day for the gradient to mean anything. The tap also answers the two questions that change management today — whether the fluid is infected and whether it is malignant.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B1", "pgroup": "LI-B"}, {"id": "20A", "group": 20, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A right-sided transudative effusion in a cirrhotic patient with ascites"}, {"letter": "B", "text": "A creatinine of 2.6 mg/dL with a urine sodium of 6 mEq/L and a urine osmolality of 640 mOsm/kg"}, {"letter": "C", "text": "A gradient of 2.2 g/dL with 60 PMN/mm³ and an ascitic protein of 1.2 g/dL"}, {"letter": "D", "text": "Hepatic vein flow not demonstrated, with tender hepatomegaly and new ascites"}, {"letter": "E", "text": "An ascitic count of 620 PMN/mm³ with a creatinine risen from 1.0 to 1.9 mg/dL"}], "answer": "C", "explanation": "A gradient of 1.1 g/dL or more identifies portal hypertension with about 97% accuracy, and the low ascitic total protein is what cirrhosis gives — heart failure raises it. A count below 250 PMN/mm³ excludes spontaneous bacterial peritonitis.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B1", "pgroup": "LI-B"}, {"id": "20B", "group": 20, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hepatorenal syndrome"}, {"letter": "B", "text": "Spontaneous bacterial peritonitis"}, {"letter": "C", "text": "Hepatohydrothorax"}, {"letter": "D", "text": "Budd-Chiari syndrome"}, {"letter": "E", "text": "Portal hypertensive ascites"}], "answer": "E", "explanation": "A non-tender abdomen without fever, a sterile fluid with a low cell count, and a normal creatinine leave uncomplicated portal hypertensive ascites. Peritonitis needs 250 PMN/mm³ or more, and hepatorenal syndrome needs kidney failure that persists after volume is replaced.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B1", "pgroup": "LI-B"}, {"id": "20C", "group": 20, "stem": "He has portal hypertensive ascites. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "B", "text": "Stopping diuretics with intravenous albumin, then terlipressin"}, {"letter": "C", "text": "Cefotaxime 2 g intravenously every 8 hours with intravenous albumin"}, {"letter": "D", "text": "Anticoagulation with urgent referral for a portosystemic shunt"}, {"letter": "E", "text": "Sodium restriction and diuretics with therapeutic thoracentesis"}], "answer": "A", "explanation": "Sodium drives the fluid, so restriction below 2 g daily plus a distal-and-loop diuretic pair is first-line, and the sodium of 133 mEq/L adds free water restriction. The angiotensin-converting-enzyme inhibitor is stopped rather than continued alongside diuretics, because the two together drop renal perfusion.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B1", "pgroup": "LI-B"}, {"id": "21", "group": 21, "stem": "A 48-year-old man on the hepatology unit has had falling urine output for four days and a creatinine that keeps climbing despite volume, and his ascites no longer responds to diuretics. He has advanced alcohol-related cirrhosis, was treated for spontaneous bacterial peritonitis one week ago, and had 6 L removed by paracentesis at an outside hospital two weeks ago without albumin replacement. He has taken no nonsteroidal anti-inflammatory drugs and has received no contrast and no aminoglycosides. His temperature is 36.6°C (97.9°F), blood pressure is 88/54 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 96% on room air. He has tense ascites, jaundice, and hypotension, with no flank tenderness and no rash.\n\nStudies:\n    Creatinine — 2.6 mg/dL, risen from 1.0\n    Creatinine clearance — 22 mL/min\n    Urine sodium — 6 mEq/L\n    Urine osmolality — 640 mOsm/kg\n    Urine protein — 190 mg/dL\n    Urine sediment — No eosinophils, fewer than 50 RBC/hpf\n    Urine volume — 380 mL/24 h\n    Serum sodium — 126 mEq/L\n    Renal ultrasound — Normal, with no hydronephrosis\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Echocardiogram with Doppler and bubble study"}, {"letter": "B", "text": "A volume challenge with albumin after stopping diuretics"}, {"letter": "C", "text": "Ascitic culture inoculated into blood culture bottles at the bedside"}, {"letter": "D", "text": "Direct venography of the hepatic veins"}, {"letter": "E", "text": "Abdominal ultrasound of the liver and spleen"}], "answer": "B", "explanation": "The kidneys here are structurally normal, so the question is whether they are simply underfilled. Withdrawing diuretics and expanding the plasma volume separates prerenal azotemia, which corrects, from the diagnosis of exclusion, which does not.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B3", "pgroup": "LI-B"}, {"id": "21A", "group": 21, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A negative bubble study with normal right heart pressures"}, {"letter": "B", "text": "Obstructed hepatic venous outflow"}, {"letter": "C", "text": "Large-volume ascites around a nodular liver with splenomegaly"}, {"letter": "D", "text": "No sustained fall in the creatinine, which remains at 2.5 mg/dL"}, {"letter": "E", "text": "Single-organism growth of Escherichia coli"}], "answer": "D", "explanation": "Splanchnic vasodilation in advanced cirrhosis leaves the renal circulation vasoconstricted no matter how much volume is given, so plasma expansion does not correct the creatinine. A fall would have named the failure prerenal and ended the workup.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B3", "pgroup": "LI-B"}, {"id": "21B", "group": 21, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Portal hypertensive ascites"}, {"letter": "B", "text": "Budd-Chiari syndrome"}, {"letter": "C", "text": "Spontaneous bacterial peritonitis"}, {"letter": "D", "text": "Hepatorenal syndrome"}, {"letter": "E", "text": "Hepatohydrothorax"}], "answer": "D", "explanation": "This is renal failure diagnosed by exclusion: shock, fluid losses, nephrotoxins, parenchymal disease, and obstruction have all been ruled out, and the kidneys are sonographically normal. A urine sodium under 10 mEq/L with a concentrated urine and a bland sediment is the avid, structurally intact kidney.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B3", "pgroup": "LI-B"}, {"id": "21C", "group": 21, "stem": "He has hepatorenal syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "B", "text": "Anticoagulation with urgent referral for a portosystemic shunt"}, {"letter": "C", "text": "Stopping the diuretics with intravenous albumin"}, {"letter": "D", "text": "Therapeutic thoracentesis with sodium restriction"}, {"letter": "E", "text": "Cefotaxime 2 g intravenously every 8 hours with intravenous albumin"}], "answer": "C", "explanation": "Diuretics are part of the problem, not the treatment, and 25% albumin restores the effective circulating volume the splanchnic bed has stolen. Pushing more diuretic at diuretic-resistant ascites is the reflex that produced this syndrome in the first place.", "objective": "", "section": "the cirrhotic with ascites who gets worse", "pcase": "LI-B3", "pgroup": "LI-B"}, {"id": "22", "group": 22, "stem": "A 66-year-old man presents to the emergency department with five days of worsening breathlessness, a dry cough, and right-sided chest fullness; this is his third such episode this year. He has cirrhosis with ascites and takes spironolactone and furosemide, and two right-sided effusions have been drained in the past six months. He has never smoked and has no heart failure and no prior pneumonia. His temperature is 36.9°C (98.4°F), blood pressure is 110/68 mm Hg, pulse is 94/min, respirations are 24/min, and oxygen saturation is 90% on room air. There is dullness to percussion with decreased breath sounds and reduced tactile fremitus over the right lower chest, and shifting dullness in the abdomen. He has no jugular venous distention, no loud P2, and no clubbing.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Chest radiograph"}, {"letter": "B", "text": "Arterial blood gas on room air"}, {"letter": "C", "text": "Serum natriuretic peptide"}, {"letter": "D", "text": "Right heart catheterization"}, {"letter": "E", "text": "Abdominal ultrasound"}], "answer": "A", "explanation": "Dullness with absent breath sounds over one base is answered by the plain film before anything invasive, and it decides whether the chest holds fluid, consolidation, or neither. The echocardiogram with a bubble study follows in the same visit, since every breathless cirrhotic needs both.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C3", "pgroup": "LI-C"}, {"id": "22A", "group": 22, "stem": "Which of the following initial test results is most likely to be present?", "options": [{"letter": "A", "text": "A clear chest radiograph with microbubbles in the left atrium after 5 heartbeats"}, {"letter": "B", "text": "A large right pleural effusion with a negative bubble study and normal right-sided pressures"}, {"letter": "C", "text": "A tense abdomen with an albumin gradient of 2.2 g/dL and 60 PMN/mm³"}, {"letter": "D", "text": "A right ventricular systolic pressure of 62 mm Hg with a dilated right ventricle"}, {"letter": "E", "text": "A reduced ejection fraction with raised filling pressures"}], "answer": "B", "explanation": "Late-appearing microbubbles in the left atrium mark an intrapulmonary shunt, and a high right ventricular systolic pressure marks a pressure problem in the pulmonary arteries. Neither is present when the hypoxia comes simply from lung compressed by fluid.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C3", "pgroup": "LI-C"}, {"id": "22B", "group": 22, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Portopulmonary hypertension"}, {"letter": "B", "text": "Hepatopulmonary syndrome"}, {"letter": "C", "text": "Hepatohydrothorax"}, {"letter": "D", "text": "Portal hypertensive ascites"}, {"letter": "E", "text": "Decompensated heart failure"}], "answer": "C", "explanation": "Fluid in the pleural space with a negative bubble study and normal right-sided pressures is not a shunt and not a pressure problem. The absence of jugular venous distention and a loud P2 argues against the right heart, and clear lungs would be needed for a shunt.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C3", "pgroup": "LI-C"}, {"id": "22C", "group": 22, "stem": "He has a hepatohydrothorax. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Diuresis with guideline-directed heart failure therapy"}, {"letter": "B", "text": "Supplemental oxygen with referral for liver transplantation"}, {"letter": "C", "text": "Sodium restriction and diuretics with tube thoracostomy"}, {"letter": "D", "text": "Pulmonary vasodilator therapy with transplantation once controlled"}, {"letter": "E", "text": "Sodium restriction and diuretics with therapeutic thoracentesis"}], "answer": "E", "explanation": "The fluid is ascites in a different cavity, so it is treated the way ascites is treated, with a therapeutic tap for the breathlessness. A chest tube is the trap a recurrent effusion invites: it drains protein and fluid continuously and seeds the space with infection.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C3", "pgroup": "LI-C"}, {"id": "23", "group": 23, "stem": "A 41-year-old man presents to the emergency department with four days of yellow eyes and cola-colored urine. For about two weeks before that he felt tired and nauseated, vomited most mornings, and lost his appetite entirely; his stools have turned pale and he has a dull ache in the right upper quadrant. He injected heroin until three months ago and shared equipment, and he returned from Honduras six weeks ago. He drinks no alcohol and takes no prescription medications. His temperature is 38.1°C (100.6°F), blood pressure is 118/72 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has icteric sclera and jaundiced skin, a tender liver edge 4 cm below the costal margin, and scattered urticarial wheals over the trunk. He is alert, with no asterixis and no ascites.\n\nStudies:\n    WBC — 6,200/mm³\n    Hemoglobin / hematocrit — 14.2 g/dL / 42%\n    Platelets — 232,000/mm³\n    PT / INR — 13.2 s / 1.1 (reference 11–14 s)\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Right upper quadrant ultrasound"}, {"letter": "B", "text": "CMV DNA polymerase chain reaction"}, {"letter": "C", "text": "Hepatitis E antibody, sent out"}, {"letter": "D", "text": "A hepatic function panel with an acute hepatitis panel"}, {"letter": "E", "text": "Hepatitis B virus DNA polymerase chain reaction"}], "answer": "D", "explanation": "The first question in a jaundiced patient is whether the injury is hepatocellular or cholestatic, and the enzyme panel answers it in one draw. The serologic panel is sent alongside because parenteral and developing-country exposures both sit in this history.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A1", "pgroup": "VH-A"}, {"id": "23A", "group": 23, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Hepatitis A IgM positive with hepatitis A IgG negative and an ALT of 1,340 U/L"}, {"letter": "B", "text": "A negative A, B, and C panel with an AST of 720 and an ALT of 1,050 U/L"}, {"letter": "C", "text": "An AST to ALT ratio above 2:1 with transaminases below 400 U/L"}, {"letter": "D", "text": "Negative A, B, and C serologies with an AST of 210 and an ALT of 340 U/L"}, {"letter": "E", "text": "An AST of 1,420 U/L and an ALT of 1,880 U/L with a bilirubin of 8.4 mg/dL"}], "answer": "E", "explanation": "Diffuse hepatocyte injury releases aminotransferases in the thousands, with the ALT above the AST, and the conjugated fraction rises because damaged hepatocytes cannot excrete bile. Transaminases in the hundreds point instead at a herpesvirus in an immunosuppressed host.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A1", "pgroup": "VH-A"}, {"id": "23B", "group": 23, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute viral hepatitis"}, {"letter": "B", "text": "Alcohol-associated hepatitis"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "Hepatitis A"}, {"letter": "E", "text": "CMV hepatitis"}], "answer": "A", "explanation": "An ALT above the AST at more than ten times the upper limit of normal, with a conjugated hyperbilirubinemia and a tender liver, is acute hepatocellular viral injury. Alcohol-associated disease runs a ratio above 2:1 with transaminases under 400 U/L, and a stone in the duct gives a cholestatic pattern instead.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A1", "pgroup": "VH-A"}, {"id": "23C", "group": 23, "stem": "He has acute viral hepatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Entecavir or tenofovir alongside supportive care"}, {"letter": "B", "text": "Bed rest, hydration, and avoidance of alcohol and acetaminophen"}, {"letter": "C", "text": "Supportive care with antiviral treatment directed at the virus"}, {"letter": "D", "text": "Alcohol cessation with nutritional support"}, {"letter": "E", "text": "Supportive care with vaccine and immune globulin for his contacts"}], "answer": "B", "explanation": "There is no antiviral for acute hepatitis A or E; the treatment is rest, calories, and fluids while the liver regenerates. Hepatotoxins are withdrawn completely, since a second insult on an already injured liver is what turns a self-limited illness into failure.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A1", "pgroup": "VH-A"}, {"id": "24", "group": 24, "stem": "A 26-year-old woman presents to the primary care clinic with five days of jaundice and dark urine, preceded by ten days of malaise and fever. She has nausea, right upper quadrant pain, and a poor appetite. She returned five weeks ago from a month in rural Guatemala, where she ate raw oysters at a coastal market, and two of her travel companions became jaundiced last week. She does not inject drugs. Her temperature is 38.4°C (101.1°F), blood pressure is 112/70 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 99% on room air. She is jaundiced with icteric sclera, has a tender liver edge 3 cm below the costal margin and an urticarial rash over the forearms, and has no asterixis, no splenomegaly, and no stigmata of chronic liver disease.\n\nStudies:\n    AST / ALT — 980 U/L / 1,340 U/L\n    Alkaline phosphatase — 210 U/L\n    Total bilirubin — 6.2 mg/dL, direct 4.3 mg/dL\n    Albumin — 4.0 g/dL\n    PT / INR — 12.6 s / 1.0\n    WBC — 5,900/mm³\n    Hemoglobin / hematocrit — 13.1 g/dL / 39%\n    Platelets — 251,000/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CMV DNA polymerase chain reaction"}, {"letter": "B", "text": "Cholangiography by MRCP"}, {"letter": "C", "text": "Hepatitis B virus DNA polymerase chain reaction"}, {"letter": "D", "text": "Hepatitis A IgM"}, {"letter": "E", "text": "Total hepatitis A antibody"}], "answer": "D", "explanation": "A fecal-oral exposure with a cluster of jaundiced contacts calls for the assay that dates the infection. The total antibody combines IgM and IgG and therefore cannot separate acute infection from remote immunity, which is the error that wastes the two-week window for protecting her contacts.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A2", "pgroup": "VH-A"}, {"id": "24A", "group": 24, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg positive and HBcAb IgM positive with HBsAb negative"}, {"letter": "B", "text": "A negative A, B, and C panel with an AST of 720 and an ALT of 1,050 U/L"}, {"letter": "C", "text": "An AST of 1,420 and an ALT of 1,880 U/L with a viral serology naming the type"}, {"letter": "D", "text": "Hepatitis A IgM positive with hepatitis A IgG negative"}, {"letter": "E", "text": "Negative A, B, and C serologies with an AST of 210 and an ALT of 340 U/L"}], "answer": "D", "explanation": "IgM appears with the acute illness and IgG follows to give lifelong immunity, so IgM present without IgG dates the infection to now. IgG alone would mean prior infection and immunity rather than the illness in front of you.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A2", "pgroup": "VH-A"}, {"id": "24B", "group": 24, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B"}, {"letter": "B", "text": "Hepatitis A"}, {"letter": "C", "text": "Hepatitis E"}, {"letter": "D", "text": "Alcohol-associated hepatitis"}, {"letter": "E", "text": "CMV hepatitis"}], "answer": "B", "explanation": "A month in a developing country, raw shellfish, and a cluster of jaundiced travel companions is fecal-oral transmission, and the virus is shed for two weeks before anyone feels ill. Hepatitis B follows parenteral or sexual exposure, and a herpesvirus would need immunosuppression and transaminases in the hundreds.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A2", "pgroup": "VH-A"}, {"id": "24C", "group": 24, "stem": "She has hepatitis A. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with household hygiene measures"}, {"letter": "B", "text": "Alcohol cessation with nutritional support"}, {"letter": "C", "text": "Endoscopic stone extraction"}, {"letter": "D", "text": "Supportive care with antiviral treatment directed at the virus"}, {"letter": "E", "text": "Entecavir or tenofovir alongside supportive care"}], "answer": "A", "explanation": "The illness is self-limited and never becomes chronic, so there is no antiviral to give and the work is rest, fluids, and hepatotoxin avoidance. Sanitation and handwashing matter because the route out of this patient is the same route into the next one.", "objective": "", "section": "acute icteric illness with transaminases in the thousands", "pcase": "VH-A2", "pgroup": "VH-A"}, {"id": "25", "group": 25, "stem": "A 20-year-old man presents to the gastroenterology clinic with four months of four loose stools daily with intermittent blood, and crampy periumbilical pain. His older sister has Crohn's disease, and he has had two prior colitis flares treated with steroids at another hospital. He is a college student. His temperature is 37.1°C (98.8°F), blood pressure is 116/72 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has mild diffuse abdominal tenderness without guarding, no perianal fistula or fissure, no oral ulcers, and no palpable mass.\n\nStudies:\n    Hemoglobin / hematocrit — 12.6 g/dL / 38%\n    MCV — 86 fL\n    Albumin — 3.8 g/dL\n    CRP — 18 mg/L\n    ESR — 22 mm/h\n    WBC — 7,600/mm³\n    Fecal calprotectin — 410 µg/g\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT or MR enterography"}, {"letter": "B", "text": "ASCA and p-ANCA serology"}, {"letter": "C", "text": "Pelvic magnetic resonance imaging"}, {"letter": "D", "text": "Colonoscopy with biopsy"}, {"letter": "E", "text": "Stool Clostridioides difficile testing"}], "answer": "D", "explanation": "Months of bloody diarrhea with a raised calprotectin and inflammatory markers is chronic colitis until the mucosa is looked at, and the pattern plus the histology is what assigns the label. Serology and enterography refine a picture the endoscopy has to produce first.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A3", "pgroup": "IB-A"}, {"id": "25A", "group": 25, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Chronic active colitis with no ileal disease and no skip or rectal-sparing pattern"}, {"letter": "B", "text": "Flat high-grade dysplasia in inflamed mucosa with no visible polyp"}, {"letter": "C", "text": "Segmental colitis at a watershed segment with an abrupt transition"}, {"letter": "D", "text": "Continuous rectal-based inflammation with crypt abscesses and mucin depletion"}, {"letter": "E", "text": "Skip lesions with cobblestoning and rectal sparing, with non-caseating granulomas"}], "answer": "A", "explanation": "The two named forms of inflammatory bowel disease are separated by distribution and depth: patchy full-thickness disease reaching the ileum on one side, continuous mucosal disease beginning at the rectum on the other. When neither pattern is present, the endoscopy reports colitis without the features that decide it.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A3", "pgroup": "IB-A"}, {"id": "25B", "group": 25, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ulcerative colitis"}, {"letter": "B", "text": "IBD-associated colorectal cancer"}, {"letter": "C", "text": "Indeterminate colitis"}, {"letter": "D", "text": "Clostridioides difficile colitis"}, {"letter": "E", "text": "Crohn's disease"}], "answer": "C", "explanation": "About 10% of colitis cannot be classified at first presentation, and this is the answer when the full evaluation establishes neither pattern rather than the closer of the two. The absent granulomas and ileal disease argue against one, and the absent continuous rectal gradient against the other.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A3", "pgroup": "IB-A"}, {"id": "25C", "group": 25, "stem": "He has indeterminate colitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Colectomy with an ileal pouch–anal anastomosis"}, {"letter": "B", "text": "5-ASA with serial reassessment"}, {"letter": "C", "text": "Budesonide with smoking cessation"}, {"letter": "D", "text": "A mesalamine enema with an oral aminosalicylate"}, {"letter": "E", "text": "Anti-TNF therapy with an immunomodulator"}], "answer": "B", "explanation": "The colitis is treated on its own terms while repeat endoscopy over time settles the label. The pouch is the trap here: it is a ulcerative colitis operation and does badly in Crohn's, so committing to it before the diagnosis is settled risks an outcome that cannot be undone.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A3", "pgroup": "IB-A"}, {"id": "26", "group": 26, "stem": "A 38-year-old woman presents to the emergency department with three months of cramping periumbilical pain 30 to 60 minutes after meals, and twelve hours of vomiting with no flatus and no stool. She has had Crohn's disease for fifteen years and two prior ileocecal resections, and she stopped her biologic a year ago when her insurance lapsed. She has three children. Her temperature is 37.3°C (99.1°F), blood pressure is 108/68 mm Hg, pulse is 106/min, respirations are 18/min, and oxygen saturation is 98% on room air. Her abdomen is distended and tympanitic with high-pitched bowel sounds and diffuse tenderness without rebound or guarding, and she has a well-healed midline scar.\n\nStudies:\n    Abdominal radiographs — Dilated small-bowel loops with air-fluid levels and no colonic gas\n    WBC — 10,800/mm³\n    Hemoglobin / hematocrit — 12.8 g/dL / 38%\n    Potassium — 3.2 mEq/L\n    Chloride — 96 mEq/L\n    Creatinine — 1.3 mg/dL\n    CRP — 9 mg/L\n    Albumin — 3.6 g/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Video capsule endoscopy"}, {"letter": "B", "text": "Stool Clostridioides difficile testing"}, {"letter": "C", "text": "CT of the abdomen and pelvis"}, {"letter": "D", "text": "CT or MR enterography"}, {"letter": "E", "text": "Ileocolonoscopy with ileal intubation and biopsy"}], "answer": "D", "explanation": "Enterography images the wall as well as the lumen, which is what distinguishes an inflamed segment that will respond to drugs from a scarred one that will not. Capsule endoscopy is the trap in a patient with obstructive symptoms — the capsule impacts at the narrowing it was sent to find.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B2", "pgroup": "IB-B"}, {"id": "26A", "group": 26, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A tract from a distal ileal loop to the bladder dome with intravesical air"}, {"letter": "B", "text": "Skip lesions with cobblestoning and rectal sparing"}, {"letter": "C", "text": "Luminal narrowing with proximal dilation and minimal mural enhancement"}, {"letter": "D", "text": "Free intraperitoneal air under both hemidiaphragms"}, {"letter": "E", "text": "A transverse colon dilated to 9 cm with loss of haustra and thumbprinting"}], "answer": "C", "explanation": "Repeated cycles of inflammation and healing lay down collagen, and the scarred segment narrows and stops distending; the bowel above it dilates against the fixed point. Little mural enhancement and no mesenteric hyperemia mark the segment as fibrotic rather than actively inflamed.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B2", "pgroup": "IB-B"}, {"id": "26B", "group": 26, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Colon perforation in inflammatory bowel disease"}, {"letter": "B", "text": "Toxic megacolon"}, {"letter": "C", "text": "Clostridioides difficile colitis"}, {"letter": "D", "text": "Fistulizing Crohn's disease"}, {"letter": "E", "text": "Stricturing Crohn's disease"}], "answer": "E", "explanation": "Colic timed to meals for months, then obstipation with vomiting and air-fluid levels, is mechanical obstruction of the small bowel in a patient whose disease is transmural. A penetrating complication would give a tract and drainage, and a toxic colon would give a dilated colon with systemic toxicity.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B2", "pgroup": "IB-B"}, {"id": "26C", "group": 26, "stem": "She has a fibrotic stricture with small bowel obstruction. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Emergent colectomy with broad-spectrum antibiotics"}, {"letter": "B", "text": "Bowel rest with nasogastric decompression, then balloon dilation"}, {"letter": "C", "text": "Intravenous corticosteroids with rescue infliximab"}, {"letter": "D", "text": "Anti-TNF therapy with an immunomodulator and seton placement"}, {"letter": "E", "text": "Intravenous steroids, antibiotics, fluids, and nasogastric and rectal tubes"}], "answer": "B", "explanation": "The obstructed bowel is decompressed first, and the narrowing itself is then opened mechanically. Corticosteroids will not open scar, so escalating medical therapy here only delays the treatment that works; anti-diarrheals and anticholinergics are avoided for the risk of toxic dilation.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B2", "pgroup": "IB-B"}, {"id": "27", "group": 27, "stem": "A 63-year-old woman presents to the primary care clinic three weeks after breaking her left wrist in a fall from standing height on a level sidewalk. She has no other symptoms apart from a mild mid-back ache. She has had Crohn's disease for twenty-two years and has taken at least six courses of prednisone in the last five years. She went through menopause at 51, and her mother broke a hip in her seventies. She is a retired librarian. Her temperature is 36.7°C (98.1°F), blood pressure is 132/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. Her left wrist is in a cast, she has lost 3 cm of height since her forties, and she has mild thoracic kyphosis; her abdomen is soft and nontender.\n\nStudies:\n    25-hydroxyvitamin D — 14 ng/mL\n    Calcium — 8.4 mg/dL\n    Albumin — 3.6 g/dL\n    Creatinine — 0.9 mg/dL\n    Alkaline phosphatase — 96 U/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Breath testing after a carbohydrate load"}, {"letter": "B", "text": "Ileocolonoscopy with ileal intubation and biopsy"}, {"letter": "C", "text": "Tissue transglutaminase IgA with a total IgA"}, {"letter": "D", "text": "A DEXA scan"}, {"letter": "E", "text": "Surveillance colonoscopy with four-quadrant biopsies"}], "answer": "D", "explanation": "A fracture from standing height, height loss, and kyphosis in a woman with two decades of inflammation and repeated steroid courses is a bone question, and bone density is measured directly. Endoscopy would answer a question her quiet abdomen is not asking.", "objective": "", "section": "the silent systemic cost of long-standing IBD and its treatment", "pcase": "IB-E1", "pgroup": "IB-E"}, {"id": "27A", "group": 27, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Flat high-grade dysplasia in inflamed mucosa with no visible polyp"}, {"letter": "B", "text": "A T-score of −2.9 at the lumbar spine and −2.5 at the femoral neck"}, {"letter": "C", "text": "An early rise in exhaled hydrogen after the carbohydrate load"}, {"letter": "D", "text": "An MCV of 106 fL with a B12 of 118 pg/mL and normal folate and iron"}, {"letter": "E", "text": "Skip lesions with cobblestoning and non-caseating granulomas"}], "answer": "B", "explanation": "Steroids inhibit bone formation and increase resorption while calcium and vitamin D absorption falls, and cytokines from active inflammation drive resorption further. The trabecular spine loses density before the femoral neck does, which is why the spinal T-score is the lower of the two.", "objective": "", "section": "the silent systemic cost of long-standing IBD and its treatment", "pcase": "IB-E1", "pgroup": "IB-E"}, {"id": "27B", "group": 27, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small intestinal bacterial overgrowth"}, {"letter": "B", "text": "Nutritional deficiency and malabsorption"}, {"letter": "C", "text": "IBD-associated osteoporosis"}, {"letter": "D", "text": "Crohn's disease with active ileitis"}, {"letter": "E", "text": "IBD-associated colorectal cancer"}], "answer": "C", "explanation": "The condition affects between 18 and 42% of patients with inflammatory bowel disease, and its first sign is usually a fracture rather than a symptom. A normal blood count and a normal MCV argue against a deficiency state, and the quiet abdomen argues against active bowel disease.", "objective": "", "section": "the silent systemic cost of long-standing IBD and its treatment", "pcase": "IB-E1", "pgroup": "IB-E"}, {"id": "27C", "group": 27, "stem": "She has osteoporosis related to her inflammatory bowel disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "An antibiotic course directed at enteric flora"}, {"letter": "B", "text": "A further course of prednisone with calcium supplementation"}, {"letter": "C", "text": "Repletion of B12, iron, folate, and vitamin D"}, {"letter": "D", "text": "Vitamin D and calcium with weight-bearing exercise"}, {"letter": "E", "text": "A lifelong gluten-free diet"}], "answer": "D", "explanation": "Replacing what is not absorbed and loading the skeleton are the two things that act on the bone directly, and the steroid exposure is the modifiable driver that has to come down. Reaching for prednisone again is the trap: steroids suppress a flare and are not maintenance, and each course costs more bone.", "objective": "", "section": "the silent systemic cost of long-standing IBD and its treatment", "pcase": "IB-E1", "pgroup": "IB-E"}, {"id": "28", "group": 28, "stem": "A 71-year-old man presents to the gastroenterology clinic because swallowing has become difficult over the past four months. It began with meat and bread, then rice, and for the last two weeks he has been unable to keep water down without regurgitating it. Swallowing hurts, his voice has been hoarse for a month, and he has lost 22 pounds. He smoked a pack a day for forty-five years, drinks three to four beers daily, and has had heartburn most evenings for two decades. He is a retired machinist. His temperature is 36.8°C, blood pressure is 118/72 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 97% on room air. He has temporal wasting with a body mass index of 19, a firm fixed left supraclavicular node, and a hoarse voice; his stool is heme-positive and there is no palpable abdominal mass.\n\nStudies:\n    Barium swallow — Annular constricting apple-core lesion\n    Hemoglobin / hematocrit — 10.2 g/dL / 31%\n    MCV — 74 fL\n    Ferritin — 8 ng/mL\n    Platelets — 288,000/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Esophageal manometry"}, {"letter": "B", "text": "Endoscopic ultrasound with staging PET"}, {"letter": "C", "text": "Upper endoscopy with biopsy"}, {"letter": "D", "text": "Multiphasic contrast MRI of the liver"}, {"letter": "E", "text": "CT or MR enterography"}], "answer": "C", "explanation": "A contrast study can outline a narrowing but never establishes what it is, and treating or dilating on the strength of the barium alone is the error the case turns on. Tissue is the gold standard, and the scope is what obtains it.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A1", "pgroup": "MA-A"}, {"id": "28A", "group": 28, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A mid-esophageal mass at 26 cm with irregular rigid narrowing"}, {"letter": "B", "text": "A dilated body with a smooth tapered narrowing at the gastroesophageal junction"}, {"letter": "C", "text": "An ulcerated circumferential mass at 32 cm with a residual lumen of 6 mm"}, {"letter": "D", "text": "A distal mass at the gastroesophageal junction with adjacent salmon-colored mucosa"}, {"letter": "E", "text": "A short smooth tapered narrowing at the gastroesophageal junction with no mass"}], "answer": "C", "explanation": "A tumor growing circumferentially leaves a rigid residual lumen that neither food nor a scope will pass, and ulceration within it is what makes the stool heme-positive. A smooth tapered narrowing that the scope passes with gentle pressure is a motility or reflux problem, not a mass.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A1", "pgroup": "MA-A"}, {"id": "28B", "group": 28, "stem": "Which of the following studies would most directly confirm the extent of disease?", "options": [{"letter": "A", "text": "Esophageal manometry"}, {"letter": "B", "text": "Biopsy of the stricture margin"}, {"letter": "C", "text": "ERCP with brushings of the duct"}, {"letter": "D", "text": "Urea breath test for Helicobacter pylori"}, {"letter": "E", "text": "Endoscopic ultrasound with staging PET"}], "answer": "E", "explanation": "Endoscopic ultrasound reads depth of invasion and regional nodes with 80 to 90% accuracy, and PET answers whether disease has spread beyond the field a surgeon can resect. Together they decide whether the operation is possible at all.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A1", "pgroup": "MA-A"}, {"id": "28C", "group": 28, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Achalasia"}, {"letter": "B", "text": "Esophageal squamous cell carcinoma"}, {"letter": "C", "text": "Esophageal cancer"}, {"letter": "D", "text": "Esophageal adenocarcinoma"}, {"letter": "E", "text": "Peptic (reflux) stricture"}], "answer": "C", "explanation": "Dysphagia progressing from solids to liquids over months, with weight loss, odynophagia, hoarseness, a fixed supraclavicular node, and iron deficiency, is malignant obstruction. A reflux stricture leaves the weight stable, and achalasia gives dysphagia to solids and liquids together from the start.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A1", "pgroup": "MA-A"}, {"id": "29", "group": 29, "stem": "A 67-year-old man presents to the gastroenterology clinic with two months of crampy abdominal pain, a 20-pound weight loss, and two episodes of melena. He was diagnosed with celiac disease at 55 and has adhered poorly to a gluten-free diet. He is HIV-negative and takes no immunosuppressive medication. His temperature is 37.1°C, blood pressure is 118/72 mm Hg, pulse is 90/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has a palpable tender mass in the right lower quadrant, no peritoneal signs, and heme-positive stool.\n\nStudies:\n    Hemoglobin / hematocrit — 10.4 g/dL / 31%\n    MCV — 79 fL\n    Platelets — 264,000/mm³\n    WBC — 7,100/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Upper endoscopy with biopsy"}, {"letter": "B", "text": "Right upper quadrant ultrasound"}, {"letter": "C", "text": "Multiphasic contrast MRI of the liver"}, {"letter": "D", "text": "24-hour urinary 5-HIAA"}, {"letter": "E", "text": "CT or MR enterography"}], "answer": "E", "explanation": "A palpable right lower quadrant mass with melena and weight loss puts the lesion in the small bowel, which neither scope reaches routinely. Enterography distends the lumen and images the wall, so it shows both the mass and whether the bowel has perforated.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C2", "pgroup": "MA-C"}, {"id": "29A", "group": 29, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An ulcerated mass in the second duodenum at the ampulla"}, {"letter": "B", "text": "Bowel-wall thickening with a mass at the ileocecal valve"}, {"letter": "C", "text": "A 2.5-cm ileal mass 40 cm from the ileocecal valve with hepatic lesions"}, {"letter": "D", "text": "An 8-cm exophytic jejunal mass with central necrosis"}, {"letter": "E", "text": "A polypoid antral filling defect, ulcerated within the mass"}], "answer": "B", "explanation": "The tumor infiltrates the wall circumferentially rather than encircling and choking the lumen, which is why it grows to a palpable size and bleeds before it obstructs. The ileocecal region is one of its recognized sites below the stomach.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C2", "pgroup": "MA-C"}, {"id": "29B", "group": 29, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Carcinoid tumor"}, {"letter": "B", "text": "Gastric adenocarcinoma"}, {"letter": "C", "text": "Small-bowel leiomyosarcoma"}, {"letter": "D", "text": "Small bowel lymphoma"}, {"letter": "E", "text": "Small-bowel adenocarcinoma"}], "answer": "D", "explanation": "Poorly controlled celiac disease is a named risk condition, the seventh decade and male sex fit the demographic, and the ileocecal region is a recognized site. A gastric primary would announce itself with early satiety and a left supraclavicular node, and a neuroendocrine tumor with flushing and secretory diarrhea.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C2", "pgroup": "MA-C"}, {"id": "29C", "group": 29, "stem": "He has small bowel lymphoma. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Chemotherapy with radiation and no resection"}, {"letter": "B", "text": "Subtotal gastrectomy with regional nodes plus H. pylori eradication"}, {"letter": "C", "text": "Surgical resection plus chemotherapy"}, {"letter": "D", "text": "A proton pump inhibitor plus H. pylori eradication"}, {"letter": "E", "text": "Surgical resection plus a somatostatin analog"}], "answer": "C", "explanation": "The tumour is resected and chemotherapy follows it — the two together are the management, not one or the other. Gastrectomy with nodal clearance and eradication belongs to the gastric epithelial tumour, a somatostatin analog to the neuroendocrine one, and chemotherapy without resection to advanced gastric disease.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C2", "pgroup": "MA-C"}, {"id": "30", "group": 30, "stem": "A 52-year-old white woman presents to the primary care clinic with a year of episodic facial flushing and watery diarrhea, worse over the last three months, with crampy abdominal pain, nausea, and occasional vomiting. She has been treated as irritable bowel syndrome for two years. She has no MEN1 or MEN2 and no family history of endocrine tumors. Her temperature is 36.8°C, blood pressure is 108/66 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 99% on room air. Facial and upper-chest flushing is observed during the visit, and she has mild right lower quadrant tenderness with no palpable mass.\n\nStudies:\n    Hemoglobin / hematocrit — 12.6 g/dL / 38%\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Upper endoscopy for a duodenal lesion"}, {"letter": "B", "text": "Upper endoscopy with biopsy"}, {"letter": "C", "text": "CT or MR enterography"}, {"letter": "D", "text": "24-hour urinary 5-HIAA"}, {"letter": "E", "text": "CT of the small bowel"}], "answer": "D", "explanation": "Flushing with secretory diarrhea in a woman carrying a two-year functional label is a biochemical question before it is an imaging one, and the urinary breakdown product of serotonin is the test that asks it. A negative result would send the workup somewhere else entirely.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C3", "pgroup": "MA-C"}, {"id": "30A", "group": 30, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A 2.5-cm ileal mass near the ileocecal valve with hepatic lesions"}, {"letter": "B", "text": "A polypoid antral filling defect, ulcerated within the mass"}, {"letter": "C", "text": "An 8-cm exophytic jejunal mass with central necrosis"}, {"letter": "D", "text": "Bowel-wall thickening with a mass at the ileocecal valve"}, {"letter": "E", "text": "An ulcerated mass in the second duodenum at the ampulla"}], "answer": "A", "explanation": "Within the small bowel these tumors sit in the ileum, within about 60 cm of the ileocecal valve, and by the time the syndrome is florid there are usually hepatic deposits as well. A gastric or duodenal primary sits proximally, and a leiomyosarcoma is a bulky jejunal mass with central necrosis.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C3", "pgroup": "MA-C"}, {"id": "30B", "group": 30, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "MRCP of the biliary tree"}, {"letter": "B", "text": "Urea breath test for Helicobacter pylori"}, {"letter": "C", "text": "Endoscopic ultrasound with staging PET"}, {"letter": "D", "text": "Biopsy of the lesion"}, {"letter": "E", "text": "ERCP with brushings of the duct"}], "answer": "D", "explanation": "Biochemistry and imaging together make the diagnosis very likely, but histology is what names the cell of origin. The other assays confirm entirely different tumors and would return nothing informative here.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C3", "pgroup": "MA-C"}, {"id": "30C", "group": 30, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gastric adenocarcinoma"}, {"letter": "B", "text": "Carcinoid tumor"}, {"letter": "C", "text": "Small bowel lymphoma"}, {"letter": "D", "text": "Small-bowel adenocarcinoma"}, {"letter": "E", "text": "Small-bowel leiomyosarcoma"}], "answer": "B", "explanation": "Episodic flushing, watery diarrhea, and cramping driven by tumor-produced serotonin is carcinoid syndrome, and a raised urinary 5-HIAA is its biochemical signature. The other tumours in this differential present as a mass with bleeding or obstruction and produce nothing.", "objective": "", "section": "weight loss with an abdominal mass and one systemic clue", "pcase": "MA-C3", "pgroup": "MA-C"}, {"id": "31", "group": 31, "stem": "A 69-year-old African-American man presents to the primary care clinic because his eyes turned yellow six weeks ago and his urine has darkened. It does not hurt, though he has a dull ache below the sternum that bores into his back at night and keeps him awake. He has lost 20 pounds without trying. He smoked a pack a day for forty years and was diagnosed with type 2 diabetes eight months ago while he was losing weight. He does not drink alcohol. His temperature is 36.8°C, blood pressure is 128/78 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 98% on room air. He is jaundiced with scleral icterus, his gallbladder is palpable and not tender, his liver edge is 3 cm below the costal margin, and he has no ascites.\n\nStudies:\n    Total bilirubin — 9.8 mg/dL, direct 7.1 mg/dL\n    Alkaline phosphatase — 480 U/L\n    AST / ALT — 62 U/L / 70 U/L\n    Glucose — 214 mg/dL\n    CA 19-9 — 890 U/mL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT or MR enterography"}, {"letter": "B", "text": "Multiphasic contrast MRI of the liver"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "Upper endoscopy with biopsy"}, {"letter": "E", "text": "24-hour urinary 5-HIAA"}], "answer": "C", "explanation": "A cholestatic pattern with a conjugated hyperbilirubinemia asks one question first — is the biliary tree obstructed — and ultrasound answers it without contrast, radiation, or delay. Cross-sectional imaging follows to find the lesion causing it.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D1", "pgroup": "MA-D"}, {"id": "31A", "group": 31, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A dilated common bile duct with a shadowing stone and gallstones in the gallbladder"}, {"letter": "B", "text": "Multiple rim-enhancing lesions in a non-cirrhotic liver"}, {"letter": "C", "text": "Intrahepatic ductal dilation with an abrupt hilar stricture and no discrete mass"}, {"letter": "D", "text": "A pancreatic head mass with a dilated common bile duct and pancreatic duct"}, {"letter": "E", "text": "A 2.6-cm lesion with arterial hyperenhancement and venous washout in a cirrhotic"}], "answer": "D", "explanation": "A mass in the head of the gland obstructs the common bile duct and the pancreatic duct where they run together, and both dilate above it. A palpable non-tender gallbladder in a jaundiced patient means the obstruction is malignant until proven otherwise.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D1", "pgroup": "MA-D"}, {"id": "31B", "group": 31, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "MRCP of the biliary tree"}, {"letter": "B", "text": "ERCP with brushings of the stricture"}, {"letter": "C", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "D", "text": "Percutaneous liver biopsy"}, {"letter": "E", "text": "Endoscopic biopsy of the ampullary lesion"}], "answer": "C", "explanation": "Cytology is what establishes the cell type before an operation of this magnitude is offered, and endoscopic ultrasound reaches the head of the gland through the duodenal wall. Cholangiography images the duct without sampling the mass.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D1", "pgroup": "MA-D"}, {"id": "31C", "group": 31, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ampullary adenocarcinoma"}, {"letter": "B", "text": "Perihilar cholangiocarcinoma"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "Hepatocellular carcinoma"}, {"letter": "E", "text": "Pancreatic adenocarcinoma of the head"}], "answer": "E", "explanation": "Painless jaundice with a palpable non-tender gallbladder, weight loss, and back-boring pain in a smoker with new diabetes is malignant biliary obstruction, and both ducts dilating locates it in the head of the pancreas. A stone gives colicky pain and a fluctuating bilirubin instead.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D1", "pgroup": "MA-D"}], "pool": [{"case": "ES-B2", "group": "ES-B", "section": "dysphagia to solids AND liquids from a disordered esophageal muscle", "objective": "", "vignette_workup": "A 56-year-old man is referred to the gastroenterology clinic with a year of episodes of severe crushing retrosternal chest pain lasting several minutes, during which he cannot swallow solids or liquids; between the episodes he swallows normally. He also has heartburn and regurgitation. The episodes come and go and have not worsened. He has been to the emergency department twice for chest pain, with negative troponins and a normal stress test, and he takes no cardiac medications. He has lost no weight. His temperature is 36.6°C (97.9°F), blood pressure is 134/82 mm Hg, pulse is 80/min, respirations are 16/min, and oxygen saturation is 98% on room air. Examination is normal, with no epigastric tenderness and no chest wall tenderness reproducing the pain.", "labs_workup": [["Upper endoscopy with biopsy", "Normal mucosa with no ring, stricture, or mass; biopsies with no eosinophilia"], ["Barium swallow", "\"Corkscrew\" esophagus with simultaneous tertiary contractions"], ["Esophageal pH study", "Acid exposure time 3.1%, negative for pathologic reflux"]], "vignette_recog": "A 56-year-old man is referred to the gastroenterology clinic with a year of episodes of severe crushing retrosternal chest pain lasting several minutes, during which he cannot swallow solids or liquids; between the episodes he swallows normally. He also has heartburn and regurgitation. The episodes come and go and have not worsened. He has been to the emergency department twice for chest pain, with negative troponins and a normal stress test, and he takes no cardiac medications. He has lost no weight. His temperature is 36.6°C (97.9°F), blood pressure is 134/82 mm Hg, pulse is 80/min, respirations are 16/min, and oxygen saturation is 98% on room air. Examination is normal, with no epigastric tenderness and no chest wall tenderness reproducing the pain. He goes on to physiologic testing of the esophageal body.", "labs_recog": [["Upper endoscopy with biopsy", "Normal mucosa with no ring, stricture, or mass; biopsies with no eosinophilia"], ["Barium swallow", "\"Corkscrew\" esophagus with simultaneous tertiary contractions"], ["Esophageal pH study", "Acid exposure time 3.1%, negative for pathologic reflux"], ["Esophageal manometry", "Premature (simultaneous) distal contractions with normal lower esophageal sphincter relaxation"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "EGD with biopsy of the gastroesophageal junction"}, {"letter": "B", "text": "Esophageal biopsy histology"}, {"letter": "C", "text": "Ambulatory esophageal pH study with a BRAVO capsule"}, {"letter": "D", "text": "An empiric proton pump inhibitor trial for 8 weeks"}, {"letter": "E", "text": "Esophageal manometry"}], "answer": "E", "explanation": "Endoscopy and barium have already excluded a structural lesion, so what remains is a motor question, and manometry is the study that measures contraction timing and sphincter relaxation directly. A pH study has already been done and was negative, and repeat biopsies answer a question the first set settled."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "More than 15 eosinophils per high-power field"}, {"letter": "B", "text": "Pathologic acid exposure correlating with symptoms"}, {"letter": "C", "text": "An infiltrating tumor at the gastroesophageal junction"}, {"letter": "D", "text": "Premature simultaneous distal contractions with normal sphincter relaxation"}, {"letter": "E", "text": "Absent peristalsis with incomplete sphincter relaxation and an IRP of 26 mm Hg"}], "answer": "D", "explanation": "The disorder is one of timing rather than of outflow: the distal esophagus contracts all at once instead of in sequence, which produces the pain and the transient dysphagia, while the sphincter itself opens normally. Incomplete sphincter relaxation with a raised integrated relaxation pressure is the pattern of obstruction at the outlet, not of a disordered body."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Diffuse esophageal spasm"}, {"letter": "B", "text": "Eosinophilic esophagitis"}, {"letter": "C", "text": "Gastroesophageal reflux disease"}, {"letter": "D", "text": "Achalasia"}, {"letter": "E", "text": "Pseudoachalasia from a gastroesophageal junction malignancy"}], "answer": "A", "explanation": "Intermittent, non-progressive symptoms with chest pain leading and normal swallowing between attacks fit a spasm rather than a fixed obstruction. Achalasia progresses and retains food behind a sphincter that will not open; pseudoachalasia adds a short history with rapid weight loss in an older patient."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Diffuse esophageal spasm"}, {"letter": "B", "text": "Gastroesophageal reflux disease"}, {"letter": "C", "text": "Eosinophilic esophagitis"}, {"letter": "D", "text": "Achalasia"}, {"letter": "E", "text": "Pseudoachalasia from a gastroesophageal junction malignancy"}], "answer": "A", "explanation": "Premature simultaneous contractions with a sphincter that relaxes normally are the manometric definition of spasm. Achalasia would show absent peristalsis with incomplete relaxation, and a hypercontractile esophagus would show normally sequenced contractions of excessive amplitude instead."}, {"key": "mgmt", "path": "both", "stem": "He has diffuse esophageal spasm. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "B", "text": "A twice-daily proton pump inhibitor"}, {"letter": "C", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "D", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "E", "text": "A once-daily proton pump inhibitor for 8 weeks with lifestyle change"}], "answer": "B", "explanation": "Acid is a
