<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "Crystal Arthropathies-Concept_Adaptive_Exam", "questions": [{"id": "1", "group": 1, "section": "Crystal identification", "topic": "Pseudogout (CPPD)", "skill": "Identification", "stem": "Synovial fluid shows rhomboid-shaped crystals that are positively birefringent and appear blue when parallel to the compensator → Diagnosis:", "options": [{"letter": "A", "text": "Gout (monosodium urate)"}, {"letter": "B", "text": "Pseudogout (CPPD)"}, {"letter": "C", "text": "Basic calcium phosphate (BCP)"}, {"letter": "D", "text": "Septic arthritis"}, {"letter": "E", "text": "Rheumatoid arthritis"}], "answer": "B", "explanation": "**Rhomboid, positively birefringent, blue when parallel** crystals are calcium pyrophosphate — pseudogout. Gout crystals are needle-shaped, negatively birefringent and yellow when parallel.", "objective": "", "remediation": {"steps": [{"teach": "The two common crystal arthropathies are told apart by **crystal shape and birefringence** under polarized light, not by the clinical picture, which can look identical.", "stem": "Which crystal shape belongs to calcium pyrophosphate?", "options": [{"letter": "A", "text": "Needle-shaped"}, {"letter": "B", "text": "Rhomboid"}, {"letter": "C", "text": "Hydroxyapatite clumps needing special stains"}], "answer": "B", "explanation": "Calcium pyrophosphate crystals are rhomboid; monosodium urate crystals are needles; BCP crystals need special stains or EM.", "clarify": [{"teach": "Birefringence color depends on the crystal's orientation to the compensator.", "stem": "Positively birefringent crystals appear which color when parallel?", "options": [{"letter": "A", "text": "Blue"}, {"letter": "B", "text": "Yellow"}], "answer": "A", "explanation": "Positive birefringence = blue when parallel (CPPD); negative = yellow when parallel (gout)."}]}, {"teach": "Match each **birefringence pattern** to its disease: negative belongs with needles, positive with rhomboids.", "stem": "Needle-shaped, negatively birefringent, yellow when parallel → which disease?", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Pseudogout"}, {"letter": "C", "text": "Milwaukee shoulder"}], "answer": "A", "explanation": "Needle + negative + yellow-parallel is monosodium urate, i.e., gout.", "clarify": [{"stem": "Which crystal type is rarely identified because it needs special stains or electron microscopy?", "options": [{"letter": "A", "text": "Monosodium urate"}, {"letter": "B", "text": "Basic calcium phosphate (hydroxyapatite)"}], "answer": "B", "explanation": "The hydroxyapatite trio of BCP disease is not seen on routine polarized microscopy."}]}, {"teach": "Now put it together: rhomboid plus positive birefringence names the diagnosis.", "stem": "Rhomboid, positively birefringent crystals → Diagnosis:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Pseudogout (CPPD)"}, {"letter": "C", "text": "Septic arthritis"}], "answer": "B", "explanation": "Rhomboid, positively birefringent crystals are diagnostic of CPPD (pseudogout)."}], "checkpoints": [{"stem": "Which X-ray finding is the hallmark of CPPD deposition?", "options": [{"letter": "A", "text": "Punched-out erosions with overhanging edges"}, {"letter": "B", "text": "Chondrocalcinosis of the knee menisci"}, {"letter": "C", "text": "Calcium in the rotator cuff tendons"}, {"letter": "D", "text": "Double-contour sign"}], "answer": "B", "explanation": "Cartilage calcification (chondrocalcinosis), classically of the knee menisci, is the radiographic hallmark of CPPD."}, {"stem": "The chronic form of CPPD that involves the wrists and MCPs is said to mimic which disease?", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Rheumatoid arthritis"}, {"letter": "C", "text": "Septic arthritis"}, {"letter": "D", "text": "Tophaceous gout"}], "answer": "B", "explanation": "Chronic CPP inflammatory arthritis is the pseudo-rheumatoid form — wrists and MCPs, difficult to treat."}]}}, {"id": "2", "group": 1, "section": "Crystal identification", "topic": "Pseudogout (CPPD)", "skill": "Management", "stem": "For an acute CPPD flare confined to one large joint such as the knee → preferred first-line treatment:", "options": [{"letter": "A", "text": "Start allopurinol and titrate to a urate target"}, {"letter": "B", "text": "Joint aspiration plus intra-articular glucocorticoid"}, {"letter": "C", "text": "Pegloticase infusion every two weeks with methotrexate"}, {"letter": "D", "text": "Probenecid with aggressive oral hydration and ice"}, {"letter": "E", "text": "Prednisone taper with daily colchicine for six months"}], "answer": "B", "explanation": "Acute CPPD in a single joint is treated with **aspiration and intra-articular glucocorticoid** (plus immobilization and ice); systemic NSAIDs, colchicine or steroids are alternatives. Urate-lowering drugs do nothing for CPP crystals.", "objective": "", "remediation": {"steps": [{"teach": "Acute CPPD is treated like an acute gout flare for the **anti-inflammatory** part, but it has no equivalent of urate-lowering therapy.", "stem": "Which drug class has NO role in CPPD?", "options": [{"letter": "A", "text": "NSAIDs"}, {"letter": "B", "text": "Urate-lowering agents"}, {"letter": "C", "text": "Intra-articular glucocorticoids"}], "answer": "B", "explanation": "Allopurinol, febuxostat, probenecid and pegloticase lower uric acid, which is irrelevant to calcium pyrophosphate crystals.", "clarify": [{"stem": "Does lowering serum uric acid dissolve calcium pyrophosphate crystals?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "CPP crystals are not urate; urate-lowering therapy does nothing for them."}]}, {"teach": "When a flare involves a **single large joint**, a local approach treats the joint and confirms the diagnosis at the same time.", "stem": "What procedure both samples the fluid for crystals and delivers treatment to one inflamed knee?", "options": [{"letter": "A", "text": "Aspiration with intra-articular steroid injection"}, {"letter": "B", "text": "Dual-energy CT of the knee"}, {"letter": "C", "text": "Oral prednisone taper"}], "answer": "A", "explanation": "Aspirate and inject: the fluid goes for crystal analysis and Gram stain, the steroid treats the flare.", "clarify": [{"stem": "Before injecting steroid into a hot joint, what must be excluded?", "options": [{"letter": "A", "text": "Infection (Gram stain/culture)"}, {"letter": "B", "text": "Hyperuricemia"}], "answer": "A", "explanation": "Never inject steroid until septic arthritis has been excluded."}]}], "checkpoints": [{"stem": "A patient with CPPD has had four flares this year. What prophylaxis does the guide recommend?", "options": [{"letter": "A", "text": "Low-dose colchicine or daily NSAID with GI protection"}, {"letter": "B", "text": "Allopurinol titrated to urate below 6"}, {"letter": "C", "text": "Pegloticase every two weeks"}, {"letter": "D", "text": "No treatment is needed"}], "answer": "A", "explanation": "Recurrent CPPD (≥3 attacks/yr) gets low-dose colchicine or a daily NSAID plus GI protection; no urate-lowering therapy."}, {"stem": "Chondrocalcinosis is found incidentally on a knee X-ray in a patient with no joint symptoms. Management?", "options": [{"letter": "A", "text": "Intra-articular steroid"}, {"letter": "B", "text": "Daily colchicine"}, {"letter": "C", "text": "No treatment"}, {"letter": "D", "text": "Start febuxostat"}], "answer": "C", "explanation": "Asymptomatic chondrocalcinosis needs no treatment."}]}}, {"id": "3", "group": 3, "section": "Hyperuricemia triggers", "topic": "Gout", "skill": "Pharmacology", "multi": true, "stem": "Which of the following drugs raise serum uric acid and can trigger a gout flare?", "options": [{"letter": "A", "text": "Thiazide diuretics"}, {"letter": "B", "text": "Low-dose aspirin"}, {"letter": "C", "text": "Febuxostat (Uloric)"}, {"letter": "D", "text": "Cyclosporine"}, {"letter": "E", "text": "Probenecid (uricosuric)"}], "answers": ["A", "B", "D"], "explanation": "Hyperuricemic drugs include **thiazide and loop diuretics, low-dose salicylates, cyclosporine/tacrolimus, pyrazinamide, ethambutol, niacin, lead and alcohol**. Febuxostat and probenecid lower uric acid.", "objective": "", "remediation": {"steps": [{"teach": "Most hyperuricemia is **renal under-excretion**, so drugs that reduce renal urate clearance are the classic culprits.", "stem": "Which diuretic class is a classic cause of hyperuricemia?", "options": [{"letter": "A", "text": "Thiazide diuretics"}, {"letter": "B", "text": "Carbonic anhydrase inhibitors"}, {"letter": "C", "text": "Potassium-sparing diuretics"}], "answer": "A", "explanation": "Thiazide and loop diuretics both raise uric acid and are listed culprit drugs.", "clarify": [{"stem": "Is the mechanism of most gout overproduction or under-excretion of urate?", "options": [{"letter": "A", "text": "Under-excretion"}, {"letter": "B", "text": "Overproduction"}], "answer": "A", "explanation": "Two-thirds of urate is excreted renally and 90% is reabsorbed proximally; under-excretion dominates."}]}, {"teach": "Aspirin's effect depends on dose: the guide flags **low-dose salicylates** as hyperuricemic.", "stem": "Which aspirin regimen is listed as a gout trigger?", "options": [{"letter": "A", "text": "Low-dose aspirin"}, {"letter": "B", "text": "Aspirin is never a trigger"}], "answer": "A", "explanation": "Low-dose salicylates reduce urate excretion and are on the culprit-drug list to review at every gout visit.", "clarify": [{"stem": "Which transplant immunosuppressants raise uric acid?", "options": [{"letter": "A", "text": "Cyclosporine and tacrolimus"}, {"letter": "B", "text": "Methotrexate and mycophenolate"}], "answer": "A", "explanation": "Cyclosporine and tacrolimus are hyperuricemic; methotrexate/mycophenolate appear in the guide only as antibody blockers for pegloticase."}]}, {"teach": "Two of the listed options are **urate-lowering drugs** and therefore cannot be triggers.", "stem": "Febuxostat and probenecid belong to which category?", "options": [{"letter": "A", "text": "Hyperuricemic culprit drugs"}, {"letter": "B", "text": "Urate-lowering therapies"}, {"letter": "C", "text": "Acute anti-inflammatory agents"}], "answer": "B", "explanation": "Febuxostat is a xanthine-oxidase inhibitor and probenecid a uricosuric — both lower uric acid."}], "checkpoints": [{"stem": "Besides drugs, which dietary item does the guide call the most important to cut in gout?", "options": [{"letter": "A", "text": "Dairy"}, {"letter": "B", "text": "Alcohol"}, {"letter": "C", "text": "Leafy vegetables"}, {"letter": "D", "text": "Whole grains"}], "answer": "B", "explanation": "Alcohol is listed as the top dietary trigger, above shellfish, oily fish, red meat and fructose."}, {"stem": "Which anti-tuberculosis drugs are listed as hyperuricemic?", "options": [{"letter": "A", "text": "Isoniazid and rifampin"}, {"letter": "B", "text": "Pyrazinamide and ethambutol"}, {"letter": "C", "text": "Streptomycin and amikacin"}, {"letter": "D", "text": "Linezolid and moxifloxacin"}], "answer": "B", "explanation": "Pyrazinamide and ethambutol raise uric acid."}]}, "answer": "A,B,D"}, {"id": "4", "group": 4, "section": "Uric acid numbers", "topic": "Uric acid levels", "skill": "Disease process", "stem": "Above which serum uric acid concentration can urate begin to crystallize (the serum saturation point)?", "options": [{"letter": "A", "text": "2.0 mg/dL"}, {"letter": "B", "text": "5.0 mg/dL"}, {"letter": "C", "text": "6.0 mg/dL"}, {"letter": "D", "text": "6.8 mg/dL"}, {"letter": "E", "text": "10.0 mg/dL"}], "answer": "D", "explanation": "The **serum saturation point is 6.8 mg/dL**; above it urate can crystallize. Normal range is 2–8, the treatment target is <6 (<5 with tophi), and >10 asymptomatic carries a 50% gout risk.", "objective": "", "remediation": {"steps": [{"teach": "The guide gives four uric-acid numbers: the **normal range**, the **saturation point**, the **treatment targets**, and the **high-risk asymptomatic level**.", "stem": "What is the normal serum uric acid range?", "options": [{"letter": "A", "text": "2–8 mg/dL"}, {"letter": "B", "text": "8–12 mg/dL"}, {"letter": "C", "text": "0.5–2 mg/dL"}], "answer": "A", "explanation": "Normal is 2–8 mg/dL, higher in men than women.", "clarify": [{"stem": "Who normally has the higher uric acid?", "options": [{"letter": "A", "text": "Men"}, {"letter": "B", "text": "Women before menopause"}], "answer": "A", "explanation": "Estrogen is uricosuric, so premenopausal women run lower levels."}]}, {"teach": "The saturation point sits **inside the normal range**, which is why 'normal' values can still permit crystal formation.", "stem": "The saturation point is closest to which value?", "options": [{"letter": "A", "text": "Just under 7 mg/dL"}, {"letter": "B", "text": "Exactly 10 mg/dL"}, {"letter": "C", "text": "Around 4 mg/dL"}], "answer": "A", "explanation": "Saturation is 6.8 mg/dL — just under 7, below the upper limit of normal.", "clarify": [{"stem": "Why is the long-term treatment target set below 6 mg/dL?", "options": [{"letter": "A", "text": "To stay under the saturation point so crystals dissolve"}, {"letter": "B", "text": "Because 6 is the lower limit of normal"}], "answer": "A", "explanation": "Keeping urate under saturation (<6, <5 with tophi) lets deposits dissolve."}]}], "checkpoints": [{"stem": "An asymptomatic patient has a serum uric acid above 10 mg/dL. What lifetime risk of gout does the guide quote?", "options": [{"letter": "A", "text": "10%"}, {"letter": "B", "text": "25%"}, {"letter": "C", "text": "50%"}, {"letter": "D", "text": "90%"}], "answer": "C", "explanation": "Asymptomatic hyperuricemia >10 mg/dL carries a 50% risk of developing gout; the lecture does not treat it."}, {"stem": "What is the urate target for a gout patient who has tophi?", "options": [{"letter": "A", "text": "Below 8 mg/dL"}, {"letter": "B", "text": "Below 6.8 mg/dL"}, {"letter": "C", "text": "Below 6 mg/dL"}, {"letter": "D", "text": "Below 5 mg/dL"}], "answer": "D", "explanation": "Target is <6 mg/dL in general and the tighter <5 mg/dL when tophi are present."}]}}, {"id": "5", "group": 5, "section": "Pathophysiology", "topic": "Gout", "skill": "Disease process", "stem": "Which mechanism accounts for the majority of hyperuricemia in gout?", "options": [{"letter": "A", "text": "Overproduction from high cell turnover"}, {"letter": "B", "text": "Excess dietary purine intake"}, {"letter": "C", "text": "Renal under-excretion of urate"}, {"letter": "D", "text": "Reduced intestinal elimination of urate"}, {"letter": "E", "text": "PRPP synthetase overactivity"}], "answer": "C", "explanation": "Two-thirds of urate is excreted by the kidney and **90% is reabsorbed in the proximal tubule**, so most gout is **renal under-excretion**, not overproduction. Diet has limited effect without another cause.", "objective": "", "remediation": {"steps": [{"teach": "Uric acid is the end product of **purine metabolism**; humans lack the enzyme that would convert it further.", "stem": "Where does most uric acid come from?", "options": [{"letter": "A", "text": "Turnover of intracellular nucleic acids"}, {"letter": "B", "text": "Dietary purines"}, {"letter": "C", "text": "Bacterial production in the gut"}], "answer": "A", "explanation": "Two-thirds comes from endogenous nucleic-acid turnover; only one-third is dietary.", "clarify": [{"stem": "Which enzyme do humans lack that other mammals use to convert uric acid to allantoin?", "options": [{"letter": "A", "text": "Uricase"}, {"letter": "B", "text": "Xanthine oxidase"}], "answer": "A", "explanation": "Humans lack uricase; pegloticase is a pegylated uricase that supplies it."}]}, {"teach": "Excretion splits between **kidney and gut**, and the renal handling involves heavy reabsorption.", "stem": "What fraction of urate is excreted by the kidney?", "options": [{"letter": "A", "text": "One-third"}, {"letter": "B", "text": "Two-thirds"}, {"letter": "C", "text": "Nearly all"}], "answer": "B", "explanation": "Two-thirds renal, one-third gut; the renal portion is 100% filtered and 90% reabsorbed proximally.", "clarify": [{"stem": "How much filtered urate is reabsorbed in the proximal tubule?", "options": [{"letter": "A", "text": "About 10%"}, {"letter": "B", "text": "About 90%"}], "answer": "B", "explanation": "90% proximal reabsorption is why small changes in tubular handling drive hyperuricemia."}]}, {"teach": "Because reabsorption is so dominant, the common cause of hyperuricemia follows directly.", "stem": "Most gout results from which defect?", "options": [{"letter": "A", "text": "Renal under-excretion"}, {"letter": "B", "text": "Overproduction"}], "answer": "A", "explanation": "Under-excretion — primary hereditary tubular defects or CKD of any cause — dominates."}], "checkpoints": [{"stem": "Which of the following is an OVERPRODUCTION cause of hyperuricemia?", "options": [{"letter": "A", "text": "Chronic kidney disease"}, {"letter": "B", "text": "Thiazide diuretic use"}, {"letter": "C", "text": "Myeloproliferative disease"}, {"letter": "D", "text": "Hereditary tubular defect"}], "answer": "C", "explanation": "High cell turnover states — leukemia, lymphoma, myeloproliferative disease, psoriasis, hemolytic anemia, polycythemia vera — overproduce urate."}, {"stem": "The symptom-free interval between gout flares is called the:", "options": [{"letter": "A", "text": "Asymptomatic hyperuricemia stage"}, {"letter": "B", "text": "Intercritical period"}, {"letter": "C", "text": "Tophaceous stage"}, {"letter": "D", "text": "Prodrome"}], "answer": "B", "explanation": "Stages: asymptomatic hyperuricemia → acute flare → intercritical period → chronic tophaceous gout."}]}}, {"id": "6", "group": 6, "section": "Urate-lowering therapy", "topic": "Gout", "skill": "Management", "multi": true, "stem": "Which of the following are indications to start long-term urate-lowering therapy in gout?", "options": [{"letter": "A", "text": "Two to three or more flares per year"}, {"letter": "B", "text": "Presence of tophi"}, {"letter": "C", "text": "Asymptomatic uric acid above 10 mg/dL"}, {"letter": "D", "text": "Uric acid kidney stones"}, {"letter": "E", "text": "A single first flare of podagra"}], "answers": ["A", "B", "D"], "explanation": "ULT is indicated for **≥2–3 flares/yr, tophi, erosions on imaging, or renal stones**. The lecture does not treat asymptomatic hyperuricemia, and a first isolated flare is managed acutely.", "objective": "", "remediation": {"steps": [{"teach": "Urate-lowering therapy is a **long-term** commitment reserved for patients whose disease shows it is **recurrent or depositing**.", "stem": "How many flares per year does the guide use as a threshold for urate-lowering therapy?", "options": [{"letter": "A", "text": "One"}, {"letter": "B", "text": "Two to three or more"}, {"letter": "C", "text": "Six or more"}], "answer": "B", "explanation": "≥2–3 attacks per year is the recurrence threshold.", "clarify": [{"stem": "Is a single first gout flare an indication for allopurinol?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "A first flare is treated acutely; ULT needs recurrence or evidence of deposition."}]}, {"teach": "Evidence of **urate deposition** anywhere in the body also qualifies, regardless of flare count.", "stem": "Which finding is evidence of urate deposition that indicates ULT?", "options": [{"letter": "A", "text": "Tophi"}, {"letter": "B", "text": "Mild leukocytosis during a flare"}, {"letter": "C", "text": "Elevated ESR"}], "answer": "A", "explanation": "Tophi, erosions on imaging and renal stones are all deposition indications.", "clarify": [{"stem": "Which renal finding is an indication for ULT?", "options": [{"letter": "A", "text": "Uric acid kidney stones"}, {"letter": "B", "text": "Microscopic hematuria alone"}], "answer": "A", "explanation": "Renal stones (uric acid, or MSU nidus for calcium oxalate) are an ULT indication."}]}, {"teach": "A high number alone is **not** an indication: the lecture does not treat asymptomatic hyperuricemia.", "stem": "Asymptomatic uric acid above 10 mg/dL with no flares → management?", "options": [{"letter": "A", "text": "Start allopurinol"}, {"letter": "B", "text": "No urate-lowering therapy; it carries a 50% gout risk but is not treated"}], "answer": "B", "explanation": "The lecture quotes a 50% risk but does not treat asymptomatic hyperuricemia."}], "checkpoints": [{"stem": "A gout patient qualifies for urate-lowering therapy. What must be prescribed alongside it at the start?", "options": [{"letter": "A", "text": "Flare prophylaxis with colchicine for 3–6 months"}, {"letter": "B", "text": "A one-week prednisone taper only"}, {"letter": "C", "text": "Pegloticase loading infusion"}, {"letter": "D", "text": "Nothing additional"}], "answer": "A", "explanation": "Starting ULT precipitates flares, so colchicine (or low-dose NSAID/steroid) prophylaxis runs 3–6 months."}, {"stem": "Which imaging finding is itself an indication for urate-lowering therapy?", "options": [{"letter": "A", "text": "Soft-tissue swelling"}, {"letter": "B", "text": "Erosions"}, {"letter": "C", "text": "Joint effusion"}, {"letter": "D", "text": "Osteopenia"}], "answer": "B", "explanation": "Erosions on imaging are an ULT indication along with flares, tophi and stones."}]}, "answer": "A,B,D"}, {"id": "7", "group": 7, "section": "Diagnosis", "topic": "Gout", "skill": "Diagnostics & imaging", "stem": "Gold-standard test for diagnosing gout → Best test:", "options": [{"letter": "A", "text": "Serum uric acid level drawn during the flare"}, {"letter": "B", "text": "Dual-energy CT of the symptomatic joint"}, {"letter": "C", "text": "Synovial fluid polarized-light microscopy"}, {"letter": "D", "text": "Plain radiograph looking for erosions with overhang"}, {"letter": "E", "text": "ESR and C-reactive protein with a white cell count"}], "answer": "C", "explanation": "The gold standard is **synovial fluid analysis by polarized-light microscopy** showing intracellular, needle-shaped, negatively birefringent crystals. Blood work is non-specific and uric acid can be normal during a flare.", "objective": "", "remediation": {"steps": [{"teach": "Gout is a **crystal** disease, so the definitive test is the one that **sees the crystal**.", "stem": "Which specimen is examined to confirm gout?", "options": [{"letter": "A", "text": "Synovial fluid"}, {"letter": "B", "text": "Serum"}, {"letter": "C", "text": "24-hour urine"}], "answer": "A", "explanation": "Joint fluid (or tophus aspirate) under polarized light is diagnostic.", "clarify": [{"stem": "Where are the diagnostic crystals typically located in the fluid?", "options": [{"letter": "A", "text": "Intracellular, within leukocytes"}, {"letter": "B", "text": "Only free-floating in the fluid"}], "answer": "A", "explanation": "Intracellular needle-shaped crystals confirm an active crystal arthritis."}]}, {"teach": "Blood tests and imaging **support** the diagnosis but none replaces the crystal.", "stem": "Why is serum uric acid not the diagnostic test?", "options": [{"letter": "A", "text": "It can be normal during an attack"}, {"letter": "B", "text": "It is too expensive"}, {"letter": "C", "text": "It is only measurable in men"}], "answer": "A", "explanation": "Uric acid has low diagnostic yield — it can be normal during a flare.", "clarify": [{"stem": "Which imaging modality is described as diagnostic but expensive?", "options": [{"letter": "A", "text": "Dual-energy CT"}, {"letter": "B", "text": "Plain radiograph"}], "answer": "A", "explanation": "DECT shows urate deposits but is expensive; ultrasound double-contour sign is the cheaper diagnostic image."}]}], "checkpoints": [{"stem": "What synovial fluid WBC range is typical of a crystal-induced effusion?", "options": [{"letter": "A", "text": "Under 2,000"}, {"letter": "B", "text": "10,000–50,000"}, {"letter": "C", "text": "Over 200,000"}, {"letter": "D", "text": "Exactly 100,000"}], "answer": "B", "explanation": "Crystal-induced fluid typically has 10,000–50,000 WBC; 200,000 with no crystals points to septic arthritis."}, {"stem": "Which ultrasound finding is described as diagnostic of gout?", "options": [{"letter": "A", "text": "Chondrocalcinosis"}, {"letter": "B", "text": "Double-contour sign"}, {"letter": "C", "text": "Rotator cuff calcification"}, {"letter": "D", "text": "Joint effusion"}], "answer": "B", "explanation": "The double-contour sign on ultrasound is diagnostic of gout."}]}}, {"id": "8", "group": 8, "section": "Diagnosis", "topic": "Uric acid levels", "skill": "Diagnostics & imaging", "stem": "A serum uric acid measured during an acute flare returns within the normal range. How should this result be interpreted?", "options": [{"letter": "A", "text": "Gout is excluded"}, {"letter": "B", "text": "Pseudogout is confirmed"}, {"letter": "C", "text": "It does not exclude gout"}, {"letter": "D", "text": "The flare must be septic"}, {"letter": "E", "text": "Urate-lowering therapy is contraindicated"}], "answer": "C", "explanation": "Uric acid **can be normal during an attack** and has low diagnostic yield; the diagnosis rests on **crystals**, not the serum level.", "objective": "", "remediation": {"steps": [{"teach": "The serum urate level reflects **long-term burden**, not what is happening inside the joint at the moment of the flare.", "stem": "During an acute gout flare, the serum uric acid may be:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Always above 10 mg/dL"}, {"letter": "C", "text": "Undetectable"}], "answer": "A", "explanation": "Uric acid can be normal during an attack, which is why it is not diagnostic.", "clarify": [{"stem": "What makes the diagnosis of gout?", "options": [{"letter": "A", "text": "Needle-shaped negatively birefringent crystals in joint fluid"}, {"letter": "B", "text": "A uric acid above 8 mg/dL"}], "answer": "A", "explanation": "Crystals, not the serum number, make the diagnosis."}]}, {"teach": "Other blood work during a flare is likewise **not specific**.", "stem": "Which blood findings may accompany a flare but do not confirm gout?", "options": [{"letter": "A", "text": "Mild leukocytosis with raised ESR/CRP"}, {"letter": "B", "text": "Positive rheumatoid factor"}, {"letter": "C", "text": "Anti-dsDNA antibodies"}], "answer": "A", "explanation": "Mild leukocytosis and elevated ESR/CRP are non-specific inflammatory markers."}], "checkpoints": [{"stem": "A patient has a hot swollen knee; uric acid is 5.9 mg/dL. What is the correct next step?", "options": [{"letter": "A", "text": "Rule out gout and treat as osteoarthritis"}, {"letter": "B", "text": "Aspirate the joint for crystal analysis and Gram stain"}, {"letter": "C", "text": "Start allopurinol immediately"}, {"letter": "D", "text": "Repeat the uric acid in one week"}], "answer": "B", "explanation": "A normal urate does not exclude gout; tap the joint — crystals (and Gram stain) decide."}, {"stem": "Where is the serum uric acid level most useful in gout care?", "options": [{"letter": "A", "text": "Confirming the diagnosis during a flare"}, {"letter": "B", "text": "Monitoring urate-lowering therapy to target"}, {"letter": "C", "text": "Distinguishing gout from pseudogout"}, {"letter": "D", "text": "Excluding septic arthritis"}], "answer": "B", "explanation": "Its role is tracking treatment to the <6 (<5 with tophi) target, not diagnosis."}]}}, {"id": "9", "group": 9, "section": "CPPD associations", "topic": "Pseudogout (CPPD)", "skill": "Disease process", "multi": true, "stem": "CPPD in a young patient prompts screening for an underlying metabolic cause. Which conditions are on that screening list?", "options": [{"letter": "A", "text": "Hyperparathyroidism"}, {"letter": "B", "text": "Hemochromatosis"}, {"letter": "C", "text": "Psoriasis"}, {"letter": "D", "text": "Hypomagnesemia"}, {"letter": "E", "text": "Polycythemia vera"}], "answers": ["A", "B", "D"], "explanation": "Young CPPD → screen for **hyperparathyroidism, hemochromatosis, hypophosphatasia, hypomagnesemia** (Ca/PTH, iron, ALP, Mg). Psoriasis and polycythemia vera are high-turnover causes of hyperuricemia and gout, not CPPD.", "objective": "", "remediation": {"steps": [{"teach": "CPPD is normally a disease of **aging**; when it appears young, a **metabolic driver** of calcium pyrophosphate deposition is sought.", "stem": "In whom does CPPD usually occur without a secondary cause?", "options": [{"letter": "A", "text": "The elderly"}, {"letter": "B", "text": "Men in their 30s"}, {"letter": "C", "text": "Children"}], "answer": "A", "explanation": "CPPD rises with age — nearly half of people in their late 80s have CPP on radiographs.", "clarify": [{"stem": "Roughly what fraction of patients in their late 80s have CPP on X-ray?", "options": [{"letter": "A", "text": "About one-half"}, {"letter": "B", "text": "About 4%"}], "answer": "A", "explanation": "Nearly ½ in the late 80s; 4% is the prevalence of gout."}]}, {"teach": "The screening list targets **mineral and iron metabolism**: calcium/PTH, iron, alkaline phosphatase and magnesium.", "stem": "Which lab pairing matches the CPPD screen for hyperparathyroidism?", "options": [{"letter": "A", "text": "Calcium and PTH"}, {"letter": "B", "text": "Uric acid and creatinine"}, {"letter": "C", "text": "ESR and CRP"}], "answer": "A", "explanation": "Ca/PTH for hyperparathyroidism, iron studies for hemochromatosis, ALP for hypophosphatasia, Mg for hypomagnesemia.", "clarify": [{"stem": "Low alkaline phosphatase on the CPPD screen suggests which condition?", "options": [{"letter": "A", "text": "Hypophosphatasia"}, {"letter": "B", "text": "Hemochromatosis"}], "answer": "A", "explanation": "Hypophosphatasia is the ALP item on the screen; hemochromatosis is the iron item."}]}, {"teach": "Two of the options come from the **gout** side of the guide — high cell-turnover states that overproduce urate.", "stem": "Psoriasis and polycythemia vera are associated with which crystal disease?", "options": [{"letter": "A", "text": "CPPD"}, {"letter": "B", "text": "Gout (urate overproduction)"}], "answer": "B", "explanation": "They are high-turnover overproduction causes of hyperuricemia, not CPPD associations."}], "checkpoints": [{"stem": "Which joints does acute CPPD most often involve?", "options": [{"letter": "A", "text": "First MTP and ankles"}, {"letter": "B", "text": "Wrist and knee"}, {"letter": "C", "text": "Shoulder and hip"}, {"letter": "D", "text": "Distal interphalangeal joints"}], "answer": "B", "explanation": "CPPD favors the wrist and knee; gout favors the 1st MTP, feet and ankles."}, {"stem": "A 40-year-old with chondrocalcinosis has high serum iron and ferritin. Which associated condition is this?", "options": [{"letter": "A", "text": "Hypomagnesemia"}, {"letter": "B", "text": "Hyperparathyroidism"}, {"letter": "C", "text": "Hemochromatosis"}, {"letter": "D", "text": "Hypophosphatasia"}], "answer": "C", "explanation": "Iron overload (hemochromatosis) is one of the four metabolic causes of young-onset CPPD."}]}, "answer": "A,B,D"}, {"id": "10", "group": 10, "section": "Urate-lowering therapy", "topic": "Allopurinol", "skill": "Pharmacology", "stem": "Which agent is first-line urate-lowering therapy and is effective in both under-excretors and overproducers of uric acid?", "options": [{"letter": "A", "text": "Probenecid"}, {"letter": "B", "text": "Allopurinol"}, {"letter": "C", "text": "Colchicine"}, {"letter": "D", "text": "Lesinurad"}, {"letter": "E", "text": "Pegloticase (Krystexxa)"}], "answer": "B", "explanation": "**Allopurinol**, a xanthine-oxidase inhibitor, is first-line ULT and works regardless of whether the patient under-excretes or overproduces. Probenecid is a less effective uricosuric; pegloticase is reserved for refractory tophaceous disease.", "objective": "", "remediation": {"steps": [{"teach": "Urate-lowering drugs fall into three families: **xanthine-oxidase inhibitors**, **uricosurics**, and **uricase**.", "stem": "Which family does allopurinol belong to?", "options": [{"letter": "A", "text": "Xanthine-oxidase inhibitors"}, {"letter": "B", "text": "Uricosurics"}, {"letter": "C", "text": "Pegylated uricase"}], "answer": "A", "explanation": "Allopurinol and febuxostat are XOIs; probenecid and lesinurad are uricosurics; pegloticase is a uricase.", "clarify": [{"stem": "Which XOI is the alternative when allopurinol fails or is not tolerated?", "options": [{"letter": "A", "text": "Febuxostat"}, {"letter": "B", "text": "Probenecid"}], "answer": "A", "explanation": "Febuxostat (Uloric) is the XOI alternative with less hypersensitivity."}]}, {"teach": "Uricosurics only help when the kidney can **excrete more**; XOIs cut production and so work in **every** patient type.", "stem": "Why is probenecid considered less useful than XOIs?", "options": [{"letter": "A", "text": "It is less effective and must be avoided in CKD"}, {"letter": "B", "text": "It causes allopurinol hypersensitivity syndrome"}, {"letter": "C", "text": "It is only available intravenously"}], "answer": "A", "explanation": "Probenecid blocks tubular reabsorption; it is less effective than XOIs and ineffective/stone-forming in CKD.", "clarify": [{"stem": "Which drug class works in both under-excretors and overproducers?", "options": [{"letter": "A", "text": "Xanthine-oxidase inhibitors"}, {"letter": "B", "text": "Uricosurics"}], "answer": "A", "explanation": "Reducing production helps regardless of the renal defect."}]}], "checkpoints": [{"stem": "A patient starting allopurinol has CKD. How is dosing approached?", "options": [{"letter": "A", "text": "Start at the maximum dose"}, {"letter": "B", "text": "Keep doses low and titrate"}, {"letter": "C", "text": "Switch to probenecid instead"}, {"letter": "D", "text": "Allopurinol is contraindicated"}], "answer": "B", "explanation": "Allopurinol is used in CKD but started low (100 mg/day) and titrated; febuxostat is the CKD-friendly alternative."}, {"stem": "Which agent is reserved for refractory tophaceous gout and converts uric acid to allantoin?", "options": [{"letter": "A", "text": "Febuxostat"}, {"letter": "B", "text": "Lesinurad"}, {"letter": "C", "text": "Pegloticase"}, {"letter": "D", "text": "Anakinra"}], "answer": "C", "explanation": "Pegloticase is pegylated uricase given IV every two weeks."}]}}, {"id": "11", "group": 11, "section": "Drug safety", "topic": "Allopurinol", "skill": "Counseling & prevention", "stem": "Before starting allopurinol in a patient of African or South Asian descent, which test is recommended to reduce the risk of a severe hypersensitivity reaction?", "options": [{"letter": "A", "text": "HLA-B*58:01 genotype"}, {"letter": "B", "text": "Baseline creatine kinase"}, {"letter": "C", "text": "G6PD activity level"}, {"letter": "D", "text": "Serum ferritin and iron saturation"}, {"letter": "E", "text": "Urinary uric acid to creatinine ratio"}], "answer": "A", "explanation": "Rare **allopurinol hypersensitivity syndrome** is linked to **HLA-B*58:01**; the guide recommends checking it in patients of African and South Asian descent.", "objective": "", "remediation": {"steps": [{"teach": "Allopurinol's most feared adverse effect is a rare **hypersensitivity syndrome** with a known **genetic marker**.", "stem": "The allopurinol hypersensitivity risk is tied to which type of marker?", "options": [{"letter": "A", "text": "An HLA allele"}, {"letter": "B", "text": "A liver enzyme level"}, {"letter": "C", "text": "A serum uric acid cutoff"}], "answer": "A", "explanation": "An HLA-B allele predicts the hypersensitivity syndrome.", "clarify": [{"stem": "Which populations does the guide single out for screening?", "options": [{"letter": "A", "text": "African and South Asian descent"}, {"letter": "B", "text": "Northern European descent"}], "answer": "A", "explanation": "Patients of African and South Asian descent are screened before allopurinol."}]}, {"teach": "Name the allele exactly — it is a frequent board item.", "stem": "Which allele is checked?", "options": [{"letter": "A", "text": "HLA-B*27"}, {"letter": "B", "text": "HLA-B*58:01"}, {"letter": "C", "text": "HLA-DR4"}], "answer": "B", "explanation": "HLA-B*58:01 predicts allopurinol hypersensitivity syndrome."}], "checkpoints": [{"stem": "A patient cannot tolerate allopurinol. Which alternative carries less hypersensitivity risk but a boxed warning for cardiovascular death?", "options": [{"letter": "A", "text": "Probenecid"}, {"letter": "B", "text": "Febuxostat"}, {"letter": "C", "text": "Colchicine"}, {"letter": "D", "text": "Pegloticase"}], "answer": "B", "explanation": "Febuxostat has less hypersensitivity than allopurinol but a BBW for CV death (2019 study, not confirmed later)."}, {"stem": "What two things accompany the start of allopurinol according to the guide?", "options": [{"letter": "A", "text": "High starting dose and a one-week steroid taper"}, {"letter": "B", "text": "Low starting dose and 3–6 months of flare prophylaxis"}, {"letter": "C", "text": "Probenecid and aggressive hydration"}, {"letter": "D", "text": "Pegloticase and methotrexate"}], "answer": "B", "explanation": "Start 100 mg/day and titrate, with colchicine (or low-dose NSAID/steroid) prophylaxis for 3–6 months."}]}}, {"id": "12", "group": 12, "section": "Renal manifestations", "topic": "Urate nephropathy", "skill": "Complications", "stem": "Urinary uric acid : creatinine ratio >1, CT showing interstitial fibrosis, scarring, and microtophi in the renal medulla → Diagnosis:", "options": [{"letter": "A", "text": "Uric acid nephrolithiasis"}, {"letter": "B", "text": "Allopurinol hypersensitivity"}, {"letter": "C", "text": "Urate nephropathy"}, {"letter": "D", "text": "Calcium oxalate stones"}, {"letter": "E", "text": "Chondrocalcinosis"}], "answer": "C", "explanation": "**Urate nephropathy** (rare) is interstitial nephritis and scarring from urate; diagnosis uses serum and urine uric acid, a **urinary UA:Cr ratio >1**, and CT showing **medullary microtophi**.", "objective": "", "remediation": {"steps": [{"teach": "Chronic gout damages the kidney in two ways: **stones** in the collecting system and **parenchymal** urate deposition.", "stem": "Which renal manifestation of gout involves interstitial nephritis and scarring?", "options": [{"letter": "A", "text": "Urate nephropathy"}, {"letter": "B", "text": "Uric acid stones"}, {"letter": "C", "text": "Calcium oxalate stones"}], "answer": "A", "explanation": "Urate nephropathy is interstitial nephritis with scarring and declining renal function; it is rare.", "clarify": [{"stem": "How common is urate nephropathy per the guide?", "options": [{"letter": "A", "text": "Rare"}, {"letter": "B", "text": "Present in most gout patients"}], "answer": "A", "explanation": "It is labeled rare."}]}, {"teach": "The diagnostic clues are a **urine ratio** and a **CT pattern**.", "stem": "Which urinary finding supports urate nephropathy?", "options": [{"letter": "A", "text": "Uric acid : creatinine ratio above 1"}, {"letter": "B", "text": "Protein : creatinine ratio above 3"}, {"letter": "C", "text": "Sterile pyuria"}], "answer": "A", "explanation": "A urinary UA:Cr ratio >1 plus CT microtophi in the renal medulla points to urate nephropathy.", "clarify": [{"stem": "Where on CT are the microtophi of urate nephropathy found?", "options": [{"letter": "A", "text": "Renal medulla"}, {"letter": "B", "text": "Bladder wall"}], "answer": "A", "explanation": "Medullary microtophi with interstitial fibrosis and scarring."}]}], "checkpoints": [{"stem": "How do MSU crystals contribute to calcium oxalate stones in gout?", "options": [{"letter": "A", "text": "They dissolve existing oxalate stones"}, {"letter": "B", "text": "They form a nidus around which calcium oxalate deposits"}, {"letter": "C", "text": "They raise urinary pH"}, {"letter": "D", "text": "They have no relation to oxalate stones"}], "answer": "B", "explanation": "Gout stones are uric acid stones or MSU crystals acting as a nidus for calcium oxalate."}, {"stem": "A gout patient with renal stones and CKD needs urate lowering. Which drug is avoided?", "options": [{"letter": "A", "text": "Allopurinol"}, {"letter": "B", "text": "Febuxostat"}, {"letter": "C", "text": "Probenecid"}, {"letter": "D", "text": "Colchicine"}], "answer": "C", "explanation": "Probenecid is ineffective in CKD and increases stone risk; use low-dose allopurinol or febuxostat."}]}}, {"id": "13", "group": 13, "section": "Crystal identification", "topic": "Basic calcium phosphate (BCP / HADD)", "skill": "Identification", "stem": "Older woman, destructive arthropathy of the rotator cuff and glenohumeral joint, X-ray calcium deposition in periarticular tendons → Diagnosis:", "options": [{"letter": "A", "text": "Chronic tophaceous gout"}, {"letter": "B", "text": "Milwaukee shoulder (BCP)"}, {"letter": "C", "text": "Pseudo-rheumatoid CPPD"}, {"letter": "D", "text": "Septic arthritis of the shoulder"}, {"letter": "E", "text": "Osteoarthritis with CPPD"}], "answer": "B", "explanation": "**Milwaukee shoulder** is basic calcium phosphate (hydroxyapatite) deposition in older women that destroys the rotator cuff and glenohumeral joint; X-ray shows calcium in tendons and periarticular tissue.", "objective": "", "remediation": {"steps": [{"teach": "The third crystal arthropathy deposits **basic calcium phosphate** (hydroxyapatite and relatives) in **cartilage and periarticular tendons/ligaments**.", "stem": "Which crystal family includes hydroxyapatite, octacalcium phosphate and tricalcium phosphate?", "options": [{"letter": "A", "text": "Basic calcium phosphate (BCP)"}, {"letter": "B", "text": "Calcium pyrophosphate"}, {"letter": "C", "text": "Monosodium urate"}], "answer": "A", "explanation": "The hydroxyapatite trio defines BCP/HADD.", "clarify": [{"stem": "Which tissue, besides cartilage, is characteristically affected in BCP disease?", "options": [{"letter": "A", "text": "Periarticular tendons and ligaments"}, {"letter": "B", "text": "Ear helix"}], "answer": "A", "explanation": "BCP deposits in tendons/ligaments; the ear helix is a tophus site in gout."}]}, {"teach": "BCP has one named clinical syndrome at a single joint in a specific population.", "stem": "Which joint and population define the classic BCP syndrome?", "options": [{"letter": "A", "text": "Shoulder in older women"}, {"letter": "B", "text": "First MTP in middle-aged men"}, {"letter": "C", "text": "Wrist in the elderly"}], "answer": "A", "explanation": "Milwaukee shoulder: older women, destructive shoulder arthropathy.", "clarify": [{"stem": "How are BCP crystals identified in the lab?", "options": [{"letter": "A", "text": "Special stains or electron microscopy, rarely done"}, {"letter": "B", "text": "Routine polarized microscopy as needles"}], "answer": "A", "explanation": "BCP crystals are not seen on routine polarized microscopy."}]}], "checkpoints": [{"stem": "What does the X-ray show in BCP/HADD disease?", "options": [{"letter": "A", "text": "Punched-out erosions with overhanging edges"}, {"letter": "B", "text": "Calcium deposition in tendons and periarticular tissue"}, {"letter": "C", "text": "Meniscal chondrocalcinosis"}, {"letter": "D", "text": "Normal radiograph"}], "answer": "B", "explanation": "BCP shows calcium in tendons/periarticular tissue; erosions are gout, chondrocalcinosis is CPPD."}, {"stem": "What treatment does the guide list for BCP arthropathy?", "options": [{"letter": "A", "text": "Allopurinol to target"}, {"letter": "B", "text": "Pegloticase"}, {"letter": "C", "text": "Symptomatic treatment"}, {"letter": "D", "text": "Long-term colchicine prophylaxis"}], "answer": "C", "explanation": "BCP management is symptomatic."}]}}, {"id": "14", "group": 14, "section": "Drug safety", "topic": "Colchicine", "skill": "Pharmacology", "multi": true, "stem": "Which adverse effects are attributed to colchicine in the guide?", "options": [{"letter": "A", "text": "GI toxicity"}, {"letter": "B", "text": "Bone-marrow suppression"}, {"letter": "C", "text": "Severe hypersensitivity syndrome"}, {"letter": "D", "text": "Myopathy with long-term use"}, {"letter": "E", "text": "Boxed warning for CV death"}], "answers": ["A", "B", "D"], "explanation": "Colchicine toxicity = **GI, marrow suppression, myopathy with long-term use**, with caution in CKD. Hypersensitivity syndrome belongs to allopurinol; the CV-death boxed warning belongs to febuxostat.", "objective": "", "remediation": {"steps": [{"teach": "Colchicine is used for **acute flares and prophylaxis** and has its own toxicity triad distinct from the urate-lowering drugs.", "stem": "Which organ system toxicity is the most immediate problem with colchicine?", "options": [{"letter": "A", "text": "Gastrointestinal"}, {"letter": "B", "text": "Cardiovascular"}, {"letter": "C", "text": "Dermatologic"}], "answer": "A", "explanation": "GI toxicity is the first listed colchicine adverse effect.", "clarify": [{"stem": "In which patients does the guide say to use colchicine cautiously?", "options": [{"letter": "A", "text": "Those with CKD"}, {"letter": "B", "text": "Those with tophi"}], "answer": "A", "explanation": "Caution in CKD."}]}, {"teach": "Two further colchicine effects involve **blood counts** and **muscle**, especially with prolonged use.", "stem": "Long-term colchicine is associated with which complication?", "options": [{"letter": "A", "text": "Myopathy"}, {"letter": "B", "text": "Chondrocalcinosis"}, {"letter": "C", "text": "Uric acid stones"}], "answer": "A", "explanation": "Myopathy with long-term use, plus bone-marrow suppression.", "clarify": [{"stem": "Which hematologic effect is listed for colchicine?", "options": [{"letter": "A", "text": "Bone-marrow suppression"}, {"letter": "B", "text": "Polycythemia"}], "answer": "A", "explanation": "Marrow suppression is part of the colchicine toxicity triad."}]}, {"teach": "The two wrong options are the signature warnings of **other** gout drugs.", "stem": "Which drug carries the boxed warning for cardiovascular death?", "options": [{"letter": "A", "text": "Colchicine"}, {"letter": "B", "text": "Febuxostat"}, {"letter": "C", "text": "Probenecid"}], "answer": "B", "explanation": "Febuxostat has the CV-death BBW; the severe hypersensitivity syndrome is allopurinol's."}], "checkpoints": [{"stem": "A patient started allopurinol last week and now has a flare. What should happen to the allopurinol?", "options": [{"letter": "A", "text": "Stop it until the flare resolves"}, {"letter": "B", "text": "Continue it and treat the flare"}, {"letter": "C", "text": "Double the dose"}, {"letter": "D", "text": "Switch to probenecid"}], "answer": "B", "explanation": "Do not stop allopurinol during a flare; treat the flare and keep prophylaxis going."}, {"stem": "Which agents can substitute for colchicine as flare prophylaxis when ULT begins?", "options": [{"letter": "A", "text": "Low-dose NSAID or low-dose steroid"}, {"letter": "B", "text": "Pegloticase"}, {"letter": "C", "text": "Probenecid"}, {"letter": "D", "text": "Febuxostat"}], "answer": "A", "explanation": "Daily low-dose NSAID or low-dose steroid are acceptable prophylaxis substitutes."}]}, "answer": "A,B,D"}, {"id": "15", "group": 15, "section": "Prophylaxis", "topic": "Colchicine", "skill": "Counseling & prevention", "stem": "When urate-lowering therapy is started, for how long should colchicine flare prophylaxis be continued?", "options": [{"letter": "A", "text": "One week"}, {"letter": "B", "text": "Two to four weeks"}, {"letter": "C", "text": "Three to six months"}, {"letter": "D", "text": "Two years"}, {"letter": "E", "text": "Only during active flares"}], "answer": "C", "explanation": "Starting ULT precipitates flares, so colchicine (or low-dose NSAID/steroid) prophylaxis is continued **3–6 months**.", "objective": "", "remediation": {"steps": [{"teach": "Lowering urate **mobilizes crystals**, so the first months of ULT are the most flare-prone.", "stem": "What happens to flare risk when urate-lowering therapy is first started?", "options": [{"letter": "A", "text": "It increases"}, {"letter": "B", "text": "It immediately falls to zero"}, {"letter": "C", "text": "It is unchanged"}], "answer": "A", "explanation": "ULT itself can precipitate a flare — hence prophylaxis.", "clarify": [{"stem": "Which drug is the usual prophylactic agent when ULT begins?", "options": [{"letter": "A", "text": "Colchicine"}, {"letter": "B", "text": "Pegloticase"}], "answer": "A", "explanation": "Low-dose colchicine daily or bid is the standard prophylaxis."}]}, {"teach": "The prophylaxis window is measured in **months**, not weeks.", "stem": "Which duration matches the guide's prophylaxis window?", "options": [{"letter": "A", "text": "A few weeks"}, {"letter": "B", "text": "Several months"}, {"letter": "C", "text": "Indefinitely"}], "answer": "B", "explanation": "3–6 months of colchicine (or low-dose NSAID/steroid)."}], "checkpoints": [{"stem": "Which statement should be part of counseling when a patient starts allopurinol?", "options": [{"letter": "A", "text": "Stop allopurinol at the first sign of a flare"}, {"letter": "B", "text": "Expect flares early on and keep taking allopurinol through them"}, {"letter": "C", "text": "Prophylaxis is unnecessary if urate is below 8"}, {"letter": "D", "text": "Avoid all fluids to reduce stone formation"}], "answer": "B", "explanation": "Expect flares when ULT starts, take prophylaxis for 3–6 months, and do not stop allopurinol during a flare."}, {"stem": "How is colchicine dosed for prophylaxis compared with an acute flare?", "options": [{"letter": "A", "text": "Higher doses repeated hourly"}, {"letter": "B", "text": "Low dose once or twice daily"}, {"letter": "C", "text": "IV infusion every two weeks"}, {"letter": "D", "text": "A one-week taper"}], "answer": "B", "explanation": "Prophylaxis is low-dose colchicine daily or bid; the hourly repeat belongs to acute treatment."}]}}, {"id": "16", "group": 16, "section": "Uric acid numbers", "topic": "Tophaceous gout", "skill": "Management", "stem": "Serum uric acid target for a patient with chronic tophaceous gout → Target:", "options": [{"letter": "A", "text": "Below 8 mg/dL"}, {"letter": "B", "text": "Below 6.8 mg/dL"}, {"letter": "C", "text": "Below 6 mg/dL"}, {"letter": "D", "text": "Below 5 mg/dL"}, {"letter": "E", "text": "Below 2 mg/dL"}], "answer": "D", "explanation": "The general target is **<6 mg/dL**; with tophi it tightens to **<5 mg/dL** to dissolve the deposits.", "objective": "", "remediation": {"steps": [{"teach": "There are two **treatment targets**: a general one and a tighter one for patients with visible urate deposits.", "stem": "What is the general urate target on ULT?", "options": [{"letter": "A", "text": "Below 6 mg/dL"}, {"letter": "B", "text": "Below 8 mg/dL"}, {"letter": "C", "text": "Below 10 mg/dL"}], "answer": "A", "explanation": "Below 6 mg/dL keeps urate under the 6.8 saturation point.", "clarify": [{"stem": "Is the saturation point of 6.8 mg/dL a treatment target?", "options": [{"letter": "A", "text": "No, targets sit below it"}, {"letter": "B", "text": "Yes, it is the target"}], "answer": "A", "explanation": "Targets (<6, <5) are set below the saturation point."}]}, {"teach": "**Tophi** mark heavy deposition, which calls for the tighter target.", "stem": "The presence of tophi changes the target in which direction?", "options": [{"letter": "A", "text": "Lower, to below 5 mg/dL"}, {"letter": "B", "text": "Higher, to below 8 mg/dL"}, {"letter": "C", "text": "It does not change"}], "answer": "A", "explanation": "Tophi → target <5 mg/dL."}], "checkpoints": [{"stem": "Where are tophi classically found?", "options": [{"letter": "A", "text": "Knee menisci and wrist cartilage"}, {"letter": "B", "text": "Ear helix, olecranon, fingers, Achilles"}, {"letter": "C", "text": "Rotator cuff tendons"}, {"letter": "D", "text": "Renal pelvis only"}], "answer": "B", "explanation": "Tophi are MSU deposits in soft tissue — ear helix, olecranon, fingers, Achilles."}, {"stem": "In which type of gout do tophi appear?", "options": [{"letter": "A", "text": "The first acute flare"}, {"letter": "B", "text": "Asymptomatic hyperuricemia"}, {"letter": "C", "text": "Chronic, longstanding, poorly treated disease"}, {"letter": "D", "text": "Only in women before menopause"}], "answer": "C", "explanation": "Tophaceous gout is chronic, polyarticular, longstanding, poorly treated disease."}]}}, {"id": "17", "group": 17, "section": "Urate-lowering therapy", "topic": "Probenecid", "skill": "Pharmacology", "stem": "Which urate-lowering agent should be avoided in chronic kidney disease because it is ineffective and increases stone risk?", "options": [{"letter": "A", "text": "Allopurinol"}, {"letter": "B", "text": "Febuxostat"}, {"letter": "C", "text": "Probenecid"}, {"letter": "D", "text": "Pegloticase"}, {"letter": "E", "text": "Anakinra"}], "answer": "C", "explanation": "**Probenecid** is a uricosuric that depends on renal excretion — in CKD it is **ineffective and raises stone risk**. Allopurinol (low dose) or febuxostat are used instead.", "objective": "", "remediation": {"steps": [{"teach": "A **uricosuric** drives urate out through the kidney by blocking tubular reabsorption, so it needs a functioning kidney.", "stem": "Which drug is the guide's main uricosuric?", "options": [{"letter": "A", "text": "Probenecid"}, {"letter": "B", "text": "Allopurinol"}, {"letter": "C", "text": "Pegloticase"}], "answer": "A", "explanation": "Probenecid (and lesinurad) are uricosurics.", "clarify": [{"stem": "What does a uricosuric do in the kidney?", "options": [{"letter": "A", "text": "Blocks tubular reabsorption of urate"}, {"letter": "B", "text": "Blocks uric acid production"}], "answer": "A", "explanation": "Uricosurics increase urinary urate excretion."}]}, {"teach": "Pushing more urate into a failing kidney's urine is both **futile and dangerous**.", "stem": "What two problems make probenecid unsuitable in CKD?", "options": [{"letter": "A", "text": "Ineffective and increases stone risk"}, {"letter": "B", "text": "Causes hypersensitivity and marrow suppression"}, {"letter": "C", "text": "Causes CV death and myopathy"}], "answer": "A", "explanation": "Avoid probenecid in CKD — ineffective, stone risk.", "clarify": [{"stem": "Which ULT agents are preferred in CKD?", "options": [{"letter": "A", "text": "Low-dose allopurinol or febuxostat"}, {"letter": "B", "text": "Probenecid or lesinurad"}], "answer": "A", "explanation": "XOIs; febuxostat needs no adjustment in mild-moderate CKD."}]}], "checkpoints": [{"stem": "A CKD patient has an acute gout flare in one knee. Which acute option does the lecture case favor?", "options": [{"letter": "A", "text": "High-dose indomethacin"}, {"letter": "B", "text": "Aspirate and inject intra-articular steroid"}, {"letter": "C", "text": "Start probenecid"}, {"letter": "D", "text": "Full-dose colchicine load"}], "answer": "B", "explanation": "NSAIDs are avoided with poor renal function and colchicine used cautiously; the lecture case went to aspiration plus IA steroid."}, {"stem": "Which XOI requires no dose adjustment in mild to moderate CKD?", "options": [{"letter": "A", "text": "Allopurinol"}, {"letter": "B", "text": "Febuxostat"}, {"letter": "C", "text": "Probenecid"}, {"letter": "D", "text": "Lesinurad"}], "answer": "B", "explanation": "Febuxostat is better tolerated in CKD with no adjustment in mild-moderate disease."}]}}, {"id": "18", "group": 18, "section": "Refractory gout", "topic": "Pegloticase", "skill": "Management", "stem": "Tophaceous gout remains refractory despite xanthine-oxidase inhibitor therapy → Next agent:", "options": [{"letter": "A", "text": "Lesinurad monotherapy"}, {"letter": "B", "text": "Pegloticase IV infusion"}, {"letter": "C", "text": "Daily low-dose colchicine"}, {"letter": "D", "text": "Intra-articular steroid injections"}, {"letter": "E", "text": "Medrol dose pack"}], "answer": "B", "explanation": "**Pegloticase** (Krystexxa), a pegylated uricase given IV every 2 weeks, is the agent for **refractory tophaceous gout**; it converts uric acid to allantoin.", "objective": "", "remediation": {"steps": [{"teach": "When oral urate-lowering drugs fail in heavy tophaceous disease, the next step supplies the enzyme humans **lack**.", "stem": "Which enzyme does pegloticase replace?", "options": [{"letter": "A", "text": "Uricase"}, {"letter": "B", "text": "Xanthine oxidase"}, {"letter": "C", "text": "HPRT"}], "answer": "A", "explanation": "Pegloticase is pegylated uricase, converting uric acid to the soluble allantoin.", "clarify": [{"stem": "How is pegloticase given?", "options": [{"letter": "A", "text": "IV infusion every two weeks"}, {"letter": "B", "text": "Oral tablet daily"}], "answer": "A", "explanation": "IV q2 weeks for refractory tophaceous gout."}]}, {"teach": "The other options are **acute anti-inflammatory** agents or **weaker** urate-lowering drugs, not the escalation step.", "stem": "Colchicine, Medrol dose packs and IA steroids treat which part of gout?", "options": [{"letter": "A", "text": "Acute flares and prophylaxis"}, {"letter": "B", "text": "Long-term urate lowering"}, {"letter": "C", "text": "Tophus dissolution"}], "answer": "A", "explanation": "They control inflammation; they do not lower urate or dissolve tophi."}], "checkpoints": [{"stem": "What proportion of pegloticase patients develop antibodies?", "options": [{"letter": "A", "text": "Under 5%"}, {"letter": "B", "text": "10–15%"}, {"letter": "C", "text": "30–50%"}, {"letter": "D", "text": "Over 90%"}], "answer": "C", "explanation": "30–50% develop antibodies, hence co-treatment with methotrexate or mycophenolate."}, {"stem": "Which acute-flare option is reserved for when standard agents fail or are contraindicated?", "options": [{"letter": "A", "text": "IL-1 blockers (anakinra, canakinumab)"}, {"letter": "B", "text": "Pegloticase"}, {"letter": "C", "text": "Probenecid"}, {"letter": "D", "text": "Lesinurad"}], "answer": "A", "explanation": "IL-1 blockers are the acute-flare rescue; pegloticase is the long-term refractory agent."}]}}, {"id": "19", "group": 18, "section": "Refractory gout", "topic": "Pegloticase", "skill": "Pharmacology", "stem": "Which drug is co-administered with pegloticase to prevent anti-drug antibody formation?", "options": [{"letter": "A", "text": "Colchicine"}, {"letter": "B", "text": "Prednisone"}, {"letter": "C", "text": "Methotrexate"}, {"letter": "D", "text": "Probenecid"}, {"letter": "E", "text": "Indomethacin (an NSAID)"}], "answer": "C", "explanation": "**30–50%** of patients develop antibodies to pegloticase, so **methotrexate or mycophenolate** is added to prevent them.", "objective": "", "remediation": {"steps": [{"teach": "Pegloticase is a foreign protein, so the body can form **antibodies** that neutralize it.", "stem": "What is the main obstacle to pegloticase's long-term effectiveness?", "options": [{"letter": "A", "text": "Anti-drug antibodies"}, {"letter": "B", "text": "Hepatotoxicity"}, {"letter": "C", "text": "Renal stones"}], "answer": "A", "explanation": "Antibodies develop in 30–50% of patients.", "clarify": [{"stem": "Is antibody formation a minority or a substantial fraction of patients?", "options": [{"letter": "A", "text": "Substantial — about a third to a half"}, {"letter": "B", "text": "Rare — under 1%"}], "answer": "A", "explanation": "30–50%."}]}, {"teach": "An **immunosuppressant** is added to block the antibody response.", "stem": "Which drug class is paired with pegloticase?", "options": [{"letter": "A", "text": "Immunosuppressants (methotrexate or mycophenolate)"}, {"letter": "B", "text": "NSAIDs"}, {"letter": "C", "text": "Uricosurics"}], "answer": "A", "explanation": "Methotrexate or mycophenolate prevents antibody formation."}], "checkpoints": [{"stem": "Which patient is the appropriate candidate for pegloticase?", "options": [{"letter": "A", "text": "First-ever podagra flare"}, {"letter": "B", "text": "Asymptomatic hyperuricemia above 10"}, {"letter": "C", "text": "Refractory tophaceous gout despite oral ULT"}, {"letter": "D", "text": "Acute CPPD of the knee"}], "answer": "C", "explanation": "Pegloticase is reserved for refractory tophaceous gout."}, {"stem": "What product does pegloticase convert uric acid into?", "options": [{"letter": "A", "text": "Xanthine"}, {"letter": "B", "text": "Allantoin"}, {"letter": "C", "text": "Hypoxanthine"}, {"letter": "D", "text": "Calcium pyrophosphate"}], "answer": "B", "explanation": "Uricase converts uric acid to allantoin, as in other mammals."}]}}, {"id": "20", "group": 20, "section": "Imaging", "topic": "Tophaceous gout", "skill": "Diagnostics & imaging", "stem": "Radiograph shows soft-tissue swelling and a punched-out erosion with overhanging (\"rat-bite\") edges → Diagnosis:", "options": [{"letter": "A", "text": "Chondrocalcinosis (CPPD)"}, {"letter": "B", "text": "Chronic tophaceous gout"}, {"letter": "C", "text": "Milwaukee shoulder (BCP)"}, {"letter": "D", "text": "Septic arthritis"}, {"letter": "E", "text": "Rheumatoid arthritis"}], "answer": "B", "explanation": "**Punched-out erosions with overhanging edges**, soft-tissue swelling and tophi at the bone–cartilage interface are the radiographic signature of **chronic tophaceous gout**.", "objective": "", "remediation": {"steps": [{"teach": "Each crystal disease has one **radiographic signature**: erosions, cartilage calcification, or tendon calcification.", "stem": "Cartilage calcification (e.g., knee menisci) on X-ray indicates which disease?", "options": [{"letter": "A", "text": "CPPD"}, {"letter": "B", "text": "Gout"}, {"letter": "C", "text": "BCP"}], "answer": "A", "explanation": "Chondrocalcinosis = CPPD. Gout erodes bone; BCP calcifies tendons.", "clarify": [{"stem": "Which crystal disease calcifies periarticular tendons on X-ray?", "options": [{"letter": "A", "text": "BCP / Milwaukee shoulder"}, {"letter": "B", "text": "Gout"}], "answer": "A", "explanation": "BCP deposits in tendons and periarticular tissue."}]}, {"teach": "Gout's **erosions** have a distinctive shape because the tophus undermines the cortex.", "stem": "Which descriptor matches a gouty erosion?", "options": [{"letter": "A", "text": "Punched-out with overhanging edges"}, {"letter": "B", "text": "Diffuse periarticular osteopenia"}, {"letter": "C", "text": "Linear meniscal calcification"}], "answer": "A", "explanation": "Rat-bite erosions with overhanging edges, tophi at the bone–cartilage interface and subchondral bone.", "clarify": [{"stem": "Erosions on gout imaging have what treatment implication?", "options": [{"letter": "A", "text": "They are an indication for urate-lowering therapy"}, {"letter": "B", "text": "They mean no treatment is needed"}], "answer": "A", "explanation": "Erosions on imaging are an ULT indication."}]}], "checkpoints": [{"stem": "Besides joint fluid, what else can be aspirated to confirm tophaceous gout?", "options": [{"letter": "A", "text": "Bone marrow"}, {"letter": "B", "text": "A tophus"}, {"letter": "C", "text": "Renal cyst"}, {"letter": "D", "text": "Lymph node"}], "answer": "B", "explanation": "Aspirate a joint or a tophus → needle-shaped, negatively birefringent MSU crystals."}, {"stem": "Which complication of tophaceous gout involves the tophus itself?", "options": [{"letter": "A", "text": "Ulceration and infection"}, {"letter": "B", "text": "Chondrocalcinosis"}, {"letter": "C", "text": "Rotator cuff tear"}, {"letter": "D", "text": "Hypomagnesemia"}], "answer": "A", "explanation": "Complications include joint destruction, chronic polyarthritis, stones, urate nephropathy, and tophus ulceration/infection."}]}}, {"id": "21", "group": 21, "section": "Lifestyle", "topic": "Lifestyle modifications", "skill": "Counseling & prevention", "multi": true, "stem": "Which of the following belong in lifestyle counseling for a patient with gout?", "options": [{"l
