<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

me → naloxone IV (~30 seconds).", "objective": "", "section": "Opioids"}, {"id": "22", "group": 22, "stem": "Re-sedation after naloxone reversal of a long-acting opioid → Action:", "options": [{"letter": "A", "text": "Flumazenil"}, {"letter": "B", "text": "Observe only"}, {"letter": "C", "text": "Repeat naloxone / infusion"}, {"letter": "D", "text": "Activated charcoal"}, {"letter": "E", "text": "Oral naltrexone"}], "answer": "C", "explanation": "Naloxone is short-acting — re-dose or infuse when the opioid outlasts it.", "objective": "", "section": "Opioids"}, {"id": "23", "group": 23, "stem": "Weak opioid also used as an antitussive; combination products fall to Schedule III → Drug:", "options": [{"letter": "A", "text": "Methadone"}, {"letter": "B", "text": "Codeine"}, {"letter": "C", "text": "Naltrexone"}, {"letter": "D", "text": "Hydromorphone"}, {"letter": "E", "text": "Tramadol"}], "answer": "B", "explanation": "Codeine: mild–moderate pain + cough; Schedule II alone, III in combos.", "objective": "", "section": "Opioids"}, {"id": "24", "group": 24, "stem": "Diffuse inflammatory arthralgia without spasm in an SLE patient → Add to regimen:", "options": [{"letter": "A", "text": "Carisoprodol"}, {"letter": "B", "text": "Tramadol"}, {"letter": "C", "text": "Short-course oral NSAID with food"}, {"letter": "D", "text": "Cyclobenzaprine at bedtime"}, {"letter": "E", "text": "Baclofen"}], "answer": "C", "explanation": "Inflammatory, multi-joint → systemic NSAID; no relaxant without spasm (sedation, serotonin risk with SSRIs).", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "25", "group": 25, "stem": "Most common drug cause of osteoporosis → Drug class:", "options": [{"letter": "A", "text": "Heparin"}, {"letter": "B", "text": "PPIs"}, {"letter": "C", "text": "Anticonvulsants"}, {"letter": "D", "text": "Glucocorticoids"}, {"letter": "E", "text": "Aromatase inhibitors"}], "answer": "D", "explanation": "Prednisone >5 mg for >3 months; teriparatide is indicated for glucocorticoid-induced OP; bisphosphonate first line.", "objective": "", "section": "Osteoporosis"}, {"id": "26", "group": 26, "stem": "Opioid started → Adverse effect to prevent from day 1 because tolerance never develops:", "options": [{"letter": "A", "text": "Sedation"}, {"letter": "B", "text": "Constipation"}, {"letter": "C", "text": "Nausea"}, {"letter": "D", "text": "Respiratory depression"}, {"letter": "E", "text": "Pruritus"}], "answer": "B", "explanation": "No tolerance to constipation (or miosis) → bowel regimen from the first dose.", "objective": "", "section": "Opioids"}, {"id": "27", "group": 27, "stem": "Postmenopausal woman, T-score ≤ −2.5, normal kidneys, no GI disease → First-line drug:", "options": [{"letter": "A", "text": "Romosozumab"}, {"letter": "B", "text": "Alendronate"}, {"letter": "C", "text": "Teriparatide"}, {"letter": "D", "text": "Denosumab"}, {"letter": "E", "text": "Raloxifene"}], "answer": "B", "explanation": "Oral bisphosphonate (alendronate weekly) is first line for most.", "objective": "", "section": "Osteoporosis"}, {"id": "28", "group": 28, "stem": "Seizure disorder patient on an SSRI → Analgesic to AVOID:", "options": [{"letter": "A", "text": "Acetaminophen"}, {"letter": "B", "text": "Tramadol"}, {"letter": "C", "text": "Hydrocodone"}, {"letter": "D", "text": "Morphine"}, {"letter": "E", "text": "Topical lidocaine"}], "answer": "B", "explanation": "Tramadol lowers the seizure threshold and adds serotonergic activity; only partly reversed by naloxone.", "objective": "", "section": "Opioids"}, {"id": "29", "group": 29, "stem": "T2DM with CKD on maximal ACE inhibitor → Add:", "options": [{"letter": "A", "text": "Saxagliptin"}, {"letter": "B", "text": "Dapagliflozin"}, {"letter": "C", "text": "Pioglitazone"}, {"letter": "D", "text": "Glipizide"}, {"letter": "E", "text": "Glyburide"}], "answer": "B", "explanation": "SGLT2i first for CKD progression (start if eGFR ≥20); semaglutide also has a kidney indication.", "objective": "", "section": "Type 2 Diabetes"}, {"id": "30", "group": 30, "stem": "Drug-induced lupus → Characteristic antibody:", "options": [{"letter": "A", "text": "Anticentromere"}, {"letter": "B", "text": "Anti-dsDNA"}, {"letter": "C", "text": "Anti-Ro"}, {"letter": "D", "text": "Antihistone"}, {"letter": "E", "text": "Anti-Smith"}], "answer": "D", "explanation": "Antihistone + in 90–95%; dsDNA/Smith rare; kidney involvement rare; stop the drug.", "objective": "", "section": "SLE"}, {"id": "31", "group": 31, "stem": "RA patient with pregnancy potential → Preferred conventional DMARD:", "options": [{"letter": "A", "text": "Methotrexate"}, {"letter": "B", "text": "Sulfasalazine"}, {"letter": "C", "text": "Leflunomide"}, {"letter": "D", "text": "Cyclophosphamide"}, {"letter": "E", "text": "Mycophenolate"}], "answer": "B", "explanation": "Sulfasalazine (and hydroxychloroquine) are the pregnancy-compatible choices.", "objective": "", "section": "Rheumatoid Arthritis"}, {"id": "32", "group": 32, "stem": "Falling eGFR in an insulin-treated patient → Expected change:", "options": [{"letter": "A", "text": "No change"}, {"letter": "B", "text": "Insulin needs rise"}, {"letter": "C", "text": "Switch to SGLT2i"}, {"letter": "D", "text": "Insulin needs fall (more lows)"}, {"letter": "E", "text": "Switch to sulfonylurea"}], "answer": "D", "explanation": "Reduced renal insulin clearance → lower doses (~25% at eGFR 10–50, ~50% on dialysis).", "objective": "", "section": "Type 1 Diabetes & Insulin"}, {"id": "33", "group": 33, "stem": "Gout flare in CKD on clarithromycin → Flare drug of choice:", "options": [{"letter": "A", "text": "Indomethacin"}, {"letter": "B", "text": "Prednisone"}, {"letter": "C", "text": "Probenecid"}, {"letter": "D", "text": "Colchicine"}, {"letter": "E", "text": "Allopurinol"}], "answer": "B", "explanation": "Renal impairment + CYP450 inhibitor rules out colchicine; CKD rules out NSAIDs → steroid.", "objective": "", "section": "Gout"}, {"id": "34", "group": 34, "stem": "Methotrexate → Absolute contraindication:", "options": [{"letter": "A", "text": "Retinal disease"}, {"letter": "B", "text": "Pregnancy"}, {"letter": "C", "text": "G6PD deficiency"}, {"letter": "D", "text": "Sulfa allergy"}, {"letter": "E", "text": "Heart failure"}], "answer": "B", "explanation": "Category X; also liver disease/alcohol and GFR <30.", "objective": "", "section": "Rheumatoid Arthritis"}, {"id": "35", "group": 35, "stem": "Anion-gap acidosis without ketones in a diabetic with low eGFR or sepsis → Culprit:", "options": [{"letter": "A", "text": "Empagliflozin"}, {"letter": "B", "text": "Semaglutide"}, {"letter": "C", "text": "Glipizide"}, {"letter": "D", "text": "Pioglitazone"}, {"letter": "E", "text": "Metformin"}], "answer": "E", "explanation": "Metformin-associated lactic acidosis vs SGLT2i euglycemic DKA (that one has ketones).", "objective": "", "section": "Type 2 Diabetes"}, {"id": "36", "group": 36, "stem": "Tizanidine therapy → Lab to monitor:", "options": [{"letter": "A", "text": "TSH"}, {"letter": "B", "text": "Potassium"}, {"letter": "C", "text": "Uric acid"}, {"letter": "D", "text": "LFTs"}, {"letter": "E", "text": "CBC"}], "answer": "D", "explanation": "Tizanidine raises LFTs (plus hypotension/bradycardia from α₂ agonism).", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "37", "group": 37, "stem": "Over-basalized patient (fasting at goal, A1C high, big bedtime-to-morning drop) → Next step:", "options": [{"letter": "A", "text": "Add pioglitazone"}, {"letter": "B", "text": "Add a DPP-4 inhibitor"}, {"letter": "C", "text": "Add a sulfonylurea"}, {"letter": "D", "text": "Increase basal insulin"}, {"letter": "E", "text": "Add a GLP-1 receptor agonist"}], "answer": "E", "explanation": "Add GLP-1 RA or prandial insulin at the largest meal — not more basal.", "objective": "", "section": "Type 2 Diabetes"}, {"id": "38", "group": 38, "stem": "Patient on levothyroxine starts rifampin or phenytoin → Expected change:", "options": [{"letter": "A", "text": "No change"}, {"letter": "B", "text": "Stop levothyroxine"}, {"letter": "C", "text": "Needs more levothyroxine"}, {"letter": "D", "text": "Switch to liothyronine"}, {"letter": "E", "text": "Needs less levothyroxine"}], "answer": "C", "explanation": "CYP inducers ↑ clearance; OCP/estrogen ↑ TBG → may also need more.", "objective": "", "section": "Thyroid"}, {"id": "39", "group": 39, "stem": "T2DM with established ASCVD → Add regardless of A1C:", "options": [{"letter": "A", "text": "Sitagliptin"}, {"letter": "B", "text": "Semaglutide"}, {"letter": "C", "text": "NPH insulin"}, {"letter": "D", "text": "Glipizide"}, {"letter": "E", "text": "Glyburide"}], "answer": "B", "explanation": "ASCVD → GLP-1 RA with proven CV benefit (semaglutide/dulaglutide/liraglutide) or an SGLT2i.", "objective": "", "section": "Type 2 Diabetes"}, {"id": "40", "group": 40, "stem": "Patient on sertraline needs a relaxant for spasm → Relaxant to AVOID:", "options": [{"letter": "A", "text": "Cyclobenzaprine"}, {"letter": "B", "text": "Baclofen"}, {"letter": "C", "text": "Methocarbamol"}, {"letter": "D", "text": "Dantrolene"}, {"letter": "E", "text": "Tizanidine"}], "answer": "A", "explanation": "Cyclobenzaprine (and metaxalone) + SSRIs → serotonin syndrome risk.", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "41", "group": 41, "stem": "Short-term parenteral NSAID for ED pain, limited course because of fatal GI bleed/perforation → Drug:", "options": [{"letter": "A", "text": "Ketorolac"}, {"letter": "B", "text": "Celecoxib"}, {"letter": "C", "text": "Indomethacin"}, {"letter": "D", "text": "Naproxen"}, {"letter": "E", "text": "Meloxicam"}], "answer": "A", "explanation": "Ketorolac — potent nonselective, short course only.", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "42", "group": 42, "stem": "Very-high-risk osteoporosis with MI six months ago → Anabolic to choose:", "options": [{"letter": "A", "text": "Raloxifene"}, {"letter": "B", "text": "Teriparatide"}, {"letter": "C", "text": "Calcitonin"}, {"letter": "D", "text": "Romosozumab"}, {"letter": "E", "text": "Estrogen"}], "answer": "B", "explanation": "Romosozumab black box: MI/stroke — none within 1 year of an event → teriparatide instead.", "objective": "", "section": "Osteoporosis"}, {"id": "43", "group": 43, "stem": "Completing a 2-year teriparatide course → Next step:", "options": [{"letter": "A", "text": "Start estrogen"}, {"letter": "B", "text": "Continue teriparatide indefinitely"}, {"letter": "C", "text": "Start a bisphosphonate or denosumab"}, {"letter": "D", "text": "Start raloxifene"}, {"letter": "E", "text": "Stop all therapy"}], "answer": "C", "explanation": "Every anabolic is followed by an antiresorptive or the gains are lost.", "objective": "", "section": "Osteoporosis"}, {"id": "44", "group": 44, "stem": "History of drug-induced hemolytic anemia → Relaxant to AVOID:", "options": [{"letter": "A", "text": "Cyclobenzaprine"}, {"letter": "B", "text": "Methocarbamol"}, {"letter": "C", "text": "Baclofen"}, {"letter": "D", "text": "Tizanidine"}, {"letter": "E", "text": "Metaxalone"}], "answer": "E", "explanation": "Metaxalone — rare hemolytic anemia and hepatotoxicity.", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "45", "group": 45, "stem": "Fails one TNF inhibitor → Next step:", "options": [{"letter": "A", "text": "Combine TNF with a non-TNF biologic"}, {"letter": "B", "text": "High-dose prednisone alone"}, {"letter": "C", "text": "Add a second TNF inhibitor"}, {"letter": "D", "text": "Try another TNF inhibitor"}, {"letter": "E", "text": "Stop all DMARDs"}], "answer": "D", "explanation": "Switch within class first; never combine a TNF with a non-TNF biologic.", "objective": "", "section": "Rheumatoid Arthritis"}, {"id": "46", "group": 46, "stem": "Schedule IV muscle relaxant with abuse potential, avoid in substance use disorder → Drug:", "options": [{"letter": "A", "text": "Methocarbamol"}, {"letter": "B", "text": "Carisoprodol"}, {"letter": "C", "text": "Baclofen"}, {"letter": "D", "text": "Cyclobenzaprine"}, {"letter": "E", "text": "Metaxalone"}], "answer": "B", "explanation": "Carisoprodol → meprobamate; short-term only (≤2–3 weeks); SJS.", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "47", "group": 47, "stem": "Personal/family history of medullary thyroid carcinoma or MEN2 → Class to AVOID:", "options": [{"letter": "A", "text": "Sulfonylureas"}, {"letter": "B", "text": "Thiazolidinediones"}, {"letter": "C", "text": "SGLT2 inhibitors"}, {"letter": "D", "text": "DPP-4 inhibitors"}, {"letter": "E", "text": "GLP-1 receptor agonists / tirzepatide"}], "answer": "E", "explanation": "Boxed warning for GLP-1 RAs and tirzepatide.", "objective": "", "section": "Type 2 Diabetes"}, {"id": "48", "group": 48, "stem": "Mydriasis, diarrhea, rhinorrhea, tachycardia, sweating, craving → Diagnosis:", "options": [{"letter": "A", "text": "Opioid withdrawal"}, {"letter": "B", "text": "Serotonin syndrome"}, {"letter": "C", "text": "Opioid overdose"}, {"letter": "D", "text": "Anticholinergic toxicity"}, {"letter": "E", "text": "Baclofen withdrawal"}], "answer": "A", "explanation": "Withdrawal is the mirror image of every opioid effect.", "objective": "", "section": "Opioids"}, {"id": "49", "group": 49, "stem": "Inhaled insulin (Afrezza) → Contraindication:", "options": [{"letter": "A", "text": "CKD"}, {"letter": "B", "text": "Hepatic impairment"}, {"letter": "C", "text": "Pregnancy"}, {"letter": "D", "text": "Asthma / COPD"}, {"letter": "E", "text": "Obesity"}], "answer": "D", "explanation": "Boxed bronchospasm; spirometry at baseline, 6 months, yearly; still needs basal insulin.", "objective": "", "section": "Type 1 Diabetes & Insulin"}, {"id": "50", "group": 50, "stem": "Graves' disease, non-pregnant → Thionamide of choice:", "options": [{"letter": "A", "text": "Propylthiouracil"}, {"letter": "B", "text": "Potassium iodide"}, {"letter": "C", "text": "Levothyroxine"}, {"letter": "D", "text": "Methimazole"}, {"letter": "E", "text": "Liothyronine"}], "answer": "D", "explanation": "Methimazole: once daily, better tolerated, less hepatotoxic.", "objective": "", "section": "Thyroid"}, {"id": "51", "group": 51, "stem": "Prednisone in RA → Role:", "options": [{"letter": "A", "text": "Lifelong maintenance"}, {"letter": "B", "text": "Prevents joint erosion alone"}, {"letter": "C", "text": "Bridge until the DMARD works"}, {"letter": "D", "text": "Replaces DMARDs in early disease"}, {"letter": "E", "text": "Disease-modifying monotherapy"}], "answer": "C", "explanation": "Low-dose steroid (or NSAID) relieves symptoms while MTX takes 3–6 weeks; it does NOT alter progression.", "objective": "", "section": "Rheumatoid Arthritis"}, {"id": "52", "group": 52, "stem": "Colchicine → Most common adverse effect, often before relief:", "options": [{"letter": "A", "text": "Hepatotoxicity"}, {"letter": "B", "text": "QT prolongation"}, {"letter": "C", "text": "Rash"}, {"letter": "D", "text": "GI upset (N/V/D)"}, {"letter": "E", "text": "Agranulocytosis"}], "answer": "D", "explanation": "GI toxicity in about half of patients.", "objective": "", "section": "Gout"}, {"id": "53", "group": 53, "stem": "Early methimazole therapy → Labs to follow (not TSH):", "options": [{"letter": "A", "text": "Free T4 and total T3"}, {"letter": "B", "text": "Thyroglobulin"}, {"letter": "C", "text": "TPO antibodies"}, {"letter": "D", "text": "Calcitonin"}, {"letter": "E", "text": "TSH alone"}], "answer": "A", "explanation": "TSH lags/misleads early; FT4 + T3 every 4–6 weeks → ↓ dose 30–50% when normal.", "objective": "", "section": "Thyroid"}, {"id": "54", "group": 54, "stem": "Nausea and constipation on codeine, patient calls it an 'allergy' → Interpretation:", "options": [{"letter": "A", "text": "True IgE allergy"}, {"letter": "B", "text": "Serotonin syndrome"}, {"letter": "C", "text": "Overdose"}, {"letter": "D", "text": "Opioid withdrawal"}, {"letter": "E", "text": "Expected adverse effect, not allergy"}], "answer": "E", "explanation": "Worse N/V/constipation is codeine's known profile — do not label it an allergy.", "objective": "", "section": "Opioids"}, {"id": "55", "group": 55, "stem": "Hydroxychloroquine in pregnancy → Rule:", "options": [{"letter": "A", "text": "Continue"}, {"letter": "B", "text": "Switch to leflunomide"}, {"letter": "C", "text": "Stop at conception"}, {"letter": "D", "text": "Switch to methotrexate"}, {"letter": "E", "text": "Halve the dose"}], "answer": "A", "explanation": "HCQ is safe and antithrombotic in pregnancy; azathioprine is the usual SLE add-on in pregnancy.", "objective": "", "section": "SLE"}, {"id": "56", "group": 56, "stem": "Type 1 patient sick and not eating → Basal insulin rule:", "options": [{"letter": "A", "text": "Replace with regular"}, {"letter": "B", "text": "Halve and resume later"}, {"letter": "C", "text": "Switch to oral agents"}, {"letter": "D", "text": "Hold until eating"}, {"letter": "E", "text": "Never stopped"}], "answer": "E", "explanation": "Illness raises needs; missed basal, pump failure and SGLT2i are the outpatient DKA causes.", "objective": "", "section": "Type 1 Diabetes & Insulin"}, {"id": "57", "group": 57, "stem": "TSH still high despite adherence; takes levothyroxine with breakfast, calcium and omeprazole → Cause:", "options": [{"letter": "A", "text": "Thyroid storm"}, {"letter": "B", "text": "Reduced absorption"}, {"letter": "C", "text": "Over-replacement"}, {"letter": "D", "text": "Lab error"}, {"letter": "E", "text": "Wrong manufacturer"}], "answer": "B", "explanation": "Empty stomach 30–60 min before breakfast; separate 4 h from antacids, PPIs, H₂ blockers, iron, calcium.", "objective": "", "section": "Thyroid"}, {"id": "58", "group": 58, "stem": "Severe head injury → Opioid class contraindication reason:", "options": [{"letter": "A", "text": "Masks seizures"}, {"letter": "B", "text": "CO₂ retention raises ICP"}, {"letter": "C", "text": "Causes mydriasis"}, {"letter": "D", "text": "Causes hyperventilation"}, {"letter": "E", "text": "Causes hypertension"}], "answer": "B", "explanation": "Respiratory depression → CO₂ retention → ↑ICP; also avoid with severe pulmonary disease and MAOIs.", "objective": "", "section": "Opioids"}, {"id": "59", "group": 59, "stem": "DMARD monitored with an eye exam instead of a CBC → Drug:", "options": [{"letter": "A", "text": "Azathioprine"}, {"letter": "B", "text": "Sulfasalazine"}, {"letter": "C", "text": "Methotrexate"}, {"letter": "D", "text": "Leflunomide"}, {"letter": "E", "text": "Hydroxychloroquine"}], "answer": "E", "explanation": "HCQ has no marrow/renal/hepatic toxicity; retinal toxicity is the feared AE → baseline then q6–12 mo exams.", "objective": "", "section": "Rheumatoid Arthritis"}, {"id": "60", "group": 60, "stem": "Han Chinese, Thai, Korean or African American patient starting urate-lowering therapy → Test before allopurinol:", "options": [{"letter": "A", "text": "HLA-DR4"}, {"letter": "B", "text": "TPMT"}, {"letter": "C", "text": "HLA-B27"}, {"letter": "D", "text": "G6PD"}, {"letter": "E", "text": "HLA-B*5801"}], "answer": "E", "explanation": "HLA-B*5801 positive → severe cutaneous adverse reactions → never allopurinol.", "objective": "", "section": "Gout"}, {"id": "61", "group": 61, "stem": "Acute MI chest pain or dyspnea of acute pulmonary edema → Opioid of choice:", "options": [{"letter": "A", "text": "Codeine"}, {"letter": "B", "text": "Morphine"}, {"letter": "C", "text": "Meperidine"}, {"letter": "D", "text": "Fentanyl"}, {"letter": "E", "text": "Tramadol"}], "answer": "B", "explanation": "Morphine is the reference drug and the MI / pulmonary edema opioid.", "objective": "", "section": "Opioids"}, {"id": "62", "group": 62, "stem": "Before starting azathioprine → Test:", "options": [{"letter": "A", "text": "Spirometry"}, {"letter": "B", "text": "HLA-B*5801"}, {"letter": "C", "text": "Retinal exam"}, {"letter": "D", "text": "TPMT genotype"}, {"letter": "E", "text": " ancer, macular edema; LFTs first.", "objective": "", "section": "Type 2 Diabetes"}, {"id": "108", "group": 108, "stem": "Iodinated contrast study scheduled → Drug to hold:", "options": [{"letter": "A", "text": "Semaglutide"}, {"letter": "B", "text": "Metformin"}, {"letter": "C", "text": "Glargine"}, {"letter": "D", "text": "Levothyroxine"}, {"letter": "E", "text": "Sitagliptin"}], "answer": "B", "explanation": "Hold metformin (eGFR 30–60, liver disease, alcohol, HF, intra-arterial) → recheck eGFR at 48 h.", "objective": "", "section": "Type 2 Diabetes"}, {"id": "109", "group": 109, "stem": "ER oxycodone tablet crushed or chewed → Consequence:", "options": [{"letter": "A", "text": "Lethal dose dump"}, {"letter": "B", "text": "Loss of all effect"}, {"letter": "C", "text": "QT prolongation"}, {"letter": "D", "text": "Precipitated withdrawal"}, {"letter": "E", "text": "Serotonin syndrome"}], "answer": "A", "explanation": "Never crush/chew ER oxycodone (OxyContin).", "objective": "", "section": "Opioids"}, {"id": "110", "group": 110, "stem": "SLE, any severity → Cornerstone drug for essentially every patient:", "options": [{"letter": "A", "text": "Methotrexate"}, {"letter": "B", "text": "Cyclophosphamide"}, {"letter": "C", "text": "Hydroxychloroquine"}, {"letter": "D", "text": "Belimumab"}, {"letter": "E", "text": "Prednisone"}], "answer": "C", "explanation": "HCQ delays renal/skin damage and improves survival; continue in pregnancy.", "objective": "", "section": "SLE"}, {"id": "111", "group": 111, "stem": "Severe pain in renal failure → Preferred opioid:", "options": [{"letter": "A", "text": "Morphine"}, {"letter": "B", "text": "Tramadol"}, {"letter": "C", "text": "Meperidine"}, {"letter": "D", "text": "Codeine"}, {"letter": "E", "text": "Fentanyl"}], "answer": "E", "explanation": "Fentanyl has no active metabolites; morphine's metabolites accumulate in renal failure.", "objective": "", "section": "Opioids"}, {"id": "112", "group": 112, "stem": "Morning prednisone cours , "group": 157, "stem": "Diffuse rash two weeks into allopurinol → Action:", "options": [{"letter": "A", "text": "Switch to probenecid"}, {"letter": "B", "text": "Add antihistamine, continue"}, {"letter": "C", "text": "Reduce dose by half"}, {"letter": "D", "text": "Add prednisone, continue"}, {"letter": "E", "text": "Stop allopurinol"}], "answer": "E", "explanation": "Any rash on allopurinol → stop (SCAR risk) → febuxostat.", "objective": "", "section": "Gout"}, {"id": "158", "group": 158, "stem": "Younger postmenopausal woman with high breast-cancer risk and low VTE risk → Niche agent:", "options": [{"letter": "A", "text": "Raloxifene"}, {"letter": "B", "text": "Denosumab"}, {"letter": "C", "text": "Teriparatide"}, {"letter": "D", "text": "Estrogen"}, {"letter": "E", "text": "Romosozumab"}], "answer": "A", "explanation": "Raloxifene: estrogen agonist in bone, antagonist in breast/uterus.", "objective": "", "section": "Osteoporosis"}, {"id": "159", "group": 159, "stem": "Acetaminophen overdose → Antidote:", "options": [{"letter": "A", "text": "Flumazenil"}, {"letter": "B", "text": "Naloxone"}, {"letter": "C", "text": "Activated charcoal"}, {"letter": "D", "text": "N-acetylcysteine"}, {"letter": "E", "text": "Fomepizole"}], "answer": "D", "explanation": "NAPQI-mediated hepatotoxicity → N-acetylcysteine.", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "160", "group": 160, "stem": "Third-trimester pregnancy → NSAID risk:", "options": [{"letter": "A", "text": "Fetal goiter"}, {"letter": "B", "text": "Oligohydramnios reversal"}, {"letter": "C", "text": "Premature ductus arteriosus closure"}, {"letter": "D", "text": "Neural tube defect"}, {"letter": "E", "text": "Neonatal hypoglycemia"}], "answer": "C", "explanation": "NSAIDs are avoided in the 3rd trimester (ductus closure).", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "161", "group": 161, "stem": "Post-CABG patient with pain → Analgesic of choice:", "options": [{"letter": "A", "text": "Celecoxib"}, {"letter": "B", "text": "Naproxen"}, {"letter": "C", "text": "Ibuprofen"}, {"letter": "D", "text": "Acetaminophen"}, {"letter": "E", "text": "Ketorolac"}], "answer": "D", "explanation": "NSAID black box: CABG contraindication (MI/stroke). Aspirin is the one exception; acetaminophen is the fragile-patient drug.", "objective": "", "section": "MSK Pain & Muscle Relaxants"}, {"id": "162", "group": 162, "stem": "Pregnant patient with any type of diabetes → Drug:", "options": [{"letter": "A", "text": "Semaglutide"}, {"letter": "B", "text": "Pioglitazone"}, {"letter": "C", "text": "Metformin"}, {"letter": "D", "text": "Glyburide"}, {"letter": "E", "text": "Insulin"}], "answer": "E", "explanation": "Insulin for pregnancy; needs fall 1st trimester, rise 2nd–3rd, drop postpartum.", "objective": "", "section": "Type 1 Diabetes & Insulin"}, {"id": "163", "group": 163, "stem": "Longest-acting basal with flexible dosing time and lowest nocturnal hypoglycemia → Insulin:", "options": [{"letter": "A", "text": "Detemir"}, {"letter": "B", "text": "Glargine U-100"}, {"letter": "C", "text": "NPH"}, {"letter": "D", "text": "Regular"}, {"letter": "E", "text": "Degludec"}], "answer": "E", "explanation": "Degludec — doses ≥8 h apart; changes take 3–4 days to show.", "objective": "", "section": "Type 1 Diabetes & Insulin"}, {"id": "164", "group": 164, "stem": "Rash on allopurinol or HLA-B*5801 positive → Next urate-lowering drug:", "options": [{"letter": "A", "text": "Febuxostat"}, {"letter": "B", "text": "Colchicine"}, {"letter": "C", "text": "Pegloticase"}, {"letter": "D", "text": "Probenecid"}, {"letter": "E", "text": "Anakinra"}], "answer": "A", "explanation": "Febuxostat is the alternate xanthine-oxidase inhibitor.", "objective": "", "section": "Gout"}, {"id": "165", "group": 165, "stem": "Pegloticase → Must screen before first infusion:", "options": [{"letter": "A", "text": "Latent TB"}, {"letter": "B", "text": "G6PD deficiency"}, {"letter": "C", "text": "Hepat (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
