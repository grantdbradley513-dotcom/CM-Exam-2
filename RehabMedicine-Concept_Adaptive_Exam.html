producing poor posture.", "objective": "", "remediation": {"steps": [{"teach": "Each crutch-length error has its own signature: too long compresses the **axilla**; too short makes the patient **bend forward** to reach the ground.", "stem": "Trunk flexion to lower the center of mass is the signature of crutches that are:", "options": [{"letter": "A", "text": "Too short"}, {"letter": "B", "text": "Too tall"}], "answer": "A", "explanation": "Too short → trunk flexion, poor posture, decreased safety.", "clarify": [{"teach": "The too-tall error produces **nerve/vessel** symptoms rather than posture change.", "stem": "Arm numbness after starting crutches suggests crutches that are:", "options": [{"letter": "A", "text": "Too tall"}, {"letter": "B", "text": "Too short"}], "answer": "A", "explanation": "Too tall → brachial plexus compression."}]}, {"teach": "Short crutches are not just ugly posture — the lecture flags a **safety** consequence.", "stem": "Besides poor posture, crutches that are too short cause:", "options": [{"letter": "A", "text": "Instability and decreased safety"}, {"letter": "B", "text": "Brachial plexus injury"}, {"letter": "C", "text": "Lower energy cost"}], "answer": "A", "explanation": "Too short → unstable, decreased safety."}], "checkpoints": [{"stem": "Which elbow position confirms correct axillary crutch length?", "options": [{"letter": "A", "text": "Locked fully straight"}, {"letter": "B", "text": "Slight bend"}, {"letter": "C", "text": "Flexed to 90°"}, {"letter": "D", "text": "Hyperextended"}], "answer": "B", "explanation": "Slight bend in the elbow with weight through the hands."}, {"stem": "Which patient is the intended user of axillary crutches?", "options": [{"letter": "A", "text": "Long-term MS patient with balance deficits"}, {"letter": "B", "text": "Temporary post-op ortho patient with protected WB"}, {"letter": "C", "text": "Dementia patient needing a device"}, {"letter": "D", "text": "Post-op spinal fusion patient"}], "answer": "B", "explanation": "Axillary crutches are for temporary ortho users with protected WB; long-term neuro → Lofstrand; dementia/spine → walker."}]}}, {"id": "22", "group": 19, "section": "Assistive devices", "topic": "Forearm (Lofstrand) crutches", "skill": "Identification", "stem": "Long-term crutch use for a neurologic condition such as MS or cerebral palsy with balance and weakness impairments → Device of choice:", "options": [{"letter": "A", "text": "Bilateral axillary crutches (temporary)"}, {"letter": "B", "text": "Lofstrand (forearm) crutches"}, {"letter": "C", "text": "Large-base quad cane (LBQC)"}, {"letter": "D", "text": "Hemi-walker (one-handed frame)"}, {"letter": "E", "text": "Front-wheeled walker (FWW)"}], "answer": "B", "explanation": "**Lofstrand (forearm) crutches** are for **long-term** use, typically **neurologic conditions (MS, CP)** with balance and weakness impairments. Axillary crutches are for temporary ortho problems.", "objective": "", "remediation": {"steps": [{"teach": "The two crutch types are separated by **duration of use** and **type of problem**: one is temporary/orthopedic, the other is long-term/neurologic.", "stem": "Which crutch is intended for long-term use?", "options": [{"letter": "A", "text": "Axillary"}, {"letter": "B", "text": "Lofstrand (forearm)"}], "answer": "B", "explanation": "Lofstrand = long-term; axillary = temporary.", "clarify": [{"teach": "The typical long-term crutch user has a **neurologic** rather than orthopedic diagnosis.", "stem": "Which diagnosis fits a Lofstrand user?", "options": [{"letter": "A", "text": "Multiple sclerosis"}, {"letter": "B", "text": "Post-op ankle fracture"}], "answer": "A", "explanation": "MS and CP are the named Lofstrand examples."}]}, {"teach": "Lofstrand fit uses the **forearm cuff** and the **handgrip** as landmarks.", "stem": "Correct Lofstrand fit places the cuff:", "options": [{"letter": "A", "text": "3 finger widths below the elbow, grip at wrist height"}, {"letter": "B", "text": "At the mid-humerus, grip at hip height"}, {"letter": "C", "text": "2–3 finger widths below the axilla"}], "answer": "A", "explanation": "Cuff 3 finger widths below the elbow; handgrip at wrist height."}], "checkpoints": [{"stem": "On the stability ladder, bilateral forearm crutches sit directly below which device?", "options": [{"letter": "A", "text": "Bilateral canes"}, {"letter": "B", "text": "Bilateral axillary crutches"}, {"letter": "C", "text": "Hemi-walker"}, {"letter": "D", "text": "Quad cane"}], "answer": "B", "explanation": "Parallel bars > walker > axillary crutches > forearm crutches > bilateral canes > hemi-walker > quad cane > straight cane."}, {"stem": "Which routine check is specific to forearm crutch maintenance per the lecture?", "options": [{"letter": "A", "text": "Axillary pad thickness"}, {"letter": "B", "text": "Push buttons pressed in, leg rotated, tip inspected for wear"}, {"letter": "C", "text": "Wheel alignment"}, {"letter": "D", "text": "Seat height"}], "answer": "B", "explanation": "Push buttons pressed in and the leg rotated; inspect the tip for wear."}]}}, {"id": "23", "group": 20, "section": "Assistive devices", "topic": "Hemi-walker", "skill": "Identification", "stem": "A WBAT patient can use only one hand but needs more support than a quad cane provides → Device:", "options": [{"letter": "A", "text": "Straight cane"}, {"letter": "B", "text": "Small-base quad cane"}, {"letter": "C", "text": "Hemi-walker"}, {"letter": "D", "text": "Bilateral canes"}, {"letter": "E", "text": "Standard walker"}], "answer": "C", "explanation": "The **hemi-walker** is a one-handed walker frame — the most support of the **unilateral** devices. On the ladder it sits between bilateral canes (more stable) and the quad cane (less stable); being one-handed, it is for WBAT/FWB.", "objective": "", "remediation": {"steps": [{"teach": "Unilateral (one-hand) devices run from least to most support: straight cane → small-base quad → large-base quad → **one-handed walker frame**.", "stem": "Which one-handed device offers the MOST support?", "options": [{"letter": "A", "text": "Hemi-walker"}, {"letter": "B", "text": "Straight cane"}, {"letter": "C", "text": "Small-base quad cane"}], "answer": "A", "explanation": "The hemi-walker tops the unilateral group.", "clarify": [{"teach": "Among quad canes, the **large-base** gives more support than the **small-base**.", "stem": "Which quad cane is more stable?", "options": [{"letter": "A", "text": "Large-base quad cane (LBQC)"}, {"letter": "B", "text": "Small-base quad cane (SBQC)"}], "answer": "A", "explanation": "LBQC > SBQC."}]}, {"teach": "Because it is used with **one hand**, the hemi-walker does not provide bilateral UE support.", "stem": "The hemi-walker is appropriate for which weight-bearing group?", "options": [{"letter": "A", "text": "WBAT/FWB"}, {"letter": "B", "text": "Limited WB (NWB/TTWB/PWB)"}], "answer": "A", "explanation": "Unilateral → WBAT/FWB only."}], "checkpoints": [{"stem": "Which device is immediately MORE stable than the hemi-walker on the stability ladder?", "options": [{"letter": "A", "text": "Quad cane"}, {"letter": "B", "text": "Bilateral canes"}, {"letter": "C", "text": "Single-point cane"}, {"letter": "D", "text": "No device"}], "answer": "B", "explanation": "...bilateral canes > hemi-walker > quad cane > single-point cane."}, {"stem": "At the top of the stability ladder (most stable, least mobile) is:", "options": [{"letter": "A", "text": "Walker"}, {"letter": "B", "text": "Parallel bars"}, {"letter": "C", "text": "Axillary crutches"}, {"letter": "D", "text": "Hemi-walker"}], "answer": "B", "explanation": "Parallel bars > walker > axillary crutches > ..."}]}}, {"id": "24", "group": 21, "section": "Assistive devices", "topic": "Walker", "skill": "Counseling & prevention", "stem": "Correct sequence of movement when walking with a standard walker:", "options": [{"letter": "A", "text": "Affected leg → walker → unaffected leg"}, {"letter": "B", "text": "Walker → unaffected leg → affected leg"}, {"letter": "C", "text": "Walker → affected leg → unaffected leg"}, {"letter": "D", "text": "Unaffected leg → affected leg → walker"}, {"letter": "E", "text": "Walker and both legs move together"}], "answer": "C", "explanation": "**Walker → affected leg → unaffected leg.** The walker goes first to create the support, the weak leg steps into it, then the strong leg follows.", "objective": "", "remediation": {"steps": [{"teach": "With any device, the device establishes **support first**, and the **weak** leg moves while the arms are sharing the load.", "stem": "What moves first when walking with a walker?", "options": [{"letter": "A", "text": "The walker"}, {"letter": "B", "text": "The unaffected leg"}, {"letter": "C", "text": "The affected leg"}], "answer": "A", "explanation": "Walker first.", "clarify": [{"teach": "The leg that needs the help steps **into** the support.", "stem": "After the walker advances, which leg steps next?", "options": [{"letter": "A", "text": "Affected leg"}, {"letter": "B", "text": "Unaffected leg"}], "answer": "A", "explanation": "Affected leg, then unaffected."}]}, {"teach": "The cane sequence is similar in spirit but the device and weak leg move **together**.", "stem": "How does the cane sequence differ from the walker sequence?", "options": [{"letter": "A", "text": "Cane and affected leg move together, then the unaffected leg"}, {"letter": "B", "text": "Cane moves after both legs"}, {"letter": "C", "text": "They are identical"}], "answer": "A", "explanation": "Cane + affected leg together → unaffected leg; walker → affected → unaffected."}], "checkpoints": [{"stem": "Which patient feature makes the walker preferred because it 'mimics a normal gait pattern'?", "options": [{"letter": "A", "text": "Osteoarthritis of one knee"}, {"letter": "B", "text": "Cognitive deficit"}, {"letter": "C", "text": "Temporary ankle fracture in a young athlete"}, {"letter": "D", "text": "Long-term MS"}], "answer": "B", "explanation": "Walker for cognitive deficits — it mimics a normal gait pattern (and refer to PT)."}, {"stem": "Compared with no device, oxygen cost with a standard walker rises by about:", "options": [{"letter": "A", "text": "An insignificant amount"}, {"letter": "B", "text": "108%"}, {"letter": "C", "text": "212%"}, {"letter": "D", "text": "20%"}], "answer": "C", "explanation": "Walker +212% O₂ (rolling walker +108%); cane insignificant."}]}}, {"id": "25", "group": 22, "section": "Rehab settings", "topic": "Subacute rehabilitation (SAR)", "skill": "Identification", "stem": "Rehab setting that requires a 3-day hospital stay before admission and therapy tolerance of 2 hours per day → Setting:", "options": [{"letter": "A", "text": "LTAC (long-term acute care)"}, {"letter": "B", "text": "Acute inpatient rehab unit"}, {"letter": "C", "text": "Subacute rehab in a SNF"}, {"letter": "D", "text": "Home health rehabilitation"}, {"letter": "E", "text": "Day rehabilitation program"}], "answer": "C", "explanation": "**Subacute rehab (SNF)**: tolerate **2 h/day**, provider ≤3×/week, nursing daily, **3-day hospital stay required**, LOS 3–4 weeks, more orthopedic; can convert to long-term care resident status.", "objective": "", "remediation": {"steps": [{"teach": "Two facility settings are distinguished mainly by **therapy tolerance** — the higher number goes with the medically complex hospital-based unit, the lower number with the nursing-facility unit.", "stem": "Which therapy tolerance defines subacute rehab?", "options": [{"letter": "A", "text": "2 hours/day"}, {"letter": "B", "text": "3 hours/day"}], "answer": "A", "explanation": "Subacute = 2 h/day; acute inpatient = 3 h/day.", "clarify": [{"teach": "Subacute rehab is **housed in a skilled nursing facility**.", "stem": "Where is subacute rehab delivered?", "options": [{"letter": "A", "text": "Skilled nursing facility"}, {"letter": "B", "text": "The patient's home"}], "answer": "A", "explanation": "SAR is housed in a SNF."}]}, {"teach": "Subacute rehab has an **entry gate** that acute inpatient rehab does not.", "stem": "What must precede admission to subacute rehab?", "options": [{"letter": "A", "text": "A 3-day hospital stay"}, {"letter": "B", "text": "A home safety evaluation"}, {"letter": "C", "text": "Neuropsychological testing"}], "answer": "A", "explanation": "A 3-day hospital stay is required first."}, {"teach": "If goals for home are not met, the subacute patient has a built-in **fallback**.", "stem": "A SAR patient cannot meet functional goals for home. What can happen?", "options": [{"letter": "A", "text": "Transition to long-term care resident status in the SNF"}, {"letter": "B", "text": "Transfer to LTAC"}, {"letter": "C", "text": "Discharge to outpatient"}], "answer": "A", "explanation": "They can stay and transition to long-term care."}], "checkpoints": [{"stem": "How often does a provider (MD/NP/PA) assess a subacute rehab patient?", "options": [{"letter": "A", "text": "Daily"}, {"letter": "B", "text": "Up to 3 times per week"}, {"letter": "C", "text": "Once per month"}, {"letter": "D", "text": "Only at admission"}], "answer": "B", "explanation": "Provider ≤3×/week in SAR; daily in acute rehab and LTAC."}, {"stem": "The diagnostic mix in subacute rehab compared with acute inpatient rehab is described as:", "options": [{"letter": "A", "text": "More neurologic"}, {"letter": "B", "text": "More orthopedic"}, {"letter": "C", "text": "More respiratory"}, {"letter": "D", "text": "Exclusively cardiac"}], "answer": "B", "explanation": "Similar diagnoses but more orthopedic; rehab is the reason for admission."}]}}, {"id": "26", "group": 23, "section": "Rehab settings", "topic": "LTAC — Long-Term Acute Care", "skill": "Identification", "stem": "Ventilator/trach weaning, wound vac therapy, or prolonged IV antibiotics → Appropriate rehab setting:", "options": [{"letter": "A", "text": "Acute inpatient rehab"}, {"letter": "B", "text": "Subacute rehab (SNF)"}, {"letter": "C", "text": "LTAC"}, {"letter": "D", "text": "Home health"}, {"letter": "E", "text": "Outpatient rehab"}], "answer": "C", "explanation": "**LTAC** serves the **medically complicated** patient: vent/trach weaning, chronic/open wounds (wound vac), infection needing prolonged IV antibiotics, high-technology equipment.", "objective": "", "remediation": {"steps": [{"teach": "One setting is defined by **medical/respiratory needs** rather than by rehab tolerance — its patients still need hospital-level technology.", "stem": "Which setting is for the 'medically complicated' patient on a ventilator?", "options": [{"letter": "A", "text": "LTAC"}, {"letter": "B", "text": "Outpatient"}, {"letter": "C", "text": "Home health"}], "answer": "A", "explanation": "LTAC = long-term acute care.", "clarify": [{"teach": "**Wound vacs** and **prolonged IV antibiotics** are the other LTAC hallmarks.", "stem": "Six weeks of IV antibiotics with a wound vac points to:", "options": [{"letter": "A", "text": "LTAC"}, {"letter": "B", "text": "Subacute rehab"}], "answer": "A", "explanation": "LTAC."}]}, {"teach": "LTAC staffing requirements are the **most intensive**: daily physician, frequent respiratory therapy, many nursing hours.", "stem": "Which staffing pattern matches LTAC?", "options": [{"letter": "A", "text": "MD daily, RT ≥TID, skilled nursing ≥7 h/day"}, {"letter": "B", "text": "Provider ≤3×/week, nursing daily"}, {"letter": "C", "text": "Intermittent skilled nursing"}], "answer": "A", "explanation": "MD daily; RT at least three times daily; skilled nursing ≥7 hours/day."}], "checkpoints": [{"stem": "Average LTAC length of stay:", "options": [{"letter": "A", "text": "3–4 days"}, {"letter": "B", "text": "12–16 days"}, {"letter": "C", "text": "About 30 days"}, {"letter": "D", "text": "3–4 months"}], "answer": "C", "explanation": "LOS ~30 days."}, {"stem": "Which setting's requirements include respiratory therapy at least three times daily?", "options": [{"letter": "A", "text": "Acute inpatient rehab"}, {"letter": "B", "text": "LTAC"}, {"letter": "C", "text": "Subacute rehab"}, {"letter": "D", "text": "Day rehabilitation"}], "answer": "B", "explanation": "RT ≥TID is an LTAC requirement."}]}}, {"id": "27", "group": 23, "section": "Rehab settings", "topic": "LTAC — Long-Term Acute Care", "skill": "Management", "stem": "After an LTAC stay, patients typically discharge to which level of care?", "options": [{"letter": "A", "text": "Directly home without services"}, {"letter": "B", "text": "Acute or subacute rehab"}, {"letter": "C", "text": "Hospice"}, {"letter": "D", "text": "Outpatient rehab only"}, {"letter": "E", "text": "Day rehabilitation"}], "answer": "B", "explanation": "LTAC patients typically discharge **to acute or subacute rehab** after an average LOS of about 30 days.", "objective": "", "remediation": {"steps": [{"teach": "LTAC solves the **medical** problem (vent, wound, infection); the **functional** rehab still lies ahead, so discharge is a step down to a rehab facility.", "stem": "After LTAC, is the patient usually ready to go straight home?", "options": [{"letter": "A", "text": "No — they go to a rehab facility"}, {"letter": "B", "text": "Yes — home without services"}], "answer": "A", "explanation": "Typical discharge is to acute or subacute rehab.", "clarify": [{"teach": "The two facility-based rehab levels after LTAC are **acute inpatient** and **subacute (SNF)**.", "stem": "Which pair are LTAC discharge destinations?", "options": [{"letter": "A", "text": "Acute or subacute rehab"}, {"letter": "B", "text": "Outpatient or hospice"}], "answer": "A", "explanation": "Acute or subacute rehab."}]}], "checkpoints": [{"stem": "An LTAC patient has been weaned from the vent and can now tolerate 3 h of therapy/day with a plan to go home. Best next setting:", "options": [{"letter": "A", "text": "Acute inpatient rehab"}, {"letter": "B", "text": "Home health"}, {"letter": "C", "text": "Outpatient rehab"}, {"letter": "D", "text": "Remain in LTAC"}], "answer": "A", "explanation": "3 h/day tolerance, medical complexity, and a non-nursing-home discharge plan = acute inpatient rehab."}, {"stem": "Which of the following settings is listed as completing the rehab-settings list alongside acute care floors, and serves the TBI population?", "options": [{"letter": "A", "text": "Day rehabilitation"}, {"letter": "B", "text": "Hospice"}, {"letter": "C", "text": "Urgent care"}, {"letter": "D", "text": "Assisted living"}], "answer": "A", "explanation": "Acute care (med/surg floors) and Day Rehabilitation (TBI population) complete the list."}]}}, {"id": "28", "group": 24, "section": "Rehab team", "topic": "Rehab team members", "skill": "Identification", "multi": true, "stem": "Which of the following statements about rehab team members are correct?", "options": [{"letter": "A", "text": "The neuropsychologist is often the team leader in TBI settings"}, {"letter": "B", "text": "The case manager orders DME and coordinates discharge planning"}, {"letter": "C", "text": "The rehab nurse is an inpatient-only team member"}, {"letter": "D", "text": "The vocational therapist is an inpatient-only team member"}, {"letter": "E", "text": "The speech-language pathologist fits upper-extremity orthotics"}], "answers": ["A", "B", "C"], "explanation": "**Neuropsychologist leads in TBI**; the **case manager** is the insurance liaison, coordinates discharge, and orders DME; **rehab nurse and case manager are inpatient-only**. The vocational therapist is **outpatient-only**, and UE orthotics belong to **OT**, not SLP.", "objective": "", "remediation": {"steps": [{"teach": "The team leader is usually the **medical provider (MD/PA)**, but one population swaps in a specialist in **behavior and cognition testing**.", "stem": "In a TBI program, the team leader is often the:", "options": [{"letter": "A", "text": "Neuropsychologist"}, {"letter": "B", "text": "Physical therapist"}, {"letter": "C", "text": "Chaplain"}], "answer": "A", "explanation": "Neuropsychologist — full neuropsych and behavioral testing, behavior-management programs.", "clarify": [{"teach": "Outside TBI, leadership defaults to the **medical provider**.", "stem": "The usual rehab team leader is the:", "options": [{"letter": "A", "text": "MD/PA"}, {"letter": "B", "text": "Case manager"}], "answer": "A", "explanation": "Usually the medical provider."}]}, {"teach": "One member connects the team to **insurance**, plans the **discharge**, and **orders the equipment**.", "stem": "Who is the liaison to the insurance case manager and orders DME?", "options": [{"letter": "A", "text": "Medical social worker"}, {"letter": "B", "text": "Case manager"}, {"letter": "C", "text": "Dietician"}], "answer": "B", "explanation": "Case manager."}, {"teach": "Some members exist only in one setting: two are **inpatient-only**, one is **outpatient-only**.", "stem": "Which member is outpatient-only?", "options": [{"letter": "A", "text": "Vocational therapist"}, {"letter": "B", "text": "Rehab nurse"}, {"letter": "C", "text": "Case manager"}], "answer": "A", "explanation": "Vocational therapist = OP; rehab nurse and case manager = IP.", "clarify": [{"teach": "**UE orthotics** are fitted by the therapist who handles fine motor and ADLs.", "stem": "Upper-extremity orthotics are the responsibility of:", "options": [{"letter": "A", "text": "Occupational therapist"}, {"letter": "B", "text": "Speech-language pathologist"}], "answer": "A", "explanation": "OT, not SLP."}]}], "checkpoints": [{"stem": "Which principle describes how rehab team roles relate to one another?", "options": [{"letter": "A", "text": "Roles are strictly separated"}, {"letter": "B", "text": "Roles overlap and all members educate, prescribe equipment, and consult"}, {"letter": "C", "text": "Only the MD/PA prescribes equipment"}, {"letter": "D", "text": "Only therapists educate families"}], "answer": "B", "explanation": "All members take part in education, equipment prescribing, and consultation; roles overlap."}, {"stem": "Which team member 'facilitates self-care, not just care provision'?", "options": [{"letter": "A", "text": "Rehab nurse"}, {"letter": "B", "text": "Medical social worker"}, {"letter": "C", "text": "Chaplain"}, {"letter": "D", "text": "Orthotist"}], "answer": "A", "explanation": "The inpatient rehab nurse facilitates self-care."}]}, "answer": "A,B,C"}, {"id": "29", "group": 25, "section": "Neuro rehab", "topic": "Direct vs indirect impairments", "skill": "Disease process", "stem": "Loss of vocation, depression, and a change in family roles after a stroke → Classification:", "options": [{"letter": "A", "text": "Direct impairments"}, {"letter": "B", "text": "Indirect impairments"}, {"letter": "C", "text": "Activity training targets"}, {"letter": "D", "text": "Environmental factors"}, {"letter": "E", "text": "Clinical pause points"}], "answer": "B", "explanation": "**Indirect impairments** are the life/psychosocial **consequences** of the deficit (loss of autonomy, depression, loss of vocation, family role change, financial impact). **Direct** impairments are neurologic deficits you can examine (spasticity, apraxia, agnosia, dysphagia).", "objective": "", "remediation": {"steps": [{"teach": "Post-stroke problems split into those that come **from the lesion itself** and those that are **consequences of living with the deficit**.", "stem": "Which is a problem caused directly by the brain lesion?", "options": [{"letter": "A", "text": "Spasticity"}, {"letter": "B", "text": "Loss of vocation"}, {"letter": "C", "text": "Financial impact"}], "answer": "A", "explanation": "Spasticity is a direct (examinable) neurologic deficit.", "clarify": [{"teach": "The exam discriminator: **direct = a neurologic deficit you can examine; indirect = a life/psychosocial consequence**.", "stem": "Depression after stroke is classified as:", "options": [{"letter": "A", "text": "Indirect impairment"}, {"letter": "B", "text": "Direct impairment"}], "answer": "A", "explanation": "A psychosocial consequence → indirect."}]}, {"teach": "Indirect impairments are often shaped by **social determinants of health**.", "stem": "Which factor is named as influencing indirect impairments?", "options": [{"letter": "A", "text": "Caregiver support and transportation"}, {"letter": "B", "text": "Lesion location"}, {"letter": "C", "text": "Gait cycle timing"}], "answer": "A", "explanation": "Access to care, caregiver support, transportation, socioeconomic status."}], "checkpoints": [{"stem": "Inability to recognize objects, people, or sounds despite intact sensation → Term:", "options": [{"letter": "A", "text": "Apraxia"}, {"letter": "B", "text": "Agnosia"}, {"letter": "C", "text": "Dysarthria"}, {"letter": "D", "text": "Aphasia"}], "answer": "B", "explanation": "Agnosia = cannot recognize despite intact sensation; apraxia = cannot perform purposeful movements."}, {"stem": "Which of these is a DIRECT impairment?", "options": [{"letter": "A", "text": "Fear of recurrence"}, {"letter": "B", "text": "Decreased self-esteem"}, {"letter": "C", "text": "Dysphagia"}, {"letter": "D", "text": "Change in family roles"}], "answer": "C", "explanation": "Dysphagia is a direct impairment from the lesion; the others are indirect consequences."}]}}, {"id": "30", "group": 26, "section": "Speech therapy", "topic": "Dysarthria vs aphasia", "skill": "Identification", "stem": "Slurred, slow, imprecise, low-volume speech with intact language → Term:", "options": [{"letter": "A", "text": "Expressive aphasia"}, {"letter": "B", "text": "Receptive aphasia"}, {"letter": "C", "text": "Dysarthria"}, {"letter": "D", "text": "Global aphasia"}, {"letter": "E", "text": "Apraxia"}], "answer": "C", "explanation": "**Dysarthria** is a **motor speech** disorder — weakness/incoordination of speech muscles makes words hard to articulate while **language is intact**. Aphasia is a language disorder (expressive, receptive, or global).", "objective": "", "remediation": {"steps": [{"teach": "Speech problems after stroke are either a **muscle/articulation** problem or a **language** problem — the test is whether the language itself is intact.", "stem": "Speech that is hard to articulate but with normal language content is a problem of:", "options": [{"letter": "A", "text": "Motor speech (dysarthria)"}, {"letter": "B", "text": "Language (aphasia)"}], "answer": "A", "explanation": "Dysarthria = motor speech; language intact.", "clarify": [{"teach": "**Aphasia** affects finding, producing, understanding, reading, or writing language.", "stem": "Trouble understanding or producing language itself is:", "options": [{"letter": "A", "text": "Aphasia"}, {"letter": "B", "text": "Dysarthria"}], "answer": "A", "explanation": "Aphasia is the language disorder."}]}, {"teach": "Within aphasia, the **expressive** type is halting and effortful, yet the patient **knows what they want to say**.", "stem": "Effortful, halting speech in a patient who knows what they want to say is:", "options": [{"letter": "A", "text": "Expressive aphasia"}, {"letter": "B", "text": "Dysarthria"}, {"letter": "C", "text": "Agnosia"}], "answer": "A", "explanation": "Expressive aphasia — use yes/no, gestures, writing, pictures."}], "checkpoints": [{"stem": "Which communication strategy does the lecture recommend for expressive aphasia?", "options": [{"letter": "A", "text": "Speak for the patient to save time"}, {"letter": "B", "text": "Yes/no questions, gestures, writing, pictures"}, {"letter": "C", "text": "Raise your voice"}, {"letter": "D", "text": "Use long, detailed prompts"}], "answer": "B", "explanation": "Yes/no, gestures, writing, pictures; face the patient, short concrete prompts, allow time."}, {"stem": "Why does the lecture flag expressive aphasia as especially important beyond communication?", "options": [{"letter": "A", "text": "It predicts dysphagia"}, {"letter": "B", "text": "It matters for capacity assessment"}, {"letter": "C", "text": "It requires NPO status"}, {"letter": "D", "text": "It mandates a walker"}], "answer": "B", "explanation": "Expressive aphasia matters for bedside communication and capacity assessment — the patient knows what they want to say."}]}}, {"id": "31", "group": 27, "section": "Speech therapy", "topic": "Dysphagia", "skill": "Management", "stem": "Wet, gurgly voice after swallowing and coughing with thin liquids in a post-stroke patient → Best next step:", "options": [{"letter": "A", "text": "Advance to a regular diet with thin liquids and supervision"}, {"letter": "B", "text": "SLP bedside swallow evaluation; NPO if risk is high"}, {"letter": "C", "text": "Refer to OT for visual scanning strategies"}, {"letter": "D", "text": "Fit a resting hand splint and begin ROM"}, {"letter": "E", "text": "Start an outpatient vocational therapy evaluation"}], "answer": "B", "explanation": "These are dysphagia clues → **SLP bedside swallow evaluation**, keep **NPO until swallow safety is clarified when risk is high**, and review meds for safe route/formulation. **Dysphagia is a medical safety issue.**", "objective": "", "remediation": {"steps": [{"teach": "Certain bedside clues mean the airway is not protected during swallowing — and the lecture treats this as a **medical safety issue**, not a therapy nicety.", "stem": "Which finding is a dysphagia clue?", "options": [{"letter": "A", "text": "Wet/gurgly voice after swallowing"}, {"letter": "B", "text": "One-sided grooming"}, {"letter": "C", "text": "Trunk flexion on crutches"}], "answer": "A", "explanation": "Wet/gurgly voice, cough/choke with meals, drooling, pocketing, recurrent pneumonia, O₂ decline, unexplained fever, poor intake.", "clarify": [{"teach": "Dysphagia raises the risk of **aspiration, pneumonia, dehydration, malnutrition, and medication problems**.", "stem": "Recurrent pneumonia in a stroke patient should raise suspicion for:", "options": [{"letter": "A", "text": "Dysphagia"}, {"letter": "B", "text": "Agnosia"}], "answer": "A", "explanation": "Recurrent pneumonia is a dysphagia clue."}]}, {"teach": "The team member who evaluates swallowing performs a **bedside swallow**, sets diet/liquid textures, teaches compensatory maneuvers, and orders instrumental evaluation when indicated.", "stem": "Who evaluates swallow safety?", "options": [{"letter": "A", "text": "Speech-language pathologist"}, {"letter": "B", "text": "Occupational therapist"}, {"letter": "C", "text": "Dietician"}], "answer": "A", "explanation": "SLP."}, {"teach": "While waiting for clarity, the PA's actions protect the patient: hold oral intake when risk is high and check every medication's **route**.", "stem": "Which PA action is recommended when aspiration risk is high and swallow safety is not yet clarified?", "options": [{"letter": "A", "text": "Keep NPO and review med routes/formulations"}, {"letter": "B", "text": "Continue a regular diet with supervision"}, {"letter": "C", "text": "Switch all meds to IV permanently"}], "answer": "A", "explanation": "NPO until clarified; review meds for safe route/formulation; monitor hydration, nutrition, aspiration."}], "checkpoints": [{"stem": "Which event is listed as a 'clinical pause point' requiring therapy to hold and the patient to be re-stabilized?", "options": [{"letter": "A", "text": "Mild muscle soreness after exercise"}, {"letter": "B", "text": "Aspiration event"}, {"letter": "C", "text": "Request for a different therapist"}, {"letter": "D", "text": "Improved transfer ability"}], "answer": "B", "explanation": "Pause points: new neuro deficit, aspiration event, suspected DVT/PE, chest pain, unsafe cognition."}, {"stem": "According to the take-home pearls, discharge readiness is a decision about:", "options": [{"letter": "A", "text": "Medical stability alone"}, {"letter": "B", "text": "Mobility alone"}, {"letter": "C", "text": "Functional safety — move, self-care, communicate, swallow, live safely at home"}, {"letter": "D", "text": "Insurance authorization"}], "answer": "C", "explanation": "Mobility is necessary but not sufficient; discharge is a functional safety decision."}]}}, {"id": "32", "group": 28, "section": "Rehab overview", "topic": "Acute vs chronic rehab goals", "skill": "Disease process", "stem": "Optimizing health to allow adaptation to the personal environment and the 'New Normal' describes the goal of which type of rehab?", "options": [{"letter": "A", "text": "Acute rehab"}, {"letter": "B", "text": "Chronic rehab"}, {"letter": "C", "text": "Vocational rehab"}, {"letter": "D", "text": "Day rehabilitation"}, {"letter": "E", "text": "Gait training"}], "answer": "B", "explanation": "**Chronic rehab** = restore lost function by **adapting to the New Normal**. Acute rehab adds two earlier goals: **stabilize the primary problem → prevent secondary complications → restore lost function**.", "objective": "", "remediation": {"steps": [{"teach": "Acute and chronic rehab share the end goal of **restoring function**, but the acute version has two extra goals that come first.", "stem": "Which goal belongs ONLY to acute rehab?", "options": [{"letter": "A", "text": "Stabilize the primary problem"}, {"letter": "B", "text": "Restore lost function"}, {"letter": "C", "text": "Adapt to the personal environment"}], "answer": "A", "explanation": "Acute: stabilize → prevent secondary complications → restore function.", "clarify": [{"teach": "The acute goals are ordered: stabilize first, then **prevent complications**, then restore.", "stem": "The second acute rehab goal is:", "options": [{"letter": "A", "text": "Prevent secondary complications"}, {"letter": "B", "text": "Vocational placement"}], "answer": "A", "explanation": "Prevent secondary complications."}]}, {"teach": "Chronic rehab's single goal is framed around **adaptation**.", "stem": "In chronic rehab, 'restore lost function' is achieved through:", "options": [{"letter": "A", "text": "Adaptation to the New Normal"}, {"letter": "B", "text": "Reversal of the underlying disease"}, {"letter": "C", "text": "Prolonged bed rest"}], "answer": "A", "explanation": "Optimize health to allow adaptation to the personal environment and the New Normal."}], "checkpoints": [{"stem": "The three things rehab does are remediate impairments, restore function, and:", "options": [{"letter": "A", "text": "Cure disease"}, {"letter": "B", "text": "Compensate for lost function"}, {"letter": "C", "text": "Prescribe medication"}, {"letter": "D", "text": "Admit to LTAC"}], "answer": "B", "explanation": "Remediate impairments, restore function, compensate for lost function (adaptive technology, orthotics/prosthetics)."}, {"stem": "According to the lecture, the ultimate goal of rehabilitation is:", "options": [{"letter": "A", "text": "Normal gait"}, {"letter": "B", "text": "Medical stability"}, {"letter": "C", "text": "Participation"}, {"letter": "D", "text": "Discharge to a nursing home"}], "answer": "C", "explanation": "The ultimate goal of rehabilitation is participation."}]}}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };
  // Select-all-that-apply support: q.multi === true, q.answers = ['A','C'] (q.answer mirrors the joined key for audits).
  const isMulti = q => !!q.multi;
  const keyLetters = q => isMulti(q) ? (q.answers || String(q.answer).split(',')).map(x => x.trim()).sort() : [q.answer];
  const chosenLetters = q => { const a = answers[q.id]; return a === undefined ? [] : (isMulti(q) ? String(a).split(',').filter(Boolean).sort() : [a]); };
  const isRight = q => { const c = chosenLetters(q), k = keyLetters(q); return c.length === k.length && c.every((x, i) => x === k[i]); };
  const keyLabel = q => keyLetters(q).join(', ');
  const keyText = q => keyLetters(q).map(l => optText(q, l)).join('; ');
  const pendingSel = {};   // multi questions: letters ticked but not yet checked

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(keyLabel(q)) + '. ' + fmt(keyText(q)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });
    pushCheckpoint(q, t);
  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);
    }
  }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong without a pathway, or its pathway has finished.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (isRight(q) || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';
    t.trail.forEach((n, i) => { html += nodeHtml(q, n, i, interactive); });
    html += '</div>';
    return html;
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = isRight(q);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer' + (isMulti(q) ? 's' : '') + ': ' +
      esc(keyLabel(q)) + '. ' + fmt(keyText(q))) + '</div>';
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const wrong = answered && !isRight(q);
    const tutoring = wrong && hasTutor(q);
    const t = tutor[q.id];
    // While the pathway is still in its teaching steps (exam mode), the correct answer stays hidden
    const hideKey = mode === 'exam' && tutoring && t && t.phase === 'steps';
    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Mastered after review</span>';
    else if (status === 'review') html += '<span class="badge review">Flagged for review</span>';
    else if (status === 'active') html += '<span class="badge active">Guided review in progress</span>';
    html += '<div class="stem">' + fmt(q.stem) + (isMulti(q) ? '\n<span class="sata">Select all that apply</span>' : '') + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    const multi = isMulti(q), chosenSet = chosenLetters(q), keySet = keyLetters(q), sel = pendingSel[q.id] || [];
    q.options.forEach(o => {
      let cls = 'opt' + (multi ? ' multi' : '');
      if (answered) {
        const picked = chosenSet.indexOf(o.letter) !== -1, isKey = keySet.indexOf(o.letter) !== -1;
        if (multi) {
          if (picked && isKey) cls += ' correct';
          else if (picked && !isKey) cls += ' incorrect';
          else if (!picked && isKey && !hideKey) cls += ' missed';
          else if (!hideKey) cls += ' dim';
        } else {
          if (o.letter === chosen) cls += isRight(q) ? ' correct' : ' incorrect';
          else if (isKey && !hideKey) cls += ' correct';
          else if (!hideKey) cls += ' dim';
        }
      } else if (multi && sel.indexOf(o.letter) !== -1) cls += ' sel';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + (multi ? '<span class="box"></span>' : '') + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (multi && !answered && mode === 'exam') html += '<button class="btn primary btn-check"' + (sel.length ? '' : ' disabled') + '>Check answer</button>';
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          if (isMulti(q)) {
            const l = btn.getAttribute('data-letter');
            const cur = pendingSel[qid] || [];
            pendingSel[qid] = cur.indexOf(l) === -1 ? cur.concat([l]) : cur.filter(x => x !== l);
            renderPage(true);
            return;
          }
          answers[qid] = btn.getAttribute('data-letter');
          if (!isRight(q) && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
      const chk = card.querySelector(':scope > .btn-check');
      if (chk) chk.addEventListener('click', () => {
        if (mode !== 'exam' || answers[qid] !== undefined) return;
        const q = byId[qid];
        const sel = (pendingSel[qid] || []).slice().sort();
        if (!sel.length) return;
        answers[qid] = sel.join(',');
        delete pendingSel[qid];
        if (!isRight(q) && hasTutor(q)) startTutor(q);
        renderPage(true);
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (isRight(q)) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (isRight(q)) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && !isRight(q));
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer' + (isMulti(q) ? 's' : '') + ': ' + keyLabel(q) + '. ' + plain(keyText(q)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(pendingSel).forEach(k => delete pendingSel[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
