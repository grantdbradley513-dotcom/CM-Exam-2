<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "Rehab Medicine-Concept_Adaptive_Exam", "questions": [{"id": "1", "group": 1, "section": "Neuro rehab", "topic": "Neuroplasticity", "skill": "Disease process", "stem": "The brain's capacity to reorganize and form new neural connections in response to experience, learning, or injury → Term:", "options": [{"letter": "A", "text": "Neuroplasticity"}, {"letter": "B", "text": "Remediation of impairment"}, {"letter": "C", "text": "Compensatory strategy"}, {"letter": "D", "text": "Participation restriction"}, {"letter": "E", "text": "Mentation"}], "answer": "A", "explanation": "**Neuroplasticity** is the brain's capacity to reorganize and form new neural connections; neuro rehab is built to leverage it.", "objective": "", "remediation": {"steps": [{"teach": "Neuro rehab works because the injured brain can **change its wiring** — new connections form in response to what the patient practices.", "stem": "Which statement describes the property rehab leverages after a stroke?", "options": [{"letter": "A", "text": "The brain can reorganize and form new neural connections"}, {"letter": "B", "text": "Lost neurons regrow in the infarct core"}, {"letter": "C", "text": "Deficits are fixed once the lesion is complete"}], "answer": "A", "explanation": "Reorganization and new connections in response to experience and injury is the property rehab exploits.", "clarify": [{"teach": "Rehab works on the brain's **response to experience**, not on reversing the lesion itself.", "stem": "Neuro rehab changes function mainly by:", "options": [{"letter": "A", "text": "Driving new neural connections through practice"}, {"letter": "B", "text": "Shrinking the stroke lesion"}], "answer": "A", "explanation": "Practice drives reorganization; the lesion itself is not reversed."}]}, {"teach": "Rehab's other big-picture terms describe **what the team does** (remediate, restore, compensate) or the ultimate goal (**participation**) — none of them names the brain's own capacity to rewire.", "stem": "Which term refers to the brain, not to the therapy plan?", "options": [{"letter": "A", "text": "Compensate for lost function"}, {"letter": "B", "text": "The brain's capacity to reorganize"}, {"letter": "C", "text": "Remediate impairments"}], "answer": "B", "explanation": "Remediation and compensation are things rehab does; the brain's capacity to reorganize is the property that makes it possible."}], "checkpoints": [{"stem": "Because the brain reorganizes in response to experience, rehab practice should be:", "options": [{"letter": "A", "text": "Short, infrequent, and general"}, {"letter": "B", "text": "Task-specific, repetitive, and high-intensity"}, {"letter": "C", "text": "Delayed until all deficits plateau"}, {"letter": "D", "text": "Passive and therapist-driven only"}], "answer": "B", "explanation": "Task-specific, repetitive, high-intensity, early practice with feedback is how rehab leverages neuroplasticity."}]}}, {"id": "2", "group": 1, "section": "Neuro rehab", "topic": "Neuroplasticity", "skill": "Disease process", "stem": "Short, infrequent therapy sessions are less effective than high-intensity, frequent practice → This illustrates which principle of neuro rehab?", "options": [{"letter": "A", "text": "Specificity"}, {"letter": "B", "text": "Feedback"}, {"letter": "C", "text": "Intensity"}, {"letter": "D", "text": "Meaningful context"}, {"letter": "E", "text": "Repetition"}], "answer": "C", "explanation": "**Intensity** — high-intensity, frequent practice; short infrequent sessions are less effective. The five principles are intensity, repetition, specificity, meaningful context, and feedback.", "objective": "", "remediation": {"steps": [{"teach": "The five principles of neuro rehab each answer a different question: how **hard/often**, how **many times**, how **matched** to the goal, how **relevant**, and how much **correction** the patient gets.", "stem": "'How hard and how often the patient practices' is the question answered by which principle?", "options": [{"letter": "A", "text": "Intensity"}, {"letter": "B", "text": "Specificity"}, {"letter": "C", "text": "Meaningful context"}], "answer": "A", "explanation": "Intensity = high-intensity, frequent practice.", "clarify": [{"teach": "**Repetition** is about the number of times a task is practiced; intensity is about how hard and how frequently the sessions are.", "stem": "'Repeated practice strengthens new pathways' describes:", "options": [{"letter": "A", "text": "Repetition"}, {"letter": "B", "text": "Intensity"}], "answer": "A", "explanation": "Repetition strengthens pathways through repeated practice."}]}, {"teach": "**Specificity** means the practiced task matches the functional goal; **meaningful context** means it is relevant to the patient's daily life; **feedback** means frequent, constructive correction.", "stem": "Practicing stair climbing because the patient's goal is to reach a second-floor bedroom illustrates:", "options": [{"letter": "A", "text": "Feedback"}, {"letter": "B", "text": "Specificity"}, {"letter": "C", "text": "Intensity"}], "answer": "B", "explanation": "The practiced task matches the functional goal — specificity."}], "checkpoints": [{"stem": "A therapist gives frequent, constructive corrections during gait practice. Which neuro rehab principle is being applied?", "options": [{"letter": "A", "text": "Repetition"}, {"letter": "B", "text": "Specificity"}, {"letter": "C", "text": "Feedback"}, {"letter": "D", "text": "Meaningful context"}], "answer": "C", "explanation": "Frequent, constructive feedback is one of the five principles."}]}}, {"id": "3", "group": 2, "section": "Rehab settings", "topic": "Acute inpatient rehabilitation", "skill": "Identification", "multi": true, "stem": "Which of the following are requirements for admission to acute inpatient rehabilitation?", "options": [{"letter": "A", "text": "Ability to tolerate 3 hours of therapy per day"}, {"letter": "B", "text": "Need for at least 2 therapy disciplines"}, {"letter": "C", "text": "A discharge plan that is not a nursing home"}, {"letter": "D", "text": "A qualifying 3-day hospital stay before admission"}, {"letter": "E", "text": "Ability to leave home only with considerable, taxing effort"}], "answers": ["A", "B", "C"], "explanation": "Acute inpatient rehab requires **3 h of therapy/day, ≥2 disciplines, daily physician assessment, 24/7 rehab nursing, and a discharge plan that is NOT a nursing home**. The 3-day hospital stay is a subacute (SNF) rule; homebound status is a home-health rule.", "objective": "", "remediation": {"steps": [{"teach": "The acute inpatient rehab patient is **medically complex** and needs comprehensive rehab — so the bar is the highest **therapy tolerance** of any setting and more than one discipline.", "stem": "How many hours of therapy per day must an acute inpatient rehab patient tolerate?", "options": [{"letter": "A", "text": "1 hour"}, {"letter": "B", "text": "2 hours"}, {"letter": "C", "text": "3 hours"}], "answer": "C", "explanation": "3 hours/day for acute inpatient rehab; 2 hours/day is the subacute threshold.", "clarify": [{"teach": "Acute inpatient rehab is a **multidisciplinary** program by definition.", "stem": "Minimum number of therapy disciplines for acute inpatient rehab:", "options": [{"letter": "A", "text": "Two or more"}, {"letter": "B", "text": "One is sufficient"}], "answer": "A", "explanation": "At least 2 disciplines are required."}]}, {"teach": "Acute inpatient rehab exists to send people **back to the community**, so the planned destination matters at admission.", "stem": "Which discharge plan disqualifies a patient from acute inpatient rehab?", "options": [{"letter": "A", "text": "Home with spouse"}, {"letter": "B", "text": "Nursing home"}, {"letter": "C", "text": "Home with home health"}], "answer": "B", "explanation": "The discharge plan cannot be a nursing home."}, {"teach": "Two entry rules belong to **other settings**: a required prior hospital stay and homebound status.", "stem": "The 3-day hospital stay requirement applies to which setting?", "options": [{"letter": "A", "text": "Subacute rehab (SNF)"}, {"letter": "B", "text": "Acute inpatient rehab"}, {"letter": "C", "text": "Outpatient rehab"}], "answer": "A", "explanation": "Subacute rehab in a SNF requires a 3-day hospital stay first; homebound status is the home-health rule.", "clarify": [{"teach": "'Leaving home requires **considerable and taxing effort**' is the definition of homebound.", "stem": "Homebound status is the eligibility rule for:", "options": [{"letter": "A", "text": "Home health"}, {"letter": "B", "text": "Acute inpatient rehab"}], "answer": "A", "explanation": "Homebound is the home-health criterion."}]}], "checkpoints": [{"stem": "How often must a physician assess a patient in acute inpatient rehab?", "options": [{"letter": "A", "text": "Daily"}, {"letter": "B", "text": "Three times per week"}, {"letter": "C", "text": "Weekly"}, {"letter": "D", "text": "Only at admission and discharge"}], "answer": "A", "explanation": "Physician assessment is daily in acute inpatient rehab (and LTAC); subacute is ≤3×/week."}, {"stem": "Average length of stay in acute inpatient rehab for a stroke patient:", "options": [{"letter": "A", "text": "3–4 days"}, {"letter": "B", "text": "About 3 weeks"}, {"letter": "C", "text": "About 30 days"}, {"letter": "D", "text": "3–4 months"}], "answer": "B", "explanation": "General LOS is 12–16 days; about 3 weeks for stroke."}]}, "answer": "A,B,C"}, {"id": "4", "group": 3, "section": "Assistive devices", "topic": "Walker", "skill": "Counseling & prevention", "stem": "When fitting a walker, the handgrip should be level with which landmark while the patient stands?", "options": [{"letter": "A", "text": "Greater trochanter"}, {"letter": "B", "text": "Ulnar styloid"}, {"letter": "C", "text": "Iliac crest"}, {"letter": "D", "text": "Olecranon"}, {"letter": "E", "text": "Radial head"}], "answer": "B", "explanation": "Walker handgrip at the **ulnar styloid** in standing gives 20–30° of elbow flexion — the best biomechanical advantage for the shoulder depressors and elbow extensors. Never trust the device's height markings; measure.", "objective": "", "remediation": {"steps": [{"teach": "Walker fit is set so the arms can **push down and extend** efficiently — the grip sits at the **wrist** level while the patient stands.", "stem": "Properly fitted, a walker handgrip sits at the level of the patient's:", "options": [{"letter": "A", "text": "Wrist"}, {"letter": "B", "text": "Hip"}, {"letter": "C", "text": "Elbow"}], "answer": "A", "explanation": "Grip at the wrist (ulnar styloid) level in standing.", "clarify": [{"teach": "The bony bump on the little-finger side of the wrist is the **ulnar styloid**.", "stem": "The wrist landmark used for walker fit is the:", "options": [{"letter": "A", "text": "Ulnar styloid"}, {"letter": "B", "text": "Olecranon"}], "answer": "A", "explanation": "The ulnar styloid is at the wrist; the olecranon is the elbow."}]}, {"teach": "A correct grip height produces a specific **elbow angle** that lets the shoulder depressors and elbow extensors work best.", "stem": "With the grip at the correct height, the elbow should be flexed about:", "options": [{"letter": "A", "text": "0° (fully straight)"}, {"letter": "B", "text": "20–30°"}, {"letter": "C", "text": "90°"}], "answer": "B", "explanation": "20–30° elbow flexion is the target."}, {"teach": "Devices come with printed height markings, but the lecture is explicit about **how** height should be set.", "stem": "How should walker height be determined?", "options": [{"letter": "A", "text": "Use the manufacturer's height markings"}, {"letter": "B", "text": "Measure on the patient and re-evaluate with gait"}, {"letter": "C", "text": "Set it to the patient's hip height"}], "answer": "B", "explanation": "You cannot use the device's height markings — measure, re-evaluate with gait, and teach sit-stand-sit."}], "checkpoints": [{"stem": "A walker set too low forces the patient to bend forward. Which consequence does the lecture attach to an improperly fit device?", "options": [{"letter": "A", "text": "Lower energy cost"}, {"letter": "B", "text": "More exertion, less function, less safety"}, {"letter": "C", "text": "Faster gait speed"}, {"letter": "D", "text": "No change in function"}], "answer": "B", "explanation": "Improper fit → more exertion, less function, less safety, because the UEs are doing some of the LEs' work."}, {"stem": "Which elbow angle corresponds to a correctly fit walker grip?", "options": [{"letter": "A", "text": "20–30° flexion"}, {"letter": "B", "text": "60–70° flexion"}, {"letter": "C", "text": "Full extension"}, {"letter": "D", "text": "90° flexion"}], "answer": "A", "explanation": "20–30° flexion with the grip at the ulnar styloid."}]}}, {"id": "5", "group": 4, "section": "ICF model", "topic": "ICF model", "skill": "Disease process", "multi": true, "stem": "Which of the following are levels of functioning described by the WHO ICF model?", "options": [{"letter": "A", "text": "Body structure and function"}, {"letter": "B", "text": "Activity"}, {"letter": "C", "text": "Participation"}, {"letter": "D", "text": "Medication"}, {"letter": "E", "text": "Prognosis"}], "answers": ["A", "B", "C"], "explanation": "The ICF's three levels are **body structure & function → activity → participation**, with environmental and personal contextual factors. Medication belongs to the 4Ms framework, not the ICF.", "objective": "", "remediation": {"steps": [{"teach": "The ICF describes functioning at the level of the **body part**, the **whole person**, and the **whole person in a social context**.", "stem": "Weakness, poor balance, and dizziness are problems at which ICF level?", "options": [{"letter": "A", "text": "Body structure and function (impairment)"}, {"letter": "B", "text": "Participation"}, {"letter": "C", "text": "Environmental factor"}], "answer": "A", "explanation": "These are impairments of body structure/function.", "clarify": [{"teach": "**Activity** = the whole person executing a task; **participation** = involvement in life situations.", "stem": "Difficulty climbing stairs is a problem of:", "options": [{"letter": "A", "text": "Activity"}, {"letter": "B", "text": "Participation"}], "answer": "A", "explanation": "Executing a task = activity limitation."}]}, {"teach": "The third level is about **involvement in life situations** — the social role the person cannot fill.", "stem": "'Unable to visit grandchildren in a 2-story house' is which ICF level?", "options": [{"letter": "A", "text": "Impairment"}, {"letter": "B", "text": "Activity limitation"}, {"letter": "C", "text": "Participation restriction"}], "answer": "C", "explanation": "A problem with involvement in a life situation is a participation restriction."}, {"teach": "**Medication** is one of the 4Ms of Age-Friendly care, not an ICF level; the ICF adds **contextual factors** (environmental and personal) rather than medications or prognosis.", "stem": "Which framework lists Medication as a component?", "options": [{"letter": "A", "text": "ICF model"}, {"letter": "B", "text": "4Ms framework"}, {"letter": "C", "text": "Stability ladder"}], "answer": "B", "explanation": "The 4Ms are What Matters, Medication, Mentation, Mobility."}], "checkpoints": [{"stem": "Social attitudes, architecture, climate, and terrain are classified in the ICF as:", "options": [{"letter": "A", "text": "Impairments"}, {"letter": "B", "text": "Environmental (external) contextual factors"}, {"letter": "C", "text": "Personal (internal) contextual factors"}, {"letter": "D", "text": "Participation restrictions"}], "answer": "B", "explanation": "Environmental factors are external: social attitudes, architecture, legal/social structures, climate, terrain."}, {"stem": "Spasticity after a CVA → which ICF level?", "options": [{"letter": "A", "text": "Impairment (body structure/function)"}, {"letter": "B", "text": "Activity limitation"}, {"letter": "C", "text": "Participation restriction"}, {"letter": "D", "text": "Personal factor"}], "answer": "A", "explanation": "Spasticity is a body-level impairment; 'unable to get up from the floor' is the activity limitation and 'loss of friendships' the participation restriction."}]}, "answer": "A,B,C"}, {"id": "6", "group": 5, "section": "Neuro rehab", "topic": "Steps of neuro rehab", "skill": "Disease process", "stem": "Task practice, gait training, and ADL retraining are the focus of which stage of stroke recovery?", "options": [{"letter": "A", "text": "Acute hospital"}, {"letter": "B", "text": "Early mobility"}, {"letter": "C", "text": "Intensive rehab"}, {"letter": "D", "text": "Outpatient / home"}, {"letter": "E", "text": "Community"}], "answer": "C", "explanation": "Stage 3, **intensive rehab**, is task practice, gait training, and ADL retraining. The five stages: acute hospital → early mobility → intensive rehab → outpatient/home → community.", "objective": "", "remediation": {"steps": [{"teach": "Stroke recovery is a **staged, iterative** process: first stabilize, then get the person moving in bed and transferring, then retrain real tasks, then move the work home, then into the community.", "stem": "Which stage comes first?", "options": [{"letter": "A", "text": "Acute hospital — medical stabilization, positioning, early screen"}, {"letter": "B", "text": "Community — participation and secondary prevention"}, {"letter": "C", "text": "Outpatient/home — caregiver training and equipment"}], "answer": "A", "explanation": "Stage 1 is the acute hospital: medical stabilization, positioning, early screening.", "clarify": [{"teach": "Rehab **begins once the patient is medically stable** and continues after discharge.", "stem": "When does rehab begin?", "options": [{"letter": "A", "text": "Once medically stable"}, {"letter": "B", "text": "Only after hospital discharge"}], "answer": "A", "explanation": "It begins once medically stable and continues after discharge."}]}, {"teach": "Stage 2 is about **bed mobility, sitting balance, and transfers**; the next stage moves to **practicing the actual tasks** of walking and self-care.", "stem": "Bed mobility, sitting balance, and transfers define which stage?", "options": [{"letter": "A", "text": "Early mobility"}, {"letter": "B", "text": "Intensive rehab"}, {"letter": "C", "text": "Community"}], "answer": "A", "explanation": "Early mobility = bed mobility, sitting balance, transfers; intensive rehab follows with task practice, gait training, ADL retraining."}, {"teach": "Stages 4 and 5 shift from the facility to **home goals, caregiver training, equipment** and then to **participation, roles, secondary prevention**.", "stem": "Caregiver training and equipment for home are the focus of:", "options": [{"letter": "A", "text": "Outpatient / home"}, {"letter": "B", "text": "Acute hospital"}, {"letter": "C", "text": "Community"}], "answer": "A", "explanation": "Stage 4 (outpatient/home) covers home goals, caregiver training, equipment; stage 5 (community) covers participation, roles, secondary prevention."}], "checkpoints": [{"stem": "In the PT 'protection to participation' progression, which step comes immediately after 'protect & position'?", "options": [{"letter": "A", "text": "Build endurance"}, {"letter": "B", "text": "Mobilize early"}, {"letter": "C", "text": "Retrain movement"}, {"letter": "D", "text": "Community mobility"}], "answer": "B", "explanation": "PT progression: protect & position → mobilize early → retrain movement → build endurance."}, {"stem": "A patient in intensive rehab develops a suspected DVT. According to the staged model, what may happen to the patient's progression?", "options": [{"letter": "A", "text": "It must restart from stage 1"}, {"letter": "B", "text": "It is unaffected"}, {"letter": "C", "text": "It may pause or step back"}, {"letter": "D", "text": "It skips to community"}], "answer": "C", "explanation": "Patients may move forward, pause, or step back depending on neuro recovery, cardiopulmonary tolerance, cognition, swallow safety, and home support."}]}}, {"id": "7", "group": 6, "section": "Rehab settings", "topic": "Home health rehabilitation", "skill": "Identification", "multi": true, "stem": "Which of the following statements about home health rehabilitation are correct?", "options": [{"letter": "A", "text": "The patient must be homebound"}, {"letter": "B", "text": "Care is delivered on an intermittent basis"}, {"letter": "C", "text": "Lack of transportation qualifies a patient"}, {"letter": "D", "text": "It can be combined with outpatient rehab at the same time"}, {"letter": "E", "text": "PT and OT can complete a home safety evaluation"}], "answers": ["A", "B", "E"], "explanation": "Home health requires the patient to be **homebound** (leaving home takes considerable, taxing effort) with **intermittent** care needs; PT/OT can do a **home safety evaluation**. **Lack of transportation does NOT qualify**, and home health **cannot** run at the same time as outpatient rehab.", "objective": "", "remediation": {"steps": [{"teach": "Home health has one defining eligibility word — the patient must be **homebound** — and the lecture defines it by **effort**, not by resources.", "stem": "'Homebound' means leaving home:", "options": [{"letter": "A", "text": "Requires considerable and taxing effort"}, {"letter": "B", "text": "Is impossible without a car"}, {"letter": "C", "text": "Happens less than once a week"}], "answer": "A", "explanation": "Homebound = leaving home requires considerable and taxing effort.", "clarify": [{"teach": "A patient who could physically get to a clinic but has **no ride** is not homebound.", "stem": "Does lack of transportation qualify a patient for home health?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "No — lack of transportation does not qualify; that patient goes to outpatient."}]}, {"teach": "Home health and outpatient are **alternatives**, not a package; the care is **intermittent**, typically 2–3×/week for about 4 weeks.", "stem": "Can a patient receive home health and outpatient rehab simultaneously?", "options": [{"letter": "A", "text": "Yes, if different disciplines"}, {"letter": "B", "text": "No"}, {"letter": "C", "text": "Only for stroke patients"}], "answer": "B", "explanation": "They cannot be received at the same time."}, {"teach": "Home health brings the therapists **into the house**, which lets them evaluate the actual environment.", "stem": "Which evaluation can PT and OT perform in home health that closes the hospital-to-real-life gap?", "options": [{"letter": "A", "text": "Home safety evaluation"}, {"letter": "B", "text": "Neuropsychological testing"}, {"letter": "C", "text": "Instrumental swallow study"}], "answer": "A", "explanation": "PT and OT can complete a home safety evaluation."}], "checkpoints": [{"stem": "Typical home health frequency and duration:", "options": [{"letter": "A", "text": "Daily for 30 days"}, {"letter": "B", "text": "2–3×/week for about 4 weeks"}, {"letter": "C", "text": "Once a month for 6 months"}, {"letter": "D", "text": "3 hours/day, 5 days/week"}], "answer": "B", "explanation": "Home health is typically 2–3×/week for ~4 weeks; outpatient is 2×/week for ~4 weeks."}, {"stem": "A patient needs PT but has no car and can leave home without taxing effort. Appropriate setting:", "options": [{"letter": "A", "text": "Home health"}, {"letter": "B", "text": "LTAC"}, {"letter": "C", "text": "Outpatient rehab"}, {"letter": "D", "text": "Subacute rehab"}], "answer": "C", "explanation": "Not homebound → outpatient; transportation is not provided and lack of it does not qualify for home health."}]}, "answer": "A,B,E"}, {"id": "8", "group": 7, "section": "Assistive devices", "topic": "Cane", "skill": "Counseling & prevention", "stem": "A patient with unilateral weakness after a CVA is using a straight cane. In which hand should the cane be held?", "options": [{"letter": "A", "text": "The hand on the affected side"}, {"letter": "B", "text": "The hand opposite the affected side"}, {"letter": "C", "text": "The dominant hand regardless of side"}, {"letter": "D", "text": "Alternating hands each step"}, {"letter": "E", "text": "Both hands on a two-handled cane"}], "answer": "B", "explanation": "A cane is held in the hand **opposite** the affected side (either side for general weakness/balance); the cane and the affected leg move forward together, then the unaffected leg.", "objective": "", "remediation": {"steps": [{"teach": "A cane works by **redirecting load** away from the impaired limb, so the arm that holds it is on the side that can share the weight while the weak leg is on the ground.", "stem": "Relative to the weak leg, the cane is held on the:", "options": [{"letter": "A", "text": "Same side"}, {"letter": "B", "text": "Opposite side"}], "answer": "B", "explanation": "Opposite hand to the affected side.", "clarify": [{"teach": "When there is **no single affected side** (general weakness or balance), the rule relaxes.", "stem": "For general weakness without a weak side, the cane may be held:", "options": [{"letter": "A", "text": "In either hand"}, {"letter": "B", "text": "Only in the dominant hand"}], "answer": "A", "explanation": "Either side for general weakness/balance deficit."}]}, {"teach": "The gait sequence for a cane pairs the device with the **weak** leg.", "stem": "Correct cane gait sequence:", "options": [{"letter": "A", "text": "Cane + affected leg together, then unaffected leg"}, {"letter": "B", "text": "Cane, then unaffected leg, then affected leg"}, {"letter": "C", "text": "Affected leg first, then cane + unaffected leg"}], "answer": "A", "explanation": "Cane and affected leg move forward together, then the unaffected leg."}], "checkpoints": [{"stem": "Which elbow angle indicates a correctly fitted cane?", "options": [{"letter": "A", "text": "0° (locked straight)"}, {"letter": "B", "text": "15–30° flexion"}, {"letter": "C", "text": "60° flexion"}, {"letter": "D", "text": "90° flexion"}], "answer": "B", "explanation": "Cane fit: elbow 15–30° flexion."}, {"stem": "Which weight-bearing orders permit a cane?", "options": [{"letter": "A", "text": "NWB and TTWB"}, {"letter": "B", "text": "PWB 50%"}, {"letter": "C", "text": "WBAT and FWB only"}, {"letter": "D", "text": "Any weight-bearing status"}], "answer": "C", "explanation": "Canes are only appropriate for WBAT/FWB; limited WB needs bilateral UE support."}]}}, {"id": "9", "group": 8, "section": "Rehab team", "topic": "Rehab team members", "skill": "Identification", "stem": "BADLs and IADLs, fine motor skills, visual-spatial deficits, and upper-extremity orthotics → Which rehab team member addresses these?", "options": [{"letter": "A", "text": "Physical therapist"}, {"letter": "B", "text": "Occupational therapist"}, {"letter": "C", "text": "Speech-language pathologist"}, {"letter": "D", "text": "Vocational therapist"}, {"letter": "E", "text": "Rehab nurse"}], "answer": "B", "explanation": "The **occupational therapist** owns BADLs/IADLs, fine motor, visual-spatial skills, sequencing/planning, UE orthotics, and UE strength/ROM. PT = gross motor, falls, mobility; SLP = communication, cognition, swallow.", "objective": "", "remediation": {"steps": [{"teach": "The two movement therapists split the body: one takes **gross motor and mobility**, the other takes **daily-living tasks and the hands/arms**.", "stem": "Which therapist focuses on self-care tasks such as dressing, bathing, and feeding?", "options": [{"letter": "A", "text": "Occupational therapist"}, {"letter": "B", "text": "Physical therapist"}, {"letter": "C", "text": "Speech-language pathologist"}], "answer": "A", "explanation": "OT = BADLs and IADLs.", "clarify": [{"teach": "**Gross motor function, fall-reduction education, and mobility** belong to PT.", "stem": "Gait training and fall-reduction education are done by:", "options": [{"letter": "A", "text": "Physical therapist"}, {"letter": "B", "text": "Occupational therapist"}], "answer": "A", "explanation": "PT handles gross motor function and fall reduction."}]}, {"teach": "Beyond ADLs, the same therapist evaluates how the patient **perceives space and sequences tasks** (e.g., neglect, putting shoes on before pants) and fits **arm/hand splints**.", "stem": "Who assesses unilateral neglect during real tasks and provides a resting hand splint?", "options": [{"letter": "A", "text": "Speech-language pathologist"}, {"letter": "B", "text": "Occupational therapist"}, {"letter": "C", "text": "Case manager"}], "answer": "B", "explanation": "OT addresses visual-spatial deficits and UE orthotics."}, {"teach": "**Communication, cognition, and swallow** are the third therapist's domain.", "stem": "Which team member evaluates swallowing and recommends adaptive communication devices?", "options": [{"letter": "A", "text": "Speech-language pathologist"}, {"letter": "B", "text": "Occupational therapist"}, {"letter": "C", "text": "Dietician"}], "answer": "A", "explanation": "SLP = communication, cognition, swallow, adaptive communication devices."}], "checkpoints": [{"stem": "Which clue would most specifically prompt a referral to OT for a visual-spatial deficit?", "options": [{"letter": "A", "text": "Wet, gurgly voice after swallowing"}, {"letter": "B", "text": "Missed food on one side of the plate"}, {"letter": "C", "text": "Inability to rise from a chair"}, {"letter": "D", "text": "Halting, effortful speech"}], "answer": "B", "explanation": "Missed food on one side of the plate and one-sided grooming are clues to unilateral neglect — an OT visual-spatial issue."}, {"stem": "Who performs work-skill evaluation and job placement?", "options": [{"letter": "A", "text": "Medical social worker"}, {"letter": "B", "text": "Occupational therapist"}, {"letter": "C", "text": "Vocational therapist"}, {"letter": "D", "text": "Case manager"}], "answer": "C", "explanation": "The vocational therapist (outpatient) handles work-skill evaluation and job placement."}]}}, {"id": "10", "group": 9, "section": "Neuro rehab", "topic": "4M model", "skill": "Disease process", "multi": true, "stem": "Which of the following are among the 4Ms of the Age-Friendly Health Systems framework?", "options": [{"letter": "A", "text": "What Matters"}, {"letter": "B", "text": "Mentation"}, {"letter": "C", "text": "Mobility"}, {"letter": "D", "text": "Malnutrition"}, {"letter": "E", "text": "Motivation"}], "answers": ["A", "B", "C"], "explanation": "The 4Ms are **What Matters, Medication, Mentation, Mobility** — what matters to the patient, their meds, their mind, and whether they can move.", "objective": "", "remediation": {"steps": [{"teach": "The 4Ms is the **Age-Friendly Care** lens for the older post-stroke patient: the patient's priorities, their **drugs**, their **mind**, and their **movement**.", "stem": "Which M refers to the patient's own goals and priorities?", "options": [{"letter": "A", "text": "What Matters"}, {"letter": "B", "text": "Mentation"}, {"letter": "C", "text": "Mobility"}], "answer": "A", "explanation": "What Matters = what matters to the patient.", "clarify": [{"teach": "**Mentation** is the 'mind' M — cognition and mental status.", "stem": "The M that stands for the patient's mind/cognition is:", "options": [{"letter": "A", "text": "Mentation"}, {"letter": "B", "text": "Medication"}], "answer": "A", "explanation": "Mentation = mind."}]}, {"teach": "Two options sound plausible but are **not** among the four: nutrition and motivation are not Ms in this framework.", "stem": "Which of these is one of the 4Ms?", "options": [{"letter": "A", "text": "Malnutrition"}, {"letter": "B", "text": "Medication"}, {"letter": "C", "text": "Motivation"}], "answer": "B", "explanation": "Medication is the fourth M; malnutrition and motivation are not part of the framework."}], "checkpoints": [{"stem": "The 4Ms framework was presented in the lecture as the opener for which perspective?", "options": [{"letter": "A", "text": "Assistive device selection"}, {"letter": "B", "text": "Age-Friendly Care for the older post-stroke patient"}, {"letter": "C", "text": "Home health eligibility"}, {"letter": "D", "text": "Weight-bearing classification"}], "answer": "B", "explanation": "It is the Age-Friendly Care lens for the older post-stroke patient."}, {"stem": "Which M is NOT part of the 4Ms framework?", "options": [{"letter": "A", "text": "Medication"}, {"letter": "B", "text": "Mobility"}, {"letter": "C", "text": "Mentation"}, {"letter": "D", "text": "Malnutrition"}], "answer": "D", "explanation": "The 4Ms are What Matters, Medication, Mentation, Mobility."}]}, "answer": "A,B,C"}, {"id": "11", "group": 10, "section": "Assistive devices", "topic": "Gait vs ambulation", "skill": "Disease process", "stem": "A patient has a normal gait pattern but cannot safely get from one place to another → The most likely limiting factor is:", "options": [{"letter": "A", "text": "Ataxia"}, {"letter": "B", "text": "Limited endurance"}, {"letter": "C", "text": "Spasticity"}, {"letter": "D", "text": "Apraxia"}, {"letter": "E", "text": "Unilateral neglect"}], "answer": "B", "explanation": "**Good gait but poor ambulation = limited endurance**; the reverse (poor gait but a functional ambulator) is the **ataxic** gait. Gait = pattern/mechanics; ambulation = functional, safe mobility from place to place.", "objective": "", "remediation": {"steps": [{"teach": "**Gait** describes the quality of walking (step length, stride, cadence, speed); **ambulation** describes whether the person can functionally and safely get somewhere.", "stem": "Step length, stride length, cadence, and speed describe:", "options": [{"letter": "A", "text": "Gait"}, {"letter": "B", "text": "Ambulation"}], "answer": "A", "explanation": "Those are gait parameters — the pattern and mechanics of walking.", "clarify": [{"teach": "**Ambulation** is about function and safety — moving from one place to another.", "stem": "'Can the patient safely get from the bed to the bathroom?' is a question about:", "options": [{"letter": "A", "text": "Ambulation"}, {"letter": "B", "text": "Gait"}], "answer": "A", "explanation": "Functional mobility from place to place = ambulation."}]}, {"teach": "The two can be mismatched. If the mechanics are fine but the person cannot cover the distance, the problem is **stamina**; if the mechanics are poor but the person gets around, think of a **coordination** disorder.", "stem": "Poor gait quality yet a functional ambulator is the classic picture of:", "options": [{"letter": "A", "text": "Limited endurance"}, {"letter": "B", "text": "Ataxic gait"}, {"letter": "C", "text": "Dysphagia"}], "answer": "B", "explanation": "Poor gait / functional ambulator = ataxic gait; good gait / poor ambulation = limited endurance."}], "checkpoints": [{"stem": "Which goal is NOT listed by the lecture for improving an abnormal gait?", "options": [{"letter": "A", "text": "Improve safety"}, {"letter": "B", "text": "Reduce energy expenditure"}, {"letter": "C", "text": "Prevent falls"}, {"letter": "D", "text": "Increase stride length to a normative value"}], "answer": "D", "explanation": "Goals: improve safety, increase independence, reduce energy expenditure, prevent falls — all gait patterns are unique to the individual."}, {"stem": "Which activity is a skilled PT/PTA intervention rather than simply assisting a patient to walk safely?", "options": [{"letter": "A", "text": "Ambulation"}, {"letter": "B", "text": "Gait training"}, {"letter": "C", "text": "Transferring"}, {"letter": "D", "text": "Positioning"}], "answer": "B", "explanation": "Ambulation = assisting walking/keeping safe; gait training = skilled intervention (gait analysis, devices, orthotics, exercise)."}]}}, {"id": "12", "group": 11, "section": "Assistive devices", "topic": "Gait vs ambulation", "skill": "Disease process", "stem": "In the normal gait cycle, what proportion is spent in the stance phase?", "options": [{"letter": "A", "text": "20%"}, {"letter": "B", "text": "40%"}, {"letter": "C", "text": "50%"}, {"letter": "D", "text": "60%"}, {"letter": "E", "text": "80%"}], "answer": "D", "explanation": "The gait cycle (heel strike to the next heel strike of the same foot) is **60% stance, 40% swing**, with two periods of double stance.", "objective": "", "remediation": {"steps": [{"teach": "A gait cycle runs from **heel strike to the next heel strike of the same foot**; the foot is on the ground for the **larger** share of it.", "stem": "During a gait cycle, the foot is on the ground (stance) for:", "options": [{"letter": "A", "text": "Less than half the cycle"}, {"letter": "B", "text": "More than half the cycle"}], "answer": "B", "explanation": "Stance is the majority of the cycle.", "clarify": [{"teach": "**Swing** is the time the foot is off the ground — the smaller share.", "stem": "Swing phase is about what fraction of the cycle?", "options": [{"letter": "A", "text": "40%"}, {"letter": "B", "text": "60%"}], "answer": "A", "explanation": "Swing 40%, stance 60%."}]}, {"teach": "The exact split and the number of **double-stance** periods are the testable numbers.", "stem": "How many periods of double stance occur in one gait cycle?", "options": [{"letter": "A", "text": "One"}, {"letter": "B", "text": "Two"}, {"letter": "C", "text": "Four"}], "answer": "B", "explanation": "Two periods of double stance per cycle."}], "checkpoints": [{"stem": "A gait cycle is defined as:", "options": [{"letter": "A", "text": "Heel strike of one foot to heel strike of the other"}, {"letter": "B", "text": "Heel strike to the next heel strike of the same foot"}, {"letter": "C", "text": "Toe-off to heel strike of the same foot"}, {"letter": "D", "text": "One full minute of walking"}], "answer": "B", "explanation": "Heel strike to next heel strike of the same foot."}, {"stem": "Swing phase makes up what share of the gait cycle?", "options": [{"letter": "A", "text": "20%"}, {"letter": "B", "text": "40%"}, {"letter": "C", "text": "60%"}, {"letter": "D", "text": "80%"}], "answer": "B", "explanation": "Swing 40%, stance 60%."}]}}, {"id": "13", "group": 12, "section": "Weight bearing", "topic": "Non-weight bearing (NWB)", "skill": "Identification", "stem": "The foot may rest on the floor for balance but no weight is placed through it → Weight-bearing status:", "options": [{"letter": "A", "text": "Non-weight bearing (NWB)"}, {"letter": "B", "text": "Toe-touch weight bearing (TTWB)"}, {"letter": "C", "text": "Partial weight bearing (PWB, 50%)"}, {"letter": "D", "text": "Weight bearing as tolerated (WBAT)"}, {"letter": "E", "text": "Full weight bearing (FWB, 100%)"}], "answer": "B", "explanation": "**TTWB/TDWB** — the foot may **rest** on the floor. NWB is 0% with feet and toes not touching the ground; PWB is a prescribed percentage (usually 50%); WBAT is as tolerated; FWB is 100%.", "objective": "", "remediation": {"steps": [{"teach": "Weight-bearing orders form a ladder from **no floor contact** up to **no restriction**; the lowest rung forbids the foot from touching the ground at all.", "stem": "Which status means the feet and toes do not touch the ground (0%)?", "options": [{"letter": "A", "text": "NWB"}, {"letter": "B", "text": "TTWB"}, {"letter": "C", "text": "PWB"}], "answer": "A", "explanation": "NWB = 0%, no floor contact.", "clarify": [{"teach": "The rung **just above** NWB allows the foot to touch but not bear weight.", "stem": "Which allows the foot to rest on the floor without bearing weight?", "options": [{"letter": "A", "text": "TTWB"}, {"letter": "B", "text": "NWB"}], "answer": "A", "explanation": "TTWB/TDWB — foot may rest on the floor."}]}, {"teach": "**PWB** is written as a **percentage** of body weight; **WBAT** lets the patient decide by tolerance; **FWB** means 100% with no restriction.", "stem": "'50% of body weight per order' describes:", "options": [{"letter": "A", "text": "PWB"}, {"letter": "B", "text": "WBAT"}, {"letter": "C", "text": "FWB"}], "answer": "A", "explanation": "PWB is prescribed as a percentage, usually 50%."}], "checkpoints": [{"stem": "'As much weight as the patient can tolerate' defines:", "options": [{"letter": "A", "text": "PWB"}, {"letter": "B", "text": "WBAT"}, {"letter": "C", "text": "TTWB"}, {"letter": "D", "text": "NWB"}], "answer": "B", "explanation": "WBAT = as tolerated; FWB = 100%, no restriction."}, {"stem": "Which three statuses together make up 'limited weight bearing'?", "options": [{"letter": "A", "text": "NWB, TTWB, PWB"}, {"letter": "B", "text": "PWB, WBAT, FWB"}, {"letter": "C", "text": "TTWB, WBAT, FWB"}, {"letter": "D", "text": "NWB, WBAT, FWB"}], "answer": "A", "explanation": "Limited WB = NWB/TTWB/PWB — these require bilateral UE support."}]}}, {"id": "14", "group": 12, "section": "Weight bearing", "topic": "Non-weight bearing (NWB)", "skill": "Management", "stem": "For a patient ordered TTWB on one leg, which assistive device is the most stable appropriate choice?", "options": [{"letter": "A", "text": "Straight cane"}, {"letter": "B", "text": "Large-base quad cane"}, {"letter": "C", "text": "Hemi-walker"}, {"letter": "D", "text": "Walker"}, {"letter": "E", "text": "Single axillary crutch"}], "answer": "D", "explanation": "TTWB is **limited weight bearing**, which requires **bilateral upper-extremity support** — parallel bars, walker, or crutches. The **walker** is the most stable; canes, hemi-walkers, and single crutches are unilateral devices allowed only for WBAT/FWB.", "objective": "", "remediation": {"steps": [{"teach": "Limited weight bearing means the device must take enough load that **both arms** have to help — a one-handed device cannot do that.", "stem": "Which group of devices provides bilateral upper-extremity support?", "options": [{"letter": "A", "text": "Parallel bars, walker, bilateral crutches"}, {"letter": "B", "text": "Straight cane, quad cane, hemi-walker"}], "answer": "A", "explanation": "Parallel bars, walkers, and bilateral crutches are the bilateral-support devices.", "clarify": [{"teach": "**Canes** redirect only a little load and are used with one hand.", "stem": "Is a cane appropriate for a patient ordered PWB 50%?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "No — PWB is limited WB; canes are only for WBAT/FWB."}]}, {"teach": "Among bilateral-support devices, one is the **most stable** and the other demands strength, balance, coordination, and cognition.", "stem": "Which bilateral-support device is the most stable choice?", "options": [{"letter": "A", "text": "Walker"}, {"letter": "B", "text": "Axillary crutches"}, {"letter": "C", "text": "Forearm crutches"}], "answer": "A", "explanation": "The walker is the most stable; crutches are harder to operate."}, {"teach": "A **hemi-walker** looks like a walker but is used with **one hand**, so it sits with the unilateral options.", "stem": "A hemi-walker is appropriate for which weight-bearing orders?", "options": [{"letter": "A", "text": "WBAT/FWB only"}, {"letter": "B", "text": "NWB and TTWB"}, {"letter": "C", "text": "Any status"}], "answer": "A", "explanation": "It is a unilateral device, so WBAT/FWB only."}], "checkpoints": [{"stem": "Which patient requirement makes axillary crutches a poor choice for a confused patient with limited WB?", "options": [{"letter": "A", "text": "Crutches cannot be used with limited WB"}, {"letter": "B", "text": "Crutches require intact cognition and coordination"}, {"letter": "C", "text": "Crutches have the highest energy cost"}, {"letter": "D", "text": "Crutches are only for long-term users"}], "answer": "B", "explanation": "Crutches need strength, balance, coordination, and cognition; a walker is preferred for cognitive deficits."}, {"stem": "A patient is WBAT and needs only mild support for an osteoarthritic knee. Which device is now permitted?", "options": [{"letter": "A", "text": "Straight cane"}, {"letter": "B", "text": "Parallel bars only"}, {"letter": "C", "text": "Bilateral axillary crutches only"}, {"letter": "D", "text": "No device is permitted"}], "answer": "A", "explanation": "WBAT/FWB opens the unilateral options — cane, single crutch, hemi-walker."}]}}, {"id": "15", "group": 13, "section": "Assistive devices", "topic": "Orthoses", "skill": "Identification", "multi": true, "stem": "Which of the following are lower-extremity orthoses named in the assistive devices lecture?", "options": [{"letter": "A", "text": "Foot orthosis (FO)"}, {"letter": "B", "text": "Ankle-foot orthosis (AFO)"}, {"letter": "C", "text": "Knee-ankle-foot orthosis (KAFO)"}, {"letter": "D", "text": "Resting hand splint"}, {"letter": "E", "text": "Plate guard"}], "answers": ["A", "B", "C"], "explanation": "The lecture's orthoses are **FO, AFO, and KAFO** — named by the joints they span. A resting hand splint is an upper-extremity splint from OT; a plate guard is a feeding aid.", "objective": "", "remediation": {"steps": [{"teach": "Orthosis names are built from the **joints they cross**, listed from top to bottom: knee, ankle, foot.", "stem": "An orthosis that spans the ankle and the foot is called:", "options": [{"letter": "A", "text": "FO"}, {"letter": "B", "text": "AFO"}, {"letter": "C", "text": "KAFO"}], "answer": "B", "explanation": "Ankle-foot orthosis = AFO.", "clarify": [{"teach": "Adding the **knee** adds a letter at the front.", "stem": "An orthosis spanning knee, ankle, and foot is a:", "options": [{"letter": "A", "text": "KAFO"}, {"letter": "B", "text": "AFO"}], "answer": "A", "explanation": "Knee-ankle-foot orthosis."}]}, {"teach": "The other two options are OT **adaptive equipment**, not lower-extremity orthoses: one is an **upper-extremity splint** that reduces contracture risk, the other is a **feeding aid**.", "stem": "A resting hand splint is best classified as:", "options": [{"letter": "A", "text": "A lower-extremity orthosis"}, {"letter": "B", "text": "An upper-extremity splint to reduce contracture risk"}, {"letter": "C", "text": "A dressing aid"}], "answer": "B", "explanation": "Resting hand splints are UE splints used by OT to reduce contracture risk."}, {"teach": "OT's adaptive equipment falls into dressing aids, **feeding aids**, splints/supports, and home tools.", "stem": "A plate guard belongs to which equipment category?", "options": [{"letter": "A", "text": "Feeding aids"}, {"letter": "B", "text": "Dressing aids"}, {"letter": "C", "text": "Home tools"}], "answer": "A", "explanation": "Feeding aids: built-up utensils, plate guards, non-slip mat, adaptive cup."}], "checkpoints": [{"stem": "Which of these is a dressing aid listed by the lecture?", "options": [{"letter": "A", "text": "Button hook"}, {"letter": "B", "text": "Plate guard"}, {"letter": "C", "text": "Grab bar"}, {"letter": "D", "text": "Arm trough"}], "answer": "A", "explanation": "Dressing aids: reacher, button hook, long-handled shoehorn, elastic laces."}, {"stem": "Which team member fits upper-extremity orthotics such as wrist and resting hand splints?", "options": [{"letter": "A", "text": "Physical therapist"}, {"letter": "B", "text": "Occupational therapist"}, {"letter": "C", "text": "Speech-language pathologist"}, {"letter": "D", "text": "Case manager"}], "answer": "B", "explanation": "UE orthotics are an OT responsibility."}]}, "answer": "A,B,C"}, {"id": "16", "group": 14, "section": "Assistive devices", "topic": "Monitoring a patient's device", "skill": "Management", "multi": true, "stem": "Which of the following are among the questions to ask when monitoring a patient's assistive device at follow-up?", "options": [{"letter": "A", "text": "Is the equipment in good condition?"}, {"letter": "B", "text": "Is the device at the appropriate height?"}, {"letter": "C", "text": "Can the patient demonstrate correct use?"}, {"letter": "D", "text": "Has there been any change in physical or mental abilities?"}, {"letter": "E", "text": "Do the device's factory height markings match the patient's height?"}], "answers": ["A", "B", "C", "D"], "explanation": "The five monitoring questions: **equipment in good condition? appropriate height? knows how to use it and demonstrates it? using it regularly? any change in physical or mental abilities?** Factory height markings are explicitly not to be trusted — measure on the patient.", "objective": "", "remediation": {"steps": [{"teach": "Device monitoring checks the **device itself** first: its physical state and whether it is still sized correctly.", "stem": "Which two device-centered checks open the monitoring list?", "options": [{"letter": "A", "text": "Condition and height"}, {"letter": "B", "text": "Brand and price"}, {"letter": "C", "text": "Color and weight"}], "answer": "A", "explanation": "Is it in good condition? Is it the appropriate height?", "clarify": [{"teach": "Forearm crutches, for example, should have **push buttons pressed in**, the leg rotated correctly, and the **tip inspected for wear**.", "stem": "Inspecting a crutch tip for wear addresses which monitoring question?", "options": [{"letter": "A", "text": "Equipment in good condition"}, {"letter": "B", "text": "Change in mental abilities"}], "answer": "A", "explanation": "Tip wear is a condition check."}]}, {"teach": "Next the list turns to the **patient's use**: knowing is not enough — they must **show** you, and they must actually be using it.", "stem": "Which is the correct form of the 'use' question?", "options": [{"letter": "A", "text": "Does the patient know how to use it and demonstrate it?"}, {"letter": "B", "text": "Does the patient own the instruction manual?"}, {"letter": "C", "text": "Did a family member buy it?"}], "answer": "A", "explanation": "Knows how to use it — and demonstrates it; plus, are they using it regularly?"}, {"teach": "Finally, the **patient changes over time** — the device that fit last year may no longer match today's abilities. Factory markings never substitute for measuring.", "stem": "Why are a device's factory height markings not a monitoring question?", "options": [{"letter": "A", "text": "Height must be measured on the patient, not read from markings"}, {"letter": "B", "text": "Markings are always accurate"}, {"letter": "C", "text": "Height does not matter for safety"}], "answer": "A", "explanation": "You cannot use the height markings — measure and re-evaluate with gait."}], "checkpoints": [{"stem": "At follow-up a long-time cane user now has new weakness never evaluated by PT. What does the lecture advise?", "options": [{"letter": "A", "text": "Continue the same cane"}, {"letter": "B", "text": "Refer to PT"}, {"letter": "C", "text": "Switch to a wheelchair"}, {"letter": "D", "text": "Add a second cane"}], "answer": "B", "explanation": "Neurologic weakness never seen by PT and any recent change in mobility/function are PT-referral indications."}, {"stem": "Which monitoring question is answered by asking 'Do you take it with you every time you walk?'", "options": [{"letter": "A", "text": "Is the equipment in good condition?"}, {"letter": "B", "text": "Is it the appropriate height?"}, {"letter": "C", "text": "Are they using it regularly?"}, {"letter": "D", "text": "Any change in abilities?"}], "answer": "C", "explanation": "Regular use is the fourth monitoring question."}]}, "answer": "A,B,C,D"}, {"id": "17", "group": 15, "section": "Assistive devices", "topic": "Wheelchair", "skill": "Identification", "multi": true, "stem": "Which of the following are wheelchair types shown in the assistive devices lecture?", "options": [{"letter": "A", "text": "Standard manual wheelchair"}, {"letter": "B", "text": "Power (tilt-in-space) wheelchair"}, {"letter": "C", "text": "Scooter"}, {"letter": "D", "text": "Rollator"}, {"letter": "E", "text": "Knee walker"}], "answers": ["A", "B", "C"], "explanation": "Wheelchair types shown: **standard manual, lightweight manual, power (tilt-in-space), sport manual, and scooters**. Rollators and knee walkers/scooters are **walker** variants.", "objective": "", "remediation": {"steps": [{"teach": "Wheelchairs come in **manual** versions (standard, lightweight, sport) and **powered** versions, plus scooters.", "stem": "Which is a manual wheelchair type from the lecture?", "options": [{"letter": "A", "text": "Lightweight manual"}, {"letter": "B", "text": "Rollator"}, {"letter": "C", "text": "Hemi-walker"}], "answer": "A", "explanation": "Standard, lightweight, and sport manual wheelchairs were shown.", "clarify": [{"teach": "The powered chair shown has a **tilt-in-space** feature.", "stem": "The power wheelchair pictured in the lecture is described as:", "options": [{"letter": "A", "text": "Tilt-in-space"}, {"letter": "B", "text": "Front-wheeled"}], "answer": "A", "explanation": "Power (tilt-in-space) wheelchair."}]}, {"teach": "**Walker** variants are a separate family: front-wheeled walker (FWW), rolling walker (RW), rollator, and knee walker/scooter.", "stem": "A rollator is a type of:", "options": [{"letter": "A", "text": "Wheelchair"}, {"letter": "B", "text": "Walker"}, {"letter": "C", "text": "Cane"}], "answer": "B", "explanation": "Rollators and knee walkers are walker variants, not wheelchairs."}], "checkpoints": [{"stem": "A patient arrives at clinic in a wheelchair. According to the lecture, this alone is an indication for:", "options": [{"letter": "A", "text": "LTAC admission"}, {"letter": "B", "text": "PT referral"}, {"letter": "C", "text": "A power wheelchair upgrade"}, {"letter": "D", "text": "Home health"}], "answer": "B", "explanation": "Arriving in a wheelchair is itself an indication for PT referral."}, {"stem": "Which team member orders a wheelchair as durable medical equipment?", "options": [{"letter": "A", "text": "Case manager"}, {"letter": "B", "text": "Chaplain"}, {"letter": "C", "text": "Dietician"}, {"letter": "D", "text": "Vocational therapist"}], "answer": "A", "explanation": "The case manager orders DME and coordinates discharge planning."}]}, "answer": "A,B,C"}, {"id": "18", "group": 16, "section": "Neuro rehab", "topic": "Home assessment", "skill": "Counseling & prevention", "multi": true, "stem": "Which of the following belong to the home-safety portion of a home assessment?", "options": [{"letter": "A", "text": "Entry steps and railings"}, {"letter": "B", "text": "Bathroom access and fall risks"}, {"letter": "C", "text": "Lighting, rugs, clutter, and pets"}, {"letter": "D", "text": "Bed height and transfer surfaces"}, {"letter": "E", "text": "Ability to tolerate 3 hours of therapy per day"}], "answers": ["A", "B", "C", "D"], "explanation": "Home safety items: **entry steps/railings, bathroom access & fall risks, lighting/rugs/clutter/pets, bed height & transfer surfaces**. Tolerating 3 h of therapy/day is an acute inpatient rehab admission criterion, not a home-safety item.", "objective": "", "remediation": {"steps": [{"teach": "The home assessment checks whether **function, environment, and support align** — it walks the path the patient will take from the front door to the bed and the bathroom.", "stem": "Which is a home-safety item from the lecture's list?", "options": [{"letter": "A", "text": "Entry steps and railings"}, {"letter": "B", "text": "Therapy tolerance in hours per day"}, {"letter": "C", "text": "Number of therapy disciplines"}], "answer": "A", "explanation": "Entry steps/railings is the first home-safety item.", "clarify": [{"teach": "Floor-level hazards — **lighting, rugs, clutter, pets** — are on the list because they cause falls.", "stem": "Are pets part of the home-safety checklist?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "Lighting, rugs, clutter, and pets are listed."}]}, {"teach": "Beyond safety, the assessment asks about **function in context** (toilet at night? prepare food? manage meds? call for help?) and **supports & equipment** (caregiver, device fit, grab bars, shower chair, raised toilet seat).", "stem": "'Can the patient toilet at night and call for help?' belongs to which part of the home assessment?", "options": [{"letter": "A", "text": "Function in context"}, {"letter": "B", "text": "Home safety"}, {"letter": "C", "text": "Supports & equipment"}], "answer": "A", "explanation": "Function in context: toilet at night, prepare food safely, manage meds, call for help."}, {"teach": "The wrong option is an **admission criterion for a facility**, not a feature of a home.", "stem": "'Tolerate 3 hours of therapy per day' is a criterion for:", "options": [{"letter": "A", "text": "Acute inpatient rehab"}, {"letter": "B", "text": "Home safety assessment"}, {"letter": "C", "text": "Outpatient rehab"}], "answer": "A", "explanation": "3 h/day is the acute inpatient rehab threshold."}], "checkpoints": [{"stem": "Which statement best captures the purpose of the home assessment?", "options": [{"letter": "A", "text": "Confirm the patient has a house"}, {"letter": "B", "text": "Check that function, environment, and support align and close the clinic-to-real-life gap"}, {"letter": "C", "text": "Determine insurance eligibility"}, {"letter": "D", "text": "Measure gait speed"}], "answer": "B", "explanation": "It checks whether function, environment, and support align — not just 'does the patient have a house' — and evaluates the gap between clinic performance and real-life conditions."}, {"stem": "Grab bars, a raised toilet seat, and a shower chair are categorized by the lecture as:", "options": [{"letter": "A", "text": "Feeding aids"}, {"letter": "B", "text": "Dressing aids"}, {"letter": "C", "text": "Home tools"}, {"letter": "D", "text": "Orthoses"}], "answer": "C", "explanation": "Home tools: grab bars, raised toilet seat, shower chair, bed rail."}]}, "answer": "A,B,C,D"}, {"id": "19", "group": 17, "section": "Rehab overview", "topic": "Specialty programs", "skill": "Identification", "stem": "LSVT BIG and LSVT LOUD, along with tango, boxing, and Nordic walking, are specialty rehab programs for which condition?", "options": [{"letter": "A", "text": "Multiple sclerosis"}, {"letter": "B", "text": "Traumatic brain injury"}, {"letter": "C", "text": "Parkinson disease"}, {"letter": "D", "text": "Spinal cord injury"}, {"letter": "E", "text": "Stroke"}], "answer": "C", "explanation": "**Parkinson disease** specialty programs: LSVT BIG and LOUD; tango, boxing, Nordic walking.", "objective": "", "remediation": {"steps": [{"teach": "The one specialty program named in the overview lecture targets a **progressive** movement disorder with amplitude-based exercise and voice training.", "stem": "Programs built around making movements and voice 'BIG' and 'LOUD' target:", "options": [{"letter": "A", "text": "Parkinson disease"}, {"letter": "B", "text": "Spinal cord injury"}, {"letter": "C", "text": "Anoxic brain injury"}], "answer": "A", "explanation": "LSVT BIG and LOUD are Parkinson programs.", "clarify": [{"teach": "Parkinson disease is on the lecture's list of **progressive** neurologic conditions.", "stem": "Parkinson disease is classified in neuro rehab as:", "options": [{"letter": "A", "text": "Progressive"}, {"letter": "B", "text": "Non-progressive"}], "answer": "A", "explanation": "Progressive: MS, Parkinson, ALS, Huntington, dementias, PLS."}]}, {"teach": "The same program list includes **recreational** formats.", "stem": "Which activity is listed as a Parkinson specialty program?", "options": [{"letter": "A", "text": "Nordic walking"}, {"letter": "B", "text": "Swimming"}, {"letter": "C", "text": "Yoga"}], "answer": "A", "explanation": "Tango, boxing, and Nordic walking are listed."}], "checkpoints": [{"stem": "Which condition is classified as NON-progressive in the neuro rehab lecture?", "options": [{"letter": "A", "text": "ALS"}, {"letter": "B", "text": "Huntington disease"}, {"letter": "C", "text": "Traumatic brain injury"}, {"letter": "D", "text": "Lewy body dementia"}], "answer": "C", "explanation": "Non-progressive: CVA, TBI, SCI, anoxic brain injury."}, {"stem": "Participation training (as opposed to activity training) includes which example?", "options": [{"letter": "A", "text": "Toileting"}, {"letter": "B", "text": "Transferring"}, {"letter": "C", "text": "Vocational rehab goals"}, {"letter": "D", "text": "Getting up from the floor"}], "answer": "C", "explanation": "Participation training = community outings, recreation, child/parent care, vocational goals; activity training = BADL/self-care."}]}}, {"id": "20", "group": 18, "section": "Assistive devices", "topic": "Axillary crutches", "skill": "Complications", "stem": "Numbness, tingling, and vascular symptoms in the arm after starting axillary crutches → Fit problem and mechanism:", "options": [{"letter": "A", "text": "Crutches too short → trunk flexion and poor posture"}, {"letter": "B", "text": "Crutches too tall → brachial plexus compression"}, {"letter": "C", "text": "Tips too narrow → ulnar nerve entrapment at the elbow"}, {"letter": "D", "text": "Handgrip too high → carpal tunnel compression"}, {"letter": "E", "text": "Forearm cuff too tight → radial nerve palsy"}], "answer": "B", "explanation": "Crutches that are **too tall** press into the axilla → **nerve and vessel damage in the brachial plexus**. Refit with 2–3 finger widths below the axilla and weight through the hands.", "objective": "", "remediation": {"steps": [{"teach": "Axillary crutches are fit with a **gap** below the armpit so the crutch top never bears load — weight must go through the **hands**.", "stem": "How much space should separate the crutch top from the axilla?", "options": [{"letter": "A", "text": "None — the pad rests in the axilla"}, {"letter": "B", "text": "2–3 finger widths"}, {"letter": "C", "text": "A full hand width"}], "answer": "B", "explanation": "2–3 finger widths below the axilla.", "clarify": [{"teach": "Where the body weight goes determines whether the axilla is compressed.", "stem": "With axillary crutches, body weight should go through the:", "options": [{"letter": "A", "text": "Hands"}, {"letter": "B", "text": "Axillae"}], "answer": "A", "explanation": "Weight goes through the hands."}]}, {"teach": "If the gap is lost because the crutch is **too long**, the structures that run through the axilla are compressed.", "stem": "Which structures are damaged when crutches are too tall?", "options": [{"letter": "A", "text": "Brachial plexus nerves and vessels"}, {"letter": "B", "text": "Patellar tendon"}, {"letter": "C", "text": "Achilles tendon"}], "answer": "A", "explanation": "Too tall → nerve and vessel damage in the brachial plexus."}], "checkpoints": [{"stem": "After a brachial-plexus-type complaint on crutches, the correct fix is to:", "options": [{"letter": "A", "text": "Lengthen the crutches"}, {"letter": "B", "text": "Refit to 2–3 finger widths below the axilla with weight through the hands"}, {"letter": "C", "text": "Switch to a straight cane"}, {"letter": "D", "text": "Pad the axillary top and continue"}], "answer": "B", "explanation": "Refit with proper axillary clearance; weight through the hands."}, {"stem": "How wide should the crutch tips be placed?", "options": [{"letter": "A", "text": "Together, touching"}, {"letter": "B", "text": "Slightly wider than shoulder width"}, {"letter": "C", "text": "Twice shoulder width"}, {"letter": "D", "text": "Directly under the hips"}], "answer": "B", "explanation": "Tips slightly wider than shoulder width."}]}}, {"id": "21", "group": 18, "section": "Assistive devices", "topic": "Axillary crutches", "skill": "Complications", "stem": "A crutch user flexes the trunk forward and shows poor posture while walking → Most likely fit error:", "options": [{"letter": "A", "text": "Crutches too tall"}, {"letter": "B", "text": "Tips too wide"}, {"letter": "C", "text": "Crutches too short"}, {"letter": "D", "text": "Handgrip too low"}, {"letter": "E", "text": "Axillary pad too soft"}], "answer": "C", "explanation": "Crutches that are **too short** are unstable and unsafe; the patient **flexes the trunk to lower the center of mass**,
