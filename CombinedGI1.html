uring potassium and magnesium in a suspected ileus?", "options": [{"letter": "A", "text": "Measure them only in patients receiving opioids"}, {"letter": "B", "text": "Measure them only once vomiting has occurred"}, {"letter": "C", "text": "Measure them only when the abdominal series is non-diagnostic"}, {"letter": "D", "text": "Measure them in every patient with a suspected ileus"}, {"letter": "E", "text": "Measure them only when the ileus persists beyond 72 hours"}], "answer": "D", "explanation": "Hypokalemia and hypomagnesemia are among the standard causes of a bowel that stops propelling, alongside peritonitis, ischemia, diabetic ketoacidosis, and hypothyroidism, and the treatment principle is to correct the underlying cause. They are cheap to measure, correctable, and often present even where another explanation is obvious."}]}, {"case": "CO-D1", "group": "CO-D", "section": "abdominal pain with a starved gut", "objective": "", "vignette_workup": "An 80-year-old woman in the intensive care unit develops severe, poorly localized abdominal pain over six hours, with nausea and one loose stool. She was admitted two days ago with urosepsis and hypotension and has been on norepinephrine since. She has end-stage renal disease on hemodialysis, hypertension, and known atherosclerosis with a prior carotid endarterectomy. Her temperature is 37.8°C (100.0°F), blood pressure is 104/58 mm Hg on norepinephrine, pulse is 112/min, respirations are 24/min, and oxygen saturation is 96% on 2 L by nasal cannula. Her abdomen is soft and only minimally tender despite the pain she reports, with hypoactive bowel sounds and no guarding, rebound, or rigidity. No bruit is heard.", "labs_workup": [["WBC", "17,800/mm³"], ["Hemoglobin / hematocrit", "9.4 g/dL / 28%"], ["Platelets", "210,000/mm³"], ["Lactate", "4.1 mmol/L"], ["Arterial blood gas", "pH 7.30, bicarbonate 17 mEq/L, PaCO₂ 34 mm Hg"], ["Sodium / potassium", "136 mEq/L / 5.4 mEq/L"], ["BUN / creatinine", "62 mg/dL / 5.8 mg/dL"]], "vignette_recog": "An 80-year-old woman in the intensive care unit develops severe, poorly localized abdominal pain over six hours, with nausea and one loose stool. She was admitted two days ago with urosepsis and hypotension and has been on norepinephrine since. She has end-stage renal disease on hemodialysis, hypertension, and known atherosclerosis with a prior carotid endarterectomy. Her temperature is 37.8°C (100.0°F), blood pressure is 104/58 mm Hg on norepinephrine, pulse is 112/min, respirations are 24/min, and oxygen saturation is 96% on 2 L by nasal cannula. Her abdomen is soft and only minimally tender despite the pain she reports, with hypoactive bowel sounds and no guarding, rebound, or rigidity.", "labs_recog": [["WBC", "17,800/mm³"], ["Hemoglobin / hematocrit", "9.4 g/dL / 28%"], ["Lactate", "4.1 mmol/L"], ["Arterial blood gas", "pH 7.30, bicarbonate 17 mEq/L, PaCO₂ 34 mm Hg"], ["BUN / creatinine", "62 mg/dL / 5.8 mg/dL"], ["CT angiography", "Patent superior mesenteric artery origin with diffuse narrowing of the distal branches and no discrete cutoff or filling defect; mid-jejunal wall thickening with diminished enhancement; no pneumatosis and no portal venous gas"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "B", "text": "Stool studies for enteric pathogens"}, {"letter": "C", "text": "CT angiography"}, {"letter": "D", "text": "Diagnostic laparotomy"}, {"letter": "E", "text": "Colonoscopy"}], "answer": "C", "explanation": "Pain out of proportion to a soft abdomen in a patient with vascular risk is mesenteric ischemia until proven otherwise, and the arterial phase is what shows the vessels. A routine contrast-enhanced study images the bowel wall but not the mesenteric circulation, and the reversal window is two to three hours, so the definitive study is the first one ordered."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Segmental wall thickening with thumbprinting at the splenic flexure, rectum spared"}, {"letter": "B", "text": "A non-enhancing bowel wall with pneumatosis and free fluid"}, {"letter": "C", "text": "An abrupt filling defect in the superior mesenteric artery with non-opacified branches"}, {"letter": "D", "text": "Localized sigmoid wall thickening with pericolonic fat stranding and diverticula"}, {"letter": "E", "text": "A patent superior mesenteric artery origin with diffuse distal branch narrowing"}], "answer": "E", "explanation": "In a low-flow state the vessels are open but underperfused, so the trunk fills normally while the small distal branches constrict and the bowel they supply enhances poorly. The absence of a discrete cutoff is what distinguishes this from an embolus, and the absence of pneumatosis places the injury short of transmural infarction."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Complications of bowel obstruction"}, {"letter": "B", "text": "Acute mesenteric ischemia"}, {"letter": "C", "text": "Nonocclusive ischemic bowel disease"}, {"letter": "D", "text": "Ischemic colitis"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "C", "explanation": "Sepsis, hypotension, and days of a vasoconstrictor infusion starve the gut without occluding anything, and the rising lactate with a metabolic acidosis signals that the injury has reached the bowel wall. Acute mesenteric ischemia is an embolic event with a discrete arterial cutoff, and ischemic colitis gives tenderness proportionate to the pain over the segment involved."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Complications of bowel obstruction"}, {"letter": "B", "text": "Ischemic colitis"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Diverticulitis"}, {"letter": "E", "text": "Nonocclusive ischemic bowel disease"}], "answer": "E", "explanation": "An open trunk with narrowed distal branches and poorly enhancing jejunum is hypoperfusion rather than occlusion, and the vasoconstrictor infusion is the mechanism. An embolus would show an abrupt filling defect, and ischemic colitis is a colonic disease that spares the rectum and presents with early maroon stools."}, {"key": "mgmt", "path": "both", "stem": "She has nonocclusive ischemic bowel disease from a low-flow state. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Ciprofloxacin and metronidazole with clear liquids"}, {"letter": "B", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}, {"letter": "C", "text": "Bowel rest, intravenous fluids, ciprofloxacin, and metronidazole"}, {"letter": "D", "text": "Withdrawal of vasoconstrictors with fluids, antibiotics, and heparin"}, {"letter": "E", "text": "Systemic heparin, antibiotics, and mesenteric revascularization"}], "answer": "D", "explanation": "The treatment is to restore perfusion, which means resuscitating the circulation and taking away the drug that is squeezing the mesenteric branches shut. Vasoconstrictors are part of the disease here rather than part of the treatment, and there is no occlusion to open, so revascularization has no target. Serial examinations and lactates follow, because improving pain in this setting can mean infarction rather than recovery."}, {"key": "escalate", "path": "both", "stem": "Despite resuscitation and withdrawal of the vasoconstrictors she deteriorates. Which of the following should be done next?", "options": [{"letter": "A", "text": "Continued supportive care with serial examinations and lactate measurement"}, {"letter": "B", "text": "Supportive care with targeted antibiotics"}, {"letter": "C", "text": "Ciprofloxacin and metronidazole with clear liquids"}, {"letter": "D", "text": "Bowel rest, intravenous fluids, ciprofloxacin, and metronidazole"}, {"letter": "E", "text": "Operative exploration with revascularization and resection of non-viable bowel"}], "answer": "E", "explanation": "Deterioration means the bowel is no longer salvageable by perfusion alone. Exploration allows the non-viable segments to be resected and the circulation to be restored by embolectomy, bypass, stent, or thrombolysis, and continuing medical therapy that has already failed spends the only window that matters."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to suspecting mesenteric ischemia in an older adult with abdominal pain?", "options": [{"letter": "A", "text": "Suspect it only when the pain has lasted longer than six hours"}, {"letter": "B", "text": "Suspect it only once peritoneal signs have developed"}, {"letter": "C", "text": "Suspect it in any patient whose pain outstrips a soft abdomen"}, {"letter": "D", "text": "Suspect it only in patients with atrial fibrillation"}, {"letter": "E", "text": "Suspect it only when the serum lactate is elevated"}], "answer": "C", "explanation": "By age 75 mesenteric ischemia causes abdominal pain more often than appendicitis does, and the exam is the discriminator: a benign abdomen alongside agonizing pain is the presentation. Peritonitis and a raised lactate mark transmural injury and arrive after the window for reversal has closed, so waiting for either is waiting too long."}]}, {"case": "CO-G2", "group": "CO-G", "section": "bright red blood per rectum", "objective": "", "vignette_workup": "A 34-year-old woman who is 32 weeks pregnant presents to the primary care clinic with three weeks of bright red blood streaking the stool and appearing on the toilet paper after every bowel movement, along with anal itching. She has no pain with or after defecation. She has been straining with hard stools since the second trimester and spends long stretches sitting on the toilet with her phone. She takes prenatal vitamins with iron and has had no prior anorectal disease. Her temperature is 36.8°C (98.2°F), blood pressure is 112/68 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 99% on room air. There is no external swelling and nothing is palpable on digital rectal examination; she has a small perianal skin tag.", "labs_workup": [["Hemoglobin / hematocrit", "11.2 g/dL / 34%"], ["MCV", "84 fL"], ["Ferritin", "22 ng/mL"]], "vignette_recog": "A 34-year-old woman who is 32 weeks pregnant presents to the primary care clinic with three weeks of bright red blood streaking the stool and appearing on the toilet paper after every bowel movement, along with anal itching. She has no pain with or after defecation. She has been straining with hard stools since the second trimester and spends long stretches sitting on the toilet with her phone. She takes prenatal vitamins with iron and has had no prior anorectal disease. Her temperature is 36.8°C (98.2°F), blood pressure is 112/68 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 99% on room air. There is no external swelling and nothing is palpable on digital rectal examination; she has a small perianal skin tag. Anoscopy is performed in the office.", "labs_recog": [["Hemoglobin / hematocrit", "11.2 g/dL / 34%"], ["MCV", "84 fL"], ["Ferritin", "22 ng/mL"], ["Anoscopy", "Engorged plexus above the dentate line that protrudes with straining and reduces spontaneously; nothing below the dentate line is thrombosed, and there is no fissure and no mass"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Colonoscopy"}, {"letter": "B", "text": "Inspection with gentle anal stretching"}, {"letter": "C", "text": "Perineal inspection while straining or squatting"}, {"letter": "D", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "E", "text": "Anoscopy"}], "answer": "E", "explanation": "Anoscopy is the study that sees the anal canal above the dentate line, which digital examination cannot reach and which is where painless bright red bleeding originates. It is done in the clinic in minutes, and it settles both whether the source is anorectal and which side of the dentate line it sits on."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "An engorged plexus above the dentate line that reduces spontaneously"}, {"letter": "B", "text": "A full-thickness rectal wall protruding with concentric stacked-coin folds"}, {"letter": "C", "text": "Multiple colonic diverticula without inflammation, sigmoid predominant, with a visible vessel"}, {"letter": "D", "text": "Segmental wall thickening with thumbprinting at the splenic flexure"}, {"letter": "E", "text": "A posterior midline crack with raised edges and a sentinel tag"}], "answer": "A", "explanation": "Straining and prolonged sitting raise pressure in the anal cushions and engorge them, and the gravid uterus adds to the venous congestion. Protrusion with straining that resolves without help defines grade II disease, and the location above the dentate line is why the bleeding is painless."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Internal hemorrhoids"}, {"letter": "B", "text": "Ischemic colitis"}, {"letter": "C", "text": "Rectal prolapse"}, {"letter": "D", "text": "Bleeding diverticulosis"}, {"letter": "E", "text": "Anal fissure"}], "answer": "A", "explanation": "Small-volume bright red bleeding with every bowel movement, itching, and no pain in a straining, pregnant patient is the classic anal cushion. Pain is not a feature unless something is thrombosed, incarcerated, or strangulated, and painful bleeding would point instead to a fissure."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ischemic colitis"}, {"letter": "B", "text": "Bleeding diverticulosis"}, {"letter": "C", "text": "Anal fissure"}, {"letter": "D", "text": "Rectal prolapse"}, {"letter": "E", "text": "Internal hemorrhoids"}], "answer": "E", "explanation": "The dentate line settles it: a plexus above it is internal disease, insensate and painless, and spontaneous reduction after protrusion makes it grade II. Prolapse presents as a full-thickness bowel wall with concentric folds rather than an engorged cushion."}, {"key": "mgmt", "path": "both", "stem": "She has grade II internal hemorrhoids. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Increased water and fiber with sitz baths and colonoscopy before any topical therapy"}, {"letter": "B", "text": "Increased water and fiber with sitz baths and a hydrocortisone suppository for six weeks"}, {"letter": "C", "text": "Increased water and fiber with sitz baths, stool softeners, and hemorrhoidectomy"}, {"letter": "D", "text": "Increased water and fiber with sitz baths, stool softeners, and topical astringents"}, {"letter": "E", "text": "Increased water and fiber with sitz baths and rubber band ligation at this visit"}], "answer": "D", "explanation": "Bulk, water, and softened stool take the straining away, and astringents such as zinc, witch hazel, and calamine settle the itching. A hydrocortisone preparation must not run past seven days because it thins the perianal mucosa, banding is for disease that has failed conservative therapy, colonoscopy is what rectal bleeding over 45 earns, and hemorrhoidectomy is reserved for incarcerated or strangulated disease."}, {"key": "escalate", "path": "both", "stem": "After several weeks of fiber, fluids, sitz baths, and stool softeners she continues to bleed with every bowel movement. Which of the following should be done next?", "options": [{"letter": "A", "text": "A high-fiber diet with increased fluids and exercise"}, {"letter": "B", "text": "Operative hemorrhoidectomy"}, {"letter": "C", "text": "Rubber band ligation"}, {"letter": "D", "text": "Manual reduction with surgical repair"}, {"letter": "E", "text": "Fiber, fluids, and sitz baths with stool softeners"}], "answer": "C", "explanation": "Refractory internal disease is treated in the office, and banding succeeds in 60 to 80% of grade II hemorrhoids. It can be done without anesthesia precisely because the tissue above the dentate line has visceral innervation; the same procedure applied below that line would be intolerable. Hemorrhoidectomy is an operation for irreducible or strangulated disease."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to colonoscopy in a patient with rectal bleeding?", "options": [{"letter": "A", "text": "Perform it only when the hemoglobin falls below 11 g/dL"}, {"letter": "B", "text": "Perform it in every patient with rectal bleeding"}, {"letter": "C", "text": "Perform it in every patient over 45 with rectal bleeding"}, {"letter": "D", "text": "Perform it only when the bleeding is painful"}, {"letter": "E", "text": "Perform it only after conservative therapy has failed"}], "answer": "C", "explanation": "Hemorrhoids are common enough that they are found in patients who also have a proximal lesion, so age drives the decision rather than how convincing the anoscopy looks. Below 45 with a typical painless picture and no red flag, the anoscopic finding is enough; above 45 the colon is examined regardless."}]}, {"case": "CO-H2", "group": "CO-H", "section": "a lump or protrusion at the perineum", "objective": "", "vignette_workup": "A 76-year-old woman presents to the primary care clinic with a painless mass that comes out of her anus when she strains and that she has pushed back by hand for six months. She has mucus discharge, a feeling of incomplete evacuation, constipation, occasional bright red spotting, and leakage of stool. She has had five vaginal deliveries and decades of chronic straining with constipation, and has had no prior pelvic or anorectal surgery. Her temperature is 36.8°C (98.2°F), blood pressure is 138/78 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. Nothing protrudes at rest. Digital rectal examination shows decreased sphincter tone, and there is a small superficial anterior rectal ulcer.", "labs_workup": [], "vignette_recog": "A 76-year-old woman presents to the primary care clinic with a painless mass that comes out of her anus when she strains and that she has pushed back by hand for six months. She has mucus discharge, a feeling of incomplete evacuation, constipation, occasional bright red spotting, and leakage of stool. She has had five vaginal deliveries and decades of chronic straining with constipation, and has had no prior pelvic or anorectal surgery. Her temperature is 36.8°C (98.2°F), blood pressure is 138/78 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. Nothing protrudes at rest. Digital rectal examination shows decreased sphincter tone, and there is a small superficial anterior rectal ulcer. She is asked to strain in the office for five minutes.", "labs_recog": [["Perineal examination during straining", "A mass protrudes through the anus with concentric stacked-coin mucosal folds and the full thickness of the wall palpable; no radial folds in separate bundles"], ["Defecography", "Complete rather than mucosal prolapse"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Inspection of the natal cleft"}, {"letter": "B", "text": "Anoscopy of the anal canal"}, {"letter": "C", "text": "Perineal inspection during straining"}, {"letter": "D", "text": "Inspection with gentle anal stretching"}, {"letter": "E", "text": "Anal manometry with anorectal ultrasound"}], "answer": "C", "explanation": "The diagnosis is clinical and depends on reproducing what the patient describes, so the examination is done while she strains or squats rather than lying still. A five-minute strain in the office brings out the protrusion when the history is convincing and the resting examination is not."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Chronically prolapsed irreducible cushions with radial folds in separate bundles"}, {"letter": "B", "text": "Pain felt internally on rectal examination with no external fluctuance"}, {"letter": "C", "text": "A fluctuant midline collection above the anus with a hair-bearing sinus"}, {"letter": "D", "text": "A full-thickness rectal wall protruding with concentric stacked-coin folds"}, {"letter": "E", "text": "A posterior midline crack with raised edges and a sentinel tag"}], "answer": "D", "explanation": "The fold pattern is the discriminator. Concentric circular rings with the whole thickness of the wall palpable mean the rectum itself has telescoped through the anus, whereas radial folds arranged in separate bundles are prolapsing internal hemorrhoids and short partial-thickness radial folds are mucosal prolapse alone."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "CT or MRI of the pelvis"}, {"letter": "B", "text": "Defecography"}, {"letter": "C", "text": "Flexible sigmoidoscopy"}, {"letter": "D", "text": "Anal manometry with anorectal ultrasound"}, {"letter": "E", "text": "Soft-tissue ultrasound"}], "answer": "B", "explanation": "Defecography images the rectum during evacuation and is what separates a complete, full-thickness prolapse from a mucosal one, which is the distinction that decides whether the treatment is reduction or an operation. Manometry is added because she is incontinent, but it characterizes the sphincter rather than the prolapse."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Grade IV hemorrhoids"}, {"letter": "B", "text": "Rectal prolapse"}, {"letter": "C", "text": "Anal fissure"}, {"letter": "D", "text": "Fecal incontinence"}, {"letter": "E", "text": "Pilonidal abscess"}], "answer": "B", "explanation": "An elderly multiparous woman with decades of straining who reduces a painless protrusion by hand, leaks stool, and has a low sphincter tone with an anterior rectal ulcer has the full-thickness bowel wall coming through the anus. Her incontinence is a consequence of the stretched sphincter rather than a separate diagnosis."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Pilonidal abscess"}, {"letter": "B", "text": "Grade IV hemorrhoids"}, {"letter": "C", "text": "Rectal prolapse"}, {"letter": "D", "text": "Anal fissure"}, {"letter": "E", "text": "Fecal incontinence"}], "answer": "C", "explanation": "Concentric stacked-coin folds with all four layers of the wall palpable, confirmed on defecography as complete rather than mucosal, is a full-thickness prolapse. Prolapsing hemorrhoids show radial folds in separate bundles, and an internal intussusception that never reaches the anal verge is occult prolapse rather than this."}, {"key": "mgmt", "path": "both", "stem": "She has a full-thickness rectal prolapse. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Surgical repair of the prolapse"}, {"letter": "B", "text": "Fiber and bowel training with bulking agents and loperamide"}, {"letter": "C", "text": "Fiber, fluids, and sitz baths with stool softeners"}, {"letter": "D", "text": "Operative hemorrhoidectomy"}, {"letter": "E", "text": "Manual reduction with pelvic floor exercises and biofeedback"}], "answer": "A", "explanation": "Full-thickness disease does not resolve with reduction and pelvic floor work, and it worsens progressively while it is being managed that way; reduction and biofeedback are adjuncts to an operation or the treatment of mucosal prolapse alone. Incarceration converts the problem into a surgical emergency rather than something to keep pushing back."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to colonoscopy in this patient?", "options": [{"letter": "A", "text": "Perform it only if the prolapse cannot be reduced"}, {"letter": "B", "text": "Perform it before any surgical repair is planned"}, {"letter": "C", "text": "Perform it to establish the cause of the protruding mass"}, {"letter": "D", "text": "Perform it only if the rectal ulcer bleeds"}, {"letter": "E", "text": "Perform it according to routine screening guidelines"}], "answer": "E", "explanation": "The diagnosis is made by looking at the perineum while the patient strains, and a scope adds nothing to it. Colonoscopy still happens on its usual screening schedule, but ordering one to explain a protruding rectal mass delays the examination and the operation that actually settle the problem."}]}, {"case": "PA-A4", "group": "PA-A", "section": "acute severe epigastric pain radiating to the back", "objective": "", "vignette_workup": "A 41-year-old woman presents to the emergency department with 10 hours of severe epigastric pain with nausea and vomiting. Her father and brother both have very high triglyceride levels. She has type 2 diabetes that has been poorly controlled, and she takes oral estradiol for premature ovarian insufficiency diagnosed at 38. Her temperature is 37.6°C (99.7°F), blood pressure is 132/84 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 97% on room air. Her body mass index is 34. She has epigastric tenderness without guarding or rebound, eruptive xanthomas over the extensor forearms and buttocks, and lipemia retinalis on fundoscopy. There is no jaundice.", "labs_workup": [["Lipase", "208 U/L (upper limit of normal 60)"], ["Glucose", "316 mg/dL"], ["Hemoglobin A1c", "10.4%"], ["Calcium", "8.6 mg/dL"], ["Sodium / magnesium", "136 mEq/L / 2.0 mg/dL"], ["Creatinine", "0.8 mg/dL"], ["AST / ALT", "30 U/L / 34 U/L"], ["Alkaline phosphatase / total bilirubin", "76 U/L / 0.7 mg/dL"]], "vignette_recog": "A 41-year-old woman presents to the emergency department with 10 hours of severe epigastric pain with nausea and vomiting. Her father and brother both have very high triglyceride levels. She has type 2 diabetes that has been poorly controlled, and she takes oral estradiol for premature ovarian insufficiency diagnosed at 38. Her temperature is 37.6°C (99.7°F), blood pressure is 132/84 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 97% on room air. Her body mass index is 34. She has epigastric tenderness without guarding or rebound, eruptive xanthomas over the extensor forearms and buttocks, and lipemia retinalis on fundoscopy. There is no jaundice.", "labs_recog": [["Triglycerides", "3,850 mg/dL, with grossly lipemic serum"], ["Lipase", "208 U/L (upper limit of normal 60)"], ["Glucose", "316 mg/dL"], ["Hemoglobin A1c", "10.4%"], ["Calcium", "8.6 mg/dL"], ["Sodium / magnesium", "136 mEq/L / 2.0 mg/dL"], ["AST / ALT", "30 U/L / 34 U/L"], ["Alkaline phosphatase / total bilirubin", "76 U/L / 0.7 mg/dL"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Plasma triglyceride level"}, {"letter": "B", "text": "Fecal elastase-1 with CT of the abdomen"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "E", "text": "Upright chest radiograph"}], "answer": "A", "explanation": "A lipase that is barely raised does not exclude pancreatitis; severe lipemia interferes with the assay and can drive the reported value falsely low. Xanthomas and lipemia retinalis point at the lipid panel, and the triglyceride level is the study that both makes the diagnosis and directs treatment. Ultrasound and CT answer questions about stones and necrosis, neither of which this presentation raises."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Pancreatic calcifications with parenchymal atrophy and a normal lipase"}, {"letter": "B", "text": "Non-enhancing pancreatic parenchyma with persistent leukocytosis"}, {"letter": "C", "text": "An ALT of 224 U/L with a bilirubin of 3.4 mg/dL and a 9 mm common bile duct"}, {"letter": "D", "text": "A magnesium of 1.2 mg/dL with a phosphorus of 1.8 mg/dL and no gallstones"}, {"letter": "E", "text": "Triglycerides of 3,850 mg/dL with grossly lipemic serum"}], "answer": "E", "explanation": "Chylomicrons in the serum scatter light and make the sample visibly milky, and lipase liberates free fatty acids from them inside the gland's own small vessels, where they are directly cytotoxic to acinar membranes and to the vessel lining. Estrogen, poorly controlled diabetes, and a familial lipid disorder are three pushes in the same direction."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gallstone (biliary) pancreatitis"}, {"letter": "B", "text": "Alcohol-induced acute pancreatitis"}, {"letter": "C", "text": "Hypertriglyceridemia-induced pancreatitis"}, {"letter": "D", "text": "Chronic pancreatitis with calcifications"}, {"letter": "E", "text": "Drug-induced acute pancreatitis"}], "answer": "C", "explanation": "This is the third most common cause of acute pancreatitis, after gallstones and alcohol, and risk climbs once the triglyceride level passes roughly 1,000 mg/dL. Normal liver enzymes and bilirubin argue against a biliary origin, and a normal magnesium with no drinking history argues against alcohol."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alcohol-induced acute pancreatitis"}, {"letter": "B", "text": "Chronic pancreatitis with calcifications"}, {"letter": "C", "text": "Hypertriglyceridemia-induced pancreatitis"}, {"letter": "D", "text": "Drug-induced acute pancreatitis"}, {"letter": "E", "text": "Gallstone (biliary) pancreatitis"}], "answer": "C", "explanation": "A triglyceride level far above 1,000 mg/dL with lipemic serum names the cause outright. The lipase is only modestly raised because severe lipemia interferes with the assay, which is why the triglyceride level and not the lipase carries the diagnosis here."}, {"key": "mgmt", "path": "both", "stem": "She has hypertriglyceridemia-induced pancreatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Intravenous fluids with cholecystectomy this admission, stopping her estradiol"}, {"letter": "B", "text": "Intravenous fluids with an insulin infusion and glucose, continuing her estradiol"}, {"letter": "C", "text": "Intravenous fluids with an insulin infusion and glucose, stopping her estradiol"}, {"letter": "D", "text": "Intravenous fluids with electrolyte repletion and withdrawal management, continuing her estradiol"}, {"letter": "E", "text": "Intravenous fluids with bowel rest alone, stopping her estradiol"}], "answer": "C", "explanation": "Insulin activates lipoprotein lipase and accelerates chylomicron clearance, which lowers the triglyceride level acutely; fluids and bowel rest are the supportive backbone. Estrogens raise triglycerides and cause pancreatitis by intravascular thrombosis, so the estradiol has to come out — leaving it in place is the error the case is built around."}, {"key": "escalate", "path": "both", "stem": "After 24 hours of intravenous fluids and an insulin infusion with glucose, her triglyceride level remains 3,850 mg/dL and her pain is unchanged. Which of the following should be done next?", "options": [{"letter": "A", "text": "Conservative supportive care with ICU-level monitoring"}, {"letter": "B", "text": "Alcohol and nicotine cessation with low-fat meals"}, {"letter": "C", "text": "Cholecystectomy during the same admission"}, {"letter": "D", "text": "Withdrawal management with electrolyte repletion"}, {"letter": "E", "text": "Plasmapheresis"}], "answer": "E", "explanation": "When insulin and fluids fail to bring the triglyceride level down in severe disease, plasmapheresis removes the chylomicrons directly. The alternatives listed treat other causes of pancreatitis and do nothing to a circulating lipid load."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to starting a fibrate in this patient?", "options": [{"letter": "A", "text": "Start a fibrate only once her diabetes is controlled"}, {"letter": "B", "text": "Start a fibrate only if her triglyceride level remains above 1,000 mg/dL"}, {"letter": "C", "text": "Start a fibrate only if dietary and lifestyle change fail"}, {"letter": "D", "text": "Start a fibrate as soon as she tolerates it, to prevent recurrence"}, {"letter": "E", "text": "Start a fibrate only after a second episode of pancreatitis"}], "answer": "D", "explanation": "Long-term risk tracks the triglyceride level, and the point of treatment is to keep her from coming back with the same attack. Waiting for a second episode, or for another intervention to fail first, leaves her above the threshold where pancreatitis happens."}]}, {"case": "PA-B2", "group": "PA-B", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "objective": "", "vignette_workup": "A 57-year-old man comes to the gastroenterology clinic seven weeks after discharge with three weeks of persistent and recurrent epigastric pain, early satiety, and vomiting after meals. He says he can feel a lump under his ribs. He was admitted for acute pancreatitis seven weeks ago and has had no fever since discharge. His temperature is 36.9°C (98.4°F), blood pressure is 126/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has epigastric fullness with a palpable, mildly tender mass and faint scleral icterus. There are no rigors and no flank bruising.", "labs_workup": [["CT abdomen with contrast", "Encapsulated fluid collection 8 cm in the lesser sac with a well-defined enhancing wall; minimal necrosis, and the pancreas enhances normally"], ["Total bilirubin / alkaline phosphatase", "2.1 mg/dL / 190 U/L"], ["WBC", "7,600/mm³"], ["Hemoglobin / hematocrit", "13.9 g/dL / 42%"], ["Lipase", "71 U/L"]], "vignette_recog": "A 57-year-old man comes to the gastroenterology clinic seven weeks after discharge with three weeks of persistent and recurrent epigastric pain, early satiety, and vomiting after meals. He says he can feel a lump under his ribs. He was admitted for acute pancreatitis seven weeks ago and has had no fever since discharge. His temperature is 36.9°C (98.4°F), blood pressure is 126/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has epigastric fullness with a palpable, mildly tender mass and faint scleral icterus. There are no rigors and no flank bruising. He undergoes further evaluation before any drainage is planned.", "labs_recog": [["CT abdomen with contrast", "Encapsulated fluid collection 8 cm in the lesser sac with a well-defined enhancing wall; minimal necrosis, and the pancreas enhances normally"], ["Total bilirubin / alkaline phosphatase", "2.1 mg/dL / 190 U/L"], ["WBC", "7,600/mm³"], ["Hemoglobin / hematocrit", "13.9 g/dL / 42%"], ["Lipase", "71 U/L"], ["Endoscopic ultrasound with fine-needle aspiration", "Benign fluid, no malignant cells"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Repeat contrast-enhanced CT of the abdomen at 5 to 7 days"}, {"letter": "B", "text": "Blood cultures with a repeat white cell count"}, {"letter": "C", "text": "Contrast-enhanced CT of the abdomen at 72 hours after onset"}, {"letter": "D", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "E", "text": "MRCP"}], "answer": "D", "explanation": "The imaging morphology is already settled by the contrast CT, so the question left open is what is inside the capsule. Fine-needle aspiration samples the fluid and is how a cystic neoplasm is excluded before anything is drained. Repeat cross-sectional imaging adds nothing the first study did not already show."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Benign fluid with no malignant cells"}, {"letter": "B", "text": "An enlarging non-enhancing pancreatic segment without gas"}, {"letter": "C", "text": "Necrotic debris within the collection"}, {"letter": "D", "text": "Mucinous or atypical cells in the aspirate"}, {"letter": "E", "text": "Growth of Escherichia coli or Klebsiella species"}], "answer": "A", "explanation": "A collection that follows a documented attack of pancreatitis by more than four weeks, sits behind a smooth enhancing wall, and contains almost no necrosis holds clear fluid rather than tumour or pus. Atypical cells would point to a neoplasm and organisms to an infected collection, neither of which fits an afebrile patient with a normal white count."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Walled-off necrosis"}, {"letter": "B", "text": "Pancreatic pseudocyst"}, {"letter": "C", "text": "Acute necrotic collection"}, {"letter": "D", "text": "Infected pancreatic necrosis"}, {"letter": "E", "text": "Acute peripancreatic fluid collection"}], "answer": "B", "explanation": "Four categories separate on two axes — whether there is a mature wall and whether the contents are clear fluid or necrotic debris. A well-defined enhancing wall around clear fluid at seven weeks is a pseudocyst; an acute peripancreatic fluid collection has no wall, and walled-off necrosis has a wall around debris."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Walled-off necrosis"}, {"letter": "B", "text": "Infected pancreatic necrosis"}, {"letter": "C", "text": "Acute peripancreatic fluid collection"}, {"letter": "D", "text": "Pancreatic pseudocyst"}, {"letter": "E", "text": "Acute necrotic collection"}], "answer": "D", "explanation": "A mature enhancing wall around fluid that samples as benign, more than four weeks after an attack, is a pseudocyst. The wall is a non-epithelialized capsule of fibrin and granulation tissue, which is why the lesion is a \"pseudo\" cyst and why it takes about four weeks to appear."}, {"key": "mgmt", "path": "both", "stem": "He has a pancreatic pseudocyst. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Endoscopic transmural drainage with necrosectomy"}, {"letter": "B", "text": "Endoscopic drainage of the collection"}, {"letter": "C", "text": "Imipenem-cilastatin with ICU-level monitoring"}, {"letter": "D", "text": "Observation only, with no drainage and no antibiotics"}, {"letter": "E", "text": "Supportive care with drainage deferred"}], "answer": "B", "explanation": "An 8 cm collection producing pain, early satiety, and mild jaundice by mass effect on the stomach and bile duct is large and symptomatic, which is the indication for drainage. The endoscopic route is preferred over percutaneous or surgical. Necrosectomy belongs to collections that actually contain necrotic tissue."}, {"key": "escalate", "path": "both", "stem": "Endoscopic drainage is attempted, but the collection cannot be accessed transmurally. Which of the following should be done next?", "options": [{"letter": "A", "text": "Observation only, with no drainage and no antibiotics"}, {"letter": "B", "text": "Supportive care with drainage deferred"}, {"letter": "C", "text": "Imipenem-cilastatin with continued ICU care"}, {"letter": "D", "text": "Percutaneous or surgical drainage of the collection"}, {"letter": "E", "text": "Surgical resection with surveillance by cyst type"}], "answer": "D", "explanation": "Endoscopic drainage is preferred, not exclusive; when it fails or is not feasible, the percutaneous and surgical routes remain. Antibiotics treat an infected collection, and this one is sterile with a normal white count and no fever."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to draining a pancreatic pseudocyst?", "options": [{"letter": "A", "text": "Drain a pseudocyst only when aspiration shows malignant cells"}, {"letter": "B", "text": "Drain a pseudocyst only after four weeks have passed since the attack"}, {"letter": "C", "text": "Drain a pseudocyst only when it is large or symptomatic"}, {"letter": "D", "text": "Drain a pseudocyst only when the bilirubin is rising"}, {"letter": "E", "text": "Drain every pseudocyst once a mature wall has formed"}], "answer": "C", "explanation": "Small pseudocysts under 5 cm that cause no symptoms are observed, and many of them resolve over months. Wall maturity and the four-week interval describe when a pseudocyst can be recognized and safely drained, not when it needs to be."}]}, {"case": "GA-B1", "group": "GA-B", "section": "ulcer disease that has escaped control", "objective": "", "vignette_workup": "A 68-year-old man is brought to the emergency department after two episodes of coffee-ground emesis this morning and three days of black tarry stools. He feels lightheaded when he stands. A duodenal ulcer was found two years ago and he stopped his pantoprazole once the pain settled. He takes naproxen for back pain and apixaban for atrial fibrillation. His temperature is 36.6°C (97.9°F), blood pressure is 96/58 mm Hg, pulse is 118/min, respirations are 20/min, and oxygen saturation is 97% on room air. He has pallor and cool extremities with mild epigastric tenderness. The abdomen is soft with no rebound, guarding, or rigidity, and rectal examination shows melena.", "labs_workup": [["INR", "1.3"], ["Type and crossmatch", "Sent"]], "vignette_recog": "A 68-year-old man is brought to the emergency department after two episodes of coffee-ground emesis this morning and three days of black tarry stools. He feels lightheaded when he stands. A duodenal ulcer was found two years ago and he stopped his pantoprazole once the pain settled. He takes naproxen for back pain and apixaban for atrial fibrillation. His temperature is 36.6°C (97.9°F), blood pressure is 96/58 mm Hg, pulse is 118/min, respirations are 20/min, and oxygen saturation is 97% on room air. He has pallor and cool extremities with mild epigastric tenderness. The abdomen is soft with no rebound, guarding, or rigidity, and rectal examination shows melena. He is resuscitated and taken for endoscopy within 24 hours.", "labs_recog": [["Hemoglobin / hematocrit", "7.6 g/dL / 23%"], ["MCV", "84 fL"], ["Platelets", "210,000/mm³"], ["BUN / creatinine", "44 mg/dL / 1.1 mg/dL"], ["INR", "1.3"], ["Upright chest radiograph", "No free air under the diaphragm"], ["Upper endoscopy", "Duodenal bulb ulcer with a non-bleeding visible vessel"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Intravenous secretin stimulation test"}, {"letter": "B", "text": "Upper endoscopy with gastric biopsy"}, {"letter": "C", "text": "Helicobacter pylori stool antigen with a complete blood count"}, {"letter": "D", "text": "Complete blood count and metabolic panel with an upright chest radiograph"}, {"letter": "E", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}], "answer": "D", "explanation": "The immediate questions are how much blood has been lost and whether the ulcer has perforated, and a blood count, a metabolic panel, and an upright film answer both within minutes. Endoscopy follows once he is resuscitated. A gastrin level drawn on an acid-suppressed, actively bleeding patient is uninterpretable."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Hemoglobin 7.6 g/dL with a BUN:creatinine ratio of 40 and no free air"}, {"letter": "B", "text": "A normal hemoglobin with a negative stool antigen test"}, {"letter": "C", "text": "Hypokalemic, hypochloremic metabolic alkalosis"}, {"letter": "D", "text": "Fasting gastrin of 1,480 pg/mL with a gastric pH of 1.6"}, {"letter": "E", "text": "Iron deficiency anemia with a positive fecal occult blood test"}], "answer": "A", "explanation": "Blood in the small bowel is digested and absorbed as protein, so urea rises while the creatinine stays put; a ratio near 40 with a falling hemoglobin is the signature of an upper source. The absence of free air is what separates a bleeding ulcer from a perforated one."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Zollinger-Ellison syndrome"}, {"letter": "B", "text": "NSAID-induced gastritis"}, {"letter": "C", "text": "Bleeding peptic ulcer"}, {"letter": "D", "text": "Gastric outlet obstruction"}, {"letter": "E", "text": "Esophageal variceal hemorrhage"}], "answer": "C", "explanation": "Bleeding is the most common complication of peptic ulcer disease, and a known ulcer, a withdrawn proton pump inhibitor, an NSAID, and an anticoagulant are four reasons for this one to bleed. Varices would come with stigmata of chronic liver disease, and gastric outlet obstruction produces vomiting of undigested food rather than blood."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Esophageal variceal hemorrhage"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "NSAID-induced gastritis"}, {"letter": "D", "text": "Zollinger-Ellison syndrome"}, {"letter": "E", "text": "Bleeding peptic ulcer"}], "answer": "E", "explanation": "A single duodenal bulb ulcer with a non-bleeding visible vessel is the bleeding lesion, and the BUN:creatinine ratio of 40 confirms the source is upper. Gastritis gives erosions without a crater, and Zollinger-Ellison syndrome produces multiple refractory distal ulcers with diarrhea."}, {"key": "mgmt", "path": "both", "stem": "He has a bleeding peptic ulcer. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Oral proton pump inhibitor therapy with endoscopy within 24 hours, transfusing him now"}, {"letter": "B", "text": "Intravenous proton pump inhibitor bolus and infusion with endoscopy within 24 hours, transfusing platelets before the procedure"}, {"letter": "C", "text": "Intravenous proton pump inhibitor bolus and infusion with emergent laparotomy, transfusing him now"}, {"letter": "D", "text": "Intravenous proton pump inhibitor bolus and infusion with endoscopy within 24 hours, withholding transfusion until the hemoglobin falls below 7 g/dL"}, {"letter": "E", "text": "Intravenous proton pump inhibitor bolus and infusion with endoscopy within 24 hours, transfusing him now"}], "answer": "E", "explanation": "A clot will not hold unless gastric pH is above 6, which needs an 80 mg intravenous bolus followed by an infusion rather than an oral agent. The usual transfusion threshold is a hemoglobin below 7, but it rises to 9 in a patient who is unstable or elderly, and he is both. Platelets are corrected only below 50,000, and his abdomen is soft, so there is nothing for a laparotomy to repair."}, {"key": "escalate", "path": "both", "stem": "He rebleeds after endoscopic clipping and cautery, and a second endoscopic attempt fails to achieve hemostasis. Which of the following should be done next?", "options": [{"letter": "A", "text": "Angiographic embolization or surgical repair"}, {"letter": "B", "text": "Proton pump inhibitor therapy for 8 weeks with withdrawal of naproxen"}, {"letter": "C", "text": "High-dose proton pump inhibitor with resection of a gastrinoma"}, {"letter": "D", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}, {"letter": "E", "text": "A vasoactive infusion with endoscopic band ligation"}], "answer": "A", "explanation": "Two failed endoscopic attempts is the point at which the bleeding is called refractory and the vessel is dealt with from outside the lumen, by interventional radiology or by the surgeon. Acid suppression and NSAID withdrawal are for after hemostasis, not instead of it."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to endoscopic hemostatic therapy in peptic ulcer bleeding?", "options": [{"letter": "A", "text": "Treat ulcers with active bleeding, a visible vessel, or an adherent clot"}, {"letter": "B", "text": "Treat every ulcer identified at endoscopy"}, {"letter": "C", "text": "Treat only ulcers that are bleeding at the time of endoscopy"}, {"letter": "D", "text": "Treat only ulcers in patients whose hemoglobin is below 7 g/dL"}, {"letter": "E", "text": "Treat only ulcers in patients taking an anticoagulant"}], "answer": "A", "explanation": "Those three stigmata predict rebleeding — up to 43% with a visible vessel, against roughly 5% for a clean-based ulcer, which needs no therapy at all. Restricting therapy to lesions bleeding at the moment of the look leaves the highest-risk ulcers untreated."}]}, {"case": "LI-A2", "group": "LI-A", "section": "the scarred liver, recognized at three stages", "objective": "", "vignette_workup": "A 45-year-old man is seen in the primary care clinic after a low platelet count turned up on a pre-operative complete blood count before knee surgery. He has no symptoms apart from mild fatigue, and has never had ascites, a variceal bleed, confusion, or jaundice. He acquired hepatitis C in his twenties and was never treated, and he drinks rarely. His temperature is 36.7°C (98.1°F), blood pressure is 124/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has two spider angiomata on the upper chest and a palpable spleen tip. There is no ascites, no asterixis, and no jaundice.", "labs_workup": [["Platelets", "128,000/mm³"], ["Albumin / INR", "4.0 g/dL / 1.0"], ["Total bilirubin", "0.9 mg/dL"], ["AST / ALT", "54 U/L / 61 U/L"], ["Liver ultrasound", "Coarse echotexture with a nodular surface, spleen 14 cm, no ascites"], ["FIB-4", "2.4 (indeterminate, between 1.45 and 3.25)"]], "vignette_recog": "A 45-year-old man is seen in the primary care clinic after a low platelet count turned up on a pre-operative complete blood count before knee surgery. He has no symptoms apart from mild fatigue, and has never had ascites, a variceal bleed, confusion, or jaundice. He acquired hepatitis C in his twenties and was never treated, and he drinks rarely. His temperature is 36.7°C (98.1°F), blood pressure is 124/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has two spider angiomata on the upper chest and a palpable spleen tip. There is no ascites, no asterixis, and no jaundice.", "labs_recog": [["Platelets", "128,000/mm³"], ["Albumin / INR", "4.0 g/dL / 1.0"], ["Total bilirubin", "0.9 mg/dL"], ["AST / ALT", "54 U/L / 61 U/L"], ["Liver ultrasound", "Coarse echotexture with a nodular surface, spleen 14 cm, no ascites"], ["FIB-4", "2.4 (indeterminate, between 1.45 and 3.25)"], ["Transient elastography", "16.4 kPa, corresponding to stage F4"], ["Screening upper endoscopy", "Small esophageal varices without red wale signs"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Serum ceruloplasmin"}, {"letter": "B", "text": "Percutaneous liver biopsy"}, {"letter": "C", "text": "Diagnostic paracentesis"}, {"letter": "D", "text": "Serum transferrin saturation"}, {"letter": "E", "text": "Transient elastography"}], "answer": "E", "explanation": "Noninvasive fibrosis scores perform best at the extremes, and a FIB-4 of 2.4 sits in the indeterminate band where the score cannot decide. Elastography is the study built for exactly that gap, and it answers the question without a needle. There is no ascites to tap."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Hepatic steatosis with an ALT of 96 U/L and an AST of 58 U/L"}, {"letter": "B", "text": "Regenerative nodules surrounded by fibrous bands on biopsy"}, {"letter": "C", "text": "Liver stiffness of 16.4 kPa, corresponding to stage F4 fibrosis"}, {"letter": "D", "text": "An AST-to-ALT ratio of 2.5 with a GGT of 310 U/L"}, {"letter": "E", "text": "An ascitic fluid PMN count of 180/mm³ with a SAAG of 1.8 g/dL"}], "answer": "C", "explanation": "A nodular surface, a 14 cm spleen, and a platelet count under 150,000 already describe an architecturally scarred liver with portal hypertension; the stiffness measurement puts a stage on it. Untreated hepatitis C acquired decades ago is enough time to reach F4."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alcohol-related fatty liver disease"}, {"letter": "B", "text": "Cirrhosis with impaired synthetic function"}, {"letter": "C", "text": "Metabolic dysfunction-associated steatotic liver disease"}, {"letter": "D", "text": "Decompensated cirrhosis"}, {"letter": "E", "text": "Compensated cirrhosis"}], "answer": "E", "explanation": "Compensation is defined by what has not happened — no ascites, no variceal bleed, no encephalopathy, no jaundice — in a patient whose liver is already cirrhotic. A normal albumin, INR, and bilirubin say the synthetic machinery is still keeping up."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cirrhosis with impaired synthetic function"}, {"letter": "B", "text": "Decompensated cirrhosis"}, {"letter": "C", "text": "Alcohol-related fatty liver disease"}, {"letter": "D", "text": "Metabolic dysfunction-associated steatotic liver disease"}, {"letter": "E", "text": "Compensated cirrhosis"}], "answer": "E", "explanation": "Stage F4 stiffness with small varices establishes cirrhosis with portal hypertension, and the preserved albumin, INR, and bilirubin with no decompensating event to date place him in the compensated stage. Platelets under 150,000 are often the first sign of all this in a patient who feels entirely well."}, {"key": "mgmt", "path": "both", "stem": "He has compensated cirrhosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with transplant referral"}, {"letter": "B", "text": "Alcohol abstinence with vaccination and six-month imaging"}, {"letter": "C", "text": "Naltrexone 50 mg daily with abstinence counseling"}, {"letter": "D", "text": "Diet and exercise aiming at 10% body-weight loss"}, {"letter": "E", "text": "A direct-acting antiviral course with vaccination"}], "answer": "E", "explanation": "Management is aimed at the cause, and his cause is a curable virus, so an antiviral course goes alongside the vaccinations every cirrhotic receives. Abstinence with naltrexone treats the alcohol-related liver, weight loss the metabolic one, and sodium restriction with transplant referral belongs to decompensated disease."}, {"key": "escalate", "path": "both", "stem": "He has compensated cirrhosis, and screening endoscopy shows small esophageal varices without red wale signs. Which of the following should be added?", "options": [{"letter": "A", "text": "Alcohol abstinence with vaccination and six-month imaging"}, {"letter": "B", "text": "A non-selective beta blocker"}, {"letter": "C", "text": "Naltrexone 50 mg daily with abstinence counseling"}, {"letter": "D", "text": "Sodium restriction with transplant referral"}, {"letter": "E", "text": "Diet and exercise aiming at 10% body-weight loss"}], "answer": "B", "explanation": "Once varices exist, lowering portal venous inflow with a non-selective beta blocker is the intervention that keeps them from bleeding. Vaccination and surveillance imaging are already part of his baseline care, and sodium restriction with transplant referral belongs to decompensated disease."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to hepatocellular carcinoma surveillance in this patient?", "options": [{"letter": "A", "text": "Liver imaging every 6 months, only if his FIB-4 exceeds 3.25"}, {"letter": "B", "text": "Liver imaging every 6 months, beginning now"}, {"letter": "C", "text": "Liver imaging every 6 months, only after a decompensating event"}, {"letter": "D", "text": "Liver imaging every 6 months, beginning once his hepatitis C is cured"}, {"letter": "E", "text": "Liver imaging every 2 to 3 years, at the interval used for endoscopy"}], "answer": "B", "explanation": "Surveillance is triggered by cirrhosis itself, and he already has stage F4 disease. Curing the hepatitis C removes the driver but not the scarred liver, and waiting for decompensation means waiting past the window in which a small tumour is curable. Endoscopy runs on a different clock, every 2 to 3 years."}]}, {"case": "LI-D3", "group": "LI-D", "section": "the acute deterioration: confusion or bleeding", "objective": "", "vignette_workup": "A 29-year-old woman is brought to the emergency department with five days of nausea, vomiting, and deepening jaundice. She has been confused since this morning, and her gums bleed when she brushes her teeth. She was previously healthy with no liver disease, drinks no alcohol, and has started no new prescription medication, herbal product, or supplement. She denies acetaminophen and has not foraged mushrooms. Her temperature is 37.1°C (98.8°F), blood pressure is 96/58 mm Hg, pulse is 110/min, respirations are 22/min, and oxygen saturation is 97% on room air. She has asterixis with grade II encephalopathy and deep jaundice. There are no spider angiomata, no palmar erythema, no splenomegaly, and no ascites.", "labs_workup": [["Total bilirubin", "18 mg/dL"], ["AST / ALT", "2,400 U/L / 3,100 U/L"], ["Ammonia", "168 µmol/L"], ["Acetaminophen level", "Undetectable"], ["Viral serologies", "Hepatitis A IgM, hepatitis B surface antigen and core IgM, and hepatitis C RNA all negative"], ["ANA / anti-smooth muscle antibody", "Negative, with a normal IgG"], ["Doppler ultrasound of the liver", "Patent hepatic and portal veins; normal-sized, non-nodular liver"], ["Glucose / creatinine / albumin", "62 mg/dL / 1.4 mg/dL / 3.9 g/dL"]], "vignette_recog": "A 29-year-old woman is brought to the emergency department with five days of nausea, vomiting, and deepening jaundice. She has been confused since this morning, and her gums bleed when she brushes her teeth. She was previously healthy with no liver disease, drinks no alcohol, and has started no new prescription medication, herbal product, or supplement. She denies acetaminophen and has not foraged mushrooms. Her temperature is 37.1°C (98.8°F), blood pressure is 96/58 mm Hg, pulse is 110/min, respirations are 22/min, and oxygen saturation is 97% on room air. She has asterixis with grade II encephalopathy and deep jaundice. There are no spider angiomata, no palmar erythema, no splenomegaly, and no ascites.", "labs_recog": [["INR", "3.4"], ["Total bilirubin", "18 mg/dL"], ["AST / ALT", "2,400 U/L / 3,100 U/L"], ["Ammonia", "168 µmol/L"], ["Acetaminophen level", "Undetectable"], ["Viral serologies", "Hepatitis A IgM, hepatitis B surface antigen and core IgM, and hepatitis C RNA all negative"], ["ANA / anti-smooth muscle antibody", "Negative, with a normal IgG"], ["Doppler ultrasound of the liver", "Patent hepatic and portal veins; normal-sized, non-nodular liver"], ["Glucose / creatinine / albumin", "62 mg/dL / 1.4 mg/dL / 3.9 g/dL"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Prothrombin time with INR"}, {"letter": "B", "text": "Hepatic venous pressure gradient measurement"}, {"letter": "C", "text": "Diagnostic paracentesis"}, {"letter": "D", "text": "MELD 3.0 score calculation"}, {"letter": "E", "text": "Upper endoscopy"}], "answer": "A", "explanation": "The clotting factors are made in the liver and have short half-lives, so the prothrombin time moves within hours to days of an acute injury and is the measure of synthetic failure that matters here. There is no ascites to tap and no evidence of portal hypertension to measure."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An ascitic fluid PMN count of 180/mm³ with a SAAG of 1.8 g/dL"}, {"letter": "B", "text": "Large esophageal varices with red wale signs and a hemoglobin of 7.4 g/dL"}, {"letter": "C", "text": "A hepatic venous pressure gradient of 18 mm Hg"}, {"letter": "D", "text": "An INR of 3.4"}, {"letter": "E", "text": "An ammonia of 118 µmol/L with a potassium of 3.1 mEq/L"}], "answer": "D", "explanation": "Gum bleeding with transaminases in the thousands and a bilirubin of 18 mg/dL says the hepatocytes have stopped making clotting factors. Her albumin is normal, which proves nothing — albumin has a half-life of about 20 days and takes 2 to 3 weeks to fall."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Variceal hemorrhage"}, {"letter": "B", "text": "Acute hepatic failure"}, {"letter": "C", "text": "Hepatic encephalopathy from cirrhosis"}, {"letter": "D", "text": "Acetaminophen hepatotoxicity"}, {"letter": "E", "text": "Decompensated cirrhosis"}], "answer": "B", "explanation": "Severe acute liver injury with an INR above 1.5 and any degree of encephalopathy, in a patient with no pre-existing liver disease and an illness under 26 weeks, is the definition. The absence of spider angiomata, splenomegaly, and a nodular liver is what rules out the cirrhotic alternatives."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acetaminophen hepatotoxicity"}, {"letter": "B", "text": "Decompensated cirrhosis"}, {"letter": "C", "text": "Variceal hemorrhage"}, {"letter": "D", "text": "Acute hepatic failure"}, {"letter": "E", "text": "Hepatic encephalopathy from cirrhosis"}], "answer": "D", "explanation": "An INR above 1.5 with encephalopathy in a previously healthy liver defines acute liver failure, whatever the cause turns out to be. The acetaminophen level is undetectable and the serologies and autoimmune workup are negative, so this is the indeterminate variety."}, {"key": "mgmt", "path": "both", "stem": "She has acute hepatic failure. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "ICU supportive care with transplant referral, withholding N-acetylcysteine until a cause is identified"}, {"letter": "B", "text": "N-acetylcysteine with ICU supportive care and immediate transplant center referral"}, {"letter": "C", "text": "Lactulose titrated to 2 to 4 bowel movements daily with ICU supportive care"}, {"letter": "D", "text": "Octreotide and ceftriaxone with ICU supportive care and band ligation"}, {"letter": "E", "text": "N-acetylcysteine with ICU supportive care, deferring referral until the transaminases exceed 5,000 U/L"}], "answer": "B", "explanation": "N-acetylcysteine is given whenever the cause is unclear, and holding it while the workup runs is the error — an undetectable acetaminophen level does not remove the indication. Referral is triggered by encephalopathy, shock, renal failure, or an INR above 3, never by how high the transaminases happen to be."}, {"key": "escalate", "path": "both", "stem": "Over the next 12 hours her ammonia rises above 200 µmol/L and she becomes unresponsive. Which of the following should be done next?", "options": [{"letter": "A", "text": "Sodium restriction with treatment of the precipitant"}, {"letter": "B", "text": "Tenofovir alafenamide for hepatitis B"}, {"letter": "C", "text": "Lactulose titrated to 2 to 4 bowel movements daily"}, {"letter": "D", "text": "Octreotide, ceftriaxone, and band ligation"}, {"letter": "E", "text": "Continuous renal replacement therapy with hypertonic saline"}], "answer": "E", "explanation": "Above an ammonia of 200, or once cerebral edema appears, ammonia is removed mechanically by continuous renal replacement therapy, with hypertonic saline to a sodium goal of 150 to hold the brain down. Lactulose belongs to the encephalopathy of established cirrhosis, and her hepatitis B serologies are negative."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to transplant center referral in acute liver failure?", "options": [{"letter": "A", "text": "Refer only once the ammonia exceeds 200 µmol/L"}, {"letter": "B", "text": "Refer only once the transaminases exceed 5,000 U/L"}, {"letter": "C", "text": "Refer only once the acetaminophen level is known"}, {"letter": "D", "text": "Refer for encephalopathy, shock, renal failure, or an INR above 3"}, {"letter": "E", "text": "Refer only once the albumin has fallen below normal"}], "answer": "D", "explanation": "Transplant is applicable in roughly half of these patients and post-transplant survival matches that of other liver diseases, so the referral is made on organ failure rather than on a number from the enzyme panel. A transaminase in the thousands with a normal INR is not liver failure; a modest transaminase with an INR of 1.8 is."}]}, {"case": "LI-G1", "group": "LI-G", "section": "the immune system attacking the liver", "objective": "", "vignette_workup": "A 34-year-old woman is referred to hepatology from the primary care clinic with three months of fatigue followed by two weeks of jaundice, dark urine, and mild itching. She has Hashimoto's thyroiditis and takes levothyroxine, and her mother has rheumatoid arthritis. She does not drink alcohol and has started no new medications, herbal products, or supplements. Her temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 84/min, respirations are 14/min, and oxygen saturation is 98% on room air. She is jaundiced with scleral icterus, and her liver edge is smooth and 3 cm below the costal margin. There are no spider angiomata, no ascites, and no asterixis.", "labs_workup": [["ALT / AST", "1,140 U/L / 890 U/L"], ["Alkaline phosphatase", "140 U/L"], ["Total bilirubin", "6.4 mg/dL (direct 4.6)"], ["INR / albumin", "1.2 / 3.6 g/dL"], ["Anti-smooth muscle antibody", "Positive at 1:160"], ["Serum IgG", "2,900 mg/dL"], ["ANA / anti-LKM", "Positive at 1:320 / negative"], ["Viral serologies and acetaminophen level", "Hepatitis A IgM, hepatitis B surface antigen, and hepatitis C RNA negative; acetaminophen undetectable"]], "vignette_recog": "A 34-year-old woman is referred to hepatology from the primary care clinic with three months of fatigue followed by two weeks of jaundice, dark urine, and mild itching. She has Hashimoto's thyroiditis and takes levothyroxine, and her mother has rheumatoid arthritis. She does not drink alcohol and has started no new medications, herbal products, or supplements. Her temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 84/min, respirations are 14/min, and oxygen saturation is 98% on room air. She is jaundiced with scleral icterus, and her liver edge is smooth and 3 cm below the costal margin. There are no spider angiomata, no ascites, and no asterixis. She undergoes liver biopsy.", "labs_recog": [["ALT / AST", "1,140 U/L / 890 U/L"], ["Alkaline phosphatase", "140 U/L"], ["Total bilirubin", "6.4 mg/dL (direct 4.6)"], ["INR / albumin", "1.2 / 3.6 g/dL"], ["Anti-smooth muscle antibody", "Positive at 1:160"], ["Serum IgG", "2,900 mg/dL"], ["ANA / anti-LKM", "Positive at 1:320 / negative"], ["Viral serologies and acetaminophen level", "Hepatitis A IgM, hepatitis B surface antigen, and hepatitis C RNA negative; acetaminophen undetectable"], ["Liver biopsy", "Interface hepatitis with plasma cell infiltration; stage F2 fibrosis without cirrhosis"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Alkaline phosphatase and GGT"}, {"letter": "B", "text": "Antimitochondrial antibody testing"}, {"letter": "C", "text": "Liver biopsy"}, {"letter": "D", "text": "Tissue biopsy with IgG4 staining"}, {"letter": "E", "text": "Serum IgG4 subclass level with MRCP"}], "answer": "C", "explanation": "The serology has taken this as far as serology can go, and what separates the diseases in this differential is the histology rather than the choice of procedure. Biopsy also stages the fibrosis, which matters because a third of these patients are already cirrhotic when they present."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "B", "text": "Negative serologies with improvement after a drug is withdrawn"}, {"letter": "C", "text": "Non-caseating granulomas"}, {"letter": "D", "text": "Granulomas centered on small bile ducts"}, {"letter": "E", "text": "IgG4-positive plasma cell deposition"}], "answer": "A", "explanation": "The cell under attack here is the hepatocyte, so the inflammation sits at the interface between portal tract and lobule and the infiltrate is rich in plasma cells. Granulomas centered on small bile ducts point instead at a cholestatic, duct-targeting disease."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "IgG4-related cholangiopathy"}, {"letter": "B", "text": "Drug-induced hepatitis"}, {"letter": "C", "text": "Primary biliary cholangitis"}, {"letter": "D", "text": "Autoimmune hepatitis"}, {"letter": "E", "text": "Hepatic granuloma"}], "answer": "D", "explanation": "A hepatocellular pattern with transaminases above 1,000, a positive anti-smooth muscle antibody, and a raised IgG is the combination present in more than 80% of cases. Primary biliary cholangitis is cholestatic with a positive antimitochondrial antibody, and the drug-induced pattern needs a newly started medication."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "IgG4-related cholangiopathy"}, {"letter": "B", "text": "Autoimmune hepatitis"}, {"letter": "C", "text": "Hepatic granuloma"}, {"letter": "D", "text": "Primary biliary cholangitis"}, {"letter": "E", "text": "Drug-induced hepatitis"}], "answer": "B", "explanation": "Interface hepatitis with a dense plasma cell infiltrate, on top of a positive anti-smooth muscle antibody and a raised IgG, is the histologic signature of hepatocyte-directed autoimmunity. A near-normal alkaline phosphatase argues against the duct-targeting diseases, whose biopsies show granulomas rather than interface change."}, {"key": "mgmt", "path": "both", "stem": "She has autoimmune hepatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Withdrawal of the suspected offending medication"}, {"letter": "B", "text": "Azathioprine 100 mg daily as initial monotherapy"}, {"letter": "C", "text": "Ursodeoxycholic acid"}, {"letter": "D", "text": "Anti-tuberculous therapy"}, {"letter": "E", "text": "Prednisone 40 mg daily to induce remission"}], "answer": "E", "explanation": "Remission is induced with corticosteroids, which act fast enough to stop ongoing hepatocyte destruction. Azathioprine takes months to work and is a maintenance agent, not an induction one, and there is no offending drug to withdraw here."}, {"key": "escalate", "path": "both", "stem": "She responds to prednisone and her transaminases normalize. Which of the following should be done next?", "options": [{"letter": "A", "text": "Check a TPMT level, then begin azathioprine while weaning the prednisone"}, {"letter": "B", "text": "Begin azathioprine while weaning the prednisone, checking a TPMT level if her counts fall"}, {"letter": "C", "text": "Continue prednisone 40 mg daily as long-term monotherapy"}, {"letter": "D", "text": "Check a TPMT level, then begin ursodeoxycholic acid while weaning the prednisone"}, {"letter": "E", "text": "Stop all therapy and monitor transaminases every 3 months"}], "answer": "A", "explanation": "Maintenance moves to azathioprine or mycophenolate while the prednisone is weaned toward 5 mg, because corticosteroids are not a long-term monotherapy — adrenal suppression, glucose intolerance, osteoporosis, cataracts, and the rest accumulate. TPMT is checked first: slow metabolizers have markedly increased myelotoxicity, and finding that out from a falling blood count is finding out too late."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to monitoring her blood counts on azathioprine?", "options": [{"letter": "A", "text": "A complete blood count only if the TPMT level is low"}, {"letter": "B", "text": "A complete blood count weekly for the first month, then every 3 months"}, {"letter": "C", "text": "A complete blood count only if the transaminases rise again"}, {"letter": "D", "text": "A complete blood count weekly for the first month only"}, {"letter": "E", "text": "A complete blood count every 3 months from the start"}], "answer": "B", "explanation": "Myelosuppression is commonest early, which is what the weekly counts are for, but it does not stop being possible after four weeks, so monitoring continues quarterly alongside liver tests. A normal TPMT lowers the risk without removing it."}]}, {"case": "LI-H3", "group": "LI-H", "section": "the liver injured from outside: a drug, a toxin, or a clot", "objective": "", "vignette_workup": "A 33-year-old woman presents to the emergency department with four days of worsening right upper quadrant pain and rapidly increasing abdominal swelling, and her eyes have turned yellow. She has polycythemia vera diagnosed last year with a JAK2 V617F mutation and has had two miscarriages. She takes a combined oral contraceptive. She drinks no alcohol, takes no acetaminophen, and has started no new medications. Her temperature is 37.0°C (98.6°F), blood pressure is 108/66 mm Hg, pulse is 100/min, respirations are 18/min, and oxygen saturation is 97% on room air. She has tender hepatomegaly 6 cm below the costal margin, tense ascites with shifting dullness, and jaundice. There are no spider angiomata, no caput medusae, and no asterixis.", "labs_workup": [["Doppler ultrasound of the liver", "Flow not demonstrated in the hepatic veins, with hepatomegaly and large-volume ascites; the study was limited by the volume of fluid"], ["Triple-phase CT", "Enlarged liver with heterogeneous enhancement and ascites; hepatic veins not clearly opacified"], ["AST / ALT", "420 U/L / 380 U/L"], ["Total bilirubin / alkaline phosphatase", "4.4 mg/dL / 180 U/L"], ["INR / albumin", "1.8 / 3.2 g/dL"], ["Hemoglobin / hematocrit / platelets", "17.2 g/dL / 52% / 620,000/mm³"]], "vignette_recog": "A 33-year-old woman presents to the emergency department with four days of worsening right upper quadrant pain and rapidly increasing abdominal swelling, and her eyes have turned yellow. She has polycythemia vera diagnosed last year with a JAK2 V617F mutation and has had two miscarriages. She takes a combined oral contraceptive. She drinks no alcohol, takes no acetaminophen, and has started no new medications. Her temperature is 37.0°C (98.6°F), blood pressure is 108/66 mm Hg, pulse is 100/min, respirations are 18/min, and oxygen saturation is 97% on room air. She has tender hepatomegaly 6 cm below the costal margin, tense ascites with shifting dullness, and jaundice. There are no spider angiomata, no caput medusae, and no asterixis. The non-invasive imaging is inconclusive and she is taken for direct venography.", "labs_recog": [["Doppler ultrasound of the liver", "Flow not demonstrated in the hepatic veins, with hepatomegaly and large-volume ascites; the study was limited by the volume of fluid"], ["Triple-phase CT", "Enlarged liver with heterogeneous enhancement and ascites; hepatic veins not clearly opacified"], ["AST / ALT", "420 U/L / 380 U/L"], ["Total bilirubin / alkaline phosphatase", "4.4 mg/dL / 180 U/L"], ["INR / albumin", "1.8 / 3.2 g/dL"], ["Hemoglobin / hematocrit / platelets", "17.2 g/dL / 52% / 620,000/mm³"], ["Direct venography", "Obstructed hepatic venous outflow"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Autoimmune serologies with a repeat Doppler ultrasound"}, {"letter": "B", "text": "Serologic workup for other causes of liver disease"}, {"letter": "C", "text": "Direct venography"}, {"letter": "D", "text": "Liver biopsy"}, {"letter": "E", "text": "Serial INR with transaminase measurement"}], "answer": "C", "explanation": "Both non-invasive studies were degraded by the volume of ascites and neither could opacify the hepatic veins, so the vascular question is still open. Venography opacifies the outflow tract directly and settles it. Watching numbers trend does nothing for a patient whose liver is losing its drainage."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Patent hepatic veins with negative serologies"}, {"letter": "B", "text": "Negative serologies with alkaline phosphatase falling after withdrawal alone"}, {"letter": "C", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "D", "text": "Obstructed hepatic venous outflow"}, {"letter": "E", "text": "An INR of 2.6 and rising with a bilirubin of 4.2 mg/dL"}], "answer": "D", "explanation": "A hypercoagulable patient with painful hepatomegaly and ascites appearing over days has thrombosed her hepatic veins; the liver engorges behind the block, which is what makes it large and tender. A JAK2-mutated myeloproliferative disease, two prior miscarriages, and an estrogen-containing contraceptive are three thrombotic pushes at once."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Autoimmune hepatitis"}, {"letter": "B", "text": "Acetaminophen hepatotoxicity"}, {"letter": "C", "text": "Acute hepatic failure"}, {"letter": "D", "text": "Budd-Chiari syndrome"}, {"letter": "E", "text": "Drug-induced hepatitis"}], "answer": "D", "explanation": "In the United States this is most often a young woman with a thrombophilic disorder, classically a JAK2 mutation or another myeloproliferative disease. Painful hepatomegaly with new ascites separates it from the drug and toxin injuries, which are painless, and the transaminases sit in the hundreds rather than the thousands."}, {"key": "dx_direct", "path": "R", "stem": "Which
