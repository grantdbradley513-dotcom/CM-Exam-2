lapse alone.", "objective": "", "section": "a lump or protrusion at the perineum", "pcase": "CO-H2", "pgroup": "CO-H"}, {"id": "15B", "group": 15, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "CT or MRI of the pelvis"}, {"letter": "B", "text": "Defecography"}, {"letter": "C", "text": "Flexible sigmoidoscopy"}, {"letter": "D", "text": "Anal manometry with anorectal ultrasound"}, {"letter": "E", "text": "Soft-tissue ultrasound"}], "answer": "B", "explanation": "Defecography images the rectum during evacuation and is what separates a complete, full-thickness prolapse from a mucosal one, which is the distinction that decides whether the treatment is reduction or an operation. Manometry is added because she is incontinent, but it characterizes the sphincter rather than the prolapse.", "objective": "", "section": "a lump or protrusion at the perineum", "pcase": "CO-H2", "pgroup": "CO-H"}, {"id": "15C", "group": 15, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Grade IV hemorrhoids"}, {"letter": "B", "text": "Rectal prolapse"}, {"letter": "C", "text": "Anal fissure"}, {"letter": "D", "text": "Fecal incontinence"}, {"letter": "E", "text": "Pilonidal abscess"}], "answer": "B", "explanation": "An elderly multiparous woman with decades of straining who reduces a painless protrusion by hand, leaks stool, and has a low sphincter tone with an anterior rectal ulcer has the full-thickness bowel wall coming through the anus. Her incontinence is a consequence of the stretched sphincter rather than a separate diagnosis.", "objective": "", "section": "a lump or protrusion at the perineum", "pcase": "CO-H2", "pgroup": "CO-H"}, {"id": "16", "group": 16, "stem": "A 41-year-old woman presents to the emergency department with 10 hours of severe epigastric pain with nausea and vomiting. Her father and brother both have very high triglyceride levels. She has type 2 diabetes that has been poorly controlled, and she takes oral estradiol for premature ovarian insufficiency diagnosed at 38. Her temperature is 37.6°C (99.7°F), blood pressure is 132/84 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 97% on room air. Her body mass index is 34. She has epigastric tenderness without guarding or rebound, eruptive xanthomas over the extensor forearms and buttocks, and lipemia retinalis on fundoscopy. There is no jaundice.\n\nStudies:\n    Lipase — 208 U/L (upper limit of normal 60)\n    Glucose — 316 mg/dL\n    Hemoglobin A1c — 10.4%\n    Calcium — 8.6 mg/dL\n    Sodium / magnesium — 136 mEq/L / 2.0 mg/dL\n    Creatinine — 0.8 mg/dL\n    AST / ALT — 30 U/L / 34 U/L\n    Alkaline phosphatase / total bilirubin — 76 U/L / 0.7 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Plasma triglyceride level"}, {"letter": "B", "text": "Fecal elastase-1 with CT of the abdomen"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "E", "text": "Upright chest radiograph"}], "answer": "A", "explanation": "A lipase that is barely raised does not exclude pancreatitis; severe lipemia interferes with the assay and can drive the reported value falsely low. Xanthomas and lipemia retinalis point at the lipid panel, and the triglyceride level is the study that both makes the diagnosis and directs treatment. Ultrasound and CT answer questions about stones and necrosis, neither of which this presentation raises.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A4", "pgroup": "PA-A"}, {"id": "16A", "group": 16, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Pancreatic calcifications with parenchymal atrophy and a normal lipase"}, {"letter": "B", "text": "Non-enhancing pancreatic parenchyma with persistent leukocytosis"}, {"letter": "C", "text": "An ALT of 224 U/L with a bilirubin of 3.4 mg/dL and a 9 mm common bile duct"}, {"letter": "D", "text": "A magnesium of 1.2 mg/dL with a phosphorus of 1.8 mg/dL and no gallstones"}, {"letter": "E", "text": "Triglycerides of 3,850 mg/dL with grossly lipemic serum"}], "answer": "E", "explanation": "Chylomicrons in the serum scatter light and make the sample visibly milky, and lipase liberates free fatty acids from them inside the gland's own small vessels, where they are directly cytotoxic to acinar membranes and to the vessel lining. Estrogen, poorly controlled diabetes, and a familial lipid disorder are three pushes in the same direction.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A4", "pgroup": "PA-A"}, {"id": "16B", "group": 16, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gallstone (biliary) pancreatitis"}, {"letter": "B", "text": "Alcohol-induced acute pancreatitis"}, {"letter": "C", "text": "Hypertriglyceridemia-induced pancreatitis"}, {"letter": "D", "text": "Chronic pancreatitis with calcifications"}, {"letter": "E", "text": "Drug-induced acute pancreatitis"}], "answer": "C", "explanation": "This is the third most common cause of acute pancreatitis, after gallstones and alcohol, and risk climbs once the triglyceride level passes roughly 1,000 mg/dL. Normal liver enzymes and bilirubin argue against a biliary origin, and a normal magnesium with no drinking history argues against alcohol.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A4", "pgroup": "PA-A"}, {"id": "16C", "group": 16, "stem": "She has hypertriglyceridemia-induced pancreatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Intravenous fluids with cholecystectomy this admission, stopping her estradiol"}, {"letter": "B", "text": "Intravenous fluids with an insulin infusion and glucose, continuing her estradiol"}, {"letter": "C", "text": "Intravenous fluids with an insulin infusion and glucose, stopping her estradiol"}, {"letter": "D", "text": "Intravenous fluids with electrolyte repletion and withdrawal management, continuing her estradiol"}, {"letter": "E", "text": "Intravenous fluids with bowel rest alone, stopping her estradiol"}], "answer": "C", "explanation": "Insulin activates lipoprotein lipase and accelerates chylomicron clearance, which lowers the triglyceride level acutely; fluids and bowel rest are the supportive backbone. Estrogens raise triglycerides and cause pancreatitis by intravascular thrombosis, so the estradiol has to come out — leaving it in place is the error the case is built around.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A4", "pgroup": "PA-A"}, {"id": "17", "group": 17, "stem": "A 57-year-old man comes to the gastroenterology clinic seven weeks after discharge with three weeks of persistent and recurrent epigastric pain, early satiety, and vomiting after meals. He says he can feel a lump under his ribs. He was admitted for acute pancreatitis seven weeks ago and has had no fever since discharge. His temperature is 36.9°C (98.4°F), blood pressure is 126/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. He has epigastric fullness with a palpable, mildly tender mass and faint scleral icterus. There are no rigors and no flank bruising.\n\nStudies:\n    CT abdomen with contrast — Encapsulated fluid collection 8 cm in the lesser sac with a well-defined enhancing wall; minimal necrosis, and the pancreas enhances normally\n    Total bilirubin / alkaline phosphatase — 2.1 mg/dL / 190 U/L\n    WBC — 7,600/mm³\n    Hemoglobin / hematocrit — 13.9 g/dL / 42%\n    Lipase — 71 U/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Repeat contrast-enhanced CT of the abdomen at 5 to 7 days"}, {"letter": "B", "text": "Blood cultures with a repeat white cell count"}, {"letter": "C", "text": "Contrast-enhanced CT of the abdomen at 72 hours after onset"}, {"letter": "D", "text": "Endoscopic ultrasound with fine-needle aspiration"}, {"letter": "E", "text": "MRCP"}], "answer": "D", "explanation": "The imaging morphology is already settled by the contrast CT, so the question left open is what is inside the capsule. Fine-needle aspiration samples the fluid and is how a cystic neoplasm is excluded before anything is drained. Repeat cross-sectional imaging adds nothing the first study did not already show.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B2", "pgroup": "PA-B"}, {"id": "17A", "group": 17, "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Benign fluid with no malignant cells"}, {"letter": "B", "text": "An enlarging non-enhancing pancreatic segment without gas"}, {"letter": "C", "text": "Necrotic debris within the collection"}, {"letter": "D", "text": "Mucinous or atypical cells in the aspirate"}, {"letter": "E", "text": "Growth of Escherichia coli or Klebsiella species"}], "answer": "A", "explanation": "A collection that follows a documented attack of pancreatitis by more than four weeks, sits behind a smooth enhancing wall, and contains almost no necrosis holds clear fluid rather than tumour or pus. Atypical cells would point to a neoplasm and organisms to an infected collection, neither of which fits an afebrile patient with a normal white count.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B2", "pgroup": "PA-B"}, {"id": "17B", "group": 17, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Walled-off necrosis"}, {"letter": "B", "text": "Pancreatic pseudocyst"}, {"letter": "C", "text": "Acute necrotic collection"}, {"letter": "D", "text": "Infected pancreatic necrosis"}, {"letter": "E", "text": "Acute peripancreatic fluid collection"}], "answer": "B", "explanation": "Four categories separate on two axes — whether there is a mature wall and whether the contents are clear fluid or necrotic debris. A well-defined enhancing wall around clear fluid at seven weeks is a pseudocyst; an acute peripancreatic fluid collection has no wall, and walled-off necrosis has a wall around debris.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B2", "pgroup": "PA-B"}, {"id": "17C", "group": 17, "stem": "He has a pancreatic pseudocyst. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Endoscopic transmural drainage with necrosectomy"}, {"letter": "B", "text": "Endoscopic drainage of the collection"}, {"letter": "C", "text": "Imipenem-cilastatin with ICU-level monitoring"}, {"letter": "D", "text": "Observation only, with no drainage and no antibiotics"}, {"letter": "E", "text": "Supportive care with drainage deferred"}], "answer": "B", "explanation": "An 8 cm collection producing pain, early satiety, and mild jaundice by mass effect on the stomach and bile duct is large and symptomatic, which is the indication for drainage. The endoscopic route is preferred over percutaneous or surgical. Necrosectomy belongs to collections that actually contain necrotic tissue.", "objective": "", "section": "a fluid or necrotic collection found after an attack of pancreatitis", "pcase": "PA-B2", "pgroup": "PA-B"}, {"id": "18", "group": 18, "stem": "A 68-year-old man is brought to the emergency department after two episodes of coffee-ground emesis this morning and three days of black tarry stools. He feels lightheaded when he stands. A duodenal ulcer was found two years ago and he stopped his pantoprazole once the pain settled. He takes naproxen for back pain and apixaban for atrial fibrillation. His temperature is 36.6°C (97.9°F), blood pressure is 96/58 mm Hg, pulse is 118/min, respirations are 20/min, and oxygen saturation is 97% on room air. He has pallor and cool extremities with mild epigastric tenderness. The abdomen is soft with no rebound, guarding, or rigidity, and rectal examination shows melena.\n\nStudies:\n    INR — 1.3\n    Type and crossmatch — Sent\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Intravenous secretin stimulation test"}, {"letter": "B", "text": "Upper endoscopy with gastric biopsy"}, {"letter": "C", "text": "Helicobacter pylori stool antigen with a complete blood count"}, {"letter": "D", "text": "Complete blood count and metabolic panel with an upright chest radiograph"}, {"letter": "E", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}], "answer": "D", "explanation": "The immediate questions are how much blood has been lost and whether the ulcer has perforated, and a blood count, a metabolic panel, and an upright film answer both within minutes. Endoscopy follows once he is resuscitated. A gastrin level drawn on an acid-suppressed, actively bleeding patient is uninterpretable.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B1", "pgroup": "GA-B"}, {"id": "18A", "group": 18, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Hemoglobin 7.6 g/dL with a BUN:creatinine ratio of 40 and no free air"}, {"letter": "B", "text": "A normal hemoglobin with a negative stool antigen test"}, {"letter": "C", "text": "Hypokalemic, hypochloremic metabolic alkalosis"}, {"letter": "D", "text": "Fasting gastrin of 1,480 pg/mL with a gastric pH of 1.6"}, {"letter": "E", "text": "Iron deficiency anemia with a positive fecal occult blood test"}], "answer": "A", "explanation": "Blood in the small bowel is digested and absorbed as protein, so urea rises while the creatinine stays put; a ratio near 40 with a falling hemoglobin is the signature of an upper source. The absence of free air is what separates a bleeding ulcer from a perforated one.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B1", "pgroup": "GA-B"}, {"id": "18B", "group": 18, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Zollinger-Ellison syndrome"}, {"letter": "B", "text": "NSAID-induced gastritis"}, {"letter": "C", "text": "Bleeding peptic ulcer"}, {"letter": "D", "text": "Gastric outlet obstruction"}, {"letter": "E", "text": "Esophageal variceal hemorrhage"}], "answer": "C", "explanation": "Bleeding is the most common complication of peptic ulcer disease, and a known ulcer, a withdrawn proton pump inhibitor, an NSAID, and an anticoagulant are four reasons for this one to bleed. Varices would come with stigmata of chronic liver disease, and gastric outlet obstruction produces vomiting of undigested food rather than blood.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B1", "pgroup": "GA-B"}, {"id": "18C", "group": 18, "stem": "He has a bleeding peptic ulcer. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Oral proton pump inhibitor therapy with endoscopy within 24 hours, transfusing him now"}, {"letter": "B", "text": "Intravenous proton pump inhibitor bolus and infusion with endoscopy within 24 hours, transfusing platelets before the procedure"}, {"letter": "C", "text": "Intravenous proton pump inhibitor bolus and infusion with emergent laparotomy, transfusing him now"}, {"letter": "D", "text": "Intravenous proton pump inhibitor bolus and infusion with endoscopy within 24 hours, withholding transfusion until the hemoglobin falls below 7 g/dL"}, {"letter": "E", "text": "Intravenous proton pump inhibitor bolus and infusion with endoscopy within 24 hours, transfusing him now"}], "answer": "E", "explanation": "A clot will not hold unless gastric pH is above 6, which needs an 80 mg intravenous bolus followed by an infusion rather than an oral agent. The usual transfusion threshold is a hemoglobin below 7, but it rises to 9 in a patient who is unstable or elderly, and he is both. Platelets are corrected only below 50,000, and his abdomen is soft, so there is nothing for a laparotomy to repair.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B1", "pgroup": "GA-B"}, {"id": "19", "group": 19, "stem": "A 45-year-old man is seen in the primary care clinic after a low platelet count turned up on a pre-operative complete blood count before knee surgery. He has no symptoms apart from mild fatigue, and has never had ascites, a variceal bleed, confusion, or jaundice. He acquired hepatitis C in his twenties and was never treated, and he drinks rarely. His temperature is 36.7°C (98.1°F), blood pressure is 124/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has two spider angiomata on the upper chest and a palpable spleen tip. There is no ascites, no asterixis, and no jaundice.\n\nStudies:\n    Platelets — 128,000/mm³\n    Albumin / INR — 4.0 g/dL / 1.0\n    Total bilirubin — 0.9 mg/dL\n    AST / ALT — 54 U/L / 61 U/L\n    Liver ultrasound — Coarse echotexture with a nodular surface, spleen 14 cm, no ascites\n    FIB-4 — 2.4 (indeterminate, between 1.45 and 3.25)\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Serum ceruloplasmin"}, {"letter": "B", "text": "Percutaneous liver biopsy"}, {"letter": "C", "text": "Diagnostic paracentesis"}, {"letter": "D", "text": "Serum transferrin saturation"}, {"letter": "E", "text": "Transient elastography"}], "answer": "E", "explanation": "Noninvasive fibrosis scores perform best at the extremes, and a FIB-4 of 2.4 sits in the indeterminate band where the score cannot decide. Elastography is the study built for exactly that gap, and it answers the question without a needle. There is no ascites to tap.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A2", "pgroup": "LI-A"}, {"id": "19A", "group": 19, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Hepatic steatosis with an ALT of 96 U/L and an AST of 58 U/L"}, {"letter": "B", "text": "Regenerative nodules surrounded by fibrous bands on biopsy"}, {"letter": "C", "text": "Liver stiffness of 16.4 kPa, corresponding to stage F4 fibrosis"}, {"letter": "D", "text": "An AST-to-ALT ratio of 2.5 with a GGT of 310 U/L"}, {"letter": "E", "text": "An ascitic fluid PMN count of 180/mm³ with a SAAG of 1.8 g/dL"}], "answer": "C", "explanation": "A nodular surface, a 14 cm spleen, and a platelet count under 150,000 already describe an architecturally scarred liver with portal hypertension; the stiffness measurement puts a stage on it. Untreated hepatitis C acquired decades ago is enough time to reach F4.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A2", "pgroup": "LI-A"}, {"id": "19B", "group": 19, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alcohol-related fatty liver disease"}, {"letter": "B", "text": "Cirrhosis with impaired synthetic function"}, {"letter": "C", "text": "Metabolic dysfunction-associated steatotic liver disease"}, {"letter": "D", "text": "Decompensated cirrhosis"}, {"letter": "E", "text": "Compensated cirrhosis"}], "answer": "E", "explanation": "Compensation is defined by what has not happened — no ascites, no variceal bleed, no encephalopathy, no jaundice — in a patient whose liver is already cirrhotic. A normal albumin, INR, and bilirubin say the synthetic machinery is still keeping up.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A2", "pgroup": "LI-A"}, {"id": "19C", "group": 19, "stem": "He has compensated cirrhosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with transplant referral"}, {"letter": "B", "text": "Alcohol abstinence with vaccination and six-month imaging"}, {"letter": "C", "text": "Naltrexone 50 mg daily with abstinence counseling"}, {"letter": "D", "text": "Diet and exercise aiming at 10% body-weight loss"}, {"letter": "E", "text": "A direct-acting antiviral course with vaccination"}], "answer": "E", "explanation": "Management is aimed at the cause, and his cause is a curable virus, so an antiviral course goes alongside the vaccinations every cirrhotic receives. Abstinence with naltrexone treats the alcohol-related liver, weight loss the metabolic one, and sodium restriction with transplant referral belongs to decompensated disease.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A2", "pgroup": "LI-A"}, {"id": "20", "group": 20, "stem": "A 29-year-old woman is brought to the emergency department with five days of nausea, vomiting, and deepening jaundice. She has been confused since this morning, and her gums bleed when she brushes her teeth. She was previously healthy with no liver disease, drinks no alcohol, and has started no new prescription medication, herbal product, or supplement. She denies acetaminophen and has not foraged mushrooms. Her temperature is 37.1°C (98.8°F), blood pressure is 96/58 mm Hg, pulse is 110/min, respirations are 22/min, and oxygen saturation is 97% on room air. She has asterixis with grade II encephalopathy and deep jaundice. There are no spider angiomata, no palmar erythema, no splenomegaly, and no ascites.\n\nStudies:\n    Total bilirubin — 18 mg/dL\n    AST / ALT — 2,400 U/L / 3,100 U/L\n    Ammonia — 168 µmol/L\n    Acetaminophen level — Undetectable\n    Viral serologies — Hepatitis A IgM, hepatitis B surface antigen and core IgM, and hepatitis C RNA all negative\n    ANA / anti-smooth muscle antibody — Negative, with a normal IgG\n    Doppler ultrasound of the liver — Patent hepatic and portal veins; normal-sized, non-nodular liver\n    Glucose / creatinine / albumin — 62 mg/dL / 1.4 mg/dL / 3.9 g/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Prothrombin time with INR"}, {"letter": "B", "text": "Hepatic venous pressure gradient measurement"}, {"letter": "C", "text": "Diagnostic paracentesis"}, {"letter": "D", "text": "MELD 3.0 score calculation"}, {"letter": "E", "text": "Upper endoscopy"}], "answer": "A", "explanation": "The clotting factors are made in the liver and have short half-lives, so the prothrombin time moves within hours to days of an acute injury and is the measure of synthetic failure that matters here. There is no ascites to tap and no evidence of portal hypertension to measure.", "objective": "", "section": "the acute deterioration: confusion or bleeding", "pcase": "LI-D3", "pgroup": "LI-D"}, {"id": "20A", "group": 20, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An ascitic fluid PMN count of 180/mm³ with a SAAG of 1.8 g/dL"}, {"letter": "B", "text": "Large esophageal varices with red wale signs and a hemoglobin of 7.4 g/dL"}, {"letter": "C", "text": "A hepatic venous pressure gradient of 18 mm Hg"}, {"letter": "D", "text": "An INR of 3.4"}, {"letter": "E", "text": "An ammonia of 118 µmol/L with a potassium of 3.1 mEq/L"}], "answer": "D", "explanation": "Gum bleeding with transaminases in the thousands and a bilirubin of 18 mg/dL says the hepatocytes have stopped making clotting factors. Her albumin is normal, which proves nothing — albumin has a half-life of about 20 days and takes 2 to 3 weeks to fall.", "objective": "", "section": "the acute deterioration: confusion or bleeding", "pcase": "LI-D3", "pgroup": "LI-D"}, {"id": "20B", "group": 20, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Variceal hemorrhage"}, {"letter": "B", "text": "Acute hepatic failure"}, {"letter": "C", "text": "Hepatic encephalopathy from cirrhosis"}, {"letter": "D", "text": "Acetaminophen hepatotoxicity"}, {"letter": "E", "text": "Decompensated cirrhosis"}], "answer": "B", "explanation": "Severe acute liver injury with an INR above 1.5 and any degree of encephalopathy, in a patient with no pre-existing liver disease and an illness under 26 weeks, is the definition. The absence of spider angiomata, splenomegaly, and a nodular liver is what rules out the cirrhotic alternatives.", "objective": "", "section": "the acute deterioration: confusion or bleeding", "pcase": "LI-D3", "pgroup": "LI-D"}, {"id": "20C", "group": 20, "stem": "She has acute hepatic failure. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "ICU supportive care with transplant referral, withholding N-acetylcysteine until a cause is identified"}, {"letter": "B", "text": "N-acetylcysteine with ICU supportive care and immediate transplant center referral"}, {"letter": "C", "text": "Lactulose titrated to 2 to 4 bowel movements daily with ICU supportive care"}, {"letter": "D", "text": "Octreotide and ceftriaxone with ICU supportive care and band ligation"}, {"letter": "E", "text": "N-acetylcysteine with ICU supportive care, deferring referral until the transaminases exceed 5,000 U/L"}], "answer": "B", "explanation": "N-acetylcysteine is given whenever the cause is unclear, and holding it while the workup runs is the error — an undetectable acetaminophen level does not remove the indication. Referral is triggered by encephalopathy, shock, renal failure, or an INR above 3, never by how high the transaminases happen to be.", "objective": "", "section": "the acute deterioration: confusion or bleeding", "pcase": "LI-D3", "pgroup": "LI-D"}, {"id": "21", "group": 21, "stem": "A 34-year-old woman is referred to hepatology from the primary care clinic with three months of fatigue followed by two weeks of jaundice, dark urine, and mild itching. She has Hashimoto's thyroiditis and takes levothyroxine, and her mother has rheumatoid arthritis. She does not drink alcohol and has started no new medications, herbal products, or supplements. Her temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 84/min, respirations are 14/min, and oxygen saturation is 98% on room air. She is jaundiced with scleral icterus, and her liver edge is smooth and 3 cm below the costal margin. There are no spider angiomata, no ascites, and no asterixis.\n\nStudies:\n    ALT / AST — 1,140 U/L / 890 U/L\n    Alkaline phosphatase — 140 U/L\n    Total bilirubin — 6.4 mg/dL (direct 4.6)\n    INR / albumin — 1.2 / 3.6 g/dL\n    Anti-smooth muscle antibody — Positive at 1:160\n    Serum IgG — 2,900 mg/dL\n    ANA / anti-LKM — Positive at 1:320 / negative\n    Viral serologies and acetaminophen level — Hepatitis A IgM, hepatitis B surface antigen, and hepatitis C RNA negative; acetaminophen undetectable\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Alkaline phosphatase and GGT"}, {"letter": "B", "text": "Antimitochondrial antibody testing"}, {"letter": "C", "text": "Liver biopsy"}, {"letter": "D", "text": "Tissue biopsy with IgG4 staining"}, {"letter": "E", "text": "Serum IgG4 subclass level with MRCP"}], "answer": "C", "explanation": "The serology has taken this as far as serology can go, and what separates the diseases in this differential is the histology rather than the choice of procedure. Biopsy also stages the fibrosis, which matters because a third of these patients are already cirrhotic when they present.", "objective": "", "section": "the immune system attacking the liver", "pcase": "LI-G1", "pgroup": "LI-G"}, {"id": "21A", "group": 21, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "B", "text": "Negative serologies with improvement after a drug is withdrawn"}, {"letter": "C", "text": "Non-caseating granulomas"}, {"letter": "D", "text": "Granulomas centered on small bile ducts"}, {"letter": "E", "text": "IgG4-positive plasma cell deposition"}], "answer": "A", "explanation": "The cell under attack here is the hepatocyte, so the inflammation sits at the interface between portal tract and lobule and the infiltrate is rich in plasma cells. Granulomas centered on small bile ducts point instead at a cholestatic, duct-targeting disease.", "objective": "", "section": "the immune system attacking the liver", "pcase": "LI-G1", "pgroup": "LI-G"}, {"id": "21B", "group": 21, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "IgG4-related cholangiopathy"}, {"letter": "B", "text": "Drug-induced hepatitis"}, {"letter": "C", "text": "Primary biliary cholangitis"}, {"letter": "D", "text": "Autoimmune hepatitis"}, {"letter": "E", "text": "Hepatic granuloma"}], "answer": "D", "explanation": "A hepatocellular pattern with transaminases above 1,000, a positive anti-smooth muscle antibody, and a raised IgG is the combination present in more than 80% of cases. Primary biliary cholangitis is cholestatic with a positive antimitochondrial antibody, and the drug-induced pattern needs a newly started medication.", "objective": "", "section": "the immune system attacking the liver", "pcase": "LI-G1", "pgroup": "LI-G"}, {"id": "21C", "group": 21, "stem": "She has autoimmune hepatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Withdrawal of the suspected offending medication"}, {"letter": "B", "text": "Azathioprine 100 mg daily as initial monotherapy"}, {"letter": "C", "text": "Ursodeoxycholic acid"}, {"letter": "D", "text": "Anti-tuberculous therapy"}, {"letter": "E", "text": "Prednisone 40 mg daily to induce remission"}], "answer": "E", "explanation": "Remission is induced with corticosteroids, which act fast enough to stop ongoing hepatocyte destruction. Azathioprine takes months to work and is a maintenance agent, not an induction one, and there is no offending drug to withdraw here.", "objective": "", "section": "the immune system attacking the liver", "pcase": "LI-G1", "pgroup": "LI-G"}, {"id": "22", "group": 22, "stem": "A 33-year-old woman presents to the emergency department with four days of worsening right upper quadrant pain and rapidly increasing abdominal swelling, and her eyes have turned yellow. She has polycythemia vera diagnosed last year with a JAK2 V617F mutation and has had two miscarriages. She takes a combined oral contraceptive. She drinks no alcohol, takes no acetaminophen, and has started no new medications. Her temperature is 37.0°C (98.6°F), blood pressure is 108/66 mm Hg, pulse is 100/min, respirations are 18/min, and oxygen saturation is 97% on room air. She has tender hepatomegaly 6 cm below the costal margin, tense ascites with shifting dullness, and jaundice. There are no spider angiomata, no caput medusae, and no asterixis.\n\nStudies:\n    Doppler ultrasound of the liver — Flow not demonstrated in the hepatic veins, with hepatomegaly and large-volume ascites; the study was limited by the volume of fluid\n    Triple-phase CT — Enlarged liver with heterogeneous enhancement and ascites; hepatic veins not clearly opacified\n    AST / ALT — 420 U/L / 380 U/L\n    Total bilirubin / alkaline phosphatase — 4.4 mg/dL / 180 U/L\n    INR / albumin — 1.8 / 3.2 g/dL\n    Hemoglobin / hematocrit / platelets — 17.2 g/dL / 52% / 620,000/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Autoimmune serologies with a repeat Doppler ultrasound"}, {"letter": "B", "text": "Serologic workup for other causes of liver disease"}, {"letter": "C", "text": "Direct venography"}, {"letter": "D", "text": "Liver biopsy"}, {"letter": "E", "text": "Serial INR with transaminase measurement"}], "answer": "C", "explanation": "Both non-invasive studies were degraded by the volume of ascites and neither could opacify the hepatic veins, so the vascular question is still open. Venography opacifies the outflow tract directly and settles it. Watching numbers trend does nothing for a patient whose liver is losing its drainage.", "objective": "", "section": "the liver injured from outside: a drug, a toxin, or a clot", "pcase": "LI-H3", "pgroup": "LI-H"}, {"id": "22A", "group": 22, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Patent hepatic veins with negative serologies"}, {"letter": "B", "text": "Negative serologies with alkaline phosphatase falling after withdrawal alone"}, {"letter": "C", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "D", "text": "Obstructed hepatic venous outflow"}, {"letter": "E", "text": "An INR of 2.6 and rising with a bilirubin of 4.2 mg/dL"}], "answer": "D", "explanation": "A hypercoagulable patient with painful hepatomegaly and ascites appearing over days has thrombosed her hepatic veins; the liver engorges behind the block, which is what makes it large and tender. A JAK2-mutated myeloproliferative disease, two prior miscarriages, and an estrogen-containing contraceptive are three thrombotic pushes at once.", "objective": "", "section": "the liver injured from outside: a drug, a toxin, or a clot", "pcase": "LI-H3", "pgroup": "LI-H"}, {"id": "22B", "group": 22, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Autoimmune hepatitis"}, {"letter": "B", "text": "Acetaminophen hepatotoxicity"}, {"letter": "C", "text": "Acute hepatic failure"}, {"letter": "D", "text": "Budd-Chiari syndrome"}, {"letter": "E", "text": "Drug-induced hepatitis"}], "answer": "D", "explanation": "In the United States this is most often a young woman with a thrombophilic disorder, classically a JAK2 mutation or another myeloproliferative disease. Painful hepatomegaly with new ascites separates it from the drug and toxin injuries, which are painless, and the transaminases sit in the hundreds rather than the thousands.", "objective": "", "section": "the liver injured from outside: a drug, a toxin, or a clot", "pcase": "LI-H3", "pgroup": "LI-H"}, {"id": "22C", "group": 22, "stem": "She has Budd-Chiari syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "N-acetylcysteine with intensive care support and transplant referral"}, {"letter": "B", "text": "Sodium restriction and diuretics with urgent referral for TIPS"}, {"letter": "C", "text": "Withdrawal of her oral contraceptive alone"}, {"letter": "D", "text": "Anticoagulation with urgent referral for TIPS"}, {"letter": "E", "text": "Prednisone 40 mg daily with urgent hepatology referral"}], "answer": "D", "explanation": "The clot is the disease, so anticoagulation plus a shunt that re-establishes outflow is what saves the liver. Treating the ascites with diuretics is the trap the case is built around — it manages the consequence and leaves the obstruction in place. Stopping the contraceptive matters but does nothing for the thrombus already there.", "objective": "", "section": "the liver injured from outside: a drug, a toxin, or a clot", "pcase": "LI-H3", "pgroup": "LI-H"}, {"id": "23", "group": 23, "stem": "A 38-year-old woman returns to the primary care clinic three weeks after an episode of jaundice, dark urine, malaise, nausea, and aching joints that has now largely resolved, although mild fatigue persists. She had a new sexual partner about four months ago and did not use barrier protection. She was never vaccinated against hepatitis B, has no injection drug use, no tattoos, no travel, and no transfusions, and drinks two glasses of wine a week. Her temperature is 37.0°C (98.6°F), blood pressure is 116/74 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her sclera are faintly icteric and the liver edge is palpable 2 cm below the costal margin and mildly tender. There is no rash, no splenomegaly, no spider angiomata, and no asterixis.\n\nStudies:\n    AST / ALT — 640 U/L / 810 U/L\n    Alkaline phosphatase — 140 U/L\n    Total bilirubin — 4.2 mg/dL (direct 2.9)\n    Albumin — 4.1 g/dL\n    PT / INR — 12.8 s / 1.1\n    WBC / hemoglobin / platelets — 5,400/mm³ / 12.9 g/dL / 218,000/mm³\n    Hepatitis A IgM / hepatitis C antibody — Negative / negative\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HBsAg with HBeAg, HBeAb, and HBV DNA"}, {"letter": "B", "text": "HBsAg with total anti-HDV antibody"}, {"letter": "C", "text": "HBV DNA by PCR"}, {"letter": "D", "text": "HBsAg, HBsAb, and HBcAb"}, {"letter": "E", "text": "HBsAg, HBsAb, and HBcAb with HBcAb IgM"}], "answer": "E", "explanation": "An unprotected exposure four months ago with a hepatitic illness makes hepatitis B the question, and the three-marker screen is the entry panel. The IgM fraction of the core antibody has to be on it, because there is a phase of this infection in which it is the only marker that will be positive.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B1", "pgroup": "VH-B"}, {"id": "23A", "group": 23, "stem": "Which of the following patterns is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg positive, HBsAb negative, HBcAb IgM positive"}, {"letter": "B", "text": "HBsAg negative, HBsAb positive, HBcAb positive"}, {"letter": "C", "text": "HBsAg positive, HBsAb negative, HBcAb IgG positive"}, {"letter": "D", "text": "HBsAg negative, HBsAb positive, HBcAb negative"}, {"letter": "E", "text": "HBsAg negative, HBsAb negative, HBcAb IgM positive"}], "answer": "E", "explanation": "Surface antigen clears before surface antibody appears, and in the gap between them the core IgM stands alone. An illness that peaked and is now settling three weeks later lands squarely in that gap.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B1", "pgroup": "VH-B"}, {"id": "23B", "group": 23, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B with high-level viral replication"}, {"letter": "B", "text": "Chronic hepatitis B infection"}, {"letter": "C", "text": "Resolved (cleared) hepatitis B infection"}, {"letter": "D", "text": "Vaccine-induced immunity to hepatitis B"}, {"letter": "E", "text": "Acute hepatitis B in the serologic window period"}], "answer": "E", "explanation": "A negative surface antigen does not exclude acute hepatitis B — reading the panel on HBsAg alone is how this infection gets called \"not infected.\" Cleared infection would already show a surface antibody, and vaccine immunity never produces a core antibody at all.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B1", "pgroup": "VH-B"}, {"id": "23C", "group": 23, "stem": "She has acute hepatitis B in the window period. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with vaccination of her contacts"}, {"letter": "B", "text": "Interferon added to therapy for hepatitis B"}, {"letter": "C", "text": "Tenofovir or entecavir, continued lifelong"}, {"letter": "D", "text": "No treatment, with immunity documented in the record"}, {"letter": "E", "text": "Serial ALT and HBV DNA every 6 to 12 months"}], "answer": "A", "explanation": "Uncomplicated acute infection needs rest, hydration, and avoidance of alcohol and other hepatotoxins, with the panel repeated at 6 months to document resolution. The people who need an intervention are her non-immune contacts, who get the vaccine series.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B1", "pgroup": "VH-B"}, {"id": "24", "group": 24, "stem": "A 22-year-old man presents to the emergency department with four days of jaundice and dark urine, two weeks of malaise, nausea, and vomiting, aching wrists and knees, and an itchy rash on the trunk. He had a tattoo at an unlicensed shop three months ago and several new sexual partners without barrier protection. He immigrated at age 12 and never received the hepatitis B series. He has no injection drug use and drinks no alcohol. His temperature is 38.2°C (100.8°F), blood pressure is 122/76 mm Hg, pulse is 102/min, respirations are 18/min, and oxygen saturation is 98% on room air. He has icteric sclera and jaundiced skin, tender hepatomegaly 4 cm below the costal margin, and urticarial wheals over the trunk. He is alert, with no asterixis and no ascites.\n\nStudies:\n    AST / ALT — 1,240 U/L / 1,760 U/L\n    Alkaline phosphatase — 180 U/L\n    Total bilirubin — 9.1 mg/dL (direct 6.4)\n    Albumin — 3.8 g/dL\n    PT / INR — 14.0 s / 1.2\n    WBC / hemoglobin / platelets — 6,600/mm³ / 14.8 g/dL / 205,000/mm³\n    Hepatitis A IgM / hepatitis C antibody — Negative / negative\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HBsAg with HBV DNA and ALT repeated over time"}, {"letter": "B", "text": "HBsAg, HBsAb, and HBcAb without an IgM fraction"}, {"letter": "C", "text": "HBsAg with total anti-HDV antibody"}, {"letter": "D", "text": "HBsAg with HBcAb IgM"}, {"letter": "E", "text": "HBeAg and HBeAb with HBV DNA by PCR"}], "answer": "D", "explanation": "Both markers are ordered together because either one alone can mislead: the surface antigen can already have cleared, and a core antibody without its IgM fraction cannot separate a current infection from an old one. Replication markers and serial testing come after the diagnosis, not instead of it.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B2", "pgroup": "VH-B"}, {"id": "24A", "group": 24, "stem": "Which of the following patterns is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg positive, HBsAb negative, HBcAb IgG positive"}, {"letter": "B", "text": "HBsAg negative, HBsAb negative, HBcAb IgM positive"}, {"letter": "C", "text": "HBsAg positive, HBsAb negative, HBcAb IgM positive"}, {"letter": "D", "text": "HBsAg negative, HBsAb positive, HBcAb negative"}, {"letter": "E", "text": "HBsAg negative, HBsAb positive, HBcAb positive"}], "answer": "C", "explanation": "An illness three months after a percutaneous and sexual exposure, still in its icteric phase, catches the infection while surface antigen is circulating and the core response is still IgM. An IgG core antibody would mean the infection is old rather than current.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B2", "pgroup": "VH-B"}, {"id": "24B", "group": 24, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B in the serologic window period"}, {"letter": "B", "text": "Vaccine-induced immunity to hepatitis B"}, {"letter": "C", "text": "Chronic hepatitis B infection"}, {"letter": "D", "text": "Acute hepatitis B"}, {"letter": "E", "text": "Resolved (cleared) hepatitis B infection"}], "answer": "D", "explanation": "Transaminases more than ten times normal with ALT above AST, arthralgia, and an urticarial rash are the serum-sickness-like prodrome of acute infection. Chronic disease is defined by surface antigen persisting past 6 months and carries an IgG rather than an IgM core antibody.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B2", "pgroup": "VH-B"}, {"id": "24C", "group": 24, "stem": "He has acute hepatitis B. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Interferon added to therapy for hepatitis B"}, {"letter": "B", "text": "Peginterferon alfa with supportive care"}, {"letter": "C", "text": "Supportive care with avoidance of hepatotoxins"}, {"letter": "D", "text": "Serial ALT and HBV DNA every 6 to 12 months"}, {"letter": "E", "text": "Tenofovir or entecavir, continued lifelong"}], "answer": "C", "explanation": "More than 95% of immunocompetent adults clear the virus on their own within about 6 months, so bed rest, hydration, nutrition, and avoiding hepatotoxins is the whole of treatment. Peginterferon is contraindicated in acute hepatitis B, and lifelong nucleoside therapy belongs to chronic infection.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B2", "pgroup": "VH-B"}, {"id": "25", "group": 25, "stem": "A 28-year-old man comes to the primary care clinic with six weeks of bloody diarrhea, five stools daily, with tenesmus, urgency, and crampy left lower quadrant pain. He quit smoking four months ago and his father has ulcerative colitis. He has had no travel and no antibiotic exposure. His temperature is 37.2°C (99.0°F), blood pressure is 118/74 mm Hg, pulse is 94/min, respirations are 16/min, and oxygen saturation is 99% on room air. He has left lower quadrant tenderness without guarding, gross blood on rectal examination, and conjunctival pallor. There is no perianal fistula or fissure, no oral ulcer, and no abdominal distention.\n\nStudies:\n    Hemoglobin / hematocrit — 11.4 g/dL / 34%\n    MCV — 82 fL\n    WBC / platelets — 8,900/mm³ / 355,000/mm³\n    Albumin — 3.3 g/dL\n    ESR / CRP — 26 mm/h / 22 mg/L\n    Stool cultures and Clostridioides difficile — Negative\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Surveillance colonoscopy with 32 four-quadrant biopsies"}, {"letter": "B", "text": "Colonoscopy with ileal intubation and biopsy"}, {"letter": "C", "text": "CT or MR enterography"}, {"letter": "D", "text": "Pelvic MRI with endoanal ultrasound"}, {"letter": "E", "text": "ASCA and p-ANCA serology"}], "answer": "B", "explanation": "Infection has been excluded, so the question is now the distribution and the depth of the inflammation, and only endoscopy with tissue answers both. Intubating the ileum is what separates the two forms of inflammatory bowel disease. Serology supports a diagnosis but never makes one.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A2", "pgroup": "IB-A"}, {"id": "25A", "group": 25, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Segmental colitis at a watershed segment with rectal sparing and an abrupt transition"}, {"letter": "B", "text": "Skip lesions with cobblestoning and rectal sparing, with non-caseating granulomas on biopsy"}, {"letter": "C", "text": "Flat high-grade dysplasia in inflamed mucosa with no visible polyp"}, {"letter": "D", "text": "Chronic active colitis with no ileal disease and no skip or rectal-sparing pattern"}, {"letter": "E", "text": "Continuous rectal-based inflammation with a spared ileum, and crypt abscesses with mucin depletion"}], "answer": "E", "explanation": "The inflammation is mucosal and submucosal only, begins at the rectum, and moves proximally without skipping, which is why the bleeding is continuous and the terminal ileum is untouched. Transmural, patchy disease with granulomas is the other pattern, and it spares the rectum rather than starting there.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A2", "pgroup": "IB-A"}, {"id": "25B", "group": 25, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Indeterminate colitis"}, {"letter": "B", "text": "Crohn's disease"}, {"letter": "C", "text": "Ulcerative colitis"}, {"letter": "D", "text": "IBD-associated colorectal cancer"}, {"letter": "E", "text": "Ischemic colitis"}], "answer": "C", "explanation": "Bloody diarrhea with tenesmus in a recent ex-smoker with an affected first-degree relative is the classic setting, and stopping smoking is itself associated with onset. Indeterminate colitis is reserved for cases where neither pattern is established after full evaluation.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A2", "pgroup": "IB-A"}, {"id": "25C", "group": 25, "stem": "He has left-sided ulcerative colitis of moderate activity. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "A mesalamine enema with an oral aminosalicylate and naproxen for cramping"}, {"letter": "B", "text": "Budesonide with smoking cessation counseling"}, {"letter": "C", "text": "A mesalamine enema with an oral aminosalicylate and loperamide"}, {"letter": "D", "text": "An anti-TNF agent with an immunomodulator"}, {"letter": "E", "text": "A mesalamine enema with an oral aminosalicylate"}], "answer": "E", "explanation": "Distal and left-sided disease is treated topically and orally at once, so the drug reaches the inflamed segment from both directions. Anti-diarrheals raise the risk of toxic megacolon and NSAIDs trigger flares, which is why the two symptomatic additions here are the wrong ones. Mesalamine can cause interstitial nephritis, so the BUN and creatinine are followed.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A2", "pgroup": "IB-A"}, {"id": "26", "group": 26, "stem": "A 29-year-old woman comes to the primary care clinic with eight months of low back and buttock pain that is worst on waking, eases after about 45 minutes of movement, and improves with exercise. It wakes her in the second half of the night, and the onset was insidious. She has left-sided ulcerative colitis of five years, currently in remission. Her temperature is 36.8°C (98.2°F), blood pressure is 116/72 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has reduced lumbar flexion, tenderness over both sacroiliac joints, and a slightly stooped posture. The peripheral joints show no swelling or effusion.\n\nStudies:\n    ESR / CRP — 32 mm/h / 21 mg/L\n    Hemoglobin / hematocrit — 12.9 g/dL / 39%\n    Albumin — 4.0 g/dL\n    Fecal calprotectin — 55 µg/g\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Sacroiliac and spine imaging with HLA-B27"}, {"letter": "B", "text": "Slit-lamp examination by ophthalmology"}, {"letter": "C", "text": "Wound culture with clinical examination"}, {"letter": "D", "text": "Alkaline phosphatase and GGT with MRCP"}, {"letter": "E", "text": "Clinical examination with CRP and ESR"}], "answer": "A", "explanation": "Pain that is worse with rest, better with exercise, and wakes the patient in the second half of the night is the inflammatory pattern, and the joints to image are the ones that are tender. The inflammatory markers are already back and cannot localize anything.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D2", "pgroup": "IB-D"}, {"id": "26A", "group": 26, "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Bilateral sacroiliitis with erosions and a positive HLA-B27"}, {"letter": "B", "text": "Ciliary flush with photophobia and acuity reduced to 20/60"}, {"letter": "C", "text": "A cholestatic pattern with an alkaline phosphatase of 486 U/L and a GGT of 320 U/L"}, {"letter": "D", "text": "Fewer than six warm swollen large joints with a normal spine"}, {"letter": "E", "text": "An ulcer with a violaceous undermined border and sterile cultures"}], "answer": "A", "explanation": "Sacroiliac tenderness with reduced lumbar flexion and a stooped posture is axial disease, and the erosions with joint-space narrowing are what it looks like on film. HLA-B27 is positive in 50 to 75% of these patients, so it supports the diagnosis without being required for it.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D2", "pgroup": "IB-D"}, {"id": "26B", "group": 26, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Pyoderma gangrenosum"}, {"letter": "B", "text": "Peripheral arthritis of inflammatory bowel disease"}, {"letter": "C", "text": "Erythema nodosum"}, {"letter": "D", "text": "Spondylitis with sacroiliitis"}, {"letter": "E", "text": "Primary sclerosing cholangitis"}], "answer": "D", "explanation": "Axial disease occurs in 5 to 10% of patients with inflammatory bowel disease and is seen more with ulcerative colitis, and left untreated the vertebrae can fuse. Peripheral arthritis involves fewer than six large joints with a normal spine and tracks bowel activity, which this does not.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D2", "pgroup": "IB-D"}, {"id": "26C", "group": 26, "stem": "She has spondylitis with sacroiliitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Corticosteroids with treatment of the underlying bowel disease"}, {"letter": "B", "text": "Hepatology referral with continued bowel-directed maintenance"}, {"letter": "C", "text": "Exercise and physical therapy with a scheduled NSAID"}, {"letter": "D", "text": "Escalation of her bowel-directed maintenance therapy"}, {"letter": "E", "text": "Exercise and physical therapy with a TNF inhibitor"}], "answer": "E", "explanation": "Symptoms improve with activity, so movement is treatment rather than something to avoid, and a TNF inhibitor covers both the spine and the bowel. NSAIDs are the reflex drug for inflammatory back pain and the one to withhold here, since they trigger colitis flares. Escalating bowel-directed therapy alone will not settle the back — her colitis is already in remission.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D2", "pgroup": "IB-D"}, {"id": "27", "group": 27, "stem": "A 30-year-old man presents to the emergency department with two days of blurred vision and photophobia in the left eye, with a dull headache and aching eye pain. He has Crohn's ileocolitis of six years, quiescent on ustekinumab, and had peripheral arthritis two years ago. His temperature is 36.9°C (98.4°F), blood pressure is 124/76 mm Hg, pulse is 82/min, respirations are 14/min, and oxygen saturation is 99% on room air. There is ciliary flush of the left eye with a sluggish, slightly constricted left pupil and marked photophobia. Visual acuity is 20/60 on the left and 20/20 on the right, and the right eye is white and quiet.\n\nStudies:\n    Intraocular pressure — 16 mm Hg in each eye\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Urgent ophthalmology referral for slit-lamp examination"}, {"letter": "B", "text": "Sacroiliac and spine imaging with HLA-B27"}, {"letter": "C", "text": "Clinical examination with CRP and ESR"}, {"letter": "D", "text": "Wound culture with clinical examination"}, {"letter": "E", "text": "Alkaline phosphatase and GGT"}], "answer": "A", "explanation": "A painful red eye with photophobia and reduced acuity is the combination that has to be looked at under magnification the same day. Only the slit lamp can see into the anterior chamber, and nothing in a blood panel will change what happens to this eye.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D4", "pgroup": "IB-D"}, {"id": "27A", "group": 27, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Superficial episcleral inflammation with a quiet anterior chamber"}, {"letter": "B", "text": "Tender non-ulcerating nodules 1 to 5 cm on the shins"}, {"letter": "C", "text": "Multifocal bile-duct narrowing with intervening dilation"}, {"letter": "D", "text": "Cells and flare in the anterior chamber"}, {"letter": "E", "text": "Bilateral sacroiliac erosions with joint-space narrowing"}], "answer": "D", "explanation": "Inflammatory cells and protein leaking into the aqueous are what produce photophobia, the sluggish constricted pupil, and the drop in acuity. A quiet chamber under a red surface is the superficial disease, and it neither hurts the vision nor requires urgent treatment.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D4", "pgroup": "IB-D"}, {"id": "27B", "group": 27, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Spondylitis with sacroiliitis"}, {"letter": "B", "text": "Uveitis"}, {"letter": "C", "text": "Episcleritis"}, {"letter": "D", "text": "Pyoderma gangrenosum"}, {"letter": "E", "text": "Erythema nodosum"}], "answer": "B", "explanation": "Photophobia with a change in vision is the pair that separates this from episcleritis, which has neither. It is independent of the bowel course, so a quiescent Crohn's disease on a biologic is no argument against it.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D4", "pgroup": "IB-D"}, {"id": "27C", "group": 27, "stem": "He has uveitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Emergent ophthalmology referral with corticosteroids"}, {"letter": "B", "text": "Ocular lubricants with ophthalmology follow-up in the next clinic"}, {"letter": "C", "text": "Treatment of the underlying bowel disease, with ocular corticosteroids"}, {"letter": "D", "text": "Wound care avoiding debridement, with corticosteroids"}, {"letter": "E", "text": "Exercise and physical therapy with a TNF inhibitor"}], "answer": "A", "explanation": "Untreated, this leads to glaucoma and permanent blindness, so corticosteroids and an ophthalmologist are both needed now. Sending him home on lubricants is the episcleritis pathway applied to the wrong disease, and escalating bowel therapy will not touch an eye that is inflamed independently of the colitis.", "objective": "", "section": "extraintestinal manifestations running a course independent of the bowel", "pcase": "IB-D4", "pgroup": "IB-D"}, {"id": "28", "group": 28, "stem": "A 54-year-old woman comes to the gastroenterology clinic with eight months of vague, intermittent crampy periumbilical pain. Every few weeks the pain builds over an hour, her abdomen bloats, she vomits once or twice, and then everything settles. She is tired and has lost 10 pounds, and she has been treated twice with oral iron for anemia. Upper endoscopy and colonoscopy were both normal a year ago. She has no Crohn's disease, no celiac disease, and no familial polyposis. Her temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 98/min, respirations are 16/min, and oxygen saturation is 98% on room air. Her conjunctivae are pale and her abdomen is soft with mild periumbilical tenderness and no palpable mass. Her stool is heme-positive.\n\nStudies:\n    Hemoglobin / hematocrit — 9.4 g/dL / 28%\n    MCV — 72 fL\n    Ferritin — 6 ng/mL\n    Platelets — 402,000/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Small bowel follow-through"}, {"letter": "B", "text": "Tagged red-blood-cell scintigraphy"}, {"letter": "C", "text": "Upper endoscopy for a duodenal lesion"}, {"letter": "D", "text": "CT or MR enterography"}, {"letter": "E", "text": "Twenty-four-hour urinary 5-HIAA"}], "answer": "D", "explanation": "Both ends of the gut have already been scoped and were normal, which leaves the segment a standard scope cannot reach. Enterography images the small-bowel wall and the lumen at once. A small bowel follow-through is not the study for gastrointestinal bleeding, and scintigraphy is for slow bleeding that has no identified source.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B1", "pgroup": "MA-B"}, {"id": "28A", "group": 28, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "An ulcerated circumferential mass in the second duodenum at the ampulla"}, {"letter": "B", "text": "A 2-cm smooth yellowish submucosal ileal lesion without ulceration"}, {"letter": "C", "text": "Bowel-wall thickening with a mass at the ileocecal valve"}, {"letter": "D", "text": "An 8-cm exophytic jejunal mass with central necrosis"}, {"letter": "E", "text": "A 3.5-cm jejunal mass with proximal dilation and an oozing surface"}], "answer": "E", "explanation": "A lesion that narrows the lumen episodically explains pain that builds, bloats, vomits, and then settles, while a bleeding surface explains iron deficiency that keeps recurring through two courses of oral iron. Dilated bowel above it locates the level.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B1", "pgroup": "MA-B"}, {"id": "28B", "group": 28, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Double-balloon enteroscopy with biopsy"}, {"letter": "B", "text": "Repeat video capsule endoscopy"}, {"letter": "C", "text": "Twenty-four-hour urinary 5-HIAA"}, {"letter": "D", "text": "Ileocolonoscopy with biopsy"}, {"letter": "E", "text": "CT angiography of the abdomen"}], "answer": "A", "explanation": "Capsule endoscopy visualizes only — it cannot biopsy and cannot treat — so it never substitutes for enteroscopy once tissue is what is needed. Double-balloon enteroscopy reaches deep jejunal lesions and samples them. CT angiography answers a different question, which is where acute obscure bleeding is coming from.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B1", "pgroup": "MA-B"}, {"id": "28C", "group": 28, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small intestine tumor with histology pending"}, {"letter": "B", "text": "Small-bowel leiomyosarcoma"}, {"letter": "C", "text": "Benign small intestine lipoma"}, {"letter": "D", "text": "Carcinoid tumor of the small bowel"}, {"letter": "E", "text": "Small-bowel adenocarcinoma"}], "answer": "A", "explanation": "Small-bowel tumors sit beyond the reach of a standard scope, which is why they are found late and usually in the workup of obscure bleeding. Until the biopsy returns, the cell type is undetermined; a lipoma would be an incidental submucosal lesion in a patient with a normal hemoglobin.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B1", "pgroup": "MA-B"}, {"id": "29", "group": 29, "stem": "A 55-year-old woman presents to the emergency department with six weeks of crampy mid-abdominal pain and three days of melena, with a 12-pound weight loss. She has no hereditary cancer syndrome and no family history of cancer, and takes no anticoagulants. Her temperature is 36.9°C (98.4°F), blood pressure is 108/68 mm Hg, pulse is 104/min, respirations are 16/min, and oxygen saturation is 98% on room air. She has a palpable non-tender mass in the left mid-abdomen and pallor, with heme-positive melenic stool and no peritoneal signs.\n\nStudies:\n    Hemoglobin / hematocrit — 8.6 g/dL / 26%\n    MCV — 74 fL\n    Ferritin — 9 ng/mL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Enteroscopy of the small bowel"}, {"letter": "B", "text": "Twenty-four-hour urinary 5-HIAA"}, {"letter": "C", "text": "Ileocolonoscopy with biopsy"}, {"letter": "D", "text": "Upper endoscopy for a duodenal lesion"}, {"letter": "E", "text": "CT of the small bowel"}], "answer": "E", "explanation": "There is already a mass to be felt through the abdominal wall, so the study that matters is the one that shows its size, its origin, and what it is doing to the surrounding bowel. Endoscopy from either end will not reach a bulky lesion growing outward from the mid jejunum.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B4", "pgroup": "MA-B"}, {"id": "29A", "group": 29, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A 3.5-cm jejunal mass with proximal dilation and an oozing surface"}, {"letter": "B", "text": "A 2-cm smooth yellowish submucosal ileal lesion without ulceration"}, {"letter": "C", "text": "An ulcerated circumferential mass in the second duodenum at the ampulla"}, {"letter": "D", "text": "An 8-cm exophytic jejunal mass with central necrosis"}, {"letter": "E", "text": "Bowel-wall thickening with a mass at the ileocecal valve"}], "answer": "D", "explanation": "A tumour large enough to be palpated grows outward rather than around the lumen, which is why she bleeds heavily but never obstructs. Outgrowing its own blood supply is what leaves the centre necrotic.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B4", "pgroup": "MA-B"}, {"id": "29B", "group": 29, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small-bowel lymphoma"}, {"letter": "B", "text": "Benign small intestine lipoma"}, {"letter": "C", "text": "Small-bowel adenocarcinoma"}, {"letter": "D", "text": "Carcinoid tumor of the small bowel"}, {"letter": "E", "text": "Small-bowel leiomyosarcoma"}], "answer": "E", "explanation": "A bulky exophytic jejunal mass with central necrosis presenting with frank melena is the smooth-muscle malignancy, the malignant counterpart of the benign leiomyoma. Adenocarcinoma is duodenal and obstructive, and carcinoid brings flushing and secretory diarrhea.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B4", "pgroup": "MA-B"}, {"id": "29C", "group": 29, "stem": "She has a small-bowel leiomyosarcoma. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Anti-inflammatory therapy with stricture management"}, {"letter": "B", "text": "Systemic therapy determined by the histologic type"}, {"letter": "C", "text": "Surgical resection with chemotherapy"}, {"letter": "D", "text": "Surgical resection"}, {"letter": "E", "text": "Observation, with resection only for symptoms"}], "answer": "D", "explanation": "The lesion is malignant, symptomatic, and bleeding, and resection is the treatment. Combined resection with chemotherapy belongs to lymphoma, and observation belongs to benign incidental lesions.", "objective": "", "section": "small-bowel mass: crampy pain, partial obstruction, and occult GI bleeding", "pcase": "MA-B4", "pgroup": "MA-B"}, {"id": "30", "group": 30, "stem": "A 58-year-old African-American woman comes to the primary care clinic because her bowels have changed over the past three months. She alternates between loose stools and several days of constipation, and she has seen blood mixed into the stool four or five times. She is tired and short of breath climbing stairs. An adenomatous polyp was removed nine years ago and she never returned for the follow-up colonoscopy. Her mother had colon cancer at 62. She has no inflammatory bowel disease. Her temperature is 36.7°C (98.1°F), blood pressure is 132/80 mm Hg, pulse is 92/min, respirations are 14/min, and oxygen saturation is 98% on room air. She is pale, her abdomen is soft with no palpable mass and no hepatomegaly, and her stool is heme-positive on rectal examination.\n\nStudies:\n    Hemoglobin / hematocrit — 10.0 g/dL / 30%\n    MCV — 74 fL\n    Ferritin — 9 ng/mL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Barium enema"}, {"letter": "B", "text": "Serum CEA"}, {"letter": "C", "text": "CT of the abdomen and pelvis"}, {"letter": "D", "text": "Colonoscopy with biopsy"}, {"letter": "E", "text": "Germline mismatch-repair gene testing"}], "answer": "D", "explanation": "Colonoscopy is the only study that is simultaneously diagnostic and therapeutic, and it is what a change in bowel habit with hematochezia and iron deficiency requires. CEA is a baseline and surveillance marker, never a diagnostic or screening test, and barium enema is no longer recommended.", "objective": "", "section": "change in bowel habit, hematochezia, or iron deficiency anemia in an adult", "pcase": "MA-E1", "pgroup": "MA-E"}, {"id": "30A", "group": 30, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "An encircling mass in the descending colon"}, {"letter": "B", "text": "A 14-mm pedunculated sigmoid polyp with no mass"}, {"letter": "C", "text": "A fungating polypoid cecal mass with a ferritin of 4 ng/mL"}, {"letter": "D", "text": "Multiple sigmoid diverticular orifices with no mass"}, {"letter": "E", "text": "An annular constricting sigmoid mass with a 9.5-cm cecum"}], "answer": "A", "explanation": "The left colon is narrower and its stool already formed, so a circumferential tumour there changes stool caliber and bleeds visibly long before it obstructs. A right-sided lesion sits in a wide lumen with liquid stool and bleeds occultly instead, presenting as anemia alone.", "objective": "", "section": "change in bowel habit, hematochezia, or iron deficiency anemia in an adult", "pcase": "MA-E1", "pgroup": "MA-E"}, {"id": "30B", "group": 30, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Colorectal adenomatous polyp"}, {"letter": "B", "text": "Right-sided colon cancer"}, {"letter": "C", "text": "Colon cancer of the descending colon"}, {"letter": "D", "text": "Obstructing left-sided colon cancer"}, {"letter": "E", "text": "Lynch syndrome"}], "answer": "C", "explanation": "A change in bowel habits is the presenting symptom in 74% of colorectal cancers and hematochezia in 51%, and an adenoma removed nine years ago with no follow-up is the missed opportunity. She is still passing stool and flatus, so the tumour narrows the lumen without obstructing it.", "objective": "", "section": "change in bowel habit, hematochezia, or iron deficiency anemia in an adult", "pcase": "MA-E1", "pgroup": "MA-E"}, {"id": "30C", "group": 30, "stem": "She has an adenocarcinoma of the descending colon. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Right hemicolectomy with lymphadenectomy"}, {"letter": "B", "text": "A high-fiber diet with no resection"}, {"letter": "C", "text": "Endoscopic polypectomy of the lesion"}, {"letter": "D", "text": "Oncologic resection of the involved segment"}, {"letter": "E", "text": "Extended colectomy with lifelong surveillance"}], "answer": "D", "explanation": "Resection is the only curative option, and an oncologic resection means the segment with its mesentery and lymphatic drainage taken to the origin of the feeding vessel, with negative proximal, distal, and radial margins. Extended colectomy with lifelong surveillance is the operation for a germline mismatch-repair defect, not for a sporadic left-sided tumour.", "objective": "", "section": "change in bowel habit, hematochezia, or iron deficiency anemia in an adult", "pcase": "MA-E1", "pgroup": "MA-E"}], "pool": [{"case": "ES-C4", "group": "ES-C", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "objective": "", "vignette_workup": "A 24-year-old man is referred to the gastroenterology clinic with two years of difficulty swallowing solid food. Meat and rice hang up in his chest and he drinks constantly through a meal. He has had two episodes of food impaction, one of which required endoscopic removal. He also has heartburn that did not improve after eight weeks of a proton pump inhibitor. He has had asthma since childhood, seasonal allergic rhinitis, and a known peanut allergy, and his brother has eczema. His temperature is 36.5°C (97.7°F), blood pressure is 118/68 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has had no weight loss, and his examination is normal, with no pallor, no oral thrush, and no cervical adenopathy.", "labs_workup": [["Upper endoscopy", "Concentric rings through the length of the esophagus, linear furrows, and scattered white exudates; a mid-esophageal narrowing the scope passes with resistance"]], "vignette_recog": "A 24-year-old man is referred to the gastroenterology clinic with two years of difficulty swallowing solid food. Meat and rice hang up in his chest and he drinks constantly through a meal. He has had two episodes of food impaction, one of which required endoscopic removal. He also has heartburn that did not improve after eight weeks of a proton pump inhibitor. He has had asthma since childhood, seasonal allergic rhinitis, and a known peanut allergy, and his brother has eczema. His temperature is 36.5°C (97.7°F), blood pressure is 118/68 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has had no weight loss, and his examination is normal, with no pallor, no oral thrush, and no cervical adenopathy.", "labs_recog": [["Upper endoscopy", "Concentric rings through the length of the esophagus, linear furrows, and scattered white exudates; a mid-esophageal narrowing the scope passes with resistance"], ["Esophageal biopsy histology", "42 eosinophils per high-power field in both the proximal and distal biopsies"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Biopsy histology with staging CT"}, {"letter": "B", "text": "High-resolution esophageal manometry"}, {"letter": "C", "text": "Esophageal biopsy histology"}, {"letter": "D", "text": "CBC with iron studies"}, {"letter": "E", "text": "Repeat endoscopy with dilation of the narrowed segment"}], "answer": "C", "explanation": "Rings, furrows, and exudates are suggestive but not diagnostic, and the endoscopic appearance is normal in a substantial minority of these patients. Tissue from both the proximal and the distal esophagus is what settles the question, which is why at least six biopsies are taken at the index endoscopy. Dilation treats a narrowing without ever explaining it."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "42 eosinophils per high-power field"}, {"letter": "B", "text": "Benign narrowing with biopsies excluding malignancy"}, {"letter": "C", "text": "Hemoglobin 9.6 g/dL with an MCV of 71 fL and a ferritin of 6 ng/mL"}, {"letter": "D", "text": "A thin mucosal ring at the gastroesophageal junction with no stricture or mass"}, {"letter": "E", "text": "Absent peristalsis with incomplete lower esophageal sphincter relaxation"}], "answer": "A", "explanation": "The disease is defined by esophageal dysfunction plus eosinophil-predominant histology, and the threshold is more than 15 eosinophils per high-power field. Sampling both levels matters because the infiltrate is patchy, and a count this high in both proximal and distal biopsies separates it from the scattered eosinophils of reflux."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Achalasia"}, {"letter": "B", "text": "Schatzki ring at the gastroesophageal junction"}, {"letter": "C", "text": "Peptic stricture"}, {"letter": "D", "text": "Esophageal web with Plummer-Vinson syndrome"}, {"letter": "E", "text": "Eosinophilic esophagitis"}], "answer": "E", "explanation": "A young man with asthma, allergic rhinitis, food allergy, and a family history of eczema who has heartburn refractory to a proton pump inhibitor fits the atopic pattern of this disease. A peptic stricture is a single scarred distal narrowing, and a Schatzki ring gives episodic, non-progressive impaction rather than two years of steadily worsening solid dysphagia."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Achalasia"}, {"letter": "B", "text": "Schatzki ring at the gastroesophageal junction"}, {"letter": "C", "text": "Peptic stricture"}, {"letter": "D", "text": "Eosinophilic esophagitis"}, {"letter": "E", "text": "Esophageal web with Plummer-Vinson syndrome"}], "answer": "D", "explanation": "Esophageal dysfunction with an eosinophil-predominant infiltrate above 15 per high-power field is the definition of the disease, and the atopic history is the classic clue. A peptic stricture yields benign fibrotic tissue, and an esophageal web is a cervical lesion accompanied by iron deficiency."}, {"key": "mgmt", "path": "both", "stem": "He has eosinophilic esophagitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Oncologic staging with surgical resection"}, {"letter": "B", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "C", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "D", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "E", "text": "Endoscopic dilation with dietary modification"}], "answer": "C", "explanation": "The disease is antigen driven, so removing the antigen and quieting the eosinophilic inflammation is the treatment; a proton pump inhibitor is added for coexisting or mimicking reflux rather than as the sole therapy. The fluticasone is delivered from an inhaler but is sprayed into the mouth and swallowed — inhaling it delivers nothing to the esophagus. Dilating a rigid esophagus relieves the narrowing without touching the inflammation that produced it."}, {"key": "escalate", "path": "both", "stem": "After several months of dietary elimination and swallowed topical fluticasone his solid-food dysphagia persists and the mid-esophageal narrowing is unchanged. Which of the following should be done next?", "options": [{"letter": "A", "text": "Oral iron replacement"}, {"letter": "B", "text": "Oncologic staging with surgical resection"}, {"letter": "C", "text": "A daily proton pump inhibitor alone"}, {"letter": "D", "text": "Esophageal dilation of the narrowed segment"}, {"letter": "E", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}], "answer": "D", "explanation": "Once medical therapy has failed to open a fixed stricture, dilation is what restores the lumen. It is directed at the narrowed esophageal segment, not at the lower esophageal sphincter, which is the target in a motility disorder rather than a fibrostenotic one."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to obtaining esophageal biopsies when this disease is suspected?", "options": [{"letter": "A", "text": "Biopsy the proximal and distal esophagus whenever it is suspected"}, {"letter": "B", "text": "Biopsy only when rings or linear furrows are seen at endoscopy"}, {"letter": "C", "text": "Biopsy only in patients with a history of atopy"}
