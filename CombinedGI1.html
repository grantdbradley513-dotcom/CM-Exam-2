, {"letter": "D", "text": "Biopsy only when heartburn has failed a proton pump inhibitor"}, {"letter": "E", "text": "Biopsy only after an episode of food impaction"}], "answer": "A", "explanation": "Rings appear in roughly 44% of patients and linear furrows in about 48%, so a normal-looking esophagus does not exclude the diagnosis and biopsies are taken regardless of the endoscopic appearance. Waiting for an impaction, for atopy, or for a failed proton pump inhibitor trial each misses a large share of cases."}]}, {"case": "ES-D3", "group": "ES-D", "section": "chronic heartburn and what years of it produce", "objective": "", "vignette_workup": "A 72-year-old woman comes to the primary care clinic with a year of substernal and epigastric pressure after meals. She feels full after only a few bites and sometimes retches. She has little heartburn and only rare regurgitation. She had chronic gastroesophageal reflux years ago that has since quieted. She has obesity with a body mass index of 34 kg/m² and hypertension treated with metoprolol. Her temperature is 36.6°C (97.9°F), blood pressure is 136/78 mm Hg, pulse is 72/min, respirations are 16/min, and oxygen saturation is 97% on room air. Her abdomen is soft and non-tender with no epigastric mass, she is not pale, and there is no crepitus.", "labs_workup": [["Upper endoscopy", "No erosive esophagitis, no Barrett's mucosa, and no mass"]], "vignette_recog": "A 72-year-old woman comes to the primary care clinic with a year of substernal and epigastric pressure after meals. She feels full after only a few bites and sometimes retches. She has little heartburn and only rare regurgitation. She had chronic gastroesophageal reflux years ago that has since quieted. She has obesity with a body mass index of 34 kg/m² and hypertension treated with metoprolol. Her temperature is 36.6°C (97.9°F), blood pressure is 136/78 mm Hg, pulse is 72/min, respirations are 16/min, and oxygen saturation is 97% on room air. Her abdomen is soft and non-tender with no epigastric mass, she is not pale, and there is no crepitus.", "labs_recog": [["Upper endoscopy", "No erosive esophagitis, no Barrett's mucosa, and no mass"], ["Barium swallow", "Herniation of the stomach through the esophageal hiatus, with gastric folds above the diaphragmatic pinch and the gastroesophageal junction remaining below it"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Upper endoscopy with four-quadrant biopsies"}, {"letter": "B", "text": "Upper endoscopy with proximal and distal esophageal biopsies"}, {"letter": "C", "text": "Ambulatory esophageal pH study"}, {"letter": "D", "text": "An empiric proton pump inhibitor trial for 8 weeks"}, {"letter": "E", "text": "Barium swallow"}], "answer": "E", "explanation": "Endoscopy has already excluded mucosal disease, and mechanical postprandial fullness in an older woman points to an anatomic problem at the hiatus that endoscopy visualizes poorly. Contrast radiography is the most sensitive study for it. A pH study and a therapeutic trial both answer a reflux question she is not asking."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Gastric folds above the diaphragmatic pinch with the gastroesophageal junction below it"}, {"letter": "B", "text": "A smooth, tapered, concentric distal narrowing 1 to 4 cm long"}, {"letter": "C", "text": "Confluent linear erosions in the distal esophagus"}, {"letter": "D", "text": "Salmon-colored mucosa extending 4 cm above the gastroesophageal junction"}, {"letter": "E", "text": "Concentric rings and linear furrows with white exudates"}], "answer": "A", "explanation": "When the stomach herniates alongside an esophagus whose junction stays below the diaphragm, the configuration is paraesophageal rather than sliding. That is why she has mechanical fullness and early satiety with almost no reflux — the sphincter has not been displaced."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peptic stricture"}, {"letter": "B", "text": "Barrett's esophagus"}, {"letter": "C", "text": "Gastroesophageal reflux disease"}, {"letter": "D", "text": "Erosive reflux esophagitis"}, {"letter": "E", "text": "Paraesophageal hiatal hernia"}], "answer": "E", "explanation": "Postprandial pressure, early satiety, and retching with little heartburn are the mechanical presentation of a herniated stomach rather than an acid one. Barrett's and erosive esophagitis were both excluded endoscopically, and a peptic stricture would give progressive solid-food dysphagia."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gastroesophageal reflux disease"}, {"letter": "B", "text": "Paraesophageal hiatal hernia"}, {"letter": "C", "text": "Erosive reflux esophagitis"}, {"letter": "D", "text": "Barrett's esophagus"}, {"letter": "E", "text": "Peptic stricture"}], "answer": "B", "explanation": "Gastric folds above the diaphragmatic pinch with the gastroesophageal junction still below it is a type III paraesophageal hernia, not a type I sliding one. Sliding hernias present with reflux; paraesophageal hernias cause less reflux and more mechanical and obstructive symptoms, which is exactly her complaint."}, {"key": "mgmt", "path": "both", "stem": "She has a symptomatic paraesophageal hiatal hernia. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Long-term daily proton pump inhibitor with endoscopic surveillance"}, {"letter": "B", "text": "Lifestyle change with a daily proton pump inhibitor for 8 weeks"}, {"letter": "C", "text": "Hiatal hernia repair with fundoplication"}, {"letter": "D", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "E", "text": "Endoscopic dilation with a daily proton pump inhibitor"}], "answer": "C", "explanation": "A paraesophageal hernia that is causing symptoms is repaired, because the benefit of repair outweighs its risk and the anatomy will not be corrected medically. Acid suppression is the answer for a sliding hernia managed as reflux, and long-term proton pump inhibitor therapy carries its own burden — infection risk and magnesium, B12, iron, and calcium malabsorption that must be monitored past a year."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to surgical repair of a hiatal hernia?", "options": [{"letter": "A", "text": "Repair a paraesophageal hernia once it becomes symptomatic"}, {"letter": "B", "text": "Repair a hiatal hernia only when reflux symptoms are severe"}, {"letter": "C", "text": "Repair a paraesophageal hernia only after bleeding or obstruction has occurred"}, {"letter": "D", "text": "Repair every hiatal hernia at the time it is found"}, {"letter": "E", "text": "Repair a sliding hernia when heartburn persists on a proton pump inhibitor"}], "answer": "A", "explanation": "Sliding type I hernias behave like reflux disease and are managed with lifestyle measures and acid suppression; paraesophageal types II through V are repaired when they cause symptoms. Waiting for volvulus, bleeding, or obstruction means operating on an emergency instead of an elective basis."}]}, {"case": "ES-F2", "group": "ES-F", "section": "blood, pain, or air after the vomiting starts", "objective": "", "vignette_workup": "A 55-year-old man is brought to the emergency department with sudden severe tearing retrosternal chest pain that began five hours ago during a bout of violent retching. He is short of breath, is still vomiting, and now feels faint. He drank heavily the evening before and vomited repeatedly through the night. He has no cardiac history and has had no recent endoscopy or dilation. His temperature is 38.6°C (101.5°F), blood pressure is 88/54 mm Hg, pulse is 124/min, respirations are 28/min, and oxygen saturation is 91% on room air. There is crepitus over the suprasternal notch and the left anterior chest, his extremities are cool and mottled with delayed capillary refill, and a crunching sound synchronous with the heartbeat is heard on auscultation.", "labs_workup": [["Chest radiograph", "Mediastinal widening, pneumomediastinum, a left pleural effusion, and subcutaneous emphysema in the neck"], ["WBC", "19,400/mm³"], ["Hemoglobin / hematocrit", "14.2 g/dL / 43%"], ["Platelets", "210,000/mm³"], ["BUN / creatinine", "26 mg/dL / 1.6 mg/dL"], ["Amylase / lipase", "210 U/L / 42 U/L"]], "vignette_recog": "A 55-year-old man is brought to the emergency department with sudden severe tearing retrosternal chest pain that began five hours ago during a bout of violent retching. He is short of breath, is still vomiting, and now feels faint. He drank heavily the evening before and vomited repeatedly through the night. He has no cardiac history and has had no recent endoscopy or dilation. His temperature is 38.6°C (101.5°F), blood pressure is 88/54 mm Hg, pulse is 124/min, respirations are 28/min, and oxygen saturation is 91% on room air. There is crepitus over the suprasternal notch and the left anterior chest, his extremities are cool and mottled with delayed capillary refill, and a crunching sound synchronous with the heartbeat is heard on auscultation. Resuscitation is begun and he is taken for urgent imaging.", "labs_recog": [["Chest radiograph", "Mediastinal widening, pneumomediastinum, a left pleural effusion, and subcutaneous emphysema in the neck"], ["WBC", "19,400/mm³"], ["BUN / creatinine", "26 mg/dL / 1.6 mg/dL"], ["Amylase / lipase", "210 U/L / 42 U/L"], ["CT of the chest with oral water-soluble contrast", "Contrast extravasation from the distal left posterolateral esophagus, with mediastinal air and fluid tracking into the left pleural space"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Esophageal biopsy histology"}, {"letter": "B", "text": "Repeat upper endoscopy after endoscopic therapy"}, {"letter": "C", "text": "Urgent upper endoscopy"}, {"letter": "D", "text": "Barium esophagram"}, {"letter": "E", "text": "CT of the chest with water-soluble contrast"}], "answer": "E", "explanation": "A water-soluble agent must be requested by name, because the default contrast order is barium and barium spilled into the mediastinum causes mediastinitis. Endoscopy is contraindicated in known or suspected perforation, and imaging must not be allowed to postpone the surgical call — mortality climbs with every hour of delay."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "An ulcer base without further bleeding stigmata"}, {"letter": "B", "text": "Contrast extravasation from the distal esophagus into the mediastinum"}, {"letter": "C", "text": "Dilated submucosal veins with red wale signs, actively oozing"}, {"letter": "D", "text": "A single longitudinal mucosal tear at the gastroesophageal junction with normal adjacent mucosa"}, {"letter": "E", "text": "Reflux change without eosinophilia or viral inclusions"}], "answer": "B", "explanation": "A barogenic rupture tears the full thickness of the wall, usually at the distal left posterolateral esophagus, so contrast escapes the lumen entirely. A mucosal tear stops short of the muscular layer and leaks nothing; that is the whole distinction between the two diseases."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Erosive reflux esophagitis"}, {"letter": "B", "text": "Mallory-Weiss tear"}, {"letter": "C", "text": "Iatrogenic esophageal perforation after dilation"}, {"letter": "D", "text": "Boerhaave syndrome"}, {"letter": "E", "text": "Esophageal varices"}], "answer": "D", "explanation": "Vomiting, severe retrosternal pain, and subcutaneous emphysema are the Mackler triad, and the crunching sound synchronous with the heartbeat is the Hamman sign. A Mallory-Weiss tear is painless mucosal bleeding without fever or free air, and an iatrogenic perforation follows instrumentation, which he has not had."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Mallory-Weiss tear"}, {"letter": "B", "text": "Boerhaave syndrome"}, {"letter": "C", "text": "Iatrogenic esophageal perforation after dilation"}, {"letter": "D", "text": "Erosive reflux esophagitis"}, {"letter": "E", "text": "Esophageal varices"}], "answer": "B", "explanation": "Contrast leaving the distal esophagus after violent retching is a full-thickness barogenic rupture. The elevated amylase with a normal lipase is a further pointer — an amylase raised without pancreatitis should raise perforation, since lipase is the pancreas-specific enzyme and would be at least three times normal in pancreatitis."}, {"key": "mgmt", "path": "both", "stem": "He has Boerhaave syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with a proton pump inhibitor"}, {"letter": "B", "text": "Long-term daily proton pump inhibitor therapy"}, {"letter": "C", "text": "Emergent surgical repair with broad-spectrum intravenous antibiotics"}, {"letter": "D", "text": "Endoscopic hemostasis with a proton pump inhibitor drip"}, {"letter": "E", "text": "Band ligation with octreotide, ceftriaxone, and a proton pump inhibitor drip"}], "answer": "C", "explanation": "Gastric contents in the mediastinum produce a chemical and then bacterial mediastinitis, so the patient is resuscitated, kept nil by mouth, given piperacillin-tazobactam, and taken to the operating room. Any answer that puts a scope into the esophagus is the trap here — endoscopy is contraindicated once perforation is suspected."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach when the early chest radiograph is normal in suspected esophageal perforation?", "options": [{"letter": "A", "text": "Repeat the film in 24 hours before any contrast study"}, {"letter": "B", "text": "Proceed only once a pleural effusion appears on the film"}, {"letter": "C", "text": "Proceed only once subcutaneous emphysema becomes visible"}, {"letter": "D", "text": "Exclude perforation when no mediastinal air is seen"}, {"letter": "E", "text": "Proceed with a water-soluble contrast study anyway"}], "answer": "E", "explanation": "Mediastinal emphysema may take about an hour to appear, and effusions and mediastinal widening take several hours, so a film taken early can be normal in a patient whose esophagus has already ruptured. Waiting for radiographic signs to declare themselves spends the hours in which mortality is decided."}]}, {"case": "BI-A1", "group": "BI-A", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "objective": "", "vignette_workup": "A 42-year-old woman comes to the primary care clinic for routine follow-up seven months after a sleeve gastrectomy, during which she has lost 30 kg. She has no abdominal pain and has never had an attack after eating. She takes a combined oral contraceptive and has had no prior biliary attacks. Her temperature is 36.8°C (98.2°F), blood pressure is 122/76 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her abdomen is soft and nontender, Murphy's sign is negative, she has no scleral icterus, and no gallbladder is palpable.", "labs_workup": [["WBC", "6,400/mm³"], ["Hemoglobin / hematocrit", "13.2 g/dL / 39.6%"], ["Platelets", "250,000/mm³"], ["AST / ALT", "22 U/L / 19 U/L"], ["Alkaline phosphatase", "68 U/L"], ["Total bilirubin", "0.7 mg/dL"], ["Lipase", "30 U/L"]], "vignette_recog": "A 42-year-old woman comes to the primary care clinic for routine follow-up seven months after a sleeve gastrectomy, during which she has lost 30 kg. She has no abdominal pain and has never had an attack after eating. She takes a combined oral contraceptive and has had no prior biliary attacks. Her temperature is 36.8°C (98.2°F), blood pressure is 122/76 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her abdomen is soft and nontender, Murphy's sign is negative, she has no scleral icterus, and no gallbladder is palpable. An ultrasound is obtained as part of her post-bariatric follow-up.", "labs_recog": [["WBC", "6,400/mm³"], ["AST / ALT", "22 U/L / 19 U/L"], ["Alkaline phosphatase", "68 U/L"], ["Total bilirubin", "0.7 mg/dL"], ["Lipase", "30 U/L"], ["Right upper quadrant ultrasound", "Three mobile echogenic stones in the gallbladder lumen, the largest 9 mm, each casting a posterior acoustic shadow; gallbladder wall 2 mm, no pericholecystic fluid, common bile duct 4 mm, negative sonographic Murphy's sign"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Endoscopic retrograde cholangiopancreatography"}, {"letter": "B", "text": "HIDA scan with a CCK-stimulated ejection fraction"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "MRCP"}, {"letter": "E", "text": "HIDA scan"}], "answer": "C", "explanation": "Ultrasound is the first study of the gallbladder and the one this post-bariatric follow-up calls for: it is quick, needs no radiation or contrast, and answers whether stones, sludge, wall thickening, or ductal dilation are present. Nuclear and ductal studies address questions that only arise once the ultrasound has been seen."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Stones with a 5 mm wall, pericholecystic fluid, and a positive sonographic Murphy's sign"}, {"letter": "B", "text": "Mobile shadowing stones with a 2 mm wall and a negative sonographic Murphy's sign"}, {"letter": "C", "text": "No stones and no sludge, with a 2 mm wall and normal laboratory studies"}, {"letter": "D", "text": "A contracted gallbladder with a 4 mm wall packed with stones"}, {"letter": "E", "text": "A common bile duct dilated to 9 mm with a cholestatic liver enzyme pattern"}], "answer": "B", "explanation": "Rapid weight loss after bariatric surgery, obesity, and estrogen exposure all supersaturate bile with cholesterol, and cholesterol stones account for about 75% of gallstones. A stone shadows because it is dense enough to block the beam — sludge is echogenic but casts no shadow, which is what separates a precursor from a stone."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cholelithiasis"}, {"letter": "B", "text": "Biliary colic"}, {"letter": "C", "text": "Chronic cholecystitis"}, {"letter": "D", "text": "Biliary dyskinesia"}, {"letter": "E", "text": "Acute cholecystitis"}], "answer": "A", "explanation": "Stones without symptoms are cholelithiasis and nothing more; about 80% of people with gallstones never develop symptoms. Biliary colic requires an attack of pain, and acute and chronic cholecystitis require a thickened or contracted gallbladder wall, neither of which she has."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cholelithiasis"}, {"letter": "B", "text": "Biliary colic"}, {"letter": "C", "text": "Chronic cholecystitis"}, {"letter": "D", "text": "Biliary dyskinesia"}, {"letter": "E", "text": "Acute cholecystitis"}], "answer": "A", "explanation": "A thin wall, no pericholecystic fluid, a normal duct, and a negative sonographic Murphy's sign in a patient who has never had an attack describe silent stones. Biliary dyskinesia is the label for gallbladder pain without stones, so the presence of stones excludes it here."}, {"key": "mgmt", "path": "both", "stem": "She has asymptomatic cholelithiasis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Antibiotics with cholecystectomy in 24 to 48 hours"}, {"letter": "B", "text": "ERCP with sphincterotomy, followed by cholecystectomy"}, {"letter": "C", "text": "Observation with routine follow-up"}, {"letter": "D", "text": "Dietary fat avoidance with analgesia"}, {"letter": "E", "text": "Elective laparoscopic cholecystectomy"}], "answer": "C", "explanation": "Cholecystectomy is not recommended for gallstones in the absence of symptoms or complications, because the overall risk of a complication developing is low. Operating on silent stones exposes her to the risks of surgery for a disease that in most people never declares itself."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to cholecystectomy in a patient found to have gallstones?", "options": [{"letter": "A", "text": "Operate once the largest stone exceeds 9 mm"}, {"letter": "B", "text": "Operate only once the stones cause symptoms or a complication"}, {"letter": "C", "text": "Operate on every patient after rapid weight loss from bariatric surgery"}, {"letter": "D", "text": "Operate on every patient in whom stones are found"}, {"letter": "E", "text": "Operate on every patient taking a combined oral contraceptive"}], "answer": "B", "explanation": "Symptoms and complications are what convert a gallbladder into a surgical problem, and about 80% of stone carriers never reach that point. Stone size, contraceptive use, and recent bariatric surgery are risk factors for forming stones, not indications to remove a gallbladder that has never hurt."}]}, {"case": "BI-A3", "group": "BI-A", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "objective": "", "vignette_workup": "A 61-year-old man comes to the primary care clinic with two years of recurrent dull right upper quadrant pain after fatty meals, occurring more often over the last few months, with bloating and fatty food intolerance. He feels well between attacks. Gallstones were documented on an ultrasound three years ago, and he has had several prior attacks including one emergency department visit. He takes metformin for type 2 diabetes. His temperature is 36.7°C (98.1°F), blood pressure is 130/78 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. His abdomen is soft with no right upper quadrant tenderness today, Murphy's sign is negative, and he is not jaundiced.", "labs_workup": [["WBC", "6,900/mm³"], ["AST / ALT", "26 U/L / 24 U/L"], ["Alkaline phosphatase", "82 U/L"], ["Total bilirubin", "0.6 mg/dL"]], "vignette_recog": "A 61-year-old man comes to the primary care clinic with two years of recurrent dull right upper quadrant pain after fatty meals, occurring more often over the last few months, with bloating and fatty food intolerance. He feels well between attacks. Gallstones were documented on an ultrasound three years ago, and he has had several prior attacks including one emergency department visit. He takes metformin for type 2 diabetes. His temperature is 36.7°C (98.1°F), blood pressure is 130/78 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. His abdomen is soft with no right upper quadrant tenderness today, Murphy's sign is negative, and he is not jaundiced.", "labs_recog": [["WBC", "6,900/mm³"], ["AST / ALT", "26 U/L / 24 U/L"], ["Alkaline phosphatase", "82 U/L"], ["Total bilirubin", "0.6 mg/dL"], ["Right upper quadrant ultrasound", "Multiple shadowing stones filling a contracted gallbladder with the wall thickened to 4 mm; no pericholecystic fluid, common bile duct 5 mm, negative sonographic Murphy's sign"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HIDA scan with a CCK-stimulated ejection fraction"}, {"letter": "B", "text": "MRCP"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "HIDA scan"}, {"letter": "E", "text": "Endoscopic retrograde cholangiopancreatography"}], "answer": "C", "explanation": "Ultrasound remains the opening study for recurrent right upper quadrant pain, because it shows stones, wall thickness, pericholecystic fluid, and ductal caliber in one pass. The nuclear and ductal studies exist to answer questions the ultrasound raises rather than to replace it."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Stones with a 5 mm wall, pericholecystic fluid, and a positive sonographic Murphy's sign"}, {"letter": "B", "text": "A common bile duct dilated to 9 mm with a cholestatic liver enzyme pattern"}, {"letter": "C", "text": "No stones and no sludge, with a 2 mm wall and normal laboratory studies"}, {"letter": "D", "text": "A contracted gallbladder with a 4 mm wall filled with shadowing stones"}, {"letter": "E", "text": "Mobile shadowing stones with a 2 mm wall and no pericholecystic fluid"}], "answer": "D", "explanation": "Repeated mechanical irritation from stones and repeated attacks of inflammation scar the gallbladder, so the wall thickens and the organ contracts around its contents. The wall is thickened but the patient is afebrile with a normal white count and a negative sonographic Murphy's sign, which is what keeps this out of the acute category."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "MRCP"}, {"letter": "B", "text": "Endoscopic retrograde cholangiopancreatography"}, {"letter": "C", "text": "Repeat right upper quadrant ultrasound"}, {"letter": "D", "text": "HIDA scan"}, {"letter": "E", "text": "HIDA scan with a CCK-stimulated ejection fraction"}], "answer": "D", "explanation": "When the clinical picture is unclear a hepatobiliary scan is the study that adds information, showing delayed gallbladder filling rather than the complete non-visualization of acute disease. A CCK-stimulated ejection fraction answers a different question — whether a stoneless gallbladder empties — and ductal studies look for a problem the normal bilirubin has already argued against."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute cholecystitis"}, {"letter": "B", "text": "Chronic cholecystitis"}, {"letter": "C", "text": "Cholelithiasis"}, {"letter": "D", "text": "Biliary dyskinesia"}, {"letter": "E", "text": "Biliary colic"}], "answer": "B", "explanation": "Years of attacks with fatty food intolerance and a fibrotic, contracted, thick-walled gallbladder describe chronic inflammatory change; the term itself is histopathologic and the specimen is what proves it. Silent cholelithiasis has a thin wall and no attacks, and acute cholecystitis brings fever, leukocytosis, and pain lasting beyond six hours."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Biliary dyskinesia"}, {"letter": "B", "text": "Chronic cholecystitis"}, {"letter": "C", "text": "Acute cholecystitis"}, {"letter": "D", "text": "Biliary colic"}, {"letter": "E", "text": "Cholelithiasis"}], "answer": "B", "explanation": "A contracted, 4 mm-walled gallbladder packed with stones in an afebrile patient with a negative sonographic Murphy's sign is the sonographic signature of gallbladder fibrosis from repeated attacks. Biliary colic resolves within one to six hours and leaves a normal wall behind."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to elective cholecystectomy in recurrent biliary pain?", "options": [{"letter": "A", "text": "Offer it for fatty food intolerance alone, with no stones and normal emptying"}, {"letter": "B", "text": "Offer it when stones are present with recurrent attacks"}, {"letter": "C", "text": "Offer it only after an attack requiring hospital admission"}, {"letter": "D", "text": "Offer it only once the gallbladder wall exceeds 4 mm"}, {"letter": "E", "text": "Offer it only after histopathology has confirmed fibrosis"}], "answer": "B", "explanation": "Stones plus repeated attacks are the indication, and removing the gallbladder both treats the pain and supplies the specimen that proves the diagnosis — so waiting for histopathology inverts the sequence. Pain without stones and with normal emptying is not this disease at all; that combination is what the term biliary dyskinesia exists for, and it is the naming error this case guards against."}]}, {"case": "GA-A3", "group": "GA-A", "section": "chronic epigastric pain or burning with meals", "objective": "", "vignette_workup": "A 35-year-old man comes to the primary care clinic with a year of intermittent epigastric pain and dyspepsia, worse over the past month, with nausea and no vomiting. He grew up in crowded housing with six siblings, shared a bed, and had no running water. He takes no NSAIDs and does not drink alcohol, and he took azithromycin for a respiratory infection last year. He has had no weight loss, no difficulty swallowing, and no black stools. His temperature is 36.7°C (98.1°F), blood pressure is 118/74 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has mild epigastric tenderness with no mass, no lymphadenopathy, and no jaundice.", "labs_workup": [["Hemoglobin / hematocrit", "14.6 g/dL / 44%"], ["MCV", "89 fL"], ["WBC", "6,900/mm³"], ["Platelets", "251,000/mm³"]], "vignette_recog": "A 35-year-old man comes to the primary care clinic with a year of intermittent epigastric pain and dyspepsia, worse over the past month, with nausea and no vomiting. He grew up in crowded housing with six siblings, shared a bed, and had no running water. He takes no NSAIDs and does not drink alcohol, and he took azithromycin for a respiratory infection last year. He has had no weight loss, no difficulty swallowing, and no black stools. His temperature is 36.7°C (98.1°F), blood pressure is 118/74 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has mild epigastric tenderness with no mass, no lymphadenopathy, and no jaundice.", "labs_recog": [["Hemoglobin / hematocrit", "14.6 g/dL / 44%"], ["MCV", "89 fL"], ["WBC", "6,900/mm³"], ["Platelets", "251,000/mm³"], ["Urea breath test", "Positive"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Endoscopic biopsy with rapid urease testing"}, {"letter": "B", "text": "Upper endoscopy with biopsy"}, {"letter": "C", "text": "Urea breath test"}, {"letter": "D", "text": "Serology for antibodies to the organism"}, {"letter": "E", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}], "answer": "C", "explanation": "He is under 60 with no alarm features, so a non-invasive test that detects active infection is what is indicated, performed fasting and off antibiotics, bismuth, and acid suppression. Serology is not recommended because antibodies persist for years and the accuracy is low, and endoscopic urease testing is reserved for a patient who needs an endoscopy anyway."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A fasting gastrin above 1000 pg/mL with a gastric pH below 2"}, {"letter": "B", "text": "A positive urea breath test"}, {"letter": "C", "text": "Hypokalemic, hypochloremic metabolic alkalosis"}, {"letter": "D", "text": "Iron deficiency anemia with a positive fecal occult blood test"}, {"letter": "E", "text": "A negative result with a normal CBC, metabolic panel, and lipase"}], "answer": "B", "explanation": "The organism splits urea with its own urease, releasing labeled carbon dioxide that is exhaled and measured, so a positive test means live bacteria are present now rather than at some point in the past. Sensitivity runs 88 to 95% and specificity 95 to 100%, which is why it is trusted as a stand-alone result."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "H. pylori gastritis"}, {"letter": "B", "text": "NSAID and alcohol gastritis"}, {"letter": "C", "text": "Functional dyspepsia"}, {"letter": "D", "text": "Peptic ulcer disease"}, {"letter": "E", "text": "Zollinger-Ellison syndrome"}], "answer": "A", "explanation": "Crowded childhood housing without running water is the classic transmission setting for the most common chronic bacterial infection in humans, and a positive organism test in a patient with dyspepsia names the cause. Functional dyspepsia requires a negative organism test, and chemical gastritis requires an exposure he does not have."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Zollinger-Ellison syndrome"}, {"letter": "B", "text": "Functional dyspepsia"}, {"letter": "C", "text": "H. pylori gastritis"}, {"letter": "D", "text": "NSAID and alcohol gastritis"}, {"letter": "E", "text": "Peptic ulcer disease"}], "answer": "C", "explanation": "A positive urea breath test establishes active infection with the spiral, microaerophilic, gram-negative organism that colonizes roughly half the world's population. Peptic ulcer disease would be expected to bring anemia and a positive stool occult blood test, and neither is present."}, {"key": "mgmt", "path": "both", "stem": "He has H. pylori gastritis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Quadruple therapy for 14 days with a twice-daily proton pump inhibitor"}, {"letter": "B", "text": "Diet and lifestyle change with a daily proton pump inhibitor"}, {"letter": "C", "text": "High-dose proton pump inhibitor therapy with surgical resection"}, {"letter": "D", "text": "A proton pump inhibitor for 8 weeks with withdrawal of the offending agent"}, {"letter": "E", "text": "Clarithromycin triple therapy for 14 days with a twice-daily proton pump inhibitor"}], "answer": "A", "explanation": "Any prior macrolide exposure rules out a clarithromycin-containing regimen, and he took azithromycin last year — that history is the whole point of asking. Bismuth quadruple therapy for 14 days on a twice-daily proton pump inhibitor backbone is the alternative; counsel him that metronidazole with alcohol produces a disulfiram-like reaction and that calcium, magnesium, and iron block tetracycline absorption."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to confirming eradication after treatment?", "options": [{"letter": "A", "text": "Retest with a breath test while the proton pump inhibitor is continued"}, {"letter": "B", "text": "Retest with a stool antigen or breath test at least 4 weeks after therapy"}, {"letter": "C", "text": "Retest with serology at least 4 weeks after therapy"}, {"letter": "D", "text": "Retest only if the dyspepsia persists after therapy"}, {"letter": "E", "text": "Retest with a breath test one week after finishing therapy"}], "answer": "B", "explanation": "Cure is confirmed with a test of active infection at least four weeks out, off antibiotics for 30 days and off the proton pump inhibitor for one to two weeks, because residual suppression produces false negatives. Serology can never confirm eradication — the antibodies persist for years after the organism is gone."}]}, {"case": "DI-A3", "group": "DI-A", "section": "acute diarrhea of less than two weeks, cause not yet named", "objective": "", "vignette_workup": "A 55-year-old man comes to the emergency department with six days of diarrhea that is now smaller in volume and contains blood and mucus. He has cramping, tenesmus, and fever. He returned ten days ago from three weeks in rural Central America, where he ate street food and drank local water. He has taken no antibiotics and has not been hospitalized. He works as a line cook. His temperature is 38.5°C (101.3°F), blood pressure is 124/78 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is febrile with dry mucous membranes, his abdomen is diffusely tender without rebound or guarding, and there is gross blood on rectal examination.", "labs_workup": [["WBC", "14,200/mm³ with a left shift"], ["Hemoglobin / hematocrit", "14.6 g/dL / 44%"], ["Platelets", "268,000/mm³"], ["Potassium", "3.2 mEq/L"], ["Bicarbonate", "19 mEq/L"], ["Creatinine", "1.3 mg/dL"]], "vignette_recog": "A 55-year-old man comes to the emergency department with six days of diarrhea that is now smaller in volume and contains blood and mucus. He has cramping, tenesmus, and fever. He returned ten days ago from three weeks in rural Central America, where he ate street food and drank local water. He has taken no antibiotics and has not been hospitalized. He works as a line cook. His temperature is 38.5°C (101.3°F), blood pressure is 124/78 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is febrile with dry mucous membranes, his abdomen is diffusely tender without rebound or guarding, and there is gross blood on rectal examination.", "labs_recog": [["WBC", "14,200/mm³ with a left shift"], ["Potassium", "3.2 mEq/L"], ["Bicarbonate", "19 mEq/L"], ["Creatinine", "1.3 mg/dL"], ["Stool inflammatory markers", "Fecal leukocytes and lactoferrin present"], ["Stool molecular panel", "Pending"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "No stool study — a clinical red-flag screen"}, {"letter": "B", "text": "No stool study — a full prescription and over-the-counter medication review"}, {"letter": "C", "text": "Stool ova and parasite examination on multiple collections"}, {"letter": "D", "text": "Stool GDH antigen with PCR for TcdB on unformed stool"}, {"letter": "E", "text": "Stool culture with a multiplex molecular panel"}], "answer": "E", "explanation": "Blood, mucus, fever, and tenesmus after foreign travel are red flags, and a red flag is what takes a patient out of the no-testing category. Culture with a molecular panel is what names the organism, and naming it is what decides whether antibiotics are given at all. A medication review and a toxin assay chase exposures he has not had."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Cysts and trophozoites on a repeat stool collection"}, {"letter": "B", "text": "Watery stool with no blood and no fecal leukocytes"}, {"letter": "C", "text": "A positive stool antigen for Giardia"}, {"letter": "D", "text": "Fecal leukocytes and lactoferrin present"}, {"letter": "E", "text": "A positive screen that does not distinguish infection from colonization"}], "answer": "D", "explanation": "There are two mechanisms to sort between: toxin-mediated disease produces large-volume watery stool with less fever and less pain, while invasive disease produces smaller-volume bloody or mucoid stool with fever and tenesmus. Organisms that invade the mucosa draw neutrophils into the lumen, so an inflammatory marker in the stool marks the invasive form."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Parasitic infectious diarrhea"}, {"letter": "B", "text": "Bacterial infectious diarrhea"}, {"letter": "C", "text": "Viral infectious diarrhea"}, {"letter": "D", "text": "Clostridioides difficile infection"}, {"letter": "E", "text": "Medication-related diarrhea"}], "answer": "B", "explanation": "Foreign travel carries roughly an 80% probability of a bacterial cause, and fever with bloody mucoid stool and a positive inflammatory marker is the invasive bacterial pattern. C. difficile follows recent antibiotics, which he has not taken, and a parasitic illness runs for weeks with greasy stool rather than six days of dysentery."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Medication-related diarrhea"}, {"letter": "B", "text": "Clostridioides difficile infection"}, {"letter": "C", "text": "Parasitic infectious diarrhea"}, {"letter": "D", "text": "Viral infectious diarrhea"}, {"letter": "E", "text": "Bacterial infectious diarrhea"}], "answer": "E", "explanation": "Fecal leukocytes and lactoferrin place this in the invasive category, and travel exposure makes a bacterial organism the overwhelming probability. Viral disease gives watery stool with no blood and no fecal leukocytes, and prominent vomiting in a closed-setting outbreak."}, {"key": "mgmt", "path": "both", "stem": "He has bacterial infectious diarrhea. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Withdrawal or substitution of the offending medication"}, {"letter": "B", "text": "Oral fidaxomicin or oral vancomycin for 10 days"}, {"letter": "C", "text": "Oral rehydration with a bland diet"}, {"letter": "D", "text": "Rehydration plus tinidazole, metronidazole, or nitazoxanide by organism"}, {"letter": "E", "text": "Rehydration, then antibiotics chosen by organism and severity"}], "answer": "E", "explanation": "Rehydration and supportive care are the base for every organism, and antibiotics are layered on top only once the organism and the severity are known. Reaching for an antibiotic before the panel returns is how a patient with Shiga-toxin-producing E. coli is pushed toward hemolytic uremic syndrome."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to antibiotics in bacterial infectious diarrhea?", "options": [{"letter": "A", "text": "Withhold antibiotics when enterohemorrhagic E. coli is suspected"}, {"letter": "B", "text": "Treat every patient whose stool culture is positive"}, {"letter": "C", "text": "Treat every patient who has bloody diarrhea empirically"}, {"letter": "D", "text": "Treat Campylobacter, Yersinia, and Salmonella in every patient"}, {"letter": "E", "text": "Withhold antibiotics until the fever has resolved"}], "answer": "A", "explanation": "Antibiotics increase toxin release in enterohemorrhagic E. coli and raise the risk of hemolytic uremic syndrome, so they are withheld — most pointedly from a child with bloody diarrhea after undercooked beef. Shigella, C. difficile, Vibrio cholerae, and Listeria are always treated; Campylobacter, Yersinia, Vibrio parahaemolyticus, and Salmonella are treated only when the illness is severe or the patient is immunocompromised."}]}, {"case": "DI-D2", "group": "DI-D", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "objective": "", "vignette_workup": "A 38-year-old woman comes to the primary care clinic with four days of watery diarrhea that is now streaked with blood, along with cramping. She returned a week ago from a month in Southeast Asia, where she drank untreated water in a rural village. She has taken no antibiotics and takes a combined oral contraceptive. Her temperature is 38.0°C (100.4°F), blood pressure is 116/74 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has a low-grade fever, diffuse abdominal tenderness without rebound, moist mucous membranes, and no right lower quadrant localization.", "labs_workup": [], "vignette_recog": "A 38-year-old woman comes to the primary care clinic with four days of watery diarrhea that is now streaked with blood, along with cramping. She returned a week ago from a month in Southeast Asia, where she drank untreated water in a rural village. She has taken no antibiotics and takes a combined oral contraceptive. Her temperature is 38.0°C (100.4°F), blood pressure is 116/74 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has a low-grade fever, diffuse abdominal tenderness without rebound, moist mucous membranes, and no right lower quadrant localization.", "labs_recog": [["Stool multiplex PCR", "Positive for enteroinvasive E. coli"], ["Fecal white cells", "Present"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool GDH antigen with PCR for TcdB on unformed stool"}, {"letter": "B", "text": "Stool ova and parasite examination on multiple collections"}, {"letter": "C", "text": "Stool Giardia antigen test"}, {"letter": "D", "text": "Stool multiplex PCR"}, {"letter": "E", "text": "No stool study — a clinical diagnosis in a returning traveler"}], "answer": "D", "explanation": "Blood in the stool takes this out of the empirically treated category, and a multiplex panel names the organism from a single specimen in hours. Ova and parasite examination and a Giardia antigen answer a weeks-long greasy-stool question, and a toxin assay belongs to a patient who has had antibiotics."}, {"key": "result", "path": "W", "stem": "Which of the following initial test results is most likely to be present?", "options": [{"letter": "A", "text": "Watery then bloody stool after raw shellfish with a PCR positive for Vibrio parahaemolyticus"}, {"letter": "B", "text": "Severe periumbilical pain with ten or more stools daily and a PCR positive for Campylobacter"}, {"letter": "C", "text": "Bloody mucoid stool with tenesmus and a PCR positive for Shigella"}, {"letter": "D", "text": "Fecal white cells with a PCR positive for enteroinvasive E. coli"}, {"letter": "E", "text": "Bloody stool with minimal fever and a PCR positive for Shiga-toxin-producing E. coli"}], "answer": "D", "explanation": "This organism invades the epithelial cells of the colon, which is why white cells appear in the stool and why the illness looks like shigellosis. Untreated water abroad is its exposure; raw shellfish and poultry point elsewhere, and an enterohemorrhagic strain runs with little or no fever."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Vibrio parahaemolyticus infection"}, {"letter": "B", "text": "Enteroinvasive E. coli infection"}, {"letter": "C", "text": "Enterohemorrhagic E. coli infection"}, {"letter": "D", "text": "Traveler's diarrhea from enterotoxigenic E. coli"}, {"letter": "E", "text": "Shigellosis"}], "answer": "B", "explanation": "Watery stool turning bloody with fever and fecal white cells after drinking untreated water abroad is the invasive strain, which after enterotoxigenic E. coli is the next most common organism behind traveler's diarrhea. Enterotoxigenic disease is watery and non-bloody, and shigellosis brings high fever with prominent tenesmus."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Shigellosis"}, {"letter": "B", "text": "Vibrio parahaemolyticus infection"}, {"letter": "C", "text": "Enteroinvasive E. coli infection"}, {"letter": "D", "text": "Traveler's diarrhea from enterotoxigenic E. coli"}, {"letter": "E", "text": "Enterohemorrhagic E. coli infection"}], "answer": "C", "explanation": "The organism is closely related to Shigella and carries the same type of toxin, so it produces a shigellosis-like illness — but the panel names it directly. Fecal white cells are the footprint of epithelial invasion, and an enterohemorrhagic strain would be reported as Shiga-toxin-producing rather than invasive."}, {"key": "mgmt", "path": "both", "stem": "She has enteroinvasive E. coli infection. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Azithromycin 1000 mg once plus loperamide"}, {"letter": "B", "text": "Supportive care with azithromycin only if the illness is severe"}, {"letter": "C", "text": "Supportive care with hydration"}, {"letter": "D", "text": "Supportive care with serial monitoring for hemolytic uremic syndrome and no antibiotics"}, {"letter": "E", "text": "Supportive care plus ciprofloxacin or azithromycin"}], "answer": "C", "explanation": "The illness is self-limited in an otherwise well patient, so hydration and supportive care are the whole of first-line treatment. Antibiotics are always indicated in shigellosis but not here, and the single-dose azithromycin plus loperamide regimen belongs to watery, non-bloody traveler's diarrhea."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to antibiotic therapy in this infection?", "options": [{"letter": "A", "text": "Reserve antibiotics for severe illness"}, {"letter": "B", "text": "Withhold antibiotics from every patient regardless of severity"}, {"letter": "C", "text": "Treat every patient, as in shigellosis"}, {"letter": "D", "text": "Treat every returning traveler who has bloody diarrhea"}, {"letter": "E", "text": "Treat every patient who has fecal white cells in the stool"}], "answer": "A", "explanation": "Hydration is what most patients need, and antibiotics may be considered when the illness is severe. Treating on the basis of blood or fecal white cells alone would commit nearly everyone in this group to a drug they do not need, while a blanket prohibition belongs to the Shiga-toxin-producing strains, not to this one."}]}, {"case": "DI-G2", "group": "DI-G", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "objective": "", "vignette_workup": "A 27-year-old man comes to the primary care clinic with three weeks of watery, foul-smelling, greasy diarrhea that floats, with no blood. He has bloating, excessive flatulence, and cramping, and he has lost 3 kg. A month ago he spent ten days backpacking in the Rockies, drinking from a stream and filtering only some of it; two companions from the trip are also ill. He has had no daycare contact and has taken no antibiotics. His temperature is 37.5°C (99.5°F), blood pressure is 118/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has a low-grade fever, abdominal distention with tympany, no blood on rectal examination, no hepatomegaly, and no right upper quadrant tenderness.", "labs_workup": [["WBC", "7,400/mm³"]], "vignette_recog": "A 27-year-old man comes to the primary care clinic with three weeks of watery, foul-smelling, greasy diarrhea that floats, with no blood. He has bloating, excessive flatulence, and cramping, and he has lost 3 kg. A month ago he spent ten days backpacking in the Rockies, drinking from a stream and filtering only some of it; two companions from the trip are also ill. He has had no daycare contact and has taken no antibiotics. His temperature is 37.5°C (99.5°F), blood pressure is 118/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has a low-grade fever, abdominal distention with tympany, no blood on rectal examination, no hepatomegaly, and no right upper quadrant tenderness.", "labs_recog": [["WBC", "7,400/mm³"], ["Stool antigen test", "Positive for Giardia"], ["Stool microscopy", "Cysts and trophozoites identified"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool Giardia antigen test"}, {"letter": "B", "text": "Stool ova and parasite examination on multiple collections"}, {"letter": "C", "text": "Stool Cryptosporidium antigen assay"}, {"letter": "D", "text": "Stool and serum antigen assays for Entamoeba histolytica"}, {"letter": "E", "text": "IgA anti-tissue transglutaminase with a total IgA"}], "answer": "A", "explanation": "Stream water, a backpacking trip, ill companions, and three weeks of greasy non-bloody stool point at one organism, and the antigen assay is the preferred test for it because microscopy is less sensitive. Testing for the amebic or cryptosporidial organisms answers questions raised by blood, hepatomegaly, or advanced immunosuppression, none of which he has."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Trophozoites and cysts on a repeat collection after a negative first examination"}, {"letter": "B", "text": "A positive IgA anti-tissue transglutaminase with iron deficiency anemia"}, {"letter": "C", "text": "A positive stool antigen with cysts and trophozoites on microscopy"}, {"letter": "D", "text": "Stool and serum antigen positive for Entamoeba histolytica with tender hepatomegaly"}, {"letter": "E", "text": "A CD4 count of 58/µL with high-volume watery stool"}], "answer": "C", "explanation": "The organism exists in two forms: cysts are ingested and environmentally resistant, and trophozoites are released in the proximal small intestine, where they do the damage that produces malabsorptive stool. A normal white count with no blood in the stool alongside greasy stool is the tell that separates this from an invasive infection."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Celiac disease"}, {"letter": "B", "text": "Giardiasis"}, {"letter": "C", "text": "Amebiasis"}, {"letter": "D", "text": "Shigellosis"}, {"letter": "E", "text": "Cryptosporidiosis"}], "answer": "B", "explanation": "It is the most common parasitic diarrhea worldwide, and contaminated fresh water with campers and backpackers is its signature exposure. Amebiasis brings blood, tenesmus, and tender hepatomegaly; cryptosporidial disease is high-volume watery stool in advanced HIV; and shigellosis runs for days with high fever rather than weeks."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Giardiasis"}, {"letter": "B", "text": "Celiac disease"}, {"letter": "C", "text": "Shigellosis"}, {"letter": "D", "text": "Cryptosporidiosis"}, {"letter": "E", "text": "Amebiasis"}], "answer": "A", "explanation": "A positive stool antigen with cysts and trophozoites identified on microscopy names the organism outright. Nausea, malaise, fatigue, and weight loss occur in more than half of symptomatic patients, and about 84% of cases are acute, with only a minority becoming chronic."}, {"key": "mgmt", "path": "both", "stem": "He has giardiasis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Rehydration plus tinidazole, metronidazole, or nitazoxanide chosen by organism"}, {"letter": "B", "text": "Tinidazole as a single dose"}, {"letter": "C", "text": "Metronidazole or tinidazole, then paromomycin"}, {"letter": "D", "text": "Supportive care with oral rehydration plus antiretroviral therapy"}, {"letter": "E", "text": "Supportive care plus ciprofloxacin or azithromycin"}], "answer": "B", "explanation": "Tinidazole is first line above the age of three and is given as a single dose, alongside hydration. A symptomatic patient is always treated rather than watched for spontaneous resolution. The two-drug amebic regimen exists to clear luminal cysts after tissue disease, which is not what he has."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate recommendation for preventing this infection on future trips?", "options": [{"letter": "A", "text": "Filter or briskly boil all drinking water for at least 5 minutes"}, {"letter": "B", "text": "Treat drinking water with iodine as the preferred method"}, {"letter": "C", "text": "Filter drinking water only once a travelling companion becomes ill"}, {"letter": "D", "text": "Chlorinate drinking water, which inactivates the cysts"}, {"letter": "E", "text": "Filter or briskly boil drinking water only when it is drawn from standing water"}], "answer": "A", "explanation": "The cyst is the infectious form, it resists routine chlorination, and it survives for months in cold water, so filtration or brisk boiling is what actually prevents infection. Chlorine and iodine are alternatives only, and filtering some of the water and not the rest is how this trip ended the way it did."}]}, {"case": "DI-H1", "group": "DI-H", "section": "loose stools for more than a month in an adult", "objective": "", "vignette_workup": "A 57-year-old man presents to the primary care clinic with four months of loose stools, five or six a day, some of them containing blood. The diarrhea wakes him at night and does not stop when he stops eating. He has lost 6 kg. He has not traveled, has taken no antibiotics, uses no artificial sweeteners, and has had no bowel surgery, resection, or radiation. He takes no medications, and his sister has Crohn's disease. His temperature is 37.2°C (99.0°F), blood pressure is 122/76 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. He is pale with angular cheilitis, his thyroid is normal to palpation, and his abdomen is mildly tender throughout without rebound. He has no edema and no perianal disease.", "labs_workup": [["Hemoglobin / hematocrit", "10.8 g/dL / 32%"], ["MCV", "76 fL"], ["Ferritin", "9 ng/mL"], ["Albumin", "3.2 g/dL"], ["C-reactive protein", "38 mg/L"], ["ESR", "44 mm/h"], ["TSH", "2.1 mIU/L"], ["Stool studies", "Negative for persistent infection"]], "vignette_recog": "A 57-year-old man presents to the primary care clinic with four months of loose stools, five or six a day, some of them containing blood. The diarrhea wakes him at night and does not stop when he stops eating. He has lost 6 kg. He has not traveled, has taken no antibiotics, uses no artificial sweeteners, and has had no bowel surgery, resection, or radiation. He takes no medications, and his sister has Crohn's disease. His temperature is 37.2°C (99.0°F), blood pressure is 122/76 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. He is pale with angular cheilitis, his thyroid is normal to palpation, and his abdomen is mildly tender throughout without rebound. He has no edema and no perianal disease.", "labs_recog": [["Hemoglobin / hematocrit", "10.8 g/dL / 32%"], ["MCV", "76 fL"], ["Ferritin", "9 ng/mL"], ["Albumin", "3.2 g/dL"], ["C-reactive protein", "38 mg/L"], ["ESR", "44 mm/h"], ["TSH", "2.1 mIU/L"], ["IgA anti-tissue transglutaminase", "Negative, with a normal total IgA"], ["Fecal calprotectin", "480 µg/g"], ["Stool studies", "Negative for persistent infection"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Colonoscopy with random biopsies of normal-appearing mucosa"}, {"letter": "B", "text": "A hydrogen breath test"}, {"letter": "C", "text": "An empiric lactose-free diet trial for two weeks"}, {"letter": "D", "text": "Upper endoscopy with duodenal biopsy"}, {"letter": "E", "text": "Fecal calprotectin"}], "answer": "E", "explanation": "The first branch point in diarrhea lasting beyond a month is organic against functional, and fecal calprotectin is what separates them — 92% sensitive and 82% specific for inflammatory bowel disease. A dietary trial or a breath test answers a question that only arises once inflammation has been excluded."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A positive hydrogen breath test"}, {"letter": "B", "text": "An endoscopically normal colon"}, {"letter": "C", "text": "An IgA anti-tissue transglutaminase of 118 U/mL"}, {"letter": "D", "text": "Osmotic diarrhea resolving on a lactose-free trial"}, {"letter": "E", "text": "A fecal calprotectin of 480 µg/g"}], "answer": "E", "explanation": "Calprotectin is released from neutrophils migrating into the gut lumen, so a raised value tracks mucosal inflammation rather than symptoms. A value this high alongside anemia, a low albumin, and a raised C-reactive protein places the disease in the organic column and rules out a functional explanation."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "A hydrogen breath test after a lactose load"}, {"letter": "B", "text": "Colonoscopy with biopsy"}, {"letter": "C", "text": "Repeat stool studies for enteric pathogens"}, {"letter": "D", "text": "Small bowel aspirate with culture"}, {"letter": "E", "text": "Upper endoscopy with duodenal biopsy"}], "answer": "B", "explanation": "Tissue is the diagnosis. Colonoscopy visualizes the mucosa and biopsy establishes the histology, and normal-appearing segments are sampled as well so that a microscopic colitis is not missed. Duodenal biopsy and breath testing look for small-bowel disease, which the bloody stool does not suggest."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Inflammatory bowel disease"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Celiac disease"}, {"letter": "D", "text": "Microscopic colitis"}, {"letter": "E", "text": "Lactose intolerance"}], "answer": "A", "explanation": "Bloody stool marks the diarrhea as inflammatory, and diarrhea that wakes the patient, persists through fasting, and comes with weight loss and a family history of Crohn's disease points to the bowel wall rather than to motility. Irritable bowel syndrome spares sleep and carries no alarm feature."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Irritable bowel syndrome"}, {"letter": "B", "text": "Inflammatory bowel disease"}, {"letter": "C", "text": "Microscopic colitis"}, {"letter": "D", "text": "Celiac disease"}, {"letter": "E", "text": "Lactose intolerance"}], "answer": "B", "explanation": "An elevated calprotectin with anemia, hypoalbuminemia, and a raised C-reactive protein is organic inflammatory disease, and negative celiac serology with a normal total IgA takes the gluten-driven alternative off the table. Irritable bowel syndrome runs with a normal calprotectin and no alarm feature."}, {"key": "mgmt", "path": "both", "stem": "He has inflammatory bowel disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Withdrawal of NSAIDs and PPIs with loperamide or bismuth subsalicylate"}, {"letter": "B", "text": "Rifaximin, metronidazole, or amoxicillin-clavulanate"}, {"letter": "C", "text": "Treatment of the underlying disease with loperamide withheld"}, {"letter": "D", "text": "A low FODMAP diet with alcohol and caffeine avoidance"}, {"letter": "E", "text": "A lifelong gluten-free diet with micronutrient repletion"}], "answer": "C", "explanation": "Chronic diarrhea is treated by treating its cause, and here the cause is active mucosal inflammation. An antimotility agent is the reflex the case is built around: slowing a colon that is actively inflamed relieves the stool count while the disease continues underneath it, and loperamide is licensed only once infection and inflammation have been excluded."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to symptomatic loperamide in chronic diarrhea?", "options": [{"letter": "A", "text": "Give it to every patient for symptom control"}, {"letter": "B", "text": "Give it only when there is no blood in the stool"}, {"letter": "C", "text": "Give it once infection and inflammation have been excluded"}, {"letter": "D", "text": "Give it only when the diarrhea is not nocturnal"}, {"letter": "E", "text": "Give it once the diarrhea has lasted more than 30 days"}], "answer": "C", "explanation": "The exclusion has to be done with tests, not with the history. A normal calprotectin with a normal C-reactive protein, a normal albumin, and no anemia is what licenses an antimotility drug; the absence of visible blood or of nocturnal stools is a softer signal that misses organic disease."}]}, {"case": "DI-H2", "group": "DI-H", "section": "loose stools for more than a month in an adult", "objective": "", "vignette_workup": "A 32-year-old woman presents to the primary care clinic with a year of pale, greasy, floating stools, 7 kg of weight loss, abdominal distention, and flatulence. She eats a normal gluten-containing diet and has never tried removing gluten. For six months she has had an itchy blistering rash on her elbows and knees. Her mother has Hashimoto thyroiditis. Her temperature is 36.8°C (98.2°F), blood pressure is 106/68 mm Hg, pulse is 84/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has pruritic papulovesicles over the extensor surfaces of the elbows and knees, pallor with mild temporal muscle wasting, and a distended, tympanitic, non-tender abdomen. There is no perianal disease.", "labs_workup": [["IgA anti-tissue transglutaminase", "118 U/mL, with a normal total IgA"], ["Hemoglobin / hematocrit", "10.2 g/dL / 31%"], ["MCV", "74 fL"], ["Ferritin", "6 ng/mL"], ["Iron saturation", "6%"], ["Vitamin B12", "180 pg/mL"], ["Folate", "2.4 ng/mL"], ["25-OH vitamin D", "14 ng/mL"], ["Calcium", "8.4 mg/dL"]], "vignette_recog": "A 32-year-old woman presents to the primary care clinic with a year of pale, greasy, floating stools, 7 kg of weight loss, abdominal distention, and flatulence. She eats a normal gluten-containing diet and has never tried removing gluten. For six months she has had an itchy blistering rash on her elbows and knees. Her mother has Hashimoto thyroiditis. Her temperature is 36.8°C (98.2°F), blood pressure is 106/68 mm Hg, pulse is 84/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has pruritic papulovesicles over the extensor surfaces of the elbows and knees, pallor with mild temporal muscle wasting, and a distended, tympanitic, non-tender abdomen. She continues to eat gluten and undergoes upper endoscopy with duodenal biopsy.", "labs_recog": [["IgA anti-tissue transglutaminase", "118 U/mL, with a normal total IgA"], ["Hemoglobin / hematocrit", "10.2 g/dL / 31%"], ["MCV", "74 fL"], ["Ferritin", "6 ng/mL"], ["Vitamin B12", "180 pg/mL"], ["Folate", "2.4 ng/mL"], ["25-OH vitamin D", "14 ng/mL"], ["Duodenal biopsy", "Villous atrophy and blunting, crypt hyperplasia, and intraepithelial lymphocytosis"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Small bowel aspirate with culture"}, {"letter": "B", "text": "Colonoscopy with biopsy"}, {"letter": "C", "text": "Upper endoscopy with duodenal biopsy"}, {"letter": "D", "text": "A hydrogen breath test"}, {"letter": "E", "text": "HLA-DQ2 and DQ8 genotyping"}], "answer": "C", "explanation": "Serology selects who to biopsy; it does not make the diagnosis. Duodenal histology is the gold standard and is required before a lifelong dietary commitment is imposed. Genotyping is reserved for the patient already off gluten or for a diagnosis that stays uncertain, because a positive result is far too common to confirm anything."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A breath hydrogen rise above 20 ppm after a lactose load"}, {"letter": "B", "text": "Mucosal and histologic change of inflammatory bowel disease"}, {"letter": "C", "text": "Villous atrophy, crypt hyperplasia, and intraepithelial lymphocytosis"}, {"letter": "D", "text": "A thickened subepithelial collagen band on colonic biopsy"}, {"letter": "E", "text": "Bacterial overgrowth on aspirate culture"}], "answer": "C", "explanation": "The immune response to gluten is directed at the small-bowel mucosa, flattening the villi that carry the absorptive surface while the crypts proliferate beneath them and lymphocytes infiltrate the epithelium. The loss of surface area is what produces the greasy stool, the iron and B12 deficiency, and the low vitamin D."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small intestinal bacterial overgrowth"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Lactose intolerance"}, {"letter": "D", "text": "Microscopic colitis"}, {"letter": "E", "text": "Celiac disease"}], "answer": "E", "explanation": "Greasy floating stools with weight loss and deficiencies of iron, B12, folate, and vitamin D are small-bowel malabsorption, and the strongly positive transglutaminase antibody names its cause. The pruritic papulovesicular rash on the extensor surfaces is dermatitis herpetiformis, which appears in fewer than 10% of these patients but is almost always accompanied by celiac changes on biopsy."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Lactose intolerance"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Small intestinal bacterial overgrowth"}, {"letter": "D", "text": "Microscopic colitis"}, {"letter": "E", "text": "Celiac disease"}], "answer": "E", "explanation": "Flattened villi with crypt hyperplasia and intraepithelial lymphocytosis in a patient with strongly positive transglutaminase antibody is the diagnosis, and the biopsy was taken on gluten, which is what makes it interpretable. Lactose intolerance and bacterial overgrowth leave the villi intact."}, {"key": "mgmt", "path": "both", "stem": "She has celiac disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Rifaximin, metronidazole, or amoxicillin-clavulanate"}, {"letter": "B", "text": "A low FODMAP diet with alcohol and caffeine avoidance"}, {"letter": "C", "text": "Lactose limited to threshold with lactase enzyme replacement"}, {"letter": "D", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "E", "text": "Withdrawal of NSAIDs and PPIs with loperamide or bismuth subsalicylate"}], "answer": "D", "explanation": "Removing wheat, rye, and barley for life is the whole of the treatment, since the mucosal injury is antigen driven and recovers only when the antigen is gone. The deficiencies the malabsorption has already produced — iron, folate, B12, calcium, and vitamin D — are replaced alongside it, and a dietitian referral is part of the prescription rather than an optional extra."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to testing for celiac disease?", "options": [{"letter": "A", "text": "Test while the patient is still eating gluten"}, {"letter": "B", "text": "Test only after a four-week gluten-free trial"}, {"letter": "C", "text": "Test only patients with a family history of autoimmune disease"}, {"letter": "D", "text": "Test only once dermatitis herpetiformis has appeared"}, {"letter": "E", "text": "Test only when a biopsy is the first evidence of disease"}], "answer": "A", "explanation": "Both the serology and the biopsy depend on ongoing antigen exposure, so removing gluten before the workup is finished produces false negatives and forces a gluten challenge later. A total IgA is drawn alongside the transglutaminase antibody, because selective IgA deficiency makes an IgA-based assay read negative in a patient who has the disease."}]}, {"case": "CO-A4", "group": "CO-A", "section": "the distended, obstipated abdomen", "objective": "", "vignette_workup": "A 52-year-old man on the surgical unit is seen on the third day after an open ventral hernia repair for bloating and distention with diffuse mild abdominal discomfort, nausea, and two episodes of vomiting. He has passed no flatus since the operation. His diet was advanced yesterday and he did not tolerate it. He has been receiving hydromorphone by patient-controlled analgesia since surgery. His temperature is 37.0°C (98.6°F), blood pressure is 126/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 97% on room air. His abdomen is uniformly distended and soft with mild diffuse tenderness and absent bowel sounds, without guarding, rebound, or focal tenderness. The incision is clean.", "labs_workup": [["Potassium", "2.9 mEq/L"], ["Magnesium", "1.3 mg/dL"], ["Sodium / chloride", "133 mEq/L / 98 mEq/L"], ["Bicarbonate", "26 mEq/L"], ["BUN / creatinine", "14 mg/dL / 0.9 mg/dL"], ["WBC", "8,200/mm³"], ["Hemoglobin / hematocrit", "12.8 g/dL / 38%"], ["Platelets", "275,000/mm³"], ["Lactate", "1.1 mmol/L"]], "vignette_recog": "A 52-year-old man on the surgical unit is seen on the third day after an open ventral hernia repair for bloating and distention with diffuse mild abdominal discomfort, nausea, and two episodes of vomiting. He has passed no flatus since the operation. His diet was advanced yesterday and he did not tolerate it. He has been receiving hydromorphone by patient-controlled analgesia since surgery. His temperature is 37.0°C (98.6°F), blood pressure is 126/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 97% on room air. His abdomen is uniformly distended and soft with mild diffuse tenderness and absent bowel sounds, without guarding, rebound, or focal tenderness. The incision is clean.", "labs_recog": [["Potassium", "2.9 mEq/L"], ["Magnesium", "1.3 mg/dL"], ["Sodium / chloride", "133 mEq/L / 98 mEq/L"], ["BUN / creatinine", "14 mg/dL / 0.9 mg/dL"], ["WBC", "8,200/mm³"], ["Lactate", "1.1 mmol/L"], ["Abdominal series", "Air distributed throughout the small bowel, colon, and rectum with no transition point; loops dilated to 3.6 cm"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "B", "text": "Colonoscopy"}, {"letter": "C", "text": "Upright and supine abdominal series"}, {"letter": "D", "text": "Repeat metabolic panel with magnesium"}, {"letter": "E", "text": "Digital rectal examination"}], "answer": "C", "explanation": "Plain films come first in the distended, obstipated abdomen: they are immediate, they can be taken at the bedside, and they answer the only question that changes management, which is whether gas stops somewhere. Cross-sectional imaging is reserved for a picture the films leave unclear, and colonoscopy insufflates a bowel that is already distended."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Gas through the small bowel, colon, and rectum with no transition point"}, {"letter": "B", "text": "A U-shaped dilated sigmoid loop with a coffee bean sign and no rectal gas"}, {"letter": "C", "text": "Colon dilated to 8 cm and cecum to 9.5 cm with scant rectal gas"}, {"letter": "D", "text": "Hard stool filling the rectal vault without dilated loops"}, {"letter": "E", "text": "Step-ladder air-fluid levels with no colonic gas"}], "answer": "A", "explanation": "When the bowel stops propelling rather than being blocked, gas accumulates uniformly and reaches the rectum, because nothing is stopping it. The absence of a transition point is the finding that separates a functional problem from a mechanical one, and the loops stay modestly dilated rather than reaching obstructive calibers."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "High-grade small bowel obstruction"}, {"letter": "C", "text": "Adynamic ileus"}, {"letter": "D", "text": "Partial adhesive intestinal obstruction"}, {"letter": "E", "text": "Large bowel obstruction"}], "answer": "C", "explanation": "A silent, uniformly distended abdomen with mild diffuse pain, no peritoneal signs, no fever, and no tachycardia is the functional picture; mechanical obstruction brings hyperactive high-pitched sounds and a transition point. Recent abdominal surgery, opioids, hypokalemia, and hypomagnesemia are the drivers here, and all four are present."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Adynamic ileus"}, {"letter": "B", "text": "High-grade small bowel obstruction"}, {"letter": "C", "text": "Sigmoid volvulus"}, {"letter": "D", "text": "Large bowel obstruction"}, {"letter": "E", "text": "Partial adhesive intestinal obstruction"}], "answer": "A", "explanation": "Gas carried all the way to the rectum without a transition point excludes a mechanical block, and the modest 3.6 cm caliber is far short of obstructive dilation. Opioids, recent laparotomy, hypokalemia, and hypomagnesemia together explain a bowel that has stopped propelling."}, {"key": "mgmt", "path": "both", "stem": "He has a post-operative adynamic ileus. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "NPO, nasogastric decompression, surgical consultation, and intravenous fluids"}, {"letter": "B", "text": "NPO, nasogastric decompression, intravenous fluids, and serial examinations"}, {"letter": "C", "text": "Bowel rest, nasogastric suction, ambulation, and electrolyte correction"}, {"letter": "D", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "E", "text": "NPO, nasogastric decompression, intravenous fluids, and serial abdominal films"}], "answer": "C", "explanation": "Resting and decompressing the gut while the cause is corrected is the whole of the treatment, and here the causes are the opioid infusion and the low potassium and magnesium. Generous intravenous fluid is the reflex to avoid, because it worsens bowel wall edema and prolongs the ileus; ambulation and chewing gum stimulate the cephalocaudal reflex instead."}, {"key": "escalate", "path": "both", "stem": "Two days later he has still passed no flatus, remains distended, and the repeat film is unchanged. Which of the following should be done next?", "options": [{"letter": "A", "text": "Manual disimpaction with enemas and laxatives"}, {"letter": "B", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "C", "text": "NPO, nasogastric decompression, intravenous fluids, and serial abdominal films"}, {"letter": "D", "text": "NPO, nasogastric decompression, surgical consultation, and intravenous fluids"}, {"letter": "E", "text": "Watchful waiting with serial examinations and rectal stimulant laxatives"}], "answer": "E", "explanation": "A post-operative ileus that outlasts the usual 48 to 72 hours is still a functional problem, and there is nothing mechanical to relieve. Serial examinations and repeat imaging watch for the complication that changes the diagnosis, while rectal stimulant laxatives act distally without adding to the opioid burden."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to meas
