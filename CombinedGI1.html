<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:

const EXAM_DATA = {"title": "GI Exam 1 — Practice Exam 6 of 6", "questions": [{"id": "1", "group": 1, "stem": "A 24-year-old man is referred to the gastroenterology clinic with two years of difficulty swallowing solid food. Meat and rice hang up in his chest and he drinks constantly through a meal. He has had two episodes of food impaction, one of which required endoscopic removal. He also has heartburn that did not improve after eight weeks of a proton pump inhibitor. He has had asthma since childhood, seasonal allergic rhinitis, and a known peanut allergy, and his brother has eczema. His temperature is 36.5°C (97.7°F), blood pressure is 118/68 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has had no weight loss, and his examination is normal, with no pallor, no oral thrush, and no cervical adenopathy.\n\nStudies:\n    Upper endoscopy — Concentric rings through the length of the esophagus, linear furrows, and scattered white exudates; a mid-esophageal narrowing the scope passes with resistance\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Biopsy histology with staging CT"}, {"letter": "B", "text": "High-resolution esophageal manometry"}, {"letter": "C", "text": "Esophageal biopsy histology"}, {"letter": "D", "text": "CBC with iron studies"}, {"letter": "E", "text": "Repeat endoscopy with dilation of the narrowed segment"}], "answer": "C", "explanation": "Rings, furrows, and exudates are suggestive but not diagnostic, and the endoscopic appearance is normal in a substantial minority of these patients. Tissue from both the proximal and the distal esophagus is what settles the question, which is why at least six biopsies are taken at the index endoscopy. Dilation treats a narrowing without ever explaining it.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C4", "pgroup": "ES-C"}, {"id": "1A", "group": 1, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "42 eosinophils per high-power field"}, {"letter": "B", "text": "Benign narrowing with biopsies excluding malignancy"}, {"letter": "C", "text": "Hemoglobin 9.6 g/dL with an MCV of 71 fL and a ferritin of 6 ng/mL"}, {"letter": "D", "text": "A thin mucosal ring at the gastroesophageal junction with no stricture or mass"}, {"letter": "E", "text": "Absent peristalsis with incomplete lower esophageal sphincter relaxation"}], "answer": "A", "explanation": "The disease is defined by esophageal dysfunction plus eosinophil-predominant histology, and the threshold is more than 15 eosinophils per high-power field. Sampling both levels matters because the infiltrate is patchy, and a count this high in both proximal and distal biopsies separates it from the scattered eosinophils of reflux.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C4", "pgroup": "ES-C"}, {"id": "1B", "group": 1, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Achalasia"}, {"letter": "B", "text": "Schatzki ring at the gastroesophageal junction"}, {"letter": "C", "text": "Peptic stricture"}, {"letter": "D", "text": "Esophageal web with Plummer-Vinson syndrome"}, {"letter": "E", "text": "Eosinophilic esophagitis"}], "answer": "E", "explanation": "A young man with asthma, allergic rhinitis, food allergy, and a family history of eczema who has heartburn refractory to a proton pump inhibitor fits the atopic pattern of this disease. A peptic stricture is a single scarred distal narrowing, and a Schatzki ring gives episodic, non-progressive impaction rather than two years of steadily worsening solid dysphagia.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C4", "pgroup": "ES-C"}, {"id": "1C", "group": 1, "stem": "He has eosinophilic esophagitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Oncologic staging with surgical resection"}, {"letter": "B", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "C", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "D", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "E", "text": "Endoscopic dilation with dietary modification"}], "answer": "C", "explanation": "The disease is antigen driven, so removing the antigen and quieting the eosinophilic inflammation is the treatment; a proton pump inhibitor is added for coexisting or mimicking reflux rather than as the sole therapy. The fluticasone is delivered from an inhaler but is sprayed into the mouth and swallowed — inhaling it delivers nothing to the esophagus. Dilating a rigid esophagus relieves the narrowing without touching the inflammation that produced it.", "objective": "", "section": "dysphagia to SOLIDS ONLY from a fixed narrowing of the lumen", "pcase": "ES-C4", "pgroup": "ES-C"}, {"id": "2", "group": 2, "stem": "A 72-year-old woman comes to the primary care clinic with a year of substernal and epigastric pressure after meals. She feels full after only a few bites and sometimes retches. She has little heartburn and only rare regurgitation. She had chronic gastroesophageal reflux years ago that has since quieted. She has obesity with a body mass index of 34 kg/m² and hypertension treated with metoprolol. Her temperature is 36.6°C (97.9°F), blood pressure is 136/78 mm Hg, pulse is 72/min, respirations are 16/min, and oxygen saturation is 97% on room air. Her abdomen is soft and non-tender with no epigastric mass, she is not pale, and there is no crepitus.\n\nStudies:\n    Upper endoscopy — No erosive esophagitis, no Barrett's mucosa, and no mass\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Upper endoscopy with four-quadrant biopsies"}, {"letter": "B", "text": "Upper endoscopy with proximal and distal esophageal biopsies"}, {"letter": "C", "text": "Ambulatory esophageal pH study"}, {"letter": "D", "text": "An empiric proton pump inhibitor trial for 8 weeks"}, {"letter": "E", "text": "Barium swallow"}], "answer": "E", "explanation": "Endoscopy has already excluded mucosal disease, and mechanical postprandial fullness in an older woman points to an anatomic problem at the hiatus that endoscopy visualizes poorly. Contrast radiography is the most sensitive study for it. A pH study and a therapeutic trial both answer a reflux question she is not asking.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D3", "pgroup": "ES-D"}, {"id": "2A", "group": 2, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Gastric folds above the diaphragmatic pinch with the gastroesophageal junction below it"}, {"letter": "B", "text": "A smooth, tapered, concentric distal narrowing 1 to 4 cm long"}, {"letter": "C", "text": "Confluent linear erosions in the distal esophagus"}, {"letter": "D", "text": "Salmon-colored mucosa extending 4 cm above the gastroesophageal junction"}, {"letter": "E", "text": "Concentric rings and linear furrows with white exudates"}], "answer": "A", "explanation": "When the stomach herniates alongside an esophagus whose junction stays below the diaphragm, the configuration is paraesophageal rather than sliding. That is why she has mechanical fullness and early satiety with almost no reflux — the sphincter has not been displaced.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D3", "pgroup": "ES-D"}, {"id": "2B", "group": 2, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peptic stricture"}, {"letter": "B", "text": "Barrett's esophagus"}, {"letter": "C", "text": "Gastroesophageal reflux disease"}, {"letter": "D", "text": "Erosive reflux esophagitis"}, {"letter": "E", "text": "Paraesophageal hiatal hernia"}], "answer": "E", "explanation": "Postprandial pressure, early satiety, and retching with little heartburn are the mechanical presentation of a herniated stomach rather than an acid one. Barrett's and erosive esophagitis were both excluded endoscopically, and a peptic stricture would give progressive solid-food dysphagia.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D3", "pgroup": "ES-D"}, {"id": "2C", "group": 2, "stem": "She has a symptomatic paraesophageal hiatal hernia. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Long-term daily proton pump inhibitor with endoscopic surveillance"}, {"letter": "B", "text": "Lifestyle change with a daily proton pump inhibitor for 8 weeks"}, {"letter": "C", "text": "Hiatal hernia repair with fundoplication"}, {"letter": "D", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "E", "text": "Endoscopic dilation with a daily proton pump inhibitor"}], "answer": "C", "explanation": "A paraesophageal hernia that is causing symptoms is repaired, because the benefit of repair outweighs its risk and the anatomy will not be corrected medically. Acid suppression is the answer for a sliding hernia managed as reflux, and long-term proton pump inhibitor therapy carries its own burden — infection risk and magnesium, B12, iron, and calcium malabsorption that must be monitored past a year.", "objective": "", "section": "chronic heartburn and what years of it produce", "pcase": "ES-D3", "pgroup": "ES-D"}, {"id": "3", "group": 3, "stem": "A 55-year-old man is brought to the emergency department with sudden severe tearing retrosternal chest pain that began five hours ago during a bout of violent retching. He is short of breath, is still vomiting, and now feels faint. He drank heavily the evening before and vomited repeatedly through the night. He has no cardiac history and has had no recent endoscopy or dilation. His temperature is 38.6°C (101.5°F), blood pressure is 88/54 mm Hg, pulse is 124/min, respirations are 28/min, and oxygen saturation is 91% on room air. There is crepitus over the suprasternal notch and the left anterior chest, his extremities are cool and mottled with delayed capillary refill, and a crunching sound synchronous with the heartbeat is heard on auscultation.\n\nStudies:\n    Chest radiograph — Mediastinal widening, pneumomediastinum, a left pleural effusion, and subcutaneous emphysema in the neck\n    WBC — 19,400/mm³\n    Hemoglobin / hematocrit — 14.2 g/dL / 43%\n    Platelets — 210,000/mm³\n    BUN / creatinine — 26 mg/dL / 1.6 mg/dL\n    Amylase / lipase — 210 U/L / 42 U/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Esophageal biopsy histology"}, {"letter": "B", "text": "Repeat upper endoscopy after endoscopic therapy"}, {"letter": "C", "text": "Urgent upper endoscopy"}, {"letter": "D", "text": "Barium esophagram"}, {"letter": "E", "text": "CT of the chest with water-soluble contrast"}], "answer": "E", "explanation": "A water-soluble agent must be requested by name, because the default contrast order is barium and barium spilled into the mediastinum causes mediastinitis. Endoscopy is contraindicated in known or suspected perforation, and imaging must not be allowed to postpone the surgical call — mortality climbs with every hour of delay.", "objective": "", "section": "blood, pain, or air after the vomiting starts", "pcase": "ES-F2", "pgroup": "ES-F"}, {"id": "3A", "group": 3, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "An ulcer base without further bleeding stigmata"}, {"letter": "B", "text": "Contrast extravasation from the distal esophagus into the mediastinum"}, {"letter": "C", "text": "Dilated submucosal veins with red wale signs, actively oozing"}, {"letter": "D", "text": "A single longitudinal mucosal tear at the gastroesophageal junction with normal adjacent mucosa"}, {"letter": "E", "text": "Reflux change without eosinophilia or viral inclusions"}], "answer": "B", "explanation": "A barogenic rupture tears the full thickness of the wall, usually at the distal left posterolateral esophagus, so contrast escapes the lumen entirely. A mucosal tear stops short of the muscular layer and leaks nothing; that is the whole distinction between the two diseases.", "objective": "", "section": "blood, pain, or air after the vomiting starts", "pcase": "ES-F2", "pgroup": "ES-F"}, {"id": "3B", "group": 3, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Erosive reflux esophagitis"}, {"letter": "B", "text": "Mallory-Weiss tear"}, {"letter": "C", "text": "Iatrogenic esophageal perforation after dilation"}, {"letter": "D", "text": "Boerhaave syndrome"}, {"letter": "E", "text": "Esophageal varices"}], "answer": "D", "explanation": "Vomiting, severe retrosternal pain, and subcutaneous emphysema are the Mackler triad, and the crunching sound synchronous with the heartbeat is the Hamman sign. A Mallory-Weiss tear is painless mucosal bleeding without fever or free air, and an iatrogenic perforation follows instrumentation, which he has not had.", "objective": "", "section": "blood, pain, or air after the vomiting starts", "pcase": "ES-F2", "pgroup": "ES-F"}, {"id": "3C", "group": 3, "stem": "He has Boerhaave syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with a proton pump inhibitor"}, {"letter": "B", "text": "Long-term daily proton pump inhibitor therapy"}, {"letter": "C", "text": "Emergent surgical repair with broad-spectrum intravenous antibiotics"}, {"letter": "D", "text": "Endoscopic hemostasis with a proton pump inhibitor drip"}, {"letter": "E", "text": "Band ligation with octreotide, ceftriaxone, and a proton pump inhibitor drip"}], "answer": "C", "explanation": "Gastric contents in the mediastinum produce a chemical and then bacterial mediastinitis, so the patient is resuscitated, kept nil by mouth, given piperacillin-tazobactam, and taken to the operating room. Any answer that puts a scope into the esophagus is the trap here — endoscopy is contraindicated once perforation is suspected.", "objective": "", "section": "blood, pain, or air after the vomiting starts", "pcase": "ES-F2", "pgroup": "ES-F"}, {"id": "4", "group": 4, "stem": "A 42-year-old woman comes to the primary care clinic for routine follow-up seven months after a sleeve gastrectomy, during which she has lost 30 kg. She has no abdominal pain and has never had an attack after eating. She takes a combined oral contraceptive and has had no prior biliary attacks. Her temperature is 36.8°C (98.2°F), blood pressure is 122/76 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her abdomen is soft and nontender, Murphy's sign is negative, she has no scleral icterus, and no gallbladder is palpable.\n\nStudies:\n    WBC — 6,400/mm³\n    Hemoglobin / hematocrit — 13.2 g/dL / 39.6%\n    Platelets — 250,000/mm³\n    AST / ALT — 22 U/L / 19 U/L\n    Alkaline phosphatase — 68 U/L\n    Total bilirubin — 0.7 mg/dL\n    Lipase — 30 U/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Endoscopic retrograde cholangiopancreatography"}, {"letter": "B", "text": "HIDA scan with a CCK-stimulated ejection fraction"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "MRCP"}, {"letter": "E", "text": "HIDA scan"}], "answer": "C", "explanation": "Ultrasound is the first study of the gallbladder and the one this post-bariatric follow-up calls for: it is quick, needs no radiation or contrast, and answers whether stones, sludge, wall thickening, or ductal dilation are present. Nuclear and ductal studies address questions that only arise once the ultrasound has been seen.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A1", "pgroup": "BI-A"}, {"id": "4A", "group": 4, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Stones with a 5 mm wall, pericholecystic fluid, and a positive sonographic Murphy's sign"}, {"letter": "B", "text": "Mobile shadowing stones with a 2 mm wall and a negative sonographic Murphy's sign"}, {"letter": "C", "text": "No stones and no sludge, with a 2 mm wall and normal laboratory studies"}, {"letter": "D", "text": "A contracted gallbladder with a 4 mm wall packed with stones"}, {"letter": "E", "text": "A common bile duct dilated to 9 mm with a cholestatic liver enzyme pattern"}], "answer": "B", "explanation": "Rapid weight loss after bariatric surgery, obesity, and estrogen exposure all supersaturate bile with cholesterol, and cholesterol stones account for about 75% of gallstones. A stone shadows because it is dense enough to block the beam — sludge is echogenic but casts no shadow, which is what separates a precursor from a stone.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A1", "pgroup": "BI-A"}, {"id": "4B", "group": 4, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cholelithiasis"}, {"letter": "B", "text": "Biliary colic"}, {"letter": "C", "text": "Chronic cholecystitis"}, {"letter": "D", "text": "Biliary dyskinesia"}, {"letter": "E", "text": "Acute cholecystitis"}], "answer": "A", "explanation": "Stones without symptoms are cholelithiasis and nothing more; about 80% of people with gallstones never develop symptoms. Biliary colic requires an attack of pain, and acute and chronic cholecystitis require a thickened or contracted gallbladder wall, neither of which she has.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A1", "pgroup": "BI-A"}, {"id": "4C", "group": 4, "stem": "She has asymptomatic cholelithiasis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Antibiotics with cholecystectomy in 24 to 48 hours"}, {"letter": "B", "text": "ERCP with sphincterotomy, followed by cholecystectomy"}, {"letter": "C", "text": "Observation with routine follow-up"}, {"letter": "D", "text": "Dietary fat avoidance with analgesia"}, {"letter": "E", "text": "Elective laparoscopic cholecystectomy"}], "answer": "C", "explanation": "Cholecystectomy is not recommended for gallstones in the absence of symptoms or complications, because the overall risk of a complication developing is low. Operating on silent stones exposes her to the risks of surgery for a disease that in most people never declares itself.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A1", "pgroup": "BI-A"}, {"id": "5", "group": 5, "stem": "A 61-year-old man comes to the primary care clinic with two years of recurrent dull right upper quadrant pain after fatty meals, occurring more often over the last few months, with bloating and fatty food intolerance. He feels well between attacks. Gallstones were documented on an ultrasound three years ago, and he has had several prior attacks including one emergency department visit. He takes metformin for type 2 diabetes. His temperature is 36.7°C (98.1°F), blood pressure is 130/78 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. His abdomen is soft with no right upper quadrant tenderness today, Murphy's sign is negative, and he is not jaundiced.\n\nStudies:\n    WBC — 6,900/mm³\n    AST / ALT — 26 U/L / 24 U/L\n    Alkaline phosphatase — 82 U/L\n    Total bilirubin — 0.6 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HIDA scan with a CCK-stimulated ejection fraction"}, {"letter": "B", "text": "MRCP"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "HIDA scan"}, {"letter": "E", "text": "Endoscopic retrograde cholangiopancreatography"}], "answer": "C", "explanation": "Ultrasound remains the opening study for recurrent right upper quadrant pain, because it shows stones, wall thickness, pericholecystic fluid, and ductal caliber in one pass. The nuclear and ductal studies exist to answer questions the ultrasound raises rather than to replace it.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A3", "pgroup": "BI-A"}, {"id": "5A", "group": 5, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Stones with a 5 mm wall, pericholecystic fluid, and a positive sonographic Murphy's sign"}, {"letter": "B", "text": "A common bile duct dilated to 9 mm with a cholestatic liver enzyme pattern"}, {"letter": "C", "text": "No stones and no sludge, with a 2 mm wall and normal laboratory studies"}, {"letter": "D", "text": "A contracted gallbladder with a 4 mm wall filled with shadowing stones"}, {"letter": "E", "text": "Mobile shadowing stones with a 2 mm wall and no pericholecystic fluid"}], "answer": "D", "explanation": "Repeated mechanical irritation from stones and repeated attacks of inflammation scar the gallbladder, so the wall thickens and the organ contracts around its contents. The wall is thickened but the patient is afebrile with a normal white count and a negative sonographic Murphy's sign, which is what keeps this out of the acute category.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A3", "pgroup": "BI-A"}, {"id": "5B", "group": 5, "stem": "Which of the following studies would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "MRCP"}, {"letter": "B", "text": "Endoscopic retrograde cholangiopancreatography"}, {"letter": "C", "text": "Repeat right upper quadrant ultrasound"}, {"letter": "D", "text": "HIDA scan"}, {"letter": "E", "text": "HIDA scan with a CCK-stimulated ejection fraction"}], "answer": "D", "explanation": "When the clinical picture is unclear a hepatobiliary scan is the study that adds information, showing delayed gallbladder filling rather than the complete non-visualization of acute disease. A CCK-stimulated ejection fraction answers a different question — whether a stoneless gallbladder empties — and ductal studies look for a problem the normal bilirubin has already argued against.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A3", "pgroup": "BI-A"}, {"id": "5C", "group": 5, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute cholecystitis"}, {"letter": "B", "text": "Chronic cholecystitis"}, {"letter": "C", "text": "Cholelithiasis"}, {"letter": "D", "text": "Biliary dyskinesia"}, {"letter": "E", "text": "Biliary colic"}], "answer": "B", "explanation": "Years of attacks with fatty food intolerance and a fibrotic, contracted, thick-walled gallbladder describe chronic inflammatory change; the term itself is histopathologic and the specimen is what proves it. Silent cholelithiasis has a thin wall and no attacks, and acute cholecystitis brings fever, leukocytosis, and pain lasting beyond six hours.", "objective": "", "section": "recurrent or silent right-upper-quadrant pain without systemic signs", "pcase": "BI-A3", "pgroup": "BI-A"}, {"id": "6", "group": 6, "stem": "A 35-year-old man comes to the primary care clinic with a year of intermittent epigastric pain and dyspepsia, worse over the past month, with nausea and no vomiting. He grew up in crowded housing with six siblings, shared a bed, and had no running water. He takes no NSAIDs and does not drink alcohol, and he took azithromycin for a respiratory infection last year. He has had no weight loss, no difficulty swallowing, and no black stools. His temperature is 36.7°C (98.1°F), blood pressure is 118/74 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has mild epigastric tenderness with no mass, no lymphadenopathy, and no jaundice.\n\nStudies:\n    Hemoglobin / hematocrit — 14.6 g/dL / 44%\n    MCV — 89 fL\n    WBC — 6,900/mm³\n    Platelets — 251,000/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Endoscopic biopsy with rapid urease testing"}, {"letter": "B", "text": "Upper endoscopy with biopsy"}, {"letter": "C", "text": "Urea breath test"}, {"letter": "D", "text": "Serology for antibodies to the organism"}, {"letter": "E", "text": "Fasting serum gastrin drawn off the proton pump inhibitor"}], "answer": "C", "explanation": "He is under 60 with no alarm features, so a non-invasive test that detects active infection is what is indicated, performed fasting and off antibiotics, bismuth, and acid suppression. Serology is not recommended because antibodies persist for years and the accuracy is low, and endoscopic urease testing is reserved for a patient who needs an endoscopy anyway.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A3", "pgroup": "GA-A"}, {"id": "6A", "group": 6, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A fasting gastrin above 1000 pg/mL with a gastric pH below 2"}, {"letter": "B", "text": "A positive urea breath test"}, {"letter": "C", "text": "Hypokalemic, hypochloremic metabolic alkalosis"}, {"letter": "D", "text": "Iron deficiency anemia with a positive fecal occult blood test"}, {"letter": "E", "text": "A negative result with a normal CBC, metabolic panel, and lipase"}], "answer": "B", "explanation": "The organism splits urea with its own urease, releasing labeled carbon dioxide that is exhaled and measured, so a positive test means live bacteria are present now rather than at some point in the past. Sensitivity runs 88 to 95% and specificity 95 to 100%, which is why it is trusted as a stand-alone result.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A3", "pgroup": "GA-A"}, {"id": "6B", "group": 6, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "H. pylori gastritis"}, {"letter": "B", "text": "NSAID and alcohol gastritis"}, {"letter": "C", "text": "Functional dyspepsia"}, {"letter": "D", "text": "Peptic ulcer disease"}, {"letter": "E", "text": "Zollinger-Ellison syndrome"}], "answer": "A", "explanation": "Crowded childhood housing without running water is the classic transmission setting for the most common chronic bacterial infection in humans, and a positive organism test in a patient with dyspepsia names the cause. Functional dyspepsia requires a negative organism test, and chemical gastritis requires an exposure he does not have.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A3", "pgroup": "GA-A"}, {"id": "6C", "group": 6, "stem": "He has H. pylori gastritis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Quadruple therapy for 14 days with a twice-daily proton pump inhibitor"}, {"letter": "B", "text": "Diet and lifestyle change with a daily proton pump inhibitor"}, {"letter": "C", "text": "High-dose proton pump inhibitor therapy with surgical resection"}, {"letter": "D", "text": "A proton pump inhibitor for 8 weeks with withdrawal of the offending agent"}, {"letter": "E", "text": "Clarithromycin triple therapy for 14 days with a twice-daily proton pump inhibitor"}], "answer": "A", "explanation": "Any prior macrolide exposure rules out a clarithromycin-containing regimen, and he took azithromycin last year — that history is the whole point of asking. Bismuth quadruple therapy for 14 days on a twice-daily proton pump inhibitor backbone is the alternative; counsel him that metronidazole with alcohol produces a disulfiram-like reaction and that calcium, magnesium, and iron block tetracycline absorption.", "objective": "", "section": "chronic epigastric pain or burning with meals", "pcase": "GA-A3", "pgroup": "GA-A"}, {"id": "7", "group": 7, "stem": "A 55-year-old man comes to the emergency department with six days of diarrhea that is now smaller in volume and contains blood and mucus. He has cramping, tenesmus, and fever. He returned ten days ago from three weeks in rural Central America, where he ate street food and drank local water. He has taken no antibiotics and has not been hospitalized. He works as a line cook. His temperature is 38.5°C (101.3°F), blood pressure is 124/78 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is febrile with dry mucous membranes, his abdomen is diffusely tender without rebound or guarding, and there is gross blood on rectal examination.\n\nStudies:\n    WBC — 14,200/mm³ with a left shift\n    Hemoglobin / hematocrit — 14.6 g/dL / 44%\n    Platelets — 268,000/mm³\n    Potassium — 3.2 mEq/L\n    Bicarbonate — 19 mEq/L\n    Creatinine — 1.3 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "No stool study — a clinical red-flag screen"}, {"letter": "B", "text": "No stool study — a full prescription and over-the-counter medication review"}, {"letter": "C", "text": "Stool ova and parasite examination on multiple collections"}, {"letter": "D", "text": "Stool GDH antigen with PCR for TcdB on unformed stool"}, {"letter": "E", "text": "Stool culture with a multiplex molecular panel"}], "answer": "E", "explanation": "Blood, mucus, fever, and tenesmus after foreign travel are red flags, and a red flag is what takes a patient out of the no-testing category. Culture with a molecular panel is what names the organism, and naming it is what decides whether antibiotics are given at all. A medication review and a toxin assay chase exposures he has not had.", "objective": "", "section": "acute diarrhea of less than two weeks, cause not yet named", "pcase": "DI-A3", "pgroup": "DI-A"}, {"id": "7A", "group": 7, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Cysts and trophozoites on a repeat stool collection"}, {"letter": "B", "text": "Watery stool with no blood and no fecal leukocytes"}, {"letter": "C", "text": "A positive stool antigen for Giardia"}, {"letter": "D", "text": "Fecal leukocytes and lactoferrin present"}, {"letter": "E", "text": "A positive screen that does not distinguish infection from colonization"}], "answer": "D", "explanation": "There are two mechanisms to sort between: toxin-mediated disease produces large-volume watery stool with less fever and less pain, while invasive disease produces smaller-volume bloody or mucoid stool with fever and tenesmus. Organisms that invade the mucosa draw neutrophils into the lumen, so an inflammatory marker in the stool marks the invasive form.", "objective": "", "section": "acute diarrhea of less than two weeks, cause not yet named", "pcase": "DI-A3", "pgroup": "DI-A"}, {"id": "7B", "group": 7, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Parasitic infectious diarrhea"}, {"letter": "B", "text": "Bacterial infectious diarrhea"}, {"letter": "C", "text": "Viral infectious diarrhea"}, {"letter": "D", "text": "Clostridioides difficile infection"}, {"letter": "E", "text": "Medication-related diarrhea"}], "answer": "B", "explanation": "Foreign travel carries roughly an 80% probability of a bacterial cause, and fever with bloody mucoid stool and a positive inflammatory marker is the invasive bacterial pattern. C. difficile follows recent antibiotics, which he has not taken, and a parasitic illness runs for weeks with greasy stool rather than six days of dysentery.", "objective": "", "section": "acute diarrhea of less than two weeks, cause not yet named", "pcase": "DI-A3", "pgroup": "DI-A"}, {"id": "7C", "group": 7, "stem": "He has bacterial infectious diarrhea. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Withdrawal or substitution of the offending medication"}, {"letter": "B", "text": "Oral fidaxomicin or oral vancomycin for 10 days"}, {"letter": "C", "text": "Oral rehydration with a bland diet"}, {"letter": "D", "text": "Rehydration plus tinidazole, metronidazole, or nitazoxanide by organism"}, {"letter": "E", "text": "Rehydration, then antibiotics chosen by organism and severity"}], "answer": "E", "explanation": "Rehydration and supportive care are the base for every organism, and antibiotics are layered on top only once the organism and the severity are known. Reaching for an antibiotic before the panel returns is how a patient with Shiga-toxin-producing E. coli is pushed toward hemolytic uremic syndrome.", "objective": "", "section": "acute diarrhea of less than two weeks, cause not yet named", "pcase": "DI-A3", "pgroup": "DI-A"}, {"id": "8", "group": 8, "stem": "A 38-year-old woman comes to the primary care clinic with four days of watery diarrhea that is now streaked with blood, along with cramping. She returned a week ago from a month in Southeast Asia, where she drank untreated water in a rural village. She has taken no antibiotics and takes a combined oral contraceptive. Her temperature is 38.0°C (100.4°F), blood pressure is 116/74 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has a low-grade fever, diffuse abdominal tenderness without rebound, moist mucous membranes, and no right lower quadrant localization.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool GDH antigen with PCR for TcdB on unformed stool"}, {"letter": "B", "text": "Stool ova and parasite examination on multiple collections"}, {"letter": "C", "text": "Stool Giardia antigen test"}, {"letter": "D", "text": "Stool multiplex PCR"}, {"letter": "E", "text": "No stool study — a clinical diagnosis in a returning traveler"}], "answer": "D", "explanation": "Blood in the stool takes this out of the empirically treated category, and a multiplex panel names the organism from a single specimen in hours. Ova and parasite examination and a Giardia antigen answer a weeks-long greasy-stool question, and a toxin assay belongs to a patient who has had antibiotics.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D2", "pgroup": "DI-D"}, {"id": "8A", "group": 8, "stem": "Which of the following initial test results is most likely to be present?", "options": [{"letter": "A", "text": "Watery then bloody stool after raw shellfish with a PCR positive for Vibrio parahaemolyticus"}, {"letter": "B", "text": "Severe periumbilical pain with ten or more stools daily and a PCR positive for Campylobacter"}, {"letter": "C", "text": "Bloody mucoid stool with tenesmus and a PCR positive for Shigella"}, {"letter": "D", "text": "Fecal white cells with a PCR positive for enteroinvasive E. coli"}, {"letter": "E", "text": "Bloody stool with minimal fever and a PCR positive for Shiga-toxin-producing E. coli"}], "answer": "D", "explanation": "This organism invades the epithelial cells of the colon, which is why white cells appear in the stool and why the illness looks like shigellosis. Untreated water abroad is its exposure; raw shellfish and poultry point elsewhere, and an enterohemorrhagic strain runs with little or no fever.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D2", "pgroup": "DI-D"}, {"id": "8B", "group": 8, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Vibrio parahaemolyticus infection"}, {"letter": "B", "text": "Enteroinvasive E. coli infection"}, {"letter": "C", "text": "Enterohemorrhagic E. coli infection"}, {"letter": "D", "text": "Traveler's diarrhea from enterotoxigenic E. coli"}, {"letter": "E", "text": "Shigellosis"}], "answer": "B", "explanation": "Watery stool turning bloody with fever and fecal white cells after drinking untreated water abroad is the invasive strain, which after enterotoxigenic E. coli is the next most common organism behind traveler's diarrhea. Enterotoxigenic disease is watery and non-bloody, and shigellosis brings high fever with prominent tenesmus.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D2", "pgroup": "DI-D"}, {"id": "8C", "group": 8, "stem": "She has enteroinvasive E. coli infection. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Azithromycin 1000 mg once plus loperamide"}, {"letter": "B", "text": "Supportive care with azithromycin only if the illness is severe"}, {"letter": "C", "text": "Supportive care with hydration"}, {"letter": "D", "text": "Supportive care with serial monitoring for hemolytic uremic syndrome and no antibiotics"}, {"letter": "E", "text": "Supportive care plus ciprofloxacin or azithromycin"}], "answer": "C", "explanation": "The illness is self-limited in an otherwise well patient, so hydration and supportive care are the whole of first-line treatment. Antibiotics are always indicated in shigellosis but not here, and the single-dose azithromycin plus loperamide regimen belongs to watery, non-bloody traveler's diarrhea.", "objective": "", "section": "diarrhea traced to one specific food or water exposure, with blood in the stool out of proportion to the fever", "pcase": "DI-D2", "pgroup": "DI-D"}, {"id": "9", "group": 9, "stem": "A 27-year-old man comes to the primary care clinic with three weeks of watery, foul-smelling, greasy diarrhea that floats, with no blood. He has bloating, excessive flatulence, and cramping, and he has lost 3 kg. A month ago he spent ten days backpacking in the Rockies, drinking from a stream and filtering only some of it; two companions from the trip are also ill. He has had no daycare contact and has taken no antibiotics. His temperature is 37.5°C (99.5°F), blood pressure is 118/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has a low-grade fever, abdominal distention with tympany, no blood on rectal examination, no hepatomegaly, and no right upper quadrant tenderness.\n\nStudies:\n    WBC — 7,400/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool Giardia antigen test"}, {"letter": "B", "text": "Stool ova and parasite examination on multiple collections"}, {"letter": "C", "text": "Stool Cryptosporidium antigen assay"}, {"letter": "D", "text": "Stool and serum antigen assays for Entamoeba histolytica"}, {"letter": "E", "text": "IgA anti-tissue transglutaminase with a total IgA"}], "answer": "A", "explanation": "Stream water, a backpacking trip, ill companions, and three weeks of greasy non-bloody stool point at one organism, and the antigen assay is the preferred test for it because microscopy is less sensitive. Testing for the amebic or cryptosporidial organisms answers questions raised by blood, hepatomegaly, or advanced immunosuppression, none of which he has.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G2", "pgroup": "DI-G"}, {"id": "9A", "group": 9, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Trophozoites and cysts on a repeat collection after a negative first examination"}, {"letter": "B", "text": "A positive IgA anti-tissue transglutaminase with iron deficiency anemia"}, {"letter": "C", "text": "A positive stool antigen with cysts and trophozoites on microscopy"}, {"letter": "D", "text": "Stool and serum antigen positive for Entamoeba histolytica with tender hepatomegaly"}, {"letter": "E", "text": "A CD4 count of 58/µL with high-volume watery stool"}], "answer": "C", "explanation": "The organism exists in two forms: cysts are ingested and environmentally resistant, and trophozoites are released in the proximal small intestine, where they do the damage that produces malabsorptive stool. A normal white count with no blood in the stool alongside greasy stool is the tell that separates this from an invasive infection.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G2", "pgroup": "DI-G"}, {"id": "9B", "group": 9, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Celiac disease"}, {"letter": "B", "text": "Giardiasis"}, {"letter": "C", "text": "Amebiasis"}, {"letter": "D", "text": "Shigellosis"}, {"letter": "E", "text": "Cryptosporidiosis"}], "answer": "B", "explanation": "It is the most common parasitic diarrhea worldwide, and contaminated fresh water with campers and backpackers is its signature exposure. Amebiasis brings blood, tenesmus, and tender hepatomegaly; cryptosporidial disease is high-volume watery stool in advanced HIV; and shigellosis runs for days with high fever rather than weeks.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G2", "pgroup": "DI-G"}, {"id": "9C", "group": 9, "stem": "He has giardiasis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Rehydration plus tinidazole, metronidazole, or nitazoxanide chosen by organism"}, {"letter": "B", "text": "Tinidazole as a single dose"}, {"letter": "C", "text": "Metronidazole or tinidazole, then paromomycin"}, {"letter": "D", "text": "Supportive care with oral rehydration plus antiretroviral therapy"}, {"letter": "E", "text": "Supportive care plus ciprofloxacin or azithromycin"}], "answer": "B", "explanation": "Tinidazole is first line above the age of three and is given as a single dose, alongside hydration. A symptomatic patient is always treated rather than watched for spontaneous resolution. The two-drug amebic regimen exists to clear luminal cysts after tissue disease, which is not what he has.", "objective": "", "section": "diarrhea measured in weeks after a water, travel, daycare, or immunocompromise exposure (protozoal disease)", "pcase": "DI-G2", "pgroup": "DI-G"}, {"id": "10", "group": 10, "stem": "A 57-year-old man presents to the primary care clinic with four months of loose stools, five or six a day, some of them containing blood. The diarrhea wakes him at night and does not stop when he stops eating. He has lost 6 kg. He has not traveled, has taken no antibiotics, uses no artificial sweeteners, and has had no bowel surgery, resection, or radiation. He takes no medications, and his sister has Crohn's disease. His temperature is 37.2°C (99.0°F), blood pressure is 122/76 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. He is pale with angular cheilitis, his thyroid is normal to palpation, and his abdomen is mildly tender throughout without rebound. He has no edema and no perianal disease.\n\nStudies:\n    Hemoglobin / hematocrit — 10.8 g/dL / 32%\n    MCV — 76 fL\n    Ferritin — 9 ng/mL\n    Albumin — 3.2 g/dL\n    C-reactive protein — 38 mg/L\n    ESR — 44 mm/h\n    TSH — 2.1 mIU/L\n    Stool studies — Negative for persistent infection\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Colonoscopy with random biopsies of normal-appearing mucosa"}, {"letter": "B", "text": "A hydrogen breath test"}, {"letter": "C", "text": "An empiric lactose-free diet trial for two weeks"}, {"letter": "D", "text": "Upper endoscopy with duodenal biopsy"}, {"letter": "E", "text": "Fecal calprotectin"}], "answer": "E", "explanation": "The first branch point in diarrhea lasting beyond a month is organic against functional, and fecal calprotectin is what separates them — 92% sensitive and 82% specific for inflammatory bowel disease. A dietary trial or a breath test answers a question that only arises once inflammation has been excluded.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H1", "pgroup": "DI-H"}, {"id": "10A", "group": 10, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A positive hydrogen breath test"}, {"letter": "B", "text": "An endoscopically normal colon"}, {"letter": "C", "text": "An IgA anti-tissue transglutaminase of 118 U/mL"}, {"letter": "D", "text": "Osmotic diarrhea resolving on a lactose-free trial"}, {"letter": "E", "text": "A fecal calprotectin of 480 µg/g"}], "answer": "E", "explanation": "Calprotectin is released from neutrophils migrating into the gut lumen, so a raised value tracks mucosal inflammation rather than symptoms. A value this high alongside anemia, a low albumin, and a raised C-reactive protein places the disease in the organic column and rules out a functional explanation.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H1", "pgroup": "DI-H"}, {"id": "10B", "group": 10, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "A hydrogen breath test after a lactose load"}, {"letter": "B", "text": "Colonoscopy with biopsy"}, {"letter": "C", "text": "Repeat stool studies for enteric pathogens"}, {"letter": "D", "text": "Small bowel aspirate with culture"}, {"letter": "E", "text": "Upper endoscopy with duodenal biopsy"}], "answer": "B", "explanation": "Tissue is the diagnosis. Colonoscopy visualizes the mucosa and biopsy establishes the histology, and normal-appearing segments are sampled as well so that a microscopic colitis is not missed. Duodenal biopsy and breath testing look for small-bowel disease, which the bloody stool does not suggest.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H1", "pgroup": "DI-H"}, {"id": "10C", "group": 10, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Inflammatory bowel disease"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Celiac disease"}, {"letter": "D", "text": "Microscopic colitis"}, {"letter": "E", "text": "Lactose intolerance"}], "answer": "A", "explanation": "Bloody stool marks the diarrhea as inflammatory, and diarrhea that wakes the patient, persists through fasting, and comes with weight loss and a family history of Crohn's disease points to the bowel wall rather than to motility. Irritable bowel syndrome spares sleep and carries no alarm feature.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H1", "pgroup": "DI-H"}, {"id": "11", "group": 11, "stem": "A 32-year-old woman presents to the primary care clinic with a year of pale, greasy, floating stools, 7 kg of weight loss, abdominal distention, and flatulence. She eats a normal gluten-containing diet and has never tried removing gluten. For six months she has had an itchy blistering rash on her elbows and knees. Her mother has Hashimoto thyroiditis. Her temperature is 36.8°C (98.2°F), blood pressure is 106/68 mm Hg, pulse is 84/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has pruritic papulovesicles over the extensor surfaces of the elbows and knees, pallor with mild temporal muscle wasting, and a distended, tympanitic, non-tender abdomen. There is no perianal disease.\n\nStudies:\n    IgA anti-tissue transglutaminase — 118 U/mL, with a normal total IgA\n    Hemoglobin / hematocrit — 10.2 g/dL / 31%\n    MCV — 74 fL\n    Ferritin — 6 ng/mL\n    Iron saturation — 6%\n    Vitamin B12 — 180 pg/mL\n    Folate — 2.4 ng/mL\n    25-OH vitamin D — 14 ng/mL\n    Calcium — 8.4 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Small bowel aspirate with culture"}, {"letter": "B", "text": "Colonoscopy with biopsy"}, {"letter": "C", "text": "Upper endoscopy with duodenal biopsy"}, {"letter": "D", "text": "A hydrogen breath test"}, {"letter": "E", "text": "HLA-DQ2 and DQ8 genotyping"}], "answer": "C", "explanation": "Serology selects who to biopsy; it does not make the diagnosis. Duodenal histology is the gold standard and is required before a lifelong dietary commitment is imposed. Genotyping is reserved for the patient already off gluten or for a diagnosis that stays uncertain, because a positive result is far too common to confirm anything.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H2", "pgroup": "DI-H"}, {"id": "11A", "group": 11, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A breath hydrogen rise above 20 ppm after a lactose load"}, {"letter": "B", "text": "Mucosal and histologic change of inflammatory bowel disease"}, {"letter": "C", "text": "Villous atrophy, crypt hyperplasia, and intraepithelial lymphocytosis"}, {"letter": "D", "text": "A thickened subepithelial collagen band on colonic biopsy"}, {"letter": "E", "text": "Bacterial overgrowth on aspirate culture"}], "answer": "C", "explanation": "The immune response to gluten is directed at the small-bowel mucosa, flattening the villi that carry the absorptive surface while the crypts proliferate beneath them and lymphocytes infiltrate the epithelium. The loss of surface area is what produces the greasy stool, the iron and B12 deficiency, and the low vitamin D.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H2", "pgroup": "DI-H"}, {"id": "11B", "group": 11, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small intestinal bacterial overgrowth"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Lactose intolerance"}, {"letter": "D", "text": "Microscopic colitis"}, {"letter": "E", "text": "Celiac disease"}], "answer": "E", "explanation": "Greasy floating stools with weight loss and deficiencies of iron, B12, folate, and vitamin D are small-bowel malabsorption, and the strongly positive transglutaminase antibody names its cause. The pruritic papulovesicular rash on the extensor surfaces is dermatitis herpetiformis, which appears in fewer than 10% of these patients but is almost always accompanied by celiac changes on biopsy.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H2", "pgroup": "DI-H"}, {"id": "11C", "group": 11, "stem": "She has celiac disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Rifaximin, metronidazole, or amoxicillin-clavulanate"}, {"letter": "B", "text": "A low FODMAP diet with alcohol and caffeine avoidance"}, {"letter": "C", "text": "Lactose limited to threshold with lactase enzyme replacement"}, {"letter": "D", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "E", "text": "Withdrawal of NSAIDs and PPIs with loperamide or bismuth subsalicylate"}], "answer": "D", "explanation": "Removing wheat, rye, and barley for life is the whole of the treatment, since the mucosal injury is antigen driven and recovers only when the antigen is gone. The deficiencies the malabsorption has already produced — iron, folate, B12, calcium, and vitamin D — are replaced alongside it, and a dietitian referral is part of the prescription rather than an optional extra.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H2", "pgroup": "DI-H"}, {"id": "12", "group": 12, "stem": "A 52-year-old man on the surgical unit is seen on the third day after an open ventral hernia repair for bloating and distention with diffuse mild abdominal discomfort, nausea, and two episodes of vomiting. He has passed no flatus since the operation. His diet was advanced yesterday and he did not tolerate it. He has been receiving hydromorphone by patient-controlled analgesia since surgery. His temperature is 37.0°C (98.6°F), blood pressure is 126/78 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 97% on room air. His abdomen is uniformly distended and soft with mild diffuse tenderness and absent bowel sounds, without guarding, rebound, or focal tenderness. The incision is clean.\n\nStudies:\n    Potassium — 2.9 mEq/L\n    Magnesium — 1.3 mg/dL\n    Sodium / chloride — 133 mEq/L / 98 mEq/L\n    Bicarbonate — 26 mEq/L\n    BUN / creatinine — 14 mg/dL / 0.9 mg/dL\n    WBC — 8,200/mm³\n    Hemoglobin / hematocrit — 12.8 g/dL / 38%\n    Platelets — 275,000/mm³\n    Lactate — 1.1 mmol/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "B", "text": "Colonoscopy"}, {"letter": "C", "text": "Upright and supine abdominal series"}, {"letter": "D", "text": "Repeat metabolic panel with magnesium"}, {"letter": "E", "text": "Digital rectal examination"}], "answer": "C", "explanation": "Plain films come first in the distended, obstipated abdomen: they are immediate, they can be taken at the bedside, and they answer the only question that changes management, which is whether gas stops somewhere. Cross-sectional imaging is reserved for a picture the films leave unclear, and colonoscopy insufflates a bowel that is already distended.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A4", "pgroup": "CO-A"}, {"id": "12A", "group": 12, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Gas through the small bowel, colon, and rectum with no transition point"}, {"letter": "B", "text": "A U-shaped dilated sigmoid loop with a coffee bean sign and no rectal gas"}, {"letter": "C", "text": "Colon dilated to 8 cm and cecum to 9.5 cm with scant rectal gas"}, {"letter": "D", "text": "Hard stool filling the rectal vault without dilated loops"}, {"letter": "E", "text": "Step-ladder air-fluid levels with no colonic gas"}], "answer": "A", "explanation": "When the bowel stops propelling rather than being blocked, gas accumulates uniformly and reaches the rectum, because nothing is stopping it. The absence of a transition point is the finding that separates a functional problem from a mechanical one, and the loops stay modestly dilated rather than reaching obstructive calibers.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A4", "pgroup": "CO-A"}, {"id": "12B", "group": 12, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "High-grade small bowel obstruction"}, {"letter": "C", "text": "Adynamic ileus"}, {"letter": "D", "text": "Partial adhesive intestinal obstruction"}, {"letter": "E", "text": "Large bowel obstruction"}], "answer": "C", "explanation": "A silent, uniformly distended abdomen with mild diffuse pain, no peritoneal signs, no fever, and no tachycardia is the functional picture; mechanical obstruction brings hyperactive high-pitched sounds and a transition point. Recent abdominal surgery, opioids, hypokalemia, and hypomagnesemia are the drivers here, and all four are present.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A4", "pgroup": "CO-A"}, {"id": "12C", "group": 12, "stem": "He has a post-operative adynamic ileus. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "NPO, nasogastric decompression, surgical consultation, and intravenous fluids"}, {"letter": "B", "text": "NPO, nasogastric decompression, intravenous fluids, and serial examinations"}, {"letter": "C", "text": "Bowel rest, nasogastric suction, ambulation, and electrolyte correction"}, {"letter": "D", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "E", "text": "NPO, nasogastric decompression, intravenous fluids, and serial abdominal films"}], "answer": "C", "explanation": "Resting and decompressing the gut while the cause is corrected is the whole of the treatment, and here the causes are the opioid infusion and the low potassium and magnesium. Generous intravenous fluid is the reflex to avoid, because it worsens bowel wall edema and prolongs the ileus; ambulation and chewing gum stimulate the cephalocaudal reflex instead.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A4", "pgroup": "CO-A"}, {"id": "13", "group": 13, "stem": "An 80-year-old woman in the intensive care unit develops severe, poorly localized abdominal pain over six hours, with nausea and one loose stool. She was admitted two days ago with urosepsis and hypotension and has been on norepinephrine since. She has end-stage renal disease on hemodialysis, hypertension, and known atherosclerosis with a prior carotid endarterectomy. Her temperature is 37.8°C (100.0°F), blood pressure is 104/58 mm Hg on norepinephrine, pulse is 112/min, respirations are 24/min, and oxygen saturation is 96% on 2 L by nasal cannula. Her abdomen is soft and only minimally tender despite the pain she reports, with hypoactive bowel sounds and no guarding, rebound, or rigidity. No bruit is heard.\n\nStudies:\n    WBC — 17,800/mm³\n    Hemoglobin / hematocrit — 9.4 g/dL / 28%\n    Platelets — 210,000/mm³\n    Lactate — 4.1 mmol/L\n    Arterial blood gas — pH 7.30, bicarbonate 17 mEq/L, PaCO₂ 34 mm Hg\n    Sodium / potassium — 136 mEq/L / 5.4 mEq/L\n    BUN / creatinine — 62 mg/dL / 5.8 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "B", "text": "Stool studies for enteric pathogens"}, {"letter": "C", "text": "CT angiography"}, {"letter": "D", "text": "Diagnostic laparotomy"}, {"letter": "E", "text": "Colonoscopy"}], "answer": "C", "explanation": "Pain out of proportion to a soft abdomen in a patient with vascular risk is mesenteric ischemia until proven otherwise, and the arterial phase is what shows the vessels. A routine contrast-enhanced study images the bowel wall but not the mesenteric circulation, and the reversal window is two to three hours, so the definitive study is the first one ordered.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D1", "pgroup": "CO-D"}, {"id": "13A", "group": 13, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Segmental wall thickening with thumbprinting at the splenic flexure, rectum spared"}, {"letter": "B", "text": "A non-enhancing bowel wall with pneumatosis and free fluid"}, {"letter": "C", "text": "An abrupt filling defect in the superior mesenteric artery with non-opacified branches"}, {"letter": "D", "text": "Localized sigmoid wall thickening with pericolonic fat stranding and diverticula"}, {"letter": "E", "text": "A patent superior mesenteric artery origin with diffuse distal branch narrowing"}], "answer": "E", "explanation": "In a low-flow state the vessels are open but underperfused, so the trunk fills normally while the small distal branches constrict and the bowel they supply enhances poorly. The absence of a discrete cutoff is what distinguishes this from an embolus, and the absence of pneumatosis places the injury short of transmural infarction.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D1", "pgroup": "CO-D"}, {"id": "13B", "group": 13, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Complications of bowel obstruction"}, {"letter": "B", "text": "Acute mesenteric ischemia"}, {"letter": "C", "text": "Nonocclusive ischemic bowel disease"}, {"letter": "D", "text": "Ischemic colitis"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "C", "explanation": "Sepsis, hypotension, and days of a vasoconstrictor infusion starve the gut without occluding anything, and the rising lactate with a metabolic acidosis signals that the injury has reached the bowel wall. Acute mesenteric ischemia is an embolic event with a discrete arterial cutoff, and ischemic colitis gives tenderness proportionate to the pain over the segment involved.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D1", "pgroup": "CO-D"}, {"id": "13C", "group": 13, "stem": "She has nonocclusive ischemic bowel disease from a low-flow state. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Ciprofloxacin and metronidazole with clear liquids"}, {"letter": "B", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}, {"letter": "C", "text": "Bowel rest, intravenous fluids, ciprofloxacin, and metronidazole"}, {"letter": "D", "text": "Withdrawal of vasoconstrictors with fluids, antibiotics, and heparin"}, {"letter": "E", "text": "Systemic heparin, antibiotics, and mesenteric revascularization"}], "answer": "D", "explanation": "The treatment is to restore perfusion, which means resuscitating the circulation and taking away the drug that is squeezing the mesenteric branches shut. Vasoconstrictors are part of the disease here rather than part of the treatment, and there is no occlusion to open, so revascularization has no target. Serial examinations and lactates follow, because improving pain in this setting can mean infarction rather than recovery.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D1", "pgroup": "CO-D"}, {"id": "14", "group": 14, "stem": "A 34-year-old woman who is 32 weeks pregnant presents to the primary care clinic with three weeks of bright red blood streaking the stool and appearing on the toilet paper after every bowel movement, along with anal itching. She has no pain with or after defecation. She has been straining with hard stools since the second trimester and spends long stretches sitting on the toilet with her phone. She takes prenatal vitamins with iron and has had no prior anorectal disease. Her temperature is 36.8°C (98.2°F), blood pressure is 112/68 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 99% on room air. There is no external swelling and nothing is palpable on digital rectal examination; she has a small perianal skin tag.\n\nStudies:\n    Hemoglobin / hematocrit — 11.2 g/dL / 34%\n    MCV — 84 fL\n    Ferritin — 22 ng/mL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Colonoscopy"}, {"letter": "B", "text": "Inspection with gentle anal stretching"}, {"letter": "C", "text": "Perineal inspection while straining or squatting"}, {"letter": "D", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "E", "text": "Anoscopy"}], "answer": "E", "explanation": "Anoscopy is the study that sees the anal canal above the dentate line, which digital examination cannot reach and which is where painless bright red bleeding originates. It is done in the clinic in minutes, and it settles both whether the source is anorectal and which side of the dentate line it sits on.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G2", "pgroup": "CO-G"}, {"id": "14A", "group": 14, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "An engorged plexus above the dentate line that reduces spontaneously"}, {"letter": "B", "text": "A full-thickness rectal wall protruding with concentric stacked-coin folds"}, {"letter": "C", "text": "Multiple colonic diverticula without inflammation, sigmoid predominant, with a visible vessel"}, {"letter": "D", "text": "Segmental wall thickening with thumbprinting at the splenic flexure"}, {"letter": "E", "text": "A posterior midline crack with raised edges and a sentinel tag"}], "answer": "A", "explanation": "Straining and prolonged sitting raise pressure in the anal cushions and engorge them, and the gravid uterus adds to the venous congestion. Protrusion with straining that resolves without help defines grade II disease, and the location above the dentate line is why the bleeding is painless.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G2", "pgroup": "CO-G"}, {"id": "14B", "group": 14, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Internal hemorrhoids"}, {"letter": "B", "text": "Ischemic colitis"}, {"letter": "C", "text": "Rectal prolapse"}, {"letter": "D", "text": "Bleeding diverticulosis"}, {"letter": "E", "text": "Anal fissure"}], "answer": "A", "explanation": "Small-volume bright red bleeding with every bowel movement, itching, and no pain in a straining, pregnant patient is the classic anal cushion. Pain is not a feature unless something is thrombosed, incarcerated, or strangulated, and painful bleeding would point instead to a fissure.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G2", "pgroup": "CO-G"}, {"id": "14C", "group": 14, "stem": "She has grade II internal hemorrhoids. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Increased water and fiber with sitz baths and colonoscopy before any topical therapy"}, {"letter": "B", "text": "Increased water and fiber with sitz baths and a hydrocortisone suppository for six weeks"}, {"letter": "C", "text": "Increased water and fiber with sitz baths, stool softeners, and hemorrhoidectomy"}, {"letter": "D", "text": "Increased water and fiber with sitz baths, stool softeners, and topical astringents"}, {"letter": "E", "text": "Increased water and fiber with sitz baths and rubber band ligation at this visit"}], "answer": "D", "explanation": "Bulk, water, and softened stool take the straining away, and astringents such as zinc, witch hazel, and calamine settle the itching. A hydrocortisone preparation must not run past seven days because it thins the perianal mucosa, banding is for disease that has failed conservative therapy, colonoscopy is what rectal bleeding over 45 earns, and hemorrhoidectomy is reserved for incarcerated or strangulated disease.", "objective": "", "section": "bright red blood per rectum", "pcase": "CO-G2", "pgroup": "CO-G"}, {"id": "15", "group": 15, "stem": "A 76-year-old woman presents to the primary care clinic with a painless mass that comes out of her anus when she strains and that she has pushed back by hand for six months. She has mucus discharge, a feeling of incomplete evacuation, constipation, occasional bright red spotting, and leakage of stool. She has had five vaginal deliveries and decades of chronic straining with constipation, and has had no prior pelvic or anorectal surgery. Her temperature is 36.8°C (98.2°F), blood pressure is 138/78 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. Nothing protrudes at rest. Digital rectal examination shows decreased sphincter tone, and there is a small superficial anterior rectal ulcer.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Inspection of the natal cleft"}, {"letter": "B", "text": "Anoscopy of the anal canal"}, {"letter": "C", "text": "Perineal inspection during straining"}, {"letter": "D", "text": "Inspection with gentle anal stretching"}, {"letter": "E", "text": "Anal manometry with anorectal ultrasound"}], "answer": "C", "explanation": "The diagnosis is clinical and depends on reproducing what the patient describes, so the examination is done while she strains or squats rather than lying still. A five-minute strain in the office brings out the protrusion when the history is convincing and the resting examination is not.", "objective": "", "section": "a lump or protrusion at the perineum", "pcase": "CO-H2", "pgroup": "CO-H"}, {"id": "15A", "group": 15, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Chronically prolapsed irreducible cushions with radial folds in separate bundles"}, {"letter": "B", "text": "Pain felt internally on rectal examination with no external fluctuance"}, {"letter": "C", "text": "A fluctuant midline collection above the anus with a hair-bearing sinus"}, {"letter": "D", "text": "A full-thickness rectal wall protruding with concentric stacked-coin folds"}, {"letter": "E", "text": "A posterior midline crack with raised edges and a sentinel tag"}], "answer": "D", "explanation": "The fold pattern is the discriminator. Concentric circular rings with the whole thickness of the wall palpable mean the rectum itself has telescoped through the anus, whereas radial folds arranged in separate bundles are prolapsing internal hemorrhoids and short partial-thickness radial folds are mucosal pro
