 of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Drug-induced hepatitis"}, {"letter": "B", "text": "Acetaminophen hepatotoxicity"}, {"letter": "C", "text": "Budd-Chiari syndrome"}, {"letter": "D", "text": "Autoimmune hepatitis"}, {"letter": "E", "text": "Acute hepatic failure"}], "answer": "C", "explanation": "Obstructed hepatic venous outflow in a patient with a JAK2-mutated myeloproliferative disease names the disease outright. This is the vascular cause of liver failure, and it is treated by restoring flow rather than by supportive care alone."}, {"key": "mgmt", "path": "both", "stem": "She has Budd-Chiari syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "N-acetylcysteine with intensive care support and transplant referral"}, {"letter": "B", "text": "Sodium restriction and diuretics with urgent referral for TIPS"}, {"letter": "C", "text": "Withdrawal of her oral contraceptive alone"}, {"letter": "D", "text": "Anticoagulation with urgent referral for TIPS"}, {"letter": "E", "text": "Prednisone 40 mg daily with urgent hepatology referral"}], "answer": "D", "explanation": "The clot is the disease, so anticoagulation plus a shunt that re-establishes outflow is what saves the liver. Treating the ascites with diuretics is the trap the case is built around — it manages the consequence and leaves the obstruction in place. Stopping the contraceptive matters but does nothing for the thrombus already there."}, {"key": "escalate", "path": "both", "stem": "She is anticoagulated and undergoes TIPS, but her liver function continues to deteriorate into acute liver failure. Which of the following should be done next?", "options": [{"letter": "A", "text": "Prednisone 40 mg daily"}, {"letter": "B", "text": "Liver transplantation"}, {"letter": "C", "text": "Sodium restriction with diuretics"}, {"letter": "D", "text": "N-acetylcysteine as soon as possible"}, {"letter": "E", "text": "Withdrawal of her oral contraceptive"}], "answer": "B", "explanation": "When restoring flow does not rescue the liver, or once cirrhosis is established, transplant is the remaining option. The alternatives listed treat other diseases in this differential and none of them replaces a failing organ."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to ultrasound in a patient with newly elevated liver tests?", "options": [{"letter": "A", "text": "Obtain an ultrasound only when the transaminases exceed 400 U/L"}, {"letter": "B", "text": "Obtain an ultrasound only when the serologic workup is negative"}, {"letter": "C", "text": "Obtain an ultrasound only when ascites is present"}, {"letter": "D", "text": "Obtain an ultrasound in every patient with newly elevated liver tests"}, {"letter": "E", "text": "Obtain an ultrasound only when a thrombophilic disorder is known"}], "answer": "D", "explanation": "The study looks for patent vasculature, duct obstruction or dilation, masses, signs of cirrhosis, and steatosis, and it is the rule that makes this diagnosis findable at all. Reserving it for patients who already look thrombophilic guarantees that the ones who do not are worked up as cirrhosis and treated with diuretics."}]}, {"case": "VH-B1", "group": "VH-B", "section": "hepatitis B, read off the serologic panel", "objective": "", "vignette_workup": "A 38-year-old woman returns to the primary care clinic three weeks after an episode of jaundice, dark urine, malaise, nausea, and aching joints that has now largely resolved, although mild fatigue persists. She had a new sexual partner about four months ago and did not use barrier protection. She was never vaccinated against hepatitis B, has no injection drug use, no tattoos, no travel, and no transfusions, and drinks two glasses of wine a week. Her temperature is 37.0°C (98.6°F), blood pressure is 116/74 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her sclera are faintly icteric and the liver edge is palpable 2 cm below the costal margin and mildly tender. There is no rash, no splenomegaly, no spider angiomata, and no asterixis.", "labs_workup": [["AST / ALT", "640 U/L / 810 U/L"], ["Alkaline phosphatase", "140 U/L"], ["Total bilirubin", "4.2 mg/dL (direct 2.9)"], ["Albumin", "4.1 g/dL"], ["PT / INR", "12.8 s / 1.1"], ["WBC / hemoglobin / platelets", "5,400/mm³ / 12.9 g/dL / 218,000/mm³"], ["Hepatitis A IgM / hepatitis C antibody", "Negative / negative"]], "vignette_recog": "A 38-year-old woman returns to the primary care clinic three weeks after an episode of jaundice, dark urine, malaise, nausea, and aching joints that has now largely resolved, although mild fatigue persists. She had a new sexual partner about four months ago and did not use barrier protection. She was never vaccinated against hepatitis B, has no injection drug use, no tattoos, no travel, and no transfusions, and drinks two glasses of wine a week. Her temperature is 37.0°C (98.6°F), blood pressure is 116/74 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her sclera are faintly icteric and the liver edge is palpable 2 cm below the costal margin and mildly tender. There is no rash, no splenomegaly, no spider angiomata, and no asterixis.", "labs_recog": [["Hepatitis B panel", "HBsAg negative, HBsAb negative, HBcAb positive — the core antibody is IgM"], ["HBeAg / HBeAb", "Negative / positive"], ["HBV DNA", "1,900 IU/mL"], ["AST / ALT", "640 U/L / 810 U/L"], ["Alkaline phosphatase", "140 U/L"], ["Total bilirubin", "4.2 mg/dL (direct 2.9)"], ["Albumin", "4.1 g/dL"], ["PT / INR", "12.8 s / 1.1"], ["Hepatitis A IgM / hepatitis C antibody", "Negative / negative"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HBsAg with HBeAg, HBeAb, and HBV DNA"}, {"letter": "B", "text": "HBsAg with total anti-HDV antibody"}, {"letter": "C", "text": "HBV DNA by PCR"}, {"letter": "D", "text": "HBsAg, HBsAb, and HBcAb"}, {"letter": "E", "text": "HBsAg, HBsAb, and HBcAb with HBcAb IgM"}], "answer": "E", "explanation": "An unprotected exposure four months ago with a hepatitic illness makes hepatitis B the question, and the three-marker screen is the entry panel. The IgM fraction of the core antibody has to be on it, because there is a phase of this infection in which it is the only marker that will be positive."}, {"key": "result", "path": "W", "stem": "Which of the following patterns is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg positive, HBsAb negative, HBcAb IgM positive"}, {"letter": "B", "text": "HBsAg negative, HBsAb positive, HBcAb positive"}, {"letter": "C", "text": "HBsAg positive, HBsAb negative, HBcAb IgG positive"}, {"letter": "D", "text": "HBsAg negative, HBsAb positive, HBcAb negative"}, {"letter": "E", "text": "HBsAg negative, HBsAb negative, HBcAb IgM positive"}], "answer": "E", "explanation": "Surface antigen clears before surface antibody appears, and in the gap between them the core IgM stands alone. An illness that peaked and is now settling three weeks later lands squarely in that gap."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B with high-level viral replication"}, {"letter": "B", "text": "Chronic hepatitis B infection"}, {"letter": "C", "text": "Resolved (cleared) hepatitis B infection"}, {"letter": "D", "text": "Vaccine-induced immunity to hepatitis B"}, {"letter": "E", "text": "Acute hepatitis B in the serologic window period"}], "answer": "E", "explanation": "A negative surface antigen does not exclude acute hepatitis B — reading the panel on HBsAg alone is how this infection gets called \"not infected.\" Cleared infection would already show a surface antibody, and vaccine immunity never produces a core antibody at all."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B with high-level viral replication"}, {"letter": "B", "text": "Resolved (cleared) hepatitis B infection"}, {"letter": "C", "text": "Vaccine-induced immunity to hepatitis B"}, {"letter": "D", "text": "Acute hepatitis B in the serologic window period"}, {"letter": "E", "text": "Chronic hepatitis B infection"}], "answer": "D", "explanation": "Surface antigen already cleared, surface antibody not yet made, and core IgM the only positive marker is the window period. The low viral load with a negative HBeAg says replication has largely stopped, which is why the surface antigen is gone."}, {"key": "mgmt", "path": "both", "stem": "She has acute hepatitis B in the window period. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with vaccination of her contacts"}, {"letter": "B", "text": "Interferon added to therapy for hepatitis B"}, {"letter": "C", "text": "Tenofovir or entecavir, continued lifelong"}, {"letter": "D", "text": "No treatment, with immunity documented in the record"}, {"letter": "E", "text": "Serial ALT and HBV DNA every 6 to 12 months"}], "answer": "A", "explanation": "Uncomplicated acute infection needs rest, hydration, and avoidance of alcohol and other hepatotoxins, with the panel repeated at 6 months to document resolution. The people who need an intervention are her non-immune contacts, who get the vaccine series."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to hepatitis B screening?", "options": [{"letter": "A", "text": "Screen only pregnant patients and household contacts"}, {"letter": "B", "text": "Screen only patients with a high-risk sexual or substance-use history"}, {"letter": "C", "text": "Screen only patients who were never vaccinated"}, {"letter": "D", "text": "Screen only patients with abnormal liver tests"}, {"letter": "E", "text": "Screen every adult at least once"}], "answer": "E", "explanation": "Screening is universal for adults once, with repeat testing layered on top for pregnancy, HIV, abnormal liver tests, incarceration, hemodialysis, household contact, and high-risk exposure. Restricting the program to people who already look at risk is what leaves infections like hers undetected for years."}]}, {"case": "VH-B2", "group": "VH-B", "section": "hepatitis B, read off the serologic panel", "objective": "", "vignette_workup": "A 22-year-old man presents to the emergency department with four days of jaundice and dark urine, two weeks of malaise, nausea, and vomiting, aching wrists and knees, and an itchy rash on the trunk. He had a tattoo at an unlicensed shop three months ago and several new sexual partners without barrier protection. He immigrated at age 12 and never received the hepatitis B series. He has no injection drug use and drinks no alcohol. His temperature is 38.2°C (100.8°F), blood pressure is 122/76 mm Hg, pulse is 102/min, respirations are 18/min, and oxygen saturation is 98% on room air. He has icteric sclera and jaundiced skin, tender hepatomegaly 4 cm below the costal margin, and urticarial wheals over the trunk. He is alert, with no asterixis and no ascites.", "labs_workup": [["AST / ALT", "1,240 U/L / 1,760 U/L"], ["Alkaline phosphatase", "180 U/L"], ["Total bilirubin", "9.1 mg/dL (direct 6.4)"], ["Albumin", "3.8 g/dL"], ["PT / INR", "14.0 s / 1.2"], ["WBC / hemoglobin / platelets", "6,600/mm³ / 14.8 g/dL / 205,000/mm³"], ["Hepatitis A IgM / hepatitis C antibody", "Negative / negative"]], "vignette_recog": "A 22-year-old man presents to the emergency department with four days of jaundice and dark urine, two weeks of malaise, nausea, and vomiting, aching wrists and knees, and an itchy rash on the trunk. He had a tattoo at an unlicensed shop three months ago and several new sexual partners without barrier protection. He immigrated at age 12 and never received the hepatitis B series. He has no injection drug use and drinks no alcohol. His temperature is 38.2°C (100.8°F), blood pressure is 122/76 mm Hg, pulse is 102/min, respirations are 18/min, and oxygen saturation is 98% on room air. He has icteric sclera and jaundiced skin, tender hepatomegaly 4 cm below the costal margin, and urticarial wheals over the trunk. He is alert, with no asterixis and no ascites.", "labs_recog": [["Hepatitis B panel", "HBsAg positive, HBsAb negative, HBcAb IgM positive"], ["HBeAg / HBeAb", "Positive / negative"], ["HBV DNA", "2.4 × 10⁸ IU/mL"], ["AST / ALT", "1,240 U/L / 1,760 U/L"], ["Alkaline phosphatase", "180 U/L"], ["Total bilirubin", "9.1 mg/dL (direct 6.4)"], ["Albumin", "3.8 g/dL"], ["PT / INR", "14.0 s / 1.2"], ["Hepatitis A IgM / hepatitis C antibody", "Negative / negative"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HBsAg with HBV DNA and ALT repeated over time"}, {"letter": "B", "text": "HBsAg, HBsAb, and HBcAb without an IgM fraction"}, {"letter": "C", "text": "HBsAg with total anti-HDV antibody"}, {"letter": "D", "text": "HBsAg with HBcAb IgM"}, {"letter": "E", "text": "HBeAg and HBeAb with HBV DNA by PCR"}], "answer": "D", "explanation": "Both markers are ordered together because either one alone can mislead: the surface antigen can already have cleared, and a core antibody without its IgM fraction cannot separate a current infection from an old one. Replication markers and serial testing come after the diagnosis, not instead of it."}, {"key": "result", "path": "W", "stem": "Which of the following patterns is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg positive, HBsAb negative, HBcAb IgG positive"}, {"letter": "B", "text": "HBsAg negative, HBsAb negative, HBcAb IgM positive"}, {"letter": "C", "text": "HBsAg positive, HBsAb negative, HBcAb IgM positive"}, {"letter": "D", "text": "HBsAg negative, HBsAb positive, HBcAb negative"}, {"letter": "E", "text": "HBsAg negative, HBsAb positive, HBcAb positive"}], "answer": "C", "explanation": "An illness three months after a percutaneous and sexual exposure, still in its icteric phase, catches the infection while surface antigen is circulating and the core response is still IgM. An IgG core antibody would mean the infection is old rather than current."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B in the serologic window period"}, {"letter": "B", "text": "Vaccine-induced immunity to hepatitis B"}, {"letter": "C", "text": "Chronic hepatitis B infection"}, {"letter": "D", "text": "Acute hepatitis B"}, {"letter": "E", "text": "Resolved (cleared) hepatitis B infection"}], "answer": "D", "explanation": "Transaminases more than ten times normal with ALT above AST, arthralgia, and an urticarial rash are the serum-sickness-like prodrome of acute infection. Chronic disease is defined by surface antigen persisting past 6 months and carries an IgG rather than an IgM core antibody."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Chronic hepatitis B infection"}, {"letter": "B", "text": "Resolved (cleared) hepatitis B infection"}, {"letter": "C", "text": "Vaccine-induced immunity to hepatitis B"}, {"letter": "D", "text": "Acute hepatitis B in the serologic window period"}, {"letter": "E", "text": "Acute hepatitis B"}], "answer": "E", "explanation": "Surface antigen with an IgM core antibody and no surface antibody is current, recently acquired infection. A positive HBeAg with a viral load of 2.4 × 10⁸ IU/mL means active replication and high infectivity, which is the opposite of the window period."}, {"key": "mgmt", "path": "both", "stem": "He has acute hepatitis B. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Interferon added to therapy for hepatitis B"}, {"letter": "B", "text": "Peginterferon alfa with supportive care"}, {"letter": "C", "text": "Supportive care with avoidance of hepatotoxins"}, {"letter": "D", "text": "Serial ALT and HBV DNA every 6 to 12 months"}, {"letter": "E", "text": "Tenofovir or entecavir, continued lifelong"}], "answer": "C", "explanation": "More than 95% of immunocompetent adults clear the virus on their own within about 6 months, so bed rest, hydration, nutrition, and avoiding hepatotoxins is the whole of treatment. Peginterferon is contraindicated in acute hepatitis B, and lifelong nucleoside therapy belongs to chronic infection."}, {"key": "escalate", "path": "both", "stem": "Four weeks later his jaundice persists and his INR has risen. Which of the following should be done next?", "options": [{"letter": "A", "text": "Serial ALT and HBV DNA every 6 to 12 months"}, {"letter": "B", "text": "Oral entecavir or tenofovir"}, {"letter": "C", "text": "Continued supportive care with repeat serology at 6 months"}, {"letter": "D", "text": "Vaccination of his household and sexual contacts"}, {"letter": "E", "text": "Peginterferon alfa"}], "answer": "B", "explanation": "A protracted severe course — a rising INR with jaundice beyond four weeks — is one of the situations that earns an antiviral, alongside acute liver failure and an uncertain diagnosis. Peginterferon remains contraindicated no matter how severe the acute infection becomes."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to repeat hepatitis B surface antigen testing?", "options": [{"letter": "A", "text": "Repeat HBsAg at 6 months in every patient with acute hepatitis B"}, {"letter": "B", "text": "Repeat HBsAg at 6 months only in patients never vaccinated"}, {"letter": "C", "text": "Repeat HBsAg at 6 months only if HBeAg remains positive"}, {"letter": "D", "text": "Repeat HBsAg at 6 months only if the transaminases remain elevated"}, {"letter": "E", "text": "Repeat HBsAg at 6 months only in patients given an antiviral"}], "answer": "A", "explanation": "Persistence of surface antigen past 6 months is what defines chronic infection, and the only way to know is to look in everybody. Fewer than 5% of infected adults progress, but which 5% cannot be predicted from how the acute illness behaved."}]}, {"case": "IB-A2", "group": "IB-A", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "objective": "", "vignette_workup": "A 28-year-old man comes to the primary care clinic with six weeks of bloody diarrhea, five stools daily, with tenesmus, urgency, and crampy left lower quadrant pain. He quit smoking four months ago and his father has ulcerative colitis. He has had no travel and no antibiotic exposure. His temperature is 37.2°C (99.0°F), blood pressure is 118/74 mm Hg, pulse is 94/min, respirations are 16/min, and oxygen saturation is 99% on room air. He has left lower quadrant tenderness without guarding, gross blood on rectal examination, and conjunctival pallor. There is no perianal fistula or fissure, no oral ulcer, and no abdominal distention.", "labs_workup": [["Hemoglobin / hematocrit", "11.4 g/dL / 34%"], ["MCV", "82 fL"], ["WBC / platelets", "8,900/mm³ / 355,000/mm³"], ["Albumin", "3.3 g/dL"], ["ESR / CRP", "26 mm/h / 22 mg/L"], ["Stool cultures and Clostridioides difficile", "Negative"]], "vignette_recog": "A 28-year-old man comes to the primary care clinic with six weeks of bloody diarrhea, five stools daily, with tenesmus, urgency, and crampy left lower quadrant pain. He quit smoking four months ago and his father has ulcerative colitis. He has had no travel and no antibiotic exposure. His temperature is 37.2°C (99.0°F), blood pressure is 118/74 mm Hg, pulse is 94/min, respirations are 16/min, and oxygen saturation is 99% on room air. He has left lower quadrant tenderness without guarding, gross blood on rectal examination, and conjunctival pallor. There is no perianal fistula or fissure, no oral ulcer, and no abdominal distention.", "labs_recog": [["Hemoglobin / hematocrit", "11.4 g/dL / 34%"], ["MCV", "82 fL"], ["WBC / platelets", "8,900/mm³ / 355,000/mm³"], ["Albumin", "3.3 g/dL"], ["ESR / CRP", "26 mm/h / 22 mg/L"], ["Stool cultures and Clostridioides difficile", "Negative"], ["IBD serology", "p-ANCA positive, ASCA negative"], ["Colonoscopy", "Continuous inflammation beginning at the rectum and extending to the splenic flexure with no skip lesions and a normal terminal ileum; loss of vascular pattern, granularity, friability, and pseudopolyps"], ["Biopsy", "Mucosal and submucosal inflammation with crypt abscesses, crypt distortion, and mucin depletion"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Surveillance colonoscopy with 32 four-quadrant biopsies"}, {"letter": "B", "text": "Colonoscopy with ileal intubation and biopsy"}, {"letter": "C", "text": "CT or MR enterography"}, {"letter": "D", "text": "Pelvic MRI with endoanal ultrasound"}, {"letter": "E", "text": "ASCA and p-ANCA serology"}], "answer": "B", "explanation": "Infection has been excluded, so the question is now the distribution and the depth of the inflammation, and only endoscopy with tissue answers both. Intubating the ileum is what separates the two forms of inflammatory bowel disease. Serology supports a diagnosis but never makes one."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Segmental colitis at a watershed segment with rectal sparing and an abrupt transition"}, {"letter": "B", "text": "Skip lesions with cobblestoning and rectal sparing, with non-caseating granulomas on biopsy"}, {"letter": "C", "text": "Flat high-grade dysplasia in inflamed mucosa with no visible polyp"}, {"letter": "D", "text": "Chronic active colitis with no ileal disease and no skip or rectal-sparing pattern"}, {"letter": "E", "text": "Continuous rectal-based inflammation with a spared ileum, and crypt abscesses with mucin depletion"}], "answer": "E", "explanation": "The inflammation is mucosal and submucosal only, begins at the rectum, and moves proximally without skipping, which is why the bleeding is continuous and the terminal ileum is untouched. Transmural, patchy disease with granulomas is the other pattern, and it spares the rectum rather than starting there."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Indeterminate colitis"}, {"letter": "B", "text": "Crohn's disease"}, {"letter": "C", "text": "Ulcerative colitis"}, {"letter": "D", "text": "IBD-associated colorectal cancer"}, {"letter": "E", "text": "Ischemic colitis"}], "answer": "C", "explanation": "Bloody diarrhea with tenesmus in a recent ex-smoker with an affected first-degree relative is the classic setting, and stopping smoking is itself associated with onset. Indeterminate colitis is reserved for cases where neither pattern is established after full evaluation."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ulcerative colitis"}, {"letter": "B", "text": "Ischemic colitis"}, {"letter": "C", "text": "Crohn's disease"}, {"letter": "D", "text": "IBD-associated colorectal cancer"}, {"letter": "E", "text": "Indeterminate colitis"}], "answer": "A", "explanation": "Continuous rectal-based inflammation to the splenic flexure with a normal terminal ileum, and a biopsy limited to mucosa and submucosa with crypt abscesses, commits the diagnosis. A positive p-ANCA with a negative ASCA points the same way — that combination occurs in 60 to 65% of ulcerative colitis against about 20% of Crohn's disease."}, {"key": "mgmt", "path": "both", "stem": "He has left-sided ulcerative colitis of moderate activity. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "A mesalamine enema with an oral aminosalicylate and naproxen for cramping"}, {"letter": "B", "text": "Budesonide with smoking cessation counseling"}, {"letter": "C", "text": "A mesalamine enema with an oral aminosalicylate and loperamide"}, {"letter": "D", "text": "An anti-TNF agent with an immunomodulator"}, {"letter": "E", "text": "A mesalamine enema with an oral aminosalicylate"}], "answer": "E", "explanation": "Distal and left-sided disease is treated topically and orally at once, so the drug reaches the inflamed segment from both directions. Anti-diarrheals raise the risk of toxic megacolon and NSAIDs trigger flares, which is why the two symptomatic additions here are the wrong ones. Mesalamine can cause interstitial nephritis, so the BUN and creatinine are followed."}, {"key": "escalate", "path": "both", "stem": "Six weeks later he is passing eight bloody stools daily despite the mesalamine enema and oral aminosalicylate. Which of the following should be done next?", "options": [{"letter": "A", "text": "An oral antibiotic directed at Clostridioides difficile"}, {"letter": "B", "text": "Supportive care with bowel rest"}, {"letter": "C", "text": "Systemic corticosteroids"}, {"letter": "D", "text": "Colectomy"}, {"letter": "E", "text": "Loperamide with continued aminosalicylate therapy"}], "answer": "C", "explanation": "A flare that has escaped aminosalicylates is brought down with corticosteroids, after which a biologic or small molecule takes over maintenance — steroids suppress a flare and are not maintenance therapy. Colectomy is curative but is reserved for refractory or complicated disease, not for a first failed regimen."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to surveillance colonoscopy in this patient?", "options": [{"letter": "A", "text": "Begin surveillance only if colectomy has been declined"}, {"letter": "B", "text": "Begin surveillance 5 years after diagnosis, when extension is most likely"}, {"letter": "C", "text": "Begin surveillance 8 years after diagnosis"}, {"letter": "D", "text": "Begin surveillance once the disease extends beyond the splenic flexure"}, {"letter": "E", "text": "Begin surveillance at the time of diagnosis"}], "answer": "C", "explanation": "Dysplasia risk accumulates with duration of colitis rather than with its extent at any one moment, and the clock starts at diagnosis. Up to 20% of patients extend within 5 years, which changes the treatment but not when surveillance begins."}]}, {"case": "IB-D2", "group": "IB-D", "section": "extraintestinal manifestations running a course independent of the bowel", "objective": "", "vignette_workup": "A 29-year-old woman comes to the primary care clinic with eight months of low back and buttock pain that is worst on waking, eases after about 45 minutes of movement, and improves with exercise. It wakes her in the second half of the night, and the onset was insidious. She has left-sided ulcerative colitis of five years, currently in remission. Her temperature is 36.8°C (98.2°F), blood pressure is 116/72 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has reduced lumbar flexion, tenderness over both sacroiliac joints, and a slightly stooped posture. The peripheral joints show no swelling or effusion.", "labs_workup": [["ESR / CRP", "32 mm/h / 21 mg/L"], ["Hemoglobin / hematocrit", "12.9 g/dL / 39%"], ["Albumin", "4.0 g/dL"], ["Fecal calprotectin", "55 µg/g"]], "vignette_recog": "A 29-year-old woman comes to the primary care clinic with eight months of low back and buttock pain that is worst on waking, eases after about 45 minutes of movement, and improves with exercise. It wakes her in the second half of the night, and the onset was insidious. She has left-sided ulcerative colitis of five years, currently in remission. Her temperature is 36.8°C (98.2°F), blood pressure is 116/72 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has reduced lumbar flexion, tenderness over both sacroiliac joints, and a slightly stooped posture. The peripheral joints show no swelling or effusion.", "labs_recog": [["ESR / CRP", "32 mm/h / 21 mg/L"], ["Hemoglobin / hematocrit", "12.9 g/dL / 39%"], ["Albumin", "4.0 g/dL"], ["Fecal calprotectin", "55 µg/g"], ["Pelvic radiographs", "Bilateral sacroiliac erosions with joint-space narrowing"], ["HLA-B27", "Positive"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Sacroiliac and spine imaging with HLA-B27"}, {"letter": "B", "text": "Slit-lamp examination by ophthalmology"}, {"letter": "C", "text": "Wound culture with clinical examination"}, {"letter": "D", "text": "Alkaline phosphatase and GGT with MRCP"}, {"letter": "E", "text": "Clinical examination with CRP and ESR"}], "answer": "A", "explanation": "Pain that is worse with rest, better with exercise, and wakes the patient in the second half of the night is the inflammatory pattern, and the joints to image are the ones that are tender. The inflammatory markers are already back and cannot localize anything."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Bilateral sacroiliitis with erosions and a positive HLA-B27"}, {"letter": "B", "text": "Ciliary flush with photophobia and acuity reduced to 20/60"}, {"letter": "C", "text": "A cholestatic pattern with an alkaline phosphatase of 486 U/L and a GGT of 320 U/L"}, {"letter": "D", "text": "Fewer than six warm swollen large joints with a normal spine"}, {"letter": "E", "text": "An ulcer with a violaceous undermined border and sterile cultures"}], "answer": "A", "explanation": "Sacroiliac tenderness with reduced lumbar flexion and a stooped posture is axial disease, and the erosions with joint-space narrowing are what it looks like on film. HLA-B27 is positive in 50 to 75% of these patients, so it supports the diagnosis without being required for it."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Pyoderma gangrenosum"}, {"letter": "B", "text": "Peripheral arthritis of inflammatory bowel disease"}, {"letter": "C", "text": "Erythema nodosum"}, {"letter": "D", "text": "Spondylitis with sacroiliitis"}, {"letter": "E", "text": "Primary sclerosing cholangitis"}], "answer": "D", "explanation": "Axial disease occurs in 5 to 10% of patients with inflammatory bowel disease and is seen more with ulcerative colitis, and left untreated the vertebrae can fuse. Peripheral arthritis involves fewer than six large joints with a normal spine and tracks bowel activity, which this does not."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Pyoderma gangrenosum"}, {"letter": "B", "text": "Primary sclerosing cholangitis"}, {"letter": "C", "text": "Erythema nodosum"}, {"letter": "D", "text": "Spondylitis with sacroiliitis"}, {"letter": "E", "text": "Peripheral arthritis of inflammatory bowel disease"}], "answer": "D", "explanation": "Bilateral sacroiliac erosions with joint-space narrowing and a positive HLA-B27 in a patient with inflammatory back pain establish axial disease. A quiescent bowel with a normal fecal calprotectin shows how independent this manifestation is of the colitis itself."}, {"key": "mgmt", "path": "both", "stem": "She has spondylitis with sacroiliitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Corticosteroids with treatment of the underlying bowel disease"}, {"letter": "B", "text": "Hepatology referral with continued bowel-directed maintenance"}, {"letter": "C", "text": "Exercise and physical therapy with a scheduled NSAID"}, {"letter": "D", "text": "Escalation of her bowel-directed maintenance therapy"}, {"letter": "E", "text": "Exercise and physical therapy with a TNF inhibitor"}], "answer": "E", "explanation": "Symptoms improve with activity, so movement is treatment rather than something to avoid, and a TNF inhibitor covers both the spine and the bowel. NSAIDs are the reflex drug for inflammatory back pain and the one to withhold here, since they trigger colitis flares. Escalating bowel-directed therapy alone will not settle the back — her colitis is already in remission."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to her axial symptoms as her colitis is managed?", "options": [{"letter": "A", "text": "Treat the axial disease only when her colitis flares"}, {"letter": "B", "text": "Treat the axial disease only once her colitis is in remission"}, {"letter": "C", "text": "Treat the axial disease only if HLA-B27 is negative"}, {"letter": "D", "text": "Treat the axial disease separately from the bowel disease"}, {"letter": "E", "text": "Treat the axial disease only if the fecal calprotectin rises"}], "answer": "D", "explanation": "Axial disease does not parallel the course of the bowel disease, so tying its treatment to bowel activity leaves the spine untreated during remission — which is exactly where she is now. HLA-B27 status supports the diagnosis and does not gate therapy."}]}, {"case": "IB-D4", "group": "IB-D", "section": "extraintestinal manifestations running a course independent of the bowel", "objective": "", "vignette_workup": "A 30-year-old man presents to the emergency department with two days of blurred vision and photophobia in the left eye, with a dull headache and aching eye pain. He has Crohn's ileocolitis of six years, quiescent on ustekinumab, and had peripheral arthritis two years ago. His temperature is 36.9°C (98.4°F), blood pressure is 124/76 mm Hg, pulse is 82/min, respirations are 14/min, and oxygen saturation is 99% on room air. There is ciliary flush of the left eye with a sluggish, slightly constricted left pupil and marked photophobia. Visual acuity is 20/60 on the left and 20/20 on the right, and the right eye is white and quiet.", "labs_workup": [["Intraocular pressure", "16 mm Hg in each eye"]], "vignette_recog": "A 30-year-old man presents to the emergency department with two days of blurred vision and photophobia in the left eye, with a dull headache and aching eye pain. He has Crohn's ileocolitis of six years, quiescent on ustekinumab, and had peripheral arthritis two years ago. His temperature is 36.9°C (98.4°F), blood pressure is 124/76 mm Hg, pulse is 82/min, respirations are 14/min, and oxygen saturation is 99% on room air. There is ciliary flush of the left eye with a sluggish, slightly constricted left pupil and marked photophobia. Visual acuity is 20/60 on the left and 20/20 on the right, and the right eye is white and quiet.", "labs_recog": [["Intraocular pressure", "16 mm Hg in each eye"], ["Slit-lamp examination", "Cells and flare in the anterior chamber of the left eye with a few keratic precipitates; the right anterior chamber is quiet"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Urgent ophthalmology referral for slit-lamp examination"}, {"letter": "B", "text": "Sacroiliac and spine imaging with HLA-B27"}, {"letter": "C", "text": "Clinical examination with CRP and ESR"}, {"letter": "D", "text": "Wound culture with clinical examination"}, {"letter": "E", "text": "Alkaline phosphatase and GGT"}], "answer": "A", "explanation": "A painful red eye with photophobia and reduced acuity is the combination that has to be looked at under magnification the same day. Only the slit lamp can see into the anterior chamber, and nothing in a blood panel will change what happens to this eye."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Superficial episcleral inflammation with a quiet anterior chamber"}, {"letter": "B", "text": "Tender non-ulcerating nodules 1 to 5 cm on the shins"}, {"letter": "C", "text": "Multifocal bile-duct narrowing with intervening dilation"}, {"letter": "D", "text": "Cells and flare in the anterior chamber"}, {"letter": "E", "text": "Bilateral sacroiliac erosions with joint-space narrowing"}], "answer": "D", "explanation": "Inflammatory cells and protein leaking into the aqueous are what produce photophobia, the sluggish constricted pupil, and the drop in acuity. A quiet chamber under a red surface is the superficial disease, and it neither hurts the vision nor requires urgent treatment."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Spondylitis with sacroiliitis"}, {"letter": "B", "text": "Uveitis"}, {"letter": "C", "text": "Episcleritis"}, {"letter": "D", "text": "Pyoderma gangrenosum"}, {"letter": "E", "text": "Erythema nodosum"}], "answer": "B", "explanation": "Photophobia with a change in vision is the pair that separates this from episcleritis, which has neither. It is independent of the bowel course, so a quiescent Crohn's disease on a biologic is no argument against it."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Erythema nodosum"}, {"letter": "B", "text": "Uveitis"}, {"letter": "C", "text": "Spondylitis with sacroiliitis"}, {"letter": "D", "text": "Pyoderma gangrenosum"}, {"letter": "E", "text": "Episcleritis"}], "answer": "B", "explanation": "Cells and flare with keratic precipitates are inflammation inside the anterior chamber, which is wha // Rotating stack builder for a Clinical Vignette practice exam.
//
// Injected immediately after the `const EXAM_DATA = ...;` line of the
// interactive-exam template, before the main IIFE.
//
// EXAM_DATA.pool is an array of CASES. Each case carries two possible opening
// vignettes and an ordered pool of question nodes. On every page load this
// script picks one path per case, draws 2-4 nodes from it in clinical order,
// shuffles the options, shuffles the case order under the adjacency rule, and
// writes a normal EXAM_DATA.questions array for the template to render.
//
// Case shape:
//   { case, group, section, objective,
//     vignette_workup, vignette_recog,      // parent stems (full vignette + lead-in)
//     labs_workup, labs_recog,              // optional [[test,result],...]
//     nodes: [ { key, path, stem, options:[{letter,text}], answer, explanation } ] }
//
// node.key    next_step | result | confirm | dx | dx_direct | mgmt | escalate | counsel
// node.path   "W" workup-first | "R" recognition-first | "both"
//
// Invariants held on every draw:
//   1. the parent node (next_step or dx_direct) is always first and carries the vignette
//   2. `result` — the held-back finding — may only sit immediately after the parent
//   3. `confirm` is drawn only when `result` is also drawn
//   4. nodes keep their pool order, which is clinical order
//   5. no two adjacent cases share a differential group
(function buildExam() {
  var pool = EXAM_DATA.pool;
  if (!pool || !pool.length) return;             // no pool: leave EXAM_DATA.questions alone

  var LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  var W_ORDER = ['next_step', 'result', 'confirm', 'dx', 'mgmt', 'escalate', 'counsel'];
  var R_ORDER = ['dx_direct', 'mgmt', 'escalate', 'counsel'];

  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;

    return b;

        if (n.key !== k) continue;
        if (n.path && n.path !== 'both' && n.path !== path) continue;
        out.push(n); break;

  // gives a genuinely uniform draw rather than a length-biased one.

    var total = 1 << rest.length;
    for (var mask = 0; mask < total; mask++) {

      if (bits !== m) continue;
      var keys = take.map(function (n) { return n.key; });
      if (keys.indexOf('result') !== -1 && keys[0] !== 'result') continue;            // rule 2
      if (keys.indexOf('confirm') !== -1 && keys.indexOf('result') === -1) continue;  // rule 3

  for (var attempt = 0; attempt < 4000 && adjacent(seq); attempt++) seq = shuffled(stacks);
  if (adjacent(seq)) {                     // greedy repair if random never lands it
    var remaining = stacks.slice(), built = [];
    while (remaining.length) {
      var idx = 0;
      for (var i = 0; i < remaining.length; i++) {
        if (!built.length || remaining[i].pgroup !== built[built.length - 1].pgroup) { idx = i; break; }
      }
      built.push(remaining.splice(idx, 1)[0]);
    }
    seq = built;
  }

  // ---- number and hand off -------------------------------------------------
  var out = [];
  seq.forEach(function (s, i) {
    var n = i + 1;
    s.qs.forEach(function (q, j) {
      q.group = n;
      q.id = j === 0 ? String(n) : String(n) + LET[j - 1];
      out.push(q);
    });
  });
  EXAM_DATA.questions = out;
})();


(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
