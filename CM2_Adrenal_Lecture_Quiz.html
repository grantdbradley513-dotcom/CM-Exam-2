<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
    transition: background-color 0.3s ease;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  #bglayer { position: fixed; inset: 0; z-index: -1; background-size: cover;
    background-position: center; background-repeat: no-repeat; display: none; }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }

lomerulosa → aldosterone, **Fasciculata → cortisol**, Reticularis → androgens; the medulla makes catecholamines."}], "checkpoints": [{"stem": "Zona reticularis (innermost cortical layer) → Main hormones produced:", "options": [{"letter": "A", "text": "Androgens (DHEA, androstenedione)"}, {"letter": "B", "text": "Cortisol"}, {"letter": "C", "text": "Aldosterone"}, {"letter": "D", "text": "Norepinephrine"}], "answer": "A", "explanation": "Reticularis = **sex** = adrenal androgen precursors (DHEA, androstenedione)."}]}}, {"id": "2", "group": 2, "slide": 7, "section": "Diurnal rhythm", "topic": "Adrenal physiology", "skill": "Disease process", "stem": "At what time does cortisol normally peak during its diurnal rhythm?", "options": [{"letter": "A", "text": "Late afternoon"}, {"letter": "B", "text": "Around midnight"}, {"letter": "C", "text": "Early evening"}, {"letter": "D", "text": "Early morning"}], "answer": "D", "explanation": "Cortisol **rises before waking and peaks in the early morning**, then falls through the day to a nighttime nadir.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Cortisol is the 'get up and go' hormone — it starts rising **while you are still asleep**.", "stem": "Cortisol starts climbing during which part of the day?", "options": [{"letter": "A", "text": "Late sleep, before waking"}, {"letter": "B", "text": "After the evening meal"}, {"letter": "C", "text": "Mid-afternoon"}], "answer": "A", "explanation": "It rises in the **early-morning hours** before waking.", "clarify": [{"stem": "Where is cortisol normally LOWEST?", "options": [{"letter": "A", "text": "Late night"}, {"letter": "B", "text": "Morning"}], "answer": "A", "explanation": "The nadir is late at night — that is why late-night cortisol screens for Cushing's."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Normal cortisol diurnal rhythm → Time of peak level:", "options": [{"letter": "A", "text": "Early morning"}, {"letter": "B", "text": "Late afternoon"}, {"letter": "C", "text": "Around midnight"}, {"letter": "D", "text": "Early evening"}], "answer": "A", "explanation": "Cortisol **rises before waking and peaks in the early morning**, then falls through the day to a nighttime nadir."}], "checkpoints": [{"stem": "Because of the diurnal rhythm, suspected adrenal INSUFFICIENCY is screened with which timed level?", "options": [{"letter": "A", "text": "8 AM serum cortisol"}, {"letter": "B", "text": "Late-night salivary cortisol"}, {"letter": "C", "text": "Random 4 PM cortisol"}, {"letter": "D", "text": "Midnight plasma ACTH"}], "answer": "A", "explanation": "Deficiency is screened when cortisol should be **highest — 8 AM**; excess is screened when it should be lowest (late night)."}]}}, {"id": "3", "group": 3, "slide": 8, "section": "HPA axis", "topic": "Adrenal physiology", "skill": "Disease process", "stem": "Which hypothalamic hormone stimulates pituitary ACTH release in the hypothalamic–pituitary–adrenal axis?", "options": [{"letter": "A", "text": "TRH"}, {"letter": "B", "text": "CRH"}, {"letter": "C", "text": "Angiotensin II"}, {"letter": "D", "text": "GnRH"}], "answer": "B", "explanation": "Hypothalamus **CRH** → pituitary **ACTH** → adrenal cortisol, and cortisol feeds back negatively on both CRH and ACTH.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The axis is named for its three levels: hypothalamus → pituitary → adrenal. The hypothalamic signal is named for the hormone it releases: **cortico**tropin.", "stem": "The releasing hormone for corticotropin (ACTH) is…", "options": [{"letter": "A", "text": "Corticotropin-releasing hormone"}, {"letter": "B", "text": "Thyrotropin-releasing hormone"}, {"letter": "C", "text": "Gonadotropin-releasing hormone"}], "answer": "A", "explanation": "**Corticotropin-releasing hormone (CRH)** releases corticotropin (ACTH).", "clarify": [{"stem": "Angiotensin II stimulates which adrenal hormone?", "options": [{"letter": "A", "text": "Aldosterone only"}, {"letter": "B", "text": "Cortisol"}], "answer": "A", "explanation": "Angiotensin II drives aldosterone, not cortisol — it is not part of the HPA axis."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "HPA axis → Hypothalamic hormone that drives pituitary ACTH release:", "options": [{"letter": "A", "text": "CRH"}, {"letter": "B", "text": "TRH"}, {"letter": "C", "text": "GnRH"}, {"letter": "D", "text": "Angiotensin II"}], "answer": "A", "explanation": "Hypothalamus **CRH** → pituitary **ACTH** → adrenal cortisol, and cortisol feeds back negatively on both CRH and ACTH."}], "checkpoints": [{"stem": "High cortisol levels act on the hypothalamus and pituitary to do what?", "options": [{"letter": "A", "text": "Suppress CRH and ACTH (negative feedback)"}, {"letter": "B", "text": "Increase CRH and ACTH (positive feedback)"}, {"letter": "C", "text": "Stimulate renin release"}, {"letter": "D", "text": "Increase TSH secretion"}], "answer": "A", "explanation": "Cortisol exerts **negative feedback** — which is why exogenous steroids suppress the axis."}]}}, {"id": "4", "group": 4, "slide": 12, "section": "Aldosterone action", "topic": "Adrenal physiology", "skill": "Disease process", "stem": "What is the net effect of aldosterone on renal electrolyte handling?", "options": [{"letter": "A", "text": "Excretes both Na⁺ and K⁺"}, {"letter": "B", "text": "Retains both Na⁺ and K⁺"}, {"letter": "C", "text": "Retains Na⁺, excretes K⁺"}, {"letter": "D", "text": "Excretes Na⁺, retains K⁺"}], "answer": "C", "explanation": "Aldosterone is **sodium-retaining and potassium-wasting** → ↑ volume and BP, ↓ K⁺.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Think of the disorders: **too much** aldosterone causes hypertension with **hypokalemia**.", "stem": "Aldosterone excess causes which potassium change?", "options": [{"letter": "A", "text": "Hypokalemia"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "No change"}], "answer": "A", "explanation": "Excess aldosterone **wastes K⁺** → hypokalemia; sodium (and water) is retained.", "clarify": [{"stem": "Aldosterone LOSS (Addison's) causes which potassium change?", "options": [{"letter": "A", "text": "Hyperkalemia"}, {"letter": "B", "text": "Hypokalemia"}], "answer": "A", "explanation": "No aldosterone → K⁺ is retained → hyperkalemia, with Na⁺ loss."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Aldosterone → Net renal effect on electrolytes:", "options": [{"letter": "A", "text": "Retains Na⁺, excretes K⁺"}, {"letter": "B", "text": "Excretes Na⁺, retains K⁺"}, {"letter": "C", "text": "Retains both Na⁺ and K⁺"}, {"letter": "D", "text": "Excretes both Na⁺ and K⁺"}], "answer": "A", "explanation": "Aldosterone is **sodium-retaining and potassium-wasting** → ↑ volume and BP, ↓ K⁺."}], "checkpoints": [{"stem": "Primary controller of aldosterone secretion →", "options": [{"letter": "A", "text": "Renin-angiotensin system (RAAS)"}, {"letter": "B", "text": "Pituitary ACTH"}, {"letter": "C", "text": "Hypothalamic CRH"}, {"letter": "D", "text": "Serum glucose"}], "answer": "A", "explanation": "**RAAS** is the main driver; ACTH is a minor one — so aldosterone is preserved in secondary (pituitary) adrenal insufficiency."}]}}, {"id": "5", "group": 5, "slide": 18, "section": "Cushing's disease definition", "topic": "Cushing's disease", "skill": "Identification", "stem": "What specifically causes Cushing disease, as distinguished from other forms of Cushing syndrome?", "options": [{"letter": "A", "text": "Chronic exogenous prednisone"}, {"letter": "B", "text": "ACTH-secreting pituitary adenoma"}, {"letter": "C", "text": "Cortisol-secreting adrenal adenoma"}, {"letter": "D", "text": "Ectopic ACTH from lung tumor"}], "answer": "B", "explanation": "Cushing's **disease** ALWAYS means an **ACTH-secreting pituitary adenoma**; Cushing's syndrome is any cause of cortisol excess.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The word matters: 'disease' is reserved for one specific source, and it's the one Harvey Cushing — a **neurosurgeon** — operated on.", "stem": "Cushing's disease is a tumor of which gland?", "options": [{"letter": "A", "text": "Pituitary"}, {"letter": "B", "text": "Adrenal"}, {"letter": "C", "text": "Lung"}], "answer": "A", "explanation": "Cushing's disease = **pituitary** tumor making ACTH.", "clarify": [{"stem": "An adrenal tumor making cortisol is called Cushing's…", "options": [{"letter": "A", "text": "Syndrome"}, {"letter": "B", "text": "Disease"}], "answer": "A", "explanation": "Any non-pituitary cause is Cushing's syndrome."}, {"stem": "Excess cortisol from prednisone use is Cushing's…", "options": [{"letter": "A", "text": "Syndrome"}, {"letter": "B", "text": "Disease"}], "answer": "A", "explanation": "Exogenous steroids cause Cushing's syndrome, not disease."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's DISEASE (vs syndrome) → Cause:", "options": [{"letter": "A", "text": "ACTH-secreting pituitary adenoma"}, {"letter": "B", "text": "Cortisol-secreting adrenal adenoma"}, {"letter": "C", "text": "Chronic exogenous prednisone"}, {"letter": "D", "text": "Ectopic ACTH from lung tumor"}], "answer": "A", "explanation": "Cushing's **disease** ALWAYS means an **ACTH-secreting pituitary adenoma**; Cushing's syndrome is any cause of cortisol excess."}], "checkpoints": [{"stem": "Cushing's disease → Expected ACTH level:", "options": [{"letter": "A", "text": "High or inappropriately normal"}, {"letter": "B", "text": "Suppressed"}, {"letter": "C", "text": "Undetectable"}, {"letter": "D", "text": "Low with high renin"}], "answer": "A", "explanation": "The pituitary adenoma makes ACTH, so ACTH is **high/inappropriately normal** (ACTH-dependent)."}]}}, {"id": "6", "group": 6, "slide": 18, "section": "Most common cause", "topic": "Cushing's syndrome", "skill": "Identification", "stem": "What is the most common cause of Cushing syndrome overall?", "options": [{"letter": "A", "text": "Cortisol-secreting adrenal adenoma"}, {"letter": "B", "text": "Ectopic ACTH secretion"}, {"letter": "C", "text": "Exogenous glucocorticoid use"}, {"letter": "D", "text": "Pituitary ACTH adenoma"}], "answer": "C", "explanation": "**Exogenous (iatrogenic) steroids** are the most common cause — which is why steroid history comes first.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Endogenous tumors are rare (Cushing's disease is only 10–15 per million per year). Think about what is **prescribed** every day.", "stem": "Which is far more common in practice?", "options": [{"letter": "A", "text": "Patients taking prednisone or other steroids"}, {"letter": "B", "text": "Patients with ACTH-secreting tumors"}], "answer": "A", "explanation": "Steroid prescriptions vastly outnumber hormone-secreting tumors — **iatrogenic** cases dominate.", "clarify": [{"stem": "Cushing's disease (pituitary adenoma) is…", "options": [{"letter": "A", "text": "Rare"}, {"letter": "B", "text": "Common"}], "answer": "A", "explanation": "Only about 10–15 people per million per year."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Most common cause of Cushing's SYNDROME overall →", "options": [{"letter": "A", "text": "Exogenous glucocorticoid use"}, {"letter": "B", "text": "Pituitary ACTH adenoma"}, {"letter": "C", "text": "Cortisol-secreting adrenal adenoma"}, {"letter": "D", "text": "Ectopic ACTH secretion"}], "answer": "A", "explanation": "**Exogenous (iatrogenic) steroids** are the most common cause — which is why steroid history comes first."}], "checkpoints": [{"stem": "Most common ENDOGENOUS cause of Cushing's syndrome →", "options": [{"letter": "A", "text": "Pituitary ACTH adenoma (Cushing's disease)"}, {"letter": "B", "text": "Exogenous prednisone"}, {"letter": "C", "text": "Adrenocortical carcinoma"}, {"letter": "D", "text": "Black licorice ingestion"}], "answer": "A", "explanation": "Among endogenous causes, the **pituitary adenoma (Cushing's disease)** is most common."}]}}, {"id": "7", "group": 7, "slide": 18, "section": "Ectopic ACTH source", "topic": "Cushing's syndrome", "skill": "Identification", "stem": "Which tumor is a classic source of ectopic ACTH secretion?", "options": [{"letter": "A", "text": "Renal cell carcinoma"}, {"letter": "B", "text": "Prostate adenocarcinoma"}, {"letter": "C", "text": "Hepatocellular carcinoma"}, {"letter": "D", "text": "Small cell lung carcinoma"}], "answer": "D", "explanation": "**Small cell lung carcinoma** is the classic ectopic ACTH source; also pancreatic islet cell, medullary thyroid, and thymic tumors.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "'Ectopic' means hormone made in an abnormal place. The classic culprit is a **neuroendocrine lung tumor** in a smoker.", "stem": "Which lung cancer type is neuroendocrine and famous for paraneoplastic hormones?", "options": [{"letter": "A", "text": "Small cell"}, {"letter": "B", "text": "Adenocarcinoma"}, {"letter": "C", "text": "Large cell"}], "answer": "A", "explanation": "**Small cell** carcinoma is the neuroendocrine lung cancer that secretes ACTH.", "clarify": [{"stem": "In ectopic ACTH, the pituitary MRI is usually…", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Shows an adenoma"}], "answer": "A", "explanation": "The ACTH is coming from outside the pituitary."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Ectopic ACTH syndrome → Classic tumor source:", "options": [{"letter": "A", "text": "Small cell lung carcinoma"}, {"letter": "B", "text": "Renal cell carcinoma"}, {"letter": "C", "text": "Hepatocellular carcinoma"}, {"letter": "D", "text": "Prostate adenocarcinoma"}], "answer": "A", "explanation": "**Small cell lung carcinoma** is the classic ectopic ACTH source; also pancreatic islet cell, medullary thyroid, and thymic tumors."}], "checkpoints": [{"stem": "Smoker with rapid Cushingoid change, hyperpigmentation, and severe hypokalemia → ACTH level expected:", "options": [{"letter": "A", "text": "Very high"}, {"letter": "B", "text": "Suppressed"}, {"letter": "C", "text": "Low-normal"}, {"letter": "D", "text": "Undetectable"}], "answer": "A", "explanation": "Ectopic tumors make **very high ACTH** — enough to cause hyperpigmentation and profound hypokalemia."}]}}, {"id": "8", "group": 8, "slide": 19, "section": "Cushing hallmark", "topic": "Cushing's syndrome", "skill": "Identification", "stem": "Which diagnosis is most likely in a patient with moon facies, a dorsocervical fat pad, central obesity, and thin extremities?", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Cushing's syndrome"}, {"letter": "C", "text": "Hyperaldosteronism"}, {"letter": "D", "text": "Addison's disease"}], "answer": "B", "explanation": "Moon facies, **buffalo hump**, and central obesity with wasted extremities = **cortisol excess (Cushing's)**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "These are **fat-redistribution** findings — fat moves to the face, upper back, and trunk. Think about which hormone, in excess, drives that.", "stem": "Fat redistribution to the face and upper back reflects excess of which hormone?", "options": [{"letter": "A", "text": "Cortisol"}, {"letter": "B", "text": "Aldosterone"}, {"letter": "C", "text": "Catecholamines"}], "answer": "A", "explanation": "Excess **cortisol** redistributes fat centrally.", "clarify": [{"stem": "Addison's disease is a state of cortisol…", "options": [{"letter": "A", "text": "Deficiency"}, {"letter": "B", "text": "Excess"}], "answer": "A", "explanation": "Addison's = too little cortisol → weight loss, not central obesity."}, {"stem": "Hyperaldosteronism mainly causes HTN plus which electrolyte change?", "options": [{"letter": "A", "text": "Hypokalemia"}, {"letter": "B", "text": "Hyperkalemia"}], "answer": "A", "explanation": "Conn's = HTN + low K⁺, without Cushingoid habitus."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Moon facies, dorsocervical fat pad, central obesity with thin extremities → Diagnosis:", "options": [{"letter": "A", "text": "Cushing's syndrome"}, {"letter": "B", "text": "Addison's disease"}, {"letter": "C", "text": "Hyperaldosteronism"}, {"letter": "D", "text": "Pheochromocytoma"}], "answer": "A", "explanation": "Moon facies, **buffalo hump**, and central obesity with wasted extremities = **cortisol excess (Cushing's)**."}], "checkpoints": [{"stem": "A Cushingoid patient's proximal weakness and easy bruising are caused by which process?", "options": [{"letter": "A", "text": "Protein catabolism from excess cortisol"}, {"letter": "B", "text": "Catecholamine surges"}, {"letter": "C", "text": "Mineralocorticoid deficiency"}, {"letter": "D", "text": "Autoimmune adrenal destruction"}], "answer": "A", "explanation": "Cortisol excess breaks down muscle and connective tissue → **proximal weakness**, thin skin, easy bruising."}]}}, {"id": "9", "group": 9, "slide": 21, "section": "Cushing glucose", "topic": "Cushing's syndrome", "skill": "Complications", "stem": "How does Cushing syndrome affect glucose metabolism?", "options": [{"letter": "A", "text": "Recurrent fasting hypoglycemia"}, {"letter": "B", "text": "No effect on glucose"}, {"letter": "C", "text": "Glucose intolerance / hyperglycemia"}, {"letter": "D", "text": "Increased insulin sensitivity"}], "answer": "C", "explanation": "Cortisol ↑ **gluconeogenesis**, causes insulin resistance, and suppresses insulin release → **glucose intolerance**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Cortisol is a **gluco**corticoid — one of its main jobs is to raise blood sugar by **gluconeogenesis**.", "stem": "Cortisol's effect on hepatic glucose production is to…", "options": [{"letter": "A", "text": "Increase it"}, {"letter": "B", "text": "Decrease it"}], "answer": "A", "explanation": "Cortisol **increases** gluconeogenesis, pushing glucose up.", "clarify": [{"stem": "Hypoglycemia is a feature of cortisol…", "options": [{"letter": "A", "text": "Deficiency (Addison's)"}, {"letter": "B", "text": "Excess (Cushing's)"}], "answer": "A", "explanation": "Low glucose belongs to adrenal insufficiency, not Cushing's."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's syndrome → Expected effect on glucose metabolism:", "options": [{"letter": "A", "text": "Glucose intolerance / hyperglycemia"}, {"letter": "B", "text": "Recurrent fasting hypoglycemia"}, {"letter": "C", "text": "No effect on glucose"}, {"letter": "D", "text": "Increased insulin sensitivity"}], "answer": "A", "explanation": "Cortisol ↑ **gluconeogenesis**, causes insulin resistance, and suppresses insulin release → **glucose intolerance**."}], "checkpoints": [{"stem": "Menstrual irregularity in Cushing's syndrome → Cause:", "options": [{"letter": "A", "text": "Cortisol suppresses GnRH → low LH/FSH"}, {"letter": "B", "text": "Cortisol raises prolactin"}, {"letter": "C", "text": "Ovarian autoimmune destruction"}, {"letter": "D", "text": "Excess aldosterone"}], "answer": "A", "explanation": "Hypercortisolemia **suppresses GnRH**, lowering LH and FSH → menstrual irregularity, low libido, ED."}]}}, {"id": "10", "group": 10, "slide": 22, "section": "Cushing bone", "topic": "Cushing's syndrome", "skill": "Complications", "stem": "What complication should be suspected in a patient with Cushing syndrome who develops new low back pain?", "options": [{"letter": "A", "text": "Lumbar disc herniation"}, {"letter": "B", "text": "Spinal epidural abscess"}, {"letter": "C", "text": "Nephrolithiasis"}, {"letter": "D", "text": "Vertebral compression fracture"}], "answer": "D", "explanation": "Cortisol causes **osteoporosis**; up to 76% of Cushing's patients have **vertebral compression fractures** — low threshold for DEXA and X-rays.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Think about cortisol's effect on **bone**: it lowers calcium absorption and formation and raises resorption.", "stem": "Long-term cortisol excess does what to bone density?", "options": [{"letter": "A", "text": "Decreases it (osteoporosis)"}, {"letter": "B", "text": "Increases it"}, {"letter": "C", "text": "No effect"}], "answer": "A", "explanation": "Cortisol excess → **osteoporosis** → fragility fractures, especially vertebral.", "clarify": [{"stem": "Femoral head osteonecrosis is linked to excess…", "options": [{"letter": "A", "text": "Glucocorticoids"}, {"letter": "B", "text": "Mineralocorticoids"}], "answer": "A", "explanation": "Steroid excess is a classic cause of avascular necrosis."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's patient with new low back pain → Complication to suspect:", "options": [{"letter": "A", "text": "Vertebral compression fracture"}, {"letter": "B", "text": "Lumbar disc herniation"}, {"letter": "C", "text": "Nephrolithiasis"}, {"letter": "D", "text": "Spinal epidural abscess"}], "answer": "A", "explanation": "Cortisol causes **osteoporosis**; up to 76% of Cushing's patients have **vertebral compression fractures** — low threshold for DEXA and X-rays."}], "checkpoints": [{"stem": "Cushing's patient → Bone screening to consider:", "options": [{"letter": "A", "text": "DEXA bone density scan"}, {"letter": "B", "text": "Bone marrow biopsy"}, {"letter": "C", "text": "Nuclear bone scan only"}, {"letter": "D", "text": "Serum alkaline phosphatase only"}], "answer": "A", "explanation": "The lecture says to consider **bone density testing** and have a low threshold for X-rays."}]}}, {"id": "11", "group": 11, "slide": 23, "section": "Cushing lab pattern", "topic": "Cushing's syndrome", "skill": "Diagnostics & imaging", "stem": "What blood chemistry pattern is expected in Cushing syndrome?", "options": [{"letter": "A", "text": "Na↔, K↑, HCO₃↔, glucose↓"}, {"letter": "B", "text": "Na↑, K↓, HCO₃↑, glucose↑"}, {"letter": "C", "text": "Na↓, K↑, HCO₃↓, glucose↓"}, {"letter": "D", "text": "Na↓, K↓, HCO₃↓, glucose↑"}], "answer": "B", "explanation": "Cortisol excess has mineralocorticoid spillover → **Na↑, K↓, metabolic alkalosis (HCO₃↑)**, plus **hyperglycemia**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Excess cortisol acts partly like aldosterone and raises glucose. Start with the **potassium**.", "stem": "Cortisol excess (with mineralocorticoid effect) pushes potassium…", "options": [{"letter": "A", "text": "Down"}, {"letter": "B", "text": "Up"}], "answer": "A", "explanation": "Like aldosterone, it wastes K⁺ → **hypokalemia** with Na⁺ retention and alkalosis.", "clarify": [{"stem": "Na↓, K↑, glucose↓ is the pattern of…", "options": [{"letter": "A", "text": "Adrenal insufficiency"}, {"letter": "B", "text": "Cushing's"}], "answer": "A", "explanation": "That mirror-image pattern is Addison's."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's syndrome → Expected chemistry pattern:", "options": [{"letter": "A", "text": "Na↑, K↓, HCO₃↑, glucose↑"}, {"letter": "B", "text": "Na↓, K↑, HCO₃↓, glucose↓"}, {"letter": "C", "text": "Na↓, K↓, HCO₃↓, glucose↑"}, {"letter": "D", "text": "Na↔, K↑, HCO₃↔, glucose↓"}], "answer": "A", "explanation": "Cortisol excess has mineralocorticoid spillover → **Na↑, K↓, metabolic alkalosis (HCO₃↑)**, plus **hyperglycemia**."}], "checkpoints": [{"stem": "Cushing's syndrome → Typical blood pressure finding:", "options": [{"letter": "A", "text": "Hypertension"}, {"letter": "B", "text": "Orthostatic hypotension"}, {"letter": "C", "text": "Normal BP"}, {"letter": "D", "text": "Wide pulse pressure hypotension"}], "answer": "A", "explanation": "Na⁺ retention and other effects make **hypertension** a common Cushing's finding (165/92 in the lecture case)."}]}}, {"id": "12", "group": 12, "slide": 24, "section": "Workup step 1", "topic": "Cushing's syndrome", "skill": "Diagnostics & imaging", "stem": "What is the first step in the workup of a patient with Cushingoid features?", "options": [{"letter": "A", "text": "Serum ACTH level"}, {"letter": "B", "text": "24-hour urine free cortisol"}, {"letter": "C", "text": "Pituitary MRI"}, {"letter": "D", "text": "History for exogenous steroid use"}], "answer": "D", "explanation": "**Step 1: careful history for exogenous steroids** (oral, inhaled, topical, injected) — the most common cause — before any labs.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Before ordering anything, rule out the **most common cause** of Cushing's syndrome — and it is found by talking to the patient.", "stem": "The most common cause of Cushing's syndrome is identified by…", "options": [{"letter": "A", "text": "History / medication review"}, {"letter": "B", "text": "Imaging"}, {"letter": "C", "text": "Dynamic testing"}], "answer": "A", "explanation": "Exogenous steroids are found by **history**, which is free and comes first.", "clarify": [{"stem": "Imaging (MRI/CT) comes before or after biochemical confirmation?", "options": [{"letter": "A", "text": "After"}, {"letter": "B", "text": "Before"}], "answer": "A", "explanation": "Confirm hypercortisolism and check ACTH first, then image."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushingoid features on exam → First step in the workup:", "options": [{"letter": "A", "text": "History for exogenous steroid use"}, {"letter": "B", "text": "24-hour urine free cortisol"}, {"letter": "C", "text": "Pituitary MRI"}, {"letter": "D", "text": "Serum ACTH level"}], "answer": "A", "explanation": "**Step 1: careful history for exogenous steroids** (oral, inhaled, topical, injected) — the most common cause — before any labs."}], "checkpoints": [{"stem": "Exogenous steroids ruled out, Cushing's still suspected → Initial lab tests:", "options": [{"letter": "A", "text": "24-h urine free cortisol / late-night salivary cortisol"}, {"letter": "B", "text": "Pituitary MRI and adrenal CT"}, {"letter": "C", "text": "Cosyntropin stimulation test"}, {"letter": "D", "text": "Plasma metanephrines"}], "answer": "A", "explanation": "Confirm hypercortisolism with **24-h UFC, late-night cortisol, or 1-mg DST** before localizing."}]}}, {"id": "13", "group": 13, "slide": 24, "section": "Exogenous steroids found", "topic": "Cushing's syndrome", "skill": "Management", "stem": "How should Cushing syndrome caused by chronic prednisone use be managed?", "options": [{"letter": "A", "text": "Bilateral adrenalectomy"}, {"letter": "B", "text": "Start ketoconazole"}, {"letter": "C", "text": "Taper the steroid gradually"}, {"letter": "D", "text": "Stop the steroid abruptly"}], "answer": "C", "explanation": "**Taper — never stop abruptly**: the HPA axis is suppressed, and sudden withdrawal causes adrenal insufficiency/crisis.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Chronic exogenous steroids shut down the patient's own ACTH and cortisol production via **negative feedback**.", "stem": "After months of prednisone, the patient's own adrenal output is…", "options": [{"letter": "A", "text": "Suppressed"}, {"letter": "B", "text": "Normal"}, {"letter": "C", "text": "Increased"}], "answer": "A", "explanation": "The axis is **suppressed** and needs time to recover.", "clarify": [{"stem": "Abruptly stopping long-term steroids risks…", "options": [{"letter": "A", "text": "Adrenal crisis"}, {"letter": "B", "text": "Hyperaldosteronism"}], "answer": "A", "explanation": "The suppressed adrenals can't respond → adrenal insufficiency."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's from chronic prednisone use → Management:", "options": [{"letter": "A", "text": "Taper the steroid gradually"}, {"letter": "B", "text": "Stop the steroid abruptly"}, {"letter": "C", "text": "Start ketoconazole"}, {"letter": "D", "text": "Bilateral adrenalectomy"}], "answer": "A", "explanation": "**Taper — never stop abruptly**: the HPA axis is suppressed, and sudden withdrawal causes adrenal insufficiency/crisis."}], "checkpoints": [{"stem": "Abrupt withdrawal of chronic steroids → Type of adrenal insufficiency produced:", "options": [{"letter": "A", "text": "Secondary (low ACTH)"}, {"letter": "B", "text": "Primary (high ACTH)"}, {"letter": "C", "text": "Congenital"}, {"letter": "D", "text": "Autoimmune primary"}], "answer": "A", "explanation": "Exogenous steroids suppress pituitary ACTH → **secondary AI** — the most common cause of AI overall."}]}}, {"id": "14", "group": 14, "slide": 25, "section": "24-h UFC", "topic": "Cushing's syndrome", "skill": "Diagnostics & imaging", "stem": "What is the typical 24-hour urine free cortisol result in Cushing syndrome?", "options": [{"letter": "A", "text": "6–64 mcg/24 h"}, {"letter": "B", "text": "10–20 mcg/24 h"}, {"letter": "C", "text": ">100 mcg/24 h"}, {"letter": "D", "text": "<3 mcg/24 h"}], "answer": "C", "explanation": "Normal UFC is **6–64 mcg/24 h**; Cushing's is often **>100 mcg/24 h**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The normal range is 6–64 mcg/24 h. Cushing's is a state of **excess**, so look for the value clearly above normal.", "stem": "Cushing's UFC would be…", "options": [{"letter": "A", "text": "Above the normal range"}, {"letter": "B", "text": "Within the normal range"}, {"letter": "C", "text": "Below the normal range"}], "answer": "A", "explanation": "Cortisol excess → UFC **above** normal, often >100.", "clarify": [{"stem": "A 24-h collection (not a spot urine) is used because cortisol secretion is…", "options": [{"letter": "A", "text": "Pulsatile and diurnal"}, {"letter": "B", "text": "Constant all day"}], "answer": "A", "explanation": "A single spot can miss the overall excess."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "24-hour urine free cortisol in Cushing's → Typical result:", "options": [{"letter": "A", "text": ">100 mcg/24 h"}, {"letter": "B", "text": "6–64 mcg/24 h"}, {"letter": "C", "text": "<3 mcg/24 h"}, {"letter": "D", "text": "10–20 mcg/24 h"}], "answer": "A", "explanation": "Normal UFC is **6–64 mcg/24 h**; Cushing's is often **>100 mcg/24 h**."}], "checkpoints": [{"stem": "Why is a 24-hour urine collection preferred over a spot urine cortisol?", "options": [{"letter": "A", "text": "Cortisol secretion is pulsatile and diurnal"}, {"letter": "B", "text": "Spot urine cannot detect cortisol"}, {"letter": "C", "text": "24-h urine also measures ACTH"}, {"letter": "D", "text": "Spot urine is falsely low in all patients"}], "answer": "A", "explanation": "Secretion varies through the day, so the **24-h collection integrates** total output."}]}}, {"id": "15", "group": 15, "slide": 25, "section": "Late-night cortisol", "topic": "Cushing's syndrome", "skill": "Diagnostics & imaging", "stem": "Why is late-night salivary cortisol used instead of a morning measurement to evaluate Cushing syndrome?", "options": [{"letter": "A", "text": "Morning cortisol is normally lowest"}, {"letter": "B", "text": "ACTH normally peaks at midnight"}, {"letter": "C", "text": "Saliva is valid only at night"}, {"letter": "D", "text": "Normal nighttime nadir is lost"}], "answer": "D", "explanation": "Cortisol should be **lowest at night**; loss of that nadir is an early Cushing's abnormality, whereas morning levels are high in everyone.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Recall the diurnal rhythm: high in the morning, **lowest late at night**.", "stem": "A high cortisol value is most abnormal when measured at the time it should be…", "options": [{"letter": "A", "text": "Lowest (late night)"}, {"letter": "B", "text": "Highest (early morning)"}], "answer": "A", "explanation": "An elevated level at the **nadir** is the clearest sign of excess.", "clarify": [{"stem": "Normal cortisol peaks in the…", "options": [{"letter": "A", "text": "Early morning"}, {"letter": "B", "text": "Late night"}], "answer": "A", "explanation": "Morning is the peak, so a high AM value doesn't separate Cushing's from normal."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Late-night salivary cortisol (vs AM) for Cushing's → Rationale:", "options": [{"letter": "A", "text": "Normal nighttime nadir is lost"}, {"letter": "B", "text": "Morning cortisol is normally lowest"}, {"letter": "C", "text": "Saliva is valid only at night"}, {"letter": "D", "text": "ACTH normally peaks at midnight"}], "answer": "A", "explanation": "Cortisol should be **lowest at night**; loss of that nadir is an early Cushing's abnormality, whereas morning levels are high in everyone."}], "checkpoints": [{"stem": "Suspected adrenal INSUFFICIENCY → Best-timed cortisol level:", "options": [{"letter": "A", "text": "8 AM serum cortisol"}, {"letter": "B", "text": "Late-night salivary cortisol"}, {"letter": "C", "text": "Midnight plasma cortisol"}, {"letter": "D", "text": "Bedtime urine cortisol"}], "answer": "A", "explanation": "Deficiency is tested at the **peak (8 AM)** — the opposite logic of Cushing's screening."}]}}, {"id": "16", "group": 16, "slide": 26, "section": "Dexamethasone suppression", "topic": "Cushing's syndrome", "skill": "Diagnostics & imaging", "stem": "What 8 AM cortisol response is expected after an overnight 1-mg dexamethasone suppression test in a patient with Cushing syndrome?", "options": [{"letter": "A", "text": "Fails to suppress (≥1.8 mcg/dL)"}, {"letter": "B", "text": "Suppresses to <1.8 mcg/dL"}, {"letter": "C", "text": "Suppresses to undetectable"}, {"letter": "D", "text": "Suppresses within 30–60 min"}], "answer": "A", "explanation": "Normally dexamethasone suppresses AM cortisol to **<1.8 mcg/dL**; in Cushing's cortisol **fails to suppress**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Dexamethasone is a potent steroid that should switch off ACTH by **negative feedback**. Cushing's is autonomous excess.", "stem": "In Cushing's, cortisol production responds to negative feedback…", "options": [{"letter": "A", "text": "Poorly — it stays high"}, {"letter": "B", "text": "Normally — it falls"}], "answer": "A", "explanation": "Autonomous excess **does not suppress**.", "clarify": [{"stem": "A normal person's 8 AM cortisol after 1 mg dexamethasone is…", "options": [{"letter": "A", "text": "<1.8 mcg/dL"}, {"letter": "B", "text": ">10 mcg/dL"}], "answer": "A", "explanation": "Intact feedback suppresses cortisol below 1.8."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Overnight 1-mg dexamethasone suppression test in Cushing's → 8 AM cortisol:", "options": [{"letter": "A", "text": "Fails to suppress (≥1.8 mcg/dL)"}, {"letter": "B", "text": "Suppresses to <1.8 mcg/dL"}, {"letter": "C", "text": "Suppresses to undetectable"}, {"letter": "D", "text": "Suppresses within 30–60 min"}], "answer": "A", "explanation": "Normally dexamethasone suppresses AM cortisol to **<1.8 mcg/dL**; in Cushing's cortisol **fails to suppress**."}], "checkpoints": [{"stem": "1-mg overnight DST → Timing of dose and blood draw:", "options": [{"letter": "A", "text": "Dose 11 PM–midnight, cortisol at 8 AM"}, {"letter": "B", "text": "Dose at 8 AM, cortisol at 4 PM"}, {"letter": "C", "text": "Dose at noon, cortisol at midnight"}, {"letter": "D", "text": "Dose at 8 AM, cortisol at 30/60 min"}], "answer": "A", "explanation": "Dexamethasone is given **11 PM–midnight** and plasma cortisol is drawn at **8 AM** the next morning."}]}}, {"id": "17", "group": 17, "slide": 26, "section": "DST pitfalls", "topic": "Cushing's syndrome", "skill": "Diagnostics & imaging", "stem": "In which setting should a dexamethasone suppression test not be performed?", "options": [{"letter": "A", "text": "Acute illness or immediate post-op"}, {"letter": "B", "text": "Well-controlled hypertension"}, {"letter": "C", "text": "Early morning hours"}, {"letter": "D", "text": "Women of reproductive age"}], "answer": "A", "explanation": "**Acute distress, infection, or the immediate post-op period** raise cortisol physiologically → **false-positive** DST.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Recall that **physiologic stress** (surgery, trauma, infection) activates the HPA axis and raises cortisol.", "stem": "In acute illness, cortisol normally…", "options": [{"letter": "A", "text": "Rises"}, {"letter": "B", "text": "Falls"}, {"letter": "C", "text": "Stays unchanged"}], "answer": "A", "explanation": "Stress **raises** cortisol, mimicking Cushing's.", "clarify": [{"stem": "A stress-related false result on DST would look like…", "options": [{"letter": "A", "text": "Failure to suppress"}, {"letter": "B", "text": "Normal suppression"}], "answer": "A", "explanation": "High stress cortisol fails to suppress → false positive."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Dexamethasone suppression test → Setting where it should NOT be done:", "options": [{"letter": "A", "text": "Acute illness or immediate post-op"}, {"letter": "B", "text": "Early morning hours"}, {"letter": "C", "text": "Women of reproductive age"}, {"letter": "D", "text": "Well-controlled hypertension"}], "answer": "A", "explanation": "**Acute distress, infection, or the immediate post-op period** raise cortisol physiologically → **false-positive** DST."}], "checkpoints": [{"stem": "Septic ICU patient with elevated cortisol → Interpretation:", "options": [{"letter": "A", "text": "Expected physiologic stress response"}, {"letter": "B", "text": "Confirms Cushing's disease"}, {"letter": "C", "text": "Indicates ectopic ACTH"}, {"letter": "D", "text": "Requires adrenalectomy"}], "answer": "A", "explanation": "Severe stress can raise cortisol to 200–500 mg/day — a **normal stress response**, not Cushing's."}]}}, {"id": "18", "group": 18, "slide": 28, "section": "Localizing source", "topic": "Cushing's syndrome", "skill": "Diagnostics & imaging", "stem": "What imaging should be ordered when hypercortisolism is confirmed and ACTH is suppressed?", "options": [{"letter": "A", "text": "Thyroid ultrasound"}, {"letter": "B", "text": "Adrenal CT/MRI"}, {"letter": "C", "text": "Pituitary MRI"}, {"letter": "D", "text": "Chest CT"}], "answer": "B", "explanation": "**Suppressed ACTH = ACTH-independent (adrenal) source** → image the **adrenals**.", "objective": "", "bg": "#ffede0", "remediation": {"steps": [{"teach": "Ask what ACTH tells you: if the adrenal is making cortisol on its own, high cortisol shuts off pituitary ACTH via **negative feedback**.", "stem": "Low ACTH with high cortisol points to which organ?", "options": [{"letter": "A", "text": "Adrenal gland"}, {"letter": "B", "text": "Pituitary gland"}, {"letter": "C", "text": "Lung"}], "answer": "A", "explanation": "Autonomous **adrenal** production suppresses ACTH.", "clarify": [{"stem": "High/normal ACTH with high cortisol points first to…", "options": [{"letter": "A", "text": "Pituitary (or ectopic)"}, {"letter": "B", "text": "Adrenal"}], "answer": "A", "explanation": "ACTH-dependent → pituitary MRI, then chest imaging if sella is clean."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hypercortisolism confirmed, ACTH suppressed → Imaging to order:", "options": [{"letter": "A", "text": "Adrenal CT/MRI"}, {"letter": "B", "text": "Pituitary MRI"}, {"letter": "C", "text": "Chest CT"}, {"letter": "D", "text": "Thyroid ultrasound"}], "answer": "A", "explanation": "**Suppressed ACTH = ACTH-independent (adrenal) source** → image the **adrenals**."}], "checkpoints": [{"stem": "Hypercortisolism with high ACTH, pituitary MRI normal → Next imaging:", "options": [{"letter": "A", "text": "Chest CT (ectopic source)"}, {"letter": "B", "text": "Adrenal CT"}, {"letter": "C", "text": "Thyroid ultrasound"}, {"letter": "D", "text": "Bone scan"}], "answer": "A", "explanation": "High ACTH with a clean sella suggests **ectopic ACTH** — look in the chest (small cell lung cancer)."}]}}, {"id": "19", "group": 19, "slide": 29, "section": "Cushing's disease treatment", "topic": "Cushing's disease", "skill": "Management", "stem": "What is the treatment of choice for Cushing disease caused by an ACTH-secreting pituitary adenoma?", "options": [{"letter": "A", "text": "Unilateral adrenalectomy"}, {"letter": "B", "text": "Transsphenoidal adenomectomy"}, {"letter": "C", "text": "Lifelong ketoconazole"}, {"letter": "D", "text": "Bilateral adrenalectomy"}], "answer": "B", "explanation": "**Transsphenoidal adenomectomy** — remove the tumor, leave normal pituitary — is the treatment of choice.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Treat the **source**. In Cushing's disease the problem is in the pituitary, not the adrenals.", "stem": "The definitive fix targets which gland?", "options": [{"letter": "A", "text": "Pituitary"}, {"letter": "B", "text": "Adrenal"}, {"letter": "C", "text": "Hypothalamus"}], "answer": "A", "explanation": "Resect the **pituitary** adenoma.", "clarify": [{"stem": "Medications for Cushing's are generally…", "options": [{"letter": "A", "text": "A bridge or backup"}, {"letter": "B", "text": "First-line definitive therapy"}], "answer": "A", "explanation": "Surgery is first-line; drugs are for when surgery fails or isn't possible."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's disease (pituitary ACTH adenoma) → Treatment of choice:", "options": [{"letter": "A", "text": "Transsphenoidal adenomectomy"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Lifelong ketoconazole"}, {"letter": "D", "text": "Unilateral adrenalectomy"}], "answer": "A", "explanation": "**Transsphenoidal adenomectomy** — remove the tumor, leave normal pituitary — is the treatment of choice."}], "checkpoints": [{"stem": "New polyuria and thirst after transsphenoidal surgery → Complication:", "options": [{"letter": "A", "text": "Transient diabetes insipidus"}, {"letter": "B", "text": "Primary hyperaldosteronism"}, {"letter": "C", "text": "SIADH from adrenal injury"}, {"letter": "D", "text": "Pheochromocytoma crisis"}], "answer": "A", "explanation": "Pituitary surgery can cause **transient DI**; also watch for **adrenal insufficiency** from lost ACTH."}]}}, {"id": "20", "group": 20, "slide": 30, "section": "Adrenal tumor treatment", "topic": "Cushing's syndrome", "skill": "Management", "stem": "What is the treatment for Cushing syndrome caused by a cortisol-secreting adrenal tumor?", "options": [{"letter": "A", "text": "Pituitary radiation"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Transsphenoidal adenomectomy"}, {"letter": "D", "text": "Unilateral adrenalectomy"}], "answer": "D", "explanation": "Adrenal tumor → **unilateral adrenalectomy**; bilateral hyperplasia → bilateral adrenalectomy.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Surgery targets the **source** — here a single adrenal tumor.", "stem": "How many adrenal glands contain the tumor?", "options": [{"letter": "A", "text": "One"}, {"letter": "B", "text": "Both"}], "answer": "A", "explanation": "A single tumor needs removal of **one** gland.", "clarify": [{"stem": "Bilateral adrenal HYPERPLASIA is treated with…", "options": [{"letter": "A", "text": "Bilateral adrenalectomy"}, {"letter": "B", "text": "Unilateral adrenalectomy"}], "answer": "A", "explanation": "Both glands are overactive, so both are removed."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's syndrome from a cortisol-secreting adrenal tumor → Treatment:", "options": [{"letter": "A", "text": "Unilateral adrenalectomy"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Transsphenoidal adenomectomy"}, {"letter": "D", "text": "Pituitary radiation"}], "answer": "A", "explanation": "Adrenal tumor → **unilateral adrenalectomy**; bilateral hyperplasia → bilateral adrenalectomy."}], "checkpoints": [{"stem": "After bilateral adrenalectomy → Long-term requirement:", "options": [{"letter": "A", "text": "Lifelong glucocorticoid ± mineralocorticoid"}, {"letter": "B", "text": "No further therapy"}, {"letter": "C", "text": "Annual pituitary MRI only"}, {"letter": "D", "text": "Lifelong ketoconazole"}], "answer": "A", "explanation": "Removing both adrenals causes adrenal insufficiency → **lifelong steroid replacement**."}]}}, {"id": "21", "group": 21, "slide": 31, "section": "Ectopic ACTH treatment", "topic": "Cushing's syndrome", "skill": "Management", "stem": "What is the first-choice treatment for a resectable ectopic ACTH-secreting tumor?", "options": [{"letter": "A", "text": "Surgical removal of the tumor"}, {"letter": "B", "text": "Transsphenoidal surgery"}, {"letter": "C", "text": "Bilateral adrenalectomy"}, {"letter": "D", "text": "Pituitary radiation"}], "answer": "A", "explanation": "For ectopic ACTH, **surgical removal of the tumor** is first choice; drugs, then bilateral adrenalectomy, if it can't be resected.", "objective": "", "bg": "#fff0e0", "remediation": {"steps": [{"teach": "The rule for all endogenous Cushing's: **remove the source**. Here the ACTH comes from a tumor outside the pituitary.", "stem": "In ectopic ACTH syndrome, where is the ACTH coming from?", "options": [{"letter": "A", "text": "A non-pituitary tumor"}, {"letter": "B", "text": "The pituitary"}, {"letter": "C", "text": "The adrenal cortex"}], "answer": "A", "explanation": "Remove that **non-pituitary tumor**.", "clarify": [{"stem": "Transsphenoidal surgery targets the…", "options": [{"letter": "A", "text": "Pituitary"}, {"letter": "B", "text": "Lung"}], "answer": "A", "explanation": "It doesn't help when ACTH is ectopic."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Resectable ectopic ACTH-secreting tumor → First-choice treatment:", "options": [{"letter": "A", "text": "Surgical removal of the tumor"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Transsphenoidal surgery"}, {"letter": "D", "text": "Pituitary radiation"}], "answer": "A", "explanation": "For ectopic ACTH, **surgical removal of the tumor** is first choice; drugs, then bilateral adrenalectomy, if it can't be resected."}], "checkpoints": [{"stem": "Cushing's when surgery is contraindicated or as a bridge → First-choice cortisol-suppressing drug:", "options": [{"letter": "A", "text": "Ketoconazole"}, {"letter": "B", "text": "Spironolactone"}, {"letter": "C", "text": "Phenoxybenzamine"}, {"letter": "D", "text": "Fludrocortisone"}], "answer": "A", "explanation": "**Ketoconazole** is the 1st-choice drug (stop PPIs — needs acid to absorb); endocrinology manages it."}]}}, {"id": "22", "group": 22, "slide": 34, "section": "Pseudo-Cushing's cause", "topic": "Pseudo-Cushing's", "skill": "Identification", "stem": "What is the most typical cause of pseudo-Cushing syndrome?", "options": [{"letter": "A", "text": "Pituitary microadenoma"}, {"letter": "B", "text": "Chronic alcohol abuse"}, {"letter": "C", "text": "Black licorice intake"}, {"letter": "D", "text": "Adrenal adenoma"}], "answer": "B", "explanation": "**Pseudo-Cushing's** = hypercortisolism secondary to another disorder — typically **ETOH abuse**, also severe depression, OSA, uncontrolled DM, PCOS.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "'Pseudo' means there is **no tumor** — the HPA axis is over-driven by a non-endocrine condition.", "stem": "Pseudo-Cushing's involves an endocrine tumor?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "No tumor — a **non-endocrine condition** drives cortisol up.", "clarify": [{"stem": "Licorice causes a 'pseudo' version of which disorder?", "options": [{"letter": "A", "text": "Hyperaldosteronism"}, {"letter": "B", "text": "Cushing's"}], "answer": "A", "explanation": "Licorice → pseudohyperaldosteronism, not pseudo-Cushing's."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Pseudo-Cushing's syndrome → Most typical cause:", "options": [{"letter": "A", "text": "Chronic alcohol abuse"}, {"letter": "B", "text": "Pituitary microadenoma"}, {"letter": "C", "text": "Adrenal adenoma"}, {"letter": "D", "text": "Black licorice intake"}], "answer": "A", "explanation": "**Pseudo-Cushing's** = hypercortisolism secondary to another disorder — typically **ETOH abuse**, also severe depression, OSA, uncontrolled DM, PCOS."}], "checkpoints": [{"stem": "Besides alcohol, which condition is a recognized cause of pseudo-Cushing's?", "options": [{"letter": "A", "text": "Severe depression"}, {"letter": "B", "text": "Hypothyroidism"}, {"letter": "C", "text": "Iron deficiency anemia"}, {"letter": "D", "text": "Hypoparathyroidism"}], "answer": "A", "explanation": "Prolonged stress states — **severe depression**, eating disorders, sleep apnea, uncontrolled DM, PCOS."}]}}, {"id": "23", "group": 23, "slide": 34, "section": "Pseudo-Cushing's treatment", "topic": "Pseudo-Cushing's", "skill": "Management", "stem": "How should a patient with heavy alcohol use, Cushingoid features, and no tumor on imaging be treated?", "options": [{"letter": "A", "text": "Long-term ketoconazole"}, {"letter": "B", "text": "Unilateral adrenalectomy"}, {"letter": "C", "text": "Transsphenoidal surgery"}, {"letter": "D", "text": "Alcohol cessation"}], "answer": "D", "explanation": "Pseudo-Cushing's: **treat the underlying disorder** (stop alcohol, treat depression) — no surgery, no adrenal-blocking drugs.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "If the hypercortisolism is **secondary to another disorder**, fixing that disorder fixes the cortisol.", "stem": "What is driving cortisol up in this patient?", "options": [{"letter": "A", "text": "Alcohol use"}, {"letter": "B", "text": "An adrenal tumor"}, {"letter": "C", "text": "A pituitary adenoma"}], "answer": "A", "explanation": "Remove the **alcohol** and cortisol normalizes.", "clarify": [{"stem": "Is surgery indicated when imaging shows no tumor?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "There's nothing to resect."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushingoid heavy drinker, no tumor on imaging → Treatment:", "options": [{"letter": "A", "text": "Alcohol cessation"}, {"letter": "B", "text": "Unilateral adrenalectomy"}, {"letter": "C", "text": "Transsphenoidal surgery"}, {"letter": "D", "text": "Long-term ketoconazole"}], "answer": "A", "explanation": "Pseudo-Cushing's: **treat the underlying disorder** (stop alcohol, treat depression) — no surgery, no adrenal-blocking drugs."}], "checkpoints": [{"stem": "Pseudo-Cushing's → Labs compared with true Cushing's:", "options": [{"letter": "A", "text": "Look the same (Na↑ K↓ HCO₃↑ glucose↑)"}, {"letter": "B", "text": "Show the Addison's pattern"}, {"letter": "C", "text": "Are completely normal"}, {"letter": "D", "text": "Show isolated hyperkalemia"}], "answer": "A", "explanation": "Labs can **mimic Cushing's**; the clue is the history and resolution once the cause is treated."}]}}, {"id": "24", "group": 24, "slide": 35, "section": "Conn syndrome", "topic": "Hyperaldosteronism", "skill": "Identification", "stem": "What is the most common cause of primary hyperaldosteronism?", "options": [{"letter": "A", "text": "Adrenocortical carcinoma"}, {"letter": "B", "text": "Aldosterone-producing adenoma (Conn)"}, {"letter": "C", "text": "Glucocorticoid-remediable type"}, {"letter": "D", "text": "Bilateral adrenal hyperplasia"}], "answer": "B", "explanation": "**Aldosterone-producing adenoma (Conn syndrome)** ≈ 75%; bilateral hyperplasia ≈ 25%; carcinoma ≈ 1%.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The most common cause is a single benign tumor, and it carries an eponym.", "stem": "The leading cause is…", "options": [{"letter": "A", "text": "A single benign adenoma"}, {"letter": "B", "text": "Both glands enlarged"}, {"letter": "C", "text": "A malignant tumor"}], "answer": "A", "explanation": "A single **adenoma** (Conn) — about three-quarters of cases.", "clarify": [{"stem": "Adrenal carcinoma causes about what share?", "options": [{"letter": "A", "text": "~1%"}, {"letter": "B", "text": "~50%"}], "answer": "A", "explanation": "Carcinoma is rare."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Primary hyperaldosteronism → Most common cause:", "options": [{"letter": "A", "text": "Aldosterone-producing adenoma (Conn)"}, {"letter": "B", "text": "Bilateral adrenal hyperplasia"}, {"letter": "C", "text": "Adrenocortical carcinoma"}, {"letter": "D", "text": "Glucocorticoid-remediable type"}], "answer": "A", "explanation": "**Aldosterone-producing adenoma (Conn syndrome)** ≈ 75%; bilateral hyperplasia ≈ 25%; carcinoma ≈ 1%."}], "checkpoints": [{"stem": "Aldosterone-producing adenoma → Definitive treatment:", "options": [{"letter": "A", "text": "Unilateral adrenalectomy"}, {"letter": "B", "text": "Transsphenoidal surgery"}, {"letter": "C", "text": "Bilateral adrenalectomy"}, {"letter": "D", "text": "Lifelong fludrocortisone"}], "answer": "A", "explanation": "A case of 'curable hypertension' — **remove the adenoma**."}]}}, {"id": "25", "group": 25, "slide": 36, "section": "Hyperaldosteronism picture", "topic": "Hyperaldosteronism", "skill": "Identification", "stem": "Which diagnosis is suggested by hypertension, hypokalemia, and metabolic alkalosis?", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Primary hyperaldosteronism"}, {"letter": "C", "text": "Addison's disease"}, {"letter": "D", "text": "Secondary adrenal insufficiency"}], "answer": "B", "explanation": "**HTN + hypokalemia + metabolic alkalosis** (± hypernatremia) = hyperaldosteronism — 'curable hypertension.'", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Aldosterone retains Na⁺ and **wastes K⁺** (and H⁺). Which disorder has too much of it?", "stem": "Which hormone, in excess, raises BP and drops K⁺?", "options": [{"letter": "A", "text": "Aldosterone"}, {"letter": "B", "text": "Cortisol deficiency"}, {"letter": "C", "text": "Epinephrine"}], "answer": "A", "explanation": "Excess **aldosterone**.", "clarify": [{"stem": "Addison's disease causes which potassium change?", "options": [{"letter": "A", "text": "Hyperkalemia"}, {"letter": "B", "text": "Hypokalemia"}], "answer": "A", "explanation": "Addison's has HIGH K⁺, not low."}, {"stem": "Pheochromocytoma's hallmark is…", "options": [{"letter": "A", "text": "Episodic adrenergic spells"}, {"letter": "B", "text": "Hypokalemic alkalosis"}], "answer": "A", "explanation": "Pheo = headache, sweating, tachycardia, BP swings."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hypertension + hypokalemia + metabolic alkalosis → Diagnosis:", "options": [{"letter": "A", "text": "Primary hyperaldosteronism"}, {"letter": "B", "text": "Addison's disease"}, {"letter": "C", "text": "Pheochromocytoma"}, {"letter": "D", "text": "Secondary adrenal insufficiency"}], "answer": "A", "explanation": "**HTN + hypokalemia + metabolic alkalosis** (± hypernatremia) = hyperaldosteronism — 'curable hypertension.'"}], "checkpoints": [{"stem": "Hyperaldosteronism → Associated symptoms of hypokalemia:", "options": [{"letter": "A", "text": "Muscle weakness, polyuria, paresthesias"}, {"letter": "B", "text": "Hyperpigmentation and salt craving"}, {"letter": "C", "text": "Moon facies and striae"}, {"letter": "D", "text": "Episodic sweating and pallor"}], "answer": "A", "explanation": "Low K⁺ causes **weakness, polyuria/polydipsia, paresthesias**, fatigue, headaches."}]}}, {"id": "26", "group": 26, "slide": 37, "section": "Licorice", "topic": "Hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "What serum aldosterone level is expected in a patient with hypertension and hypokalemia resembling Conn syndrome who drinks real licorice tea daily?", "options": [{"letter": "A", "text": "Markedly elevated"}, {"letter": "B", "text": "Elevated"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Suppressed"}], "answer": "D", "explanation": "Licorice causes **pseudohyperaldosteronism**: cortisol activates the mineralocorticoid receptor, volume expands, RAAS shuts off → **aldosterone suppressed**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "In licorice ingestion, the receptor is being stimulated by **cortisol, not aldosterone**. Think about what volume expansion does to RAAS.", "stem": "Volume and BP rise from mineralocorticoid effect. RAAS then…", "options": [{"letter": "A", "text": "Shuts off"}, {"letter": "B", "text": "Turns up"}], "answer": "A", "explanation": "Expanded volume **suppresses renin → aldosterone falls**.", "clarify": [{"stem": "In TRUE primary hyperaldosteronism, aldosterone is…", "options": [{"letter": "A", "text": "Elevated"}, {"letter": "B", "text": "Suppressed"}], "answer": "A", "explanation": "Primary and secondary hyperaldosteronism both have high aldosterone."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Conn-like HTN and hypokalemia, drinks real licorice tea daily → Serum aldosterone:", "options": [{"letter": "A", "text": "Suppressed"}, {"letter": "B", "text": "Elevated"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Markedly elevated"}], "answer": "A", "explanation": "Licorice causes **pseudohyperaldosteronism**: cortisol activates the mineralocorticoid receptor, volume expands, RAAS shuts off → **aldosterone suppressed**."}], "checkpoints": [{"stem": "Licorice-induced pseudohyperaldosteronism → Treatment:", "options": [{"letter": "A", "text": "Stop licorice intake"}, {"letter": "B", "text": "Unilateral adrenalectomy"}, {"letter": "C", "text": "Start fludrocortisone"}, {"letter": "D", "text": "Bilateral adrenalectomy"}], "answer": "A", "explanation": "**Stop the licorice** (often herbal teas or erk sous; most candy uses anise)."}]}}, {"id": "27", "group": 27, "slide": 40, "section": "Primary AI ACTH", "topic": "Addison's disease (primary AI)", "skill": "Disease process", "stem": "What ACTH level is expected in primary adrenal insufficiency?", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}, {"letter": "C", "text": "Undetectable"}, {"letter": "D", "text": "Normal"}], "answer": "A", "explanation": "**Primary** = the adrenal gland is destroyed; the pituitary senses low cortisol and **raises ACTH**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "In PRIMARY disorders the **gland itself** fails; the pituitary is intact and responds to low cortisol.", "stem": "With low cortisol and a healthy pituitary, ACTH output…", "options": [{"letter": "A", "text": "Increases"}, {"letter": "B", "text": "Decreases"}], "answer": "A", "explanation": "Loss of negative feedback → **ACTH rises**.", "clarify": [{"stem": "In SECONDARY AI, which organ is the problem?", "options": [{"letter": "A", "text": "Pituitary"}, {"letter": "B", "text": "Adrenal"}], "answer": "A", "explanation": "Secondary = pituitary failure → ACTH low."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Primary adrenal insufficiency → Expected ACTH level:", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Undetectable"}], "answer": "A", "explanation": "**Primary** = the adrenal gland is destroyed; the pituitary senses low cortisol and **raises ACTH**."}], "checkpoints": [{"stem": "Secondary adrenal insufficiency → Expected ACTH level:", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High"}, {"letter": "C", "text": "Very high with hyperpigmentation"}, {"letter": "D", "text": "High with hyperkalemia"}], "answer": "A", "explanation": "Secondary = pituitary failure → **ACTH low**."}]}}, {"id": "28", "group": 28, "slide": 40, "section": "Primary AI cause", "topic": "Addison's disease (primary AI)", "skill": "Identification", "stem": "What is the most common cause of primary adrenal insufficiency in the modern United States?", "options": [{"letter": "A", "text": "Autoimmune adrenalitis"}, {"letter": "B", "text": "Adrenal tuberculosis"}, {"letter": "C", "text": "Adrenal hemorrhage"}, {"letter": "D", "text": "Exogenous steroid withdrawal"}], "answer": "A", "explanation": "**Autoimmune adrenalitis** ≈ 65% of primary AI today; Addison's original patients had **adrenal TB**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The leading modern cause is the immune system attacking the gland — the same theme as other glandular **autoimmune** diseases.", "stem": "Most primary AI today results from…", "options": [{"letter": "A", "text": "Immune destruction of the adrenal"}, {"letter": "B", "text": "Infection of the adrenal"}, {"letter": "C", "text": "Bleeding into the adrenal"}], "answer": "A", "explanation": "**Autoimmune** destruction.", "clarify": [{"stem": "Steroid withdrawal causes which type of AI?", "options": [{"letter": "A", "text": "Secondary"}, {"letter": "B", "text": "Primary"}], "answer": "A", "explanation": "Exogenous steroids suppress ACTH → secondary, not primary."}, {"stem": "Thomas Addison's original patients had adrenal…", "options": [{"letter": "A", "text": "Tuberculosis"}, {"letter": "B", "text": "Autoimmunity"}], "answer": "A", "explanation": "TB was the historic cause; autoimmune dominates now."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Most common cause of primary adrenal insufficiency (modern U.S.) →", "options": [{"letter": "A", "text": "Autoimmune adrenalitis"}, {"letter": "B", "text": "Adrenal tuberculosis"}, {"letter": "C", "text": "Adrenal hemorrhage"}, {"letter": "D", "text": "Exogenous steroid withdrawal"}], "answer": "A", "explanation": "**Autoimmune adrenalitis** ≈ 65% of primary AI today; Addison's original patients had **adrenal TB**."}], "checkpoints": [{"stem": "Patient with autoimmune Addison's → Other conditions to monitor for:", "options": [{"letter": "A", "text": "Autoimmune thyroid disease and type 1 DM"}, {"letter": "B", "text": "Pheochromocytoma and paraganglioma"}, {"letter": "C", "text": "Medullary thyroid cancer"}, {"letter": "D", "text": "Prolactinoma and gastrinoma"}], "answer": "A", "explanation": "Autoimmune AI clusters with **thyroid disease and T1DM** — monitor for concurrent autoimmune disorders."}]}}, {"id": "29", "group": 29, "slide": 40, "section": "Secondary AI cause", "topic": "Secondary adrenal insufficiency", "skill": "Identification", "stem": "What is the most common cause of secondary adrenal insufficiency?", "options": [{"letter": "A", "text": "Adrenal tuberculosis"}, {"letter": "B", "text": "Autoimmune adrenalitis"}, {"letter": "C", "text": "Congenital adrenal hyperplasia"}, {"letter": "D", "text": "Withdrawal of exogenous steroids"}], "answer": "D", "explanation": "Exogenous steroids suppress pituitary ACTH; stopping them → **secondary AI** (adrenals intact, ACTH low).", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Secondary means the **pituitary (ACTH)** is the problem. Which common exposure suppresses ACTH via negative feedback?", "stem": "Long-term prednisone suppresses which hormone?", "options": [{"letter": "A", "text": "ACTH"}, {"letter": "B", "text": "Renin"}, {"letter": "C", "text": "Aldosterone"}], "answer": "A", "explanation": "Exogenous steroids suppress **ACTH**.", "clarify": [{"stem": "Autoimmune adrenalitis destroys the…", "options": [{"letter": "A", "text": "Adrenal (primary)"}, {"letter": "B", "text": "Pituitary (secondary)"}], "answer": "A", "explanation": "That's a primary cause."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Most common cause of secondary adrenal insufficiency →", "options": [{"letter": "A", "text": "Withdrawal of exogenous steroids"}, {"letter": "B", "text": "Autoimmune adrenalitis"}, {"letter": "C", "text": "Adrenal tuberculosis"}, {"letter": "D", "text": "Congenital adrenal hyperplasia"}], "answer": "A", "explanation": "Exogenous steroids suppress pituitary ACTH; stopping them → **secondary AI** (adrenals intact, ACTH low)."}], "checkpoints": [{"stem": "Secondary AI from pituitary disease (tumor, radiation, Sheehan's) → Also evaluate for:", "options": [{"letter": "A", "text": "Other pituitary hormone deficiencies"}, {"letter": "B", "text": "Medullary thyroid cancer"}, {"letter": "C", "text": "Hyperaldosteronism"}, {"letter": "D", "text": "Pheochromocytoma"}], "answer": "A", "explanation": "Pituitary failure often involves other axes — look for **panhypopituitarism**."}]}}, {"id": "30", "group": 30, "slide": 41, "section": "AI labs", "topic": "Addison's disease (primary AI)", "skill": "Diagnostics & imaging", "stem": "What laboratory pattern is expected in primary adrenal insufficiency?", "options": [{"letter": "A", "text": "Na↑, K↓, glucose↑, alkalosis"}, {"letter": "B", "text": "Na↓, K↑, glucose↓, eosinophilia"}, {"letter": "C", "text": "Na↓, K↓, glucose↑, lymphopenia"}, {"letter": "D", "text": "Na↑, K↑, glucose↓, neutrophilia"}], "answer": "B", "explanation": "No aldosterone → **Na↓, K↑**, mild acidosis; no cortisol → **hypoglycemia**, hypercalcemia, anemia, lymphocytosis, **eosinophilia**.", "objective": "", "bg": "#fff5e0", "remediation": {"steps": [{"teach": "Start with the missing hormones: **aldosterone** retains Na⁺ and wastes K⁺; **cortisol** raises glucose.", "stem": "With no aldosterone, potassium goes…", "options": [{"letter": "A", "text": "Up"}, {"letter": "B", "text": "Down"}], "answer": "A", "explanation": "No K⁺ wasting → **hyperkalemia** (with hyponatremia).", "clarify": [{"stem": "With no corti
