sol, glucose tends to be…", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High"}], "answer": "A", "explanation": "Cortisol drives gluconeogenesis; without it → hypoglycemia."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Primary adrenal insufficiency → Expected lab pattern:", "options": [{"letter": "A", "text": "Na↓, K↑, glucose↓, eosinophilia"}, {"letter": "B", "text": "Na↑, K↓, glucose↑, alkalosis"}, {"letter": "C", "text": "Na↓, K↓, glucose↑, lymphopenia"}, {"letter": "D", "text": "Na↑, K↑, glucose↓, neutrophilia"}], "answer": "A", "explanation": "No aldosterone → **Na↓, K↑**, mild acidosis; no cortisol → **hypoglycemia**, hypercalcemia, anemia, lymphocytosis, **eosinophilia**."}], "checkpoints": [{"stem": "Primary vs secondary AI → Electrolyte that distinguishes them:", "options": [{"letter": "A", "text": "Potassium (high only in primary)"}, {"letter": "B", "text": "Glucose (low only in secondary)"}, {"letter": "C", "text": "Calcium (low in primary)"}, {"letter": "D", "text": "Bicarbonate (high in primary)"}], "answer": "A", "explanation": "Aldosterone is RAAS-driven and **preserved in secondary AI**, so **hyperkalemia points to primary**."}]}}, {"id": "31", "group": 31, "slide": 42, "section": "Addison's presentation", "topic": "Addison's disease (primary AI)", "skill": "Identification", "stem": "Which diagnosis is most likely in a patient with weight loss, severe fatigue, salt craving, and orthostatic dizziness?", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Cushing's syndrome"}, {"letter": "C", "text": "Primary hyperaldosteronism"}, {"letter": "D", "text": "Adrenal insufficiency"}], "answer": "D", "explanation": "**Salt craving, weight loss, fatigue, and postural hypotension** are classic adrenal insufficiency; onset may be insidious and vague.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "**Salt craving** is the giveaway — the body is losing sodium because a sodium-retaining hormone is missing.", "stem": "Salt craving reflects loss of which hormone?", "options": [{"letter": "A", "text": "Aldosterone"}, {"letter": "B", "text": "Epinephrine"}, {"letter": "C", "text": "Androgens"}], "answer": "A", "explanation": "No **aldosterone** → Na⁺ and volume loss → salt craving and orthostasis.", "clarify": [{"stem": "Cushing's typically causes weight…", "options": [{"letter": "A", "text": "Gain (central)"}, {"letter": "B", "text": "Loss"}], "answer": "A", "explanation": "Cushing's = central obesity, not weight loss."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Weight loss, severe fatigue, salt craving, orthostatic dizziness → Diagnosis:", "options": [{"letter": "A", "text": "Adrenal insufficiency"}, {"letter": "B", "text": "Cushing's syndrome"}, {"letter": "C", "text": "Primary hyperaldosteronism"}, {"letter": "D", "text": "Pheochromocytoma"}], "answer": "A", "explanation": "**Salt craving, weight loss, fatigue, and postural hypotension** are classic adrenal insufficiency; onset may be insidious and vague."}], "checkpoints": [{"stem": "Young woman with long-standing weight loss and vague GI symptoms later found to have Addison's → Diagnosis it was mistaken for:", "options": [{"letter": "A", "text": "Anorexia nervosa"}, {"letter": "B", "text": "Cushing's syndrome"}, {"letter": "C", "text": "Pheochromocytoma"}, {"letter": "D", "text": "Hyperthyroidism"}], "answer": "A", "explanation": "The lecture case was **nearly mistaken for anorexia nervosa** — AI onset can be insidious and vague."}]}}, {"id": "32", "group": 32, "slide": 43, "section": "Hyperpigmentation", "topic": "Addison's disease (primary AI)", "skill": "Identification", "stem": "Which type of adrenal insufficiency causes hyperpigmentation?", "options": [{"letter": "A", "text": "Primary"}, {"letter": "B", "text": "Tertiary"}, {"letter": "C", "text": "Secondary"}, {"letter": "D", "text": "Iatrogenic from steroids"}], "answer": "A", "explanation": "**High ACTH** stimulates melanocytes → hyperpigmentation, so it occurs only in **primary** AI.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Hyperpigmentation is caused by **ACTH** acting like melanocyte-stimulating hormone. Which type has high ACTH?", "stem": "Which AI type has HIGH ACTH?", "options": [{"letter": "A", "text": "Primary (adrenal failure)"}, {"letter": "B", "text": "Secondary (pituitary failure)"}], "answer": "A", "explanation": "Primary AI → **ACTH high** → pigment.", "clarify": [{"stem": "Steroid withdrawal AI has ACTH that is…", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High"}], "answer": "A", "explanation": "It's secondary (suppressed ACTH) → no hyperpigmentation."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hyperpigmentation occurs only in this type of adrenal insufficiency → Type:", "options": [{"letter": "A", "text": "Primary"}, {"letter": "B", "text": "Secondary"}, {"letter": "C", "text": "Tertiary"}, {"letter": "D", "text": "Iatrogenic from steroids"}], "answer": "A", "explanation": "**High ACTH** stimulates melanocytes → hyperpigmentation, so it occurs only in **primary** AI."}], "checkpoints": [{"stem": "Addison's hyperpigmentation after starting steroid replacement →", "options": [{"letter": "A", "text": "Fades as ACTH falls"}, {"letter": "B", "text": "Becomes permanent"}, {"letter": "C", "text": "Darkens further"}, {"letter": "D", "text": "Spreads to mucosa"}], "answer": "A", "explanation": "Replacement restores feedback, **ACTH falls**, and the pigmentation **resolves**."}]}}, {"id": "33", "group": 33, "slide": 44, "section": "AM cortisol", "topic": "Addison's disease (primary AI)", "skill": "Diagnostics & imaging", "stem": "What is the initial test for suspected adrenal insufficiency?", "options": [{"letter": "A", "text": "Random afternoon cortisol"}, {"letter": "B", "text": "Late-night salivary cortisol"}, {"letter": "C", "text": "8 AM serum cortisol"}, {"letter": "D", "text": "1-mg dexamethasone suppression"}], "answer": "C", "explanation": "**8 AM cortisol** — measured when it should be **highest** (diurnal rhythm).", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "To prove a deficiency, measure when levels should be at their **peak**.", "stem": "Cortisol is normally highest in the…", "options": [{"letter": "A", "text": "Early morning"}, {"letter": "B", "text": "Late night"}, {"letter": "C", "text": "Afternoon"}], "answer": "A", "explanation": "Peak = **early morning** → 8 AM draw.", "clarify": [{"stem": "Late-night salivary cortisol is used to screen for…", "options": [{"letter": "A", "text": "Cortisol excess"}, {"letter": "B", "text": "Cortisol deficiency"}], "answer": "A", "explanation": "That's a Cushing's test."}, {"stem": "Dexamethasone suppression tests for…", "options": [{"letter": "A", "text": "Excess"}, {"letter": "B", "text": "Deficiency"}], "answer": "A", "explanation": "DST is for Cushing's."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Suspected adrenal insufficiency → Initial test:", "options": [{"letter": "A", "text": "8 AM serum cortisol"}, {"letter": "B", "text": "Late-night salivary cortisol"}, {"letter": "C", "text": "1-mg dexamethasone suppression"}, {"letter": "D", "text": "Random afternoon cortisol"}], "answer": "A", "explanation": "**8 AM cortisol** — measured when it should be **highest** (diurnal rhythm)."}], "checkpoints": [{"stem": "8 AM cortisol → Value that highly suggests adrenal insufficiency:", "options": [{"letter": "A", "text": "<3 mcg/dL"}, {"letter": "B", "text": "10–20 mcg/dL"}, {"letter": "C", "text": "<1.8 mcg/dL after dex"}, {"letter": "D", "text": ">25 mcg/dL"}], "answer": "A", "explanation": "Normal AM cortisol is **10–20 mcg/dL**; **<3 mcg/dL** strongly suggests AI. (<1.8 is the DST cutoff.)"}]}}, {"id": "34", "group": 34, "slide": 45, "section": "ACTH stimulation", "topic": "Addison's disease (primary AI)", "skill": "Diagnostics & imaging", "stem": "How should a cosyntropin stimulation test be interpreted when cortisol fails to rise at 30 and 60 minutes?", "options": [{"letter": "A", "text": "Normal adrenal function"}, {"letter": "B", "text": "Pheochromocytoma"}, {"letter": "C", "text": "Adrenal insufficiency"}, {"letter": "D", "text": "Cushing's disease"}], "answer": "C", "explanation": "Synthetic ACTH should make healthy adrenals release cortisol; **no rise = adrenal insufficiency**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Cosyntropin is **synthetic ACTH**. Ask: can the adrenal glands respond to it?", "stem": "A healthy adrenal given ACTH will…", "options": [{"letter": "A", "text": "Increase cortisol"}, {"letter": "B", "text": "Decrease cortisol"}, {"letter": "C", "text": "Not change"}], "answer": "A", "explanation": "Intact adrenals **increase** cortisol — so a flat response means failure.", "clarify": [{"stem": "Cosyntropin is given by…", "options": [{"letter": "A", "text": "IV"}, {"letter": "B", "text": "Oral"}], "answer": "A", "explanation": "IV, then cortisol is redrawn at 30 and 60 minutes."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cosyntropin (ACTH) stimulation: no cortisol rise at 30 and 60 min → Interpretation:", "options": [{"letter": "A", "text": "Adrenal insufficiency"}, {"letter": "B", "text": "Normal adrenal function"}, {"letter": "C", "text": "Cushing's disease"}, {"letter": "D", "text": "Pheochromocytoma"}], "answer": "A", "explanation": "Synthetic ACTH should make healthy adrenals release cortisol; **no rise = adrenal insufficiency**."}], "checkpoints": [{"stem": "Cortisol rises normally after cosyntropin →", "options": [{"letter": "A", "text": "Adrenal gland function is intact"}, {"letter": "B", "text": "Confirms primary AI"}, {"letter": "C", "text": "Confirms Cushing's syndrome"}, {"letter": "D", "text": "Indicates CAH"}], "answer": "A", "explanation": "A rise means the **adrenals are working**."}]}}, {"id": "35", "group": 35, "slide": 46, "section": "AI maintenance", "topic": "Addison's disease (primary AI)", "skill": "Management", "stem": "What maintenance therapy is required for primary adrenal insufficiency with both cortisol and aldosterone deficiency?", "options": [{"letter": "A", "text": "Hydrocortisone alone"}, {"letter": "B", "text": "Fludrocortisone alone"}, {"letter": "C", "text": "Hydrocortisone + fludrocortisone"}, {"letter": "D", "text": "Dexamethasone + spironolactone"}], "answer": "C", "explanation": "Replace both: cortisol with **hydrocortisone** (or prednisone) and aldosterone with **fludrocortisone (Florinef)**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Two hormones are missing in primary AI, so two replacements are needed.", "stem": "The synthetic aldosterone replacement is…", "options": [{"letter": "A", "text": "Fludrocortisone"}, {"letter": "B", "text": "Hydrocortisone"}, {"letter": "C", "text": "Dexamethasone"}], "answer": "A", "explanation": "**Fludrocortisone (Florinef)** replaces aldosterone; hydrocortisone (Cortef) replaces cortisol.", "clarify": [{"stem": "Secondary AI usually needs aldosterone replacement?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "RAAS keeps aldosterone intact; glucocorticoid alone."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Primary adrenal insufficiency (cortisol and aldosterone deficient) → Maintenance therapy:", "options": [{"letter": "A", "text": "Hydrocortisone + fludrocortisone"}, {"letter": "B", "text": "Hydrocortisone alone"}, {"letter": "C", "text": "Fludrocortisone alone"}, {"letter": "D", "text": "Dexamethasone + spironolactone"}], "answer": "A", "explanation": "Replace both: cortisol with **hydrocortisone** (or prednisone) and aldosterone with **fludrocortisone (Florinef)**."}], "checkpoints": [{"stem": "Hydrocortisone dosed as a larger AM dose plus a smaller mid-afternoon dose → Goal:", "options": [{"letter": "A", "text": "Mimic the diurnal cortisol rhythm"}, {"letter": "B", "text": "Prevent hyperkalemia"}, {"letter": "C", "text": "Reduce aldosterone need"}, {"letter": "D", "text": "Suppress androgen excess"}], "answer": "A", "explanation": "Split dosing **mimics the diurnal rhythm**; avoid late-night doses."}]}}, {"id": "36", "group": 36, "slide": 46, "section": "Never stop steroids", "topic": "Addison's disease (primary AI)", "skill": "Counseling & prevention", "stem": "What should a patient with Addison disease be told if she feels well and wants to stop her steroids?", "options": [{"letter": "A", "text": "Taper off over two weeks"}, {"letter": "B", "text": "Switch to as-needed dosing"}, {"letter": "C", "text": "Never stop — lifelong replacement"}, {"letter": "D", "text": "Stop if 8 AM cortisol is normal"}], "answer": "C", "explanation": "**Lifelong exogenous steroid replacement is required to sustain life** — never discontinue completely in Addison's.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The adrenal gland in Addison's is **destroyed** and does not recover.", "stem": "Does the destroyed adrenal gland regain function?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "No — so replacement is **lifelong**.", "clarify": [{"stem": "Untreated Addison's disease is…", "options": [{"letter": "A", "text": "Fatal"}, {"letter": "B", "text": "Self-limited"}], "answer": "A", "explanation": "Untreated AI is always fatal."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Addison's patient feels well and wants to stop her steroids → Counseling:", "options": [{"letter": "A", "text": "Never stop — lifelong replacement"}, {"letter": "B", "text": "Taper off over two weeks"}, {"letter": "C", "text": "Stop if 8 AM cortisol is normal"}, {"letter": "D", "text": "Switch to as-needed dosing"}], "answer": "A", "explanation": "**Lifelong exogenous steroid replacement is required to sustain life** — never discontinue completely in Addison's."}], "checkpoints": [{"stem": "Addison's patient → Steroid dose goal for maintenance:", "options": [{"letter": "A", "text": "Lowest dose that is effective"}, {"letter": "B", "text": "Highest tolerated dose"}, {"letter": "C", "text": "Dose that normalizes ACTH to zero"}, {"letter": "D", "text": "Double dose every morning"}], "answer": "A", "explanation": "**Avoid overtreating** — use the lowest effective dose to prevent Cushingoid effects."}]}}, {"id": "37", "group": 37, "slide": 49, "section": "Stress dosing", "topic": "Addison's disease (primary AI)", "skill": "Counseling & prevention", "stem": "How should the steroid dose be adjusted in a patient with Addison disease who develops a fever of 101 °F?", "options": [{"letter": "A", "text": "Double the maintenance dose"}, {"letter": "B", "text": "Keep the usual dose"}, {"letter": "C", "text": "Triple the maintenance dose"}, {"letter": "D", "text": "Hold steroids until afebrile"}], "answer": "A", "explanation": "**Stress dosing**: double for fever 100.4–102.2 °F, triple for >102.2 °F, then return to baseline 1–3 days after recovery.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "A healthy HPA axis **raises cortisol during illness**; the Addison's patient can't, so the dose must be raised for them.", "stem": "During illness, a normal adrenal's cortisol output…", "options": [{"letter": "A", "text": "Rises"}, {"letter": "B", "text": "Falls"}, {"letter": "C", "text": "Stays the same"}], "answer": "A", "explanation": "It **rises** — so the replacement dose must rise too.", "clarify": [{"stem": "101 °F falls in which fever band?", "options": [{"letter": "A", "text": "100.4–102.2 °F (double)"}, {"letter": "B", "text": ">102.2 °F (triple)"}], "answer": "A", "explanation": "101 °F → double the dose."}, {"stem": "Keeping a fixed dose during illness risks…", "options": [{"letter": "A", "text": "Adrenal crisis"}, {"letter": "B", "text": "Cushing's syndrome"}], "answer": "A", "explanation": "Under-replacement during stress → crisis."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Addison's patient with a fever of 101 °F → Steroid adjustment:", "options": [{"letter": "A", "text": "Double the maintenance dose"}, {"letter": "B", "text": "Triple the maintenance dose"}, {"letter": "C", "text": "Keep the usual dose"}, {"letter": "D", "text": "Hold steroids until afebrile"}], "answer": "A", "explanation": "**Stress dosing**: double for fever 100.4–102.2 °F, triple for >102.2 °F, then return to baseline 1–3 days after recovery."}], "checkpoints": [{"stem": "Stress dosing → Lecture's rule of thumb 'when in doubt':", "options": [{"letter": "A", "text": "Triple the dose for 3 days"}, {"letter": "B", "text": "Double the dose for 1 week"}, {"letter": "C", "text": "Stop steroids for 24 hours"}, {"letter": "D", "text": "Halve the dose for 3 days"}], "answer": "A", "explanation": "**'Triple the dose for 3 days'** — and prescribe enough tablets to do it without a new Rx."}]}}, {"id": "38", "group": 38, "slide": 50, "section": "Crisis recognition", "topic": "Adrenal crisis", "skill": "Identification", "stem": "Which diagnosis is most likely in a patient with Addison disease who has been vomiting for 2 days and develops hypotensive shock, confusion, hyponatremia, hyperkalemia, and hypoglycemia?", "options": [{"letter": "A", "text": "Diabetic ketoacidosis"}, {"letter": "B", "text": "Septic shock"}, {"letter": "C", "text": "Pheochromocytoma crisis"}, {"letter": "D", "text": "Adrenal crisis"}], "answer": "D", "explanation": "**Adrenal crisis**: shock, altered mental status, hyponatremia, hyperkalemia, hypoglycemia — a life-threatening emergency.", "objective": "", "bg": "#e0f3ff", "remediation": {"steps": [{"teach": "Combine the clues: known AI + inability to keep pills down + the **Na↓ K↑ glucose↓** pattern.", "stem": "Na↓, K↑, glucose↓ reflects loss of…", "options": [{"letter": "A", "text": "Cortisol and aldosterone"}, {"letter": "B", "text": "Insulin"}, {"letter": "C", "text": "Catecholamines"}], "answer": "A", "explanation": "Acute loss of **cortisol and aldosterone** = adrenal crisis.", "clarify": [{"stem": "DKA typically presents with glucose that is…", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}], "answer": "A", "explanation": "DKA = hyperglycemia, not hypoglycemia."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Addison's patient vomiting for 2 days, hypotensive shock, confused, Na↓ K↑ glucose↓ → Diagnosis:", "options": [{"letter": "A", "text": "Adrenal crisis"}, {"letter": "B", "text": "Septic shock"}, {"letter": "C", "text": "Diabetic ketoacidosis"}, {"letter": "D", "text": "Pheochromocytoma crisis"}], "answer": "A", "explanation": "**Adrenal crisis**: shock, altered mental status, hyponatremia, hyperkalemia, hypoglycemia — a life-threatening emergency."}], "checkpoints": [{"stem": "Adrenal crisis is most common in which type of AI?", "options": [{"letter": "A", "text": "Primary adrenal insufficiency"}, {"letter": "B", "text": "Secondary adrenal insufficiency"}, {"letter": "C", "text": "Pseudo-Cushing's"}, {"letter": "D", "text": "Nonclassic CAH only"}], "answer": "A", "explanation": "Most common in **primary AI** (both cortisol and aldosterone lost), though it can occur in secondary AI."}]}}, {"id": "39", "group": 39, "slide": 51, "section": "Crisis precipitant", "topic": "Adrenal crisis", "skill": "Complications", "stem": "What is the most common precipitating factor for adrenal crisis?", "options": [{"letter": "A", "text": "Vomiting / GI illness"}, {"letter": "B", "text": "Strenuous exercise"}, {"letter": "C", "text": "High-salt diet"}, {"letter": "D", "text": "Missed fludrocortisone dose"}], "answer": "A", "explanation": "**Vomiting (often gastroenteritis)** is the trigger in ~80% — the patient can't take or absorb oral steroids.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Oral replacement only works if the patient can **keep it down**.", "stem": "Which symptom prevents a patient from taking oral steroids?", "options": [{"letter": "A", "text": "Vomiting"}, {"letter": "B", "text": "Headache"}, {"letter": "C", "text": "Cough"}], "answer": "A", "explanation": "**Vomiting** blocks oral replacement and adds volume loss.", "clarify": [{"stem": "Most adrenal crises have an identifiable trigger?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "Usually a known precipitating event, most often GI infection."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Adrenal crisis → Most common precipitating factor:", "options": [{"letter": "A", "text": "Vomiting / GI illness"}, {"letter": "B", "text": "Strenuous exercise"}, {"letter": "C", "text": "High-salt diet"}, {"letter": "D", "text": "Missed fludrocortisone dose"}], "answer": "A", "explanation": "**Vomiting (often gastroenteritis)** is the trigger in ~80% — the patient can't take or absorb oral steroids."}], "checkpoints": [{"stem": "In the adrenal crisis pathway, hyperkalemia can progress to →", "options": [{"letter": "A", "text": "Cardiac arrhythmia / arrest"}, {"letter": "B", "text": "Tetany from hypocalcemia"}, {"letter": "C", "text": "Hypertensive emergency"}, {"letter": "D", "text": "Diabetic ketoacidosis"}], "answer": "A", "explanation": "Aldosterone deficiency → **hyperkalemia → arrhythmia/arrest**; volume loss and no vasoconstriction → shock."}]}}, {"id": "40", "group": 40, "slide": 52, "section": "Crisis management", "topic": "Adrenal crisis", "skill": "Management", "stem": "What key treatment should be given immediately when adrenal crisis is suspected?", "options": [{"letter": "A", "text": "IV hydrocortisone bolus"}, {"letter": "B", "text": "Oral fludrocortisone"}, {"letter": "C", "text": "Cosyntropin stimulation test"}, {"letter": "D", "text": "Await cortisol and ACTH results"}], "answer": "A", "explanation": "Draw labs but **don't delay care**: **IV hydrocortisone bolus**, 2–3 L NS, dextrose if hypoglycemic, treat the trigger.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Adrenal crisis is a **never-miss emergency** — treatment can't wait on lab results.", "stem": "Should treatment be delayed until cortisol results return?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "**No** — draw labs, then treat immediately.", "clarify": [{"stem": "Oral meds are reliable in a vomiting patient?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Route must be IV in crisis."}, {"stem": "At crisis doses, hydrocortisone also provides…", "options": [{"letter": "A", "text": "Mineralocorticoid effect"}, {"letter": "B", "text": "No mineralocorticoid effect"}], "answer": "A", "explanation": "High-dose hydrocortisone has mineralocorticoid effect, so Florinef isn't needed acutely."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Suspected adrenal crisis → Immediate key treatment:", "options": [{"letter": "A", "text": "IV hydrocortisone bolus"}, {"letter": "B", "text": "Await cortisol and ACTH results"}, {"letter": "C", "text": "Oral fludrocortisone"}, {"letter": "D", "text": "Cosyntropin stimulation test"}], "answer": "A", "explanation": "Draw labs but **don't delay care**: **IV hydrocortisone bolus**, 2–3 L NS, dextrose if hypoglycemic, treat the trigger."}], "checkpoints": [{"stem": "Adrenal crisis → IV fluid of choice:", "options": [{"letter": "A", "text": "Normal saline (+ dextrose if hypoglycemic)"}, {"letter": "B", "text": "Fluid restriction"}, {"letter": "C", "text": "Lactated Ringer's with added KCl"}, {"letter": "D", "text": "Hypotonic 0.45% saline only"}], "answer": "A", "explanation": "**2–3 L normal saline** corrects hyponatremia and hypovolemia; add dextrose for hypoglycemia (avoid adding K⁺)."}]}}, {"id": "41", "group": 41, "slide": 53, "section": "Emergency injection", "topic": "Adrenal crisis", "skill": "Counseling & prevention", "stem": "What should be prescribed for a patient with Addison disease who is planning a cruise or camping trip?", "options": [{"letter": "A", "text": "Solu-Cortef IM emergency kit"}, {"letter": "B", "text": "Extra fludrocortisone tablets"}, {"letter": "C", "text": "Epinephrine autoinjector"}, {"letter": "D", "text": "Oral dexamethasone pack"}], "answer": "A", "explanation": "**Solu-Cortef 100 mg Act-O-Vial** (with diluent) plus needles/syringes — essential when far from medical care; taught as an **IM thigh** injection.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The emergency drug must work when the patient **can't take pills** (vomiting, syncope) and replace the missing hormone.", "stem": "The emergency injection replaces which hormone?", "options": [{"letter": "A", "text": "Cortisol (hydrocortisone)"}, {"letter": "B", "text": "Epinephrine"}, {"letter": "C", "text": "Aldosterone"}], "answer": "A", "explanation": "Solu-Cortef is injectable **hydrocortisone**.", "clarify": [{"stem": "Is the Solu-Cortef kit self-contained like an EpiPen?", "options": [{"letter": "A", "text": "No — needs needles/syringes"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Prescribe needles and syringes too."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Addison's patient planning a cruise or camping trip → Prescribe:", "options": [{"letter": "A", "text": "Solu-Cortef IM emergency kit"}, {"letter": "B", "text": "Epinephrine autoinjector"}, {"letter": "C", "text": "Extra fludrocortisone tablets"}, {"letter": "D", "text": "Oral dexamethasone pack"}], "answer": "A", "explanation": "**Solu-Cortef 100 mg Act-O-Vial** (with diluent) plus needles/syringes — essential when far from medical care; taught as an **IM thigh** injection."}], "checkpoints": [{"stem": "When should an Addison's patient use the emergency Solu-Cortef injection?", "options": [{"letter": "A", "text": "Vomiting, trauma/blood loss, or (pre)syncope"}, {"letter": "B", "text": "Any mild headache"}, {"letter": "C", "text": "Before every meal"}, {"letter": "D", "text": "Only after a normal cortisol level"}], "answer": "A", "explanation": "Use for **vomiting, trauma, or syncope/pre-syncope** — then go to the ED."}]}}, {"id": "42", "group": 42, "slide": 54, "section": "Patient education", "topic": "Adrenal crisis", "skill": "Counseling & prevention", "stem": "What item should a patient with Addison disease be instructed to carry?", "options": [{"letter": "A", "text": "Nitroglycerin tablets"}, {"letter": "B", "text": "Potassium supplement"}, {"letter": "C", "text": "Emergency medical ID bracelet"}, {"letter": "D", "text": "Glucagon pen"}], "answer": "C", "explanation": "Patients should wear a **medical ID bracelet** (and phone ID) and know stress dosing and the emergency injection.", "objective": "", "bg": "#e0f2ff", "remediation": {"steps": [{"teach": "If the patient is found confused or unconscious, responders must know immediately that they need **steroids**.", "stem": "What alerts EMS to adrenal insufficiency when the patient can't speak?", "options": [{"letter": "A", "text": "Medical ID"}, {"letter": "B", "text": "A daily pill log"}], "answer": "A", "explanation": "A **medical ID bracelet** or phone emergency ID.", "clarify": [{"stem": "Potassium supplements in primary AI are…", "options": [{"letter": "A", "text": "Not indicated (K⁺ tends to be high)"}, {"letter": "B", "text": "Routinely needed"}], "answer": "A", "explanation": "AI causes hyperkalemia."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Addison's patient education → Item to ensure they carry:", "options": [{"letter": "A", "text": "Emergency medical ID bracelet"}, {"letter": "B", "text": "Glucagon pen"}, {"letter": "C", "text": "Potassium supplement"}, {"letter": "D", "text": "Nitroglycerin tablets"}], "answer": "A", "explanation": "Patients should wear a **medical ID bracelet** (and phone ID) and know stress dosing and the emergency injection."}], "checkpoints": [{"stem": "Addison's patient → Preventive care the lecture emphasizes:", "options": [{"letter": "A", "text": "Stay current on vaccinations"}, {"letter": "B", "text": "Avoid all exercise"}, {"letter": "C", "text": "Low-sodium diet"}, {"letter": "D", "text": "Annual adrenal CT"}], "answer": "A", "explanation": "Be proactive about **vaccinations** (flu, COVID-19, pneumonia) — 'minor' illnesses are the danger."}]}}, {"id": "43", "group": 43, "slide": 58, "section": "Adrenal fatigue", "topic": "Adrenal fatigue", "skill": "Counseling & prevention", "stem": "What is the best response to a patient who believes she has adrenal fatigue?", "options": [{"letter": "A", "text": "Order a salivary cortisol panel"}, {"letter": "B", "text": "Begin low-dose hydrocortisone"}, {"letter": "C", "text": "Not a real diagnosis; seek true cause"}, {"letter": "D", "text": "Start adrenal support supplements"}], "answer": "C", "explanation": "**Adrenal fatigue** is not recognized by the Endocrine Society — take the symptoms seriously and look for **real, treatable causes**.", "objective": "", "bg": "#e0f2ff", "remediation": {"steps": [{"teach": "Under stress, the adrenals actually **work harder and make more cortisol**, not less.", "stem": "Under prolonged stress, cortisol output…", "options": [{"letter": "A", "text": "Increases"}, {"letter": "B", "text": "Burns out and falls"}], "answer": "A", "explanation": "It **increases** — the 'burnout' premise is false.", "clarify": [{"stem": "Dismissing the patient's symptoms outright is…", "options": [{"letter": "A", "text": "Inappropriate"}, {"letter": "B", "text": "Appropriate"}], "answer": "A", "explanation": "Symptoms are often from real, treatable conditions."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Patient believes she has 'adrenal fatigue' → Best response:", "options": [{"letter": "A", "text": "Not a real diagnosis; seek true cause"}, {"letter": "B", "text": "Start adrenal support supplements"}, {"letter": "C", "text": "Begin low-dose hydrocortisone"}, {"letter": "D", "text": "Order a salivary cortisol panel"}], "answer": "A", "explanation": "**Adrenal fatigue** is not recognized by the Endocrine Society — take the symptoms seriously and look for **real, treatable causes**."}], "checkpoints": [{"stem": "Why discourage 'adrenal support' supplements?", "options": [{"letter": "A", "text": "May contain unregulated adrenal steroids"}, {"letter": "B", "text": "They cause hyperkalemia"}, {"letter": "C", "text": "They contain catecholamines only"}, {"letter": "D", "text": "They block ACTH receptors"}], "answer": "A", "explanation": "Many contain **bovine adrenal extract** — unregulated steroids that can suppress the HPA axis and cause steroid toxicity."}]}}, {"id": "44", "group": 44, "slide": 61, "section": "Incidentaloma", "topic": "Adrenal incidentaloma", "skill": "Diagnostics & imaging", "stem": "What size of adrenal incidentaloma raises concern for malignancy?", "options": [{"letter": "A", "text": ">10 cm"}, {"letter": "B", "text": ">2 cm"}, {"letter": "C", "text": ">4 cm"}, {"letter": "D", "text": ">1 cm"}], "answer": "C", "explanation": "An **incidentaloma** (found on imaging for another reason) is assessed for function and malignancy; **>4 cm** raises concern.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Adenomas are usually small (<4 cm); carcinomas are usually large (>6 cm). The cutoff sits between them.", "stem": "Benign adrenocortical adenomas are usually…", "options": [{"letter": "A", "text": "<4 cm"}, {"letter": "B", "text": ">6 cm"}], "answer": "A", "explanation": "Adenomas are usually **under 4 cm**, so >4 cm is concerning.", "clarify": [{"stem": "Incidentaloma means the mass was found…", "options": [{"letter": "A", "text": "On imaging done for another reason"}, {"letter": "B", "text": "Because of symptoms"}], "answer": "A", "explanation": "Incidentally — e.g., a CT for kidney stones."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Adrenal incidentaloma → Size that raises concern for malignancy:", "options": [{"letter": "A", "text": ">4 cm"}, {"letter": "B", "text": ">1 cm"}, {"letter": "C", "text": ">10 cm"}, {"letter": "D", "text": ">2 cm"}], "answer": "A", "explanation": "An **incidentaloma** (found on imaging for another reason) is assessed for function and malignancy; **>4 cm** raises concern."}], "checkpoints": [{"stem": "Incidental adrenal mass → Hormone-secreting tumor that must be screened for (metanephrines):", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Prolactinoma"}, {"letter": "C", "text": "Medullary thyroid cancer"}, {"letter": "D", "text": "Paraganglioma of the neck"}], "answer": "A", "explanation": "Every incidentaloma is a reason to screen for **pheochromocytoma**, along with cortisol and aldosterone excess."}]}}, {"id": "45", "group": 45, "slide": 62, "section": "Adenoma vs carcinoma", "topic": "Adrenal incidentaloma", "skill": "Identification", "stem": "Which diagnosis is most likely for an adrenal mass larger than 6 cm that is hormonally functional, aggressive, and associated with a poor prognosis?", "options": [{"letter": "A", "text": "Adrenocortical carcinoma"}, {"letter": "B", "text": "Paraganglioma"}, {"letter": "C", "text": "Adrenal hemorrhage"}, {"letter": "D", "text": "Adrenocortical adenoma"}], "answer": "A", "explanation": "**Adrenocortical carcinoma**: rare (2%), large (>6 cm), ~80% functional, aggressive, poor prognosis.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Size and behavior separate them: the benign tumor is small and usually **nonfunctional**; the malignant one i  "skill": "Diagnostics & imaging", "stem": "What blood-drawing technique is required when measuring plasma metanephrines?", "options": [{"letter": "A", "text": "Indwelling catheter after 30 min supine"}, {"letter": "B", "text": "Random venipuncture while standing"}, {"letter": "C", "text": "Fingerstick after exercise"}, {"letter": "D", "text": "Draw immediately after caffeine"}], "answer": "A", "explanation": "Venipuncture stress and posture raise catecholamines → draw from an **indwelling catheter after 30 min supine** to avoid false positives.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Ask what raises catecholamines acutely: **needle sticks, stress, and standing up**.", "stem": "The stress of a needle stick does what to catecholamines?", "options": [{"letter": "A", "text": "Raises them"}, {"letter": "B", "text": "Lowers them"}], "answer": "A", "explanation": "It **raises** them → false positive; so avoid it at the time of the draw.", "clarify": [{"stem": "Before testing, decongestants and amphetamines should be…", "options": [{"letter": "A", "text": "Stopped if possible"}, {"letter": "B", "text": "Continued"}], "answer": "A", "explanation": "They interfere with results."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Plasma metanephrines → Required drawing technique:", "options": [{"letter": "A", "text": "Indwelling catheter after 30 min supine"}, {"letter": "B", "text": "Random venipuncture while standing"}, {"letter": "C", "text": "Fingerstick after exercise"}, {"letter": "D", "text": "Draw immediately after caffeine"}], "answer": "A", "explanation": "Venipuncture stress and posture raise catecholamines → draw from an **indwelling catheter after 30 min supine** to avoid false positives."}], "checkpoints": [{"stem": "Before pheochromocytoma lab testing → Medications to stop if possible:", "options": [{"letter": "A", "text": "Decongestants, amphetamines, TCAs"}, {"letter": "B", "text": "Levothyroxine an (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(q.answer) + '. ' + fmt(optText(q, q.answer)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });
    pushCheckpoint(q, t);
  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);
    }
  }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong without a pathway, or its pathway has finished.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';
    t.trail.forEach((n, i) => { html += nodeHtml(q, n, i, interactive); });
    html += '</div>';
    return html;
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + fmt(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const wrong = answered && chosen !== q.answer;
    const tutoring = wrong && hasTutor(q);
    const t = tutor[q.id];
    // While the pathway is still in its teaching steps (exam mode), the correct answer stays hidden
    const hideKey = mode === 'exam' && tutoring && t && t.phase === 'steps';
    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Mastered after review</span>';
    else if (status === 'review') html += '<span class="badge review">Flagged for review</span>';
    else if (status === 'active') html += '<span class="badge active">Guided review in progress</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === chosen) cls += chosen === q.answer ? ' correct' : ' incorrect';
        else if (o.letter === q.answer && !hideKey) cls += ' correct';
        else if (!hideKey) cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];
    const _bl = document.getElementById('bglayer');
    if (_bl) _bl.style.display = EXAM_DATA.bgImage ? 'block' : 'none';

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          answers[qid] = btn.getAttribute('data-letter');
          if (answers[qid] !== q.answer && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    document.body.style.backgroundColor = '';
    { const _bl = document.getElementById('bglayer'); if (_bl) _bl.style.display = 'none'; }
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    document.body.style.backgroundColor = '';
    { const _bl = document.getElementById('bglayer'); if (_bl) _bl.style.display = 'none'; }
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer: ' + q.answer + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  { const _bl = document.getElementById('bglayer'); if (_bl && EXAM_DATA.bgImage) _bl.style.backgroundImage = 'url(' + EXAM_DATA.bgImage + ')'; }
  renderPage();
})();
</script>
</body>
</html>
