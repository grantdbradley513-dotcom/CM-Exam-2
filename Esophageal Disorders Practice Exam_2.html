n the chest radiograph"}, {"letter": "D", "text": "Obtain CT of the chest with contrast when a chest radiograph taken within the first hour is normal"}, {"letter": "E", "text": "Obtain CT of the chest with contrast only after mediastinal widening appears on the chest radiograph"}], "answer": "D", "explanation": "Mediastinal emphysema may take about an hour to become visible on a chest radiograph, and mediastinal widening and effusions take several hours, so a film obtained early in the course can be normal while the esophagus is already ruptured. Because this is a surgical emergency in which delay kills, suspicion alone justifies proceeding to CT rather than waiting for radiographic signs to declare themselves.", "objective": "", "section": "Hematemesis after vomiting", "pcase": "D2", "pgroup": "D", "pstack": "C"}, {"id": "26", "group": 26, "stem": "A 70-year-old woman with a hiatal hernia has postprandial fullness and substernal pressure after meals, along with years of heartburn. Barium swallow shows herniation of the stomach through the esophageal hiatus with the gastroesophageal junction in its normal position.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Recommend surgical repair for any hiatal hernia seen on barium swallow"}, {"letter": "B", "text": "Recommend surgical repair for a sliding hernia that is causing reflux symptoms"}, {"letter": "C", "text": "Recommend surgical repair for a paraesophageal hernia that is causing symptoms"}, {"letter": "D", "text": "Recommend surgical repair for any hernia larger than 2 cm on barium swallow"}, {"letter": "E", "text": "Recommend surgical repair only if reflux persists on a daily proton pump inhibitor"}], "answer": "C", "explanation": "A gastroesophageal junction that stays in its normal position while the stomach herniates alongside the esophagus defines a paraesophageal hernia, which causes less reflux and more mechanical and obstructive symptoms, and repair is considered once it is symptomatic and the benefit outweighs the operative risk. Sliding hernias present with reflux and are managed medically as reflux disease, so neither hernia size nor the response of heartburn to acid suppression decides the question.", "objective": "", "section": "Chronic heartburn", "pcase": "E3", "pgroup": "E", "pstack": "C"}, {"id": "27", "group": 27, "stem": "A 47-year-old woman has Plummer-Vinson syndrome. Barium swallow showed a thin web in the upper cervical esophagus, and she continues to have intermittent solid-food dysphagia with fatigue, pallor, glossitis, and angular cheilitis.\n\nWhich of the following is the most appropriate management?\n\nHemoglobin                9.6 g/dL\nMean corpuscular volume   71 fL\nFerritin                  6 ng/mL", "options": [{"letter": "A", "text": "Begin oral iron replacement only if the dysphagia does not improve"}, {"letter": "B", "text": "Begin oral iron replacement only after endoscopic dilation of the web"}, {"letter": "C", "text": "Begin oral iron replacement, giving it with each dose of any tetracycline she takes"}, {"letter": "D", "text": "Begin oral iron replacement, separating it by several hours from any tetracycline she takes"}, {"letter": "E", "text": "Begin oral iron replacement only if fecal occult blood testing becomes positive"}], "answer": "D", "explanation": "Oral iron replacement is the first-line treatment, and the web often resolves once the deficiency is corrected. Oral iron blocks the absorption of tetracyclines, so the doses must be separated rather than taken together; calcium-, magnesium-, or aluminum-containing antacids do the same to tetracyclines and fluoroquinolones. Iron should not be withheld pending dilation, a positive occult blood test, or persistence of the dysphagia, since the anemia itself requires treatment.", "objective": "", "section": "Chronic dysphagia", "pcase": "A4", "pgroup": "A", "pstack": "B"}, {"id": "27A", "group": 27, "stem": "Her dysphagia persists after oral iron replacement. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Elimination diet with a proton pump inhibitor"}, {"letter": "B", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "C", "text": "A twice-daily proton pump inhibitor"}, {"letter": "D", "text": "Endoscopic dilation with a daily proton pump inhibitor"}, {"letter": "E", "text": "Endoscopic dilation of the esophageal web"}], "answer": "E", "explanation": "Endoscopic dilation is the escalation when dysphagia persists despite iron replacement. Dilation combined with a daily proton pump inhibitor is the treatment of a reflux-related peptic stricture, not of a cervical web, and the remaining options are the first-line treatments of eosinophilic esophagitis, achalasia, and diffuse esophageal spasm.", "objective": "", "section": "Chronic dysphagia", "pcase": "A4", "pgroup": "A", "pstack": "B"}, {"id": "28", "group": 28, "stem": "A 58-year-old woman with cirrhosis is recovering in the hospital after endoscopic band ligation of bleeding esophageal varices.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Screening EGD only for patients with cirrhosis who have had an episode of hematemesis"}, {"letter": "B", "text": "Screening EGD only for patients with cirrhosis and ascites"}, {"letter": "C", "text": "Screening EGD for every patient with cirrhosis, repeated annually if no varices are seen"}, {"letter": "D", "text": "Screening EGD for every patient with cirrhosis, repeated in 3 years if no varices are seen"}, {"letter": "E", "text": "Screening EGD only for patients with cirrhosis who are taking a non-selective beta blocker"}], "answer": "D", "explanation": "About half of patients with cirrhosis have varices and a third of those will bleed, and varices remain asymptomatic until the hemorrhage, so screening endoscopy is indicated in every cirrhotic rather than only in those who have already bled or who show other features of portal hypertension. When no varices are found, the examination is repeated in 3 years.", "objective": "", "section": "Hematemesis after vomiting", "pcase": "D3", "pgroup": "D", "pstack": "C"}, {"id": "29", "group": 29, "stem": "A 41-year-old man presents to the clinic because food and liquids have been sticking in his chest for the past two years. He regurgitates undigested food, sometimes onto his pillow at night, and has intermittent chest pain he describes as heartburn. He has lost about 4.5 kg (10 lb) over that time. He has no asthma or food allergies and takes no medications. His temperature is 36.8\u00b0C (98.2\u00b0F), blood pressure is 122/76 mm Hg, pulse is 74/min, and respirations are 14/min. Examination is normal apart from the weight loss, with no pallor, no glossitis, and no angular cheilitis. A barium swallow shows a dilated esophagus tapering to a smooth bird-beak narrowing at the gastroesophageal junction, and upper endoscopy shows a dilated esophagus with retained food and no mass.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Serum iron studies with a complete blood count"}, {"letter": "B", "text": "Upper endoscopy with esophageal biopsy"}, {"letter": "C", "text": "High-resolution esophageal manometry"}, {"letter": "D", "text": "Endoscopic biopsy of a narrowed distal esophageal segment"}, {"letter": "E", "text": "Upper endoscopy"}], "answer": "C", "explanation": "Barium and endoscopy have already shown a dilated esophagus with smooth distal narrowing and retained food but no mass, so what remains unanswered is whether the sphincter relaxes and whether peristalsis is present. High-resolution esophageal manometry is the gold standard for that question and is the appropriate next study. Iron studies, mucosal biopsy, and biopsy of a narrowed segment pursue nutritional and structural disease that the studies already performed did not show.", "objective": "", "section": "Chronic dysphagia", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "29A", "group": 29, "stem": "Which of the following additional findings would most likely be present in this patient?", "options": [{"letter": "A", "text": "Premature, simultaneous distal contractions"}, {"letter": "B", "text": "More than 15 eosinophils per high-power field on mucosal biopsy"}, {"letter": "C", "text": "A smooth benign narrowing of the distal esophagus with biopsy negative for malignancy"}, {"letter": "D", "text": "Failure of lower esophageal sphincter relaxation with absent distal peristalsis"}, {"letter": "E", "text": "A thin web in the upper cervical esophagus with a low ferritin"}], "answer": "D", "explanation": "The lower esophageal sphincter fails to relax, resting sphincter pressure is elevated, and distal peristalsis is absent \u2014 the manometric signature of achalasia. Premature, simultaneous distal contractions define diffuse esophageal spasm instead. The eosinophil count, the proximal web with low ferritin, and the benign distal narrowing belong to mucosal and structural disease that the barium study and endoscopy did not show.", "objective": "", "section": "Chronic dysphagia", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "29B", "group": 29, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Diffuse esophageal spasm"}, {"letter": "B", "text": "Eosinophilic esophagitis"}, {"letter": "C", "text": "Peptic esophageal stricture"}, {"letter": "D", "text": "Esophageal web (Plummer-Vinson syndrome)"}, {"letter": "E", "text": "Achalasia"}], "answer": "E", "explanation": "Dysphagia to liquids as well as solids is the most characteristic feature and strongly suggests achalasia; bird-beak narrowing with retained food and failure of sphincter relaxation with absent peristalsis complete the picture. Diffuse esophageal spasm is intermittent and non-progressive with a structurally normal esophagus. Eosinophilic esophagitis produces rings and furrows in an atopic patient, a web sits in the upper esophagus with iron deficiency, and a peptic stricture narrows the distal lumen after years of reflux.", "objective": "", "section": "Chronic dysphagia", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "30", "group": 30, "stem": "A 43-year-old woman with gastroesophageal reflux disease has completed 8 weeks of a proton pump inhibitor taken on an empty stomach 30 minutes before breakfast, and her heartburn and regurgitation have resolved. She has been losing weight, elevates the head of her bed, and avoids food in the 2 to 3 hours before lying down. She takes no other medications and has no dysphagia and no bleeding.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Attempt discontinuation of the proton pump inhibitor and continue the lifestyle measures"}, {"letter": "B", "text": "Attempt discontinuation only after tapering the dose by 50% each week"}, {"letter": "C", "text": "Attempt discontinuation only after EGD confirms that the mucosa has healed"}, {"letter": "D", "text": "Attempt discontinuation only after a pH study shows acid exposure has normalized"}, {"letter": "E", "text": "Attempt discontinuation only after she has reached a normal body weight"}], "answer": "A", "explanation": "The first-line course is 8 weeks of a proton pump inhibitor followed by an attempt at discontinuation, with the lifestyle measures continued indefinitely. The 50% weekly taper exists because abrupt withdrawal after more than 6 months of therapy causes rebound acid hypersecretion; at 8 weeks that rule does not apply, and neither endoscopic nor pH confirmation is required in an uncomplicated responder.", "objective": "", "section": "Chronic heartburn", "pcase": "E1", "pgroup": "E", "pstack": "B"}, {"id": "30A", "group": 30, "stem": "She later returns with nocturnal heartburn that persists despite a daily proton pump inhibitor taken before breakfast and continued lifestyle measures. Which of the following is the most appropriate change in management?", "options": [{"letter": "A", "text": "Continue the daily proton pump inhibitor and begin endoscopic surveillance"}, {"letter": "B", "text": "Increase the proton pump inhibitor to twice daily and add a bedtime H2 antagonist"}, {"letter": "C", "text": "Continue the daily proton pump inhibitor and begin an elimination diet"}, {"letter": "D", "text": "Continue the daily proton pump inhibitor and refer for endoscopic dilation"}, {"letter": "E", "text": "Continue the daily proton pump inhibitor and refer for surgical repair of the hiatus"}], "answer": "B", "explanation": "Refractory or nocturnal symptoms on once-daily therapy are the indication for twice-daily dosing with an H2 antagonist added at bedtime. H2 blockers have their largest effect on nocturnal acid secretion, which is why they are given at night rather than substituted during the day; fundoplication is considered only after medical therapy has failed.", "objective": "", "section": "Chronic heartburn", "pcase": "E1", "pgroup": "E", "pstack": "B"}, {"id": "31", "group": 31, "stem": "A 47-year-old woman with Plummer-Vinson syndrome is taking oral iron replacement, and her dysphagia has improved. Her earlier fecal occult blood test was negative, and the test is to be repeated.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Stop red meat and other peroxidase-containing foods before repeat fecal occult blood testing"}, {"letter": "B", "text": "Stop the oral iron for several days before repeat fecal occult blood testing"}, {"letter": "C", "text": "Stop the oral iron before repeat testing only if the previous test was positive"}, {"letter": "D", "text": "Stop the oral iron before repeat testing only until the hemoglobin has corrected"}, {"letter": "E", "text": "Stop the oral iron before repeat testing only if the dysphagia recurs"}], "answer": "A", "explanation": "Red meat and other dietary peroxidases cause false-positive fecal occult blood tests and are what must be avoided before the study. Oral iron does not cause a false-positive result, so it does not need to be held at all \u2014 not for a previously positive test, not until the hemoglobin corrects, and not if the dysphagia returns.", "objective": "", "section": "Chronic dysphagia", "pcase": "A4", "pgroup": "A", "pstack": "C"}, {"id": "32", "group": 32, "stem": "A 61-year-old woman with a peptic esophageal stricture has undergone endoscopic dilation, and her dysphagia has resolved.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Continue a daily proton pump inhibitor after dilation only if heartburn persists"}, {"letter": "B", "text": "Continue a daily proton pump inhibitor after dilation only if the narrowed segment is longer than 2 cm"}, {"letter": "C", "text": "Continue a daily proton pump inhibitor after dilation in every patient"}, {"letter": "D", "text": "Continue a daily proton pump inhibitor after dilation only if dilation has to be repeated"}, {"letter": "E", "text": "Continue a daily proton pump inhibitor after dilation only if reflux esophagitis was documented previously"}], "answer": "C", "explanation": "Dilation opens the lumen but does nothing about the acid that scarred it, so a daily proton pump inhibitor is continued after dilation in every patient to reduce recurrence of peptic strictures and rings. Restricting it to those with persisting heartburn, a longer segment, prior esophagitis, or a second dilation leaves ongoing acid injury untreated in exactly the patients whose stricture will re-form.", "objective": "", "section": "Intermittent solid-food dysphagia", "pcase": "B2", "pgroup": "B", "pstack": "C"}, {"id": "33", "group": 33, "stem": "A 36-year-old man with HIV who has been off antiretroviral therapy for about a year is diagnosed with candida esophagitis after endoscopy shows white mucosal plaque-type lesions in the mid and distal esophagus. His CD4 count is 92 cells/\u00b5L, and he has oral thrush and pain on swallowing.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Nystatin suspension swished and swallowed"}, {"letter": "B", "text": "Oral acyclovir five times daily"}, {"letter": "C", "text": "Clotrimazole troches dissolved in the mouth"}, {"letter": "D", "text": "Oral fluconazole 200 mg daily"}, {"letter": "E", "text": "Ganciclovir or valganciclovir"}], "answer": "D", "explanation": "Esophageal candidiasis always requires systemic therapy, and oral fluconazole reaches the invaded esophageal mucosa. Nystatin swish-and-swallow and clotrimazole troches act only on the surface of the oral cavity and are never adequate for esophageal disease, which is the reflex error in a patient whose visible thrush is oral.", "objective": "", "section": "Acute odynophagia", "pcase": "C1", "pgroup": "C", "pstack": "B"}, {"id": "34", "group": 34, "stem": "A 41-year-old man is given a diagnosis of achalasia after esophageal manometry shows failure of lower esophageal sphincter relaxation with an elevated resting sphincter pressure and absent distal peristalsis. He has had dysphagia to solids and liquids for two years, regurgitation of undigested food, and a 4.5-kg (10-lb) weight loss.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Perform upper endoscopy in every patient with achalasia"}, {"letter": "B", "text": "Perform upper endoscopy only in patients who have lost weight"}, {"letter": "C", "text": "Perform upper endoscopy only in patients with dysphagia to liquids as well as solids"}, {"letter": "D", "text": "Perform upper endoscopy only when barium swallow does not show bird-beak narrowing"}, {"letter": "E", "text": "Perform upper endoscopy only in patients being considered for surgical myotomy"}], "answer": "A", "explanation": "Endoscopy is performed in every patient with achalasia to exclude pseudoachalasia from malignancy at the gastroesophageal junction. Restricting it to patients with weight loss, liquid dysphagia, atypical barium findings, or surgical plans is the common error, since a tumor at the junction can reproduce both the barium and the manometric picture. Achalasia also carries an increased risk of esophageal squamous cell carcinoma.", "objective": "", "section": "Chronic dysphagia", "pcase": "A1", "pgroup": "A", "pstack": "C"}, {"id": "35", "group": 35, "stem": "A 43-year-old woman is being treated for gastroesophageal reflux disease. Her heartburn and regurgitation have been present for 6 months and are worse when she lies down. She is overweight, has a chronic cough, and has no dysphagia, no weight loss, and no hematemesis. She asks when endoscopy should be performed.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Perform endoscopy before empiric therapy in every patient with heartburn"}, {"letter": "B", "text": "Perform endoscopy before empiric therapy only in patients whose symptoms are worse lying down or after meals"}, {"letter": "C", "text": "Perform endoscopy before empiric therapy only in patients who are overweight or have a chronic cough"}, {"letter": "D", "text": "Perform endoscopy before empiric therapy only in patients whose symptoms have lasted longer than 6 months"}, {"letter": "E", "text": "Perform endoscopy before empiric therapy only in patients with dysphagia, weight loss, or bleeding"}], "answer": "E", "explanation": "Alarm features \u2014 dysphagia, odynophagia, weight loss, gastrointestinal bleeding, anemia, vomiting, or new onset after age 60 \u2014 send the patient to endoscopy before any empiric trial, because they raise the possibility of a structural lesion. Symptom duration, body weight, positional symptoms, and cough are typical reflux features and do not change the approach.", "objective": "", "section": "Chronic heartburn", "pcase": "E1", "pgroup": "E", "pstack": "C"}, {"id": "36", "group": 36, "stem": "A 74-year-old woman is diagnosed with pill-induced esophagitis after endoscopy shows a single discrete ulcer in the mid esophagus with normal surrounding mucosa and remnants of the weekly bisphosphonate she began three days earlier. She continues to have pain on swallowing.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sucralfate slurry given together with a bedtime H2 antagonist"}, {"letter": "B", "text": "An elimination diet with a proton pump inhibitor"}, {"letter": "C", "text": "Stopping the offending drug, with a standard-dose proton pump inhibitor"}, {"letter": "D", "text": "Oral fluconazole 200 mg daily"}, {"letter": "E", "text": "Oral acyclovir 400 mg five times daily"}], "answer": "C", "explanation": "The injury is chemical, so withdrawing or substituting the offending drug is the definitive step, with a standard-dose proton pump inhibitor to allow the ulcer to heal. Sucralfate requires an acidic environment to form its protective barrier, so giving it alongside an H2 antagonist or an antacid inactivates it, and it binds co-administered drugs and must be separated from them.", "objective": "", "section": "Acute odynophagia", "pcase": "C4", "pgroup": "C", "pstack": "B"}, {"id": "37", "group": 37, "stem": "A 57-year-old man with Barrett's esophagus and no dysplasia on his baseline biopsies is stable on a daily proton pump inhibitor and asks how often he will need repeat endoscopy.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Repeat endoscopy only if his heartburn returns despite the proton pump inhibitor"}, {"letter": "B", "text": "Stop surveillance endoscopy while he remains on a daily proton pump inhibitor"}, {"letter": "C", "text": "Repeat endoscopy every 3 years, with no confirmatory study during the first year"}, {"letter": "D", "text": "Repeat endoscopy every year for as long as he remains free of symptoms"}, {"letter": "E", "text": "Repeat endoscopy within 1 year of the baseline study, then every 3 years"}], "answer": "E", "explanation": "With no dysplasia, the baseline study is repeated within a year to confirm the finding, after which surveillance continues at 3-year intervals. Acid suppression controls symptoms but does not remove the risk of progression, so neither symptom control nor continued therapy is a reason to lengthen or abandon the interval.", "objective": "", "section": "Chronic heartburn", "pcase": "E2", "pgroup": "E", "pstack": "C"}, {"id": "38", "group": 38, "stem": "A 74-year-old woman treated for pill-induced esophagitis returns 10 days later. Her pain on swallowing has resolved, and she must continue to take oral medication.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Take each pill upright with a small sip of water and remain upright for 10 minutes"}, {"letter": "B", "text": "Take each pill upright with 4 ounces of fluid and lie down immediately afterward"}, {"letter": "C", "text": "Take each pill at bedtime with 8 ounces of fluid and lie down afterward"}, {"letter": "D", "text": "Take each pill upright with 4 ounces of fluid and remain upright for 10 minutes"}, {"letter": "E", "text": "Take each pill upright with a small sip of water and remain upright for 30 minutes"}], "answer": "D", "explanation": "Patient education is the intervention that prevents recurrence: pills are swallowed upright with 4 ounces of fluid, and the patient stays upright for 10 minutes afterward, with 8 ounces and 30 minutes required for high-risk drugs. Too little fluid or lying down after the dose lets the tablet lodge and dissolve against the mucosa, which is the mechanism that produced the ulcer.", "objective": "", "section": "Acute odynophagia", "pcase": "C4", "pgroup": "C", "pstack": "C"}]};

// Reshuffle-on-load for a Clinical Vignette practice exam.
//
// Inject this immediately after the `const EXAM_DATA = ...;` line of the
// interactive-exam template, before the main IIFE. It reorders the stacks and
// the options on every page load, then renumbers, so the exam cannot be
// answered from memory of position.
//
// Requires three extra fields on every question, written by the exam build:
//   pcase   the case id from the case file, e.g. "A3"
//   pgroup  the differential group letter, e.g. "A"
//   pstack  "A" recognition | "B" management safety | "C" counseling
//
// Constraints preserved on every shuffle:
//   1. no two consecutive stacks share a differential group
//   2. a patient's Stack A precedes their Stack B, which precedes their Stack C
//   3. follow-up nodes never leave their parent
(function reshuffleExam() {
  var qs = EXAM_DATA.questions;
  if (!qs || !qs.length || !qs[0].pcase) return;   // metadata absent: leave order alone

  // ---- collect stacks, parent first ----------------------------------------
  var map = {}, order = [];
  qs.forEach(function (q) {
    if (!map[q.group]) { map[q.group] = []; order.push(q.group); }
    map[q.group].push(q);
  });
  var stacks = order.map(function (g) {
    return { qs: map[g], pcase: map[g][0].pcase, pgroup: map[g][0].pgroup, pstack: map[g][0].pstack };
  });
  if (stacks.length < 3) return;

  var RANK = { A: 0, B: 1, C: 2 };

  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }

  // Reorder one case's stacks into A→B→C at whatever positions that case holds,
  // leaving every other position as the shuffle left it.
  function repairCaseOrder(seq) {
    var pend = {}, idx = {};
    seq.forEach(function (s) { (pend[s.pcase] = pend[s.pcase] || []).push(s); });
    Object.keys(pend).forEach(function (c) {
      pend[c].sort(function (x, y) { return RANK[x.pstack] - RANK[y.pstack]; });
      idx[c] = 0;
    });
    return seq.map(function (s) { return pend[s.pcase][idx[s.pcase]++]; });
  }

  function groupsAdjacent(seq) {
    for (var i = 0; i < seq.length - 1; i++) {
      if (seq[i].pgroup === seq[i + 1].pgroup) return true;
    }
    return false;
  }

  var seq = null;
  for (var attempt = 0; attempt < 4000; attempt++) {
    var cand = repairCaseOrder(shuffled(stacks));
    if (!groupsAdjacent(cand)) { seq = cand; break; }
  }
  if (!seq) return;   // could not satisfy the constraints: keep the built order

  // ---- shuffle the options inside each question ----------------------------
  var LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  seq.forEach(function (s) {
    s.qs.forEach(function (q) {
      if (!q.options || q.options.length < 2) return;
      var keyText = null;
      q.options.forEach(function (o) { if (o.letter === q.answer) keyText = o.text; });
      var texts = shuffled(q.options.map(function (o) { return o.text; }));
      q.options = texts.map(function (t, i) { return { letter: LET[i], text: t }; });
      for (var i = 0; i < q.options.length; i++) {
        if (q.options[i].text === keyText) { q.answer = q.options[i].letter; break; }
      }
    });
  });

  // ---- renumber and write the new order back ------------------------------
  var out = [];
  seq.forEach(function (s, i) {
    var n = i + 1;
    s.qs.forEach(function (q, j) {
      q.group = n;
      q.id = j === 0 ? String(n) : String(n) + LET[j - 1];
      out.push(q);
    });
  });
  EXAM_DATA.questions = out;
})();


(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
