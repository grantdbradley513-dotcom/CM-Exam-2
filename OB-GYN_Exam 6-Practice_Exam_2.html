n Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "37A", "group": 37, "stem": "At 24 weeks she has a breakthrough seizure despite good adherence; BP and urine protein are normal. What is the most likely reason?", "options": [{"letter": "A", "text": "Eclampsia"}, {"letter": "B", "text": "Falling serum drug levels from increased volume of distribution and clearance"}, {"letter": "C", "text": "Folic acid toxicity"}, {"letter": "D", "text": "Fetal anomaly"}, {"letter": "E", "text": "Hypoglycemia from pregnancy"}], "answer": "B", "explanation": "AED levels fall as plasma volume and clearance rise → check levels (baseline, then monthly/each trimester) and adjust. A new seizure >20 wk with HTN = eclampsia until proven otherwise.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "38", "group": 38, "stem": "A 27-year-old with bipolar I disorder stopped lithium during pregnancy. On postpartum day 6 she has not slept for 3 nights, believes her baby is possessed, hears voices, and is confused and agitated. She has no fever or focal neurologic signs. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Reassure — this is postpartum blues"}, {"letter": "B", "text": "Immediate inpatient psychiatric admission, ensuring she is never left alone with the infant"}, {"letter": "C", "text": "Outpatient cognitive behavioral therapy"}, {"letter": "D", "text": "Start sertraline and follow up in 2 weeks"}, {"letter": "E", "text": "Encourage more sleep and recheck in a week"}], "answer": "B", "explanation": "Postpartum psychosis (within 2 wk; bipolar = strongest association) IS the emergency → immediate psychiatric admission; never leave mother alone with infant (suicide ~5%, infanticide ~4%). Rule out organic causes. Antipsychotic + mood stabilizer (lithium).", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "39", "group": 39, "stem": "A 30-year-old at 20 weeks has had 3 weeks of depressed mood, anhedonia, poor sleep beyond pregnancy norms, guilt and poor concentration. EPDS score is 16. She denies suicidal ideation and has no history of mania. Psychotherapy alone has not helped. Which medication is preferred?", "options": [{"letter": "A", "text": "Sertraline"}, {"letter": "B", "text": "Paroxetine"}, {"letter": "C", "text": "Valproate"}, {"letter": "D", "text": "Lithium"}, {"letter": "E", "text": "No medication — antidepressants are contraindicated in pregnancy"}], "answer": "A", "explanation": "Moderate–severe perinatal depression → SSRI, sertraline preferred (breastfeeding-compatible); avoid paroxetine (cardiac defects). Untreated depression carries its own risks. Screen for bipolar before SSRIs.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "40", "group": 40, "stem": "On postpartum day 3, a 25-year-old is tearful, anxious and irritable but is sleeping when the baby sleeps, is caring for the infant, and has no thoughts of harm. What is the most appropriate management?", "options": [{"letter": "A", "text": "Start sertraline"}, {"letter": "B", "text": "Start zuranolone"}, {"letter": "C", "text": "Reassurance and support; reassess if symptoms persist beyond 2 weeks"}, {"letter": "D", "text": "Lithium prophylaxis"}, {"letter": "E", "text": "Psychiatric admission"}], "answer": "C", "explanation": "Baby blues: onset 2–3 days, resolves ≤2 wk, no treatment — support only. ≥2 wk with impairment = postpartum depression; psychosis = emergency.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "41", "group": 41, "stem": "A 33-year-old at 36 weeks wakes with left facial droop. She cannot wrinkle the left forehead or fully close her left eye and reports hyperacusis. The rest of the neurologic exam is normal. In addition to prednisone within 72 hours and eye protection, which evaluation is most important?", "options": [{"letter": "A", "text": "EEG"}, {"letter": "B", "text": "Lyme serology only"}, {"letter": "C", "text": "Lumbar puncture"}, {"letter": "D", "text": "Blood pressure and urine protein to evaluate for preeclampsia"}, {"letter": "E", "text": "MRI brain with gadolinium"}], "answer": "D", "explanation": "Bell's palsy is ~3× more common in the 3rd trimester and is associated with preeclampsia/gestational HTN → check BP and urine protein. Imaging only if atypical/central.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "41A", "group": 41, "stem": "Which finding would instead indicate a central lesion requiring a stroke work-up?", "options": [{"letter": "A", "text": "Loss of taste on the anterior tongue"}, {"letter": "B", "text": "Hyperacusis"}, {"letter": "C", "text": "Retroauricular pain"}, {"letter": "D", "text": "Inability to close the eye"}, {"letter": "E", "text": "Forehead sparing"}], "answer": "E", "explanation": "Bell's palsy is a lower-motor-neuron CN VII palsy involving the forehead; forehead SPARING = central → stroke work-up.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "42", "group": 42, "stem": "A 28-year-old at 26 weeks has 18 hours of periumbilical pain that migrated to the right flank, anorexia, nausea and temp 38.0 °C. She has right-sided tenderness with minimal guarding. What is the first imaging study?", "options": [{"letter": "A", "text": "MRI with gadolinium"}, {"letter": "B", "text": "Graded-compression ultrasound"}, {"letter": "C", "text": "Abdominal x-ray"}, {"letter": "D", "text": "CT abdomen/pelvis with IV contrast"}, {"letter": "E", "text": "HIDA scan"}], "answer": "B", "explanation": "Ultrasound first → MRI without gadolinium if non-diagnostic → CT acceptable when needed. The appendix is displaced upward toward the RUQ/flank as the uterus enlarges; guarding is less pronounced.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "42A", "group": 42, "stem": "Imaging confirms acute appendicitis. What is the appropriate management?", "options": [{"letter": "A", "text": "Induce labor first, then operate"}, {"letter": "B", "text": "IV antibiotics alone through term"}, {"letter": "C", "text": "Wait until the second trimester ends"}, {"letter": "D", "text": "Prompt laparoscopic appendectomy with pregnancy-safe antibiotics and fetal monitoring"}, {"letter": "E", "text": "Delay surgery until after delivery"}], "answer": "D", "explanation": "Do NOT delay indicated surgery — perforation sharply increases fetal loss. Laparoscopy is safe in any trimester; left uterine displacement and fetal monitoring. Antibiotics: cefoxitin/ceftriaxone + metronidazole; no fluoroquinolones.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "43", "group": 43, "stem": "A 23-year-old at 10 weeks has a routine first-visit urine culture growing >10⁵ CFU/mL E. coli sensitive to nitrofurantoin. She has no urinary symptoms. What is the appropriate management?", "options": [{"letter": "A", "text": "Nitrofurantoin (or cephalexin) with a test-of-cure culture"}, {"letter": "B", "text": "Ciprofloxacin for 3 days"}, {"letter": "C", "text": "No treatment because she is asymptomatic"}, {"letter": "D", "text": "Repeat the culture at 36 weeks"}, {"letter": "E", "text": "TMP-SMX for 3 days"}], "answer": "A", "explanation": "Asymptomatic bacteriuria is treated in pregnancy (untreated → 20–40% pyelonephritis, preterm birth, LBW): nitrofurantoin, cephalexin, amoxicillin (if susceptible), fosfomycin; test of cure. Avoid fluoroquinolones; avoid TMP-SMX in the 1st trimester and near term.", "objective": "Diseases in Pregnancy (Marcus) — Hyperemesis, intrahepatic cholestasis, AFLP, UTI, cervical insufficiency", "section": "Diseases in Pregnancy"}, {"id": "43A", "group": 43, "stem": "At 28 weeks she presents with fever 39.0 °C, chills, right flank pain, vomiting and CVA tenderness. What is the management?", "options": [{"letter": "A", "text": "Oral ciprofloxacin"}, {"letter": "B", "text": "Renal ultrasound before any antibiotics"}, {"letter": "C", "text": "Admit for IV ceftriaxone and fluids, then oral antibiotics to complete 10–14 days, followed by suppression for the rest of pregnancy"}, {"letter": "D", "text": "Doxycycline"}, {"letter": "E", "text": "Oral nitrofurantoin as an outpatient"}], "answer": "C", "explanation": "Pyelonephritis in pregnancy → admit, IV ceftriaxone (or ampicillin + gentamicin), fluids; watch for sepsis, ARDS, preterm labor; PO after 48 h afebrile; suppressive nitrofurantoin until delivery.", "objective": "Diseases in Pregnancy (Marcus) — Hyperemesis, intrahepatic cholestasis, AFLP, UTI, cervical insufficiency", "section": "Diseases in Pregnancy"}, {"id": "44", "group": 44, "stem": "A 30-year-old G3P0020 had two painless losses at 19 and 20 weeks, each with cervical dilation and bulging membranes without contractions. She had a LEEP 5 years ago. She is now 8 weeks pregnant. What is the best plan?", "options": [{"letter": "A", "text": "Bed rest starting at 20 weeks"}, {"letter": "B", "text": "History-indicated cervical cerclage at 12–14 weeks"}, {"letter": "C", "text": "No intervention unless she develops contractions"}, {"letter": "D", "text": "Cerclage at 28 weeks"}, {"letter": "E", "text": "Tocolysis from 16 weeks"}], "answer": "B", "explanation": "Cervical insufficiency (painless 2nd-trimester dilation; risk: prior losses, LEEP/conization) → history-indicated cerclage (McDonald or Shirodkar) at 12–14 wk ± progesterone; remove at 36–37 wk.", "objective": "Diseases in Pregnancy (Marcus) — Hyperemesis, intrahepatic cholestasis, AFLP, UTI, cervical insufficiency", "section": "Diseases in Pregnancy"}, {"id": "44A", "group": 44, "stem": "Which finding would contraindicate placing a cerclage?", "options": [{"letter": "A", "text": "Short cervix on ultrasound"}, {"letter": "B", "text": "Chorioamnionitis"}, {"letter": "C", "text": "Prior LEEP"}, {"letter": "D", "text": "Prior second-trimester loss"}, {"letter": "E", "text": "Twin gestation"}], "answer": "B", "explanation": "Cerclage is contraindicated with active labor, chorioamnionitis, PPROM, fetal demise or major anomaly.", "objective": "Diseases in Pregnancy (Marcus) — Hyperemesis, intrahepatic cholestasis, AFLP, UTI, cervical insufficiency", "section": "Diseases in Pregnancy"}, {"id": "45", "group": 45, "stem": "A 29-year-old with type 1 diabetes (HbA1c 8.9%) plans to conceive. What preconception HbA1c goal is recommended, and why?", "options": [{"letter": "A", "text": "<6.5% — to reduce congenital anomalies from hyperglycemia during organogenesis"}, {"letter": "B", "text": "<5% — to prevent preeclampsia"}, {"letter": "C", "text": "<8% — to reduce macrosomia"}, {"letter": "D", "text": "No goal — A1c is unreliable before pregnancy"}, {"letter": "E", "text": "<7.5% — to prevent neonatal hypoglycemia only"}], "answer": "A", "explanation": "A1c goal <6.5% before conception (ideally <6% in pregnancy). Pre-existing DM signature = anomalies (VSD/transposition, NTDs, caudal regression, renal agenesis, duodenal atresia) — insult during organogenesis.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Pre-existing and gestational diabetes", "section": "Diabetes & Infections in Pregnancy"}, {"id": "45A", "group": 45, "stem": "How are her insulin requirements expected to change during pregnancy?", "options": [{"letter": "A", "text": "They remain unchanged"}, {"letter": "B", "text": "She can switch to metformin alone"}, {"letter": "C", "text": "They rise in the 1st trimester and fall in the 3rd"}, {"letter": "D", "text": "Risk of hypoglycemia in the 1st trimester, then rising needs in the 2nd/3rd trimesters, falling again at delivery"}, {"letter": "E", "text": "They fall steadily throughout pregnancy"}], "answer": "D", "explanation": "1st trimester ↑ insulin sensitivity (hypoglycemia); 2nd/3rd trimester placental hormones → insulin resistance → needs rise; fall at delivery and with breastfeeding. Insulin is the therapy (no benefit adding metformin).", "objective": "Diabetes & Infections in Pregnancy (Lu) — Pre-existing and gestational diabetes", "section": "Diabetes & Infections in Pregnancy"}, {"id": "46", "group": 46, "stem": "A 25-year-old at 20 weeks has an anatomy ultrasound showing ventriculomegaly and intracranial calcifications. She owns cats, cleans the litter box, and recently had a mild mono-like illness after eating rare steak. Amniotic fluid PCR is positive for Toxoplasma gondii. What is the treatment?", "options": [{"letter": "A", "text": "Pyrimethamine + sulfadiazine + folinic acid"}, {"letter": "B", "text": "No treatment is available"}, {"letter": "C", "text": "Ganciclovir"}, {"letter": "D", "text": "IV acyclovir"}, {"letter": "E", "text": "Spiramycin alone"}], "answer": "A", "explanation": "Fetal toxoplasma infection (hydrocephalus, intracranial calcifications, chorioretinitis) → pyrimethamine + sulfadiazine + folinic acid. Maternal infection without fetal infection → spiramycin to ↓ transmission.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "47", "group": 47, "stem": "A 27-year-old at 14 weeks was exposed 2 days ago to her nephew with chickenpox. She does not recall having chickenpox and was never vaccinated. Varicella IgG is negative. What is the most appropriate management?", "options": [{"letter": "A", "text": "Oral acyclovir prophylaxis only"}, {"letter": "B", "text": "Termination of pregnancy"}, {"letter": "C", "text": "Varicella vaccine now"}, {"letter": "D", "text": "Reassurance — varicella is mild in adults"}, {"letter": "E", "text": "VariZIG within 96 hours of exposure"}], "answer": "E", "explanation": "Exposed, non-immune → VariZIG within 96 h. Live varicella vaccine is contraindicated in pregnancy (give postpartum). Maternal varicella pneumonia → admit, IV acyclovir.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "48", "group": 48, "stem": "A 29-year-old G2 with known recurrent genital herpes is at 34 weeks. Which plan is recommended?", "options": [{"letter": "A", "text": "Scheduled cesarean for all women with an HSV history"}, {"letter": "B", "text": "Avoid antivirals in pregnancy"}, {"letter": "C", "text": "Type-specific serology at 36 weeks"}, {"letter": "D", "text": "Acyclovir suppression from 36 weeks; cesarean only if active lesions or prodrome at labor"}, {"letter": "E", "text": "Induction at 37 weeks"}], "answer": "D", "explanation": "HSV: suppressive acyclovir from 36 wk until delivery; inspect at labor — active lesions or prodrome = cesarean, otherwise vaginal. HPV warts are NOT a C-section indication.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "49", "group": 49, "stem": "A 24-year-old at 16 weeks has a reactive RPR confirmed by a positive treponemal test. She reports a history of anaphylaxis to penicillin. What is the appropriate treatment?", "options": [{"letter": "A", "text": "Defer treatment until after delivery"}, {"letter": "B", "text": "Penicillin desensitization, then benzathine penicillin G"}, {"letter": "C", "text": "Ceftriaxone for 10 days"}, {"letter": "D", "text": "Doxycycline 100 mg BID × 14 days"}, {"letter": "E", "text": "Azithromycin 2 g × 1"}], "answer": "B", "explanation": "Penicillin G is the ONLY effective treatment in pregnancy (treats the fetus too) → desensitize then treat. Never substitute doxycycline (teratogen).", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "50", "group": 50, "stem": "A 22-year-old at 12 weeks has a positive gonorrhea NAAT. She is treated with ceftriaxone 500 mg IM. Which intervention is given to ALL newborns to prevent the major neonatal complication of this infection?", "options": [{"letter": "A", "text": "Oral erythromycin for 14 days"}, {"letter": "B", "text": "Erythromycin 0.5% ophthalmic ointment to both eyes at birth"}, {"letter": "C", "text": "Silver nitrate drops only if mother is infected"}, {"letter": "D", "text": "IV ceftriaxone for all newborns"}, {"letter": "E", "text": "Hepatitis B immune globulin"}], "answer": "B", "explanation": "Ophthalmia neonatorum is prevented with erythromycin 0.5% ophthalmic ointment for all newborns. Also treat concurrent chlamydia and partners; no tetracyclines/fluoroquinolones in pregnancy.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "51", "group": 51, "stem": "A 31-year-old at 34 weeks is brought in after a motor vehicle collision. She has sudden severe abdominal pain and dark vaginal bleeding. The uterus is rigid, \"woody\" and tender with frequent low-amplitude contractions. HR 118, BP 100/62. The fetal tracing shows recurrent late decelerations. Ultrasound shows no retroplacental hematoma. What is the most likely diagnosis?", "options": [{"letter": "A", "text": "Uterine rupture"}, {"letter": "B", "text": "Placental abruption"}, {"letter": "C", "text": "Normal labor"}, {"letter": "D", "text": "Vasa previa"}, {"letter": "E", "text": "Placenta previa"}], "answer": "B", "explanation": "Painful dark bleeding + rigid tender hypertonic uterus + fetal distress = abruption — a clinical diagnosis; a normal US does NOT exclude it (US mainly rules out previa).", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "51A", "group": 51, "stem": "Fibrinogen is 140 mg/dL. What is the management?", "options": [{"letter": "A", "text": "Two large-bore IVs, blood products, and emergency cesarean delivery"}, {"letter": "B", "text": "Tocolysis and observation"}, {"letter": "C", "text": "Amniotomy and oxytocin with expectant management for 24 hours"}, {"letter": "D", "text": "Betamethasone and delay delivery 48 hours"}, {"letter": "E", "text": "Discharge with pelvic rest"}], "answer": "A", "explanation": "Fibrinogen <200 = severe/DIC. Unstable mother or non-reassuring fetus → 2 large-bore IVs, blood products (PRBC/FFP/cryo), emergency cesarean; RhoGAM if Rh-negative. Abruption is the most common obstetric cause of DIC.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "52", "group": 52, "stem": "After an uncomplicated vaginal delivery in a woman with three prior cesareans, the placenta does not separate. Gentle traction produces torrential bleeding. What is the appropriate management?", "options": [{"letter": "A", "text": "Forcible manual removal of the placenta"}, {"letter": "B", "text": "Do not forcibly remove the placenta; activate massive transfusion and proceed to emergency hysterectomy"}, {"letter": "C", "text": "Uterine massage alone"}, {"letter": "D", "text": "Strong cord traction with fundal pressure"}, {"letter": "E", "text": "Methylergonovine and observation"}], "answer": "B", "explanation": "Unrecognized accreta at delivery → massive PPH → massive transfusion protocol, emergency hysterectomy; do NOT forcibly remove the placenta. Planned management: scheduled cesarean hysterectomy at 34–36 wk leaving the placenta in situ.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "52A", "group": 52, "stem": "Pathology shows chorionic villi penetrating through the uterine serosa into the bladder wall. What is this classification?", "options": [{"letter": "A", "text": "Placenta increta"}, {"letter": "B", "text": "Placenta percreta"}, {"letter": "C", "text": "Succenturiate lobe"}, {"letter": "D", "text": "Vasa previa"}, {"letter": "E", "text": "Placenta accreta"}], "answer": "B", "explanation": "Accreta = villi attach to myometrium (~75%); increta = invade INTO myometrium (~15%); percreta = THROUGH the serosa, may invade bladder/bowel (~5–7%).", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "53", "group": 53, "stem": "A 26-year-old at 35 weeks with a known footling breech has spontaneous rupture of membranes. The fetal heart rate abruptly drops to 70 bpm and stays there. A pulsating loop of cord is felt in the vagina. What is the most appropriate immediate action?", "options": [{"letter": "A", "text": "Observe the tracing for 20 minutes"}, {"letter": "B", "text": "Start oxytocin to speed delivery"}, {"letter": "C", "text": "Push the cord back into the uterus"}, {"letter": "D", "text": "Apply fundal pressure"}, {"letter": "E", "text": "Elevate the presenting part off the cord with a gloved hand, place her in knee-chest or steep Trendelenburg, and proceed to emergency cesarean"}], "answer": "E", "explanation": "Cord prolapse: gloved hand elevates the presenting part and stays there; knee-chest/Trendelenburg, O₂, stop oxytocin, terbutaline; emergency cesarean unless vaginal delivery is imminent. Do not replace the cord. Footling breech has the highest risk.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "54", "group": 54, "stem": "A 30-year-old at 41 3/7 weeks in active labor has spontaneous rupture of membranes with thick, particulate green fluid. The tracing shows recurrent variable decelerations. Which intrapartum intervention is appropriate?", "options": [{"letter": "A", "text": "Routine intrapartum suctioning of the oropharynx at the perineum"}, {"letter": "B", "text": "Stop all monitoring"}, {"letter": "C", "text": "Amnioinfusion via IUPC (saline) to cushion the cord, with a newborn team present at delivery"}, {"letter": "D", "text": "Tocolysis"}, {"letter": "E", "text": "Immediate cesarean for meconium alone"}], "answer": "C", "explanation": "Meconium with variable decels (cord compression) → amnioinfusion via IUPC (300 mL saline over 20 min) + NICU team at delivery. Meconium alone is not a cesarean indication; routine perineal suctioning is no longer recommended.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "54A", "group": 54, "stem": "The newborn is limp with poor respiratory effort at birth. What is the next step?", "options": [{"letter": "A", "text": "Routine tracheal intubation and suctioning for meconium"}, {"letter": "B", "text": "Administer naloxone"}, {"letter": "C", "text": "Positive-pressure ventilation per NRP"}, {"letter": "D", "text": "Place skin-to-skin and observe"}, {"letter": "E", "text": "Give surfactant before any ventilation"}], "answer": "C", "explanation": "Not vigorous → positive-pressure ventilation per NRP; routine tracheal suctioning is no longer recommended. Vigorous → routine care.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "55", "group": 55, "stem": "A 37-year-old with chronic hypertension and lupus is at 32 weeks. Fundal height is 27 cm. Ultrasound shows an estimated fetal weight below the 10th percentile with the abdominal circumference lagging the head, and an AFI of 4 cm. Umbilical artery Doppler shows reversed end-diastolic flow. What is the management?", "options": [{"letter": "A", "text": "Bed rest at home"}, {"letter": "B", "text": "Repeat ultrasound in 2–3 weeks"}, {"letter": "C", "text": "Deliver now (with betamethasone), by cesarean if delivery is not imminent"}, {"letter": "D", "text": "Weekly NST until 39 weeks"}, {"letter": "E", "text": "Low-dose aspirin and continue to 37 weeks"}], "answer": "C", "explanation": "Asymmetric FGR + oligohydramnios + reversed end-diastolic flow (premorbid) = placental insufficiency → deliver now (betamethasone if preterm). Absent EDF ~34 wk; normal Doppler 37–39 wk.", "objective": "L&D Complications (Cook) — Placental disorders, intrapartum emergencies, PPH, postpartum pituitary and psychiatric disorders", "section": "L&D Complications"}, {"id": "56", "group": 56, "stem": "A 28-year-old at 39 weeks reports a gush of fluid followed by steady leaking 2 hours ago. Which combination of findings on sterile speculum exam confirms rupture of membranes?", "options": [{"letter": "A", "text": "Thick white discharge with pH 4.0"}, {"letter": "B", "text": "Positive whiff test"}, {"letter": "C", "text": "Nitrazine paper stays yellow and no ferning"}, {"letter": "D", "text": "Bloody show with a closed cervix"}, {"letter": "E", "text": "Pooling of fluid in the posterior fornix, ferning on microscopy, and nitrazine paper turning blue"}], "answer": "E", "explanation": "ROM: pooling in the posterior fornix, ferning (arborization), nitrazine BLUE (amniotic pH ~7 vs vaginal ~4; false positives with blood, semen, urine, BV). AmniSure (PAMG-1) is definitive. Avoid digital exams.", "objective": "Labor & Delivery (Cook) — Terms, fetal assessment (NST/CST/BPP), Bishop score, rupture of membranes, normal labor", "section": "Labor & Delivery"}, {"id": "56A", "group": 56, "stem": "She is not in labor 18 hours later and develops fever 38.6 °C, uterine tenderness, foul-smelling fluid and fetal tachycardia of 170 bpm. What is the diagnosis and management?", "options": [{"letter": "A", "text": "Normal latent labor — continue expectant management"}, {"letter": "B", "text": "Pyelonephritis — renal ultrasound"}, {"letter": "C", "text": "Placental abruption — emergency cesarean"}, {"letter": "D", "text": "Endometritis — oral antibiotics after discharge"}, {"letter": "E", "text": "Chorioamnionitis — antibiotics and delivery"}], "answer": "E", "explanation": "Chorioamnionitis = fever, uterine tenderness, fetal tachycardia >160, foul fluid → antibiotics + deliver. Expedite delivery after term PROM; NICU septic work-up for any baby born ≥18 h after ROM.", "objective": "Labor & Delivery (Cook) — Terms, fetal assessment (NST/CST/BPP), Bishop score, rupture of membranes, normal labor", "section": "Labor & Delivery"}, {"id": "57", "group": 57, "stem": "At her 36-week visit, a 30-year-old G2P1 has a hard, round, ballotable mass in the uterine fundus on Leopold maneuvers; ultrasound confirms frank breech. Membranes are intact, there is no previa and no nuchal cord. What is the recommended next step?", "options": [{"letter": "A", "text": "Repeat ultrasound at 41 weeks"}, {"letter": "B", "text": "Plan a vaginal breech delivery"}, {"letter": "C", "text": "Scheduled cesarean at 36 weeks"}, {"letter": "D", "text": "Offer external cephalic version at 37–38 weeks"}, {"letter": "E", "text": "Induce labor now"}], "answer": "D", "explanation": "Know presentation by 36 wk → ECV at 37–38 wk (~50% success); contraindicated with nuchal cord, ruptured membranes, previa. If unsuccessful → cesarean at 39 wk.", "objective": "Labor & Delivery (Cook) — Terms, fetal assessment (NST/CST/BPP), Bishop score, rupture of membranes, normal labor", "section": "Labor & Delivery"}, {"id": "58", "group": 58, "stem": "A 29-year-old at 11 weeks has increasing vaginal bleeding and cramping. Speculum exam shows an open cervical os with bulging membranes; no tissue has passed. What is the diagnosis?", "options": [{"letter": "A", "text": "Threatened abortion"}, {"letter": "B", "text": "Inevitable abortion"}, {"letter": "C", "text": "Missed abortion"}, {"letter": "D", "text": "Incomplete abortion"}, {"letter": "E", "text": "Complete abortion"}], "answer": "B", "explanation": "Bleeding? · Os open? · Tissue passed? — Threatened Y/N/N; Inevitable Y/Y/not yet; Incomplete Y/Y/partial; Complete Y/closes/all; Missed N/N/N.", "objective": "Complications of Pregnancy (De La Cruz) — Types of spontaneous abortion, diagnosis and management", "section": "Complications of Pregnancy"}, {"id": "59", "group": 59, "stem": "A 26-year-old at 8 weeks passed a large amount of tissue at home yesterday; her bleeding and cramping are now improving. Her os is closed, the uterus is small and firm, TVUS shows an empty uterus with a previously documented intrauterine pregnancy, and hCG is falling. What is the management?", "options": [{"letter": "A", "text": "Suction aspiration"}, {"letter": "B", "text": "Mifepristone and misoprostol"}, {"letter": "C", "text": "Observation, confirming resolution (empty uterus / hCG to zero)"}, {"letter": "D", "text": "Hysteroscopy"}, {"letter": "E", "text": "Methotrexate"}], "answer": "C", "explanation": "Complete abortion → observation; confirm resolution. Ectopic must be considered until pregnancy location was confirmed.", "objective": "Complications of Pregnancy (De La Cruz) — Types of spontaneous abortion, diagnosis and management", "section": "Complications of Pregnancy"}, {"id": "60", "group": 60, "stem": "A 34-year-old has a routine 9-week ultrasound with no symptoms. The gestational sac has a mean sac diameter of 27 mm with no embryo. The os is closed. What is the diagnosis?", "options": [{"letter": "A", "text": "Ectopic pregnancy"}, {"letter": "B", "text": "Embryonic demise"}, {"letter": "C", "text": "Anembryonic pregnancy (blighted ovum)"}, {"letter": "D", "text": "Normal early pregnancy"}, {"letter": "E", "text": "Molar pregnancy"}], "answer": "C", "explanation": "Mean sac diameter ≥25 mm with no embryo = anembryonic pregnancy. A nonviable pregnancy without symptoms is a \"missed abortion\" (asymptomatic pregnancy loss).", "objective": "Complications of Pregnancy (De La Cruz) — Types of spontaneous abortion, diagnosis and management", "section": "Complications of Pregnancy"}, {"id": "61", "group": 61, "stem": "A 15-year-old has never menstruated and has no breast development. She is short with a low posterior hairline, webbed neck, and widely spaced nipples. hCG is negative. Which laboratory pattern is expected?", "options": [{"letter": "A", "text": "Elevated FSH"}, {"letter": "B", "text": "Elevated prolactin"}, {"letter": "C", "text": "Elevated 17-hydroxyprogesterone"}, {"letter": "D", "text": "Low FSH and low LH"}, {"letter": "E", "text": "Elevated testosterone in the male range"}], "answer": "A", "explanation": "↑ FSH → gonadal dysgenesis (Turner 45,X) — ovaries cannot make estrogen (no breasts). ↓ FSH/LH → hypothalamic/pituitary (constitutional delay, Kallmann). Treat with estrogen replacement for puberty and bone.", "objective": "Menstrual Cycle Dysfunction (Adams) — Differentiate primary and secondary amenorrhea", "section": "Menstrual Cycle Dysfunction"}, {"id": "62", "group": 62, "stem": "A 63-year-old woman, 12 years postmenopausal, reports vaginal dryness and painful intercourse. She has no hot flashes. Over-the-counter lubricants and moisturizers have not helped. Exam shows pale, dry vaginal mucosa with loss of rugae; vaginal pH is 6.5. What is the most appropriate treatment?", "options": [{"letter": "A", "text": "Systemic estrogen plus progestin"}, {"letter": "B", "text": "Fezolinetant"}, {"letter": "C", "text": "Gabapentin"}, {"letter": "D", "text": "Low-dose vaginal estrogen (cream, tablet or ring)"}, {"letter": "E", "text": "Paroxetine"}], "answer": "D", "explanation": "GU symptoms only → OTC lubricants/moisturizers first, then low-dose vaginal estrogen (Premarin/Estrace cream, Vagifem, Estring) or oral ospemifene. Starting systemic MHT >10 yr past menopause ↑ stroke/VTE. GU atrophy rises with time while VMS fade.", "objective": "Menopause (Jackson) — Define menopause/perimenopause; treatment of vasomotor and atrophic symptoms", "section": "Menopause"}, {"id": "63", "group": 63, "stem": "A 34-year-old G4P4 is 6 weeks postpartum with progressive dyspnea at rest, orthopnea and leg swelling. Exam shows JVD, bibasilar rales and an S3. Echocardiogram shows an ejection fraction of 30% with no prior heart disease. What is the diagnosis?", "options": [{"letter": "A", "text": "Pulmonary embolism"}, {"letter": "B", "text": "Mitral stenosis"}, {"letter": "C", "text": "Postpartum anemia"}, {"letter": "D", "text": "Peripartum cardiomyopathy"}, {"letter": "E", "text": "Normal physiologic changes of pregnancy"}], "answer": "D", "explanation": "Peripartum cardiomyopathy: ↓ EF <45% from the last month of pregnancy to 5 months postpartum without another cause (older, multiparous, Black, HTN, twins). S3 with rales and JVD are pathologic. ACE-I may be used only postpartum.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "64", "group": 64, "stem": "A 26-year-old G3P2 at 26 weeks reports fatigue and craving ice. Hemoglobin is 9.4 g/dL with microcytic, hypochromic indices and a low ferritin. What is the most appropriate management?", "options": [{"letter": "A", "text": "Reassure — this is physiologic dilutional anemia"}, {"letter": "B", "text": "Vitamin B12 injections"}, {"letter": "C", "text": "Hemoglobin electrophoresis before any treatment"}, {"letter": "D", "text": "Transfuse 2 units of PRBCs"}, {"letter": "E", "text": "Oral iron 60–160 mg elemental daily plus folate, taken with vitamin C and apart from calcium"}], "answer": "E", "explanation": "Iron deficiency (~95% of true anemia in pregnancy; Hb <11 1st/3rd, <10.5 2nd; low ferritin) → oral iron + folate; IV iron if intolerant/severe/late. Dilutional anemia is mild, normocytic with normal ferritin.", "objective": "Diseases in Pregnancy (Marcus) — Thyroid, cardiac, asthma, seizure, VTE, anemia, depression, neuropathies, surgical conditions", "section": "Diseases in Pregnancy"}, {"id": "65", "group": 65, "stem": "A 28-year-old at 22 weeks returned from a Zika-endemic area 2 weeks ago, where she had fever, rash, conjunctivitis and joint pain. Zika RNA NAAT is positive. What is the main fetal concern and management?", "options": [{"letter": "A", "text": "Chorioretinitis — pyrimethamine"}, {"letter": "B", "text": "Limb hypoplasia — VariZIG"}, {"letter": "C", "text": "Neonatal conjunctivitis — erythromycin ointment"}, {"letter": "D", "text": "Hydrops fetalis — intrauterine transfusion"}, {"letter": "E", "text": "Microcephaly/ventriculomegaly — supportive care with serial fetal ultrasound"}], "answer": "E", "explanation": "Zika (Aedes mosquito, also sexual and transplacental) → microcephaly, ventriculomegaly, seizures, SNHL. No treatment or vaccine — supportive care and serial fetal US; prevention is travel counseling and condoms if partner exposed.", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "66", "group": 66, "stem": "A 25-year-old at 30 weeks presents in January with 1 day of fever, myalgias and cough. She received the influenza vaccine in October. Rapid testing is pending. What is the most appropriate management?", "options": [{"letter": "A", "text": "No antiviral because she was vaccinated"}, {"letter": "B", "text": "Start oseltamivir presumptively now"}, {"letter": "C", "text": "Give the live attenuated nasal influenza vaccine"}, {"letter": "D", "text": "Wait for test results before treating"}, {"letter": "E", "text": "Start azithromycin"}], "answer": "B", "explanation": "Influenza hits pregnant women harder; treat presumptively with oseltamivir regardless of vaccination status — do not wait on the test. Vaccine: inactivated shot any trimester, NOT the nasal spray (live).", "objective": "Diabetes & Infections in Pregnancy (Lu) — Parasitic, viral and bacterial obstetric infections", "section": "Diabetes & Infections in Pregnancy"}, {"id": "67", "group": 67, "stem": "After a vaginal delivery, inspection shows a perineal laceration extending through the perineal muscles and involving more than 50% of the external anal sphincter, with the internal sphincter and rectal mucosa intact. What degree is this laceration?", "options": [{"letter": "A", "text": "Second degree"}, {"letter": "B", "text": "Third degree (3a)"}, {"letter": "C", "text": "Third degree (3b)"}, {"letter": "D", "text": "Third degree (3c)"}, {"letter": "E", "text": "Fourth degree"}], "answer": "C", "explanation": "1st = mucosa/skin; 2nd = perineal muscles; 3rd = anal sphincter (3a <50% external, 3b >50% external, 3c internal sphincter); 4th = through the rectal mucosa. 3rd/4th repaired in the OR.", "objective": "Labor & Delivery (Cook) — Terms, fetal assessment (NST/CST/BPP), Bishop score, rupture of membranes, normal labor", "section": "Labor & Delivery"}, {"id": "67A", "group": 67, "stem": "At 1 minute, the newborn has a pink body with blue extremities, heart rate 90 bpm, grimaces to stimulation, some flexion of the extremities, and slow irregular respirations with a weak cry. What is the Apgar score?", "options": [{"letter": "A", "text": "3"}, {"letter": "B", "text": "4"}, {"letter": "C", "text": "5"}, {"letter": "D", "text": "6"}, {"letter": "E", "text": "7"}], "answer": "C", "explanation": "Appearance 1 (acrocyanosis) + Pulse 1 (<100) + Grimace 1 + Activity 1 (some flexion) + Respiration 1 (slow, irregular) = 5 (4–6 moderately abnormal). If the 5-min score is <7, repeat every 5 min up to 20 min.", "objective": "Labor & Delivery (Cook) — Terms, fetal assessment (NST/CST/BPP), Bishop score, rupture of membranes, normal labor", "section": "Labor & Delivery"}, {"id": "68", "group": 68, "stem": "A 31-year-old had a prior cesarean through a classical (vertical fundal) uterine incision for a preterm breech. She is now pregnant again. Which delivery plan is recommended?", "options": [{"letter": "A", "text": "Induction with misoprostol at 39 weeks"}, {"letter": "B", "text": "Vaginal delivery with an early epidural"}, {"letter": "C", "text": "Cesarean only if labor fails to progress"}, {"letter": "D", "text": "Trial of labor after cesarean at a hospital with 24-hour anesthesia"}, {"letter": "E", "text": "Scheduled repeat cesarean at ~37 weeks without labor"}], "answer": "E", "explanation": "Classical incision → high rupture risk even without labor → no labor; scheduled repeat cesarean ~37 wk. VBAC/TOLAC only after a low-transverse incision where cesarean is available within 15 min.", "objective": "Labor & Delivery (Cook) — Terms, fetal assessment (NST/CST/BPP), Bishop score, rupture of membranes, normal labor", "section": "Labor & Delivery"}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  const flagged = {};        // question id -> true, set by the learner at any point (never affects score)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  // Lab values as a table. q.labs is [{test, result, range}]. If the stem contains
  // the marker [[LABS]] the table goes there (so the vignette can continue after
  // the labs); otherwise it follows the stem.
  function labsHtml(q) {
    if (!q.labs || !q.labs.length) return '';
    const hasRange = q.labs.some(l => l.range);
    let html = '<table class="labs"><thead><tr><th>Test</th><th>Result</th>' +
      (hasRange ? '<th>Reference Range</th>' : '') + '</tr></thead><tbody>';
    q.labs.forEach(l => {
      html += '<tr><td>' + esc(l.test) + '</td><td class="res">' + esc(l.result) + '</td>' +
        (hasRange ? '<td class="ref">' + (l.range ? '(' + esc(String(l.range).replace(/^\(|\)$/g, '')) + ')' : '') + '</td>' : '') + '</tr>';
    });
    return html + '</tbody></table>';
  }

  function stemHtml(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    const table = labsHtml(q);
    if (table && stem.indexOf('[[LABS]]') !== -1) {
      const parts = stem.split('[[LABS]]');
      return '<div class="stem">' + esc(parts[0].replace(/\s+$/, '')) + '</div>' + table +
        (parts[1] && parts[1].trim() ? '<div class="stem">' + esc(parts[1].replace(/^\s+/, '')) + '</div>' : '');
    }
    return '<div class="stem">' + esc(stem.replace('[[LABS]]', '')) + '</div>' + table;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += stemHtml(q);
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += flagHtml(q);
    html += '</div>';
    return html;
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly (or not understood) can still be carried into the next round
  // of study. Flagging never changes the score — it is a bookmark, not a second answer.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">⚑ ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '⚑ ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {                 // answered wrong, or flagged by the learner
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          stemHtml(g[0]) + '</div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  // Plain-text stem with the lab table flattened to one line per lab
  function stemText(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    if (!q.labs || !q.labs.length) return stem.replace('[[LABS]]', '').trim();
    const rows = q.labs.map(l => '  ' + l.test + ': ' + l.result + (l.range ? ' (ref ' + String(l.range).replace(/^\(|\)$/g, '') + ')' : '')).join('\n');
    const i = stem.indexOf('[[LABS]]');
    const before = i === -1 ? stem : stem.slice(0, i);
    const hasHeader = /\b(labs|laboratory (studies|results|values))\s*:?\s*$/i.test(before);   // stem already says "Labs:"
    const block = (hasHeader ? '' : 'Labs:\n') + rows;
    return (i !== -1 ? before.replace(/\s+$/, '') + '\n' + block + '\n' + stem.slice(i + 8).replace(/^\s+/, '') : stem + '\n' + block).trim();
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + stemText(group[0]));
      lines.push(stemText(q));
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered' : 'My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
