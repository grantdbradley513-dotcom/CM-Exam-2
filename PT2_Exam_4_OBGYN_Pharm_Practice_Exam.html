": "GnRH agonists create a hypoestrogenic 'medical menopause' → hot flashes and BMD loss. Add-back (norethindrone acetate 5 mg daily ± conjugated estrogen) is started at initiation and prevents both without losing pain control.", "objective": "Menstruation Disorders — Obj 5: GnRH analogs — add-back therapy", "section": "Menstruation-Related Disorders"}, {"id": "40B", "group": 40, "stem": "Two weeks after her first injection her pelvic pain is worse than before. What explains this?", "options": [{"letter": "A", "text": "Competitive block of the GnRH receptor"}, {"letter": "B", "text": "Progestin withdrawal shedding the lining"}, {"letter": "C", "text": "Androgen excess acting on the implants"}, {"letter": "D", "text": "An initial LH/FSH flare raises estrogen"}, {"letter": "E", "text": "Aromatase inhibition raising FSH output"}], "answer": "D", "explanation": "A GnRH agonist first stimulates the receptor (↑ LH/FSH → transient estrogen surge), then desensitizes the pituitary → profound suppression in about 1–2 weeks. Elagolix, an antagonist, has no flare and a rapid onset.", "objective": "Menstruation Disorders — Obj 5: GnRH analogs — mechanism of action", "section": "Menstruation-Related Disorders"}, {"id": "41", "group": 41, "stem": "A woman at 12 weeks of gestation has a positive NAAT for Chlamydia trachomatis on routine prenatal screening. Which antibiotic should be prescribed?", "options": [{"letter": "A", "text": "Levofloxacin (Levaquin)"}, {"letter": "B", "text": "Doxycycline (Vibramycin)"}, {"letter": "C", "text": "Azithromycin (Zithromax)"}, {"letter": "D", "text": "Clarithromycin (Biaxin)"}, {"letter": "E", "text": "Metronidazole (Flagyl)"}], "answer": "C", "explanation": "Chlamydia in pregnancy: azithromycin 1 g once, with a test of cure 4 weeks after treatment and a retest at 3 months. Doxycycline, fluoroquinolones, and clarithromycin are avoided in pregnancy.", "objective": "GYN Infections — Obj 4: treatment plan for chlamydia (pregnancy)", "section": "GYN Infections & STIs"}, {"id": "42", "group": 42, "stem": "Which adverse-effect profile belongs to Medroxyprogesterone acetate (Depo-Provera)?", "options": [{"letter": "A", "text": "Liver injury (boxed warning) needing liver function tests"}, {"letter": "B", "text": "Weight gain, bone density loss, delayed return to fertility"}, {"letter": "C", "text": "Early symptom flare, then hot flashes, vaginal dryness, bone loss"}, {"letter": "D", "text": "Hyperkalemia; slightly higher clot risk than other pills"}, {"letter": "E", "text": "Dry mouth, dizziness, constipation, sedation"}, {"letter": "F", "text": "Acne, hirsutism, deepening voice, edema, raised blood pressure"}], "answer": "B", "explanation": "BMD recovers after stopping; meningioma signal with prolonged use.", "objective": "Contraception — Obj 2 & 5: progestins; injection", "section": "Contraception", "match": true, "matchLabel": "Medroxyprogesterone acetate (Depo-Provera)", "matchPrompt": "Match each hormonal or menopause drug to its adverse-effect profile. Each profile is used once."}, {"id": "42A", "group": 42, "stem": "Which adverse-effect profile belongs to Drospirenone/ethinyl estradiol (Yaz)?", "options": [{"letter": "A", "text": "Liver injury (boxed warning) needing liver function tests"}, {"letter": "B", "text": "Weight gain, bone density loss, delayed return to fertility"}, {"letter": "C", "text": "Early symptom flare, then hot flashes, vaginal dryness, bone loss"}, {"letter": "D", "text": "Hyperkalemia; slightly higher clot risk than other pills"}, {"letter": "E", "text": "Dry mouth, dizziness, constipation, sedation"}, {"letter": "F", "text": "Acne, hirsutism, deepening voice, edema, raised blood pressure"}], "answer": "D", "explanation": "Check K in cycle 1 with ACEi/ARB/NSAID/spironolactone.", "objective": "Contraception — Obj 2: progestins", "section": "Contraception", "match": true, "matchLabel": "Drospirenone/ethinyl estradiol (Yaz)", "matchPrompt": "Match each hormonal or menopause drug to its adverse-effect profile. Each profile is used once."}, {"id": "42B", "group": 42, "stem": "Which adverse-effect profile belongs to Leuprolide (Lupron Depot)?", "options": [{"letter": "A", "text": "Liver injury (boxed warning) needing liver function tests"}, {"letter": "B", "text": "Weight gain, bone density loss, delayed return to fertility"}, {"letter": "C", "text": "Early symptom flare, then hot flashes, vaginal dryness, bone loss"}, {"letter": "D", "text": "Hyperkalemia; slightly higher clot risk than other pills"}, {"letter": "E", "text": "Dry mouth, dizziness, constipation, sedation"}, {"letter": "F", "text": "Acne, hirsutism, deepening voice, edema, raised blood pressure"}], "answer": "C", "explanation": "Hypoestrogenic state → give add-back therapy.", "objective": "Menstruation Disorders — Obj 5: GnRH analogs", "section": "Menstruation-Related Disorders", "match": true, "matchLabel": "Leuprolide (Lupron Depot)", "matchPrompt": "Match each hormonal or menopause drug to its adverse-effect profile. Each profile is used once."}, {"id": "42C", "group": 42, "stem": "Which adverse-effect profile belongs to Danazol (Danocrine)?", "options": [{"letter": "A", "text": "Liver injury (boxed warning) needing liver function tests"}, {"letter": "B", "text": "Weight gain, bone density loss, delayed return to fertility"}, {"letter": "C", "text": "Early symptom flare, then hot flashes, vaginal dryness, bone loss"}, {"letter": "D", "text": "Hyperkalemia; slightly higher clot risk than other pills"}, {"letter": "E", "text": "Dry mouth, dizziness, constipation, sedation"}, {"letter": "F", "text": "Acne, hirsutism, deepening voice, edema, raised blood pressure"}], "answer": "F", "explanation": "Androgen agonist; black box — pregnancy.", "objective": "Menstruation Disorders — Obj 5: androgens", "section": "Menstruation-Related Disorders", "match": true, "matchLabel": "Danazol (Danocrine)", "matchPrompt": "Match each hormonal or menopause drug to its adverse-effect profile. Each profile is used once."}, {"id": "42D", "group": 42, "stem": "Which adverse-effect profile belongs to Clonidine (Catapres)?", "options": [{"letter": "A", "text": "Liver injury (boxed warning) needing liver function tests"}, {"letter": "B", "text": "Weight gain, bone density loss, delayed return to fertility"}, {"letter": "C", "text": "Early symptom flare, then hot flashes, vaginal dryness, bone loss"}, {"letter": "D", "text": "Hyperkalemia; slightly higher clot risk than other pills"}, {"letter": "E", "text": "Dry mouth, dizziness, constipation, sedation"}, {"letter": "F", "text": "Acne, hirsutism, deepening voice, edema, raised blood pressure"}], "answer": "E", "explanation": "0.1 mg at bedtime for nighttime hot flashes.", "objective": "Menopause — Obj 2: clonidine", "section": "Menopause", "match": true, "matchLabel": "Clonidine (Catapres)", "matchPrompt": "Match each hormonal or menopause drug to its adverse-effect profile. Each profile is used once."}, {"id": "42E", "group": 42, "stem": "Which adverse-effect profile belongs to Fezolinetant (Veozah)?", "options": [{"letter": "A", "text": "Liver injury (boxed warning) needing liver function tests"}, {"letter": "B", "text": "Weight gain, bone density loss, delayed return to fertility"}, {"letter": "C", "text": "Early symptom flare, then hot flashes, vaginal dryness, bone loss"}, {"letter": "D", "text": "Hyperkalemia; slightly higher clot risk than other pills"}, {"letter": "E", "text": "Dry mouth, dizziness, constipation, sedation"}, {"letter": "F", "text": "Acne, hirsutism, deepening voice, edema, raised blood pressure"}], "answer": "A", "explanation": "NK3 antagonist; elinzanetant has no boxed warning.", "objective": "Menopause — Obj 4: monitoring parameters", "section": "Menopause", "match": true, "matchLabel": "Fezolinetant (Veozah)", "matchPrompt": "Match each hormonal or menopause drug to its adverse-effect profile. Each profile is used once."}, {"id": "43", "group": 43, "stem": "A 26-year-old woman has taken a 20-mcg ethinyl estradiol/levonorgestrel pill for 4 months. She has not missed any pills but still has frequent spotting between periods. What is the best adjustment?", "options": [{"letter": "A", "text": "Decrease the ethinyl estradiol dose"}, {"letter": "B", "text": "Switch to norethindrone 0.35 mg"}, {"letter": "C", "text": "Increase the ethinyl estradiol dose"}, {"letter": "D", "text": "Reassure and recheck in 3 months"}, {"letter": "E", "text": "Change to a different progestin"}], "answer": "C", "explanation": "Breakthrough bleeding persisting beyond 3 months in an adherent patient → raise the EE dose. Estrogen-type effects (nausea, breast tenderness, fluid retention, headache) → lower EE. Progestin-type effects (mood, depression, ↓ libido) → change the progestin.", "objective": "Contraception — Obj 2: estrogen/progestin adverse effects and patient education", "section": "Contraception"}, {"id": "44", "group": 44, "stem": "A woman at 40 weeks of gestation had a dinoprostone (Cervidil) vaginal insert placed for cervical ripening. The insert has just been removed, her cervix is now favorable, and she has no regular contractions. How long should the team wait before starting oxytocin (Pitocin)?", "options": [{"letter": "A", "text": "2 hours"}, {"letter": "B", "text": "24 hours"}, {"letter": "C", "text": "6 hours"}, {"letter": "D", "text": "12 hours"}, {"letter": "E", "text": "30 minutes"}], "answer": "E", "explanation": "Oxytocin's effect is increased by prostaglandins → wait 30 minutes after removing the dinoprostone insert, or 6–12 hours after dinoprostone gel. Stacking them too soon risks uterine hypertonicity and rupture.", "objective": "Labor & Delivery — Obj 7 & 8: dinoprostone–oxytocin drug interaction", "section": "Labor & Delivery"}, {"id": "45", "group": 45, "stem": "A woman who is 8 weeks postpartum and breastfeeding takes norethindrone 0.35 mg (Micronor) every morning at 7 AM. Today she remembered her pill at noon. What should she be told?", "options": [{"letter": "A", "text": "Skip today's pill and use backup for 7 days"}, {"letter": "B", "text": "Stop the pack and restart after her period"}, {"letter": "C", "text": "Take it now; no backup method is needed"}, {"letter": "D", "text": "Take it now and use backup for 48 hours"}, {"letter": "E", "text": "Take two pills tomorrow morning instead"}], "answer": "D", "explanation": "Norethindrone (and OTC norgestrel) progestin-only pills have a 3-hour window; more than 3 hours late → take it and use backup or abstain for 48 hours. Drospirenone 4 mg (Slynd) has a 24-hour window.", "objective": "Contraception — Obj 6: patient education (progestin-only pill timing)", "section": "Contraception"}, {"id": "46", "group": 46, "stem": "A woman who is exclusively breastfeeding her 3-week-old has a cold with nasal congestion and a headache. She asks which over-the-counter product she should avoid because it can decrease her milk supply. Which is it?", "options": [{"letter": "A", "text": "Pseudoephedrine (Sudafed)"}, {"letter": "B", "text": "Acetaminophen (Tylenol)"}, {"letter": "C", "text": "Guaifenesin (Mucinex)"}, {"letter": "D", "text": "Ibuprofen (Motrin)"}, {"letter": "E", "text": "Saline nasal spray"}], "answer": "A", "explanation": "Decongestants, estrogens, and dopamine agonists decrease milk supply. Ibuprofen is the preferred NSAID in lactation and acetaminophen is the drug of choice for pain. Pseudoephedrine is also avoided in the 1st trimester.", "objective": "Pregnancy & Lactation — Obj 1 & 3: approach to medication use in lactation; OTC drugs", "section": "Drugs in Pregnancy & Lactation"}, {"id": "47", "group": 47, "stem": "A 34-year-old woman has heavy menstrual bleeding with a normal pelvic examination. She and her partner are actively trying to conceive, and she has no history of blood clots. Which medication is most appropriate?", "options": [{"letter": "A", "text": "Leuprolide (Lupron Depot)"}, {"letter": "B", "text": "Tranexamic acid (Lysteda)"}, {"letter": "C", "text": "Levonorgestrel IUD (Mirena)"}, {"letter": "D", "text": "Medroxyprogesterone acetate (Depo-Provera)"}, {"letter": "E", "text": "Levonorgestrel/ethinyl estradiol (Lutera)"}], "answer": "B", "explanation": "TXA is the non-hormonal option for menorrhagia: taken only during menses (1.3 g TID up to 5 days), it does not affect ovulation — ideal when trying to conceive or when hormones are contraindicated. It can be combined with NSAIDs.", "objective": "Menstruation Disorders — Obj 5: tranexamic acid — indications", "section": "Menstruation-Related Disorders"}, {"id": "47A", "group": 47, "stem": "How does this medication reduce her menstrual blood loss?", "options": [{"letter": "A", "text": "Inhibits COX and prostaglandin synthesis"}, {"letter": "B", "text": "Competitively blocks the GnRH receptor"}, {"letter": "C", "text": "Suppresses the midcycle surge of LH"}, {"letter": "D", "text": "Acts as an agonist at androgen receptors"}, {"letter": "E", "text": "Blocks plasminogen activation to plasmin"}], "answer": "E", "explanation": "TXA is an antifibrinolytic: it prevents plasminogen → plasmin, so endometrial clots stay in place. COX inhibition = NSAIDs; GnRH receptor blockade = elagolix; androgen agonist = danazol.", "objective": "Menstruation Disorders — Obj 5: tranexamic acid — mechanism of action", "section": "Menstruation-Related Disorders"}, {"id": "47B", "group": 47, "stem": "Which history would have been a contraindication to this medication?", "options": [{"letter": "A", "text": "Well-controlled hypertension"}, {"letter": "B", "text": "Mild intermittent asthma"}, {"letter": "C", "text": "Migraine without aura"}, {"letter": "D", "text": "A prior pulmonary embolism"}, {"letter": "E", "text": "Peptic ulcer disease"}], "answer": "D", "explanation": "TXA carries thrombotic risk → contraindicated with DVT/PE. It also needs renal dose adjustment. Adverse effects: nausea, dizziness, headache.", "objective": "Menstruation Disorders — Obj 5: tranexamic acid — contraindications", "section": "Menstruation-Related Disorders"}, {"id": "48", "group": 48, "stem": "A 31-year-old woman with chronic hypertension and asthma has a positive pregnancy test at 6 weeks of gestation. She takes lisinopril and an albuterol inhaler. Blood pressure is 148/94 mm Hg and heart rate is 78/min. Which change is most appropriate?", "options": [{"letter": "A", "text": "Stop lisinopril and start labetalol (Trandate)"}, {"letter": "B", "text": "Stop lisinopril and start nifedipine ER (Procardia XL)"}, {"letter": "C", "text": "Continue lisinopril and add nifedipine ER (Procardia XL)"}, {"letter": "D", "text": "Continue lisinopril until the second trimester"}, {"letter": "E", "text": "Switch lisinopril to losartan (Cozaar)"}], "answer": "B", "explanation": "ACE inhibitors and ARBs are stopped (ideally preconception). ACOG-preferred agents are labetalol and nifedipine — labetalol can bronchoconstrict, so it is avoided in asthma; nifedipine is avoided if tachycardic.", "objective": "Pregnancy & Lactation — Obj 5: management of hypertension in pregnancy", "section": "Drugs in Pregnancy & Lactation"}, {"id": "48A", "group": 48, "stem": "If her original antihypertensive had been continued into the second and third trimesters, which fetal complication would be most likely?", "options": [{"letter": "A", "text": "Renal impairment with oligohydramnios"}, {"letter": "B", "text": "Kernicterus in the newborn"}, {"letter": "C", "text": "Neural tube defects"}, {"letter": "D", "text": "Limb and skeletal hypoplasia"}, {"letter": "E", "text": "Premature closure of the ductus arteriosus"}], "answer": "A", "explanation": "ACEi/ARB in the 2nd–3rd trimester → fetal renal impairment → oligohydramnios → cord compression, pulmonary hypoplasia, skeletal deformities, and anuria after birth.", "objective": "Pregnancy & Lactation — Obj 2: drugs to avoid in pregnancy", "section": "Drugs in Pregnancy & Lactation"}, {"id": "48B", "group": 48, "stem": "Why is labetalol (Trandate), the other ACOG-preferred agent, a poor choice for this patient?", "options": [{"letter": "A", "text": "It causes reflex tachycardia"}, {"letter": "B", "text": "It raises depression risk"}, {"letter": "C", "text": "It can cause bronchoconstriction"}, {"letter": "D", "text": "It impairs fetal kidneys"}, {"letter": "E", "text": "It causes marked ankle edema"}], "answer": "C", "explanation": "Labetalol is an α/β blocker and may bronchoconstrict — avoid in asthma. Tachycardia and edema are nifedipine issues; postpartum depression is why ACOG advises against methyldopa after delivery.", "objective": "Pregnancy & Lactation — Obj 5: management of hypertension in pregnancy", "section": "Drugs in Pregnancy & Lactation"}, {"id": "49", "group": 49, "stem": "A woman at 39 weeks of gestation with a prior cesarean delivery needs induction of labor, and her cervix is unfavorable. Misoprostol (Cytotec) is avoided in this patient because of the risk of which complication?", "options": [{"letter": "A", "text": "Uterine rupture"}, {"letter": "B", "text": "Postpartum hemorrhage"}, {"letter": "C", "text": "Maternal pulmonary edema"}, {"letter": "D", "text": "Placental abruption"}, {"letter": "E", "text": "Fetal ductal closure"}], "answer": "A", "explanation": "Misoprostol (PGE1) causes excessive uterine stimulation; with a previous C-section the risk is uterine rupture.", "objective": "Labor & Delivery — Obj 7: dinoprostone vs misoprostol — contraindications", "section": "Labor & Delivery"}, {"id": "49A", "group": 49, "stem": "In a woman without a uterine scar, how does misoprostol (Cytotec) compare with dinoprostone (Cervidil) for cervical ripening?", "options": [{"letter": "A", "text": "Less effective and less expensive"}, {"letter": "B", "text": "More effective and less expensive"}, {"letter": "C", "text": "Equally effective and safer overall"}, {"letter": "D", "text": "More effective and more expensive"}, {"letter": "E", "text": "Less effective and more expensive"}], "answer": "B", "explanation": "Misoprostol (PGE1): higher efficacy, much cheaper, but more adverse effects. Dinoprostone (PGE2): gentler, pricier, black box warning — use only in a medical facility.", "objective": "Labor & Delivery — Obj 7: dinoprostone vs misoprostol", "section": "Labor & Delivery"}, {"id": "50", "group": 50, "stem": "A 55-year-old postmenopausal woman declines hormone therapy. Her days are comfortable, but drenching night sweats wake her several times each night. Which medication is the best choice?", "options": [{"letter": "A", "text": "Ospemifene (Osphena) once daily"}, {"letter": "B", "text": "Oxybutynin (Ditropan) at bedtime"}, {"letter": "C", "text": "Gabapentin (Neurontin) at bedtime"}, {"letter": "D", "text": "Raloxifene (Evista) once daily"}, {"letter": "E", "text": "Paroxetine (Paxil) each morning"}], "answer": "C", "explanation": "Nighttime-predominant symptoms without hormones → gabapentin 100–300 mg at bedtime (titrate to 900 mg) or clonidine 0.1 mg at bedtime; the sedation works in her favor. SSRIs/SNRIs are the daytime choice. Oxybutynin is for nocturia.", "objective": "Menopause — Obj 2 & 5: gabapentin; case-based treatment plan", "section": "Menopause"}, {"id": "51", "group": 51, "stem": "A 26-year-old woman has bloating, breast tenderness, and ankle swelling during the week before each period, confirmed in a symptom diary. She has no mood symptoms, and exercise and calcium supplements have not helped. Which medication, taken during the luteal phase, targets these symptoms?", "options": [{"letter": "A", "text": "Leuprolide (Lupron Depot)"}, {"letter": "B", "text": "Fluoxetine (Prozac)"}, {"letter": "C", "text": "Tranexamic acid (Lysteda)"}, {"letter": "D", "text": "Medroxyprogesterone acetate (Depo-Provera)"}, {"letter": "E", "text": "Spironolactone (Aldactone)"}], "answer": "E", "explanation": "PMS physical symptoms from fluid retention (bloating, breast tenderness) → spironolactone, an aldosterone antagonist, in the luteal phase; watch potassium. SSRIs target mood symptoms; Depo-Provera can itself cause PMS-like effects.", "objective": "Menstruation Disorders — Obj 3: treatment of PMS/PMDD", "section": "Menstruation-Related Disorders"}, {"id": "52", "group": 52, "stem": "A 33-year-old woman taking warfarin (Coumadin) for recurrent deep venous thrombosis learns she is 5 weeks pregnant and still needs anticoagulation. Which agent should replace warfarin?", "options": [{"letter": "A", "text": "Aspirin"}, {"letter": "B", "text": "Clopidogrel (Plavix)"}, {"letter": "C", "text": "Apixaban (Eliquis)"}, {"letter": "D", "text": "Heparin"}, {"letter": "E", "text": "Rivaroxaban (Xarelto)"}], "answer": "D", "explanation": "Warfarin crosses the placenta: fatal fetal hemorrhage, CNS abnormalities, limb/skeletal hypoplasia. Heparin does not cross the placenta and is the alternative.", "objective": "Pregnancy & Lactation — Obj 2: Category X drugs to avoid", "section": "Drugs in Pregnancy & Lactation"}, {"id": "53", "group": 53, "stem": "A woman at 30 weeks of gestation received a tocolytic for preterm labor 4 hours ago. She now has palpitations and mild dyspnea; heart rate is 132/min, potassium is 3.0 mEq/L, and glucose is 214 mg/dL. Which tocolytic did she most likely receive?", "options": [{"letter": "A", "text": "Magnesium sulfate"}, {"letter": "B", "text": "Dinoprostone (Cervidil)"}, {"letter": "C", "text": "Indomethacin (Indocin)"}, {"letter": "D", "text": "Nifedipine (Procardia)"}, {"letter": "E", "text": "Terbutaline (Brethine)"}], "answer": "E", "explanation": "Terbutaline has the most maternal adverse effects, which is why it is second line: tachycardia/arrhythmias, hypotension, hypokalemia, hyperglycemia, and (rarely) pulmonary edema. Monitor electrolytes, glucose, vitals, and for pulmonary edema.", "objective": "Labor & Delivery — Obj 5: terbutaline — adverse effects and monitoring", "section": "Labor & Delivery"}, {"id": "53A", "group": 53, "stem": "By what mechanism does this drug stop uterine contractions?", "options": [{"letter": "A", "text": "Antagonist at the oxytocin receptor"}, {"letter": "B", "text": "Beta-2 agonist that relaxes myometrium"}, {"letter": "C", "text": "COX inhibitor that lowers prostaglandins"}, {"letter": "D", "text": "Prostaglandin E1 analog at the cervix"}, {"letter": "E", "text": "Calcium channel blocker in uterine muscle"}], "answer": "B", "explanation": "Terbutaline binds β₂ receptors → ↓ intracellular calcium and ↓ contractile sensitivity to calcium. Calcium channel blockade = nifedipine; COX/prostaglandin inhibition = indomethacin.", "objective": "Labor & Delivery — Obj 5: terbutaline — mechanism of action", "section": "Labor & Delivery"}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  const flagged = {};        // question id -> true, set by the learner at any point (never affects score)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  // Lab values as a table. q.labs is [{test, result, range}]. If the stem contains
  // the marker [[LABS]] the table goes there (so the vignette can continue after
  // the labs); otherwise it follows the stem.
  function labsHtml(q) {
    if (!q.labs || !q.labs.length) return '';
    const hasRange = q.labs.some(l => l.range);
    let html = '<table class="labs"><thead><tr><th>Test</th><th>Result</th>' +
      (hasRange ? '<th>Reference Range</th>' : '') + '</tr></thead><tbody>';
    q.labs.forEach(l => {
      html += '<tr><td>' + esc(l.test) + '</td><td class="res">' + esc(l.result) + '</td>' +
        (hasRange ? '<td class="ref">' + (l.range ? '(' + esc(String(l.range).replace(/^\(|\)$/g, '')) + ')' : '') + '</td>' : '') + '</tr>';
    });
    return html + '</tbody></table>';
  }

  function stemHtml(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    const table = labsHtml(q);
    if (table && stem.indexOf('[[LABS]]') !== -1) {
      const parts = stem.split('[[LABS]]');
      return '<div class="stem">' + esc(parts[0].replace(/\s+$/, '')) + '</div>' + table +
        (parts[1] && parts[1].trim() ? '<div class="stem">' + esc(parts[1].replace(/^\s+/, '')) + '</div>' : '');
    }
    return '<div class="stem">' + esc(stem.replace('[[LABS]]', '')) + '</div>' + table;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += stemHtml(q);
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += flagHtml(q);
    html += '</div>';
    return html;
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly (or not understood) can still be carried into the next round
  // of study. Flagging never changes the score — it is a bookmark, not a second answer.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">⚑ ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '⚑ ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  // ── Matching page: one row per drug, a dropdown of adverse-effect profiles, graded together ──
  const pending = {};        // question id -> letter chosen in a dropdown, not yet checked
  function matchHtml(group) {
    const done = group.every(q => answers[q.id] !== undefined);
    let html = '<div class="group"><div class="qcard"><span class="qnum">Question ' + esc(group[0].id) +
      ' · matching (' + group.length + ' items)</span><div class="stem">' + esc(group[0].matchPrompt) + '</div>';
    group.forEach(q => {
      const chosen = done ? answers[q.id] : pending[q.id];
      const good = done && chosen === q.answer;
      html += '<div class="mrow' + (done ? (good ? ' good' : ' bad') : '') + '"><div class="mdrug">' + esc(q.matchLabel) + '</div>';
      html += '<select class="msel" data-mq="' + esc(q.id) + '"' + (done || mode !== 'exam' ? ' disabled' : '') + '>' +
        '<option value="">Select an adverse-effect profile…</option>';
      q.options.forEach(o => {
        html += '<option value="' + esc(o.letter) + '"' + (chosen === o.letter ? ' selected' : '') + '>' + esc(o.text) + '</option>';
      });
      html += '</select>';
      if (done) {
        const c = q.options.find(o => o.letter === q.answer);
        html += '<div class="mfb"><strong>' + (good ? '✓ Correct' : '✗ Correct match: ' + esc(c ? c.text : '')) + '</strong>' +
          (q.explanation ? ' — ' + esc(q.explanation) : '') + '</div>';
      }
      html += flagHtml(q) + '</div>';
    });
    if (!done && mode === 'exam') {
      html += '<button class="btn primary mcheck" id="btn-match-check">Check matches</button>';
    }
    return html + '</div></div>';
  }
  function wireMatch(group) {
    const btn = $('btn-match-check');
    const ready = () => group.every(q => pending[q.id]);
    if (btn) {
      btn.disabled = !ready();
      btn.addEventListener('click', () => {
        if (!ready()) return;
        group.forEach(q => { answers[q.id] = pending[q.id]; });
        renderPage(true);
      });
    }
    $('main').querySelectorAll('.msel').forEach(sel => {
      sel.addEventListener('change', () => {
        const id = sel.getAttribute('data-mq');
        if (sel.value) pending[id] = sel.value; else delete pending[id];
        if (btn) btn.disabled = !ready();
      });
    });
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];
    if (group[0].match) {
      $('main').innerHTML = matchHtml(group);
      wireMatch(group); bindFlags(); renderProgress(); renderNav();
      if (preserveScroll) window.scrollTo(0, savedY); else window.scrollTo(0, 0);
      return;
    }

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {                 // answered wrong, or flagged by the learner
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          stemHtml(g[0]) + '</div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  // Plain-text stem with the lab table flattened to one line per lab
  function stemText(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    if (!q.labs || !q.labs.length) return stem.replace('[[LABS]]', '').trim();
    const rows = q.labs.map(l => '  ' + l.test + ': ' + l.result + (l.range ? ' (ref ' + String(l.range).replace(/^\(|\)$/g, '') + ')' : '')).join('\n');
    const i = stem.indexOf('[[LABS]]');
    const before = i === -1 ? stem : stem.slice(0, i);
    const hasHeader = /\b(labs|laboratory (studies|results|values))\s*:?\s*$/i.test(before);   // stem already says "Labs:"
    const block = (hasHeader ? '' : 'Labs:\n') + rows;
    return (i !== -1 ? before.replace(/\s+$/, '') + '\n' + block + '\n' + stem.slice(i + 8).replace(/^\s+/, '') : stem + '\n' + block).trim();
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + stemText(group[0]));
      lines.push(stemText(q));
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered' : 'My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    Object.keys(pending).forEach(k => delete pending[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
