<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

const EXAM_DATA = {"title": "Clinical Medicine II — Disorders of the Small Bowel and Colon Practice Exam", "questions": [{"id": "1", "group": 1, "stem": "An 84-year-old woman presents to the primary care clinic because of involuntary passage of stool for the past 8 months — soiling with flatus and liquid stool several times a week, with urgency she cannot defer. She has stopped leaving the house. She has had four vaginal deliveries, one of them a difficult forceps delivery with a third-degree laceration, and has type 2 diabetes, mild dementia, and urinary incontinence. Her temperature is 36.6°C (97.9°F), blood pressure is 138/76 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 96% on room air. Digital rectal examination shows decreased resting and squeeze pressure, and the anal wink reflex is absent. There are external hemorrhoids and a small anterior scar at the anal verge. There is no palpable impaction, no mass, and no prolapse on straining.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Assessment against the Rome IV criteria"}, {"letter": "B", "text": "Anal manometry with anorectal ultrasound"}, {"letter": "C", "text": "Digital rectal examination with anoscopy"}, {"letter": "D", "text": "Fecal calprotectin with C-reactive protein and celiac serology"}, {"letter": "E", "text": "Examination of the perineum while the patient strains in the squatting position"}], "answer": "B", "explanation": "The bedside examination has shown that the sphincter is weak, but not whether the weakness is structural, neurologic, or both. Manometry quantifies resting and squeeze pressures and ultrasound images the sphincter itself, which is what determines whether repair is possible.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E2", "pgroup": "E", "pstack": "A"}, {"id": "1A", "group": 1, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Rome IV criteria met, with normal potassium, thyroid-stimulating hormone, glucose, and lead"}, {"letter": "B", "text": "Full-thickness rectal wall protruding through the anal canal with concentric folds"}, {"letter": "C", "text": "Hard impacted stool in the rectal vault"}, {"letter": "D", "text": "An anterior defect in the external anal sphincter"}, {"letter": "E", "text": "An engorged hemorrhoidal plexus above or below the pectinate line"}], "answer": "D", "explanation": "A third-degree obstetric laceration tears the sphincter anteriorly, and the anterior scar at the anal verge marks it. Imaging shows the gap in the external sphincter that manometry registers as reduced resting and squeeze pressure, and the impaired anal wink adds a neurologic component.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E2", "pgroup": "E", "pstack": "A"}, {"id": "1B", "group": 1, "stem": "Which of the following tests would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "Defecography with proctosigmoidoscopy"}, {"letter": "B", "text": "Colorectal transit (Sitz marker) study"}, {"letter": "C", "text": "Balloon expulsion testing"}, {"letter": "D", "text": "Flexible sigmoidoscopy or colonoscopy"}, {"letter": "E", "text": "Pelvic floor MRI with anorectal manometry"}], "answer": "A", "explanation": "Defecography demonstrates the structural and functional abnormality during evacuation, and proctosigmoidoscopy excludes inflammation or tumor as the reason for the leakage. Together they establish the defecatory abnormality and rule out mucosal disease and mass.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E2", "pgroup": "E", "pstack": "A"}, {"id": "1C", "group": 1, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Chronic constipation"}, {"letter": "B", "text": "Rectal prolapse"}, {"letter": "C", "text": "Fecal impaction"}, {"letter": "D", "text": "Irritable bowel syndrome"}, {"letter": "E", "text": "Fecal incontinence"}], "answer": "E", "explanation": "Involuntary passage of flatus and liquid stool while solid stool is still controlled is minor fecal incontinence. Obstetric sphincter injury, pudendal nerve damage, and systemic disease such as diabetes are all represented here, and the absent anal wink with reduced pressures and an anterior sphincter defect identifies the mechanism.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E2", "pgroup": "E", "pstack": "A"}, {"id": "2", "group": 2, "stem": "A 71-year-old woman presents to the emergency department with crampy periumbilical pain that has come in waves for 2 days, along with nausea, vomiting, and no passage of stool or flatus. She had a hysterectomy 20 years ago. She has no known hernia and no history of malignancy. Her temperature is 37.2°C (99.0°F), blood pressure is 126/76 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 97% on room air. Examination shows a distended, tympanitic abdomen with high-pitched tinkling bowel sounds and a well-healed lower midline surgical scar. There is no rebound, no guarding, and no palpable hernia. An upright abdominal radiograph shows dilated small-bowel loops with air-fluid levels in a step-ladder pattern and no colonic gas, and no free air under the diaphragm.\n\nLaboratory studies:\n  White blood cell count: 12,100/mm³\n  Potassium: 3.4 mEq/L\n  Lactate: 1.4 mmol/L\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Digital rectal examination"}, {"letter": "B", "text": "Serum potassium and magnesium levels"}, {"letter": "C", "text": "CT of the abdomen and pelvis"}, {"letter": "D", "text": "Direct visualization at laparoscopy"}, {"letter": "E", "text": "Endoscopy of the colon"}], "answer": "C", "explanation": "An upright film showing dilated small-bowel loops with air-fluid levels and no colonic gas establishes a small-bowel pattern but does not localize the obstruction. CT of the abdomen and pelvis identifies the transition point and shows whether a mass, ischemia, or perforation is present. Endoscopy and laparoscopy address other causes of obstruction, and the potassium is already known.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "2A", "group": 2, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Colonic dilation proximal to a malignant-appearing transition point"}, {"letter": "B", "text": "A transition point in the mid-ileum with proximal distention and distal collapse"}, {"letter": "C", "text": "Air throughout the gastrointestinal tract including the colon and rectum, with no transition point"}, {"letter": "D", "text": "A U-shaped distended sigmoid colon with a coffee bean sign and absent rectal gas"}, {"letter": "E", "text": "Hard impacted stool in the rectal vault"}], "answer": "B", "explanation": "Mechanical small-bowel obstruction produces a discrete point at which the caliber of the bowel changes: distended, fluid-filled loops proximally and collapsed bowel distally. The absence of a discrete mass at that point argues against tumor. Air reaching the rectum with no transition point would indicate a functional rather than a mechanical process.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "2B", "group": 2, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Adynamic (paralytic) ileus"}, {"letter": "B", "text": "Fecal impaction"}, {"letter": "C", "text": "Large bowel obstruction"}, {"letter": "D", "text": "Small bowel obstruction"}, {"letter": "E", "text": "Volvulus"}], "answer": "D", "explanation": "Crampy periumbilical pain in waves with obstipation, a distended tympanitic abdomen, high-pitched tinkling bowel sounds, dilated small-bowel loops with air-fluid levels and no colonic gas, and a CT transition point in the mid-ileum define mechanical small bowel obstruction. The prior hysterectomy is the risk factor; a normal lactate and no free air argue against strangulation or perforation.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A1", "pgroup": "A", "pstack": "A"}, {"id": "3", "group": 3, "stem": "A 41-year-old man presents to the primary care clinic with tearing pain with every bowel movement — he describes it as \"like passing glass\" — for 3 weeks, lasting an hour or more afterward. There is blood on the surface of the stool and on the toilet paper, not mixed in. He has begun avoiding defecation, which has made his constipation worse. He has chronic constipation with straining and eats a low-fiber diet. He takes sildenafil for erectile dysfunction. He has no Crohn disease and no history of anal receptive intercourse. His temperature is 36.7°C (98.1°F), blood pressure is 126/76 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. There is marked pain on attempted digital examination. There is no fluctuance, no perianal swelling, and no prolapse.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Digital rectal examination with anoscopy"}, {"letter": "B", "text": "Ultrasound of the perianal region"}, {"letter": "C", "text": "Anal manometry with anorectal ultrasound"}, {"letter": "D", "text": "Colonoscopy, or CT of the abdomen and pelvis"}, {"letter": "E", "text": "Inspection with gentle stretching of the anus"}], "answer": "E", "explanation": "The diagnosis is made by the provider on inspection and digital rectal examination, and the lesion becomes visible only when the anal margin is opened — Valsalva or gentle manual stretching of the anus brings it into view.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F2", "pgroup": "F", "pstack": "A"}, {"id": "3A", "group": 3, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Reduced resting and squeeze pressure with an absent anal wink"}, {"letter": "B", "text": "An engorged hemorrhoidal plexus above or below the pectinate line"}, {"letter": "C", "text": "A midline crack in the anal mucosa posteriorly, with raised edges and a sentinel tag"}, {"letter": "D", "text": "An abscess cavity in the natal cleft superior to the anus"}, {"letter": "E", "text": "Full-thickness rectal wall protruding through the anal canal with concentric folds"}], "answer": "C", "explanation": "Hard stool passing through a tight anal canal splits the mucosa in the posterior midline. Raised edges and a sentinel tag indicate that the fissure has become chronic rather than a fresh paper-cut laceration, and blood lies on the surface of the stool rather than mixed into it.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F2", "pgroup": "F", "pstack": "A"}, {"id": "3B", "group": 3, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Anal fissure"}, {"letter": "B", "text": "Fecal incontinence"}, {"letter": "C", "text": "Hemorrhoids"}, {"letter": "D", "text": "Pilonidal cyst / abscess"}, {"letter": "E", "text": "Rectal prolapse"}], "answer": "A", "explanation": "Tearing pain with every bowel movement lasting an hour afterward, with blood on the surface of the stool and a posterior midline crack, is an anal fissure. Pain drives avoidance of defecation, which worsens the constipation and keeps the fissure open. A lateral fissure instead would require a search for a secondary cause such as Crohn disease or infection.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F2", "pgroup": "F", "pstack": "A"}, {"id": "4", "group": 4, "stem": "A 16-year-old boy presents to the emergency department with pain that began around the umbilicus about 14 hours ago and has migrated to the right lower quadrant. He has had nausea with two episodes of vomiting after the pain began, anorexia, and a low-grade fever this evening; the pain came first and the vomiting followed. He was previously well, has had no prior abdominal surgery, and has no history of a fecalith. His temperature is 37.9°C (100.2°F), blood pressure is 118/70 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 99% on room air. Examination shows McBurney's point tenderness with voluntary guarding and positive Rovsing, psoas, and obturator signs. Bowel sounds are present and there is no rigidity.\n\nLaboratory studies:\n  White blood cell count: 13,200/mm³\n  C-reactive protein: 48 mg/L\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Colonoscopy"}, {"letter": "B", "text": "Paracentesis"}, {"letter": "C", "text": "Plain abdominal radiographs"}, {"letter": "D", "text": "CT of the abdomen and pelvis with contrast"}, {"letter": "E", "text": "Serum lactate and lactate dehydrogenase"}], "answer": "D", "explanation": "Migratory right lower quadrant pain with localized peritoneal signs requires imaging that shows the appendix itself, and contrast-enhanced CT of the abdomen and pelvis is the preferred study. Delay is itself a harm, since the risk of perforation is about 2% at 36 hours and rises roughly 5% every 12 hours thereafter.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C3", "pgroup": "C", "pstack": "A"}, {"id": "4A", "group": 4, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An appendiceal diameter above 6 mm with an occluded lumen and fat stranding"}, {"letter": "B", "text": "Thumbprinting — segmental bowel wall thickening at a watershed area"}, {"letter": "C", "text": "Localized bowel wall thickening with peri-colonic fat stranding and colonic diverticula"}, {"letter": "D", "text": "A U-shaped distended sigmoid colon with a coffee bean sign and absent rectal gas"}, {"letter": "E", "text": "Leukocytosis with an elevated lactate and free air on imaging"}], "answer": "A", "explanation": "Obstruction of the appendiceal lumen traps secretions, so the appendix distends beyond 6 mm and its wall thickens; the inflammation spreads to the surrounding fat and produces stranding and wall enhancement. No appendicolith and no abscess indicate uncomplicated disease.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C3", "pgroup": "C", "pstack": "A"}, {"id": "4B", "group": 4, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Diverticulitis"}, {"letter": "B", "text": "Peritonitis"}, {"letter": "C", "text": "Volvulus"}, {"letter": "D", "text": "Ischemic colitis"}, {"letter": "E", "text": "Appendicitis"}], "answer": "E", "explanation": "Periumbilical pain migrating to the right lower quadrant in under 36 hours, with pain preceding vomiting, anorexia, low-grade fever, McBurney's point tenderness, and positive Rovsing, psoas, and obturator signs, is appendicitis. Luminal obstruction — a fecalith, lymphoid hyperplasia, tumor, or infection — is the underlying cause.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C3", "pgroup": "C", "pstack": "A"}, {"id": "5", "group": 5, "stem": "A 58-year-old woman on the inpatient unit is seen on postoperative day 3 after an open abdominal hysterectomy because of bloating and distention with diffuse, mild abdominal discomfort. She has had nausea and two episodes of vomiting and has not passed flatus since surgery. She is taking scheduled oxycodone for incisional pain and has been in bed most of the time. Her temperature is 36.9°C (98.4°F), blood pressure is 118/72 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 97% on room air. Examination shows absent to hypoactive bowel sounds and abdominal distention that is soft and only mildly tender diffusely. There is no rebound, no guarding, and no rigidity.\n\nLaboratory studies:\n  Complete blood count: Normal\n  Potassium: 2.9 mEq/L\n  Magnesium: 1.3 mg/dL\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Digital rectal examination"}, {"letter": "B", "text": "Upright abdominal radiograph"}, {"letter": "C", "text": "Repeat serum potassium and magnesium levels"}, {"letter": "D", "text": "Endoscopy of the colon"}, {"letter": "E", "text": "Direct visualization at laparoscopy"}], "answer": "B", "explanation": "Distention with absent bowel sounds after abdominal surgery has to be separated from mechanical obstruction, and the plain film does that: it shows whether gas reaches the rectum and whether a transition point exists. It is the first imaging study here, before cross-sectional imaging is considered, and the electrolytes have already been measured.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A3", "pgroup": "A", "pstack": "A"}, {"id": "5A", "group": 5, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Hard impacted stool in the rectal vault"}, {"letter": "B", "text": "Dilated small-bowel loops with air-fluid levels in a step-ladder pattern and no colonic gas"}, {"letter": "C", "text": "Air throughout the gastrointestinal tract including the colon and rectum, with no transition point"}, {"letter": "D", "text": "Colonic dilation proximal to a malignant-appearing transition point"}, {"letter": "E", "text": "A U-shaped distended sigmoid colon with a coffee bean sign and absent rectal gas"}], "answer": "C", "explanation": "Paralysis of motility without a mechanical block allows gas to distribute along the entire gastrointestinal tract, including the colon and rectum, and no caliber change appears. Dilated loops can still mimic obstruction on the film, which is why the distribution of gas and the absence of a transition point are the discriminating features.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A3", "pgroup": "A", "pstack": "A"}, {"id": "5B", "group": 5, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Fecal impaction"}, {"letter": "B", "text": "Small bowel obstruction"}, {"letter": "C", "text": "Volvulus"}, {"letter": "D", "text": "Adynamic (paralytic) ileus"}, {"letter": "E", "text": "Large bowel obstruction"}], "answer": "D", "explanation": "Recent abdominal surgery, scheduled opioids, immobility, hypokalemia and hypomagnesemia, quiet bowel sounds, mild diffuse pain, no peritoneal signs, and no fever or tachycardia describe a functional paralysis of motility without mechanical obstruction. A mechanical obstruction would produce high-pitched sounds and a discrete transition point.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A3", "pgroup": "A", "pstack": "A"}, {"id": "6", "group": 6, "stem": "A 68-year-old woman presents to the emergency department after passing a large volume of dark red blood per rectum twice this morning without any abdominal pain. She has felt bloated for years and has been constipated most of her life; she eats little fiber and a good deal of red meat and does not exercise. She has had no prior diverticulitis, takes no NSAIDs, and takes no anticoagulant. She has had no fever. Her temperature is 36.8°C (98.2°F), blood pressure is 118/72 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 98% on room air. Examination shows a soft, nontender abdomen with no distention and no guarding. There is dark red blood on rectal examination and no mass.\n\nLaboratory studies:\n  Hemoglobin: 10.6 g/dL\n  Hematocrit: 32%\n  White blood cell count: 8,400/mm³\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Digital rectal examination with anoscopy"}, {"letter": "B", "text": "Colonoscopy"}, {"letter": "C", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "D", "text": "Upright abdominal radiograph with CT of the abdomen and pelvis"}, {"letter": "E", "text": "CT of the abdomen with intravenous contrast, with serum lactate and lactate dehydrogenase"}], "answer": "B", "explanation": "Large-volume hematochezia without pain, fever, or leukocytosis in an older adult requires direct examination of the colonic mucosa, which identifies the source and excludes a mass. It is the study on which this diagnosis is usually made, often incidentally.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D1", "pgroup": "D", "pstack": "A"}, {"id": "6A", "group": 6, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An engorged hemorrhoidal plexus above or below the pectinate line"}, {"letter": "B", "text": "Localized bowel wall thickening with peri-colonic fat stranding and colonic diverticula"}, {"letter": "C", "text": "Thumbprinting — segmental bowel wall thickening at a watershed area"}, {"letter": "D", "text": "Colonic dilation proximal to a malignant-appearing transition point"}, {"letter": "E", "text": "Multiple colonic diverticula without inflammation, most numerous in the sigmoid"}], "answer": "E", "explanation": "Chronic constipation and a low-fiber diet raise intraluminal pressure and force mucosa out through weak points in the colonic wall, most often in the sigmoid — these are acquired false diverticula. Bleeding comes from segmental arterial weakness in the diverticular wall; without inflammation there is no wall thickening, no fat stranding, and no leukocytosis.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D1", "pgroup": "D", "pstack": "A"}, {"id": "6B", "group": 6, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Diverticulitis"}, {"letter": "B", "text": "Ischemic colitis"}, {"letter": "C", "text": "Diverticulosis"}, {"letter": "D", "text": "Hemorrhoids"}, {"letter": "E", "text": "Large bowel obstruction"}], "answer": "C", "explanation": "Painless large-volume hematochezia with a normal abdomen, a normal white cell count, and multiple non-inflamed sigmoid diverticula is diverticular bleeding from diverticulosis. Diverticulitis would produce pain, fever, leukocytosis, and pericolonic fat stranding, and hemorrhoids produce bright red streaking after defecation rather than large-volume dark red bleeding.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D1", "pgroup": "D", "pstack": "A"}, {"id": "7", "group": 7, "stem": "A 78-year-old man presents to the emergency department with slowly progressive colicky left lower quadrant pain over 3 days with constipation and marked distention. He has passed no flatus for 2 days. He has had chronic constipation for years in a nursing home, a previous barium study showed a long, redundant colon, and he takes an anticholinergic for an overactive bladder. His temperature is 37.3°C (99.1°F), blood pressure is 128/74 mm Hg, pulse is 94/min, respirations are 18/min, and oxygen saturation is 96% on room air. Examination shows a distended, tympanitic abdomen with mild guarding but no rigidity, no rebound tenderness, and no peritoneal signs. The rectal vault is empty on digital examination. Plain films show a U-shaped distended sigmoid colon with a coffee bean sign and absence of rectal gas.\n\nLaboratory studies:\n  White blood cell count: 11,800/mm³\n  Lactate: 1.5 mmol/L\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "B", "text": "Upright abdominal radiograph with CT of the abdomen and pelvis"}, {"letter": "C", "text": "Ultrasound of the abdomen"}, {"letter": "D", "text": "Endoscopy of the colon"}, {"letter": "E", "text": "Clinical examination of the groin with ultrasound"}], "answer": "A", "explanation": "The coffee bean film is diagnostic in only 50–60% of cases, so it narrows the problem but does not settle it. Contrast-enhanced CT is confirmatory in about 90% and, just as important, shows whether the trapped segment is still viable before any attempt is made to untwist it.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B2", "pgroup": "B", "pstack": "A"}, {"id": "7A", "group": 7, "stem": "Which of the following results would this study most likely show?", "options": [{"letter": "A", "text": "A target sign with telescoped bowel at the ileocecal junction"}, {"letter": "B", "text": "A whirl pattern with bird-beak colonic segments"}, {"letter": "C", "text": "An obstructing colonic mass, with biopsy taken for malignancy"}, {"letter": "D", "text": "Fat and bowel contents within a soft, reducible sac"}, {"letter": "E", "text": "An appendiceal diameter above 6 mm with an occluded lumen and fat stranding"}], "answer": "B", "explanation": "Torsion of the bowel around its mesentery twists the vessels with it; the swirled mesenteric vessels produce the whirl pattern, and the tapered ends of the twisted segment produce the bird-beak appearance. Pneumatosis intestinalis or loss of bowel wall enhancement on the same study would indicate that the segment is no longer viable.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B2", "pgroup": "B", "pstack": "A"}, {"id": "7B", "group": 7, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Intussusception"}, {"letter": "B", "text": "Appendicitis"}, {"letter": "C", "text": "Small bowel obstruction"}, {"letter": "D", "text": "Abdominal hernia"}, {"letter": "E", "text": "Volvulus"}], "answer": "E", "explanation": "A chronically constipated older adult with a long, redundant colon, marked distention, an empty rectal vault, a U-shaped sigmoid with a coffee bean sign, and a whirl pattern on CT has sigmoid volvulus. Anticholinergic medication and immobility promote the slow transit and redundancy that allow the segment to twist.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B2", "pgroup": "B", "pstack": "A"}, {"id": "8", "group": 8, "stem": "A 72-year-old woman presents to the primary care clinic because she has had two bowel movements a week for the past year, with hard stool, straining at nearly every attempt, a sense that she has not fully emptied, and bloating. She eats little fiber, drinks little water, and rarely leaves the house. She takes amlodipine and a nightly iron tablet. She has had no blood in the stool, no rectal bleeding, no tenesmus, no unexplained weight loss, no jaundice, and no sudden change in bowel habits, and her colonoscopy 3 years ago was normal. Her temperature is 36.7°C (98.1°F), blood pressure is 134/78 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 97% on room air. Examination is normal, with a soft, nontender abdomen, no distention or mass, no fecal impaction on digital rectal examination, normal anal tone, and no mass. She meets the Rome IV criteria: onset more than 6 months ago, at least two qualifying symptoms in at least 25% of bowel movements over 3 months, loose stools rare without laxatives, and insufficient criteria for irritable bowel syndrome.\n\nLaboratory studies:\n  Potassium: 4.1 mEq/L\n  Thyroid-stimulating hormone: 2.2 µIU/mL\n  Glucose: 94 mg/dL\n  Lead level: Normal\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Colorectal transit (Sitz marker) study"}, {"letter": "B", "text": "Defecography with proctosigmoidoscopy"}, {"letter": "C", "text": "Pelvic floor MRI with anorectal manometry"}, {"letter": "D", "text": "Flexible sigmoidoscopy or colonoscopy"}, {"letter": "E", "text": "Fecal calprotectin with C-reactive protein and celiac serology"}], "answer": "A", "explanation": "The clinical criteria are met and the secondary causes have been excluded, so the next question is how the colon is actually moving. A marker study measures transit directly and separates slow colonic transit from an outlet problem, which determines whether pelvic floor testing is needed.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E1", "pgroup": "E", "pstack": "A"}, {"id": "8A", "group": 8, "stem": "Which of the following results would most likely be found?", "options": [{"letter": "A", "text": "A structural or functional defecatory abnormality, with mucosal disease excluded"}, {"letter": "B", "text": "Sphincter dysfunction or a pelvic floor defect"}, {"letter": "C", "text": "Retained markers scattered throughout the colon on day 5"}, {"letter": "D", "text": "No proximal source of bleeding identified"}, {"letter": "E", "text": "Hard impacted stool in the rectal vault"}], "answer": "C", "explanation": "Markers still spread along the whole colon on day 5 indicate that the colon itself is moving contents too slowly — colonic inertia. Accumulation of markers in the rectosigmoid instead would indicate outlet delay, and a normal balloon expulsion argues against anorectal dysfunction.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E1", "pgroup": "E", "pstack": "A"}, {"id": "8B", "group": 8, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Rectal prolapse"}, {"letter": "B", "text": "Irritable bowel syndrome"}, {"letter": "C", "text": "Fecal impaction"}, {"letter": "D", "text": "Chronic constipation"}, {"letter": "E", "text": "Fecal incontinence"}], "answer": "D", "explanation": "Fewer than three bowel movements a week for a year with hard stool, straining, and incomplete emptying, with the Rome IV criteria met, no red flags, a normal rectal examination, and normal potassium, thyroid-stimulating hormone, glucose, and lead, is chronic constipation. Her amlodipine and iron are both constipating medications, and the marker study shows slow colonic transit.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E1", "pgroup": "E", "pstack": "A"}, {"id": "9", "group": 9, "stem": "A 66-year-old man presents to the emergency department with abdominal pain that has come on gradually over 5 days, with marked distention and no passage of stool or flatus for 4 days. Over the past 3 months his bowel habits have changed, with narrowing stool caliber and intermittent blood; a colonoscopy was recommended 2 years ago and was never done. He has a history of diverticulosis. His temperature is 37.4°C (99.3°F), blood pressure is 132/80 mm Hg, pulse is 98/min, respirations are 18/min, and oxygen saturation is 96% on room air. Examination shows marked abdominal distention with tympany and hypoactive bowel sounds. A firm mass is palpable on rectal examination with dark blood on the glove. There is no rebound or guarding. An upright abdominal radiograph shows colonic dilation proximal to the obstruction with a dilated cecum, and CT of the abdomen and pelvis with contrast shows a transition point at a malignant-appearing stricture in the sigmoid colon with proximal colonic dilation.\n\nLaboratory studies:\n  White blood cell count: 13,800/mm³\n  Hemoglobin: 10.2 g/dL\n  Hematocrit: 31%\n  Mean corpuscular volume: 78 fL\n  Lactate: 1.8 mmol/L\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Endoscopy of the colon"}, {"letter": "B", "text": "Direct visualization at laparoscopy"}, {"letter": "C", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "D", "text": "Digital rectal examination"}, {"letter": "E", "text": "Serum potassium and magnesium levels"}], "answer": "A", "explanation": "Imaging has localized the obstruction but has not established what is causing it. Endoscopy both visualizes the obstructing lesion and allows tissue to be taken, which is what determines whether resection or a diverting ostomy is required. Cross-sectional imaging and the rectal examination have already been performed, and electrolytes do not characterize a mechanical lesion.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A2", "pgroup": "A", "pstack": "A"}, {"id": "9A", "group": 9, "stem": "Which of the following results would this study most likely show?", "options": [{"letter": "A", "text": "Irregular bands of scar tissue between loops of bowel"}, {"letter": "B", "text": "Hard impacted stool in the rectal vault"}, {"letter": "C", "text": "An obstructing colonic mass, with biopsy taken for malignancy"}, {"letter": "D", "text": "A whirl pattern with bird-beak colonic segments"}, {"letter": "E", "text": "Air throughout the colon and rectum with no transition point"}], "answer": "C", "explanation": "A change in bowel habits, narrowing stool caliber, iron-deficiency anemia, and a stricture at the transition point point to an obstructing neoplasm. Direct visualization identifies the mass and biopsy establishes malignancy.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A2", "pgroup": "A", "pstack": "A"}, {"id": "9B", "group": 9, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Small bowel obstruction"}, {"letter": "B", "text": "Volvulus"}, {"letter": "C", "text": "Fecal impaction"}, {"letter": "D", "text": "Large bowel obstruction"}, {"letter": "E", "text": "Adynamic (paralytic) ileus"}], "answer": "D", "explanation": "Colonic dilation proximal to an obstructing sigmoid lesion, with obstipation building over 4–5 days rather than 1–2 hours, is large bowel obstruction. Malignant tumors are its leading cause, and the colon is most often obstructed on the left. Small bowel obstruction produces dilated small-bowel loops with no colonic gas, and ileus produces air throughout the bowel with no transition point.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A2", "pgroup": "A", "pstack": "A"}, {"id": "10", "group": 10, "stem": "A 54-year-old man is brought to the emergency department with severe, diffuse abdominal pain that has worsened over 2 days, with nausea, vomiting, fever, and anorexia. He has cirrhosis with ascites and has been tapped twice in the past year. He has not had peritoneal dialysis, recent instrumentation, or a known perforated viscus. His temperature is 38.9°C (102.0°F), blood pressure is 98/58 mm Hg, pulse is 118/min, respirations are 24/min, and oxygen saturation is 95% on room air. Examination shows a tense, distended abdomen with shifting dullness, diffuse tenderness with involuntary guarding, near-rigidity, and rebound tenderness; he lies still and resists movement. An upright film and CT show ascites with no free air.\n\nLaboratory studies:\n  White blood cell count: 19,600/mm³ with a left shift\n  Lactate: 3.4 mmol/L\n  Creatinine: 1.7 mg/dL\n  Albumin: 2.4 g/dL\n  Blood cultures: Positive for E. coli\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis with contrast"}, {"letter": "B", "text": "Serum lactate and lactate dehydrogenase"}, {"letter": "C", "text": "Colonoscopy"}, {"letter": "D", "text": "Upright abdominal radiograph"}, {"letter": "E", "text": "Paracentesis"}], "answer": "E", "explanation": "Peritoneal signs in a patient with cirrhosis and ascites, without free air on imaging, point to infection of the ascitic fluid rather than a perforated viscus. Sampling the fluid is the only way to establish that, and it supplies the culture needed to narrow therapy. The imaging and the serum studies have already been done.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C1", "pgroup": "C", "pstack": "A"}, {"id": "10A", "group": 10, "stem": "Which of the following results would most likely be found?", "options": [{"letter": "A", "text": "An appendiceal diameter above 6 mm with an occluded lumen and fat stranding"}, {"letter": "B", "text": "An elevated polymorphonuclear cell count with a positive culture"}, {"letter": "C", "text": "Localized bowel wall thickening with peri-colonic fat stranding and colonic diverticula"}, {"letter": "D", "text": "Pale mucosa with petechial bleeding and bluish hemorrhagic nodules"}, {"letter": "E", "text": "A whirl pattern with bird-beak colonic segments"}], "answer": "B", "explanation": "Bacteria seeding ascitic fluid provoke a neutrophil response within the fluid itself, so the polymorphonuclear count rises and the culture grows the organism — most often an enteric gram-negative such as E. coli. That result is what allows empiric therapy to be narrowed.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C1", "pgroup": "C", "pstack": "A"}, {"id": "10B", "group": 10, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Peritonitis"}, {"letter": "B", "text": "Ischemic colitis"}, {"letter": "C", "text": "Appendicitis"}, {"letter": "D", "text": "Volvulus"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "A", "explanation": "Diffuse tenderness with involuntary guarding, near-rigidity, and rebound tenderness, together with fever, leukocytosis, an elevated lactate, and infected ascitic fluid, is peritonitis — here spontaneous bacterial peritonitis, since imaging shows no free air. Cirrhosis with ascites is one of the two settings that predispose to it.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C1", "pgroup": "C", "pstack": "A"}, {"id": "11", "group": 11, "stem": "A 34-year-old woman who is 32 weeks pregnant presents to the primary care clinic with bright red blood streaking her stool and marking the toilet paper immediately after every bowel movement for the past month, along with anal itching and a tender swelling she can feel at the anal verge, with painful bowel movements. She has been constipated throughout the pregnancy and strains, often sitting on the toilet for long stretches with her phone. She has had no weight loss, has no family history of colorectal cancer, and has had no change in stool caliber. Her temperature is 36.7°C (98.1°F), blood pressure is 112/68 mm Hg, pulse is 86/min, respirations are 16/min, and oxygen saturation is 99% on room air. Examination shows painful swollen perianal veins below the dentate line with an adjacent skin tag. Digital rectal examination is otherwise unremarkable. There is no fissure, no fluctuance, and no mass.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis"}, {"letter": "B", "text": "Anoscopy"}, {"letter": "C", "text": "Ultrasound of the perianal region"}, {"letter": "D", "text": "Examination of the perineum while she strains in the squatting position"}, {"letter": "E", "text": "Anal manometry with anorectal ultrasound"}], "answer": "B", "explanation": "The external component is visible, but internal hemorrhoids are usually not palpable on digital examination, so the anal canal above the dentate line has to be looked at directly. Anoscopy is the in-clinic study that does that.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F1", "pgroup": "F", "pstack": "A"}, {"id": "11A", "group": 11, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A posterior anal midline fissure with blood on the surface of the stool"}, {"letter": "B", "text": "An abscess cavity in the natal cleft superior to the anus"}, {"letter": "C", "text": "Full-thickness rectal wall protruding through the anal canal with concentric folds"}, {"letter": "D", "text": "An engorged hemorrhoidal plexus, internal above and external below the pectinate line"}, {"letter": "E", "text": "Reduced resting and squeeze pressure with an absent anal wink"}], "answer": "D", "explanation": "Straining, prolonged toilet sitting, chronic constipation, and pregnancy engorge the hemorrhoidal plexus on both sides of the pectinate line. The internal component bleeds painlessly; the external component below the line is what makes the swelling painful and itchy.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F1", "pgroup": "F", "pstack": "A"}, {"id": "11B", "group": 11, "stem": "Which of the following tests would most directly exclude another source for this patient's bleeding?", "options": [{"letter": "A", "text": "Pelvic floor MRI with anorectal manometry"}, {"letter": "B", "text": "Defecography with proctosigmoidoscopy"}, {"letter": "C", "text": "Ultrasound of the perianal region"}, {"letter": "D", "text": "CT of the abdomen and pelvis"}, {"letter": "E", "text": "Flexible sigmoidoscopy or colonoscopy"}], "answer": "E", "explanation": "Bright red rectal bleeding must not simply be attributed to hemorrhoids that happen to be visible. Endoscopic examination of the colon establishes that no proximal lesion is responsible, and skipping it is how a more proximal source is missed.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F1", "pgroup": "F", "pstack": "A"}, {"id": "11C", "group": 11, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Fecal incontinence"}, {"letter": "B", "text": "Anal fissure"}, {"letter": "C", "text": "Hemorrhoids"}, {"letter": "D", "text": "Pilonidal cyst / abscess"}, {"letter": "E", "text": "Rectal prolapse"}], "answer": "C", "explanation": "Bright red blood streaking the stool immediately after a bowel movement with anal itching, plus a tender swollen perianal area and painful bowel movements, is the combined internal and external hemorrhoid picture: internal disease produces painless bleeding, and an external component adds pain and itching.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F1", "pgroup": "F", "pstack": "A"}, {"id": "12", "group": 12, "stem": "An 11-month-old boy is brought to the emergency department by his parents because he has had sudden episodes of screaming and drawing his legs to his chest every 15 to 20 minutes since this morning, with vomiting in between and long stretches in which he lies quietly and seems drained. He had a viral upper respiratory illness 2 weeks ago and is otherwise well, fully vaccinated, and has had no prior abdominal surgery. His mother noticed dark red, jelly-like stool in his diaper an hour ago. His temperature is 37.4°C (99.3°F), pulse is 156/min, respirations are 36/min, blood pressure is 86/50 mm Hg, and oxygen saturation is 98% on room air. Examination shows a lethargic infant between episodes, a sausage-shaped mass in the right upper quadrant, mild abdominal distention, and red currant jelly stool on the diaper. There are no peritoneal signs. An abdominal radiograph shows features resembling a small bowel obstruction with a paucity of right-sided gas.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Upright abdominal radiograph with CT of the abdomen and pelvis"}, {"letter": "B", "text": "Ultrasound of the abdomen"}, {"letter": "C", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "D", "text": "Plain abdominal films followed by CT of the abdomen with contrast"}, {"letter": "E", "text": "Endoscopy of the colon"}], "answer": "B", "explanation": "Ultrasound is the first-line study in a child with colicky pain, a palpable abdominal mass, and currant jelly stool; it directly shows telescoped bowel. Contrast-enhanced cross-sectional imaging is reserved for adults, and the plain film has already been obtained.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B1", "pgroup": "B", "pstack": "A"}, {"id": "12A", "group": 12, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "A U-shaped distended sigmoid colon with a coffee bean sign and absent rectal gas"}, {"letter": "B", "text": "Fat and bowel contents within a soft, reducible sac"}, {"letter": "C", "text": "A target sign with telescoped bowel at the ileocecal junction"}, {"letter": "D", "text": "Dilated small-bowel loops with air-fluid levels and no colonic gas"}, {"letter": "E", "text": "An appendiceal diameter above 6 mm with an occluded lumen and fat stranding"}], "answer": "C", "explanation": "One segment of bowel telescopes into the segment beyond it, and the concentric rings of the invaginated loop within the receiving loop produce the target sign in cross-section. Most occur near the ileocecal junction.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B1", "pgroup": "B", "pstack": "A"}, {"id": "12B", "group": 12, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Volvulus"}, {"letter": "B", "text": "Abdominal hernia"}, {"letter": "C", "text": "Appendicitis"}, {"letter": "D", "text": "Intussusception"}, {"letter": "E", "text": "Large bowel obstruction"}], "answer": "D", "explanation": "Colicky pain every 15 to 20 minutes with lethargy between episodes, a sausage-shaped right upper quadrant mass, red currant jelly stool, and a target sign on ultrasound in an infant is intussusception. It is the most common abdominal emergency of childhood and is usually idiopathic, without a pathologic lead point.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B1", "pgroup": "B", "pstack": "A"}, {"id": "13", "group": 13, "stem": "An 84-year-old woman has fecal incontinence from an anterior external sphincter defect with reduced resting and squeeze pressures. Her rectal examination shows no palpable impaction and no mass. She also has urinary incontinence.\n\nWhich of the following best describes the appropriate use of loperamide in this patient?", "options": [{"letter": "A", "text": "Withhold loperamide and reassure her that incontinence is expected at 84 years of age"}, {"letter": "B", "text": "Begin loperamide without a rectal examination, since her history is typical"}, {"letter": "C", "text": "Begin loperamide only after defecography has been performed"}, {"letter": "D", "text": "Begin loperamide only if amitriptyline fails"}, {"letter": "E", "text": "Begin loperamide after a rectal examination has confirmed that there is no fecal impaction"}], "answer": "E", "explanation": "Fecal impaction with leakage around solid stool is the most common cause of incontinence in the elderly, and loperamide given to an impacted patient worsens the impaction it is being prescribed for — so the rectal examination must come first. Hers is clear, so loperamide may be used alongside fiber, bulking agents, and bowel training. Incontinence should not be considered a normal part of aging, and amitriptyline may help when urinary and fecal incontinence coexist.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E2", "pgroup": "E", "pstack": "B"}, {"id": "14", "group": 14, "stem": "A 64-year-old man presents to the emergency department with sudden left lower quadrant pain that has progressed over 3 days, with low-grade fever, alternating constipation and loose stools, nausea, one episode of vomiting, and some urinary frequency. He has had two prior episodes of diverticulitis, the last 3 years ago, eats a low-fiber diet, and smokes. He has had no hematochezia, is not immunosuppressed, has no significant comorbidity, and is tolerating oral intake. His temperature is 38.2°C (100.8°F), blood pressure is 128/78 mm Hg, pulse is 94/min, respirations are 16/min, and oxygen saturation is 97% on room air. Examination shows left lower quadrant tenderness with mild bloating and distention. There is no guarding, rebound, or rigidity, bowel sounds are present, no mass is palpable, and there is no blood on rectal examination.\n\nLaboratory studies:\n  White blood cell count: 12,600/mm³\n  Hemoglobin: 13.8 g/dL\n  C-reactive protein: 96 mg/L\n  Blood urea nitrogen: 18 mg/dL\n  Creatinine: 1.0 mg/dL\n  Urinalysis: Sterile pyuria\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "B", "text": "Digital rectal examination with anoscopy"}, {"letter": "C", "text": "Colonoscopy"}, {"letter": "D", "text": "Flexible sigmoidoscopy"}, {"letter": "E", "text": "Upright abdominal radiograph with CT of the abdomen and pelvis"}], "answer": "A", "explanation": "Contrast-enhanced CT of the abdomen and pelvis is the preferred initial study for acute left lower quadrant pain with fever and leukocytosis: it shows the inflamed segment and whether perforation, abscess, fistula, or obstruction is present, which is what separates outpatient from inpatient management. Colonoscopy belongs 6–8 weeks after the episode has resolved.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D2", "pgroup": "D", "pstack": "A"}, {"id": "14A", "group": 14, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Multiple colonic diverticula without inflammation, with a normal white cell count"}, {"letter": "B", "text": "Localized bowel wall thickening with peri-colonic fat stranding and colonic diverticula"}, {"letter": "C", "text": "Thumbprinting — segmental bowel wall thickening at a watershed area"}, {"letter": "D", "text": "Colonic dilation proximal to a malignant-appearing transition point"}, {"letter": "E", "text": "An appendiceal diameter above 6 mm with an occluded lumen and fat stranding"}], "answer": "B", "explanation": "Inflammation of a diverticulum thickens the adjacent bowel wall and inflames the surrounding fat, producing pericolonic stranding around a segment that already contains diverticula. The absence of perforation, abscess, fistula, and obstruction defines the episode as uncomplicated.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D2", "pgroup": "D", "pstack": "A"}, {"id": "14B", "group": 14, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Diverticulosis"}, {"letter": "B", "text": "Ischemic colitis"}, {"letter": "C", "text": "Appendicitis"}, {"letter": "D", "text": "Diverticulitis"}, {"letter": "E", "text": "Large bowel obstruction"}], "answer": "D", "explanation": "Sudden, progressive left lower quadrant pain with fever, leukocytosis, and pericolonic fat stranding around diverticula in a patient with prior episodes is acute diverticulitis. His urinary frequency and sterile pyuria reflect bladder irritation by the inflamed sigmoid, which occurs in 10–15% of patients.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D2", "pgroup": "D", "pstack": "A"}, {"id": "15", "group": 15, "stem": "A 71-year-old woman is admitted with a simple small bowel obstruction. CT of the abdomen and pelvis shows a transition point in the mid-ileum with proximal distention and distal collapse and no discrete mass. There is no free air under the diaphragm, her lactate is 1.4 mmol/L, and her white cell count is 12,100/mm³. She is placed on bowel rest with nasogastric decompression, intravenous fluids, and serial films and laboratory studies.\n\nWhich of the following best describes the appropriate use of antibiotics in this patient?", "options": [{"letter": "A", "text": "Reserve antibiotics for patients whose white cell count exceeds 12,000/mm³"}, {"letter": "B", "text": "Reserve antibiotics for patients whose obstruction has been present for more than two days"}, {"letter": "C", "text": "Reserve antibiotics for patients who require nasogastric decompression"}, {"letter": "D", "text": "Reserve antibiotics for obstruction caused by adhesions"}, {"letter": "E", "text": "Reserve antibiotics for obstruction complicated by strangulation, ischemia, or perforation"}], "answer": "E", "explanation": "A simple obstruction is a mechanical problem, not an infectious one, and antibiotics treat nothing. Broad-spectrum coverage — ciprofloxacin or a cephalosporin plus metronidazole, or piperacillin-tazobactam — belongs to the complicated obstruction, where strangulation, ischemia, or perforation is present. A mildly elevated white cell count, the duration of symptoms, and the presence of a nasogastric tube do not change that.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A1", "pgroup": "A", "pstack": "B"}, {"id": "16", "group": 16, "stem": "A 19-year-old man presents to the emergency department with a painful swelling in the crease above his buttocks for 5 days, worsening and now draining a small amount of foul-smelling fluid. The skin over it is red and he cannot sit comfortably. He drives a delivery truck and sits for long stretches, is obese with a body mass index of 34, and is heavily hirsute over the lower back. He has had no prior episode, has no diabetes, is not immunosuppressed, and had no fever at home. His temperature is 37.8°C (100.0°F), blood pressure is 124/74 mm Hg, pulse is 88/min, respirations are 16/min, and oxygen saturation is 99% on room air. Examination shows tenderness and overlying erythema in the natal cleft superior to the anus, with surrounding cellulitis extending roughly 2 cm. The anus, anal canal, and perianal skin are normal, with no fissure and no hemorrhoids.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Colonoscopy"}, {"letter": "B", "text": "Anoscopy"}, {"letter": "C", "text": "Ultrasound of the natal cleft"}, {"letter": "D", "text": "Anal manometry with anorectal ultrasound"}, {"letter": "E", "text": "Examination of the perineum while the patient strains in the squatting position"}], "answer": "C", "explanation": "The diagnosis is clinical, and ultrasound is used to assist visualization — it shows whether there is a drainable fluid collection beneath the inflamed skin and how far it extends. Anorectal studies are not indicated when the anus and anal canal are normal.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F3", "pgroup": "F", "pstack": "A"}, {"id": "16A", "group": 16, "stem": "Which of the following additional test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "An abscess cavity in the natal cleft superior to the anus, with surrounding inflammation"}, {"letter": "B", "text": "Full-thickness rectal wall protruding through the anal canal with concentric folds"}, {"letter": "C", "text": "An engorged hemorrhoidal plexus above or below the pectinate line"}, {"letter": "D", "text": "A posterior anal midline fissure with blood on the surface of the stool"}, {"letter": "E", "text": "Multiple colonic diverticula without inflammation"}], "answer": "A", "explanation": "An obstructed hair follicle becomes infected and ruptures into the subcutaneous tissue, forming an abscess cavity in the natal cleft; imaging shows that fluid collection with surrounding inflammation. Ninety-nine percent of these lesions are truly abscesses rather than cysts.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F3", "pgroup": "F", "pstack": "A"}, {"id": "16B", "group": 16, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Fecal incontinence"}, {"letter": "B", "text": "Pilonidal cyst / abscess"}, {"letter": "C", "text": "Hemorrhoids"}, {"letter": "D", "text": "Anal fissure"}, {"letter": "E", "text": "Rectal prolapse"}], "answer": "B", "explanation": "A painful, erythematous, draining swelling in the natal cleft superior to the anus, in an obese, hirsute young man who sits for long periods, is a pilonidal abscess. The natal cleft runs from just below the sacrum to the perineum, above the anus, which is what separates it from every anal lesion; his anal canal is normal.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F3", "pgroup": "F", "pstack": "A"}, {"id": "17", "group": 17, "stem": "A 73-year-old woman presents to the emergency department with rapid-onset crampy left-sided abdominal pain that began 8 hours ago, followed within a few hours by bloody diarrhea with maroon blood and tenesmus. She had a myocardial infarction 6 weeks ago and takes digoxin for atrial fibrillation. She has hypertension, diabetes, and known atherosclerosis, and she was hypotensive during a dialysis session 2 days ago. Her temperature is 37.6°C (99.7°F), blood pressure is 108/64 mm Hg, pulse is 102/min, respirations are 18/min, and oxygen saturation is 96% on room air. Examination shows left lower quadrant tenderness with pain out of proportion to the examination, no rigidity, and minimal guarding. There is maroon blood on rectal examination. CT of the abdomen with intravenous contrast shows thumbprinting — segmental bowel wall thickening at the splenic flexure — with rectal sparing.\n\nLaboratory studies:\n  White blood cell count: 13,400/mm³\n  Hemoglobin: 11.6 g/dL\n  Hematocrit: 35%\n  Lactate: 2.2 mmol/L\n  Lactate dehydrogenase: 310 U/L\n  Arterial pH: 7.36\n\nWhich of the following tests would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "Paracentesis"}, {"letter": "B", "text": "Plain abdominal radiographs"}, {"letter": "C", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "D", "text": "Colonoscopy"}, {"letter": "E", "text": "Upright abdominal radiograph with CT of the abdomen and pelvis"}], "answer": "D", "explanation": "Thumbprinting is not specific for ischemia, so imaging alone should not close the workup; it is the location together with the symptoms and risk factors that makes the diagnosis. Direct visualization of the mucosa in the affected segment is what confirms it and defines its extent.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C2", "pgroup": "C", "pstack": "A"}, {"id": "17A", "group": 17, "stem": "Which of the following results would most likely be found?", "options": [{"letter": "A", "text": "Localized bowel wall thickening with peri-colonic fat stranding and colonic diverticula"}, {"letter": "B", "text": "An elevated polymorphonuclear cell count with a positive culture"}, {"letter": "C", "text": "Pale mucosa with petechial bleeding and bluish hemorrhagic nodules"}, {"letter": "D", "text": "A whirl pattern with bird-beak colonic segments"}, {"letter": "E", "text": "An appendiceal diameter above 6 mm with an occluded lumen and fat stranding"}], "answer": "C", "explanation": "Reduced perfusion blanches the mucosa and ruptures small submucosal vessels, producing petechiae and bluish hemorrhagic nodules in a segmental distribution with an abrupt transition, and the rectum is spared.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C2", "pgroup": "C", "pstack": "A"}, {"id": "17B", "group": 17, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Peritonitis"}, {"letter": "B", "text": "Diverticulitis"}, {"letter": "C", "text": "Appendicitis"}, {"letter": "D", "text": "Volvulus"}, {"letter": "E", "text": "Ischemic colitis"}], "answer": "E", "explanation": "Crampy left-sided pain out of proportion to the examination, followed within hours by maroon bleeding, in an older patient with recent myocardial infarction, atherosclerosis, diabetes, and a hypotensive dialysis session, is colonic ischemia. The splenic flexure is a watershed area, and segmental thumbprinting there with rectal sparing matches that vascular territory. A normal pH and a white cell count below 20,000 argue against infarction.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C2", "pgroup": "C", "pstack": "A"}, {"id": "18", "group": 18, "stem": "A 47-year-old man presents to the emergency department with the fourth episode in 2 years of crampy abdominal pain with distention and vomiting; each previous episode settled after a day or two in hospital. He had a ruptured appendix treated with an open laparotomy at age 19 and a second operation for a perforated ulcer at age 34. He has had no pelvic radiation, has no hernia, and has no history of malignancy. His temperature is 37.1°C (98.8°F), blood pressure is 128/78 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 98% on room air. Examination shows abdominal distention with mild diffuse tenderness and multiple surgical scars. There is no palpable mass, no hernia, and no peritoneal signs. CT of the abdomen and pelvis shows a transition point without a discrete mass in the mid-small bowel.\n\nLaboratory studies:\n  White blood cell count: 10,600/mm³\n  Lactate: 1.2 mmol/L\n\nWhich of the following tests would most directly confirm the underlying cause of this patient's obstruction?", "options": [{"letter": "A", "text": "Direct visualization at laparoscopy"}, {"letter": "B", "text": "Upright abdominal radiograph with serum potassium and magnesium"}, {"letter": "C", "text": "CT of the abdomen with intravenous contrast"}, {"letter": "D", "text": "Endoscopy of the colon"}, {"letter": "E", "text": "Digital rectal examination"}], "answer": "A", "explanation": "Imaging is explicitly unreliable in this setting: a transition point without a mass does not identify what is obstructing the bowel, and a normal study would not exclude it. Direct visualization is what actually establishes the diagnosis, which is why a history of repeated obstructive episodes after abdominal surgery should drive the decision rather than the film.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A4", "pgroup": "A", "pstack": "A"}, {"id": "18A", "group": 18, "stem": "Which of the following results would this study most likely show?", "options": [{"letter": "A", "text": "An obstructing colonic mass, with biopsy taken for malignancy"}, {"letter": "B", "text": "A whirl pattern with bird-beak colonic segments"}, {"letter": "C", "text": "Hard impacted stool in the rectal vault"}, {"letter": "D", "text": "Irregular bands of scar tissue between loops of bowel"}, {"letter": "E", "text": "Air throughout the colon and rectum with no transition point"}], "answer": "D", "explanation": "Adhesions are irregular bands of scar tissue joining loops of bowel that are not normally bound together. They form after surgery, infection, trauma, radiation, or inflammation — this patient has had two laparotomies and a ruptured appendix — and they are seen rather than imaged.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A4", "pgroup": "A", "pstack": "A"}, {"id": "18B", "group": 18, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Fecal impaction"}, {"letter": "B", "text": "Adhesions"}, {"letter": "C", "text": "Large bowel obstruction"}, {"letter": "D", "text": "Adynamic (paralytic) ileus"}, {"letter": "E", "text": "Volvulus"}], "answer": "B", "explanation": "Recurrent obstructive episodes in a patient with prior abdominal operations, a transition point with no discrete mass, and bands of scar tissue on direct visualization identify adhesive obstruction. Adhesions are the single most common cause of small bowel obstruction.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A4", "pgroup": "A", "pstack": "A"}, {"id": "19", "group": 19, "stem": "A 68-year-old woman presents to the primary care clinic because of a painless mass that protrudes from the anus when she strains or has a bowel movement, for about a year. At first it reduced on its own; now it has to be pushed back. She has a sense of incomplete evacuation with constipation, mucus discharge, occasional bright red blood, and some fecal soiling. She has had five vaginal deliveries, has strained chronically with longstanding constipation, and had a hysterectomy at 52. She has no cystic fibrosis and no chronic diarrhea. Her temperature is 36.7°C (98.1°F), blood pressure is 130/76 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 97% on room air. Digital rectal examination shows decreased sphincter tone. There is no incarceration and no ulceration.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Assessment against the Rome IV criteria"}, {"letter": "B", "text": "Digital rectal examination with anal manometry and anorectal ultrasound"}, {"letter": "C", "text": "Examination of the perineum and rectum while she strains in the squatting position"}, {"letter": "D", "text": "Digital rectal examination with anoscopy"}, {"letter": "E", "text": "Fecal calprotectin with C-reactive protein and celiac serology"}], "answer": "C", "explanation": "The lesion appears only when she strains, so it has to be looked for under those conditions; examining the perineum and rectum while the patient strains or squats is the diagnostic manoeuvre. Colonoscopy is done per screening guidelines but does not make this diagnosis, and ordering one instead delays the answer.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E3", "pgroup": "E", "pstack": "A"}, {"id": "19A", "group": 19, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Reduced resting and squeeze pressure with an absent anal wink"}, {"letter": "B", "text": "Rome IV criteria met, with normal potassium, thyroid-stimulating hormone, glucose, and lead"}, {"letter": "C", "text": "Hard impacted stool in the rectal vault"}, {"letter": "D", "text": "An engorged hemorrhoidal plexus above or below the pectinate line"}, {"letter": "E", "text": "Full-thickness rectal wall protruding through the anal canal with concentric folds"}], "answer": "E", "explanation": "When the entire rectal wall descends through the anal canal, the mucosa is thrown into concentric, stacked-coin rings and all four layers are palpable. Radial folds instead would indicate a mucosal-only prolapse, which is treated differently.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E3", "pgroup": "E", "pstack": "A"}, {"id": "19B", "group": 19, "stem": "Which of the following tests would most directly confirm the extent of this patient's disorder?", "options": [{"letter": "A", "text": "Pelvic floor MRI with anorectal manometry"}, {"letter": "B", "text": "Balloon expulsion testing"}, {"letter": "C", "text": "Flexible sigmoidoscopy or colonoscopy"}, {"letter": "D", "text": "Fecal calprotectin with C-reactive protein and celiac serology"}, {"letter": "E", "text": "Colorectal transit (Sitz marker) study"}], "answer": "A", "explanation": "Manometry and pelvic floor imaging characterize the sphincter dysfunction and the pelvic floor defect underlying the descent, and defecography distinguishes a mucosal from a complete prolapse. Manometry is specifically indicated because she has fecal soiling.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E3", "pgroup": "E", "pstack": "A"}, {"id": "19C", "group": 19, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Hemorrhoids"}, {"letter": "B", "text": "Chronic constipation"}, {"letter": "C", "text": "Fecal incontinence"}, {"letter": "D", "text": "Rectal prolapse"}, {"letter": "E", "text": "Fecal impaction"}], "answer": "D", "explanation": "A painless mass protruding from the anus on straining, with concentric stacked-coin folds and all four layers palpable, is full-thickness rectal
