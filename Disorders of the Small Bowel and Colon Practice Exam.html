 prolapse. Weak ligaments and muscles holding the rectum in place — a pelvic floor disorder — allow the wall to descend; multiparity, chronic straining, and prior pelvic surgery are her risk factors.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E3", "pgroup": "E", "pstack": "A"}, {"id": "20", "group": 20, "stem": "A 39-year-old man presents to the primary care clinic because of a bulge in the right groin for 6 months that appears when he lifts at work or coughs and disappears when he lies down. He has a dull dragging discomfort at the site that is aggravated by activity. He works in construction lifting heavy loads and has a chronic cough from smoking. He has had no prior abdominal surgery. His temperature is 36.7°C (98.1°F), blood pressure is 124/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 98% on room air. Examination shows a soft bulge in the right inguinal region that enlarges with Valsalva and reduces easily with gentle pressure. There is no overlying erythema, and the bulge is neither tender nor firm. The abdomen is otherwise soft and nondistended with normal bowel sounds.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "B", "text": "Endoscopy of the colon"}, {"letter": "C", "text": "Ultrasound of the groin"}, {"letter": "D", "text": "Upright abdominal radiograph with CT of the abdomen and pelvis"}, {"letter": "E", "text": "Plain abdominal films followed by CT of the abdomen with contrast"}], "answer": "C", "explanation": "The diagnosis is clinical, and ultrasound is the imaging study that confirms it at the bedside by showing what the sac contains and whether it reduces. CT or MRI is reserved for cases that remain unclear, and studies aimed at bowel obstruction are not needed in a patient whose abdomen is soft and nondistended.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B3", "pgroup": "B", "pstack": "A"}, {"id": "20A", "group": 20, "stem": "Which of the following initial test results would most likely be present in this patient?", "options": [{"letter": "A", "text": "Fat and bowel contents within a soft, reducible sac"}, {"letter": "B", "text": "A target sign with telescoped bowel at the ileocecal junction"}, {"letter": "C", "text": "A U-shaped distended sigmoid colon with a coffee bean sign and absent rectal gas"}, {"letter": "D", "text": "Dilated small-bowel loops with air-fluid levels and no colonic gas"}, {"letter": "E", "text": "An appendiceal diameter above 6 mm with an occluded lumen and fat stranding"}], "answer": "A", "explanation": "A hernia is a protrusion of contents through a weakened wall, so the study shows abdominal fat and bowel within the sac, moving back into the abdomen with gentle pressure. Free reduction indicates that the contents are not trapped.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B3", "pgroup": "B", "pstack": "A"}, {"id": "20B", "group": 20, "stem": "Which of the following diagnoses best explains this patient's presentation?", "options": [{"letter": "A", "text": "Intussusception"}, {"letter": "B", "text": "Volvulus"}, {"letter": "C", "text": "Small bowel obstruction"}, {"letter": "D", "text": "Appendicitis"}, {"letter": "E", "text": "Abdominal hernia"}], "answer": "E", "explanation": "A soft, reducible groin bulge that enlarges with Valsalva and disappears when he lies down, in a man who lifts heavy loads and coughs chronically, is an abdominal wall hernia. Increased intra-abdominal pressure drives contents through a point of weakness; there is no obstruction, since the abdomen is soft with normal bowel sounds.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B3", "pgroup": "B", "pstack": "A"}, {"id": "21", "group": 21, "stem": "A 68-year-old woman has diverticulosis with diverticular bleeding. Colonoscopy showed multiple sigmoid diverticula without inflammation and no mass. Her bleeding has stopped, and her abdomen is soft and nontender. She has been constipated for years and eats little fiber.\n\nWhich of the following dietary recommendations is most appropriate?", "options": [{"letter": "A", "text": "A high-fiber diet, avoiding nuts, seeds, and berries"}, {"letter": "B", "text": "A high-fiber diet, with no restriction on nuts, seeds, or berries"}, {"letter": "C", "text": "A low-fiber diet, avoiding nuts, seeds, and berries"}, {"letter": "D", "text": "A low-residue diet, with no restriction on nuts, seeds, or berries"}, {"letter": "E", "text": "Clear liquids for 24–72 hours, followed by a low-residue diet"}], "answer": "B", "explanation": "The advice that patients with diverticula must avoid nuts, seeds, and berries is not supported by research, and repeating it delays the change that actually helps. A high-fiber diet with increased fluids and exercise is the treatment. Clear liquids followed by a low-residue diet belong to an acute attack of diverticulitis, not to uncomplicated diverticulosis.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D1", "pgroup": "D", "pstack": "B"}, {"id": "22", "group": 22, "stem": "A 16-year-old boy has uncomplicated appendicitis. CT shows an appendiceal diameter of 9 mm with an occluded lumen, wall thickening of 3 mm, and peri-appendiceal fat stranding, with no appendicolith and no perforation or abscess. He is tolerating oral intake. His white cell count is 13,200/mm³ and his C-reactive protein is 48 mg/L.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Endoscopic de-torsion with a flexible sigmoidoscope"}, {"letter": "B", "text": "Clear liquids with selective antibiotics — ciprofloxacin plus metronidazole"}, {"letter": "C", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "D", "text": "Bowel rest with intravenous fluids, stopping digoxin, and ciprofloxacin plus metronidazole"}, {"letter": "E", "text": "Surgical consultation with empiric piperacillin-tazobactam, then culture-targeted therapy"}], "answer": "C", "explanation": "Appendectomy, open or laparoscopic, with pre-operative intravenous antibiotics is the standard of care. A non-operative antibiotic pathway exists for uncomplicated disease, but 15–49% of those patients have recurrent symptoms and eventually come to appendectomy, and it is not an option at all when there is a fecalith, age over 45, or malignancy risk. Delay raises the risk of perforation.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C3", "pgroup": "C", "pstack": "B"}, {"id": "23", "group": 23, "stem": "A 58-year-old woman on postoperative day 3 after an open abdominal hysterectomy has an adynamic ileus. Her abdominal radiograph shows air throughout the gastrointestinal tract including the colon and rectum with no transition point. Her potassium is 2.9 mEq/L and her magnesium is 1.3 mg/dL. She is afebrile, is not tachycardic, has no peritoneal signs, and is taking scheduled oxycodone for incisional pain.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Nasogastric suction, early ambulation, and repletion of potassium and magnesium"}, {"letter": "B", "text": "Bowel rest with nasogastric decompression and intravenous fluids"}, {"letter": "C", "text": "NPO with nasogastric decompression, intravenous fluids, and surgical consultation"}, {"letter": "D", "text": "Endoscopic de-torsion with a flexible sigmoidoscope"}, {"letter": "E", "text": "Manual disimpaction with enemas and laxatives"}], "answer": "A", "explanation": "Treatment of ileus is directed at its causes: mobilize the patient, replace potassium and magnesium, and limit the narcotics that are perpetuating the paralysis. Chewing gum is a useful adjunct. Taking a functional ileus to the operating room because dilated loops mimic obstruction is the harm to avoid — quiet bowel sounds, mild diffuse pain, no peritoneal signs, and no fever or tachycardia are what separate the two.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A3", "pgroup": "A", "pstack": "B"}, {"id": "24", "group": 24, "stem": "A 41-year-old man has a chronic posterior midline anal fissure. After increased fiber, increased fluids, sitz baths, and stool softeners, he continues to have tearing pain with every bowel movement. He takes sildenafil for erectile dysfunction.\n\nWhich of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Surgical repair of the pelvic floor"}, {"letter": "B", "text": "Nitroglycerin ointment applied to the anal canal"}, {"letter": "C", "text": "Incision and drainage with unroofing and curettage"}, {"letter": "D", "text": "Botulinum toxin injection into the internal sphincter"}, {"letter": "E", "text": "Rubber band ligation of the internal hemorrhoids"}], "answer": "D", "explanation": "Nitroglycerin ointment is the usual second-line agent because it increases local blood flow and decreases internal sphincter pressure, but it must be avoided in a patient taking an erectile dysfunction medication because the combination risks hypotension. Botulinum toxin injected into the internal sphincter achieves the same reduction in sphincter tone and lasts about 3 months.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F2", "pgroup": "F", "pstack": "B"}, {"id": "25", "group": 25, "stem": "A 72-year-old woman has chronic constipation with slow colonic transit. Red flags have been excluded, her potassium, thyroid-stimulating hormone, glucose, and lead are normal, and her rectal examination shows no impaction. She takes amlodipine and a nightly iron tablet.\n\nWhich of the following is the most appropriate initial management?", "options": [{"letter": "A", "text": "Surgical repair, with fiber and stool softeners"}, {"letter": "B", "text": "Increase dietary fiber, water, and activity, and begin a bulk-forming laxative"}, {"letter": "C", "text": "Increase fiber, decrease caffeine, and begin bowel training with a bulking agent"}, {"letter": "D", "text": "Manual disimpaction with enemas and laxatives"}, {"letter": "E", "text": "A low FODMAP diet with avoidance of fatty and spicy foods, alcohol, and caffeine"}], "answer": "B", "explanation": "Increasing dietary fiber is first line, together with more water and more activity; bulk-forming agents such as psyllium and methylcellulose are added next and are generally the safest laxatives. Her amlodipine and iron are both on the constipating-medication list and should be reviewed rather than left in place while laxatives are stacked on top of them.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E1", "pgroup": "E", "pstack": "B"}, {"id": "25A", "group": 25, "stem": "Despite increased dietary fiber, water, and activity and daily psyllium, she continues to have two bowel movements a week with hard stool and straining. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Methylcellulose"}, {"letter": "B", "text": "Loperamide"}, {"letter": "C", "text": "Senna"}, {"letter": "D", "text": "Bisacodyl"}, {"letter": "E", "text": "Polyethylene glycol"}], "answer": "E", "explanation": "Osmotic agents such as polyethylene glycol, sorbitol, and lactulose are the second-line step once fiber and a bulk-forming agent have failed. Stimulant laxatives such as senna and bisacodyl carry a risk of hypokalemia and dependence and are not for chronic use, methylcellulose is another bulk-forming agent, and loperamide slows the bowel further.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E1", "pgroup": "E", "pstack": "B"}, {"id": "26", "group": 26, "stem": "A 78-year-old man has sigmoid volvulus. CT of the abdomen with contrast shows a whirl pattern with bird-beak colonic segments, no pneumatosis intestinalis, and preserved bowel wall enhancement. He has no rebound tenderness and no peritoneal signs.\n\nWhich of the following is the most appropriate initial management?", "options": [{"letter": "A", "text": "Bowel rest with nasogastric decompression and intravenous fluids"}, {"letter": "B", "text": "Non-operative reduction by air or contrast enema, with intravenous fluids"}, {"letter": "C", "text": "Gentle manual reduction, with observation"}, {"letter": "D", "text": "Endoscopic de-torsion with a flexible sigmoidoscope"}, {"letter": "E", "text": "Appendectomy with pre-operative intravenous antibiotics"}], "answer": "D", "explanation": "Endoscopic de-torsion is the initial treatment for sigmoid volvulus, but only once CT has shown that the segment is viable. Pneumatosis intestinalis or loss of wall enhancement means the bowel is dead, and untwisting it endoscopically rather than operating is the error; perforation or peritonitis likewise requires emergent resection.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B2", "pgroup": "B", "pstack": "B"}, {"id": "27", "group": 27, "stem": "A 71-year-old woman with a simple small bowel obstruction is improving on bowel rest, nasogastric decompression, and intravenous fluids. She asks whether she is going to need an operation.\n\nWhich of the following is the most appropriate response?", "options": [{"letter": "A", "text": "About one in four patients with small bowel obstruction eventually requires surgery"}, {"letter": "B", "text": "Every patient with small bowel obstruction eventually requires surgery"}, {"letter": "C", "text": "Surgery is required only when the obstruction is caused by adhesions"}, {"letter": "D", "text": "Surgery is required only when free air is seen under the diaphragm"}, {"letter": "E", "text": "Surgery is almost never required once a nasogastric tube has been placed"}], "answer": "A", "explanation": "About 25% of patients with small bowel obstruction ultimately require an operation; the remainder resolve with decompression and fluid resuscitation. Free air means perforation and mandates surgery, but it is not the only indication, and outcome depends on the cause, the patient's age and comorbidities, the timeliness of treatment, and the extent of bowel damage.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A1", "pgroup": "A", "pstack": "C"}, {"id": "28", "group": 28, "stem": "A 64-year-old man has uncomplicated acute diverticulitis. CT shows localized bowel wall thickening with peri-colonic fat stranding and sigmoid diverticula, with no perforation, abscess, fistula, or obstruction. He is immunocompetent, has no significant comorbidity, is tolerating oral intake, and is not vomiting. His white cell count is 12,600/mm³ and his C-reactive protein is 96 mg/L.\n\nWhich of the following is the most appropriate outpatient management?", "options": [{"letter": "A", "text": "Clear liquids with ciprofloxacin plus metronidazole started now"}, {"letter": "B", "text": "Clear liquids with amoxicillin/clavulanate 875/125 three times daily started now"}, {"letter": "C", "text": "Clear liquids, withholding antibiotics unless a treatment threshold is crossed"}, {"letter": "D", "text": "Clear liquids with intravenous piperacillin-tazobactam and hospital admission"}, {"letter": "E", "text": "Clear liquids with oral oxycodone for pain and no antibiotics"}], "answer": "C", "explanation": "Antibiotics are used selectively rather than routinely, and recent evidence shows no benefit in immunocompetent patients with mild uncomplicated disease. They are indicated when the patient is comorbid or frail, has refractory symptoms or vomiting, has a C-reactive protein above 140 mg/L or a white cell count above 15 × 10⁹/L, or has a fluid collection or a longer inflamed segment on CT — none of which he has. Narcotics are avoided because of their gastrointestinal effects. Clear liquids for 24–72 hours followed by a soft low-residue diet, with follow-up in 2–4 days, is the plan.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D2", "pgroup": "D", "pstack": "B"}, {"id": "29", "group": 29, "stem": "A 54-year-old man with cirrhosis and ascites has spontaneous bacterial peritonitis. Paracentesis returned cloudy fluid with 640 polymorphonuclear cells per mm³, and both the ascitic fluid and the blood cultures grow E. coli. An upright film and CT show ascites with no free air. His blood pressure is 98/58 mm Hg and his pulse is 118/min.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Bowel rest with intravenous fluids, stopping digoxin, and ciprofloxacin plus metronidazole"}, {"letter": "B", "text": "Surgical consultation with empiric piperacillin-tazobactam, then culture-targeted therapy"}, {"letter": "C", "text": "Clear liquids with selective antibiotics — ciprofloxacin plus metronidazole"}, {"letter": "D", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "E", "text": "Endoscopic de-torsion with a flexible sigmoidoscope"}], "answer": "B", "explanation": "Spontaneous bacterial peritonitis is a surgical emergency, managed with an immediate surgical consultation and empiric broad-spectrum coverage; the drained fluid must be cultured so that therapy is targeted rather than left broad. Antibiotics and the source-control decision run together, because the main complication is sepsis. Free air would have indicated perforation, which cannot be treated with antibiotics alone.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C1", "pgroup": "C", "pstack": "B"}, {"id": "30", "group": 30, "stem": "An 84-year-old woman with fecal incontinence asks how her sphincter came to be damaged.\n\nWhich of the following most likely accounts for her sphincter defect?", "options": [{"letter": "A", "text": "Systemic disease such as multiple sclerosis"}, {"letter": "B", "text": "Fecal impaction with leakage around solid stool"}, {"letter": "C", "text": "Sphincter injury from prior hemorrhoid surgery"}, {"letter": "D", "text": "Loss of rectal storage capacity from radiation proctitis"}, {"letter": "E", "text": "A third-degree laceration at a forceps delivery"}], "answer": "E", "explanation": "Sphincter muscle damage from an obstetric laceration is the structural cause here, and the anterior scar at the anal verge and the anterior defect on imaging match it. Pudendal nerve injury, systemic disease such as multiple sclerosis or diabetes, loss of rectal storage capacity from radiation proctitis, and impaction with overflow are the other recognized etiologies.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E2", "pgroup": "E", "pstack": "C"}, {"id": "31", "group": 31, "stem": "A 34-year-old woman who is 32 weeks pregnant has internal and external hemorrhoids. Despite increased water and fiber, sitz baths, stool softeners, and astringents, her symptoms persist. Anoscopy shows an engorged internal plexus above the dentate line, and there are painful swollen perianal veins below it.\n\nWhich of the following procedures is most appropriate?", "options": [{"letter": "A", "text": "Rubber band ligation of the external hemorrhoids only"}, {"letter": "B", "text": "Rubber band ligation of both the internal and external hemorrhoids"}, {"letter": "C", "text": "Stapled hemorrhoidopexy for the external component"}, {"letter": "D", "text": "Rubber band ligation of the internal hemorrhoids only"}, {"letter": "E", "text": "Hemorrhoidectomy of both the internal and external hemorrhoids"}], "answer": "D", "explanation": "Rubber band ligation is for internal hemorrhoids only. Tissue below the dentate line is somatically innervated, so banding an external hemorrhoid causes severe pain. Stapled hemorrhoidopexy addresses severe internal disease, and hemorrhoidectomy of both components is reserved for an incarcerated or strangulated hemorrhoid.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F1", "pgroup": "F", "pstack": "B"}, {"id": "32", "group": 32, "stem": "A 47-year-old man with a history of two prior laparotomies has had four episodes of crampy abdominal pain with distention and vomiting in 2 years. During the current episode, CT of the abdomen and pelvis shows no transition point and no discrete mass. His abdomen is distended and mildly tender, with no peritoneal signs.\n\nWhich of the following best describes when laparoscopy should be performed in this patient?", "options": [{"letter": "A", "text": "Perform laparoscopy only if he has had prior pelvic radiation"}, {"letter": "B", "text": "Perform laparoscopy only if CT shows a transition point in the small bowel"}, {"letter": "C", "text": "Perform laparoscopy only if CT shows a discrete obstructing mass"}, {"letter": "D", "text": "Perform laparoscopy only if this is his first obstructive episode"}, {"letter": "E", "text": "Perform laparoscopy when clinical suspicion is high, even if CT is unrevealing"}], "answer": "E", "explanation": "Imaging is less reliable for adhesive obstruction than for other mechanical causes, so a CT without a transition point does not exclude it, and the physical examination is limited as well. A history of repeated obstruction after surgery, infection, trauma, radiation, or inflammation is what should drive the decision, and direct visualization is what establishes the diagnosis.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A4", "pgroup": "A", "pstack": "B"}, {"id": "33", "group": 33, "stem": "An 11-month-old boy has intussusception at the ileocecal junction, shown by a target sign on ultrasound. He is lethargic between episodes and has passed red currant jelly stool. He has no peritoneal signs.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "B", "text": "Endoscopic de-torsion with a flexible sigmoidoscope"}, {"letter": "C", "text": "Non-operative reduction by air or contrast enema, with intravenous fluids"}, {"letter": "D", "text": "Gentle manual reduction, with observation"}, {"letter": "E", "text": "Bowel rest with nasogastric decompression and intravenous fluids"}], "answer": "C", "explanation": "An air, barium, or water-soluble contrast enema is both diagnostic and therapeutic and succeeds in more than 80% of children. Because reduction is performed under pressure and can perforate the bowel, the surgical team must be on standby before the enema is started rather than called afterward. Surgery is reserved for failed reduction, and adults go to resection because a pathologic lead point — malignant in half of cases — is the rule.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B1", "pgroup": "B", "pstack": "B"}, {"id": "34", "group": 34, "stem": "A 73-year-old woman has ischemic colitis at the splenic flexure. Her white cell count is 13,400/mm³, her lactate is 2.2 mmol/L, and her arterial pH is 7.36. She takes digoxin for atrial fibrillation.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Bowel rest with intravenous fluids, stopping digoxin, and ciprofloxacin plus metronidazole"}, {"letter": "B", "text": "Endoscopic de-torsion with a flexible sigmoidoscope"}, {"letter": "C", "text": "Clear liquids with selective antibiotics — ciprofloxacin plus metronidazole"}, {"letter": "D", "text": "Surgical consultation with empiric piperacillin-tazobactam, then culture-targeted therapy"}, {"letter": "E", "text": "Appendectomy with pre-operative intravenous antibiotics"}], "answer": "A", "explanation": "Colonic ischemia is treated by restoring perfusion and removing what is impairing it: bowel rest, intravenous fluids, and withdrawal of the medications that promote ischemia — digitalis and vasopressors are the named culprits. Treating the colon while continuing the drug that starved it is the error. A white cell count above 20,000 with a metabolic acidosis would suggest infarction and make this a surgical problem.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C2", "pgroup": "C", "pstack": "B"}, {"id": "35", "group": 35, "stem": "A 68-year-old woman has a full-thickness rectal prolapse with concentric folds and all four layers palpable. It reduces manually, and there is no incarceration and no ulceration. She has decreased sphincter tone and longstanding constipation.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Increase fiber, decrease caffeine, and begin bowel training with a bulking agent"}, {"letter": "B", "text": "Surgical repair, with fiber and stool softeners"}, {"letter": "C", "text": "Manual disimpaction with enemas and laxatives"}, {"letter": "D", "text": "Increased water and fiber with sitz baths and stool softeners"}, {"letter": "E", "text": "Manual reduction in the lateral recumbent position, with digital repositioning and table sugar"}], "answer": "B", "explanation": "A full-thickness prolapse requires surgical repair, and managing it non-operatively because the mass reduces is the error. Manual reduction in the lateral recumbent position with digital repositioning and table sugar for its desiccant effect belongs to a mucosal prolapse. An incarcerated prolapse is a surgical emergency rather than a reduction attempt, and fiber and stool softeners are adjuncts rather than the treatment.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E3", "pgroup": "E", "pstack": "B"}, {"id": "36", "group": 36, "stem": "A 66-year-old man is recovering after treatment of a large bowel obstruction caused by an obstructing sigmoid lesion. He asks what most often causes this problem.\n\nWhich of the following is the most common cause of large bowel obstruction?", "options": [{"letter": "A", "text": "Intussusception"}, {"letter": "B", "text": "Volvulus"}, {"letter": "C", "text": "Malignant tumors"}, {"letter": "D", "text": "Abdominal hernias"}, {"letter": "E", "text": "Adhesions"}], "answer": "C", "explanation": "Malignant tumors are the leading cause of large bowel obstruction, followed by volvulus and then hernias and adhesions. Intussusception, stricture, foreign body, and fecal impaction are less common. Colonic obstruction is most often left-sided, and its symptoms are delayed up to 4–5 days, against 1–2 hours for small bowel obstruction.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A2", "pgroup": "A", "pstack": "C"}, {"id": "37", "group": 37, "stem": "A 19-year-old man has a 3 cm fluctuant pilonidal abscess in the natal cleft with a draining sinus at its inferior edge and surrounding cellulitis extending roughly 2 cm. His temperature is 37.8°C (100.0°F).\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sitz baths, plus a first-generation cephalosporin plus metronidazole"}, {"letter": "B", "text": "Incision and drainage alone, without antibiotics"}, {"letter": "C", "text": "A first-generation cephalosporin plus metronidazole alone, without drainage"}, {"letter": "D", "text": "Incision and drainage with unroofing, plus a first-generation cephalosporin plus metronidazole"}, {"letter": "E", "text": "Surgical excision of the sinus tract, plus a first-generation cephalosporin plus metronidazole"}], "answer": "D", "explanation": "The abscess must be drained: incision and drainage with unroofing and curettage, packed with gauze and allowed to heal by secondary intention. Antibiotics are not the treatment and are added only for surrounding cellulitis or a high-risk patient, as here. Surgical excision is reserved for chronic or recurrent disease — an abscess failing to heal after 3 months or a chronic draining site.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F3", "pgroup": "F", "pstack": "B"}, {"id": "38", "group": 38, "stem": "A 68-year-old woman with newly diagnosed diverticulosis asks whether she is going to develop an infection in her colon.\n\nWhich of the following is the most appropriate response?", "options": [{"letter": "A", "text": "About 10–25% of people with diverticulosis develop diverticulitis"}, {"letter": "B", "text": "About half of people with diverticulosis develop diverticulitis"}, {"letter": "C", "text": "Nearly all people with diverticulosis eventually develop diverticulitis"}, {"letter": "D", "text": "Diverticulitis develops only in people who eat a low-fiber diet"}, {"letter": "E", "text": "Diverticulitis develops only in people who smoke"}], "answer": "A", "explanation": "Diverticula are common — roughly 50% of people over 60 have them — but only 10–25% ever develop diverticulitis; bleeding is the other complication. A low-fiber, high-red-meat diet, obesity, inactivity, constipation, increasing age, and smoking all raise the risk, and smoking specifically raises the risk of perforation and abscess, but none of them is required.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D1", "pgroup": "D", "pstack": "C"}, {"id": "39", "group": 39, "stem": "A 39-year-old man has a right inguinal hernia. The bulge is soft, enlarges with Valsalva, and reduces easily with gentle pressure. There is no overlying erythema, and it is neither tender nor firm. He has no fever, tachycardia, or hypotension.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Appendectomy with pre-operative intravenous antibiotics"}, {"letter": "B", "text": "Gentle manual reduction, with observation"}, {"letter": "C", "text": "Non-operative reduction by air or contrast enema, with intravenous fluids"}, {"letter": "D", "text": "Endoscopic de-torsion with a flexible sigmoidoscope"}, {"letter": "E", "text": "Bowel rest with nasogastric decompression and intravenous fluids"}], "answer": "B", "explanation": "A reducible hernia without erythema, tenderness, firmness, or systemic signs may be reduced gently and observed. Reduction must never be attempted when the bulge is firm, erythematous, or severely painful, when it fails to reduce, or when there are systemic signs of shock, because pushing incarcerated or strangulated bowel back into the abdomen returns dead bowel to the peritoneal cavity; those patients need urgent surgical referral.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B3", "pgroup": "B", "pstack": "B"}, {"id": "40", "group": 40, "stem": "The parents of a 16-year-old boy with uncomplicated appendicitis ask whether he could be treated with antibiotics instead of surgery.\n\nWhich of the following is the most appropriate response?", "options": [{"letter": "A", "text": "Recurrent symptoms occur only in patients who have an appendicolith"}, {"letter": "B", "text": "Recurrent symptoms occur only in patients over 45 years of age"}, {"letter": "C", "text": "Recurrent symptoms occur only when both the C-reactive protein and the white cell count are elevated"}, {"letter": "D", "text": "Recurrent symptoms occur only if antibiotics are stopped before a 10-day course is completed"}, {"letter": "E", "text": "Recurrent symptoms requiring appendectomy occur in 15–49% of patients managed without surgery"}], "answer": "E", "explanation": "Between 15% and 49% of patients treated without an operation have recurrent symptoms and require appendectomy, which is why surgery remains the standard of care. A fecalith, age over 45, and malignancy risk are absolute reasons to operate rather than predictors of recurrence, and an elevated C-reactive protein with an elevated white cell count predicts complicated disease. Non-operative patients are followed at 6–8 weeks.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C3", "pgroup": "C", "pstack": "C"}, {"id": "41", "group": 41, "stem": "A 58-year-old woman is recovering from an adynamic ileus that developed after an open abdominal hysterectomy. She asks why her bowel stopped working.\n\nWhich of the following is the most common cause of adynamic ileus?", "options": [{"letter": "A", "text": "Hypokalemia"}, {"letter": "B", "text": "Peritonitis"}, {"letter": "C", "text": "Recent surgery"}, {"letter": "D", "text": "Hypothyroidism"}, {"letter": "E", "text": "Diabetic ketoacidosis"}], "answer": "C", "explanation": "Adynamic ileus is a functional paralysis of motility without mechanical obstruction, and the postoperative state is its most common cause. Peritonitis, trauma, ischemia, medications, hypokalemia, hypomagnesemia, hyponatremia, diabetic ketoacidosis, hypothyroidism, and diabetes are the other recognized causes, and the underlying cause must always be treated.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A3", "pgroup": "A", "pstack": "C"}, {"id": "42", "group": 42, "stem": "A 72-year-old woman with chronic constipation asks when colorectal cancer screening should begin.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Begin colorectal cancer screening in all patients at age 45"}, {"letter": "B", "text": "Begin colorectal cancer screening in all patients at age 50"}, {"letter": "C", "text": "Begin screening only in patients who have red-flag symptoms"}, {"letter": "D", "text": "Begin screening only in patients who have a sudden change in bowel habits"}, {"letter": "E", "text": "Begin screening only in patients who have chronic constipation"}], "answer": "A", "explanation": "Colorectal cancer screening should start on all patients at age 45, independent of symptoms. Red flags — blood in the stool, rectal bleeding, a rectal mass, tenesmus, unexplained weight loss, jaundice, age over 50, or a sudden change in bowel habits — are reasons to investigate a symptomatic patient, not the threshold for screening a well one.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E1", "pgroup": "E", "pstack": "C"}, {"id": "43", "group": 43, "stem": "A 41-year-old man with an anal fissure asks whether it will ever heal.\n\nWhich of the following is the most appropriate response?", "options": [{"letter": "A", "text": "Most fissures require nitroglycerin ointment in order to heal"}, {"letter": "B", "text": "Most fissures heal without medical treatment, with full healing in 6–12 weeks"}, {"letter": "C", "text": "Most fissures heal without medical treatment, but only when they are lateral rather than midline"}, {"letter": "D", "text": "Most fissures require lateral internal sphincterotomy in order to heal"}, {"letter": "E", "text": "Most fissures heal only after botulinum toxin injection"}], "answer": "B", "explanation": "About 90% of anal fissures heal on their own without medical treatment within about 2 weeks, though full healing may take 6–12 weeks. Lateral internal sphincterotomy is used only if conservative therapy fails. A lateral fissure is not the healing type — it is a reason to look for a secondary cause such as Crohn disease or infection.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F2", "pgroup": "F", "pstack": "C"}, {"id": "44", "group": 44, "stem": "A 78-year-old man has had successful endoscopic de-torsion of a sigmoid volvulus and has recovered. He asks what happens next.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Schedule elective sigmoid resection only if the cecum is involved"}, {"letter": "B", "text": "Schedule elective sigmoid resection only if perforation occurred"}, {"letter": "C", "text": "No resection is needed, since endoscopic de-torsion is definitive"}, {"letter": "D", "text": "Schedule elective sigmoid resection after the acute episode has resolved"}, {"letter": "E", "text": "Schedule elective sigmoid resection only after a second episode of volvulus"}], "answer": "D", "explanation": "De-torsion relieves the obstruction but leaves the segment that allowed it, and volvulus recurs in 50–60% of patients. Resection is therefore performed electively once the acute episode has settled; it is done emergently only for perforation or peritonitis. The cecum is in fact the most common site, at about 50%, with the sigmoid at 40%.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B2", "pgroup": "B", "pstack": "C"}, {"id": "45", "group": 45, "stem": "A 64-year-old man treated as an outpatient for acute diverticulitis returns for follow-up with his symptoms resolved. He has not had a colonoscopy in the past year.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Colonoscopy only if he has a third episode"}, {"letter": "B", "text": "Colonoscopy immediately, before his symptoms resolve"}, {"letter": "C", "text": "Colonoscopy only if he develops hematochezia"}, {"letter": "D", "text": "No colonoscopy is needed, since CT already showed diverticula"}, {"letter": "E", "text": "Colonoscopy in 6–8 weeks"}], "answer": "E", "explanation": "Colonoscopy is performed 6–8 weeks after the episode resolves in any patient who has not had one in the past year. Long term he should also resume a high-fiber diet once symptoms have settled, stop tobacco, exercise, and lose weight; 20–40% of patients have recurrent episodes, and hematochezia is rare in diverticulitis.", "objective": "", "section": "Left lower quadrant symptoms in an older adult with colonic diverticula", "pcase": "D2", "pgroup": "D", "pstack": "C"}, {"id": "46", "group": 46, "stem": "A 47-year-old man has adhesive small bowel obstruction. He asks whether he needs an operation this time.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Proceed to operative lysis of adhesions now, because this is his fourth episode"}, {"letter": "B", "text": "Proceed to operative lysis of adhesions now, because imaging cannot exclude a mass"}, {"letter": "C", "text": "Begin nasogastric decompression with fluid resuscitation, reserving surgery for failure"}, {"letter": "D", "text": "Begin nasogastric decompression only if a transition point is seen on CT"}, {"letter": "E", "text": "Begin nasogastric decompression only during a first episode of obstruction"}], "answer": "C", "explanation": "Nasogastric decompression with fluid resuscitation often relieves an adhesive obstruction without an operation, and it is the first step regardless of the number of prior episodes or what imaging shows. Surgical lysis of adhesions is the definitive treatment and is reserved for obstruction that does not resolve.", "objective": "", "section": "Obstipation with abdominal distention", "pcase": "A4", "pgroup": "A", "pstack": "C"}, {"id": "47", "group": 47, "stem": "A 54-year-old man is recovering from spontaneous bacterial peritonitis. He asks why he developed an infection inside his abdomen when he had no injury and no perforation.\n\nWhich of the following best explains his risk?", "options": [{"letter": "A", "text": "Recent abdominal trauma"}, {"letter": "B", "text": "A perforated viscus"}, {"letter": "C", "text": "Recent instrumentation of the peritoneal cavity"}, {"letter": "D", "text": "Cirrhosis with ascites"}, {"letter": "E", "text": "Peritoneal dialysis"}], "answer": "D", "explanation": "Peritonitis arises from perforation, from trauma, or spontaneously. Cirrhosis with ascites and peritoneal dialysis are the two settings that predispose to spontaneous bacterial peritonitis, and he has the first. He has had no dialysis, no instrumentation, and no perforated viscus.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C1", "pgroup": "C", "pstack": "C"}, {"id": "48", "group": 48, "stem": "A 68-year-old woman with full-thickness rectal prolapse asks what caused it.\n\nWhich of the following most likely contributed to her prolapse?", "options": [{"letter": "A", "text": "A pelvic floor defect such as a rectocele"}, {"letter": "B", "text": "Cystic fibrosis"}, {"letter": "C", "text": "Chronic diarrhea"}, {"letter": "D", "text": "A history of stroke"}, {"letter": "E", "text": "Multiparity with chronic straining"}], "answer": "E", "explanation": "Rectal prolapse is a pelvic floor disorder caused by weakening of the ligaments and muscles that hold the rectum in place. Age over 40, female sex, multiparity, vaginal delivery, prior pelvic surgery, and chronic straining are her risk factors; cystic fibrosis, chronic diarrhea, stroke, and other pelvic floor defects are recognized causes she does not have. Untreated, prolapse progressively worsens.", "objective": "", "section": "Altered defecation without acute abdominal pain", "pcase": "E3", "pgroup": "E", "pstack": "C"}, {"id": "49", "group": 49, "stem": "A 34-year-old woman with visible internal and external hemorrhoids asks whether she needs any further testing for her rectal bleeding, given that the source has already been seen.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Perform colonoscopy in every patient with bright red rectal bleeding"}, {"letter": "B", "text": "Perform colonoscopy only if the bleeding continues after treatment"}, {"letter": "C", "text": "Perform colonoscopy only if there is a family history of colorectal cancer"}, {"letter": "D", "text": "Perform colonoscopy only if the stool caliber changes"}, {"letter": "E", "text": "No colonoscopy is needed, since the bleeding is explained by the visible hemorrhoids"}], "answer": "A", "explanation": "Visible hemorrhoids do not prove that they are the source. Flexible sigmoidoscopy or colonoscopy is part of the workup of bright red rectal bleeding, to establish that there is no proximal lesion; the absence of a family history, weight loss, or a change in stool caliber does not remove that obligation.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F1", "pgroup": "F", "pstack": "C"}, {"id": "50", "group": 50, "stem": "The parents of an 11-month-old boy who has been treated for intussusception ask how common the problem is.\n\nWhich of the following is the most common cause of intestinal obstruction in children?", "options": [{"letter": "A", "text": "Volvulus"}, {"letter": "B", "text": "Intussusception"}, {"letter": "C", "text": "Adhesions"}, {"letter": "D", "text": "Abdominal hernia"}, {"letter": "E", "text": "Appendicitis"}], "answer": "B", "explanation": "Intussusception is the most common cause of intestinal obstruction in children and the most common abdominal emergency of childhood. It is extremely rare in adults, occurring in roughly 1 in 1,300, and is increased in patients with AIDS who have lymphoma or Kaposi sarcoma.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B1", "pgroup": "B", "pstack": "C"}, {"id": "51", "group": 51, "stem": "A 73-year-old woman with ischemic colitis is improving. She asks what made the blood supply to her colon fail.\n\nWhich of the following accounts for the majority of cases of colonic ischemia?", "options": [{"letter": "A", "text": "Arterial embolism"}, {"letter": "B", "text": "Arterial thrombosis"}, {"letter": "C", "text": "A nonocclusive or low-flow state"}, {"letter": "D", "text": "A hypercoagulable state"}, {"letter": "E", "text": "Deep venous thrombosis"}], "answer": "C", "explanation": "About 95% of colonic ischemia is nonocclusive or low-flow — reduced perfusion at a watershed area rather than a blocked vessel — which is why hypotension during dialysis, recent myocardial infarction, and hypovolemia are such prominent triggers. Embolic and thrombotic arterial occlusion account for the remainder.", "objective": "", "section": "Acute severe abdominal pain with peritoneal, ischemic, or localizing inflammatory features", "pcase": "C2", "pgroup": "C", "pstack": "C"}, {"id": "52", "group": 52, "stem": "A 19-year-old man has recovered from a pilonidal abscess. He asks how to keep it from coming back.\n\nWhich of the following is the most appropriate recommendation?", "options": [{"letter": "A", "text": "Shave the natal cleft weekly to prevent recurrence"}, {"letter": "B", "text": "Remove hair from the natal cleft by a method other than shaving"}, {"letter": "C", "text": "Avoid hair removal altogether, since it does not affect recurrence"}, {"letter": "D", "text": "Shave the natal cleft only while the wound is healing"}, {"letter": "E", "text": "Shave the natal cleft only if a draining sinus recurs"}], "answer": "B", "explanation": "Hair removal is recommended, because the disease begins with a hair follicle that becomes obstructed and infected, but shaving can exacerbate the disease by driving hair fragments back into the follicle. Avoiding prolonged sitting, losing weight, daily cleaning, and keeping the area clean and dry are the other preventive measures.", "objective": "", "section": "Anorectal pain, bleeding, or swelling", "pcase": "F3", "pgroup": "F", "pstack": "C"}, {"id": "53", "group": 53, "stem": "A 39-year-old man with a reducible inguinal hernia asks why it matters if he simply leaves it alone.\n\nWhich of the following is the third leading cause of small bowel obstruction?", "options": [{"letter": "A", "text": "Intussusception"}, {"letter": "B", "text": "Adhesions"}, {"letter": "C", "text": "Tumors"}, {"letter": "D", "text": "Complicated hernias"}, {"letter": "E", "text": "Volvulus"}], "answer": "D", "explanation": "Adhesions, tumors, and complicated hernias together account for about 90% of small bowel obstructions, in that order. A hernia becomes complicated when its contents incarcerate or strangulate, which is why a hernia at any of the common sites — umbilical, epigastric, inguinal, or incisional — is a potential source of obstruction.", "objective": "", "section": "Acute obstruction from a segment that has telescoped, twisted, or become trapped", "pcase": "B3", "pgroup": "B", "pstack": "C"}]};

// Reshuffle-on-load for a Clinical Vignette practice exam.
//
// Inject this immediately after the `const EXAM_DATA = ...;` line of the
// interactive-exam template, before the main IIFE. It reorders the stacks and
// the options on every page load, then renumbers, so the exam cannot be
// answered from memory of position.
//
// Requires three extra fields on every question, written by the exam build:
//   pcase   the case id from the case file, e.g. "A3"
//   pgroup  the differential group letter, e.g. "A"
//   pstack  "A" recognition | "B" management safety | "C" counseling
//
// Constraints preserved on every shuffle:
//   1. no two consecutive stacks share a differential group
//   2. a patient's Stack A precedes their Stack B, which precedes their Stack C
//   3. follow-up nodes never leave their parent
(function reshuffleExam() {
  var qs = EXAM_DATA.questions;
  if (!qs || !qs.length || !qs[0].pcase) return;   // metadata absent: leave order alone

  // ---- collect stacks, parent first ----------------------------------------
  var map = {}, order = [];
  qs.forEach(function (q) {
    if (!map[q.group]) { map[q.group] = []; order.push(q.group); }
    map[q.group].push(q);
  });
  var stacks = order.map(function (g) {
    return { qs: map[g], pcase: map[g][0].pcase, pgroup: map[g][0].pgroup, pstack: map[g][0].pstack };
  });
  if (stacks.length < 3) return;

  var RANK = { A: 0, B: 1, C: 2 };

  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }

  // Reorder one case's stacks into A→B→C at whatever positions that case holds,
  // leaving every other position as the shuffle left it.
  function repairCaseOrder(seq) {
    var pend = {}, idx = {};
    seq.forEach(function (s) { (pend[s.pcase] = pend[s.pcase] || []).push(s); });
    Object.keys(pend).forEach(function (c) {
      pend[c].sort(function (x, y) { return RANK[x.pstack] - RANK[y.pstack]; });
      idx[c] = 0;
    });
    return seq.map(function (s) { return pend[s.pcase][idx[s.pcase]++]; });
  }

  function groupsAdjacent(seq) {
    for (var i = 0; i < seq.length - 1; i++) {
      if (seq[i].pgroup === seq[i + 1].pgroup) return true;
    }
    return false;
  }

  var seq = null;
  for (var attempt = 0; attempt < 4000; attempt++) {
    var cand = repairCaseOrder(shuffled(stacks));
    if (!groupsAdjacent(cand)) { seq = cand; break; }
  }
  if (!seq) return;   // could not satisfy the constraints: keep the built order

  // ---- shuffle the options inside each question ----------------------------
  var LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  seq.forEach(function (s) {
    s.qs.forEach(function (q) {
      if (!q.options || q.options.length < 2) return;
      var keyText = null;
      q.options.forEach(function (o) { if (o.letter === q.answer) keyText = o.text; });
      var texts = shuffled(q.options.map(function (o) { return o.text; }));
      q.options = texts.map(function (t, i) { return { letter: LET[i], text: t }; });
      for (var i = 0; i < q.options.length; i++) {
        if (q.options[i].text === keyText) { q.answer = q.options[i].letter; break; }
      }
    });
  });

  // ---- renumber and write the new order back ------------------------------
  var out = [];
  seq.forEach(function (s, i) {
    var n = i + 1;
    s.qs.forEach(function (q, j) {
      q.group = n;
      q.id = j === 0 ? String(n) : String(n) + LET[j - 1];
      out.push(q);
    });
  });
  EXAM_DATA.questions = out;
})();


(function () {

  const groupOrder = [];

    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
