uction. His pain had been coming in waves; since early this morning it has been constant and severe with no relief between spasms, and he now looks unwell. He had a sigmoid colectomy in the past and has hypertension and atrial fibrillation on rate control. His temperature is 38.6°C (101.5°F), blood pressure is 96/58 mm Hg, pulse is 124/min, respirations are 24/min, and oxygen saturation is 95% on room air. His abdomen is rigid with guarding and rebound, most tender in the periumbilical region and right lower quadrant, and the bowel sounds that were hyperactive on admission are now silent. His extremities are cool with delayed capillary refill.", "labs_workup": [["WBC", "21,400/mm³ with 14% bands"], ["Hemoglobin / hematocrit", "15.1 g/dL / 45%"], ["Platelets", "180,000/mm³"], ["Lactate", "5.2 mmol/L"], ["Arterial pH / bicarbonate", "7.28 / 16 mEq/L"], ["Anion gap", "20"], ["Sodium / potassium", "133 mEq/L / 5.1 mEq/L"], ["BUN / creatinine", "44 mg/dL / 1.8 mg/dL"], ["Blood cultures", "Drawn, pending"]], "vignette_recog": "A 72-year-old man is on the third hospital day of nonoperative management of a small-bowel obstruction. His pain had been coming in waves; since early this morning it has been constant and severe with no relief between spasms, and he now looks unwell. He had a sigmoid colectomy in the past and has hypertension and atrial fibrillation on rate control. His temperature is 38.6°C (101.5°F), blood pressure is 96/58 mm Hg, pulse is 124/min, respirations are 24/min, and oxygen saturation is 95% on room air. His abdomen is rigid with guarding and rebound, most tender in the periumbilical region and right lower quadrant, and the bowel sounds that were hyperactive on admission are now silent. His extremities are cool with delayed capillary refill.", "labs_recog": [["WBC", "21,400/mm³ with 14% bands"], ["Lactate", "5.2 mmol/L"], ["Arterial pH / bicarbonate", "7.28 / 16 mEq/L"], ["Anion gap", "20"], ["Sodium / potassium", "133 mEq/L / 5.1 mEq/L"], ["BUN / creatinine", "44 mg/dL / 1.8 mg/dL"], ["CT abdomen and pelvis with IV contrast", "Segmental ileal wall thickening with lack of enhancement, pneumatosis intestinalis, mesenteric fat stranding, and free fluid; no portal venous gas and no free air"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Flexible sigmoidoscopy of the left colon"}, {"letter": "B", "text": "CT angiography of the mesenteric vessels"}, {"letter": "C", "text": "An upright plain radiograph of the chest"}, {"letter": "D", "text": "Diagnostic paracentesis of the ascites"}, {"letter": "E", "text": "CT of the abdomen and pelvis with intravenous contrast"}], "answer": "E", "explanation": "The intravenous contrast is the point: it is what shows whether the bowel wall still takes up blood, and therefore whether the trapped segment is alive. A plain film answers only the free-air question, and there is no ascites to tap."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Bowel wall thickening with non-enhancement, pneumatosis, and free fluid"}, {"letter": "B", "text": "Sigmoid wall thickening with fat stranding and extraluminal air"}, {"letter": "C", "text": "Large-volume ascites with a nodular liver and no free air"}, {"letter": "D", "text": "An appendix over 6 mm with periappendiceal fluid and extraluminal air"}, {"letter": "E", "text": "A whirl pattern with loss of bowel wall enhancement"}], "answer": "A", "explanation": "A wall that does not enhance has lost its blood supply, and gas within that wall is bacteria fermenting inside dying tissue. Free fluid and mesenteric stranding are the peritoneal response to it, and all three can be present long before any hole appears."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Perforated appendicitis"}, {"letter": "B", "text": "Strangulated bowel obstruction"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Perforated diverticulitis"}, {"letter": "E", "text": "Spontaneous bacterial peritonitis"}], "answer": "B", "explanation": "Pain that changes from colicky to constant, hyperactive bowel sounds that fall silent, and a rigid abdomen in a patient obstructed for more than 24 hours is strangulation. Acute mesenteric ischemia gives agonizing pain over a soft abdomen and does not begin with a mechanical block."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Strangulated bowel obstruction"}, {"letter": "B", "text": "Spontaneous bacterial peritonitis"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Perforated diverticulitis"}, {"letter": "E", "text": "Perforated appendicitis"}], "answer": "A", "explanation": "Non-enhancing ileum with pneumatosis and free fluid, arising during a nonoperative obstruction trial, is dead bowel inside the block. Infected ascites in an intact gut is the alternative in this group, and it carries neither a transition point nor a non-enhancing segment."}, {"key": "mgmt", "path": "both", "stem": "He has a strangulated obstruction with infarcted bowel. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Appendectomy with intravenous antibiotics"}, {"letter": "B", "text": "Sigmoid colectomy or Hartmann's procedure with intravenous antibiotics"}, {"letter": "C", "text": "Heparin, intravenous antibiotics, and mesenteric revascularization"}, {"letter": "D", "text": "Piperacillin-tazobactam, or a cephalosporin plus metronidazole"}, {"letter": "E", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}], "answer": "E", "explanation": "The non-viable segment has to come out, and it comes out alongside resuscitation, nasogastric decompression, and antibiotics rather than after them. Antibiotics alone treat infected fluid, not dead tissue, and revascularization presumes an occluded vessel rather than a trapped loop."}, {"key": "counsel", "path": "both", "stem": "He has a strangulated obstruction with infarcted bowel. Which of the following is the most appropriate approach to the timing of operation?", "options": [{"letter": "A", "text": "Operate now, whatever stage the nonoperative trial has reached"}, {"letter": "B", "text": "Operate only once blood cultures return positive"}, {"letter": "C", "text": "Operate only once free air appears on an upright radiograph"}, {"letter": "D", "text": "Operate only once the nonoperative trial has run a further 24 hours"}, {"letter": "E", "text": "Operate only once vasopressors are required"}], "answer": "A", "explanation": "Fever, tachycardia, peritonitis, a rising lactate, or a closed loop each mean operating now, however long the trial has run. Bacteria cross the failing wall into the bloodstream before any hole appears, so a patient can be septic with a clean film — waiting for free air, a positive culture, or shock is waiting past the 70% mortality mark."}]}, {"case": "CO-C2", "group": "CO-C", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "objective": "", "vignette_workup": "A 54-year-old woman comes to the emergency department with two days of diffuse abdominal pain, fever, nausea, and no appetite; her abdominal swelling has increased over the past week. She has cirrhosis from hepatitis C with ascites and has had two large-volume paracenteses in the past year, and she takes spironolactone and furosemide. She has had no perforating illness and no recent surgery. Her temperature is 38.4°C (101.1°F), blood pressure is 102/62 mm Hg, pulse is 110/min, respirations are 20/min, and oxygen saturation is 97% on room air. She has tense ascites with diffuse tenderness, guarding, and rebound, shifting dullness and a fluid wave, spider angiomata, and palmar erythema. The abdomen is not board-like and she shifts position on the stretcher without difficulty.", "labs_workup": [["Upright chest radiograph", "No free air under either diaphragm"], ["CT abdomen and pelvis", "Large-volume ascites with a nodular liver and splenomegaly; no perforation and no pneumoperitoneum"], ["WBC", "14,600/mm³ with 82% neutrophils"], ["Hemoglobin / hematocrit", "10.6 g/dL / 32%"], ["Platelets", "88,000/mm³"], ["Lactate", "2.4 mmol/L"], ["Sodium / potassium", "128 mEq/L / 4.0 mEq/L"], ["Creatinine", "1.4 mg/dL"], ["Albumin", "2.4 g/dL"], ["Total bilirubin / INR", "3.1 mg/dL / 1.6"], ["Blood cultures", "Drawn, pending"]], "vignette_recog": "A 54-year-old woman comes to the emergency department with two days of diffuse abdominal pain, fever, nausea, and no appetite; her abdominal swelling has increased over the past week. She has cirrhosis from hepatitis C with ascites and has had two large-volume paracenteses in the past year, and she takes spironolactone and furosemide. She has had no perforating illness and no recent surgery. Her temperature is 38.4°C (101.1°F), blood pressure is 102/62 mm Hg, pulse is 110/min, respirations are 20/min, and oxygen saturation is 97% on room air. She has tense ascites with diffuse tenderness, guarding, and rebound, shifting dullness and a fluid wave, spider angiomata, and palmar erythema. The abdomen is not board-like and she shifts position on the stretcher without difficulty.", "labs_recog": [["Upright chest radiograph", "No free air under either diaphragm"], ["CT abdomen and pelvis", "Large-volume ascites with a nodular liver and splenomegaly; no perforation and no pneumoperitoneum"], ["WBC", "14,600/mm³ with 82% neutrophils"], ["Platelets", "88,000/mm³"], ["Lactate", "2.4 mmol/L"], ["Albumin", "2.4 g/dL"], ["Total bilirubin / INR", "3.1 mg/dL / 1.6"], ["Ascitic fluid", "Polymorphonuclear count 620/mm³, with a positive culture growing a single gram-negative organism"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Diagnostic laparotomy with a second look at 24 to 48 hours"}, {"letter": "B", "text": "Diagnostic paracentesis"}, {"letter": "C", "text": "CT angiography"}, {"letter": "D", "text": "Flexible sigmoidoscopy"}, {"letter": "E", "text": "An arterial blood gas with a serum lactate"}], "answer": "B", "explanation": "The imaging has excluded a perforated viscus, which leaves the fluid itself as the only place the answer can be. Sampling it separates infected ascites from the surgical causes of peritonitis, and drained fluid is always cultured so that antibiotics can be targeted."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "A lactate of 5.2 mmol/L with a pH of 7.28 and a widened anion gap"}, {"letter": "B", "text": "Infarcted small bowel in the superior mesenteric territory"}, {"letter": "C", "text": "Ischemic mucosa at the point of torsion"}, {"letter": "D", "text": "Free air under the diaphragm"}, {"letter": "E", "text": "An ascitic neutrophil count of 620/mm³ with a positive culture"}], "answer": "E", "explanation": "Ascites in a cirrhotic is protein-poor and poorly opsonized, so organisms that translocate across the gut wall multiply in it unopposed and draw neutrophils into the fluid. A single gram-negative organism on culture is the pattern; a polymicrobial growth would argue for a perforation feeding the peritoneum."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Perforated diverticulitis"}, {"letter": "B", "text": "Strangulated bowel obstruction with infarction"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Perforated appendicitis"}, {"letter": "E", "text": "Spontaneous bacterial peritonitis"}], "answer": "E", "explanation": "Fever and peritoneal signs in a cirrhotic with tense ascites, no free air, and no transition point is infected ascites with an intact gut. The abdomen is tender but not board-like, and she moves on the stretcher — a patient with a perforation lies still."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Strangulated bowel obstruction with infarction"}, {"letter": "B", "text": "Acute mesenteric ischemia"}, {"letter": "C", "text": "Perforated diverticulitis"}, {"letter": "D", "text": "Perforated appendicitis"}, {"letter": "E", "text": "Spontaneous bacterial peritonitis"}], "answer": "E", "explanation": "A neutrophil count in the hundreds with a single organism growing from the fluid, in a cirrhotic whose imaging shows no perforation, is the diagnosis. Getting this apart from a perforated viscus matters in both directions, because one is an operation and the other is not."}, {"key": "mgmt", "path": "both", "stem": "She has spontaneous bacterial peritonitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}, {"letter": "B", "text": "Sigmoid colectomy or Hartmann's procedure with intravenous antibiotics"}, {"letter": "C", "text": "Appendectomy with intravenous antibiotics"}, {"letter": "D", "text": "Piperacillin-tazobactam, or a cephalosporin plus metronidazole"}, {"letter": "E", "text": "Heparin, intravenous antibiotics, and mesenteric revascularization"}], "answer": "D", "explanation": "Secondary peritonitis from a perforated appendix or gallbladder is surgical; this is not, and confusing the two is lethal in both directions. Empiric cover is started at once and narrowed once the fluid culture returns, while a surgical consult stands by because both conditions are handled as emergencies."}, {"key": "escalate", "path": "both", "stem": "After 48 hours of piperacillin-tazobactam she is still febrile with a white count that has not fallen. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Emergent laparotomy with resection of non-viable bowel"}, {"letter": "B", "text": "Appendectomy with intravenous antibiotics"}, {"letter": "C", "text": "Heparin with mesenteric revascularization"}, {"letter": "D", "text": "Sigmoid colectomy or Hartmann's procedure"}, {"letter": "E", "text": "Percutaneous drainage with antibiotics targeted to the culture"}], "answer": "E", "explanation": "Antibiotics that are not working point to a collection that has not been drained, so source control is the escalation: drain the fluid and narrow the drug to what grew. Resection presumes a diseased segment, and there is none."}, {"key": "counsel", "path": "both", "stem": "She has spontaneous bacterial peritonitis. Which of the following is the most appropriate approach to looking for free air on plain radiography?", "options": [{"letter": "A", "text": "An upright PA chest radiograph after 5 to 10 minutes upright"}, {"letter": "B", "text": "An upright PA chest radiograph taken immediately on arrival"}, {"letter": "C", "text": "A left lateral decubitus radiograph in every patient"}, {"letter": "D", "text": "An upright abdominal radiograph after 5 to 10 minutes upright"}, {"letter": "E", "text": "A supine abdominal radiograph"}], "answer": "A", "explanation": "The upright chest film finds as little as 1 to 2 mL of free air, against about 5 mL for the abdominal film, but only once the patient has been upright long enough for the gas to collect. The decubitus view is the substitute for a patient who cannot stand, and a supine film shows air only indirectly, as gas outlining both sides of the bowel wall."}]}, {"case": "CO-D2", "group": "CO-D", "section": "abdominal pain with a starved gut", "objective": "", "vignette_workup": "A 70-year-old man comes to the emergency department with crampy left-sided abdominal pain that began abruptly eight hours ago and was followed within a few hours by loose maroon stools and a persistent urge to defecate that produces little. He had a myocardial infarction three weeks ago with a hypotensive episode in the catheterization lab, and he takes aspirin, metoprolol, and digoxin. He has hypertension and is on no anticoagulation. His temperature is 37.6°C (99.7°F), blood pressure is 132/78 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 97% on room air. He has left lower quadrant tenderness proportionate to the pain, maroon blood on the glove, no rebound and no rigidity, and present bowel sounds.", "labs_workup": [["CT abdomen with IV contrast", "Segmental bowel wall thickening with thumbprinting at the splenic flexure and an abrupt transition to normal colon; rectum spared; no free air and no pneumatosis"], ["WBC", "13,200/mm³"], ["Hemoglobin / hematocrit", "12.8 g/dL / 38%"], ["Platelets", "265,000/mm³"], ["Lactate", "2.1 mmol/L"], ["LDH / CPK / amylase", "280 U/L / 190 U/L / 88 U/L"], ["Arterial pH / bicarbonate", "7.38 / 23 mEq/L"], ["Sodium / potassium", "138 mEq/L / 3.9 mEq/L"], ["Creatinine", "1.1 mg/dL"]], "vignette_recog": "A 70-year-old man comes to the emergency department with crampy left-sided abdominal pain that began abruptly eight hours ago and was followed within a few hours by loose maroon stools and a persistent urge to defecate that produces little. He had a myocardial infarction three weeks ago with a hypotensive episode in the catheterization lab, and he takes aspirin, metoprolol, and digoxin. He has hypertension and is on no anticoagulation. His temperature is 37.6°C (99.7°F), blood pressure is 132/78 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 97% on room air. He has left lower quadrant tenderness proportionate to the pain, maroon blood on the glove, no rebound and no rigidity, and present bowel sounds. He is stable, and endoscopy follows.", "labs_recog": [["CT abdomen with IV contrast", "Segmental bowel wall thickening with thumbprinting at the splenic flexure and an abrupt transition to normal colon; rectum spared; no free air and no pneumatosis"], ["WBC", "13,200/mm³"], ["Lactate", "2.1 mmol/L"], ["LDH / CPK / amylase", "280 U/L / 190 U/L / 88 U/L"], ["Arterial pH / bicarbonate", "7.38 / 23 mEq/L"], ["Colonoscopy", "Segmental erythema, edema, and friability with a single longitudinal ulcer along the antimesenteric border and an abrupt transition to normal mucosa"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT angiography"}, {"letter": "B", "text": "Colonoscopy"}, {"letter": "C", "text": "Stool culture with a pathogen panel"}, {"letter": "D", "text": "Interval colonoscopy 6 to 8 weeks after resolution"}, {"letter": "E", "text": "Diagnostic laparotomy with a second look at 24 to 48 hours"}], "answer": "B", "explanation": "Endoscopy is the gold standard here and is safe in a patient with no peritonitis and no suspicion of gangrene. Angiography is usually not indicated, because the problem is small-vessel low flow rather than an occluded trunk, and barium must never be given where necrosis is suspected."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Sigmoid diverticula with no obstructing mass"}, {"letter": "B", "text": "A lactate of 4.1 mmol/L with a pH of 7.30"}, {"letter": "C", "text": "Infarcted jejunum and proximal ileum in the superior mesenteric territory"}, {"letter": "D", "text": "A single longitudinal ulcer with an abrupt transition to normal mucosa"}, {"letter": "E", "text": "An enteric pathogen identified on stool culture"}], "answer": "D", "explanation": "Low flow injures the segment furthest from either supplying trunk and spares the tissue on both sides of it, which is what produces a sharp border between damaged and normal mucosa. The stripe runs along the antimesenteric border, the part of the circumference perfused last."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ischemic colitis"}, {"letter": "B", "text": "Infectious colitis"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Nonocclusive low-flow ischemic bowel disease"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "A", "explanation": "Tenderness proportionate to the pain, a watershed segment at the splenic flexure, and bleeding within 24 hours of onset make this colonic rather than small-bowel ischemia. The rectum is spared because of its dual internal iliac supply, and rectal involvement would argue for another diagnosis."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Nonocclusive low-flow ischemic bowel disease"}, {"letter": "B", "text": "Diverticulitis"}, {"letter": "C", "text": "Infectious colitis"}, {"letter": "D", "text": "Ischemic colitis"}, {"letter": "E", "text": "Acute mesenteric ischemia"}], "answer": "D", "explanation": "A single stripe of ulceration with an abrupt transition to normal mucosa in a segmental left-colonic distribution is the endoscopic signature. Thumbprinting alone is not specific for ischemia — it is the location at the splenic flexure, with the hypotensive episode three weeks ago, that makes the diagnosis."}, {"key": "mgmt", "path": "both", "stem": "He has ischemic colitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Ciprofloxacin and metronidazole with clear liquids"}, {"letter": "B", "text": "Bowel rest with intravenous fluids, ciprofloxacin, and metronidazole"}, {"letter": "C", "text": "Systemic heparin, antibiotics, and mesenteric revascularization"}, {"letter": "D", "text": "Correct the low-flow state, stop vasoconstrictors, and give fluids, antibiotics, and heparin"}, {"letter": "E", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}], "answer": "B", "explanation": "The colon is rested while perfusion is restored with fluids, and empiric antibiotics cover the translocation across an injured mucosa. Digitalis promotes splanchnic vasoconstriction and is stopped, but heparin and revascularization belong to arterial occlusion, which this is not."}, {"key": "escalate", "path": "both", "stem": "His pain and bleeding settle over 48 hours on bowel rest and antibiotics. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Emergent laparotomy with resection of non-viable colon"}, {"letter": "B", "text": "Interval colonoscopy 6 to 8 weeks after resolution"}, {"letter": "C", "text": "Correct the underlying conditions, with serial imaging to document resolution"}, {"letter": "D", "text": "Stool culture with a pathogen panel and targeted antibiotics"}, {"letter": "E", "text": "Mesenteric revascularization with systemic heparin"}], "answer": "C", "explanation": "Most patients improve within one to two days and resolve completely in one to two weeks, so the work that remains is fixing what caused the low flow and proving the colon has healed. Repeat endoscopy or CT documents that; an operation is reserved for the segment that does not recover."}, {"key": "counsel", "path": "both", "stem": "He has ischemic colitis. Which of the following is the most appropriate expectation about the bleeding?", "options": [{"letter": "A", "text": "It appears within 24 hours of the pain and is bright red or maroon"}, {"letter": "B", "text": "It precedes the pain and is bright red or maroon"}, {"letter": "C", "text": "It appears within 24 hours of the pain and is melenic"}, {"letter": "D", "text": "It appears only once the white count exceeds 20,000/mm³"}, {"letter": "E", "text": "It appears 1 to 2 weeks after the pain and is bright red or maroon"}], "answer": "A", "explanation": "Pain comes first and the bleeding follows it within a day, bright red or maroon because the source is colonic and the transit is fast. One to two weeks is the time to complete resolution, and a white count over 20,000 with metabolic acidosis suggests infarction rather than marking the onset of bleeding."}]}, {"case": "PA-A1", "group": "PA-A", "section": "acute severe epigastric pain radiating to the back", "objective": "", "vignette_workup": "A 29-year-old man presents to the emergency department with eight hours of sudden, severe, constant epigastric pain that bores through to his back. The pain eases when he sits up and leans forward and is worse lying flat or after he tries to drink. He has vomited six times and has no appetite. He has Crohn's disease and began azathioprine six weeks ago. He does not drink alcohol, has never had gallstones or biliary colic, and has had no recent ERCP. His temperature is 38.1°C (100.6°F), blood pressure is 124/76 mm Hg, pulse is 110/min, respirations are 18/min, and oxygen saturation is 98% on room air. He has epigastric tenderness with mild distention and reduced bowel sounds, with no guarding, rebound, or rigidity and no scleral icterus.", "labs_workup": [["WBC", "15,600/mm³"], ["Hemoglobin / hematocrit", "16.3 g/dL / 49%"], ["Platelets", "264,000/mm³"], ["Calcium", "8.4 mg/dL"], ["BUN / creatinine", "18 mg/dL / 0.9 mg/dL"], ["Triglycerides", "142 mg/dL"]], "vignette_recog": "A 29-year-old man presents to the emergency department with eight hours of sudden, severe, constant epigastric pain that bores through to his back. The pain eases when he sits up and leans forward and is worse lying flat or after he tries to drink. He has vomited six times and has no appetite. He has Crohn's disease and began azathioprine six weeks ago. He does not drink alcohol, has never had gallstones or biliary colic, and has had no recent ERCP. His temperature is 38.1°C (100.6°F), blood pressure is 124/76 mm Hg, pulse is 110/min, respirations are 18/min, and oxygen saturation is 98% on room air. He has epigastric tenderness with mild distention and reduced bowel sounds, with no guarding, rebound, or rigidity and no scleral icterus.", "labs_recog": [["Lipase", "742 U/L (upper limit of normal 60)"], ["WBC", "15,600/mm³"], ["Hemoglobin / hematocrit", "16.3 g/dL / 49%"], ["Platelets", "264,000/mm³"], ["Calcium", "8.4 mg/dL"], ["BUN / creatinine", "18 mg/dL / 0.9 mg/dL"], ["Triglycerides", "142 mg/dL"], ["AST / ALT", "26 U/L / 30 U/L"], ["Alkaline phosphatase / total bilirubin", "82 U/L / 0.8 mg/dL"], ["RUQ ultrasound", "No gallstones, no sludge, common bile duct 4 mm"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen with fecal elastase-1"}, {"letter": "B", "text": "MRCP of the biliary tree"}, {"letter": "C", "text": "Serum lipase with right upper quadrant ultrasound"}, {"letter": "D", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "E", "text": "Upright chest and abdominal radiographs"}], "answer": "C", "explanation": "Lipase is the opening test in acute epigastric pain radiating to the back: it is more sensitive and specific than amylase and stays elevated for about two weeks. The ultrasound is sent with it because gallstones are the most common cause and their presence changes what happens next. Cross-sectional imaging answers a later question."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Lipase 742 U/L with no gallstones and normal liver enzymes"}, {"letter": "B", "text": "Pancreatic calcifications with parenchymal atrophy and a normal lipase"}, {"letter": "C", "text": "Lipase 1,120 U/L with magnesium 1.2 mg/dL and phosphorus 1.8 mg/dL"}, {"letter": "D", "text": "Triglycerides 3,850 mg/dL with grossly lipemic serum"}, {"letter": "E", "text": "Lipase 980 U/L with ALT 224 U/L, bilirubin 3.4 mg/dL, and a 9 mm common bile duct"}], "answer": "A", "explanation": "A lipase more than three times the upper limit of normal establishes acute pancreatic inflammation, and the ultrasound and liver enzymes then sort the cause. Normal enzymes with a normal-caliber duct and no stones point away from a biliary origin and toward an exposure."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "CT of the abdomen with oral and intravenous contrast"}, {"letter": "B", "text": "Plasma triglyceride level"}, {"letter": "C", "text": "MRCP"}, {"letter": "D", "text": "Repeat contrast-enhanced CT at 5 to 7 days"}, {"letter": "E", "text": "Contrast-enhanced CT of the abdomen"}], "answer": "E", "explanation": "Contrast-enhanced CT is the imaging gold standard and shows the inflamed gland directly. It is reserved for diagnostic uncertainty or for staging complications at 72 hours or beyond, which is why it follows rather than replaces lipase and ultrasound."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hypertriglyceridemia-induced pancreatitis"}, {"letter": "B", "text": "Drug-induced acute pancreatitis"}, {"letter": "C", "text": "Gallstone pancreatitis"}, {"letter": "D", "text": "Chronic pancreatitis"}, {"letter": "E", "text": "Alcoholic pancreatitis"}], "answer": "B", "explanation": "Azathioprine sits near the top of the list of drugs that cause pancreatitis, alongside 5-ASA, mercaptopurine, furosemide and thiazides, sulfonamides, and valproic acid, and six weeks is the right interval. With no stones, no alcohol, and a normal triglyceride, the drug is what is left."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Gallstone pancreatitis"}, {"letter": "B", "text": "Alcoholic pancreatitis"}, {"letter": "C", "text": "Hypertriglyceridemia-induced pancreatitis"}, {"letter": "D", "text": "Drug-induced acute pancreatitis"}, {"letter": "E", "text": "Chronic pancreatitis"}], "answer": "D", "explanation": "A lipase more than three times normal with an ultrasound showing no stones and entirely normal liver enzymes excludes a biliary cause, and the triglyceride is normal. Azathioprine started six weeks earlier is the exposure, and chronic pancreatitis runs with a normal lipase and calcifications instead."}, {"key": "mgmt", "path": "both", "stem": "He has acute pancreatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Lactated Ringer's for 24 to 48 hours, early low-fat enteral feeding, hydromorphone, and continuing the azathioprine"}, {"letter": "B", "text": "Lactated Ringer's for 24 to 48 hours, early low-fat enteral feeding, morphine, and stopping the azathioprine"}, {"letter": "C", "text": "Lactated Ringer's for 24 to 48 hours, nothing by mouth until the lipase normalizes, hydromorphone, and prophylactic antibiotics"}, {"letter": "D", "text": "Lactated Ringer's for five days, early low-fat enteral feeding, hydromorphone, and stopping the azathioprine"}, {"letter": "E", "text": "Lactated Ringer's for 24 to 48 hours, early low-fat enteral feeding, hydromorphone, and stopping the azathioprine"}], "answer": "E", "explanation": "Removing the cause is part of the treatment, not an afterthought, and fluids plus early low-fat feeding and analgesia are the whole of supportive care. Morphine is typically avoided because it may raise sphincter of Oddi pressure, fluids past 48 hours invite intubation and abdominal compartment syndrome, and prophylactic antibiotics have no role in sterile disease."}, {"key": "escalate", "path": "both", "stem": "Over the next 48 hours he develops organ failure. Which of the following should be done next?", "options": [{"letter": "A", "text": "Supportive care with cholecystectomy during the same admission"}, {"letter": "B", "text": "Alcohol and nicotine cessation with low-fat meals"}, {"letter": "C", "text": "Transfer to the intensive care unit with nasojejunal feeding"}, {"letter": "D", "text": "Total parenteral nutrition with empiric antibiotics"}, {"letter": "E", "text": "Insulin infusion with glucose and bowel rest"}], "answer": "C", "explanation": "Organ failure is what turns a mild attack into a critical illness and is the trigger for intensive care. The gut is used whenever it can be: nasogastric or nasojejunal feeding is preferred over parenteral nutrition, and antibiotics are added only for an identified extra-pancreatic source, then tailored."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to serum amylase in suspected acute pancreatitis?", "options": [{"letter": "A", "text": "Send amylase only to gauge the severity of the attack"}, {"letter": "B", "text": "Send amylase only when the lipase is normal"}, {"letter": "C", "text": "Rely on the lipase alone, since amylase is not used"}, {"letter": "D", "text": "Send amylase only when symptoms have lasted more than a week"}, {"letter": "E", "text": "Send amylase alongside the lipase in every patient"}], "answer": "C", "explanation": "Amylase rises with bowel, uterine, salivary, and gallbladder disease and misses about 20% of true cases, while lipase is both more sensitive and more specific and stays up for roughly two weeks. Nothing in the amylase adds to a lipase already drawn, and the height of either enzyme does not track severity."}]}, {"case": "PA-D1", "group": "PA-D", "section": "chronic epigastric pain with greasy stools and weight loss", "objective": "", "vignette_workup": "A 44-year-old man comes to the primary care clinic with two years of recurrent epigastric pain, now nearly constant, that bores through to his back. Over the past year his stools have become bulky and greasy and he passes several large stools a day; he has lost 14 kg and feels nauseated. He has had four documented episodes of acute pancreatitis over the last eight years, drinks a pint of vodka daily and has done so for twenty years, and smokes a pack a day. His temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 98% on room air. He is cachectic with temporal wasting and a body mass index of 18.1, and has epigastric tenderness without guarding or rebound. There is no jaundice and no palpable mass.", "labs_workup": [["CT abdomen", "Amorphous \"popcorn\" calcifications across the epigastrium with parenchymal atrophy and \"chain of lakes\" ductal dilation"], ["Fecal elastase-1", "96 µg/g of stool"], ["Amylase / lipase", "62 U/L / 44 U/L"], ["Albumin", "3.1 g/dL"], ["Hemoglobin A1c", "6.3%"], ["Hemoglobin / hematocrit", "12.8 g/dL / 38%"], ["MCV", "101 fL"]], "vignette_recog": "A 44-year-old man comes to the primary care clinic with two years of recurrent epigastric pain, now nearly constant, that bores through to his back. Over the past year his stools have become bulky and greasy and he passes several large stools a day; he has lost 14 kg and feels nauseated. He has had four documented episodes of acute pancreatitis over the last eight years, drinks a pint of vodka daily and has done so for twenty years, and smokes a pack a day. His temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 98% on room air. He is cachectic with temporal wasting and a body mass index of 18.1, and has epigastric tenderness without guarding or rebound. There is no jaundice and no palpable mass.", "labs_recog": [["CT abdomen", "Amorphous \"popcorn\" calcifications across the epigastrium with parenchymal atrophy and \"chain of lakes\" ductal dilation"], ["Fecal elastase-1", "96 µg/g of stool"], ["Amylase / lipase", "62 U/L / 44 U/L"], ["Albumin", "3.1 g/dL"], ["Hemoglobin A1c", "6.3%"], ["Hemoglobin / hematocrit", "12.8 g/dL / 38%"], ["MCV", "101 fL"], ["MRCP", "Irregular, beaded main pancreatic duct with side-branch dilation"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Duodenal biopsy"}, {"letter": "B", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "C", "text": "MRCP"}, {"letter": "D", "text": "Tissue transglutaminase IgA with total IgA"}, {"letter": "E", "text": "Endoscopic ultrasound with fine-needle aspiration"}], "answer": "C", "explanation": "MRCP is the gold standard here and is more sensitive than CT for ductal change, which is where the disease is best characterized. Aspiration and duodenal biopsy answer questions about a mass and about mucosal malabsorption, neither of which the imaging raises."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Adenocarcinoma on cytology"}, {"letter": "B", "text": "Villous atrophy with intraepithelial lymphocytosis"}, {"letter": "C", "text": "An irregular, beaded main pancreatic duct with side-branch dilation"}, {"letter": "D", "text": "A homogeneously enhancing enlarged pancreas with fat stranding"}, {"letter": "E", "text": "Benign fluid with no malignant cells"}], "answer": "C", "explanation": "Repeated inflammation scars the duct unevenly, so segments narrow and the intervening segments dilate — the beaded main duct with side-branch involvement that the calcifications and atrophy on CT already implied."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Chronic pancreatitis"}, {"letter": "B", "text": "Acute pancreatitis"}, {"letter": "C", "text": "Pancreatic adenocarcinoma"}, {"letter": "D", "text": "Exocrine pancreatic insufficiency with type 3c diabetes"}, {"letter": "E", "text": "Pancreatic pseudocyst"}], "answer": "A", "explanation": "Pancreatic calcifications are essentially pathognomonic, and years of recurrent pain with alcohol and tobacco use is the standard route to them — about 10% of acute attacks progress, with the risk rising with severity, number of attacks, and exposure. The normal lipase argues against an acute attack, not against this diagnosis."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute pancreatitis"}, {"letter": "B", "text": "Pancreatic adenocarcinoma"}, {"letter": "C", "text": "Chronic pancreatitis"}, {"letter": "D", "text": "Exocrine pancreatic insufficiency with type 3c diabetes"}, {"letter": "E", "text": "Pancreatic pseudocyst"}], "answer": "C", "explanation": "A beaded main duct with side-branch dilation on MRCP, sitting alongside calcifications and atrophy, is the established ductal disease. Function has been lost too, but the picture is pain-dominant with an HbA1c of 6.3%, which is not the isolated exocrine failure of type 3c diabetes."}, {"key": "mgmt", "path": "both", "stem": "He has chronic pancreatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Pancrelipase with each meal and fat-soluble vitamin replacement"}, {"letter": "B", "text": "Alcohol and nicotine cessation, small low-fat meals, and a celiac ganglion nerve block"}, {"letter": "C", "text": "Alcohol and nicotine cessation, small low-fat meals, and acetaminophen for pain"}, {"letter": "D", "text": "Alcohol and nicotine cessation, small low-fat meals, and oxycodone for pain"}, {"letter": "E", "text": "Alcohol and nicotine cessation, small low-fat meals, and referral for distal pancreatectomy"}], "answer": "C", "explanation": "Removing alcohol and nicotine is the only measure that alters the course, and pain is treated with acetaminophen and NSAIDs first. Opioids are avoided unless absolutely necessary in a disease that lasts decades, and both the nerve block and resection belong after medical therapy has failed."}, {"key": "escalate", "path": "both", "stem": "His pain persists despite abstinence, small low-fat meals, and acetaminophen. Which of the following should be done next?", "options": [{"letter": "A", "text": "Distal pancreatectomy"}, {"letter": "B", "text": "A lifelong gluten-free diet"}, {"letter": "C", "text": "Lactated Ringer's with early enteral feeding"}, {"letter": "D", "text": "Endoscopic drainage of the collection"}, {"letter": "E", "text": "Celiac ganglion nerve block"}], "answer": "E", "explanation": "A celiac ganglion block interrupts the visceral afferents carrying the pain and is the step between medical therapy and the knife, with tricyclics, SSRIs or SNRIs as adjuvants. Surgery is a last resort, taken only once the block has also failed."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to serum amylase and lipase in chronic pancreatitis?", "options": [{"letter": "A", "text": "Normal levels exclude the diagnosis unless there are calcifications on CT"}, {"letter": "B", "text": "Normal levels exclude the diagnosis unless the fecal elastase is low"}, {"letter": "C", "text": "Normal levels do not exclude the diagnosis"}, {"letter": "D", "text": "Normal levels exclude the diagnosis"}, {"letter": "E", "text": "Normal levels exclude the diagnosis unless there has been a prior attack"}], "answer": "C", "explanation": "Enough acinar tissue has been destroyed that there is little enzyme left to leak, so amylase and lipase are usually normal in established disease. Ruling the diagnosis out on them is the classic error, and no other finding is needed to override them."}]}, {"case": "GA-C1", "group": "GA-C", "section": "early satiety and vomiting of retained food", "objective": "", "vignette_workup": "A 38-year-old woman returns to the endocrinology clinic with eight months of feeling full after a few bites, bloating after meals, nausea, and vomiting that sometimes brings up food she ate several hours earlier. She has had type 1 diabetes since she was 12 and has background retinopathy. She takes no opioids, clonidine, tricyclics, calcium channel blockers, dopamine agonists, anticholinergics, octreotide, or GLP-1 agonists, has had no gastric surgery, and has no Parkinson's disease. Her temperature is 36.7°C (98.1°F), blood pressure is 112/70 mm Hg, pulse is 96/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has epigastric distension with a succussion splash and reduced monofilament sensation in both feet, with no palpable mass and no rebound or guarding.", "labs_workup": [["Upper endoscopy after an overnight fast", "Retained food in the stomach with no obstructing lesion, no ulcer, and a patent pylorus"], ["Hemoglobin A1c", "10.4%"], ["Sodium / potassium", "138 mEq/L / 3.6 mEq/L"], ["Bicarbonate", "26 mEq/L"], ["Creatinine", "0.9 mg/dL"]], "vignette_recog": "A 38-year-old woman returns to the endocrinology clinic with eight months of feeling full after a few bites, bloating after meals, nausea, and vomiting that sometimes brings up food she ate several hours earlier. She has had type 1 diabetes since she was 12 and has background retinopathy. She takes no opioids, clonidine, tricyclics, calcium channel blockers, dopamine agonists, anticholinergics, octreotide, or GLP-1 agonists, has had no gastric surgery, and has no Parkinson's disease. Her temperature is 36.7°C (98.1°F), blood pressure is 112/70 mm Hg, pulse is 96/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has epigastric distension with a succussion splash and reduced monofilament sensation in both feet, with no palpable mass and no rebound or guarding.", "labs_recog": [["Upper endoscopy after an overnight fast", "Retained food in the stomach with no obstructing lesion, no ulcer, and a patent pylorus"], ["Hemoglobin A1c", "10.4%"], ["Sodium / potassium", "138 mEq/L / 3.6 mEq/L"], ["Bicarbonate", "26 mEq/L"], ["Creatinine", "0.9 mg/dL"], ["Gastric emptying scintigraphy, standardized solid meal", "78% of the meal retained at 2 hours and 34% retained at 4 hours (normal ≤60% at 2 h and ≤10% at 4 h)"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Gastric emptying scintigraphy with a standardized solid meal"}, {"letter": "B", "text": "Repeat basic metabolic panel during an episode of vomiting"}, {"letter": "C", "text": "Gastric biopsy for Helicobacter pylori"}, {"letter": "D", "text": "Repeat upper endoscopy with lavage of the gastric contents"}, {"letter": "E", "text": "Endoscopic biopsy of the pyloric channel"}], "answer": "A", "explanation": "Endoscopy has already answered the first question by excluding a mechanical cause, which is what makes an emptying study interpretable. Scintigraphy with a standardized meal then measures the emptying itself; meal composition matters, since fat and protein slow the stomach, so the protocol is what gives the number meaning."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "No organic lesion, with biopsies negative for Helicobacter pylori"}, {"letter": "B", "text": "Benign biopsies from a narrowed, scarred pyloric channel"}, {"letter": "C", "text": "A dark green-brown ball of matted material in the antrum"}, {"letter": "D", "text": "Three or more stereotyped episodes in the past year with normal health between"}, {"letter": "E", "text": "Retention of 78% of the meal at 2 hours and 34% at 4 hours"}], "answer": "E", "explanation": "Objectively delayed emptying is the whole of the finding, since the obstruction question was settled at endoscopy. Normal thresholds are 60% retained at 2 hours and 10% at 4 hours, and these values are well beyond both."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Bezoar"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "Cyclical vomiting syndrome"}, {"letter": "D", "text": "Peptic ulcer disease"}, {"letter": "E", "text": "Gastroparesis"}], "answer": "E", "explanation": "This is delayed gastric emptying in the absence of mechanical obstruction, and long-standing type 1 diabetes with established retinopathy and peripheral neuropathy is the classic setting. Vomiting food eaten hours earlier and a succussion splash reflect the retained meal, not a fixed lesion."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peptic ulcer disease"}, {"letter": "B", "text": "Gastroparesis"}, {"letter": "C", "text": "Bezoar"}, {"letter": "D", "text": "Cyclical vomiting syndrome"}, {"letter": "E", "text": "Gastric outlet obstruction"}], "answer": "B", "explanation": "A measured emptying delay with a patent pylorus and no intraluminal mass is the diagnosis. A bezoar would have appeared as a ball of matted material at endoscopy, and outlet obstruction would have shown a scarred channel with a hypokalemic hypochloremic alkalosis rather than normal electrolytes."}, {"key": "mgmt", "path": "both", "stem": "She has diabetic gastroparesis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Tight glycemic control with small, low-fat, low-fiber meals"}, {"letter": "B", "text": "Chemical dissolution with Coca-Cola lavage"}, {"letter": "C", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}, {"letter": "D", "text": "A proton pump inhibitor for 8 weeks with withdrawal of the offending agent"}, {"letter": "E", "text": "Intravenous fluid repletion with ondansetron"}], "answer": "A", "explanation": "Hyperglycemia itself slows gastric emptying, so glycemic control is treatment rather than background care, and fat and fiber are restricted because both delay the stomach further. Metoclopramide is added when this fails, and it carries a black box warning for tardive dyskinesia that is irreversible and independent of dose and duration."}, {"key": "escalate", "path": "both", "stem": "Her symptoms persist despite tight glycemic control, dietary modification, and metoclopramide. Which of the following should be done next?", "options": [{"letter": "A", "text": "A proton pump inhibitor for 8 weeks"}, {"letter": "B", "text": "Endoscopic injection of botulinum toxin into the pylorus"}, {"letter": "C", "text": "Chemical dissolution with Coca-Cola lavage"}, {"letter": "D", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}, {"letter": "E", "text": "Intravenous fluid repletion with ondansetron"}], "answer": "B", "explanation": "Once diet, glycemic control, and a prokinetic have failed, the pylorus is targeted directly — botulinum toxin injection first, then a gastric pacer or pyloroplasty. Erythromycin is the other prokinetic option but prolongs the QT interval and loses effect to tachyphylaxis."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to the gastric emptying study in a patient with vomiting of retained food?", "options": [{"letter": "A", "text": "Perform it before endoscopy in every patient"}, {"letter": "B", "text": "Perform it with a meal of the patient's own choosing"}, {"letter": "C", "text": "Perform it only after endoscopy has excluded mechanical obstruction"}, {"letter": "D", "text": "Perform it only when the hemoglobin A1c is above 10%"}, {"letter": "E", "text": "Perform it only when the symptoms are severe"}], "answer": "C", "explanation": "A delayed emptying result means nothing until a blocked outlet has been ruled out, because an obstructed stomach also empties slowly. The meal must also be the standardized one, and symptom severity is a poor guide either way — it correlates badly with the measured delay."}]}, {"case": "LI-A1", "group": "LI-A", "section": "the scarred liver, recognized at three stages", "objective": "", "vignette_workup": "A 61-year-old woman comes to the hepatology clinic with six months of fatigue and abdominal fullness, and her daughter has noticed that her eyes look yellow. She drank heavily for twenty-five years and stopped eighteen months ago, and she has no history of viral hepatitis. Her temperature is 36.9°C (98.4°F), blood pressure is 108/68 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 97% on room air. She has spider angiomata across the upper chest, palmar erythema, and dilated veins radiating from the umbilicus, with a spleen palpable 4 cm below the costal margin and scleral icterus. There is no shifting dullness and no asterixis.", "labs_workup": [["Platelets", "96,000/mm³"], ["INR", "1.4"], ["Albumin", "3.0 g/dL"], ["Total bilirubin", "2.4 mg/dL"], ["AST / ALT", "62 U/L / 38 U/L"], ["Creatinine / sodium", "0.9 mg/dL / 136 mEq/L"], ["Abdominal ultrasound", "Nodular liver contour with a 15 cm spleen and no ascites"], ["FIB-4", "6.4 (above 3.25 indicates likely advanced fibrosis)"], ["Transient elastography", "21 kPa"]], "vignette_recog": "A 61-year-old woman comes to the hepatology clinic with six months of fatigue and abdominal fullness, and her daughter has noticed that her eyes look yellow. She drank heavily for twenty-five years and stopped eighteen months ago, and she has no history of viral hepatitis. Her temperature is 36.9°C (98.4°F), blood pressure is 108/68 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 97% on room air. She has spider angiomata across the upper chest, palmar erythema, and dilated veins radiating from the umbilicus, with a spleen palpable 4 cm below the costal margin and scleral icterus. There is no shifting dullness and no asterixis.", "labs_recog": [["Platelets", "96,000/mm³"], ["INR", "1.4"], ["Albumin", "3.0 g/dL"], ["Total bilirubin", "2.4 mg/dL"], ["AST / ALT", "62 U/L / 38 U/L"], ["Creatinine / sodium", "0.9 mg/dL / 136 mEq/L"], ["Abdominal ultrasound", "Nodular liver contour with a 15 cm spleen and no ascites"], ["FIB-4", "6.4"], ["Transient elastography", "21 kPa"], ["Ultrasound-guided percutaneous liver biopsy", "Regenerative nodules surrounded by fibrous bands; fibrosis staged F4"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Ultrasound-guided percutaneous liver biopsy"}, {"letter": "B", "text": "Screening upper endoscopy for varices"}, {"letter": "C", "text": "Serum phosphatidylethanol"}, {"letter": "D", "text": "Transferrin saturation with ferritin"}, {"letter": "E", "text": "Diagnostic paracentesis"}], "answer": "A", "explanation": "Biopsy remains the gold standard for the extent of fibrosis and for the cause together with the degree of damage, and her INR of 1.4 and platelet count of 96,000/mm³ are both inside the safe range for a percutaneous approach. Paracentesis has nothing to sample in a patient without ascites."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A MELD score of 28"}, {"letter": "B", "text": "Regenerative nodules surrounded by fibrous bands"}, {"letter": "C", "text": "Liver stiffness of 9.8 kPa, stage F2 to F3"}, {"letter": "D", "text": "Small esophageal varices without red wale signs"}, {"letter": "E", "text": "Phosphatidylethanol positive for heavy use in the prior 2 to 6 weeks"}], "answer": "B", "explanation": "Chronic injury lays down fibrous septa that surround islands of regenerating hepatocytes, and that architecture is what stage F4 means. It is the same process the nodular contour on ultrasound and a stiffness of 21 kPa were measuring indirectly."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "MASLD with steatohepatitis"}, {"letter": "B", "text": "Decompensated cirrhosis"}, {"letter": "C", "text": "Alcohol-related fatty liver"}, {"letter": "D", "text": "Cirrhosis"}, {"letter": "E", "text": "Compensated cirrhosis"}], "answer": "D", "explanation": "Thrombocytopenia, splenomegaly, and caput medusae mark portal hypertension, and the raised INR, low albumin, and raised bilirubin mark failing synthetic function — which is what separates this from a compensated liver. Fatty liver runs with an AST:ALT above 2 and no synthetic failure."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "MASLD with steatohepatitis"}, {"letter": "B", "text": "Compensated cirrhosis"}, {"letter": "C", "text": "Cirrhosis"}, {"letter": "D", "text": "Alcohol-related fatty liver"}, {"letter": "E", "text": "Decompensated cirrhosis"}], "answer": "C", "explanation": "Regenerative nodules ringed by fibrous bands is stage F4 by definition. Synthetic function has already given way — INR 1.4, albumin 3.0 g/dL, bilirubin 2.4 mg/dL — so this is not a compensated liver, but there is no ascites, jaundiced crisis, or asterixis to call it decompensated at this visit."}, {"key": "mgmt", "path": "both", "stem": "She has alcohol-related cirrhosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Diet and exercise with 10% body-weight loss"}, {"letter": "B", "text": "Continued abstinence with hepatitis A and B vaccination"}, {"letter": "C", "text": "Treatment of the precipitant with transplant referral"}, {"letter": "D", "text": "Naltrexone 50 mg daily with abstinence counseling"}, {"letter": "E", "text": "Sodium restriction with spironolactone and furosemide"}], "answer": "B", "explanation": "Treating and removing the underlying cause is the whole of first-line therapy in cirrhosis, and vaccination protects a liver that cannot afford a second insult. Diuretics treat ascites she does not have, and transplant evaluation belongs at a MELD of 15 or above."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate recommendation regarding acetaminophen for her?", "options": [{"letter": "A", "text": "No more than 2 g daily only once she develops ascites"}, {"letter": "B", "text": "No more than 2 g daily only if the bilirubin exceeds 3 mg/dL"}, {"letter": "C", "text": "No more than 2 g daily"}, {"letter": "D", "text": "Avoid it entirely and use an NSAID instead"}, {"letter": "E", "text": "No more than 4 g daily"}], "answer": "C", "explanation": "Acetaminophen is capped at 2 g a day in cirrhosis regardless of how well compensated the liver looks, and no laboratory threshold releases the cap. NSAIDs are worse, not safer — they precipitate renal failure and variceal bleeding and are avoided entirely."}]}, {"case": "LI-C2", "group": "LI-C", "section": "the cirrhotic who is short of breath", "objective": "", "vignette_workup": "A 41-year-old woman is seen in the hepatology clinic during evaluation for liver transplantation. Over the past year she has become breathless on exertion, now on flat ground, with fatigue and ankle swelling. She has cirrhosis with portal hypertension from chronic hepatitis C. She has never smoked and has no asthma, no prior pulmonary embolism, and no connective tissue disease. Her temperature is 36.8°C (98.2°F), blood pressure is 106/70 mm Hg, pulse is 92/min, respirations are 18/min, and oxygen saturation is 95% on room air. She has a loud P2, jugular venous distention to the jaw, a right ventricular heave, and 2+ peripheral edema. Her lungs are clear and there is no clubbing and no cyanosis.", "labs_workup": [["Chest radiograph", "Enlarged central pulmonary arteries with cardiomegaly"], ["Echocardiogram with Doppler", "Estimated right ventricular systolic pressure 62 mm Hg, with a dilated right ventricle and a flattened interventricular septum"], ["Bubble study", "Negative for intrapulmonary shunt"]], "vignette_recog": "A 41-year-old woman is seen in the hepatology clinic during evaluation for liver transplantation. Over the past year she has become breathless on exertion, now on flat ground, with fatigue and ankle swelling. She has cirrhosis with portal hypertension from chronic hepatitis C. She has never smoked and has no asthma, no prior pulmonary embolism, and no connective tissue disease. Her temperature is 36.8°C (98.2°F), blood pressure is 106/70 mm Hg, pulse is 92/min, respirations are 18/min, and oxygen saturation is 95% on room air. She has a loud P2, jugular venous distention to the jaw, a right ventricular heave, and 2+ peripheral edema. Her lungs are clear and there is no clubbing and no cyanosis.", "labs_recog": [["Chest radiograph", "Enlarged central pulmonary arteries with cardiomegaly"], ["Echocardiogram with Doppler", "Estimated right ventricular systolic pressure 62 mm Hg, with a dilated right ventricle and a flattened interventricular septum"], ["Bubble study", "Negative for intrapulmonary shunt"], ["Right heart catheterization", "Mean pulmonary artery pressure 44 mm Hg, pulmonary vascular resistance 5.8 Wood units, pulmonary capillary wedge pressure 10 mm Hg"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Arterial blood gas on room air"}, {"letter": "B", "text": "Right heart catheterization"}, {"letter": "C", "text": "Abdominal ultrasound"}, {"letter": "D", "text": "Serum natriuretic peptide"}, {"letter": "E", "text": "Diagnostic thoracentesis with fluid studies"}], "answer": "B", "explanation": "The echocardiogram only estimates right-sided pressure; catheterization measures it, and it is the only study that separates a pre-capillary problem from a raised filling pressure by giving the wedge alongside it. A blood gas would be the next move if the bubble study had been positive."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A transudate with a protein ratio of 0.18 and an LDH ratio of 0.36"}, {"letter": "B", "text": "Large-volume ascites around a nodular liver with splenomegaly"}, {"letter": "C", "text": "A markedly raised natriuretic peptide with a reduced ejection fraction"}, {"letter": "D", "text": "PaO₂ 56 mm Hg with an alveolar-arterial gradient of 53 mm Hg"}, {"letter": "E", "text": "Mean pulmonary artery pressure 44 mm Hg with a wedge pressure of 10 mm Hg"}], "answer": "E", "explanation": "A high mean pulmonary artery pressure with a normal wedge and a raised pulmonary vascular resistance locates the obstruction in the pulmonary arterioles themselves rather than behind a failing left ventricle. That is the pre-capillary pattern."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Portopulmonary hypertension"}, {"letter": "B", "text": "Decompensated heart failure"}, {"letter": "C", "text": "Ascites"}, {"letter": "D", "text": "Hepatohydrothorax"}, {"letter": "E", "text": "Hepatopulmonary syndrome"}], "answer": "A", "explanation": "Hormonal and pressure changes from cirrhosis remodel the pulmonary arterial vasculature, and the loud P2, right ventricular heave, and raised jugular venous pressure are that remodeling working backwards. Hepatopulmonary syndrome is the mirror image — a shunt on the bubble study with hypoxemia, neither of which she has."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Portopulmonary hypertension"}, {"letter": "B", "text": "Decompensated heart failure"}, {"letter": "C", "text": "Hepatopulmonary syndrome"}, {"letter": "D", "text": "Hepatohydrothorax"}, {"letter": "E", "text": "Ascites"}], "answer": "A", "explanation": "High pre-capillary pressures in a patient with portal hypertension make the diagnosis. The normal wedge excludes a cardiac cause, and the negative bubble study with preserved oxygen saturation excludes the shunt physiology of hepatopulmonary syndrome."}, {"key": "mgmt", "path": "both", "stem": "She has portopulmonary hypertension. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "B", "text": "Pulmonary vasodilator therapy"}, {"letter": "C", "text": "Supplemental oxygen"}, {"letter": "D", "text": "Diuresis with guideline-directed heart failure therapy"}, {"letter": "E", "text": "Therapeutic thoracentesis"}], "answer": "B", "explanation": "The pulmonary arterial bed is treated exactly as it would be in pulmonary hypertension unrelated to liver disease. Oxygen is the answer to the shunt of hepatopulmonary syndrome, and diuresis treats fluid, not a remodeled arteriole."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to liver transplantation in this patient?", "options": [{"letter": "A", "text": "Proceed only once the peripheral edema has resolved"}, {"letter": "B", "text": "Proceed only once the pulmonary pressures are controlled"}, {"letter": "C", "text": "Proceed only once the bubble study turns positive"}, {"letter": "D", "text": "Proceed as soon as she is listed, whatever the pulmonary pressures"}, {"letter": "E", "text": "Proceed only once she becomes hypoxemic on room air"}], "answer": "B", "explanation": "Uncontrolled portopulmonary hypertension is itself a transplant risk, so the error is sending an uncontrolled patient to the operating room rather than delaying the referral. Hypoxemia and a positive bubble study belong to hepatopulmonary syndrome and are not the gate here."}]}, {"case": "LI-E3", "group": "LI-E", "section": "fat in the liver, and what it turns into", "objective": "", "vignette_workup": "A 43-year-old man is brought to the emergency department with ten days of yellow eyes and skin following a two-week binge. He has had no appetite for a month and a dull right upper quadrant ache. He has been drinking daily for twenty years, with a sharp uptick over the past month after losing his job. He has taken no acetaminophen and no new medications and has never been admitted for liver disease. His temperature is 38.1°C (100.6°F), blood pressure is 108/68 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 97% on room air. He is deeply jaundiced with scleral icterus, has a tender liver 5 cm below the costal margin, and has small-volume ascites. There is no asterixis.", "labs_workup": [["WBC", "16,800/mm³ with 82% neutrophils"], ["Platelets", "118,000/mm³"], ["Albumin", "2.6 g/dL"], ["Creatinine", "1.2 mg/dL"], ["Sodium", "132 mEq/L"]], "vignette_recog": "A 43-year-old man is brought to the emergency department with ten days of yellow eyes and skin following a two-week binge. He has had no appetite for a month and a dull right upper quadrant ache. He has been drinking daily for twenty years, with a sharp uptick over the past month after losing his job. He has taken no acetaminophen and no new medications and has never been admitted for liver disease. His temperature is 38.1°C (100.6°F), blood pressure is 108/68 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 97% on room air. He is deeply jaundiced with scleral icterus, has a tender liver 5 cm below the costal margin, and has small-volume ascites. There is no asterixis.", "labs_recog": [["AST / ALT", "186 U/L / 74 U/L"], ["Total bilirubin", "14.6 mg/dL (direct 10.2)"], ["PT / INR", "22 seconds against a control of 12 seconds / 1.9"], ["WBC", "16,800/mm³ with 82% neutrophils"], ["Platelets", "118,000/mm³"], ["Albumin", "2.6 g/dL"], ["Creatinine", "1.2 mg/dL"], ["Sodium", "132 mEq/L"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Transferrin saturation with ferritin"}, {"letter": "B", "text": "AST and ALT with alkaline phosphatase and bilirubin"}, {"letter": "C", "text": "Comprehensive metabolic panel with bilirubin and PT/INR"}, {"letter": "D", "text": "Liver ultrasound with AST and ALT"}, {"letter": "E", "text": "AST and ALT with GGT"}], "answer": "C", "explanation": "The prothrombin time and INR are the best markers of acute liver dysfunction and belong in the opening panel, not in a second round of tests. Albumin has a three-week half-life and cannot register an injury ten days old, so a panel without the INR misses the measurement that matters most."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Alkaline phosphatase 410 U/L with an ALT of 180 U/L"}, {"letter": "B", "text": "Hepatic steatosis with ALT 96 U/L and AST 58 U/L"}, {"letter": "C", "text": "AST 118 U/L and ALT 48 U/L with a GGT of 310 U/L"}, {"letter": "D", "text": "AST 186 U/L above ALT 74 U/L with a bilirubin of 14.6 mg/dL"}, {"letter": "E", "text": "Transferrin saturation 68% with a ferritin of 940 ng/mL"}], "answer": "D", "explanation": "Alcohol injures mitochondria preferentially, so the aspartate transaminase leads, and the ratio holds while both enzymes stay modest — AST rarely exceeds 400 U/L here. What marks this out from simple fatty liver is that the bilirubin has climbed with it."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alcohol-related fatty liver"}, {"letter": "B", "text": "Drug-induced hepatitis"}, {"letter": "C", "text": "Acute alcohol-related hepatitis"}, {"letter": "D", "text": "Hemochromatosis"}, {"letter": "E", "text": "MASLD with steatohepatitis"}], "answer": "C", "explanation": "Jaundice appearing days to weeks after a binge, with fever, a tender enlarged liver, and a neutrophil-rich leukocytosis, is the syndrome. Fatty liver shares the drinking history and the AST:ALT ratio but not the hyperbilirubinemia, leukocytosis, or prolonged INR."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hemochromatosis"}, {"letter": "B", "text": "Acute alcohol-related hepatitis"}, {"letter": "C", "text": "Alcohol-related fatty liver"}, {"letter": "D", "text": "Drug-induced hepatitis"}, {"letter": "E", "text": "MASLD with steatohepatitis"}], "answer": "B", "explanation": "AST above ALT with neither above 400 U/L, a bilirubin of 14.6 mg/dL, and an INR of 1.9 in a man jaundiced after a binge is the picture. This is one of the deadliest syndromes in hepatology, with 20 to 50% mortality at three months when severe."}, {"key": "mgmt", "path": "both", "stem": "He has acute alcohol-related hepatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Abstinence counseling with naltrexone 50 mg daily"}, {"letter": "B", "text": "Abstinence with early nutrition, thiamine, and vitamin K"}, {"letter": "C", "text": "Withdrawal of the offending medication"}, {"letter": "D", "text": "Serial phlebotomy with avoidance of alcohol and iron"}, {"letter": "E", "text": "Diet and exercise with 10% body-weight loss"}], "answer": "B", "explanation": "Abstinence with prompt enteral access and 80 to 100 g of protein a day is the backbone, alongside thiamine, B12, a multivitamin, and vitamin K. He meets several admission criteria on his own — a bilirubin above 20 mg/dL, an INR above 2, hypoalbuminemia, or instability would each suffice."}, {"key": "escalate", "path": "both", "stem": "He remains deeply jaundiced on abstinence and nutritional support, with a Maddrey discriminant function of 61. Which of the following should be added?", "options": [{"letter": "A", "text": "Intravenous albumin"}, {"letter": "B", "text": "Prednisolone 40 mg daily for 28 days"}, {"letter": "C", "text": "Diet and exercise with 10% body-weight loss"}, {"letter": "D", "text": "Naltrexone 50 mg daily"}, {"letter": "E", "text": "Serial phlebotomy"}], "answer": "B", "explanation": "The Maddrey discriminant function is what decides on steroids, and 61 is well past the threshold of 32. Infection must be treated before and during the course, because death in the first thirty days is usually infection or multi-organ failure; albumin is for kidney injury, which his creatinine of 1.2 mg/dL does not show."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to assessing the severity of his liver dysfunction?", "options": [{"letter": "A", "text": "Use the aminotransferase level, and the INR only if it exceeds 400 U/L"}, {"letter": "B", "text": "Use the prothrombin time and INR"}, {"letter": "C", "text": "Use the serum albumin, and the INR only if the albumin is normal"}, {"letter": "D", "text": "Use the serum albumin"}, {"letter": "E", "text": "Use the aminotransferase level"}], "answer": "B", "explanation": "Clotting factors have half-lives measured in hours, so the INR tracks synthetic failure in real time. Albumin's three-week half-life means a near-normal value must not reassure, and the height of the transaminases says nothing about how much liver is still working."}]}, {"case": "LI-F2", "group": "LI-F", "section": "the inherited liver: unexplained transaminases with a clue outside the liver", "objective": "", "vignette_workup": "A 26-year-old man is referred to the hepatology clinic by his psychiatrist. For six months he has had a coarse tremor in both hands, slurred speech, and handwriting that has shrunk to the point of being unreadable, and his family describes irritability and a change in personality. A brother had liver problems in his twenties. He was recently started on an antipsychotic with no benefit. He drinks no alcohol and takes no other medication. His temperature is 36.7°C (98.1°F), blood pressure is 118/72 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has a wing-beating tremor with dysarthria, mild scleral icterus, and a liver edge 2 cm below the costal margin. There is no asterixis and no ascites.", "labs_workup": [["Ceruloplasmin", "8 mg/dL (threshold 20 mg/dL)"], ["24-hour urinary copper", "210 µg"], ["Slit-lamp examination", "Kayser-Fleischer rings present"], ["AST / ALT", "96 U/L / 78 U/L"], ["Total bilirubin / INR", "2.2 mg/dL / 1.2"], ["Hemoglobin / hematocrit", "11.8 g/dL / 35%"], ["Haptoglobin", "Low"]], "vignette_recog": "A 26-year-old man is referred to the hepatology clinic by his psychiatrist. For six months he has had a coarse tremor in both hands, slurred speech, and handwriting that has shrunk to the point of being unreadable, and his family describes irritability and a change in personality. A brother had liver problems in his twenties. He was recently started on an antipsychotic with no benefit. He drinks no alcohol and takes no other medication. His temperature is 36.7°C (98.1°F), blood pressure is 118/72 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has a wing-beating tremor with dysarthria, mild scleral icterus, and a liver edge 2 cm below the costal margin. There is no asterixis and no ascites.", "labs_recog": [["Ceruloplasmin", "8 mg/dL (threshold 20 mg/dL)"], ["24-hour urinary copper", "210 µg"], ["Slit-lamp examination", "Kayser-Fleischer rings present"], ["AST / ALT", "96 U/L / 78 U/L"], ["Total bilirubin / INR", "2.2 mg/dL / 1.2"], ["Hemoglobin / hematocrit", "11.8 g/dL / 35%"], ["Haptoglobin", "Low"], ["ATP7B genetic testing", "Two pathogenic mutations"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HFE gene testing"}, {"letter": "B", "text": "Alpha-1 antitrypsin genotype and phenotype testing"}, {"letter": "C", "text": "Liver biopsy for interface hepatitis"}, {"letter": "D", "text": "ATP7B genetic testing"}, {"letter": "E", "text": "Transient elastography"}], "answer": "D", "explanation": "Genetic testing is now the standard confirmation once the copper studies point the way, with biopsy for hepatic copper reserved as the criterion standard when the genetics do not settle it. The other assays confirm different inherited diseases entirely."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "B", "text": "Liver stiffness of 9.8 kPa, stage F2 to F3"}, {"letter": "C", "text": "Two pathogenic ATP7B mutations"}, {"letter": "D", "text": "Homozygous C282Y"}, {"letter": "E", "text": "A ZZ genotype"}], "answer": "C", "explanation": "The defect is reduced vesicular secretion of copper into bile together with impaired incorporation of copper into ceruloplasmin, and it takes two abnormal alleles to produce it. That is why a low ceruloplasmin, a high urinary copper, and corneal deposition arrive together."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "B", "text": "MASLD with steatohepatitis"}, {"letter": "C", "text": "Wilson's disease"}, {"letter": "D", "text": "Hemochromatosis"}, {"letter": "E", "text": "Autoimmune hepatitis"}], "answer": "C", "explanation": "Liver disease in a patient in his twenties together with neurologic or psychiatric findings is the rule that names this disease, and the anemia with a low haptoglobin is its hemolytic component. Hemochromatosis presents later with iron studies, bronze skin, and small-joint arthropathy."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "B", "text": "Autoimmune hepatitis"}, {"letter": "C", "text": "MASLD with steatohepatitis"}, {"letter": "D", "text": "Wilson's disease"}, {"letter": "E", "text": "Hemochromatosis"}], "answer": "D", "explanation": "Two pathogenic ATP7B mutations settle it, and everything else follows from failed biliary copper excretion — corneal rings, a low ceruloplasmin, a high urinary copper, hemolysis, and the movement disorder his psychiatrist was treating as an illness of its own."}, {"key": "mgmt", "path": "both", "stem": "He has Wilson's disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Monitoring with smoking cessation"}, {"letter": "B", "text": "Diet and exercise with 10% body-weight loss"}, {"letter": "C", "text": "Prednisone 40 mg daily as induction"}, {"letter": "D", "text": "A low-copper diet with D-penicillamine"}, {"letter": "E", "text": "Serial phlebotomy with avoidance of alcohol and iron"}], "answer": "D", "explanation": "Copper intake is restricted and the accumulated copper is removed, with trientine or zinc acetate as alternatives to the chelator. Phlebotomy removes iron and does nothing for copper."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to testing for Wilson's disease?", "options": [{"letter": "A", "text": "Test only patients with Kayser-Fleischer rings on slit lamp"}, {"letter": "B", "text": "Test only patients with an affected sibling"}, {"letter": "C", "text": "Test young patients with liver disease and neuropsychiatric findings"}, {"letter": "D", "text": "Test only patients with a hemolytic anemia"}, {"letter": "E", "text": "Test only patients who have progressed to acute liver failure"}], "answer": "C", "explanation": "The combination of a young liver and a nervous system that has started to misbehave is the trigger to test, and waiting for any single confirmatory feature is how the diagnosis is missed for years. It can also present outright as acute liver failure, which is far too late to begin looking."}]}, {"case": "VH-B3", "group": "VH-B", "section": "hepatitis B, read off the serologic panel", "objective": "", "vignette_workup": "A 47-year-old woman comes to the hepatology clinic. She is usually asymptomatic but has had six months of fatigue and reduced appetite with an 8-pound weight loss and intermittent itching. She was born in Vietnam and has never had an acute hepatitis illness. She drinks no alcohol and has never injected drugs, and she has had two prednisone bursts for asthma in the past year. Her temperature is 36.8°C (98.2°F), blood pressure is 124/78 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. She has spider angiomata across the upper chest and palmar erythema, a liver edge 2 cm below the costal margin, and a palpable spleen tip. There is no ascites and no asterixis, and her sclerae are anicteric.", "labs_workup": [["AST / ALT", "58 U/L / 74 U/L"], ["Alkaline phosphatase", "110 U/L"], ["Total bilirubin", "1.3 mg/dL"], ["Albumin", "3.6 g/dL"], ["PT / INR", "13.0 seconds / 1.1"], ["Platelets", "148,000/mm³"], ["Hemoglobin / hematocrit", "12.6 g/dL / 38%"], ["Creatinine", "0.8 mg/dL"], ["Alpha-fetoprotein", "4.2 ng/mL"], ["Abdominal ultrasound", "Coarse hepatic echotexture with no focal lesion"]], "vignette_recog": "A 47-year-old woman comes to the hepatology clinic. She is usually asymptomatic but has had six months of fatigue and reduced appetite with an 8-pound weight loss and intermittent itching. She was born in Vietnam and has never had an acute hepatitis illness, though her hepatitis B surface antigen was documented positive three years ago. She drinks no alcohol and has never injected drugs, and she has had two prednisone bursts for asthma in the past year. Her t
