d rectal involvement would argue for another diagnosis.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D2", "pgroup": "CO-D"}, {"id": "15C", "group": 15, "stem": "He has ischemic colitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Ciprofloxacin and metronidazole with clear liquids"}, {"letter": "B", "text": "Bowel rest with intravenous fluids, ciprofloxacin, and metronidazole"}, {"letter": "C", "text": "Systemic heparin, antibiotics, and mesenteric revascularization"}, {"letter": "D", "text": "Correct the low-flow state, stop vasoconstrictors, and give fluids, antibiotics, and heparin"}, {"letter": "E", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}], "answer": "B", "explanation": "The colon is rested while perfusion is restored with fluids, and empiric antibiotics cover the translocation across an injured mucosa. Digitalis promotes splanchnic vasoconstriction and is stopped, but heparin and revascularization belong to arterial occlusion, which this is not.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D2", "pgroup": "CO-D"}, {"id": "16", "group": 16, "stem": "A 29-year-old man presents to the emergency department with eight hours of sudden, severe, constant epigastric pain that bores through to his back. The pain eases when he sits up and leans forward and is worse lying flat or after he tries to drink. He has vomited six times and has no appetite. He has Crohn's disease and began azathioprine six weeks ago. He does not drink alcohol, has never had gallstones or biliary colic, and has had no recent ERCP. His temperature is 38.1°C (100.6°F), blood pressure is 124/76 mm Hg, pulse is 110/min, respirations are 18/min, and oxygen saturation is 98% on room air. He has epigastric tenderness with mild distention and reduced bowel sounds, with no guarding, rebound, or rigidity and no scleral icterus.\n\nStudies:\n    WBC — 15,600/mm³\n    Hemoglobin / hematocrit — 16.3 g/dL / 49%\n    Platelets — 264,000/mm³\n    Calcium — 8.4 mg/dL\n    BUN / creatinine — 18 mg/dL / 0.9 mg/dL\n    Triglycerides — 142 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT of the abdomen with fecal elastase-1"}, {"letter": "B", "text": "MRCP of the biliary tree"}, {"letter": "C", "text": "Serum lipase with right upper quadrant ultrasound"}, {"letter": "D", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "E", "text": "Upright chest and abdominal radiographs"}], "answer": "C", "explanation": "Lipase is the opening test in acute epigastric pain radiating to the back: it is more sensitive and specific than amylase and stays elevated for about two weeks. The ultrasound is sent with it because gallstones are the most common cause and their presence changes what happens next. Cross-sectional imaging answers a later question.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A1", "pgroup": "PA-A"}, {"id": "16A", "group": 16, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Lipase 742 U/L with no gallstones and normal liver enzymes"}, {"letter": "B", "text": "Pancreatic calcifications with parenchymal atrophy and a normal lipase"}, {"letter": "C", "text": "Lipase 1,120 U/L with magnesium 1.2 mg/dL and phosphorus 1.8 mg/dL"}, {"letter": "D", "text": "Triglycerides 3,850 mg/dL with grossly lipemic serum"}, {"letter": "E", "text": "Lipase 980 U/L with ALT 224 U/L, bilirubin 3.4 mg/dL, and a 9 mm common bile duct"}], "answer": "A", "explanation": "A lipase more than three times the upper limit of normal establishes acute pancreatic inflammation, and the ultrasound and liver enzymes then sort the cause. Normal enzymes with a normal-caliber duct and no stones point away from a biliary origin and toward an exposure.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A1", "pgroup": "PA-A"}, {"id": "16B", "group": 16, "stem": "Which of the following studies would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "CT of the abdomen with oral and intravenous contrast"}, {"letter": "B", "text": "Plasma triglyceride level"}, {"letter": "C", "text": "MRCP"}, {"letter": "D", "text": "Repeat contrast-enhanced CT at 5 to 7 days"}, {"letter": "E", "text": "Contrast-enhanced CT of the abdomen"}], "answer": "E", "explanation": "Contrast-enhanced CT is the imaging gold standard and shows the inflamed gland directly. It is reserved for diagnostic uncertainty or for staging complications at 72 hours or beyond, which is why it follows rather than replaces lipase and ultrasound.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A1", "pgroup": "PA-A"}, {"id": "16C", "group": 16, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hypertriglyceridemia-induced pancreatitis"}, {"letter": "B", "text": "Drug-induced acute pancreatitis"}, {"letter": "C", "text": "Gallstone pancreatitis"}, {"letter": "D", "text": "Chronic pancreatitis"}, {"letter": "E", "text": "Alcoholic pancreatitis"}], "answer": "B", "explanation": "Azathioprine sits near the top of the list of drugs that cause pancreatitis, alongside 5-ASA, mercaptopurine, furosemide and thiazides, sulfonamides, and valproic acid, and six weeks is the right interval. With no stones, no alcohol, and a normal triglyceride, the drug is what is left.", "objective": "", "section": "acute severe epigastric pain radiating to the back", "pcase": "PA-A1", "pgroup": "PA-A"}, {"id": "17", "group": 17, "stem": "A 44-year-old man comes to the primary care clinic with two years of recurrent epigastric pain, now nearly constant, that bores through to his back. Over the past year his stools have become bulky and greasy and he passes several large stools a day; he has lost 14 kg and feels nauseated. He has had four documented episodes of acute pancreatitis over the last eight years, drinks a pint of vodka daily and has done so for twenty years, and smokes a pack a day. His temperature is 36.8°C (98.2°F), blood pressure is 112/70 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 98% on room air. He is cachectic with temporal wasting and a body mass index of 18.1, and has epigastric tenderness without guarding or rebound. There is no jaundice and no palpable mass.\n\nStudies:\n    CT abdomen — Amorphous \"popcorn\" calcifications across the epigastrium with parenchymal atrophy and \"chain of lakes\" ductal dilation\n    Fecal elastase-1 — 96 µg/g of stool\n    Amylase / lipase — 62 U/L / 44 U/L\n    Albumin — 3.1 g/dL\n    Hemoglobin A1c — 6.3%\n    Hemoglobin / hematocrit — 12.8 g/dL / 38%\n    MCV — 101 fL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Duodenal biopsy"}, {"letter": "B", "text": "Contrast-enhanced CT of the abdomen"}, {"letter": "C", "text": "MRCP"}, {"letter": "D", "text": "Tissue transglutaminase IgA with total IgA"}, {"letter": "E", "text": "Endoscopic ultrasound with fine-needle aspiration"}], "answer": "C", "explanation": "MRCP is the gold standard here and is more sensitive than CT for ductal change, which is where the disease is best characterized. Aspiration and duodenal biopsy answer questions about a mass and about mucosal malabsorption, neither of which the imaging raises.", "objective": "", "section": "chronic epigastric pain with greasy stools and weight loss", "pcase": "PA-D1", "pgroup": "PA-D"}, {"id": "17A", "group": 17, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Adenocarcinoma on cytology"}, {"letter": "B", "text": "Villous atrophy with intraepithelial lymphocytosis"}, {"letter": "C", "text": "An irregular, beaded main pancreatic duct with side-branch dilation"}, {"letter": "D", "text": "A homogeneously enhancing enlarged pancreas with fat stranding"}, {"letter": "E", "text": "Benign fluid with no malignant cells"}], "answer": "C", "explanation": "Repeated inflammation scars the duct unevenly, so segments narrow and the intervening segments dilate — the beaded main duct with side-branch involvement that the calcifications and atrophy on CT already implied.", "objective": "", "section": "chronic epigastric pain with greasy stools and weight loss", "pcase": "PA-D1", "pgroup": "PA-D"}, {"id": "17B", "group": 17, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Chronic pancreatitis"}, {"letter": "B", "text": "Acute pancreatitis"}, {"letter": "C", "text": "Pancreatic adenocarcinoma"}, {"letter": "D", "text": "Exocrine pancreatic insufficiency with type 3c diabetes"}, {"letter": "E", "text": "Pancreatic pseudocyst"}], "answer": "A", "explanation": "Pancreatic calcifications are essentially pathognomonic, and years of recurrent pain with alcohol and tobacco use is the standard route to them — about 10% of acute attacks progress, with the risk rising with severity, number of attacks, and exposure. The normal lipase argues against an acute attack, not against this diagnosis.", "objective": "", "section": "chronic epigastric pain with greasy stools and weight loss", "pcase": "PA-D1", "pgroup": "PA-D"}, {"id": "17C", "group": 17, "stem": "He has chronic pancreatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Pancrelipase with each meal and fat-soluble vitamin replacement"}, {"letter": "B", "text": "Alcohol and nicotine cessation, small low-fat meals, and a celiac ganglion nerve block"}, {"letter": "C", "text": "Alcohol and nicotine cessation, small low-fat meals, and acetaminophen for pain"}, {"letter": "D", "text": "Alcohol and nicotine cessation, small low-fat meals, and oxycodone for pain"}, {"letter": "E", "text": "Alcohol and nicotine cessation, small low-fat meals, and referral for distal pancreatectomy"}], "answer": "C", "explanation": "Removing alcohol and nicotine is the only measure that alters the course, and pain is treated with acetaminophen and NSAIDs first. Opioids are avoided unless absolutely necessary in a disease that lasts decades, and both the nerve block and resection belong after medical therapy has failed.", "objective": "", "section": "chronic epigastric pain with greasy stools and weight loss", "pcase": "PA-D1", "pgroup": "PA-D"}, {"id": "18", "group": 18, "stem": "A 38-year-old woman returns to the endocrinology clinic with eight months of feeling full after a few bites, bloating after meals, nausea, and vomiting that sometimes brings up food she ate several hours earlier. She has had type 1 diabetes since she was 12 and has background retinopathy. She takes no opioids, clonidine, tricyclics, calcium channel blockers, dopamine agonists, anticholinergics, octreotide, or GLP-1 agonists, has had no gastric surgery, and has no Parkinson's disease. Her temperature is 36.7°C (98.1°F), blood pressure is 112/70 mm Hg, pulse is 96/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has epigastric distension with a succussion splash and reduced monofilament sensation in both feet, with no palpable mass and no rebound or guarding.\n\nStudies:\n    Upper endoscopy after an overnight fast — Retained food in the stomach with no obstructing lesion, no ulcer, and a patent pylorus\n    Hemoglobin A1c — 10.4%\n    Sodium / potassium — 138 mEq/L / 3.6 mEq/L\n    Bicarbonate — 26 mEq/L\n    Creatinine — 0.9 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Gastric emptying scintigraphy with a standardized solid meal"}, {"letter": "B", "text": "Repeat basic metabolic panel during an episode of vomiting"}, {"letter": "C", "text": "Gastric biopsy for Helicobacter pylori"}, {"letter": "D", "text": "Repeat upper endoscopy with lavage of the gastric contents"}, {"letter": "E", "text": "Endoscopic biopsy of the pyloric channel"}], "answer": "A", "explanation": "Endoscopy has already answered the first question by excluding a mechanical cause, which is what makes an emptying study interpretable. Scintigraphy with a standardized meal then measures the emptying itself; meal composition matters, since fat and protein slow the stomach, so the protocol is what gives the number meaning.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C1", "pgroup": "GA-C"}, {"id": "18A", "group": 18, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "No organic lesion, with biopsies negative for Helicobacter pylori"}, {"letter": "B", "text": "Benign biopsies from a narrowed, scarred pyloric channel"}, {"letter": "C", "text": "A dark green-brown ball of matted material in the antrum"}, {"letter": "D", "text": "Three or more stereotyped episodes in the past year with normal health between"}, {"letter": "E", "text": "Retention of 78% of the meal at 2 hours and 34% at 4 hours"}], "answer": "E", "explanation": "Objectively delayed emptying is the whole of the finding, since the obstruction question was settled at endoscopy. Normal thresholds are 60% retained at 2 hours and 10% at 4 hours, and these values are well beyond both.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C1", "pgroup": "GA-C"}, {"id": "18B", "group": 18, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Bezoar"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "Cyclical vomiting syndrome"}, {"letter": "D", "text": "Peptic ulcer disease"}, {"letter": "E", "text": "Gastroparesis"}], "answer": "E", "explanation": "This is delayed gastric emptying in the absence of mechanical obstruction, and long-standing type 1 diabetes with established retinopathy and peripheral neuropathy is the classic setting. Vomiting food eaten hours earlier and a succussion splash reflect the retained meal, not a fixed lesion.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C1", "pgroup": "GA-C"}, {"id": "18C", "group": 18, "stem": "She has diabetic gastroparesis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Tight glycemic control with small, low-fat, low-fiber meals"}, {"letter": "B", "text": "Chemical dissolution with Coca-Cola lavage"}, {"letter": "C", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}, {"letter": "D", "text": "A proton pump inhibitor for 8 weeks with withdrawal of the offending agent"}, {"letter": "E", "text": "Intravenous fluid repletion with ondansetron"}], "answer": "A", "explanation": "Hyperglycemia itself slows gastric emptying, so glycemic control is treatment rather than background care, and fat and fiber are restricted because both delay the stomach further. Metoclopramide is added when this fails, and it carries a black box warning for tardive dyskinesia that is irreversible and independent of dose and duration.", "objective": "", "section": "early satiety and vomiting of retained food", "pcase": "GA-C1", "pgroup": "GA-C"}, {"id": "19", "group": 19, "stem": "A 61-year-old woman comes to the hepatology clinic with six months of fatigue and abdominal fullness, and her daughter has noticed that her eyes look yellow. She drank heavily for twenty-five years and stopped eighteen months ago, and she has no history of viral hepatitis. Her temperature is 36.9°C (98.4°F), blood pressure is 108/68 mm Hg, pulse is 84/min, respirations are 16/min, and oxygen saturation is 97% on room air. She has spider angiomata across the upper chest, palmar erythema, and dilated veins radiating from the umbilicus, with a spleen palpable 4 cm below the costal margin and scleral icterus. There is no shifting dullness and no asterixis.\n\nStudies:\n    Platelets — 96,000/mm³\n    INR — 1.4\n    Albumin — 3.0 g/dL\n    Total bilirubin — 2.4 mg/dL\n    AST / ALT — 62 U/L / 38 U/L\n    Creatinine / sodium — 0.9 mg/dL / 136 mEq/L\n    Abdominal ultrasound — Nodular liver contour with a 15 cm spleen and no ascites\n    FIB-4 — 6.4 (above 3.25 indicates likely advanced fibrosis)\n    Transient elastography — 21 kPa\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Ultrasound-guided percutaneous liver biopsy"}, {"letter": "B", "text": "Screening upper endoscopy for varices"}, {"letter": "C", "text": "Serum phosphatidylethanol"}, {"letter": "D", "text": "Transferrin saturation with ferritin"}, {"letter": "E", "text": "Diagnostic paracentesis"}], "answer": "A", "explanation": "Biopsy remains the gold standard for the extent of fibrosis and for the cause together with the degree of damage, and her INR of 1.4 and platelet count of 96,000/mm³ are both inside the safe range for a percutaneous approach. Paracentesis has nothing to sample in a patient without ascites.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A1", "pgroup": "LI-A"}, {"id": "19A", "group": 19, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A MELD score of 28"}, {"letter": "B", "text": "Regenerative nodules surrounded by fibrous bands"}, {"letter": "C", "text": "Liver stiffness of 9.8 kPa, stage F2 to F3"}, {"letter": "D", "text": "Small esophageal varices without red wale signs"}, {"letter": "E", "text": "Phosphatidylethanol positive for heavy use in the prior 2 to 6 weeks"}], "answer": "B", "explanation": "Chronic injury lays down fibrous septa that surround islands of regenerating hepatocytes, and that architecture is what stage F4 means. It is the same process the nodular contour on ultrasound and a stiffness of 21 kPa were measuring indirectly.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A1", "pgroup": "LI-A"}, {"id": "19B", "group": 19, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "MASLD with steatohepatitis"}, {"letter": "B", "text": "Decompensated cirrhosis"}, {"letter": "C", "text": "Alcohol-related fatty liver"}, {"letter": "D", "text": "Cirrhosis"}, {"letter": "E", "text": "Compensated cirrhosis"}], "answer": "D", "explanation": "Thrombocytopenia, splenomegaly, and caput medusae mark portal hypertension, and the raised INR, low albumin, and raised bilirubin mark failing synthetic function — which is what separates this from a compensated liver. Fatty liver runs with an AST:ALT above 2 and no synthetic failure.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A1", "pgroup": "LI-A"}, {"id": "19C", "group": 19, "stem": "She has alcohol-related cirrhosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Diet and exercise with 10% body-weight loss"}, {"letter": "B", "text": "Continued abstinence with hepatitis A and B vaccination"}, {"letter": "C", "text": "Treatment of the precipitant with transplant referral"}, {"letter": "D", "text": "Naltrexone 50 mg daily with abstinence counseling"}, {"letter": "E", "text": "Sodium restriction with spironolactone and furosemide"}], "answer": "B", "explanation": "Treating and removing the underlying cause is the whole of first-line therapy in cirrhosis, and vaccination protects a liver that cannot afford a second insult. Diuretics treat ascites she does not have, and transplant evaluation belongs at a MELD of 15 or above.", "objective": "", "section": "the scarred liver, recognized at three stages", "pcase": "LI-A1", "pgroup": "LI-A"}, {"id": "20", "group": 20, "stem": "A 41-year-old woman is seen in the hepatology clinic during evaluation for liver transplantation. Over the past year she has become breathless on exertion, now on flat ground, with fatigue and ankle swelling. She has cirrhosis with portal hypertension from chronic hepatitis C. She has never smoked and has no asthma, no prior pulmonary embolism, and no connective tissue disease. Her temperature is 36.8°C (98.2°F), blood pressure is 106/70 mm Hg, pulse is 92/min, respirations are 18/min, and oxygen saturation is 95% on room air. She has a loud P2, jugular venous distention to the jaw, a right ventricular heave, and 2+ peripheral edema. Her lungs are clear and there is no clubbing and no cyanosis.\n\nStudies:\n    Chest radiograph — Enlarged central pulmonary arteries with cardiomegaly\n    Echocardiogram with Doppler — Estimated right ventricular systolic pressure 62 mm Hg, with a dilated right ventricle and a flattened interventricular septum\n    Bubble study — Negative for intrapulmonary shunt\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Arterial blood gas on room air"}, {"letter": "B", "text": "Right heart catheterization"}, {"letter": "C", "text": "Abdominal ultrasound"}, {"letter": "D", "text": "Serum natriuretic peptide"}, {"letter": "E", "text": "Diagnostic thoracentesis with fluid studies"}], "answer": "B", "explanation": "The echocardiogram only estimates right-sided pressure; catheterization measures it, and it is the only study that separates a pre-capillary problem from a raised filling pressure by giving the wedge alongside it. A blood gas would be the next move if the bubble study had been positive.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C2", "pgroup": "LI-C"}, {"id": "20A", "group": 20, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A transudate with a protein ratio of 0.18 and an LDH ratio of 0.36"}, {"letter": "B", "text": "Large-volume ascites around a nodular liver with splenomegaly"}, {"letter": "C", "text": "A markedly raised natriuretic peptide with a reduced ejection fraction"}, {"letter": "D", "text": "PaO₂ 56 mm Hg with an alveolar-arterial gradient of 53 mm Hg"}, {"letter": "E", "text": "Mean pulmonary artery pressure 44 mm Hg with a wedge pressure of 10 mm Hg"}], "answer": "E", "explanation": "A high mean pulmonary artery pressure with a normal wedge and a raised pulmonary vascular resistance locates the obstruction in the pulmonary arterioles themselves rather than behind a failing left ventricle. That is the pre-capillary pattern.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C2", "pgroup": "LI-C"}, {"id": "20B", "group": 20, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Portopulmonary hypertension"}, {"letter": "B", "text": "Decompensated heart failure"}, {"letter": "C", "text": "Ascites"}, {"letter": "D", "text": "Hepatohydrothorax"}, {"letter": "E", "text": "Hepatopulmonary syndrome"}], "answer": "A", "explanation": "Hormonal and pressure changes from cirrhosis remodel the pulmonary arterial vasculature, and the loud P2, right ventricular heave, and raised jugular venous pressure are that remodeling working backwards. Hepatopulmonary syndrome is the mirror image — a shunt on the bubble study with hypoxemia, neither of which she has.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C2", "pgroup": "LI-C"}, {"id": "20C", "group": 20, "stem": "She has portopulmonary hypertension. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sodium restriction with spironolactone and furosemide"}, {"letter": "B", "text": "Pulmonary vasodilator therapy"}, {"letter": "C", "text": "Supplemental oxygen"}, {"letter": "D", "text": "Diuresis with guideline-directed heart failure therapy"}, {"letter": "E", "text": "Therapeutic thoracentesis"}], "answer": "B", "explanation": "The pulmonary arterial bed is treated exactly as it would be in pulmonary hypertension unrelated to liver disease. Oxygen is the answer to the shunt of hepatopulmonary syndrome, and diuresis treats fluid, not a remodeled arteriole.", "objective": "", "section": "the cirrhotic who is short of breath", "pcase": "LI-C2", "pgroup": "LI-C"}, {"id": "21", "group": 21, "stem": "A 43-year-old man is brought to the emergency department with ten days of yellow eyes and skin following a two-week binge. He has had no appetite for a month and a dull right upper quadrant ache. He has been drinking daily for twenty years, with a sharp uptick over the past month after losing his job. He has taken no acetaminophen and no new medications and has never been admitted for liver disease. His temperature is 38.1°C (100.6°F), blood pressure is 108/68 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 97% on room air. He is deeply jaundiced with scleral icterus, has a tender liver 5 cm below the costal margin, and has small-volume ascites. There is no asterixis.\n\nStudies:\n    WBC — 16,800/mm³ with 82% neutrophils\n    Platelets — 118,000/mm³\n    Albumin — 2.6 g/dL\n    Creatinine — 1.2 mg/dL\n    Sodium — 132 mEq/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Transferrin saturation with ferritin"}, {"letter": "B", "text": "AST and ALT with alkaline phosphatase and bilirubin"}, {"letter": "C", "text": "Comprehensive metabolic panel with bilirubin and PT/INR"}, {"letter": "D", "text": "Liver ultrasound with AST and ALT"}, {"letter": "E", "text": "AST and ALT with GGT"}], "answer": "C", "explanation": "The prothrombin time and INR are the best markers of acute liver dysfunction and belong in the opening panel, not in a second round of tests. Albumin has a three-week half-life and cannot register an injury ten days old, so a panel without the INR misses the measurement that matters most.", "objective": "", "section": "fat in the liver, and what it turns into", "pcase": "LI-E3", "pgroup": "LI-E"}, {"id": "21A", "group": 21, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Alkaline phosphatase 410 U/L with an ALT of 180 U/L"}, {"letter": "B", "text": "Hepatic steatosis with ALT 96 U/L and AST 58 U/L"}, {"letter": "C", "text": "AST 118 U/L and ALT 48 U/L with a GGT of 310 U/L"}, {"letter": "D", "text": "AST 186 U/L above ALT 74 U/L with a bilirubin of 14.6 mg/dL"}, {"letter": "E", "text": "Transferrin saturation 68% with a ferritin of 940 ng/mL"}], "answer": "D", "explanation": "Alcohol injures mitochondria preferentially, so the aspartate transaminase leads, and the ratio holds while both enzymes stay modest — AST rarely exceeds 400 U/L here. What marks this out from simple fatty liver is that the bilirubin has climbed with it.", "objective": "", "section": "fat in the liver, and what it turns into", "pcase": "LI-E3", "pgroup": "LI-E"}, {"id": "21B", "group": 21, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alcohol-related fatty liver"}, {"letter": "B", "text": "Drug-induced hepatitis"}, {"letter": "C", "text": "Acute alcohol-related hepatitis"}, {"letter": "D", "text": "Hemochromatosis"}, {"letter": "E", "text": "MASLD with steatohepatitis"}], "answer": "C", "explanation": "Jaundice appearing days to weeks after a binge, with fever, a tender enlarged liver, and a neutrophil-rich leukocytosis, is the syndrome. Fatty liver shares the drinking history and the AST:ALT ratio but not the hyperbilirubinemia, leukocytosis, or prolonged INR.", "objective": "", "section": "fat in the liver, and what it turns into", "pcase": "LI-E3", "pgroup": "LI-E"}, {"id": "21C", "group": 21, "stem": "He has acute alcohol-related hepatitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Abstinence counseling with naltrexone 50 mg daily"}, {"letter": "B", "text": "Abstinence with early nutrition, thiamine, and vitamin K"}, {"letter": "C", "text": "Withdrawal of the offending medication"}, {"letter": "D", "text": "Serial phlebotomy with avoidance of alcohol and iron"}, {"letter": "E", "text": "Diet and exercise with 10% body-weight loss"}], "answer": "B", "explanation": "Abstinence with prompt enteral access and 80 to 100 g of protein a day is the backbone, alongside thiamine, B12, a multivitamin, and vitamin K. He meets several admission criteria on his own — a bilirubin above 20 mg/dL, an INR above 2, hypoalbuminemia, or instability would each suffice.", "objective": "", "section": "fat in the liver, and what it turns into", "pcase": "LI-E3", "pgroup": "LI-E"}, {"id": "22", "group": 22, "stem": "A 26-year-old man is referred to the hepatology clinic by his psychiatrist. For six months he has had a coarse tremor in both hands, slurred speech, and handwriting that has shrunk to the point of being unreadable, and his family describes irritability and a change in personality. A brother had liver problems in his twenties. He was recently started on an antipsychotic with no benefit. He drinks no alcohol and takes no other medication. His temperature is 36.7°C (98.1°F), blood pressure is 118/72 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 98% on room air. He has a wing-beating tremor with dysarthria, mild scleral icterus, and a liver edge 2 cm below the costal margin. There is no asterixis and no ascites.\n\nStudies:\n    Ceruloplasmin — 8 mg/dL (threshold 20 mg/dL)\n    24-hour urinary copper — 210 µg\n    Slit-lamp examination — Kayser-Fleischer rings present\n    AST / ALT — 96 U/L / 78 U/L\n    Total bilirubin / INR — 2.2 mg/dL / 1.2\n    Hemoglobin / hematocrit — 11.8 g/dL / 35%\n    Haptoglobin — Low\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HFE gene testing"}, {"letter": "B", "text": "Alpha-1 antitrypsin genotype and phenotype testing"}, {"letter": "C", "text": "Liver biopsy for interface hepatitis"}, {"letter": "D", "text": "ATP7B genetic testing"}, {"letter": "E", "text": "Transient elastography"}], "answer": "D", "explanation": "Genetic testing is now the standard confirmation once the copper studies point the way, with biopsy for hepatic copper reserved as the criterion standard when the genetics do not settle it. The other assays confirm different inherited diseases entirely.", "objective": "", "section": "the inherited liver: unexplained transaminases with a clue outside the liver", "pcase": "LI-F2", "pgroup": "LI-F"}, {"id": "22A", "group": 22, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Interface hepatitis with plasma cell infiltration"}, {"letter": "B", "text": "Liver stiffness of 9.8 kPa, stage F2 to F3"}, {"letter": "C", "text": "Two pathogenic ATP7B mutations"}, {"letter": "D", "text": "Homozygous C282Y"}, {"letter": "E", "text": "A ZZ genotype"}], "answer": "C", "explanation": "The defect is reduced vesicular secretion of copper into bile together with impaired incorporation of copper into ceruloplasmin, and it takes two abnormal alleles to produce it. That is why a low ceruloplasmin, a high urinary copper, and corneal deposition arrive together.", "objective": "", "section": "the inherited liver: unexplained transaminases with a clue outside the liver", "pcase": "LI-F2", "pgroup": "LI-F"}, {"id": "22B", "group": 22, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Alpha-1 antitrypsin deficiency"}, {"letter": "B", "text": "MASLD with steatohepatitis"}, {"letter": "C", "text": "Wilson's disease"}, {"letter": "D", "text": "Hemochromatosis"}, {"letter": "E", "text": "Autoimmune hepatitis"}], "answer": "C", "explanation": "Liver disease in a patient in his twenties together with neurologic or psychiatric findings is the rule that names this disease, and the anemia with a low haptoglobin is its hemolytic component. Hemochromatosis presents later with iron studies, bronze skin, and small-joint arthropathy.", "objective": "", "section": "the inherited liver: unexplained transaminases with a clue outside the liver", "pcase": "LI-F2", "pgroup": "LI-F"}, {"id": "22C", "group": 22, "stem": "He has Wilson's disease. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Monitoring with smoking cessation"}, {"letter": "B", "text": "Diet and exercise with 10% body-weight loss"}, {"letter": "C", "text": "Prednisone 40 mg daily as induction"}, {"letter": "D", "text": "A low-copper diet with D-penicillamine"}, {"letter": "E", "text": "Serial phlebotomy with avoidance of alcohol and iron"}], "answer": "D", "explanation": "Copper intake is restricted and the accumulated copper is removed, with trientine or zinc acetate as alternatives to the chelator. Phlebotomy removes iron and does nothing for copper.", "objective": "", "section": "the inherited liver: unexplained transaminases with a clue outside the liver", "pcase": "LI-F2", "pgroup": "LI-F"}, {"id": "23", "group": 23, "stem": "A 47-year-old woman comes to the hepatology clinic. She is usually asymptomatic but has had six months of fatigue and reduced appetite with an 8-pound weight loss and intermittent itching. She was born in Vietnam and has never had an acute hepatitis illness. She drinks no alcohol and has never injected drugs, and she has had two prednisone bursts for asthma in the past year. Her temperature is 36.8°C (98.2°F), blood pressure is 124/78 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. She has spider angiomata across the upper chest and palmar erythema, a liver edge 2 cm below the costal margin, and a palpable spleen tip. There is no ascites and no asterixis, and her sclerae are anicteric.\n\nStudies:\n    AST / ALT — 58 U/L / 74 U/L\n    Alkaline phosphatase — 110 U/L\n    Total bilirubin — 1.3 mg/dL\n    Albumin — 3.6 g/dL\n    PT / INR — 13.0 seconds / 1.1\n    Platelets — 148,000/mm³\n    Hemoglobin / hematocrit — 12.6 g/dL / 38%\n    Creatinine — 0.8 mg/dL\n    Alpha-fetoprotein — 4.2 ng/mL\n    Abdominal ultrasound — Coarse hepatic echotexture with no focal lesion\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Transient elastography with FIB-4"}, {"letter": "B", "text": "Hepatitis C antibody"}, {"letter": "C", "text": "HBV DNA PCR with HBeAg and HBeAb"}, {"letter": "D", "text": "HBsAg with total anti-HDV antibody"}, {"letter": "E", "text": "HBsAg, HBsAb, and HBcAb"}], "answer": "E", "explanation": "The three-marker surface and core panel is the entry study, because the relationship between the antigen, the surface antibody, and the core antibody is what assigns a patient to a stage. Viral load, e-antigen status, and a second virus are all questions asked after the panel has placed her.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B3", "pgroup": "VH-B"}, {"id": "23A", "group": 23, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg negative, HBsAb negative, HBcAb IgM positive"}, {"letter": "B", "text": "HBsAb positive, HBsAg negative, HBcAb positive"}, {"letter": "C", "text": "HBsAg positive, HBcAb IgM positive, HBsAb negative"}, {"letter": "D", "text": "HBsAg positive beyond 6 months, HBcAb IgG positive, HBsAb absent"}, {"letter": "E", "text": "HBsAb positive, HBsAg negative, HBcAb negative"}], "answer": "D", "explanation": "Surface antigen persisting beyond six months defines chronic infection, and the class of the core antibody dates it: IgM belongs to a recent illness, IgG to one carried for years. The absence of surface antibody means she has never cleared it.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B3", "pgroup": "VH-B"}, {"id": "23B", "group": 23, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Resolved hepatitis B infection"}, {"letter": "B", "text": "Acute hepatitis B"}, {"letter": "C", "text": "Inactive hepatitis B carrier state"}, {"letter": "D", "text": "Chronic hepatitis B"}, {"letter": "E", "text": "Hepatitis B window period"}], "answer": "D", "explanation": "Perinatal acquisition in a high-prevalence country, persistence of surface antigen past six months, an IgG core antibody, and stigmata of chronic liver disease place her in the chronic stage. The inactive carrier has a persistently normal ALT with a negative e-antigen and undetectable DNA.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B3", "pgroup": "VH-B"}, {"id": "23C", "group": 23, "stem": "She has chronic hepatitis B. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "No antiviral, with serial ALT and HBV DNA every 6 to 12 months"}, {"letter": "B", "text": "Entecavir taken with food, continued long term"}, {"letter": "C", "text": "Peginterferon alfa-2a 180 mcg weekly for 48 weeks"}, {"letter": "D", "text": "Tenofovir taken with food, continued long term"}, {"letter": "E", "text": "Supportive care with vaccination of household contacts"}], "answer": "D", "explanation": "Tenofovir is preferred with normal renal function and is taken with food, while entecavir is the choice in renal insufficiency and must be taken without food. Both carry a black box for severe acute exacerbations on discontinuation and for lactic acidosis with hepatomegaly and steatosis, which is why therapy is usually lifelong.", "objective": "", "section": "hepatitis B, read off the serologic panel", "pcase": "VH-B3", "pgroup": "VH-B"}, {"id": "24", "group": 24, "stem": "A 66-year-old woman comes to the primary care clinic after a routine panel showed an ALT of 88 U/L. She feels well apart from some afternoon fatigue she has put down to age. She was born in 1960 and had a blood transfusion after a hysterectomy in 1987; she has never injected or snorted drugs and has no tattoos. She takes omeprazole for reflux and atorvastatin, and she drinks no alcohol. Her temperature is 36.9°C (98.4°F), blood pressure is 128/76 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her examination is normal — no jaundice, no spider angiomata, no palmar erythema, and no hepatomegaly, splenomegaly, or ascites.\n\nStudies:\n    Hepatitis C antibody — Positive\n    AST / ALT — 62 U/L / 88 U/L\n    Alkaline phosphatase — 96 U/L\n    Total bilirubin / albumin — 0.9 mg/dL / 4.2 g/dL\n    INR — 1.0\n    Platelets — 244,000/mm³\n    Hemoglobin / hematocrit — 13.2 g/dL / 40%\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HCV RNA PCR with genotype and fibrosis staging"}, {"letter": "B", "text": "Repeat hepatitis C antibody testing in 12 weeks"}, {"letter": "C", "text": "Transient elastography alone"}, {"letter": "D", "text": "Liver ultrasound with a hepatic function panel"}, {"letter": "E", "text": "HBV DNA PCR with HBeAg and HBeAb"}], "answer": "A", "explanation": "A positive antibody records exposure, not disease, and must always be followed by an RNA: false positives occur and roughly 20% of infections clear on their own. Repeating the antibody adds nothing, because it stays positive after cure and confers no immunity.", "objective": "", "section": "the positive hepatitis C antibody, and what the RNA does with it", "pcase": "VH-C1", "pgroup": "VH-C"}, {"id": "24A", "group": 24, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "HBV DNA 1.8 × 10⁶ IU/mL with a positive HBeAg"}, {"letter": "B", "text": "HCV RNA 340,000 IU/mL at 3 weeks, persisting on repeat"}, {"letter": "C", "text": "HCV RNA 2.9 × 10⁶ IU/mL with elastography at 16.2 kPa"}, {"letter": "D", "text": "HCV RNA 1.6 × 10⁶ IU/mL, genotype 1a, with a FIB-4 of 1.02"}, {"letter": "E", "text": "HCV RNA undetectable on two separate draws"}], "answer": "D", "explanation": "About 80% of exposures become chronic, and a detectable viral load decades after the exposure is what makes the infection active rather than historical. Genotypes 1a and 1b are the commonest in the United States, and a FIB-4 of 1.02 with normal platelets and albumin puts her well below significant fibrosis.", "objective": "", "section": "the positive hepatitis C antibody, and what the RNA does with it", "pcase": "VH-C1", "pgroup": "VH-C"}, {"id": "24B", "group": 24, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cleared or cured hepatitis C"}, {"letter": "B", "text": "Chronic hepatitis B infection"}, {"letter": "C", "text": "Acute hepatitis C infection"}, {"letter": "D", "text": "Chronic hepatitis C without significant fibrosis"}, {"letter": "E", "text": "Chronic hepatitis C with compensated cirrhosis"}], "answer": "D", "explanation": "The exposure is decades old and the antibody is already positive, which is not the antibody-negative window of acute infection. Normal platelets, albumin, and INR with no stigmata argue against established cirrhosis.", "objective": "", "section": "the positive hepatitis C antibody, and what the RNA does with it", "pcase": "VH-C1", "pgroup": "VH-C"}, {"id": "24C", "group": 24, "stem": "She has chronic hepatitis C. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with ribavirin added"}, {"letter": "B", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with her omeprazole taken 4 hours after the dose"}, {"letter": "C", "text": "Glecaprevir/pibrentasvir three tablets daily for 8 weeks, taken on an empty stomach"}, {"letter": "D", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with hepatitis B testing deferred until therapy is finished"}, {"letter": "E", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with her omeprazole taken 4 hours before the dose"}], "answer": "B", "explanation": "A proton pump inhibitor raises gastric pH and cuts absorption of the regimen, so the antiviral goes first and the omeprazole four hours later. Hepatitis B status must be known before the first dose because of the reactivation black box, ribavirin is added only for decompensated cirrhosis, and glecaprevir/pibrentasvir is taken with food.", "objective": "", "section": "the positive hepatitis C antibody, and what the RNA does with it", "pcase": "VH-C1", "pgroup": "VH-C"}, {"id": "25", "group": 25, "stem": "A 23-year-old woman presents to the primary care clinic with five months of cramping right lower quadrant pain and four to five loose nonbloody stools a day. She has lost 14 pounds. She smokes half a pack of cigarettes daily and her mother has Crohn's disease. She has not travelled recently and has taken no antibiotics. Her temperature is 37.6°C (99.7°F), blood pressure is 112/70 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has a tender palpable fullness in the right lower quadrant, two aphthous ulcers on the buccal mucosa, and a posterior anal fissure with an adjacent skin tag. There is no jaundice and no abdominal distention.\n\nStudies:\n    Hemoglobin / hematocrit — 10.2 g/dL / 31%\n    MCV — 76 fL\n    Ferritin — 8 ng/mL\n    Vitamin B12 / folate — 210 pg/mL / 7 ng/mL\n    Albumin — 3.1 g/dL\n    CRP / ESR — 42 mg/L / 38 mm/h\n    WBC / platelets — 9,400/mm³ / 402,000/mm³\n    Fecal calprotectin — 780 µg/g\n    Stool cultures and C. difficile PCR — Negative\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT or MR enterography"}, {"letter": "B", "text": "ASCA and p-ANCA serology panel"}, {"letter": "C", "text": "Ileocolonoscopy with ileal intubation and biopsy"}, {"letter": "D", "text": "Pelvic MRI or endoanal ultrasound"}, {"letter": "E", "text": "Surveillance colonoscopy with 32 four-quadrant biopsies"}], "answer": "C", "explanation": "A raised calprotectin with negative stool studies establishes that the inflammation is real and not infectious, and the next step is to see it and sample it. Intubating the ileum is what makes the study diagnostic rather than merely a colonoscopy; enterography and serology characterize disease that endoscopy has already found.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A1", "pgroup": "IB-A"}, {"id": "25A", "group": 25, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Chronic active colitis with no ileal disease and no skip pattern"}, {"letter": "B", "text": "Continuous rectal-based inflammation sparing the ileum, with crypt abscesses"}, {"letter": "C", "text": "Skip lesions with cobblestoning and rectal sparing, with granulomas on biopsy"}, {"letter": "D", "text": "Diffuse colitis with adherent yellow plaques"}, {"letter": "E", "text": "Segmental colitis at a watershed segment with an abrupt transition"}], "answer": "C", "explanation": "The inflammation is patchy and full-thickness, so it leaves normal mucosa between involved segments, spares the rectum, and heaps the surviving mucosa into cobblestones between deep longitudinal ulcers. Non-caseating granulomas are the histologic counterpart of that transmural process.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A1", "pgroup": "IB-A"}, {"id": "25B", "group": 25, "stem": "Which of the following studies would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "Repeat stool toxin assay after therapy"}, {"letter": "B", "text": "Repeat colonoscopy after recovery"}, {"letter": "C", "text": "Pelvic MRI or endoanal ultrasound"}, {"letter": "D", "text": "CT or MR enterography"}, {"letter": "E", "text": "ASCA and p-ANCA serology"}], "answer": "D", "explanation": "Enterography reaches the small bowel the scope cannot and defines both the extent of disease and whether it has penetrated — the presence or absence of a stricture, fistula, or abscess changes therapy immediately. Capsule endoscopy is not an alternative when a stricture is suspected.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A1", "pgroup": "IB-A"}, {"id": "25C", "group": 25, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "IBD-associated colorectal cancer"}, {"letter": "B", "text": "Ulcerative colitis"}, {"letter": "C", "text": "Crohn's disease"}, {"letter": "D", "text": "Clostridioides difficile colitis"}, {"letter": "E", "text": "Indeterminate colitis"}], "answer": "C", "explanation": "Terminal ileal disease with skip lesions, rectal sparing, and granulomas commits the pattern, and about 40% of cases are ileocolic. Smoking, oral aphthae, and perianal disease all belong to this diagnosis rather than to ulcerative colitis, and the bleeding here is occult rather than frank.", "objective": "", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "pcase": "IB-A1", "pgroup": "IB-A"}, {"id": "26", "group": 26, "stem": "A 57-year-old woman on the inpatient medical unit is on hospital day 4 of treatment for a severe colitis flare when she develops sudden severe diffuse abdominal pain with fever and one episode of vomiting. She has had ulcerative colitis for 11 years and has been on intravenous methylprednisolone since admission; a film yesterday showed the transverse colon dilated to 7 cm. Her temperature is 38.5°C (101.3°F), blood pressure is 88/54 mm Hg, pulse is 132/min, respirations are 26/min, and oxygen saturation is 95% on room air. Her abdomen is rigid and silent with rebound tenderness and guarding, her extremities are cool with delayed capillary refill, and there is no jaundice.\n\nStudies:\n    WBC — 22,400/mm³ with 14% bands\n    Hemoglobin / hematocrit — 9.6 g/dL / 29%\n    Platelets — 232,000/mm³\n    Lactate — 4.6 mmol/L\n    Creatinine — 1.8 mg/dL\n    Potassium — 3.4 mEq/L\n    Albumin — 2.3 g/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool testing for Clostridioides difficile"}, {"letter": "B", "text": "Ileocolonoscopy with biopsy"}, {"letter": "C", "text": "CT of the abdomen and pelvis"}, {"letter": "D", "text": "CT or MR enterography"}, {"letter": "E", "text": "Upright chest and abdominal radiographs"}], "answer": "E", "explanation": "An upright film is immediate, is done at the bedside in a shocked patient, and answers the only question that changes the next hour. Colonoscopy has no place at all here, and cross-sectional imaging adds detail at the cost of time that a hypotensive patient does not have.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B4", "pgroup": "IB-B"}, {"id": "26A", "group": 26, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Luminal narrowing with proximal dilation and minimal mural enhancement"}, {"letter": "B", "text": "Free intraperitoneal air under both hemidiaphragms"}, {"letter": "C", "text": "Pancolonic wall thickening with an accordion pattern"}, {"letter": "D", "text": "A tract from a distal ileal loop to the bladder dome with intravesical air"}, {"letter": "E", "text": "Transverse colon dilated to 9 cm with loss of haustra and thumbprinting"}], "answer": "B", "explanation": "Gas escaping a colon whose wall has given way rises to the highest point in the supine-to-upright abdomen and outlines both hemidiaphragms. The rigid silent abdomen with rebound and the shock are that gas and stool in the peritoneum.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B4", "pgroup": "IB-B"}, {"id": "26B", "group": 26, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Colon perforation"}, {"letter": "B", "text": "Toxic megacolon"}, {"letter": "C", "text": "Stricturing Crohn's disease with small bowel obstruction"}, {"letter": "D", "text": "Fulminant ulcerative colitis"}, {"letter": "E", "text": "Fistulizing Crohn's disease"}], "answer": "A", "explanation": "Yesterday's dilated colon is now a free perforation with peritonitis and shock, and it is the most lethal complication either form of inflammatory bowel disease produces. Toxic megacolon is the dilated colon with systemic toxicity that precedes it, before the wall gives way.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B4", "pgroup": "IB-B"}, {"id": "26C", "group": 26, "stem": "She has a colon perforation. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Fluid resuscitation, broad-spectrum antibiotics, and colonoscopy to localize the perforation"}, {"letter": "B", "text": "Fluid resuscitation, broad-spectrum antibiotics, and total abdominal colectomy with end ileostomy"}, {"letter": "C", "text": "Fluid resuscitation, broad-spectrum antibiotics, and repeat imaging before deciding on surgery"}, {"letter": "D", "text": "Fluid resuscitation, broad-spectrum antibiotics, and colectomy with ileal pouch-anal anastomosis at the same operation"}, {"letter": "E", "text": "Fluid resuscitation, broad-spectrum antibiotics, and continued methylprednisolone with review in 24 hours"}], "answer": "B", "explanation": "The operation is the treatment: the colon comes out, the ileostomy is brought up, and the rectum is left in place. A septic, steroid-loaded patient gets no pelvic dissection, so reconstruction is deferred, and neither further imaging nor another day of medical therapy is a defensible delay.", "objective": "", "section": "acute deterioration in a patient with known inflammatory bowel disease", "pcase": "IB-B4", "pgroup": "IB-B"}, {"id": "27", "group": 27, "stem": "A 24-year-old woman comes to the primary care clinic with six days of tender red lumps on both shins that are painful and warm to touch. For three weeks she has had cramping and five loose stools a day. She has had Crohn's colitis for two years, had a similar rash during her first flare, and takes mesalamine. Her temperature is 37.9°C (100.2°F), blood pressure is 114/70 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has six raised tender subcutaneous nodules 2 to 4 cm across the anterior lower legs. Her joints are without swelling and her eyes are white.\n\nStudies:\n    Hemoglobin / hematocrit — 11.6 g/dL / 35%\n    WBC — 9,100/mm³\n    Albumin — 3.4 g/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Clinical diagnosis with ophthalmology referral if uncertain"}, {"letter": "B", "text": "Sacroiliac and spine imaging with HLA-B27"}, {"letter": "C", "text": "Clinical diagnosis with CRP and ESR"}, {"letter": "D", "text": "Urgent ophthalmology referral with slit-lamp examination"}, {"letter": "E", "text": "Clinical diagnosis with wound culture"}], "answer": "C", "explanation": "The lesions are recognized at the bedside, and the laboratory work that matters is the measure of how active the bowel disease is, since the two move together. A wound culture is what an ulcerating lesion needs, and the eyes and spine are quiet.", "objective": "", "section": "extraintestinal complaints that track bowel disease activity", "pcase": "IB-C2", "pgroup": "IB-C"}, {"id": "27A", "group": 27, "stem": "Which of the following additional findings is most likely to be present?", "options": [{"letter": "A", "text": "Reduced spinal flexion with sacroiliac tenderness"}, {"letter": "B", "text": "Fewer than six warm swollen large joints"}, {"letter": "C", "text": "Nodules that do not ulcerate and have no undermined border"}, {"letter": "D", "text": "An ulcer with a violaceous undermined border"}, {"letter": "E", "text": "Sectoral scleral injection with normal visual acuity"}], "answer": "C", "explanation": "The process is inflammation of subcutaneous fat, so the overlying skin stays intact and the lesions resolve without breaking down. That intact surface is what separates this from the neutrophilic ulceration that undermines its own edge.", "objective": "", "section": "extraintestinal complaints that track bowel disease activity", "pcase": "IB-C2", "pgroup": "IB-C"}, {"id": "27B", "group": 27, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peripheral arthritis of inflammatory bowel disease"}, {"letter": "B", "text": "Pyoderma gangrenosum"}, {"letter": "C", "text": "Uveitis of inflammatory bowel disease"}, {"letter": "D", "text": "Erythema nodosum"}, {"letter": "E", "text": "Episcleritis of inflammatory bowel disease"}], "answer": "D", "explanation": "This is the most common skin manifestation of inflammatory bowel disease — about 3% of ulcerative colitis and 8% of Crohn's disease — and it arrives with a flare, as it did the first time. Tender nodules confined to the anterior shins with quiet joints and white eyes place it in the skin.", "objective": "", "section": "extraintestinal complaints that track bowel disease activity", "pcase": "IB-C2", "pgroup": "IB-C"}, {"id": "27C", "group": 27, "stem": "She has erythema nodosum. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Exercise and physical therapy with a TNF inhibitor"}, {"letter": "B", "text": "Emergent ophthalmology referral with topical corticosteroids"}, {"letter": "C", "text": "Wound care avoiding debridement, with systemic corticosteroids"}, {"letter": "D", "text": "Treatment of the underlying bowel disease with leg elevation and rest"}, {"letter": "E", "text": "Ocular corticosteroids with treatment of the underlying bowel disease"}], "answer": "D", "explanation": "No drug is directed at the rash itself at first line, because the rash follows the bowel disease; controlling the flare controls the legs. Elevation and rest are supportive while that happens.", "objective": "", "section": "extraintestinal complaints that track bowel disease activity", "pcase": "IB-C2", "pgroup": "IB-C"}, {"id": "28", "group": 28, "stem": "A 58-year-old African-American man comes to the primary care clinic with three months of difficulty swallowing solid food, worst with dry meat, and a 15-pound weight loss. His voice has become hoarse. He has a 35 pack-year smoking history, drinks a pint of whiskey daily, and was treated for achalasia in his late thirties. His temperature is 36.7°C (98.1°F), blood pressure is 126/78 mm Hg, pulse is 88/min, respirations are 14/min, and oxygen saturation is 98% on room air. He is cachectic with a body mass index of 18.5, has a firm right cervical node, and is hoarse. There is no left supraclavicular node.\n\nStudies:\n    Barium swallow — Irregular rigid narrowing of the esophagus\n    CT chest and abdomen — No liver, lung, bone, or adrenal metastases\n    Hemoglobin / hematocrit — 11.8 g/dL / 35%\n    MCV — 82 fL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Right upper quadrant ultrasound"}, {"letter": "B", "text": "Esophageal manometry"}, {"letter": "C", "text": "Endoscopic ultrasound with staging PET"}, {"letter": "D", "text": "Multiphasic contrast MRI of the liver"}, {"letter": "E", "text": "Upper endoscopy with biopsy"}], "answer": "E", "explanation": "The barium study has shown where the narrowing is but cannot say what it is made of, and rigid irregular narrowing with weight loss demands tissue. Endoscopy both sees the lesion and samples it; staging studies follow a histologic diagnosis rather than substitute for one.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A2", "pgroup": "MA-A"}, {"id": "28A", "group": 28, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A distal mass with glandular histology and adjacent salmon-colored mucosa"}, {"letter": "B", "text": "A dilated body with a smooth tapered narrowing at the gastroesophageal junction"}, {"letter": "C", "text": "A short smooth tapered narrowing with benign inflamed mucosa on biopsy"}, {"letter": "D", "text": "A mid-esophageal mass at 26 cm with squamous histology on biopsy"}, {"letter": "E", "text": "An annular constricting lesion at 32 cm through which the scope will not pass"}], "answer": "D", "explanation": "Tobacco and alcohol act synergistically on the squamous lining of the mid and proximal esophagus, and a treated achalasia adds decades of stasis against the same mucosa. The lesion sits where that epithelium is, not at the junction where columnar metaplasia gives rise to glandular tumors.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A2", "pgroup": "MA-A"}, {"id": "28B", "group": 28, "stem": "Which of the following studies would most directly establish the extent of disease?", "options": [{"letter": "A", "text": "Esophageal manometry"}, {"letter": "B", "text": "Repeat endoscopic biopsy of the narrowed segment"}, {"letter": "C", "text": "Endoscopic ultrasound with staging PET"}, {"letter": "D", "text": "Multiphasic contrast MRI of the liver"}, {"letter": "E", "text": "Barium swallow"}], "answer": "C", "explanation": "Endoscopic ultrasound reads depth of invasion and regional nodes with an accuracy of 80 to 90%, which is what CT cannot resolve, and PET then looks for disease beyond the field. Together they decide whether an operation is the right operation.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A2", "pgroup": "MA-A"}, {"id": "28C", "group": 28, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Esophageal squamous cell carcinoma"}, {"letter": "B", "text": "Achalasia of the esophagus"}, {"letter": "C", "text": "Esophageal adenocarcinoma"}, {"letter": "D", "text": "Peptic reflux stricture"}, {"letter": "E", "text": "Gastric adenocarcinoma"}], "answer": "A", "explanation": "Tobacco and alcohol together account for about 90% of United States cases and act synergistically, and prior achalasia adds to the risk. Adenocarcinoma sits distally in a patient with chronic reflux and Barrett's mucosa, and dysphagia to solids alone with 15 pounds lost is not a benign stricture.", "objective": "", "section": "rapidly progressive solid-food dysphagia with weight loss", "pcase": "MA-A2", "pgroup": "MA-A"}, {"id": "29", "group": 29, "stem": "A 57-year-old woman comes to the gastroenterology clinic with three weeks of painless jaundice, intense itching, and a dull right upper quadrant ache, with an 8-pound weight loss. She was diagnosed with primary sclerosing cholangitis twelve years ago and has ulcerative colitis. She has no choledochal cyst. Her temperature is 36.9°C (98.4°F), blood pressure is 122/74 mm Hg, pulse is 84/min, respirations are 14/min, and oxygen saturation is 98% on room air. She is jaundiced with excoriations over the arms and trunk, has hepatomegaly and a palpable non-tender gallbladder, and has no ascites and no fever.\n\nStudies:\n    RUQ ultrasound with CT abdomen — Intrahepatic biliary ductal dilation with an abrupt stricture at the bifurcation of the proper hepatic duct and no discrete mass\n    Total bilirubin — 11.2 mg/dL (direct 8.4)\n    Alkaline phosphatase — 620 U/L\n    AST / ALT — 48 U/L / 52 U/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "ERCP with brushings"}, {"letter": "B", "text": "EUS-guided fine-needle aspiration"}, {"letter": "C", "text": "Liver biopsy"}, {"letter": "D", "text": "Endoscopic biopsy of the ampulla"}, {"letter": "E", "text": "MRCP"}], "answer": "A", "explanation": "A stricture with no mass leaves nothing for a needle to target, so cells are taken from the duct wall itself. ERCP reaches the lesion, samples it, and relieves the obstruction in the same sitting; aspiration and percutaneous biopsy come into play when there is a mass or a liver lesion to hit.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D2", "pgroup": "MA-D"}, {"id": "29A", "group": 29, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Metastatic adenocarcinoma of extrahepatic origin"}, {"letter": "B", "text": "A filling defect in the distal common bile duct"}, {"letter": "C", "text": "Malignant cells on ductal brushings"}, {"letter": "D", "text": "Adenocarcinoma on cytology from a pancreatic head mass"}, {"letter": "E", "text": "Adenocarcinoma on biopsy of an ampullary lesion"}], "answer": "C", "explanation": "The tumor arises from the biliary epithelium itself and grows along the duct rather than as a ball, which is why imaging shows a stricture and cytology shows the malignant cells. A stone would have given a filling defect and colicky, painful jaundice instead.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D2", "pgroup": "MA-D"}, {"id": "29B", "group": 29, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ampullary adenocarcinoma"}, {"letter": "B", "text": "Cholangiocarcinoma"}, {"letter": "C", "text": "Pancreatic adenocarcinoma of the head"}, {"letter": "D", "text": "Choledocholithiasis"}, {"letter": "E", "text": "Hepatocellular carcinoma"}], "answer": "B", "explanation": "Primary sclerosing cholangitis accounts for 30% of cases and carries a lifetime risk of 10 to 15%, and the association with ulcerative colitis runs near 90%. A stricture at the bifurcation of the proper hepatic duct is a Klatskin tumor; a pancreatic head cancer would give a mass with the double duct sign.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D2", "pgroup": "MA-D"}, {"id": "29C", "group": 29, "stem": "She has a perihilar cholangiocarcinoma. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Whipple resection"}, {"letter": "B", "text": "Surgical resection guided by tumor site"}, {"letter": "C", "text": "Surgical resection once portal hypertension is excluded"}, {"letter": "D", "text": "ERCP with stone extraction"}, {"letter": "E", "text": "Systemic therapy directed at the primary tumor"}], "answer": "B", "explanation": "Resection is the only possible cure, and which operation depends on where the tumor sits — a Whipple for distal disease, intrahepatic resection for intrahepatic disease, and resection of the hilum here, with a resection rate of about 51%. Excluding portal hypertension is the question asked before resecting a hepatocellular carcinoma.", "objective": "", "section": "painless jaundice or a hepatobiliary mass", "pcase": "MA-D2", "pgroup": "MA-D"}, {"id": "30", "group": 30, "stem": "A 46-year-old man is seen for preventive care, a year later than he intended. He has no symptoms — no bleeding, no change in bowel habit, and no weight loss. His father had colonic polyps removed in his fifties and never developed cancer. He has had no previous colonoscopy and has no inflammatory bowel disease. His temperature is 36.8°C (98.2°F), blood pressure is 124/78 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. His abdominal examination is normal, there is no occult blood on rectal examination, and there is no adenopathy.\n\nStudies:\n    Hemoglobin / hematocrit — 14.6 g/dL / 44%\n    Rectal examination — No occult blood\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "APC gene testing"}, {"letter": "B", "text": "Upper endoscopy with biopsy"}, {"letter": "C", "text": "Germline mismatch-repair gene testing"}, {"letter": "D", "text": "Multiphasic contrast CT of the liver"}, {"letter": "E", "text": "Screening colonoscopy with polypectomy"}], "answer": "E", "explanation": "Colonoscopy is both the screening test and the treatment, since anything found is snared at the same sitting. Genetic testing follows a phenotype — a polyp carpet or a young-onset cancer pedigree — and he has neither.", "objective": "", "section": "the polyp-to-cancer sequence and the hereditary syndromes", "pcase": "MA-F1", "pgroup": "MA-F"}, {"id": "30A", "group": 30, "stem": "Which of the following results is most likely to be present?", "options": [{"letter": "A", "text": "Tubulovillous adenoma with low-grade dysplasia and no invasion"}, {"letter": "B", "text": "Invasive adenocarcinoma on colonic biopsy"}, {"letter": "C", "text": "A pathogenic DNA mismatch-repair gene mutation"}, {"letter": "D", "text": "A germline adenomatous polyposis coli mutation"}, {"letter": "E", "text": "A pathogenic germline STK11 mutation"}], "answer": "A", "explanation": "The adenoma-carcinoma sequence runs from small polyp to large polyp to dysplasia to cancer, and about 75% of colorectal cancers begin this way. Adenomatous polyps are common — roughly 30% of men — and a father with polyps and no cancer is the ordinary version of that, not an inherited syndrome.", "objective": "", "section": "the polyp-to-cancer sequence and the hereditary syndromes", "pcase": "MA-F1", "pgroup": "MA-F"}, {"id": "30B", "group": 30, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Familial adenomatous polyposis"}, {"letter": "B", "text": "Lynch syndrome"}, {"letter": "C", "text": "Colorectal adenomatous polyps"}, {"letter": "D", "text": "Peutz-Jeghers syndrome"}, {"letter": "E", "text": "Sporadic colon cancer"}], "answer": "C", "explanation": "Three polyps in a man of 46 with an unremarkable family history is the precursor lesion, not a syndrome: polyposis carpets the colon in the second decade, and Lynch syndrome produces few polyps behind a strong young-onset pedigree.", "objective": "", "section": "the polyp-to-cancer sequence and the hereditary syndromes", "pcase": "MA-F1", "pgroup": "MA-F"}, {"id": "30C", "group": 30, "stem": "He has colorectal adenomatous polyps. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Right hemicolectomy"}, {"letter": "B", "text": "Oncologic resection with adjuvant chemotherapy if node-positive"}, {"letter": "C", "text": "Endoscopic polypectomy"}, {"letter": "D", "text": "Early frequent surveillance with extended colectomy if cancer develops"}, {"letter": "E", "text": "Prophylactic colectomy with ileal pouch-anal anastomosis"}], "answer": "C", "explanation": "The base is snared and current applied to cut and cauterize, which both removes the lesion and controls bleeding; endoscopic mucosal resection handles large sessile polyps that would otherwise go to surgery. Delayed post-polypectomy bleeding peaks at five to seven days.", "objective": "", "section": "the polyp-to-cancer sequence and the hereditary syndromes", "pcase": "MA-F1", "pgroup": "MA-F"}], "pool": [{"case": "ES-A3", "group": "ES-A", "section": "trouble swallowing: where the bolus fails, and how fast", "objective": "", "vignette_workup": "A 34-year-old man comes to the emergency department because he suddenly cannot swallow. It began two hours ago partway through a steak dinner, with a feeling of fullness behind the breastbone; he regurgitates undigested food and cannot keep down his own saliva. He has had two prior episodes of food catching that cleared on their own. His temperature is 36.8°C (98.2°F), blood pressure is 132/80 mm Hg, pulse is 98/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is hypersalivating and drooling into a cup, the saliva is blood-stained, and scattered expiratory wheezes are heard. There is no crepitus over the neck or chest and he is afebrile.", "labs_workup": [], "vignette_recog": "A 34-year-old man comes to the emergency department because he suddenly cannot swallow. It began two hours ago partway through a steak dinner, with a feeling of fullness behind the breastbone; he regurgitates undigested food and cannot keep down his own saliva. He has had two prior episodes of food catching that cleared on their own. His temperature is 36.8°C (98.2°F), blood pressure is 132/80 mm Hg, pulse is 98/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is hypersalivating and drooling into a cup, the saliva is blood-stained, and scattered expiratory wheezes are heard. There is no crepitus over the neck or chest and he is afebrile. He is taken directly for endoscopy.", "labs_recog": [["Upper endoscopy", "Obstructing meat bolus wedged at a thin ring at the gastroesophageal junction, with abraded mucosa beneath it"], ["Chest radiograph", "No mediastinal air, no pneumomediastinum, no subcutaneous emphysema"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "High-resolution esophageal manometry"}, {"letter": "B", "text": "Modified barium swallow with videofluoroscopy"}, {"letter": "C", "text": "Barium esophagram"}, {"letter": "D", "text": "Upper endoscopy"}, {"letter": "E", "text": "Barium swallow with a 13 mm barium tablet"}], "answer": "D", "explanation": "Endoscopy is both the diagnostic and the therapeutic study here, and a patient who cannot handle his own secretions has already met the threshold to intervene. Contrast studies and manometry answer questions about motility and anatomy that can be asked later; imaging is not mandatory and must never delay the scope."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Cough and a wet voice on a 3 oz water swallow screen"}, {"letter": "B", "text": "A posterior outpouching at Killian's triangle above the upper esophageal sphincter"}, {"letter": "C", "text": "Bird's beak distal narrowing with a dilated esophagus and retained food"}, {"letter": "D", "text": "A circumferential ulcerated mass at 34 cm"}, {"letter": "E", "text": "An obstructing meat bolus with abraded mucosa beneath it"}], "answer": "E", "explanation": "A swallowed bolus that clears the pharynx normally and then stops arrests at the narrowest point of the adult esophagus, the gastroesophageal junction, where a structural lesion is usually waiting. The mucosa beneath it is abraded by the impacted food, which is why the saliva is blood-stained."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Esophageal dysphagia from an obstructing distal mass"}, {"letter": "B", "text": "Achalasia"}, {"letter": "C", "text": "Food bolus impaction"}, {"letter": "D", "text": "Zenker diverticulum"}, {"letter": "E", "text": "Oropharyngeal dysphagia"}], "answer": "C", "explanation": "The swallow initiates normally and the obstruction is sudden and complete, with drooling rather than aspiration at the moment of initiation, which separates this from an oropharyngeal problem. An obstructing mass gives four months of progressive solid-food dysphagia with weight loss, not an abrupt total block after one bite of meat."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Oropharyngeal dysphagia"}, {"letter": "B", "text": "Esophageal dysphagia from an obstructing distal mass"}, {"letter": "C", "text": "Achalasia"}, {"letter": "D", "text": "Food bolus impaction"}, {"letter": "E", "text": "Zenker diverticulum"}], "answer": "D", "explanation": "A meat bolus wedged at a ring at the gastroesophageal junction is the lesion itself; the ring is the predisposing structural abnormality that let it lodge. The clean film matters as much as the scope, since it excludes the perforation that blood-stained saliva raises."}, {"key": "mgmt", "path": "both", "stem": "He has a food bolus impaction. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Chest imaging to completion before endoscopy is arranged"}, {"letter": "B", "text": "Endoscopic removal of the bolus now, with biopsy of the lesion beneath it"}, {"letter": "C", "text": "Nifedipine 10 mg sublingually, with endoscopy if he still cannot swallow tomorrow"}, {"letter": "D", "text": "Swallow therapy with a texture-modified diet"}, {"letter": "E", "text": "Glucagon 1 mg intravenously, with a further 12 hours of observation"}], "answer": "B", "explanation": "Inability to handle secretions is an indication to intervene, not to observe, and the same procedure that clears the bolus samples the lesion that caused it. Glucagon and nifedipine give mixed results at best and buy time this patient does not have; imaging is not mandatory and must never delay the scope."}, {"key": "escalate", "path": "both", "stem": "The bolus is cleared endoscopically and he swallows liquids without difficulty. Which of the following should be added?", "options": [{"letter": "A", "text": "Swallow therapy with a texture-modified diet"}, {"letter": "B", "text": "Endoscopic dilation at the time of the index procedure"}, {"letter": "C", "text": "Pneumatic balloon dilation of the lower esophageal sphincter"}, {"letter": "D", "text": "Gastroenterology follow-up with a proton pump inhibitor"}, {"letter": "E", "text": "Endoscopic diverticulotomy of the outpouching"}], "answer": "D", "explanation": "Clearing the bolus treats the event, not the reason it happened. A ring, a stricture, or eosinophilic esophagitis underlies almost all of these, so the patient leaves with gastroenterology follow-up and a proton pump inhibitor taken 30 minutes before a meal on an empty stomach."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to emergency endoscopy for a suspected button battery?", "options": [{"letter": "A", "text": "Scope emergently in every patient, whatever the symptoms"}, {"letter": "B", "text": "Scope emergently only if the patient can no longer handle secretions"}, {"letter": "C", "text": "Scope emergently only if subcutaneous emphysema has developed"}, {"letter": "D", "text": "Scope emergently only if the battery has not passed within 12 hours"}, {"letter": "E", "text": "Scope emergently only if a radiograph shows the battery in the esophagus"}], "answer": "A", "explanation": "A button battery burns by alkali injury rather than by obstruction, so symptoms lag the damage: burns begin at 4 hours and perforation by 6. The 12-hour rule and the secretion rule govern food, not batteries, and waiting for a film or for crepitus wastes the window in which the esophagus is still intact."}]}, {"case": "ES-E1", "group": "ES-E", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "objective": "", "vignette_workup": "A 57-year-old woman comes to the gastroenterology clinic because swallowing has hurt for six weeks. The pain is a sharp burn behind the breastbone that arrives with each bite and fades between meals, and she has begun avoiding hot coffee and citrus. She has had heartburn and regurgitation for years. She takes no antibiotics, bisphosphonates, potassium chloride, or NSAIDs, has no asthma or food allergies, and has no history of HIV, chemotherapy, or transplantation. Her temperature is 36.9°C (98.4°F), blood pressure is 126/76 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 98% on room air. There is no oral thrush and there are no oral ulcers, and she swallows her own secretions without difficulty. There is no crepitus.", "labs_workup": [], "vignette_recog": "A 57-year-old woman comes to the gastroenterology clinic because swallowing has hurt for six weeks. The pain is a sharp burn behind the breastbone that arrives with each bite and fades between meals, and she has begun avoiding hot coffee and citrus. She has had heartburn and regurgitation for years. She takes no antibiotics, bisphosphonates, potassium chloride, or NSAIDs, has no asthma or food allergies, and has no history of HIV, chemotherapy, or transplantation. Her temperature is 36.9°C (98.4°F), blood pressure is 126/76 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 98% on room air. There is no oral thrush and there are no oral ulcers, and she swallows her own secretions without difficulty. She proceeds to endoscopy.", "labs_recog": [["Upper endoscopy", "Erosive esophagitis of the distal esophagus; no white plaques, no shallow volcano-like ulcers, no large linear ulcers, no concentric rings or linear furrows, and no discrete ulcer with normal surrounding mucosa"], ["Esophageal biopsy", "Reflux change with fewer than 5 eosinophils per high-power field; no viral inclusions and no fungal forms"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CD4 count with confirmatory HIV testing"}, {"letter": "B", "text": "Histology of an ulcer-edge biopsy"}, {"letter": "C", "text": "A medication review with the timing of each tablet"}, {"letter": "D", "text": "Histology of an ulc
