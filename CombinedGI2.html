er-base biopsy"}, {"letter": "E", "text": "Upper endoscopy with esophageal biopsy"}], "answer": "E", "explanation": "Odynophagia is the cardinal symptom of every cause in this differential, so the study that separates them is the one that looks at the lining and samples it. Targeted ulcer-edge and ulcer-base biopsies presuppose an ulcer, and a CD4 count answers a question her history has already answered."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Erosive change confined to the distal esophagus"}, {"letter": "B", "text": "A discrete ulcer with normal surrounding mucosa"}, {"letter": "C", "text": "White mucosal plaques coating the length of the esophagus"}, {"letter": "D", "text": "Multiple shallow, well-circumscribed volcano-like ulcers"}, {"letter": "E", "text": "Large, deep linear and longitudinal ulcers"}], "answer": "A", "explanation": "Refluxed acid injures the segment it bathes, so the damage is distal and erosive rather than focal or ulcerated. Plaques, linear ulcers, and volcano ulcers each belong to an organism, and a solitary discrete ulcer with normal mucosa around it belongs to a tablet."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Reflux esophagitis"}, {"letter": "B", "text": "Cytomegalovirus esophagitis"}, {"letter": "C", "text": "Pill-induced esophagitis"}, {"letter": "D", "text": "Candida esophagitis"}, {"letter": "E", "text": "Herpes simplex virus esophagitis"}], "answer": "A", "explanation": "The cause of odynophagia is in the history: immunosuppression points to infection, a tablet taken dry or at bedtime to pill injury, atopy with impaction to eosinophilic disease, and chronic reflux to acid. She is immunocompetent with clear oral mucosa and years of heartburn, and the biopsy shows reflux change with fewer than 5 eosinophils per high-power field."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Herpes simplex virus esophagitis"}, {"letter": "B", "text": "Candida esophagitis"}, {"letter": "C", "text": "Pill-induced esophagitis"}, {"letter": "D", "text": "Reflux esophagitis"}, {"letter": "E", "text": "Cytomegalovirus esophagitis"}], "answer": "D", "explanation": "Distal erosive change with reflux histology and no viral inclusions or fungal forms settles this. The endoscopic report is written as a list of exclusions precisely because the four causes are separated by what the lining looks like and what the biopsy contains."}, {"key": "mgmt", "path": "both", "stem": "She has reflux esophagitis. Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "A standard-dose proton pump inhibitor"}, {"letter": "B", "text": "Fluconazole 200 to 400 mg orally daily"}, {"letter": "C", "text": "Acyclovir 400 mg orally five times daily"}, {"letter": "D", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "E", "text": "Ganciclovir or valganciclovir"}], "answer": "A", "explanation": "The cause dictates the drug: an antifungal for Candida, acyclovir for herpes simplex, ganciclovir for cytomegalovirus, and acid suppression for reflux and for pill injury. Nothing here is infectious or eosinophilic, so the only agent that treats the injury is a proton pump inhibitor."}, {"key": "counsel", "path": "both", "stem": "She has reflux esophagitis. Which of the following is the most appropriate approach to endoscopy with biopsy in odynophagia?", "options": [{"letter": "A", "text": "Endoscopy with biopsy in every patient with odynophagia"}, {"letter": "B", "text": "Endoscopy with biopsy only once a proton pump inhibitor has failed"}, {"letter": "C", "text": "Endoscopy with biopsy only in patients who cannot tolerate oral intake"}, {"letter": "D", "text": "Endoscopy with biopsy only in patients with HIV, chemotherapy, or transplantation"}, {"letter": "E", "text": "Endoscopy with biopsy only when oral thrush or oral ulcers are seen"}], "answer": "A", "explanation": "Esophagitis is often a clinical diagnosis, but endoscopy with biopsy is the only way to separate the four causes, and each of them presents with odynophagia. Restricting the study to the immunosuppressed, to those with oral findings, or to treatment failures leaves the cause named by guesswork; inability to tolerate oral intake is an admission criterion, not a scoping threshold."}]}, {"case": "ES-E2", "group": "ES-E", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "objective": "", "vignette_workup": "A 36-year-old man is brought to the emergency department because swallowing has hurt for two weeks and now hurts enough that he has stopped eating and takes only sips of water. He also has trouble getting food down and discomfort behind the breastbone, and he has lost 9 kg over three months. His clinic sent a reactive HIV screen last week and he has never been treated; he has had no chemotherapy, no transplant, and no hematologic malignancy. His temperature is 37.2°C (99.0°F), blood pressure is 108/66 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 98% on room air. White curd-like plaques that scrape off cover the tongue and buccal mucosa, and he has temporal wasting and cachexia. There are no oral ulcers and no crepitus. He is admitted.", "labs_workup": [["CD4 count", "62 cells/µL"], ["HIV antigen/antibody assay", "Reactive and confirmed"]], "vignette_recog": "A 36-year-old man is brought to the emergency department because swallowing has hurt for two weeks and now hurts enough that he has stopped eating and takes only sips of water. He also has trouble getting food down and discomfort behind the breastbone, and he has lost 9 kg over three months. His clinic sent a reactive HIV screen last week and he has never been treated; he has had no chemotherapy, no transplant, and no hematologic malignancy. His temperature is 37.2°C (99.0°F), blood pressure is 108/66 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 98% on room air. White curd-like plaques that scrape off cover the tongue and buccal mucosa, and he has temporal wasting and cachexia. There are no oral ulcers and no crepitus. He is admitted and, because he cannot maintain oral intake, endoscoped.", "labs_recog": [["CD4 count", "62 cells/µL"], ["HIV antigen/antibody assay", "Reactive and confirmed"], ["Upper endoscopy", "White mucosal plaque-type lesions coating the length of the esophagus, with friable mucosa beneath them"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A medication review with the timing of each tablet"}, {"letter": "B", "text": "Biopsy of the edge of an esophageal ulcer"}, {"letter": "C", "text": "Upper endoscopy with esophageal biopsy"}, {"letter": "D", "text": "Proximal and distal esophageal biopsies for an eosinophil count"}, {"letter": "E", "text": "Biopsy of the base of an esophageal ulcer"}], "answer": "C", "explanation": "Thrush with odynophagia in an HIV patient is treated empirically and endoscopy is reserved for no response at 3 to 5 days — but a patient who has stopped eating and can take only sips is the exception, and he is scoped now. Targeted ulcer-edge and ulcer-base sampling belongs to the viral causes, and a medication review will not explain a CD4 of 62."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Large, deep linear and longitudinal ulcers"}, {"letter": "B", "text": "Multiple shallow, well-circumscribed volcano-like ulcers"}, {"letter": "C", "text": "A discrete ulcer with normal surrounding mucosa"}, {"letter": "D", "text": "White mucosal plaque-type lesions coating the length of the esophagus"}, {"letter": "E", "text": "Erosive change confined to the distal esophagus"}], "answer": "D", "explanation": "The organism that coats the mouth coats the esophagus by the same mechanism, and at a CD4 count this low it does so along the whole length rather than in one segment. The mucosa beneath the plaques is friable because the invasion is superficial and diffuse."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cytomegalovirus esophagitis"}, {"letter": "B", "text": "Herpes simplex virus esophagitis"}, {"letter": "C", "text": "Pill-induced esophagitis"}, {"letter": "D", "text": "Candida esophagitis"}, {"letter": "E", "text": "Reflux esophagitis"}], "answer": "D", "explanation": "Oral thrush on examination points to Candida and oral ulcers to herpes simplex; he has the first and not the second. Candida albicans is the most common cause, is seen with advanced immunosuppression below a CD4 of 200 cells/µL, and is an AIDS-defining illness."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cytomegalovirus esophagitis"}, {"letter": "B", "text": "Pill-induced esophagitis"}, {"letter": "C", "text": "Herpes simplex virus esophagitis"}, {"letter": "D", "text": "Candida esophagitis"}, {"letter": "E", "text": "Reflux esophagitis"}], "answer": "D", "explanation": "Plaques coating the esophagus in a man with thrush and a CD4 of 62 cells/µL are fungal, not viral: cytomegalovirus gives large deep linear ulcers and herpes simplex gives shallow volcano ulcers. Reflux erosions and a solitary pill ulcer both require a history he does not have."}, {"key": "mgmt", "path": "both", "stem": "He has Candida esophagitis. Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "Acyclovir 400 mg orally five times daily"}, {"letter": "B", "text": "Nystatin swish-and-swallow"}, {"letter": "C", "text": "Clotrimazole troches"}, {"letter": "D", "text": "Ganciclovir or valganciclovir"}, {"letter": "E", "text": "Fluconazole 200 to 400 mg orally daily"}], "answer": "E", "explanation": "Esophageal candidiasis always requires systemic therapy. Nystatin swish-and-swallow and clotrimazole troches act on the mouth, clear the thrush, and leave the esophagus untreated — which is exactly the trap when the visible disease is oral."}, {"key": "counsel", "path": "both", "stem": "He has Candida esophagitis. Which of the following is the most appropriate approach to treating it empirically?", "options": [{"letter": "A", "text": "Treat empirically only if the patient cannot maintain oral intake"}, {"letter": "B", "text": "Treat empirically only after 3 to 5 days without response to a topical agent"}, {"letter": "C", "text": "Treat empirically only after endoscopy has shown esophageal plaques"}, {"letter": "D", "text": "Treat empirically only once the CD4 count is below 200 cells/µL"}, {"letter": "E", "text": "Treat empirically in any HIV patient with thrush and odynophagia"}], "answer": "E", "explanation": "Thrush plus odynophagia in a known HIV patient is a clinical diagnosis and is treated without scoping first; endoscopy is what you do when that treatment fails at 3 to 5 days, or when the patient cannot maintain intake. Waiting for a CD4 threshold or for a topical trial delays therapy in a patient who is already not eating."}]}, {"case": "BI-D1", "group": "BI-D", "section": "chronic cholestasis with fatigue and pruritus", "objective": "", "vignette_workup": "A 34-year-old man is referred to the gastroenterology clinic because his alkaline phosphatase has climbed on the last three routine panels. He was diagnosed with ulcerative colitis with pancolitis at 26 and takes mesalamine. He is tired, has been itching for several months, has lost 4 kg over the past six months, and has occasional dull right upper quadrant discomfort. His temperature is 36.8°C (98.2°F), blood pressure is 122/74 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has mild scleral icterus, a liver edge palpable 3 cm below the costal margin with a palpable spleen tip, and excoriations over both forearms.", "labs_workup": [["Alkaline phosphatase", "612 U/L"], ["GGT", "388 U/L"], ["Total bilirubin", "1.9 mg/dL"], ["AST / ALT", "96 U/L / 112 U/L"], ["p-ANCA", "Positive"], ["Antimitochondrial antibody", "Negative"], ["Albumin / INR", "4.0 g/dL / 1.0"]], "vignette_recog": "A 34-year-old man is referred to the gastroenterology clinic because his alkaline phosphatase has climbed on the last three routine panels. He was diagnosed with ulcerative colitis with pancolitis at 26 and takes mesalamine. He is tired, has been itching for several months, has lost 4 kg over the past six months, and has occasional dull right upper quadrant discomfort. His temperature is 36.8°C (98.2°F), blood pressure is 122/74 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has mild scleral icterus, a liver edge palpable 3 cm below the costal margin with a palpable spleen tip, and excoriations over both forearms.", "labs_recog": [["Alkaline phosphatase", "612 U/L"], ["GGT", "388 U/L"], ["Total bilirubin", "1.9 mg/dL"], ["AST / ALT", "96 U/L / 112 U/L"], ["p-ANCA", "Positive"], ["Antimitochondrial antibody", "Negative"], ["Serum IgG4", "Normal"], ["MRCP", "Multifocal strictures with intervening dilatation, giving the intra- and extrahepatic ducts a beaded appearance"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Blood cultures"}, {"letter": "B", "text": "ERCP"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "MRCP cholangiogram"}, {"letter": "E", "text": "Liver biopsy"}], "answer": "D", "explanation": "The antibody does not make this diagnosis — p-ANCA positivity is research-based and no one relies on it — so the cholangiogram does, and the cholangiogram is the MRCP. ERCP is reserved for intervention, and biopsy is held back for the case in which cholangiography is non-diagnostic."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Strictures with duct wall thickening and a raised IgG4"}, {"letter": "B", "text": "A granuloma surrounding a bile duct"}, {"letter": "C", "text": "A filling defect within the common bile duct"}, {"letter": "D", "text": "Beaded intra- and extrahepatic ducts"}, {"letter": "E", "text": "Escherichia coli growing from blood"}], "answer": "D", "explanation": "Inflammation, fibrosis, and stricturing of the medium and large ducts produce alternating narrowed and dilated segments along the whole tree, intra- and extrahepatic, which is the beaded appearance. A single filling defect is a stone, and duct wall thickening with a raised IgG4 belongs to IgG4 cholangiopathy."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cholangitis"}, {"letter": "B", "text": "Primary biliary cholangitis"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "IgG4-related sclerosing cholangitis"}, {"letter": "E", "text": "Primary sclerosing cholangitis"}], "answer": "E", "explanation": "Up to 90% of these patients have ulcerative colitis, and pancolitis carries the highest association. Antimitochondrial antibody positivity would point away from this and toward primary biliary cholangitis, which involves small intrahepatic ducts only and does not bead the extrahepatic tree."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Primary sclerosing cholangitis"}, {"letter": "B", "text": "Primary biliary cholangitis"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "Cholangitis"}, {"letter": "E", "text": "IgG4-related sclerosing cholangitis"}], "answer": "A", "explanation": "Beading of both the intra- and extrahepatic ducts is large-duct disease and settles the diagnosis; primary biliary cholangitis spares the large ducts and would carry a positive antimitochondrial antibody. A normal IgG4 excludes the steroid-responsive mimic."}, {"key": "mgmt", "path": "both", "stem": "He has primary sclerosing cholangitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Elafibranor or seladelpar as second-line therapy"}, {"letter": "B", "text": "Corticosteroids for a steroid-responsive stricture"}, {"letter": "C", "text": "ERCP with sphincterotomy and stone extraction"}, {"letter": "D", "text": "Surveillance with ursodeoxycholic acid 15 mg/kg daily"}, {"letter": "E", "text": "Intravenous antibiotics followed by urgent ERCP"}], "answer": "D", "explanation": "No treatment is proven to slow progression, so the management is surveillance, with ursodeoxycholic acid added to reduce the cholesterol content of bile. Second-line agents belong to the small-duct autoimmune disease when its alkaline phosphatase fails to normalize, steroids treat the IgG4 mimic, and duct instrumentation treats an obstructing stone."}, {"key": "escalate", "path": "both", "stem": "Over the following years his liver enzymes and bilirubin continue to climb despite ursodeoxycholic acid. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Ursodeoxycholic acid continued at the same 15 mg/kg daily dose"}, {"letter": "B", "text": "Corticosteroids"}, {"letter": "C", "text": "Intravenous antibiotics followed by urgent ERCP"}, {"letter": "D", "text": "Liver transplantation"}, {"letter": "E", "text": "ERCP with sphincterotomy and stone extraction"}], "answer": "D", "explanation": "Few agents show clear benefit and none halts the disease, so advanced disease is treated by replacing the organ. Antibiotics have a place here only for recurrent cholangitis, and carrying on an agent that does not change the natural history buys nothing."}, {"key": "counsel", "path": "both", "stem": "He has primary sclerosing cholangitis. Which of the following is the most appropriate approach to calling a liver enzyme pattern cholestatic?", "options": [{"letter": "A", "text": "Alkaline phosphatase predominance defines it only when the bilirubin is also raised"}, {"letter": "B", "text": "Alkaline phosphatase predominance defines it only when p-ANCA is positive"}, {"letter": "C", "text": "Alkaline phosphatase predominance defines it only when the aminotransferases stay below 300 U/L"}, {"letter": "D", "text": "Alkaline phosphatase predominance defines it, and bilirubin plays no role"}, {"letter": "E", "text": "Alkaline phosphatase predominance defines it only when the antimitochondrial antibody is negative"}], "answer": "D", "explanation": "The pattern is chosen by which enzyme leads, and bilirubin plays no part in that choice — his is only 1.9 mg/dL and the pattern is unmistakable. The aminotransferases fluctuate and typically stay under 300 U/L here, but that is a description of the disease, not the rule that defines the pattern."}]}, {"case": "BI-D2", "group": "BI-D", "section": "chronic cholestasis with fatigue and pruritus", "objective": "", "vignette_workup": "A 53-year-old woman comes to the primary care clinic because she has itched relentlessly for eight months. It is worse at night and has not responded to emollients or topical antihistamines, and she is tired. Her eyes have not turned yellow. She has Hashimoto thyroiditis and takes levothyroxine, has osteopenia on a recent DEXA scan, and has hypercholesterolemia. Her temperature is 36.7°C (98.1°F), blood pressure is 124/78 mm Hg, pulse is 70/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has excoriations over the arms and upper back and xanthelasma on both upper eyelids. There is no scleral icterus, the liver edge is non-tender, and there is no ascites.", "labs_workup": [["Alkaline phosphatase", "540 U/L"], ["GGT", "310 U/L"], ["Total bilirubin", "0.9 mg/dL"], ["AST / ALT", "52 U/L / 58 U/L"], ["Total cholesterol", "288 mg/dL"]], "vignette_recog": "A 53-year-old woman comes to the primary care clinic because she has itched relentlessly for eight months. It is worse at night and has not responded to emollients or topical antihistamines, and she is tired. Her eyes have not turned yellow. She has Hashimoto thyroiditis and takes levothyroxine, has osteopenia on a recent DEXA scan, and has hypercholesterolemia. Her temperature is 36.7°C (98.1°F), blood pressure is 124/78 mm Hg, pulse is 70/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has excoriations over the arms and upper back and xanthelasma on both upper eyelids. There is no scleral icterus, the liver edge is non-tender, and there is no ascites.", "labs_recog": [["Alkaline phosphatase", "540 U/L"], ["GGT", "310 U/L"], ["Total bilirubin", "0.9 mg/dL"], ["AST / ALT", "52 U/L / 58 U/L"], ["Antimitochondrial antibody", "Positive at a titre of 1:320"], ["Serum IgM", "410 mg/dL"], ["Total cholesterol", "288 mg/dL"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Alkaline phosphatase with a serum IgG4 level"}, {"letter": "B", "text": "MRCP cholangiogram of the biliary tree"}, {"letter": "C", "text": "Alkaline phosphatase with an antimitochondrial antibody"}, {"letter": "D", "text": "Right upper quadrant ultrasound"}, {"letter": "E", "text": "Alkaline phosphatase with a p-ANCA"}], "answer": "C", "explanation": "A cholestatic pattern in a middle-aged woman whose leading complaint is intractable itching is worked up by antibody first, and the antimitochondrial antibody is the marker that carries the diagnosis. Ultrasound and cholangiography look for obstruction, which the painless course and normal bilirubin argue against."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A common bile duct dilated to 12 mm with a white count of 21,400/mm³"}, {"letter": "B", "text": "A positive p-ANCA with a negative antimitochondrial antibody"}, {"letter": "C", "text": "A common bile duct dilated to 9 mm with a bilirubin of 5.2 mg/dL"}, {"letter": "D", "text": "A high serum IgG4"}, {"letter": "E", "text": "An antimitochondrial antibody at 1:320 with a raised IgM"}], "answer": "E", "explanation": "The antimitochondrial antibody is present in more than 95% of these patients and is the key diagnostic marker, and it travels with an elevated IgM. The reciprocal pattern — p-ANCA positive with a negative antimitochondrial antibody — points instead to large-duct disease in a patient with inflammatory bowel disease."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Choledocholithiasis"}, {"letter": "B", "text": "Primary biliary cholangitis"}, {"letter": "C", "text": "IgG4-related sclerosing cholangitis"}, {"letter": "D", "text": "Cholangitis"}, {"letter": "E", "text": "Primary sclerosing cholangitis"}], "answer": "B", "explanation": "Small intrahepatic ducts are the target, so the alkaline phosphatase rises long before the bilirubin, which is still normal here. The female-to-male ratio is about 9:1, and the thyroid disease, osteopenia, and hypercholesterolemia are the associations that cluster with it."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Primary biliary cholangitis"}, {"letter": "B", "text": "Cholangitis"}, {"letter": "C", "text": "IgG4-related sclerosing cholangitis"}, {"letter": "D", "text": "Primary sclerosing cholangitis"}, {"letter": "E", "text": "Choledocholithiasis"}], "answer": "A", "explanation": "A positive antimitochondrial antibody with an elevated IgM in a cholestatic woman is the diagnosis; the same antibody being negative, with p-ANCA positive, is what raises the large-duct alternative. Duct size is the other split — small intrahepatic ducts here, medium and large ducts there."}, {"key": "mgmt", "path": "both", "stem": "She has primary biliary cholangitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Observation without drug therapy"}, {"letter": "B", "text": "Corticosteroids for a steroid-responsive stricture"}, {"letter": "C", "text": "Intravenous antibiotics followed by urgent ERCP"}, {"letter": "D", "text": "Ursodeoxycholic acid, dosed by weight"}, {"letter": "E", "text": "ERCP with sphincterotomy and stone extraction"}], "answer": "D", "explanation": "A weight-based dose of ursodeoxycholic acid is the first-line treatment, and it is the drug the later alkaline phosphatase target is used to judge. Steroids belong to the IgG4 mimic, duct instrumentation to an obstructing stone with fever or jaundice, and observation alone to large-duct disease in which no agent has been shown to alter the course."}, {"key": "escalate", "path": "both", "stem": "She has primary biliary cholangitis and has taken ursodeoxycholic acid for 12 months; her alkaline phosphatase is still 540 U/L and the itching is unchanged. Which of the following treatments should be added?", "options": [{"letter": "A", "text": "Intravenous antibiotics followed by urgent ERCP"}, {"letter": "B", "text": "Corticosteroids"}, {"letter": "C", "text": "ERCP with sphincterotomy and stone extraction"}, {"letter": "D", "text": "Elafibranor or seladelpar"}, {"letter": "E", "text": "Liver transplantation"}], "answer": "D", "explanation": "Failure of the alkaline phosphatase to normalize by 6 to 12 months, or refractory itching, is the trigger for second-line therapy, and these agents also help the pruritus. Steroids belong to the IgG4 mimic, duct instrumentation to obstructing stones, and transplantation to end-stage disease she does not have — her bilirubin is still normal."}, {"key": "counsel", "path": "both", "stem": "She has primary biliary cholangitis. Which of the following is the most appropriate approach to following her alkaline phosphatase?", "options": [{"letter": "A", "text": "Recheck it at 1 year, aiming only for any fall from baseline"}, {"letter": "B", "text": "Recheck it at 1 year, aiming for a level below 180 U/L"}, {"letter": "C", "text": "Recheck it only if the itching worsens"}, {"letter": "D", "text": "Recheck it only once the bilirubin begins to rise"}, {"letter": "E", "text": "Recheck it only if the antimitochondrial antibody titre rises"}], "answer": "B", "explanation": "Treatment is judged against a stated target — below 180 U/L at one year, preferably normal — because that is what decides whether second-line therapy is added. Symptom severity does not correlate with disease severity, so the itch cannot be used as the gauge, and the bilirubin rises only late."}]}, {"case": "GA-B2", "group": "GA-B", "section": "ulcer disease that has escaped control", "objective": "", "vignette_workup": "A 43-year-old woman comes to the gastroenterology clinic with two years of epigastric burning and heartburn that have persisted despite continuous acid suppression. She passes four to six loose stools a day and has lost 9 kg. She has had three endoscopies over those two years, each showing ulcers that came back after treatment. She has never used NSAIDs or aspirin, and she has been tested for Helicobacter pylori twice, both times negative. Her father had a parathyroid tumor and kidney stones. Her temperature is 36.8°C (98.2°F), blood pressure is 118/72 mm Hg, pulse is 86/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has epigastric tenderness with slightly dry mucous membranes, no palpable mass, no jaundice, and no lymphadenopathy.", "labs_workup": [["Upper endoscopy", "Multiple ulcers in the second and third portions of the duodenum"], ["Fasting serum gastrin (off the PPI)", "1,480 pg/mL"], ["Gastric pH", "1.6"], ["Serum calcium", "11.2 mg/dL"], ["Hemoglobin / hematocrit", "12.6 g/dL / 38%"], ["MCV", "87 fL"]], "vignette_recog": "A 43-year-old woman comes to the gastroenterology clinic with two years of epigastric burning and heartburn that have persisted despite continuous acid suppression. She passes four to six loose stools a day and has lost 9 kg. She has had three endoscopies over those two years, each showing ulcers that came back after treatment. She has never used NSAIDs or aspirin, and she has been tested for Helicobacter pylori twice, both times negative. Her father had a parathyroid tumor and kidney stones. Her temperature is 36.8°C (98.2°F), blood pressure is 118/72 mm Hg, pulse is 86/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has epigastric tenderness with slightly dry mucous membranes, no palpable mass, no jaundice, and no lymphadenopathy.", "labs_recog": [["Upper endoscopy", "Multiple ulcers in the second and third portions of the duodenum"], ["Fasting serum gastrin (off the PPI)", "1,480 pg/mL"], ["Gastric pH", "1.6"], ["Serum calcium", "11.2 mg/dL"], ["Serum gastrin after intravenous secretin", "Rises from 1,480 to 1,910 pg/mL"], ["Endoscopic ultrasound", "1.8 cm mass in the pancreatic head"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A complete blood count with a basic metabolic panel"}, {"letter": "B", "text": "Helicobacter pylori stool antigen testing"}, {"letter": "C", "text": "Secretin stimulation test"}, {"letter": "D", "text": "An upright chest radiograph"}, {"letter": "E", "text": "Upper endoscopy with biopsy"}], "answer": "C", "explanation": "An ulcer burden with no NSAID exposure and negative Helicobacter testing is the trigger to look for a hypergastrinemic cause rather than to re-treat empirically, and the pairing of a gastrin above 1,000 pg/mL with a gastric pH below 2 has already been shown. The stimulation test is what tells you the source of that gastrin."}, {"key": "result", "path": "W", "stem": "Which of the following results is most likely to be present?", "options": [{"letter": "A", "text": "A gastrin rise of 430 pg/mL after intravenous secretin"}, {"letter": "B", "text": "An antral ulcer with a smooth base and radiating folds"}, {"letter": "C", "text": "A scarred, narrowed pylorus with benign biopsies"}, {"letter": "D", "text": "A duodenal bulb ulcer with a non-bleeding visible vessel"}, {"letter": "E", "text": "Inflamed, eroded gastric mucosa without an ulcer"}], "answer": "A", "explanation": "Secretin normally inhibits the gastric G cells, so gastrin should fall. Tumour cells respond in the opposite direction and release gastrin instead, so a rise of more than 200 pg/mL is paradoxical and diagnostic."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Uncomplicated peptic ulcer disease"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "Bleeding peptic ulcer"}, {"letter": "D", "text": "Gastritis"}, {"letter": "E", "text": "Zollinger-Ellison syndrome"}], "answer": "E", "explanation": "Recurrent or refractory ulcers occur in 73 to 98% of these patients, and the ulcers sit distally in the second and third portions of the duodenum rather than in the bulb. The diarrhoea comes from the same acid load, and the raised calcium with a father who had a parathyroid tumour points to multiple endocrine neoplasia type I."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Uncomplicated peptic ulcer disease"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "Bleeding peptic ulcer"}, {"letter": "D", "text": "Gastritis"}, {"letter": "E", "text": "Zollinger-Ellison syndrome"}], "answer": "E", "explanation": "A gastrin that rises after secretin rather than falling identifies a neuroendocrine source, and endoscopic ultrasound localizes it in the pancreas. Ordinary ulcer disease and gastritis cannot produce hypergastrinaemia of this magnitude against a gastric pH of 1.6."}, {"key": "mgmt", "path": "both", "stem": "She has Zollinger-Ellison syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Intravenous proton pump inhibitor bolus and drip with endoscopic clipping"}, {"letter": "B", "text": "A proton pump inhibitor for 8 weeks with withdrawal of the offending agent"}, {"letter": "C", "text": "Vasoactive drip with endoscopic band ligation"}, {"letter": "D", "text": "High-dose proton pump inhibitor with surgical resection of the tumour"}, {"letter": "E", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}], "answer": "D", "explanation": "Acid suppression at high dose controls the symptom while resection removes the source, and only resection is definitive. A fixed 8-week course with agent withdrawal treats ordinary ulcer disease, which is precisely the empirical re-treatment that has already failed her three times."}, {"key": "counsel", "path": "both", "stem": "She has Zollinger-Ellison syndrome. Which of the following is the most appropriate approach to measuring a fasting serum gastrin?", "options": [{"letter": "A", "text": "Draw it off the proton pump inhibitor and accept any level above 200 pg/mL"}, {"letter": "B", "text": "Draw it off the proton pump inhibitor and pair it with a gastric pH below 2"}, {"letter": "C", "text": "Draw it off the proton pump inhibitor only once Helicobacter testing is negative"}, {"letter": "D", "text": "Draw it while the proton pump inhibitor is continued and pair it with a gastric pH below 2"}, {"letter": "E", "text": "Draw it while the proton pump inhibitor is continued and accept any level above 1,000 pg/mL"}], "answer": "B", "explanation": "Acid suppression itself raises gastrin, so a level drawn on a proton pump inhibitor cannot be interpreted at all. What makes the result diagnostic is the pairing — a gastrin above 1,000 pg/mL while the stomach is still making acid at a pH below 2."}]}, {"case": "DI-C2", "group": "DI-C", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "objective": "", "vignette_workup": "A 4-year-old boy is brought to the emergency department by his mother with three days of diarrhea. It began watery and is now bloody and mucoid, and he strains constantly with an unrelenting urge to pass stool. He has fever and cramping. He attends daycare, where two other children in his room have diarrhea. He has not travelled and has taken no antibiotics. His temperature is 39.0°C (102.2°F), blood pressure is 96/60 mm Hg, pulse is 138/min, respirations are 26/min, and oxygen saturation is 99% on room air. He is febrile and irritable, with slightly dry mucous membranes and a capillary refill of 2 seconds, diffuse abdominal tenderness, and gross blood and mucus in the diaper.", "labs_workup": [["WBC", "16,800/mm³ with bandemia"], ["Hemoglobin / hematocrit", "12.1 g/dL / 36%"], ["Platelets", "310,000/mm³"], ["Sodium / potassium", "134 mEq/L / 3.3 mEq/L"], ["Bicarbonate", "19 mEq/L"], ["BUN / creatinine", "20 mg/dL / 0.4 mg/dL"]], "vignette_recog": "A 4-year-old boy is brought to the emergency department by his mother with three days of diarrhea. It began watery and is now bloody and mucoid, and he strains constantly with an unrelenting urge to pass stool. He has fever and cramping. He attends daycare, where two other children in his room have diarrhea. He has not travelled and has taken no antibiotics. His temperature is 39.0°C (102.2°F), blood pressure is 96/60 mm Hg, pulse is 138/min, respirations are 26/min, and oxygen saturation is 99% on room air. He is febrile and irritable, with slightly dry mucous membranes and a capillary refill of 2 seconds, diffuse abdominal tenderness, and gross blood and mucus in the diaper.", "labs_recog": [["WBC", "16,800/mm³ with bandemia"], ["Hemoglobin / hematocrit", "12.1 g/dL / 36%"], ["Platelets", "310,000/mm³"], ["Sodium / potassium", "134 mEq/L / 3.3 mEq/L"], ["Bicarbonate", "19 mEq/L"], ["BUN / creatinine", "20 mg/dL / 0.4 mg/dL"], ["Stool multiplex PCR", "Positive for Shigella"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A specially ordered stool culture for Escherichia coli O157:H7"}, {"letter": "B", "text": "A stool antigen assay for Entamoeba histolytica"}, {"letter": "C", "text": "Stool multiplex PCR"}, {"letter": "D", "text": "Stool culture"}, {"letter": "E", "text": "A serum antigen assay for Entamoeba histolytica"}], "answer": "C", "explanation": "A multiplex panel names the organism in hours and covers every pathogen in this differential at once, which is what an inflammatory diarrhoea with fever and blood requires. Culture takes days and is the confirmatory step, and the antigen assays answer a question that only arises with travel to an endemic region."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Polymerase chain reaction positive for Shiga toxin-producing Escherichia coli"}, {"letter": "B", "text": "Polymerase chain reaction positive for Yersinia"}, {"letter": "C", "text": "Polymerase chain reaction positive for Salmonella"}, {"letter": "D", "text": "Polymerase chain reaction positive for Campylobacter"}, {"letter": "E", "text": "Polymerase chain reaction positive for Shigella"}], "answer": "E", "explanation": "The organism is very virulent — as few as 10 bacteria cause infection — which is why it moves through a daycare room and why two other children are ill. It invades the colon, so the diarrhoea starts watery and turns bloody and mucoid, with the straining that comes from an inflamed rectum."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}, {"letter": "B", "text": "Yersinia enterocolitica enteritis"}, {"letter": "C", "text": "Shigellosis"}, {"letter": "D", "text": "Campylobacter jejuni enteritis"}, {"letter": "E", "text": "Salmonella gastroenteritis"}], "answer": "C", "explanation": "Tenesmus with fecal-oral spread through a daycare room is the pattern, and the watery-then-bloody sequence over one to seven days fits the incubation. Enterohemorrhagic Escherichia coli bleeds with minimal or no fever, and the other two localize their pain rather than spreading it."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Salmonella gastroenteritis"}, {"letter": "C", "text": "Shigellosis"}, {"letter": "D", "text": "Campylobacter jejuni enteritis"}, {"letter": "E", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}], "answer": "C", "explanation": "The panel names the organism, and the clinical picture matches it: a young child with tenesmus, high fever, and daycare contacts who are also ill. It matters which organism it is, because this is one of the few that is always treated when symptomatic."}, {"key": "mgmt", "path": "both", "stem": "He has shigellosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with fluid replacement plus ciprofloxacin or azithromycin"}, {"letter": "B", "text": "Supportive care with fluid and electrolyte replacement, withholding antibiotics unless a risk category is met"}, {"letter": "C", "text": "Supportive care and hydration alone"}, {"letter": "D", "text": "Metronidazole or tinidazole followed by paromomycin"}, {"letter": "E", "text": "Supportive care with monitoring for hemolytic uremic syndrome, with antibiotics never given"}], "answer": "A", "explanation": "This is one of the infections that is always treated when the patient is symptomatic: antibiotics shorten fever and diarrhoea by about two days and cut shedding to the other children. Withholding them as one would for Salmonella is the error the case is built around, and trimethoprim-sulfamethoxazole is avoided wherever possible because resistance is high."}, {"key": "counsel", "path": "both", "stem": "He has shigellosis. Which of the following is the most appropriate approach to antibiotic therapy in this infection?", "options": [{"letter": "A", "text": "Treat every symptomatic patient"}, {"letter": "B", "text": "Treat only patients still symptomatic after 7 days"}, {"letter": "C", "text": "Treat only patients whose stool culture has confirmed the organism"}, {"letter": "D", "text": "Treat only patients who attend daycare or another group setting"}, {"letter": "E", "text": "Treat only patients still febrile after fluid replacement"}], "answer": "A", "explanation": "Symptoms alone are the indication, so nothing is waited on — not the culture, not a fever that persists past resuscitation, and not the seventh day, by which point the illness is generally self-limited anyway. The point of treating is both to shorten the illness and to stop the patient shedding to contacts."}]}, {"case": "DI-C3", "group": "DI-C", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "objective": "", "vignette_workup": "A 22-year-old man comes to the emergency department with three days of severe cramping pain around the umbilicus and twelve bowel movements a day, bloody and mucoid since yesterday. He has fever with rigors. Four days ago he ate grilled chicken at a barbecue that was still pink at the bone, and a new puppy at home has had diarrhea. He has not travelled and has taken no antibiotics. His temperature is 38.9°C (102.0°F), blood pressure is 118/72 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 99% on room air. He is febrile with marked periumbilical and lower abdominal tenderness and voluntary guarding, no rebound and no rigidity, present bowel sounds, and no right lower quadrant point tenderness.", "labs_workup": [["WBC", "13,900/mm³ with a left shift"], ["Hemoglobin / hematocrit", "15.1 g/dL / 45%"], ["Platelets", "232,000/mm³"], ["Potassium", "3.4 mEq/L"], ["Bicarbonate", "21 mEq/L"], ["Creatinine", "1.1 mg/dL"]], "vignette_recog": "A 22-year-old man comes to the emergency department with three days of severe cramping pain around the umbilicus and twelve bowel movements a day, bloody and mucoid since yesterday. He has fever with rigors. Four days ago he ate grilled chicken at a barbecue that was still pink at the bone, and a new puppy at home has had diarrhea. He has not travelled and has taken no antibiotics. His temperature is 38.9°C (102.0°F), blood pressure is 118/72 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 99% on room air. He is febrile with marked periumbilical and lower abdominal tenderness and voluntary guarding, no rebound and no rigidity, present bowel sounds, and no right lower quadrant point tenderness.", "labs_recog": [["WBC", "13,900/mm³ with a left shift"], ["Hemoglobin / hematocrit", "15.1 g/dL / 45%"], ["Platelets", "232,000/mm³"], ["Potassium", "3.4 mEq/L"], ["Bicarbonate", "21 mEq/L"], ["Creatinine", "1.1 mg/dL"], ["Stool multiplex PCR", "Positive for Campylobacter"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A specially ordered stool culture for Escherichia coli O157:H7"}, {"letter": "B", "text": "Stool multiplex PCR"}, {"letter": "C", "text": "A stool antigen assay for Entamoeba histolytica"}, {"letter": "D", "text": "Stool culture"}, {"letter": "E", "text": "A serum antigen assay for Entamoeba histolytica"}], "answer": "B", "explanation": "The panel covers every organism in this differential in one specimen and returns fast enough to change management, which matters when the pain is severe enough to raise a surgical question. Culture is the confirmatory step and the antigen assays belong to travel-associated disease."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Polymerase chain reaction positive for Yersinia"}, {"letter": "B", "text": "Polymerase chain reaction positive for Campylobacter"}, {"letter": "C", "text": "Polymerase chain reaction positive for Shiga toxin-producing Escherichia coli"}, {"letter": "D", "text": "Polymerase chain reaction positive for Salmonella"}, {"letter": "E", "text": "Polymerase chain reaction positive for Shigella"}], "answer": "B", "explanation": "The organism lives in the intestinal tracts of animal hosts, poultry above all, and undercooked chicken four days before onset sits squarely inside the one to seven day incubation. Its abdominal pain is more severe than that of any other bacterial diarrhoea and can mimic appendicitis or colitis."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Shigellosis"}, {"letter": "C", "text": "Salmonella gastroenteritis"}, {"letter": "D", "text": "Campylobacter jejuni enteritis"}, {"letter": "E", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}], "answer": "D", "explanation": "Ten or more bowel movements a day with pain out of proportion to the rest of the differential, and stools turning bloody by day two or three, is the signature. There is no tenesmus, the pain is periumbilical rather than localized to the right lower quadrant, and the exposure is poultry rather than raw pork."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}, {"letter": "C", "text": "Shigellosis"}, {"letter": "D", "text": "Salmonella gastroenteritis"}, {"letter": "E", "text": "Campylobacter jejuni enteritis"}], "answer": "E", "explanation": "An oxidase-positive gram-negative rod from a poultry source, with pseudoappendicitis-grade pain and frequent bloody stools, is this organism. Naming it changes what happens afterwards, because it is the classic antecedent infection for two late complications."}, {"key": "mgmt", "path": "both", "stem": "He has Campylobacter jejuni enteritis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Metronidazole or tinidazole followed by paromomycin"}, {"letter": "B", "text": "Supportive care, with azithromycin 500 mg daily for 3 days if the illness is severe"}, {"letter": "C", "text": "Supportive care with monitoring for hemolytic uremic syndrome, with antibiotics never given"}, {"letter": "D", "text": "Supportive care, with ciprofloxacin 750 mg twice daily for 3 days if the illness is severe"}, {"letter": "E", "text": "Supportive care with fluid replacement plus ciprofloxacin or azithromycin for every symptomatic patient"}], "answer": "B", "explanation": "Most cases need no antibiotic at all, and treatment is reserved for the toxic or immunocompromised patient; when it is given, azithromycin is the agent of choice and a fluoroquinolone is only the alternative. Treating every symptomatic patient is the rule for a different organism in this differential."}, {"key": "counsel", "path": "both", "stem": "He has Campylobacter jejuni enteritis. Which of the following is the most appropriate approach to asking about ascending weakness at follow-up?", "options": [{"letter": "A", "text": "Ask about it only in patients who develop joint pain"}, {"letter": "B", "text": "Ask about it in every patient"}, {"letter": "C", "text": "Ask about it only in patients whose diarrhea lasted beyond 7 days"}, {"letter": "D", "text": "Ask about it only in patients who received an antibiotic"}, {"letter": "E", "text": "Ask about it only in patients whose illness was severe"}], "answer": "B", "explanation": "This organism is responsible for up to 40% of Guillain-Barré cases, and the weakness peaks about two weeks out — well after an illness that is self-limited at a mean of seven days has resolved. Nothing about the severity of the enteritis, the joints, or whether an antibiotic was given predicts it, so the question is asked of everyone rather than dismissed."}]}, {"case": "DI-C4", "group": "DI-C", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "objective": "", "vignette_workup": "A 16-year-old boy comes to the emergency department with five days of right-sided abdominal pain, bloody diarrhea, and fever. Six days ago he ate homemade sausage made from raw pork at a family event, and he drinks unpasteurized milk from a local farm. He has not travelled and has taken no antibiotics. His temperature is 38.4°C (101.1°F), blood pressure is 118/70 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 99% on room air. He is febrile with right lower quadrant tenderness, no rebound and no rigidity, a negative psoas sign, present bowel sounds, and no rash.", "labs_workup": [["WBC", "14,100/mm³ with a left shift"], ["Hemoglobin / hematocrit", "13.8 g/dL / 41%"], ["Platelets", "289,000/mm³"]], "vignette_recog": "A 16-year-old boy comes to the emergency department with five days of right-sided abdominal pain, bloody diarrhea, and fever. Six days ago he ate homemade sausage made from raw pork at a family event, and he drinks unpasteurized milk from a local farm. He has not travelled and has taken no antibiotics. His temperature is 38.4°C (101.1°F), blood pressure is 118/70 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 99% on room air. He is febrile with right lower quadrant tenderness, no rebound and no rigidity, a negative psoas sign, present bowel sounds, and no rash.", "labs_recog": [["WBC", "14,100/mm³ with a left shift"], ["Hemoglobin / hematocrit", "13.8 g/dL / 41%"], ["Platelets", "289,000/mm³"], ["Stool multiplex PCR", "Positive for Yersinia enterocolitica"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A serum antigen assay for Entamoeba histolytica"}, {"letter": "B", "text": "Stool culture"}, {"letter": "C", "text": "A specially ordered stool culture for Escherichia coli O157:H7"}, {"letter": "D", "text": "Stool multiplex PCR"}, {"letter": "E", "text": "A stool antigen assay for Entamoeba histolytica"}], "answer": "D", "explanation": "Naming the organism quickly is what keeps a febrile adolescent with right lower quadrant tenderness out of the operating room, and the panel does it in one specimen. Culture confirms afterwards, and the antigen assays are for travel-associated disease with hepatic involvement."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Polymerase chain reaction positive for Shigella"}, {"letter": "B", "text": "Polymerase chain reaction positive for Yersinia"}, {"letter": "C", "text": "Polymerase chain reaction positive for Shiga toxin-producing Escherichia coli"}, {"letter": "D", "text": "Polymerase chain reaction positive for Campylobacter"}, {"letter": "E", "text": "Polymerase chain reaction positive for Salmonella"}], "answer": "B", "explanation": "Raw pork and unprocessed dairy are the classic sources, and symptoms appear four to seven days after the exposure, which places the sausage exactly. The organism settles in the terminal ileum and the nodes that drain it, which is why the tenderness is on the right."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Shigellosis"}, {"letter": "C", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}, {"letter": "D", "text": "Salmonella gastroenteritis"}, {"letter": "E", "text": "Campylobacter jejuni enteritis"}], "answer": "A", "explanation": "Pain that localizes to the right lower quadrant rather than sitting periumbilical or diffuse, after raw pork and unpasteurized milk, is the discriminator. There is no tenesmus and no poultry exposure, and enterohemorrhagic Escherichia coli bleeds with minimal or no fever."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Shigellosis"}, {"letter": "B", "text": "Salmonella gastroenteritis"}, {"letter": "C", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}, {"letter": "D", "text": "Yersinia enterocolitica enteritis"}, {"letter": "E", "text": "Campylobacter jejuni enteritis"}], "answer": "D", "explanation": "The panel names the organism, and the exposure history and the site of the pain agree with it. The importance of the label here is negative: it identifies the right lower quadrant tenderness as mesenteric adenitis rather than an appendix."}, {"key": "mgmt", "path": "both", "stem": "He has Yersinia enterocolitica enteritis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with fluid replacement plus ciprofloxacin or azithromycin"}, {"letter": "B", "text": "Urgent appendectomy"}, {"letter": "C", "text": "Supportive care with monitoring for hemolytic uremic syndrome, with antibiotics never given"}, {"letter": "D", "text": "Supportive care with ciprofloxacin 500 mg twice daily for 5 days"}, {"letter": "E", "text": "Supportive care and hydration alone"}], "answer": "E", "explanation": "The illness is usually self-limited and antibiotics are typically not needed, being reserved for the toxic or immunocompromised patient. The right lower quadrant pain is mesenteric adenitis, and taking him to the operating room on the pain alone is the trap — the psoas sign is negative and there is no rebound or rigidity."}, {"key": "counsel", "path": "both", "stem": "He has Yersinia enterocolitica enteritis. Which of the following is the most appropriate approach to identifying the source?", "options": [{"letter": "A", "text": "Ask about food eaten 4 to 7 days before symptoms began"}, {"letter": "B", "text": "Ask about food eaten on the day symptoms began"}, {"letter": "C", "text": "Ask about food eaten 1 to 3 weeks before symptoms began"}, {"letter": "D", "text": "Ask about food eaten more than a month before symptoms began"}, {"letter": "E", "text": "Ask about food eaten in the 24 hours before symptoms began"}], "answer": "A", "explanation": "Symptoms typically appear four to seven days after the exposure, so a food history anchored to the day of onset or to the preceding 24 hours misses the meal that caused it. One to three weeks is how long the illness lasts, not how long it takes to start."}]}, {"case": "DI-H3", "group": "DI-H", "section": "loose stools for more than a month in an adult", "objective": "", "vignette_workup": "A 21-year-old woman comes to the primary care clinic with recurrent lower abdominal pain at least one day a week for eight months, relieved by moving her bowels. Her bowel habit alternates between loose stools and constipation, and she is bloated and passes a great deal of gas. Neither the pain nor the stools ever wake her from sleep. She has lost no weight, has seen no blood, and has had no fever. There is no family history of gastrointestinal malignancy, inflammatory bowel disease, or celiac disease. She is a college student and takes no medications. Her temperature is 36.7°C (98.1°F), blood pressure is 108/68 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. The abdomen is soft and non-tender with no distention and no masses, and there is no perianal disease, rash, or pallor.", "labs_workup": [["Hemoglobin / hematocrit", "13.4 g/dL / 40%"], ["MCV", "88 fL"], ["Ferritin", "46 ng/mL"]], "vignette_recog": "A 21-year-old woman comes to the primary care clinic with recurrent lower abdominal pain at least one day a week for eight months, relieved by moving her bowels. Her bowel habit alternates between loose stools and constipation, and she is bloated and passes a great deal of gas. Neither the pain nor the stools ever wake her from sleep. She has lost no weight, has seen no blood, and has had no fever. There is no family history of gastrointestinal malignancy, inflammatory bowel disease, or celiac disease. She is a college student and takes no medications. Her temperature is 36.7°C (98.1°F), blood pressure is 108/68 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. The abdomen is soft and non-tender with no distention and no masses, and there is no perianal disease, rash, or pallor.", "labs_recog": [["Hemoglobin / hematocrit", "13.4 g/dL / 40%"], ["MCV", "88 fL"], ["Ferritin", "46 ng/mL"], ["CRP", "2 mg/L"], ["IgA anti-tissue transglutaminase", "Negative, with a normal total IgA"], ["Fecal calprotectin", "22 µg/g"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fecal calprotectin with CRP and celiac serology"}, {"letter": "B", "text": "Celiac serology with a total IgA"}, {"letter": "C", "text": "An empiric lactose-free diet for 2 weeks"}, {"letter": "D", "text": "A hydrogen breath test"}, {"letter": "E", "text": "Colonoscopy with random biopsies of normal-appearing mucosa"}], "answer": "A", "explanation": "Chronic diarrhoea in an adult is separated first by whether the bowel is inflamed, and fecal calprotectin is the discriminator — 92% sensitive and 82% specific for inflammatory bowel disease in this setting. Serology alone answers only one of the alternatives, and endoscopy is not the opening move in a patient with no alarm feature."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An endoscopically normal colon with months of nocturnal watery stools"}, {"letter": "B", "text": "A fecal calprotectin of 22 µg/g with a normal CRP and no anemia"}, {"letter": "C", "text": "A fecal calprotectin of 480 µg/g with anemia and a CRP of 38 mg/L"}, {"letter": "D", "text": "An IgA anti-tissue transglutaminase of 118 U/mL with iron deficiency anemia"}, {"letter": "E", "text": "Osmotic diarrhea within 2 hours of dairy, clearing on a lactose-free trial"}], "answer": "B", "explanation": "Calprotectin is released by neutrophils in the bowel wall, so a value in the twenties means the mucosa is not inflamed. With a normal CRP and no anemia beside it, the panel argues strongly against an inflammatory cause rather than merely failing to find one."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Microscopic colitis"}, {"letter": "B", "text": "Lactose intolerance"}, {"letter": "C", "text": "Irritable bowel syndrome"}, {"letter": "D", "text": "Small intestinal bacterial overgrowth"}, {"letter": "E", "text": "Celiac disease"}], "answer": "C", "explanation": "The Rome IV criteria are met — recurrent pain at least one day a week for more than three months, related to defecation and to a change in stool frequency and form — and they carry over 95% predictive value. Not one alarm feature is present: no nocturnal diarrhoea, no blood, no weight loss, no anemia, and a normal calprotectin."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Irritable bowel syndrome"}, {"letter": "B", "text": "Celiac disease"}, {"letter": "C", "text": "Microscopic colitis"}, {"letter": "D", "text": "Lactose intolerance"}, {"letter": "E", "text": "Small intestinal bacterial overgrowth"}], "answer": "A", "explanation": "A normal calprotectin with a normal CRP and negative celiac serology closes the differential in a patient who already meets Rome IV. This is not inflammatory bowel disease, and the calprotectin is the number that says so."}, {"key": "mgmt", "path": "both", "stem": "She has irritable bowel syndrome. Which of the following is the most appropriate initial management?", "options": [{"letter": "A", "text": "Rifaximin, metronidazole, or amoxicillin-clavulanate"}, {"letter": "B", "text": "A low FODMAP diet with fatty food, alcohol, and caffeine avoided"}, {"letter": "C", "text": "Lactose limited to threshold with lactase enzyme replacement"}, {"letter": "D", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "E", "text": "NSAIDs and PPIs stopped, with loperamide or bismuth subsalicylate"}], "answer": "B", "explanation": "Diet is the first intervention: a low FODMAP approach with fatty and spicy food, alcohol, and caffeine avoided, and fibre increased if constipation predominates. The other options each treat a diagnosis her panel has excluded."}, {"key": "escalate", "path": "both", "stem": "Her pain and bloating persist despite a low FODMAP diet. Which of the following should be added?", "options": [{"letter": "A", "text": "Enteric-coated peppermint oil"}, {"letter": "B", "text": "Metronidazole or amoxicillin-clavulanate"}, {"letter": "C", "text": "Lactase enzyme replacement with lactose limited to threshold"}, {"letter": "D", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "E", "text": "Loperamide or bismuth subsalicylate after stopping NSAIDs and PPIs"}], "answer": "A", "explanation": "Pain and bloating are treated next with an antispasmodic, and enteric-coated peppermint oil is the gentlest of them. Hyoscyamine and dicyclomine are the alternatives but worsen constipation and cause urinary retention, which matters in a patient whose habit already alternates."}, {"key": "counsel", "path": "both", "stem": "She has irritable bowel syndrome. Which of the following is the most appropriate approach to colonoscopy with mucosal biopsy?", "options": [{"letter": "A", "text": "Perform it only if symptoms fail to respond to a low FODMAP diet"}, {"letter": "B", "text": "Perform it for any patient aged 45 or over without a recent evaluation"}, {"letter": "C", "text": "Perform it only once symptoms have lasted 3 months"}, {"letter": "D", "text": "Perform it for every patient at the time the diagnosis is made"}, {"letter": "E", "text": "Perform it only if the fecal calprotectin is normal"}], "answer": "B", "explanation": "Onset after age 45 is itself an alarm feature, so an unevaluated patient of that age gets the colon looked at and biopsied before the label is applied. Three months is the duration required by the criteria rather than a trigger to scope, and a normal calprotectin argues against endoscopy rather than for it."}]}, {"case": "DI-I2", "group": "DI-I", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "objective": "", "vignette_workup": "A 49-year-old woman comes to the gastroenterology clinic with eight months of bloating that worsens through the day, excessive flatulence, crampy abdominal pain, and loose stools. She had a Roux-en-Y gastric bypass six years ago and takes oxycodone most days for chronic back pain, which has slowed her transit. She has taken no recent antibiotics and has not travelled. Her temperature is 36.9°C (98.4°F), blood pressure is 118/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 98% on room air. Her abdomen is distended and tympanitic with no tenderness and no masses, she has lost 4 kg over eight months, and she has no edema and no pallor.", "labs_workup": [["Vitamin B12", "174 pg/mL"], ["Folate", "Normal"], ["Hemoglobin / hematocrit", "12.4 g/dL / 37%"], ["MCV", "99 fL"]], "vignette_recog": "A 49-year-old woman comes to the gastroenterology clinic with eight months of bloating that worsens through the day, excessive flatulence, crampy abdominal pain, and loose stools. She had a Roux-en-Y gastric bypass six years ago and takes oxycodone most days for chronic back pain, which has slowed her transit. She has taken no recent antibiotics and has not travelled. Her temperature is 36.9°C (98.4°F), blood pressure is 118/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 98% on room air. Her abdomen is distended and tympanitic with no tenderness and no masses, she has lost 4 kg over eight months, and she has no edema and no pallor.", "labs_recog": [["Vitamin B12", "174 pg/mL"], ["Folate", "Normal"], ["Hemoglobin / hematocrit", "12.4 g/dL / 37%"], ["MCV", "99 fL"], ["Hydrogen breath test", "Positive, with a rise of 26 ppm over baseline within 90 minutes"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A stool Giardia antigen test"}, {"letter": "B", "text": "IgA anti-tissue transglutaminase with a total IgA"}, {"letter": "C", "text": "An empiric lactose-free diet for 2 weeks"}, {"letter": "D", "text": "Fecal calprotectin with CRP and celiac serology"}, {"letter": "E", "text": "Hydrogen breath test"}], "answer": "E", "explanation": "This is the most common way the diagnosis is made, and it is the study that fits the mechanism: bacteria in the wrong part of the gut ferment intestinal contents and the hydrogen they produce is exhaled. A dairy trial or celiac serology would be chasing a food, and her symptoms are not tied to a dose of one."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Symptoms that clear on a 2-week trial and return on rechallenge"}, {"letter": "B", "text": "An IgA anti-tissue transglutaminase of 118 U/mL with iron deficiency"}, {"letter": "C", "text": "A breath hydrogen rise of 26 ppm over baseline within 90 minutes"}, {"letter": "D", "text": "Greasy, foul-smelling, non-bloody stool with a normal white count"}, {"letter": "E", "text": "An albumin of 2.8 g/dL after extensive small-bowel resection"}], "answer": "C", "explanation": "A mixed aerobic and anaerobic gram-negative flora fermenting in the small intestine produces gas that is absorbed and exhaled, so breath hydrogen climbs early after the substrate load. The low B12 with a raised MCV is the other half of the same mechanism — the bacteria consume the vitamin before she can absorb it."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Hydrogen breath test after a 50 g lactose load"}, {"letter": "B", "text": "A review of the small-bowel resection history"}, {"letter": "C", "text": "EGD with duodenal biopsy"}, {"letter": "D", "text": "Stool microscopic examination for cysts and trophozoites"}, {"letter": "E", "text": "Small bowel aspirate with culture"}], "answer": "E", "explanation": "Sampling the lumen directly and growing what is in it demonstrates the overgrowth rather than inferring it from exhaled gas. A lactose-loaded breath test asks about a disaccharide rather than about bacterial density, and duodenal histology answers a question about gluten."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Short bowel syndrome after intestinal resection"}, {"letter": "B", "text": "Giardiasis"}, {"letter": "C", "text": "Small intestinal bacterial overgrowth"}, {"letter": "D", "text": "Irritable bowel syndrome"}, {"letter": "E", "text": "Intolerance of dietary lactose"}], "answer": "C", "explanation": "The condition arises where transit has slowed or a blind pocket has been created, which is why bariatric surgery, motility disorders, and narcotics are the risk factors — and she has two of the three. Her bloating is not tied to a dairy dose, and she has had no resection and no protein-energy failure."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Small intestinal bacterial overgrowth"}, {"letter": "B", "text": "Short bowel syndrome after intestinal resection"}, {"letter": "C", "text": "Irritable bowel syndrome"}, {"letter": "D", "text": "Giardiasis"}, {"letter": "E", "text": "Intolerance of dietary lactose"}], "answer": "A", "explanation": "A positive breath test in a woman with a gastric bypass and narcotic-slowed transit, carrying a low B12, is the whole picture. Lactose intolerance would give a breath rise only after a dairy load and would track with how much she drinks."}, {"key": "mgmt", "path": "both", "stem": "She has small intestinal bacterial overgrowth. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "A dietitian, a high-complex-carbohydrate diet, hydration, and antidiarrheals"}, {"letter": "B", "text": "Lactose limited to her threshold with lactase enzyme replacement"}, {"letter": "C", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "D", "text": "Rifaximin, with the underlying driver corrected"}, {"letter": "E", "text": "Tinidazole as a single dose"}], "answer": "D", "explanation": "An antibiotic clears the bacteria, but they return unless the reason they accumulated is addressed — the slowed transit and the altered anatomy. Metronidazole and amoxicillin-clavulanate are the alternatives to rifaximin."}, {"key": "counsel", "path": "both", "stem": "She has small intestinal bacterial overgrowth. Which of the following is the most appropriate approach to checking a vitamin B12 level?", "options": [{"letter": "A", "text": "Check it in every patient with bacterial overgrowth"}, {"letter": "B", "text": "Check it only once the hydrogen breath test is positive"}, {"letter": "C", "text": "Check it only in patients who have had bowel surgery"}, {"letter": "D", "text": "Check it only in patients with a raised mean corpuscular volume"}, {"letter": "E", "text": "Check it only in patients taking a narcotic"}], "answer": "A", "explanation": "Bacteria strip bile salts and consume nutrients before the mucosa can absorb them, so fat and B12 are lost in every patient with the condition, whatever led to it. Waiting for a macrocytosis means waiting for the deficiency to declare itself in the blood count."}]}, {"case": "CO-A3", "group": "CO-A", "section": "the distended, obstipated abdomen", "objective": "", "vignette_workup": "A 74-year-old woman comes to the emergency department with five days of gradually worsening lower abdominal pain and progressive distention, and has passed nothing for four days. Vomiting started only today. For two months her stools have been narrower and she has had intermittent rectal bleeding, and she has lost 12 lb. She has not had a colonoscopy in 15 years and has never had abdominal surgery. Her temperature is 37.1°C (98.8°F), blood pressure is 138/80 mm Hg, pulse is 98/min, respirations are 18/min, and oxygen saturation is 97% on room air. Her abdomen is markedly distended and tympanitic with hypoactive bowel sounds and a firm mass palpable in the left lower quadrant. The rectal vault is empty with dark blood on the glove, and there is no rebound or rigidity.", "labs_workup": [["Upright abdominal radiograph", "Colonic dilation to 8 cm with the cecum at 9.5 cm, little rectal gas and few air-fluid levels; small bowel collapsed"], ["CT abdomen and pelvis", "Transition point at an annular sigmoid stricture"], ["WBC", "10,600/mm³"], ["Hemoglobin / hematocrit", "9.8 g/dL / 29%"], ["MCV", "74 fL"], ["Platelets", "385,000/mm³"], ["Sodium / potassium", "137 mEq/L / 3.6 mEq/L"], ["BUN / creatinine", "20 mg/dL / 0.9 mg/dL"], ["Lactate", "1.5 mmol/L"]], "vignette_recog": "A 74-year-old woman comes to the emergency department with five days of gradually worsening lower abdominal pain and progressive distention, and has passed nothing for four days. Vomiting started only today. For two months her stools have been narrower and she has had intermittent rectal bleeding, and she has lost 12 lb. She has not had a colonoscopy in 15 years and has never had abdominal surgery. Her temperature is 37.1°C (98.8°F), blood pressure is 138/80 mm Hg, pulse is 98/min, respirations are 18/min, and oxygen saturation is 97% on room air. Her abdomen is markedly distended and tympanitic with hypoactive bowel sounds and a firm mass palpable in the left lower quadrant. The rectal vault is empty with dark blood on the glove, and there is no rebound or rigidity.", "labs_recog": [["Upright abdominal radiograph", "Colonic dilation to 8 cm with the cecum at 9.5 cm, little rectal gas and few air-fluid levels; small bowel collapsed"], ["CT abdomen and pelvis", "Transition point at an annular sigmoid stricture"], ["WBC", "10,600/mm³"], ["Hemoglobin / hematocrit", "9.8 g/dL / 29%"], ["MCV", "74 fL"], ["Lactate", "1.5 mmol/L"], ["Endoscopy", "Obstructing circumferential sigmoid mass, biopsied"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Digital rectal examination"}, {"letter": "B", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "C", "text": "A complete metabolic panel with potassium and magnesium"}, {"letter": "D", "text": "Colonoscopy"}, {"letter": "E", "text": "Upright and supine abdominal radiographs"}], "answer": "D", "explanation": "Imaging has already found the transition point; what it cannot do is say what the stricture is made of. Endoscopy characterizes the obstructing lesion and takes the tissue, and repeating the studies that have already answered their question adds nothing."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A whirl pattern with bird-beak tapering"}, {"letter": "B", "text": "A potassium of 2.9 mEq/L with a magnesium of 1.3 mg/dL"}, {"letter": "C", "text": "An obstructing circumferential sigmoid mass"}, {"letter": "D", "text": "Proximal dilation with distal collapse and a normally enhancing wall"}, {"letter": "E", "text": "A transition point at an adhesive band with no mass"}], "answer": "C", "explanation": "The colon is narrower on the left and the stool already formed, so a circumferential lesion changes stool caliber for months before it closes the lumen. An adhesive band would not be expected in an abdomen that has never been operated on."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Large bowel obstruction"}, {"letter": "B", "text": "Adynamic ileus"}, {"letter": "C", "text": "Sigmoid volvulus"}, {"letter": "D", "text": "High-grade small bowel obstruction"}, {"letter": "E", "text": "Partial adhesive intestinal obstruction"}], "answer": "A", "explanation": "Colonic caliber with a collapsed small bowel, scant rectal gas, and few air-fluid levels locates the block in the colon, and there is a true transition point, which excludes an ileus. Colonic obstruction is most often left-sided and takes four to five days to declare itself, against one to two hours for the small bowel."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Sigmoid volvulus"}, {"letter": "B", "text": "Partial adhesive intestinal obstruction"}, {"letter": "C", "text": "Large bowel obstruction"}, {"letter": "D", "text": "Adynamic ileus"}, {"letter": "E", "text": "High-grade small bowel obstruction"}], "answer": "C", "explanation": "A circumferential mass at the transition point with dilated colon behind it and a collapsed small bowel is a mechanical colonic block. A volvulus twists a single loop into a U with no rectal gas and no discrete mass, and an ileus lets gas through to the rectum."}, {"key": "mgmt", "path": "both", "stem": "She has a large bowel obstruction. Which of the following is the most appropriate initial management?", "options": [{"letter": "A", "text": "Nothing by mouth, nasogastric decompression, intravenous fluids, and serial abdominal examinations"}, {"letter": "B", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "C", "text": "Nothing by mouth, nasogastric decompression, intravenous fluids, and surgical consultation"}, {"letter": "D", "text": "Bowel rest, nasogastric suction, ambulation, and electrolyte correction"}, {"letter": "E", "text": "Nothing by mouth, nasogastric decompression, intravenous fluids, and serial abdominal radiographs"}], "answer": "C", "explanation": "Decompression and resuscitation start immediately, but the difference from a small bowel obstruction is that a surgeon is involved from the outset rather than after a trial of serial films. A cecum at 9.5 cm is past the perforation threshold, and a competent ileocecal valve turns the dilated colon into a closed loop."}, {"key": "escalate", "path": "both", "stem": "Her cecum still measures 9.5 cm and the abdomen has not decompressed on nasogastric suction. Which of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Continued nasogastric decompression with serial abdominal radiographs"}, {"letter": "B", "text": "Manual disimpaction with enemas and laxatives"}, {"letter": "C", "text": "Operative resection or a diverting ostomy with broad-spectrum antibiotics"}, {"letter": "D", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "E", "text": "Bowel rest with ambulation and electrolyte correction"}], "answer": "C", "explanation": "A cecum over 9 cm is the perforation threshold, and a closed loop behind an obstructing lesion is a decompress-now problem rather than one to watch overnight. Detorsion presumes a twist and disimpaction presumes stool at the outlet; neither addresses a fixed annular stricture."}, {"key": "counsel", "path": "both", "stem": "She has a large bowel obstruction. Which of the following is the most appropriate expectation about its cause?", "options": [{"letter": "A", "text": "Fecal impaction is the most common cause, with a stricture second"}, {"letter": "B", "text": "Adhesions are the most common cause, with a malignant tumor second"}, {"letter": "C", "text": "A hernia is the most common cause, with volvulus second"}, {"letter": "D", "text": "A malignant tumor is the most common cause, with volvulus second"}, {"letter": "E", "text": "Volvulus is the most common cause, with a malignant tumor second"}], "answer": "D", "explanation": "The causes run in order: malignant tumours first, volvulus second, then hernias and adhesions, with intussusception, stricture, foreign body, and fecal impaction less common. That ranking is why an obstructed colon in an older patient with months of caliber change is treated as a cancer until the biopsy says otherwise."}]}, {"case": "CO-C1", "group": "CO-C", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "objective": "", "vignette_workup": "A 72-year-old man is on the third hospital day of nonoperative management of a small-bowel obstr
