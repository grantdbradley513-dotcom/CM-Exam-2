<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, image?}] }
const EXAM_DATA = {"title": "GI Exam 1 — Practice Exam 4 of 6", "questions": [{"id": "1", "group": 1, "stem": "A 34-year-old man comes to the emergency department because he suddenly cannot swallow. It began two hours ago partway through a steak dinner, with a feeling of fullness behind the breastbone; he regurgitates undigested food and cannot keep down his own saliva. He has had two prior episodes of food catching that cleared on their own. His temperature is 36.8°C (98.2°F), blood pressure is 132/80 mm Hg, pulse is 98/min, respirations are 18/min, and oxygen saturation is 98% on room air. He is hypersalivating and drooling into a cup, the saliva is blood-stained, and scattered expiratory wheezes are heard. There is no crepitus over the neck or chest and he is afebrile.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "High-resolution esophageal manometry"}, {"letter": "B", "text": "Modified barium swallow with videofluoroscopy"}, {"letter": "C", "text": "Barium esophagram"}, {"letter": "D", "text": "Upper endoscopy"}, {"letter": "E", "text": "Barium swallow with a 13 mm barium tablet"}], "answer": "D", "explanation": "Endoscopy is both the diagnostic and the therapeutic study here, and a patient who cannot handle his own secretions has already met the threshold to intervene. Contrast studies and manometry answer questions about motility and anatomy that can be asked later; imaging is not mandatory and must never delay the scope.", "objective": "", "section": "trouble swallowing: where the bolus fails, and how fast", "pcase": "ES-A3", "pgroup": "ES-A"}, {"id": "1A", "group": 1, "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Cough and a wet voice on a 3 oz water swallow screen"}, {"letter": "B", "text": "A posterior outpouching at Killian's triangle above the upper esophageal sphincter"}, {"letter": "C", "text": "Bird's beak distal narrowing with a dilated esophagus and retained food"}, {"letter": "D", "text": "A circumferential ulcerated mass at 34 cm"}, {"letter": "E", "text": "An obstructing meat bolus with abraded mucosa beneath it"}], "answer": "E", "explanation": "A swallowed bolus that clears the pharynx normally and then stops arrests at the narrowest point of the adult esophagus, the gastroesophageal junction, where a structural lesion is usually waiting. The mucosa beneath it is abraded by the impacted food, which is why the saliva is blood-stained.", "objective": "", "section": "trouble swallowing: where the bolus fails, and how fast", "pcase": "ES-A3", "pgroup": "ES-A"}, {"id": "1B", "group": 1, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Esophageal dysphagia from an obstructing distal mass"}, {"letter": "B", "text": "Achalasia"}, {"letter": "C", "text": "Food bolus impaction"}, {"letter": "D", "text": "Zenker diverticulum"}, {"letter": "E", "text": "Oropharyngeal dysphagia"}], "answer": "C", "explanation": "The swallow initiates normally and the obstruction is sudden and complete, with drooling rather than aspiration at the moment of initiation, which separates this from an oropharyngeal problem. An obstructing mass gives four months of progressive solid-food dysphagia with weight loss, not an abrupt total block after one bite of meat.", "objective": "", "section": "trouble swallowing: where the bolus fails, and how fast", "pcase": "ES-A3", "pgroup": "ES-A"}, {"id": "1C", "group": 1, "stem": "He has a food bolus impaction. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Chest imaging to completion before endoscopy is arranged"}, {"letter": "B", "text": "Endoscopic removal of the bolus now, with biopsy of the lesion beneath it"}, {"letter": "C", "text": "Nifedipine 10 mg sublingually, with endoscopy if he still cannot swallow tomorrow"}, {"letter": "D", "text": "Swallow therapy with a texture-modified diet"}, {"letter": "E", "text": "Glucagon 1 mg intravenously, with a further 12 hours of observation"}], "answer": "B", "explanation": "Inability to handle secretions is an indication to intervene, not to observe, and the same procedure that clears the bolus samples the lesion that caused it. Glucagon and nifedipine give mixed results at best and buy time this patient does not have; imaging is not mandatory and must never delay the scope.", "objective": "", "section": "trouble swallowing: where the bolus fails, and how fast", "pcase": "ES-A3", "pgroup": "ES-A"}, {"id": "2", "group": 2, "stem": "A 57-year-old woman comes to the gastroenterology clinic because swallowing has hurt for six weeks. The pain is a sharp burn behind the breastbone that arrives with each bite and fades between meals, and she has begun avoiding hot coffee and citrus. She has had heartburn and regurgitation for years. She takes no antibiotics, bisphosphonates, potassium chloride, or NSAIDs, has no asthma or food allergies, and has no history of HIV, chemotherapy, or transplantation. Her temperature is 36.9°C (98.4°F), blood pressure is 126/76 mm Hg, pulse is 78/min, respirations are 14/min, and oxygen saturation is 98% on room air. There is no oral thrush and there are no oral ulcers, and she swallows her own secretions without difficulty. There is no crepitus.\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CD4 count with confirmatory HIV testing"}, {"letter": "B", "text": "Histology of an ulcer-edge biopsy"}, {"letter": "C", "text": "A medication review with the timing of each tablet"}, {"letter": "D", "text": "Histology of an ulcer-base biopsy"}, {"letter": "E", "text": "Upper endoscopy with esophageal biopsy"}], "answer": "E", "explanation": "Odynophagia is the cardinal symptom of every cause in this differential, so the study that separates them is the one that looks at the lining and samples it. Targeted ulcer-edge and ulcer-base biopsies presuppose an ulcer, and a CD4 count answers a question her history has already answered.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E1", "pgroup": "ES-E"}, {"id": "2A", "group": 2, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Erosive change confined to the distal esophagus"}, {"letter": "B", "text": "A discrete ulcer with normal surrounding mucosa"}, {"letter": "C", "text": "White mucosal plaques coating the length of the esophagus"}, {"letter": "D", "text": "Multiple shallow, well-circumscribed volcano-like ulcers"}, {"letter": "E", "text": "Large, deep linear and longitudinal ulcers"}], "answer": "A", "explanation": "Refluxed acid injures the segment it bathes, so the damage is distal and erosive rather than focal or ulcerated. Plaques, linear ulcers, and volcano ulcers each belong to an organism, and a solitary discrete ulcer with normal mucosa around it belongs to a tablet.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E1", "pgroup": "ES-E"}, {"id": "2B", "group": 2, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Reflux esophagitis"}, {"letter": "B", "text": "Cytomegalovirus esophagitis"}, {"letter": "C", "text": "Pill-induced esophagitis"}, {"letter": "D", "text": "Candida esophagitis"}, {"letter": "E", "text": "Herpes simplex virus esophagitis"}], "answer": "A", "explanation": "The cause of odynophagia is in the history: immunosuppression points to infection, a tablet taken dry or at bedtime to pill injury, atopy with impaction to eosinophilic disease, and chronic reflux to acid. She is immunocompetent with clear oral mucosa and years of heartburn, and the biopsy shows reflux change with fewer than 5 eosinophils per high-power field.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E1", "pgroup": "ES-E"}, {"id": "2C", "group": 2, "stem": "She has reflux esophagitis. Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "A standard-dose proton pump inhibitor"}, {"letter": "B", "text": "Fluconazole 200 to 400 mg orally daily"}, {"letter": "C", "text": "Acyclovir 400 mg orally five times daily"}, {"letter": "D", "text": "An elimination diet with swallowed topical fluticasone"}, {"letter": "E", "text": "Ganciclovir or valganciclovir"}], "answer": "A", "explanation": "The cause dictates the drug: an antifungal for Candida, acyclovir for herpes simplex, ganciclovir for cytomegalovirus, and acid suppression for reflux and for pill injury. Nothing here is infectious or eosinophilic, so the only agent that treats the injury is a proton pump inhibitor.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E1", "pgroup": "ES-E"}, {"id": "3", "group": 3, "stem": "A 36-year-old man is brought to the emergency department because swallowing has hurt for two weeks and now hurts enough that he has stopped eating and takes only sips of water. He also has trouble getting food down and discomfort behind the breastbone, and he has lost 9 kg over three months. His clinic sent a reactive HIV screen last week and he has never been treated; he has had no chemotherapy, no transplant, and no hematologic malignancy. His temperature is 37.2°C (99.0°F), blood pressure is 108/66 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 98% on room air. White curd-like plaques that scrape off cover the tongue and buccal mucosa, and he has temporal wasting and cachexia. There are no oral ulcers and no crepitus. He is admitted.\n\nStudies:\n    CD4 count — 62 cells/µL\n    HIV antigen/antibody assay — Reactive and confirmed\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A medication review with the timing of each tablet"}, {"letter": "B", "text": "Biopsy of the edge of an esophageal ulcer"}, {"letter": "C", "text": "Upper endoscopy with esophageal biopsy"}, {"letter": "D", "text": "Proximal and distal esophageal biopsies for an eosinophil count"}, {"letter": "E", "text": "Biopsy of the base of an esophageal ulcer"}], "answer": "C", "explanation": "Thrush with odynophagia in an HIV patient is treated empirically and endoscopy is reserved for no response at 3 to 5 days — but a patient who has stopped eating and can take only sips is the exception, and he is scoped now. Targeted ulcer-edge and ulcer-base sampling belongs to the viral causes, and a medication review will not explain a CD4 of 62.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E2", "pgroup": "ES-E"}, {"id": "3A", "group": 3, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Large, deep linear and longitudinal ulcers"}, {"letter": "B", "text": "Multiple shallow, well-circumscribed volcano-like ulcers"}, {"letter": "C", "text": "A discrete ulcer with normal surrounding mucosa"}, {"letter": "D", "text": "White mucosal plaque-type lesions coating the length of the esophagus"}, {"letter": "E", "text": "Erosive change confined to the distal esophagus"}], "answer": "D", "explanation": "The organism that coats the mouth coats the esophagus by the same mechanism, and at a CD4 count this low it does so along the whole length rather than in one segment. The mucosa beneath the plaques is friable because the invasion is superficial and diffuse.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E2", "pgroup": "ES-E"}, {"id": "3B", "group": 3, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cytomegalovirus esophagitis"}, {"letter": "B", "text": "Herpes simplex virus esophagitis"}, {"letter": "C", "text": "Pill-induced esophagitis"}, {"letter": "D", "text": "Candida esophagitis"}, {"letter": "E", "text": "Reflux esophagitis"}], "answer": "D", "explanation": "Oral thrush on examination points to Candida and oral ulcers to herpes simplex; he has the first and not the second. Candida albicans is the most common cause, is seen with advanced immunosuppression below a CD4 of 200 cells/µL, and is an AIDS-defining illness.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E2", "pgroup": "ES-E"}, {"id": "3C", "group": 3, "stem": "He has Candida esophagitis. Which of the following is the most appropriate treatment?", "options": [{"letter": "A", "text": "Acyclovir 400 mg orally five times daily"}, {"letter": "B", "text": "Nystatin swish-and-swallow"}, {"letter": "C", "text": "Clotrimazole troches"}, {"letter": "D", "text": "Ganciclovir or valganciclovir"}, {"letter": "E", "text": "Fluconazole 200 to 400 mg orally daily"}], "answer": "E", "explanation": "Esophageal candidiasis always requires systemic therapy. Nystatin swish-and-swallow and clotrimazole troches act on the mouth, clear the thrush, and leave the esophagus untreated — which is exactly the trap when the visible disease is oral.", "objective": "", "section": "odynophagia: pain WITH the swallow, sorted by what is injuring the lining", "pcase": "ES-E2", "pgroup": "ES-E"}, {"id": "4", "group": 4, "stem": "A 34-year-old man is referred to the gastroenterology clinic because his alkaline phosphatase has climbed on the last three routine panels. He was diagnosed with ulcerative colitis with pancolitis at 26 and takes mesalamine. He is tired, has been itching for several months, has lost 4 kg over the past six months, and has occasional dull right upper quadrant discomfort. His temperature is 36.8°C (98.2°F), blood pressure is 122/74 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. He has mild scleral icterus, a liver edge palpable 3 cm below the costal margin with a palpable spleen tip, and excoriations over both forearms.\n\nStudies:\n    Alkaline phosphatase — 612 U/L\n    GGT — 388 U/L\n    Total bilirubin — 1.9 mg/dL\n    AST / ALT — 96 U/L / 112 U/L\n    p-ANCA — Positive\n    Antimitochondrial antibody — Negative\n    Albumin / INR — 4.0 g/dL / 1.0\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Blood cultures"}, {"letter": "B", "text": "ERCP"}, {"letter": "C", "text": "Right upper quadrant ultrasound"}, {"letter": "D", "text": "MRCP cholangiogram"}, {"letter": "E", "text": "Liver biopsy"}], "answer": "D", "explanation": "The antibody does not make this diagnosis — p-ANCA positivity is research-based and no one relies on it — so the cholangiogram does, and the cholangiogram is the MRCP. ERCP is reserved for intervention, and biopsy is held back for the case in which cholangiography is non-diagnostic.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D1", "pgroup": "BI-D"}, {"id": "4A", "group": 4, "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "Strictures with duct wall thickening and a raised IgG4"}, {"letter": "B", "text": "A granuloma surrounding a bile duct"}, {"letter": "C", "text": "A filling defect within the common bile duct"}, {"letter": "D", "text": "Beaded intra- and extrahepatic ducts"}, {"letter": "E", "text": "Escherichia coli growing from blood"}], "answer": "D", "explanation": "Inflammation, fibrosis, and stricturing of the medium and large ducts produce alternating narrowed and dilated segments along the whole tree, intra- and extrahepatic, which is the beaded appearance. A single filling defect is a stone, and duct wall thickening with a raised IgG4 belongs to IgG4 cholangiopathy.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D1", "pgroup": "BI-D"}, {"id": "4B", "group": 4, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cholangitis"}, {"letter": "B", "text": "Primary biliary cholangitis"}, {"letter": "C", "text": "Choledocholithiasis"}, {"letter": "D", "text": "IgG4-related sclerosing cholangitis"}, {"letter": "E", "text": "Primary sclerosing cholangitis"}], "answer": "E", "explanation": "Up to 90% of these patients have ulcerative colitis, and pancolitis carries the highest association. Antimitochondrial antibody positivity would point away from this and toward primary biliary cholangitis, which involves small intrahepatic ducts only and does not bead the extrahepatic tree.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D1", "pgroup": "BI-D"}, {"id": "4C", "group": 4, "stem": "He has primary sclerosing cholangitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Elafibranor or seladelpar as second-line therapy"}, {"letter": "B", "text": "Corticosteroids for a steroid-responsive stricture"}, {"letter": "C", "text": "ERCP with sphincterotomy and stone extraction"}, {"letter": "D", "text": "Surveillance with ursodeoxycholic acid 15 mg/kg daily"}, {"letter": "E", "text": "Intravenous antibiotics followed by urgent ERCP"}], "answer": "D", "explanation": "No treatment is proven to slow progression, so the management is surveillance, with ursodeoxycholic acid added to reduce the cholesterol content of bile. Second-line agents belong to the small-duct autoimmune disease when its alkaline phosphatase fails to normalize, steroids treat the IgG4 mimic, and duct instrumentation treats an obstructing stone.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D1", "pgroup": "BI-D"}, {"id": "5", "group": 5, "stem": "A 53-year-old woman comes to the primary care clinic because she has itched relentlessly for eight months. It is worse at night and has not responded to emollients or topical antihistamines, and she is tired. Her eyes have not turned yellow. She has Hashimoto thyroiditis and takes levothyroxine, has osteopenia on a recent DEXA scan, and has hypercholesterolemia. Her temperature is 36.7°C (98.1°F), blood pressure is 124/78 mm Hg, pulse is 70/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has excoriations over the arms and upper back and xanthelasma on both upper eyelids. There is no scleral icterus, the liver edge is non-tender, and there is no ascites.\n\nStudies:\n    Alkaline phosphatase — 540 U/L\n    GGT — 310 U/L\n    Total bilirubin — 0.9 mg/dL\n    AST / ALT — 52 U/L / 58 U/L\n    Total cholesterol — 288 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Alkaline phosphatase with a serum IgG4 level"}, {"letter": "B", "text": "MRCP cholangiogram of the biliary tree"}, {"letter": "C", "text": "Alkaline phosphatase with an antimitochondrial antibody"}, {"letter": "D", "text": "Right upper quadrant ultrasound"}, {"letter": "E", "text": "Alkaline phosphatase with a p-ANCA"}], "answer": "C", "explanation": "A cholestatic pattern in a middle-aged woman whose leading complaint is intractable itching is worked up by antibody first, and the antimitochondrial antibody is the marker that carries the diagnosis. Ultrasound and cholangiography look for obstruction, which the painless course and normal bilirubin argue against.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D2", "pgroup": "BI-D"}, {"id": "5A", "group": 5, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "A common bile duct dilated to 12 mm with a white count of 21,400/mm³"}, {"letter": "B", "text": "A positive p-ANCA with a negative antimitochondrial antibody"}, {"letter": "C", "text": "A common bile duct dilated to 9 mm with a bilirubin of 5.2 mg/dL"}, {"letter": "D", "text": "A high serum IgG4"}, {"letter": "E", "text": "An antimitochondrial antibody at 1:320 with a raised IgM"}], "answer": "E", "explanation": "The antimitochondrial antibody is present in more than 95% of these patients and is the key diagnostic marker, and it travels with an elevated IgM. The reciprocal pattern — p-ANCA positive with a negative antimitochondrial antibody — points instead to large-duct disease in a patient with inflammatory bowel disease.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D2", "pgroup": "BI-D"}, {"id": "5B", "group": 5, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Choledocholithiasis"}, {"letter": "B", "text": "Primary biliary cholangitis"}, {"letter": "C", "text": "IgG4-related sclerosing cholangitis"}, {"letter": "D", "text": "Cholangitis"}, {"letter": "E", "text": "Primary sclerosing cholangitis"}], "answer": "B", "explanation": "Small intrahepatic ducts are the target, so the alkaline phosphatase rises long before the bilirubin, which is still normal here. The female-to-male ratio is about 9:1, and the thyroid disease, osteopenia, and hypercholesterolemia are the associations that cluster with it.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D2", "pgroup": "BI-D"}, {"id": "5C", "group": 5, "stem": "She has primary biliary cholangitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Observation without drug therapy"}, {"letter": "B", "text": "Corticosteroids for a steroid-responsive stricture"}, {"letter": "C", "text": "Intravenous antibiotics followed by urgent ERCP"}, {"letter": "D", "text": "Ursodeoxycholic acid, dosed by weight"}, {"letter": "E", "text": "ERCP with sphincterotomy and stone extraction"}], "answer": "D", "explanation": "A weight-based dose of ursodeoxycholic acid is the first-line treatment, and it is the drug the later alkaline phosphatase target is used to judge. Steroids belong to the IgG4 mimic, duct instrumentation to an obstructing stone with fever or jaundice, and observation alone to large-duct disease in which no agent has been shown to alter the course.", "objective": "", "section": "chronic cholestasis with fatigue and pruritus", "pcase": "BI-D2", "pgroup": "BI-D"}, {"id": "6", "group": 6, "stem": "A 43-year-old woman comes to the gastroenterology clinic with two years of epigastric burning and heartburn that have persisted despite continuous acid suppression. She passes four to six loose stools a day and has lost 9 kg. She has had three endoscopies over those two years, each showing ulcers that came back after treatment. She has never used NSAIDs or aspirin, and she has been tested for Helicobacter pylori twice, both times negative. Her father had a parathyroid tumor and kidney stones. Her temperature is 36.8°C (98.2°F), blood pressure is 118/72 mm Hg, pulse is 86/min, respirations are 14/min, and oxygen saturation is 99% on room air. She has epigastric tenderness with slightly dry mucous membranes, no palpable mass, no jaundice, and no lymphadenopathy.\n\nStudies:\n    Upper endoscopy — Multiple ulcers in the second and third portions of the duodenum\n    Fasting serum gastrin (off the PPI) — 1,480 pg/mL\n    Gastric pH — 1.6\n    Serum calcium — 11.2 mg/dL\n    Hemoglobin / hematocrit — 12.6 g/dL / 38%\n    MCV — 87 fL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A complete blood count with a basic metabolic panel"}, {"letter": "B", "text": "Helicobacter pylori stool antigen testing"}, {"letter": "C", "text": "Secretin stimulation test"}, {"letter": "D", "text": "An upright chest radiograph"}, {"letter": "E", "text": "Upper endoscopy with biopsy"}], "answer": "C", "explanation": "An ulcer burden with no NSAID exposure and negative Helicobacter testing is the trigger to look for a hypergastrinemic cause rather than to re-treat empirically, and the pairing of a gastrin above 1,000 pg/mL with a gastric pH below 2 has already been shown. The stimulation test is what tells you the source of that gastrin.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B2", "pgroup": "GA-B"}, {"id": "6A", "group": 6, "stem": "Which of the following results is most likely to be present?", "options": [{"letter": "A", "text": "A gastrin rise of 430 pg/mL after intravenous secretin"}, {"letter": "B", "text": "An antral ulcer with a smooth base and radiating folds"}, {"letter": "C", "text": "A scarred, narrowed pylorus with benign biopsies"}, {"letter": "D", "text": "A duodenal bulb ulcer with a non-bleeding visible vessel"}, {"letter": "E", "text": "Inflamed, eroded gastric mucosa without an ulcer"}], "answer": "A", "explanation": "Secretin normally inhibits the gastric G cells, so gastrin should fall. Tumour cells respond in the opposite direction and release gastrin instead, so a rise of more than 200 pg/mL is paradoxical and diagnostic.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B2", "pgroup": "GA-B"}, {"id": "6B", "group": 6, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Uncomplicated peptic ulcer disease"}, {"letter": "B", "text": "Gastric outlet obstruction"}, {"letter": "C", "text": "Bleeding peptic ulcer"}, {"letter": "D", "text": "Gastritis"}, {"letter": "E", "text": "Zollinger-Ellison syndrome"}], "answer": "E", "explanation": "Recurrent or refractory ulcers occur in 73 to 98% of these patients, and the ulcers sit distally in the second and third portions of the duodenum rather than in the bulb. The diarrhoea comes from the same acid load, and the raised calcium with a father who had a parathyroid tumour points to multiple endocrine neoplasia type I.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B2", "pgroup": "GA-B"}, {"id": "6C", "group": 6, "stem": "She has Zollinger-Ellison syndrome. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Intravenous proton pump inhibitor bolus and drip with endoscopic clipping"}, {"letter": "B", "text": "A proton pump inhibitor for 8 weeks with withdrawal of the offending agent"}, {"letter": "C", "text": "Vasoactive drip with endoscopic band ligation"}, {"letter": "D", "text": "High-dose proton pump inhibitor with surgical resection of the tumour"}, {"letter": "E", "text": "Endoscopic balloon dilation with a proton pump inhibitor"}], "answer": "D", "explanation": "Acid suppression at high dose controls the symptom while resection removes the source, and only resection is definitive. A fixed 8-week course with agent withdrawal treats ordinary ulcer disease, which is precisely the empirical re-treatment that has already failed her three times.", "objective": "", "section": "ulcer disease that has escaped control", "pcase": "GA-B2", "pgroup": "GA-B"}, {"id": "7", "group": 7, "stem": "A 4-year-old boy is brought to the emergency department by his mother with three days of diarrhea. It began watery and is now bloody and mucoid, and he strains constantly with an unrelenting urge to pass stool. He has fever and cramping. He attends daycare, where two other children in his room have diarrhea. He has not travelled and has taken no antibiotics. His temperature is 39.0°C (102.2°F), blood pressure is 96/60 mm Hg, pulse is 138/min, respirations are 26/min, and oxygen saturation is 99% on room air. He is febrile and irritable, with slightly dry mucous membranes and a capillary refill of 2 seconds, diffuse abdominal tenderness, and gross blood and mucus in the diaper.\n\nStudies:\n    WBC — 16,800/mm³ with bandemia\n    Hemoglobin / hematocrit — 12.1 g/dL / 36%\n    Platelets — 310,000/mm³\n    Sodium / potassium — 134 mEq/L / 3.3 mEq/L\n    Bicarbonate — 19 mEq/L\n    BUN / creatinine — 20 mg/dL / 0.4 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A specially ordered stool culture for Escherichia coli O157:H7"}, {"letter": "B", "text": "A stool antigen assay for Entamoeba histolytica"}, {"letter": "C", "text": "Stool multiplex PCR"}, {"letter": "D", "text": "Stool culture"}, {"letter": "E", "text": "A serum antigen assay for Entamoeba histolytica"}], "answer": "C", "explanation": "A multiplex panel names the organism in hours and covers every pathogen in this differential at once, which is what an inflammatory diarrhoea with fever and blood requires. Culture takes days and is the confirmatory step, and the antigen assays answer a question that only arises with travel to an endemic region.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C2", "pgroup": "DI-C"}, {"id": "7A", "group": 7, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Polymerase chain reaction positive for Shiga toxin-producing Escherichia coli"}, {"letter": "B", "text": "Polymerase chain reaction positive for Yersinia"}, {"letter": "C", "text": "Polymerase chain reaction positive for Salmonella"}, {"letter": "D", "text": "Polymerase chain reaction positive for Campylobacter"}, {"letter": "E", "text": "Polymerase chain reaction positive for Shigella"}], "answer": "E", "explanation": "The organism is very virulent — as few as 10 bacteria cause infection — which is why it moves through a daycare room and why two other children are ill. It invades the colon, so the diarrhoea starts watery and turns bloody and mucoid, with the straining that comes from an inflamed rectum.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C2", "pgroup": "DI-C"}, {"id": "7B", "group": 7, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}, {"letter": "B", "text": "Yersinia enterocolitica enteritis"}, {"letter": "C", "text": "Shigellosis"}, {"letter": "D", "text": "Campylobacter jejuni enteritis"}, {"letter": "E", "text": "Salmonella gastroenteritis"}], "answer": "C", "explanation": "Tenesmus with fecal-oral spread through a daycare room is the pattern, and the watery-then-bloody sequence over one to seven days fits the incubation. Enterohemorrhagic Escherichia coli bleeds with minimal or no fever, and the other two localize their pain rather than spreading it.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C2", "pgroup": "DI-C"}, {"id": "7C", "group": 7, "stem": "He has shigellosis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with fluid replacement plus ciprofloxacin or azithromycin"}, {"letter": "B", "text": "Supportive care with fluid and electrolyte replacement, withholding antibiotics unless a risk category is met"}, {"letter": "C", "text": "Supportive care and hydration alone"}, {"letter": "D", "text": "Metronidazole or tinidazole followed by paromomycin"}, {"letter": "E", "text": "Supportive care with monitoring for hemolytic uremic syndrome, with antibiotics never given"}], "answer": "A", "explanation": "This is one of the infections that is always treated when the patient is symptomatic: antibiotics shorten fever and diarrhoea by about two days and cut shedding to the other children. Withholding them as one would for Salmonella is the error the case is built around, and trimethoprim-sulfamethoxazole is avoided wherever possible because resistance is high.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C2", "pgroup": "DI-C"}, {"id": "8", "group": 8, "stem": "A 22-year-old man comes to the emergency department with three days of severe cramping pain around the umbilicus and twelve bowel movements a day, bloody and mucoid since yesterday. He has fever with rigors. Four days ago he ate grilled chicken at a barbecue that was still pink at the bone, and a new puppy at home has had diarrhea. He has not travelled and has taken no antibiotics. His temperature is 38.9°C (102.0°F), blood pressure is 118/72 mm Hg, pulse is 108/min, respirations are 18/min, and oxygen saturation is 99% on room air. He is febrile with marked periumbilical and lower abdominal tenderness and voluntary guarding, no rebound and no rigidity, present bowel sounds, and no right lower quadrant point tenderness.\n\nStudies:\n    WBC — 13,900/mm³ with a left shift\n    Hemoglobin / hematocrit — 15.1 g/dL / 45%\n    Platelets — 232,000/mm³\n    Potassium — 3.4 mEq/L\n    Bicarbonate — 21 mEq/L\n    Creatinine — 1.1 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A specially ordered stool culture for Escherichia coli O157:H7"}, {"letter": "B", "text": "Stool multiplex PCR"}, {"letter": "C", "text": "A stool antigen assay for Entamoeba histolytica"}, {"letter": "D", "text": "Stool culture"}, {"letter": "E", "text": "A serum antigen assay for Entamoeba histolytica"}], "answer": "B", "explanation": "The panel covers every organism in this differential in one specimen and returns fast enough to change management, which matters when the pain is severe enough to raise a surgical question. Culture is the confirmatory step and the antigen assays belong to travel-associated disease.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C3", "pgroup": "DI-C"}, {"id": "8A", "group": 8, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Polymerase chain reaction positive for Yersinia"}, {"letter": "B", "text": "Polymerase chain reaction positive for Campylobacter"}, {"letter": "C", "text": "Polymerase chain reaction positive for Shiga toxin-producing Escherichia coli"}, {"letter": "D", "text": "Polymerase chain reaction positive for Salmonella"}, {"letter": "E", "text": "Polymerase chain reaction positive for Shigella"}], "answer": "B", "explanation": "The organism lives in the intestinal tracts of animal hosts, poultry above all, and undercooked chicken four days before onset sits squarely inside the one to seven day incubation. Its abdominal pain is more severe than that of any other bacterial diarrhoea and can mimic appendicitis or colitis.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C3", "pgroup": "DI-C"}, {"id": "8B", "group": 8, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Shigellosis"}, {"letter": "C", "text": "Salmonella gastroenteritis"}, {"letter": "D", "text": "Campylobacter jejuni enteritis"}, {"letter": "E", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}], "answer": "D", "explanation": "Ten or more bowel movements a day with pain out of proportion to the rest of the differential, and stools turning bloody by day two or three, is the signature. There is no tenesmus, the pain is periumbilical rather than localized to the right lower quadrant, and the exposure is poultry rather than raw pork.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C3", "pgroup": "DI-C"}, {"id": "8C", "group": 8, "stem": "He has Campylobacter jejuni enteritis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Metronidazole or tinidazole followed by paromomycin"}, {"letter": "B", "text": "Supportive care, with azithromycin 500 mg daily for 3 days if the illness is severe"}, {"letter": "C", "text": "Supportive care with monitoring for hemolytic uremic syndrome, with antibiotics never given"}, {"letter": "D", "text": "Supportive care, with ciprofloxacin 750 mg twice daily for 3 days if the illness is severe"}, {"letter": "E", "text": "Supportive care with fluid replacement plus ciprofloxacin or azithromycin for every symptomatic patient"}], "answer": "B", "explanation": "Most cases need no antibiotic at all, and treatment is reserved for the toxic or immunocompromised patient; when it is given, azithromycin is the agent of choice and a fluoroquinolone is only the alternative. Treating every symptomatic patient is the rule for a different organism in this differential.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C3", "pgroup": "DI-C"}, {"id": "9", "group": 9, "stem": "A 16-year-old boy comes to the emergency department with five days of right-sided abdominal pain, bloody diarrhea, and fever. Six days ago he ate homemade sausage made from raw pork at a family event, and he drinks unpasteurized milk from a local farm. He has not travelled and has taken no antibiotics. His temperature is 38.4°C (101.1°F), blood pressure is 118/70 mm Hg, pulse is 104/min, respirations are 18/min, and oxygen saturation is 99% on room air. He is febrile with right lower quadrant tenderness, no rebound and no rigidity, a negative psoas sign, present bowel sounds, and no rash.\n\nStudies:\n    WBC — 14,100/mm³ with a left shift\n    Hemoglobin / hematocrit — 13.8 g/dL / 41%\n    Platelets — 289,000/mm³\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A serum antigen assay for Entamoeba histolytica"}, {"letter": "B", "text": "Stool culture"}, {"letter": "C", "text": "A specially ordered stool culture for Escherichia coli O157:H7"}, {"letter": "D", "text": "Stool multiplex PCR"}, {"letter": "E", "text": "A stool antigen assay for Entamoeba histolytica"}], "answer": "D", "explanation": "Naming the organism quickly is what keeps a febrile adolescent with right lower quadrant tenderness out of the operating room, and the panel does it in one specimen. Culture confirms afterwards, and the antigen assays are for travel-associated disease with hepatic involvement.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C4", "pgroup": "DI-C"}, {"id": "9A", "group": 9, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Polymerase chain reaction positive for Shigella"}, {"letter": "B", "text": "Polymerase chain reaction positive for Yersinia"}, {"letter": "C", "text": "Polymerase chain reaction positive for Shiga toxin-producing Escherichia coli"}, {"letter": "D", "text": "Polymerase chain reaction positive for Campylobacter"}, {"letter": "E", "text": "Polymerase chain reaction positive for Salmonella"}], "answer": "B", "explanation": "Raw pork and unprocessed dairy are the classic sources, and symptoms appear four to seven days after the exposure, which places the sausage exactly. The organism settles in the terminal ileum and the nodes that drain it, which is why the tenderness is on the right.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C4", "pgroup": "DI-C"}, {"id": "9B", "group": 9, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Yersinia enterocolitica enteritis"}, {"letter": "B", "text": "Shigellosis"}, {"letter": "C", "text": "Enterohemorrhagic Escherichia coli O157:H7 infection"}, {"letter": "D", "text": "Salmonella gastroenteritis"}, {"letter": "E", "text": "Campylobacter jejuni enteritis"}], "answer": "A", "explanation": "Pain that localizes to the right lower quadrant rather than sitting periumbilical or diffuse, after raw pork and unpasteurized milk, is the discriminator. There is no tenesmus and no poultry exposure, and enterohemorrhagic Escherichia coli bleeds with minimal or no fever.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C4", "pgroup": "DI-C"}, {"id": "9C", "group": 9, "stem": "He has Yersinia enterocolitica enteritis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Supportive care with fluid replacement plus ciprofloxacin or azithromycin"}, {"letter": "B", "text": "Urgent appendectomy"}, {"letter": "C", "text": "Supportive care with monitoring for hemolytic uremic syndrome, with antibiotics never given"}, {"letter": "D", "text": "Supportive care with ciprofloxacin 500 mg twice daily for 5 days"}, {"letter": "E", "text": "Supportive care and hydration alone"}], "answer": "E", "explanation": "The illness is usually self-limited and antibiotics are typically not needed, being reserved for the toxic or immunocompromised patient. The right lower quadrant pain is mesenteric adenitis, and taking him to the operating room on the pain alone is the trap — the psoas sign is negative and there is no rebound or rigidity.", "objective": "", "section": "fever with bloody or mucoid stool after a food or fecal-oral exposure (invasive bacterial dysentery)", "pcase": "DI-C4", "pgroup": "DI-C"}, {"id": "10", "group": 10, "stem": "A 21-year-old woman comes to the primary care clinic with recurrent lower abdominal pain at least one day a week for eight months, relieved by moving her bowels. Her bowel habit alternates between loose stools and constipation, and she is bloated and passes a great deal of gas. Neither the pain nor the stools ever wake her from sleep. She has lost no weight, has seen no blood, and has had no fever. There is no family history of gastrointestinal malignancy, inflammatory bowel disease, or celiac disease. She is a college student and takes no medications. Her temperature is 36.7°C (98.1°F), blood pressure is 108/68 mm Hg, pulse is 72/min, respirations are 14/min, and oxygen saturation is 99% on room air. The abdomen is soft and non-tender with no distention and no masses, and there is no perianal disease, rash, or pallor.\n\nStudies:\n    Hemoglobin / hematocrit — 13.4 g/dL / 40%\n    MCV — 88 fL\n    Ferritin — 46 ng/mL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Fecal calprotectin with CRP and celiac serology"}, {"letter": "B", "text": "Celiac serology with a total IgA"}, {"letter": "C", "text": "An empiric lactose-free diet for 2 weeks"}, {"letter": "D", "text": "A hydrogen breath test"}, {"letter": "E", "text": "Colonoscopy with random biopsies of normal-appearing mucosa"}], "answer": "A", "explanation": "Chronic diarrhoea in an adult is separated first by whether the bowel is inflamed, and fecal calprotectin is the discriminator — 92% sensitive and 82% specific for inflammatory bowel disease in this setting. Serology alone answers only one of the alternatives, and endoscopy is not the opening move in a patient with no alarm feature.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H3", "pgroup": "DI-H"}, {"id": "10A", "group": 10, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "An endoscopically normal colon with months of nocturnal watery stools"}, {"letter": "B", "text": "A fecal calprotectin of 22 µg/g with a normal CRP and no anemia"}, {"letter": "C", "text": "A fecal calprotectin of 480 µg/g with anemia and a CRP of 38 mg/L"}, {"letter": "D", "text": "An IgA anti-tissue transglutaminase of 118 U/mL with iron deficiency anemia"}, {"letter": "E", "text": "Osmotic diarrhea within 2 hours of dairy, clearing on a lactose-free trial"}], "answer": "B", "explanation": "Calprotectin is released by neutrophils in the bowel wall, so a value in the twenties means the mucosa is not inflamed. With a normal CRP and no anemia beside it, the panel argues strongly against an inflammatory cause rather than merely failing to find one.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H3", "pgroup": "DI-H"}, {"id": "10B", "group": 10, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Microscopic colitis"}, {"letter": "B", "text": "Lactose intolerance"}, {"letter": "C", "text": "Irritable bowel syndrome"}, {"letter": "D", "text": "Small intestinal bacterial overgrowth"}, {"letter": "E", "text": "Celiac disease"}], "answer": "C", "explanation": "The Rome IV criteria are met — recurrent pain at least one day a week for more than three months, related to defecation and to a change in stool frequency and form — and they carry over 95% predictive value. Not one alarm feature is present: no nocturnal diarrhoea, no blood, no weight loss, no anemia, and a normal calprotectin.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H3", "pgroup": "DI-H"}, {"id": "10C", "group": 10, "stem": "She has irritable bowel syndrome. Which of the following is the most appropriate initial management?", "options": [{"letter": "A", "text": "Rifaximin, metronidazole, or amoxicillin-clavulanate"}, {"letter": "B", "text": "A low FODMAP diet with fatty food, alcohol, and caffeine avoided"}, {"letter": "C", "text": "Lactose limited to threshold with lactase enzyme replacement"}, {"letter": "D", "text": "A lifelong gluten-free diet with micronutrient repletion"}, {"letter": "E", "text": "NSAIDs and PPIs stopped, with loperamide or bismuth subsalicylate"}], "answer": "B", "explanation": "Diet is the first intervention: a low FODMAP approach with fatty and spicy food, alcohol, and caffeine avoided, and fibre increased if constipation predominates. The other options each treat a diagnosis her panel has excluded.", "objective": "", "section": "loose stools for more than a month in an adult", "pcase": "DI-H3", "pgroup": "DI-H"}, {"id": "11", "group": 11, "stem": "A 49-year-old woman comes to the gastroenterology clinic with eight months of bloating that worsens through the day, excessive flatulence, crampy abdominal pain, and loose stools. She had a Roux-en-Y gastric bypass six years ago and takes oxycodone most days for chronic back pain, which has slowed her transit. She has taken no recent antibiotics and has not travelled. Her temperature is 36.9°C (98.4°F), blood pressure is 118/74 mm Hg, pulse is 80/min, respirations are 14/min, and oxygen saturation is 98% on room air. Her abdomen is distended and tympanitic with no tenderness and no masses, she has lost 4 kg over eight months, and she has no edema and no pallor.\n\nStudies:\n    Vitamin B12 — 174 pg/mL\n    Folate — Normal\n    Hemoglobin / hematocrit — 12.4 g/dL / 37%\n    MCV — 99 fL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "A stool Giardia antigen test"}, {"letter": "B", "text": "IgA anti-tissue transglutaminase with a total IgA"}, {"letter": "C", "text": "An empiric lactose-free diet for 2 weeks"}, {"letter": "D", "text": "Fecal calprotectin with CRP and celiac serology"}, {"letter": "E", "text": "Hydrogen breath test"}], "answer": "E", "explanation": "This is the most common way the diagnosis is made, and it is the study that fits the mechanism: bacteria in the wrong part of the gut ferment intestinal contents and the hydrogen they produce is exhaled. A dairy trial or celiac serology would be chasing a food, and her symptoms are not tied to a dose of one.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I2", "pgroup": "DI-I"}, {"id": "11A", "group": 11, "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "Symptoms that clear on a 2-week trial and return on rechallenge"}, {"letter": "B", "text": "An IgA anti-tissue transglutaminase of 118 U/mL with iron deficiency"}, {"letter": "C", "text": "A breath hydrogen rise of 26 ppm over baseline within 90 minutes"}, {"letter": "D", "text": "Greasy, foul-smelling, non-bloody stool with a normal white count"}, {"letter": "E", "text": "An albumin of 2.8 g/dL after extensive small-bowel resection"}], "answer": "C", "explanation": "A mixed aerobic and anaerobic gram-negative flora fermenting in the small intestine produces gas that is absorbed and exhaled, so breath hydrogen climbs early after the substrate load. The low B12 with a raised MCV is the other half of the same mechanism — the bacteria consume the vitamin before she can absorb it.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I2", "pgroup": "DI-I"}, {"id": "11B", "group": 11, "stem": "Which of the following studies would most directly confirm the diagnosis?", "options": [{"letter": "A", "text": "Hydrogen breath test after a 50 g lactose load"}, {"letter": "B", "text": "A review of the small-bowel resection history"}, {"letter": "C", "text": "EGD with duodenal biopsy"}, {"letter": "D", "text": "Stool microscopic examination for cysts and trophozoites"}, {"letter": "E", "text": "Small bowel aspirate with culture"}], "answer": "E", "explanation": "Sampling the lumen directly and growing what is in it demonstrates the overgrowth rather than inferring it from exhaled gas. A lactose-loaded breath test asks about a disaccharide rather than about bacterial density, and duodenal histology answers a question about gluten.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I2", "pgroup": "DI-I"}, {"id": "11C", "group": 11, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Short bowel syndrome after intestinal resection"}, {"letter": "B", "text": "Giardiasis"}, {"letter": "C", "text": "Small intestinal bacterial overgrowth"}, {"letter": "D", "text": "Irritable bowel syndrome"}, {"letter": "E", "text": "Intolerance of dietary lactose"}], "answer": "C", "explanation": "The condition arises where transit has slowed or a blind pocket has been created, which is why bariatric surgery, motility disorders, and narcotics are the risk factors — and she has two of the three. Her bloating is not tied to a dairy dose, and she has had no resection and no protein-energy failure.", "objective": "", "section": "bloating, flatulence, and loose stools from food that is not being digested or absorbed", "pcase": "DI-I2", "pgroup": "DI-I"}, {"id": "12", "group": 12, "stem": "A 74-year-old woman comes to the emergency department with five days of gradually worsening lower abdominal pain and progressive distention, and has passed nothing for four days. Vomiting started only today. For two months her stools have been narrower and she has had intermittent rectal bleeding, and she has lost 12 lb. She has not had a colonoscopy in 15 years and has never had abdominal surgery. Her temperature is 37.1°C (98.8°F), blood pressure is 138/80 mm Hg, pulse is 98/min, respirations are 18/min, and oxygen saturation is 97% on room air. Her abdomen is markedly distended and tympanitic with hypoactive bowel sounds and a firm mass palpable in the left lower quadrant. The rectal vault is empty with dark blood on the glove, and there is no rebound or rigidity.\n\nStudies:\n    Upright abdominal radiograph — Colonic dilation to 8 cm with the cecum at 9.5 cm, little rectal gas and few air-fluid levels; small bowel collapsed\n    CT abdomen and pelvis — Transition point at an annular sigmoid stricture\n    WBC — 10,600/mm³\n    Hemoglobin / hematocrit — 9.8 g/dL / 29%\n    MCV — 74 fL\n    Platelets — 385,000/mm³\n    Sodium / potassium — 137 mEq/L / 3.6 mEq/L\n    BUN / creatinine — 20 mg/dL / 0.9 mg/dL\n    Lactate — 1.5 mmol/L\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Digital rectal examination"}, {"letter": "B", "text": "CT of the abdomen and pelvis with intravenous contrast"}, {"letter": "C", "text": "A complete metabolic panel with potassium and magnesium"}, {"letter": "D", "text": "Colonoscopy"}, {"letter": "E", "text": "Upright and supine abdominal radiographs"}], "answer": "D", "explanation": "Imaging has already found the transition point; what it cannot do is say what the stricture is made of. Endoscopy characterizes the obstructing lesion and takes the tissue, and repeating the studies that have already answered their question adds nothing.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A3", "pgroup": "CO-A"}, {"id": "12A", "group": 12, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "A whirl pattern with bird-beak tapering"}, {"letter": "B", "text": "A potassium of 2.9 mEq/L with a magnesium of 1.3 mg/dL"}, {"letter": "C", "text": "An obstructing circumferential sigmoid mass"}, {"letter": "D", "text": "Proximal dilation with distal collapse and a normally enhancing wall"}, {"letter": "E", "text": "A transition point at an adhesive band with no mass"}], "answer": "C", "explanation": "The colon is narrower on the left and the stool already formed, so a circumferential lesion changes stool caliber for months before it closes the lumen. An adhesive band would not be expected in an abdomen that has never been operated on.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A3", "pgroup": "CO-A"}, {"id": "12B", "group": 12, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Large bowel obstruction"}, {"letter": "B", "text": "Adynamic ileus"}, {"letter": "C", "text": "Sigmoid volvulus"}, {"letter": "D", "text": "High-grade small bowel obstruction"}, {"letter": "E", "text": "Partial adhesive intestinal obstruction"}], "answer": "A", "explanation": "Colonic caliber with a collapsed small bowel, scant rectal gas, and few air-fluid levels locates the block in the colon, and there is a true transition point, which excludes an ileus. Colonic obstruction is most often left-sided and takes four to five days to declare itself, against one to two hours for the small bowel.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A3", "pgroup": "CO-A"}, {"id": "12C", "group": 12, "stem": "She has a large bowel obstruction. Which of the following is the most appropriate initial management?", "options": [{"letter": "A", "text": "Nothing by mouth, nasogastric decompression, intravenous fluids, and serial abdominal examinations"}, {"letter": "B", "text": "Endoscopic detorsion with flexible sigmoidoscopy"}, {"letter": "C", "text": "Nothing by mouth, nasogastric decompression, intravenous fluids, and surgical consultation"}, {"letter": "D", "text": "Bowel rest, nasogastric suction, ambulation, and electrolyte correction"}, {"letter": "E", "text": "Nothing by mouth, nasogastric decompression, intravenous fluids, and serial abdominal radiographs"}], "answer": "C", "explanation": "Decompression and resuscitation start immediately, but the difference from a small bowel obstruction is that a surgeon is involved from the outset rather than after a trial of serial films. A cecum at 9.5 cm is past the perforation threshold, and a competent ileocecal valve turns the dilated colon into a closed loop.", "objective": "", "section": "the distended, obstipated abdomen", "pcase": "CO-A3", "pgroup": "CO-A"}, {"id": "13", "group": 13, "stem": "A 72-year-old man is on the third hospital day of nonoperative management of a small-bowel obstruction. His pain had been coming in waves; since early this morning it has been constant and severe with no relief between spasms, and he now looks unwell. He had a sigmoid colectomy in the past and has hypertension and atrial fibrillation on rate control. His temperature is 38.6°C (101.5°F), blood pressure is 96/58 mm Hg, pulse is 124/min, respirations are 24/min, and oxygen saturation is 95% on room air. His abdomen is rigid with guarding and rebound, most tender in the periumbilical region and right lower quadrant, and the bowel sounds that were hyperactive on admission are now silent. His extremities are cool with delayed capillary refill.\n\nStudies:\n    WBC — 21,400/mm³ with 14% bands\n    Hemoglobin / hematocrit — 15.1 g/dL / 45%\n    Platelets — 180,000/mm³\n    Lactate — 5.2 mmol/L\n    Arterial pH / bicarbonate — 7.28 / 16 mEq/L\n    Anion gap — 20\n    Sodium / potassium — 133 mEq/L / 5.1 mEq/L\n    BUN / creatinine — 44 mg/dL / 1.8 mg/dL\n    Blood cultures — Drawn, pending\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Flexible sigmoidoscopy of the left colon"}, {"letter": "B", "text": "CT angiography of the mesenteric vessels"}, {"letter": "C", "text": "An upright plain radiograph of the chest"}, {"letter": "D", "text": "Diagnostic paracentesis of the ascites"}, {"letter": "E", "text": "CT of the abdomen and pelvis with intravenous contrast"}], "answer": "E", "explanation": "The intravenous contrast is the point: it is what shows whether the bowel wall still takes up blood, and therefore whether the trapped segment is alive. A plain film answers only the free-air question, and there is no ascites to tap.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C1", "pgroup": "CO-C"}, {"id": "13A", "group": 13, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Bowel wall thickening with non-enhancement, pneumatosis, and free fluid"}, {"letter": "B", "text": "Sigmoid wall thickening with fat stranding and extraluminal air"}, {"letter": "C", "text": "Large-volume ascites with a nodular liver and no free air"}, {"letter": "D", "text": "An appendix over 6 mm with periappendiceal fluid and extraluminal air"}, {"letter": "E", "text": "A whirl pattern with loss of bowel wall enhancement"}], "answer": "A", "explanation": "A wall that does not enhance has lost its blood supply, and gas within that wall is bacteria fermenting inside dying tissue. Free fluid and mesenteric stranding are the peritoneal response to it, and all three can be present long before any hole appears.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C1", "pgroup": "CO-C"}, {"id": "13B", "group": 13, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Perforated appendicitis"}, {"letter": "B", "text": "Strangulated bowel obstruction"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Perforated diverticulitis"}, {"letter": "E", "text": "Spontaneous bacterial peritonitis"}], "answer": "B", "explanation": "Pain that changes from colicky to constant, hyperactive bowel sounds that fall silent, and a rigid abdomen in a patient obstructed for more than 24 hours is strangulation. Acute mesenteric ischemia gives agonizing pain over a soft abdomen and does not begin with a mechanical block.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C1", "pgroup": "CO-C"}, {"id": "13C", "group": 13, "stem": "He has a strangulated obstruction with infarcted bowel. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Appendectomy with intravenous antibiotics"}, {"letter": "B", "text": "Sigmoid colectomy or Hartmann's procedure with intravenous antibiotics"}, {"letter": "C", "text": "Heparin, intravenous antibiotics, and mesenteric revascularization"}, {"letter": "D", "text": "Piperacillin-tazobactam, or a cephalosporin plus metronidazole"}, {"letter": "E", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}], "answer": "E", "explanation": "The non-viable segment has to come out, and it comes out alongside resuscitation, nasogastric decompression, and antibiotics rather than after them. Antibiotics alone treat infected fluid, not dead tissue, and revascularization presumes an occluded vessel rather than a trapped loop.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C1", "pgroup": "CO-C"}, {"id": "14", "group": 14, "stem": "A 54-year-old woman comes to the emergency department with two days of diffuse abdominal pain, fever, nausea, and no appetite; her abdominal swelling has increased over the past week. She has cirrhosis from hepatitis C with ascites and has had two large-volume paracenteses in the past year, and she takes spironolactone and furosemide. She has had no perforating illness and no recent surgery. Her temperature is 38.4°C (101.1°F), blood pressure is 102/62 mm Hg, pulse is 110/min, respirations are 20/min, and oxygen saturation is 97% on room air. She has tense ascites with diffuse tenderness, guarding, and rebound, shifting dullness and a fluid wave, spider angiomata, and palmar erythema. The abdomen is not board-like and she shifts position on the stretcher without difficulty.\n\nStudies:\n    Upright chest radiograph — No free air under either diaphragm\n    CT abdomen and pelvis — Large-volume ascites with a nodular liver and splenomegaly; no perforation and no pneumoperitoneum\n    WBC — 14,600/mm³ with 82% neutrophils\n    Hemoglobin / hematocrit — 10.6 g/dL / 32%\n    Platelets — 88,000/mm³\n    Lactate — 2.4 mmol/L\n    Sodium / potassium — 128 mEq/L / 4.0 mEq/L\n    Creatinine — 1.4 mg/dL\n    Albumin — 2.4 g/dL\n    Total bilirubin / INR — 3.1 mg/dL / 1.6\n    Blood cultures — Drawn, pending\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Diagnostic laparotomy with a second look at 24 to 48 hours"}, {"letter": "B", "text": "Diagnostic paracentesis"}, {"letter": "C", "text": "CT angiography"}, {"letter": "D", "text": "Flexible sigmoidoscopy"}, {"letter": "E", "text": "An arterial blood gas with a serum lactate"}], "answer": "B", "explanation": "The imaging has excluded a perforated viscus, which leaves the fluid itself as the only place the answer can be. Sampling it separates infected ascites from the surgical causes of peritonitis, and drained fluid is always cultured so that antibiotics can be targeted.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C2", "pgroup": "CO-C"}, {"id": "14A", "group": 14, "stem": "Which of the following findings is most likely to be present?", "options": [{"letter": "A", "text": "A lactate of 5.2 mmol/L with a pH of 7.28 and a widened anion gap"}, {"letter": "B", "text": "Infarcted small bowel in the superior mesenteric territory"}, {"letter": "C", "text": "Ischemic mucosa at the point of torsion"}, {"letter": "D", "text": "Free air under the diaphragm"}, {"letter": "E", "text": "An ascitic neutrophil count of 620/mm³ with a positive culture"}], "answer": "E", "explanation": "Ascites in a cirrhotic is protein-poor and poorly opsonized, so organisms that translocate across the gut wall multiply in it unopposed and draw neutrophils into the fluid. A single gram-negative organism on culture is the pattern; a polymicrobial growth would argue for a perforation feeding the peritoneum.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C2", "pgroup": "CO-C"}, {"id": "14B", "group": 14, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Perforated diverticulitis"}, {"letter": "B", "text": "Strangulated bowel obstruction with infarction"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Perforated appendicitis"}, {"letter": "E", "text": "Spontaneous bacterial peritonitis"}], "answer": "E", "explanation": "Fever and peritoneal signs in a cirrhotic with tense ascites, no free air, and no transition point is infected ascites with an intact gut. The abdomen is tender but not board-like, and she moves on the stretcher — a patient with a perforation lies still.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C2", "pgroup": "CO-C"}, {"id": "14C", "group": 14, "stem": "She has spontaneous bacterial peritonitis. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Emergent laparotomy with resection and broad-spectrum antibiotics"}, {"letter": "B", "text": "Sigmoid colectomy or Hartmann's procedure with intravenous antibiotics"}, {"letter": "C", "text": "Appendectomy with intravenous antibiotics"}, {"letter": "D", "text": "Piperacillin-tazobactam, or a cephalosporin plus metronidazole"}, {"letter": "E", "text": "Heparin, intravenous antibiotics, and mesenteric revascularization"}], "answer": "D", "explanation": "Secondary peritonitis from a perforated appendix or gallbladder is surgical; this is not, and confusing the two is lethal in both directions. Empiric cover is started at once and narrowed once the fluid culture returns, while a surgical consult stands by because both conditions are handled as emergencies.", "objective": "", "section": "the abdomen that turns surgical: peritoneal signs, fever, and sepsis", "pcase": "CO-C2", "pgroup": "CO-C"}, {"id": "15", "group": 15, "stem": "A 70-year-old man comes to the emergency department with crampy left-sided abdominal pain that began abruptly eight hours ago and was followed within a few hours by loose maroon stools and a persistent urge to defecate that produces little. He had a myocardial infarction three weeks ago with a hypotensive episode in the catheterization lab, and he takes aspirin, metoprolol, and digoxin. He has hypertension and is on no anticoagulation. His temperature is 37.6°C (99.7°F), blood pressure is 132/78 mm Hg, pulse is 96/min, respirations are 18/min, and oxygen saturation is 97% on room air. He has left lower quadrant tenderness proportionate to the pain, maroon blood on the glove, no rebound and no rigidity, and present bowel sounds.\n\nStudies:\n    CT abdomen with IV contrast — Segmental bowel wall thickening with thumbprinting at the splenic flexure and an abrupt transition to normal colon; rectum spared; no free air and no pneumatosis\n    WBC — 13,200/mm³\n    Hemoglobin / hematocrit — 12.8 g/dL / 38%\n    Platelets — 265,000/mm³\n    Lactate — 2.1 mmol/L\n    LDH / CPK / amylase — 280 U/L / 190 U/L / 88 U/L\n    Arterial pH / bicarbonate — 7.38 / 23 mEq/L\n    Sodium / potassium — 138 mEq/L / 3.9 mEq/L\n    Creatinine — 1.1 mg/dL\n\nWhich of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT angiography"}, {"letter": "B", "text": "Colonoscopy"}, {"letter": "C", "text": "Stool culture with a pathogen panel"}, {"letter": "D", "text": "Interval colonoscopy 6 to 8 weeks after resolution"}, {"letter": "E", "text": "Diagnostic laparotomy with a second look at 24 to 48 hours"}], "answer": "B", "explanation": "Endoscopy is the gold standard here and is safe in a patient with no peritonitis and no suspicion of gangrene. Angiography is usually not indicated, because the problem is small-vessel low flow rather than an occluded trunk, and barium must never be given where necrosis is suspected.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D2", "pgroup": "CO-D"}, {"id": "15A", "group": 15, "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Sigmoid diverticula with no obstructing mass"}, {"letter": "B", "text": "A lactate of 4.1 mmol/L with a pH of 7.30"}, {"letter": "C", "text": "Infarcted jejunum and proximal ileum in the superior mesenteric territory"}, {"letter": "D", "text": "A single longitudinal ulcer with an abrupt transition to normal mucosa"}, {"letter": "E", "text": "An enteric pathogen identified on stool culture"}], "answer": "D", "explanation": "Low flow injures the segment furthest from either supplying trunk and spares the tissue on both sides of it, which is what produces a sharp border between damaged and normal mucosa. The stripe runs along the antimesenteric border, the part of the circumference perfused last.", "objective": "", "section": "abdominal pain with a starved gut", "pcase": "CO-D2", "pgroup": "CO-D"}, {"id": "15B", "group": 15, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ischemic colitis"}, {"letter": "B", "text": "Infectious colitis"}, {"letter": "C", "text": "Acute mesenteric ischemia"}, {"letter": "D", "text": "Nonocclusive low-flow ischemic bowel disease"}, {"letter": "E", "text": "Diverticulitis"}], "answer": "A", "explanation": "Tenderness proportionate to the pain, a watershed segment at the splenic flexure, and bleeding within 24 hours of onset make this colonic rather than small-bowel ischemia. The rectum is spared because of its dual internal iliac supply, an
