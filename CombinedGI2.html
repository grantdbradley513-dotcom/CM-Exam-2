emperature is 36.8°C (98.2°F), blood pressure is 124/78 mm Hg, pulse is 76/min, respirations are 14/min, and oxygen saturation is 98% on room air. She has spider angiomata across the upper chest and palmar erythema, a liver edge 2 cm below the costal margin, and a palpable spleen tip. There is no ascites and no asterixis, and her sclerae are anicteric.", "labs_recog": [["Hepatitis B serology", "HBsAg positive now and three years ago; HBcAb IgG positive; HBcAb IgM negative; HBsAb absent"], ["HBeAg / HBeAb", "Positive / negative"], ["HBV DNA", "1.8 × 10⁶ IU/mL"], ["AST / ALT", "58 U/L / 74 U/L"], ["Alkaline phosphatase", "110 U/L"], ["Total bilirubin", "1.3 mg/dL"], ["Albumin", "3.6 g/dL"], ["PT / INR", "13.0 seconds / 1.1"], ["Platelets", "148,000/mm³"], ["Creatinine", "0.8 mg/dL"], ["Alpha-fetoprotein", "4.2 ng/mL"], ["Abdominal ultrasound", "Coarse hepatic echotexture with no focal lesion"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Transient elastography with FIB-4"}, {"letter": "B", "text": "Hepatitis C antibody"}, {"letter": "C", "text": "HBV DNA PCR with HBeAg and HBeAb"}, {"letter": "D", "text": "HBsAg with total anti-HDV antibody"}, {"letter": "E", "text": "HBsAg, HBsAb, and HBcAb"}], "answer": "E", "explanation": "The three-marker surface and core panel is the entry study, because the relationship between the antigen, the surface antibody, and the core antibody is what assigns a patient to a stage. Viral load, e-antigen status, and a second virus are all questions asked after the panel has placed her."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "HBsAg negative, HBsAb negative, HBcAb IgM positive"}, {"letter": "B", "text": "HBsAb positive, HBsAg negative, HBcAb positive"}, {"letter": "C", "text": "HBsAg positive, HBcAb IgM positive, HBsAb negative"}, {"letter": "D", "text": "HBsAg positive beyond 6 months, HBcAb IgG positive, HBsAb absent"}, {"letter": "E", "text": "HBsAb positive, HBsAg negative, HBcAb negative"}], "answer": "D", "explanation": "Surface antigen persisting beyond six months defines chronic infection, and the class of the core antibody dates it: IgM belongs to a recent illness, IgG to one carried for years. The absence of surface antibody means she has never cleared it."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Resolved hepatitis B infection"}, {"letter": "B", "text": "Acute hepatitis B"}, {"letter": "C", "text": "Inactive hepatitis B carrier state"}, {"letter": "D", "text": "Chronic hepatitis B"}, {"letter": "E", "text": "Hepatitis B window period"}], "answer": "D", "explanation": "Perinatal acquisition in a high-prevalence country, persistence of surface antigen past six months, an IgG core antibody, and stigmata of chronic liver disease place her in the chronic stage. The inactive carrier has a persistently normal ALT with a negative e-antigen and undetectable DNA."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute hepatitis B"}, {"letter": "B", "text": "Hepatitis B window period"}, {"letter": "C", "text": "Chronic hepatitis B"}, {"letter": "D", "text": "Inactive hepatitis B carrier state"}, {"letter": "E", "text": "Resolved hepatitis B infection"}], "answer": "C", "explanation": "Surface antigen positive across three years with an IgG core antibody and no surface antibody is chronic infection, and a positive e-antigen with a DNA of 1.8 × 10⁶ IU/mL marks active replication and more severe disease. An e-antigen-negative, e-antibody-positive patient with a normal ALT and low DNA would be an inactive carrier instead."}, {"key": "mgmt", "path": "both", "stem": "She has chronic hepatitis B. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "No antiviral, with serial ALT and HBV DNA every 6 to 12 months"}, {"letter": "B", "text": "Entecavir taken with food, continued long term"}, {"letter": "C", "text": "Peginterferon alfa-2a 180 mcg weekly for 48 weeks"}, {"letter": "D", "text": "Tenofovir taken with food, continued long term"}, {"letter": "E", "text": "Supportive care with vaccination of household contacts"}], "answer": "D", "explanation": "Tenofovir is preferred with normal renal function and is taken with food, while entecavir is the choice in renal insufficiency and must be taken without food. Both carry a black box for severe acute exacerbations on discontinuation and for lactic acidosis with hepatomegaly and steatosis, which is why therapy is usually lifelong."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to hepatocellular carcinoma surveillance in this patient?", "options": [{"letter": "A", "text": "Ultrasound with alpha-fetoprotein while the viral load stays detectable"}, {"letter": "B", "text": "Ultrasound with alpha-fetoprotein every 5 years"}, {"letter": "C", "text": "Ultrasound with alpha-fetoprotein once cirrhosis is documented"}, {"letter": "D", "text": "Ultrasound with alpha-fetoprotein if the alpha-fetoprotein is raised at baseline"}, {"letter": "E", "text": "Ultrasound with alpha-fetoprotein every 6 months, for life"}], "answer": "E", "explanation": "Hepatitis B causes hepatocellular carcinoma in livers that are not cirrhotic, so surveillance is not held back for a fibrosis stage, and antiviral therapy lowers but does not remove the risk. Every patient over 40 or with cirrhosis has the liver imaged every six months, for life; contrast CT or MRI are acceptable substitutes for ultrasound."}]}, {"case": "VH-C1", "group": "VH-C", "section": "the positive hepatitis C antibody, and what the RNA does with it", "objective": "", "vignette_workup": "A 66-year-old woman comes to the primary care clinic after a routine panel showed an ALT of 88 U/L. She feels well apart from some afternoon fatigue she has put down to age. She was born in 1960 and had a blood transfusion after a hysterectomy in 1987; she has never injected or snorted drugs and has no tattoos. She takes omeprazole for reflux and atorvastatin, and she drinks no alcohol. Her temperature is 36.9°C (98.4°F), blood pressure is 128/76 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her examination is normal — no jaundice, no spider angiomata, no palmar erythema, and no hepatomegaly, splenomegaly, or ascites.", "labs_workup": [["Hepatitis C antibody", "Positive"], ["AST / ALT", "62 U/L / 88 U/L"], ["Alkaline phosphatase", "96 U/L"], ["Total bilirubin / albumin", "0.9 mg/dL / 4.2 g/dL"], ["INR", "1.0"], ["Platelets", "244,000/mm³"], ["Hemoglobin / hematocrit", "13.2 g/dL / 40%"]], "vignette_recog": "A 66-year-old woman comes to the primary care clinic after a routine panel showed an ALT of 88 U/L. She feels well apart from some afternoon fatigue she has put down to age. She was born in 1960 and had a blood transfusion after a hysterectomy in 1987; she has never injected or snorted drugs and has no tattoos. She takes omeprazole for reflux and atorvastatin, and she drinks no alcohol. Her temperature is 36.9°C (98.4°F), blood pressure is 128/76 mm Hg, pulse is 74/min, respirations are 14/min, and oxygen saturation is 99% on room air. Her examination is normal — no jaundice, no spider angiomata, no palmar erythema, and no hepatomegaly, splenomegaly, or ascites.", "labs_recog": [["Hepatitis C antibody", "Positive"], ["HCV RNA", "1.6 × 10⁶ IU/mL, genotype 1a"], ["FIB-4 / transient elastography", "1.02 / 5.8 kPa"], ["AST / ALT", "62 U/L / 88 U/L"], ["Total bilirubin / albumin", "0.9 mg/dL / 4.2 g/dL"], ["INR", "1.0"], ["Platelets", "244,000/mm³"], ["HBsAg / HBsAb / HBcAb", "Negative / positive / negative"], ["HIV", "Negative"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "HCV RNA PCR with genotype and fibrosis staging"}, {"letter": "B", "text": "Repeat hepatitis C antibody testing in 12 weeks"}, {"letter": "C", "text": "Transient elastography alone"}, {"letter": "D", "text": "Liver ultrasound with a hepatic function panel"}, {"letter": "E", "text": "HBV DNA PCR with HBeAg and HBeAb"}], "answer": "A", "explanation": "A positive antibody records exposure, not disease, and must always be followed by an RNA: false positives occur and roughly 20% of infections clear on their own. Repeating the antibody adds nothing, because it stays positive after cure and confers no immunity."}, {"key": "result", "path": "W", "stem": "Which of the following additional results is most likely to be present?", "options": [{"letter": "A", "text": "HBV DNA 1.8 × 10⁶ IU/mL with a positive HBeAg"}, {"letter": "B", "text": "HCV RNA 340,000 IU/mL at 3 weeks, persisting on repeat"}, {"letter": "C", "text": "HCV RNA 2.9 × 10⁶ IU/mL with elastography at 16.2 kPa"}, {"letter": "D", "text": "HCV RNA 1.6 × 10⁶ IU/mL, genotype 1a, with a FIB-4 of 1.02"}, {"letter": "E", "text": "HCV RNA undetectable on two separate draws"}], "answer": "D", "explanation": "About 80% of exposures become chronic, and a detectable viral load decades after the exposure is what makes the infection active rather than historical. Genotypes 1a and 1b are the commonest in the United States, and a FIB-4 of 1.02 with normal platelets and albumin puts her well below significant fibrosis."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Cleared or cured hepatitis C"}, {"letter": "B", "text": "Chronic hepatitis B infection"}, {"letter": "C", "text": "Acute hepatitis C infection"}, {"letter": "D", "text": "Chronic hepatitis C without significant fibrosis"}, {"letter": "E", "text": "Chronic hepatitis C with compensated cirrhosis"}], "answer": "D", "explanation": "The exposure is decades old and the antibody is already positive, which is not the antibody-negative window of acute infection. Normal platelets, albumin, and INR with no stigmata argue against established cirrhosis."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Chronic hepatitis C without significant fibrosis"}, {"letter": "B", "text": "Chronic hepatitis C with compensated cirrhosis"}, {"letter": "C", "text": "Cleared or cured hepatitis C"}, {"letter": "D", "text": "Chronic hepatitis B infection"}, {"letter": "E", "text": "Acute hepatitis C infection"}], "answer": "A", "explanation": "A detectable viral load behind a positive antibody is active infection, which is what separates her from a patient who cleared the virus and kept the antibody. A FIB-4 of 1.02 with elastography at 5.8 kPa places her below significant fibrosis; a third of viremic patients have normal transaminases, so the ALT was never the deciding number."}, {"key": "mgmt", "path": "both", "stem": "She has chronic hepatitis C. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with ribavirin added"}, {"letter": "B", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with her omeprazole taken 4 hours after the dose"}, {"letter": "C", "text": "Glecaprevir/pibrentasvir three tablets daily for 8 weeks, taken on an empty stomach"}, {"letter": "D", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with hepatitis B testing deferred until therapy is finished"}, {"letter": "E", "text": "Sofosbuvir/velpatasvir daily for 12 weeks, with her omeprazole taken 4 hours before the dose"}], "answer": "B", "explanation": "A proton pump inhibitor raises gastric pH and cuts absorption of the regimen, so the antiviral goes first and the omeprazole four hours later. Hepatitis B status must be known before the first dose because of the reactivation black box, ribavirin is added only for decompensated cirrhosis, and glecaprevir/pibrentasvir is taken with food."}, {"key": "escalate", "path": "both", "stem": "Twelve weeks after completing therapy her HCV RNA is still detectable. Which of the following should be given next?", "options": [{"letter": "A", "text": "Glecaprevir/pibrentasvir for 8 weeks"}, {"letter": "B", "text": "Tenofovir or entecavir, continued long term"}, {"letter": "C", "text": "Alcohol cessation with nutritional support"}, {"letter": "D", "text": "A second 12-week course of sofosbuvir/velpatasvir"}, {"letter": "E", "text": "Sofosbuvir/velpatasvir/voxilaprevir"}], "answer": "E", "explanation": "A detectable RNA twelve or more weeks after therapy means sustained virologic response was not achieved, and retreatment uses the three-drug regimen, with or without ribavirin. Repeating the same combination selects further for the resistant strains that missed doses and early stopping produce."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to hepatitis C screening in adults?", "options": [{"letter": "A", "text": "Screen only adults with a transfusion or injection drug history"}, {"letter": "B", "text": "Screen only during pregnancy"}, {"letter": "C", "text": "Screen only adults with an ongoing risk exposure"}, {"letter": "D", "text": "Screen only adults with raised transaminases"}, {"letter": "E", "text": "Screen every adult at least once"}], "answer": "E", "explanation": "Every adult aged 18 or over is screened once, every pregnancy is screened, and screening is repeated where risk continues. Restricting testing to a named exposure or an abnormal liver panel misses most infections, since a third of viremic patients have normal transaminases."}]}, {"case": "IB-A1", "group": "IB-A", "section": "chronic diarrhea and abdominal pain in a patient with colitis", "objective": "", "vignette_workup": "A 23-year-old woman presents to the primary care clinic with five months of cramping right lower quadrant pain and four to five loose nonbloody stools a day. She has lost 14 pounds. She smokes half a pack of cigarettes daily and her mother has Crohn's disease. She has not travelled recently and has taken no antibiotics. Her temperature is 37.6°C (99.7°F), blood pressure is 112/70 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has a tender palpable fullness in the right lower quadrant, two aphthous ulcers on the buccal mucosa, and a posterior anal fissure with an adjacent skin tag. There is no jaundice and no abdominal distention.", "labs_workup": [["Hemoglobin / hematocrit", "10.2 g/dL / 31%"], ["MCV", "76 fL"], ["Ferritin", "8 ng/mL"], ["Vitamin B12 / folate", "210 pg/mL / 7 ng/mL"], ["Albumin", "3.1 g/dL"], ["CRP / ESR", "42 mg/L / 38 mm/h"], ["WBC / platelets", "9,400/mm³ / 402,000/mm³"], ["Fecal calprotectin", "780 µg/g"], ["Stool cultures and C. difficile PCR", "Negative"]], "vignette_recog": "A 23-year-old woman presents to the primary care clinic with five months of cramping right lower quadrant pain and four to five loose nonbloody stools a day. She has lost 14 pounds. She smokes half a pack of cigarettes daily and her mother has Crohn's disease. She has not travelled recently and has taken no antibiotics. Her temperature is 37.6°C (99.7°F), blood pressure is 112/70 mm Hg, pulse is 96/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has a tender palpable fullness in the right lower quadrant, two aphthous ulcers on the buccal mucosa, and a posterior anal fissure with an adjacent skin tag. There is no jaundice and no abdominal distention.", "labs_recog": [["Hemoglobin / hematocrit", "10.2 g/dL / 31%"], ["MCV / ferritin", "76 fL / 8 ng/mL"], ["Vitamin B12", "210 pg/mL"], ["Albumin", "3.1 g/dL"], ["CRP / ESR", "42 mg/L / 38 mm/h"], ["Fecal calprotectin", "780 µg/g"], ["Stool cultures and C. difficile PCR", "Negative"], ["Ileocolonoscopy", "Patchy ulceration of the terminal ileum and right colon with cobblestoning and deep longitudinal ulcers, normal mucosa between the involved segments, and a normal rectum"], ["Biopsy", "Transmural inflammation with non-caseating granulomas"], ["CT enterography", "Skip segments of mural thickening in the distal ileum over about 12 cm, with no stricture, fistula, or abscess"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "CT or MR enterography"}, {"letter": "B", "text": "ASCA and p-ANCA serology panel"}, {"letter": "C", "text": "Ileocolonoscopy with ileal intubation and biopsy"}, {"letter": "D", "text": "Pelvic MRI or endoanal ultrasound"}, {"letter": "E", "text": "Surveillance colonoscopy with 32 four-quadrant biopsies"}], "answer": "C", "explanation": "A raised calprotectin with negative stool studies establishes that the inflammation is real and not infectious, and the next step is to see it and sample it. Intubating the ileum is what makes the study diagnostic rather than merely a colonoscopy; enterography and serology characterize disease that endoscopy has already found."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Chronic active colitis with no ileal disease and no skip pattern"}, {"letter": "B", "text": "Continuous rectal-based inflammation sparing the ileum, with crypt abscesses"}, {"letter": "C", "text": "Skip lesions with cobblestoning and rectal sparing, with granulomas on biopsy"}, {"letter": "D", "text": "Diffuse colitis with adherent yellow plaques"}, {"letter": "E", "text": "Segmental colitis at a watershed segment with an abrupt transition"}], "answer": "C", "explanation": "The inflammation is patchy and full-thickness, so it leaves normal mucosa between involved segments, spares the rectum, and heaps the surviving mucosa into cobblestones between deep longitudinal ulcers. Non-caseating granulomas are the histologic counterpart of that transmural process."}, {"key": "confirm", "path": "W", "stem": "Which of the following studies would most directly confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "Repeat stool toxin assay after therapy"}, {"letter": "B", "text": "Repeat colonoscopy after recovery"}, {"letter": "C", "text": "Pelvic MRI or endoanal ultrasound"}, {"letter": "D", "text": "CT or MR enterography"}, {"letter": "E", "text": "ASCA and p-ANCA serology"}], "answer": "D", "explanation": "Enterography reaches the small bowel the scope cannot and defines both the extent of disease and whether it has penetrated — the presence or absence of a stricture, fistula, or abscess changes therapy immediately. Capsule endoscopy is not an alternative when a stricture is suspected."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "IBD-associated colorectal cancer"}, {"letter": "B", "text": "Ulcerative colitis"}, {"letter": "C", "text": "Crohn's disease"}, {"letter": "D", "text": "Clostridioides difficile colitis"}, {"letter": "E", "text": "Indeterminate colitis"}], "answer": "C", "explanation": "Terminal ileal disease with skip lesions, rectal sparing, and granulomas commits the pattern, and about 40% of cases are ileocolic. Smoking, oral aphthae, and perianal disease all belong to this diagnosis rather than to ulcerative colitis, and the bleeding here is occult rather than frank."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "IBD-associated colorectal cancer"}, {"letter": "B", "text": "Clostridioides difficile colitis"}, {"letter": "C", "text": "Ulcerative colitis"}, {"letter": "D", "text": "Indeterminate colitis"}, {"letter": "E", "text": "Crohn's disease"}], "answer": "E", "explanation": "Transmural inflammation with non-caseating granulomas is the histologic signature, and skip segments on enterography confirm the distribution. Ulcerative colitis is mucosal, continuous, and begins at the rectum, and its biopsies show crypt abscesses and mucin depletion instead."}, {"key": "mgmt", "path": "both", "stem": "She has Crohn's ileocolitis of mild to moderate activity. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Azathioprine with smoking cessation, started without thiopurine methyltransferase testing"}, {"letter": "B", "text": "Budesonide with smoking cessation and repletion of iron and vitamin B12"}, {"letter": "C", "text": "Budesonide with smoking cessation and loperamide for the diarrhea"}, {"letter": "D", "text": "Budesonide with smoking cessation and long-term prednisone for maintenance"}, {"letter": "E", "text": "Budesonide with smoking cessation and naproxen for the pain"}], "answer": "B", "explanation": "Budesonide covers mild to moderate activity while smoking cessation and repletion of iron and B12 treat what is driving the disease and what it has cost her. NSAIDs trigger flares, anti-diarrheals raise the risk of toxic megacolon, corticosteroids are never maintenance, and thiopurines require a TPMT check first because slow metabolizers are myelotoxic."}, {"key": "escalate", "path": "both", "stem": "Her symptoms and inflammatory markers do not improve on budesonide. Which of the following should be given next?", "options": [{"letter": "A", "text": "5-ASA with serial reassessment"}, {"letter": "B", "text": "A mesalamine enema with an oral aminosalicylate"}, {"letter": "C", "text": "An oral antibiotic directed at Clostridioides difficile"}, {"letter": "D", "text": "Colectomy"}, {"letter": "E", "text": "A corticosteroid with a TNF inhibitor"}], "answer": "E", "explanation": "Moderate to severe disease is treated with corticosteroids alongside an immunomodulator or a TNF inhibitor, with maintenance carried by the biologic afterwards. Latent tuberculosis and hepatitis B must be screened for and treated before the first dose, because reactivation is the feared event."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to surgery in Crohn's disease?", "options": [{"letter": "A", "text": "Offer it once a TNF inhibitor has failed"}, {"letter": "B", "text": "Offer it once smoking cessation has failed"}, {"letter": "C", "text": "Reserve it for a complication of the disease"}, {"letter": "D", "text": "Offer it once budesonide fails to induce remission"}, {"letter": "E", "text": "Offer it at diagnosis, since 75% will need it within 20 years"}], "answer": "C", "explanation": "Surgery is not curative — the disease recurs at the anastomosis — so it is never done to treat the disease itself, and every surgical indication in Crohn's is a complication. Three-quarters of patients do come to an operation within twenty years, which is a statistic about complications, not an argument for operating early."}]}, {"case": "IB-B4", "group": "IB-B", "section": "acute deterioration in a patient with known inflammatory bowel disease", "objective": "", "vignette_workup": "A 57-year-old woman on the inpatient medical unit is on hospital day 4 of treatment for a severe colitis flare when she develops sudden severe diffuse abdominal pain with fever and one episode of vomiting. She has had ulcerative colitis for 11 years and has been on intravenous methylprednisolone since admission; a film yesterday showed the transverse colon dilated to 7 cm. Her temperature is 38.5°C (101.3°F), blood pressure is 88/54 mm Hg, pulse is 132/min, respirations are 26/min, and oxygen saturation is 95% on room air. Her abdomen is rigid and silent with rebound tenderness and guarding, her extremities are cool with delayed capillary refill, and there is no jaundice.", "labs_workup": [["WBC", "22,400/mm³ with 14% bands"], ["Hemoglobin / hematocrit", "9.6 g/dL / 29%"], ["Platelets", "232,000/mm³"], ["Lactate", "4.6 mmol/L"], ["Creatinine", "1.8 mg/dL"], ["Potassium", "3.4 mEq/L"], ["Albumin", "2.3 g/dL"]], "vignette_recog": "A 57-year-old woman on the inpatient medical unit is on hospital day 4 of treatment for a severe colitis flare when she develops sudden severe diffuse abdominal pain with fever and one episode of vomiting. She has had ulcerative colitis for 11 years and has been on intravenous methylprednisolone since admission; a film yesterday showed the transverse colon dilated to 7 cm. Her temperature is 38.5°C (101.3°F), blood pressure is 88/54 mm Hg, pulse is 132/min, respirations are 26/min, and oxygen saturation is 95% on room air. Her abdomen is rigid and silent with rebound tenderness and guarding, her extremities are cool with delayed capillary refill, and there is no jaundice.", "labs_recog": [["Upright chest radiograph", "Free intraperitoneal air under both hemidiaphragms"], ["CT abdomen and pelvis", "Sigmoid perforation with extraluminal air and free fluid, and no drainable abscess"], ["WBC", "22,400/mm³ with 14% bands"], ["Hemoglobin / hematocrit", "9.6 g/dL / 29%"], ["Platelets", "232,000/mm³"], ["Lactate", "4.6 mmol/L"], ["Creatinine", "1.8 mg/dL"], ["Potassium", "3.4 mEq/L"], ["Albumin", "2.3 g/dL"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Stool testing for Clostridioides difficile"}, {"letter": "B", "text": "Ileocolonoscopy with biopsy"}, {"letter": "C", "text": "CT of the abdomen and pelvis"}, {"letter": "D", "text": "CT or MR enterography"}, {"letter": "E", "text": "Upright chest and abdominal radiographs"}], "answer": "E", "explanation": "An upright film is immediate, is done at the bedside in a shocked patient, and answers the only question that changes the next hour. Colonoscopy has no place at all here, and cross-sectional imaging adds detail at the cost of time that a hypotensive patient does not have."}, {"key": "result", "path": "W", "stem": "Which of the following findings is most likely to be seen?", "options": [{"letter": "A", "text": "Luminal narrowing with proximal dilation and minimal mural enhancement"}, {"letter": "B", "text": "Free intraperitoneal air under both hemidiaphragms"}, {"letter": "C", "text": "Pancolonic wall thickening with an accordion pattern"}, {"letter": "D", "text": "A tract from a distal ileal loop to the bladder dome with intravesical air"}, {"letter": "E", "text": "Transverse colon dilated to 9 cm with loss of haustra and thumbprinting"}], "answer": "B", "explanation": "Gas escaping a colon whose wall has given way rises to the highest point in the supine-to-upright abdomen and outlines both hemidiaphragms. The rigid silent abdomen with rebound and the shock are that gas and stool in the peritoneum."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Colon perforation"}, {"letter": "B", "text": "Toxic megacolon"}, {"letter": "C", "text": "Stricturing Crohn's disease with small bowel obstruction"}, {"letter": "D", "text": "Fulminant ulcerative colitis"}, {"letter": "E", "text": "Fistulizing Crohn's disease"}], "answer": "A", "explanation": "Yesterday's dilated colon is now a free perforation with peritonitis and shock, and it is the most lethal complication either form of inflammatory bowel disease produces. Toxic megacolon is the dilated colon with systemic toxicity that precedes it, before the wall gives way."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Toxic megacolon"}, {"letter": "B", "text": "Fistulizing Crohn's disease"}, {"letter": "C", "text": "Colon perforation"}, {"letter": "D", "text": "Fulminant ulcerative colitis"}, {"letter": "E", "text": "Stricturing Crohn's disease with small bowel obstruction"}], "answer": "C", "explanation": "Free air on an upright film in a patient with inflammatory bowel disease is the diagnosis and the indication for laparotomy in the same breath. A fulminant flare shows wall thickening without dilation or free air, and toxic megacolon shows submucosal edema with an intact wall."}, {"key": "mgmt", "path": "both", "stem": "She has a colon perforation. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Fluid resuscitation, broad-spectrum antibiotics, and colonoscopy to localize the perforation"}, {"letter": "B", "text": "Fluid resuscitation, broad-spectrum antibiotics, and total abdominal colectomy with end ileostomy"}, {"letter": "C", "text": "Fluid resuscitation, broad-spectrum antibiotics, and repeat imaging before deciding on surgery"}, {"letter": "D", "text": "Fluid resuscitation, broad-spectrum antibiotics, and colectomy with ileal pouch-anal anastomosis at the same operation"}, {"letter": "E", "text": "Fluid resuscitation, broad-spectrum antibiotics, and continued methylprednisolone with review in 24 hours"}], "answer": "B", "explanation": "The operation is the treatment: the colon comes out, the ileostomy is brought up, and the rectum is left in place. A septic, steroid-loaded patient gets no pelvic dissection, so reconstruction is deferred, and neither further imaging nor another day of medical therapy is a defensible delay."}, {"key": "counsel", "path": "both", "stem": "Which of the following is the most appropriate approach to peritoneal signs in a patient receiving high-dose corticosteroids?", "options": [{"letter": "A", "text": "Require them before operating"}, {"letter": "B", "text": "Require them unless the colon is dilated beyond 6 cm"}, {"letter": "C", "text": "Do not require them before operating"}, {"letter": "D", "text": "Require them unless the lactate is raised"}, {"letter": "E", "text": "Require them unless the patient is hypotensive"}], "answer": "C", "explanation": "Corticosteroids blunt the peritoneal response, so a rigid abdomen may be absent in exactly the patient most likely to have perforated. Waiting for a sign the drug has suppressed converts a survivable operation into a lethal delay, and no laboratory or radiographic substitute changes that rule."}]}, {"case": "IB-C2", "group": "IB-C", "section": "extraintestinal complaints that track bowel disease activity", "objective": "", "vignette_workup": "A 24-year-old woman comes to the primary care clinic with six days of tender red lumps on both shins that are painful and warm to touch. For three weeks she has had cramping and five loose stools a day. She has had Crohn's colitis for two years, had a similar rash during her first flare, and takes mesalamine. Her temperature is 37.9°C (100.2°F), blood pressure is 114/70 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has six raised tender subcutaneous nodules 2 to 4 cm across the anterior lower legs. Her joints are without swelling and her eyes are white.", "labs_workup": [["Hemoglobin / hematocrit", "11.6 g/dL / 35%"], ["WBC", "9,100/mm³"], ["Albumin", "3.4 g/dL"]], "vignette_recog": "A 24-year-old woman comes to the primary care clinic with six days of tender red lumps on both shins that are painful and warm to touch. For three weeks she has had cramping and five loose stools a day. She has had Crohn's colitis for two years, had a similar rash during her first flare, and takes mesalamine. Her temperature is 37.9°C (100.2°F), blood pressure is 114/70 mm Hg, pulse is 92/min, respirations are 16/min, and oxygen saturation is 99% on room air. She has six raised tender subcutaneous nodules 2 to 4 cm across the anterior lower legs. Her joints are without swelling and her eyes are white.", "labs_recog": [["CRP / ESR", "38 mg/L / 40 mm/h"], ["Hemoglobin / hematocrit", "11.6 g/dL / 35%"], ["WBC", "9,100/mm³"], ["Albumin", "3.4 g/dL"], ["Fecal calprotectin", "690 µg/g"], ["Lesion examination", "Red-violet panniculitic nodules over the anterior shins; none ulcerated and none with an undermined border"]], "nodes": [{"key": "next_step", "path": "W", "stem": "Which of the following is the most appropriate next step in the evaluation?", "options": [{"letter": "A", "text": "Clinical diagnosis with ophthalmology referral if uncertain"}, {"letter": "B", "text": "Sacroiliac and spine imaging with HLA-B27"}, {"letter": "C", "text": "Clinical diagnosis with CRP and ESR"}, {"letter": "D", "text": "Urgent ophthalmology referral with slit-lamp examination"}, {"letter": "E", "text": "Clinical diagnosis with wound culture"}], "answer": "C", "explanation": "The lesions are recognized at the bedside, and the laboratory work that matters is the measure of how active the bowel disease is, since the two move together. A wound culture is what an ulcerating lesion needs, and the eyes and spine are quiet."}, {"key": "result", "path": "W", "stem": "Which of the following additional findings is most likely to be present?", "options": [{"letter": "A", "text": "Reduced spinal flexion with sacroiliac tenderness"}, {"letter": "B", "text": "Fewer than six warm swollen large joints"}, {"letter": "C", "text": "Nodules that do not ulcerate and have no undermined border"}, {"letter": "D", "text": "An ulcer with a violaceous undermined border"}, {"letter": "E", "text": "Sectoral scleral injection with normal visual acuity"}], "answer": "C", "explanation": "The process is inflammation of subcutaneous fat, so the overlying skin stays intact and the lesions resolve without breaking down. That intact surface is what separates this from the neutrophilic ulceration that undermines its own edge."}, {"key": "dx", "path": "W", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Peripheral arthritis of inflammatory bowel disease"}, {"letter": "B", "text": "Pyoderma gangrenosum"}, {"letter": "C", "text": "Uveitis of inflammatory bowel disease"}, {"letter": "D", "text": "Erythema nodosum"}, {"letter": "E", "text": "Episcleritis of inflammatory bowel disease"}], "answer": "D", "explanation": "This is the most common skin manifestation of inflammatory bowel disease — about 3% of ulcerative colitis and 8% of Crohn's disease — and it arrives with a flare, as it did the first time. Tender nodules confined to the anterior shins with quiet joints and white eyes place it in the skin."}, {"key": "dx_direct", "path": "R", "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Pyoderma gangrenosum"}, {"letter": "B", "text": "Episcleritis of inflammatory bowel disease"}, {"letter": "C", "text": "Uveitis of inflammatory bowel disease"}, {"letter": "D", "text": "Peripheral arthritis of inflammatory bowel disease"}, {"letter": "E", "text": "Erythema nodosum"}], "answer": "E", "explanation": "Non-ulcerating panniculitic nodules over the anterior shins, rising with a calprotectin of 690 µg/g, are the definition. Pyoderma gangrenosum is a single enlarging ulcer with an undermined violaceous border, typically at a site of minor trauma and often in quiescent disease."}, {"key": "mgmt", "path": "both", "stem": "She has erythema nodosum. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Exercise and physical therapy with a TNF inhibitor"}, {"letter": "B", "text": "Emergent ophthalmology referral with topical corticosteroids"}, {"letter": "C", "text": "Wound care avoiding debridement, with systemic corticosteroids"}, {"letter": "D", "text": "Treatment of the underlying bowel disease with leg elevation and rest"}, {"letter": "E", "text": "Ocular corticosteroids with treatment of the underlying bowel disease"}], "answer": "D", "explanation": "No drug is directed at the rash itself at first line, because the rash follows the bowel disease; controlling the flare controls t // Rotating stack builder for a Clinical Vignette practice exam.
//
// Injected immediately after the `const EXAM_DATA = ...;` line of the
// interactive-exam template, before the main IIFE.
//
// EXAM_DATA.pool is an array of CASES. Each case carries two possible opening
// vignettes and an ordered pool of question nodes. On every page load this
// script picks one path per case, draws 2-4 nodes from it in clinical order,
// shuffles the options, shuffles the case order under the adjacency rule, and
// writes a normal EXAM_DATA.questions array for the template to render.
//
// Case shape:
//   { case, group, section, objective,
//     vignette_workup, vignette_recog,      // parent stems (full vignette + lead-in)
//     labs_workup, labs_recog,              // optional [[test,result],...]
//     nodes: [ { key, path, stem, options:[{letter,text}], answer, explanation } ] }
//
// node.key    next_step | result | confirm | dx | dx_direct | mgmt | escalate | counsel
// node.path   "W" workup-first | "R" recognition-first | "both"
//
// Invariants held on every draw:
//   1. the parent node (next_step or dx_direct) is always first and carries the vignette
//   2. `result` — the held-back finding — may only sit immediately after the parent
//   3. `confirm` is drawn only when `result` is also drawn
//   4. nodes keep their pool order, which is clinical order
//   5. no two adjacent cases share a differential group
(function buildExam() {
  var pool = EXAM_DATA.pool;
  if (!pool || !pool.length) return;             // no pool: leave EXAM_DATA.questions alone

  var LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  var W_ORDER = ['next_step', 'result', 'confirm', 'dx', 'mgmt', 'escalate', 'counsel'];
  var R_ORDER = ['dx_direct', 'mgmt', 'escalate', 'counsel'];

  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function nodesFor(c, path) {
    var order = path === 'R' ? R_ORDER : W_ORDER;
    var out = [];
    order.forEach(function (k) {
      for (var i = 0; i < c.nodes.length; i++) {
        var n = c.nodes[i];
        if (n.key !== k) continue;
        if (n.path && n.path !== 'both' && n.path !== path) continue;
        out.push(n); break;
      }
    });
    return out;
  }

  // Every ordered subset of `rest` of exactly size m that satisfies the two
  // structural rules. `rest` is at most six nodes, so enumeration is cheap and
  // gives a genuinely uniform draw rather than a length-biased one.
  function validSubsets(rest, m) {
    var out = [];
    var total = 1 << rest.length;
    for (var mask = 0; mask < total; mask++) {
      var take = [], bits = 0;
      for (var i = 0; i < rest.length; i++) {
        if (mask & (1 << i)) { take.push(rest[i]); bits++; }
      }
      if (bits !== m) continue;
      var keys = take.map(function (n) { return n.key; });
      if (keys.indexOf('result') !== -1 && keys[0] !== 'result') continue;            // rule 2
      if (keys.indexOf('confirm') !== -1 && keys.indexOf('result') === -1) continue;  // rule 3
      out.push(take);
    }
    return out;
  }

  function drawFollowers(rest, k) {
    var m = k - 1;
    while (m > 0) {
      var sets = validSubsets(rest, m);
      if (sets.length) return pick(sets);
      m--;
    }
    return rest.slice(0, 1);

  // The template escapes the stem and renders it with white-space: pre-wrap,
  // so studies are laid out as plain indented lines, not a markdown table.
  function labTable(rows) {
    if (!rows || !rows.length) return '';
    var s = '\n\nStudies:';
    rows.forEach(function (r) { s += '\n    ' + r[0] + ' — ' + r[1]; });
    return s;

  // ---- build one stack per case -------------------------------------------
  var stacks = [];
  pool.forEach(function (c) {
    var paths = [];

    var rNodes = nodesFor(c, 'R');
    if (rNodes.length >= 2 && c.vignette_recog) paths.push('R');
    if (!paths.length) return;
    var path = pick(paths);

    var ns = nodesFor(c, path);
    var parent = ns[0], rest = ns.slice(1);
    var k = Math.min(2 + Math.floor(Math.random() * 3), rest.length + 1);  // 2..4
    var chosen = [parent].concat(drawFollowers(rest, k));

    var vign = path === 'R' ? c.vignette_recog : c.vignette_workup;
    var labs = path === 'R' ? c.labs_recog : c.labs_workup;

    var qs = chosen.map(function (n, i) {
      return {

        options: (n.options || []).map(function (o) { return { letter: o.letter, text: o.text }; }),
        answer: n.answer,
        explanation: n.explanation || '',
        objective: c.objective || '',
        section: c.section || 'All questions',
        pcase: c.case,
        pgroup: c.group

  });
  if (!stacks.length) return;

  // ---- shuffle options inside each question -------------------------------
  stacks.forEach(function (s) {
    s.qs.forEach(function (q) {
      if (!q.options || q.options.length < 2) return;
      var keyText = null;
      q.options.forEach(function (o) { if (o.letter === q.answer) keyText = o.text; });
      var texts = shuffled(q.options.map(function (o) { return o.text; }));

  if (adjacent(seq)) {                     // greedy repair if random never lands it
    var remaining = stacks.slice(), built = [];
    while (remaining.length) {

      for (var i = 0; i < remaining.length; i++) {

    }
    seq = built;
  }

  // ---- number and hand off -------------------------------------------------
  var out = [];
  seq.forEach(function (s, i) {
    var n = i + 1;
    s.qs.forEach(function (q, j) {
      q.group = n;
      q.id = j === 0 ? String(n) : String(n) + LET[j - 1];
      out.push(q);
    });
  });
  EXAM_DATA.questions = out;
})();


(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
