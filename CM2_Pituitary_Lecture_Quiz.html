<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
    transition: background-color 0.3s ease;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  #bglayer { position: fixed; inset: 0; z-index: -1; background-size: cover;
    background-position: center; background-repeat: no-repeat; display: none; }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }

": "GH acts on the liver to release a **steadier** downstream hormone that reflects average GH.", "stem": "GH stimulates the liver to release…", "options": [{"letter": "A", "text": "IGF-1"}, {"letter": "B", "text": "Somatostatin"}, {"letter": "C", "text": "TRH"}], "answer": "A", "explanation": "The liver releases **IGF-1**.", "clarify": [{"stem": "Random GH is unreliable because it is…", "options": [{"letter": "A", "text": "Pulsatile"}, {"letter": "B", "text": "Too stable"}], "answer": "A", "explanation": "GH pulses, so random levels mislead."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Acromegaly suspected → Best screening lab:", "options": [{"letter": "A", "text": "Serum IGF-1"}, {"letter": "B", "text": "Random serum GH"}, {"letter": "C", "text": "Serum prolactin"}, {"letter": "D", "text": "24-h urine cortisol"}], "answer": "A", "explanation": "**IGF-1** is released steadily (unlike pulsatile GH) and is **elevated** in acromegaly."}], "checkpoints": [{"stem": "Imaging in acromegaly almost always shows…", "options": [{"letter": "A", "text": "GH-secreting pituitary adenoma"}, {"letter": "B", "text": "Adrenal mass"}, {"letter": "C", "text": "Empty pituitary stalk"}, {"letter": "D", "text": "Normal sella"}], "answer": "A", "explanation": "CT/MRI almost always finds a **GH-secreting pituitary tumor**."}]}}, {"id": "35", "group": 35, "slide": 32, "section": "Glucose suppression", "topic": "Acromegaly & gigantism", "skill": "Diagnostics & imaging", "stem": "Which dynamic test is used to confirm acromegaly?", "options": [{"letter": "A", "text": "Insulin tolerance test"}, {"letter": "B", "text": "Glucagon stimulation test"}, {"letter": "C", "text": "Oral glucose GH suppression"}, {"letter": "D", "text": "Water deprivation test"}], "answer": "C", "explanation": "**Oral glucose (100 g) GH suppression test**: normally GH falls <1 ng/mL by 2 h; in acromegaly it doesn't.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": " ed.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Every secretory pituitary tumor except prolactinoma gets **surgery first**.", "stem": "The only pituitary tumor where drugs come before surgery is…", "options": [{"letter": "A", "text": "Prolactinoma"}, {"letter": "B", "text": "GH adenoma"}, {"letter": "C", "text": "ACTH adenoma"}], "answer": "A", "explanation": "Only **prolactinoma** is medical-first.", "clarify": [{"stem": "Cabergoline controls GH in about…", "options": [{"letter": "A", "text": "10% of patients"}, {"letter": "B", "text": "80% of patients"}], "answer": "A", "explanation": "Cabergoline works for GH in only ~10%."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Acromegaly from a GH-secreting adenoma → Treatment of choice:", "options": [{"letter": "A", "text": "Surgical resection"}, {"letter": "B", "text": "Octreotide"}, {"letter": "C", "text": "Pegvisomant"}, {"letter": "D", "text": "Cabergoline"}], "answer": "A", "explanation": "**Surgical resection** is the most important/preferred treatment; drugs are used if needed."}], "checkpoints": [{"stem": "If surgery fails, a drug class that inhibits GH-secreting cells:", "options": [{"letter": "A", "text": "Somatostatin analogues"}, {"letter": "B", "text": "Dopamine antagonists"}, {"letter": "C", "text": "Glucocorticoids"}, {"letter": "D", "text": "Vasopressin analogues"}], "answer": "A", "explanation": "**Somatostatin analogues** (octreotide, lanreotide) inhibit GH secretion."}]}}, {"id": "37", "group": 37, "slide": 37, "section": "TSH-oma", "topic": "TSH-secreting adenoma", "skill": "Identification", "stem": "Which diagnosis is most likely in a patient with hyperthyroidism, a diffuse goiter, a nonsuppressed TSH, and headaches?", "options": [{"letter": "A", "text": "TSH-secreting adenoma"}, {"letter": "B", "text": "Secondary hypothyroidism"}, {"letter": "C", "text": "Graves' disease"}, {"letter": "D", "text": "Toxic multinodular goiter"}], "answer": "A", "explanation": "**TSH-secreting adenoma**: inappropriate TSH release refractory to feedback → hyperthyroidism, diffuse goiter, mass effects.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "In ordinary hyperthyroidism, high T4 **suppresses** TSH. A normal/high TSH means the pituitary itself is overproducing.", "stem": "In Graves' disease, TSH is…", "options": [{"letter": "A", "text": "Suppressed"}, {"letter": "B", "text": "Elevated"}, {"letter": "C", "text": "Normal"}], "answer": "A", "explanation": "Graves' = **suppressed** TSH.", "clarify": [{"stem": "Headache here suggests…", "options": [{"letter": "A", "text": "Mass effect"}, {"letter": "B", "text": "Thyroid storm"}], "answer": "A", "explanation": "Headache points to a pituitary mass."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hyperthyroid + diffuse goiter + TSH NOT suppressed + headache → Diagnosis:", "options": [{"letter": "A", "text": "TSH-secreting adenoma"}, {"letter": "B", "text": "Graves' disease"}, {"letter": "C", "text": "Secondary hypothyroidism"}, {"letter": "D", "text": "Toxic multinodular goiter"}], "answer": "A", "explanation": "**TSH-secreting adenoma**: inappropriate TSH release refractory to feedback → hyperthyroidism, diffuse goiter, mass effects."}], "checkpoints": [{"stem": "Treatment of a TSH-secreting adenoma:", "options": [{"letter": "A", "text": "Surgical resection"}, {"letter": "B", "text": "Levothyroxine"}, {"letter": "C", "text": "Cabergoline alone"}, {"letter": "D", "text": "Desmopressin"}], "answer": "A", "explanation": "**Surgical resection**, with somatostatin analogues as adjuncts."}]}}, {"id": "38", "group": 38, "slide": 38, "section": "Secondary hypothyroid monitoring", "topic": "Secondary hypothyroidism", "skill": "Management", "stem": "Which laboratory value should be monitored in a patient receiving levothyroxine for secondary hypothyroidism?", "options": [{"letter": "A", "text": "TRH"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "Reverse T3"}, {"letter": "D", "text": "Free T4"}], "answer": "D", "explanation": "TSH is low by definition in **secondary hypothyroidism**, so titrate by **free T4**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "In primary hypothyroidism you follow TSH. Here the pituitary is the broken part — its TSH can't report.", "stem": "In secondary hypothyroidism, TSH is…", "options": [{"letter": "A", "text": "Low or inappropriately normal"}, {"letter": "B", "text": "High"}, {"letter": "C", "text": "Reliable for dosing"}], "answer": "A", "explanation": "TSH is **low/inappropriately normal**.", "clarify": [{"stem": "Primary hypothyroidism is monitored with…", "options": [{"letter": "A", "text": "TSH"}, {"letter": "B", "text": "Free T4 only"}], "answer": "A", "explanation": "Primary → follow TSH."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Secondary hypothyroidism on levothyroxine → Monitor:", "options": [{"letter": "A", "text": "Free T4"}, {"letter": "B", "text": "TSH"}, {"letter": "C", "text": "TRH"}, {"letter": "D", "text": "Reverse T3"}], "answer": "A", "explanation": "TSH is low by definition in **secondary hypothyroidism**, so titrate by **free T4**."}], "checkpoints": [{"stem": "Low free T4 with low or normal TSH → Diagnosis:", "options": [{"letter": "A", "text": "Secondary hypothyroidism"}, {"letter": "B", "text": "Primary hypothyroidism"}, {"letter": "C", "text": "TSH-secreting adenoma"}, {"letter": "D", "text": "Subclinical hypothyroidism"}], "answer": "A", "explanation": "Low T4 without a TSH rise = **secondary (pituitary) hypothyroidism**."}]}}, {"id": "39", "group": 39, "slide": 39, "section": "Cushing's disease definition", "topic": "Cushing's disease", "skill": "Identification", "stem": "What term describes hypercortisolism caused by an ACTH-secreting pituitary adenoma?", "options": [{"letter": "A", "text": "Cushing's disease"}, {"letter": "B", "text": "Cushing's syndrome"}, {"letter": "C", "text": "Cushing's triad"}, {"letter": "D", "text": "Addison's disease"}], "answer": "A", "explanation": "**Cushing's DISEASE** = ACTH-secreting pituitary adenoma; Cushing's syndrome = hypercortisolism from any cause.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "\"Syndrome\" is the umbrella for any cortisol excess; \"disease\" names the one **pituitary** source.", "stem": "Cushing's syndrome includes causes such as…", "options": [{"letter": "A", "text": "Exogenous steroids"}, {"letter": "B", "text": "Only pituitary tumors"}, {"letter": "C", "text": "Low cortisol"}], "answer": "A", "explanation": "Syndrome = **any cause** including exogenous steroids.", "clarify": [{"stem": "Cushing's triad is a sign of…", "options": [{"letter": "A", "text": "Raised ICP"}, {"letter": "B", "text": "Cortisol excess"}], "answer": "A", "explanation": "Triad (bradycardia, resp depression, HTN) = ↑ICP."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "ACTH-secreting pituitary adenoma causing hypercortisolism → Term:", "options": [{"letter": "A", "text": "Cushing's disease"}, {"letter": "B", "text": "Cushing's syndrome"}, {"letter": "C", "text": "Cushing's triad"}, {"letter": "D", "text": "Addison's disease"}], "answer": "A", "explanation": "**Cushing's DISEASE** = ACTH-secreting pituitary adenoma; Cushing's syndrome = hypercortisolism from any cause."}], "checkpoints": [{"stem": "In Cushing's disease, ACTH is…", "options": [{"letter": "A", "text": "Elevated or inappropriately normal"}, {"letter": "B", "text": "Suppressed"}, {"letter": "C", "text": "Undetectable"}, {"letter": "D", "text": "Always normal"}], "answer": "A", "explanation": "Pituitary source → ACTH **elevated/inappropriately normal**."}]}}, {"id": "40", "group": 40, "slide": 39, "section": "Cushing's disease treatment", "topic": "Cushing's disease", "skill": "Management", "stem": "What is the first-line treatment for Cushing disease?", "options": [{"letter": "A", "text": "Pituitary tumor resection"}, {"letter": "B", "text": "Ketoconazole"}, {"letter": "C", "text": "Radiation therapy"}, {"letter": "D", "text": "Bilateral adrenalectomy"}], "answer": "A", "explanation": "**Removal of the pituitary tumor** first; radiation, bilateral adrenalectomy, or medications if it fails.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Like other non-prolactin secretory tumors, treat the **source** surgically first.", "stem": "First-line management of a secretory non-prolactin pituitary tumor is…", "options": [{"letter": "A", "text": "Surgery"}, {"letter": "B", "text": "Medication"}, {"letter": "C", "text": "Observation"}], "answer": "A", "explanation": "**Surgery** first.", "clarify": [{"stem": "Bilateral adrenalectomy is…", "options": [{"letter": "A", "text": "A backup option"}, {"letter": "B", "text": "First-line"}], "answer": "A", "explanation": "Adrenalectomy is reserved for failure."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Cushing's disease → First-line treatment:", "options": [{"letter": "A", "text": "Pituitary tumor resection"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Ketoconazole"}, {"letter": "D", "text": "Radiation therapy"}], "answer": "A", "explanation": "**Removal of the pituitary tumor** first; radiation, bilateral adrenalectomy, or medications if it fails."}], "checkpoints": [{"stem": "Cushing's disease features: central obesity, moon facies, plethora, and…", "options": [{"letter": "A", "text": "Dorsocervical fat pad"}, {"letter": "B", "text": "Prognathism"}, {"letter": "C", "text": "Acral enlargement"}, {"letter": "D", "text": "Galactorrhea"}], "answer": "A", "explanation": "Hypercortisolemia → **dorsocervical fat pad** (buffalo hump), HTN, weakness, glucose intolerance."}]}}, {"id": "41", "group": 41, "slide": 40, "section": "Incidentaloma", "topic": "Pituitary incidentaloma", "skill": "Identification", "stem": "What term describes an unsuspected pituitary lesion discovered on MRI performed after head trauma?", "options": [{"letter": "A", "text": "Pituitary incidentaloma"}, {"letter": "B", "text": "Craniopharyngioma"}, {"letter": "C", "text": "Pituitary apoplexy"}, {"letter": "D", "text": "Microprolactinoma"}], "answer": "A", "explanation": "**Incidentaloma** = an unsuspected lesion found on imaging done for another reason (4–20% CT, 10–38% MRI).", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The key word is **unsuspected** — the scan wasn't ordered for pituitary symptoms.", "stem": "An incidentaloma is discovered…", "options": [{"letter": "A", "text": "By chance on imaging"}, {"letter": "B", "text": "Because of symptoms"}, {"letter": "C", "text": "At autopsy only"}], "answer": "A", "explanation": "Found **by chance**.", "clarify": [{"stem": "Are all incidentalomas adenomas?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "They may be cysts, hyperplasia, or old infarct/hemorrhage."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "MRI after head trauma reveals an unsuspected pituitary lesion → Term:", "options": [{"letter": "A", "text": "Pituitary incidentaloma"}, {"letter": "B", "text": "Pituitary apoplexy"}, {"letter": "C", "text": "Craniopharyngioma"}, {"letter": "D", "text": "Microprolactinoma"}], "answer": "A", "explanation": "**Incidentaloma** = an unsuspected lesion found on imaging done for another reason (4–20% CT, 10–38% MRI)."}], "checkpoints": [{"stem": "Two questions to ask about a pituitary incidentaloma:", "options": [{"letter": "A", "text": "Is it functional? Mass effect?"}, {"letter": "B", "text": "Is it malignant? Metastatic?"}, {"letter": "C", "text": "Is it infected? Calcified?"}, {"letter": "D", "text": "Is it congenital? Familial?"}], "answer": "A", "explanation": "Evaluate for **hormone function** and **mass effect** (size, visual fields)."}]}}, {"id": "42", "group": 42, "slide": 41, "section": "ADH origin", "topic": "Pituitary anatomy & physiology", "skill": "Disease process", "stem": "Where is antidiuretic hormone, also called vasopressin, synthesized?", "options": [{"letter": "A", "text": "Kidney"}, {"letter": "B", "text": "Anterior pituitary"}, {"letter": "C", "text": "Hypothalamus"}, {"letter": "D", "text": "Posterior pituitary"}], "answer": "C", "explanation": "ADH is **made in the hypothalamus** and stored/released from the posterior pituitary.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The posterior pituitary is a **storage** site, not a factory.", "stem": "The posterior pituitary is best described as a…", "options": [{"letter": "A", "text": "Storage/release site"}, {"letter": "B", "text": "Hormone factory"}, {"letter": "C", "text": "Target organ"}], "answer": "A", "explanation": "It **stores and releases**.", "clarify": [{"stem": "The kidney is ADH's…", "options": [{"letter": "A", "text": "Target"}, {"letter": "B", "text": "Source"}], "answer": "A", "explanation": "ADH acts on the kidney to concentrate urine."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Site where ADH (vasopressin) is MADE → Site:", "options": [{"letter": "A", "text": "Hypothalamus"}, {"letter": "B", "text": "Posterior pituitary"}, {"letter": "C", "text": "Anterior pituitary"}, {"letter": "D", "text": "Kidney"}], "answer": "A", "explanation": "ADH is **made in the hypothalamus** and stored/released from the posterior pituitary."}], "checkpoints": [{"stem": "Higher plasma ADH makes urine…", "options": [{"letter": "A", "text": "More concentrated"}, {"letter": "B", "text": "More dilute"}, {"letter": "C", "text": "Higher volume"}, {"letter": "D", "text": "Glucose-positive"}], "answer": "A", "explanation": "↑ADH → **concentrated**, lower-volume urine."}]}}, {"id": "43", "group": 43, "slide": 43, "section": "DI recognition", "topic": "Diabetes insipidus", "skill": "Identification", "stem": "Which diagnosis is most likely in a patient with urine output greater than 3 L/day, intense thirst, very dilute urine, and normal glucose?", "options": [{"letter": "A", "text": "Cushing's disease"}, {"letter": "B", "text": "SIADH"}, {"letter": "C", "text": "Diabetes insipidus"}, {"letter": "D", "text": "Diabetes mellitus"}], "answer": "C", "explanation": "**Diabetes insipidus** = ADH deficiency/resistance → large volumes of dilute urine (>3 L/day) with polydipsia.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Normal glucose rules out osmotic diuresis. Large volumes of **dilute** urine mean the kidney isn't concentrating.", "stem": "Dilute polyuria reflects a problem with…", "options": [{"letter": "A", "text": "ADH"}, {"letter": "B", "text": "Insulin"}, {"letter": "C", "text": "Aldosterone"}], "answer": "A", "explanation": "**ADH** concentrates urine.", "clarify": [{"stem": "SIADH causes urine that is…", "options": [{"letter": "A", "text": "Concentrated"}, {"letter": "B", "text": "Dilute"}], "answer": "A", "explanation": "SIADH = concentrated urine, low output."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Polyuria >3 L/day, intense thirst, very dilute urine, normal glucose → Diagnosis:", "options": [{"letter": "A", "text": "Diabetes insipidus"}, {"letter": "B", "text": "Diabetes mellitus"}, {"letter": "C", "text": "SIADH"}, {"letter": "D", "text": "Cushing's disease"}], "answer": "A", "explanation": "**Diabetes insipidus** = ADH deficiency/resistance → large volumes of dilute urine (>3 L/day) with polydipsia."}], "checkpoints": [{"stem": "Polyuria threshold that defines DI:", "options": [{"letter": "A", "text": ">3 L/day"}, {"letter": "B", "text": ">1 L/day"}, {"letter": "C", "text": ">10 L/day"}, {"letter": "D", "text": ">500 mL/day"}], "answer": "A", "explanation": "Polyuria = **>3 L/24 h** (normal 1–2 L/day)."}]}}, {"id": "44", "group": 44, "slide": 43, "section": "DI sodium", "topic": "Diabetes insipidus", "skill": "Disease process", "stem": "What serum sodium level is typically expected in a patient with diabetes insipidus who has unrestricted access to water?", "options": [{"letter": "A", "text": "Mildly low"}, {"letter": "B", "text": "Severely low"}, {"letter": "C", "text": "Normal to mildly elevated"}, {"letter": "D", "text": "Severely elevated"}], "answer": "C", "explanation": "Thirst drives constant water replacement, so **Na⁺ is usually only mildly elevated**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "The patient is losing free water but **drinking it back** because of severe thirst.", "stem": "If thirst and water access are intact, water losses are…", "options": [{"letter": "A", "text": "Largely replaced"}, {"letter": "B", "text": "Unreplaced"}, {"letter": "C", "text": "Doubled"}], "answer": "A", "explanation": "Losses are **replaced**.", "clarify": [{"stem": "Low sodium with concentrated urine fits…", "options": [{"letter": "A", "text": "SIADH"}, {"letter": "B", "text": "DI"}], "answer": "A", "explanation": "Hyponatremia = SIADH picture."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "DI patient with free access to water → Serum sodium usually:", "options": [{"letter": "A", "text": "Normal to mildly elevated"}, {"letter": "B", "text": "Severely elevated"}, {"letter": "C", "text": "Mildly low"}, {"letter": "D", "text": "Severely low"}], "answer": "A", "explanation": "Thirst drives constant water replacement, so **Na⁺ is usually only mildly elevated**."}], "checkpoints": [{"stem": "If a DI patient's water access is restricted, the danger is…", "options": [{"letter": "A", "text": "Rapid dehydration / hypernatremia"}, {"letter": "B", "text": "Hyponatremia"}, {"letter": "C", "text": "Fluid overload"}, {"letter": "D", "text": "Hypoglycemia"}], "answer": "A", "explanation": "Without water, **dehydration and hypernatremia** develop quickly."}]}}, {"id": "45", "group": 45, "slide": 44, "section": "DI urine pattern", "topic": "Diabetes insipidus", "skill": "Diagnostics & imaging", "stem": "What urine laboratory pattern supports a diagnosis of diabetes insipidus?", "options": [{"letter": "A", "text": "SG <1.005, Uosm <300"}, {"letter": "B", "text": "SG 1.020, Uosm 500"}, {"letter": "C", "text": "Glucosuria, Uosm >300"}, {"letter": "D", "text": "SG >1.030, Uosm >600"}], "answer": "A", "explanation": "DI: **urine SG <1.005, Uosm <300 mOsm/kg**, with plasma osmolality generally >287.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Without ADH the urine is **very dilute** — low specific gravity and low osmolality.", "stem": "Urine in DI is…", "options": [{"letter": "A", "text": "Dilute"}, {"letter": "B", "text": "Concentrated"}, {"letter": "C", "text": "Glucose-rich"}], "answer": "A", "explanation": "**Dilute**.", "clarify": [{"stem": "Glucosuria would suggest…", "options": [{"letter": "A", "text": "Diabetes mellitus"}, {"letter": "B", "text": "Diabetes insipidus"}], "answer": "A", "explanation": "Glucose in urine = DM."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Lab pattern supporting DI → Urine:", "options": [{"letter": "A", "text": "SG <1.005, Uosm <300"}, {"letter": "B", "text": "SG >1.030, Uosm >600"}, {"letter": "C", "text": "SG 1.020, Uosm 500"}, {"letter": "D", "text": "Glucosuria, Uosm >300"}], "answer": "A", "explanation": "DI: **urine SG <1.005, Uosm <300 mOsm/kg**, with plasma osmolality generally >287."}], "checkpoints": [{"stem": "Plasma osmolality typical of DI:", "options": [{"letter": "A", "text": ">287 mOsm/kg"}, {"letter": "B", "text": "<250 mOsm/kg"}, {"letter": "C", "text": "<270 mOsm/kg"}, {"letter": "D", "text": "Exactly 280 mOsm/kg"}], "answer": "A", "explanation": "Free-water loss concentrates plasma → **Posm generally >287**."}]}}, {"id": "46", "group": 46, "slide": 45, "section": "Water deprivation", "topic": "Diabetes insipidus", "skill": "Diagnostics & imaging", "stem": "What test should be performed next after hypotonic polyuria is confirmed?", "options": [{"letter": "A", "text": "Insulin tolerance test"}, {"letter": "B", "text": "Oral glucose suppression"}, {"letter": "C", "text": "Dexamethasone suppression"}, {"letter": "D", "text": "Water deprivation test"}], "answer": "D", "explanation": "**Water deprivation test**: normally dehydration → ADH → concentrated urine; in DI urine stays dilute.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "You challenge the system with **dehydration** to see if the body can concentrate urine.", "stem": "With intact ADH and kidneys, dehydration makes urine…", "options": [{"letter": "A", "text": "Concentrate"}, {"letter": "B", "text": "Stay dilute"}, {"letter": "C", "text": "Contain glucose"}], "answer": "A", "explanation": "Urine **concentrates**.", "clarify": [{"stem": "When to stop the test?", "options": [{"letter": "A", "text": "Hypotension or >3% weight loss"}, {"letter": "B", "text": "After 10 minutes"}], "answer": "A", "explanation": "Stop for hypotension, syncope, >3% body-weight loss."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Hypotonic polyuria confirmed → Next test:", "options": [{"letter": "A", "text": "Water deprivation test"}, {"letter": "B", "text": "Oral glucose suppression"}, {"letter": "C", "text": "Insulin tolerance test"}, {"letter": "D", "text": "Dexamethasone suppression"}], "answer": "A", "explanation": "**Water deprivation test**: normally dehydration → ADH → concentrated urine; in DI urine stays dilute."}], "checkpoints": [{"stem": "After water deprivation confirms DI, the next step to separate central from nephrogenic:", "options": [{"letter": "A", "text": "Desmopressin trial"}, {"letter": "B", "text": "Pituitary biopsy"}, {"letter": "C", "text": "Hypertonic saline"}, {"letter": "D", "text": "Oral glucose load"}], "answer": "A", "explanation": "A **desmopressin trial** distinguishes central (responds) from nephrogenic (doesn't)."}]}}, {"id": "47", "group": 47, "slide": 45, "section": "Central vs nephrogenic", "topic": "Diabetes insipidus", "skill": "Diagnostics & imaging", "stem": "Which diagnosis is indicated when urine remains dilute during water deprivation but concentrates after desmopressin administration?", "options": [{"letter": "A", "text": "Central DI"}, {"letter": "B", "text": "Nephrogenic DI"}, {"letter": "C", "text": "SIADH"}, {"letter": "D", "text": "Primary polydipsia"}], "answer": "A", "explanation": "Response to **desmopressin** = kidneys work, ADH is missing = **central DI**.", "objective": "", "bg": "#fff4e0", "remediation": {"steps": [{"teach": "Desmopressin is synthetic ADH. If giving it fixes the urine, the patient was **lacking** ADH.", "stem": "If the kidney responds to synthetic ADH, the kidney is…", "options": [{"letter": "A", "text": "Working"}, {"letter": "B", "text": "Resistant"}, {"letter": "C", "text": "Failed"}], "answer": "A", "explanation": "The kidney is **working**; the source is deficient.", "clarify": [{"stem": "Primary polydipsia patients concentrate urine with deprivation?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "Their ADH axis is intact, so they concentrate."}]}, {"teach": "Now back to the original question with that in mind.", "stem": "Urine stays dilute with deprivation, then concentrates after desmopressin → Diagnosis:", "options": [{"letter": "A", "text": "Central DI"}, {"letter": "B", "text": "Nephrogenic DI"}, {"letter": "C", "text": "Primary polydipsia"}, {"letter": "D", "text": "SIADH"}], "answer": "A", "explanation": "Response to **desmopressin** = kidneys work, ADH is missing = **central DI**."}], "checkpoints": [{"stem": "Urine stays dilute and does NOT respond to desmopressin → Diagnosis:", "options": [{"letter": "A", "text": "Nephrogenic DI"}, {"letter": "B", "text": "Central DI"}, {"letter": "C", "text": "Primary polydipsia"}, {"l (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.

  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;

  }

    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(q.answer) + '. ' + fmt(optText(q, q.answer)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });
    pushCheckpoint(q, t);
  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);
    }
  }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong without a pathway, or its pathway has finished.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (answers[q.id] === q.answer || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';
    t.trail.forEach((n, i) => { html += nodeHtml(q, n, i, interactive); });
    html += '</div>';
    return html;
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + fmt(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const wrong = answered && chosen !== q.answer;
    const tutoring = wrong && hasTutor(q);
    const t = tutor[q.id];
    // While the pathway is still in its teaching steps (exam mode), the correct answer stays hidden
    const hideKey = mode === 'exam' && tutoring && t && t.phase === 'steps';
    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Mastered after review</span>';
    else if (status === 'review') html += '<span class="badge review">Flagged for review</span>';
    else if (status === 'active') html += '<span class="badge active">Guided review in progress</span>';
    html += '<div class="stem">' + fmt(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === chosen) cls += chosen === q.answer ? ' correct' : ' incorrect';
        else if (o.letter === q.answer && !hideKey) cls += ' correct';
        else if (!hideKey) cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];
    const _bl = document.getElementById('bglayer');
    if (_bl) _bl.style.display = EXAM_DATA.bgImage ? 'block' : 'none';

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          answers[qid] = btn.getAttribute('data-letter');
          if (answers[qid] !== q.answer && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (answers[q.id] === q.answer) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (answers[q.id] === q.answer) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    document.body.style.backgroundColor = '';
    { const _bl = document.getElementById('bglayer'); if (_bl) _bl.style.display = 'none'; }
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    document.body.style.backgroundColor = '';
    { const _bl = document.getElementById('bglayer'); if (_bl) _bl.style.display = 'none'; }
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer: ' + q.answer + '. ' + plain(optText(q, q.answer)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  { const _bl = document.getElementById('bglayer'); if (_bl && EXAM_DATA.bgImage) _bl.style.backgroundImage = 'url(' + EXAM_DATA.bgImage + ')'; }
  renderPage();
})();
</script>
</body>
