-sign** poikiloderma, mechanic's hands, nailfold changes. Keratoderma blennorrhagicum = reactive arthritis; pathergy = Behçet.", "objective": "", "remediation": {"steps": [{"teach": "**DM = PM + skin**; the most specific lesion sits over the finger joints.", "stem": "Papules over the MCP/PIP/DIP joints in myositis are:", "options": [{"letter": "A", "text": "Gottron papules"}, {"letter": "B", "text": "Discoid plaques"}], "answer": "A", "explanation": "Gottron papules are highly specific for DM.", "clarify": [{"stem": "Gottron papules are considered:", "options": [{"letter": "A", "text": "Highly specific for DM"}, {"letter": "B", "text": "Nonspecific"}], "answer": "A", "explanation": "Highly specific."}]}, {"teach": "A violaceous rash sits on the **upper eyelids**.", "stem": "Violaceous upper-eyelid rash in myositis:", "options": [{"letter": "A", "text": "Heliotrope rash"}, {"letter": "B", "text": "Malar rash"}, {"letter": "C", "text": "Discoid rash"}], "answer": "A", "explanation": "Heliotrope rash = upper eyelids; malar rash = cheeks sparing nasolabial folds."}, {"teach": "Photodistributed poikiloderma over the upper back and chest has shape-based names; the two wrong options belong to **reactive arthritis** and **Behçet**.", "stem": "Which belongs to dermatomyositis rather than reactive arthritis?", "options": [{"letter": "A", "text": "Shawl sign"}, {"letter": "B", "text": "Keratoderma blennorrhagicum"}], "answer": "A", "explanation": "Shawl sign and V-sign are DM poikiloderma; keratoderma blennorrhagicum is reactive arthritis.", "clarify": [{"stem": "The pathergy test belongs to:", "options": [{"letter": "A", "text": "Behçet"}, {"letter": "B", "text": "Dermatomyositis"}], "answer": "A", "explanation": "Pathergy = Behçet."}]}], "checkpoints": [{"stem": "Which DM hand finding describes rough, cracked fingertip skin?", "options": [{"letter": "A", "text": "Mechanic's hands"}, {"letter": "B", "text": "Sclerodactyly"}, {"letter": "C", "text": "Dactylitis"}, {"letter": "D", "text": "Telescoping digits"}], "answer": "A", "explanation": "Mechanic's hands = DM; sclerodactyly = SSc; dactylitis = SpA; telescoping = PsA."}, {"stem": "Cancer prevalence taught for dermatomyositis:", "options": [{"letter": "A", "text": "15–20%"}, {"letter": "B", "text": "7–10%"}, {"letter": "C", "text": "<1%"}, {"letter": "D", "text": "50%"}], "answer": "A", "explanation": "DM 15–20%, PM 7–10% → evaluate for malignancy."}]}, "multi": true, "answers": ["A", "B", "C"], "answer": "A,B,C"}, {"id": "21", "group": 21, "section": "Lupus subcategories", "topic": "Antiphospholipid syndrome (APS)", "skill": "Counseling & prevention", "stem": "Which statement about anticoagulation in antiphospholipid syndrome is correct?", "options": [{"letter": "A", "text": "Use heparin in pregnancy; warfarin is teratogenic"}, {"letter": "B", "text": "DOACs are preferred for severe disease"}, {"letter": "C", "text": "Anticoagulation is stopped once the PTT normalizes"}, {"letter": "D", "text": "Hydroxychloroquine replaces anticoagulation"}, {"letter": "E", "text": "Warfarin is first-line during pregnancy"}], "explanation": "APS: **LMWH → long-term warfarin**; DOAC only in mild disease; **warfarin is teratogenic — use heparin in pregnancy**; consider adding hydroxychloroquine; treat the underlying disease.", "objective": "", "remediation": {"steps": [{"teach": "APS is a **hypercoagulable** state, so the treatment is anticoagulation, not immunosuppression.", "stem": "Mainstay of APS treatment:", "options": [{"letter": "A", "text": "Anticoagulation"}, {"letter": "B", "text": "High-dose steroids"}], "answer": "A", "explanation": "Anticoagulate.", "clarify": [{"stem": "Initial then long-term agents:", "options": [{"letter": "A", "text": "LMWH then warfarin"}, {"letter": "B", "text": "Warfarin then LMWH"}], "answer": "A", "explanation": "LMWH → warfarin long term."}]}, {"teach": "DOACs have a **narrow role**.", "stem": "When may a DOAC be used in APS?", "options": [{"letter": "A", "text": "Mild disease only"}, {"letter": "B", "text": "All severe cases"}], "answer": "A", "explanation": "DOAC only in mild disease."}, {"teach": "Pregnancy changes the long-term agent because of **fetal harm**.", "stem": "Anticoagulant for pregnant APS patients:", "options": [{"letter": "A", "text": "Heparin"}, {"letter": "B", "text": "Warfarin"}, {"letter": "C", "text": "DOAC"}], "answer": "A", "explanation": "Warfarin is teratogenic — use heparin in pregnancy."}], "checkpoints": [{"stem": "Adjunct worth adding in APS per lecture:", "options": [{"letter": "A", "text": "Hydroxychloroquine"}, {"letter": "B", "text": "Colchicine"}, {"letter": "C", "text": "Pilocarpine"}, {"letter": "D", "text": "Nintedanib"}], "answer": "A", "explanation": "Consider adding hydroxychloroquine and treat the underlying disease."}, {"stem": "Pregnancy morbidity criteria of APS include:", "options": [{"letter": "A", "text": "Fetal death after 10 weeks' gestation"}, {"letter": "B", "text": "Gestational diabetes mellitus"}, {"letter": "C", "text": "Postpartum hemorrhage after delivery"}, {"letter": "D", "text": "Breech presentation at term"}], "answer": "A", "explanation": "Fetal death >10 wk, prematurity, placental insufficiency, recurrent loss <10 wk, pre-eclampsia <34 wk."}]}, "answer": "A"}, {"id": "22", "group": 22, "section": "Vasculitis", "topic": "Polyarteritis nodosa (PAN)", "skill": "Disease process", "stem": "Which finding argues AGAINST a diagnosis of polyarteritis nodosa?", "options": [{"letter": "A", "text": "Hepatitis B infection"}, {"letter": "B", "text": "Mononeuritis multiplex"}, {"letter": "C", "text": "Glomerulonephritis"}, {"letter": "D", "text": "Abdominal angina"}, {"letter": "E", "text": "Mesenteric microaneurysms"}], "explanation": "PAN is a **medium-vessel** vasculitis that **spares the lungs and does not cause glomerulonephritis** — a pulmonary-renal syndrome is NOT PAN; **hepatitis B** association, abdominal angina, HTN, mononeuritis multiplex, livedo; dx by **biopsy or mesenteric angiography**.", "objective": "", "remediation": {"steps": [{"teach": "PAN is the prototypical **medium-vessel** vasculitis, with a viral association.", "stem": "Which infection is associated with PAN?", "options": [{"letter": "A", "text": "Hepatitis B"}, {"letter": "B", "text": "Chlamydia"}], "answer": "A", "explanation": "Hepatitis B (and HIV).", "clarify": [{"stem": "Vessel size in PAN:", "options": [{"letter": "A", "text": "Medium"}, {"letter": "B", "text": "Small"}], "answer": "A", "explanation": "Medium-vessel, with Kawasaki."}]}, {"teach": "Medium-vessel disease produces **organ ischemia** — gut, nerve, kidney vessels — rather than glomerular inflammation.", "stem": "Postprandial abdominal pain from mesenteric ischemia in PAN is called:", "options": [{"letter": "A", "text": "Abdominal angina"}, {"letter": "B", "text": "Watermelon stomach"}, {"letter": "C", "text": "Gastroparesis"}], "answer": "A", "explanation": "Abdominal angina; watermelon stomach and gastroparesis are scleroderma."}, {"teach": "Two organ patterns are **absent** in PAN and point to small-vessel ANCA vasculitis instead.", "stem": "A pulmonary-renal syndrome with GN suggests:", "options": [{"letter": "A", "text": "ANCA vasculitis (GPA/MPA), not PAN"}, {"letter": "B", "text": "PAN"}], "answer": "A", "explanation": "PAN spares the lungs and does not cause GN."}], "checkpoints": [{"stem": "Diagnostic study showing microaneurysms in PAN:", "options": [{"letter": "A", "text": "Mesenteric angiography"}, {"letter": "B", "text": "Temporal artery biopsy"}, {"letter": "C", "text": "SI joint MRI"}, {"letter": "D", "text": "Nailfold capillaroscopy"}], "answer": "A", "explanation": "Biopsy of involved tissue or mesenteric angiography (microaneurysms)."}, {"stem": "Beyond steroids and cyclophosphamide, PAN treatment includes:", "options": [{"letter": "A", "text": "Treating hepatitis B"}, {"letter": "B", "text": "IL-17 blockade"}, {"letter": "C", "text": "Pilocarpine"}, {"letter": "D", "text": "Apremilast"}], "answer": "A", "explanation": "Treat hep B; plasmapheresis also listed."}]}, "answer": "C"}, {"id": "23", "group": 23, "section": "SLE diagnostics", "topic": "Systemic lupus erythematosus", "skill": "Diagnostics & imaging", "stem": "Which statement about ANA testing in lupus is correct?", "options": [{"letter": "A", "text": "ANA titer rises and falls with disease activity"}, {"letter": "B", "text": "ANA titer does not correlate with disease activity"}, {"letter": "C", "text": "A negative ANA rules out only about half of lupus cases"}, {"letter": "D", "text": "ANA is highly specific but poorly sensitive for lupus"}, {"letter": "E", "text": "A titer of 1:40 is already considered significant"}], "explanation": "ANA is **99% sensitive, poorly specific**; reported as titer + pattern; **>1:160 significant**; higher titer = more antibody but **does not correlate with activity**; negative ANA rules out 99% (SNOUT).", "objective": "", "remediation": {"steps": [{"teach": "ANA is reported as a **titer** (dilution) and a **pattern**.", "stem": "Titers start at 1:40 and double; which titer is considered significant?", "options": [{"letter": "A", "text": ">1:160"}, {"letter": "B", "text": "1:40"}], "answer": "A", "explanation": ">1:160 is significant.", "clarify": [{"stem": "Which ANA pattern is linked to lupus and Sjögren?", "options": [{"letter": "A", "text": "Speckled"}, {"letter": "B", "text": "Nucleolar"}], "answer": "A", "explanation": "Speckled = lupus, Sjögren."}]}, {"teach": "ANA's strength is catching disease, not confirming it.", "stem": "ANA is best described as:", "options": [{"letter": "A", "text": "Very sensitive, poorly specific"}, {"letter": "B", "text": "Very specific, poorly sensitive"}], "answer": "A", "explanation": "99% sensitive, poor specificity."}, {"teach": "A higher titer means more antibody — but **not** more active disease.", "stem": "Does ANA titer track lupus activity?", "options": [{"letter": "A", "text": "No"}, {"letter": "B", "text": "Yes"}], "answer": "A", "explanation": "Titer does not correlate with activity; anti-dsDNA does."}], "checkpoints": [{"stem": "Which test IS used to follow lupus activity?", "options": [{"letter": "A", "text": "Anti-dsDNA with C3/C4"}, {"letter": "B", "text": "ANA titer"}, {"letter": "C", "text": "Anti-Smith"}, {"letter": "D", "text": "HLA-B27"}], "answer": "A", "explanation": "Anti-dsDNA correlates with activity; falling C3/C4 adds prognosis."}, {"stem": "Positive ANA → next step:", "options": [{"letter": "A", "text": "Run the ANA antibody panel"}, {"letter": "B", "text": "Repeat the ANA in six months"}, {"letter": "C", "text": "Perform temporal artery biopsy"}, {"letter": "D", "text": "Begin cyclophosphamide induction"}], "answer": "A", "explanation": "Positive ANA → panel: dsDNA, Smith, SSA/SSB, RNP, histone, centromere, Scl-70, Jo-1."}]}, "answer": "B"}, {"id": "24", "group": 24, "section": "Seronegative spondyloarthropathies", "topic": "Reactive arthritis (Reiter syndrome)", "skill": "Identification", "stem": "Keratoderma blennorrhagicum + circinate balanitis + asymmetric oligoarthritis within 2 months of a chlamydial infection → Diagnosis:", "options": [{"letter": "A", "text": "Psoriatic arthritis"}, {"letter": "B", "text": "Reactive arthritis"}, {"letter": "C", "text": "Behçet syndrome"}, {"letter": "D", "text": "IBD-associated arthropathy"}, {"letter": "E", "text": "Ankylosing spondylitis"}], "explanation": "Reactive arthritis: **<50 y, within 2 months of GI (Salmonella, Yersinia, Campylobacter, Shigella) or GU (Chlamydia) infection**; Reiter triad **urethritis + conjunctivitis + arthritis** ('can't see, can't pee, can't climb a tree'); **keratoderma blennorrhagicum** and **circinate balanitis**.", "objective": "", "remediation": {"steps": [{"teach": "Reactive arthritis is an **immunologic reaction** to a recent infection in a patient under 50.", "stem": "Time window from infection to arthritis:", "options": [{"letter": "A", "text": "Within 2 months"}, {"letter": "B", "text": "After 2 years"}], "answer": "A", "explanation": "Develops within 2 months.", "clarify": [{"stem": "GU trigger organism:", "options": [{"letter": "A", "text": "Chlamydia"}, {"letter": "B", "text": "Salmonella"}], "answer": "A", "explanation": "Chlamydia is the GU trigger; Salmonella, Yersinia, Campylobacter, Shigella are GI triggers."}]}, {"teach": "The classic **triad** involves eye, urethra and joints.", "stem": "Reiter triad:", "options": [{"letter": "A", "text": "Urethritis, conjunctivitis, arthritis"}, {"letter": "B", "text": "Oral ulcers, genital ulcers, uveitis"}, {"letter": "C", "text": "Sinusitis, hemoptysis, glomerulonephritis"}], "answer": "A", "explanation": "Can't see, can't pee, can't climb a tree."}, {"teach": "Mucocutaneous lesions on palms/soles and glans are indistinguishable from pustular psoriasis.", "stem": "Papules/pustules with central erosion on palms and soles in reactive arthritis:", "options": [{"letter": "A", "text": "Keratoderma blennorrhagicum"}, {"letter": "B", "text": "Gottron papules"}], "answer": "A", "explanation": "Keratoderma blennorrhagicum; circinate balanitis on the glans."}], "checkpoints": [{"stem": "Treatment of reactive arthritis begins with:", "options": [{"letter": "A", "text": "Treating the infection and NSAIDs"}, {"letter": "B", "text": "IL-17 blocker monotherapy"}, {"letter": "C", "text": "Colchicine and apremilast"}, {"letter": "D", "text": "Plasma exchange and IVIG"}], "answer": "A", "explanation": "Treat active infection; NSAIDs; then methotrexate, TNF-α inhibitors."}, {"stem": "Enteric organisms that trigger reactive arthritis include:", "options": [{"letter": "A", "text": "Salmonella, Yersinia, Campylobacter"}, {"letter": "B", "text": "Hepatitis B virus and HIV"}, {"letter": "C", "text": "Epstein-Barr virus and tobacco"}, {"letter": "D", "text": "Staphylococcus aureus bacteremia"}], "answer": "A", "explanation": "GI triggers: Salmonella, Yersinia, Campylobacter, Shigella."}]}, "answer": "B"}, {"id": "25", "group": 25, "section": "Scleroderma", "topic": "Systemic sclerosis (scleroderma)", "skill": "Identification", "stem": "Which of the following characterize limited systemic sclerosis (formerly CREST)?", "options": [{"letter": "A", "text": "Anticentromere antibody positivity"}, {"letter": "B", "text": "Skin involvement distal to elbows and knees"}, {"letter": "C", "text": "Risk of pulmonary arterial hypertension"}, {"letter": "D", "text": "Anti-Scl-70 (topoisomerase) antibody"}, {"letter": "E", "text": "Early scleroderma renal crisis in the first 5 years"}], "explanation": "**Limited SSc (CREST)**: skin below elbows/knees, face and neck; **anticentromere**; **watch for PAH**. **Diffuse**: anti-Scl-70, ILD, renal crisis, worse survival.", "objective": "", "remediation": {"steps": [{"teach": "Systemic sclerosis is split by **extent of skin involvement**.", "stem": "Skin confined distal to elbows/knees plus face/neck defines:", "options": [{"letter": "A", "text": "Limited SSc"}, {"letter": "B", "text": "Diffuse SSc"}], "answer": "A", "explanation": "Limited = below elbows/knees, face, neck.", "clarify": [{"stem": "The older name for limited SSc:", "options": [{"letter": "A", "text": "CREST"}, {"letter": "B", "text": "Morphea"}], "answer": "A", "explanation": "Formerly CREST; morphea is localized scleroderma."}]}, {"teach": "Each subtype has its **own antibody**.", "stem": "Antibody of limited SSc:", "options": [{"letter": "A", "text": "Anticentromere"}, {"letter": "B", "text": "Anti-Scl-70"}, {"letter": "C", "text": "Anti-Jo-1"}], "answer": "A", "explanation": "Anticentromere = limited.", "clarify": [{"stem": "Anti-Scl-70 marks:", "options": [{"letter": "A", "text": "Diffuse SSc with ILD"}, {"letter": "B", "text": "Limited SSc"}], "answer": "A", "explanation": "Scl-70 (topoisomerase) = diffuse, ILD, decreased survival."}]}, {"teach": "Both subtypes share one pulmonary vascular threat; **ILD and renal crisis** belong to diffuse disease.", "stem": "Which complication should be watched for in limited SSc?", "options": [{"letter": "A", "text": "Pulmonary arterial hypertension"}, {"letter": "B", "text": "Scleroderma renal crisis"}], "answer": "A", "explanation": "Limited SSc → watch for PAH."}], "checkpoints": [{"stem": "Which ANA pattern corresponds to limited scleroderma?", "options": [{"letter": "A", "text": "Centromere"}, {"letter": "B", "text": "Homogeneous"}, {"letter": "C", "text": "Speckled"}, {"letter": "D", "text": "Nucleolar"}], "answer": "A", "explanation": "Centromere pattern = limited scleroderma; speckled = lupus/Sjögren."}, {"stem": "Diffuse SSc with ILD → treatment options:", "options": [{"letter": "A", "text": "MMF, nintedanib or tocilizumab"}, {"letter": "B", "text": "ACE inhibitors or ARBs alone"}, {"letter": "C", "text": "Pilocarpine or cevimeline"}, {"letter": "D", "text": "Long-term warfarin anticoagulation"}], "answer": "A", "explanation": "ILD: MMF, cyclophosphamide, rituximab, nintedanib, tocilizumab."}]}, "multi": true, "answers": ["A", "B", "C"], "answer": "A,B,C"}, {"id": "26", "group": 26, "section": "Connective tissue disorders", "topic": "Polymyalgia rheumatica (PMR)", "skill": "Complications", "stem": "Polymyalgia rheumatica with an atypical presentation or a poor response to low-dose prednisone → Consider:", "options": [{"letter": "A", "text": "Paraneoplastic process"}, {"letter": "B", "text": "Fibromyalgia"}, {"letter": "C", "text": "Rheumatoid arthritis"}, {"letter": "D", "text": "Drug-induced lupus"}, {"letter": "E", "text": "Early ankylosing spondylitis"}], "explanation": "PMR (**>60 y, shoulder/pelvic girdle AM stiffness**) **responds very well to prednisone 10–20 mg**; **atypical presentation or poor steroid response → think paraneoplastic**. 20% develop GCA.", "objective": "", "remediation": {"steps": [{"teach": "PMR is a disease of the **girdles** in older adults.", "stem": "Typical PMR age and location:", "options": [{"letter": "A", "text": ">60 y, shoulder and pelvic girdles"}, {"letter": "B", "text": "20–30 y, SI joints"}], "answer": "A", "explanation": ">60, morning stiffness of shoulder and pelvic girdles.", "clarify": [{"stem": "PMR can mimic RA but lacks:", "options": [{"letter": "A", "text": "Small-joint synovitis"}, {"letter": "B", "text": "Elevated ESR"}], "answer": "A", "explanation": "No synovitis of small joints."}]}, {"teach": "The response to low-dose steroids is **dramatic** — so much so that a weak response is a red flag.", "stem": "Expected response of PMR to prednisone 10–20 mg:", "options": [{"letter": "A", "text": "Very good"}, {"letter": "B", "text": "Minimal"}], "answer": "A", "explanation": "Responds very well."}, {"teach": "A non-responder should prompt a search for a **hidden process**.", "stem": "Poor steroid response in PMR → consider:", "options": [{"letter": "A", "text": "Paraneoplastic process"}, {"letter": "B", "text": "Drug-induced lupus"}], "answer": "A", "explanation": "Atypical presentation or poor steroid response → paraneoplastic."}], "checkpoints": [{"stem": "What percentage of PMR patients develop GCA?", "options": [{"letter": "A", "text": "20%"}, {"letter": "B", "text": "90%"}, {"letter": "C", "text": "<1%"}, {"letter": "D", "text": "50%"}], "answer": "A", "explanation": "20% of PMR → GCA; 40–50% of GCA have PMR."}, {"stem": "ESR in PMR:", "options": [{"letter": "A", "text": "Usually high; normal in up to 5%"}, {"letter": "B", "text": "Normal in the majority of patients"}, {"letter": "C", "text": "Elevated in every single patient"}, {"letter": "D", "text": "Not part of the PMR evaluation"}], "answer": "A", "explanation": "ESR usually elevated, normal in up to 5%."}]}, "answer": "A"}, {"id": "27", "group": 27, "section": "Lupus subcategories", "topic": "Subacute cutaneous lupus (SCLE)", "skill": "Identification", "stem": "Annular or psoriasiform rash on sun-exposed skin, ANA negative but anti-SSA (Ro) positive, possibly triggered by a calcium channel blocker → Diagnosis:", "options": [{"letter": "A", "text": "Discoid lupus"}, {"letter": "B", "text": "Subacute cutaneous lupus (SCLE)"}, {"letter": "C", "text": "Drug-induced lupus"}, {"letter": "D", "text": "Superficial fungal (tinea) infection"}, {"letter": "E", "text": "Dermatomyositis"}], "explanation": "SCLE: annular/psoriasiform photodistributed rash mimicking fungal infection or psoriasis; **ANA may be negative but anti-SSA (Ro) is positive**; associated with **calcium channel blockers**. ANA-negative suspected lupus → consider SCLE, check SSA.", "objective": "", "remediation": {"steps": [{"teach": "SCLE is a **cutaneous lupus subtype** with a distinctive rash morphology.", "stem": "SCLE rash morphology:", "options": [{"letter": "A", "text": "Annular or psoriasiform, sun-exposed"}, {"letter": "B", "text": "Scarring plaques in the ears"}], "answer": "A", "explanation": "Annular/psoriasiform on sun-exposed skin; scarring ear plaques are discoid lupus.", "clarify": [{"stem": "SCLE can mimic:", "options": [{"letter": "A", "text": "Fungal infection or psoriasis"}, {"letter": "B", "text": "Cellulitis"}], "answer": "A", "explanation": "It can look like a fungal infection or psoriasis."}]}, {"teach": "Its serology is the exception to 'negative ANA rules out lupus'.", "stem": "Antibody positive in SCLE even when ANA is negative:", "options": [{"letter": "A", "text": "Anti-SSA (Ro)"}, {"letter": "B", "text": "Anti-histone"}, {"letter": "C", "text": "Anti-Smith"}], "answer": "A", "explanation": "Anti-SSA (Ro) — also ANA-negative lupus, Sjögren, neonatal heart block."}, {"teach": "A **cardiovascular drug class** is linked.", "stem": "Drug class associated with SCLE:", "options": [{"letter": "A", "text": "Calcium channel blockers"}, {"letter": "B", "text": "TNF-α inhibitors"}], "answer": "A", "explanation": "CCBs are associated with SCLE; TNF blockers cause dsDNA-positive DILE."}], "checkpoints": [{"stem": "Anti-SSA (Ro) is also associated with:", "options": [{"letter": "A", "text": "Sjögren and neonatal heart block"}, {"letter": "B", "text": "GPA and MPA"}, {"letter": "C", "text": "Diffuse SSc and ILD"}, {"letter": "D", "text": "Behçet syndrome"}], "answer": "A", "explanation": "SSA = Sjögren, SCLE, ANA-negative lupus, neonatal lupus/fetal heart block."}, {"stem": "ANA negative in suspected lupus → what fraction is ruled out?", "options": [{"letter": "A", "text": "99%"}, {"letter": "B", "text": "50%"}, {"letter": "C", "text": "10%"}, {"letter": "D", "text": "0%"}], "answer": "A", "explanation": "Negative ANA rules out 99% — then consider SCLE and check SSA."}]}, "answer": "B"}, {"id": "28", "group": 28, "section": "Seronegative spondyloarthropathies", "topic": "Ankylosing spondylitis", "skill": "Pharmacology", "stem": "Which biologic class should be avoided in a spondyloarthritis patient who also has inflammatory bowel disease?", "options": [{"letter": "A", "text": "TNF-α inhibitors"}, {"letter": "B", "text": "IL-17 inhibitors"}, {"letter": "C", "text": "IL-23 inhibitors"}, {"letter": "D", "text": "JAK inhibitors"}, {"letter": "E", "text": "IL-12/23 inhibitors"}], "explanation": "**IL-17 blockers (secukinumab, ixekizumab, bimekizumab) can worsen or unmask IBD** — never with IBD; TNF blockers, IL-23, IL-12/23 and JAK inhibitors are acceptable for IBD-associated disease.", "objective": "", "remediation": {"steps": [{"teach": "Biologic choice in SpA depends on **all active domains** (axial, peripheral, skin, uveitis, IBD).", "stem": "Which coexisting condition most changes biologic choice?", "options": [{"letter": "A", "text": "Inflammatory bowel disease"}, {"letter": "B", "text": "Nail pitting"}], "answer": "A", "explanation": "IBD rules out one class."}, {"teach": "One cytokine blocker **unmasks or worsens** bowel inflammation.", "stem": "Which class can worsen IBD?", "options": [{"letter": "A", "text": "IL-17 inhibitors"}, {"letter": "B", "text": "IL-23 inhibitors"}, {"letter": "C", "text": "TNF inhibitors"}], "answer": "A", "explanation": "IL-17 blockers can worsen/unmask IBD.", "clarify": [{"stem": "Example IL-17 blockers:", "options": [{"letter": "A", "text": "Secukinumab, ixekizumab, bimekizumab"}, {"letter": "B", "text": "Adalimumab, infliximab"}], "answer": "A", "explanation": "Cosentyx, Taltz, Bimzelx are IL-17 blockers; Humira/Remicade are TNF blockers."}]}, {"teach": "The remaining classes are the **safe picks** when IBD is present.", "stem": "AS patient with IBD needing a biologic → choose:", "options": [{"letter": "A", "text": "TNF blocker"}, {"letter": "B", "text": "IL-17 blocker"}], "answer": "A", "explanation": "TNF blocker — not IL-17."}], "checkpoints": [{"stem": "Which IL-23 inhibitors are listed for IBD-associated arthropathy?", "options": [{"letter": "A", "text": "Guselkumab, risankizumab"}, {"letter": "B", "text": "Secukinumab, ixekizumab"}, {"letter": "C", "text": "Etanercept, adalimumab"}, {"letter": "D", "text": "Tofacitinib, upadacitinib"}], "answer": "A", "explanation": "IL-23: guselkumab (Tremfya), risankizumab (Skyrizi); IL-12/23: ustekinumab."}, {"stem": "JAK inhibitor warnings taught in the lecture:", "options": [{"letter": "A", "text": "GI perforation, cardiac events, zoster"}, {"letter": "B", "text": "Unmasking of inflammatory bowel disease"}, {"letter": "C", "text": "Teratogenic embryopathy in pregnancy"}, {"letter": "D", "text": "Precipitation of scleroderma renal crisis"}], "answer": "A", "explanation": "JAK inhibitors: GI perforation, cardiac events, zoster reactivation."}]}, "answer": "B"}, {"id": "29", "group": 29, "section": "SLE emergencies", "topic": "Antiphospholipid syndrome (APS)", "skill": "Complications", "stem": "Catastrophic antiphospholipid syndrome (widespread thrombosis + multi-organ failure) → Treatment:", "options": [{"letter": "A", "text": "Anticoagulation, steroids, PLEX, IVIG"}, {"letter": "B", "text": "Hydroxychloroquine monotherapy until resolution"}, {"letter": "C", "text": "Stop the offending drug and observe"}, {"letter": "D", "text": "High-dose NSAIDs and prednisone taper"}, {"letter": "E", "text": "Mepolizumab plus systemic steroids"}], "explanation": "CAPS carries **50% mortality**; treat with **anticoagulation + steroids + plasma exchange + IVIG**. It is one of the lupus emergencies alongside nephritis, alveolar hemorrhage and CNS lupus.", "objective": "", "remediation": {"steps": [{"teach": "CAPS is the extreme end of the **hypercoagulable** APS spectrum.", "stem": "CAPS is defined by:", "options": [{"letter": "A", "text": "Widespread thrombosis with multi-organ failure"}, {"letter": "B", "text": "A single uncomplicated DVT"}], "answer": "A", "explanation": "Widespread thrombosis + multi-organ failure.", "clarify": [{"stem": "CAPS mortality:", "options": [{"letter": "A", "text": "50%"}, {"letter": "B", "text": "5%"}], "answer": "A", "explanation": "50% mortality."}]}, {"teach": "Treatment combines the APS backbone with **immune-modulating** rescue.", "stem": "Backbone of CAPS therapy:", "options": [{"letter": "A", "text": "Anticoagulation"}, {"letter": "B", "text": "Antibiotics"}], "answer": "A", "explanation": "Anticoagulation first."}, {"teach": "Three additional measures are added.", "stem": "Added to anticoagulation in CAPS:", "options": [{"letter": "A", "text": "Steroids, plasma exchange, IVIG"}, {"letter": "B", "text": "Colchicine and apremilast"}, {"letter": "C", "text": "Pilocarpine and cevimeline"}], "answer": "A", "explanation": "Anticoagulation + steroids + plasma exchange + IVIG."}], "checkpoints": [{"stem": "Which other lupus emergency presents with hemoptysis, falling hemoglobin and infiltrates?", "options": [{"letter": "A", "text": "Diffuse alveolar hemorrhage"}, {"letter": "B", "text": "Lupus nephritis"}, {"letter": "C", "text": "Libman-Sacks endocarditis"}, {"letter": "D", "text": "Pericardial tamponade"}], "answer": "A", "explanation": "Diffuse alveolar hemorrhage is a severe/organ-threatening flare."}, {"stem": "Chronic steroid-related 'killers' in lupus:", "options": [{"letter": "A", "text": "AVN and premature CAD"}, {"letter": "B", "text": "Hemolytic anemia"}, {"letter": "C", "text": "Oral ulcers"}, {"letter": "D", "text": "Alopecia"}], "answer": "A", "explanation": "Steroid-related AVN and premature coronary artery disease are the chronic killers; 90% still have a normal lifespan."}]}, "answer": "A"}, {"id": "30", "group": 30, "section": "Vasculitis", "topic": "ANCA-associated vasculitis", "skill": "Diagnostics & imaging", "stem": "Which of the following antibody–disease pairings are correct?", "options": [{"letter": "A", "text": "c-ANCA (anti-PR3) → GPA (Wegener)"}, {"letter": "B", "text": "p-ANCA (anti-MPO) → EGPA (Churg-Strauss)"}, {"letter": "C", "text": "p-ANCA (anti-MPO) → microscopic polyangiitis"}, {"letter": "D", "text": "c-ANCA (anti-PR3) → Behçet variable-vessel vasculitis"}, {"letter": "E", "text": "p-ANCA (anti-MPO) → giant cell (temporal) arteritis"}], "explanation": "**c-ANCA = cytoplasmic = anti-PR3 → GPA** (very specific); **p-ANCA = perinuclear = anti-MPO → MPA, EGPA** (may also appear in PAN). Behçet has **HLA-B51**; GCA is diagnosed by temporal artery biopsy.", "objective": "", "remediation": {"steps": [{"teach": "ANCA staining patterns map to **two target antigens**.", "stem": "Cytoplasmic ANCA targets:", "options": [{"letter": "A", "text": "PR3"}, {"letter": "B", "text": "MPO"}], "answer": "A", "explanation": "c-ANCA = cytoplasmic = anti-PR3.", "clarify": [{"stem": "Perinuclear ANCA targets:", "options": [{"letter": "A", "text": "MPO"}, {"letter": "B", "text": "PR3"}], "answer": "A", "explanation": "p-ANCA = perinuclear = anti-MPO."}]}, {"teach": "The PR3 antibody is **very specific** for one granulomatous vasculitis.", "stem": "c-ANCA/anti-PR3 → disease:", "options": [{"letter": "A", "text": "GPA"}, {"letter": "B", "text": "EGPA"}, {"letter": "C", "text": "PAN"}], "answer": "A", "explanation": "c-ANCA → GPA, very specific."}, {"teach": "The MPO antibody covers two small-vessel diseases and may appear in a medium-vessel one; two options pair ANCA with **non proper, blood, bone, cartilage."}]}, "answer": "A"}, {"id": "34", "group": 34, "section": "SLE radiographic findings", "topic": "Systemic lupus erythematosus", "skill": "Diagnostics & imaging", "stem": "Which radiographic feature distinguishes lupus arthritis from rheumatoid arthritis?", "options": [{"letter": "A", "text": "Absence of erosions"}, {"letter": "B", "text": "Pencil-in-cup deformity"}, {"letter": "C", "text": "Bamboo spine"}, {"letter": "D", "text": "Marginal joint erosions"}, {"letter": "E", "text": "Sacroiliitis"}], "explanation": "Lupus arthritis is **symmetric, inflammatory and non-erosive** with nonspecific X-ray changes; **Jaccoud arthropathy** = reducible deformities from ligament laxity without erosions (vs RA). 'Rhupus' = RA/SLE overlap; **AVN** from steroids is imaged by MRI.", "objective": "", "remediation": {"steps": [{"teach": "Lupus joint disease is **inflammatory but does not destroy bone**.", "stem": "Lupus arthritis is typically:", "options": [{"letter": "A", "text": "Non-erosive"}, {"letter": "B", "text": "Erosive"}], "answer": "A", "explanation": "Non-erosive with nonspecific X-ray changes.", "clarify": [{"stem": "Joints usually involved in lupus arthritis:", "options": [{"letter": "A", "text": "Hands, wrists, knees symmetrically"}, {"letter": "B", "text": "SI joints and spine"}], "answer": "A", "explanation": "Symmetric polyarthritis of hands, wrists, knees."}]}, {"teach": "Deformities can still occur — from **ligament laxity**, so they are reducible.", "stem": "Reducible hand deformities without erosions in lupus:", "options": [{"letter": "A", "text": "Jaccoud arthropathy"}, {"letter": "B", "text": "Arthritis mutilans"}, {"letter": "C", "text": "Dactylitis"}], "answer": "A", "explanation": "Jaccoud arthropathy = reducible deformities from ligament laxity."}, {"teach": "Steroid therapy adds a bone complication imaged by MRI.", "stem": "Hip pain in a steroid-treated lupus patient → consider:", "options": [{"letter": "A", "text": "Avasc (function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  const LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  function shuffleOptions(item) {
    if (!item || !item.options || item.options.length < 2) return;
    const key = (item.options.find(o => o.letter === item.answer) || {}).text;
    const texts = item.options.map(o => o.text);
    for (let i = texts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [texts[i], texts[j]] = [texts[j], texts[i]]; }
    item.options = texts.map((t, i) => ({ letter: LET[i], text: t }));
    item.answer = (item.options.find(o => o.text === key) || {}).letter;
  }
  // Tutor questions get fresh option order on every open, like the main exam
  if (EXAM_DATA.shuffleTutorOptions !== false) {
    questions.forEach(q => {
      const r = q.remediation; if (!r) return;
      (r.steps || []).forEach(s => { shuffleOptions(s); (s.clarify || []).forEach(shuffleOptions); });
      (r.checkpoints || []).forEach(shuffleOptions);
    });
  }

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter (FIRST attempt — this is what is scored)
  const tutor = {};          // question id -> tutor session (see startTutor)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);
  let page = 0;
  let lastGrade = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const optText = (item, letter) => { const o = item.options.find(x => x.letter === letter); return o ? o.text : ''; };
  // Select-all-that-apply support: q.multi === true, q.answers = ['A','C'] (q.answer mirrors the joined key for audits).
  const isMulti = q => !!q.multi;
  const keyLetters = q => isMulti(q) ? (q.answers || String(q.answer).split(',')).map(x => x.trim()).sort() : [q.answer];
  const chosenLetters = q => { const a = answers[q.id]; return a === undefined ? [] : (isMulti(q) ? String(a).split(',').filter(Boolean).sort() : [a]); };
  const isRight = q => { const c = chosenLetters(q), k = keyLetters(q); return c.length === k.length && c.every((x, i) => x === k[i]); };
  const keyLabel = q => keyLetters(q).join(', ');
  const keyText = q => keyLetters(q).map(l => optText(q, l)).join('; ');
  const pendingSel = {};   // multi questions: letters ticked but not yet checked

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  // ================= Adaptive tutor engine =================
  // A session is a growing "trail" of nodes rendered under the missed question.
  // Node kinds: step | clarify | checkpoint (answerable), note (text only).
  function hasTutor(q) { return !!(q.remediation && q.remediation.steps && q.remediation.steps.length); }

  function startTutor(q) {
    const t = { status: 'active', phase: 'steps', trail: [], step: 0, clar: 0, wrong: [], cp: 0 };
    tutor[q.id] = t;
    pushStep(q, t, false);
  }

  function pushStep(q, t, retry) {
    const steps = q.remediation.steps;
    if (t.step >= steps.length) return finishSteps(q, t);
    t.trail.push({ kind: 'step', item: steps[t.step], sIdx: t.step, retry: retry,
                   elim: retry ? t.wrong.slice() : [], chosen: null, revealed: false });
  }

  function nextStep(q, t) { t.step++; t.clar = 0; t.wrong = []; pushStep(q, t, false); }

  function pushClarify(q, t) {
    const cl = q.remediation.steps[t.step].clarify || [];
    if (t.clar < cl.length) {
      t.trail.push({ kind: 'clarify', item: cl[t.clar], sIdx: t.step, chosen: null, revealed: false });
      t.clar++;
      return true;
    }
    return false;
  }

  function finishSteps(q, t) {
    t.phase = 'checkpoint';
    t.trail.push({ kind: 'note', cls: 'reveal',
      html: '<b>Back to Question ' + esc(q.id) + ':</b> the answer is <b>' + esc(keyLabel(q)) + '. ' + fmt(keyText(q)) + '</b>' +
            (q.explanation ? '<div style="margin-top:4px">' + fmt(q.explanation) + '</div>' : '') });
    pushCheckpoint(q, t);
  }

  function pushCheckpoint(q, t) {
    const cps = q.remediation.checkpoints || [];
    if (t.cp < cps.length) {
      t.trail.push({ kind: 'checkpoint', item: cps[t.cp], chosen: null, revealed: false, n: t.cp + 1 });
    } else if (!cps.length) {
      t.status = 'mastered'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Pathway complete — continue the case.' });
    } else {
      t.status = 'review'; t.phase = 'done';
      t.trail.push({ kind: 'note', cls: 'review',
        html: '⚑ Flagged for review — this concept is saved to your missed list. Continue the case when ready.' });
    }
  }

  function tutorAnswer(q, idx, letter) {
    const t = tutor[q.id];
    const node = t.trail[idx];
    if (!node || node.chosen !== null || idx !== t.trail.length - 1) return;
    node.chosen = letter;
    const ok = letter === node.item.answer;

    if (node.kind === 'step') {
      if (ok) return nextStep(q, t);
      t.wrong.push(letter);
      if (pushClarify(q, t)) return;
      // Out of simpler questions: teach the step's answer, then move on
      node.revealed = true;
      return nextStep(q, t);
    }
    if (node.kind === 'clarify') {
      if (ok) return pushStep(q, t, true);              // foundation fixed -> retry the step
      if (pushClarify(q, t)) return;                    // still shaky -> go simpler again
      node.revealed = true;                             // teach the basic fact, then retry the step
      return pushStep(q, t, true);
    }
    if (node.kind === 'checkpoint') {
      if (ok) {
        t.status = 'mastered'; t.phase = 'done';
        t.trail.push({ kind: 'note', cls: 'mastered', html: '★ Mastered — you applied it to a new case. Continue below.' });
        return;
      }
      node.revealed = true;
      t.cp++;
      const more = t.cp < (q.remediation.checkpoints || []).length;
      if (more) t.trail.push({ kind: 'note', cls: 'info', html: 'Same concept, one more case:' });
      return pushCheckpoint(q, t);
    }
  }

  // A question is "resolved" (lets its follow-up appear) once answered right,
  // answered wrong without a pathway, or its pathway has finished.
  function resolved(q) {
    if (answers[q.id] === undefined) return false;
    if (isRight(q) || !hasTutor(q)) return true;
    return tutor[q.id] && tutor[q.id].status !== 'active';
  }

  function tutorStatus(q) {
    const t = tutor[q.id];
    return t ? t.status : null;
  }

  function nodeHtml(q, node, idx, interactive) {
    if (node.kind === 'note') return '<div class="tnote ' + node.cls + '">' + node.html + '</div>';
    const it = node.item;
    const answered = node.chosen !== null;
    const live = interactive && !answered;
    let label;
    if (node.kind === 'step') label = '<span class="tlabel">Step ' + (node.sIdx + 1) + ' of ' + q.remediation.steps.length + (node.retry ? ' · try again' : '') + '</span>';
    else if (node.kind === 'clarify') label = '<span class="tlabel clar">Let\'s go simpler</span>';
    else label = '<span class="tlabel cp">Mastery check' + ((q.remediation.checkpoints || []).length > 1 ? ' ' + node.n : '') + '</span>';

    let html = '<div class="tnode' + (answered ? ' done' : ' active') + '" data-tq="' + esc(q.id) + '" data-tidx="' + idx + '">' + label;
    if (it.teach && !(node.kind === 'step' && node.retry)) html += '<div class="teach">' + fmt(it.teach) + '</div>';
    html += '<div class="stem">' + fmt(it.stem) + '</div>';
    it.options.forEach(o => {
      let cls = 'opt';
      const elim = node.elim && node.elim.indexOf(o.letter) !== -1;
      if (answered) {
        if (o.letter === node.chosen) cls += node.chosen === it.answer ? ' correct' : ' incorrect';
        else if (node.revealed && o.letter === it.answer) cls += ' correct';
      }
      if (elim) cls += ' elim';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (live && !elim ? '' : ' disabled') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (answered) {
      const ok = node.chosen === it.answer;
      if (ok || node.revealed) {
        html += '<div class="feedback ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' +
          (ok ? '✓ Correct' : '✗ Answer: ' + esc(it.answer) + '. ' + fmt(optText(it, it.answer))) + '</div>' +
          (it.explanation ? '<div>' + fmt(it.explanation) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="nudge">✗ Not yet — let\'s break it down.</div>';
      }
    }
    html += '</div>';
    return html;
  }

  function trailHtml(q, interactive) {
    const t = tutor[q.id];
    if (!t) return '';
    let html = '<div class="tutor"><div class="tutor-head">Guided review</div>';
    t.trail.forEach((n, i) => { html += nodeHtml(q, n, i, interactive); });
    html += '</div>';
    return html;
  }

  // ================= Rendering =================
  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = isRight(q);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer' + (isMulti(q) ? 's' : '') + ': ' +
      esc(keyLabel(q)) + '. ' + fmt(keyText(q))) + '</div>';
    if (q.explanation) html += '<div>' + fmt(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const wrong = answered && !isRight(q);
    const tutoring = wrong && hasTutor(q);
    const t = tutor[q.id];
    // While the pathway is still in its teaching steps (exam mode), the correct answer stays hidden
    const hideKey = mode === 'exam' && tutoring && t && t.phase === 'steps';
    const status = tutoring ? tutorStatus(q) : null;

    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    if (status === 'mastered') html += '<span class="badge mastered">Mastered after review</span>';
    else if (status === 'review') html += '<span class="badge review">Flagged for review</span>';
    else if (status === 'active') html += '<span class="badge active">Guided review in progress</span>';
    html += '<div class="stem">' + fmt(q.stem) + (isMulti(q) ? '\n<span class="sata">Select all that apply</span>' : '') + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    const multi = isMulti(q), chosenSet = chosenLetters(q), keySet = keyLetters(q), sel = pendingSel[q.id] || [];
    q.options.forEach(o => {
      let cls = 'opt' + (multi ? ' multi' : '');
      if (answered) {
        const picked = chosenSet.indexOf(o.letter) !== -1, isKey = keySet.indexOf(o.letter) !== -1;
        if (multi) {
          if (picked && isKey) cls += ' correct';
          else if (picked && !isKey) cls += ' incorrect';
          else if (!picked && isKey && !hideKey) cls += ' missed';
          else if (!hideKey) cls += ' dim';
        } else {
          if (o.letter === chosen) cls += isRight(q) ? ' correct' : ' incorrect';
          else if (isKey && !hideKey) cls += ' correct';
          else if (!hideKey) cls += ' dim';
        }
      } else if (multi && sel.indexOf(o.letter) !== -1) cls += ' sel';
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + (multi ? '<span class="box"></span>' : '') + esc(o.letter) + '.</span><span>' + fmt(o.text) + '</span></button>';
    });
    if (multi && !answered && mode === 'exam') html += '<button class="btn primary btn-check"' + (sel.length ? '' : ' disabled') + '>Check answer</button>';
    if (answered) {
      if (hideKey) {
        html += '<div class="feedback tutoring"><div class="verdict">✗ Not quite — the answer stays hidden while we build up to it.</div>' +
          '<div>Work through the guided questions below.</div></div>';
      } else {
        html += feedbackHtml(q, chosen);
      }
    }
    if (tutoring && t) {
      if (mode === 'exam') html += trailHtml(q, true);
      else html += '<details class="trail"><summary>Guided review path (' +
        t.trail.filter(n => n.kind !== 'note').length + ' questions)</summary>' + trailHtml(q, false) + '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: a follow-up appears only once the question before it is
    // resolved — answered correctly, or its guided review has finished.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && resolved(group[shown - 1])) shown++;
    }
    const visible = group.slice(0, shown);

    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      const blocked = group[shown - 1];
      const inTutor = answers[blocked.id] !== undefined && !resolved(blocked);
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') + ' in this case — ' +
        (inTutor ? 'finish the guided review to continue' : 'answer above to continue') + '</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Main-question clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll(':scope > .opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          const q = byId[qid];
          if (isMulti(q)) {
            const l = btn.getAttribute('data-letter');
            const cur = pendingSel[qid] || [];
            pendingSel[qid] = cur.indexOf(l) === -1 ? cur.concat([l]) : cur.filter(x => x !== l);
            renderPage(true);
            return;
          }
          answers[qid] = btn.getAttribute('data-letter');
          if (!isRight(q) && hasTutor(q)) startTutor(q);
          renderPage(true);
        });
      });
      const chk = card.querySelector(':scope > .btn-check');
      if (chk) chk.addEventListener('click', () => {
        if (mode !== 'exam' || answers[qid] !== undefined) return;
        const q = byId[qid];
        const sel = (pendingSel[qid] || []).slice().sort();
        if (!sel.length) return;
        answers[qid] = sel.join(',');
        delete pendingSel[qid];
        if (!isRight(q) && hasTutor(q)) startTutor(q);
        renderPage(true);
      });
    });
    // Tutor clicks
    $('main').querySelectorAll('.tnode.active').forEach(nodeEl => {
      const q = byId[nodeEl.getAttribute('data-tq')];
      const idx = +nodeEl.getAttribute('data-tidx');
      nodeEl.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || btn.disabled) return;
          tutorAnswer(q, idx, btn.getAttribute('data-letter'));
          renderPage(true);
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) {
      window.scrollTo(0, savedY);
      // Bring the newest tutor question / unlocked follow-up into view if it landed below the fold
      const target = $('main').querySelector('.tnode.active') || $('main').querySelector('.tnote.mastered, .tnote.review');
      if (target) {
        const r = target.getBoundingClientRect();
        const navH = $('navbar').offsetHeight || 0;
        if (r.bottom > window.innerHeight - navH) {
          window.scrollBy({ top: Math.min(r.top - 80, r.bottom - (window.innerHeight - navH) + 16), behavior: 'smooth' });
        }
      }
    } else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  // ================= Grading =================
  // Two lenses for the results page:
  //   topic — WHAT you were tested on (e.g. "Paget's disease of bone"). Falls back to `section`.
  //   skill — WHAT KIND of thinking (Identification, Disease process, Diagnostics & imaging,
  //           Management, Complications…). Optional; the skill card is hidden when no question has one.
  const topicOf = q => q.topic || q.section || 'All questions';
  const skillOf = q => q.skill || null;

  function tally(list, keyFn) {
    const m = {};
    list.forEach(q => {
      const k = keyFn(q); if (!k) return;
      if (!m[k]) m[k] = { name: k, correct: 0, total: 0, mastered: 0, review: 0, missed: 0 };
      const e = m[k];
      e.total++;
      if (isRight(q)) { e.correct++; return; }
      if (answers[q.id] === undefined) return;
      const st = tutor[q.id] ? tutor[q.id].status : null;
      if (st === 'mastered') e.mastered++; else if (st === 'review') e.review++; else e.missed++;
    });
    return Object.keys(m).map(k => { const e = m[k]; e.pct = e.total ? e.correct / e.total : 0; return e; })
      .sort((a, b) => a.pct - b.pct || b.total - a.total);        // weakest first
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    graded.forEach(q => { if (isRight(q)) correct++; });
    const ts = { started: 0, mastered: 0, review: 0, active: 0, tq: 0, tqRight: 0 };
    Object.keys(tutor).forEach(id => {
      const t = tutor[id];
      ts.started++; ts[t.status]++;
      t.trail.forEach(n => { if (n.kind !== 'note' && n.chosen !== null) { ts.tq++; if (n.chosen === n.item.answer) ts.tqRight++; } });
    });
    return { correct, graded: graded.length, total: questions.length, partial,
             topics: tally(graded, topicOf), skills: tally(graded, skillOf), ts };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && !isRight(q));
  }

  // Lowest-scoring entries (ties included) — only meaningful when there's something to compare
  function weakest(entries) {
    if (entries.length < 2) return [];
    const lo = entries[0].pct, hi = entries[entries.length - 1].pct;
    if (lo === hi) return [];                                       // all equal: nothing stands out
    return entries.filter(e => e.pct === lo);
  }

  function barsHtml(entries) {
    const weakSet = weakest(entries).map(e => e.name);
    return entries.map(e => {
      const p = Math.round(e.pct * 100);
      const cls = p >= 80 ? 'hi' : (weakSet.indexOf(e.name) !== -1 ? 'lo' : '');
      const meta = [];
      if (e.review) meta.push(e.review + ' flagged');
      if (e.missed) meta.push(e.missed + ' missed');
      if (e.mastered) meta.push(e.mastered + ' relearned in guided review');
      return '<div class="bar-row"><div class="bar-head"><span class="nm">' + esc(e.name) +
        (weakSet.indexOf(e.name) !== -1 ? '<span class="sec-tag weak">WEAKEST</span>' : '') +
        '</span><span class="pc"><b>' + p + '%</b> · ' + e.correct + '/' + e.total + '</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + cls + '" style="width:' + Math.max(p, 2) + '%"></div></div>' +
        (meta.length ? '<div class="bar-meta">' + meta.join(' · ') + '</div>' : '') + '</div>';
    }).join('');
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;
    const hasSkills = r.skills.length > 0;

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + ' · first attempts</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.ts.started) html += '<div class="score-note">' + r.ts.mastered + ' of ' + r.ts.started +
      ' missed concept' + (r.ts.started === 1 ? '' : 's') + ' relearned in guided review</div>';
    else if (r.partial) html += '<div class="score-note">Unanswered questions are not counted.</div>';
    html += '</div>';

    // ---- What to work on ----
    const wTopic = weakest(r.topics), wSkill = weakest(r.skills);
    const missed = missedQuestions();
    html += '<div class="card"><h2>What to work on</h2><div class="sub">Ranked from the questions you missed on the first try</div>';
    if (!missed.length) {
      html += '<div class="focus-box ok"><div class="v">Nothing missed — every question right on the first try.</div></div>';
    } else {
      html += '<div class="focus-grid">';
      if (wTopic.length) html += '<div class="focus-box"><div class="k">Weakest topic</div><div class="v">' +
        wTopic.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wTopic.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      if (wSkill.length) html += '<div class="focus-box"><div class="k">Weakest skill</div><div class="v">' +
        wSkill.map(e => esc(e.name)).join(', ') + '</div><div class="n">' +
        wSkill.map(e => Math.round(e.pct * 100) + '% (' + e.correct + '/' + e.total + ')').join(', ') + '</div></div>';
      html += '</div>';
      // One line per missed concept: flagged first, then plain misses, then ones already relearned
      const rank = { review: 0, active: 0, missed: 1, mastered: 2 };
      const items = missed.map(q => {
        const st = tutor[q.id] ? tutor[q.id].status : 'missed';
        return { q, st: st === 'active' ? 'review' : st };
      }).sort((a, b) => rank[a.st] - rank[b.st]);
      const label = { review: 'Still shaky', missed: 'Missed', mastered: 'Relearned' };
      html += '<ul class="todo">' + items.map(it => {
        const sk = skillOf(it.q);
        return '<li><span class="dot ' + it.st + '"></span><span class="what"><b>' + esc(topicOf(it.q)) + '</b>' +
          (sk ? ' — ' + esc(sk) : '') + ' <span style="color:var(--ink-soft)">(Q' + esc(it.q.id) + ')</span></span>' +
          '<span class="tag ' + it.st + '">' + label[it.st] + '</span></li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // ---- By topic / by skill ----
    html += '<div class="card"><h2>By topic</h2><div class="sub">First-attempt score for each disease or concept</div>' + barsHtml(r.topics) + '</div>';
    if (hasSkills) html += '<div class="card"><h2>By skill</h2><div class="sub">Which kind of question trips you up, across all topics</div>' + barsHtml(r.skills) + '</div>';

    if (r.ts.started) {
      html += '<div class="card"><h2>Guided review</h2><div class="sub" style="margin-bottom:12px">How the tutor pathways went</div><div class="tutor-stats">' +
        '<div class="tstat t"><b>' + r.ts.started + '</b>concepts reviewed</div>' +
        '<div class="tstat m"><b>' + r.ts.mastered + '</b>passed mastery check</div>' +
        '<div class="tstat r"><b>' + (r.ts.review + r.ts.active) + '</b>still shaky</div>' +
        '<div class="tstat"><b>' + r.ts.tqRight + '/' + r.ts.tq + '</b>tutor questions right</div>' +
        '</div></div>';
    }

    html += '<div class="results-actions">';
    if (missed.length) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed.length + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + fmt(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  const plain = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '$1');

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id + ' — ' + topicOf(q) + (skillOf(q) ? ' / ' + skillOf(q) : '')];
      if (group[0].id !== q.id) lines.push('Case: ' + plain(group[0].stem));
      lines.push(plain(q.stem));
      q.options.forEach(o => lines.push(o.letter + '. ' + plain(o.text)));
      lines.push('My answer: ' + answers[q.id]);
      lines.push('Correct answer' + (isMulti(q) ? 's' : '') + ': ' + keyLabel(q) + '. ' + plain(keyText(q)));
      if (q.explanation) lines.push('Rationale: ' + plain(q.explanation));
      if (q.objective) lines.push('Objective: ' + q.objective);
      const t = tutor[q.id];
      if (t) {
        const st = { mastered: 'MASTERED on re-check', review: 'STILL NEEDS REVIEW (missed mastery check)', active: 'guided review not finished' }[t.status];
        lines.push('Guided review: ' + st);
        t.trail.forEach(n => {
          if (n.kind === 'note' || n.chosen === null) return;
          const ok = n.chosen === n.item.answer;
          lines.push('  ' + (ok ? '✓ ' : '✗ ') + plain(n.item.stem) + ' → ' + plain(optText(n.item, n.item.answer)));
        });
      }
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => !resolved(q))) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(pendingSel).forEach(k => delete pendingSel[k]);
    Object.keys(tutor).forEach(k => delete tutor[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }


  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
