<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }
  .opt.missed { border-color: var(--amber); background: var(--amber-bg); border-style: dashed; }
  .opt.missed .letter { color: var(--amber); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.multi .box { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
  .opt.sel .box, .opt.correct .box, .opt.incorrect .box { background: currentColor; }
  .opt.correct .box { border-color: var(--green); } .opt.incorrect .box { border-color: var(--red); } .opt.missed .box { border-color: var(--amber); }
  .sata { display: inline-block; font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; margin-top: 6px; }
  .btn-check { margin: 4px 0 10px; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, topic?, skill?, image?,
//    remediation?: {                      // OPTIONAL — adaptive tutor pathway for a wrong first answer
//      steps: [{ teach?, stem, options, answer, explanation?,
//                clarify?: [{ teach?, stem, options, answer, explanation? }] }],   // simpler questions used when a step is missed
//      checkpoints?: [{ teach?, stem, options, answer, explanation? }]             // mastery check(s): a new vignette on the same concept
//    } }] }
// Questions without `remediation` behave exactly like the classic exam (answer revealed immediately).
// **double asterisks** in any text render as bold.
const EXAM_DATA = {"title": "SLE and Connective Tissue Disorders-Concept_Adaptive_Exam", "questions": [{"id": "1", "group": 1, "section": "SLE serology", "topic": "Systemic lupus erythematosus", "skill": "Diagnostics & imaging", "stem": "Which antibody is the most specific for systemic lupus erythematosus?", "options": [{"letter": "A", "text": "ANA"}, {"letter": "B", "text": "Anti-dsDNA"}, {"letter": "C", "text": "Anti-Smith"}, {"letter": "D", "text": "Anti-histone"}, {"letter": "E", "text": "Anti-U1-RNP"}], "explanation": "**Anti-Smith is highly specific** for SLE but not sensitive; anti-dsDNA is also specific and tracks activity, while ANA is the sensitive screen.", "objective": "", "remediation": {"steps": [{"teach": "Serologic tests for lupus divide into a **sensitive screen** that catches nearly everyone and **specific confirmatory antibodies** that rarely appear in other diseases.", "stem": "Which role does ANA play in the lupus workup?", "options": [{"letter": "A", "text": "Sensitive screening test"}, {"letter": "B", "text": "Most specific confirmatory antibody"}], "answer": "A", "explanation": "ANA is 99% sensitive but poorly specific — it screens, it does not confirm.", "clarify": [{"stem": "A negative result from a highly sensitive test does what?", "options": [{"letter": "A", "text": "Essentially rules the disease out"}, {"letter": "B", "text": "Confirms the disease"}], "answer": "A", "explanation": "SNOUT: a sensitive test that is negative rules the disease out — a negative ANA excludes 99% of lupus.", "teach": "A **sensitive** test rarely misses disease."}]}, {"teach": "Two antibodies are considered specific for SLE; one of them also **rises and falls with disease activity** and signals nephritis, while the other is static.", "stem": "Which specific lupus antibody correlates with disease activity and lupus nephritis?", "options": [{"letter": "A", "text": "Anti-Smith"}, {"letter": "B", "text": "Anti-dsDNA"}, {"letter": "C", "text": "Anti-histone"}], "answer": "B", "explanation": "Anti-dsDNA tracks activity and, with low C3/C4, predicts nephritis; the other specific antibody does not track activity."}, {"teach": "The remaining specific antibody is the one the guide calls **most specific** — highly specific but not sensitive.", "stem": "Which antibody is the most specific for SLE?", "options": [{"letter": "A", "text": "Anti-Smith"}, {"letter": "B", "text": "Anti-SSA"}, {"letter": "C", "text": "Anti-dsDNA"}], "answer": "A", "explanation": "Anti-Smith is the most specific lupus antibody."}], "checkpoints": [{"stem": "Which antibody is positive in drug-induced lupus while the other lupus antibodies are negative?", "options": [{"letter": "A", "text": "Anti-Smith"}, {"letter": "B", "text": "Anti-histone"}, {"letter": "C", "text": "Anti-dsDNA"}, {"letter": "D", "text": "Anti-U1-RNP"}], "answer": "B", "explanation": "Anti-histone marks drug-induced lupus; anti-Smith and anti-dsDNA are typically negative there (except TNF-blocker DILE)."}, {"stem": "Which antibody is positive in MCTD while the other lupus antibodies are negative?", "options": [{"letter": "A", "text": "Anti-Smith"}, {"letter": "B", "text": "Anticentromere"}, {"letter": "C", "text": "Anti-U1-RNP"}, {"letter": "D", "text": "Anti-Jo-1"}], "answer": "C", "explanation": "Anti-U1-RNP alone = mixed connective tissue disease."}]}, "answer": "C"}, {"id": "2", "group": 2, "section": "Seronegative spondyloarthropathies", "topic": "Seronegative spondyloarthropathies", "skill": "Disease process", "stem": "Which of the following are shared features of the seronegative spondyloarthropathies?", "options": [{"letter": "A", "text": "Enthesitis"}, {"letter": "B", "text": "Dactylitis (sausage digits)"}, {"letter": "C", "text": "Anterior uveitis or iritis"}, {"letter": "D", "text": "Positive rheumatoid factor"}, {"letter": "E", "text": "Asymmetric large-joint oligoarthritis"}], "explanation": "Seronegative SpA share **spine/SI involvement, enthesitis, dactylitis, asymmetric oligoarthritis of 2–4 large joints, and uveitis**; seronegative means RF and ANA are **negative**.", "objective": "", "remediation": {"steps": [{"teach": "**Seronegative** describes the antibody profile of this whole disease family.", "stem": "Seronegative spondyloarthropathy means which labs are negative?", "options": [{"letter": "A", "text": "RF and ANA"}, {"letter": "B", "text": "HLA-B27 and ESR"}], "answer": "A", "explanation": "Seronegative = negative RF AND negative ANA; HLA-B27 is variably positive.", "clarify": [{"stem": "Spondylo- refers to the:", "options": [{"letter": "A", "text": "Spine"}, {"letter": "B", "text": "Skin"}], "answer": "A", "explanation": "Spondylo = spine; the family shares spine and SI-joint involvement.", "teach": "'Spondylo' names a body region."}]}, {"teach": "The family shares **inflammation where tendons insert on bone** and **diffuse swelling of a whole digit**.", "stem": "Inflammation at tendon insertions such as the Achilles and plantar fascia is called:", "options": [{"letter": "A", "text": "Enthesitis"}, {"letter": "B", "text": "Dactylitis"}, {"letter": "C", "text": "Synovitis"}], "answer": "A", "explanation": "Enthesitis is insertion-site inflammation — Achilles tendonitis and plantar fasciitis are the classic sites.", "clarify": [{"stem": "Sausage-shaped swelling of an entire finger or toe is called:", "options": [{"letter": "A", "text": "Dactylitis"}, {"letter": "B", "text": "Enthesitis"}], "answer": "A", "explanation": "Dactylitis = sausage digit."}]}, {"teach": "Extra-articular features involve the **eye, bowel and skin**, and the peripheral joint pattern is asymmetric and oligoarticular.", "stem": "Which joint pattern is typical of seronegative SpA?", "options": [{"letter": "A", "text": "Asymmetric oligoarthritis of 2–4 large joints"}, {"letter": "B", "text": "Symmetric small-joint polyarthritis of the hands"}, {"letter": "C", "text": "Monoarthritis of the first MTP joint"}], "answer": "A", "explanation": "Asymmetric large-joint oligoarthritis (2–4 joints) is the shared pattern; symmetric hand polyarthritis is RA-like."}], "checkpoints": [{"stem": "Which eye finding is shared across the seronegative spondyloarthropathies?", "options": [{"letter": "A", "text": "Anterior uveitis/iritis"}, {"letter": "B", "text": "Keratoconjunctivitis sicca"}, {"letter": "C", "text": "Optic neuritis"}, {"letter": "D", "text": "Retinal vasculitis"}], "answer": "A", "explanation": "Uveitis/iritis is the shared eye feature; sicca is Sjögren, optic neuritis is GCA, retinal vasculitis is Behçet."}, {"stem": "HLA-B27 positivity in the seronegative SpA is best described as:", "options": [{"letter": "A", "text": "Present in ~90% of AS but variable in the others"}, {"letter": "B", "text": "Required for diagnosis in all four"}, {"letter": "C", "text": "Specific for ankylosing spondylitis"}, {"letter": "D", "text": "Absent in IBD-associated arthropathy"}], "answer": "A", "explanation": "HLA-B27 is ~90% in AS, 50–75% in axial IBD arthropathy, and variable overall — sensitive but not specific."}]}, "multi": true, "answers": ["A", "B", "C", "E"], "answer": "A,B,C,E"}, {"id": "3", "group": 3, "section": "Vasculitis", "topic": "Granulomatosis with polyangiitis (GPA)", "skill": "Identification", "stem": "Sinusitis with bloody discharge + hemoptysis with lung nodules + glomerulonephritis → Diagnosis:", "options": [{"letter": "A", "text": "Polyarteritis nodosa"}, {"letter": "B", "text": "Granulomatosis with polyangiitis"}, {"letter": "C", "text": "Eosinophilic granulomatosis with polyangiitis"}, {"letter": "D", "text": "Microscopic polyangiitis"}, {"letter": "E", "text": "Behçet syndrome"}], "explanation": "GPA (Wegener) is the small-vessel ANCA vasculitis of the **upper + lower respiratory tract and kidneys**, with **c-ANCA/anti-PR3**; PAN spares the lungs and does not cause GN.", "objective": "", "remediation": {"steps": [{"teach": "Vasculitides are grouped by **vessel size**; the ANCA-associated group affects **small vessels**.", "stem": "GPA, EGPA and MPA belong to which vasculitis group?", "options": [{"letter": "A", "text": "Small-vessel ANCA-associated"}, {"letter": "B", "text": "Medium-vessel"}], "answer": "A", "explanation": "GPA, EGPA and MPA are the small-vessel ANCA-associated vasculitides.", "clarify": [{"stem": "PAN belongs to which group?", "options": [{"letter": "A", "text": "Medium-vessel"}, {"letter": "B", "text": "Large-vessel"}], "answer": "A", "explanation": "PAN and Kawasaki are medium-vessel; Takayasu and GCA are large-vessel."}]}, {"teach": "Among the ANCA vasculitides, one is defined by **asthma and eosinophilia**, another by **upper airway + lung + kidney** disease.", "stem": "Which clinical combination points toward GPA rather than EGPA?", "options": [{"letter": "A", "text": "Sinusitis, hemoptysis and glomerulonephritis"}, {"letter": "B", "text": "Asthma, eosinophilia and skin lesions"}, {"letter": "C", "text": "Hepatitis B and mononeuritis multiplex"}], "answer": "A", "explanation": "Sinus + lung + kidney = GPA; asthma + eosinophilia = EGPA; hepatitis B + mononeuritis multiplex = PAN."}, {"teach": "The ANCA pattern confirms it: one is **cytoplasmic/anti-PR3**, the other **perinuclear/anti-MPO**.", "stem": "Which ANCA is very specific for GPA?", "options": [{"letter": "A", "text": "c-ANCA / anti-PR3"}, {"letter": "B", "text": "p-ANCA / anti-MPO"}], "answer": "A", "explanation": "c-ANCA (anti-PR3) is very specific for GPA."}], "checkpoints": [{"stem": "Induction therapy for GPA is high-dose steroids plus which agent?", "options": [{"letter": "A", "text": "Rituximab or cyclophosphamide"}, {"letter": "B", "text": "Mepolizumab"}, {"letter": "C", "text": "Hydroxychloroquine"}, {"letter": "D", "text": "Colchicine"}], "answer": "A", "explanation": "GPA induction = high-dose steroids + rituximab- or cyclophosphamide-based regimen; maintenance with MMF, azathioprine or rituximab."}, {"stem": "Which airway complication is characteristic of GPA?", "options": [{"letter": "A", "text": "Subglottic (tracheal) stenosis"}, {"letter": "B", "text": "Apical lung fibrosis"}, {"letter": "C", "text": "Pulmonary arterial hypertension"}, {"letter": "D", "text": "Pleural effusion"}], "answer": "A", "explanation": "Tracheal/subglottic stenosis is a GPA feature; apical fibrosis is AS, PAH is scleroderma."}]}, "answer": "B"}, {"id": "4", "group": 4, "section": "SLE treatment", "topic": "Systemic lupus erythematosus", "skill": "Management", "stem": "Which medication should every lupus patient with disease activity be taking unless contraindicated?", "options": [{"letter": "A", "text": "Prednisone"}, {"letter": "B", "text": "Methotrexate"}, {"letter": "C", "text": "Hydroxychloroquine"}, {"letter": "D", "text": "Mycophenolate mofetil"}, {"letter": "E", "text": "Belimumab"}], "explanation": "**Hydroxychloroquine (Plaquenil) is recommended for all active lupus patients**: it helps skin, joints and fatigue, reduces flares, thromboembolism, glucose intolerance, mortality and **neonatal lupus/congenital heart block**.", "objective": "", "remediation": {"steps": [{"teach": "Lupus treatment is **tiered by severity**: mild (skin + joints), moderate (adds serositis), severe (nephritis, alveolar hemorrhage, CNS).", "stem": "Skin and joint disease without organ involvement is classified as which severity?", "options": [{"letter": "A", "text": "Mild"}, {"letter": "B", "text": "Severe"}], "answer": "A", "explanation": "Skin + joints = mild lupus.", "clarify": [{"stem": "Lupus nephritis is classified as:", "options": [{"letter": "A", "text": "Severe"}, {"letter": "B", "text": "Mild"}], "answer": "A", "explanation": "Nephritis, alveolar hemorrhage and CNS lupus are severe disease."}]}, {"teach": "One **antimalarial** forms the backbone of mild disease and is continued at every tier.", "stem": "Which drug class forms the backbone of mild lupus therapy?", "options": [{"letter": "A", "text": "Antimalarial"}, {"letter": "B", "text": "Alkylating agent"}, {"letter": "C", "text": "Calcineurin inhibitor"}], "answer": "A", "explanation": "The antimalarial backbone is used in all patients with activity; alkylating agents and calcineurin inhibitors are for severe disease."}, {"teach": "That backbone agent also protects against a **fetal conduction complication** in anti-SSA-positive mothers.", "stem": "Which lupus drug reduces the risk of neonatal lupus/congenital heart block?", "options": [{"letter": "A", "text": "Hydroxychloroquine"}, {"letter": "B", "text": "Cyclophosphamide"}, {"letter": "C", "text": "Voclosporin"}], "answer": "A", "explanation": "Hydroxychloroquine reduces neonatal lupus/congenital heart block and is the drug every active patient should take."}], "checkpoints": [{"stem": "Which fetal complication is associated with maternal anti-SSA (Ro) antibodies?", "options": [{"letter": "A", "text": "Congenital heart block"}, {"letter": "B", "text": "Neural tube defect"}, {"letter": "C", "text": "Fetal macrosomia"}, {"letter": "D", "text": "Cleft palate"}], "answer": "A", "explanation": "Anti-SSA (Ro) → neonatal lupus / fetal heart block; hydroxychloroquine lowers this risk."}, {"stem": "Which agents are added for moderate lupus (skin, joints, serositis)?", "options": [{"letter": "A", "text": "Methotrexate, azathioprine or belimumab"}, {"letter": "B", "text": "Cyclophosphamide plus plasmapheresis"}, {"letter": "C", "text": "Long-term warfarin after LMWH"}, {"letter": "D", "text": "Pilocarpine or cevimeline"}], "answer": "A", "explanation": "Moderate disease adds MTX, MMF, azathioprine, leflunomide, belimumab, anifrolumab or steroids; cyclophosphamide/plasmapheresis are for severe disease."}]}, "answer": "C"}, {"id": "5", "group": 5, "section": "Scleroderma", "topic": "Systemic sclerosis (scleroderma)", "skill": "Identification", "stem": "Shiny, tight thickened skin + tendon friction rubs + Raynaud phenomenon with white → blue → red color change → Diagnosis:", "options": [{"letter": "A", "text": "Mixed connective tissue disease"}, {"letter": "B", "text": "Systemic sclerosis"}, {"letter": "C", "text": "Dermatomyositis"}, {"letter": "D", "text": "Sjögren syndrome"}, {"letter": "E", "text": "Antiphospholipid syndrome"}], "explanation": "**Tendon friction rub, sclerodactyly and the 3-color Raynaud** are scleroderma buzzwords; Raynaud is a prerequisite of systemic sclerosis.", "objective": "", "remediation": {"steps": [{"teach": "Scleroderma literally means **hard skin**; it is divided into localized (skin only) and systemic (internal organs).", "stem": "Morphea and linear scleroderma are examples of:", "options": [{"letter": "A", "text": "Localized scleroderma"}, {"letter": "B", "text": "Diffuse systemic sclerosis"}], "answer": "A", "explanation": "Morphea and linear scleroderma are localized, skin-only forms.", "clarify": [{"stem": "Systemic sclerosis differs from localized scleroderma by:", "options": [{"letter": "A", "text": "Internal-organ involvement"}, {"letter": "B", "text": "Involving only the face"}], "answer": "A", "explanation": "Systemic sclerosis = internal-organ involvement (limited or diffuse)."}]}, {"teach": "A **vasospastic 3-color change** in the fingers must be present before systemic sclerosis is diagnosed.", "stem": "Which finding is a prerequisite for systemic sclerosis?", "options": [{"letter": "A", "text": "Raynaud phenomenon"}, {"letter": "B", "text": "Gottron papules"}, {"letter": "C", "text": "Parotid enlargement"}], "answer": "A", "explanation": "Raynaud (white → blue → red) is a prerequisite; Gottron papules are DM, parotid enlargement is Sjögren."}, {"teach": "Exam shows claw-like hands, thick skin and a palpable **rub over the elbow tendons**; nailfold capillaries are abnormal.", "stem": "Tendon friction rub + sclerodactyly + Raynaud → Diagnosis:", "options": [{"letter": "A", "text": "Systemic sclerosis"}, {"letter": "B", "text": "Dermatomyositis"}, {"letter": "C", "text": "Mixed connective tissue disease"}], "answer": "A", "explanation": "Tendon friction rub is a scleroderma buzzword; MCTD has Raynaud but with arthritis and anti-U1-RNP."}], "checkpoints": [{"stem": "Which bedside exam finding supports systemic sclerosis?", "options": [{"letter": "A", "text": "Abnormal nailfold capillary microscopy"}, {"letter": "B", "text": "Positive Schober test"}, {"letter": "C", "text": "Positive pathergy test"}, {"letter": "D", "text": "Schirmer wetting <5 mm"}], "answer": "A", "explanation": "Abnormal nailfold capillaroscopy supports SSc; Schober = AS, pathergy = Behçet, Schirmer = Sjögren."}, {"stem": "Which GI complication of scleroderma causes iron-deficiency bleeding?", "options": [{"letter": "A", "text": "Watermelon stomach (GAVE)"}, {"letter": "B", "text": "Wide-mouth colonic diverticula"}, {"letter": "C", "text": "Gastroparesis"}, {"letter": "D", "text": "Reduced LES pressure"}], "answer": "A", "explanation": "Gastric telangiectasias (watermelon stomach) bleed and cause iron deficiency."}]}, "answer": "B"}, {"id": "5A", "group": 5, "section": "Scleroderma", "topic": "Systemic sclerosis (scleroderma)", "skill": "Complications", "stem": "Most common cause of death in systemic sclerosis:", "options": [{"letter": "A", "text": "Scleroderma renal crisis"}, {"letter": "B", "text": "Pulmonary arterial hypertension"}, {"letter": "C", "text": "Gastric antral telangiectasia bleeding"}, {"letter": "D", "text": "Esophageal dysmotility"}, {"letter": "E", "text": "Pericardial effusion"}], "explanation": "Pulmonary disease is the **main cause of morbidity and mortality**; **PAH is often the cause of death** (both limited and diffuse), with ILD in diffuse disease.", "objective": "", "remediation": {"steps": [{"teach": "Organ involvement in SSc includes GI, cardiac, renal and **pulmonary** disease; one system dominates mortality.", "stem": "Which organ system is the main cause of morbidity and mortality in SSc?", "options": [{"letter": "A", "text": "Pulmonary"}, {"letter": "B", "text": "Gastrointestinal"}], "answer": "A", "explanation": "Pulmonary disease (PAH and ILD) drives mortality.", "clarify": [{"stem": "Scleroderma renal crisis occurs mainly in which setting?", "options": [{"letter": "A", "text": "Diffuse disease, first 5 years"}, {"letter": "B", "text": "Limited disease, after decades"}], "answer": "A", "explanation": "Renal crisis = diffuse disease within the first 5 years."}]}, {"teach": "Two pulmonary problems occur: **fibrosis of the lung parenchyma** (diffuse disease) and **vascular pressure elevation** (both subtypes).", "stem": "Which pulmonary complication occurs in both limited and diffuse SSc and is often the cause of death?", "options": [{"letter": "A", "text": "Pulmonary arterial hypertension"}, {"letter": "B", "text": "Interstitial lung disease"}, {"letter": "C", "text": "Apical fibrosis"}], "answer": "A", "explanation": "PAH occurs in both subtypes and is often the cause of death; ILD belongs mainly to diffuse disease; apical fibrosis is AS."}], "checkpoints": [{"stem": "Which antibody marks diffuse systemic sclerosis with ILD and worse survival?", "options": [{"letter": "A", "text": "Anti-Scl-70 (topoisomerase)"}, {"letter": "B", "text": "Anticentromere"}, {"letter": "C", "text": "Anti-U1-RNP"}, {"letter": "D", "text": "Anti-Jo-1"}], "answer": "A", "explanation": "Anti-Scl-70 = diffuse SSc, ILD, decreased survival; anticentromere = limited."}, {"stem": "Which drugs are used for scleroderma-associated PAH?", "options": [{"letter": "A", "text": "Sildenafil, bosentan or iloprost"}, {"letter": "B", "text": "ACE inhibitors or ARBs"}, {"letter": "C", "text": "Nintedanib or tocilizumab"}, {"letter": "D", "text": "Proton pump inhibitors"}], "answer": "A", "explanation": "PAH: CCBs, iloprost, sildenafil/tadalafil, bosentan. ACEi = renal crisis; nintedanib/tocilizumab = ILD; PPI = GERD."}]}, "answer": "B"}, {"id": "6", "group": 6, "section": "Vasculitis", "topic": "Behçet syndrome", "skill": "Identification", "stem": "Recurrent oral + genital ulcers, uveitis, and a positive pathergy test in a young adult of Middle Eastern descent → Diagnosis:", "options": [{"letter": "A", "text": "Reactive arthritis"}, {"letter": "B", "text": "Behçet syndrome"}, {"letter": "C", "text": "Granulomatosis with polyangiitis"}, {"letter": "D", "text": "Systemic lupus erythematosus"}, {"letter": "E", "text": "Crohn disease arthropathy"}], "explanation": "**Oral + genital ulcers, uveitis, erythema nodosum/acneiform nodules and pathergy** in a 'Silk Road' patient = Behçet, a variable-vessel vasculitis (**HLA-B51/B5**); the diagnosis is clinical.", "objective": "", "remediation": {"steps": [{"teach": "Behçet is classified as a **variable-vessel vasculitis** affecting arteries and veins, with a predilection for veins.", "stem": "Which vasculitis category does Behçet occupy?", "options": [{"letter": "A", "text": "Variable-vessel"}, {"letter": "B", "text": "Small-vessel ANCA-associated"}], "answer": "A", "explanation": "Behçet is the variable-vessel vasculitis of the framework.", "clarify": [{"stem": "Behçet is most common in young adults from which region?", "options": [{"letter": "A", "text": "Middle East / Asia (Silk Road)"}, {"letter": "B", "text": "Northern Europe"}], "answer": "A", "explanation": "Silk Road distribution; rare in North America."}]}, {"teach": "Several diseases cause oral ulcers; the **genital ulcers and the skin-prick pustule** separate this one.", "stem": "Which test produces a pustule at a sterile needle-prick site in Behçet?", "options": [{"letter": "A", "text": "Pathergy test"}, {"letter": "B", "text": "Schirmer test"}, {"letter": "C", "text": "Schober test"}], "answer": "A", "explanation": "Pathergy = pustule after skin prick; Schirmer tests tears, Schober tests lumbar flexion."}, {"teach": "Its HLA association differs from the spondyloarthropathies.", "stem": "Which HLA is associated with Behçet syndrome?", "options": [{"letter": "A", "text": "HLA-B51 / B5"}, {"letter": "B", "text": "HLA-B27"}], "answer": "A", "explanation": "HLA-B51/B5 = Behçet; HLA-B27 = ankylosing spondylitis."}], "checkpoints": [{"stem": "First-line agents for mucocutaneous Behçet:", "options": [{"letter": "A", "text": "Apremilast or colchicine"}, {"letter": "B", "text": "Rituximab or cyclophosphamide"}, {"letter": "C", "text": "Pilocarpine or cevimeline"}, {"letter": "D", "text": "Warfarin or LMWH"}], "answer": "A", "explanation": "Apremilast (PDE4 inhibitor) and colchicine are first-line; severe disease gets steroids, azathioprine, cyclophosphamide or anti-TNF."}, {"stem": "How is Behçet syndrome diagnosed?", "options": [{"letter": "A", "text": "Clinically"}, {"letter": "B", "text": "By c-ANCA"}, {"letter": "C", "text": "By mesenteric angiography"}, {"letter": "D", "text": "By lip biopsy"}], "answer": "A", "explanation": "Behçet diagnosis is clinical — ulcers, uveitis, skin lesions, pathergy."}]}, "answer": "B"}, {"id": "7", "group": 7, "section": "Lupus subcategories", "topic": "Antiphospholipid syndrome (APS)", "skill": "Identification", "stem": "Which of the following are features of antiphospholipid syndrome?", "options": [{"letter": "A", "text": "Prolonged PTT"}, {"letter": "B", "text": "False-positive VDRL/RPR"}, {"letter": "C", "text": "Recurrent pregnancy loss"}, {"letter": "D", "text": "Positive anti-U1-RNP antibody"}, {"letter": "E", "text": "Erosive symmetric polyarthritis"}], "explanation": "APS is a **hypercoagulable state** marked by lupus anticoagulant, anticardiolipin and anti-β2-glycoprotein-1, giving a **prolonged PTT and false-positive syphilis test**; thrombosis, **pregnancy loss**, Libman-Sacks endocarditis, livedo and thrombocytopenia are its manifestations.", "objective": "", "remediation": {"steps": [{"teach": "APS is defined by **three antiphospholipid antibodies**.", "stem": "Which trio defines APS serology?", "options": [{"letter": "A", "text": "Lupus anticoagulant, anticardiolipin, anti-β2-glycoprotein-1"}, {"letter": "B", "text": "Anti-dsDNA, anti-Smith and anti-histone antibodies"}], "answer": "A", "explanation": "LAC, anticardiolipin (IgG/IgM) and anti-β2GP1 are the APS antibodies.", "clarify": [{"stem": "Anti-U1-RNP points to which disease?", "options": [{"letter": "A", "text": "MCTD"}, {"letter": "B", "text": "APS"}], "answer": "A", "explanation": "Anti-U1-RNP = mixed connective tissue disease, not APS."}]}, {"teach": "The **lupus anticoagulant paradox**: a clot-promoting antibody interferes with the clotting assay in the test tube.", "stem": "How does lupus anticoagulant affect the PTT?", "options": [{"letter": "A", "text": "Prolongs it"}, {"letter": "B", "text": "Shortens it"}], "answer": "A", "explanation": "Increased PTT = lupus anticoagulant, despite the patient being hypercoagulable.", "clarify": [{"stem": "Cardiolipin is the reagent in which test, explaining the false positive?", "options": [{"letter": "A", "text": "VDRL/RPR syphilis test"}, {"letter": "B", "text": "Coombs test"}], "answer": "A", "explanation": "The VDRL/RPR uses cardiolipin reagent → false positive in APS."}]}, {"teach": "Clinical manifestations are **thrombotic and obstetric**, not erosive joint disease.", "stem": "Which is an APS manifestation?", "options": [{"letter": "A", "text": "Fetal death after 10 weeks"}, {"letter": "B", "text": "Erosive arthritis of the hands"}, {"letter": "C", "text": "Gottron papules"}], "answer": "A", "explanation": "Pregnancy loss (fetal death >10 wk, recurrent early loss, pre-eclampsia <34 wk) is an APS criterion."}], "checkpoints": [{"stem": "Sterile valve vegetations in a lupus/APS patient are called:", "options": [{"letter": "A", "text": "Libman-Sacks endocarditis"}, {"letter": "B", "text": "Rheumatic mitral valvulitis"}, {"letter": "C", "text": "Infective endocarditis"}, {"letter": "D", "text": "Pericardial effusion"}], "answer": "A", "explanation": "Libman-Sacks = sterile valve vegetations/thickening in APS; they can embolize."}, {"stem": "Widespread thrombosis with multi-organ failure in APS is called:", "options": [{"letter": "A", "text": "Catastrophic APS (CAPS)"}, {"letter": "B", "text": "Scleroderma renal crisis"}, {"letter": "C", "text": "Diffuse alveolar hemorrhage"}, {"letter": "D", "text": "Lupus nephritis"}], "answer": "A", "explanation": "CAPS carries 50% mortality."}]}, "multi": true, "answers": ["A", "B", "C"], "answer": "A,B,C"}, {"id": "8", "group": 8, "section": "Seronegative spondyloarthropathies", "topic": "IBD-associated arthropathy", "skill": "Disease process", "stem": "Which pattern of IBD-associated arthropathy flares in step with bowel disease activity?", "options": [{"letter": "A", "text": "Type I lower-extremity oligoarthritis"}, {"letter": "B", "text": "Type II symmetric polyarthritis of the hands"}, {"letter": "C", "text": "Axial spondylitis"}, {"letter": "D", "text": "DIP arthritis with nail pitting"}, {"letter": "E", "text": "Arthritis mutilans"}], "explanation": "**Type I** (asymmetric LE oligoarthritis, non-erosive) **flares with the bowel**; **Type II** (symmetric hand polyarthritis) runs **independent of bowel activity**; the axial form mimics AS with HLA-B27 in 50–75%.", "objective": "", "remediation": {"steps": [{"teach": "About **20% of IBD patients** develop arthropathy, in three forms.", "stem": "Arthropathy occurs in what share of IBD patients?", "options": [{"letter": "A", "text": "About 20%"}, {"letter": "B", "text": "About 90%"}], "answer": "A", "explanation": "20% of IBD patients.", "clarify": [{"stem": "Are IBD arthropathy types I and II erosive?", "options": [{"letter": "A", "text": "No, both are non-erosive"}, {"letter": "B", "text": "Yes, both erode"}], "answer": "A", "explanation": "Both peripheral types are non-erosive."}]}, {"teach": "Two peripheral forms differ by **joint distribution** and by whether they **track colitis**.", "stem": "Symmetric polyarthritis of the hands that is independent of bowel activity is:", "options": [{"letter": "A", "text": "Type II"}, {"letter": "B", "text": "Type I"}, {"letter": "C", "text": "Axial form"}], "answer": "A", "explanation": "Type II = symmetric hands, independent of the bowel."}, {"teach": "The remaining peripheral form is **asymmetric, lower-extremity and bowel-linked**.", "stem": "The form that flares with bloody diarrhea is:", "options": [{"letter": "A", "text": "Type I"}, {"letter": "B", "text": "Type II"}], "answer": "A", "explanation": "Type I tracks bowel activity."}], "checkpoints": [{"stem": "Cornerstone of managing IBD-associated arthropathy:", "options": [{"letter": "A", "text": "Treat the underlying IBD"}, {"letter": "B", "text": "Start an IL-17 blocker"}, {"letter": "C", "text": "High-dose prednisone"}, {"letter": "D", "text": "Colchicine"}], "answer": "A", "explanation": "Treat the IBD; NSAIDs only with GI; no IL-17 blockers with IBD."}, {"stem": "HLA-B27 frequency in axial IBD arthropathy:", "options": [{"letter": "A", "text": "50–75%"}, {"letter": "B", "text": "~90%"}, {"letter": "C", "text": "<5%"}, {"letter": "D", "text": "100%"}], "answer": "A", "explanation": "Axial IBD arthropathy: X-rays like AS, HLA-B27 in 50–75% (vs 90% in AS)."}]}, "answer": "A"}, {"id": "9", "group": 9, "section": "Lupus subcategories", "topic": "Drug-induced lupus (DILE)", "skill": "Identification", "stem": "ANA +, anti-histone +, anti-dsDNA −, fever/arthritis/serositis with no renal or CNS disease, resolving after a medication is stopped → Diagnosis:", "options": [{"letter": "A", "text": "Systemic lupus erythematosus"}, {"letter": "B", "text": "Drug-induced lupus"}, {"letter": "C", "text": "Mixed connective tissue disease"}, {"letter": "D", "text": "Subacute cutaneous lupus"}, {"letter": "E", "text": "Antiphospholipid syndrome"}], "explanation": "**Anti-histone with other lupus antibodies negative** and sparing of kidney/CNS = DILE; stop the drug and symptoms resolve over 4–8 weeks (anti-histone may persist 1–2 years). Exception: **TNF-blocker DILE can be dsDNA-positive**.", "objective": "", "remediation": {"steps": [{"teach": "DILE is a **lupus-like syndrome** with fever, arthritis, serositis and rash, but it spares two organ systems.", "stem": "Which organ systems are typically spared in DILE?", "options": [{"letter": "A", "text": "Kidneys and CNS"}, {"letter": "B", "text": "Skin and joints"}], "answer": "A", "explanation": "DILE has NO CNS or renal involvement.", "clarify": [{"stem": "New lupus features in a post-menopausal woman should first suggest:", "options": [{"letter": "A", "text": "Drug-induced lupus"}, {"letter": "B", "text": "Neonatal lupus"}], "answer": "A", "explanation": "Lecture pearl: post-menopausal woman with new lupus symptoms → think DILE first."}]}, {"teach": "Its serology is a **single antibody** with the usual specific lupus antibodies negative.", "stem": "Which antibody marks DILE?", "options": [{"letter": "A", "text": "Anti-histone"}, {"letter": "B", "text": "Anti-Smith"}, {"letter": "C", "text": "Anti-U1-RNP"}], "answer": "A", "explanation": "Anti-histone (also positive in SLE), with other lupus antibodies negative.", "clarify": [{"stem": "In which DILE can anti-dsDNA be positive?", "options": [{"letter": "A", "text": "TNF-α blocker DILE"}, {"letter": "B", "text": "Hydralazine DILE"}], "answer": "A", "explanation": "TNF-blocker DILE is the exception — it can be dsDNA-positive."}]}, {"teach": "Treatment is the simplest in rheumatology.", "stem": "First step in managing DILE:", "options": [{"letter": "A", "text": "Stop the offending drug"}, {"letter": "B", "text": "Start cyclophosphamide"}, {"letter": "C", "text": "Start hydroxychloroquine"}], "answer": "A", "explanation": "Stop the drug; steroids only if needed."}], "checkpoints": [{"stem": "How long after stopping the drug do DILE symptoms typically resolve?", "options": [{"letter": "A", "text": "4–8 weeks"}, {"letter": "B", "text": "24–48 hours"}, {"letter": "C", "text": "1–2 years"}, {"letter": "D", "text": "Never"}], "answer": "A", "explanation": "Symptoms resolve over 4–8 weeks."}, {"stem": "After the drug is stopped, anti-histone antibody may:", "options": [{"letter": "A", "text": "Stay positive for 1–2 years"}, {"letter": "B", "text": "Convert to anti-Smith"}, {"letter": "C", "text": "Become undetectable within a day"}, {"letter": "D", "text": "Predict lupus nephritis"}], "answer": "A", "explanation": "Anti-histone can persist 1–2 years after the drug is stopped."}]}, "answer": "B"}, {"id": "9A", "group": 9, "section": "Lupus subcategories", "topic": "Drug-induced lupus (DILE)", "skill": "Pharmacology", "stem": "Which of the following drugs are recognized causes of drug-induced lupus?", "options": [{"letter": "A", "text": "Hydralazine"}, {"letter": "B", "text": "Procainamide"}, {"letter": "C", "text": "Isoniazid"}, {"letter": "D", "text": "Hydroxychloroquine"}, {"letter": "E", "text": "Warfarin"}], "explanation": "**CHIMP Q**: Chlorpromazine, Hydralazine, INH, Methyldopa, Procainamide, Quinidine; also minocycline, statins, CCBs, thiazides, ACE inhibitors and TNF-α inhibitors. Hydroxychloroquine treats lupus; warfarin treats APS.", "objective": "", "remediation": {"steps": [{"teach": "The lecture mnemonic for DILE drugs is a **'cute' CHIMP Q**.", "stem": "In CHIMP Q, the H stands for:", "options": [{"letter": "A", "text": "Hydralazine"}, {"letter": "B", "text": "Hydroxychloroquine"}], "answer": "A", "explanation": "H = hydralazine, a classic DILE drug.", "clarify": [{"stem": "The P in CHIMP Q is:", "options": [{"letter": "A", "text": "Procainamide"}, {"letter": "B", "text": "Prednisone"}], "answer": "A", "explanation": "P = procainamide."}]}, {"teach": "The I of the mnemonic is an **anti-tuberculosis** drug.", "stem": "Which TB drug causes DILE?", "options": [{"letter": "A", "text": "Isoniazid (INH)"}, {"letter": "B", "text": "Hydroxychloroquine"}], "answer": "A", "explanation": "INH = isoniazid."}, {"teach": "Beyond the mnemonic, antibiotics, lipid, blood-pressure and **biologic** agents are also culprits; two options on the list are lupus/APS **treatments**, not causes.", "stem": "Which is a DILE cause rather than a lupus/APS treatment?", "options": [{"letter": "A", "text": "Minocycline"}, {"letter": "B", "text": "Hydroxychloroquine"}, {"letter": "C", "text": "Warfarin"}], "answer": "A", "explanation": "Minocycline causes DILE; hydroxychloroquine and warfarin are treatments."}], "checkpoints": [{"stem": "Which biologic class causes a DILE that may be anti-dsDNA positive?", "options": [{"letter": "A", "text": "TNF-α inhibitors"}, {"letter": "B", "text": "IL-17 inhibitors"}, {"letter": "C", "text": "Anti-BLyS agents"}, {"letter": "D", "text": "JAK inhibitors"}], "answer": "A", "explanation": "TNF-α blockers → DILE with dsDNA (the exception)."}, {"stem": "Which antiarrhythmics are on the DILE list?", "options": [{"letter": "A", "text": "Procainamide and quinidine"}, {"letter": "B", "text": "Hydralazine and methyldopa"}, {"letter": "C", "text": "Isoniazid and chlorpromazine"}, {"letter": "D", "text": "Statins and thiazides"}], "answer": "A", "explanation": "Procainamide and quinidine are the CHIMP Q antiarrhythmics; the others are also DILE drugs but not antiarrhythmics."}]}, "multi": true, "answers": ["A", "B", "C"], "answer": "A,B,C"}, {"id": "10", "group": 10, "section": "Vasculitis", "topic": "Giant cell arteritis", "skill": "Management", "stem": "Suspected giant cell arteritis with new visual loss → Immediate treatment:", "options": [{"letter": "A", "text": "Low-dose oral prednisone"}, {"letter": "B", "text": "IV methylprednisolone"}, {"letter": "C", "text": "Tocilizumab alone"}, {"letter": "D", "text": "NSAIDs while awaiting biopsy"}, {"letter": "E", "text": "Methotrexate"}], "explanation": "GCA is a **rheumatologic emergency**: start prednisone 1 mg/kg immediately, and **IV methylprednisolone 1 g if vision is lost**; biopsy within 2 weeks of starting steroids; tocilizumab/MTX are steroid-sparing adjuncts.", "objective": "", "remediation": {"steps": [{"teach": "GCA is a **large-vessel granulomatous vasculitis** of the temporal artery and aortic branches in patients **over 50**.", "stem": "Typical GCA patient age:", "options": [{"letter": "A", "text": ">50 years"}, {"letter": "B", "text": "20–30 years"}], "answer": "A", "explanation": ">50 years, women 2×.", "clarify": [{"stem": "Which artery's involvement causes the visual loss?", "options": [{"letter": "A", "text": "Ophthalmic artery"}, {"letter": "B", "text": "Mesenteric artery"}], "answer": "A", "explanation": "Ophthalmic artery involvement (optic neuritis) → blindness up to 50%."}]}, {"teach": "Because **blindness occurs in up to 50%**, treatment precedes confirmation; the confirmatory test still has a time window.", "stem": "Should steroids wait for temporal artery biopsy?", "options": [{"letter": "A", "text": "No — start immediately; biopsy within 2 weeks"}, {"letter": "B", "text": "Yes — biopsy first, then treat"}], "answer": "A", "explanation": "Start prednisone now; biopsy within 2 weeks of starting steroids."}, {"teach": "Route and intensity of steroid escalate when **vision is threatened**.", "stem": "Vision loss in GCA → steroid choice:", "options": [{"letter": "A", "text": "IV methylprednisolone pulse"}, {"letter": "B", "text": "Oral low-dose prednisone"}, {"letter": "C", "text": "Topical steroid drops"}], "answer": "A", "explanation": "IV methylprednisolone 1 g if vision loss."}], "checkpoints": [{"stem": "Which symptom is a classic GCA key alongside new headache and high ESR?", "options": [{"letter": "A", "text": "Jaw claudication"}, {"letter": "B", "text": "Oral ulcers"}, {"letter": "C", "text": "Dactylitis"}, {"letter": "D", "text": "Dysphagia"}], "answer": "A", "explanation": "Jaw claudication + new headache + tender temporal artery + high ESR in a patient >50."}, {"stem": "What fraction of GCA patients also have PMR?", "options": [{"letter": "A", "text": "About 40%"}, {"letter": "B", "text": "About 5%"}, {"letter": "C", "text": "100%"}, {"letter": "D", "text": "<1%"}], "answer": "A", "explanation": "40–50% of GCA have PMR; 20% of PMR develop GCA."}]}, "answer": "B"}, {"id": "11", "group": 11, "section": "Inflammatory myopathy", "topic": "Polymyositis / dermatomyositis", "skill": "Complications", "stem": "Anti-Jo-1 positivity in polymyositis/dermatomyositis is strongly associated with which complication?", "options": [{"letter": "A", "text": "Interstitial lung disease"}, {"letter": "B", "text": "Glomerulonephritis"}, {"letter": "C", "text": "Aortic regurgitation"}, {"letter": "D", "text": "Pulmonary arterial hypertension"}, {"letter": "E", "text": "Peripheral neuropathy"}], "explanation": "**Anti-Jo-1 → ILD** in myositis; similarly anti-Scl-70 marks ILD in diffuse SSc and anti-U1-RNP (MCTD) warrants ILD screening.", "objective": "", "remediation": {"steps": [{"teach": "PM/DM are inflammatory diseases of **skeletal muscle** with proximal **weakness, not pain**.", "stem": "The chief muscle complaint in PM/DM is:", "options": [{"letter": "A", "text": "Weakness"}, {"letter": "B", "text": "Pain"}], "answer": "A", "explanation": "Weakness, not pain — plus dysphagia, dysphonia, dyspnea.", "clarify": [{"stem": "Which muscles are affected most?", "options": [{"letter": "A", "text": "Proximal (hips, thighs, shoulders)"}, {"letter": "B", "text": "Distal (hands, feet)"}], "answer": "A", "explanation": "Symmetric proximal weakness, hips/thighs > shoulders/arms."}]}, {"teach": "The myositis-specific antibody of the lecture is tied to one **extra-muscular organ**.", "stem": "Which antibody in the ANA panel is the myositis antibody?", "options": [{"letter": "A", "text": "Anti-Jo-1"}, {"letter": "B", "text": "Anti-Scl-70"}, {"letter": "C", "text": "Anticentromere"}], "answer": "A", "explanation": "Anti-Jo-1 = PM/DM."}, {"teach": "That antibody predicts **lung** involvement.", "stem": "Anti-Jo-1 → think:", "options": [{"letter": "A", "text": "Interstitial lung disease"}, {"letter": "B", "text": "Lupus nephritis"}], "answer": "A", "explanation": "Anti-Jo-1 is strongly associated with ILD."}], "checkpoints": [{"stem": "Best initial lab test when myositis is suspected:", "options": [{"letter": "A", "text": "Creatine kinase"}, {"letter": "B", "text": "ANA"}, {"letter": "C", "text": "ESR"}, {"letter": "D", "text": "Anti-Jo-1"}], "answer": "A", "explanation": "CK (also aldolase) first, then EMG and muscle biopsy."}, {"stem": "Besides muscle evaluation, every PM/DM patient should be:", "options": [{"letter": "A", "text": "Evaluated for malignancy"}, {"letter": "B", "text": "Tested for HLA-B27"}, {"letter": "C", "text": "Started on warfarin"}, {"letter": "D", "text": "Given a Schirmer test"}], "answer": "A", "explanation": "Cancer in 7–10% of PM and 15–20% of DM → evaluate for malignancy."}]}, "answer": "A"}, {"id": "12", "group": 12, "section": "Connective tissue disorders", "topic": "Sjögren syndrome", "skill": "Identification", "stem": "Which of the following are features of Sjögren syndrome?", "options": [{"letter": "A", "text": "Parotid gland enlargement"}, {"letter": "B", "text": "Positive anti-SSA and anti-SSB"}, {"letter": "C", "text": "Increased risk of non-Hodgkin lymphoma"}, {"letter": "D", "text": "Positive c-ANCA / anti-PR3"}, {"letter": "E", "text": "Schirmer test with >15 mm wetting in 5 minutes"}], "explanation": "Sjögren: lymphocytic infiltration of **salivary and lacrimal glands** → dry eyes/mouth, **parotid enlargement**; **ANA+, RF+, SSA+, SSB+**; **Schirmer positive if <5 mm in 5 min**; lip biopsy; **↑ non-Hodgkin lymphoma** risk. c-ANCA is GPA.", "objective": "", "remediation": {"steps": [{"teach": "Sjögren targets **exocrine glands**.", "stem": "Which glands are infiltrated by lymphocytes in Sjögren?", "options": [{"letter": "A", "text": "Salivary and lacrimal"}, {"letter": "B", "text": "Adrenal and thyroid"}], "answer": "A", "explanation": "Salivary and lacrimal glands → dry mouth, dry eyes, parotid enlargement.", "clarify": [{"stem": "Dry mouth in Sjögren leads to which dental problem?", "options": [{"letter": "A", "text": "Tooth decay"}, {"letter": "B", "text": "Gingival hyperplasia"}], "answer": "A", "explanation": "Loss of saliva → tooth decay."}]}, {"teach": "Serology overlaps with lupus but **two antibodies dominate**; ANCA belongs to vasculitis.", "stem": "Which antibody pair is typical of Sjögren?", "options": [{"letter": "A", "text": "Anti-SSA and anti-SSB"}, {"letter": "B", "text": "c-ANCA and p-ANCA"}, {"letter": "C", "text": "Anti-Scl-70 and anticentromere"}], "answer": "A", "explanation": "SSA (Ro) and SSB (La), with ANA and RF also positive."}, {"teach": "The tear test is positive when wetting is **low**.", "stem": "A positive Schirmer test shows:", "options": [{"letter": "A", "text": "<5 mm wetting in 5 minutes"}, {"letter": "B", "text": ">15 mm wetting in 5 minutes"}], "answer": "A", "explanation": "Schirmer positive if <5 mm in 5 minutes.", "clarify": [{"stem": "Confirmatory tissue test in Sjögren:", "options": [{"letter": "A", "text": "Lip (minor salivary gland) biopsy"}, {"letter": "B", "text": "Temporal artery biopsy"}], "answer": "A", "explanation": "Lip biopsy of minor salivary glands."}]}], "checkpoints": [{"stem": "Which malignancy risk is increased in Sjögren?", "options": [{"letter": "A", "text": "Non-Hodgkin lymphoma"}, {"letter": "B", "text": "Hepatocellular carcinoma"}, {"letter": "C", "text": "Melanoma"}, {"letter": "D", "text": "Thyroid carcinoma"}], "answer": "A", "explanation": "Sjögren carries increased NHL risk — lymphoma watch."}, {"stem": "Which drugs increase saliva and tears in Sjögren?", "options": [{"letter": "A", "text": "Pilocarpine or cevimeline"}, {"letter": "B", "text": "Antihistamines"}, {"letter": "C", "text": "Tricyclic antidepressants"}, {"letter": "D", "text": "Amphetamines (Adderall)"}], "answer": "A", "explanation": "Pilocarpine/cevimeline are parasympathomimetics; antihistamines, antidepressants and Adderall dry the patient and should be avoided."}]}, "multi": true, "answers": ["A", "B", "C"], "answer": "A,B,C"}, {"id": "13", "group": 13, "section": "SLE diagnostics", "topic": "Systemic lupus erythematosus", "skill": "Diagnostics & imaging", "stem": "In the practical workup of suspected lupus, which test must always be checked before the ANA panel is interpreted?", "options": [{"letter": "A", "text": "Urinalysis"}, {"letter": "B", "text": "Anti-Jo-1"}, {"letter": "C", "text": "HLA-B27"}, {"letter": "D", "text": "Schirmer test"}, {"letter": "E", "text": "Nailfold capillaroscopy"}], "explanation": "Lecture approach: history → **CBC, CMP, ESR, CRP, C3, C4 → must check a URINALYSIS** → ANA → panel if positive. Proteinuria flags lupus nephritis. **Do not diagnose lupus unless certain.**", "objective": "", "remediation": {"steps": [{"teach": "The lupus workup moves from **general labs** to the **sensitive screen** to the **specific panel**.", "stem": "The ANA panel is run when:", "options": [{"letter": "A", "text": "ANA is positive"}, {"letter": "B", "text": "Before any ANA"}], "answer": "A", "explanation": "Positive ANA → ANA panel (dsDNA, Smith, SSA/SSB, RNP, histone, centromere, Scl-70, Jo-1).", "clarify": [{"stem": "Which complements are checked in the initial labs?", "options": [{"letter": "A", "text": "C3 and C4"}, {"letter": "B", "text": "None — complements are not part of it"}], "answer": "A", "explanation": "CBC, CMP, ESR, CRP, C3, C4 are the initial labs."}]}, {"teach": "One cheap test detects the organ complication that defines severe disease — **proteinuria**.", "stem": "Proteinuria in lupus signals which organ involvement?", "options": [{"letter": "A", "text": "Lupus nephritis"}, {"letter": "B", "text": "Serositis"}, {"letter": "C", "text": "CNS lupus"}], "answer": "A", "explanation": "Proteinuria >500 mg/24 h = renal involvement."}, {"teach": "That test is the one the lecturer insists must not be skipped.", "stem": "Which test must be checked in every suspected lupus patient?", "options": [{"letter": "A", "text": "Urinalysis"}, {"letter": "B", "text": "HLA-B27"}], "answer": "A", "explanation": "Must check a urinalysis."}], "checkpoints": [{"stem": "Proteinuria cutoff for the renal criterion of SLE:", "options": [{"letter": "A", "text": ">500 mg/24 h"}, {"letter": "B", "text": ">3.5 g/24 h"}, {"letter": "C", "text": ">50 mg/24 h"}, {"letter": "D", "text": ">150 mg/24 h"}], "answer": "A", "explanation": "Renal criterion: proteinuria >500 mg/24 h."}, {"stem": "Which inflammatory marker is better for lupus (versus CRP for SpA)?", "options": [{"letter": "A", "text": "ESR"}, {"letter": "B", "text": "CRP"}, {"letter": "C", "text": "Procalcitonin"}, {"letter": "D", "text": "Ferritin"}], "answer": "A", "explanation": "ESR is better for lupus; CRP is better for spondyloarthritis."}]}, "answer": "A"}, {"id": "14", "group": 14, "section": "Seronegative spondyloarthropathies", "topic": "Psoriatic arthritis", "skill": "Identification", "stem": "DIP-predominant arthritis that looks like osteoarthritis but with nail pitting → Diagnosis:", "options": [{"letter": "A", "text": "Osteoarthritis"}, {"letter": "B", "text": "Psoriatic arthritis"}, {"letter": "C", "text": "Rheumatoid arthritis"}, {"letter": "D", "text": "Reactive arthritis"}, {"letter": "E", "text": "Ankylosing spondylitis"}], "explanation": "**Nail pitting is specific for PsA**; the DIP pattern mimics OA. Other PsA buzzwords: dactylitis, **pencil-in-cup** X-ray, **arthritis mutilans with telescoping digits**.", "objective": "", "remediation": {"steps": [{"teach": "PsA affects **20–30% of psoriasis** patients and has **5 joint patterns**.", "stem": "Which pattern of PsA looks like OA?", "options": [{"letter": "A", "text": "DIP arthritis"}, {"letter": "B", "text": "Symmetric polyarthritis"}], "answer": "A", "explanation": "DIP arthritis looks like OA but has nail pitting.", "clarify": [{"stem": "Symmetric polyarthritis PsA mimics which disease?", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Ankylosing spondylitis"}], "answer": "A", "explanation": "Symmetric polyarthritis looks like RA."}]}, {"teach": "A **nail finding** separates PsA from OA.", "stem": "Which nail finding is specific for PsA?", "options": [{"letter": "A", "text": "Nail pitting"}, {"letter": "B", "text": "Clubbing"}, {"letter": "C", "text": "Splinter hemorrhages"}], "answer": "A", "explanation": "Nail pitting is specific for PsA; onycholysis also occurs."}, {"teach": "Radiographs add a characteristic deformity.", "stem": "Classic PsA X-ray finding:", "options": [{"letter": "A", "text": "Pencil-in-cup deformity"}, {"letter": "B", "text": "Bamboo spine"}, {"letter": "C", "text": "Non-erosive Jaccoud deformity"}], "answer": "A", "explanation": "Pencil-in-cup = PsA; bamboo spine = AS; Jaccoud = lupus."}], "checkpoints": [{"stem": "Resorptive destruction with telescoping digits in PsA is called:", "options": [{"letter": "A", "text": "Arthritis mutilans"}, {"letter": "B", "text": "Dactylitis"}, {"letter": "C", "text": "Enthesitis"}, {"letter": "D", "text": "Jaccoud arthropathy"}], "answer": "A", "explanation": "Arthritis mutilans = resorptive destruction with telescoping digits."}, {"stem": "A young man presenting with new-onset psoriasis should be evaluated for:", "options": [{"letter": "A", "text": "HIV infection"}, {"letter": "B", "text": "Hepatitis B"}, {"letter": "C", "text": "Chlamydia"}, {"letter": "D", "text": "Tuberculosis"}], "answer": "A", "explanation": "Lecture pearl: young man with new psoriasis → think HIV."}]}, "answer": "B"}, {"id": "15", "group": 15, "section": "Scleroderma", "topic": "Systemic sclerosis (scleroderma)", "skill": "Management", "stem": "First-line drug class for scleroderma renal crisis (malignant hypertension + acute renal failure):", "options": [{"letter": "A", "text": "High-dose corticosteroids"}, {"letter": "B", "text": "ACE inhibitors"}, {"letter": "C", "text": "Cyclophosphamide"}, {"letter": "D", "text": "Beta blockers"}, {"letter": "E", "text": "Loop diuretics"}], "explanation": "Renal crisis occurs in **diffuse disease within the first 5 years**; **treat with ACE inhibitor/ARB**, check BP monthly, and avoid **steroids >7.5 mg**, which can trigger it; CCBs may protect.", "objective": "", "remediation": {"steps": [{"teach": "Renal crisis is a **hypertensive emergency** of diffuse SSc.", "stem": "Scleroderma renal crisis presents as:", "options": [{"letter": "A", "text": "Malignant HTN + acute renal failure"}, {"letter": "B", "text": "Nephrotic proteinuria with normal BP"}], "answer": "A", "explanation": "Malignant hypertension with acute renal failure.", "clarify": [{"stem": "When does it usually occur?", "options": [{"letter": "A", "text": "First 5 years of diffuse disease"}, {"letter": "B", "text": "After 20 years of limited disease"}], "answer": "A", "explanation": "Diffuse disease, first 5 years."}]}, {"teach": "A common rheumatology drug is a **trigger**, so blood pressure is monitored monthly.", "stem": "Which medication exposure can trigger renal crisis?", "options": [{"letter": "A", "text": "Prednisone >7.5 mg/day"}, {"letter": "B", "text": "ACE inhibitor"}, {"letter": "C", "text": "PPI"}], "answer": "A", "explanation": "Steroids >7.5 mg can trigger renal crisis."}, {"teach": "The treatment targets the renin–angiotensin axis.", "stem": "Drug of choice for renal crisis:", "options": [{"letter": "A", "text": "ACE inhibitor / ARB"}, {"letter": "B", "text": "IV methylprednisolone"}], "answer": "A", "explanation": "ACE inhibitor/ARB; steroids are the trigger, not the treatment."}], "checkpoints": [{"stem": "Which monitoring is recommended in diffuse SSc because of renal crisis risk?", "options": [{"letter": "A", "text": "Monthly blood pressure checks"}, {"letter": "B", "text": "Annual temporal artery biopsy"}, {"letter": "C", "text": "Weekly CK"}, {"letter": "D", "text": "Monthly PTT"}], "answer": "A", "explanation": "Check BP monthly."}, {"stem": "Which drug class may be protective against renal crisis?", "options": [{"letter": "A", "text": "Calcium channel blockers"}, {"letter": "B", "text": "NSAIDs"}, {"letter": "C", "text": "Corticosteroids"}, {"letter": "D", "text": "Cyclophosphamide"}], "answer": "A", "explanation": "CCBs may protect; steroids provoke."}]}, "answer": "B"}, {"id": "16", "group": 16, "section": "SLE classification", "topic": "Systemic lupus erythematosus", "skill": "Identification", "stem": "Which of the following are items in the classic ACR classification criteria for SLE (MD SOAP BRAIN)?", "options": [{"letter": "A", "text": "Malar rash"}, {"letter": "B", "text": "Oral ulcers"}, {"letter": "C", "text": "Raynaud phenomenon"}, {"letter": "D", "text": "Serositis"}, {"letter": "E", "text": "Dry eyes and dry mouth"}], "explanation": "**MD SOAP BRAIN**: Malar rash, Discoid rash, Serositis, Oral ulcers, Arthritis, Photosensitivity, Blood, Renal, ANA, Immunologic, Neurologic. The criteria were designed for **clinical-trial enrollment, not diagnosis**. Raynaud belongs to SSc/MCTD and sicca to Sjögren.", "objective": "", "remediation": {"steps": [{"teach": "The criteria exist to standardize **research enrollment**.", "stem": "The ACR criteria are primarily:", "options": [{"letter": "A", "text": "Classification criteria for trial enrollment"}, {"letter": "B", "text": "Diagnostic criteria"}], "answer": "A", "explanation": "Designed to enroll patients in trials — a helpful guide, not diagnostic criteria.", "clarify": [{"stem": "Entry criterion of the 2019 EULAR/ACR system:", "options": [{"letter": "A", "text": "ANA ≥1:80"}, {"letter": "B", "text": "Anti-dsDNA positive"}], "answer": "A", "explanation": "ANA ≥1:80 is the entry criterion; then ≥10 points with ≥1 clinical domain."}]}, {"teach": "Mucocutaneous items: two rashes, one mucosal lesion, and sun sensitivity.", "stem": "Which is a mucocutaneous ACR item?", "options": [{"letter": "A", "text": "Oral ulcers"}, {"letter": "B", "text": "Raynaud phenomenon"}, {"letter": "C", "text": "Parotid enlargement"}], "answer": "A", "explanation": "Oral ulcers (painless, palate) are a criterion; Raynaud and parotid swelling are not."}, {"teach": "Serosal, joint, blood, renal, neurologic and immunologic domains complete the list; **sicca** is not among them.", "stem": "Which is an ACR criterion?", "options": [{"letter": "A", "text": "Serositis (pleuritis/pericarditis)"}, {"letter": "B", "text": "Dry eyes and dry mouth"}], "answer": "A", "explanation": "Serositis is a criterion; dry eyes/mouth are Sjögren features."}], "checkpoints": [{"stem": "Which hematologic cutoff meets the ACR blood criterion?", "options": [{"letter": "A", "text": "Platelets <100,000"}, {"letter": "B", "text": "Platelets <400,000"}, {"letter": "C", "text": "WBC <10,000"}, {"letter": "D", "text": "Lymphocytes <3,000"}], "answer": "A", "explanation": "Blood: WBC <4,000, lymphocytes <1,000, platelets <100,000, or hemolytic anemia."}, {"stem": "Highest-scoring single item in the 2019 EULAR/ACR system:", "options": [{"letter": "A", "text": "Class III or IV lupus nephritis"}, {"letter": "B", "text": "Malar rash"}, {"letter": "C", "text": "Oral ulcers"}, {"letter": "D", "text": "Fever"}], "answer": "A", "explanation": "Class III/IV nephritis = 10 points, enough to classify on its own with ANA ≥1:80."}]}, "multi": true, "answers": ["A", "B", "D"], "answer": "A,B,D"}, {"id": "17", "group": 17, "section": "SLE serology", "topic": "Systemic lupus erythematosus", "skill": "Disease process", "stem": "Which antibody correlates with lupus disease activity and, together with low C3/C4, predicts lupus nephritis and a worse prognosis?", "options": [{"letter": "A", "text": "ANA"}, {"letter": "B", "text": "Anti-Smith"}, {"letter": "C", "text": "Anti-dsDNA"}, {"letter": "D", "text": "Anti-SSA (Ro)"}, {"letter": "E", "text": "Anti-histone"}], "explanation": "**Anti-dsDNA tracks disease activity**; rising dsDNA + falling complements = impending **lupus nephritis** and worse prognosis. ANA titer does not track activity; anti-Smith is specific but static.", "objective": "", "remediation": {"steps": [{"teach": "Complements are **consumed** in active immune-complex disease.", "stem": "Active lupus typically does what to C3/C4?", "options": [{"letter": "A", "text": "Lowers them"}, {"letter": "B", "text": "Raises them"}], "answer": "A", "explanation": "Low C3/C4 with high dsDNA = active disease, worse prognosis.", "clarify": [{"stem": "Which organ is most threatened by active immune-complex lupus?", "options": [{"letter": "A", "text": "Kidney"}, {"letter": "B", "text": "Thyroid"}], "answer": "A", "explanation": "Lupus nephritis."}]}, {"teach": "Of the lupus antibodies, exactly one is used to **follow activity**; the screening titer does not.", "stem": "Which does NOT track lupus activity?", "options": [{"letter": "A", "text": "ANA titer"}, {"letter": "B", "text": "Anti-dsDNA level"}], "answer": "A", "explanation": "ANA titer does not correlate with activity."}, {"teach": "That tracking antibody plus low complements points to the renal complication.", "stem": "Rising dsDNA + falling C3/C4 → think:", "options": [{"letter": "A", "text": "Impending lupus nephritis"}, {"letter": "B", "text": "Drug-induced lupus"}, {"letter": "C", "text": "Antiphospholipid syndrome"}], "answer": "A", "explanation": "Rising dsDNA with falling complements = impending nephritis."}], "checkpoints": [{"stem": "Points assigned to anti-dsDNA in the 2019 EULAR/ACR system:", "options": [{"letter": "A", "text": "6"}, {"letter": "B", "text": "2"}, {"letter": "C", "text": "3"}, {"letter": "D", "text": "10"}], "answer": "A", "explanation": "Anti-dsDNA 6, anti-Smith 6; antiphospholipid antibody 2; low C3 or C4 3; class III/IV nephritis 10."}, {"stem": "Lupus nephritis induction regimen:", "options": [{"letter": "A", "text": "Cyclophosphamide or MMF plus steroids"}, {"letter": "B", "text": "Hydroxychloroquine monotherapy"}, {"letter": "C", "text": "NSAIDs and sun avoidance"}, {"letter": "D", "text": "Long-term warfarin after LMWH"}], "answer": "A", "explanation": "Induction with cyclophosphamide or MMF + steroids ± belimumab/voclosporin."}]}, "answer": "C"}, {"id": "18", "group": 18, "section": "Vasculitis", "topic": "Eosinophilic granulomatosis with polyangiitis (EGPA)", "skill": "Pharmacology", "stem": "Which agent is used for less severe eosinophilic granulomatosis with polyangiitis (Churg-Strauss)?", "options": [{"letter": "A", "text": "Mepolizumab"}, {"letter": "B", "text": "Rituximab"}, {"letter": "C", "text": "Cyclophosphamide"}, {"letter": "D", "text": "Tocilizumab"}, {"letter": "E", "text": "Hydroxychloroquine"}], "explanation": "EGPA = **asthma + eosinophilia** + small-vessel vasculitis with **p-ANCA/MPO**; severe disease gets steroids, rituximab or cyclophosphamide, while **mepolizumab (anti-IL-5)** is used for less severe disease.", "objective": "", "remediation": {"steps": [{"teach": "EGPA is identified by an **airway** feature plus a **blood count** feature.", "stem": "Which pair identifies EGPA?", "options": [{"letter": "A", "text": "Asthma + eosinophilia"}, {"letter": "B", "text": "Sinusitis + glomerulonephritis"}], "answer": "A", "explanation": "ASTHMA + EOSINOPHILIA = EGPA; sinusitis + GN = GPA.", "clarify": [{"stem": "ANCA type in EGPA:", "options": [{"letter": "A", "text": "p-ANCA / anti-MPO"}, {"letter": "B", "text": "c-ANCA / anti-PR3"}], "answer": "A", "explanation": "p-ANCA/MPO → EGPA and MPA."}]}, {"teach": "Treatment is **stratified by severity**: cytotoxic/biologic induction for severe disease, a targeted eosinophil biologic for milder disease.", "stem": "Severe EGPA induction uses:", "options": [{"letter": "A", "text": "Systemic steroids with rituximab or cyclophosphamide"}, {"letter": "B", "text": "Mepolizumab monotherapy without steroids"}, {"letter": "C", "text": "Colchicine or apremilast"}], "answer": "A", "explanation": "Severe: systemic steroids, rituximab, cyclophosphamide."}, {"teach": "The milder-disease biologic targets the eosinophil cytokine.", "stem": "Less severe EGPA → agent:", "options": [{"letter": "A", "text": "Mepolizumab"}, {"letter": "B", "text": "Rituximab"}], "answer": "A", "explanation": "Mepolizumab (Nucala, IL-5 antagonist) for less severe disease."}], "checkpoints": [{"stem": "Confirmatory diagnostic approach in EGPA:", "options": [{"letter": "A", "text": "Biopsy of lung or skin"}, {"letter": "B", "text": "Mesenteric angiography"}, {"letter": "C", "text": "Lip biopsy"}, {"letter": "D", "text": "Schober test"}], "answer": "A", "explanation": "Biopsy of lung or skin plus p-ANCA/MPO."}, {"stem": "Deaths in EGPA are mainly from which complications?", "options": [{"letter": "A", "text": "Cardiac and pulmonary"}, {"letter": "B", "text": "Renal"}, {"letter": "C", "text": "Hepatic"}, {"letter": "D", "text": "Ocular"}], "answer": "A", "explanation": "5-year survival 25% in lecture; death from cardiac/pulmonary complications."}]}, "answer": "A"}, {"id": "19", "group": 19, "section": "Lupus subcategories", "topic": "Mixed connective tissue disease (MCTD)", "skill": "Identification", "stem": "Arthritis + Raynaud phenomenon + positive anti-U1-RNP with other lupus antibodies negative → Diagnosis:", "options": [{"letter": "A", "text": "Systemic lupus erythematosus (SLE)"}, {"letter": "B", "text": "Mixed connective tissue disease"}, {"letter": "C", "text": "Limited systemic sclerosis"}, {"letter": "D", "text": "Polymyositis"}, {"letter": "E", "text": "Drug-induced lupus"}], "explanation": "MCTD = **overlap of lupus + scleroderma + polymyositis**, presenting with **arthritis + Raynaud**; **anti-U1-RNP** positive alone; **watch for ILD**; women 9:1; manage like lupus.", "objective": "", "remediation": {"steps": [{"teach": "MCTD is an **overlap syndrome** of three diseases.", "stem": "MCTD overlaps which three diseases?", "options": [{"letter": "A", "text": "Lupus, scleroderma, polymyositis"}, {"letter": "B", "text": "RA, osteoarthritis, psoriatic arthritis"}], "answer": "A", "explanation": "Lupus + scleroderma + polymyositis.", "clarify": [{"stem": "Female:male ratio in MCTD:", "options": [{"letter": "A", "text": "9:1"}, {"letter": "B", "text": "1:3"}], "answer": "A", "explanation": "Women:men 9:1."}]}, {"teach": "Its serology is a **single nuclear antibody**.", "stem": "Antibody of MCTD:", "options": [{"letter": "A", "text": "Anti-U1-RNP"}, {"letter": "B", "text": "Anti-histone"}, {"letter": "C", "text": "Anticentromere"}], "answer": "A", "explanation": "Anti-U1-RNP with other lupus antibodies negative."}, {"teach": "Like SSc and Jo-1 myositis, MCTD threatens one organ.", "stem": "MCTD patients should be screened for:", "options": [{"letter": "A", "text": "Interstitial lung disease"}, {"letter": "B", "text": "Glomerulonephritis"}], "answer": "A", "explanation": "Watch for pulmonary involvement (ILD)."}], "checkpoints": [{"stem": "Which two presenting features are classic for MCTD?", "options": [{"letter": "A", "text": "Arthritis and Raynaud phenomenon"}, {"letter": "B", "text": "Oral and genital ulcers"}, {"letter": "C", "text": "Dry eyes and dry mouth"}, {"letter": "D", "text": "Urethritis and conjunctivitis"}], "answer": "A", "explanation": "Arthritis + Raynaud = MCTD; ulcers = Behçet; sicca = Sjögren; urethritis + conjunctivitis = reactive arthritis."}, {"stem": "Management of MCTD is modeled on:", "options": [{"letter": "A", "text": "Lupus"}, {"letter": "B", "text": "Ankylosing spondylitis"}, {"letter": "C", "text": "Reactive arthritis"}, {"letter": "D", "text": "Psoriatic arthritis"}], "answer": "A", "explanation": "Management similar to lupus."}]}, "answer": "B"}, {"id": "20", "group": 20, "section": "Inflammatory myopathy", "topic": "Polymyositis / dermatomyositis", "skill": "Identification", "stem": "Which of the following are skin findings of dermatomyositis?", "options": [{"letter": "A", "text": "Gottron papules"}, {"letter": "B", "text": "Heliotrope rash"}, {"letter": "C", "text": "Shawl sign"}, {"letter": "D", "text": "Keratoderma blennorrhagicum"}, {"letter": "E", "text": "Pathergy pustule"}], "explanation": "DM = PM + skin: **Gottron papules** (highly specific, over MCP/PIP/DIP), **heliotrope rash** of the upper eyelids, **shawl and V
