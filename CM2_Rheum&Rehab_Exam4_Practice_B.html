ding most reliably separates this from osteoarthritis of the DIP joints?", "options": [{"letter": "A", "text": "Nail pitting with dactylitis"}, {"letter": "B", "text": "Age of 44"}, {"letter": "C", "text": "Joint pain"}, {"letter": "D", "text": "DIP joint involvement"}, {"letter": "E", "text": "Male sex"}], "answer": "A", "explanation": "Both involve the DIPs; nail changes, dactylitis and enthesitis belong to PsA.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "38B", "group": 38, "stem": "The most appropriate disease-modifying agent for his peripheral arthritis and skin is:", "options": [{"letter": "A", "text": "Allopurinol"}, {"letter": "B", "text": "Hydroxychloroquine"}, {"letter": "C", "text": "Prednisone 20 mg daily"}, {"letter": "D", "text": "Methotrexate"}, {"letter": "E", "text": "Colchicine"}], "answer": "D", "explanation": "csDMARDs (methotrexate, sulfasalazine) first for peripheral disease and skin; TNF/IL-17/IL-23/JAK inhibitors or apremilast next — choose one agent covering every active domain.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "39", "group": 39, "stem": "An 81-year-old woman underwent hip fracture repair and has been in the hospital for 3 days. She lives alone, needs moderate assistance to transfer, and becomes exhausted after about 90 minutes of therapy per day. Her goal is to return home.\n\nWhich of the following is the most appropriate rehabilitation setting?", "options": [{"letter": "A", "text": "Acute inpatient rehabilitation"}, {"letter": "B", "text": "Home health rehabilitation"}, {"letter": "C", "text": "Subacute rehabilitation in a skilled nursing facility"}, {"letter": "D", "text": "Outpatient rehabilitation"}, {"letter": "E", "text": "Long-term acute care hospital"}], "answer": "C", "explanation": "Orthopedic diagnosis, qualifying 3-day hospital stay, tolerates ~2 h/day (not 3) = subacute rehab; LOS 3–4 weeks.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "39A", "group": 39, "stem": "If after 4 weeks she cannot meet her functional goals for home, the next step is:", "options": [{"letter": "A", "text": "Discharge to outpatient therapy"}, {"letter": "B", "text": "Transition to long-term care resident status in the same facility"}, {"letter": "C", "text": "Discharge home with home health"}, {"letter": "D", "text": "Transfer to a long-term acute care hospital"}, {"letter": "E", "text": "Transfer to acute inpatient rehabilitation"}], "answer": "B", "explanation": "SAR patients who cannot reach home-going goals can convert to long-term care in the SNF.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "40", "group": 40, "stem": "A 31-year-old woman with Crohn's disease has recurrent episodes of a swollen right knee and left ankle that appear whenever her bloody diarrhea flares and settle when the colitis is controlled. Hand joints and spine are normal. Radiographs of the knee show no erosions.\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Type I IBD-associated peripheral arthropathy"}, {"letter": "C", "text": "Type II IBD-associated peripheral arthropathy"}, {"letter": "D", "text": "Septic arthritis"}, {"letter": "E", "text": "Reactive arthritis"}], "answer": "B", "explanation": "Asymmetric lower-extremity oligoarthritis that tracks bowel activity and is non-erosive = Type I; Type II is symmetric hand polyarthritis independent of the bowel.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "40A", "group": 40, "stem": "Which agent treats both the bowel disease and the joints?", "options": [{"letter": "A", "text": "Secukinumab"}, {"letter": "B", "text": "Naproxen"}, {"letter": "C", "text": "Hydroxychloroquine"}, {"letter": "D", "text": "Colchicine"}, {"letter": "E", "text": "Adalimumab"}], "answer": "E", "explanation": "TNF inhibitors (also IL-23, IL-12/23, JAK) treat IBD and its SpA; IL-17 blockers unmask IBD; NSAIDs can flare colitis.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "41", "group": 41, "stem": "A 78-year-old woman with mild dementia had a right hip fracture repaired and is ordered non-weight-bearing on the right leg. She has fair upper-body strength and tires easily. The physical therapist is choosing her device.\n\nWhich of the following is the most appropriate device?", "options": [{"letter": "A", "text": "Axillary crutches"}, {"letter": "B", "text": "Standard walker"}, {"letter": "C", "text": "Large-base quad cane"}, {"letter": "D", "text": "Lofstrand forearm crutches"}, {"letter": "E", "text": "Hemi-walker"}], "answer": "B", "explanation": "NWB → bilateral UE support; walker is the most stable, mimics a normal gait pattern for cognitive deficits, and crutches require strength/coordination/cognition she lacks.", "objective": "", "section": "Assistive Devices"}, {"id": "41A", "group": 41, "stem": "The walker handgrip is set at the level of the:", "options": [{"letter": "A", "text": "Umbilicus"}, {"letter": "B", "text": "Iliac crest, giving 45° of elbow flexion"}, {"letter": "C", "text": "Ulnar styloid when standing, giving 20–30° of elbow flexion"}, {"letter": "D", "text": "Greater trochanter, giving a straight elbow"}, {"letter": "E", "text": "Manufacturer's height marking"}], "answer": "C", "explanation": "Measure — never trust the device's height markings; 20–30° elbow flexion gives the best mechanical advantage.", "objective": "", "section": "Assistive Devices"}, {"id": "41B", "group": 41, "stem": "The correct gait sequence with the walker is:", "options": [{"letter": "A", "text": "Left leg, then walker, then right leg"}, {"letter": "B", "text": "Walker forward, then the left leg, then the right leg"}, {"letter": "C", "text": "Walker forward, then the right leg, then the left leg"}, {"letter": "D", "text": "Both legs together, then walker"}, {"letter": "E", "text": "Right leg, then walker, then left leg"}], "answer": "C", "explanation": "Walker → affected leg → unaffected leg.", "objective": "", "section": "Assistive Devices"}, {"id": "42", "group": 42, "stem": "A 47-year-old woman with 3 months of symmetric small-joint polyarthritis has 12 swollen joints, RF 180 IU/mL, strongly positive anti-CCP, CRP 38 mg/L and MCP erosions on film. She smokes and hopes to become pregnant within the next year.\n\nWhich of the following agents is most appropriate to use given her pregnancy plans?", "options": [{"letter": "A", "text": "Cyclophosphamide"}, {"letter": "B", "text": "Hydroxychloroquine"}, {"letter": "C", "text": "Leflunomide"}, {"letter": "D", "text": "Methotrexate"}, {"letter": "E", "text": "Tofacitinib"}], "answer": "B", "explanation": "Methotrexate is teratogenic and leflunomide persists up to 2 years; hydroxychloroquine (and sulfasalazine, certolizumab) can be used around pregnancy.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "42A", "group": 42, "stem": "Which feature most strongly predicts erosive, poor-prognosis disease?", "options": [{"letter": "A", "text": "Female sex"}, {"letter": "B", "text": "Three-month symptom duration"}, {"letter": "C", "text": "Smoking history"}, {"letter": "D", "text": "High-titer anti-CCP positivity"}, {"letter": "E", "text": "Age under 50"}], "answer": "D", "explanation": "High-titer anti-CCP/RF, high CRP and early erosions predict aggressive disease. Smoking is a risk factor for developing RA, not the strongest prognostic marker.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "42B", "group": 42, "stem": "Before a TNF inhibitor is eventually added, she must be screened for:", "options": [{"letter": "A", "text": "Retinal toxicity"}, {"letter": "B", "text": "Pulmonary function"}, {"letter": "C", "text": "Osteoporosis by DEXA"}, {"letter": "D", "text": "HLA-B27"}, {"letter": "E", "text": "Latent tuberculosis and hepatitis B/C"}], "answer": "E", "explanation": "All biologics/JAK inhibitors: TB (PPD/Quantiferon), hepatitis B/C, HIV, CXR first.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "43", "group": 43, "stem": "A 50-year-old woman has 3 months of progressive difficulty climbing stairs, rising from a chair and combing her hair, plus mild trouble swallowing solids. She has a purple discoloration of the upper eyelids and scaly red papules over the knuckles (shown). Neck flexors, deltoids and hip flexors are weak with normal reflexes and sensation.\n\nCK 3,400 U/L · aldolase elevated · ANA 1:160\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Polymyalgia rheumatica"}, {"letter": "B", "text": "Myasthenia gravis"}, {"letter": "C", "text": "Systemic lupus erythematosus"}, {"letter": "D", "text": "Polymyositis"}, {"letter": "E", "text": "Dermatomyositis"}], "answer": "E", "explanation": "Proximal weakness + heliotrope rash + Gottron papules + high CK = dermatomyositis. Lupus rash is malar; PMR has a normal CK; myasthenia is fatigable with a normal CK.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEUAUMDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAwABAgQFBwYI/8QAPRAAAgEDAwIFAgUCBQMEAgMAAQIRAAMhBBIxBUEGEyJRYXHwBxQygZGhsRUjQsHRJDPxFlJi4XKSNUOC/8QAGwEAAgMBAQEAAAAAAAAAAAAAAQIAAwQFBgf/xAAuEQACAQQBAwMDBAIDAQAAAAAAAQIDBBEhMQUSQRMyURQVIgZCYaFSsTOBkeH/2gAMAwEAAhEDEQA/AOHEM0mIETJqSiPoo/mkQAdoBECZHenVMQRkicV3zjuWUIQY54ik6kA/BnIp15gAcSQakSNvzx9/1oC5wyChSwYnHtU2BmeZptqgbiQM5JHFNbuNctvdsWbt5bIDOUQkL9aDaXI6i5cCBiAQQQcgVMKF3N8TFXNT0fqli4iHShnuhWXZdVpkSOCc5FAOk1hbb+XUGMgvzSOpFeS+NpVnxEgWa4cmWnv3qDQT6IjkADirKdL6o0MtlNowck81MdG6oZby7QWcEE0vrw+S2PTLjxEpBfKmZHtUyCBB/VHcUd9Bq7FweZYDMOApoLpdsQbti9tiT6D/ABTKpF+SupZ1o+6LGZNpPpkgRNSYkgkHtBoa6vTsxa4zKJ4INTt3bT4W4pEyAafK8GZ0prlBUBhQAP0wBRgVgKCYmSDUbZZi le disease, the most important additional evaluation is:", "options": [{"letter": "A", "text": "Temporal artery biopsy"}, {"letter": "B", "text": "HLA-B27 testing"}, {"letter": "C", "text": "Age-appropriate malignancy screening with CT chest/abdomen/pelvis"}, {"letter": "D", "text": "Slit-lamp examination"}, {"letter": "E", "text": "Renal biopsy"}], "answer": "C", "explanation": "Cancer occurs in 15–20% of dermatomyositis (7–10% of polymyositis) — evaluate every patient.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis"}, {"id": "43B", "group": 43, "stem": "The gold-standard test to establish the diagnosis is:", "options": [{"letter": "A", "text": "Muscle biopsy"}, {"letter": "B", "text": "Electromyography"}, {"letter": "C", "text": "Serum CK"}, {"letter": "D", "text": "MRI of the thighs"}, {"letter": "E", "text": "Anti-Jo-1 antibody"}], "answer": "A", "explanation": "Biopsy: perifascicular atrophy with perivascular inflammation (DM); endomysial infiltrate (PM). CK is the best initial test, EMG is myopathic.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis"}, {"id": "43C", "group": 43, "stem": "The most appropriate initial treatment is:", "options": [{"letter": "A", "text": "Naproxen and physical therapy"}, {"letter": "B", "text": "High-dose corticosteroids"}, {"letter": "C", "text": "IVIG"}, {"letter": "D", "text": "Hydroxychloroquine"}, {"letter": "E", "text": "Weekly methotrexate alone"}], "answer": "B", "explanation": "High-dose steroids first; azathioprine or methotrexate as steroid-sparing agents.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis"}, {"id": "44", "group": 44, "stem": "A 64-year-old man has had four gout attacks this year and now presents with 1 day of a hot, swollen left knee. He has CKD stage 3 (eGFR 42), a prior bleeding gastric ulcer, and a small chalky nodule on the right olecranon. Aspirate shows intracellular needle-shaped crystals with a negative Gram stain.\n\nSerum uric acid: 9.8 mg/dL · Creatinine 1.7 mg/dL\n\nWhich of the following is the best treatment for this flare?", "options": [{"letter": "A", "text": "Allopurinol 300 mg daily started today"}, {"letter": "B", "text": "Naproxen 500 mg twice daily"}, {"letter": "C", "text": "Probenecid 500 mg twice daily"}, {"letter": "D", "text": "Colchicine 1.2 mg then 0.6 mg hourly until relief"}, {"letter": "E", "text": "Intra-articular glucocorticoid after aspiration"}], "answer": "E", "explanation": "CKD + prior GI bleed → no NSAIDs, caution with colchicine, so a single large joint gets an intra-articular steroid. Never start ULT during a flare.", "objective": "", "section": "Approach / Septic & Crystal", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAImA4QDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAUDBAYHAgEI/8QAVxAAAgEDAwIFAgMGBAIGBQMVAQIDAAQRBRIhMUEGEyJRYQdxFDKBI0KRobHBCBVS0TNiFiRysuHwJUOCs/EXNFVzk5Sj0iY1NzhEdLQ2U1R1g5KiwsP/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAIhEBAAMBAAMAAgIDAAAAAAAAAAECEQMEEiETMSNhMkFC/9oADAMBAAIRAxEAPwD8rV5oooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiirunabJfvx6Yx1agpUVroNGtoVCiIOcdTTK10m2yMQR57nbQYEI56Kf4V8KsOoI/SunLpkaKAIlHGMbRUU2kxOf+CuD/yig5rRW7utAs5B6oEHyODSi88LoCTbyEfDdKDN0Vau9PuLJiJUOP8AUORVWgKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiiigKKKKAooooCiipra2ku5RFEuSf5UENFam00K3hQFx5jdyaY22lWx//N4yc46UGHCsegJ+woKsOqkfpXTIdKhRfTEo+wFfJdLjdf8AhKff0ig5lRXQLjQ7Zgd9un3xSq68L27DMTNG3t1FBlKKY3mi3Vn6seYvutL6D5RRRQFFFFAUUUUBRRRQFFFFAUUUUBRRRQFFFFAUUUUBRRRQFFFFAUUUUBRRRQfRRQKKD5RRRQFFFFAUUUUBRRRQFFFFAUUUUBRRRQFFFFAUUUUBRRX2glt4GuZ1iXqxraWFmlvAiIOg9utJ/DtjtQ3DjluFz7VpbeJ5XVEGSTjFB9jtzIQoHPvTq2sW2gKjMcdQtN9G0CONd1yGkbGSPY0+tbd1IaLYsa8bAcZoMi9jKi5MThT7jivPlAg9gO+a1fnyuwikyxYkAdQOap3drayPsWEI/PqX3oMvNahhkKDn3pdNb7emTjtWku7UQjI9S44OOlK5YQ+Ti ter": "B", "text": "A 24-hour urine collection"}, {"letter": "C", "text": "A second xanthine oxidase inhibitor"}, {"letter": "D", "text": "HLA-B27 testing"}, {"letter": "E", "text": "Colchicine prophylaxis for 3–6 months"}], "answer": "E", "explanation": "Starting ULT precipitates flares — cover with low-dose colchicine (or low-dose NSAID/prednisone) for 3–6 months; check HLA-B*58:01 in African/South Asian descent.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "45", "group": 45, "stem": "A 46-year-old woman had a distal radius fracture 7 weeks ago; the cast came off 2 weeks ago. Instead of improving, the whole hand now burns constantly, is swollen and mottled red-blue, feels cooler than the other hand, and light touch from a sleeve is painful. Finger motion is limited. She is afebrile; there is no wound.\n\nRadiograph: patchy periarticular osteopenia · CRP normal · D-dimer normal\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Deep vein thrombosis of the arm"}, {"letter": "B", "text": "Cellulitis"}, {"letter": "C", "text": "Median neuropathy"}, {"letter": "D", "text": "Early rheumatoid arthritis"}, {"letter": "E", "text": "Complex regional pain syndrome"}], "answer": "E", "explanation": "Regional (non-dermatomal) pain out of proportion weeks after a fracture with vasomotor, sudomotor/edema and motor/trophic signs = CRPS; normal CRP/D-dimer and absent wound argue against infection and DVT.", "objective": "", "section": "Paget's & CRPS"}, {"id": "45A", "group": 45, "stem": "The diagnosis is established by:", "options": [{"letter": "A", "text": "Nerve conduction studies"}, {"letter": "B", "text": "Three-phase bone scan"}, {"letter": "C", "text": "Clinical Budapest criteria"}, {"letter": "D", "text": "Exclusion of every other diagnosis"}, {"letter": "E", "text": "MRI of the hand"}], "answer": "C", "explanation": "CRPS is NOT a diagnosis of exclusion — it is made positively on Budapest criteria (pain + signs/symptoms in ≥2 of 4 categories); imaging is optional.", "objective": "", "section": "Paget's & CRPS"}, {"id": "45B", "group": 45, "stem": "The most appropriate first-line management is:", "options": [{"letter": "A", "text": "CRPS-specific physical and occupational therapy"}, {"letter": "B", "text": "Stellate ganglion block"}, {"letter": "C", "text": "Oxycodone for pain control"}, {"letter": "D", "text": "Spinal cord stimulator"}, {"letter": "E", "text": "Immobilization in a splint"}], "answer": "A", "explanation": "PT/OT ~6 months to restore function; NSAIDs, a 2–4 week steroid course, bisphosphonates, gabapentin/TCA/SNRI adjuncts; opioids avoided; blocks/stimulator for refractory disease.", "objective": "", "section": "Paget's & CRPS"}, {"id": "46", "group": 46, "stem": "A 76-year-old woman with CKD stage 3 and hypertension presents with 1 day of a painful, swollen right wrist. Temperature is 38.1 °C. She has had two similar wrist attacks in the past year.\n\nSynovial fluid: WBC 24,000/µL · Gram stain negative · rhomboid, positively birefringent crystals\nWrist X-ray: linear calcification of the triangular fibrocartilage\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute gout"}, {"letter": "B", "text": "Basic calcium phosphate arthropathy"}, {"letter": "C", "text": "Septic arthritis"}, {"letter": "D", "text": "Acute calcium pyrophosphate (CPP) arthritis"}, {"letter": "E", "text": "Rheumatoid arthritis flare"}], "answer": "D", "explanation": "Rhomboid, positively birefringent crystals + chondrocalcinosis in an elderly wrist/knee = pseudogout. Gout crystals are needle-shaped and negatively birefringent.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "46A", "group": 46, "stem": "Given her kidney disease, the best treatment for this attack is:", "options": [{"letter": "A", "text": "Allopurinol 100 mg daily"}, {"letter": "B", "text": "Joint aspiration followed by intra-articular glucocorticoid"}, {"letter": "C", "text": "Indomethacin 50 mg three times daily"}, {"letter": "D", "text": "IV vancomycin pending cultures"}, {"letter": "E", "text": "Colchicine 1.2 mg followed by 0.6 mg"}], "answer": "B", "explanation": "CKD: avoid NSAIDs and use colchicine with caution → aspirate and inject a steroid (Gram stain is negative). This is the lecture case answer.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "46B", "group": 46, "stem": "The most appropriate long-term plan if attacks keep recurring is:", "options": [{"letter": "A", "text": "Pegloticase infusions"}, {"letter": "B", "text": "Febuxostat 40 mg daily"}, {"letter": "C", "text": "Low-dose daily colchicine"}, {"letter": "D", "text": "Allopurinol titrated to uric acid below 6 mg/dL"}, {"letter": "E", "text": "Probenecid"}], "answer": "C", "explanation": "CPPD has no urate-lowering therapy — allopurinol does nothing. ≥3 attacks/yr → low-dose colchicine or daily low-dose NSAID with GI protection.", "objective": "", "section": "Approach / Septic & Crystal"}]};

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // Reshuffle on every open: stack order and option order (answer letters remapped).
  (function reshuffle() {
    function fy(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    fy(groups);
    const L = 'ABCDEFGH';
    questions.forEach(q => {
      const correct = q.options.find(o => o.letter === q.answer);
      fy(q.options);
      q.options.forEach((o, i) => { o.letter = L[i]; });
      q.answer = correct.letter;
    });
  })();

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
