<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

, "group": 2, "stem": "Which feature most strongly argues against the ANCA-associated small-vessel vasculitides?", "options": [{"letter": "A", "text": "Weight loss and fever"}, {"letter": "B", "text": "Clear lungs with a bland urine sediment"}, {"letter": "C", "text": "The foot drop"}, {"letter": "D", "text": "Livedo reticularis"}, {"letter": "E", "text": "The elevated ESR"}], "answer": "B", "explanation": "PAN spares the lungs and never causes glomerulonephritis; mononeuritis, livedo and constitutional symptoms occur in all of them.", "objective": "", "section": "Vasculitis"}, {"id": "2B", "group": 2, "stem": "The most appropriate treatment is:", "options": [{"letter": "A", "text": "Prednisone 10–20 mg daily alone"}, {"letter": "B", "text": "Corticosteroids plus cyclophosphamide, with antiviral therapy for hepatitis B"}, {"letter": "C", "text": "Colchicine and apremilast"}, {"letter": "D", "text": "Rituximab monotherapy"}, {"letter": "E", "text": "Mepolizumab"}], "answer": "B", "explanation": "IV steroids + cyclophosphamide; treat HBV (antivirals) with plasmapheresis in HBV-associated disease.", "objective": "", "section": "Vasculitis"}, {"id": "3", "group": 3, "stem": "A 7-year-old boy has had 2 weeks of daily fevers to 39.5 °C that spike each evening and resolve by morning, accompanied by a faint salmon-colored rash on the trunk that fades with the fever. He has cervical lymphadenopathy, splenomegaly, and swelling of both wrists and knees.\n\nWBC 22,000/µL · ESR 90 mm/h · ferritin 1,800 ng/mL · ANA negative · RF negative\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acute lymphoblastic leukemia"}, {"letter": "B", "text": "Acute rheumatic fever"}, {"letter": "C", "text": "Systemic juvenile idiopathic arthritis (Still disease)"}, {"letter": "D", "text": "Kawasaki disease"}, {"letter": "E", "text": "Oligoarticular juvenile idiopathic arthritis"}], "answer": "C", "explanation": "Quotidian fever + evanescent salmon rash + lymphadenopathy/hepatosplenomegaly + arthritis = systemic JIA.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "3A", "group": 3, "stem": "The complication most feared in this subtype is:", "options": [{"letter": "A", "text": "Coronary artery aneurysm"}, {"letter": "B", "text": "Scleroderma renal crisis"}, {"letter": "C", "text": "Felty syndrome"}, {"letter": "D", "text": "Macrophage activation syndrome"}, {"letter": "E", "text": "Anterior uveitis"}], "answer": "D", "explanation": "MAS = uncontrolled macrophage activation with widespread inflammation and organ damage.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "4", "group": 4, "stem": "A 74-year-old woman with polymyalgia rheumatica on prednisone 10 mg reports 2 weeks of a new right temporal headache and pain in her jaw when chewing. This morning her vision in the right eye went gray for 10 minutes. The right temporal artery is tender and thickened.\n\nESR 105 mm/h · CRP 68 mg/L · hemoglobin 10.9 g/dL · platelets 510,000/µL\n\nWhich of the following is the most appropriate immediate step?", "options": [{"letter": "A", "text": "MRI of the brain with contrast"}, {"letter": "B", "text": "Aspirin and urgent ophthalmology referral"}, {"letter": "C", "text": "Increase prednisone to 20 mg daily"}, {"letter": "D", "text": "Schedule a temporal artery biopsy, then treat"}, {"letter": "E", "text": "IV methylprednisolone 1 g now"}], "answer": "E", "explanation": "Any visual symptom in GCA = impending blindness → high-dose steroids immediately; do not wait for biopsy.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAERAZgDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAwQAAgUBBgcI/8QAQhAAAgECBAQEAggFAwMEAgMAAQIDABEEEiExBSJBUR here is no malar rash, skin thickening proximal to the MCPs, or oral ulcers.\n\nANA 1:1280 speckled · anti-U1-RNP strongly positive · anti-dsDNA, anti-Smith, anti-Scl-70, anticentromere negative · CK 650 U/L · urinalysis normal\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Diffuse systemic sclerosis"}, {"letter": "B", "text": "Limited systemic sclerosis"}, {"letter": "C", "text": "Polymyositis"}, {"letter": "D", "text": "Mixed connective tissue disease"}, {"letter": "E", "text": "Systemic lupus erythematosus"}], "answer": "D", "explanation": "Overlap of lupus, scleroderma and myositis features with isolated high-titer anti-U1-RNP = MCTD.", "objective": "", "section": "Lupus Family"}, {"id": "5A", "group": 5, "stem": "The organ system that drives morbidity and should be screened with PFTs and high-resolution CT is:", "options": [{"letter": "A", "text": "Heart (Libman-Sacks endocarditis)"}, {"letter": "B", "text": "Liver"}, {"letter": "C", "text": "Central nervous system"}, {"letter": "D", "text": "Lungs (interstitial lung disease / pulmonary hypertension)"}, {"letter": "E", "text": "Kidneys (nephritis)"}], "answer": "D", "explanation": "Pulmonary involvement (ILD, PAH) is the main driver of MCTD morbidity.", "objective": "", "section": "Lupus Family"}, {"id": "6", "group": 6, "stem": "A 72-year-old woman has 3 weeks of aching and stiffness in both shoulders and hips, worst in the morning for over an hour. She struggles to raise her arms to comb her hair and to rise from bed, feels run down, and has lost 5 lb. Strength is full once pain is accounted for; there is no small-joint synovitis.\n\nESR 78 mm/h · CRP elevated · CK normal · RF negative\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Fibromyalgia"}, {"letter": "B", "text": "Polymyositis"}, {"letter": "C", "text": "Hypothyroid myopathy"}, {"letter": "D", "text": "Polymyalgia rheumatica"}, {"letter": "E", "text": "Rheumatoid arthritis"}], "answer": "D", "explanation": "Girdle stiffness, >60, high ESR, normal CK and strength = PMR.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis"}, {"id": "6A", "group": 6, "stem": "Which single finding most clearly separates this from polymyositis?", "options": [{"letter": "A", "text": "Elevated ESR"}, {"letter": "B", "text": "Age over 70"}, {"letter": "C", "text": "Weight loss"}, {"letter": "D", "text": "Normal creatine kinase with preserved strength"}, {"letter": "E", "text": "Shoulder and hip involvement"}], "answer": "D", "explanation": "Myositis = painless weakness with high CK; PMR = painful stiffness with normal CK. Absence of small-joint synovitis separates PMR from RA.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis"}, {"id": "6B", "group": 6, "stem": "The most appropriate treatment is:", "options": [{"letter": "A", "text": "Prednisone 1 mg/kg daily"}, {"letter": "B", "text": "Naproxen 500 mg twice daily"}, {"letter": "C", "text": "Graded aerobic exercise"}, {"letter": "D", "text": "Weekly methotrexate"}, {"letter": "E", "text": "Prednisone 10–20 mg daily"}], "answer": "E", "explanation": "Low-dose prednisone with a dramatic response in days; poor response → think paraneoplastic. Sarilumab is the new steroid-sparing option.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis"}, {"id": "6C", "group": 6, "stem": "At every follow-up visit she must be asked about:", "options": [{"letter": "A", "text": "Dry eyes and dry mouth"}, {"letter": "B", "text": "New headache, jaw claudication or vision change"}, {"letter": "C", "text": "Foamy urine and leg swelling"}, {"letter": "D", "text": "Dysphagia and dyspnea"}, {"letter": "E", "text": "Rash on the eyelids and knuckles"}], "answer": "B", "explanation": "20% of PMR develop giant cell arteritis — screen for GCA at every visit.", "objective": "", "section": "Fibromyalgia, PMR, GCA & Myositis"}, {"id": "7", "group": 7, "stem": "A 41-year-old woman with 2 years of diffuse systemic sclerosis (anti-Scl-70 positive, skin thickening proximal to the elbows) was started on prednisone 20 mg 3 weeks ago for inflammatory arthritis. She now presents with severe headache and blurred vision.\n\nBP 196/118 · creatinine 2.6 mg/dL (baseline 0.8) · platelets 85,000/µL · schistocytes on smear\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Scleroderma renal crisis"}, {"letter": "B", "text": "Hypertensive emergency from NSAID use"}, {"letter": "C", "text": "Thrombotic thrombocytopenic purpura"}, {"letter": "D", "text": "Pre-eclampsia"}, {"letter": "E", "text": "Lupus nephritis"}], "answer": "A", "explanation": "Malignant hypertension + acute renal failure ± MAHA in early diffuse SSc, precipitated by steroids = renal crisis.", "objective": "", "section": "Scleroderma & Sjögren"}, {"id": "7A", "group": 7, "stem": "The most appropriate treatment is:", "options": [{"letter": "A", "text": "Emergent hemodialysis"}, {"letter": "B", "text": "Plasma exchange"}, {"letter": "C", "text": "IV nitroprusside"}, {"letter": "D", "text": "Pulse IV methylprednisolone"}, {"letter": "E", "text": "An ACE inhibitor (captopril) titrated rapidly"}], "answer": "E", "explanation": "ACE inhibitor/ARB is the specific therapy even with rising creatinine; monthly BP checks in diffuse disease.", "objective": "", "section": "Scleroderma & Sjögren"}, {"id": "7B", "group": 7, "stem": "The most likely precipitant was:", "options": [{"letter": "A", "text": "Nifedipine"}, {"letter": "B", "text": "Raynaud phenomenon"}, {"letter": "C", "text": "Esophageal reflux"}, {"letter": "D", "text": "Her anti-Scl-70 antibody"}, {"letter": "E", "text": "Prednisone above 7.5 mg per day"}], "answer": "E", "explanation": "Steroids >7.5 mg/day can trigger renal crisis in diffuse SSc; CCBs may actually protect.", "objective": "", "section": "Scleroderma & Sjögren"}, {"id": "8", "group": 8, "stem": "A 66-year-old man with severe left knee osteoarthritis is awaiting knee replacement and is weight-bearing as tolerated. He limps, fell once last month while walking in his kitchen, and now holds onto furniture. His grip is strong and his thinking is clear.\n\nWhich of the following is the most appropriate device?", "options": [{"letter": "A", "text": "Lofstrand forearm crutches"}, {"letter": "B", "text": "Straight cane held in the left hand"}, {"letter": "C", "text": "Straight cane held in the right hand"}, {"letter": "D", "text": "Standard walker"}, {"letter": "E", "text": "Axillary crutches"}], "answer": "C", "explanation": "WBAT with pain, mild weakness and mild balance deficit (OA) = cane, held in the hand OPPOSITE the affected limb.", "objective": "", "section": "Assistive Devices"}, {"id": "8A", "group": 8, "stem": "The correct gait sequence is:", "options": [{"letter": "A", "text": "Left leg, then cane, then right leg"}, {"letter": "B", "text": "Cane, then right leg, then left leg"}, {"letter": "C", "text": "Right leg and cane together, then the left leg"}, {"letter": "D", "text": "Cane, then both legs together"}, {"letter": "E", "text": "Cane and left leg forward together, then the right leg"}], "answer": "E", "explanation": "Cane + affected leg move together, then the unaffected leg.", "objective": "", "section": "Assistive Devices"}, {"id": "8B", "group": 8, "stem": "The cane height is correct when the elbow is flexed:", "options": [{"letter": "A", "text": "45–60°"}, {"letter": "B", "text": "0–5°"}, {"letter": "C", "text": "60–90°"}, {"letter": "D", "text": "15–30°"}, {"letter": "E", "text": "Fully extended"}], "answer": "D", "explanation": "Cane: 15–30° elbow flexion; walker: grip at ulnar styloid → 20–30°.", "objective": "", "section": "Assistive Devices"}, {"id": "9", "group": 9, "stem": "A 29-year-old man of Turkish descent has had painful mouth ulcers 4–5 times a year for 2 years. He now has two painful scrotal ulcers, a painful red left eye with blurred vision, tender red nodules on both shins and 3 days of left calf swelling. Exam shows three oral aphthae with a yellow base and red halo, scrotal ulcers, erythema nodosum, acneiform pustules on the back, a layer of pus in the anterior chamber of the left eye, and a warm swollen calf. A sterile needle prick on the forearm forms a pustule at 48 hours.\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Crohn disease"}, {"letter": "B", "text": "Herpes simplex infection"}, {"letter": "C", "text": "Behçet syndrome"}, {"letter": "D", "text": "Reactive arthritis"}, {"letter": "E", "text": "Systemic lupus erythematosus"}], "answer": "C", "explanation": "Recurrent oral + genital ulcers + hypopyon uveitis + erythema nodosum + positive pathergy + venous thrombosis in a Silk-Road patient = Behçet.", "objective": "", "section": "Vasculitis"}, {"id": "9A", "group": 9, "stem": "The genetic marker associated with this disease is:", "options": [{"letter": "A", "text": "HLA-B27"}, {"letter": "B", "text": "HLA-B*58:01"}, {"letter": "C", "text": "HLA-DR4"}, {"letter": "D", "text": "HLA-DQ2/DQ8"}, {"letter": "E", "text": "HLA-B51"}], "answer": "E", "explanation": "HLA-B51/B5 is supportive; the diagnosis itself is clinical.", "objective": "", "section": "Vasculitis"}, {"id": "9B", "group": 9, "stem": "The eye and vascular findings require:", "options": [{"letter": "A", "text": "Systemic corticosteroids with azathioprine, cyclophosphamide or anti-TNF therapy"}, {"letter": "B", "text": "Colchicine alone"}, {"letter": "C", "text": "Topical steroids alone"}, {"letter": "D", "text": "Apremilast alone"}, {"letter": "E", "text": "Lifelong warfarin alone"}], "answer": "A", "explanation": "Mucocutaneous disease → apremilast, colchicine, topical steroids; ocular, vascular or CNS disease → steroids + azathioprine/cyclophosphamide/anti-TNF.", "objective": "", "section": "Vasculitis"}, {"id": "10", "group": 10, "stem": "A 68-year-old woman started hydralazine 8 months ago for resistant hypertension. For 6 weeks she has had fever, symmetric wrist and MCP arthritis and pleuritic chest pain. There is a pleural rub but no rash, oral ulcers or neurologic findings.\n\nUrinalysis normal · ANA 1:320 · anti-histone positive · anti-dsDNA negative · anti-Smith negative · C3/C4 normal\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Rheumatoid arthritis"}, {"letter": "B", "text": "Systemic lupus erythematosus"}, {"letter": "C", "text": "Drug-induced lupus"}, {"letter": "D", "text": "Polymyalgia rheumatica"}, {"letter": "E", "text": "Mixed connective tissue disease"}], "answer": "C", "explanation": "Post-menopausal onset on hydralazine, serositis + arthritis, anti-histone positive with other antibodies negative, normal urine = DILE.", "objective": "", "section": "Lupus Family"}, {"id": "10A", "group": 10, "stem": "Which finding most reliably distinguishes this from systemic lupus erythematosus?", "options": [{"letter": "A", "text": "Arthritis of the wrists and MCPs"}, {"letter": "B", "text": "Positive anti-histone antibody"}, {"letter": "C", "text": "Negative anti-dsDNA and anti-Smith"}, {"letter": "D", "text": "Positive ANA at 1:320"}, {"letter": "E", "text": "Pleuritic chest pain"}], "answer": "C", "explanation": "Anti-histone is also positive in true SLE — the discriminator is that dsDNA/Smith (and renal/CNS disease) are absent in DILE.", "objective": "", "section": "Lupus Family"}, {"id": "10B", "group": 10, "stem": "The most appropriate management is:", "options": [{"letter": "A", "text": "Cyclophosphamide induction"}, {"letter": "B", "text": "Lifelong low-dose prednisone"}, {"letter": "C", "text": "Stop hydralazine; short steroid course only if needed"}, {"letter": "D", "text": "Start hydroxychloroquine and continue hydralazine"}, {"letter": "E", "text": "Renal biopsy"}], "answer": "C", "explanation": "Stop the culprit drug — symptoms resolve over 4–8 weeks (anti-histone may persist 1–2 years).", "objective": "", "section": "Lupus Family"}, {"id": "11", "group": 11, "stem": "A 45-year-old woman with multiple sclerosis has chronic bilateral leg weakness and balance deficits. She walks independently in the house but has fallen outdoors several times and needs a device for long-term use.\n\nWhich of the following is the most appropriate device?", "options": [{"letter": "A", "text": "Standard walker"}, {"letter": "B", "text": "Lofstrand (forearm) crutches"}, {"letter": "C", "text": "Straight cane"}, {"letter": "D", "text": "Axillary crutches"}, {"letter": "E", "text": "Hemi-walker"}], "answer": "B", "explanation": "Long-term neurologic use (MS, CP) with balance + weakness = Lofstrand crutches; axillary crutches are for temporary orthopedic use.", "objective": "", "section": "Assistive Devices"}, {"id": "11A", "group": 11, "stem": "They are fitted correctly when:", "options": [{"letter": "A", "text": "The cuff sits at the mid-humerus"}, {"letter": "B", "text": "The elbow is fully extended at the grip"}, {"letter": "C", "text": "The handgrip is at the greater trochanter"}, {"letter": "D", "text": "The top is 2–3 finger widths below the axilla"}, {"letter": "E", "text": "The cuff is 3 finger widths below the elbow and the handgrip is at wrist height"}], "answer": "E", "explanation": "Forearm cuff 3 finger widths below the elbow, grip at wrist height; inspect tips for wear.", "objective": "", "section": "Assistive Devices"}, {"id": "12", "group": 12, "stem": "A 48-year-old woman has 2 years of gritty, dry eyes and a dry mouth; she needs water to swallow dry food and has new dental cavities. She has intermittent joint aches and fatigue. Exam shows dry, sticky oral mucosa, a fissured tongue and bilateral parotid enlargement (shown).\n\nSchirmer test: 3 mm wetting at 5 minutes · ANA positive · RF positive · anti-SSA and anti-SSB positive\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Systemic lupus erythematosus"}, {"letter": "B", "text": "Sjögren syndrome"}, {"letter": "C", "text": "Anticholinergic medication effect"}, {"letter": "D", "text": "Sarcoidosis"}, {"letter": "E", "text": "Mumps parotitis"}], "answer": "B", "explanation": "Sicca + parotid enlargement + Schirmer <5 mm/5 min + SSA/SSB = Sjögren.", "objective": "", "section": "Scleroderma & Sjögren", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEjAXwDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABAUDBgACBwEI/8QASBAAAQMCBAQEAgYHBgMJAQEAAQACAwQRBRIhMRMiQVEGMmFxFIEjQlKRobEVFjNiwdHhNFRykqLwB1PxJCVDY4KTo7LSF+L/xAAbAQACAwEBAQAAAAAAAAAAAAACAwABBAUGB//EACYRAAICAgICAgIDAQEAAAAAAAABAhEDIRIxBEETUQUiMjNhFEL/2gAMAwEAAhEDEQA/AIKisfUvEA8n11Fe07+HdwjFgP3zsvHWpiL+fe38VLSU76hkVPH+1qZLpDOdAtv/AA5oTT0r5SWgMBe51tTfZR+Kalsk+SN5AkNtR2/6fim8MkOF00dMzUutxLDeyreKAvnkeQSI2317lKyTpUascNiCosxlhm0uXv8ARV6Sd0THy5M5P5JxiItFwTIG599egVfqnvnqhAxtm2DQB012WBs6CRYcCe6DCHl1nPdmebn5fwQNaJnUopYGc73hl/dGxsfSx2eNIRse91GHiGhlrnmzonjL8wdf4fNMn1QuHdgVXTMwmmiooyDxDzSAdt1Nhz+Ycthe/wDJLaZ82KFlTPpkGrCd7nZOad44tnjUG77JP+j2tUWDD2iaUZdxc+1kZDVSPke+2USHQdgP93S7CZDkkvpxDYH0CIrJwyMMZyvf+CJzpWSGO3RrW4gDHlGjQbXvuh6IsqJjJJ5IxaMd3pdKDNLkFyGmwA6p/hHh2rkGfmhPQALNC27OlGCSG1PU0dGGmTmI1v6pnTY/CXG+7hpc7IKLwuWAGV+Zx11dstpvC73kOhkDT1ubrSosuU6H1JWwyRhjJGNeNdU4wyIPYGXDiucVVJV0bzxA4G/nCYYdjVZQuvxOI37rooqnsW8jZ0mGiYZCMm3VSGh4EbwWA66EJFgfiuGoJZI6zvbdWmGeOSIWeHXGhT4wTWhDySXYnqKCGpec7BzDIgcN8KUsZkkfGLg59k6c3huL/tbhGMmZyFnNpqg+NN7GfM0tEXAEcIOQjqLdUvl+KidyA3eeg8qdgjghx5gOhQolYXhwBcw6a/VRuAOOf+CaqxJzaRzRGRO7kFtdVBheDOhhkqJiQTqQdz6Kwinic8OLQHG40G56FQVr35WU7Azm1NuyCWL2xvzeoAmGYfxIeJNy5jnAS7xFK+KAwtIOY2Fuqey1fwjDHHEXW9NAUiZTSV00lVIzOwAsj9D3QTjqkFCTvmxfheFn4kF+rWj8V7i1PLPyMBDR+Ke0cL4Yix5aSopmMfcXVfCqodHJuxPQGOmYIyMr+q8qYjNnYC7XqiamFmth80PpbQoHH0G/tFfhpPg6sibsbEfVTBlRC2WInMwsGt17VxCSpBIvl1Xk0LJI9MzSDoUKVAvfYTUuA+mDG2sq3ir3yDP69E7D+JEM ness, conjunctival injection, and crusted pustular plaques on the soles (shown).\n\nKnee aspirate: WBC 18,000/µL, Gram stain negative, no crystals · RF and ANA negative\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Psoriatic arthritis"}, {"letter": "B", "text": "Behçet syndrome"}, {"letter": "C", "text": "Reactive arthritis"}, {"letter": "D", "text": "Disseminated gonococcal infection"}, {"letter": "E", "text": "Septic arthritis"}], "answer": "C", "explanation": "Oligoarthritis + conjunctivitis + urethritis within 2 months of enteric infection, with enthesitis and dactylitis = reactive arthritis. Sterile inflammatory fluid excludes septic/crystal disease.", "objective": "", "section": "Spondyloarthropathies", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCACUANwDASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAgMEBQYHCAABCf/EAD4QAAIBAwIEAwUGBQIFBQAAAAECAwAEEQUhBhIxQRNRYQcicYGRFCMyobHBFUJSYvDR4RYkQ3KyNYKSovH/xAAaAQACAwEBAAAAAAAAAAAAAAACAwEEBQAG/8QAJxEAAgIBBAEEAgMBAAAAAAAAAAECEQMEEiExQQUTIjIjUTNCYXH/2gAMAwEAAhEDEQA/AMxV1ca4CmGigQFCArlFGKmKkaonIKOWPcfH6V5BBNcyrBbwyTSt0SNSWPyFPj8D8TQW5uZNHufDAycYLY/7Qc/lUPJGPbHQg30hoVBj0rwsOYAdSenejrC2fUryCzjOHmcICR09av7hb2d6bokC+HAkkuPemYZZj8e1Jz6uOJcljFp3kdIz6xeMAyROo/uUivVKvWmrzRbfw2MkClSMMGAIxVW8VcDafc+Jc6ZGtnKCSpBAik9Mfyn16frSMfqEJumOno5xVrkrsKDtgV6QAKF4ckEjxSoUkQ8rKeoIpdoOiScSaxDp0TFA/vSP/Qg6n9vnVt5ElYlQEFraXWoy+FZWs1y/9MSFiPU4pzn4M4mtITPLo9zyDry4Yj5Ak1ffDnDthplktrZQLGikZHLu3qT3JNSRNPi8EwtAoBAGQMgbbkDfJ9az5+o80kWlonVtmSSTuCuGGxBGCPjSrS9Hv9dufs2nWz3DjdiNlUep7VZvtf4HWOB+ILKDkdMC5Vd+YdOf5HFOXsNgs59CdPDCz+KzO3dh2ps9Z+PfEXHT3PYyAyeyjiWKIyZs3IGeRZDk/UAfnUUurK5065e1vIHhmTqjjB/z1rWlxa8hWJ4Bgb84yT898flVae2rh2zXh7+IuFjureReTJ95lY4II+hHwNVtP6jKU1GSHZ9Eox3RKSZM7iimSjgRjevCBWypWZsoiZl/w0ECjXXFAA61KYpxOAr tylitis and B27 occur in both.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "13B", "group": 13, "stem": "The most appropriate initial treatment is:", "options": [{"letter": "A", "text": "Weekly methotrexate"}, {"letter": "B", "text": "A TNF inhibitor"}, {"letter": "C", "text": "NSAIDs"}, {"letter": "D", "text": "Doxycycline for 3 months"}, {"letter": "E", "text": "Intra-articular steroid to every joint"}], "answer": "C", "explanation": "NSAIDs first (antibiotics only if infection is still active, e.g., chlamydia); persistent >3–6 months → methotrexate or TNF inhibitors.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "14", "group": 14, "stem": "A 4-year-old girl has had 3 months of a limp that is worst in the morning and after naps. Her parents noticed a swollen right knee and left ankle; she has no fever or rash and plays normally once warmed up. The right knee is warm with an effusion and lacks 10° of extension, and the right leg appears slightly longer.\n\nANA 1:320 · ESR 30 mm/h · RF negative\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Transient synovitis"}, {"letter": "B", "text": "Polyarticular juvenile idiopathic arthritis"}, {"letter": "C", "text": "Systemic juvenile idiopathic arthritis"}, {"letter": "D", "text": "Oligoarticular juvenile idiopathic arthritis"}, {"letter": "E", "text": "Septic arthritis of the knee"}], "answer": "D", "explanation": "≤4 joints, knees/ankles, >6 weeks, child <16, afebrile = oligoarticular JIA (most common subtype). Leg-length discrepancy from growth stimulation is classic.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "14A", "group": 14, "stem": "The positive ANA in this child indicates:", "options": [{"letter": "A", "text": "A worse joint prognosis requiring a biologic"}, {"letter": "B", "text": "Mixed connective tissue disease"}, {"letter": "C", "text": "That the arthritis is secondary to lupus"}, {"letter": "D", "text": "Nothing — it is a normal finding in children"}, {"letter": "E", "text": "Increased risk of anterior uveitis — refer to ophthalmology"}], "answer": "E", "explanation": "ANA is prognostic, not diagnostic: 20% of oligoarticular JIA develop uveitis, more if ANA+. Slit-lamp screening is mandatory.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "14B", "group": 14, "stem": "The most appropriate first-line pharmacologic treatment is:", "options": [{"letter": "A", "text": "Etanercept"}, {"letter": "B", "text": "NSAIDs"}, {"letter": "C", "text": "Weekly methotrexate"}, {"letter": "D", "text": "Oral prednisone"}, {"letter": "E", "text": "Hydroxychloroquine"}], "answer": "B", "explanation": "NSAIDs (and intra-articular steroids) first; DMARDs/biologics for persistent disease.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "15", "group": 15, "stem": "A 68-year-old man with atrial fibrillation had a right middle cerebral artery ischemic stroke 3 days ago and is medically stable. He has left-sided weakness (arm worse than leg), ignores objects on his left, and cannot sit unsupported or transfer safely. He needs minimal-to-moderate assistance with ADLs, tolerates 3 hours of therapy per day, and his wife is able to care for him at home.\n\nWhich of the following is the most appropriate rehabilitation setting?", "options": [{"letter": "A", "text": "Long-term acute care hospital"}, {"letter": "B", "text": "Outpatient rehabilitation"}, {"letter": "C", "text": "Home health rehabilitation"}, {"letter": "D", "text": "Acute inpatient rehabilitation"}, {"letter": "E", "text": "Subacute rehabilitation in a skilled nursing facility"}], "answer": "D", "explanation": "Neuro diagnosis, ≥2 disciplines, tolerates 3 h/day, discharge plan to home (not a nursing home) = acute inpatient rehab; expected LOS ~3 weeks for stroke.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "15A", "group": 15, "stem": "His tendency to ignore the left side should be formally assessed by:", "options": [{"letter": "A", "text": "Occupational therapy"}, {"letter": "B", "text": "Physical therapy"}, {"letter": "C", "text": "Neuropsychology"}, {"letter": "D", "text": "Ophthalmology"}, {"letter": "E", "text": "Speech-language pathology"}], "answer": "A", "explanation": "Unilateral neglect/visual-spatial deficits → OT: scanning strategies, environmental setup, ADL practice, caregiver education.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "15B", "group": 15, "stem": "The first stage of his physical therapy progression is:", "options": [{"letter": "A", "text": "Community mobility and endurance building"}, {"letter": "B", "text": "Protect and position — prevent falls, aspiration and pressure injury"}, {"letter": "C", "text": "Task-specific gait and stair training"}, {"letter": "D", "text": "Home exercise program and caregiver training"}, {"letter": "E", "text": "Return-to-driving evaluation"}], "answer": "B", "explanation": "PT: protect/position → mobilize early (bed mobility, sitting balance, transfers) → retrain movement → build endurance.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "15C", "group": 15, "stem": "His inability to transfer safely is best classified in the ICF model as:", "options": [{"letter": "A", "text": "Environmental factor"}, {"letter": "B", "text": "Activity limitation"}, {"letter": "C", "text": "Participation restriction"}, {"letter": "D", "text": "Indirect impairment"}, {"letter": "E", "text": "Impairment of body structure/function"}], "answer": "B", "explanation": "Weakness/neglect = impairments; difficulty executing a task (transfer) = activity limitation; loss of social roles = participation restriction.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "16", "group": 16, "stem": "A 24-year-old man with a severe traumatic brain injury is admitted to an inpatient brain-injury program. He has impulsive behavior, poor memory and outbursts that interfere with therapy. The team meets to set a behavior-management program and plan his equipment and discharge.\n\nWhich team member typically leads this program?", "options": [{"letter": "A", "text": "Case manager"}, {"letter": "B", "text": "Neuropsychologist"}, {"letter": "C", "text": "Rehab nurse"}, {"letter": "D", "text": "Physical therapist"}, {"letter": "E", "text": "Physiatrist"}], "answer": "B", "explanation": "The medical provider usually leads, but in TBI the neuropsychologist (neuropsych/behavioral testing, behavior programs) is often the team leader.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "16A", "group": 16, "stem": "Which team member coordinates discharge planning, communicates with the insurer and orders his durable medical equipment?", "options": [{"letter": "A", "text": "Dietician"}, {"letter": "B", "text": "Vocational therapist"}, {"letter": "C", "text": "Occupational therapist"}, {"letter": "D", "text": "Medical social worker"}, {"letter": "E", "text": "Case manager"}], "answer": "E", "explanation": "Case manager (inpatient only) = insurance liaison, discharge coordination, DME orders; social worker addresses family/community/emotional resources.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "17", "group": 17, "stem": "A 35-year-old man has 1 year of coin-shaped, scaly, hyperpigmented plaques on the scalp and inside the ears (shown) with central atrophy and patches of permanent hair loss. He feels well otherwise.\n\nANA negative · CBC and urinalysis normal\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Seborrheic dermatitis"}, {"letter": "B", "text": "Tinea capitis"}, {"letter": "C", "text": "Subacute cutaneous lupus erythematosus"}, {"letter": "D", "text": "Scalp psoriasis"}, {"letter": "E", "text": "Discoid lupus erythematosus"}], "answer": "E", "explanation": "Scarring plaques with central atrophy, follicular destruction and ear involvement = discoid lupus (lecture fine"}, {"letter": "E", "text": "Oral prednisone 1 mg/kg"}], "answer": "C", "explanation": "Sun protection, topical/intralesional steroids, hydroxychloroquine.", "objective": "", "section": "Lupus Family"}, {"id": "18", "group": 18, "stem": "A 72-year-old right-handed woman had a left MCA stroke 5 days ago. Her speech is halting and effortful with short telegraphic phrases such as \"want water\"; she follows commands and becomes frustrated when she cannot find words. Her articulation is also slurred, and she coughs when drinking thin liquids.\n\nWhich of the following best describes her language deficit?", "options": [{"letter": "A", "text": "Receptive aphasia"}, {"letter": "B", "text": "Global aphasia"}, {"letter": "C", "text": "Apraxia of speech"}, {"letter": "D", "text": "Expressive aphasia"}, {"letter": "E", "text": "Dysarthria"}], "answer": "D", "explanation": "Effortful, telegraphic output with preserved comprehension = expressive aphasia; she knows what she wants to say.", "objective": "", "section": "Neuro Rehab"}, {"id": "18A", "group": 18, "stem": "Her slurred articulation represents:", "options": [{"letter": "A", "text": "Receptive aphasia"}, {"letter": "B", "text": "Agnosia"}, {"letter": "C", "text": "Dysphonia from vocal-cord paralysis"}, {"letter": "D", "text": "Dysarthria — a motor speech disorder with intact language"}, {"letter": "E", "text": "Worsening of the aphasia"}], "answer": "D", "explanation": "Dysarthria = weakness/incoordination of speech muscles; language itself is intact.", "objective": "", "section": "Neuro Rehab"}, {"id": "18B", "group": 18, "stem": "The most appropriate response to her cough with thin liquids is:", "options": [{"letter": "A", "text": "Thicken all liquids and continue the regular diet"}, {"letter": "B", "text": "Order a chest radiograph and continue oral intake"}, {"letter": "C", "text": "Start antibiotics for aspiration pneumonia"}, {"letter": "D", "text": "SLP bedside swallow evaluation; keep NPO if high risk and review medication routes"}, {"letter": "E", "text": "Place a nasogastric tube now"}], "answer": "D", "explanation": "Dysphagia is a medical safety issue: SLP evaluation, NPO until swallow safety is clarified, check whether meds can be given safely.", "objective": "", "section": "Neuro Rehab"}, {"id": "18C", "group": 18, "stem": "The best way to communicate with her at the bedside is:", "options": [{"letter": "A", "text": "Written consent forms only"}, {"letter": "B", "text": "Speaking loudly and slowly"}, {"letter": "C", "text": "Yes/no questions, gestures, writing and pictures, allowing time"}, {"letter": "D", "text": "Avoiding questions until speech recovers"}, {"letter": "E", "text": "Having her spouse answer for her"}], "answer": "C", "explanation": "Face the patient, short concrete prompts, allow time, do not speak for her — essential for capacity assessment.", "objective": "", "section": "Neuro Rehab"}, {"id": "19", "group": 19, "stem": "A 74-year-old woman 10 days after a stroke is in inpatient rehab. During a gait session she develops new left calf swelling, becomes short of breath and reports pleuritic chest pain; heart rate is 118.\n\nWhich of the following is the most appropriate action?", "options": [{"letter": "A", "text": "Switch to occupational therapy for the day"}, {"letter": "B", "text": "Give acetaminophen and continue"}, {"letter": "C", "text": "Finish the session and notify the physician afterward"}, {"letter": "D", "text": "Reduce the session to seated exercises"}, {"letter": "E", "text": "Stop therapy — this is a clinical pause point requiring evaluation for DVT/PE"}], "answer": "E", "explanation": "Clinical pause points: new neuro deficit, aspiration event, suspected DVT/PE, chest pain, unsafe cognition — hold therapy and re-stabilize.", "objective": "", "section": "Neuro Rehab"}, {"id": "19A", "group": 19, "stem": "Which of the following is an INDIRECT impairment of her stroke rather than a direct one?", "options": [{"letter": "A", "text": "Hemiparesis"}, {"letter": "B", "text": "Unilateral neglect"}, {"letter": "C", "text": "Dysphagia"}, {"letter": "D", "text": "Spasticity"}, {"letter": "E", "text": "Depression and fear of recurrence"}], "answer": "E", "explanation": "Direct = deficits from the lesion you can examine; indirect = psychosocial consequences (depression, loss of vocation, family-role change, finances).", "objective": "", "section": "Neuro Rehab"}, {"id": "20", "group": 20, "stem": "A 72-year-old man of English descent has 2 years of a dull right hip and thigh ache that is worse at night. His hat size has increased and his right shin looks bowed; he has mild left-sided hearing loss. Exam shows warmth over the right tibia, frontal bossing and limited painful right hip motion. Pelvic radiograph is shown.\n\nAlkaline phosphatase 480 U/L (40–130) · calcium, phosphate, PTH, AST and GGT normal\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Osteomalacia"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Metastatic prostate cancer"}, {"letter": "D", "text": "Multiple myeloma"}, {"letter": "E", "text": "Paget's disease of bone"}], "answer": "E", "explanation": "Isolated ↑ALP with normal Ca/PO4/PTH, enlarged hemipelvis with coarse trabeculae and cortical thickening, skull growth, deafness, bowing = Paget's.", "objective": "", "section": "Paget's & CRPS", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAJ5A4QDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAwQAAgUBBgcI/8QASBAAAgEDAwIFAgQFAwIFAgENAQIRAAMhBBIxQVEFEyJhcTKBBpGhsRQjQsHRUuHwM/EHFTRicggkQxY1grM2RVNzg5KUstL/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/xAAYEQEBAQEBAAAAAAAAAAAAAAAAAREhQf/aAAwDAQACEQMRAD8A/M+jB34BitbTksePtWbpQoUsO1aemXAY1NRs6BPQNsUSzb8u6TnaTkxxVfD1iInNMspHp53UDWnI3EMce46VoM et's & CRPS"}, {"id": "20C", "group": 20, "stem": "Two years later he reports rapidly worsening pain and a new mass over the right femur. The diagnosis to exclude is:", "options": [{"letter": "A", "text": "Gout"}, {"letter": "B", "text": "Osteomyelitis"}, {"letter": "C", "text": "Pathologic fracture"}, {"letter": "D", "text": "Osteosarcoma"}, {"letter": "E", "text": "Septic arthritis"}], "answer": "D", "explanation": "Osteosarcoma (<1%) — new pain or a mass in pagetic bone is a red flag.", "objective": "", "section": "Paget's & CRPS"}, {"id": "21", "group": 21, "stem": "A 31-year-old man with longstanding ankylosing spondylitis and a fused cervical spine on radiographs was rear-ended at low speed. He has new neck pain but a normal neurologic exam.\n\nWhich of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Refer for physical therapy"}, {"letter": "B", "text": "Immobilize the spine and obtain a CT scan"}, {"letter": "C", "text": "Reassure and prescribe NSAIDs"}, {"letter": "D", "text": "Increase his TNF inhibitor"}, {"letter": "E", "text": "Obtain flexion-extension radiographs"}], "answer": "B", "explanation": "A fused spine fractures like a long bone after minor trauma — unstable until proven otherwise.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "21A", "group": 21, "stem": "Which of the following is also an extra-articular complication of his disease?", "options": [{"letter": "A", "text": "Scleroderma renal crisis"}, {"letter": "B", "text": "Libman-Sacks endocarditis"}, {"letter": "C", "text": "Lymphoma"}, {"letter": "D", "text": "Pulmonary arterial hypertension"}, {"letter": "E", "text": "Aortic regurgitation"}], "answer": "E", "explanation": "AS \"A's\": anterior uveitis, apical pulmonary fibrosis, aortitis → aortic regurgitation, AV block.", "objective": "", "section": "Spondyloarthropathies"}, {"id": "22", "group": 22, "stem": "A 24-year-old Black woman has 3 months of fatigue, low-grade fevers, pain in both hands and wrists, hair thinning and a facial rash that worsens after sun exposure (shown). She now notices foamy urine and ankle swelling. BP 150/92; two painless ulcers on the hard palate; MCP and wrist tenderness without deformity.\n\nHgb 9.8 g/dL · WBC 3,000/µL · platelets 98,000/µL · creatinine 1.4 mg/dL\nUrinalysis: 3+ protein, RBC casts · ANA 1:640 · anti-dsDNA positive · C3 and C4 low\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "24-hour urine protein only"}, {"letter": "B", "text": "Anti-histone antibody"}, {"letter": "C", "text": "Renal biopsy"}, {"letter": "D", "text": "Lupus anticoagulant and anticardiolipin"}, {"letter": "E", "text": "Start hydroxychloroquine and recheck urine in 3 months"}], "answer": "C", "explanation": "Active sediment with RBC casts, proteinuria and rising creatinine = lupus nephritis → biopsy to classify (class III/IV need aggressive induction).", "objective": "", "section": "Lupus Family", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFPAZEDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAUDBAYCAQcI/8QAPhAAAgEDAwIFAgMHBAEDBAMAAQIRAAMhBBIxQVEFEyJhcQaBMpGhBxRCscHR8CNS4fEzFmJyFRckkjRTgv/EABoBAAIDAQEAAAAAAAAAAAAAAAADAQIEBQb/xAApEQACAgICAgICAgIDAQAAAAAAAQIRAyEEMRJBE1EFIjJhFBVCUnGx/9oADAMBAAIRAxEAPwD8qUUUUAdYiukjdJiKjroHFAI6uMGOAIHYVd8J8Lu+J3wiDHU1Ts2/NeK3n01p0s212W4b/cczVJy8Vodih5vY58B8E0+kCWQnqjczAVrvDSulchARtwW4P6Ut8KRp3SAx5MZ+KcaW2/qZWEDkNx/3WHJO+z0XDwRqzReHXXuopFx/sxkU7tG4EBN12kdWNZvQuC2wyRM4HHFM9NcHmC2JB4yeaS57o0Swkmq0lvUvsuFlYiQ8ypnuPypB4h9EWNYpKMLV8cwNyvWpRjJldqgH1KQT7juOeOtCnzk23EUuszAgVZTSFvFa2fJ/E/2f3LOpm1aNu6BhlO5G+D2qhb+mdYQ6HTC5OHtyRcH96+yXNNCg7bYiWBkiqWq0Ni+T5liLiiCUmTU/M0qM8uJGTuj5LZ8Bu6UsrIL1lWwHEPbJ+eamH0t5rt+7yo2xt2gtbP8Ab2+Yr6Jd0SpcIuLuP4TIBkHv3rxNBZZjtOx14YCY9/gd 22C", "group": 22, "stem": "Regardless of severity, which medication should she receive long term?", "options": [{"letter": "A", "text": "Warfarin"}, {"letter": "B", "text": "Daily prednisone 20 mg"}, {"letter": "C", "text": "Methotrexate"}, {"letter": "D", "text": "Azathioprine"}, {"letter": "E", "text": "Hydroxychloroquine"}], "answer": "E", "explanation": "HCQ for every lupus patient: fewer flares, less thrombosis, lower mortality; yearly retinal exam.", "objective": "", "section": "Lupus Family"}, {"id": "23", "group": 23, "stem": "A 42-year-old man with adult-onset asthma, allergic rhinitis and nasal polyps develops 3 weeks of a right foot drop, tender purple spots on both shins, cough, weight loss and sinus pain. Exam shows wheezing, palpable purpura on the shins and weak right ankle dorsiflexion with sensory loss on the foot dorsum.\n\nWBC 12,800/µL with 25% eosinophils (absolute 3,200/µL) · chest CT: migratory patchy infiltrates\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Polyarteritis nodosa"}, {"letter": "B", "text": "Hypereosinophilic syndrome"}, {"letter": "C", "text": "Allergic bronchopulmonary aspergillosis"}, {"letter": "D", "text": "Eosinophilic granulomatosis with polyangiitis"}, {"letter": "E", "text": "Granulomatosis with polyangiitis"}], "answer": "D", "explanation": "Asthma + eosinophilia + multi-organ vasculitis (purpura, mononeuritis, infiltrates) = EGPA (Churg-Strauss).", "objective": "", "section": "Vasculitis"}, {"id": "23A", "group": 23, "stem": "The ANCA pattern expected is:", "options": [{"letter": "A", "text": "c-ANCA (anti-PR3)"}, {"letter": "B", "text": "Both c-ANCA and anti-GBM"}, {"letter": "C", "text": "p-ANCA (anti-MPO)"}, {"letter": "D", "text": "Atypical ANCA (anti-lactoferrin)"}, {"letter": "E", "text": "ANCA is never positive in this disease"}], "answer": "C", "explanation": "p-ANCA/MPO in EGPA (and MPA); c-ANCA/PR3 in GPA.", "objective": "", "section": "Vasculitis"}, {"id": "23B", "group": 23, "stem": "The complication most likely to cause death in this disease is:", "options": [{"letter": "A", "text": "Subglottic stenosis"}, {"letter": "B", "text": "Mesenteric infarction"}, {"letter": "C", "text": "Blindness"}, {"letter": "D", "text": "Cardiac involvement (myocarditis, heart failure, arrhythmia)"}, {"letter": "E", "text": "Rapidly progressive glomerulonephritis"}], "answer": "D", "explanation": "Cardiac and pulmonary involvement drive mortality in EGPA (lecture quotes a 25% 5-year survival).", "objective": "", "section": "Vasculitis"}, {"id": "23C", "group": 23, "stem": "For non-severe disease, the targeted agent is:", "options": [{"letter": "A", "text": "Mepolizumab"}, {"letter": "B", "text": "Adalimumab"}, {"letter": "C", "text": "Rituximab"}, {"letter": "D", "text": "Secukinumab"}, {"letter": "E", "text": "Tocilizumab"}], "answer": "A", "explanation": "Mepolizumab (anti-IL-5) for less severe EGPA; severe → steroids + rituximab or cyclophosphamide.", "objective": "", "section": "Vasculitis"}, {"id": "24", "group": 24, "stem": "A 66-year-old woman with a stable gait after a rotator cuff repair needs ongoing therapy. She lives alone, can leave home without difficulty, but has no car and no family nearby.\n\nWhich of the following is the most appropriate rehabilitation setting?", "options": [{"letter": "A", "text": "Acute inpatient rehabilitation"}, {"letter": "B", "text": "Home health rehabilitation"}, {"letter": "C", "text": "Subacute rehabilitation"}, {"letter": "D", "text": "Outpatient rehabilitation"}, {"letter": "E", "text": "Long-term acute care"}], "answer": "D", "explanation": "Lack of transportation does NOT make a patient homebound; outpatient is for any functional level — but transportation is not provided.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "25", "group": 25, "stem": "A 58-year-old woman with 12 years of seropositive RA on methotrexate ran out of her medication 3 weeks ago. She now has 4 days of pain and swelling in both wrists and multiple MCPs, morning stiffness of 3 hours (baseline 30 minutes), and a temperature of 37.7 °C. She has ulnar deviation and swan-neck deformities. The right wrist is far hotter and more swollen than any other joint.\n\nWhich of the following is the most important next step?", "options": [{"letter": "A", "text": "Order ESR, CRP and hand radiographs"}, {"letter": "B", "text": "Restart methotrexate and add a prednisone bridge"}, {"letter": "C", "text": "Increase the methotrexate dose"}, {"letter": "D", "text": "Add a TNF inhibitor"}, {"letter": "E", "text": "Aspirate the right wrist for cell count, Gram stain and culture"}], "answer": "E", "explanation": "One joint disproportionately hot in an immunosuppressed RA patient = septic arthritis until the fluid says otherwise.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "25A", "group": 25, "stem": "Infection is excluded. The most appropriate management of her flare is:", "options": [{"letter": "A", "text": "Start rituximab"}, {"letter": "B", "text": "Naproxen alone until the flare resolves"}, {"letter": "C", "text": "High-dose IV methylprednisolone for 3 days"}, {"letter": "D", "text": "Restart methotrexate with a short prednisone bridge"}, {"letter": "E", "text": "Switch methotrexate to leflunomide"}], "answer": "D", "explanation": "The flare was triggered by missed methotrexate — resume it and bridge with low-dose prednisone (5–15 mg).", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "25B", "group": 25, "stem": "Which finding on exam reflects chronic damage rather than active inflammation?", "options": [{"letter": "A", "text": "The hot right wrist"}, {"letter": "B", "text": "Ulnar deviation and swan-neck deformities"}, {"letter": "C", "text": "Low-grade fever"}, {"letter": "D", "text": "Boggy warm MCP swelling"}, {"letter": "E", "text": "Morning stiffness of 3 hours"}], "answer": "B", "explanation": "Fixed deformities are longstanding damage; warmth, bogginess, prolonged stiffness and fever mark active disease.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "26", "group": 26, "stem": "A 59-year-old man recovering from necrotizing pancreatitis has a tracheostomy that is being weaned, an open abdominal wound on a wound vac, and needs 6 more weeks of IV antibiotics. He cannot yet participate in meaningful therapy.\n\nWhich of the following is the most appropriate setting?", "options": [{"letter": "A", "text": "Home health with IV antibiotics"}, {"letter": "B", "text": "Subacute rehabilitation"}, {"letter": "C", "text": "Long-term acute care hospital"}, {"letter": "D", "text": "Acute inpatient rehabilitation"}, {"letter": "E", "text": "Outpatient wound clinic"}], "answer": "C", "explanation": "LTAC: vent/trach weaning, wound vac, prolonged IV antibiotics; MD daily, RT ≥TID, skilled nursing ≥7 h/day, LOS ~30 days, then discharge to acute or subacute rehab.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "27", "group": 27, "stem": "A 28-year-old man with Crohn's disease has 8 months of low back and buttock pain that began gradually, is worst at night and in the early morning with stiffness over an hour, and improves with exercise but not rest. He also has heel pain. Lumbar flexion is reduced (Schober 3 cm), chest expansion is limited, and the sacroiliac joints are tender. Pelvic radiograph is shown.\n\nESR 42 mm/h · CRP 28 mg/L · RF and ANA negative · HLA-B27 positive\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Ankylosing spondylitis / axial spondyloarthritis"}, {"letter": "B", "text": "Mechanical low back pain"}, {"letter": "C", "text": "Lumbar disc herniation"}, {"letter": "D", "text": "Reactive arthritis"}, {"letter": "E", "text": "Psoriatic spondylitis"}], "answer": "A", "explanation": "Inflammatory back pain (young, insidious, better with activity, worse at night), enthesitis, reduced Schober/chest expansion, bilatera  with anti-dsDNA"}, {"letter": "B", "text": "Anti-GBM antibody"}, {"letter": "C", "text": "p-ANCA (anti-MPO)"}, {"letter": "D", "text": "Hepatitis B surface antigen"}, {"letter": "E", "text": "c-ANCA (anti-PR3)"}], "answer": "E", "explanation": "c-ANCA/PR3 is highly specific for GPA; p-ANCA/MPO → MPA, EGPA; anti-GBM → Goodpasture.", "objective": "", "section": "Vasculitis"}, {"id": "28B", "group": 28, "stem": "The most appropriate induction therapy is:", "options": [{"letter": "A", "text": "Prednisone 20 mg daily alone"}, {"letter": "B", "text": "Methotrexate"}, {"letter": "C", "text": "High-dose corticosteroids plus rituximab or cyclophosphamide"}, {"letter": "D", "text": "Plasmapheresis alone"}, {"letter": "E", "text": "Mepolizumab"}], "answer": "C", "explanation": "Induce with steroids + cyclophosphamide or rituximab; maintain with mycophenolate, azathioprine or rituximab.", "objective": "", "section": "Vasculitis"}, {"id": "29", "group": 29, "stem": "A 68-year-old man is found to have an alkaline phosphatase of 310 U/L on routine labs. He is asymptomatic. Calcium, phosphate, PTH, 25-OH vitamin D, AST, ALT and GGT are normal; PSA is normal. A skull radiograph is shown.\n\nWhich of the following is the most likely explanation?", "options": [{"letter": "A", "text": "Osteoblastic prostate metastases"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Osteoporosis"}, {"letter": "D", "text": "Paget's disease of bone"}, {"letter": "E", "text": "Osteomalacia"}], "answer": "D", "explanation": "Cotton-wool skull with isolated ALP elevation and normal Ca/PO4/PTH/vitamin D = asymptomatic Paget's (most patients are asymptomatic). Osteoporosis has a normal ALP; hyperparathyroidism raises calcium; osteomalacia lowers vitamin D/phosphate.", "objective": "", "section": "Paget's & CRPS", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBg jvvtXcfpSpUDFTJTV3+1KlQcf3qFc7e9KlQR8gea5LPlpUqDgZ49KG1lkjb3c5pUqCtNqcbFKlQcOa6+SlSoHR4KVKlQf/2Q=="}, {"id": "30", "group": 30, "stem": "A 54-year-old man on hydrochlorothiazide wakes at 2 AM with excruciating pain in the right great toe after a steak dinner and several beers; the sheet touching it is unbearable. The first MTP joint is red, hot and swollen. He had a similar episode 6 months ago that resolved on its own.\n\nSerum uric acid: 5.9 mg/dL\n\nWhich of the following is the most appropriate next step to establish the diagnosis?", "options": [{"letter": "A", "text": "Plain radiograph of the foot"}, {"letter": "B", "text": "Repeat serum uric acid in 2 weeks"}, {"letter": "C", "text": "24-hour urinary uric acid"}, {"letter": "D", "text": "Arthrocentesis with polarized light microscopy"}, {"letter": "E", "text": "No further testing — the uric acid excludes gout"}], "answer": "D", "explanation": "Uric acid is often NORMAL during a flare; crystals make the diagnosis. Podagra in this setting is gout until proven otherwise.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "30A", "group": 30, "stem": "The expected synovial fluid finding is:", "options": [{"letter": "A", "text": "WBC 200–2,000/µL with no crystals"}, {"letter": "B", "text": "Needle-shaped, negatively birefringent crystals"}, {"letter": "C", "text": "Rhomboid, positively birefringent crystals"}, {"letter": "D", "text": "Clumped hydroxyapatite on alizarin red stain"}, {"letter": "E", "text": "WBC above 50,000/µL with a positive Gram stain"}], "answer": "B", "explanation": "Monosodium urate = needle-shaped, negatively birefringent (yellow parallel to the compensator axis).", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "30B", "group": 30, "stem": "Which of his medications most likely contributed to this episode?", "options": [{"letter": "A", "text": "Lisinopril"}, {"letter": "B", "text": "Amlodipine"}, {"letter": "C", "text": "Hydrochlorothiazide"}, {"letter": "D", "text": "Metformin"}, {"letter": "E", "text": "Rosuvastatin"}], "answer": "C", "explanation": "Thiazide and loop diuretics (also low-dose aspirin, cyclosporine, pyrazinamide) decrease urate excretion.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "31", "group": 31, "stem": "A 34-year-old man had an ankle fracture fixed 2 days ago and is ordered partial weight-bearing (50%) on the right leg for 6 weeks. He has good upper-body strength, normal balance and clear thinking, and wants to return to his desk job quickly.\n\nWhich of the following is the most appropriate device?", "options": [{"letter": "A", "text": "Large-base quad cane"}, {"letter": "B", "text": "Lofstrand forearm crutches"}, {"letter": "C", "text": "Hemi-walker"}, {"letter": "D", "text": "Single-point cane in the left hand"}, {"letter": "E", "text": "Axillary crutches"}], "answer": "E", "explanation": "PWB = limited weight-bearing → bilateral upper-extremity support required (no cane/hemi-walker). Temporary ortho use in a strong, coordinated, cognitively intact patient = axillary crutches; Lofstrand are for long-term neuro use.", "objective": "", "section": "Assistive Devices"}, {"id": "31A", "group": 31, "stem": "The crutches are fitted correctly when:", "options": [{"letter": "A", "text": "The handgrip is at the ulnar styloid with 20–30° elbow flexion"}, {"letter": "B", "text": "The top sits 2–3 finger widths below the axilla with weight through the hands"}, {"letter": "C", "text": "The elbow is fully extended at the handgrip"}, {"letter": "D", "text": "The forearm cuff sits 3 finger widths below the elbow"}, {"letter": "E", "text": "The top rests snugly in the axilla"}], "answer": "B", "explanation": "2–3 finger widths below the axilla, slight elbow bend, weight through the hands, tips slightly wider than the shoulders.", "objective": "", "section": "Assistive Devices"}, {"id": "31B", "group": 31, "stem": "Two weeks later he reports numbness and tingling in both hands after using the crutches. The most likely cause is:", "options": [{"letter": "A", "text": "Crutches set too tall, compressing the brachial plexus"}, {"letter": "B", "text": "Crutches set too short"}, {"letter": "C", "text": "Weight-bearing status advanced too quickly"}, {"letter": "D", "text": "Carpal tunnel syndrome"}, {"letter": "E", "text": "Worn crutch tips"}], "answer": "A", "explanation": "Too tall → brachial plexus nerve/vessel compression; too short → trunk flexion and poor posture.", "objective": "", "section": "Assistive Devices"}, {"id": "32", "group": 32, "stem": "A 40-year-old woman has had 7 weeks of pain and swelling in both wrists and the knuckles of both hands, with 2 hours of morning stiffness that eases as she uses her hands. She is fatigued and has low-grade fevers. The 2nd–3rd MCPs and wrists are warm and boggy; MTP squeeze is tender; DIPs are normal. There is no rash, photosensitivity or oral ulcer.\n\nWhich of the following is the most appropriate next step?", "options": [{"letter": "A", "text": "Hand radiographs to look for erosions"}, {"letter": "B", "text": "ANA with reflex ANA panel"}, {"letter": "C", "text": "Rheumatoid factor and anti-CCP antibodies"}, {"letter": "D", "text": "Evaluation for occult malignancy"}, {"letter": "E", "text": "Arthrocentesis of a wrist"}], "answer": "C", "explanation": "Symmetric small-joint synovitis >6 weeks sparing the DIPs = early RA → RF + anti-CCP (plus ESR/CRP, CBC). This is the lecture case answer.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "32A", "group": 32, "stem": "If hand radiographs were obtained now, the most likely finding would be:", "options": [{"letter": "A", "text": "Normal or periarticular osteopenia only"}, {"letter": "B", "text": "Marginal erosions with joint-space narrowing"}, {"letter": "C", "text": "Punched-out erosions with overhanging edges"}, {"letter": "D", "text": "Pencil-in-cup deformities"}, {"letter": "E", "text": "Chondrocalcinosis"}], "answer": "A", "explanation": "At 7 weeks films are normal or show periarticular osteopenia; erosions are a late finding.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "32B", "group": 32, "stem": "Which laboratory result would most specifically confirm the diagnosis?", "options": [{"letter": "A", "text": "Positive ANA at 1:80"}, {"letter": "B", "text": "Elevated ESR"}, {"letter": "C", "text": "Positive anti-CCP antibody"}, {"letter": "D", "text": "Elevated CRP"}, {"letter": "E", "text": "Positive rheumatoid factor"}], "answer": "C", "explanation": "Anti-CCP is 95% specific (positive rules RA in); RF is nonspecific (hepatitis C, SBE) and negative in 30% of RA.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "32C", "group": 32, "stem": "The first-line disease-modifying agent is:", "options": [{"letter": "A", "text": "Methotrexate weekly with folic acid"}, {"letter": "B", "text": "Infliximab infusions"}, {"letter": "C", "text": "Prednisone 5–15 mg daily indefinitely"}, {"letter": "D", "text": "Hydroxychloroquine alone"}, {"letter": "E", "text": "Naproxen 500 mg twice daily"}], "answer": "A", "explanation": "Methotrexate is the anchor DMARD; prednisone is only a bridge; NSAIDs do not modify disease; biologics are second-line.", "objective": "", "section": "Rheumatoid Arthritis & JIA"}, {"id": "33", "group": 33, "stem": "A 70-year-old man is 2 weeks past a total knee replacement. He walks short distances with a walker but leaving the house requires considerable effort and the help of his son. He needs continued therapy and lives in a two-story home.\n\nWhich of the following is the most appropriate rehabilitation setting?", "options": [{"letter": "A", "text": "Acute inpatient rehabilitation"}, {"letter": "B", "text": "Subacute rehabilitation"}, {"letter": "C", "text": "Day rehabilitation program"}, {"letter": "D", "text": "Home health rehabilitation"}, {"letter": "E", "text": "Outpatient rehabilitation"}], "answer": "D", "explanation": "Homebound (leaving home = considerable, taxing effort) + intermittent need = home health, 2–3×/wk × ~4 wk, with a PT/OT home safety evaluation.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "33A", "group": 33, "stem": "He asks to also attend an outpatient clinic twice a week. This is:", "options": [{"letter": "A", "text": "Permitted if the outpatient visits are for OT only"}, {"letter": "B", "text": "Not permitted — home health and outpatient rehab cannot occur at the same time"}, {"letter": "C", "text": "Permitted if different therapists are used"}, {"letter": "D", "text": "Permitted after the first week of home health"}, {"letter": "E", "text": "Required by his insurance"}], "answer": "B", "explanation": "Home health and outpatient rehab cannot be received simultaneously.", "objective": "", "section": "Rehab: Settings & Team"}, {"id": "34", "group": 34, "stem": "A 52-year-old woman has 8 years of fingers that turn white, then blue, then red in the cold. She now has painful fingertip ulcers, tight shiny skin over the fingers (shown) and face, worsening heartburn, trouble swallowing solids, and new dyspnea on stairs. Skin tightening stops distal to the MCPs; there are chalky nodules at the elbows and mat-like telangiectasias on the face. A loud P2 and right ventricular heave are present. BP and creatinine are normal.\n\nANA positive, anticentromere pattern\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Diffuse cutaneous systemic sclerosis"}, {"letter": "B", "text": "Limited cutaneous systemic sclerosis (CREST)"}, {"letter": "C", "text": "Primary Raynaud phenomenon"}, {"letter": "D", "text": "Morphea"}, {"letter": "E", "text": "Mixed connective tissue disease"}], "answer": "B", "explanation": "Calcinosis, Raynaud, esophageal dysmotility, sclerodactyly, telangiectasia with skin limited to distal extremities/face + anticentromere = limited SSc.", "objective": "", "section": "Scleroderma & Sjögren", "image": "data:image/j "}, {"letter": "B", "text": "Gram stain and culture of the synovial fluid"}, {"letter": "C", "text": "Rheumatoid factor and anti-CCP"}, {"letter": "D", "text": "Intra-articular glucocorticoid injection"}, {"letter": "E", "text": "Indomethacin 50 mg three times daily"}], "answer": "B", "explanation": "Fluid WBC >50,000 with low glucose = septic until proven otherwise. Gram stain/culture decides therapy; never inject a steroid into a possibly infected joint.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "36A", "group": 36, "stem": "Which single finding most strongly argues against gout as the sole explanation?", "options": [{"letter": "A", "text": "Recent skin abrasion"}, {"letter": "B", "text": "Fever of 38.9 °C"}, {"letter": "C", "text": "Synovial WBC above 50,000/µL"}, {"letter": "D", "text": "Involvement of the knee"}, {"letter": "E", "text": "Age of 70 years"}], "answer": "C", "explanation": "Crystal fluid runs 10,000–50,000; >50,000 points to infection. Fever and knee involvement occur in gout too — and crystal and septic arthritis can coexist.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "36B", "group": 36, "stem": "While cultures are pending, the most appropriate management is:", "options": [{"letter": "A", "text": "Colchicine 1.2 mg then 0.6 mg in 1 hour"}, {"letter": "B", "text": "Oral prednisone 40 mg with taper"}, {"letter": "C", "text": "Empiric IV antibiotics with joint drainage"}, {"letter": "D", "text": "Aspiration followed by intra-articular steroid"}, {"letter": "E", "text": "Observation until culture results return"}], "answer": "C", "explanation": "Septic joint → empiric IV antibiotics plus drainage immediately after cultures are sent.", "objective": "", "section": "Approach / Septic & Crystal"}, {"id": "37", "group": 37, "stem": "A 32-year-old woman presents with 2 days of a swollen, tender left calf. She has had two unexplained losses at 8 weeks and a fetal death at 22 weeks. Exam shows a warm, swollen left leg and a net-like violaceous rash on the thighs (shown).\n\nPlatelets 110,000/µL · aPTT 52 s (prolonged) · PT normal · RPR reactive, treponemal test negative\n\nWhich of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Antiphospholipid syndrome"}, {"letter": "B", "text": "Factor V Leiden thrombophilia"}, {"letter": "C", "text": "Immune thrombocytopenic purpura"}, {"letter": "D", "text": "Secondary syphilis"}, {"letter": "E", "text": "Disseminated intravascular coagulation"}], "answer": "A", "explanation": "Thrombosis + recurrent fetal loss + livedo + thrombocytopenia + prolonged PTT + false-positive RPR = APS.", "objective": "", "section": "Lupus Family", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAE7Ae8DASIAAhEBAxEB/8QAHQAAAgMBAQEBAQAAAAAAAAAAAwQBAgUGAAcICf/EAEEQAAIBAwQBAwIEBQEGBQIHAAECEQADIQQSMUFRBRMiYXEGFDKRByNCgaGxFRczwdHwFiRSYuElQzRERVNjcvH/xAAaAQADAQEBAQAAAAAAAAAAAAAAAQIDBAUG/8QAIxEBAQACAgICAwEBAQAAAAAAAAECERIhAzETUQQUQWFxIv/aAAwDAQACEQMRAD8A+43bPvWRAQD2luC2BEbcACsP1zSbNSbzX3jUp7xAwPeHQPAxH7V2Gn0/5VvZawpFkQkmdwbn/QVg/iO2un0aWWRVTTalWAOdwb/sVpKwy7jB0N4Kun1d5vfs6e+jlE7Y8gjxXE/xGtBfxBqNtn22uPvdTyO/tXVajVXNBYvJbVPghUXFH6Crcn9zn6iuJ/iLrbOqJ1to3Xutbhiz7pY/X+5qqWL53+KNLp9Rom1Ntv5gvkmRyDXN2bMyFUT2TxX0a5+HBpfw29nWL7a+2LjM2WY/8q5DSaVGXIIxIrn8nt1/jXcsIWdIS0gRH+KP+UYSSv0rSFpVMLJxXiAhwsz5rN1yErdjaIM0VE3CQMk4AplLO4cZ5NXs2WDmBAGJFJegQoUHEngg0e37rDI+I5imF04JBYHHfmipbLNtjb4AHNByFESG+ozFe9vcTgzzzT/5WWErJ8+aM1hQsBBxyaUp8WWwdgBtkxEk8VX27jDKyBjGa1E0+OAZ4ipfTMOFn6CqVqEl0wKgsDMQK97CsNsfemlmy20gQf8AFMJbRliAD4oRxY76C0WJYkxkA0NLC2m2qCezIrVv2VE4xOQKoLAK/EnjNI+JFlt3F2hfvQzZK4EkeKcVQj7TbxxPijrplYmSCOvpR1BxZlpfuT/pV2th1wM05ese0BAwR1VLahvjuAPc80bguDNa2d2RH1qly2YODE4HitltPaAliGH+tVuWLXxCZxRtNjAewZkGB9avbtEjbFalzSbsQCZxQ1t7BLCI7ilMu1cSX5MQDMDuh3dO
