ntilation"}, {"letter": "D", "text": "High-flow 100% oxygen"}, {"letter": "E", "text": "Hydroxocobalamin"}], "answer": "D", "explanation": "Headache and confusion after enclosed-space combustion, with no airway signs and normal blood pressure, call for high-flow 100% oxygen at once, with hyperbaric oxygen if indicated. Prompt intubation is for airway burns with stridor, and hydroxocobalamin is for cyanide, which causes shock and a lactate above 10.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-G2", "pgroup": "EN-G", "pstack": "A"}, {"id": "36A", "group": 36, "stem": "Which of the following test results would most likely be present?", "options": [{"letter": "A", "text": "Diffuse pulmonary edema on chest radiograph"}, {"letter": "B", "text": "Carboxyhemoglobin 28%"}, {"letter": "C", "text": "Supraglottic edema on bronchoscopy"}, {"letter": "D", "text": "Elevated CK and LFTs with DIC"}, {"letter": "E", "text": "Lactate 12.4 mmol/L"}], "answer": "B", "explanation": "Headache and confusion after enclosed-space combustion point to carbon monoxide, and CO-oximetry on a VBG is diagnostic, showing a carboxyhemoglobin of 28%. The pulse oximeter reads a falsely normal 99% because it cannot tell carboxyhemoglobin from oxyhemoglobin.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-G2", "pgroup": "EN-G", "pstack": "A"}, {"id": "37", "group": 37, "stem": "A 36-year-old woman is extricated after both legs were pinned under rubble for 10 hours in a building collapse and now has dark urine, weakness, palpitations, an irregular pulse of 118/min, and only 40 mL of urine over 2 hours. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Emergent fasciotomy of both legs"}, {"letter": "B", "text": "IV fluids by the Parkland formula"}, {"letter": "C", "text": "Aggressive normal saline with cardiac monitoring"}, {"letter": "D", "text": "Aggressive lactated Ringer's with cardiac monitoring"}, {"letter": "E", "text": "Supportive care with serial neurovascular checks"}], "answer": "C", "explanation": "Release after prolonged compression floods the circulation with potassium and myoglobin; her potassium was 7.1 with peaked T waves and a wide QRS, alongside myoglobinuric AKI and acidosis. Aggressive normal saline with serial potassium checks and continuous monitoring is required — lactated Ringer's is avoided because its added potassium can cause fatal hyperkalemia.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-R2", "pgroup": "EN-R", "pstack": "A"}, {"id": "38", "group": 38, "stem": "A 27-year-old woman who is 22 weeks pregnant is diagnosed with pyelonephritis after 2 days of right flank pain, fever to 38.9°C (102.0°F), shaking chills, nausea, and vomiting. She has right CVA tenderness, WBC casts on urinalysis, and a WBC count of 16,800/mm³, and she has received a dose of IV antibiotics in the ED. Which of the following is the most appropriate disposition?", "options": [{"letter": "A", "text": "Admission for IV antibiotics"}, {"letter": "B", "text": "Discharge with urology follow-up"}, {"letter": "C", "text": "Discharge once she tolerates oral intake"}, {"letter": "D", "text": "Admission only if CT shows an obstructing stone"}, {"letter": "E", "text": "Discharge with an oral fluoroquinolone"}], "answer": "A", "explanation": "Pyelonephritis in pregnancy is admitted for IV antibiotics, and she is also not tolerating oral intake. Discharge on an oral fluoroquinolone is reserved for nonpregnant, non-septic patients who tolerate oral intake, and CT is needed only when the course is complicated or unclear.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-J2", "pgroup": "RE-J", "pstack": "B"}, {"id": "39", "group": 39, "stem": "A 41-year-old man presents to the emergency department of a mountain-town hospital at 10,200 ft after descending from a 14,000-ft summit attempt on day 3 of his trip. Over 2 days, dyspnea on exertion has progressed to dyspnea at rest, with a dry cough, fatigue, and decreased exercise tolerance. He had a similar episode on a climb last year. His temperature is 37.2°C (99.0°F), blood pressure is 132/84 mm Hg, pulse is 118/min, respirations are 30/min, and SpO₂ is 72% on room air. He has crackles over the right mid-lung field and both bases and cyanotic lips; mental status and gait are normal. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "High-flow 100% oxygen alone"}, {"letter": "B", "text": "Intubation and ventilation"}, {"letter": "C", "text": "Further descent and oxygen"}, {"letter": "D", "text": "Descent, oxygen, and dexamethasone"}, {"letter": "E", "text": "Stop ascent and give acetazolamide"}], "answer": "C", "explanation": "Rest dyspnea, crackles, and an SpO₂ far below the ~90% expected at this altitude are treated with descent of 2,000–4,000 ft and oxygen (a portable hyperbaric bag if he cannot descend). Dexamethasone is added for cerebral edema, which his normal mentation and gait argue against.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-P2", "pgroup": "EN-P", "pstack": "A"}, {"id": "39A", "group": 39, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Drowning"}, {"letter": "B", "text": "High-altitude pulmonary edema"}, {"letter": "C", "text": "Carbon monoxide poisoning"}, {"letter": "D", "text": "Acute mountain sickness"}, {"letter": "E", "text": "High-altitude cerebral edema"}], "answer": "B", "explanation": "Rest dyspnea, crackles, and an SpO₂ far below that expected at altitude indicate HAPE, the pulmonary form of altitude illness, whose chest radiograph shows patchy infiltrates with right middle lobe prominence and a normal heart size — noncardiogenic edema from hypoxic pulmonary vasoconstriction. It is the most lethal altitude illness, and mortality approaches 50% without timely descent.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-P2", "pgroup": "EN-P", "pstack": "A"}, {"id": "40", "group": 40, "stem": "A 44-year-old man is brought to the emergency department by EMS after falling about 15 feet from scaffolding and landing on his head and neck. He is confused. His temperature is 36.4°C (97.5°F), blood pressure is 76/40 mm Hg, pulse is 96/min, respirations are 18/min, and SpO₂ is 96% on room air; GCS is 13. He has a palpable step-off at the lower cervical spine, flaccid legs with no sensation below the nipples, priapism, and a distended bladder; breath sounds are equal and the abdomen is soft. FAST is negative, and chest and pelvis radiographs are normal. After 2 L of crystalloid and 2 units of PRBCs, his blood pressure is 78/42 mm Hg. Which of the following is the most appropriate next step in management of his hypotension?", "options": [{"letter": "A", "text": "Vasopressor infusion"}, {"letter": "B", "text": "Further crystalloid and PRBC transfusion"}, {"letter": "C", "text": "Cervical collar, lying flat, and log roll"}, {"letter": "D", "text": "TXA and angiographic embolization"}, {"letter": "E", "text": "Intubation and craniotomy"}], "answer": "A", "explanation": "Hemorrhage is assumed first, and pressors come only after volume and blood fail and a bleeding source has been excluded — both conditions are now met. Hypotension that does not respond to 2 L and 2 units with a negative FAST and a cord-level deficit calls for vasopressors until definitive spinal management by neurosurgery.", "objective": "", "section": "Trauma", "pcase": "TR-E1", "pgroup": "TR-E", "pstack": "A"}, {"id": "40A", "group": 40, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hemorrhagic shock"}, {"letter": "B", "text": "Traumatic brain injury with acute subdural hematoma"}, {"letter": "C", "text": "Retroperitoneal hemorrhage"}, {"letter": "D", "text": "Neurogenic shock"}, {"letter": "E", "text": "Stable spinal trauma"}], "answer": "D", "explanation": "A cervical cord injury with a complete sensory level, priapism, and urinary retention, plus volume-refractory hypotension without a bleeding source, is neurogenic shock. Stable spinal trauma is normotensive, and hemorrhagic sources respond at least transiently to blood and show a source on FAST or CT.", "objective": "", "section": "Trauma", "pcase": "TR-E1", "pgroup": "TR-E", "pstack": "A"}, {"id": "41", "group": 41, "stem": "A 41-year-old man presents to the emergency department after ice fishing overnight, during which he lost his right glove and drank heavily. His right hand felt \"like a block of wood\"; the fingers thawed in his truck and then refroze on the walk back. Now the hand has burning, shooting pain, and the fingers are swollen and discolored. His core temperature is 36.1°C (97.0°F), blood pressure is 132/84 mm Hg, pulse is 98/min, and SpO₂ is 98% on room air. The forearm compartments are soft, and the left hand is normal. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Emergent fasciotomy of the forearm"}, {"letter": "B", "text": "Serial neurovascular checks"}, {"letter": "C", "text": "Drying, rewarming, and wound care"}, {"letter": "D", "text": "Rewarming with analgesia and a topical steroid"}, {"letter": "E", "text": "Rapid thawing in a warm-water bath"}], "answer": "E", "explanation": "With the core already above 35°C, frozen tissue is thawed in a 37–39°C water bath until pliable and red, followed by NSAID and opioid analgesia and tetanus prophylaxis. The soft compartments argue against fasciotomy, and drying with wound care is the approach to non-freezing trench foot.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-C4", "pgroup": "EN-C", "pstack": "A"}, {"id": "41A", "group": 41, "stem": "Which of the following findings on the right fingers would most likely be present?", "options": [{"letter": "A", "text": "Hemorrhagic blisters with blue-gray discoloration"}, {"letter": "B", "text": "Pruritic, edematous skin with blue nodules"}, {"letter": "C", "text": "Cool, pale skin with paresthesias"}, {"letter": "D", "text": "Pale skin that reddens on warming, without blisters"}, {"letter": "E", "text": "Pain with passive stretch of the fingers"}], "answer": "A", "explanation": "Hemorrhagic blisters with blue-gray discoloration grade the injury as third-degree frostbite, which carries a poor prognosis; the thaw–refreeze cycle worsens it. Hemorrhagic blisters are never debrided. Blanching that recovers without blisters is frostnip.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-C4", "pgroup": "EN-C", "pstack": "A"}, {"id": "42", "group": 42, "stem": "A 38-year-old woman with epilepsy who missed doses of levetiracetam this week has right shoulder pain since waking from a generalized seizure this morning. She holds the arm across her chest, adducted and internally rotated, and cannot externally rotate or abduct it; the anterior shoulder is flattened with a prominent coracoid. An AP radiograph of the right shoulder is shown. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Acromioclavicular joint injury"}, {"letter": "B", "text": "Inferior shoulder dislocation (luxatio erecta)"}, {"letter": "C", "text": "Proximal humerus fracture"}, {"letter": "D", "text": "Posterior shoulder dislocation"}, {"letter": "E", "text": "Anterior shoulder dislocation"}], "answer": "D", "explanation": "A seizure with the arm locked in adduction and internal rotation and a symmetric \"lightbulb\" humeral head on the AP view is a posterior dislocation. The AP alone is easily read as normal, so the scapular Y view (head posterior to the glenoid) should always be obtained.", "objective": ith outpatient follow-up"}, {"letter": "B", "text": "Provisional reduction, pronated splint, then ORIF"}, {"letter": "C", "text": "Splint, non-weight-bearing, and syndesmotic fixation"}, {"letter": "D", "text": "Hematoma block, closed reduction, and sugar tong splint"}, {"letter": "E", "text": "Closed reduction and casting without surgery"}], "answer": "B", "explanation": "Galeazzi injuries get a provisional reduction and a long arm posterior splint with the forearm pronated, then ORIF with DRUJ stabilization, which is first line. Closed reduction and casting alone leads to instability, malunion, and loss of motion.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-I2", "pgroup": "OR-I", "pstack": "B"}, {"id": "45", "group": 45, "stem": "A 74-year-old man is brought from a skilled nursing facility with a painful, swollen penile head. He is uncircumcised and has had an indwelling Foley catheter for 3 weeks; the foreskin was pulled back during catheter care yesterday and not replaced. His blood pressure is 134/80 mm Hg and pulse is 92/min. The glans is edematous and tender with a tight constricting ring of retracted foreskin proximal to it; the glans is pink and warm without dusky areas, and the catheter drains clear urine. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Bladder decompression and topical steroid"}, {"letter": "B", "text": "Emergent urology referral for surgical repair"}, {"letter": "C", "text": "Corporal aspiration and cold saline irrigation"}, {"letter": "D", "text": "Hygiene and topical therapy"}, {"letter": "E", "text": "Glans compression, then manual reduction"}], "answer": "E", "explanation": "Reduction must not be delayed, because glans edema progresses to venous engorgement, arterial compromise, and gangrene. After topical EMLA, the glans is compressed with an elastic wrap and ice in 3-minute intervals, then the foreskin is reduced manually; a dorsal slit is the fallback if reduction fails.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-E1", "pgroup": "GU-E", "pstack": "A"}, {"id": "45A", "group": 45, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Phimosis with urinary retention"}, {"letter": "B", "text": "Penile fracture"}, {"letter": "C", "text": "Low-flow priapism"}, {"letter": "D", "text": "Paraphimosis"}, {"letter": "E", "text": "Balanitis"}], "answer": "D", "explanation": "Paraphimosis is a retracted foreskin trapped behind the glans, forming a constricting ring. In phimosis the foreskin cannot retract at all and the glans is not swollen; the foreskin should never be left retracted after catheter care or cleaning.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-E1", "pgroup": "GU-E", "pstack": "A"}, {"id": "46", "group": 46, "stem": "A 28-year-old man has right scrotal pain that has built over 2 days, with dysuria, a scant urethral discharge, and subjective fever. He began a relationship with a new female partner 3 weeks ago and uses condoms inconsistently. His temperature is 38.2°C (100.8°F), blood pressure is 126/80 mm Hg, and pulse is 94/min. The right epididymis posterior to the testis is swollen and tender, lifting the testis relieves the pain, the testis lies in a normal position, and the cremasteric reflex is present. Urinalysis shows positive leukocyte esterase and 20–50 WBC/hpf. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "CT of the groin with contrast"}, {"letter": "B", "text": "Surgical exploration"}, {"letter": "C", "text": "Mumps RT-PCR"}, {"letter": "D", "text": "Scrotal transillumination"}, {"letter": "E", "text": "Scrotal Doppler ultrasound"}], "answer": "E", "explanation": "Gradual onset, fever, pyuria, a positive Prehn sign, and a preserved cremasteric reflex favor infection over torsion. Spread into the testis can mimic torsion, so Doppler ultrasonography is required to document flow before the pain is attributed to infection.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-B3", "pgroup": "GU-B", "pstack": "A"}, {"id": "46A", "group": 46, "stem": "Which of the following findings would this study most likely show?", "options": [{"letter": "A", "text": "Absent testicular flow with a twisted cord"}, {"letter": "B", "text": "Increased blood flow to the epididymis"}, {"letter": "C", "text": "Enlarged appendix testis with preserved flow"}, {"letter": "D", "text": "Increased intratesticular flow with diffuse enlargement"}, {"letter": "E", "text": "Intratesticular mass with hemorrhage"}], "answer": "B", "explanation": "Gradual onset, fever, pyuria, a positive Prehn sign, and a preserved cremasteric reflex favor epididymitis, and inflammation makes the epididymis hyperemic, the opposite of the reduced flow of torsion. He is treated with ceftriaxone IM plus doxycycline and scrotal support, and admitted only if toxic or an abscess forms.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-B3", "pgroup": "GU-B", "pstack": "A"}, {"id": "47", "group": 47, "stem": "A 36-year-old woman was bitten on the left hand by a raccoon 3 hours ago while taking out the trash; the wound bled and the animal ran off. She has never received rabies vaccine. There are two transdermal puncture wounds on the dorsal hand without cellulitis, and her neurologic exam is normal. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Wound washing, rabies immune globulin, and vaccine series"}, {"letter": "B", "text": "Tetanus immune globulin, benzodiazepine, and metronidazole"}, {"letter": "C", "text": "Irrigation and amoxicillin-clavulanate alone"}, {"letter": "D", "text": "Defer prophylaxis until the animal can be tested"}, {"letter": "E", "text": "Oral valacyclovir or acyclovir"}], "answer": "A", "explanation": "A transdermal bite by a raccoon is a WHO Category III exposure, so post-exposure prophylaxis starts now: flush the wound for about 15 minutes, infiltrate rabies immune globulin into the wound with the remainder IM away from the vaccine site, and give vaccine on days 0, 3, 7, and 14. PEP is never delayed waiting on the animal, and once rabies is symptomatic it is essentially fatal.", "objective": "", "section": "Bites", "pcase": "BI-F4", "pgroup": "BI-F", "pstack": "A"}, {"id": "48", "group": 48, "stem": "A 57-year-old mail-processing worker presents with 3 days of fever, myalgia, malaise, and dry cough, followed today by rapidly worsening shortness of breath and lightheadedness. Last week he handled a suspicious powder-containing envelope at work. His temperature is 38.6°C (101.5°F), blood pressure is 84/52 mm Hg, pulse is 124/min, respirations are 30/min, and SpO₂ is 88% on room air. He is in respiratory distress, and there is no skin eschar. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Public health laboratory agent identification"}, {"letter": "B", "text": "Variola PCR of a skin lesion"}, {"letter": "C", "text": "Chest radiograph and blood cultures"}, {"letter": "D", "text": "Sputum Gram stain and culture"}, {"letter": "E", "text": "Serial vital capacity measurement"}], "answer": "C", "explanation": "A flu-like prodrome followed by rapid respiratory failure and shock after a powder exposure calls for a chest radiograph and blood cultures, with public health notified and ciprofloxacin or doxycycline started.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-S2", "pgroup": "EN-S", "pstack": "A"}, {"id": "48A", "group": 48, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Pneumonic plague"}, {"letter": "B", "text": "Smallpox"}, {"letter": "C", "text": "Unidentified Class A agent exposure"}, {"letter": "D", "text": "Botulism"}, {"letter": "E", "text": "Inhalational anthrax"}], "answer": "E", "explanation": "His chest radiograph showed a widened mediastinum, which inhalational anthrax produces after a flu-like prodrome; it is not spread person to person. Pneumonic plague instead causes hemoptysis with multilobar consolidation and spreads by droplets.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-S2", "pgroup": "EN-S", "pstack": "A"}, {"id": "49", "group": 49, "stem": "A 76-year-old woman with CKD, heart failure, and hypertension presents with 2 days of generalized weakness and a slow, fluttering heartbeat. She takes lisinopril and began spironolactone 2 weeks ago, and she still makes urine. Her temperature is 36.6°C (97.9°F), blood pressure is 112/68 mm Hg, pulse is 48/min, respirations are 18/min, and SpO₂ is 96% on room air. She has symmetric proximal weakness with intact sensation, no edema, and clear lungs. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Electrocardiogram"}, {"letter": "B", "text": "Non-hemolyzed serum potassium"}, {"letter": "C", "text": "Serum potassium with magnesium"}, {"letter": "D", "text": "Serum calcium corrected for albumin"}, {"letter": "E", "text": "Serum sodium"}], "answer": "A", "explanation": "Weakness and bradycardia in a patient with CKD on two RAAS-blocking drugs call for an immediate ECG; ECG changes mean treatment starts without waiting for repeat laboratory results. A hemolyzed sample can make a serum value falsely high, but it does not change the ECG.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-F1", "pgroup": "RE-F", "pstack": "A"}, {"id": "49A", "group": 49, "stem": "Which of the following ECG findings would most likely be present?", "options": [{"letter": "A", "text": "Short QTc interval"}, {"letter": "B", "text": "Prolonged QTc interval"}, {"letter": "C", "text": "Peaked T waves with a widened QRS"}, {"letter": "D", "text": "No ECG changes"}, {"letter": "E", "text": "U waves with flattened T waves and ST depression"}], "answer": "C", "explanation": "Hyperkalemia progresses from peaked T waves to a prolonged PR, flattened P waves, and a widened QRS, then to a sine wave and VF/asystole. Her QRS was 142 ms with a potassium of 7.4 mEq/L, and although a hemolyzed sample is the most common cause of a high potassium, it does not change the ECG.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-F1", "pgroup": "RE-F", "pstack": "A"}, {"id": "49B", "group": 49, "stem": "Which of the following is the most appropriate initial medication?", "options": [{"letter": "A", "text": "Nebulized albuterol"}, {"letter": "B", "text": "Regular insulin with D50"}, {"letter": "C", "text": "Sodium zirconium cyclosilicate"}, {"letter": "D", "text": "IV calcium gluconate"}, {"letter": "E", "text": "IV furosemide"}], "answer": "D", "explanation": "IV calcium gluconate stabilizes the cardiac membrane first. Insulin with D50 and albuterol then shift potassium into cells, and a binder, furosemide, and emergent dialysis for the widened QRS remove it.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-F1", "pgroup": "RE-F", "pstack": "A"}, {"id": "50", "group": 50, "stem": "A 38-year-old woman is diagnosed with a right posterior shoulder dislocation after a seizure; the military-patch sensation and radial pulse are intact. Procedural sedation is planned. Which of the following is the most appropriate reduction method?", "options": [{"letter": "A", "text": "Sling and analgesia without reduction"}, {"letter": "B", "text": "Reduction by a posterior technique"}, {"letter": "C", "text": "FARES maneuver"}, {"letter": "D", "text": "Cunningham technique"}, {"letter": "E", "text": "Kocher maneuver"}], "answer": "B", "explanation": "Posterior dislocations are reduced with a posterior technique, followed by a neurovascular check, post-reduction film, and sling. Kocher and FARES are anterior-dislocation maneuvers and cannot be used for a posterior dislocation; an irreducible joint goes to emergent ortho.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-D2", "pgroup": "OR-D", "pstack": "B"}, {"id": "51", "group": 51, "stem": "A 14-year-old boy is brought to the emergency department by his mother after sudden, severe pain in his left testicle woke him from sleep 2 hours ago. He has vomited twice and has some lower abdominal pain. He played basketball yesterday, has no dysuria, and is not sexually active. His temperature is 37.0°C (98.6°F), blood pressure is 124/76 mm Hg, pulse is 108/min, and respirations are 18/min. The left testis is firm, tender, and high-riding with a horizontal lie, the left hemiscrotum is red and swollen, and the left cremasteric reflex is absent; there is no blue dot. Urinalysis is normal. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Emergent urology consultation"}, {"letter": "B", "text": "Ceftriaxone plus doxycycline"}, {"letter": "C", "text": "Scrotal elevation and cold packs"}, {"letter": "D", "text": "Scrotal support and NSAIDs"}, {"letter": "E", "text": "Scrotal Doppler ultrasonography"}], "answer": "A", "explanation": "Sudden severe pain with a high-riding, horizontal testis, an absent cremasteric reflex, and a normal urinalysis means urology is called on clinical suspicion. Imaging must not delay the consult, and a negative Doppler does not exclude a partial or intermittent process.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-B1", "pgroup": "GU-B", "pstack": "A"}, {"id": "51A", "group": 51, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Torsion of the appendix testis"}, {"letter": "B", "text": "Strangulated inguinal hernia"}, {"letter": "C", "text": "Mumps orchitis"}, {"letter": "D", "text": "Testicular torsion"}, {"letter": "E", "text": "Epididymitis"}], "answer": "D", "explanation": "Sudden severe pain with a high-riding, horizontal testis, an absent cremasteric reflex, and a normal urinalysis is torsion until proven otherwise — time is testes. The bell clapper deformity lets the testis twist on its cord, which is why detorsion is paired with bilateral orchiopexy. Appendageal torsion is gradual and focal with a blue dot and a preserved reflex, and epididymitis is gradual with pyuria.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-B1", "pgroup": "GU-B", "pstack": "A"}, {"id": "52", "group": 52, "stem": "A 26-year-old woman is brought to the emergency department by EMS after she was struck by a car while crossing a road. She is anxious, confused, and short of breath, and there is no visible bleeding. Her temperature is 36.4°C (97.5°F), blood pressure is 98/82 mm Hg, pulse is 128/min, respirations are 30/min, and SpO₂ is 97% on room air. Her skin is pale, cool, and clammy with a capillary refill of 4 seconds; breath sounds are equal, the pelvis is stable, and there are abrasions over the left flank. Chest and pelvis radiographs are normal. A FAST image of the right upper quadrant is shown. Which of the following is the most appropriate next step in management?\n\nHemoglobin: 12.6 g/dL\nLactate: 5.4 mmol/L\nBase deficit: −9\nINR: 1.0", "options": [{"letter": "A", "text": "Chest tube and blood transfusion"}, {"letter": "B", "text": "Anticoagulant reversal and angiographic embolization"}, {"letter": "C", "text": "PRBC transfusion and exploratory laparotomy"}, {"letter": "D", "text": "Volume resuscitation, then vasopressors"}, {"letter": "E", "text": "Pelvic binder and angiographic embolization"}], "answer": "C", "explanation": "A narrow pulse pressure, tachycardia, and cool, clammy skin with a lactate of 5.4 and base deficit of −9 are hemorrhagic shock, and the FAST finding localizes the source. A single normal hemoglobin does not exclude acute hemorrhage and crystalloid is only temporary, so she needs blood (with TXA) and laparotomy for n": "Hyperkalemia with ECG changes and volume overload with hypoxia both meet AEIOU criteria for emergent dialysis, and shifting potassium only buys time. Nephrology is called for emergent dialysis and he is admitted — the threshold to admit dialysis patients is low.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-E1", "pgroup": "RE-E", "pstack": "B"}, {"id": "54", "group": 54, "stem": "A 41-year-old man has a posterior hip dislocation on pelvis x-ray with no acetabular fracture seen; dorsiflexion, plantarflexion, foot sensation, and the dorsalis pedis pulse are intact. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Non-weight-bearing and surgery after admission"}, {"letter": "B", "text": "Prompt closed reduction under sedation"}, {"letter": "C", "text": "Traction splint and femoral nerve block"}, {"letter": "D", "text": "Pelvic binder and early transfusion"}, {"letter": "E", "text": "CT before any reduction attempt"}], "answer": "B", "explanation": "A dislocated hip is reduced promptly under procedural sedation (Allis, Captain Morgan, Whistler, or Rocket launcher), because delay increases the risk of avascular necrosis and sciatic nerve injury. CT is obtained after reduction, and an irreducible hip goes to the OR.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-S3", "pgroup": "OR-S", "pstack": "B"}, {"id": "55", "group": 55, "stem": "A 44-year-old utility lineman is brought to the emergency department by EMS after his right hand contacted a 7,200-volt line and he was thrown about 6 feet from a bucket lift, briefly losing consciousness. He has severe right forearm pain and palpitations. His temperature is 37.0°C (98.6°F), blood pressure is 118/72 mm Hg, pulse is 128/min and irregular, respirations are 20/min, and SpO₂ is 98% on room air. There is a small charred entry wound on the right palm and an exit wound on the left heel; the right radial pulse is present, and he is alert without focal deficit. The ECG shows atrial fibrillation. Which of the following is the most appropriate next step in management?\n\nPotassium: 5.9 mEq/L\nBUN: 26 mg/dL\nCreatinine: 1.8 mg/dL\nBicarbonate: 19 mEq/L\nLactate: 3.6 mmol/L\nTroponin: Normal\nHemoglobin: 15.0 g/dL\nHematocrit: 45%", "options": [{"letter": "A", "text": "Aggressive IV fluids and mannitol"}, {"letter": "B", "text": "Plastic surgery consult with bleeding precautions"}, {"letter": "C", "text": "Prolonged ventilation with aggressive ACLS"}, {"letter": "D", "text": "Burn-center transfer for amputation"}, {"letter": "E", "text": "Parkland IV fluids sized to the skin burns"}], "answer": "A", "explanation": "High-voltage current travels through nerve, muscle, and vessels, so the small skin wounds badly underestimate the internal damage; fluids must not be sized by the surface burn. He needs aggressive IV fluids to a urine output of about 100 mL/h with mannitol to protect the renal tubules — his CK was 38,000 U/L with myoglobinuria.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-I1", "pgroup": "EN-I", "pstack": "A"}, {"id": "55A", "group": 55, "stem": "Which of the following is the most appropriate disposition?", "options": [{"letter": "A", "text": "Discharge with hand surgery follow-up"}, {"letter": "B", "text": "Discharge if a repeat ECG is normal"}, {"letter": "C", "text": "Transfer to a burn center"}, {"letter": "D", "text": "Observation in the emergency department"}, {"letter": "E", "text": "Admission to a general medical floor"}], "answer": "C", "explanation": "Every patient with contact of 600 V or more is admitted, and high-voltage injuries go to a burn center. The rule that a normal ECG excludes later dysrhythmia applies only to contact below 1,000 V.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-I1", "pgroup": "EN-I", "pstack": "A"}, {"id": "56", "group": 56, "stem": "A 22-year-old college student presents with radial-sided wrist pain since falling onto an outstretched hand from a skateboard yesterday. There is anatomic snuffbox and scaphoid tubercle tenderness and pain with axial loading of the thumb, with no deformity, no distal radius tenderness, and intact neurovascular function. A wrist radiograph with a scaphoid view shows no fracture line, and the distal radius and carpal alignment are normal. The radiograph is shown. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Pronated long arm splint, then ORIF"}, {"letter": "B", "text": "Traction, splint, then surgical reduction"}, {"letter": "C", "text": "Closed reduction and sugar tong splint"}, {"letter": "D", "text": "Thumb spica splint"}, {"letter": "E", "text": "Discharge without a splint since the film is normal"}], "answer": "D", "explanation": "Snuffbox tenderness after a FOOSH is treated as the suspected fracture even when the first film is normal, so the wrist goes in a thumb spica splint with a repeat scaphoid-view radiograph in 7 days. Discharging a tender snuffbox unsplinted because the film is negative is the classic miss.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-M3", "pgroup": "OR-M", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCADQAIsDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nz xXimNfsVySM4SiiunDfEcWM/hs85jY4HuasHhUPYjpRRX0NLY+UmSAbiu/kYOAOMVGHJ2jsM8UUVoQwcnyg2e/SmlicL260UUwiN/gpN54oopDDc3rRRRQB/9k="}, {"id": "57A", "group": 57, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Paronychia"}, {"letter": "B", "text": "Felon"}, {"letter": "C", "text": "Flexor tenosynovitis"}, {"letter": "D", "text": "Human bite (fight bite)"}, {"letter": "E", "text": "Herpetic whitlow"}], "answer": "C", "explanation": "All four Kanavel signs (fusiform swelling, a flexed resting posture, sheath tenderness, and pain with passive extension) after a volar puncture wound define flexor tenosynovitis; pain with passive extension is the most sensitive sign. A felon is confined to a tense pulp and a paronychia to the nail fold, and both spare the tendon sheath.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-Q1", "pgroup": "OR-Q", "pstack": "A"}, {"id": "58", "group": 58, "stem": "A 29-year-old man felt a pinprick on his right hand 2 hours ago while stacking firewood from a dark garage corner in inland Southern California. He saw a shiny black spider with a red hourglass on its abdomen. He now has severe cramping of the abdomen, back, and thighs, sweating, and muscle twitching, and his pain is uncontrolled after IV morphine. His blood pressure is 168/98 mm Hg and pulse is 116/min. There is a target lesion on the dorsal hand, diaphoresis, fasciculations of the thighs, and a rigid but nontender abdomen without rebound. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Coral snake envenomation"}, {"letter": "B", "text": "Black widow spider bite"}, {"letter": "C", "text": "Bark scorpion sting"}, {"letter": "D", "text": "Tetanus"}, {"letter": "E", "text": "Brown recluse spider bite"}], "answer": "B", "explanation": "A pinprick bite with a target lesion followed by severe large-muscle cramping, hypertension, and tachycardia is latrodectism. The bite site is trivial and the illness systemic, the opposite of the brown recluse's painless bite with local necrosis.", "objective": "", "section": "Bites", "pcase": "BI-B2", "pgroup": "BI-B", "pstack": "A"}, {"id": "58A", "group": 58, "stem": "Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Coral snake antivenom"}, {"letter": "B", "text": "Ice, elevation, and wound care"}, {"letter": "C", "text": "Tetanus immune globulin and metronidazole"}, {"letter": "D", "text": "Black widow antivenom"}, {"letter": "E", "text": "Benzodiazepine and atropine"}], "answer": "D", "explanation": "Severe systemic latrodectism with pain uncontrolled by IV opioids is the indication for black widow antivenom given IV over 1 hour, on top of analgesia and supportive care. Benzodiazepine with atropine is the regimen for bark scorpion toxicity.", "objective": "", "section": "Bites", "pcase": "BI-B2", "pgroup": "BI-B", "pstack": "A"}, {"id": "59", "group": 59, "stem": "A 41-year-old woman is brought to the trauma bay after a car crash; she was the unrestrained driver and her left chest struck the steering wheel. She is in severe respiratory distress with chest pain. Her blood pressure is 78/50 mm Hg, pulse is 136/min, respirations are 34/min, and SpO₂ is 84% on room air. Breath sounds are absent on the left, there is a left chest wall contusion, and the neck veins are flat. A chest radiograph is shown. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Pericardiocentesis, then operative repair"}, {"letter": "B", "text": "Oxygen and analgesia, intubating if failing"}, {"letter": "C", "text": "Chest tube and blood transfusion"}, {"letter": "D", "text": "Three-sided occlusive dressing, then chest tube"}, {"letter": "E", "text": "Needle decompression, then chest tube"}], "answer": "E", "explanation": "Hypotension, hypoxia, and unilateral absent breath sounds after chest trauma make this a bedside diagnosis fixed during Breathing with immediate needle decompression followed by a chest tube. Decompression should never wait for a radiograph; flat neck veins do not exclude the diagnosis (JVD may be absent if hypovolemic), and tracheal shift is a late sign.", "objective": "", "section": "Trauma", "pcase": "TR-C2", "pgroup": "TR-C", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAJ2Ak8DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD5x8qDvAn12inCO3J5t0+gQVY03SdQ1i4+z6bY3d9MFLmK3iaVwPXC9uRWoPAni7nPhbXfx0+b/wCJoAwTBDniBB/wAUCK3GP3CH/gIrePgLxcRn/hF9e/8F83/wATTR4D8W/9Crr2f+wfL/8AE0AYYigBH+joT7KKQxQEjECD/gIOa3W8B+Lv+hV148f9A+X/AOJpB4E8XH/mVde/8F83/wATQBiLDAePJj/75FCxQHH7hP8AvgVa1PSNS0WZYdT0+8sJWXcqXMLRMwzjIDDmqpBxxj8O9ACmG3K8W6Z9doGKYIoMj9zH/wB8ClHAHXPpSnqehoAR4oAT+5TH+4KDDAekMf8A3yKTgjOaCPpigAEMC4/dIR/uigww5H7lB/wAUEjOMn1zRnvn8TQACKDH+qj+mwUeTCSP3Sf98ikyfx9+9BAH1FADvJgH/LGPP+6KQQw94Y8/7tH8X+FG8/h70AIYoT0ij+m0Uphg4/dxj/gNJu75xQzcjj86AGNDFk/uo/wWn2VvFLeRp5aEE85XrTScY5q/4fs2u9QQk7U9fWgDqtL03T8gNpllIfR4ENb9rpOhEjzNDsR/vWyY/lSabbxQ/KqjgjOe9bcSRuBn5u3PagBLXw94efBOhaURyebVP8K0k8I+HCAw0DSD9bRP8KI7ZSNy/JjjK1ZXzFwvLA/dBPSgBI/CPhnJ3eHtJYj0s4+f0qdvB3hdEDf8I7o3P/TnH/hU8VzsIAUrk4z/AEq2JlI/vGgDMXwj4YDYPh3Rs56/Yo/8K3r // Reshuffle-on-load for a Clinical Vignette practice exam.
//
// Inject this immediately after the `const EXAM_DATA = ...;` line of the
// interactive-exam template, before the main IIFE. It reorders the stacks and
// the options on every page load, then renumbers, so the exam cannot be
// answered from memory of position.
//
// Requires three extra fields on every question, written by the exam build:
//   pcase   the case id from the case file, e.g. "A3"
//   pgroup  the differential group letter, e.g. "A"
//   pstack  "A" recognition | "B" management safety | "C" counseling
//
// Constraints preserved on every shuffle:
//   1. no two consecutive stacks share a differential group
//   2. a patient's Stack A precedes their Stack B, which precedes their Stack C
//   3. follow-up nodes never leave their parent
(function reshuffleExam() {
  var qs = EXAM_DATA.questions;
  if (!qs || !qs.length || !qs[0].pcase) return;   // metadata absent: leave order alone

  // ---- collect stacks, parent first ----------------------------------------
  var map = {}, order = [];
  qs.forEach(function (q) {
    if (!map[q.group]) { map[q.group] = []; order.push(q.group); }
    map[q.group].push(q);
  });
  var stacks = order.map(function (g) {
    return { qs: map[g], pcase: map[g][0].pcase, pgroup: map[g][0].pgroup, pstack: map[g][0].pstack };
  });
  if (stacks.length < 3) return;

  var RANK = { A: 0, B: 1, C: 2 };

  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }

  // Reorder one case's stacks into A→B→C at whatever positions that case holds,
  // leaving every other position as the shuffle left it.
  function repairCaseOrder(seq) {
    var pend = {}, idx = {};
    seq.forEach(function (s) { (pend[s.pcase] = pend[s.pcase] || []).push(s); });
    Object.keys(pend).forEach(function (c) {
      pend[c].sort(function (x, y) { return RANK[x.pstack] - RANK[y.pstack]; });
      idx[c] = 0;
    });
    return seq.map(function (s) { return pend[s.pcase][idx[s.pcase]++]; });
  }

  function groupsAdjacent(seq) {
    for (var i = 0; i < seq.length - 1; i++) {
      if (seq[i].pgroup === seq[i + 1].pgroup) return true;
    }
    return false;
  }

  var seq = null;
  for (var attempt = 0; attempt < 4000; attempt++) {
    var cand = repairCaseOrder(shuffled(stacks));
    if (!groupsAdjacent(cand)) { seq = cand; break; }
  }
  if (!seq) return;   // could not satisfy the constraints: keep the built order

  // ---- shuffle the options inside each question ----------------------------
  var LET = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  seq.forEach(function (s) {
    s.qs.forEach(function (q) {
      if (!q.options || q.options.length < 2) return;
      var keyText = null;
      q.options.forEach(function (o) { if (o.letter === q.answer) keyText = o.text; });
      var texts = shuffled(q.options.map(function (o) { return o.text; }));
      q.options = texts.map(function (t, i) { return { letter: LET[i], text: t }; });
      for (var i = 0; i < q.options.length; i++) {
        if (q.options[i].text === keyText) { q.answer = q.options[i].letter; break; }
      }
    });
  });

  // ---- renumber and write the new order back ------------------------------
  var out = [];
  seq.forEach(function (s, i) {
    var n = i + 1;
    s.qs.forEach(function (q, j) {
      q.group = n;
      q.id = j === 0 ? String(n) : String(n) + LET[j - 1];
      out.push(q);
    });
  });
  EXAM_DATA.questions = out;
})();


(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  let mode = 'exam';         // 'exam' | 'results' | 'review'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += '</div>';
    return html;
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {
    return questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.answer);
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed questions (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed questions</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          '<div class="stem">' + esc(g[0].stem) + '</div></div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed questions (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed question' + (missed.length === 1 ? '' : 's');

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + group[0].stem);
      lines.push(q.stem);
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      lines.push('My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed questions'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
