<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

const EXAM_DATA = {"title": "Emergency Medicine — Exam 2 Practice Exam (Vignettes)", "questions": [{"id": "1", "group": 1, "stem": "A 52-year-old man is brought to the trauma bay after being thrown from a motorcycle at highway speed. He has severe pelvic and bilateral hip pain. His blood pressure is 84/60 mm Hg, pulse is 126/min, respirations are 24/min, and SpO₂ is 98% on room air. The pelvis is unstable and tender on gentle compression, there is a scrotal and perineal hematoma with blood at the urethral meatus, breath sounds are equal, and the abdomen is soft. FAST is negative. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Chest tube and blood transfusion"}, {"letter": "B", "text": "Volume resuscitation, then vasopressors"}, {"letter": "C", "text": "Anticoagulant reversal and angiographic embolization"}, {"letter": "D", "text": "Pelvic binder and angiographic embolization"}, {"letter": "E", "text": "PRBC transfusion and exploratory laparotomy"}], "answer": "D", "explanation": "Shock with an unstable pelvis and a negative FAST points to a pelvic source of bleeding, and the pelvis can hold the entire blood volume. A pelvic binder with blood is the immediate step, followed by angiographic embolization of the arterial source. Meatal blood means no Foley until a retrograde urethrogram is done.", "objective": "", "section": "Trauma", "pcase": "TR-A3", "pgroup": "TR-A", "pstack": "A"}, {"id": "1A", "group": 1, "stem": "Which of the following imaging findings would most likely be present?", "options": [{"letter": "A", "text": "Displaced femoral shaft fracture"}, {"letter": "B", "text": "Displaced pelvic ring fracture"}, {"letter": "C", "text": "Pleural fluid in the hemithorax"}, {"letter": "D", "text": "Cervical fracture-dislocation with cord compression"}, {"letter": "E", "text": "Free fluid in the RUQ and LUQ views"}], "answer": "B", "explanation": "The pelvis radiograph shows a displaced pelvic ring fracture, which accounts for his hidden hemorrhage from bone or the presacral venous plexus. The negative FAST excludes an intraperitoneal source, and equal breath sounds and the absence of thigh deformity make the chest and femur unlikely.", "objective": "", "section": "Trauma", "pcase": "TR-A3", "pgroup": "TR-A", "pstack": "A"}, {"id": "2", "group": 2, "stem": "A 24-year-old man has increasing pain and swelling of a small cut over his right ring-finger knuckle since last night; he first said he cut it on a door but later admits he punched another man in the mouth. There is a 5-mm laceration over the fourth MCP joint with joint swelling and tenderness and pain with passive flexion of the digit. Hand x-ray shows a small intra-articular fracture fragment of the fourth metacarpal head beneath the laceration. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Tetanus immune globulin, benzodiazepine, and metronidazole"}, {"letter": "B", "text": "Irrigation and amoxicillin-clavulanate alone"}, {"letter": "C", "text": "Irrigation, amoxicillin-clavulanate, hand surgery consult"}, {"letter": "D", "text": "Wound washing, rabies immune globulin, and vaccine"}, {"letter": "E", "text": "Oral valacyclovir"}], "answer": "C", "explanation": "Any laceration over the MCP is a fight bite until proven otherwise, and here the x-ray shows an open fracture into the joint. It needs irrigation, amoxicillin-clavulanate to cover staph, strep, and Eikenella, and hand surgery consultation for joint involvement, along with bloodborne pathogen testing and follow-up.", "objective": "", "section": "Bites", "pcase": "BI-F3", "pgroup": "BI-F", "pstack": "A"}, {"id": "3", "group": 3, "stem": "A 46-year-old woman is brought to the emergency department 1 hour after falling about 8 feet from a hayloft onto the barnyard floor, landing on her outstretched left arm. Her last tetanus shot was more than 10 years ago, and she has no drug allergies. Her temperature is 9M/n/ACNcXFJH5XmeZXkYyPvnvZXU/duPmdbp99HFWvFcRy1xFteVu215XGeqbUkP/LSsXWfDtlqtpJb3H+r37/k+X5ugNa8F15tWPL82j/CKXvfEeX3fgu90/wD48v8ASI//AB6qsUMkUvlyR+XJ/t16rJb1QvtJt7v/AI+I/wDcqeb+YOX+U5CL/VU7bJWpLoMkX/Hv+8j/APHqrrbyRf6yPy6YyBfMqRVkq3HHUu3/AKZ1BZnUvnVfW183/Vx1Mvh2SX/WSeXVRM5SKP2qOnrDe3f/AB72/wDwN/lrodP8P2en/wDLPzJP771f8mmZ8xyEfheSX/j9uP8AgCfLWtaaLb6f/q4/LrWby4qglmjoGM8uOKqstx5tU77VI/N8uOs6XVKANOW6rOvL6s251KsTUNY8rzP3lOMeYiUuX3jU1DUv3X+srmr7VJJf9XWNqXiL/ln/AKyuZ1DUL3UP+Wnlx/3E+Wu6jgZS96R59bHKPuxOg1fxVZafF5fmeZcf+g/WuEvNU82XzPM8yST770kunyVRe1kir0qdGNOPunj4itOp8RbttavLSb/Q7y4t/wDbhc/yrstJ8fXoijEtxHef9dvlb8xXnvl0m2ipRhP4omdOpKPwnrv/AAnX/Tv/AOP0V5L51wOPMorH6jT7Gn1qZ6dq/wDx9f8AAK9w0X/kFWf/AFxX+VFFelUPAyzdmn/yyqRKKK5j24jLr/j0uP8Acb+VeWxf62iivPxvQ9bK+pLB/wAtK6Cx/wBVRRXnSPaidBbf6qOr60UVJZaion/4+v8AgdFFTLYUdyrLVOT/AFUlFFQaGXJ/x9x1vaeq+V0H5UUVcSYjmqxFRRVGNTcnamtRRSM4mfc/66s6X/lpRRTNjnJ6z56KKCYlHUv9VXIa8zfu+T9/1oorrwnxHDjfgMGSqstFFe7A8MiWoJaKKomRm3NVWooqDNhRRRUkn//Z"}, {"id": "5", "group": 5, "stem": "A 17-year-old high-school football player is brought to the emergency department by EMS after collapsing on the second day of August two-a-day practices. He drank two energy drinks before practice. He is disoriented and agitated with slurred speech, and he vomited twice and had one bloody stool en route. Blood pressure is 94/56 mm Hg, pulse is 138/min, respirations are 30/min, and SpO₂ is 97% on room air. His skin is hot and dry, and there is no focal weakness. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Rest, cooling, oral hydration, and stretching"}, {"letter": "B", "text": "Descent with oxygen and dexamethasone"}, {"letter": "C", "text": "Cold-water immersion"}, {"letter": "D", "text": "Rest, cooling, and IV hydration with salt replacement"}, {"letter": "E", "text": "High-flow 100% oxygen"}], "answer": "C", "explanation": "Exertional collapse with altered mentation and hot, dry skin means cooling must start immediately rather than wait for the workup, and cold-water immersion is the treatment of choice. Rest with oral or IV hydration is for heat cramps and heat exhaustion, which do not alter mentation.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-A3", "pgroup": "EN-A", "pstack": "A"}, {"id": "5A", "group": 5, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Heat exhaustion"}, {"letter": "B", "text": "Heat stroke"}, {"letter": "C", "text": "Carbon monoxide poisoning"}, {"letter": "D", "text": "High-altitude cerebral edema"}, {"letter": "E", "text": "Heat cramps"}], "answer": "B", "explanation": "Exertional collapse with altered mentation and hot, dry skin is heat stroke until proven otherwise; his rectal temperature was 41.4°C, and his labs showed DIC, acute kidney injury, and rhabdomyolysis — multiorgan failure. Heat exhaustion keeps the temperature below 40°C without altered mentation, and heat cramps have a normal temperature.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-A3", "pgroup": "EN-A", "pstack": "A"}, {"id": "6", "group": 6, "stem": "A 38-year-old man heard a \"crack\" during intercourse 2 hours ago, followed by immediate loss of erection, pain, and rapid swelling, and he now has difficulty urinating. His blood pressure is 138/86 mm Hg and pulse is 98/min. The penis is edematous, painful, flaccid, purple, and deviated to the left, and there is blood at the meatus. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Surgical debridement and IV antibiotics"}, {"letter": "B", "text": "Glans compression, then manual reduction"}, {"letter": "C", "text": "Observation with urology follow-up"}, {"letter": "D", "text": "Emergent urology consultation"}, {"letter": "E", "text": "Corporal aspiration and irrigation"}], "answer": "D", "explanation": "An audible crack with immediate detumescence and a swollen, discolored penis is a penile fracture — rupture of the tunica albuginea. Emergent urology is needed for surgical repair within 8 hours, and blood at the meatus with difficulty voiding calls for a retrograde urethrogram to check urethral integrity.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-F3", "pgroup": "GU-F", "pstack": "A"}, {"id": "7", "group": 7, "stem": "A 47-year-old man develops hives, lip and eyelid swelling, throat tightness, wheezing, lightheadedness, and vomiting 10 minutes after one yellow-jacket sting to the neck while mowing. He had anaphylaxis to a wasp sting 5 years ago and carries an EpiPen but did not use it. His temperature is 37.0°C (98.6°F), blood pressure is 78/44 mm Hg, pulse is 128/min, respirations are 26/min, and SpO₂ is 91% on room air. He has diffuse urticaria, angioedema of the lips and eyelids, diffuse expiratory wheeze, and faint inspiratory stridor. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Intramuscular epinephrine"}, {"letter": "B", "text": "IV diphenhydramine and famotidine"}, {"letter": "C", "text": "Albuterol nebulizer"}, {"letter": "D", "text": "IV methylprednisolone"}, {"letter": "E", "text": "Stinger removal, ice, and elevation"}], "answer": "A", "explanation": "Skin involvement with airway compromise and hypotension within minutes of a sting calls for IM epinephrine immediately, without waiting for any test. Only epinephrine reverses airway edema and shock; H1/H2 blockers treat the skin, steroids act over hours, and albuterol is added only for persistent bronchospasm.", "objective": "", "section": "Bites", "pcase": "BI-A2", "pgroup": "BI-A", "pstack": "A"}, {"id": "7A", "group": 7, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Fire ant sting"}, {"letter": "B", "text": "Hymenoptera anaphylaxis"}, {"letter": "C", "text": "Hymenoptera toxic reaction"}, {"letter": "D", "text": "Hymenoptera sting local reaction"}, {"letter": "E", "text": "Black widow spider bite"}], "answer": "B", "explanation": "Diffuse urticaria and angioedema with stridor, wheeze, and hypotension 10 minutes after a single sting is IgE-mediated anaphylaxis, which is not dose-dependent. A toxic reaction requires dozens to hundreds of stings and appears 8 to 24 hours later with organ-injury labs.", "objective": "", "section": "Bites", "pcase": "BI-A2", "pgroup": "BI-A", "pstack": "A"}, {"id": "8", "group": 8, "stem": "A 52-year-old landscaper in central Florida picked up a small snake with red, yellow, and black bands, with red touching yellow; it held on and chewed his right hand for several seconds before he pried it off 1 hour ago. He has mild numbness at the bite and otherwise feels well. Vital signs are normal, with SpO₂ 98%. There are two tiny punctures on the thenar eminence with no edema; gag reflex, palate elevation, and speech are normal, with no tongue fasciculations or ptosis. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Observation for 8 to 12 hours with serial wound care"}, {"letter": "B", "text": "Crotaline antivenom and limb elevation"}, {"letter": "C", "text": "Search for an attached tick"}, {"letter": "D", "text": "Analgesia and supportive care alone"}, {"letter": "E", "text": "Coral snake antivenom and pressure-immobilization"}], "answer": "E", "explanation": "A definite coral snake bite is treated with antivenom and pressure-immobilization even when the patient is asymptomatic, because some of the venom's effects are irreversible once they appear. Elevation is the pit viper approach, and waiting for symptoms is the trap.", "objective": "", "section": "Bites", "pcase": "BI-E2", "pgroup": "BI-E", "pstack": "A"}, {"id": "8A", "group": 8, "stem": "Which of the following is the most likely complication if this bite is left untreated?", "options": [{"letter": "A", "text": "Attached tick with ascending flaccid paralysis"}, {"letter": "B", "text": "Thrombocytopenia and coagulopathy"}, {"letter": "C", "text": "Bulbar palsy delayed up to 13 hours"}, {"letter": "D", "text": "Target lesion with hypertension and muscle cramping"}, {"letter": "E", "text": "No reaction after 8 to 12 hours"}], "answer": "C", "explanation": "Coral snake venom is neurotoxic and can cause bulbar palsy (loss of gag and palate movement, dysarthria, tongue fasciculations) and respiratory paralysis up to 13 hours after the bite, and some neurotoxic effects are irreversible once they appear. He should be admitted for serial neurologic and pulmonary monitoring even if the first exam is normal.", "objective": "", "section": "Bites", "pcase": "BI-E2", "pgroup": "BI-E", "pstack": "A"}, {"id": "9", "group": 9, "stem": "A 54-year-old man who is experiencing homelessness is brought to the emergency department by police after being found at dawn on a park bench in January, in rain-soaked clothes, with an empty liquor bottle beside him. He is shivering and oriented only to name. Blood pressure is 98/60 mm Hg, pulse is 44/min, respirations are 10/min, and the pulse oximeter will not read. His skin is cold to the touch, reflexes are diminished, and there is no frostbite of the hands or feet. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Low-reading core thermometer and ECG"}, {"letter": "B", "text": "Chest radiograph and arterial blood gas"}, {"letter": "C", "text": "Cardiac monitor and serum potassium"}, {"letter": "D", "text": "ECG and CK with a full-body skin exam"}, {"letter": "E", "text": "Clinical staging of the hands and feet"}], "answer": "A", "explanation": "Many thermometers read only down to 34°C, so an accurate core temperature by a low-reading (Foley) thermometer is essential to stage hypothermia; the ECG shows the bradycardia and Osborn J waves. His core temperature was 30.4°C — moderate hypothermia with a perfusing rhythm.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-B1", "pgroup": "EN-B", "pstack": "A"}, {"id": "10", "group": 10, "stem": "A 44-year-old warehouse worker presents 2 hours after a pallet fell against his forearm. There is distal radius deformity with a prominent ulnar head and tenderness at the distal radioulnar joint; the elbow is nontender with the radial head in place, the skin is intact, and neurovascular function is intact. Radiographs are shown. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Smith fracture"}, {"letter": "B", "text": "Colles fracture"}, {"letter": "C", "text": "Monteggia fracture-dislocation"}, {"letter": "D", "text": "Galeazzi fracture-dislocation"}, {"letter": "E", "text": "Maisonneuve fracture"}], "answer": "D", "explanation": "A distal-third radius fracture with disruption of the distal radioulnar joint and a prominent ulnar head is a Galeazzi fracture-dislocation (\"MUGR\": Galeazzi = Radius). Monteggia instead fractures the proximal ulna and dislocates the radial head, and Colles or Smith fractures involve no dislocated joint.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-I2", "pgroup": "OR-I", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAKwAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJyg er": "C", "text": "CT of the abdomen and pelvis with IV contrast"}, {"letter": "D", "text": "Serum creatine kinase"}, {"letter": "E", "text": "CT of the abdomen and pelvis without contrast"}], "answer": "E", "explanation": "Colicky flank-to-groin pain with hematuria and no pyuria in a first episode is evaluated with a non-contrast CT, which showed a 5-mm stone at the left ureterovesical junction with mild hydronephrosis. Stones under 7 mm usually pass, so with controlled pain, no fever, and a normal creatinine he can be discharged with tamsulosin.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-J4", "pgroup": "RE-J", "pstack": "A"}, {"id": "13", "group": 13, "stem": "A 54-year-old man with moderate hypothermia has a core temperature of 30.4°C (86.7°F) and sinus bradycardia with Osborn J waves. Wet clothes have been removed and warm humidified oxygen is running. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Warm normal saline and warm-water immersion of the hands and feet"}, {"letter": "B", "text": "Warm normal saline and forced-air rewarming of the trunk"}, {"letter": "C", "text": "Warm lactated Ringer's and forced-air rewarming of the trunk"}, {"letter": "D", "text": "Warm normal saline and immediate cardiopulmonary bypass"}, {"letter": "E", "text": "Warm lactated Ringer's and warm-water immersion of the hands and feet"}], "answer": "B", "explanation": "Rewarm the core before the extremities: warming the limbs first returns cold blood to the heart (afterdrop), causing shock or arrhythmia. Normal saline is preferred because the cold liver metabolizes lactate poorly, and bypass is reserved for deterioration.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-B1", "pgroup": "EN-B", "pstack": "B"}, {"id": "14", "group": 14, "stem": "A 6-year-old boy is brought by his father 1 hour after falling from the monkey bars onto an outstretched arm with the elbow extended. He refuses to move the left arm. His pulse is 118/min and blood pressure is 102/64 mm Hg. The distal humerus is swollen and tender, and he cannot make an \"OK\" sign; the radial pulse is 2+, capillary refill is under 2 seconds, and the forearm is soft with no pain on passive finger extension. A lateral elbow radiograph is shown. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Nursemaid's elbow"}, {"letter": "B", "text": "Physeal (growth plate) fracture of the distal radius"}, {"letter": "C", "text": "Monteggia fracture-dislocation"}, {"letter": "D", "text": "Supracondylar fracture"}, {"letter": "E", "text": "Volkmann ischemic contracture"}], "answer": "D", "explanation": "A FOOSH in a school-age child with distal humeral swelling, an anterior interosseous nerve deficit (no \"OK\" sign), and a posteriorly displaced distal fragment on the lateral film is a supracondylar fracture. On the lateral view the anterior humeral line fails to bisect the capitellum and a posterior fat pad is present.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-G2", "pgroup": "OR-G", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGSAZIDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09  edematous and erythematous with dusky purple patches, ecchymosis, and crepitus; there is no discrete fluctuant collection. Bedside ultrasonography shows subcutaneous gas. Which of the following is the most appropriate next step in management?\n\nWBC: 24,500/mm³\nHemoglobin: 13.1 g/dL\nSodium: 131 mEq/L\nCreatinine: 1.6 mg/dL\nGlucose: 342 mg/dL\nLactate: 4.6 mmol/L", "options": [{"letter": "A", "text": "Bedside incision and drainage of the scrotum"}, {"letter": "B", "text": "Hernia repair without prior reduction"}, {"letter": "C", "text": "Ceftriaxone and doxycycline"}, {"letter": "D", "text": "Detorsion and bilateral orchiopexy"}, {"letter": "E", "text": "Surgical debridement and IV antibiotics"}], "answer": "E", "explanation": "Pain out of proportion, crepitus, dusky skin, and sepsis in a diabetic with a perianal source mean the surgeon is called immediately without waiting for CT. Antibiotics alone fail — he needs resuscitation, broad-spectrum coverage such as vancomycin plus meropenem, and emergent debridement.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-D1", "pgroup": "GU-D", "pstack": "A"}, {"id": "15A", "group": 15, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Strangulated inguinal hernia"}, {"letter": "B", "text": "Epididymitis"}, {"letter": "C", "text": "Fournier gangrene"}, {"letter": "D", "text": "Scrotal abscess"}, {"letter": "E", "text": "Testicular torsion"}], "answer": "C", "explanation": "Pain out of proportion, crepitus, dusky skin, and sepsis in a diabetic with a perianal source is Fournier gangrene, a polymicrobial necrotizing fasciitis (necrotizing soft-tissue infection) of the perineum, and crepitus comes from bacterial gas. A scrotal abscess is a localized fluctuant collection in a well-appearing patient, and a strangulated hernia presents as an irreducible groin bulge with obstruction.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-D1", "pgroup": "GU-D", "pstack": "A"}, {"id": "16", "group": 16, "stem": "A 72-year-old woman who takes apixaban for atrial fibrillation presents 1 hour after falling face-first onto a nightstand with severe eye pain and loss of vision in the injured eye. Her blood pressure is 146/86 mm Hg and pulse is 92/min. The injured eye is proptotic with a tense orbit and restricted extraocular movements; visual acuity is count-fingers at 3 feet, compared with 20/30 in the other eye. Intraocular pressure is 48 mm Hg in the injured eye and 16 mm Hg in the other. Examination of the eye is shown. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Ice and epistaxis control"}, {"letter": "B", "text": "Lateral canthotomy"}, {"letter": "C", "text": "Ice and avoidance of nose blowing"}, {"letter": "D", "text": "Serial neurologic examinations"}, {"letter": "E", "text": "Early endotracheal intubation"}], "answer": "B", "explanation": "Proptosis, a tense orbit, vision loss, and an intraocular pressure of 48 mm Hg after blunt trauma in an anticoagulated patient point to this patient's suspected diagnosis. Lateral canthotomy decompresses the orbit and is performed emergently in the ED, followed by emergent ophthalmology.", "objective": "", "section": "Trauma", "pcase": "TR-G2", "pgroup": "TR-G", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAOEAqMDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQ JIPtRRXRTOapscdMAbg8dzURGJARxRRXUea9yYqDC2e1aGjoott2OSaKKYjTUBMYHerKAcUUUIkevANSZwtFFDBELsQM013KpuGM0UUhmJfX87EqX49BWdExYkEk0UVXQpFjG3pUcvy8jqaKKEKRHIAV5qKNACDiiirRmy3Eoc4I4qXylViAOlFFSWipeyugAU4zWYxLSEE55oopx3JmTQcNgGrqMWXmiire4LY0bNRjNbNuPlFFFSKRdVQAv0p5PFFFMRG/NR9WI7UUUCDtSZ4NFFAhRTT1oooENFOTrRRQBoWoG0/hVwABRRRUsZJGOatIBjp2oopATADimS+nvRRTEVwxWTjtW5ph3DmiihCRsrEm0fKKaowePWiinEZetuK27PnH0ooqkLqaMQFOfvRRVEFWTqaaigk55ooqhl2CJB2q95aiEnHNFFAiWyiXKDHXrWhJwcdh0oopMaKrDLGiiimB//2Q=="}, {"id": "16A", "group": 16, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "LeFort fracture"}, {"letter": "B", "text": "Nasal fracture"}, {"letter": "C", "text": "Orbital blowout fracture"}, {"letter": "D", "text": "Retrobulbar hematoma"}, {"letter": "E", "text": "Basilar skull fracture"}], "answer": "D", "explanation": "Retrobulbar hematoma — blood compressing the orbit after blunt trauma in an anticoagulated patient — is vision-threatening because of rising orbital pressure. An orbital blowout fracture causes upgaze diplopia with normal acuity and no proptosis, and LeFort fractures present with midface mobility and airway compromise rather than vision loss.", "objective": "", "section": "Trauma", "pcase": "TR-G2", "pgroup": "TR-G", "pstack": "A"}, {"id": "17", "group": 17, "stem": "A 44-year-old woman is found on her kitchen floor by a neighbor an estimated 14 hours after she fell and could not get up following a night of heavy drinking. She has diffuse muscle aching and weakness, dark brown urine, and nausea. She drinks 6–8 beers daily and takes no medications. Her temperature is 37.3°C (99.1°F), blood pressure is 118/72 mm Hg, pulse is 112/min, respirations are 18/min, and SpO₂ is 98% on room air. The right thigh and hip girdle muscles are tender and swollen with soft compartments, and there is pressure erythema over the right hip. Which of the following tests would most directly confirm the suspected diagnosis?\n\nBUN: 28 mg/dL\nCreatinine: 2.2 mg/dL\nSodium: 139 mEq/L\nPotassium: 6.2 mEq/L\nChloride: 105 mEq/L\nBicarbonate: 20 mEq/L\nCalcium: 7.4 mg/dL\nAlbumin: 4.0 g/dL\nUrine dipstick: Large blood\nUrine microscopy: 0–2 RBC/hpf\nECG: Peaked T waves, QRS 96 ms", "options": [{"letter": "A", "text": "Fractional excretion of sodium"}, {"letter": "B", "text": "Repeat creatinine after volume restoration"}, {"letter": "C", "text": "Serum creatine kinase"}, {"letter": "D", "text": "Urine culture"}, {"letter": "E", "text": "Renal biopsy"}], "answer": "C", "explanation": "A heme-positive dipstick with no RBCs on microscopy means myoglobin, not hematuria, and after a long lie the serum CK confirms rhabdomyolysis — hers was 48,000 U/L. The CK should be trended: it rose to 61,000 U/L at 12 hours, so with AKI she is admitted rather than discharged.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-C2", "pgroup": "RE-C", "pstack": "A"}, {"id": "18", "group": 18, "stem": "A 28-year-old man presents 2 hours after going over the handlebars of his mountain bike and landing on the handlebar with his left upper abdomen. He has left upper abdominal pain and pain at the tip of his left shoulder. His blood pressure is 118/76 mm Hg, pulse is 104/min, and SpO₂ is 98% on room air. He has left upper quadrant tenderness without distension or rigidity, no periumbilical ecchymosis, and no seat belt sign. FAST shows a small amount of free fluid in the left upper quadrant view. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Angiography"}, {"letter": "B", "text": "Contrast CT of abdomen and pelvis"}, {"letter": "C", "text": "Anteroposterior pelvis radiograph"}, {"letter": "D", "text": "Retrograde urethrogram"}, {"letter": "E", "text": "Serial abdominal examinations"}], "answer": "B", "explanation": "Left upper quadrant pain with Kehr sign after a handlebar blow suggests splenic injury, the most common solid organ injured in blunt trauma. A stable patient with a positive FAST goes to CT with IV contrast to define the extent; a low-grade laceration is managed nonoperatively with admission, serial exams, and serial hemoglobin, whereas an unstable patient stays in the ED and goes to laparotomy.", "objective": "", "section": "Trauma", "pcase": "TR-K1", "pgroup": "TR-K", "pstack": "A"}, {"id": "19", "group": 19, "stem": "A 47-year-old man with hymenoptera anaphylaxis after a yellow-jacket sting has been treated with IM epinephrine, IV fluids, IV diphenhydramine and famotidine, and IV methylprednisolone. Which of the following is the most appropriate disposition?", "options": [{"letter": "A", "text": "Discharge now without further medication"}, {"letter": "B", "text": "Discharge now with an EpiPen"}, {"letter": "C", "text": "Observe for a biphasic reaction, then discharge with oral antihistamines"}, {"letter": "D", "text": "Discharge now with oral antihistamines"}, {"letter": "E", "text": "Observe for a biphasic reaction, then discharge with an EpiPen"}], "answer": "E", "explanation": "After anaphylaxis the patient is observed for a biphasic or protracted reaction and discharged with an epinephrine auto-injector. A used EpiPen is a single pre-measured dose and residual drug must never be accessed, and antihistamines do not replace epinephrine.", "objective": "", "section": "Bites", "pcase": "BI-A2", "pgroup": "BI-A", "pstack": "B"}, {"id": "20", "group": 20, "stem": "A 58-year-old woman with small cell lung cancer diagnosed 1 month ago presents with 3 days of nausea, vomiting, and headache followed by increasing confusion, and she has a generalized seizure in triage. She is a 40-pack-year smoker, takes no diuretics, and has no heart, liver, or kidney disease. Her temperature is 36.9°C (98.4°F), blood pressure is 132/80 mm Hg, pulse is 96/min, respirations are 18/min, and SpO₂ is 95% on room air. She is postictal and euvolemic, with moist mucous membranes and no edema, JVD, or orthostasis, and the ECG shows sinus rhythm without changes. Which of the following laboratory results would most likely be present?", "options": [{"letter": "A", "text": "Sodium 114 mEq/L, serum osmolality 240 mOsm/kg"}, {"letter": "B", "text": "Normal glucose and sodium"}, {"letter": "C", "text": "Corrected calcium below 8.9 mg/dL"}, {"letter": "D", "text": "Sodium 162 mEq/L, serum osmolality 344 mOsm/kg"}, {"letter": "E", "text": "Sodium rise of 21 mEq/L in 24 hours"}], "answer": "A", "explanation": "Small cell lung cancer is a setting for SIADH, which produces euvolemic hypotonic hyponatremia; her sodium was 114 mEq/L with a serum osmolality of 240 and a normal glucose, so no glucose correction was needed. Nausea, vomiting, headache, and seizure with a normal ECG fit a low sodium rather than a calcium or potassium disorder.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-G2", "pgroup": "RE-G", "pstack": "A"}, {"id": "20A", "group": 20, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Osmotic demyelination syndrome"}, {"letter": "B", "text": "Hypernatremia"}, {"letter": "C", "text": "Hypocalcemia"}, {"letter": "D", "text": "Hyponatremia"}, {"letter": "E", "text": "Dialysis disequilibrium syndrome"}], "answer": "D", "explanation": "A sodium below 135 mEq/L with a low serum osmolality and normal glucose is true hypotonic hyponatremia. Osmotic demyelination is a complication days after an over-rapid correction, not a presenting diagnosis.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-G2", "pgroup": "RE-G", "pstack": "A"}, {"id": "20B", "group": 20, "stem": "Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Isotonic fluid, then free water"}, {"letter": "B", "text": "3% hypertonic saline bolus"}, {"letter": "C", "text": "IV calcium gluconate"}, {"letter": "D", "text": "IV mannitol"}, {"letter": "E", "text": "Supportive care alone"}], "answer": "B", "explanation": "A seizing patient with severe hyponatremia receives a 3% hypertonic saline bolus to raise the sodium by 4–6 mEq/L, then correction is paused and slowed. Over-rapid correction causes osmotic demyelination syndrome.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-G2", "pgroup": "RE-G", "pstack": "A"}, {"id": "21", "group": 21, "stem": "A 35-year-old woman is brought to the emergency department by EMS from a dive boat. She made a rapid breath-hold ascent from 60 feet after her regulator malfunctioned and lost consciousness about 1 minute after surfacing; on waking she had left-sided weakness, blurred vision, and chest pain. Blood pressure is 146/88 mm Hg, pulse is 104/min, and SpO₂ is 95% on room air. GCS is 14, with a left facial droop and 3/5 strength in the left arm and leg; breath sounds are equal without crepitus. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "100% oxygen and immediate recompression"}, {"letter": "B", "text": "Head CT, then recompression if negative"}, {"letter": "C", "text": "Lowest tolerated oxygen fraction"}, {"letter": "D", "text": "100% oxygen and tube thoracostomy"}, {"letter": "E", "text": "Intubation with positive-pressure ventilation"}], "answer": "A", "explanation": "Sudden loss of consciousness with focal deficits within minutes of a breath-hold ascent is a clinical diagnosis, and recompression with hyperbaric oxygen is immediate and must not be delayed for imaging or a stroke workup. Equal breath sounds without crepitus argue against a pneumothorax needing a chest tube.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-O2", "pgroup": "EN-O", "pstack": "A"}, {"id": "21A", "group": 21, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Oxygen toxicity"}, {"letter": "B", "text": "Pulmonary barotrauma (burst lung)"}, {"letter": "C", "text": "Decompression sickness type 2"}, {"letter": "D", "text": "Arterial gas embolism"}, {"letter": "E", "text": "Nonfatal drowning"}], "answer": "D", "explanation": "Arterial gas embolism is a clinical diagnosis: gas bubbles from lung overexpansion embolize to the cerebral, coronary, and retinal arteries, producing focal deficits, chest pain, and visual symptoms immediately after surfacing. Decompression sickness begins minutes to hours later without a breath-hold ascent, and burst lung shows a pneumothorax.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-O2", "pgroup": "EN-O", "pstack": "A"}, {"id": "22", "group": 22, "stem": "A 39-year-old woman with obesity has severe right knee pain after stepping off a curb; the knee was deformed but \"popped back\" before arrival. Her pulse is 104/min and blood pressure is 136/84 mm Hg. The knee has an effusion and gross multidirectional instability; the dorsalis pedis pulse is palpable but weaker than on the left, and she has decreased dorsal foot sensation with weak dorsiflexion. The foot is warm. A knee radiograph shows the tibiofemoral joint reduced with no fracture. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "CT of the knee"}, {"letter": "B", "text": "Outpatient MRI of the knee"}, {"letter": "C", "text": "Ankle-brachial index"}, {"letter": "D", "text": "Ultrasound of the extensor tendons"}, {"letter": "E", "text": "Compartment pressure measurement"}], "answer": "C", "explanation": "A spontaneously reduced knee with multiligament laxity and a peroneal nerve deficit is treated as a knee dislocation, and a palpable pulse does not clear the popliteal artery because pulse loss is late with a partial tear. An ankle-brachial index is required, and an ABI below 0.9 leads to CT angiography.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-T4", "pgroup": "OR-T", "pstack": "A"}, {"id": "23", "group": 23, "stem": "A 28-year-old man presents 2 hours after a snake with a triangular head and a rattle bit his left ankle while he was hiking in central Texas. His friends applied a belt tourniquet above the knee. He has severe pain and swelling climbing up the leg, nausea, and a metallic taste. His blood pressure is 102/64 mm Hg and pulse is 114/min. There are two fang marks over the lateral ankle with tense edema to the knee that has advanced 6 cm in the past hour; calf compartments are soft, distal pulses are intact, and he has no ptosis, dysarthria, or drooling. Poison Control is contacted. Which of the following is the most appropriate next step in management?\n\nPlatelets: 54,000/mm³\nPT / INR: 24 s / 2.2\naPTT: 52 s\nFibrinogen: 88 mg/dL\nHemoglobin / Hematocrit: 14.4 g/dL / 43%\nWBC: 10,200/mm³", "options": [{"letter": "A", "text": "Coral snake antivenom and pressure-immobilization"}, {"letter": "B", "text": "Observation for 8 to 12 hours with wound care"}, {"letter": "C", "text": "Analgesia and supportive care alone"}, {"letter": "D", "text": "Crotaline antivenom with the tourniquet kept on"}, {"letter": "E", "text": "Crotaline antivenom and limb elevation"}], "answer": "E", "explanation": "Progressive edema with thrombocytopenia and coagulopathy after a rattlesnake bite is hemotoxic pit viper envenomation, treated with crotaline antivenom (4 to 6 vials, then maintenance) and elevation with compartment checks. The tourniquet must be removed because it worsens tissue ischemia without reliably stopping systemic absorption; observation alone is only for a dry bite with no reaction at 8 to 12 hours.", "objective": "", "section": "Bites", "pcase": "BI-E1", "pgroup": "BI-E", "pstack": "A"}, {"id": "24", "group": 24, "stem": "A 41-year-old man has severe hip pain and cannot move his leg 1 hour after a motor vehicle collision in which his knee struck the dashboard. His pulse is 112/min and blood pressure is 138/84 mm Hg. The leg is flexed, adducted, internally rotated, and shortened, as shown; there is no pain with pelvic compression, and distal pulses and sciatic nerve function are intact. Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hip dislocation"}, {"letter": "B", "text": "Femoral shaft fracture"}, {"letter": "C", "text": "Pelvic fracture"}, {"letter": "D", "text": "Hip fracture"}, {"letter": "E", "text": "Knee dislocation"}], "answer": "A", "explanation": "A dashboard injury producing a flexed, adducted, internally rotated, shortened leg is a posterior hip dislocation; a pelvis x-ray shows the femoral head out of the acetabulum. A hip fracture instead leaves the leg shortened and externally rotated, usually after a low-energy fall in an older patient.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-S3", "pgroup": "OR-S", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEgAb0DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwCuvSjOOabE/FN87BZfWuc3WxxPjy8zNBbf3RurjJHy2K2/Gl2suuSlWDBBtyDXPxgyv0NdVNHJVZcgGSBVoJxTII9uDU5TfxXXFWOVgi4qVBk0wDAxTlpuXQpEcq4aopPu1YcbsVE6VJSRb8N3r2Gs20q/dZtjfQ16WyfPkdB0rx+WQwnK/eHzD616joWof2lpFvOSN+0BvrXJWWtztoS0sXjVXVLSS7snjj+8w4q6aVdxGBXJc6k7HIyeHroFTcSbB/u5rS0XR7dNQi3bZOe69a2LmPfEyNyRyKqaU27UYV65NFxSqN text": "Serum troponin"}], "answer": "C", "explanation": "Hypotension with muffled heart sounds after a penetrating wound in \"the box\" makes the bedside FAST pericardial view the immediate test. Equal breath sounds make a chest tube the wrong move, and an unstable patient should not leave for CT.", "objective": "", "section": "Trauma", "pcase": "TR-J1", "pgroup": "TR-J", "pstack": "A"}, {"id": "25A", "group": 25, "stem": "Which of the following findings would most likely be present?", "options": [{"letter": "A", "text": "Widened mediastinum"}, {"letter": "B", "text": "New right bundle branch block"}, {"letter": "C", "text": "Pleural fluid"}, {"letter": "D", "text": "Pericardial fluid"}, {"letter": "E", "text": "Absent lung sliding"}], "answer": "D", "explanation": "Hypotension with muffled heart sounds after a penetrating wound in \"the box\" is tamponade until proven otherwise, and pericardial fluid on FAST confirms it; JVD may be absent in a hypovolemic patient. Pericardiocentesis only buys time — she needs the OR for a pericardial window and repair.", "objective": "", "section": "Trauma", "pcase": "TR-J1", "pgroup": "TR-J", "pstack": "A"}, {"id": "26", "group": 26, "stem": "A 23-year-old man is brought in 15 minutes after being stabbed in the left chest. His blood pressure is 118/76 mm Hg, pulse is 118/min, respirations are 30/min, and SpO₂ is 90% on room air. A 3-cm open wound on the left anterolateral chest moves air audibly and bubbles on inspiration, and breath sounds are decreased on the left. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Occlusive dressing taped on three sides, then chest tube through the wound"}, {"letter": "B", "text": "Occlusive dressing taped on three sides, then chest tube at a separate site"}, {"letter": "C", "text": "Occlusive dressing taped on all four sides, then chest tube at a separate site"}, {"letter": "D", "text": "Occlusive dressing taped on all four sides, then chest tube through the wound"}, {"letter": "E", "text": "Occlusive dressing taped on all four sides, then surgical wound closure"}], "answer": "B", "explanation": "An open chest wound moving air over an ipsilateral pneumothorax is a sucking chest wound. The three-sided dressing works as a valve, letting air out but not back in; sealing all four sides can create a tension pneumothorax, and the chest tube goes at a separate site rather than through the wound.", "objective": "", "section": "Trauma", "pcase": "TR-C3", "pgroup": "TR-C", "pstack": "A"}, {"id": "27", "group": 27, "stem": "A 24-year-old man with sickle cell disease has had a painful erection for 6 hours that began during sleep and persisted after ejaculation. He had no injury. The corpora cavernosa are rigid and tender, the glans is soft, and there is no perineal bruising. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Glans compression, then manual reduction"}, {"letter": "B", "text": "Surgical debridement and IV antibiotics"}, {"letter": "C", "text": "Surgical repair of the tunica albuginea"}, {"letter": "D", "text": "Observation with urology follow-up"}, {"letter": "E", "text": "Corporal aspiration and irrigation"}], "answer": "E", "explanation": "A painful rigid erection lasting more than 4 hours is a clinical diagnosis, and treatment starts without delay for testing because damage begins at 4–6 hours. After a dorsal penile block, blood is aspirated from the corpus cavernosum and irrigated with cold saline; intracavernosal phenylephrine follows if needed, with monitoring for reflex bradycardia.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-F1", "pgroup": "GU-F", "pstack": "A"}, {"id": "27A", "group": 27, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Fournier gangrene"}, {"letter": "B", "text": "Low-flow (ischemic) priapism"}, {"letter": "C", "text": "Penile fracture"}, {"letter": "D", "text": "Paraphimosis"}, {"letter": "E", "text": "High-flow (non-ischemic) priapism"}], "answer": "B", "explanation": "Sickle cell disease with a painful, fully rigid erection and no trauma is ischemic priapism, which leads to impotence in about a third of sustained cases. High-flow priapism is painless and partially rigid after perineal trauma and is observed, never aspirated.", "objective": "", "section": "Male GU Emergencies", "pcase": "GU-F1", "pgroup": "GU-F", "pstack": "A"}, {"id": "28", "group": 28, "stem": "A 34-year-old woman with recently diagnosed advanced kidney failure develops headache, nausea, and vomiting, then confusion and a generalized seizure, near the end of her first-ever hemodialysis session through a new temporary catheter. Her pre-dialysis BUN was 168 mg/dL; she has no diabetes or seizure history. Her temperature is 36.9°C (98.4°F), blood pressure is 178/96 mm Hg, pulse is 96/min, respirations are 18/min, and SpO₂ is 96% on room air. She is postictal and confused with no focal deficits or neck stiffness. Point-of-care glucose and electrolytes are obtained. Which of the following is the most appropriate next step in management?\n\nGlucose: 104 mg/dL\nSodium: 136 mEq/L\nPotassium: 4.1 mEq/L\nCalcium: 8.9 mg/dL", "options": [{"letter": "A", "text": "3% hypertonic saline"}, {"letter": "B", "text": "IV dextrose"}, {"letter": "C", "text": "Venous line clamping and 100% oxygen"}, {"letter": "D", "text": "IV calcium gluconate"}, {"letter": "E", "text": "IV mannitol"}], "answer": "E", "explanation": "Normal glucose and electrolytes exclude the metabolic mimics, and neurologic symptoms at the end of a first session with a very high BUN point to this patient's suspected diagnosis. Mannitol raises serum osmolality to reverse it; hypertonic saline treats hyponatremia, which her sodium of 136 excludes.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-E3", "pgroup": "RE-E", "pstack": "A"}, {"id": "28A", "group": 28, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Hypoglycemia"}, {"letter": "B", "text": "Hyperkalemia"}, {"letter": "C", "text": "Dialysis disequilibrium syndrome"}, {"letter": "D", "text": "Hyponatremia"}, {"letter": "E", "text": "Air embolism during hemodialysis"}], "answer": "C", "explanation": "Dialysis disequilibrium syndrome is the mirror image of osmotic demyelination: water moves into brain cells after rapid urea removal. Risk is highest with a first session, a long gap, or a very high BUN, and short, low-efficiency sessions for the first few days prevent it.", "objective": "", "section": "Renal Emergencies", "pcase": "RE-E3", "pgroup": "RE-E", "pstack": "A"}, {"id": "29", "group": 29, "stem": "A 71-year-old woman presents to the emergency department with 2 days of a hot, swollen right knee and fever. She received a corticosteroid injection into that knee for osteoarthritis 9 days ago and now refuses to bend it. She has no history of gout and no recent sexual contacts. Her temperature is 38.7°C (101.7°F), blood pressure is 124/74 mm Hg, pulse is 106/min, respirations are 18/min, and SpO₂ is 97% on room air. The right knee has a warm effusion with erythema and severe pain on minimal passive range of motion; there is no rash or tenosynovitis, and the first MTP joints are normal. Arthrocentesis is performed. Which of the following is the most appropriate next step in management?\n\nSynovial fluid appearance: Purulent\nSynovial WBC: 92,000/mm³ (91% neutrophils)\nGram stain: Gram-positive cocci\nCrystals: None\nSerum WBC: 14,200/mm³\nHemoglobin / Hematocrit: 12.6 g/dL / 38%\nBlood cultures: Pending", "options": [{"letter": "A", "text": "NSAIDs and treatment of the inciting infection"}, {"letter": "B", "text": "Empiric IV nafcillin with ortho/podiatry consult"}, {"letter": "C", "text": "Indomethacin, colchicine, or corticosteroids"}, {"letter": "D", "text": "IV vancomycin plus a cephalosporin with ortho washout"}, {"letter": "E", "text": "Oral clindamycin or dicloxacillin with outpatient follow-up"}], "answer": "D", "explanation": "Purulent synovial fluid with more than 90,000 WBC and gram-positive cocci after a recent joint injection needs IV vancomycin plus a cephalosporin, emergent orthopedic washout, and admission. Anti-inflammatory therapy alone would treat gout or reactive arthritis and leave the infection undrained.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-B1", "pgroup": "OR-B", "pstack": "A"}, {"id": "29A", "group": 29, "stem": "Which of the following is the most likely diagnosis?", "options": [{"letter": "A", "text": "Septic arthritis"}, {"letter": "B", "text": "Reactive arthritis"}, {"letter": "C", "text": "Gout (acute flare)"}, {"letter": "D", "text": "Osteomyelitis"}, {"letter": "E", "text": "Infected olecranon bursitis"}], "answer": "A", "explanation": "A single hot joint with pain on minimal passive motion, fever, purulent fluid with more than 90,000 WBC, and organisms on Gram stain is non-gonococcal septic arthritis; synovial culture later grows Staphylococcus aureus. Reactive arthritis produces sterile fluid, gout produces crystals, and osteomyelitis spares the joint.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-B1", "pgroup": "OR-B", "pstack": "A"}, {"id": "30", "group": 30, "stem": "A 21-year-old college tennis player has right lateral midfoot pain after cutting sharply during a match. There is tenderness at the base of the fifth metatarsal, with no malleolar, navicular, or medial midfoot tenderness and no plantar ecchymosis. A foot radiograph is shown. Which of the following is the most appropriate management?", "options": [{"letter": "A", "text": "Posterior splint, then ORIF of the midfoot"}, {"letter": "B", "text": "Posterior splint and non-weight-bearing"}, {"letter": "C", "text": "IV antibiotics and orthopedic washout"}, {"letter": "D", "text": "Indomethacin and discharge"}, {"letter": "E", "text": "Hard-soled shoe and weight-bearing as tolerated"}], "answer": "B", "explanation": "This patient's fracture sits in a watershed zone with slow healing and nonunion risk. It is treated with a posterior splint, strict non-weight-bearing, and ortho follow-up; a hard-soled shoe with weight-bearing is the trap here.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-W3", "pgroup": "OR-W", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFtAWADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDsdWmF/DIpKghgoJJH8q8w1u2EcrqAchxjkmuznvjb3rxn+8CN3Q1g+IIg7rLEQxb5Rg96AOQaJS+QCR9TTERkLcgg+lWrmPbyBgDpVckgZXAI7GgNizaSssiqxBHrjirN/ZLcJwSMjAOT1rNjDx5AKsOgrWsZxcRGLup/dk0Ac+Qykgjkc8UxkMnQr+JrS1K1KlZEC+4zWc5KjcvGOQTQBCTwR1z3XtWrZSfabZkc7XHTIx/KsrjO4EEDpuNS2k5t5VYEPkZO6kBZnQo2CcZ/SqsuRjI259a1bmMZ3qNyOcEt3qhPHtYqME9s0xFYUh3YyCCaUDnAKn6Uc498UgLdrcFGyBkHpmk1K2CHzIgSp4OSTUMbDkZx6ZrTt3We38tvvA5pjMXqcDnNQvGQu4ZxVq5t/s8rqT8pGBURALeozQBB24oKg+v1oB4HPagketIQzHtTJUyvy8HOfmNTEAk+lMOM5xxQBWzzigqG6Zp8qmNskcAUxhtYq3BX1oDYTFRSRk4K4z75qfI9/wBaYQRwP1oBFdQW4GetA55p8qgHevSmKCcYoE0FFA5ooEFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFAHtfiVmS6LAjKtkZFVo7kXkG1gTzgbfWrnihSbiUjsQK5uyna3uRGSdpbdTLEu7YrIwIUDis+SPByRtaulvLdriJZUALEZOTWLPCYwdq5A6ZoAzx serial neurovascular checks and she is admitted with emergent vascular and ortho consultation. Outpatient ligament care would miss a limb-threatening arterial injury.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-T4", "pgroup": "OR-T", "pstack": "B"}, {"id": "32", "group": 32, "stem": "A 22-year-old woman is brought to the trauma bay with chest and back pain after being ejected from a car at highway speed onto pavement. Her blood pressure is 92/60 mm Hg in the right arm and 74/48 mm Hg in the left, pulse is 124/min, respirations are 22/min, and SpO₂ is 96% on room air. Upper-extremity pulses are weaker on the left, breath sounds are equal, and heart sounds are normal. A supine chest radiograph shows a 9.5-cm mediastinum, rightward deviation of the trachea and nasogastric tube, a depressed left main-stem bronchus, an indistinct aortic knob, and left apical capping. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "12-lead ECG"}, {"letter": "B", "text": "Bedside FAST, pericardial view"}, {"letter": "C", "text": "Echocardiography"}, {"letter": "D", "text": "CT angiography of the chest"}, {"letter": "E", "text": "Tube thoracostomy"}], "answer": "D", "explanation": "Sudden deceleration, unequal arm pressures, and a mediastinum over 8 cm on a supine film point to this patient's suspected injury, and CTA of the chest is the gold standard. The mechanism alone should prompt CTA even when the radiograph is subtle.", "objective": "", "section": "Trauma", "pcase": "TR-J3", "pgroup": "TR-J", "pstack": "A"}, {"id": "32A", "group": 32, "stem": "Which of the following findings would most likely be present?", "options": [{"letter": "A", "text": "Aortic tear with pseudoaneurysm"}, {"letter": "B", "text": "Absent lung sliding"}, {"letter": "C", "text": "Pleural fluid"}, {"letter": "D", "text": "Pericardial fluid"}, {"letter": "E", "text": "Right ventricular wall motion abnormality"}], "answer": "A", "explanation": "Sudden deceleration, unequal arm pressures, and a widened mediastinum point to aortic injury, and CTA shows the aortic tear with pseudoaneurysm. Many patients die at the scene, and survivors need blood through two large-bore IVs and immediate OR with vascular or cardiothoracic surgery, with transfer to a trauma center if needed.", "objective": "", "section": "Trauma", "pcase": "TR-J3", "pgroup": "TR-J", "pstack": "A"}, {"id": "33", "group": 33, "stem": "A 36-year-old, 70-kg woman arrives 1 hour after a stovetop grease fire with a 27% BSA partial-thickness burn of the right arm and anterior trunk and no signs of inhalation injury. Which of the following is the most appropriate fluid resuscitation?", "options": [{"letter": "A", "text": "Oral fluids, with IV fluids only if she cannot drink"}, {"letter": "B", "text": "Lactated Ringer's by the Parkland formula, timed from the burn"}, {"letter": "C", "text": "Lactated Ringer's by the Parkland formula, plus prophylactic antibiotics"}, {"letter": "D", "text": "Lactated Ringer's by the Parkland formula, timed from ED arrival"}, {"letter": "E", "text": "Lactated Ringer's by the Parkland formula, plus colloid from the start"}], "answer": "B", "explanation": "A burn over 20% BSA in an adult requires IV lactated Ringer's by the Parkland formula, and the first-half clock starts at the time of the burn, not ED arrival. Prophylactic antibiotics are not given, oral repletion suffices only for smaller burns, and colloid is considered only for burns over 40%.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-D1", "pgroup": "EN-D", "pstack": "B"}, {"id": "33A", "group": 33, "stem": "Which of the following is the most appropriate disposition?", "options": [{"letter": "A", "text": "Admission to the ICU at this hospital"}, {"letter": "B", "text": "Admission to the general surgery floor"}, {"letter": "C", "text": "Transfer to a burn center"}, {"letter": "D", "text": "Observation in the emergency department"}, {"letter": "E", "text": "Discharge with burn clinic follow-up"}], "answer": "C", "explanation": "A partial-thickness burn over 20% BSA in a patient aged 10–50 meets burn-center criteria. Continuous care there includes frequent compartment checks, moist saline dressings with blisters left intact, and stress-ulcer prophylaxis.", "objective": "", "section": "Environmental, Disaster, Bioterrorism Emergencies", "pcase": "EN-D1", "pgroup": "EN-D", "pstack": "B"}, {"id": "34", "group": 34, "stem": "A 23-year-old man returns to the emergency department 8 hours after being discharged in a long leg posterior splint with a snug elastic wrap for a closed right tibial shaft fracture from a soccer tackle. He has severe, worsening leg pain not relieved by oxycodone and tingling in the foot. His temperature is 37.0°C (98.6°F), blood pressure is 128/78 mm Hg, pulse is 112/min, respirations are 18/min, and SpO₂ is 99% on room air. His pain is out of proportion to the injury, with paresthesia over the dorsum of the foot; the dorsalis pedis pulse is 2+ and capillary refill is under 2 seconds. The radiograph from his first visit is shown. Which of the following is the most appropriate next step in management?", "options": [{"letter": "A", "text": "Keep the splint, elevate the leg above the heart, and apply ice"}, {"letter": "B", "text": "Immediate reduction and emergent consult"}, {"letter": "C", "text": "Reduction, splint, and serial neurovascular checks"}, {"letter": "D", "text": "Remove the splint and keep the leg level with the heart"}, {"letter": "E", "text": "IV cefazolin and Tdap, then OR washout"}], "answer": "D", "explanation": "Pain out of proportion with paresthesia in a splinted tibial fracture means calling ortho now, removing all constricting splint and dressings, and keeping the limb level with the heart. Elevating above the heart or icing lowers perfusion pressure and worsens ischemia, and a palpable pulse is expected because pulselessness is a late sign.", "objective": "", "section": "Orthopedic Emergencies", "pcase": "OR-A3", "pgroup": "OR-A", "pstack": "A", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFUAOgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD5+BPqfzo3H1NJmkrI2JlY46mmsT6mhemaaTTAeM+ppQSO5/OkX2pwFS2UKCfU0c+p/OlAoINK4WOu8s/2DbYz0JqlYxn7RHknrWtIm3QLU4/gzVSwTNwhxXMnoWc5qJIvZhn+Kl00Fr+EZP3qNSH+nTf7xqfSdr6pbhEKjgEZ6mtm/dEtzvpo8WqZPHFczqq4kPJrspoQLVCR2rktTTMuDXPAqTMdwWbqa0tNh3FeT6nmqTJljit3R4Pm4A4GKuT0JQt+dkXtj1ribknz3O49fWu41pfLjNcNMVMjFc4zWlEUmMyfU0hJ7E0oFByK2uSMLH1NISfU/nTjTDTELk9mJpysQOp/Oo88YxTgaYiXcemTTXb3P50maa5OKQBk+ppd7HufzqOlzikA/J9T+dFNzRQA3NIfaikzQMevSjqaAcigdaAHrxUqgEZpo6CpUHHFQygAoK8VIEz0pSvOMd6m4Hd3MZXQrUYH3M1Q05B9oUHng1uXUONDszt6x4rL06H/AElT7GudbFvc5DU1H2+b/eNT+HkLavbjHem6sm3UJh/tVa8Lxh9btx1GTW0n7pK3PS54gLTH+zXG6jHmUjHSu+uoiLTOOgritRT989YQLkYWzDnArpdEt8pu9axYYfNkFdXpUASIEDGBVyZKMTxH8kTk+lcF3JFd54pO2CQn0rhBWtPYlgBSN0xinrQ64HrV3EQtUbdKkaoyatCG08MKZz1pQfWqESA0xzSrz34prYDHByKQADilGKaM0tIBc0UUUAMzRRQTQMUU4deaaKUfpQBYQAirEY46VFGM8e1WYUyDWTKFCjgg07bk++akWP2pyx5I+oqbjPTbiD/iR2WenljNZFjEFvNo5+U10V3FjQrHnOFFZFum2/zj+E1hHYt7nA62u3VLgf7VXfB0e/X4B9ai8QJjVp+OpzV/wJHv8RQ8dAa2n8JK3PUr2Mi1I7YrhtST5nPrXoeoxgW3cVwt7Huds8AGsYAzJsoB5oGOD6V1FhEVtyTxx
