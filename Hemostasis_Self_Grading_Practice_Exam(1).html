<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hemostasis Self-Grading Practice Exam</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --ink:#172033; --muted:#62708a; --line:#dbe3ef;
  --accent:#2457d6; --accent2:#173b93; --good:#dff7e7; --goodb:#1c8c4a;
  --bad:#fde5e5; --badb:#c63b3b; --warn:#fff5d6;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eef3fb 0,#f8fafc 100%);color:var(--ink);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.app{max-width:1180px;margin:0 auto;padding:18px;min-height:100vh}
header{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:clamp(20px,3vw,30px);margin:0}
.sub{color:var(--muted);font-size:13px}
.progress-wrap{min-width:240px}
.progress{height:10px;background:#dfe6f0;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:.25s}
.topstats{font-size:12px;color:var(--muted);margin-top:5px;text-align:right}
.page{display:none}
.page.active{display:block}
.question-grid{display:grid;grid-template-columns:1fr;gap:12px}
.question-grid.cluster{grid-template-columns:repeat(2,minmax(0,1fr))}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 8px 28px rgba(29,52,92,.07)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.qnum{font-weight:800;font-size:16px}
.badge{font-size:11px;background:#eef3ff;color:var(--accent2);padding:4px 8px;border-radius:999px}
.stem{font-size:14px;line-height:1.42;margin-bottom:10px}
.choices{display:grid;gap:7px}
.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:9px 10px;
cursor:pointer;background:#fff;transition:.15s;font-size:13px;line-height:1.35}
.choice:hover{border-color:#9fb4ea;background:#f8faff}
.choice input{margin-top:2px}
.choice.correct{background:var(--good);border-color:var(--goodb)}
.choice.incorrect{background:var(--bad);border-color:var(--badb)}
.feedback{display:none;margin-top:9px;padding:9px 10px;border-radius:10px;font-size:12px;line-height:1.4}
.feedback.show{display:block}
.feedback.good{background:var(--good);border-left:4px solid var(--goodb)}
.feedback.bad{background:var(--bad);border-left:4px solid var(--badb)}
.obj{margin-top:5px;color:#34445e}
.controls{position:sticky;bottom:0;margin-top:14px;background:rgba(244,247,251,.93);backdrop-filter:blur(10px);
border:1px solid var(--line);border-radius:15px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:13px}
.primary{background:var(--accent);color:white}
.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
.danger{background:#b83232;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.results{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.results.show{display:block}
.scorebig{font-size:38px;font-weight:900}
.topic-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.topic-table th,.topic-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.missed-banner{background:var(--warn);border:1px solid #ead57d;padding:10px;border-radius:10px;margin-bottom:12px}
@media(max-width:760px){
 .app{padding:10px}
 header{align-items:flex-start;flex-direction:column}
 .progress-wrap{width:100%;min-width:0}
 .question-grid.cluster{grid-template-columns:1fr}
 .qcard{padding:12px}
 .stem{font-size:13px}
 .choice{font-size:12px;padding:8px}
 .controls{justify-content:stretch}
 .controls button{flex:1}
}
@media(min-width:900px){
 .question-grid.cluster .qcard{padding:12px}
 .question-grid.cluster .stem{font-size:12.5px;line-height:1.34}
 .question-grid.cluster .choice{font-size:11.5px;padding:7px 8px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>Hemostasis Practice Exam</h1>
    <div class="sub">40 single-best-answer items • Immediate feedback • Section analytics</div>
  </div>
  <div class="progress-wrap">
    <div class="progress"><div id="bar"></div></div>
    <div class="topstats" id="topstats">Page 1 of 32</div>
  </div>
</header>

<div id="missedBanner" class="missed-banner" style="display:none"></div>
<main id="exam"></main>

<div class="controls">
  <button class="secondary" id="prevBtn">Previous</button>
  <button class="secondary" id="gradeCurrentBtn">Submit (Grade from current place)</button>
  <button class="secondary" id="reviewMissedBtn" style="display:none">Review Missed Questions</button>
  <button class="primary" id="nextBtn">Next</button>
  <button class="danger" id="finalBtn" style="display:none">Submit Exam</button>
</div>

<section class="results" id="results"></section>
</div>
<script>
const DATA = {"questions": [{"id": "1", "stem": "A 76-year-old man reports recurrent dark-purple bruises on the backs of his hands and sun-exposed forearms after minor bumps. He denies epistaxis, gingival bleeding, hematuria, or prolonged bleeding from cuts. He previously underwent an appendectomy and cataract surgery without excessive bleeding. Platelet count, PT/INR, and aPTT are within reference ranges. Which explanation is most likely?", "choices": {"A": "Age- and photodamage-related senile purpura", "B": "Hemophilia A", "C": "Acquired factor VIII inhibitor", "D": "Mild von Willebrand disease", "E": "Immune thrombocytopenia"}, "correct": "", "rationale": "Senile purpura causes recurrent ecchymoses on sun-exposed skin because aging and photodamage make superficial vessels fragile. A negative bleeding history and normal platelet count, PT, and aPTT argue against a clinically important hemostatic disorder.", "section": "Abnormal Bleeding: Diagnostic Work-up | Learning Objective(s) 2, 3, 4", "topic": "Abnormal Bleeding: Diagnostic Work-up"}, {"id": "2", "stem": "A 67-year-old man takes warfarin for atrial fibrillation. He reports taking the medication as prescribed and has no bleeding symptoms. His INR is 1.5. Which interpretation is most appropriate?", "choices": {"A": "His anticoagulation is excessive and creates a high bleeding risk", "B": "The INR is normal for a patient receiving warfarin", "C": "His anticoagulation is below the usual therapeutic target of INR 2-3", "D": "The value cannot be compared with results from another laboratory", "E": "The result indicates an isolated intrinsic-pathway defect"}, "correct": "", "rationale": "For most thromboembolic indications, the lecture identifies a target INR of 2-3. An INR of 1.5 is subtherapeutic rather than excessive.", "section": "PT/INR and Warfarin Monitoring | Learning Objective(s) 4, 6", "topic": "PT/INR and Warfarin Monitoring"}, {"id": "3", "stem": "Which statement best describes the normal roles of von Willebrand factor?", "choices": {"A": "It is the hepatic enzyme that synthesizes vitamin K-dependent factors", "B": "It converts fibrinogen directly into fibrin", "C": "It bridges platelets to injured subendothelium and carries factor VIII in plasma", "D": "It inhibits factor X and thrombin after binding heparin", "E": "It activates plasminogen to initiate fibrinolysis"}, "correct": "", "rationale": "Von Willebrand factor supports primary hemostasis by promoting platelet adhesion and aggregation at injured vessels. It also stabilizes and carries factor VIII, linking primary and secondary hemostasis.", "section": "Primary Hemostasis | Learning Objective(s) 1", "topic": "Primary Hemostasis"}, {"id": "4", "stem": "An 8-year-old boy has recurrent painful knee swelling after minor trauma and delayed rebleeding after procedures. His platelet count and PT are normal, while his aPTT is prolonged. The aPTT corrects after a 1:1 mixing study, and a von Willebrand panel is normal. Which test is the most appropriate next step?", "choices": {"A": "A platelet function analyzer assay", "B": "Factor VIII and factor IX activity assays", "C": "An antiphospholipid antibody panel", "D": "A platelet factor 4-heparin ELISA", "E": "A plasma D-dimer level"}, "correct": "", "rationale": "Deep tissue bleeding and hemarthroses suggest a coagulation-factor disorder. Correction on mixing supports a factor deficiency, so factor VIII and IX assays evaluate hemophilia A and B.", "section": "Mixing Studies, Factor Assays, and Hemophilia | Learning Objective(s) 2, 3, 4", "topic": "Mixing Studies, Factor Assays, and Hemophilia"}, {"id": "5", "stem": "A 38-year-old man has had easy bruising and recurrent epistaxis since adolescence. He bled excessively after dental extractions, and a recent dose of aspirin was followed by a severe nosebleed. His mother and sister have anemia attributed to heavy menstrual bleeding. Which diagnosis is most likely?", "choices": {"A": "Hemophilia A", "B": "Immune thrombocytopenia", "C": "Disseminated intravascular coagulation", "D": "An acquired factor VIII inhibitor", "E": "Von Willebrand disease"}, "correct": "", "rationale": "Lifelong mucocutaneous bleeding in both male and female family members strongly supports von Willebrand disease. Aspirin can unmask or worsen the platelet-adhesion defect.", "section": "Von Willebrand Disease | Learning Objective(s) 2, 3, 4", "topic": "Von Willebrand Disease"}, {"id": "5A", "stem": "Assume the previous question was answered correctly. Which initial laboratory pattern is most characteristic of this disorder?", "choices": {"A": "Normal platelet count, normal PT, and normal or prolonged aPTT", "B": "Normal platelet count with prolonged PT and prolonged aPTT", "C": "Low platelet count with prolonged PT and prolonged aPTT", "D": "Normal platelet count with prolonged PT and normal aPTT", "E": "Low platelet count with normal PT and aPTT"}, "correct": "", "rationale": "Patients with von Willebrand disease have a normal platelet count and PT. The aPTT may be normal in mild disease or prolonged when reduced von Willebrand factor lowers factor VIII sufficiently.", "section": "Testing for Von Willebrand Disease | Learning Objective(s) 3, 4", "topic": "Testing for Von Willebrand Disease"}, {"id": "5B", "stem": "The initial platelet count, PT, and aPTT are normal, but clinical suspicion remains high. Which follow-up testing is most appropriate?", "choices": {"A": "Factor V Leiden genetic testing", "B": "Fibrinogen and D-dimer levels", "C": "Routine antiplatelet antibody testing", "D": "Von Willebrand factor antigen, von Willebrand factor activity, and factor VIII activity", "E": "Platelet factor 4-heparin antibody testing"}, "correct": "", "rationale": "Mild von Willebrand disease can have normal basic testing. Specific testing evaluates von Willebrand factor quantity, function, and the associated factor VIII activity.", "section": "Testing for Von Willebrand Disease | Learning Objective(s) 4", "topic": "Testing for Von Willebrand Disease"}, {"id": "6", "stem": "A patient with severe gram-negative sepsis develops oozing from intravenous sites and ischemic changes in several fingers. Laboratory studies show platelets 42,000/mcL, prolonged PT and aPTT, low fibrinogen, elevated D-dimer, and schistocytes. Which interpretation best explains these findings?", "choices": {"A": "ADAMTS13 deficiency has caused platelet-rich microthrombi with preserved coagulation tests", "B": "Benign bruising has produced nonspecific laboratory abnormalities", "C": "An isolated primary-hemostasis defect has impaired platelet plug formation", "D": "An isolated factor VII deficiency has impaired the extrinsic pathway", "E": "Widespread coagulation activation has caused thrombosis followed by consumption of platelets and clotting factors"}, "correct": "", "rationale": "This is the consumptive pattern of DIC: systemic coagulation activation produces microthrombi, then depletion of platelets and factors causes bleeding. Low fibrinogen and markedly elevated D-dimer further support DIC.", "section": "Disseminated Intravascular Coagulation | Learning Objective(s) 3, 4, 5", "topic": "Disseminated Intravascular Coagulation"}, {"id": "7", "stem": "A 50-year-old man undergoes meniscal repair and is largely immobile for two weeks. He then takes a six-hour flight and develops a painful swollen calf; ultrasonography confirms his first DVT. He has no personal or family history of thrombosis. What is the best approach to hereditary thrombophilia testing?", "choices": {"A": "Test only factor V Leiden and the prothrombin gene mutation", "B": "Defer testing because the DVT is strongly provoked and no thrombophilia red flags are present", "C": "Order the complete inherited thrombophilia panel for every first DVT", "D": "Order antiphospholipid testing because any DVT may be autoimmune", "E": "Test only protein C, protein S, and antithrombin levels"}, "correct": "", "rationale": "Surgery, immobility, and prolonged travel provide clear provoking factors. The lecture recommends selective testing rather than routine testing after a provoked first VTE without young age, recurrence, unusual location, or a suspicious family history.", "section": "When to Test for Hereditary Thrombophilias | Learning Objective(s) 5", "topic": "When to Test for Hereditary Thrombophilias"}, {"id": "8", "stem": "A 22-year-old woman presents with new petechiae, gingival bleeding, and easy bruising. Her platelet count is 16,000/mcL; hemoglobin and leukocyte counts are normal. PT and aPTT are normal. Which abnormality most directly explains her bleeding pattern?", "choices": {"A": "Severe thrombocytopenia impairing primary hemostasis", "B": "Factor VII deficiency impairing the extrinsic pathway", "C": "Excess fibrinolysis from increased plasmin activity", "D": "Lupus anticoagulant causing in-vivo anticoagulation", "E": "Factor VIII deficiency impairing the intrinsic pathway"}, "correct": "", "rationale": "Petechiae and mucosal bleeding are characteristic of a primary-hemostasis defect. A platelet count near 20,000/mcL is in the range associated with spontaneous mucocutaneous bleeding.", "section": "Thrombocytopenia and Primary Hemostasis | Learning Objective(s) 2, 3, 4", "topic": "Thrombocytopenia and Primary Hemostasis"}, {"id": "9", "stem": "A 72-year-old patient has poor nutrition and recently completed a prolonged course of antibiotics. He develops easy bruising. Platelet count is normal, PT is prolonged, and aPTT is normal. Which cause is most likely?", "choices": {"A": "Hemophilia B", "B": "Factor V Leiden", "C": "Early vitamin K deficiency with predominant reduction of factor VII", "D": "Von Willebrand disease", "E": "Thrombotic thrombocytopenic purpura"}, "correct": "", "rationale": "Factor VII has the shortest half-life among the vitamin K-dependent factors, so PT prolongs before aPTT in early vitamin K deficiency. Severe deficiency can later prolong both tests.", "section": "PT Prolongation Differential Diagnosis | Learning Objective(s) 3, 4", "topic": "PT Prolongation Differential Diagnosis"}, {"id": "10", "stem": "A patient has recurrent mucocutaneous bleeding, but the platelet count, PT, and aPTT are normal. Specific von Willebrand studies are unrevealing, and a qualitative platelet defect remains a concern. Which test category most directly evaluates platelet function?", "choices": {"A": "Platelet function analyzer assay", "B": "Plasma D-dimer assay", "C": "Factor IX activity assay", "D": "Plasma mixing study", "E": "International normalized ratio"}, "correct": "", "rationale": "A platelet function analyzer is directed at platelet function rather than coagulation-factor activity or fibrin breakdown. It is most relevant when a primary-hemostasis disorder is suspected despite an adequate platelet count.", "section": "Laboratory Evaluation of Suspected Bleeding Disorders | Learning Objective(s) 3, 4", "topic": "Laboratory Evaluation of Suspected Bleeding Disorders"}, {"id": "11", "stem": "A hospitalized patient receiving unfractionated heparin has a platelet decline from 240,000/mcL to 105,000/mcL on treatment day 7. He develops a new proximal DVT and has no significant bleeding. Which next step is most appropriate?", "choices": {"A": "Stop all heparin exposure and send a platelet factor 4-heparin antibody assay", "B": "Order factor VIII and factor IX activity assays", "C": "Switch from unfractionated heparin to low-molecular-weight heparin", "D": "Order a von Willebrand factor panel", "E": "Continue unfractionated heparin and monitor the aPTT"}, "correct": "", "rationale": "A platelet fall greater than 50% five to ten days after heparin exposure with new thrombosis is classic for HIT. The lecture directs immediate elimination of all heparin exposure and PF4-heparin antibody testing.", "section": "Heparin-Induced Thrombocytopenia and Thrombosis | Learning Objective(s) 3, 4", "topic": "Heparin-Induced Thrombocytopenia and Thrombosis"}, {"id": "12", "stem": "A patient is beginning anticoagulation for an acute thromboembolic disorder. The clinician plans to use a laboratory test to titrate the anticoagulant effect. Which treatment is appropriately monitored with the aPTT?", "choices": {"A": "No anticoagulant therapy is monitored with aPTT", "B": "Warfarin therapy", "C": "Apixaban therapy", "D": "A continuous infusion of unfractionated heparin", "E": "Prophylactic low-molecular-weight heparin"}, "correct": "", "rationale": "The aPTT is used to monitor unfractionated heparin. Low-molecular-weight heparin has little effect on the aPTT, direct oral anticoagulants generally do not require routine monitoring, and warfarin is followed with PT/INR.", "section": "aPTT Prolongation and Anticoagulant Monitoring | Learning Objective(s) 4", "topic": "aPTT Prolongation and Anticoagulant Monitoring"}, {"id": "13", "stem": "Which complete set of adult values is within the reference ranges presented in the lecture?", "choices": {"A": "Platelets 250,000/mcL; PT 16 seconds; aPTT 35 seconds; INR 1.0", "B": "Platelets 90,000/mcL; PT 12 seconds; aPTT 35 seconds; INR 1.0", "C": "Platelets 250,000/mcL; PT 12 seconds; aPTT 50 seconds; INR 1.0", "D": "Platelets 250,000/mcL; PT 12 seconds; aPTT 35 seconds; INR 1.6", "E": "Platelets 250,000/mcL; PT 12 seconds; aPTT 35 seconds; INR 1.0"}, "correct": "", "rationale": "The lecture lists platelets 150,000-450,000/mcL, PT 11-14 seconds, aPTT 30-40 seconds, and INR 0.8-1.2 as normal adult ranges.", "section": "Normal Values and the Big Three | Learning Objective(s) 4, 6", "topic": "Normal Values and the Big Three"}, {"id": "14", "stem": "A 43-year-old woman presents with a large spontaneous thigh hematoma. She had no excessive bleeding with prior surgeries or two vaginal deliveries, takes no anticoagulant, and has no family history of bleeding. Which broad explanation is most likely?", "choices": {"A": "Benign easy bruising without a hemostatic disorder", "B": "A hereditary hypercoagulable state", "C": "An acquired coagulation-factor inhibitor", "D": "Isolated thrombocytopenia", "E": "An inherited platelet-adhesion disorder"}, "correct": "", "rationale": "A new deep-tissue bleed in an adult with previously normal hemostatic challenges suggests an acquired secondary-hemostasis problem. A factor inhibitor is more consistent than an inherited disorder.", "section": "Acquired Factor Inhibitors | Learning Objective(s) 2, 3, 4", "topic": "Acquired Factor Inhibitors"}, {"id": "14A", "stem": "Assume the previous question was answered correctly. Which initial pattern is most likely?", "choices": {"A": "Normal platelet count with prolonged PT and normal aPTT", "B": "Low platelet count with normal PT and aPTT", "C": "Normal platelet count, normal PT, and prolonged aPTT", "D": "Low platelet count with prolonged PT and prolonged aPTT", "E": "Normal platelet count with normal PT and normal aPTT"}, "correct": "", "rationale": "An inhibitor directed at an intrinsic-pathway factor commonly produces an isolated prolonged aPTT. Platelet count and PT can remain normal.", "section": "aPTT Prolongation Differential Diagnosis | Learning Objective(s) 3, 4", "topic": "aPTT Prolongation Differential Diagnosis"}, {"id": "14B", "stem": "A 1:1 mixing study is performed, and the aPTT remains prolonged. How should this result be interpreted?", "choices": {"A": "The result establishes severe vitamin K deficiency", "B": "Von Willebrand disease is confirmed by the noncorrecting result", "C": "The abnormality is caused by a low platelet count", "D": "A factor deficiency is present because normal plasma corrected the result", "E": "A circulating inhibitor is present, so targeted inhibitor testing should follow"}, "correct": "", "rationale": "Normal plasma supplies missing coagulation factors, so a deficiency should correct. Failure to correct indicates that an inhibitor continues to interfere with coagulation.", "section": "Mixing Studies | Learning Objective(s) 4", "topic": "Mixing Studies"}, {"id": "15", "stem": "A 34-year-old man develops an unprovoked proximal DVT. His father had a pulmonary embolism at age 39. PT and aPTT are normal. Which test best evaluates the most common inherited thrombophilia emphasized in the lecture?", "choices": {"A": "Repeat PT testing", "B": "Plasma D-dimer measurement", "C": "Factor VIII activity assay", "D": "Activated protein C resistance assay or direct testing for factor V Leiden", "E": "Repeat aPTT testing"}, "correct": "", "rationale": "Factor V Leiden is the most common inherited thrombophilia and is also called activated protein C resistance. Routine PT and aPTT remain normal because mutated factor V still forms fibrin normally but resists inactivation.", "section": "Factor V Leiden | Learning Objective(s) 5", "topic": "Factor V Leiden"}, {"id": "16", "stem": "A 28-year-old patient is evaluated for possible pulmonary embolism. Clinical assessment indicates a low pretest probability, and the D-dimer result is normal. Which interpretation is most appropriate?", "choices": {"A": "The result confirms pulmonary embolism", "B": "Chest CT is mandatory despite the low probability and normal D-dimer", "C": "The normal D-dimer effectively excludes pulmonary embolism in this low-risk patient", "D": "A positive D-dimer would be required to exclude pulmonary embolism", "E": "D-dimer has no useful role in the evaluation of pulmonary embolism"}, "correct": "", "rationale": "D-dimer has high sensitivity and high negative predictive value in patients with low pretest probability. A normal result can exclude PE, whereas an elevated result is nonspecific and requires further evaluation.", "section": "D-Dimer Testing | Learning Objective(s) 5", "topic": "D-Dimer Testing"}, {"id": "17", "stem": "Which presentation most strongly points to a secondary-hemostasis defect rather than a platelet or von Willebrand factor disorder?", "choices": {"A": "Nonblanching ankle petechiae with epistaxis", "B": "Heavy menstrual bleeding with prolonged bleeding from minor cuts", "C": "Ecchymoses with severe isolated thrombocytopenia", "D": "Delayed postoperative bleeding with recurrent hemarthroses", "E": "Immediate gingival bleeding with petechiae"}, "correct": "", "rationale": "Coagulation-factor disorders cause deep tissue bleeding, hemarthroses, hematomas, and delayed bleeding after procedures. Primary-hemostasis disorders cause mucosal bleeding, petechiae, and immediate bleeding.", "section": "Clinical Bleeding Patterns | Learning Objective(s) 2, 3", "topic": "Clinical Bleeding Patterns"}, {"id": "18", "stem": "A 24-year-old woman has an isolated platelet count of 58,000/mcL. Hemoglobin and leukocyte counts are normal, PT and aPTT are normal, and no secondary cause is immediately apparent. Primary immune thrombocytopenia is suspected. Which test is least useful as a routine diagnostic study?", "choices": {"A": "Antiplatelet antibody testing", "B": "Assessment of the patient's clinical bleeding severity", "C": "Baseline PT and aPTT testing", "D": "Evaluation for possible secondary causes", "E": "Review of the complete blood count for isolated thrombocytopenia"}, "correct": "", "rationale": "Primary ITP is a diagnosis of exclusion characterized by isolated thrombocytopenia. Antiplatelet antibody testing is unreliable and is not routinely recommended.", "section": "Immune Thrombocytopenia | Learning Objective(s) 3, 4", "topic": "Immune Thrombocytopenia"}, {"id": "19", "stem": "A patient with decompensated cirrhosis has thrombocytopenia and prolongation of both PT and aPTT. There is no acute sepsis, major trauma, or obstetric complication. Which explanation best accounts for the coagulation results?", "choices": {"A": "Factor V Leiden has accelerated both coagulation pathways", "B": "An isolated factor VIII deficiency has prolonged both tests", "C": "Mild von Willebrand disease has prolonged PT and aPTT", "D": "Severe liver disease has reduced production of multiple coagulation factors, prolonging both pathways", "E": "Uncomplicated immune thrombocytopenia has prolonged PT and aPTT"}, "correct": "", "rationale": "The liver produces nearly all coagulation factors, and severe liver disease can prolong both PT and aPTT. PT often becomes abnormal first because factor VII has the shortest half-life.", "section": "PT and aPTT Prolongation | Learning Objective(s) 3, 4", "topic": "PT and aPTT Prolongation"}, {"id": "20", "stem": "A 27-year-old patient has recurrent unprovoked DVTs and a strong family history of early venous thrombosis. Testing for activated protein C resistance is negative. Which test is used to diagnose a prothrombin gene mutation?", "choices": {"A": "Platelet function analyzer testing", "B": "A 1:1 plasma mixing study", "C": "Plasma D-dimer measurement", "D": "Direct genetic analysis of the prothrombin gene", "E": "PT/INR monitoring"}, "correct": "", "rationale": "The prothrombin gene mutation raises circulating prothrombin levels, but there is no reliable functional assay. The lecture identifies direct genetic analysis as the diagnostic method.", "section": "Prothrombin Gene Mutation | Learning Objective(s) 5", "topic": "Prothrombin Gene Mutation"}, {"id": "21", "stem": "A 58-year-old patient with active malignancy undergoes pelvic surgery and remains largely immobile. Five days later, a proximal DVT is diagnosed. Which components of Virchow triad are present?", "choices": {"A": "Vascular wall injury only", "B": "Venous stasis and vascular wall injury only", "C": "Hypercoagulability only", "D": "Venous stasis only", "E": "Venous stasis, vascular wall injury, and hypercoagulability"}, "correct": "", "rationale": "Immobility causes stasis, surgery causes vascular injury, and malignancy produces hypercoagulability. All three components of Virchow triad are present.", "section": "Hypercoagulable States and Virchow Triad | Learning Objective(s) 5", "topic": "Hypercoagulable States and Virchow Triad"}, {"id": "22", "stem": "A 29-year-old woman presents with an unprovoked DVT. She has had two miscarriages and reports new stiffness and pain in the small joints of her hands. Which diagnosis is most likely?", "choices": {"A": "Von Willebrand disease", "B": "Immune thrombocytopenia", "C": "Factor V Leiden", "D": "Hemophilia B", "E": "Antiphospholipid syndrome"}, "correct": "", "rationale": "An unprovoked thrombosis plus recurrent pregnancy loss is classic for antiphospholipid syndrome. Joint symptoms raise concern for associated systemic lupus erythematosus.", "section": "Antiphospholipid Syndrome | Learning Objective(s) 5", "topic": "Antiphospholipid Syndrome"}, {"id": "22A", "stem": "Assume the previous question was answered correctly. Which initial laboratory pattern is most consistent with the lecture case?", "choices": {"A": "Normal platelet count, prolonged PT, and normal aPTT", "B": "Mild thrombocytopenia, normal PT, and prolonged aPTT", "C": "Low platelet count with normal PT and normal aPTT", "D": "Low platelet count with prolonged PT and prolonged aPTT", "E": "Normal platelet count with normal PT and normal aPTT"}, "correct": "", "rationale": "The lupus anticoagulant can prolong aPTT in vitro while promoting thrombosis in vivo. Mild thrombocytopenia may accompany an autoimmune process such as SLE.", "section": "Lupus Anticoagulant and Antiphospholipid Syndrome | Learning Objective(s) 4, 5", "topic": "Lupus Anticoagulant and Antiphospholipid Syndrome"}, {"id": "22B", "stem": "Which additional requirement is necessary to satisfy the laboratory component of the diagnostic criteria described in the lecture?", "choices": {"A": "The plasma fibrinogen level must be low", "B": "An antiphospholipid antibody must remain positive on two occasions at least 12 weeks apart", "C": "A single elevated D-dimer must be documented", "D": "The prolonged aPTT must correct on mixing", "E": "A factor V activity assay must be decreased"}, "correct": "", "rationale": "Antiphospholipid syndrome requires a clinical event plus persistent antiphospholipid antibodies. Persistence is defined as positivity on at least two occasions separated by 12 weeks or more.", "section": "Antiphospholipid Syndrome Diagnostic Criteria | Learning Objective(s) 5", "topic": "Antiphospholipid Syndrome Diagnostic Criteria"}, {"id": "23", "stem": "A postpartum patient develops severe bleeding and signs of organ ischemia after placental abruption. Platelet count is low, PT and aPTT are prolonged, fibrinogen is low, and D-dimer is markedly elevated. Which diagnosis is most likely?", "choices": {"A": "Isolated factor VII deficiency", "B": "Von Willebrand disease", "C": "Thrombotic thrombocytopenic purpura", "D": "Disseminated intravascular coagulation", "E": "Immune thrombocytopenia"}, "correct": "", "rationale": "Placental abruption is an obstetric trigger for DIC. The combination of thrombocytopenia, prolonged PT/aPTT, low fibrinogen, and elevated D-dimer is the classic consumptive pattern.", "section": "Disseminated Intravascular Coagulation | Learning Objective(s) 3, 4, 5", "topic": "Disseminated Intravascular Coagulation"}, {"id": "24", "stem": "A 45-year-old patient presents with confusion, fever, acute kidney injury, thrombocytopenia, and microangiopathic hemolytic anemia with numerous schistocytes. PT and aPTT are normal. Which next step is most appropriate?", "choices": {"A": "Begin warfarin anticoagulation", "B": "Wait for the ADAMTS13 result before treating", "C": "Administer vitamin K as definitive treatment", "D": "Begin urgent plasma exchange and glucocorticoids while sending ADAMTS13 testing", "E": "Obtain a platelet function analyzer assay before further action"}, "correct": "", "rationale": "The presentation is TTP, a medical emergency caused by severe ADAMTS13 deficiency, usually from an autoantibody. Treatment should begin based on the clinical picture rather than waiting for the delayed ADAMTS13 result.", "section": "Thrombotic Thrombocytopenic Purpura | Learning Objective(s) 3, 4", "topic": "Thrombotic Thrombocytopenic Purpura"}, {"id": "25", "stem": "Both DIC and TTP can produce thrombocytopenia, schistocytes, and organ injury. Which laboratory finding favors TTP over DIC?", "choices": {"A": "Markedly elevated D-dimer with low fibrinogen", "B": "Typically normal PT and aPTT with a normal or only mildly elevated D-dimer", "C": "A septic trigger with bleeding from venipuncture sites", "D": "Marked prolongation of PT and aPTT with low fibrinogen", "E": "Widespread consumption of coagulation factors"}, "correct": "", "rationale": "TTP is a platelet-rich thrombotic microangiopathy, so PT and aPTT are usually normal and D-dimer is normal or only mildly elevated. DIC consumes coagulation factors and produces prolonged coagulation tests, low fibrinogen, and elevated D-dimer.", "section": "DIC versus TTP | Learning Objective(s) 3, 4, 5", "topic": "DIC versus TTP"}, {"id": "26", "stem": "A 19-year-old woman has had heavy menstrual bleeding since menarche and frequent epistaxis. Platelet count, PT, and aPTT are all normal. Which interpretation is most appropriate?", "choices": {"A": "Mild von Willebrand disease remains possible, so specific von Willebrand testing is indicated", "B": "An isolated factor VII deficiency is most likely", "C": "Normal basic tests exclude a bleeding disorder", "D": "Hemophilia A is the most likely diagnosis", "E": "The pattern establishes disseminated intravascular coagulation"}, "correct": "", "rationale": "Mild von Willebrand disease may not alter the basic hemostasis tests. A strong mucocutaneous bleeding history should prompt specific von Willebrand factor testing despite normal initial results.", "section": "Abnormal Bleeding: Diagnostic Work-up | Learning Objective(s) 2, 3, 4", "topic": "Abnormal Bleeding: Diagnostic Work-up"}, {"id": "27", "stem": "A 17-year-old boy has recurrent hemarthroses. Platelet count and PT are normal, aPTT is prolonged, and the aPTT corrects with a 1:1 mixing study. A von Willebrand panel is normal. Which testing should follow?", "choices": {"A": "Antiphospholipid antibody testing", "B": "Plasma D-dimer testing", "C": "Platelet factor 4-heparin antibody testing", "D": "Platelet function analyzer testing", "E": "Specific factor VIII, IX, and XI activity assays"}, "correct": "", "rationale": "Correction on mixing indicates a factor deficiency. In an intrinsic-pathway pattern, specific assays for factors VIII, IX, and XI identify the deficient factor.", "section": "Mixing Studies and Factor Assays | Learning Objective(s) 3, 4", "topic": "Mixing Studies and Factor Assays"}, {"id": "28", "stem": "Which laboratory test and pathway pairing is correct?", "choices": {"A": "aPTT - intrinsic pathway and common pathway", "B": "INR - platelet adhesion and aggregation", "C": "Platelet count - common coagulation pathway", "D": "D-dimer - isolated factor VII activity", "E": "PT - intrinsic pathway"}, "correct": "", "rationale": "The aPTT assesses intrinsic-pathway factors VIII, IX, XI, and XII plus common-pathway factors. PT assesses the extrinsic factor VII pathway plus the common pathway.", "section": "The Big Three Hemostasis Tests | Learning Objective(s) 1, 4", "topic": "The Big Three Hemostasis Tests"}, {"id": "29", "stem": "A mother brings her 7-year-old daughter for a petechial rash on both lower legs. The child recovered from a viral upper respiratory illness two weeks ago and now has mild gingival bleeding with tooth brushing. There is no personal or family history of bleeding. Which diagnosis is most likely?", "choices": {"A": "Von Willebrand disease", "B": "Immune thrombocytopenia", "C": "Antiphospholipid syndrome", "D": "Hemophilia A", "E": "Disseminated intravascular coagulation"}, "correct": "", "rationale": "Postviral petechiae and mild mucosal bleeding in a child are classic for acute ITP. Pediatric ITP is often transient and self-limited.", "section": "Immune Thrombocytopenia | Learning Objective(s) 2, 3, 4", "topic": "Immune Thrombocytopenia"}, {"id": "29A", "stem": "Assume the previous question was answered correctly. Which laboratory pattern is most likely?", "choices": {"A": "Low platelet count with isolated prolongation of PT", "B": "Low platelet count with prolonged PT, prolonged aPTT, and low fibrinogen", "C": "Low platelet count with normal PT and aPTT and otherwise preserved blood cell lines", "D": "Normal platelet count, PT, and aPTT", "E": "Normal platelet count and PT with prolonged aPTT"}, "correct": "", "rationale": "ITP produces isolated thrombocytopenia because platelets are immune-mediated targets. The coagulation cascade remains intact, so PT and aPTT are normal.", "section": "Immune Thrombocytopenia Laboratory Evaluation | Learning Objective(s) 3, 4", "topic": "Immune Thrombocytopenia Laboratory Evaluation"}, {"id": "29B", "stem": "The child is clinically stable and has only mild mucocutaneous bleeding. Which management approach is most consistent with the lecture?", "choices": {"A": "Administer factor VIII replacement", "B": "Observe and monitor, avoid NSAIDs and contact sports, and arrange hematology follow-up", "C": "Begin emergency plasma exchange", "D": "Begin warfarin therapy", "E": "Order a complete hereditary thrombophilia panel"}, "correct": "", "rationale": "Children with mild bleeding from ITP can often be observed because spontaneous resolution is common. Counseling includes avoiding NSAIDs and high-risk contact activities, with hematology follow-up when available.", "section": "Pediatric Immune Thrombocytopenia Case | Learning Objective(s) 3, 4", "topic": "Pediatric Immune Thrombocytopenia Case"}, {"id": "30", "stem": "Which patient with venous thromboembolism most strongly warrants evaluation for an inherited thrombophilia?", "choices": {"A": "A 65-year-old with a DVT during active metastatic cancer", "B": "A 54-year-old with a first DVT after prolonged immobilization", "C": "A 38-year-old with recurrent unprovoked upper-extremity thromboses and a parent who had a pulmonary embolism at age 40", "D": "A 31-year-old with a DVT during pregnancy", "E": "A 72-year-old with a first DVT after hip replacement"}, "correct": "", "rationale": "Young age, recurrence, unprovoked events, unusual sites, and a strong family history are the lecture's red flags for selective thrombophilia testing. The other events have clear provoking factors.", "section": "When to Test for Hereditary Thrombophilias | Learning Objective(s) 5", "topic": "When to Test for Hereditary Thrombophilias"}, {"id": "31", "stem": "Which group consists entirely of natural anticoagulants whose inherited deficiencies can cause thrombophilia?", "choices": {"A": "Factors II, VII, and X", "B": "Protein C, protein S, and antithrombin", "C": "Factors VIII, IX, and XI", "D": "Plasminogen, tissue plasminogen activator, and fibrinogen", "E": "Von Willebrand factor, factor VIII, and platelets"}, "correct": "", "rationale": "Protein C, protein S, and antithrombin normally limit coagulation. Inherited deficiencies of any of these proteins can produce a hereditary hypercoagulable state.", "section": "Protein C, Protein S, and Antithrombin Deficiencies | Learning Objective(s) 5", "topic": "Protein C, Protein S, and Antithrombin Deficiencies"}, {"id": "32", "stem": "A patient asks whether a bleeding time should be performed to evaluate possible mild von Willebrand disease. Which response best reflects the lecture?", "choices": {"A": "Bleeding time must be performed before obtaining a platelet count", "B": "Bleeding time is the most reliable first-line test for von Willebrand disease", "C": "Bleeding time is the screening test for factor V Leiden", "D": "Bleeding time is used to distinguish a coagulation-factor deficiency from an inhibitor", "E": "Bleeding time has a limited routine role because of performance variability; specific von Willebrand and platelet-function testing is preferred"}, "correct": "", "rationale": "Bleeding time is an older, variable test that is no longer routinely used for primary-hemostasis evaluation. Specific von Willebrand studies and modern platelet-function testing are more appropriate.", "section": "Bleeding Time and Platelet Function Testing | Learning Objective(s) 4", "topic": "Bleeding Time and Platelet Function Testing"}], "pages": [["1"], ["2"], ["3"], ["4"], ["5", "5A", "5B"], ["6"], ["7"], ["8"], ["9"], ["10"], ["11"], ["12"], ["13"], ["14", "14A", "14B"], ["15"], ["16"], ["17"], ["18"], ["19"], ["20"], ["21"], ["22", "22A", "22B"], ["23"], ["24"], ["25"], ["26"], ["27"], ["28"], ["29", "29A", "29B"], ["30"], ["31"], ["32"]]};
const qById = Object.fromEntries(DATA.questions.map(q=>[q.id,q]));
let currentPage = 0;
let graded = false;
let reviewMode = false;
let reviewPages = [];
const answers = {};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function pageIds() { return reviewMode ? reviewPages[currentPage] : DATA.pages[currentPage]; }
function renderExam() {
  const exam = document.getElementById('exam');
  exam.innerHTML = '';
  const pages = reviewMode ? reviewPages : DATA.pages;
  pages.forEach((ids, idx)=>{
    const section=document.createElement('section');
    section.className='page'+(idx===currentPage?' active':'');
    const grid=document.createElement('div');
    grid.className='question-grid'+(ids.length>1?' cluster':'');
    ids.forEach(id=>grid.appendChild(renderQuestion(qById[id])));
    section.appendChild(grid);
    exam.appendChild(section);
  });
  updateNav();
}
function renderQuestion(q) {
  const card=document.createElement('article');
  card.className='qcard'; card.dataset.qid=q.id;
  card.innerHTML = `
    <div class="qhead"><div class="qnum">Question ${esc(q.id)}</div><div class="badge">Single best answer</div></div>
    <div class="stem">${esc(q.stem)}</div>
    <div class="choices">
      ${Object.entries(q.choices).map(([letter,text])=>`
      <label class="choice" data-letter="${letter}">
        <input type="radio" name="q_${q.id}" value="${letter}" ${answers[q.id]===letter?'checked':''} ${graded?'disabled':''}>
        <strong>${letter}.</strong><span>${esc(text)}</span>
      </label>`).join('')}
    </div>
    <div class="feedback" id="fb_${q.id}"></div>`;
  card.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>selectAnswer(q.id, inp.value)));
  if (answers[q.id]) showImmediate(q.id);
  if (graded) applyGradeStyle(q.id);
  return card;
}
function selectAnswer(qid, letter) {
  if (graded) return;
  answers[qid]=letter;
  showImmediate(qid);
  updateNav();
}
function showImmediate(qid) {
  const q=qById[qid], fb=document.getElementById('fb_'+qid);
  if (!fb || !answers[qid]) return;
  const ok=answers[qid]===q.correct;
  fb.className='feedback show '+(ok?'good':'bad');
  fb.innerHTML=`<strong>${ok?'Correct':'Incorrect'}.</strong> Correct answer: ${q.correct}. ${esc(q.rationale)}<div class="obj"><strong>Objective:</strong> ${esc(q.section)}</div>`;
}
function applyGradeStyle(qid) {
  const q=qById[qid], card=document.querySelector(`[data-qid="${qid}"]`);
  if (!card) return;
  card.querySelectorAll('.choice').forEach(el=>{
    const l=el.dataset.letter;
    el.classList.remove('correct','incorrect');
    if (l===q.correct) el.classList.add('correct');
    if (answers[qid]===l && l!==q.correct) el.classList.add('incorrect');
  });
  showImmediate(qid);
}
function updateNav() {
  const pages = reviewMode ? reviewPages : DATA.pages;
  const pct = pages.length ? ((currentPage+1)/pages.length*100) : 0;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('topstats').textContent=`Page ${currentPage+1} of ${pages.length} • ${Object.keys(answers).length} answered`;
  document.getElementById('prevBtn').disabled=currentPage===0;
  const last=currentPage===pages.length-1;
  document.getElementById('nextBtn').style.display=last?'none':'inline-block';
  document.getElementById('finalBtn').style.display=last&&!reviewMode?'inline-block':'none';
  document.getElementById('gradeCurrentBtn').style.display=graded?'none':'inline-block';
}
function go(delta) {
  const pages = reviewMode ? reviewPages : DATA.pages;
  currentPage=Math.max(0,Math.min(pages.length-1,currentPage+delta));
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===currentPage));
  updateNav(); window.scrollTo({top:0,behavior:'smooth'});
}
function gradeExam(currentOnly=false) {
  let ids;
  if (currentOnly) {
    const source = reviewMode ? reviewPages : DATA.pages;
    ids = source.slice(0,currentPage+1).flat().filter(id=>answers[id]);
  } else {
    ids = DATA.questions.map(q=>q.id).filter(id=>answers[id]);
  }
  if (!ids.length) { alert('Answer at least one question before grading.'); return; }
  graded=true;
  document.querySelectorAll('input').forEach(x=>x.disabled=true);
  DATA.questions.forEach(q=>applyGradeStyle(q.id));
  showResults(ids, currentOnly);
  document.getElementById('reviewMissedBtn').style.display='inline-block';
  document.getElementById('gradeCurrentBtn').style.display='none';
  document.getElementById('finalBtn').style.display='none';
}
function showResults(ids, partial) {
  const correct=ids.filter(id=>answers[id]===qById[id].correct).length;
  const pct=Math.round(correct/ids.length*100);
  const byTopic={};
  ids.forEach(id=>{
    const q=qById[id], t=q.topic;
    byTopic[t] ||= {correct:0,total:0};
    byTopic[t].total++;
    if (answers[id]===q.correct) byTopic[t].correct++;
  });
  const rows=Object.entries(byTopic).map(([t,s])=>({t,...s,p:Math.round(s.correct/s.total*100)})).sort((a,b)=>b.p-a.p);
  const r=document.getElementById('results');
  r.classList.add('show');
  r.innerHTML=`<div class="scorebig">${pct}%</div>
    <div><strong>${correct} correct / ${ids.length} completed</strong>${partial?' (graded through current page)':''}</div>
    <table class="topic-table"><thead><tr><th>Section / Topic</th><th>Score</th><th>Percent</th></tr></thead>
    <tbody>${rows.map(x=>`<tr><td>${esc(x.t)}</td><td>${x.correct} / ${x.total}</td><td>${x.p}%</td></tr>`).join('')}</tbody></table>`;
  r.scrollIntoView({behavior:'smooth'});
}
function reviewMissed() {
  const missed = DATA.questions.filter(q=>answers[q.id] && answers[q.id]!==q.correct).map(q=>q.id);
  if (!missed.length) { alert('No missed questions to review.'); return; }
  reviewMode=true; graded=true;
  reviewPages=missed.map(id=>[id]);
  currentPage=0;
  document.getElementById('missedBanner').style.display='block';
  document.getElementById('missedBanner').textContent=`Reviewing ${missed.length} missed question${missed.length===1?'':'s'}.`;
  document.getElementById('results').classList.remove('show');
  renderExam();
}
document.getElementById('prevBtn').onclick=()=>go(-1);
document.getElementById('nextBtn').onclick=()=>go(1);
document.getElementById('gradeCurrentBtn').onclick=()=>gradeExam(true);
document.getElementById('finalBtn').onclick=()=>gradeExam(false);
document.getElementById('reviewMissedBtn').onclick=reviewMissed;
renderExam();
</script>
</body>
