<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DI Two — GI & Liver Self-Grading Practice Exam</title>
<style>
:root {
  --bg:#f4f7fb; --card:#ffffff; --ink:#172033; --muted:#657089; --line:#dce3ee;
  --accent:#1f5f7a; --accent2:#e9f3f7; --green:#dff4e6; --green-border:#55a76a;
  --red:#fde3e3; --red-border:#d75a5a; --amber:#fff3d6;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:1080px;margin:0 auto;padding:18px 14px 90px}
header{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
h1{font-size:clamp(20px,3vw,30px);margin:0 0 4px}
.subtitle{color:var(--muted);font-size:14px}
.status{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.progress-wrap{height:8px;background:#e3e9f1;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.progress{height:100%;background:var(--accent);width:1%;transition:.2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(30,50,80,.07);padding:clamp(16px,3vw,26px)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.qnum{font-size:15px;font-weight:800;color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
.stem{font-size:clamp(16px,2vw,19px);line-height:1.42;font-weight:650;margin-bottom:14px}
.choices{display:grid;gap:9px}
.choice{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:15px;line-height:1.35;cursor:pointer;transition:.15s}
.choice:hover{border-color:#9fb6c6;background:#fbfdff}
.choice .letter{font-weight:800;min-width:22px;color:var(--accent)}
.choice.correct{background:var(--green);border-color:var(--green-border)}
.choice.incorrect{background:var(--red);border-color:var(--red-border)}
.choice.locked{cursor:default}
.feedback{display:none;margin-top:14px;border-radius:12px;padding:13px 14px;border:1px solid var(--line);font-size:14px;line-height:1.45}
.feedback.show{display:block}
.feedback.good{background:var(--green);border-color:var(--green-border)}
.feedback.bad{background:var(--red);border-color:var(--red-border)}
.feedback .obj{margin-top:7px;color:#35435a;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer;font-size:14px}
.primary{background:var(--accent);color:white}
.secondary{background:#e8edf4;color:#1d2b40}
.warn{background:#7a4e15;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.results{display:none;margin-top:18px}
.results.show{display:block}
.scorebox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.metric strong{display:block;font-size:24px}
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.topic{background:white;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px}
.topic b{display:block;margin-bottom:4px}
.footer-controls{position:fixed;bottom:0;left:0;right:0;background:rgba(244,247,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px;z-index:5}
.footer-inner{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.review-banner{display:none;background:var(--amber);border:1px solid #e4c266;border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.review-banner.show{display:block}
.import-report{margin-top:12px;color:var(--muted);font-size:12px;text-align:center}
@media (max-height:720px) and (min-width:700px) {
  .app{padding-top:10px}
  .card{padding:14px 18px}
  .stem{font-size:15px;margin-bottom:10px}
  .choice{font-size:13.5px;padding:8px 10px}
  .choices{gap:6px}
  .feedback{font-size:12.5px;padding:9px 11px}
}
@media (max-width:680px) {
  header{display:block}
  .status{text-align:left;margin-top:5px}
  .scorebox{grid-template-columns:1fr}
  .topic-grid{grid-template-columns:1fr}
  .choice{font-size:14.5px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>Diagnostic Interpretation II — GI & Liver</h1>
    <div class="subtitle">100-Question Self-Grading Practice Exam</div>
  </div>
  <div class="status" id="status"></div>
</header>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<div class="review-banner" id="reviewBanner">Review Missed Questions mode</div>

<section class="card" id="examCard">
  <div class="qhead"><div class="qnum" id="qnum"></div><div class="small" id="answeredCount"></div></div>
  <div class="stem" id="stem"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="secondary" id="prevBtn" onclick="goPrev()">Previous</button>
    <button class="primary" id="nextBtn" onclick="goNext()">Next</button>
  </div>
</section>

<section class="results" id="results">
  <div class="scorebox">
    <div class="metric"><span>Score</span><strong id="scorePct">0%</strong></div>
    <div class="metric"><span>Correct</span><strong id="scoreRaw">0 / 0</strong></div>
    <div class="metric"><span>Answered</span><strong id="answeredRaw">0 / 100</strong></div>
  </div>
  <div class="topic-grid" id="topicGrid"></div>
</section>

<div class="import-report">Imported: 100 of 100 questions • Unparsed: 0</div>
</div>

<div class="footer-controls">
  <div class="footer-inner">
    <button class="secondary" onclick="gradeCompleted()">Submit (Grade from current place)</button>
    <button class="primary" onclick="finishExam()">Submit (at end of test)</button>
    <button class="secondary" id="reviewBtn" onclick="toggleReview()" disabled>Review Missed Questions</button>
    <button class="secondary" id="copyBtn" onclick="copyMissed()" disabled>COPY missed questions</button>
  </div>
</div>

<script>
const QUESTIONS = [{"n": 1, "stem": "A patient with sudden severe epigastric pain and a rigid abdomen is suspected of having a perforated peptic ulcer. Which plain radiographic view is best for detecting small amounts of free intraperitoneal air?", "choices": {"A": "Upright PA chest radiograph", "B": "Right lateral decubitus abdomen", "C": "Supine KUB only", "D": "HIDA scan", "E": "RUQ ultrasound"}, "answer": "A", "explanation": "The upright PA chest is the most sensitive plain-film view for small amounts of free air. If the patient cannot stand, use a left lateral decubitus view.", "topic": "Abdominal Imaging", "objective": "Objective 3 — Recognize abnormal bowel gas patterns, obstruction, ileus, and free intraperitoneal air."}, {"n": 2, "stem": "One day after abdominal surgery, a patient has distention and a quiet abdomen. Imaging shows diffuse dilation of small and large bowel with gas extending to the rectum and no transition point. What is the most likely diagnosis?", "choices": {"A": "Pneumoperitoneum", "B": "Postoperative ileus", "C": "Complete mechanical SBO", "D": "Sigmoid volvulus", "E": "Mechanical LBO"}, "answer": "B", "explanation": "Generalized ileus causes diffuse small- and large-bowel dilation without a transition point, with gas still reaching the rectum. It is common after surgery and with opioids or electrolyte abnormalities.", "topic": "Abdominal Imaging", "objective": "Objective 3 — Recognize abnormal bowel gas patterns, obstruction, ileus, and free intraperitoneal air."}, {"n": 3, "stem": "A patient with previously stable chronic hepatitis B suddenly decompensates without another clear cause. Which additional viral infection should be considered?", "choices": {"A": "Chronic hepatitis C coinfection", "B": "Resolved hepatitis A", "C": "Hepatitis D superinfection", "D": "Hepatitis E infection", "E": "Acute hepatitis A coinfection"}, "answer": "C", "explanation": "Hepatitis D requires hepatitis B. Superinfection with HDV should be considered when chronic HBV unexpectedly worsens; total anti-HDV is the listed test.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 4, "stem": "A lower GI contrast study demonstrates an annular constricting 'apple-core' lesion in the colon. Which diagnosis is most strongly suggested?", "choices": {"A": "Ulcerative colitis", "B": "Achalasia", "C": "Diffuse esophageal spasm", "D": "Colorectal carcinoma", "E": "Celiac disease"}, "answer": "D", "explanation": "An apple-core annular constricting lesion on a barium enema is a classic finding of colorectal carcinoma.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 5, "stem": "A patient with prior abdominal surgery presents with vomiting, distention, and high-pitched bowel sounds. Plain films show central small bowel dilation >3 cm, stair-step air-fluid levels, and little rectal gas. What is the most likely diagnosis?", "choices": {"A": "Mechanical small bowel obstruction", "B": "Cholecystitis", "C": "Mechanical large bowel obstruction", "D": "Uncomplicated constipation", "E": "Generalized adynamic ileus"}, "answer": "A", "explanation": "The classic SBO triad is dilated central small bowel, multiple stair-step air-fluid levels, and paucity of distal/rectal gas. Postoperative adhesions are the most common cause.", "topic": "Abdominal Imaging", "objective": "Objective 3 — Recognize abnormal bowel gas patterns, obstruction, ileus, and free intraperitoneal air."}, {"n": 6, "stem": "A 55-year-old reports that bread and meat intermittently feel stuck behind the sternum. Which test directly evaluates the esophagus and can also dilate a ring or stricture during the same procedure?", "choices": {"A": "Barium enema", "B": "Modified barium swallow", "C": "HIDA scan", "D": "Flexible sigmoidoscopy", "E": "EGD"}, "answer": "E", "explanation": "Esophageal solid-food dysphagia suggests a mechanical lesion such as a ring or peptic stricture. EGD can diagnose and treat by dilation in the same sitting.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 7, "stem": "A patient has RUQ pain, fever, and a positive Murphy sign after a fatty meal. Which imaging study should be obtained first?", "choices": {"A": "Noncontrast stone CT", "B": "RUQ ultrasound", "C": "Colonoscopy", "D": "Barium enema", "E": "HIDA scan first in every case"}, "answer": "B", "explanation": "RUQ ultrasound is first line for suspected gallstones and acute cholecystitis. HIDA is used when ultrasound is equivocal but clinical suspicion remains high.", "topic": "Abdominal Imaging", "objective": "Objective 6 — Differentiate RUQ ultrasound from HIDA scanning for biliary tract disease."}, {"n": 8, "stem": "Which item does NOT cause a false-positive guaiac FOBT according to the guide?", "choices": {"A": "Dietary peroxidases", "B": "Turnips", "C": "Red meat", "D": "Oral iron", "E": "Radishes"}, "answer": "D", "explanation": "Red meat and dietary peroxidases such as turnips and radishes can cause false-positive guaiac results. Oral iron does not.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 9, "stem": "A 68-year-old has new epigastric symptoms, weight loss, iron deficiency anemia, and melena. Which test is most appropriate because it allows direct visualization, biopsy, and therapy?", "choices": {"A": "Barium swallow", "B": "Flexible sigmoidoscopy", "C": "Upper GI series only", "D": "Modified barium swallow", "E": "EGD"}, "answer": "E", "explanation": "Alarm features and suspected upper GI bleeding warrant EGD. It permits direct visualization, biopsy, and therapeutic hemostasis in the same procedure.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 10, "stem": "A patient with new bloody diarrhea has positive fecal leukocytes, but routine and special stool cultures are negative. Which diagnosis should move higher on the differential?", "choices": {"A": "Uncomplicated IBS", "B": "Lactose intolerance", "C": "Gilbert syndrome", "D": "Viral hepatitis", "E": "IBD"}, "answer": "E", "explanation": "Positive fecal leukocytes show intestinal inflammation. When stool cultures are negative, the high-yield combination suggests new-onset IBD.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 11, "stem": "A 72-year-old is 3 days post-stroke and coughs when trying to swallow both liquids and solids. He has trouble initiating the swallow. Which study is most appropriate?", "choices": {"A": "Flexible sigmoidoscopy", "B": "Modified barium swallow", "C": "Colonoscopy", "D": "Upper GI series", "E": "Standard barium esophagram"}, "answer": "B", "explanation": "Trouble initiating a swallow is oropharyngeal or transfer dysphagia. The modified barium swallow is the test of choice and also helps define safe food consistencies after a CNS event.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 12, "stem": "A 63-year-old has LLQ pain and fever suggestive of acute diverticulitis. Which imaging study is preferred?", "choices": {"A": "Immediate colonoscopy", "B": "Barium enema during the acute episode", "C": "Modified barium swallow", "D": "HIDA scan", "E": "CT A/P with IV contrast"}, "answer": "E", "explanation": "CT A/P with IV contrast is the preferred test for acute diverticulitis. Colonoscopy and barium enema are avoided during the acute episode.", "topic": "Abdominal Imaging", "objective": "Objective 7 — Select the imaging procedure of choice for common suspected abdominal diagnoses."}, {"n": 13, "stem": "A patient with severe watery diarrhea tests positive for Cryptosporidium antigen. Which additional evaluation is specifically recommended by the guide?", "choices": {"A": "Order a HIDA scan", "B": "Screen for HIV", "C": "Repeat a hydrogen breath test", "D": "Screen for hepatitis A only", "E": "Perform a barium enema"}, "answer": "B", "explanation": "Severe Cryptosporidium diarrhea should prompt HIV screening. Parasite antigen testing is faster and more sensitive than O&P when available.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 14, "stem": "A patient with ulcerative colitis develops a persistent cholestatic liver enzyme pattern. Which associated liver disorder should be strongly considered?", "choices": {"A": "Gilbert syndrome", "B": "Wilson disease", "C": "PSC", "D": "Hemochromatosis", "E": "Alcohol-related liver disease"}, "answer": "C", "explanation": "PSC has a strong association with ulcerative colitis and can produce a cholestatic pattern; p-ANCA may be present and cholangiocarcinoma risk is increased.", "topic": "Interpretation of Liver Tests", "objective": "Objective 2 — Identify key laboratory diagnostic clues for common hepatocellular and cholestatic liver disorders."}, {"n": 15, "stem": "A patient with no prior history of ascites presents with a new distended abdomen and fluid wave. Which diagnostic procedure should be performed?", "choices": {"A": "Paracentesis", "B": "AFP measurement alone", "C": "Barium enema", "D": "Routine colonoscopy", "E": "Hydrogen breath test"}, "answer": "A", "explanation": "Every patient with new-onset ascites should undergo diagnostic paracentesis. Cirrhotic patients should also be tapped at each hospital admission for decompensation.", "topic": "Other Liver Diagnostics", "objective": "Objective 4 — Interpret diagnostic paracentesis, SAAG, and ascitic fluid findings including SBP."}, {"n": 16, "stem": "An older adult has halitosis, regurgitation of undigested food, coughing after meals, and recurrent aspiration pneumonia. Which lesion should be sought on a swallow study?", "choices": {"A": "Peptic esophageal stricture", "B": "Sigmoid volvulus", "C": "Schatzki ring", "D": "Zenker diverticulum", "E": "Barrett esophagus"}, "answer": "D", "explanation": "Zenker diverticulum arises posteriorly near the upper esophageal sphincter and causes regurgitation of undigested food, halitosis, cough, and aspiration.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 17, "stem": "In a patient with chronic hepatitis B, conversion from HBeAg to anti-HBe is generally associated with which change?", "choices": {"A": "New acute hepatitis A", "B": "Lower viral replication and infectivity", "C": "Mandatory progression to acute liver failure", "D": "Loss of all HBV antibodies", "E": "Development of vaccination immunity"}, "answer": "B", "explanation": "Loss of HBeAg with appearance of anti-HBe is generally associated with lower replication, lower infectivity, and less hepatic inflammation.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 18, "stem": "A patient with established cirrhosis has a MELD 3.0 score of 18. Which action is supported by the guide?", "choices": {"A": "No referral is needed until MELD reaches 40", "B": "Repeat MELD only after 5 years", "C": "Refer for liver transplant evaluation", "D": "Use AFP alone to determine prognosis", "E": "Replace MELD with a hydrogen breath test"}, "answer": "C", "explanation": "MELD 3.0 predicts roughly 3-month mortality and is used for transplant prioritization. MELD >=15 is a threshold for transplant evaluation.", "topic": "Other Liver Diagnostics", "objective": "Objective 3 — Interpret prognostic indicators in advanced liver disease, including MELD and Child-Turcotte-Pugh."}, {"n": 19, "stem": "On which abdominal radiograph positions can true air-fluid levels be assessed?", "choices": {"A": "MRI only", "B": "AP supine KUB without a horizontal beam", "C": "Any view equally", "D": "Upright/decubitus views", "E": "Supine view only"}, "answer": "D", "explanation": "Air-fluid levels require a horizontal beam and are seen on upright or decubitus films, not on a supine film.", "topic": "Abdominal Imaging", "objective": "Objective 2 — Select appropriate positioning for an acute abdominal series and horizontal-beam imaging."}, {"n": 20, "stem": "A patient with noncardiac chest pain and dysphagia to solids and liquids has a 'corkscrew' appearance on barium swallow. Which disorder is most consistent with this finding?", "choices": {"A": "Cervical esophageal web", "B": "Gastric outlet obstruction", "C": "Achalasia", "D": "Diffuse esophageal spasm", "E": "Barrett esophagus"}, "answer": "D", "explanation": "A corkscrew esophagus is the classic barium finding of diffuse esophageal spasm.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 21, "stem": "A cirrhotic patient with ascites develops fever and confusion. Paracentesis shows 330 PMNs/mm3. Which interpretation is correct?", "choices": {"A": "The finding indicates only portal hypertension", "B": "The SAAG must be repeated before treatment", "C": "Meets the SBP diagnostic threshold", "D": "SBP is excluded unless PMNs exceed 1,000/mm3", "E": "A positive Gram stain is required"}, "answer": "C", "explanation": "An ascitic PMN count >=250/mm3 or a positive culture meets the guide's diagnostic criterion for SBP. Cultures should be inoculated into blood culture bottles at the bedside.", "topic": "Other Liver Diagnostics", "objective": "Objective 4 — Interpret diagnostic paracentesis, SAAG, and ascitic fluid findings including SBP."}, {"n": 22, "stem": "Which statement about GGT is correct?", "choices": {"A": "It falls before any biliary obstruction occurs", "B": "It is the most liver-specific aminotransferase", "C": "It determines hepatocellular versus cholestatic injury by itself", "D": "A normal GGT proves acute viral hepatitis", "E": "Not on a standard CMP; helps clarify elevated AP"}, "answer": "E", "explanation": "GGT is not part of a CMP. It is useful when AP is elevated because high AP plus high GGT supports a hepatobiliary source, while normal GGT suggests a non-hepatic source.", "topic": "Interpretation of Liver Tests", "objective": "Objective 1 — Interpret AST, ALT, AP, GGT, bilirubin, albumin, and PT/INR and distinguish hepatocellular from cholestatic patterns."}, {"n": 23, "stem": "A patient has chronic diarrhea, weight loss, and iron deficiency anemia. Which initial serologic test should be ordered for suspected celiac disease?", "choices": {"A": "H. pylori serology", "B": "Anti-HCV antibody", "C": "Antimitochondrial antibody", "D": "IgA tTG antibody", "E": "Anti-HBc IgM"}, "answer": "D", "explanation": "IgA tTG is the first serologic test for suspected celiac disease, while the patient is still eating gluten. Positive serology is confirmed with duodenal biopsy showing villous atrophy and crypt hyperplasia.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 24, "stem": "Ultrasound elastography shows a faster shear-wave velocity through the liver. What does this imply?", "choices": {"A": "Portal pressure is definitely normal", "B": "The liver has less fibrosis", "C": "The patient has acute hepatitis A", "D": "The liver is stiffer and more fibrotic", "E": "The test is invalid unless bilirubin is elevated"}, "answer": "D", "explanation": "Elastography estimates fibrosis from liver stiffness: shear waves travel faster through denser, more fibrotic tissue. Accuracy is more limited in obesity.", "topic": "Other Liver Diagnostics", "objective": "Objective 2 — Use noninvasive fibrosis markers and elastography to estimate liver fibrosis."}, {"n": 25, "stem": "A middle-aged woman has iron deficiency anemia and intermittent dysphagia. Imaging shows a thin cervical esophageal mucosal fold. Which syndrome best fits this combination?", "choices": {"A": "Peptic stricture", "B": "Achalasia", "C": "Plummer-Vinson", "D": "Schatzki ring", "E": "Zenker diverticulum"}, "answer": "C", "explanation": "Plummer-Vinson is the triad of iron deficiency anemia, dysphagia, and a cervical esophageal web.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 26, "stem": "A patient has classic severe epigastric pain radiating to the back and a serum lipase four times the upper limit of normal. Which statement is correct?", "choices": {"A": "Daily lipase levels are required to track severity", "B": "The enzyme level excludes pancreatitis if imaging is normal", "C": "Supports acute pancreatitis; does not grade severity", "D": "The lipase value determines the Ranson score", "E": "A fourfold rise proves chronic pancreatitis"}, "answer": "C", "explanation": "Lipase >=3x ULN plus characteristic pain strongly supports acute pancreatitis. The degree of enzyme elevation does not correlate with severity and is not part of severity scores.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 27, "stem": "A hiker has persistent diarrhea after drinking untreated stream water. If stool ova and parasite testing is used, how should specimens be collected?", "choices": {"A": "One formed stool sample only", "B": "Two specimens collected on the same day", "C": "Daily samples for two weeks", "D": "Three samples on 3 separate days", "E": "A single blood culture"}, "answer": "D", "explanation": "O&P testing uses three samples on three days because parasites may be shed intermittently. It is not routine for uncomplicated acute diarrhea.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 28, "stem": "A 43-year-old woman with autoimmune thyroid disease has AST 290 U/L, ALT 410 U/L, AP 155 U/L, and elevated total protein with normal albumin. Which additional laboratory pattern is most supportive of autoimmune hepatitis?", "choices": {"A": "Normal GGT with isolated AP elevation", "B": "Low ceruloplasmin with Kayser-Fleischer rings", "C": "High transferrin saturation with low TIBC", "D": "Positive antimitochondrial antibody with marked AP elevation", "E": "Positive anti-smooth muscle antibody with elevated IgG"}, "answer": "E", "explanation": "Autoimmune hepatitis is typically hepatocellular and is associated with anti-smooth muscle antibody, ANA, and hypergammaglobulinemia with elevated IgG. Biopsy confirms it.", "topic": "Interpretation of Liver Tests", "objective": "Objective 2 — Identify key laboratory diagnostic clues for common hepatocellular and cholestatic liver disorders."}, {"n": 29, "stem": "A patient undergoes EGD for hematemesis. A peptic ulcer has a nonbleeding visible vessel. Which management principle from the endoscopy guide applies?", "choices": {"A": "A clean-based ulcer has the same rebleeding risk", "B": "No therapy is needed for a visible vessel", "C": "Endoscopic hemostasis is indicated", "D": "Colonoscopy is required before hemostasis", "E": "Barium swallow is preferred to treat the ulcer"}, "answer": "C", "explanation": "Ulcers with active bleeding, a nonbleeding visible vessel, or an adherent clot need endoscopic therapy. Clean-based ulcers do not.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 30, "stem": "Which organisms are typically identified by a routine stool culture in the guide?", "choices": {"A": "C. difficile, Giardia, and Shigella", "B": "Salmonella, Shigella, and Campylobacter", "C": "Giardia, Cryptosporidium, and Entamoeba", "D": "Yersinia, Vibrio, and Cryptosporidium", "E": "EHEC, Yersinia, and Vibrio only"}, "answer": "B", "explanation": "Routine stool culture generally covers Salmonella, Shigella, and Campylobacter. Other organisms may require special requests or molecular testing.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 31, "stem": "A 45-year-old man has fatigue, bronze skin, pain at the second and third MCP joints, and a family history of liver disease. Which screening pattern most supports hereditary hemochromatosis?", "choices": {"A": "High ferritin + transferrin saturation >45%", "B": "High AP with positive AMA", "C": "Low ceruloplasmin with otherwise normal iron studies", "D": "Low ferritin with high TIBC", "E": "Isolated indirect hyperbilirubinemia"}, "answer": "A", "explanation": "Hemochromatosis screening uses iron indices. A high ferritin plus transferrin saturation >45% supports the diagnosis and is followed by HFE genotype testing.", "topic": "Interpretation of Liver Tests", "objective": "Objective 2 — Identify key laboratory diagnostic clues for common hepatocellular and cholestatic liver disorders."}, {"n": 32, "stem": "An asymptomatic adult is being screened for hepatitis C. Which test is the usual initial screening test?", "choices": {"A": "Anti-HCV antibody", "B": "Anti-HBs", "C": "HCV RNA as the routine first screen", "D": "HCV-specific IgM", "E": "HBsAg with anti-HBc IgM"}, "answer": "A", "explanation": "The usual initial HCV test is anti-HCV antibody because it is less costly and easier to use. HCV RNA is then used to confirm active infection.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 33, "stem": "A pregnant traveler returns from an endemic region with a self-limited acute hepatitis syndrome after contaminated water exposure. Which viral hepatitis is especially associated with severe disease in pregnancy and has no chronic form?", "choices": {"A": "Hepatitis D alone", "B": "Hepatitis E", "C": "Hepatitis C", "D": "Chronic hepatitis B", "E": "Chronic hepatitis A"}, "answer": "B", "explanation": "Hepatitis E is fecal-oral, resembles hepatitis A, and is usually acute and self-limited. Pregnant patients are particularly susceptible to severe or fatal disease.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 34, "stem": "A patient has predominantly conjugated hyperbilirubinemia. Which associated clinical finding is most consistent with the chemistry?", "choices": {"A": "No urinary bilirubin because conjugated bilirubin is insoluble", "B": "Dark urine and pale stools", "C": "Isolated skeletal muscle pain", "D": "Normal-colored urine with dark stools only", "E": "A low AP caused by obstruction"}, "answer": "B", "explanation": "Conjugated bilirubin is water-soluble and can appear in urine, producing dark urine; impaired biliary excretion can also cause pale stools.", "topic": "Interpretation of Liver Tests", "objective": "Objective 1 — Interpret AST, ALT, AP, GGT, bilirubin, albumin, and PT/INR and distinguish hepatocellular from cholestatic patterns."}, {"n": 35, "stem": "A patient needs a liver biopsy but has massive ascites and significant coagulopathy. Which approach is preferred?", "choices": {"A": "FIB-4 scoring only", "B": "Ultrasound elastography", "C": "Transjugular liver biopsy", "D": "MR elastography only", "E": "Percutaneous liver biopsy"}, "answer": "C", "explanation": "Transjugular biopsy is preferred when the percutaneous route is risky, including massive ascites, morbid obesity, coagulopathy, or failed percutaneous biopsy.", "topic": "Other Liver Diagnostics", "objective": "Objective 1 — Select and interpret liver biopsy, including indications, route, and safety considerations."}, {"n": 36, "stem": "Why is lipase generally preferred over amylase for suspected acute pancreatitis?", "choices": {"A": "Lipase is never elevated outside the pancreas", "B": "Lipase always determines severity", "C": "Amylase remains elevated longer than lipase", "D": "Amylase is less pancreas-specific", "E": "Amylase cannot rise in pancreatitis"}, "answer": "D", "explanation": "Amylase is less specific because it can rise in parotitis/salivary disease and bowel perforation. Lipase is more pancreas-specific and remains elevated longer.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 37, "stem": "A patient has positive total anti-HAV and negative IgM anti-HAV. Which interpretation is most accurate?", "choices": {"A": "Remote HAV exposure or vaccination", "B": "The patient has active hepatitis C", "C": "The patient has acute hepatitis A", "D": "The patient has chronic hepatitis A", "E": "The patient is in the HBV window period"}, "answer": "A", "explanation": "Total anti-HAV is positive after any exposure or vaccination. A negative IgM anti-HAV argues against acute HAV; there is no chronic hepatitis A.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 38, "stem": "A 52-year-old woman reports months of fatigue and diffuse pruritus. AST is 62 U/L, ALT 76 U/L, and AP 835 U/L. Which test is most likely to support the leading diagnosis?", "choices": {"A": "HFE genotype testing", "B": "Serum alpha-1 antitrypsin", "C": "AMA", "D": "Anti-HAV IgM", "E": "Anti-HCV antibody alone"}, "answer": "C", "explanation": "Primary biliary cholangitis classically affects middle-aged women with fatigue, pruritus, and a marked cholestatic AP elevation. AMA is positive in about 90-100%.", "topic": "Interpretation of Liver Tests", "objective": "Objective 2 — Identify key laboratory diagnostic clues for common hepatocellular and cholestatic liver disorders."}, {"n": 39, "stem": "A patient has had HBsAg present for 9 months and anti-HBs remains absent. Which diagnosis is established by persistence of this marker?", "choices": {"A": "Acute hepatitis A", "B": "Resolved hepatitis B", "C": "Resolved hepatitis C", "D": "Chronic hepatitis B", "E": "Vaccination immunity"}, "answer": "D", "explanation": "Chronic HBV is defined by persistence of HBsAg for more than 6 months; anti-HBs is absent while infection remains active.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 40, "stem": "A 38-year-old nonsmoker has emphysema and unexplained liver disease. Which test best fits the diagnostic clue provided by this combination?", "choices": {"A": "Anti-HAV IgM", "B": "Ferritin with transferrin saturation", "C": "Serum CA 19-9", "D": "Serum A1AT level", "E": "Fecal elastase-1"}, "answer": "D", "explanation": "Alpha-1 antitrypsin deficiency should be considered with liver disease plus early emphysema, especially in a younger nonsmoker. A low serum alpha-1 antitrypsin level supports the diagnosis.", "topic": "Interpretation of Liver Tests", "objective": "Objective 2 — Identify key laboratory diagnostic clues for common hepatocellular and cholestatic liver disorders."}, {"n": 41, "stem": "A plain abdominal film shows a single localized dilated bowel loop in the RUQ adjacent to an inflamed organ. Which inflammatory process is most consistent with this sentinel loop location?", "choices": {"A": "Appendicitis", "B": "Cholecystitis", "C": "Diverticulitis", "D": "Acute pancreatitis", "E": "Sigmoid volvulus"}, "answer": "B", "explanation": "A sentinel loop is a localized ileus next to inflammation. The guide maps RUQ sentinel loops to cholecystitis, LUQ/epigastric to pancreatitis, RLQ to appendicitis, and LLQ to diverticulitis.", "topic": "Abdominal Imaging", "objective": "Objective 5 — Recognize classic plain-film signs and their associated pathology."}, {"n": 42, "stem": "A patient develops acute inflammatory diarrhea after eating raw shellfish. Which special-order stool pathogen is most closely associated with this exposure?", "choices": {"A": "Vibrio parahaemolyticus", "B": "E. histolytica only", "C": "Giardia lamblia", "D": "C. difficile", "E": "Yersinia enterocolitica"}, "answer": "A", "explanation": "Raw shellfish exposure is a classic clue for Vibrio parahaemolyticus, which may require a special-order stool culture.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 43, "stem": "A patient with long-standing chronic pancreatitis develops bulky oily stools. Which statement best explains the significance of steatorrhea in this setting?", "choices": {"A": "It means lipase must be markedly elevated", "B": "It excludes fat malabsorption", "C": "It occurs early before pancreatic damage develops", "D": "It proves acute pancreatitis is severe", "E": "Usually appears after >90% exocrine loss"}, "answer": "E", "explanation": "Steatorrhea is a late finding in chronic pancreatitis and generally implies >90% loss of exocrine pancreatic function.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 44, "stem": "A pediatric patient has suspected gastric outlet obstruction, but sedation is undesirable. Which study best evaluates the esophagus, stomach, and duodenum without sedation?", "choices": {"A": "Flexible sigmoidoscopy", "B": "Upper GI series", "C": "Colonoscopy", "D": "Modified barium swallow", "E": "HIDA scan"}, "answer": "B", "explanation": "An upper GI series is mainly a gastric study that follows contrast through the esophagus, stomach, and duodenum. It is useful for suspected gastric pathology and is used more often in pediatrics.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 45, "stem": "A hospitalized patient develops watery diarrhea 5 days after receiving antibiotics. Which specimen is appropriate for C. difficile testing?", "choices": {"A": "Gastric biopsy only", "B": "Unformed stool", "C": "Three O&P specimens first", "D": "Serum only", "E": "A formed stool sample"}, "answer": "B", "explanation": "C. difficile testing should be performed on unformed stool. Formed-stool positives are more likely to represent asymptomatic colonization.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 46, "stem": "A patient with chronic abdominal discomfort is thought to have IBS, but stool guaiac testing is positive. Which interpretation is most appropriate?", "choices": {"A": "A positive FOBT is expected in uncomplicated IBS", "B": "Oral iron is the most likely cause of the positive test", "C": "The finding argues against IBS", "D": "The result proves lactose intolerance", "E": "The result rules out inflammatory bowel disease"}, "answer": "C", "explanation": "Blood in stool is not a feature of IBS. FOBT positivity can reflect occult GI bleeding, invasive/inflammatory diarrhea, or IBD.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 47, "stem": "A 20-year-old has unexplained liver disease, mood changes, tremor, and corneal rings on slit-lamp examination. Which initial laboratory test is most appropriate?", "choices": {"A": "Serum GGT only", "B": "Antimitochondrial antibody", "C": "Fecal elastase-1", "D": "HFE genotype testing", "E": "Serum ceruloplasmin"}, "answer": "E", "explanation": "Wilson disease should be suspected in a young patient with liver disease plus neurologic or psychiatric findings. Ceruloplasmin is typically low; hepatic copper on liver biopsy is the criterion standard.", "topic": "Interpretation of Liver Tests", "objective": "Objective 2 — Identify key laboratory diagnostic clues for common hepatocellular and cholestatic liver disorders."}, {"n": 48, "stem": "A patient with established cirrhosis asks how hepatocellular carcinoma should be surveilled. Which plan matches the guide?", "choices": {"A": "Liver US every 6 months ± AFP", "B": "AFP alone every year", "C": "No screening until symptoms develop", "D": "CT abdomen every month", "E": "Colonoscopy every 6 months"}, "answer": "A", "explanation": "All cirrhotic patients should have liver ultrasound every 6 months, with or without AFP. AFP alone is not recommended because of poor sensitivity and specificity.", "topic": "Other Liver Diagnostics", "objective": "Objective 5 — Apply hepatocellular carcinoma surveillance recommendations in cirrhosis."}, {"n": 49, "stem": "A patient with chronic hepatitis B is HBeAg positive. What does this finding generally indicate?", "choices": {"A": "Absence of HBV DNA", "B": "Lower hepatic inflammation", "C": "Resolved infection with lifelong immunity", "D": "High viral replication and infectivity", "E": "Successful vaccination"}, "answer": "D", "explanation": "In chronic HBV, HBeAg positivity generally correlates with active viral replication, greater infectivity, and more ongoing liver injury.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 50, "stem": "An abdominal radiograph shows centrally located dilated loops with closely spaced folds that cross the entire lumen. Which bowel segment is being visualized?", "choices": {"A": "Gallbladder", "B": "Large bowel", "C": "Small bowel", "D": "Stomach only", "E": "Rectum only"}, "answer": "C", "explanation": "Small bowel is typically central and has valvulae conniventes that cross the full lumen. Large bowel is more peripheral and has haustra that do not cross the entire lumen.", "topic": "Abdominal Imaging", "objective": "Objective 1 — Identify normal anatomy and distinguish small from large bowel on abdominal plain films."}, {"n": 51, "stem": "RUQ ultrasound shows echogenic mobile material in the gallbladder with posterior acoustic shadowing. Which finding does this most strongly indicate?", "choices": {"A": "Portal venous gas", "B": "Pancreatic calcification", "C": "Free intraperitoneal air", "D": "Biliary sludge only", "E": "Gallstones"}, "answer": "E", "explanation": "Gallstones are echogenic and cast posterior acoustic shadowing. Sludge does not cast a shadow.", "topic": "Abdominal Imaging", "objective": "Objective 6 — Differentiate RUQ ultrasound from HIDA scanning for biliary tract disease."}, {"n": 52, "stem": "A 62-year-old has CT-confirmed acute diverticulitis with fever and LLQ pain. Which procedure should be avoided during the acute episode?", "choices": {"A": "Supportive management", "B": "CT abdomen/pelvis", "C": "Routine blood testing", "D": "Colonoscopy", "E": "Later interval colon evaluation"}, "answer": "D", "explanation": "Colonoscopy is contraindicated with suspected acute diverticulitis because of perforation risk. Fulminant colitis/toxic megacolon and known perforation are also key contraindications.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 53, "stem": "A patient has progressive dysphagia to both solids and liquids with regurgitation. A contrast study shows a distal 'bird's beak.' Which diagnosis is most likely?", "choices": {"A": "Zenker diverticulum", "B": "Achalasia", "C": "Schatzki ring", "D": "Peptic stricture", "E": "Diffuse esophageal spasm"}, "answer": "B", "explanation": "The 'bird's beak' appearance on barium swallow is classic for achalasia. Manometry then confirms aperistalsis and incomplete LES relaxation.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 54, "stem": "Same-day serum albumin is 3.2 g/dL and ascitic fluid albumin is 1.6 g/dL. What does the SAAG indicate?", "choices": {"A": "Portal hypertension is likely", "B": "The result requires a repeat SAAG tomorrow", "C": "Portal hypertension is excluded", "D": "SBP is diagnosed", "E": "The gradient is too low to interpret"}, "answer": "A", "explanation": "SAAG = serum albumin - ascitic albumin = 1.6 g/dL. A SAAG >=1.1 g/dL indicates portal hypertension with high accuracy.", "topic": "Other Liver Diagnostics", "objective": "Objective 4 — Interpret diagnostic paracentesis, SAAG, and ascitic fluid findings including SBP."}, {"n": 55, "stem": "A patient develops bloody diarrhea after eating undercooked beef. Which organism should be specifically requested, and what treatment pitfall is emphasized?", "choices": {"A": "Giardia lamblia; avoid antiparasitic therapy", "B": "E. coli O157:H7; avoid antibiotics because of HUS risk", "C": "C. difficile; test only formed stool", "D": "Vibrio parahaemolyticus; avoid all fluid replacement", "E": "Yersinia enterocolitica; give antibiotics to prevent HUS"}, "answer": "B", "explanation": "Bloody diarrhea after undercooked beef should prompt special testing for EHEC O157:H7. The guide warns that antibiotics can increase the risk of HUS.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 56, "stem": "A health care worker had a known HCV exposure 3 weeks ago. Anti-HCV is negative, but concern remains for very early infection. Which test can become positive before antibody seroconversion?", "choices": {"A": "Anti-HBs", "B": "Anti-HCV IgM only", "C": "Anti-HBe", "D": "IgM anti-HAV", "E": "HCV RNA"}, "answer": "E", "explanation": "HCV RNA can be detected about 2-3 weeks after infection, before anti-HCV becomes detectable. Anti-HCV may take up to about 6 weeks to appear.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 57, "stem": "According to the 3/6/9 rule, which bowel diameter is abnormal and carries high perforation risk when exceeded?", "choices": {"A": "Small bowel greater than 1 cm", "B": "Colon greater than 3 cm", "C": "Stomach greater than 6 cm", "D": "Cecum greater than 9 cm", "E": "Cecum greater than 4 cm"}, "answer": "D", "explanation": "The 3/6/9 rule is small bowel >3 cm, colon >6 cm, and cecum >9 cm. Cecal dilation beyond 9 cm carries high perforation risk.", "topic": "Abdominal Imaging", "objective": "Objective 3 — Recognize abnormal bowel gas patterns, obstruction, ileus, and free intraperitoneal air."}, {"n": 58, "stem": "A patient's anti-HCV screening test is positive. Which next test determines whether active hepatitis C infection is present?", "choices": {"A": "HCV RNA by PCR", "B": "Total anti-HBc", "C": "Anti-HAV IgM", "D": "HBeAg only", "E": "Anti-HBs"}, "answer": "A", "explanation": "A positive anti-HCV can reflect current or resolved infection and can occasionally be false positive. Detectable HCV RNA definitively establishes active infection.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 59, "stem": "A 39-year-old woman with obesity, hypertension, hypertriglyceridemia, and type 2 diabetes has AST 82 U/L, ALT 108 U/L, and normal AP. She has no symptoms. Which diagnosis best fits this pattern?", "choices": {"A": "Hemolytic anemia", "B": "Extrahepatic biliary obstruction", "C": "Alcohol-related hepatitis", "D": "Primary biliary cholangitis", "E": "MASLD (formerly NAFLD)"}, "answer": "E", "explanation": "MASLD is the most common cause of asymptomatic mild aminotransferase elevation in the US and typically has a hepatocellular pattern with AST/ALT <1.", "topic": "Interpretation of Liver Tests", "objective": "Objective 2 — Identify key laboratory diagnostic clues for common hepatocellular and cholestatic liver disorders."}, {"n": 60, "stem": "A patient with chronic liver disease has a FIB-4 score of 1.1. How should this result be interpreted using the guide's hepatitis C cutoffs?", "choices": {"A": "Indeterminate; biopsy is mandatory now", "B": "Diagnostic of portal hypertension", "C": "Diagnostic of cirrhosis", "D": "Low risk; advanced fibrosis unlikely", "E": "High risk for advanced fibrosis"}, "answer": "D", "explanation": "A FIB-4 <1.45 is low risk and essentially excludes advanced fibrosis; 1.45-3.25 is indeterminate and >3.25 is high risk in the cited hepatitis C cutoffs.", "topic": "Other Liver Diagnostics", "objective": "Objective 2 — Use noninvasive fibrosis markers and elastography to estimate liver fibrosis."}, {"n": 61, "stem": "A patient with recent hepatitis symptoms is tested late. HBsAg is negative and anti-HBs is not yet detectable, but anti-HBc IgM is positive. Which phase is this?", "choices": {"A": "Vaccination immunity", "B": "HBV window period", "C": "Resolved hepatitis B", "D": "Chronic hepatitis B", "E": "Resolved hepatitis C"}, "answer": "B", "explanation": "During the HBV window period, HBsAg has disappeared before anti-HBs appears. IgM anti-HBc remains detectable and can make the diagnosis.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 62, "stem": "Which condition is a major contraindication to EGD?", "choices": {"A": "Suspected GI perforation", "B": "A history of dysphagia", "C": "Uncomplicated GERD", "D": "Barrett surveillance", "E": "Stable iron deficiency anemia"}, "answer": "A", "explanation": "Known or suspected perforation and medical instability are major contraindications to EGD; recent head or neck surgery is a relative contraindication.", "topic": "Upper & Lower GI Imaging and GI Endoscopy", "objective": "Objective 1 — Differentiate GI contrast studies and endoscopy by indications, preparation, contraindications, complications, and major findings."}, {"n": 63, "stem": "Which laboratory value should NOT be used to decide whether liver injury is hepatocellular or cholestatic?", "choices": {"A": "AST", "B": "Alkaline phosphatase", "C": "ALT", "D": "The relative AST/ALT/AP pattern", "E": "Bilirubin"}, "answer": "E", "explanation": "The Big Three - AST, ALT, and AP - determine the injury pattern. Bilirubin may rise in either pattern and does not categorize it.", "topic": "Interpretation of Liver Tests", "objective": "Objective 1 — Interpret AST, ALT, AP, GGT, bilirubin, albumin, and PT/INR and distinguish hepatocellular from cholestatic patterns."}, {"n": 64, "stem": "A 34-year-old returns from travel with nausea, jaundice, dark urine, and RUQ tenderness. Which single serologic test establishes acute hepatitis A?", "choices": {"A": "HBsAg", "B": "Anti-HCV antibody", "C": "IgM anti-HAV", "D": "Anti-HBs", "E": "Total anti-HAV only"}, "answer": "C", "explanation": "Selective IgM anti-HAV testing establishes acute hepatitis A. Total anti-HAV is positive after acute infection, remote infection, or vaccination and therefore is not specific for acute disease.", "topic": "Viral Hepatitis Serologies", "objective": "Objective 1 — Interpret hepatitis A, B, C, D, and E serologies/viral markers and distinguish acute, chronic, resolved, and immune states."}, {"n": 65, "stem": "A patient has sudden flank pain radiating to the groin with hematuria. Which imaging study is the test of choice?", "choices": {"A": "Barium swallow", "B": "HIDA scan", "C": "Noncontrast stone-protocol CT", "D": "CT with oral contrast only", "E": "RUQ ultrasound for gallstones"}, "answer": "C", "explanation": "Renal stone evaluation is the major CT exception: use a noncontrast stone-protocol CT. KUB is only about 50-60% sensitive and misses uric acid stones.", "topic": "Abdominal Imaging", "objective": "Objective 7 — Select the imaging procedure of choice for common suspected abdominal diagnoses."}, {"n": 66, "stem": "A 48-year-old with suspected peptic ulcer disease has no alarm features. Which noninvasive test is preferred to evaluate for H. pylori and can later be used to confirm eradication?", "choices": {"A": "H. pylori antibody serology alone", "B": "FOBT alone", "C": "Hydrogen breath test for lactose malabsorption", "D": "Routine stool culture", "E": "Stool antigen or urea breath test"}, "answer": "E", "explanation": "Stool antigen and urea breath tests are preferred noninvasive H. pylori tests and can also document eradication. Serology is discouraged because antibodies remain positive for years.", "topic": "Lab Evaluation of GI Disease", "objective": "Objective 1 — Select and interpret laboratory tests commonly used in the evaluation of GI disease."}, {"n": 67, "stem": "A previously healthy adult develops severe acute hepatic injury, INR 2.1, and new confusion over 5 days. There is no known chronic liver disease. Which diagnosis is most consistent with this combination?", "choices": {"A": "Gilbert syndrome", "B": "Acute liver failure", "C": "Isolated cholestasis", "D": "Compensated cirrhosis", "E": "Uncomplicated chronic hepatitis"}, "answer": "B", "explanation": "Acute liver failure is severe acute liver injury with INR >1.5 and hepatic encephalopathy in a patient without preexisting liver disease, developing within less than about 26 weeks.", "topic": "Other Liver Diagnostics", "objective": "Objective 3 — Interpret prognostic indicators in advanced liver disease, including MELD and Child-Turcotte-Pugh."}, {"n": 68, "stem": "An elderly institutionalized man with chronic constipation has massive abdominal distention. A radiograph shows a large U-shaped 'coffee bean' loop arising from the pelvis. What is the diagnosis?", "choices": {"A": "Sigmoid volvulus", "B": "Intussusception", "C": "Generalized ileus", "D": "Small bowel adhesions", "E": "Acute pancreatitis"}, "answer": "A", "explanation": "The coffee bean sign is classic for sigmoid volvulus, especially in older institutionalized patients with chronic constipation.", "topic": "Abdominal Imaging", "objective": "Objective 5 — Recognize classic plain-film signs and their associated pathology."}, {"n": 69, "stem": const byNum = Object.fromEntries(QUESTIONS.map(q => [q.n, q]));
const state = {
  current: 1,
  selected: {},
  gradedOnce: false,
  reviewMode: false,
  reviewList: [],
  reviewIndex: 0
};

function currentQuestion() {
  if (state.reviewMode) return byNum[state.reviewList[state.reviewIndex]];
  return byNum[state.current];
}

function render() {
  const q = currentQuestion();
  document.getElementById('qnum').textContent = `Question ${q.n}`;
  document.getElementById('stem').textContent = q.stem;
  const choices = document.getElementById('choices');
  choices.innerHTML = '';
  const selected = state.selected[q.n];
  for (const letter of ['A','B','C','D','E']) {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="letter">${letter}.</span><span>${escapeHtml(q.choices[letter])}</span>`;
    if (selected) {
      b.classList.add('locked');
      if (letter === q.answer) b.classList.add('correct');
      if (letter === selected && selected !== q.answer) b.classList.add('incorrect');
      b.disabled = true;
    } else {
      b.onclick = () => selectAnswer(letter);
    }
    choices.appendChild(b);
  }
  renderFeedback(q);
  const answered = Object.keys(state.selected).length;
  document.getElementById('answeredCount').textContent = `${answered} answered`;
  document.getElementById('status').textContent = state.reviewMode
    ? `Missed review ${state.reviewIndex+1} of ${state.reviewList.length}`
    : `Question ${q.n} of 100`;
  const p = state.reviewMode ? ((state.reviewIndex+1)/Math.max(1,state.reviewList.length))*100 : (q.n/100)*100;
  document.getElementById('progress').style.width = `${p}%`;
  document.getElementById('prevBtn').disabled = state.reviewMode ? state.reviewIndex === 0 : q.n === 1;
  document.getElementById('nextBtn').disabled = state.reviewMode ? state.reviewIndex >= state.reviewList.length-1 : q.n === 100;
  document.getElementById('reviewBanner').classList.toggle('show', state.reviewMode);
}

function selectAnswer(letter) {
  const q = currentQuestion();
  if (state.selected[q.n]) return;
  state.selected[q.n] = letter;
  render();
}

function renderFeedback(q) {
  const box = document.getElementById('feedback');
  const selected = state.selected[q.n];
  if (!selected) {
    box.className = 'feedback';
    box.innerHTML = '';
    return;
  }
  const isCorrect = selected === q.answer;
  box.className = `feedback show ${isCorrect ? 'good' : 'bad'}`;
  box.innerHTML =
    `<strong>${isCorrect ? 'Correct' : 'Incorrect'}.</strong> ` +
    `Correct answer: <strong>${q.answer}. ${escapeHtml(q.choices[q.answer])}</strong><br>` +
    `${escapeHtml(q.explanation)}` +
    `<div class="obj"><strong>${escapeHtml(q.topic)}</strong> — ${escapeHtml(q.objective)}</div>`;
}

function goNext() {
  if (state.reviewMode) {
    if (state.reviewIndex < state.reviewList.length-1) state.reviewIndex++;
  } else if (state.current < 100) state.current++;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goPrev() {
  if (state.reviewMode) {
    if (state.reviewIndex > 0) state.reviewIndex--;
  } else if (state.current > 1) state.current--;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function calculateScore(answeredOnly=true) {
  const answeredNums = Object.keys(state.selected).map(Number);
  const denomNums = answeredOnly ? answeredNums : QUESTIONS.map(q => q.n);
  let correct = 0;
  for (const n of denomNums) if (state.selected[n] === byNum[n].answer) correct++;
  return {correct, total: denomNums.length, answered: answeredNums.length};
}

function showResults(answeredOnly=true) {
  state.gradedOnce = true;
  const s = calculateScore(answeredOnly);
  const pct = s.total ? Math.round((s.correct/s.total)*1000)/10 : 0;
  document.getElementById('scorePct').textContent = `${pct}%`;
  document.getElementById('scoreRaw').textContent = `${s.correct} / ${s.total}`;
  document.getElementById('answeredRaw').textContent = `${s.answered} / 100`;

  const topicGrid = document.getElementById('topicGrid');
  const topics = [...new Set(QUESTIONS.map(q => q.topic))];
  topicGrid.innerHTML = '';
  for (const topic of topics) {
    const qs = QUESTIONS.filter(q => q.topic === topic && state.selected[q.n]);
    const c = qs.filter(q => state.selected[q.n] === q.answer).length;
    const pctT = qs.length ? Math.round(c/qs.length*100) : 0;
    const d = document.createElement('div');
    d.className='topic';
    d.innerHTML = `<b>${escapeHtml(topic)}</b>${c} / ${qs.length} correct (${pctT}%)`;
    topicGrid.appendChild(d);
  }
  document.getElementById('results').classList.add('show');

  const missed = QUESTIONS.filter(q => state.selected[q.n] && state.selected[q.n] !== q.answer).map(q => q.n);
  state.reviewList = missed;
  document.getElementById('reviewBtn').disabled = missed.length === 0;
  document.getElementById('copyBtn').disabled = missed.length === 0;
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
}

function gradeCompleted() {
  showResults(true);
}

function finishExam() {
  showResults(false);
}

function toggleReview() {
  if (!state.reviewMode) {
    if (!state.reviewList.length) return;
    state.reviewMode = true;
    state.reviewIndex = 0;
  } else {
    state.reviewMode = false;
  }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

async function copyMissed() {
  const missed = QUESTIONS.filter(q => state.selected[q.n] && state.selected[q.n] !== q.answer);
  if (!missed.length) return;
  const text = missed.map(q => {
    const opts = ['A','B','C','D','E'].map(l => `${l}. ${q.choices[l]}`).join('\n');
    return `Question ${q.n}\n${q.stem}\n${opts}\nYour answer: ${state.selected[q.n]}. ${q.choices[state.selected[q.n]]}\nCorrect answer: ${q.answer}. ${q.choices[q.answer]}\n${q.topic} — ${q.objective}\nExplanation: ${q.explanation}`;
  }).join('\n\n--------------------\n\n');
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copyBtn');
    const old = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>btn.textContent=old, 1400);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
}

render();
</script>
