l staging; ± radiation."}, {"id": "16", "group": 16, "section": "GYN Malignancies", "objective": "Cervical · vulvar · vaginal", "stem": "Postcoital bleeding and watery discharge → Cancer to rule out:", "options": [{"letter": "A", "text": "Endometrial carcinoma"}, {"letter": "B", "text": "Cervical carcinoma"}, {"letter": "C", "text": "Ovarian carcinoma"}, {"letter": "D", "text": "Vulvar carcinoma"}], "answer": "B", "explanation": "Cervicitis is more common, but contact bleeding = cervical cancer until proven otherwise."}, {"id": "16a", "group": 16, "section": "GYN Malignancies", "objective": "Cervical · vulvar · vaginal", "stem": "Cervical cancer → Principal cause:", "options": [{"letter": "A", "text": "Unopposed estrogen"}, {"letter": "B", "text": "Lichen sclerosus"}, {"letter": "C", "text": "BRCA mutation"}, {"letter": "D", "text": "HPV 16/18"}], "answer": "D", "explanation": "CIN precedes invasion by ~10 years; only GYN cancer with population screening."}, {"id": "16b", "group": 16, "section": "GYN Malignancies", "objective": "Cervical · vulvar · vaginal", "stem": "Cervical cancer invading the parametria (IIB) → Treatment:", "options": [{"letter": "A", "text": "Simple hysterectomy"}, {"letter": "B", "text": "Radical hysterectomy"}, {"letter": "C", "text": "Cone biopsy"}, {"letter": "D", "text": "Chemoradiation"}], "answer": "D", "explanation": "IIA → radical hysterectomy; IIB+ → chemoradiation, not surgery."}, {"id": "16c", "group": 16, "section": "GYN Malignancies", "objective": "Cervical · vulvar · vaginal", "stem": "Elderly woman, chronic vulvar itch, lichen sclerosus, persistent labial plaque → Next step:", "options": [{"letter": "A", "text": "Antifungal cream"}, {"letter": "B", "text": "Vulvar biopsy"}, {"letter": "C", "text": "Topical steroid trial"}, {"letter": "D", "text": "Reassurance"}], "answer": "B", "explanation": "Vulvar cancer — don't keep treating as dermatitis."}, {"id": "17", "group": 17, "section": "GYN Malignancies", "objective": "Ovarian carcinoma", "stem": "63-year-old, constant bloating, early satiety, ascites → Suspected diagnosis:", "options": [{"letter": "A", "text": "Cervical carcinoma"}, {"letter": "B", "text": "Leiomyoma"}, {"letter": "C", "text": "Ovarian carcinoma"}, {"letter": "D", "text": "Endometrial carcinoma"}], "answer": "C", "explanation": "'Silent' cancer; 5th cause of cancer death."}, {"id": "17a", "group": 17, "section": "GYN Malignancies", "objective": "Ovarian carcinoma", "stem": "Suspected ovarian cancer → Initial workup:", "options": [{"letter": "A", "text": "TVUS + CA-125"}, {"letter": "B", "text": "Endometrial biopsy"}, {"letter": "C", "text": "Pap smear"}, {"letter": "D", "text": "Colposcopy"}], "answer": "A", "explanation": "Then CT/MRI; definitive diagnosis and staging at laparotomy."}, {"id": "17b", "group": 17, "section": "GYN Malignancies", "objective": "Ovarian carcinoma", "stem": "Average-risk woman asks for ovarian cancer screening → Recommendation:", "options": [{"letter": "A", "text": "CA-125 + TVUS yearly"}, {"letter": "B", "text": "No routine screening"}, {"letter": "C", "text": "Annual CA-125"}, {"letter": "D", "text": "Annual TVUS"}], "answer": "B", "explanation": "False positives → unnecessary surgery. CA-125 = monitoring after treatment."}, {"id": "18", "group": 18, "section": "Benign GYN Neoplasms", "objective": "Fibroid vs polyp vs adnexal mass", "stem": "40-year-old, heavy prolonged menses, firm irregular 'cobblestone' uterus → Diagnosis:", "options": [{"letter": "A", "text": "Leiomyoma"}, {"letter": "B", "text": "Endometrial carcinoma"}, {"letter": "C", "text": "Adenomyosis"}, {"letter": "D", "text": "Endometrial polyp"}], "answer": "A", "explanation": "MC benign pelvic tumor; estrogen-driven; MC reason for hysterectomy."}, {"id": "18a", "group": 18, "section": "Benign GYN Neoplasms", "objective": "Fibroid vs polyp vs adnexal mass", "stem": "Suspected leiomyoma → First test:", "options": [{"letter": "A", "text": "Pelvic MRI"}, {"letter": "B", "text": "Hysterosalpingogram"}, {"letter": "C", "text": "Transvaginal ultrasound"}, {"letter": "D", "text": "CA-125"}], "answer": "C", "explanation": "MRI only for surgical planning."}, {"id": "18b", "group": 18, "section": "Benign GYN Neoplasms", "objective": "Fibroid vs polyp vs adnexal mass", "stem": "Symptomatic fibroids, wants future pregnancy → Procedure:", "options": [{"letter": "A", "text": "Myomectomy"}, {"letter": "B", "text": "Hysterectomy"}, {"letter": "C", "text": "Uterine artery embolization"}, {"letter": "D", "text": "Endometrial ablation"}], "answer": "A", "explanation": "UAE impairs fertility; hysterectomy is definitive."}, {"id": "18c", "group": 18, "section": "Benign GYN Neoplasms", "objective": "Fibroid vs polyp vs adnexal mass", "stem": "Light intermenstrual bleeding in a postmenopausal woman on tamoxifen → Likely lesion:", "options": [{"letter": "A", "text": "Endometrial polyp"}, {"letter": "B", "text": "Adenomyosis"}, {"letter": "C", "text": "Leiomyoma"}, {"letter": "D", "text": "Cervical ectropion"}], "answer": "A", "explanation": "Also HRT, obesity. TVUS can miss polyps."}, {"id": "18d", "group": 18, "section": "Benign GYN Neoplasms", "objective": "Fibroid vs polyp vs adnexal mass", "stem": "Symptomatic endometrial polyp → Diagnosis and treatment:", "options": [{"letter": "A", "text": "Observation"}, {"letter": "B", "text": "Uterine artery embolization"}, {"letter": "C", "text": "Hysteroscopic polypectomy"}, {"letter": "D", "text": "GnRH agonist"}], "answer": "C", "explanation": "Removal mandated if symptomatic or postmenopausal — get tissue."}, {"id": "19", "group": 19, "section": "Breast", "objective": "Benign breast — buzzword → move", "stem": "Cyclic bilateral tender breast lumpiness, worse premenstrually → Diagnosis:", "options": [{"letter": "A", "text": "Fibroadenoma"}, {"letter": "B", "text": "Breast cancer"}, {"letter": "C", "text": "Mastitis"}, {"letter": "D", "text": "Fibrocystic changes"}], "answer": "D", "explanation": "MC benign breast condition — supportive bra, NSAIDs, ↓ caffeine."}, {"id": "19a", "group": 19, "section": "Breast", "objective": "Benign breast — buzzword → move", "stem": "22-year-old, solitary rubbery, well-circumscribed, freely mobile mass → Diagnosis:", "options": [{"letter": "A", "text": "Fat necrosis"}, {"letter": "B", "text": "Fibroadenoma"}, {"letter": "C", "text": "Phyllodes tumor"}, {"letter": "D", "text": "Breast cyst"}], "answer": "B", "explanation": "MC benign tumor."}, {"id": "19b", "group": 19, "section": "Breast", "objective": "Benign breast — buzzword → move", "stem": "'Fibroadenoma' that grows rapidly and becomes large → Diagnosis:", "options": [{"letter": "A", "text": "Fibrocystic change"}, {"letter": "B", "text": "Intraductal papilloma"}, {"letter": "C", "text": "Lipoma"}, {"letter": "D", "text": "Phyllodes tumor"}], "answer": "D", "explanation": "Wide excision with negative margins."}, {"id": "19c", "group": 19, "section": "Breast", "objective": "Benign breast — buzzword → move", "stem": "Breastfeeding, 3 weeks postpartum, red tender wedge + fever → Treatment:", "options": [{"letter": "A", "text": "Incision and drainage"}, {"letter": "B", "text": "Dicloxacillin, keep breastfeeding"}, {"letter": "C", "text": "Dicloxacillin, stop breastfeeding"}, {"letter": "D", "text": "Warm compresses alone"}], "answer": "B", "explanation": "Mastitis — S. aureus; no massage."}, {"id": "19d", "group": 19, "section": "Breast", "objective": "Benign breast — buzzword → move", "stem": "'Mastitis' not improving on antibiotics; peau d'orange, no discrete lump → Next step:", "options": [{"letter": "A", "text": "Repeat ultrasound"}, {"letter": "B", "text": "Biopsy"}, {"letter": "C", "text": "Warm compresses"}, {"letter": "D", "text": "Second antibiotic course"}], "answer": "B", "explanation": "Inflammatory breast cancer — T4, poor prognosis."}, {"id": "20", "group": 20, "section": "Breast", "objective": "Nipple discharge & gynecomastia", "stem": "Spontaneous, bloody, unilateral nipple discharge → Next step:", "options": [{"letter": "A", "text": "Prolactin level"}, {"letter": "B", "text": "Surgical referral"}, {"letter": "C", "text": "Reassurance"}, {"letter": "D", "text": "Pituitary MRI"}], "answer": "B", "explanation": "Imaging → duct excision (intraductal papilloma vs cancer)."}, {"id": "20a", "group": 20, "section": "Breast", "objective": "Nipple discharge & gynecomastia", "stem": "Bilateral milky nipple discharge, not pregnant or lactating → Labs:", "options": [{"letter": "A", "text": "Prolactin + TSH"}, {"letter": "B", "text": "CA 15-3"}, {"letter": "C", "text": "Estradiol + FSH"}, {"letter": "D", "text": "Cortisol"}], "answer": "A", "explanation": "Pituitary MRI only if prolactin is elevated."}, {"id": "20b", "group": 20, "section": "Breast", "objective": "Nipple discharge & gynecomastia", "stem": "Crusted, scaly, oozing nipple and areola → Diagnosis:", "options": [{"letter": "A", "text": "Eczema"}, {"letter": "B", "text": "Mastitis"}, {"letter": "C", "text": "Intraductal papilloma"}, {"letter": "D", "text": "Paget's disease of the breast"}], "answer": "D", "explanation": "Underlying DCIS or invasive ductal carcinoma."}, {"id": "20c", "group": 20, "section": "Breast", "objective": "Nipple discharge & gynecomastia", "stem": "Man on spironolactone, tender rubbery disc concentric beneath the nipple → Diagnosis:", "options": [{"letter": "A", "text": "Male breast cancer"}, {"letter": "B", "text": "Gynecomastia"}, {"letter": "C", "text": "Lipoma"}, {"letter": "D", "text": "Pseudogynecomastia"}], "answer": "B", "explanation": "Rule out cancer (eccentric, hard), then stop the culprit drug."}, {"id": "21", "group": 21, "section": "Breast", "objective": "Breast cancer — present, image, treat by receptor", "stem": "58-year-old, painless hard fixed irregular breast mass → Imaging:", "options": [{"letter": "A", "text": "Whole-body PET scan"}, {"letter": "B", "text": "Diagnostic mammogram + ultrasound"}, {"letter": "C", "text": "Screening mammogram alone"}, {"letter": "D", "text": "Breast ultrasound alone"}], "answer": "B", "explanation": "Then core needle biopsy for tissue."}, {"id": "21a", "group": 21, "section": "Breast", "objective": "Breast cancer — present, image, treat by receptor", "stem": "ER-positive breast cancer, premenopausal → Endocrine therapy:", "options": [{"letter": "A", "text": "Trastuzumab"}, {"letter": "B", "text": "Tamoxifen"}, {"letter": "C", "text": "None"}, {"letter": "D", "text": "Aromatase inhibitor alone"}], "answer": "B", "explanation": "AIs alone don't work premenopausally (ovaries still make estrogen)."}, {"id": "21b", "group": 21, "section": "Breast", "objective": "Breast cancer — present, image, treat by receptor", "stem": "HER2-positive breast cancer → Targeted drug:", "options": [{"letter": "A", "text": "Tamoxifen"}, {"letter": "B", "text": "Letrozole"}, {"letter": "C", "text": "Trastuzumab"}, {"letter": "D", "text": "Fulvestrant"}], "answer": "C", "explanation": "± pertuzumab; teratogenic."}, {"id": "21c", "group": 21, "section": "Breast", "objective": "Breast cancer — present, image, treat by receptor", "stem": "BRCA1 mutation carrier with breast cancer → Most likely receptor profile:", "options": [{"letter": "A", "text": "HER2-positive"}, {"letter": "B", "text": "Triple-negative"}, {"letter": "C", "text": "PR-positive only"}, {"letter": "D", "text": "ER-positive"}], "answer": "B", "explanation": "Chemo ± immunotherapy; no hormone or HER2 therapy. BRCA2 → ER+."}, {"id": "22", "group": 22, "section": "Prenatal Care", "objective": "Is she pregnant, and how far along?", "stem": "Positive pregnancy test → Category of pregnancy sign:", "options": [{"letter": "A", "text": "Positive"}, {"letter": "B", "text": "Diagnostic"}, {"letter": "C", "text": "Probable"}, {"letter": "D", "text": "Presumptive"}], "answer": "C", "explanation": "Positive signs: examiner-felt movement, fetal heart tones, fetus on ultrasound."}, {"id": "23", "group": 23, "section": "Prenatal Care", "objective": "What is due, and when", "stem": "Screen at 24–28 weeks in every pregnancy → Test:", "options": [{"letter": "A", "text": "1-hour glucose challenge"}, {"letter": "B", "text": "HbA1c level"}, {"letter": "C", "text": "GBS culture"}, {"letter": "D", "text": "Quad screen"}], "answer": "A", "explanation": "Insulin resistance rises in the 2nd–3rd trimester."}, {"id": "23a", "group": 23, "section": "Prenatal Care", "objective": "What is due, and when", "stem": "Rh-negative, antibody screen negative at 28 weeks → Give:", "options": [{"letter": "A", "text": "IVIG"}, {"letter": "B", "text": "Rh-positive blood"}, {"letter": "C", "text": "Nothing until delivery"}, {"letter": "D", "text": "RhoGAM"}], "answer": "D", "explanation": "Also after delivery of an Rh+ baby and any bleed/procedure. Antibody-positive = already sensitized."}, {"id": "23b", "group": 23, "section": "Prenatal Care", "objective": "What is due, and when", "stem": "36–37 weeks → Screening test:", "options": [{"letter": "A", "text": "GBS rectovaginal culture"}, {"letter": "B", "text": "Rubella titer"}, {"letter": "C", "text": "1-hour glucose challenge"}, {"letter": "D", "text": "Quad screen"}], "answer": "A", "explanation": "Positive → IV penicillin in labor."}, {"id": "23c", "group": 23, "section": "Prenatal Care", "objective": "What is due, and when", "stem": "Vaccine recommended in EVERY pregnancy →", "options": [{"letter": "A", "text": "MMR"}, {"letter": "B", "text": "Tdap"}, {"letter": "C", "text": "Live intranasal influenza"}, {"letter": "D", "text": "Varicella"}], "answer": "B", "explanation": "Plus inactivated flu any trimester; RSV in season."}, {"id": "23d", "group": 23, "section": "Prenatal Care", "objective": "What is due, and when", "stem": "Quad screen with ELEVATED AFP → Suspect:", "options": [{"letter": "A", "text": "Normal pregnancy"}, {"letter": "B", "text": "Trisomy 18"}, {"letter": "C", "text": "Open neural tube defect"}, {"letter": "D", "text": "Down syndrome"}], "answer": "C", "explanation": "Down: ↓ AFP, ↓ estriol, ↑ hCG, ↑ inhibin."}, {"id": "24", "group": 24, "section": "Prenatal Care", "objective": "Common complaints & fetal surveillance", "stem": "Nausea and vomiting of pregnancy, diet changes failed → First drug:", "options": [{"letter": "A", "text": "Ondansetron"}, {"letter": "B", "text": "Metoclopramide"}, {"letter": "C", "text": "Pyridoxine ± doxylamine"}, {"letter": "D", "text": "IV fluids + promethazine"}], "answer": "C", "explanation": "Then ondansetron/metoclopramide."}, {"id": "24a", "group": 24, "section": "Prenatal Care", "objective": "Common complaints & fetal surveillance", "stem": "Decreased fetal movement → First test:", "options": [{"letter": "A", "text": "Umbilical Doppler"}, {"letter": "B", "text": "Contraction stress test"}, {"letter": "C", "text": "Amniocentesis"}, {"letter": "D", "text": "Nonstress test"}], "answer": "D", "explanation": "Kick counts → NST → BPP → Doppler."}, {"id": "24b", "group": 24, "section": "Prenatal Care", "objective": "Common complaints & fetal surveillance", "stem": "Non-reactive NST → Next step:", "options": [{"letter": "A", "text": "Emergency cesarean"}, {"letter": "B", "text": "Induction of labor"}, {"letter": "C", "text": "Reassurance"}, {"letter": "D", "text": "Biophysical profile"}], "answer": "D", "explanation": "Fetal sleep or tired mom — not automatically distress."}, {"id": "25", "group": 25, "section": "Early Pregnancy Complications", "objective": "Spontaneous abortion — the classification grid", "stem": "8 weeks, bleeding, CLOSED os, IUP with cardiac activity → Diagnosis:", "options": [{"letter": "A", "text": "Inevitable abortion"}, {"letter": "B", "text": "Threatened abortion"}, {"letter": "C", "text": "Incomplete abortion"}, {"letter": "D", "text": "Missed abortion"}], "answer": "B", "explanation": "Most continue — expectant management + return precautions."}, {"id": "25a", "group": 25, "section": "Early Pregnancy Complications", "objective": "Spontaneous abortion — the classification grid", "stem": "Bleeding, open os, partial tissue passed, retained POC on US → Diagnosis:", "options": [{"letter": "A", "text": "Complete abortion"}, {"letter": "B", "text": "Missed abortion"}, {"letter": "C", "text": "Inevitable abortion"}, {"letter": "D", "text": "Incomplete abortion"}], "answer": "D", "explanation": "Expectant / medical / aspiration."}, {"id": "25b", "group": 25, "section": "Early Pregnancy Complications", "objective": "Spontaneous abortion — the classification grid", "stem": "Routine 11-week US: no cardiac activity, patient has NO symptoms → Diagnosis:", "options": [{"letter": "A", "text": "Complete abortion"}, {"letter": "B", "text": "Threatened abortion"}, {"letter": "C", "text": "Missed abortion"}, {"letter": "D", "text": "Inevitable abortion"}], "answer": "C", "explanation": "Nonviable and asymptomatic."}, {"id": "25c", "group": 25, "section": "Early Pregnancy Complications", "objective": "Spontaneous abortion — the classification grid", "stem": "Fever, uterine tenderness, purulent discharge after a pregnancy loss → Management:", "options": [{"letter": "A", "text": "Expectant management"}, {"letter": "B", "text": "Misoprostol, then observe"}, {"letter": "C", "text": "Oral antibiotics, then recheck"}, {"letter": "D", "text": "IV antibiotics + uterine evacuation"}], "answer": "D", "explanation": "Septic abortion — prompt evacuation once antibiotics started."}, {"id": "25d", "group": 25, "section": "Early Pregnancy Complications", "objective": "Spontaneous abortion — the classification grid", "stem": "Stable early loss, wants to avoid a procedure → Medical regimen:", "options": [{"letter": "A", "text": "Oxytocin infusion"}, {"letter": "B", "text": "Methotrexate injection"}, {"letter": "C", "text": "Methylergonovine"}, {"letter": "D", "text": "Mifepristone then misoprostol"}], "answer": "D", "explanation": "NSAIDs for cramping."}, {"id": "26", "group": 26, "section": "Early Pregnancy Complications", "objective": "Ectopic pregnancy", "stem": "6 weeks, unilateral pelvic pain + spotting, hCG above the discriminatory zone, empty uterus → Suspect:", "options": [{"letter": "A", "text": "Threatened abortion"}, {"letter": "B", "text": "Corpus luteum cyst"}, {"letter": "C", "text": "Complete abortion"}, {"letter": "D", "text": "Ectopic pregnancy"}], "answer": "D", "explanation": "Ectopic stays on the list until the pregnancy is located."}, {"id": "26a", "group": 26, "section": "Early Pregnancy Complications", "objective": "Ectopic pregnancy", "stem": "Ectopic pregnancy → Top risk factor:", "options": [{"letter": "A", "text": "Prior vaginal delivery"}, {"letter": "B", "text": "Maternal age <20"}, {"letter": "C", "text": "Oral contraceptive use"}, {"letter": "D", "text": "Prior ectopic"}], "answer": "D", "explanation": "Also PID, tubal surgery, IVF, IUD, smoking."}, {"id": "26b", "group": 26, "section": "Early Pregnancy Complications", "objective": "Ectopic pregnancy", "stem": "Stable, unruptured ectopic, no fetal cardiac activity, reliable follow-up → Treatment:", "options": [{"letter": "A", "text": "Methotrexate"}, {"letter": "B", "text": "Salpingectomy"}, {"letter": "C", "text": "Mifepristone"}, {"letter": "D", "text": "Expectant management"}], "answer": "A", "explanation": "Best when hCG and mass are small."}, {"id": "26c", "group": 26, "section": "Early Pregnancy Complications", "objective": "Ectopic pregnancy", "stem": "Ectopic with hypotension and peritoneal signs → Management:", "options": [{"letter": "A", "text": "Repeat TVUS"}, {"letter": "B", "text": "Emergency surgery"}, {"letter": "C", "text": "Methotrexate"}, {"letter": "D", "text": "Serial hCG"}], "answer": "B", "explanation": "Unstable = operating room."}, {"id": "27", "group": 27, "section": "Early Pregnancy Complications", "objective": "Gestational trophoblastic disease", "stem": "Uterus larger than dates, hyperemesis, BP 150/95 at 12 weeks, hCG 250,000 → Diagnosis:", "options": [{"letter": "A", "text": "Chronic hypertension"}, {"letter": "B", "text": "Complete molar pregnancy"}, {"letter": "C", "text": "Twin gestation"}, {"letter": "D", "text": "Partial molar pregnancy"}], "answer": "B", "explanation": "Preeclampsia before 20 weeks = mole until proven otherwise."}, {"id": "27a", "group": 27, "section": "Early Pregnancy Complications", "objective": "Gestational trophoblastic disease", "stem": "Complete mole → Ultrasound appearance:", "options": [{"letter": "A", "text": "Swiss-cheese placenta with fetus"}, {"letter": "B", "text": "Snowstorm pattern"}, {"letter": "C", "text": "Double decidual sign"}, {"letter": "D", "text": "Ring of fire"}], "answer": "B", "explanation": "No sac or fetus. Partial mole: Swiss-cheese placenta + abnormal fetus."}, {"id": "27b", "group": 27, "section": "Early Pregnancy Complications", "objective": "Gestational trophoblastic disease", "stem": "Molar pregnancy → Treatment:", "options": [{"letter": "A", "text": "Suction evacuation"}, {"letter": "B", "text": "Methotrexate first"}, {"letter": "C", "text": "Observation"}, {"letter": "D", "text": "Misoprostol induction"}], "answer": "A", "explanation": "Histology is definitive."}, {"id": "27c", "group": 27, "section": "Early Pregnancy Complications", "objective": "Gestational trophoblastic disease", "stem": "After molar evacuation → Follow-up:", "options": [{"letter": "A", "text": "Serial CA-125"}, {"letter": "B", "text": "No follow-up needed"}, {"letter": "C", "text": "Monthly pelvic MRI"}, {"letter": "D", "text": "Serial quantitative hCG"}], "answer": "D", "explanation": "Plateau or rise = post-molar GTN → oncology/chemotherapy."}, {"id": "28", "group": 28, "section": "Diseases in Pregnancy", "objective": "Hypertensive disorders — the 20-week line", "stem": "BP 150/96 at 12 weeks → Diagnosis:", "options": [{"letter": "A", "text": "White-coat hypertension"}, {"letter": "B", "text": "Chronic hypertension"}, {"letter": "C", "text": "Gestational hypertension"}, {"letter": "D", "text": "Preeclampsia"}], "answer": "B", "explanation": "HTN before 20 weeks (or persisting ≥12 wk postpartum) = chronic."}, {"id": "28a", "group": 28, "section": "Diseases in Pregnancy", "objective": "Hypertensive disorders — the 20-week line", "stem": "New BP 146/94 at 32 weeks, no proteinuria, no end-organ dysfunction → Diagnosis:", "options": [{"letter": "A", "text": "Chronic hypertension"}, {"letter": "B", "text": "HELLP syndrome"}, {"letter": "C", "text": "Gestational hypertension"}, {"letter": "D", "text": "Preeclampsia"}], "answer": "C", "explanation": "Most common hypertensive disorder of pregnancy."}, {"id": "28b", "group": 28, "section": "Diseases in Pregnancy", "objective": "Hypertensive disorders — the 20-week line", "stem": "New HTN at 34 weeks + protein:creatinine ratio 0.5 → Diagnosis:", "options": [{"letter": "A", "text": "Nephrotic syndrome"}, {"letter": "B", "text": "Preeclampsia"}, {"letter": "C", "text": "Gestational hypertension"}, {"letter": "D", "text": "Chronic hypertension"}], "answer": "B", "explanation": "24-h urine = gold standard; P:C ratio most used."}, {"id": "28c", "group": 28, "section": "Diseases in Pregnancy", "objective": "Hypertensive disorders — the 20-week line", "stem": "New HTN at 30 weeks, BP 164/112, NO proteinuria → Diagnosis:", "options": [{"letter": "A", "text": "Gestational hypertension"}, {"letter": "B", "text": "Preeclampsia without severe features"}, {"letter": "C", "text": "Preeclampsia with severe features"}, {"letter": "D", "text": "Chronic hypertension"}], "answer": "C", "explanation": "Proteinuria not required once a severe feature is present."}, {"id": "28d", "group": 28, "section": "Diseases in Pregnancy", "objective": "Hypertensive disorders — the 20-week line", "stem": "Preeclampsia patient has a tonic-clonic seizure → Diagnosis:", "options": [{"letter": "A", "text": "Hypoglycemic seizure"}, {"letter": "B", "text": "HELLP syndrome"}, {"letter": "C", "text": "Epilepsy"}, {"letter": "D", "text": "Eclampsia"}], "answer": "D", "explanation": "Airway, left lateral, magnesium, deliver once stable."}, {"id": "28e", "group": 28, "section": "Diseases in Pregnancy", "objective": "Hypertensive disorders — the 20-week line", "stem": "Eclampsia → First-line anticonvulsant:", "options": [{"letter": "A", "text": "Lorazepam"}, {"letter": "B", "text": "Phenytoin"}, {"letter": "C", "text": "Magnesium sulfate"}, {"letter": "D", "text": "Levetiracetam"}], "answer": "C", "explanation": "Continue 24 h after delivery or last seizure."}, {"id": "28f", "group": 28, "section": "Diseases in Pregnancy", "objective": "Hypertensive disorders — the 20-week line", "stem": "33 weeks, RUQ pain, falling platelets, rising AST, schistocytes → Diagnosis:", "options": [{"letter": "A", "text": "Intrahepatic cholestasis"}, {"letter": "B", "text": "Acute fatty liver of pregnancy"}, {"letter": "C", "text": "HELLP syndrome"}, {"letter": "D", "text": "Cholecystitis"}], "answer": "C", "explanation": "Normal BP doesn't exclude it; ~30% are postpartum."}, {"id": "29", "group": 29, "section": "Diseases in Pregnancy", "objective": "BP drugs & magnesium", "stem": "Acute severe-range BP (≥160/110) in pregnancy → Drug:", "options": [{"letter": "A", "text": "IV nitroprusside"}, {"letter": "B", "text": "Oral lisinopril"}, {"letter": "C", "text": "IV labetalol"}, {"letter": "D", "text": "IV furosemide"}], "answer": "C", "explanation": "Or IV hydralazine / IR nifedipine."}, {"id": "29a", "group": 29, "section": "Diseases in Pregnancy", "objective": "BP drugs & magnesium", "stem": "Chronic HTN patient on lisinopril becomes pregnant → Switch to:", "options": [{"letter": "A", "text": "Losartan"}, {"letter": "B", "text": "Labetalol"}, {"letter": "C", "text": "Enalapril"}, {"letter": "D", "text": "Spironolactone"}], "answer": "B", "explanation": "ACEi/ARBs are fetotoxic. Also nifedipine, methyldopa."}, {"id": "29b", "group": 29, "section": "Diseases in Pregnancy", "objective": "BP drugs & magnesium", "stem": "On magnesium sulfate: absent patellar reflexes, RR 8 → Antidote:", "options": [{"letter": "A", "text": "Calcium gluconate"}, {"letter": "B", "text": "Sodium bicarbonate"}, {"letter": "C", "text": "Flumazenil"}, {"letter": "D", "text": "Naloxone"}], "answer": "A", "explanation": "Stop the infusion. Loss of DTRs is the earliest toxicity sign."}, {"id": "30", "group": 30, "section": "Diseases in Pregnancy", "objective": "Thyroid & other diseases in pregnancy", "stem": "Hyperthyroidism in the FIRST trimester → Drug:", "options": [{"letter": "A", "text": "Propylthiouracil"}, {"letter": "B", "text": "Methimazole"}, {"letter": "C", "text": "Radioactive iodine"}, {"letter": "D", "text": "Levothyroxine"}], "answer": "A", "explanation": "Methimazole → scalp defects early; PTU → liver later."}, {"id": "30a", "group": 30, "section": "Diseases in Pregnancy", "objective": "Thyroid & other diseases in pregnancy", "stem": "Hyperthyroidism in the 2nd/3rd trimester → Drug:", "options": [{"letter": "A", "text": "Thyroidectomy"}, {"letter": "B", "text": "Methimazole"}, {"letter": "C", "text": "Propylthiouracil"}, {"letter": "D", "text": "Radioactive iodine"}], "answer": "B", "explanation": "Switch from PTU after the first trimester."}, {"id": "30b", "group": 30, "section": "Diseases in Pregnancy", "objective": "Thyroid & other diseases in pregnancy", "stem": "10% weight loss, ketonuria, hypokalemic metabolic alkalosis at 10 weeks → Diagnosis:", "options": [{"letter": "A", "text": "Morning sickness"}, {"letter": "B", "text": "Acute fatty liver"}, {"letter": "C", "text": "Hyperemesis gravidarum"}, {"letter": "D", "text": "Gastroenteritis"}], "answer": "C", "explanation": "Look for twins or a mole. IV fluids, antiemetics, K⁺, thiamine before dextrose."}, {"id": "30c", "group": 30, "section": "Diseases in Pregnancy", "objective": "Thyroid & other diseases in pregnancy", "stem": "3rd trimester, intense itching of palms and soles at night, no rash → Diagnosis:", "options": [{"letter": "A", "text": "PUPPP (polymorphic eruption)"}, {"letter": "B", "text": "HELLP syndrome"}, {"letter": "C", "text": "Intrahepatic cholestasis of pregnancy"}, {"letter": "D", "text": "Allergic contact dermatitis"}], "answer": "C", "explanation": "↑ bile acids → stillbirth risk; ursodeoxycholic acid."}, {"id": "30d", "group": 30, "section": "Diseases in Pregnancy", "objective": "Thyroid & other diseases in pregnancy", "stem": "3rd trimester: N/V, jaundice, hypoglycemia, ↑ PT, ↑ ammonia → Diagnosis:", "options": [{"letter": "A", "text": "HELLP syndrome"}, {"letter": "B", "text": "Cholestasis of pregnancy"}, {"letter": "C", "text": "Hepatitis A"}, {"letter": "D", "text": "Acute fatty liver of pregnancy"}], "answer": "D", "explanation": "Hypoglycemia + coagulopathy split it from HELLP → prompt delivery."}, {"id": "30e", "group": 30, "section": "Diseases in Pregnancy", "objective": "Thyroid & other diseases in pregnancy", "stem": "Painless cervical dilation at 20 weeks, no contractions → Diagnosis:", "options": [{"letter": "A", "text": "Placental abruption"}, {"letter": "B", "text": "Preterm labor"}, {"letter": "C", "text": "Inevitable abortion"}, {"letter": "D", "text": "Cervical insufficiency"}], "answer": "D", "explanation": "Cerclage / vaginal progesterone."}, {"id": "31", "group": 31, "section": "Diabetes & Infections in Pregnancy", "objective": "Diabetes — when did it start?", "stem": "1-hour glucose challenge abnormal → Next step:", "options": [{"letter": "A", "text": "3-hour 100-g OGTT"}, {"letter": "B", "text": "Start insulin"}, {"letter": "C", "text": "HbA1c"}, {"letter": "D", "text": "Repeat 1-hour test"}], "answer": "A", "explanation": "≥2 abnormal values = GDM. One abnormal value is NOT GDM."}, {"id": "31a", "group": 31, "section": "Diabetes & Infections in Pregnancy", "objective": "Diabetes — when did it start?", "stem": "New GDM → First-line management:", "options": [{"letter": "A", "text": "Diet and exercise"}, {"letter": "B", "text": "Glyburide"}, {"letter": "C", "text": "Metformin"}, {"letter": "D", "text": "Insulin"}], "answer": "A", "explanation": "Then insulin if targets missed."}, {"id": "31b", "group": 31, "section": "Diabetes & Infections in Pregnancy", "objective": "Diabetes — when did it start?", "stem": "Poorly controlled pre-existing diabetes at conception → Fetal risk:", "options": [{"letter": "A", "text": "Postterm delivery"}, {"letter": "B", "text": "Congenital anomalies"}, {"letter": "C", "text": "Neonatal hypercalcemia"}, {"letter": "D", "text": "Macrosomia only"}], "answer": "B", "explanation": "Caudal regression, VSD/transposition, NTD — insult during organogenesis."}, {"id": "32", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "Newborn: hydrocephalus, intracranial calcifications, chorioretinitis; cat at home → Organism:", "options": [{"letter": "A", "text": "Toxoplasma"}, {"letter": "B", "text": "HSV"}, {"letter": "C", "text": "CMV"}, {"letter": "D", "text": "Rubella"}], "answer": "A", "explanation": "Avoid litter and raw meat."}, {"id": "32a", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "Failed newborn hearing screen + periventricular calcifications → Organism:", "options": [{"letter": "A", "text": "Parvovirus B19"}, {"letter": "B", "text": "Toxoplasma"}, {"letter": "C", "text": "Cytomegalovirus"}, {"letter": "D", "text": "Zika"}], "answer": "C", "explanation": "MC congenital infection."}, {"id": "32b", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "Fetal hydrops after maternal 'slapped-cheek' exposure → Organism:", "options": [{"letter": "A", "text": "Parvovirus B19"}, {"letter": "B", "text": "Cytomegalovirus"}, {"letter": "C", "text": "Varicella"}, {"letter": "D", "text": "Rubella"}], "answer": "A", "explanation": "Fetal anemia → hydrops."}, {"id": "32c", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "Pregnant woman with fever and diarrhea after deli meat and soft cheese → Treatment:", "options": [{"letter": "A", "text": "Metronidazole"}, {"letter": "B", "text": "Supportive care only"}, {"letter": "C", "text": "Ampicillin + gentamicin"}, {"letter": "D", "text": "Ciprofloxacin"}], "answer": "C", "explanation": "Listeria — treat mother and baby."}, {"id": "32d", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "GBS-positive culture → Intrapartum prophylaxis:", "options": [{"letter": "A", "text": "IM ceftriaxone"}, {"letter": "B", "text": "None if asymptomatic"}, {"letter": "C", "text": "IV penicillin G"}, {"letter": "D", "text": "Oral amoxicillin at 36 weeks"}], "answer": "C", "explanation": "PCN allergy: cefazolin / clindamycin / vancomycin."}, {"id": "32e", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "Active genital HSV lesions at the onset of labor → Delivery plan:", "options": [{"letter": "A", "text": "Forceps-assisted delivery"}, {"letter": "B", "text": "Cesarean delivery"}, {"letter": "C", "text": "Induction of labor"}, {"letter": "D", "text": "Vaginal delivery"}], "answer": "B", "explanation": "Acyclovir from 36 weeks. HPV warts are NOT a C-section indication."}, {"id": "32f", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "HBsAg-positive mother → Newborn plan:", "options": [{"letter": "A", "text": "HBV vaccine + HBIG"}, {"letter": "B", "text": "Vaccine at 2 months"}, {"letter": "C", "text": "Avoid breastfeeding"}, {"letter": "D", "text": "HBIG alone"}], "answer": "A", "explanation": "Within 12 hours of birth."}, {"id": "32g", "group": 32, "section": "Diabetes & Infections in Pregnancy", "objective": "The organism grid", "stem": "Syphilis in pregnancy, penicillin-allergic → Treatment:", "options": [{"letter": "A", "text": "IM ceftriaxone"}, {"letter": "B", "text": "Oral azithromycin"}, {"letter": "C", "text": "Desensitize, then penicillin"}, {"letter": "D", "text": "Oral doxycycline"}], "answer": "C", "explanation": "Only penicillin G works for the fetus."}, {"id": "33", "group": 33, "section": "Labor & Delivery", "objective": "Reading the FHR tracing", "stem": "Shallow decelerations that mirror each contraction → Cause:", "options": [{"letter": "A", "text": "Head compression"}, {"letter": "B", "text": "Uteroplacental insufficiency"}, {"letter": "C", "text": "Cord compression"}, {"letter": "D", "text": "Fetal anemia"}], "answer": "A", "explanation": "Early decels — benign."}, {"id": "33a", "group": 33, "section": "Labor & Delivery", "objective": "Reading the FHR tracing", "stem": "Abrupt V-shaped drops with rapid recovery → Cause:", "options": [{"letter": "A", "text": "Uteroplacental insufficiency"}, {"letter": "B", "text": "Cord compression"}, {"letter": "C", "text": "Head compression"}, {"letter": "D", "text": "Maternal fever"}], "answer": "B", "explanation": "Variable decels — amnioinfusion can cushion the cord."}, {"id": "33b", "group": 33, "section": "Labor & Delivery", "objective": "Reading the FHR tracing", "stem": "Gradual decelerations that begin after each contraction → Cause:", "options": [{"letter": "A", "text": "Head compression"}, {"letter": "B", "text": "Fetal sleep cycle"}, {"letter": "C", "text": "Uteroplacental insufficiency"}, {"letter": "D", "text": "Cord compression"}], "answer": "C", "explanation": "Late decels — non-reassuring."}, {"id": "34", "group": 34, "section": "Labor & Delivery", "objective": "Labor progress, induction & delivery", "stem": "Active labor, contractions <200 MVU, no cervical change → Treatment:", "options": [{"letter": "A", "text": "Cesarean delivery"}, {"letter": "B", "text": "Terbutaline"}, {"letter": "C", "text": "Misoprostol"}, {"letter": "D", "text": "Oxytocin augmentation"}], "answer": "D", "explanation": "Uterine inertia. >200 MVU with no descent → CPD → cesarean."}, {"id": "34a", "group": 34, "section": "Labor & Delivery", "objective": "Labor progress, induction & delivery", "stem": "Induction indicated, Bishop score 4 → Next step:", "options": [{"letter": "A", "text": "Amniotomy"}, {"letter": "B", "text": "Cesarean delivery"}, {"letter": "C", "text": "Oxytocin alone"}, {"letter": "D", "text": "Cervical ripening"}], "answer": "D", "explanation": "Misoprostol, PGE2, balloon. Bishop ≥8 = favorable."}, {"id": "34b", "group": 34, "section": "Labor & Delivery", "objective": "Labor progress, induction & delivery", "stem": "Prior cesarean, cervix unripe → Ripening agent to AVOID:", "options": [{"letter": "A", "text": "Foley balloon"}, {"letter": "B", "text": "Oxytocin"}, {"letter": "C", "text": "Membrane sweep"}, {"letter": "D", "text": "Misoprostol"}], "answer": "D", "explanation": "No prostaglandins after uterine surgery — rupture risk."}, {"id": "34c", "group": 34, "section": "Labor & Delivery", "objective": "Labor progress, induction & delivery", "stem": "Prior CLASSICAL cesarean → Delivery plan:", "options": [{"letter": "A", "text": "Scheduled repeat cesarean"}, {"letter": "B", "text": "Induction with oxytocin"}, {"letter": "C", "text": "Induction with misoprostol"}, {"letter": "D", "text": "Trial of labor"}], "answer": "A", "explanation": "Rupture risk even without contractions — never labor."}, {"id": "34d", "group": 34, "section": "Labor & Delivery", "objective": "Labor progress, induction & delivery", "stem": "Breech at 37 weeks, membranes intact → Next step:", "options": [{"letter": "A", "text": "Await spontaneous labor"}, {"letter": "B", "text": "External cephalic version"}, {"letter": "C", "text": "Induction of labor"}, {"letter": "D", "text": "Immediate cesarean"}], "answer": "B", "explanation": "Else cesarean at 39 weeks. Transverse lie = absolute contraindication to labor."}, {"id": "35", "group": 35, "section": "Labor & Delivery", "objective": "Preterm labor & PROM", "stem": "Preterm labor at 30 weeks → Drug for fetal lung maturity:", "options": [{"letter": "A", "text": "Betamethasone"}, {"letter": "B", "text": "Terbutaline"}, {"letter": "C", "text": "Progesterone"}, {"letter": "D", "text": "Magnesium sulfate"}], "answer": "A", "explanation": "Tocolysis buys ~48 h for steroids."}, {"id": "35a", "group": 35, "section": "Labor & Delivery", "objective": "Preterm labor & PROM", "stem": "Preterm delivery expected before 32 weeks → Fetal neuroprotection:", "options": [{"letter": "A", "text": "Betamethasone"}, {"letter": "B", "text": "Indomethacin"}, {"letter": "C", "text": "Nifedipine"}, {"letter": "D", "text": "Magnesium sulfate"}], "answer": "D", "explanation": "↓ IVH / cerebral palsy."}, {"id": "35b", "group": 35, "section": "Labor & Delivery", "objective": "Preterm labor & PROM", "stem": "PROM: fever, fetal tachycardia, uterine tenderness, foul fluid → Diagnosis:", "options": [{"letter": "A", "text": "Pyelonephritis"}, {"letter": "B", "text": "Endometritis"}, {"letter": "C", "text": "Chorioamnionitis"}, {"letter": "D", "text": "Abruption"}], "answer": "C", "explanation": "Antibiotics + timely delivery."}, {"id": "36", "group": 36, "section": "L&D Complications & Postpartum", "objective": "Bleeding after 20 weeks", "stem": "32 weeks, PAINLESS bright red vaginal bleeding → Diagnosis:", "options": [{"letter": "A", "text": "Placenta previa"}, {"letter": "B", "text": "Uterine rupture"}, {"letter": "C", "text": "Vasa previa"}, {"letter": "D", "text": "Placental abruption"}], "answer": "A", "explanation": "Transvaginal US; NO digital exam until excluded; planned cesarean 36–37⁶⁄₇ wk."}, {"id": "36a", "group": 36, "section": "L&D Complications & Postpartum", "objective": "Bleeding after 20 weeks", "stem": "Painful bleeding, tender firm uterus; cocaine use → Diagnosis:", "options": [{"letter": "A", "text": "Bloody show"}, {"letter": "B", "text": "Cervical polyp"}, {"letter": "C", "text": "Placenta previa"}, {"letter": "D", "text": "Placental abruption"}], "answer": "D", "explanation": "Also trauma, HTN/preeclampsia, smoking, prior abruption, PROM, chorioamnionitis."}, {"id": "36b", "group": 36, "section": "L&D Complications & Postpartum", "objective": "Bleeding after 20 weeks", "stem": "Prior cesareans ×2 + anterior previa; US shows lacunae and loss of the clear zone → Diagnosis:", "options": [{"letter": "A", "text": "Placental abruption"}, {"letter": "B", "text": "Molar pregnancy"}, {"letter": "C", "text": "Succenturiate lobe"}, {"letter": "D", "text": "Placenta accreta spectrum"}], "answer": "D", "explanation": "Plan cesarean hysterectomy — do NOT pull the placenta off."}, {"id": "36c", "group": 36, "section": "L&D Complications & Postpartum", "objective": "Bleeding after 20 weeks", "stem": "Fundal height lagging, oligohydramnios, reversed end-diastolic flow → Management:", "options": [{"letter": "A", "text": "Deliver now"}, {"letter": "B", "text": "Repeat Doppler in 1 week"}, {"letter": "C", "text": "Bed rest"}, {"letter": "D", "text": "Low-dose aspirin"}], "answer": "A", "explanation": "Placental insufficiency — reversed EDF is premorbid."}, {"id": "36d", "group": 36, "section": "L&D Complications & Postpartum", "objective": "Bleeding after 20 weeks", "stem": "Suspected placenta previa → Exam to AVOID until it is excluded:", "options": [{"letter": "A", "text": "Digital vaginal exam"}, {"letter": "B", "text": "Transvaginal ultrasound"}, {"letter": "C", "text": "Sterile speculum exam"}, {"letter": "D", "text": "Abdominal palpation"}], "answer": "A", "explanation": "TVUS is safe and preferred; a finger can provoke hemorrhage."}, {"id": "36e", "group": 36, "section": "L&D Complications & Postpartum", "objective": "Bleeding after 20 weeks", "stem": "Persistent placenta previa, mother and fetus stable → Delivery plan:", "options": [{"letter": "A", "text": "Planned cesarean at 36–37⁶⁄₇ wk"}, {"letter": "B", "text": "Induction of labor at 39 wk"}, {"letter": "C", "text": "Immediate cesarean at 32 wk"}, {"letter": "D", "text": "Trial of labor at 40 wk"}], "answer": "A", "explanation": "Unstable or uncontrolled bleeding → urgent cesarean."}, {"id": "36f", "group": 36, "section": "L&D Complications & Postpartum", "objective": "Bleeding after 20 weeks", "stem": "Suspected abruption, ultrasound shows no retroplacental clot → Interpretation:", "options": [{"letter": "A", "text": "Abruption not excluded"}, {"letter": "B", "text": "Abruption ruled out"}, {"letter": "C", "text": "Placenta previa likely"}, {"letter": "D", "text": "Preterm labor confirmed"}], "answer": "A", "explanation": "Clinical diagnosis; CBC, type & crossmatch, coags, fibrinogen."}, {"id": "37", "group": 37, "section": "L&D Complications & Postpartum", "objective": "Delivery emergencies", "stem": "Head delivers then retracts against the perineum ('turtle sign') → Diagnosis:", "options": [{"letter": "A", "text": "Cord prolapse"}, {"letter": "B", "text": "Arrest of descent"}, {"letter": "C", "text": "Shoulder dystocia"}, {"letter": "D", "text": "Uterine rupture"}], "answer": "C", "explanation": "RF: macrosomia, diabetes, prior dystocia."}, {"id": "37a", "group": 37, "section": "L&D Complications & Postpartum", "objective": "Delivery emergencies", "stem": "Shoulder dystocia → First maneuvers:", "options": [{"letter": "A", "text": "Fundal pressure"}, {"letter": "B", "text": "McRoberts + suprapubic pressure"}, {"letter": "C", "text": "Zavanelli maneuver"}, {"letter": "D", "text": "Downward traction on the head"}], "answer": "B", "explanation": "Then deliver the posterior arm. Never pull down."}, {"id": "37b", "group": 37, "section": "L&D Complications & Postpartum", "objective": "Delivery emergencies", "stem": "Cord palpated after ROM + sudden fetal bradycardia → First move:", "options": [{"letter": "A", "text": "Elevate the presenting part"}, {"letter": "B", "text": "Push the cord back in"}, {"letter": "C", "text": "Start oxytocin"}, {"letter": "D", "text": "Begin amnioinfusion"}], "answer": "A", "explanation": "Knee-chest/Trendelenburg → emergency cesarean."}, {"id": "37c", "group": 37, "section": "L&D Complications & Postpartum", "objective": "Delivery emergencies", "stem": "Laboring after prior cesarean: sudden pain, loss of station, bradycardia → Diagnosis:", "options": [{"letter": "A", "text": "Shoulder dystocia"}, {"letter": "B", "text": "Placental abruption"}, {"letter": "C", "text": "Cord prolapse"}, {"letter": "D", "text": "Uterine rupture"}], "answer": "D", "explanation": "Emergency laparotomy."}, {"id": "38", "group": 38, "section": "L&D Complications & Postpartum", "objective": "Postpartum hemorrhage — the 4 T's", "stem": "Heavy bleeding after delivery, soft boggy fundus → Cause:", "options": [{"letter": "A", "text": "Retained placenta"}, {"letter": "B", "text": "Coagulopathy"}, {"letter": "C", "text": "Uterine atony"}, {"letter": "D", "text": "Cervical laceration"}], "answer": "C", "explanation": "MC cause of PPH (Tone)."}, {"id": "38a", "group": 38, "section": "L&D Complications & Postpartum", "objective": "Postpartum hemorrhage — the 4 T's", "stem": "Uterine atony → First-line uterotonic:", "options": [{"letter": "A", "text": "Oxytocin"}, {"letter": "B", "text": "Methylergonovine"}, {"letter": "C", "text": "Terbutaline"}, {"letter": "D", "text": "Magnesium sulfate"}], "answer": "A", "explanation": "With bimanual massage; then methylergonovine/prostaglandins."}, {"id": "38b", "group": 38, "section": "L&D Complications & Postpartum", "objective": "Postpartum hemorrhage — the 4 T's", "stem": "Postpartum bleeding despite a FIRM contracted uterus → Cause:", "options": [{"letter": "A", "text": "Uterine atony"}, {"letter": "B", "text": "Placental separation"}, {"letter": "C", "text": "Full bladder"}, {"letter": "D", "text": "Genital tract laceration"}], "answer": "D", "explanation": "Trauma — inspect and suture."}, {"id": "39", "group": 39, "section": "L&D Complications & Postpartum", "objective": "Postpartum — pituitary, fever, mood", "stem": "Failure to lactate after massive PPH → Diagnosis:", "options": [{"letter": "A", "text": "Postpartum depression"}, {"letter": "B", "text": "Prolactinoma"}, {"letter": "C", "text": "Postpartum thyroiditis"}, {"letter": "D", "text": "Sheehan syndrome"}], "answer": "D", "explanation": "Ischemic pituitary necrosis."}, {"id": "39a", "group": 39, "section": "L&D Complications & Postpartum", "objective": "Postpartum — pituitary, fever, mood", "stem": "Fever on postpartum day 2 after cesarean, uterine tenderness → Treatment:", "options": [{"letter": "A", "text": "Oral dicloxacillin"}, {"letter": "B", "text": "Oral cephalexin"}, {"letter": "C", "text": "Nitrofurantoin"}, {"letter": "D", "text": "Clindamycin + gentamicin"}], "answer": "D", "explanation": "Endometritis — cesarean is the biggest risk factor."}, {"id": "39b", "group": 39, "section": "L&D Complications & Postpartum", "objective": "Postpartum — pituitary, fever, mood", "stem": "Depressed mood >2 weeks postpartum, Edinburgh score 15 → Diagnosis:", "options": [{"letter": "A", "text": "Postpartum thyroiditis"}, {"letter": "B", "text": "Postpartum blues"}, {"letter": "C", "text": "Postpartum depression"}, {"letter": "D", "text": "Postpartum psychosis"}], "answer": "C", "explanation": "Ask about safety first; check TSH; sertraline, zuranolone."}, {"id": "39c", "group": 39, "section": "L&D Complications & Postpartum", "objective": "Postpartum — pituitary, fever, mood", "stem": "Hallucinations and thoughts of harming the baby 10 days postpartum → Management:", "options": [{"letter": "A", "text": "Reassurance"}, {"letter": "B", "text": "Counseling only"}, {"letter": "C", "text": "Outpatient SSRI"}, {"letter": "D", "text": "Inpatient psychiatry"}], "answer": "D", "explanation": "Postpartum psychosis = medical emergency."}, {"id": "40", "group": 40, "section": "Labor & Delivery", "objective": "Newborn — Apgar", "stem": "5-minute Apgar score of 5 → Next step:", "options": [{"letter": "A", "text": "Repeat q5 min up to 20 min"}, {"letter": "B", "text": "Stop scoring at 5 minutes"}, {"letter": "C", "text": "Repeat once at 1 hour"}, {"letter": "D", "text": "Repeat once at 24 hours"}], "answer": "A", "explanation": "Apgar at 1 and 5 min; <7 at 5 min → keep scoring."}, {"id": "40a", "group": 40, "section": "Labor & Delivery", "objective": "Newborn — Apgar", "stem": "Apgar score of 4–6 → Interpretation:", "options": [{"letter": "A", "text": "Moderately abnormal"}, {"letter": "B", "text": "Reassuring"}, {"letter": "C", "text": "Low"}, {"letter": "D", "text": "Birth asphyxia"}], "answer": "A", "explanation": "7–10 reassuring · 0–3 low; low score alone ≠ asphyxia."}, {"id": "40b", "group": 40, "section": "Labor & Delivery", "objective": "Newborn — Apgar", "stem": "Apgar score → What it does:", "options": [{"letter": "A", "text": "Describes the newborn's status"}, {"letter": "B", "text": "Decides whether to resuscitate"}, {"letter": "C", "text": "Diagnoses birth asphyxia"}, {"letter": "D", "text": "Predicts neuro outcome"}], "answer": "A", "explanation": "It does NOT decide resuscitation; low score alone ≠ asphyxia or prognosis."}]});

(function () {
  const questions = EXAM_DATA.questions;
  const byId = {};
  questions.forEach(q => { byId[q.id] = q; });

  // Build ordered groups (page = one group: parent + follow-ups)
  const groupOrder = [];
  const groupMap = {};
  questions.forEach(q => {
    if (!groupMap[q.group]) { groupMap[q.group] = []; groupOrder.push(q.group); }
    groupMap[q.group].push(q);
  });
  const groups = groupOrder.map(g => groupMap[g]);

  // In-memory state only (no localStorage — not supported in this environment)
  const answers = {};        // question id -> chosen letter
  const flagged = {};        // question id -> true, set by the learner at any point (never affects score)
  let mode = 'exam';         // 'exam' | 'results' | 'review' | 'missed'
  let pageList = groups.map((_, i) => i);  // indices into groups for current mode
  let page = 0;
  let lastGrade = null;      // {correct, graded, total, partial, sections}

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  document.title = EXAM_DATA.title || 'Interactive Exam';
  $('exam-title').textContent = EXAM_DATA.title || 'Interactive Exam';

  function answeredCount() { return Object.keys(answers).length; }

  function renderProgress() {
    const done = answeredCount();
    $('progress-meta').textContent =
      mode === 'exam'
        ? 'Page ' + (page + 1) + ' of ' + pageList.length + ' · ' + done + '/' + questions.length + ' answered'
        : (mode === 'review' ? 'Reviewing · page ' + (page + 1) + ' of ' + pageList.length : '');
    $('progress-fill').style.width = (questions.length ? (done / questions.length) * 100 : 0) + '%';
  }

  function feedbackHtml(q, chosen) {
    const good = chosen === q.answer;
    const correctOpt = q.options.find(o => o.letter === q.answer);
    let html = '<div class="feedback ' + (good ? 'good' : 'bad') + '">';
    html += '<div class="verdict">' + (good ? '✓ Correct' : '✗ Incorrect — correct answer: ' +
      esc(q.answer) + (correctOpt ? '. ' + esc(correctOpt.text) : '')) + '</div>';
    if (q.explanation) html += '<div>' + esc(q.explanation) + '</div>';
    if (q.objective) html += '<div class="obj">' + esc(q.objective) + '</div>';
    html += '</div>';
    return html;
  }

  // Lab values as a table. q.labs is [{test, result, range}]. If the stem contains
  // the marker [[LABS]] the table goes there (so the vignette can continue after
  // the labs); otherwise it follows the stem.
  function labsHtml(q) {
    if (!q.labs || !q.labs.length) return '';
    const hasRange = q.labs.some(l => l.range);
    let html = '<table class="labs"><thead><tr><th>Test</th><th>Result</th>' +
      (hasRange ? '<th>Reference Range</th>' : '') + '</tr></thead><tbody>';
    q.labs.forEach(l => {
      html += '<tr><td>' + esc(l.test) + '</td><td class="res">' + esc(l.result) + '</td>' +
        (hasRange ? '<td class="ref">' + (l.range ? '(' + esc(String(l.range).replace(/^\(|\)$/g, '')) + ')' : '') + '</td>' : '') + '</tr>';
    });
    return html + '</tbody></table>';
  }

  function stemHtml(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    const table = labsHtml(q);
    if (table && stem.indexOf('[[LABS]]') !== -1) {
      const parts = stem.split('[[LABS]]');
      return '<div class="stem">' + esc(parts[0].replace(/\s+$/, '')) + '</div>' + table +
        (parts[1] && parts[1].trim() ? '<div class="stem">' + esc(parts[1].replace(/^\s+/, '')) + '</div>' : '');
    }
    return '<div class="stem">' + esc(stem.replace('[[LABS]]', '')) + '</div>' + table;
  }

  function questionHtml(q) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    let html = '<div class="qcard" data-qid="' + esc(q.id) + '">';
    html += '<span class="qnum">Question ' + esc(q.id) + '</span>';
    html += stemHtml(q);
    if (q.image) html += '<img class="qimg" src="' + q.image + '" alt="Question exhibit">';
    q.options.forEach(o => {
      let cls = 'opt';
      if (answered) {
        if (o.letter === q.answer) cls += ' correct';
        else if (o.letter === chosen) cls += ' incorrect';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-letter="' + esc(o.letter) + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="letter">' + esc(o.letter) + '.</span><span>' + esc(o.text) + '</span></button>';
    });
    if (answered) html += feedbackHtml(q, chosen);
    html += flagHtml(q);
    html += '</div>';
    return html;
  }

  // Flagging: available on every question in every mode, right or wrong, answered or
  // not. A flagged question joins the missed list and the copy-out, so a question that
  // was guessed correctly (or not understood) can still be carried into the next round
  // of study. Flagging never changes the score — it is a bookmark, not a second answer.
  function flagHtml(q) {
    const on = !!flagged[q.id];
    return '<div class="flagrow"><button class="flagbtn' + (on ? ' on' : '') + '" data-flag="' +
      esc(q.id) + '">⚑ ' + (on ? 'Flagged' : 'Flag for review') + '</button></div>';
  }

  function bindFlags() {
    $('main').querySelectorAll('[data-flag]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-flag');
        if (flagged[id]) delete flagged[id]; else flagged[id] = true;
        if (mode === 'missed') {                 // toggle in place; the list is rebuilt on re-entry
          btn.classList.toggle('on', !!flagged[id]);
          btn.textContent = '⚑ ' + (flagged[id] ? 'Flagged' : 'Flag for review');
          return;
        }
        renderPage(true);
      });
    });
  }

  function renderPage(preserveScroll) {
    const savedY = window.scrollY;
    const group = groups[pageList[page]];

    // Progressive reveal: during the exam a follow-up appears only once the
    // question before it has been answered. A stack releases information in
    // order — showing 1B's options while 1 is unanswered gives away 1.
    // Review and results modes show the whole stack at once.
    let shown = group.length;
    if (mode === 'exam') {
      shown = 1;
      while (shown < group.length && answers[group[shown - 1].id] !== undefined) shown++;
    }
    const visible = group.slice(0, shown);

    // Tiered sizing: more questions on the page -> tighter text, less scrolling
    const tier = visible.length >= 4 ? ' c4' : (visible.length === 3 ? ' c3' : (visible.length === 2 ? ' c2' : ''));
    let html = '<div class="group' + tier + '">';
    html += questionHtml(visible[0]);
    if (visible.length > 1) {
      html += '<div class="followups">';
      for (let i = 1; i < visible.length; i++) html += questionHtml(visible[i]);
      html += '</div>';
    }
    if (mode === 'exam' && shown < group.length) {
      const left = group.length - shown;
      html += '<div class="pending">' + left + ' more question' + (left === 1 ? '' : 's') +
        ' in this case — answer above to continue</div>';
    }
    html += '</div>';
    $('main').innerHTML = html;

    // Wire option clicks
    $('main').querySelectorAll('.qcard').forEach(card => {
      const qid = card.getAttribute('data-qid');
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (mode !== 'exam' || answers[qid] !== undefined) return;
          answers[qid] = btn.getAttribute('data-letter');
          renderPage(true); // keep scroll position so the user stays at the question they just answered
        });
      });
    });
    bindFlags();

    renderProgress();
    renderNav();
    if (preserveScroll) window.scrollTo(0, savedY);
    else window.scrollTo(0, 0);
  }

  function renderNav() {
    const last = page >= pageList.length - 1;
    $('btn-back').disabled = page === 0;
    $('btn-next').textContent = mode === 'review' && last ? 'Back to results' : 'Next →';
    $('btn-next').disabled = mode === 'exam' && last;
    $('btn-grade').classList.toggle('hidden', mode !== 'exam');
    $('btn-submit').classList.toggle('hidden', mode !== 'exam' || !last);
    $('btn-grade').disabled = answeredCount() === 0;
  }

  function computeGrade(partial) {
    const graded = partial ? questions.filter(q => answers[q.id] !== undefined) : questions;
    let correct = 0;
    const sections = {};
    graded.forEach(q => {
      const sec = q.section || 'All questions';
      if (!sections[sec]) sections[sec] = { correct: 0, total: 0 };
      sections[sec].total++;
      if (answers[q.id] === q.answer) { correct++; sections[sec].correct++; }
    });
    return { correct, graded: graded.length, total: questions.length, partial, sections };
  }

  function missedQuestions() {                 // answered wrong, or flagged by the learner
    return questions.filter(q => flagged[q.id] ||
      (answers[q.id] !== undefined && answers[q.id] !== q.answer));
  }

  function showResults(partial) {
    lastGrade = computeGrade(partial);
    mode = 'results';
    const r = lastGrade;
    const pct = r.graded ? Math.round((r.correct / r.graded) * 1000) / 10 : 0;

    const secEntries = Object.keys(r.sections).map(name => ({
      name,
      pct: r.sections[name].total ? r.sections[name].correct / r.sections[name].total : 0,
      correct: r.sections[name].correct,
      total: r.sections[name].total
    })).sort((a, b) => b.pct - a.pct);

    let best = null, worst = null;
    if (secEntries.length > 1) {
      best = secEntries[0].name;
      worst = secEntries[secEntries.length - 1].name;
      if (secEntries[0].pct === secEntries[secEntries.length - 1].pct) { best = null; worst = null; }
    }

    let html = '<div class="results-card">';
    html += '<div class="score-sub">' + (r.partial ? 'Score so far' : 'Final score') + '</div>';
    html += '<div class="score-big">' + pct + '%</div>';
    html += '<div class="score-sub">' + r.correct + ' correct out of ' + r.graded + ' question' + (r.graded === 1 ? '' : 's') +
      (r.partial ? ' completed (of ' + r.total + ' total)' : '') + '</div>';
    if (r.partial) html += '<div class="score-note">Graded from your current place — unanswered questions are not counted.</div>';
    html += '</div>';

    html += '<div class="sections-card"><h2>Performance by section</h2>';
    secEntries.forEach(s => {
      const p = Math.round(s.pct * 100);
      let tag = '';
      if (s.name === best) tag = '<span class="sec-tag strong">STRONGEST</span>';
      if (s.name === worst) tag = '<span class="sec-tag weak">WEAKEST</span>';
      const fillCls = s.name === best ? 'hi' : (s.name === worst ? 'lo' : '');
      html += '<div class="sec-row"><div class="sec-head"><span class="sec-name">' + esc(s.name) + tag +
        '</span><span>' + s.correct + '/' + s.total + ' (' + p + '%)</span></div>' +
        '<div class="sec-track"><div class="sec-fill ' + fillCls + '" style="width:' + p + '%"></div></div></div>';
    });
    html += '</div>';

    const missed = missedQuestions().length;
    html += '<div class="results-actions">';
    if (missed) html += '<button class="btn primary" id="btn-review-missed">Review missed &amp; flagged (' + missed + ')</button>';
    html += '<button class="btn ghost" id="btn-review-all">Review all answered</button>';
    if (r.partial && r.graded < r.total) html += '<button class="btn submit" id="btn-continue">Continue exam</button>';
    html += '<button class="btn ghost" id="btn-restart">Restart exam</button>';
    html += '</div>';

    $('main').innerHTML = html;
    $('banner').classList.add('hidden');
    $('navbar').classList.add('hidden');
    $('progress-meta').textContent = r.partial ? 'Partial grade' : 'Exam complete';

    const rm = $('btn-review-missed');
    if (rm) rm.addEventListener('click', showMissedReview);
    $('btn-review-all').addEventListener('click', startReviewAll);
    const cont = $('btn-continue');
    if (cont) cont.addEventListener('click', resumeExam);
    $('btn-restart').addEventListener('click', restart);
    window.scrollTo(0, 0);
  }

  function startReviewAll() {
    const answeredGroupIdx = [];
    groups.forEach((g, i) => { if (g.some(q => answers[q.id] !== undefined)) answeredGroupIdx.push(i); });
    pageList = answeredGroupIdx;
    if (!pageList.length) return;
    mode = 'review';
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').textContent = 'Reviewing your answers';
    $('banner').classList.remove('hidden');
    renderPage();
  }

  // All missed questions on ONE page, with a copy button for pasting into a
  // "things I miss" tracking document.
  function showMissedReview() {
    const missed = missedQuestions();
    if (!missed.length) return;
    mode = 'missed';
    const missedIds = {};
    missed.forEach(q => { missedIds[q.id] = true; });

    let html = '<div class="review-actions">' +
      '<button class="btn primary" id="btn-copy-missed">Copy missed &amp; flagged</button>' +
      '<button class="btn ghost" id="btn-missed-back">&larr; Back to results</button></div>';

    groups.forEach(g => {
      const misses = g.filter(q => missedIds[q.id]);
      if (!misses.length) return;
      html += '<div class="group">';
      // If a follow-up was missed but its parent (which carries the vignette) was not,
      // show the parent stem as context so the follow-up makes sense on its own.
      if (!missedIds[g[0].id]) {
        html += '<div class="qcard context"><span class="qnum">Case — Question ' + esc(g[0].id) + '</span>' +
          stemHtml(g[0]) + '</div>';
      }
      misses.forEach(q => { html += questionHtml(q); });
      html += '</div>';
    });

    $('main').innerHTML = html;
    $('navbar').classList.add('hidden');
    $('banner').textContent = 'Missed & flagged (' + missed.length + ')';
    $('banner').classList.remove('hidden');
    $('progress-meta').textContent = 'Reviewing ' + missed.length + ' missed or flagged question' + (missed.length === 1 ? '' : 's');
    bindFlags();

    $('btn-missed-back').addEventListener('click', () => showResults(lastGrade ? lastGrade.partial : true));
    $('btn-copy-missed').addEventListener('click', copyMissed);
    window.scrollTo(0, 0);
  }

  // Plain-text stem with the lab table flattened to one line per lab
  function stemText(q) {
    const stem = String(q.stem == null ? '' : q.stem);
    if (!q.labs || !q.labs.length) return stem.replace('[[LABS]]', '').trim();
    const rows = q.labs.map(l => '  ' + l.test + ': ' + l.result + (l.range ? ' (ref ' + String(l.range).replace(/^\(|\)$/g, '') + ')' : '')).join('\n');
    const i = stem.indexOf('[[LABS]]');
    const before = i === -1 ? stem : stem.slice(0, i);
    const hasHeader = /\b(labs|laboratory (studies|results|values))\s*:?\s*$/i.test(before);   // stem already says "Labs:"
    const block = (hasHeader ? '' : 'Labs:\n') + rows;
    return (i !== -1 ? before.replace(/\s+$/, '') + '\n' + block + '\n' + stem.slice(i + 8).replace(/^\s+/, '') : stem + '\n' + block).trim();
  }

  function missedAsText() {
    const missed = missedQuestions();
    const blocks = missed.map(q => {
      const group = groupMap[q.group];
      const lines = ['Question ' + q.id];
      if (group[0].id !== q.id) lines.push('Case: ' + stemText(group[0]));
      lines.push(stemText(q));
      q.options.forEach(o => lines.push(o.letter + '. ' + o.text));
      if (flagged[q.id]) lines.push(answers[q.id] === q.answer
        ? 'FLAGGED by me — answered correctly but not understood' : 'FLAGGED by me');
      lines.push(answers[q.id] === undefined ? 'Not answered' : 'My answer: ' + answers[q.id]);
      const correctOpt = q.options.find(o => o.letter === q.answer);
      lines.push('Correct answer: ' + q.answer + (correctOpt ? '. ' + correctOpt.text : ''));
      if (q.explanation) lines.push('Rationale: ' + q.explanation);
      if (q.objective) lines.push('Objective: ' + q.objective);
      return lines.join('\n');
    });
    return ((EXAM_DATA.title || 'Exam') + ' — missed & flagged questions\n\n') + blocks.join('\n\n----------------\n\n');
  }

  function copyMissed() {
    const text = missedAsText();
    const btn = $('btn-copy-missed');
    const done = ok => {
      btn.textContent = ok ? '✓ Copied!' : 'Copy failed — select & copy manually';
      setTimeout(() => { btn.textContent = 'Copy missed & flagged'; }, 2500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true), () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  function resumeExam() {
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    // Jump to first page with an unanswered question
    let target = pageList.length - 1;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].some(q => answers[q.id] === undefined)) { target = i; break; }
    }
    page = target;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  function restart() {
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(flagged).forEach(k => delete flagged[k]);
    lastGrade = null;
    mode = 'exam';
    pageList = groups.map((_, i) => i);
    page = 0;
    $('navbar').classList.remove('hidden');
    $('banner').classList.add('hidden');
    renderPage();
  }

  $('btn-back').addEventListener('click', () => { if (page > 0) { page--; renderPage(); } });
  $('btn-next').addEventListener('click', () => {
    if (page < pageList.length - 1) { page++; renderPage(); }
    else if (mode === 'review') showResults(lastGrade ? lastGrade.partial : true);
  });
  $('btn-grade').addEventListener('click', () => showResults(true));
  $('btn-submit').addEventListener('click', () => showResults(false));

  renderPage();
})();
</script>
</body>
</html>
