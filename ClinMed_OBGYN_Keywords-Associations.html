<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  /* Lab table: vignettes with several lab values render them as a scannable
     Test / Result / Reference Range table instead of a run-on sentence. */
  .labs { width: 100%; border-collapse: separate; border-spacing: 0; margin: 10px 0 14px;
    font-size: 0.95em; background: #fbfbf9; border: 1px solid #e3e1dc; border-radius: 10px; overflow: hidden; }
  .labs th, .labs td { text-align: left; padding: 9px 14px; border-bottom: 1px solid #e3e1dc; vertical-align: top; }
  .labs th { font-weight: 500; color: var(--ink-soft); }
  .labs td:not(:first-child), .labs th:not(:first-child) { border-left: 1px solid #e3e1dc; }
  .labs tr:last-child td { border-bottom: 0; }
  .labs td.ref { color: var(--ink-soft); white-space: nowrap; }
  .labs td.res { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .group.c3 .labs, .group.c4 .labs { font-size: 0.92em; }
  .group.c3 .labs th, .group.c3 .labs td, .group.c4 .labs th, .group.c4 .labs td { padding: 5px 10px; }
  @media (max-width: 520px) { .labs th, .labs td { padding: 7px 9px; } .labs td.ref, .labs td.res { white-space: normal; } }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  /* Flag for review: a bookmark the learner can toggle on any question at any time */
  .flagrow { margin-top: 12px; }
  .flagbtn { font: inherit; font-size: 0.82em; font-weight: 600; cursor: pointer; background: transparent;
    border: 1.5px dashed var(--border); border-radius: 8px; padding: 4px 11px; color: var(--ink-soft); }
  .flagbtn:hover { border-color: var(--amber); color: var(--amber); }
  .flagbtn.on { background: var(--amber-bg); border-style: solid; border-color: var(--amber); color: var(--amber); }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="exam-title">Exam</h1>
    <div class="progress-meta" id="progress-meta"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"></main>
</div>

<div class="navbar" id="navbar">
  <div class="navbar-inner">
    <button class="btn ghost" id="btn-back">&larr; Back</button>
    <button class="btn primary" id="btn-next">Next &rarr;</button>
    <div class="spacer"></div>
    <button class="btn grade" id="btn-grade">Grade completed</button>
    <button class="btn submit" id="btn-submit">Submit exam</button>
  </div>
</div>

<script>
// Injected by the Interactive Exam skill. Structure:
// { title, questions: [{id, group, stem, options:[{letter,text}], answer, explanation, objective, section, image?}] }
const EXAM_DATA = (function (raw) {
  // Reshuffle stack order and option order on every open; follow-ups keep their clinical order; renumber ids.
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const groups = {}; const order = [];
  raw.questions.forEach(q => { if (!groups[q.group]) { groups[q.group] = []; order.push(q.group); } groups[q.group].push(q); });
  shuffle(order);
  const out = []; const letters = ['A','B','C','D','E','F','G','H','I','J','K','L'];
  order.forEach((g, gi) => {
    groups[g].forEach((q, qi) => {
      const correct = q.options.find(o => o.letter === q.answer).text;
      const opts = shuffle(q.options.map(o => o.text)).map((t, i) => ({ letter: letters[i], text: t }));
      const ans = opts.find(o => o.text === correct).letter;
      out.push(Object.assign({}, q, { id: String(gi + 1) + (qi === 0 ? '' : letters[qi - 1].toLowerCase()), group: gi + 1, options: opts, answer: ans }));
    });
  });
  return { title: raw.title, questions: out };
})({"title": "OB-GYN Exam 6 — Keywords, Associations & Rules", "questions": [{"id": "1", "group": 1, "section": "GYN Visit & Screening", "objective": "The annual visit — order of operations", "stem": "Any possibility of pregnancy at a GYN visit → First test:", "options": [{"letter": "A", "text": "CBC"}, {"letter": "B", "text": "Pap smear"}, {"letter": "C", "text": "Pelvic ultrasound"}, {"letter": "D", "text": "Urine or serum hCG"}], "answer": "D", "explanation": "Rule out pregnancy before anything else — the lecturer's first take-home."}, {"id": "1a", "group": 1, "section": "GYN Visit & Screening", "objective": "The annual visit — order of operations", "stem": "19-year-old, sexually active since 15, asymptomatic → Cervical cancer screening:", "options": [{"letter": "A", "text": "Pap smear now"}, {"letter": "B", "text": "Primary HPV test now"}, {"letter": "C", "text": "Co-testing now"}, {"letter": "D", "text": "None until age 21"}], "answer": "D", "explanation": "No cervical screening under 21 regardless of sexual history. She DOES need GC/CT NAAT (<25)."}, {"id": "1b", "group": 1, "section": "GYN Visit & Screening", "objective": "The annual visit — order of operations", "stem": "Total hysterectomy (cervix removed) for fibroids, no CIN 2/3 history → Cervical screening:", "options": [{"letter": "A", "text": "Stop screening"}, {"letter": "B", "text": "Continue Pap every 3 years"}, {"letter": "C", "text": "Vaginal cuff Pap yearly"}, {"letter": "D", "text": "Continue for 20 years"}], "answer": "A", "explanation": "With CIN 2/3 or cervical cancer history → continue 20 years post-op. HPV-vaccinated or cervix retained → keep screening."}, {"id": "1c", "group": 1, "section": "GYN Visit & Screening", "objective": "The annual visit — order of operations", "stem": "HSIL on Pap, age 30 → Next step:", "options": [{"letter": "A", "text": "Total hysterectomy"}, {"letter": "B", "text": "Repeat Pap in 1 year"}, {"letter": "C", "text": "Colposcopy with biopsy"}, {"letter": "D", "text": "Reflex HPV testing"}], "answer": "C", "explanation": "LSIL ≥25, ASC-H, HSIL → colposcopy. AGC → colposcopy + endometrial biopsy."}, {"id": "1d", "group": 1, "section": "GYN Visit & Screening", "objective": "The annual visit — order of operations", "stem": "Atypical glandular cells (AGC) on Pap, age 45 → Cancer the result predicts:", "options": [{"letter": "A", "text": "Ovarian carcinoma"}, {"letter": "B", "text": "Vulvar carcinoma"}, {"letter": "C", "text": "Endometrial carcinoma"}, {"letter": "D", "text": "Vaginal carcinoma"}], "answer": "C", "explanation": "Pap is abnormal in only 30–50% of endometrial cancers, but AGC/AGUS points there → EMB."}, {"id": "2", "group": 2, "section": "GYN Visit & Screening", "objective": "Exam findings → what they mean", "stem": "Cervix presents ANTERIORLY on speculum; fundus not felt abdominally → Uterine position:", "options": [{"letter": "A", "text": "Retroflexed"}, {"letter": "B", "text": "Anteverted"}, {"letter": "C", "text": "Anteflexed"}, {"letter": "D", "text": "Retroverted"}], "answer": "D", "explanation": "Retroverted = whole uterus tilts back. Retroflexed = only the body bends back; cervix stays normal."}, {"id": "3", "group": 3, "section": "Pelvic Organ Prolapse", "objective": "Which wall bulges, how far, what to do", "stem": "Sensation of a vaginal bulge + urinary urgency; ANTERIOR wall descends on Valsalva → Diagnosis:", "options": [{"letter": "A", "text": "Uterine prolapse"}, {"letter": "B", "text": "Enterocele"}, {"letter": "C", "text": "Rectocele"}, {"letter": "D", "text": "Cystocele"}], "answer": "D", "explanation": "Anterior = bladder. Most sensitive POP symptom = sensation of a vaginal bulge."}, {"id": "3a", "group": 3, "section": "Pelvic Organ Prolapse", "objective": "Which wall bulges, how far, what to do", "stem": "Posterior wall bulge, constipation, must splint to empty the rectum → Diagnosis:", "options": [{"letter": "A", "text": "Urethrocele"}, {"letter": "B", "text": "Rectocele"}, {"letter": "C", "text": "Cystocele"}, {"letter": "D", "text": "Enterocele"}], "answer": "B", "explanation": "Posterior compartment = rectum."}, {"id": "3b", "group": 3, "section": "Pelvic Organ Prolapse", "objective": "Which wall bulges, how far, what to do", "stem": "Post-hysterectomy, apical cuff bulge with small bowel behind it → Diagnosis:", "options": [{"letter": "A", "text": "Enterocele"}, {"letter": "B", "text": "Uterine prolapse"}, {"letter": "C", "text": "Cystocele"}, {"letter": "D", "text": "Rectocele"}], "answer": "A", "explanation": "Apical compartment; rides with vault prolapse."}, {"id": "3c", "group": 3, "section": "Pelvic Organ Prolapse", "objective": "Which wall bulges, how far, what to do", "stem": "Prolapse found on exam, patient has NO symptoms → Management:", "options": [{"letter": "A", "text": "Pessary fitting"}, {"letter": "B", "text": "Sacrospinous fixation"}, {"letter": "C", "text": "Hysterectomy"}, {"letter": "D", "text": "Observation"}], "answer": "D", "explanation": "Do not treat asymptomatic prolapse."}, {"id": "3d", "group": 3, "section": "Pelvic Organ Prolapse", "objective": "Which wall bulges, how far, what to do", "stem": "Symptomatic prolapse, wants to avoid surgery → First-line treatment:", "options": [{"letter": "A", "text": "Uterosacral fixation"}, {"letter": "B", "text": "Pessary"}, {"letter": "C", "text": "Weight loss alone"}, {"letter": "D", "text": "Vaginal estrogen alone"}], "answer": "B", "explanation": "Pessary ± Kegels for any stage. Weight loss does NOT reverse prolapse."}, {"id": "4", "group": 4, "section": "GYN Infections", "objective": "The vaginitis engine", "stem": "Thin gray discharge, fishy odor worse after sex, pH 5.0, little itch → Diagnosis:", "options": [{"letter": "A", "text": "Atrophic vaginitis"}, {"letter": "B", "text": "Trichomoniasis"}, {"letter": "C", "text": "Candida vaginitis"}, {"letter": "D", "text": "Bacterial vaginosis"}], "answer": "D", "explanation": "Most common vaginitis. Amsel 3 of 4: thin discharge, whiff +, pH >4.5, clue cells."}, {"id": "4a", "group": 4, "section": "GYN Infections", "objective": "The vaginitis engine", "stem": "Bacterial vaginosis, non-pregnant → Treatment:", "options": [{"letter": "A", "text": "Oral metronidazole"}, {"letter": "B", "text": "Oral azithromycin"}, {"letter": "C", "text": "IM ceftriaxone"}, {"letter": "D", "text": "Oral fluconazole"}], "answer": "A", "explanation": "Or metronidazole gel / clindamycin cream. Partners only for recurrent BV."}, {"id": "4b", "group": 4, "section": "GYN Infections", "objective": "The vaginitis engine", "stem": "Frothy yellow-green discharge, strawberry cervix, many WBCs → Diagnosis:", "options": [{"letter": "A", "text": "Gonococcal cervicitis"}, {"letter": "B", "text": "Trichomoniasis"}, {"letter": "C", "text": "Bacterial vaginosis"}, {"letter": "D", "text": "Candida vaginitis"}], "answer": "B", "explanation": "pH >4.5 like BV — WBCs and motile trichomonads split them. NAAT preferred."}, {"id": "4c", "group": 4, "section": "GYN Infections", "objective": "The vaginitis engine", "stem": "Trichomoniasis → Treatment plan:", "options": [{"letter": "A", "text": "Metronidazole gel for her only"}, {"letter": "B", "text": "Clindamycin cream for her only"}, {"letter": "C", "text": "Fluconazole for her and partners"}, {"letter": "D", "text": "Oral metronidazole for her and all partners"}], "answer": "D", "explanation": "Metronidazole GEL works for BV, NOT trich."}, {"id": "4d", "group": 4, "section": "GYN Infections", "objective": "The vaginitis engine", "stem": "Thick curdy odorless discharge with intense itch 2 weeks after amoxicillin, normal pH → Diagnosis:", "options": [{"letter": "A", "text": "Contact dermatitis"}, {"letter": "B", "text": "Bacterial vaginosis"}, {"letter": "C", "text": "Trichomoniasis"}, {"letter": "D", "text": "Candida vaginitis"}], "answer": "D", "explanation": "DM, antibiotics, steroids, HIV. KOH: pseudohyphae/budding yeast. Not an STI."}, {"id": "5", "group": 5, "section": "GYN Infections", "objective": "The STI grid", "stem": "Asymptomatic 19-year-old with a new partner → Screening test:", "options": [{"letter": "A", "text": "HSV serology"}, {"letter": "B", "text": "GC/CT NAAT"}, {"letter": "C", "text": "RPR"}, {"letter": "D", "text": "Wet mount"}], "answer": "B", "explanation": "Screen all sexually active women <25 and older women at risk. Chlamydia = MC STI, usually silent."}, {"id": "5a", "group": 5, "section": "GYN Infections", "objective": "The STI grid", "stem": "Mucopurulent cervicitis; gram-negative intracellular diplococci → Treatment:", "options": [{"letter": "A", "text": "Oral ciprofloxacin"}, {"letter": "B", "text": "IM ceftriaxone"}, {"letter": "C", "text": "Oral azithromycin"}, {"letter": "D", "text": "Oral metronidazole"}], "answer": "B", "explanation": "Add doxycycline if chlamydia not excluded. No azithro/fluoroquinolones (resistance)."}, {"id": "6", "group": 6, "section": "GYN Infections", "objective": "Syphilis — stage sets the treatment", "stem": "Single PAINLESS indurated genital ulcer + nontender inguinal nodes → Diagnosis:", "options": [{"letter": "A", "text": "Bartholin abscess"}, {"letter": "B", "text": "Primary syphilis"}, {"letter": "C", "text": "Chancroid"}, {"letter": "D", "text": "Genital herpes"}], "answer": "B", "explanation": "Painful = HSV; painless = chancre."}, {"id": "6a", "group": 6, "section": "GYN Infections", "objective": "Syphilis — stage sets the treatment", "stem": "Rash on palms and soles + flat moist condylomata lata → Stage:", "options": [{"letter": "A", "text": "Primary syphilis"}, {"letter": "B", "text": "Late latent syphilis"}, {"letter": "C", "text": "Tertiary syphilis"}, {"letter": "D", "text": "Secondary syphilis"}], "answer": "D", "explanation": "Also moth-eaten alopecia. Lata (flat, moist) ≠ acuminata (HPV)."}, {"id": "6b", "group": 6, "section": "GYN Infections", "objective": "Syphilis — stage sets the treatment", "stem": "Seropositive, asymptomatic, duration UNKNOWN → Treatment:", "options": [{"letter": "A", "text": "Oral doxycycline once"}, {"letter": "B", "text": "Benzathine penicillin G once"}, {"letter": "C", "text": "IV penicillin G"}, {"letter": "D", "text": "Benzathine penicillin G weekly × 3"}], "answer": "D", "explanation": "Can't prove early → treat as late latent."}, {"id": "6c", "group": 6, "section": "GYN Infections", "objective": "Syphilis — stage sets the treatment", "stem": "Fever and myalgias within hours of benzathine penicillin → Diagnosis:", "options": [{"letter": "A", "text": "Jarisch-Herxheimer reaction"}, {"letter": "B", "text": "Secondary syphilis flare"}, {"letter": "C", "text": "Penicillin allergy"}, {"letter": "D", "text": "Serum sickness"}], "answer": "A", "explanation": "NOT a penicillin allergy — antipyretics."}, {"id": "7", "group": 7, "section": "GYN Infections", "objective": "HSV · PID · Bartholin", "stem": "Painful grouped vesicles on an erythematous base + tender inguinal nodes → Diagnosis:", "options": [{"letter": "A", "text": "Chancroid"}, {"letter": "B", "text": "Genital herpes"}, {"letter": "C", "text": "Primary syphilis"}, {"letter": "D", "text": "Condyloma acuminata"}], "answer": "B", "explanation": "Primary episode: antivirals; episodic therapy starts in the prodrome."}, {"id": "7a", "group": 7, "section": "GYN Infections", "objective": "HSV · PID · Bartholin", "stem": "Sexually active, pelvic pain + cervical motion tenderness, no other cause → Next step:", "options": [{"letter": "A", "text": "Diagnostic laparoscopy"}, {"letter": "B", "text": "Await NAAT results"}, {"letter": "C", "text": "Empiric PID treatment"}, {"letter": "D", "text": "Pelvic MRI"}], "answer": "C", "explanation": "Minimum criteria = treat. Overtreatment beats undertreatment."}, {"id": "7b", "group": 7, "section": "GYN Infections", "objective": "HSV · PID · Bartholin", "stem": "Outpatient PID → Regimen:", "options": [{"letter": "A", "text": "Ceftriaxone + doxycycline + metronidazole"}, {"letter": "B", "text": "Azithromycin alone"}, {"letter": "C", "text": "Fluconazole + doxycycline"}, {"letter": "D", "text": "Ciprofloxacin + metronidazole"}], "answer": "A", "explanation": "Recheck in 72 h. Admit for TOA, pregnancy, failed outpatient, can't take PO."}, {"id": "7c", "group": 7, "section": "GYN Infections", "objective": "HSV · PID · Bartholin", "stem": "PID + pleuritic RUQ pain radiating to the right shoulder, normal LFTs → Diagnosis:", "options": [{"letter": "A", "text": "Hepatitis"}, {"letter": "B", "text": "Pyelonephritis"}, {"letter": "C", "text": "Acute cholecystitis"}, {"letter": "D", "text": "Fitz-Hugh-Curtis syndrome"}], "answer": "D", "explanation": "Perihepatitis — 'violin-string' adhesions. Treat the PID."}, {"id": "7d", "group": 7, "section": "GYN Infections", "objective": "HSV · PID · Bartholin", "stem": "Painless, non-inflamed swelling at the 4 o'clock position of the vulva → Management:", "options": [{"letter": "A", "text": "Excisional biopsy"}, {"letter": "B", "text": "I&D with Word catheter"}, {"letter": "C", "text": "Amoxicillin-clavulanate"}, {"letter": "D", "text": "Sitz baths and observation"}], "answer": "D", "explanation": "Bartholin CYST. Abscess (tender, fluctuant) → I&D + Word catheter. Postmenopausal/solid → biopsy for carcinoma."}, {"id": "8", "group": 8, "section": "Menstrual Cycle Dysfunction", "objective": "PMS · PMDD · dysmenorrhea", "stem": "Irritability and bloating in the 5 days before menses, relief once bleeding starts, 3 cycles → Diagnosis:", "options": [{"letter": "A", "text": "Major depressive disorder"}, {"letter": "B", "text": "Premenstrual syndrome"}, {"letter": "C", "text": "Premenstrual dysphoric disorder"}, {"letter": "D", "text": "Perimenopause"}], "answer": "B", "explanation": "≥1 affective or somatic symptom; MC behavioral sx = irritability."}, {"id": "8a", "group": 8, "section": "Menstrual Cycle Dysfunction", "objective": "PMS · PMDD · dysmenorrhea", "stem": "≥5 symptoms incl. marked mood lability in the final week before menses, impairing work → Diagnosis:", "options": [{"letter": "A", "text": "Premenstrual dysphoric disorder"}, {"letter": "B", "text": "Bipolar disorder"}, {"letter": "C", "text": "Premenstrual syndrome"}, {"letter": "D", "text": "Generalized anxiety"}], "answer": "A", "explanation": "≥5 of 11 with ≥1 core mood symptom."}, {"id": "8b", "group": 8, "section": "Menstrual Cycle Dysfunction", "objective": "PMS · PMDD · dysmenorrhea", "stem": "PMDD → First-line treatment:", "options": [{"letter": "A", "text": "Multiphasic OCP"}, {"letter": "B", "text": "Benzodiazepine"}, {"letter": "C", "text": "SSRI"}, {"letter": "D", "text": "NSAID alone"}], "answer": "C", "explanation": "Continuous or luteal-only. Avoid multiphasic OCPs (worsen mood)."}, {"id": "8c", "group": 8, "section": "Menstrual Cycle Dysfunction", "objective": "PMS · PMDD · dysmenorrhea", "stem": "17-year-old, crampy pain days 1–2 of menses, normal pelvic exam → First-line treatment:", "options": [{"letter": "A", "text": "NSAIDs"}, {"letter": "B", "text": "Hysteroscopy"}, {"letter": "C", "text": "Diagnostic laparoscopy"}, {"letter": "D", "text": "GnRH agonist"}], "answer": "A", "explanation": "Primary dysmenorrhea (PGF2α). Then monophasic COC."}, {"id": "9", "group": 9, "section": "Menstrual Cycle Dysfunction", "objective": "PCOS — Rotterdam, then treat by goal", "stem": "Oligomenorrhea, hirsutism, acne, acanthosis nigricans → Diagnosis:", "options": [{"letter": "A", "text": "Nonclassic adrenal hyperplasia"}, {"letter": "B", "text": "Primary hypothyroidism"}, {"letter": "C", "text": "Polycystic ovarian syndrome"}, {"letter": "D", "text": "Cushing syndrome"}], "answer": "C", "explanation": "Rotterdam 2 of 3: oligo/anovulation, hyperandrogenism, polycystic ovaries. Cysts are NOT mandatory."}, {"id": "9a", "group": 9, "section": "Menstrual Cycle Dysfunction", "objective": "PCOS — Rotterdam, then treat by goal", "stem": "PCOS, not trying to conceive, wants regular cycles → First-line drug:", "options": [{"letter": "A", "text": "Leuprolide injection"}, {"letter": "B", "text": "Clomiphene citrate"}, {"letter": "C", "text": "Letrozole for ovulation"}, {"letter": "D", "text": "Combined oral contraceptive"}], "answer": "D", "explanation": "Plus weight loss for everyone. Metformin 2nd-line; spironolactone is teratogenic."}, {"id": "9b", "group": 9, "section": "Menstrual Cycle Dysfunction", "objective": "PCOS — Rotterdam, then treat by goal", "stem": "PCOS, trying to conceive → First-line ovulation induction:", "options": [{"letter": "A", "text": "Letrozole"}, {"letter": "B", "text": "Spironolactone"}, {"letter": "C", "text": "Metformin alone"}, {"letter": "D", "text": "Combined OCP"}], "answer": "A", "explanation": "Clomiphene is the alternative."}, {"id": "10", "group": 10, "section": "Menstrual Cycle Dysfunction", "objective": "Abnormal uterine bleeding — PALM-COEIN", "stem": "Abnormal bleeding in a reproductive-age woman → First test:", "options": [{"letter": "A", "text": "hCG"}, {"letter": "B", "text": "Endometrial biopsy"}, {"letter": "C", "text": "Coagulation panel"}, {"letter": "D", "text": "Hysteroscopy"}], "answer": "A", "explanation": "Pregnancy complications first, always."}, {"id": "10a", "group": 10, "section": "Menstrual Cycle Dysfunction", "objective": "Abnormal uterine bleeding — PALM-COEIN", "stem": "Adolescent with heavy menses since menarche → Labs to add:", "options": [{"letter": "A", "text": "Coagulation studies"}, {"letter": "B", "text": "FSH and LH"}, {"letter": "C", "text": "CA-125"}, {"letter": "D", "text": "Endometrial biopsy"}], "answer": "A", "explanation": "von Willebrand — coags in ALL adolescents with heavy menstrual bleeding."}, {"id": "11a", "group": 11, "section": "Menstrual Cycle Dysfunction", "objective": "Amenorrhea engine", "stem": "No menses by 15, short stature, webbed neck, no breasts, ↑ FSH → Diagnosis:", "options": [{"letter": "A", "text": "Müllerian agenesis"}, {"letter": "B", "text": "Turner syndrome"}, {"letter": "C", "text": "Kallmann syndrome"}, {"letter": "D", "text": "Androgen insensitivity"}], "answer": "B", "explanation": "45,XO with streak gonads → HRT."}, {"id": "11b", "group": 11, "section": "Menstrual Cycle Dysfunction", "objective": "Amenorrhea engine", "stem": "Breasts present, scant pubic/axillary hair, blind vaginal pouch → Diagnosis:", "options": [{"letter": "A", "text": "Androgen insensitivity syndrome"}, {"letter": "B", "text": "Turner syndrome (45,XO)"}, {"letter": "C", "text": "Müllerian agenesis (MRKH)"}, {"letter": "D", "text": "Kallmann syndrome"}], "answer": "A", "explanation": "46,XY with testes. Müllerian agenesis has normal hair and is 46,XX."}, {"id": "11c", "group": 11, "section": "Menstrual Cycle Dysfunction", "objective": "Amenorrhea engine", "stem": "Amenorrhea after D&C for retained tissue; normal hormones; no withdrawal bleed → Diagnosis:", "options": [{"letter": "A", "text": "Asherman syndrome"}, {"letter": "B", "text": "Prolactinoma"}, {"letter": "C", "text": "Premature ovarian insufficiency"}, {"letter": "D", "text": "Sheehan syndrome"}], "answer": "A", "explanation": "Intrauterine adhesions → hysteroscopic lysis."}, {"id": "12", "group": 12, "section": "Menstrual Cycle Dysfunction", "objective": "Endometriosis vs adenomyosis", "stem": "Progressive dysmenorrhea, deep dyspareunia, infertility, tender uterosacral nodules → Diagnosis:", "options": [{"letter": "A", "text": "Endometriosis"}, {"letter": "B", "text": "Primary dysmenorrhea"}, {"letter": "C", "text": "Leiomyoma"}, {"letter": "D", "text": "Adenomyosis"}], "answer": "A", "explanation": "Endometrial tissue OUTSIDE the uterus; ovaries MC site."}, {"id": "12a", "group": 12, "section": "Menstrual Cycle Dysfunction", "objective": "Endometriosis vs adenomyosis", "stem": "Endometriosis → Definitive diagnosis:", "options": [{"letter": "A", "text": "Laparoscopy with biopsy"}, {"letter": "B", "text": "Pelvic MRI"}, {"letter": "C", "text": "CA-125"}, {"letter": "D", "text": "Transvaginal ultrasound"}], "answer": "A", "explanation": "Definitive — but NOT required before starting treatment."}, {"id": "12b", "group": 12, "section": "Menstrual Cycle Dysfunction", "objective": "Endometriosis vs adenomyosis", "stem": "Endometriosis → First-line treatment:", "options": [{"letter": "A", "text": "Total hysterectomy + BSO"}, {"letter": "B", "text": "Continuous COC + NSAID"}, {"letter": "C", "text": "Danazol monotherapy"}, {"letter": "D", "text": "Clomiphene + letrozole"}], "answer": "B", "explanation": "→ progestins → GnRH agonist/antagonist with add-back."}, {"id": "12c", "group": 12, "section": "Menstrual Cycle Dysfunction", "objective": "Endometriosis vs adenomyosis", "stem": "Multiparous 45-year-old, heavy painful menses, soft boggy symmetrically enlarged uterus → Diagnosis:", "options": [{"letter": "A", "text": "Leiomyoma"}, {"letter": "B", "text": "Adenomyosis"}, {"letter": "C", "text": "Endometrial carcinoma"}, {"letter": "D", "text": "Endometriosis"}], "answer": "B", "explanation": "Endometrium within the myometrium. Fibroid = irregular, firm. Hysterectomy is definitive."}, {"id": "13", "group": 13, "section": "Menopause", "objective": "Stage it, then treat the symptom type", "stem": "52-year-old, no period for 12 consecutive months → Workup required:", "options": [{"letter": "A", "text": "Serum FSH and LH"}, {"letter": "B", "text": "Serum estradiol level"}, {"letter": "C", "text": "History and medication review"}, {"letter": "D", "text": "Pelvic ultrasound"}], "answer": "C", "explanation": "Menopause is a clinical, retrospective diagnosis — FSH not required at typical age."}, {"id": "13a", "group": 13, "section": "Menopause", "objective": "Stage it, then treat the symptom type", "stem": "Most common and first menopausal symptom →", "options": [{"letter": "A", "text": "Vaginal dryness"}, {"letter": "B", "text": "Insomnia"}, {"letter": "C", "text": "Recurrent UTIs"}, {"letter": "D", "text": "Hot flashes"}], "answer": "D", "explanation": "VMS peak in the late transition, then fade over a few years."}, {"id": "13b", "group": 13, "section": "Menopause", "objective": "Stage it, then treat the symptom type", "stem": "Menopausal symptoms that keep worsening after menopause →", "options": [{"letter": "A", "text": "Genitourinary syndrome of menopause"}, {"letter": "B", "text": "Night sweats and insomnia"}, {"letter": "C", "text": "Vasomotor hot flashes"}, {"letter": "D", "text": "Mood lability and irritability"}], "answer": "A", "explanation": "Dryness, dyspareunia, urgency, recurrent UTIs — they do not resolve."}, {"id": "14", "group": 14, "section": "Menopause", "objective": "Menopause treatment pairings", "stem": "Moderate–severe hot flashes, uterus intact, age 53 → Treatment:", "options": [{"letter": "A", "text": "Estrogen alone"}, {"letter": "B", "text": "Vaginal estrogen alone"}, {"letter": "C", "text": "Ospemifene"}, {"letter": "D", "text": "Estrogen + progestin"}], "answer": "D", "explanation": "Never unopposed systemic estrogen with a uterus → endometrial hyperplasia/cancer."}, {"id": "14a", "group": 14, "section": "Menopause", "objective": "Menopause treatment pairings", "stem": "MHT contraindicated, daytime hot flashes → First-line drug:", "options": [{"letter": "A", "text": "Gabapentin"}, {"letter": "B", "text": "SSRI (paroxetine)"}, {"letter": "C", "text": "Clonidine"}, {"letter": "D", "text": "Black cohosh"}], "answer": "B", "explanation": "Night symptoms → gabapentin (sedation) or clonidine."}, {"id": "14b", "group": 14, "section": "Menopause", "objective": "Menopause treatment pairings", "stem": "Hot flashes in a breast cancer patient on tamoxifen → Drug:", "options": [{"letter": "A", "text": "Venlafaxine"}, {"letter": "B", "text": "Paroxetine"}, {"letter": "C", "text": "Systemic estrogen"}, {"letter": "D", "text": "Fluoxetine"}], "answer": "A", "explanation": "SSRIs ↓ tamoxifen metabolism."}, {"id": "14d", "group": 14, "section": "Menopause", "objective": "Menopause treatment pairings", "stem": "Severe vaginal dryness and dyspareunia, lubricants failed → Treatment:", "options": [{
