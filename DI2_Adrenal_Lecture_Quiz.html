medulla"}], "answer": "B", "explanation": "Catecholamines come from the **medulla**, which is sympathetic nervous tissue."}]}, {"teach": "The medulla is not a steroid factory at all — it behaves as part of the sympathetic nervous system.", "stem": "What distinguishes the hormones of the adrenal medulla from those of the cortex?", "options": [{"letter": "A", "text": "They are secreted only under ACTH control"}, {"letter": "B", "text": "They are steroids built from cholesterol"}, {"letter": "C", "text": "They are catecholamines rather than steroids"}, {"letter": "D", "text": "They are peptide releasing hormones"}], "answer": "C", "explanation": "Medullary hormones are **catecholamines**; every cortical hormone is a steroid made from cholesterol."}], "checkpoints": [{"stem": "A tumour arising in the adrenal medulla secretes catecholamines. What is that tumour called?", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Conn adenoma"}, {"letter": "C", "text": "Cushing disease"}, {"letter": "D", "text": "Addison disease"}], "answer": "A", "explanation": "A catecholamine-secreting tumour of the **adrenal medulla** is a pheochromocytoma."}]}}, {"id": "2", "group": 2, "section": "ACTH — POMC and MSH", "topic": "Adrenal physiology", "skill": "Disease process", "stem": "Why does a high-ACTH state produce generalized hyperpigmentation?", "options": [{"letter": "A", "text": "Aldosterone loss darkens sun-exposed skin"}, {"letter": "B", "text": "Adrenal androgens stimulate melanocyte growth"}, {"letter": "C", "text": "Cortisol excess deposits pigment in the dermis"}, {"letter": "D", "text": "ACTH is cleaved from POMC, which also yields MSH"}], "answer": "D", "explanation": "ACTH is cleaved from **POMC**, whose processing also yields alpha/beta/gamma-**MSH** — so pigmentation rises whenever ACTH is high.", "objective": "", "remediation": {"steps": [{"teach": "ACTH is cut out of a much larger precursor peptide, and the other fragments are not inert.", "stem": "From which precursor molecule is ACTH cleaved?", "options": [{"letter": "A", "text": "Thyroglobulin"}, {"letter": "B", "text": "Angiotensinogen"}, {"letter": "C", "text": "Proopiomelanocortin (POMC)"}, {"letter": "D", "text": "Pregnenolone"}], "answer": "C", "explanation": "ACTH comes from **POMC**, the same precursor that yields MSH.", "clarify": [{"stem": "What does the abbreviation MSH stand for?", "options": [{"letter": "A", "text": "Mineralocorticoid-stimulating hormone"}, {"letter": "B", "text": "Melanocyte-stimulating hormone"}], "answer": "B", "explanation": "**Melanocyte-stimulating hormone** drives melanin production in the skin."}]}, {"teach": "Pigmentation therefore tracks ACTH rather than cortisol, which makes it a localising sign.", "stem": "Which two diagnoses in this lecture are high-ACTH states that can cause hyperpigmentation?", "options": [{"letter": "A", "text": "Conn syndrome and pheochromocytoma"}, {"letter": "B", "text": "Adrenal-adenoma Cushing and Conn syndrome"}, {"letter": "C", "text": "Secondary adrenal insufficiency and pheochromocytoma"}, {"letter": "D", "text": "Cushing disease and Addison disease"}], "answer": "D", "explanation": "Both **pituitary Cushing disease and Addison disease** run high ACTH; adrenal-adenoma Cushing and secondary insufficiency do not."}], "checkpoints": [{"stem": "A woman with Cushingoid features also has hirsutism and hyperpigmentation. What does this predict about her plasma ACTH?", "options": [{"letter": "A", "text": "It will be suppressed"}, {"letter": "B", "text": "It will be high or inappropriately normal"}, {"letter": "C", "text": "It will be undetectable"}, {"letter": "D", "text": "It cannot be interpreted"}], "answer": "B", "explanation": "Androgen excess and pigment both require a **high-ACTH source**; an adrenal adenoma usually makes cortisol only."}, {"stem": "In a darker-skinned patient, where should you look for the hyperpigmentation of a high-ACTH state?", "options": [{"letter": "A", "text": "Nail beds only"}, {"letter": "B", "text": "Scalp and eyebrows"}, {"letter": "C", "text": "Palmar creases and oral mucosa"}, {"letter": "D", "text": "Sclera and conjunctiva"}], "answer": "C", "explanation": "Look at **palmar creases, oral mucosa and pressure points**, where the change is easiest to see."}]}}, {"id": "3", "group": 3, "section": "ACTH — diurnal variation", "topic": "Adrenal physiology", "skill": "Diagnostics & imaging", "stem": "Because cortisol follows a diurnal rhythm, when should it be drawn in a patient you suspect of cortisol excess?", "options": [{"letter": "A", "text": "Early morning, around 8 AM"}, {"letter": "B", "text": "Mid-afternoon, around 3 PM"}, {"letter": "C", "text": "Late at night, around midnight"}, {"letter": "D", "text": "At any random time of day"}], "answer": "C", "explanation": "Cortisol peaks at **6–8 AM** and bottoms out at **11 PM–midnight**, so suspected excess is tested when the value should be lowest. A random cortisol is not useful.", "objective": "", "remediation": {"steps": [{"teach": "Cortisol follows ACTH with a marked circadian rhythm — highest on waking, lowest at bedtime.", "stem": "At what time of day are ACTH and cortisol normally at their peak?", "options": [{"letter": "A", "text": "4–6 PM"}, {"letter": "B", "text": "11 PM to midnight"}, {"letter": "C", "text": "Noon to 2 PM"}, {"letter": "D", "text": "6–8 AM"}], "answer": "D", "explanation": "Both peak at **6–8 AM** and reach their nadir around **11 PM–midnight**.", "clarify": [{"stem": "What is a normal serum cortisol by about 11 PM?", "options": [{"letter": "A", "text": "Under 5 µg/dL"}, {"letter": "B", "text": "Over 15 µg/dL"}], "answer": "A", "explanation": "By 11 PM a normal cortisol is usually **below 5 µg/dL** (8 AM is 8–25)."}]}, {"teach": "The logic is to time the draw to the moment at which an abnormal value will stand out most.", "stem": "Why is a cortisol drawn at a random time of day unhelpful?", "options": [{"letter": "A", "text": "Diurnal variation makes the value uninterpretable"}, {"letter": "B", "text": "Cortisol is measurable only in the morning"}, {"letter": "C", "text": "Random samples routinely hemolyze"}, {"letter": "D", "text": "Cortisol is secreted only once per day"}], "answer": "A", "explanation": "**Diurnal variation** means a mid-range value could be normal or abnormal depending on the hour."}], "checkpoints": [{"stem": "In a patient whose symptoms suggest adrenal insufficiency, when should the serum cortisol be measured?", "options": [{"letter": "A", "text": "At midnight, when it should be lowest"}, {"letter": "B", "text": "At 8 AM, when it should be highest"}, {"letter": "C", "text": "Immediately after a meal"}, {"letter": "D", "text": "Thirty minutes after exercise"}], "answer": "B", "explanation": "Suspected deficiency is tested at **8 AM**, when cortisol should be at its highest."}]}}, {"id": "4", "group": 4, "section": "Hypercortisolism — etiologies", "topic": "Cushing syndrome", "skill": "Disease process", "stem": "What is the most common cause of endogenous hypercortisolism?", "options": [{"letter": "A", "text": "Ectopic ACTH from lung cancer"}, {"letter": "B", "text": "Bilateral adrenal hyperplasia"}, {"letter": "C", "text": "Cortisol-secreting adrenal adenoma"}, {"letter": "D", "text": "ACTH-secreting pituitary adenoma"}], "answer": "D", "explanation": "An **ACTH-producing pituitary adenoma (Cushing's disease) is about 85%** of endogenous cases; a cortisol-secreting adrenal adenoma is about 15%.", "objective": "", "remediation": {"steps": [{"teach": "Endogenous Cushing syndrome splits into ACTH-dependent and ACTH-independent disease before any lesion is named.", "stem": "Which category accounts for about 85% of endogenous Cushing syndrome?", "options": [{"letter": "A", "text": "ACTH-independent disease"}, {"letter": "B", "text": "Bilateral adrenal hyperplasia"}, {"letter": "C", "text": "Exogenous glucocorticoid use"}, {"letter": "D", "text": "ACTH-dependent disease"}], "answer": "D", "explanation": "**ACTH-dependent** causes make up roughly 85% of endogenous disease.", "clarify": [{"stem": "What does the term Cushing's disease refer to specifically?", "options": [{"letter": "A", "text": "Hypercortisolism of any cause"}, {"letter": "B", "text": "An ACTH-secreting pituitary tumour"}], "answer": "B", "explanation": "Cushing's **disease** is hypercortisolism from an **ACTH-secreting pituitary adenoma**; Cushing's syndrome is any cause."}]}, {"teach": "Naming the category tells you which gland holds the lesion.", "stem": "Which single lesion is the most common endogenous cause of Cushing syndrome?", "options": [{"letter": "A", "text": "A cortisol-secreting adrenal adenoma"}, {"letter": "B", "text": "An ectopic ACTH-secreting lung tumour"}, {"letter": "C", "text": "An ACTH-secreting pituitary adenoma"}, {"letter": "D", "text": "Bilateral adrenal hyperplasia"}], "answer": "C", "explanation": "The **pituitary adenoma** of Cushing's disease is the commonest endogenous cause."}], "checkpoints": [{"stem": "A patient develops Cushingoid features while taking prednisone. Which type of Cushing syndrome is this?", "options": [{"letter": "A", "text": "Exogenous (iatrogenic)"}, {"letter": "B", "text": "ACTH-dependent endogenous"}, {"letter": "C", "text": "Ectopic ACTH"}, {"letter": "D", "text": "ACTH-independent adrenal"}], "answer": "A", "explanation": "Glucocorticoid drugs cause **exogenous (iatrogenic)** Cushing syndrome."}, {"stem": "About what share of endogenous Cushing syndrome is caused by a cortisol-secreting adrenal adenoma?", "options": [{"letter": "A", "text": "About 50%"}, {"letter": "B", "text": "About 85%"}, {"letter": "C", "text": "About 2%"}, {"letter": "D", "text": "About 15%"}], "answer": "D", "explanation": "ACTH-independent adrenal adenoma accounts for about **15%** of endogenous cases."}]}}, {"id": "5", "group": 5, "section": "Cushing's — physical findings", "topic": "Cushing syndrome", "skill": "Identification", "stem": "Which findings are more specific for Cushing syndrome than for ordinary obesity?", "options": [{"letter": "A", "text": "Supraclavicular fat filling"}, {"letter": "B", "text": "Dorsocervical fat pad"}, {"letter": "C", "text": "Facial plethora"}, {"letter": "D", "text": "Moon facies"}, {"letter": "E", "text": "Generalized weight gain"}, {"letter": "F", "text": "Wide purple striae"}], "answer": ["A", "C", "F"], "explanation": "**Facial plethora, supraclavicular fat filling and wide purple striae** point to cortisol excess. Moon facies, a dorsocervical pad and plain weight gain all occur in ordinary obesity.", "objective": "", "remediation": {"steps": [{"teach": "Cortisol redistributes fat centrally while wasting the limbs, so the useful signs are the ones simple obesity does not produce.", "stem": "Which pattern of body habitus change is typical of cortisol excess?", "options": [{"letter": "A", "text": "Uniform fat gain over trunk and limbs"}, {"letter": "B", "text": "Facial fat loss with limb sparing"}, {"letter": "C", "text": "Central fat gain with wasting of the arms and legs"}, {"letter": "D", "text": "Lower-body fat gain with a muscular trunk"}], "answer": "C", "explanation": "Cushing syndrome produces **centripetal obesity with wasting of the arms and legs** and proximal weakness.", "clarify": [{"stem": "Is moon facies specific enough to separate Cushing syndrome from ordinary obesity?", "options": [{"letter": "A", "text": "No — it occurs in ordinary obesity too"}, {"letter": "B", "text": "Yes — it is pathognomonic"}], "answer": "A", "explanation": "Moon facies and a buffalo hump are **not specific** — both are seen in simple obesity."}]}, {"teach": "Striae are the clearest example: many people have them, but their width and colour differ.", "stem": "How do the striae of Cushing syndrome differ from those of pregnancy or rapid weight gain?", "options": [{"letter": "A", "text": "They are narrow and pale rather than wide and purple"}, {"letter": "B", "text": "They are wide and purple rather than narrow and pale"}, {"letter": "C", "text": "They appear only over the back and shoulders"}, {"letter": "D", "text": "They blanch completely with light pressure"}], "answer": "B", "explanation": "Cushing's striae are **wide and purple**; pregnancy and weight-gain striae are narrow and pale pink."}, {"teach": "Because no single sign is pathognomonic, the trigger to test is a cluster of progressive features or findings unusual for age.", "stem": "Which clinical situation should prompt biochemical testing for Cushing syndrome?", "options": [{"letter": "A", "text": "Mild fatigue after a viral illness"}, {"letter": "B", "text": "Isolated weight gain in a sedentary adult"}, {"letter": "C", "text": "A single episode of poor sleep"}, {"letter": "D", "text": "Osteoporosis and hypertension in a young adult"}], "answer": "D", "explanation": "Test when there are **multiple progressive features** or findings **unusual for the patient's age**."}], "checkpoints": [{"stem": "A head-injured patient has a rising systolic pressure, bradycardia and irregular respirations. What does this triad indicate?", "options": [{"letter": "A", "text": "Cushing syndrome"}, {"letter": "B", "text": "Pheochromocytoma crisis"}, {"letter": "C", "text": "Raised intracranial pressure"}, {"letter": "D", "text": "Addisonian crisis"}], "answer": "C", "explanation": "Cushing's **triad** is a sign of **raised intracranial pressure**, not of hypercortisolism."}]}}, {"id": "6", "group": 6, "section": "Hypercortisolism — documenting the hormone excess", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "Which tests are used to document hypercortisolism at the screening step of the workup?", "options": [{"letter": "A", "text": "CT of the adrenal glands with contrast"}, {"letter": "B", "text": "Overnight 1-mg dexamethasone suppression test"}, {"letter": "C", "text": "Random afternoon serum cortisol"}, {"letter": "D", "text": "Plasma ACTH level"}, {"letter": "E", "text": "Late-night salivary cortisol"}, {"letter": "F", "text": "24-hour urine free cortisol"}], "answer": ["B", "E", "F"], "explanation": "The three screening tests are **24-h urine free cortisol, late-night salivary cortisol and the overnight 1-mg dexamethasone suppression test**. ACTH is the step-2 localising test and imaging comes last.", "objective": "", "remediation": {"steps": [{"teach": "Step 1 of every adrenal workup is to document the hormone problem — not to find its level and not to image.", "stem": "What is the first step in evaluating a patient you suspect of Cushing syndrome?", "options": [{"letter": "A", "text": "Prove the cortisol excess biochemically"}, {"letter": "B", "text": "Measure plasma ACTH"}, {"letter": "C", "text": "Image the adrenal glands"}, {"letter": "D", "text": "Image the pituitary gland"}], "answer": "A", "explanation": "Every adrenal disorder starts by **documenting the hormone abnormality biochemically**.", "clarify": [{"stem": "Why is a random serum cortisol not one of the screening tests?", "options": [{"letter": "A", "text": "It measures only protein-bound cortisol"}, {"letter": "B", "text": "Diurnal variation makes it uninterpretable"}], "answer": "B", "explanation": "A **random cortisol is not helpful** because the normal range swings widely across the day."}]}, {"teach": "One of the three samples a whole day of free hormone, which is why it leads the list.", "stem": "Which screening test for hypercortisolism is both the best initial test and the most sensitive?", "options": [{"letter": "A", "text": "Late-night salivary cortisol"}, {"letter": "B", "text": "Overnight 1-mg dexamethasone suppression"}, {"letter": "C", "text": "Plasma ACTH level"}, {"letter": "D", "text": "24-hour urine free cortisol"}], "answer": "D", "explanation": "**24-hour urine free cortisol** is the best initial and most sensitive test; a markedly raised value needs no further confirmation."}, {"teach": "The salivary test exists for a practical reason — no laboratory draws blood at midnight.", "stem": "What makes late-night salivary cortisol practical as a screening test?", "options": [{"letter": "A", "text": "It needs no reference range"}, {"letter": "B", "text": "It can be collected at any hour of the day"}, {"letter": "C", "text": "The kit is collected at home and mailed in"}, {"letter": "D", "text": "It also reports the plasma ACTH"}], "answer": "C", "explanation": "The salivary kit is **collected at home on two or more nights and mailed in**, and a high value shows loss of diurnal variation."}], "checkpoints": [{"stem": "A patient's first screening test is borderline rather than clearly abnormal. What is the appropriate next move?", "options": [{"letter": "A", "text": "Repeat or add a second screening test"}, {"letter": "B", "text": "Proceed straight to adrenal imaging"}, {"letter": "C", "text": "Call the result normal and stop"}, {"letter": "D", "text": "Begin treatment for Cushing syndrome"}], "answer": "A", "explanation": "Cortisol is elevated only intermittently in many patients, so **more than one abnormal test** is often needed."}, {"stem": "Which fraction of circulating cortisol does the 24-hour urine free cortisol test measure?", "options": [{"letter": "A", "text": "Total cortisol"}, {"letter": "B", "text": "The unbound (free) fraction"}, {"letter": "C", "text": "The CBG-bound fraction"}, {"letter": "D", "text": "The albumin-bound fraction"}], "answer": "B", "explanation": "Only the **unbound (free)** fraction is filtered by the kidney, and only the free fraction is biologically active."}]}}, {"id": "7", "group": 7, "section": "Hypercortisolism — DST interpretation", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "How should an 8 AM cortisol level of 9 µg/dL be interpreted after an overnight 1-mg dexamethasone suppression test?", "options": [{"letter": "A", "text": "Normal suppression — Cushing's excluded"}, {"letter": "B", "text": "Failure to suppress — suggests Cushing's"}, {"letter": "C", "text": "Adrenal insufficiency is likely"}, {"letter": "D", "text": "Test invalid — repeat at midnight"}], "answer": "B", "explanation": "Normal is suppression to **below 2 µg/dL**; a value **above 5 µg/dL is failure to suppress**, which is suggestive of Cushing syndrome.", "objective": "", "remediation": {"steps": [{"teach": "In a normal axis the 11 PM dexamethasone dose shuts ACTH off overnight, so the morning cortisol should be very low.", "stem": "What morning cortisol value counts as normal suppression after the overnight 1-mg dexamethasone test?", "options": [{"letter": "A", "text": "Below 10 µg/dL"}, {"letter": "B", "text": "Between 8 and 25 µg/dL"}, {"letter": "C", "text": "Above 18 µg/dL"}, {"letter": "D", "text": "Below 2 µg/dL"}], "answer": "D", "explanation": "Normal suppression is a cortisol **below 2 µg/dL** the next morning.", "clarify": [{"stem": "What is the dose and timing of dexamethasone in the overnight low-dose test?", "options": [{"letter": "A", "text": "1 mg by mouth at 11 PM"}, {"letter": "B", "text": "250 mcg intravenously at 8 AM"}], "answer": "A", "explanation": "Give **1 mg dexamethasone by mouth at 11 PM** and draw plasma cortisol at 8–9 AM."}, {"stem": "What is a cortisol above 5 µg/dL the morning after the test called?", "options": [{"letter": "A", "text": "Normal suppression"}, {"letter": "B", "text": "Failure to suppress"}], "answer": "B", "explanation": "Above 5 µg/dL is **failure to suppress** — the axis has no working brake."}]}, {"teach": "What this test documents is a lost brake, not a lost rhythm.", "stem": "Which normal physiologic response does an abnormal dexamethasone suppression test show has been lost?", "options": [{"letter": "A", "text": "Renin responsiveness to volume"}, {"letter": "B", "text": "Diurnal variation of cortisol"}, {"letter": "C", "text": "Negative feedback on the HPA axis"}, {"letter": "D", "text": "Adrenal reserve in response to ACTH"}], "answer": "C", "explanation": "The DST documents loss of **negative feedback**; the late-night cortisol is what documents loss of diurnal variation."}], "checkpoints": [{"stem": "Why is dexamethasone, rather than hydrocortisone, used for this test?", "options": [{"letter": "A", "text": "It is short-acting and cleared before the draw"}, {"letter": "B", "text": "It has strong mineralocorticoid activity"}, {"letter": "C", "text": "It raises ACTH briefly before suppressing it"}, {"letter": "D", "text": "It is potent and does not interfere with the cortisol assay"}], "answer": "D", "explanation": "Dexamethasone is **potent, long-acting, minimally mineralocorticoid and invisible to the cortisol assay**."}, {"stem": "A patient's cortisol is 1.2 µg/dL the morning after a 1-mg dexamethasone dose. How should this be read?", "options": [{"letter": "A", "text": "Adrenal insufficiency"}, {"letter": "B", "text": "Ectopic ACTH secretion"}, {"letter": "C", "text": "Normal suppression"}, {"letter": "D", "text": "Failure to suppress"}], "answer": "C", "explanation": "A value **below 2 µg/dL** is normal suppression."}]}}, {"id": "8", "group": 8, "section": "Reason for hypercortisolism — finding the level", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What test should be ordered next to determine the source of confirmed hypercortisolism?", "options": [{"letter": "A", "text": "Plasma ACTH level"}, {"letter": "B", "text": "Repeat 24-h urine cortisol"}, {"letter": "C", "text": "Plasma renin activity"}, {"letter": "D", "text": "Plasma free metanephrines"}], "answer": "A", "explanation": "Once hypercortisolism is proven, **plasma ACTH** separates ACTH-dependent from ACTH-independent disease.", "objective": "", "remediation": {"steps": [{"teach": "Step 2 of the pattern uses a second hormone to find the level of the lesion — the hormone that sits directly upstream.", "stem": "Which hormone sits directly upstream of cortisol in the HPA axis?", "options": [{"letter": "A", "text": "Angiotensin II"}, {"letter": "B", "text": "ACTH"}, {"letter": "C", "text": "Renin"}, {"letter": "D", "text": "Aldosterone"}], "answer": "B", "explanation": "**ACTH** drives cortisol directly, so its level tells you whether the drive is coming from above the adrenal.", "clarify": [{"stem": "Which hormone pair is used to evaluate aldosterone disorders instead?", "options": [{"letter": "A", "text": "Aldosterone with plasma renin activity"}, {"letter": "B", "text": "Cortisol with ACTH"}], "answer": "A", "explanation": "Aldosterone is read against **plasma renin activity**, its own regulator."}]}, {"teach": "Cortisol excess should switch its own driver off, so one measurement splits the diagnosis in two.", "stem": "Which two categories does the plasma ACTH result separate?", "options": [{"letter": "A", "text": "Primary and secondary adrenal insufficiency"}, {"letter": "B", "text": "Benign and malignant adrenal tumours"}, {"letter": "C", "text": "Acute and chronic hypercortisolism"}, {"letter": "D", "text": "ACTH-dependent and ACTH-independent disease"}], "answer": "D", "explanation": "A suppressed ACTH means **ACTH-independent** disease; a high or inappropriately normal ACTH means **ACTH-dependent** disease."}], "checkpoints": [{"stem": "In what order are the three steps of the hypercortisolism workup performed?", "options": [{"letter": "A", "text": "Imaging, then ACTH, then cortisol testing"}, {"letter": "B", "text": "ACTH, then imaging, then cortisol testing"}, {"letter": "C", "text": "Document cortisol excess, then ACTH, then imaging"}, {"letter": "D", "text": "Imaging, then cortisol testing, then ACTH"}], "answer": "C", "explanation": "Document the excess, use **ACTH to find the level**, then image the gland that holds the lesion."}]}}, {"id": "9", "group": 9, "section": "Imaging — ACTH-dependent vs independent hypercortisolism", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "A patient with proven hypercortisolism has a suppressed plasma ACTH. Which imaging study is indicated?", "options": [{"letter": "A", "text": "MRI of the pituitary with contrast"}, {"letter": "B", "text": "Ultrasound of the adrenal glands"}, {"letter": "C", "text": "CT or MRI of the adrenals with contrast"}, {"letter": "D", "text": "Non-contrast CT of the head"}], "answer": "C", "explanation": "A low ACTH means **ACTH-independent** disease — an adrenal tumour — so the adrenals are imaged with **CT or MRI with contrast**.", "objective": "", "remediation": {"steps": [{"teach": "A suppressed ACTH means the pituitary has been switched off by cortisol arriving from somewhere else.", "stem": "What does a suppressed plasma ACTH in a hypercortisolaemic patient tell you about the source?", "options": [{"letter": "A", "text": "The hypothalamus is over-producing CRH"}, {"letter": "B", "text": "A pituitary adenoma is driving cortisol"}, {"letter": "C", "text": "The adrenal gland is making cortisol autonomously"}, {"letter": "D", "text": "An ectopic tumour is making ACTH"}], "answer": "C", "explanation": "Normal feedback suppresses ACTH when the **adrenal** is making cortisol on its own.", "clarify": [{"stem": "What does a high or inappropriately normal ACTH point to instead?", "options": [{"letter": "A", "text": "An adrenal tumour"}, {"letter": "B", "text": "A pituitary or ectopic ACTH source"}], "answer": "B", "explanation": "High or normal ACTH means **ACTH-dependent** disease — pituitary adenoma or ectopic ACTH."}]}, {"teach": "Each category has its own study: image the gland that holds the lesion.", "stem": "Which study is ordered when hypercortisolism is ACTH-dependent?", "options": [{"letter": "A", "text": "Thyroid ultrasound"}, {"letter": "B", "text": "CT of the adrenals with contrast"}, {"letter": "C", "text": "Chest radiograph"}, {"letter": "D", "text": "MRI of the pituitary with contrast"}], "answer": "D", "explanation": "ACTH-dependent disease is imaged with **MRI of the pituitary with contrast**.", "clarify": [{"stem": "What size distinguishes a pituitary macroadenoma from a microadenoma?", "options": [{"letter": "A", "text": "Greater than 10 mm"}, {"letter": "B", "text": "Greater than 2 mm"}], "answer": "A", "explanation": "**Macroadenoma is above 10 mm**; most pituitary adenomas are microadenomas under 10 mm."}]}], "checkpoints": [{"stem": "A pituitary macroadenoma is suspected. Which bedside examination should be performed?", "options": [{"letter": "A", "text": "Visual fields to confrontation"}, {"letter": "B", "text": "The Romberg test"}, {"letter": "C", "text": "The Babinski reflex"}, {"letter": "D", "text": "Cup-to-disc estimation"}], "answer": "A", "explanation": "A macroadenoma can compress the optic chiasm, so check **visual fields to confrontation** for bitemporal hemianopsia."}]}}, {"id": "10", "group": 10, "section": "Ectopic ACTH", "topic": "Cushing syndrome", "skill": "Disease process", "stem": "Which tumour is classically associated with ectopic ACTH secretion?", "options": [{"letter": "A", "text": "Papillary thyroid cancer"}, {"letter": "B", "text": "Renal cell carcinoma"}, {"letter": "C", "text": "Adrenal cortical adenoma"}, {"letter": "D", "text": "Small cell lung cancer"}], "answer": "D", "explanation": "Ectopic ACTH is a paraneoplastic phenomenon — think **small cell lung carcinoma**, and also thymic, pancreatic islet cell and medullary thyroid tumours.", "objective": "", "remediation": {"steps": [{"teach": "'Ectopic' means the ACTH is being made somewhere other than the pituitary, usually by a neuroendocrine-type tumour.", "stem": "What plasma ACTH level is expected when a non-pituitary tumour is secreting ACTH?", "options": [{"letter": "A", "text": "Low-normal"}, {"letter": "B", "text": "Suppressed"}, {"letter": "C", "text": "Undetectable"}, {"letter": "D", "text": "High"}], "answer": "D", "explanation": "An ectopic source makes plasma ACTH **high**, exactly as a pituitary source does.", "clarify": [{"stem": "Where does ectopic ACTH arise from?", "options": [{"letter": "A", "text": "The adrenal cortex"}, {"letter": "B", "text": "A tumour outside the pituitary"}], "answer": "B", "explanation": "By definition it comes from a **non-pituitary tumour**."}]}, {"teach": "The prototype in this lecture is a thoracic malignancy with neuroendocrine behaviour.", "stem": "Which lung cancer should come to mind first when ectopic ACTH is suspected?", "options": [{"letter": "A", "text": "Squamous cell carcinoma"}, {"letter": "B", "text": "Adenocarcinoma"}, {"letter": "C", "text": "Small cell lung carcinoma"}, {"letter": "D", "text": "Large cell carcinoma"}], "answer": "C", "explanation": "**Small cell lung carcinoma** is the classic ectopic ACTH producer."}], "checkpoints": [{"stem": "Besides small cell lung cancer, which tumour can also secrete ectopic ACTH?", "options": [{"letter": "A", "text": "Bilateral adrenal hyperplasia"}, {"letter": "B", "text": "Papillary thyroid carcinoma"}, {"letter": "C", "text": "An aldosterone-producing adenoma"}, {"letter": "D", "text": "Medullary thyroid carcinoma"}], "answer": "D", "explanation": "Thymic tumours, pancreatic islet cell tumours and **medullary thyroid carcinoma** can all secrete ACTH."}]}}, {"id": "11", "group": 11, "section": "Why biochemistry before imaging", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "Why must hypercortisolism be proven biochemically before the adrenal glands are imaged?", "options": [{"letter": "A", "text": "Contrast is contraindicated in hypercortisolism"}, {"letter": "B", "text": "The adrenal glands cannot be resolved on CT"}, {"letter": "C", "text": "Incidental adrenal adenomas are common and mostly nonfunctional"}, {"letter": "D", "text": "Imaging is never diagnostic in endocrine disease"}], "answer": "C", "explanation": "Incidentalomas are found in up to **4% of middle-aged and 10% of elderly** patients and about **85% are nonfunctional** — proving the disease first makes an imaging finding meaningful.", "objective": "", "remediation": {"steps": [{"teach": "None of the physical signs of Cushing syndrome is pathognomonic, and many of them are common in people without the disease.", "stem": "Why can the diagnosis of Cushing syndrome not rest on physical findings alone?", "options": [{"letter": "A", "text": "The findings resolve before testing is possible"}, {"letter": "B", "text": "None of the findings is pathognomonic"}, {"letter": "C", "text": "The findings appear only very late in the disease"}, {"letter": "D", "text": "The findings are visible only on imaging"}], "answer": "B", "explanation": "Obesity, hypertension, menstrual irregularity and glucose intolerance are **nonspecific**, so the diagnosis must be confirmed biochemically.", "clarify": [{"stem": "How common are incidental adrenal adenomas in middle-aged adults?", "options": [{"letter": "A", "text": "Up to about 4%"}, {"letter": "B", "text": "Fewer than 1 in 1000"}], "answer": "A", "explanation": "Up to **4% of middle-aged** and **10% of elderly** patients have one."}]}, {"teach": "The same ordering rule governs all four adrenal disorders in this lecture.", "stem": "What is the fixed sequence for evaluating every adrenal disorder in this lecture?", "options": [{"letter": "A", "text": "Imaging alone when the clinical picture is classic"}, {"letter": "B", "text": "Biochemistry only, with imaging reserved for surgical planning"}, {"letter": "C", "text": "Biochemical diagnosis first, imaging second"}, {"letter": "D", "text": "Imaging first, biochemistry second"}], "answer": "C", "explanation": "**Biochemical diagnosis first, imaging second** — for hypercortisolism, hyperaldosteronism, adrenal insufficiency and pheochromocytoma alike."}], "checkpoints": [{"stem": "A CT done for abdominal pain shows a 2 cm adrenal mass. What proportion of such incidentalomas are nonfunctional?", "options": [{"letter": "A", "text": "About 5%"}, {"letter": "B", "text": "About 25%"}, {"letter": "C", "text": "About 50%"}, {"letter": "D", "text": "About 85%"}], "answer": "D", "explanation": "About **85%** of adrenal incidentalomas are nonfunctional, which is why a mass on imaging settles nothing until the biochemistry is done."}]}}, {"id": "12", "group": 12, "section": "Hyperaldosteronism — clinical manifestations", "topic": "Primary hyperaldosteronism", "skill": "Identification", "stem": "What diagnosis should be suspected in a patient with hypertension and spontaneous hypokalemia?", "options": [{"letter": "A", "text": "Secondary adrenal insufficiency"}, {"letter": "B", "text": "Primary hyperaldosteronism"}, {"letter": "C", "text": "Pheochromocytoma"}, {"letter": "D", "text": "Addison's disease"}], "answer": "B", "explanation": "**Hypertension with hypokalemia** is the classic presentation of primary aldosteronism, sometimes with mild hypernatremia of 143–147 mEq/L.", "objective": "", "remediation": {"steps": [{"teach": "Aldosterone retains sodium and water while wasting potassium, and those two effects give the classic pair of findings.", "stem": "What happens to serum potassium when aldosterone is secreted in excess?", "options": [{"letter": "A", "text": "It falls"}, {"letter": "B", "text": "It rises"}, {"letter": "C", "text": "It is unchanged"}, {"letter": "D", "text": "It becomes unmeasurable"}], "answer": "A", "explanation": "Aldosterone drives **potassium secretion** into the urine, so excess aldosterone causes hypokalemia.", "clarify": [{"stem": "What happens to serum potassium in Addison disease, where aldosterone is deficient?", "options": [{"letter": "A", "text": "It falls"}, {"letter": "B", "text": "It rises"}], "answer": "B", "explanation": "Without aldosterone the kidney cannot excrete potassium, so Addison disease causes **hyperkalemia** — the mirror image."}]}, {"teach": "Hypertension that will not come down on an adequate regimen is the other trigger to look for an endocrine cause.", "stem": "How is treatment-resistant hypertension defined?", "options": [{"letter": "A", "text": "Not at goal on one drug at low dose"}, {"letter": "B", "text": "A pressure above 180/120 at a first visit"}, {"letter": "C", "text": "Not at goal on three drugs including a diuretic"}, {"letter": "D", "text": "Not at goal on two drugs without a diuretic"}], "answer": "C", "explanation": "Resistant hypertension is failure to reach goal on an appropriate **three-drug regimen that includes a diuretic**."}], "checkpoints": [{"stem": "Which adrenal disorder in this lecture causes hypotension rather than secondary hypertension?", "options": [{"letter": "A", "text": "Cushing syndrome"}, {"letter": "B", "text": "Primary hyperaldosteronism"}, {"letter": "C", "text": "Pheochromocytoma"}, {"letter": "D", "text": "Addison disease"}], "answer": "D", "explanation": "**Addison disease** causes hypotension; the other three are endocrine causes of secondary hypertension."}, {"stem": "What serum sodium is typical in primary hyperaldosteronism?", "options": [{"letter": "A", "text": "Markedly low, under 125 mEq/L"}, {"letter": "B", "text": "Mildly low, 130–134 mEq/L"}, {"letter": "C", "text": "Always exactly normal"}, {"letter": "D", "text": "Mildly high, 143–147 mEq/L"}], "answer": "D", "explanation": "Sodium retention gives a **mild hypernatremia of 143–147 mEq/L** in some patients."}]}}, {"id": "13", "group": 13, "section": "Hyperaldosteronism — screening", "topic": "Primary hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "What screening test is used for suspected primary hyperaldosteronism?", "options": [{"letter": "A", "text": "Plasma aldosterone : renin ratio"}, {"letter": "B", "text": "24-hour urine free cortisol"}, {"letter": "C", "text": "Plasma free metanephrines"}, {"letter": "D", "text": "8 AM serum cortisol"}], "answer": "A", "explanation": "Screen with a **simultaneous mid-morning, ambulatory plasma aldosterone concentration and plasma renin activity**, read as a ratio.", "objective": "", "remediation": {"steps": [{"teach": "Primary disease is autonomous — the hormone stays high even though its regulator has been switched off, so both must be measured together.", "stem": "Which axis normally regulates aldosterone secretion?", "options": [{"letter": "A", "text": "The sympathetic nervous system"}, {"letter": "B", "text": "The hypothalamic–pituitary–thyroid axis"}, {"letter": "C", "text": "The renin–angiotensin–aldosterone axis"}, {"letter": "D", "text": "The hypothalamic–pituitary–adrenal axis"}], "answer": "C", "explanation": "Aldosterone is run by the **RAA axis**, so renin is the hormone it must be read against.", "clarify": [{"stem": "Which disorder do plasma free metanephrines screen for instead?", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Primary hyperaldosteronism"}], "answer": "A", "explanation": "Metanephrines screen for **pheochromocytoma**."}]}, {"teach": "Both hormones are drawn at the same moment, mid-morning, with the patient up and about.", "stem": "Why is the aldosterone and renin pair drawn in the mid-morning?", "options": [{"letter": "A", "text": "Renin is undetectable overnight"}, {"letter": "B", "text": "Cortisol interferes with the assay after noon"}, {"letter": "C", "text": "Aldosterone has a morning peak driven by ACTH"}, {"letter": "D", "text": "An overnight fast is required for the assay"}], "answer": "C", "explanation": "ACTH gives aldosterone a circadian rhythm with its **highest concentrations in the morning**."}], "checkpoints": [{"stem": "What aldosterone-to-renin ratio carries roughly 90% sensitivity and specificity for primary aldosteronism?", "options": [{"letter": "A", "text": "Greater than 100"}, {"letter": "B", "text": "Greater than 30"}, {"letter": "C", "text": "Greater than 10"}, {"letter": "D", "text": "Greater than 2"}], "answer": "B", "explanation": "A ratio **above 20 is suggestive** and a ratio **above 30** is about 90% sensitive and specific."}]}}, {"id": "13a", "group": 13, "section": "Hyperaldosteronism — screening", "topic": "Primary hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "What aldosterone and renin pattern is expected in primary hyperaldosteronism?", "options": [{"letter": "A", "text": "Low aldosterone with high renin"}, {"letter": "B", "text": "High aldosterone with high renin"}, {"letter": "C", "text": "Low aldosterone with low renin"}, {"letter": "D", "text": "High aldosterone with low renin"}], "answer": "D", "explanation": "Primary aldosteronism gives a **high aldosterone with a suppressed renin** — the hormone is being made independently of its regulator.", "objective": "", "remediation": {"steps": [{"teach": "A high aldosterone retains sodium and water, and the kidney answers that expanded volume by shutting renin down.", "stem": "What happens to renin secretion when circulating volume is expanded?", "options": [{"letter": "A", "text": "It is suppressed"}, {"letter": "B", "text": "It increases"}], "answer": "A", "explanation": "Volume expansion and a rising sodium **suppress renin** release from the juxtaglomerular cells.", "clarify": [{"stem": "What aldosterone and renin pattern does Addison disease produce instead?", "options": [{"letter": "A", "text": "High aldosterone with low renin"}, {"letter": "B", "text": "Low aldosterone with high renin"}], "answer": "B", "explanation": "Addison disease is the **mirror image**: the gland cannot make aldosterone, so renin climbs."}]}, {"teach": "The two aldosterone disorders in this lecture are mirror images, and renin is what tells them apart.", "stem": "Which finding shows that an aldosterone excess is primary rather than a response to the RAA axis?", "options": [{"letter": "A", "text": "Renin is elevated"}, {"letter": "B", "text": "Sodium is low"}, {"letter": "C", "text": "Potassium is high"}, {"letter": "D", "text": "Renin is suppressed"}], "answer": "D", "explanation": "A **suppressed renin** alongside a high aldosterone means the secretion is autonomous."}], "checkpoints": [{"stem": "A patient has a low serum aldosterone with a high plasma renin activity. Which diagnosis does this suggest?", "options": [{"letter": "A", "text": "Cushing disease"}, {"letter": "B", "text": "Pheochromocytoma"}, {"letter": "C", "text": "Primary hyperaldosteronism"}, {"letter": "D", "text": "Primary adrenal insufficiency"}], "answer": "D", "explanation": "Low aldosterone with high renin is the pattern of **primary adrenal insufficiency**."}]}}, {"id": "14", "group": 14, "section": "Hyperaldosteronism — confirmation", "topic": "Primary hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "What confirmatory test should be performed after an elevated aldosterone-to-renin ratio?", "options": [{"letter": "A", "text": "Sodium loading suppression test"}, {"letter": "B", "text": "Overnight dexamethasone suppression"}, {"letter": "C", "text": "Cosyntropin stimulation test"}, {"letter": "D", "text": "24-h urine metanephrines"}], "answer": "A", "explanation": "Confirm by showing that aldosterone **fails to suppress after a high sodium load** — oral NaCl with urinary aldosterone, or IV saline with plasma aldosterone.", "objective": "", "remediation": {"steps": [{"teach": "An elevated ratio is only suggestive; confirmation means showing the hormone will not switch off when it should.", "stem": "What normally happens to aldosterone secretion after a high sodium load?", "options": [{"letter": "A", "text": "It is suppressed"}, {"letter": "B", "text": "It rises further"}], "answer": "A", "explanation": "A sodium and volume load normally **suppresses** aldosterone; in primary aldosteronism it stays high.", "clarify": [{"stem": "Is an elevated aldosterone-to-renin ratio by itself diagnostic?", "options": [{"letter": "A", "text": "No — it needs confirmatory testing"}, {"letter": "B", "text": "Yes — no further testing is needed"}], "answer": "A", "explanation": "An elevated ratio alone is **not diagnostic** and must be confirmed."}]}, {"teach": "Two versions of the sodium-loading test exist, and both belong to a specialist.", "stem": "Which pair of measurements confirms primary aldosteronism after sodium loading?", "options": [{"letter": "A", "text": "Plasma ACTH after oral NaCl, or urine cortisol after IV saline"}, {"letter": "B", "text": "Plasma renin after dexamethasone, or urine sodium after cosyntropin"}, {"letter": "C", "text": "Urinary aldosterone after oral NaCl, or plasma aldosterone after IV saline"}, {"letter": "D", "text": "Urine metanephrines after oral NaCl, or plasma cortisol after IV saline"}], "answer": "C", "explanation": "Either **oral NaCl with urinary aldosterone** or **IV saline with plasma aldosterone** demonstrates poor suppressibility."}], "checkpoints": [{"stem": "Aldosterone stays elevated despite sodium loading. What does that result establish?", "options": [{"letter": "A", "text": "Primary aldosteronism is excluded"}, {"letter": "B", "text": "Addison disease is likely"}, {"letter": "C", "text": "Pheochromocytoma is likely"}, {"letter": "D", "text": "Primary aldosteronism is confirmed"}], "answer": "D", "explanation": "Persistent elevation — **poor suppressibility** — confirms primary aldosteronism."}]}}, {"id": "15", "group": 15, "section": "Hyperaldosteronism — imaging", "topic": "Primary hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "What study should be obtained after hyperaldosteronism is biochemically confirmed?", "options": [{"letter": "A", "text": "Pituitary MRI with contrast"}, {"letter": "B", "text": "Adrenal CT or MRI"}, {"letter": "C", "text": "Renal artery Doppler"}, {"letter": "D", "text": "Chest CT for a lung mass"}], "answer": "B", "explanation": "**Adrenal CT or MRI** separates an aldosterone-producing adenoma from bilateral hyperplasia, and catches the rare aldosterone-producing carcinoma.", "objective": "", "remediation": {"steps": [{"teach": "Both causes of primary aldosteronism sit in the adrenal glands; what imaging settles is whether one gland or both are at fault.", "stem": "Which two lesions does adrenal imaging distinguish in primary aldosteronism?", "options": [{"letter": "A", "text": "Autoimmune versus tuberculous adrenalitis"}, {"letter": "B", "text": "A pituitary adenoma versus an adrenal adenoma"}, {"letter": "C", "text": "A unilateral adenoma versus bilateral hyperplasia"}, {"letter": "D", "text": "A benign versus a malignant pheochromocytoma"}], "answer": "C", "explanation": "The question imaging answers is **unilateral adenoma or bilateral hyperplasia**.", "clarify": [{"stem": "Which of those two is the more common cause of primary aldosteronism?", "options": [{"letter": "A", "text": "Bilateral idiopathic hyperplasia"}, {"letter": "B", "text": "An aldosterone-producing adenoma"}], "answer": "B", "explanation": "Conn's **adenoma** accounts for roughly two-thirds of cases; bilateral hyperplasia is milder, with less hypokalemia."}]}, {"teach": "The distinction matters because it decides between an operation and a tablet.", "stem": "Why does it matter whether imaging shows an adenoma or bilateral hyperplasia?", "options": [{"letter": "A", "text": "Adenomas need no treatment at all"}, {"letter": "B", "text": "Both are always treated surgically"}, {"letter": "C", "text": "Adenoma is treated surgically and hyperplasia medically"}, {"letter": "D", "text": "Only hyperplasia causes hypertension"}], "answer": "C", "explanation": "An adenoma is removed; bilateral disease is treated with an **aldosterone antagonist**, since one-sided surgery would not control the pressure."}], "checkpoints": [{"stem": "Adrenal CT shows bilateral hyperplasia. Which treatment is appropriate?", "options": [{"letter": "A", "text": "Unilateral adrenalectomy"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Hydrocortisone replacement"}, {"letter": "D", "text": "Spironolactone or eplerenone"}], "answer": "D", "explanation": "Bilateral idiopathic hyperplasia is treated medically with the aldosterone antagonists **spironolactone or eplerenone**."}, {"stem": "Adrenal CT shows a single 1.3 cm left adrenal adenoma. Which treatment is appropriate?", "options": [{"letter": "A", "text": "Spironolactone indefinitely"}, {"letter": "B", "text": "Unilateral adrenalectomy"}, {"letter": "C", "text": "Bilateral adrenalectomy"}, {"letter": "D", "text": "Observation without treatment"}], "answer": "B", "explanation": "An aldosterone-producing adenoma is treated with **unilateral adrenalectomy**, which can ameliorate the hypertension."}]}}, {"id": "16", "group": 16, "section": "Adrenal insufficiency — clinical manifestations", "topic": "Adrenal insufficiency", "skill": "Identification", "stem": "Which findings would you expect in a patient with primary adrenal insufficiency?", "options": [{"letter": "A", "text": "Wide purple abdominal striae"}, {"letter": "B", "text": "Treatment-resistant hypertension"}, {"letter": "C", "text": "Orthostatic hypotension"}, {"letter": "D", "text": "Craving for salt and ice water"}, {"letter": "E", "text": "Generalized hyperpigmentation"}, {"letter": "F", "text": "Hyponatremia with hyperkalemia"}], "answer": ["C", "D", "E", "F"], "explanation": "Cortisol loss gives fatigue and **hypotension**; aldosterone loss gives **hyponatremia, hyperkalemia and salt craving**; the high ACTH gives **hyperpigmentation**. Striae and resistant hypertension belong to cortisol excess.", "objective": "", "remediation": {"steps": [{"teach": "In primary disease the whole cortex is destroyed, so a glucocorticoid and a mineralocorticoid are lost at once.", "stem": "Which electrolyte pattern follows the loss of aldosterone?", "options": [{"letter": "A", "text": "Low sodium with high potassium"}, {"letter": "B", "text": "High sodium with low potassium"}, {"letter": "C", "text": "Low sodium with low potassium"}, {"letter": "D", "text": "High sodium with high potassium"}], "answer": "A", "explanation": "Without aldosterone the kidney cannot retain sodium or excrete potassium, so you see **hyponatremia with hyperkalemia**.", "clarify": [{"stem": "What happens to blood pressure when both cortisol and aldosterone are deficient?", "options": [{"letter": "A", "text": "It rises and resists treatment"}, {"letter": "B", "text": "It falls, often with orthostasis"}], "answer": "B", "explanation": "Volume depletion and lost catecholamine potentiation give **hypotension and orthostasis**."}]}, {"teach": "The skin sign is the one that separates primary from central disease, and it comes from the pituitary working too hard.", "stem": "Why is a patient with Addison disease hyperpigmented?", "options": [{"letter": "A", "text": "ACTH is high and its precursor also yields MSH"}, {"letter": "B", "text": "Cortisol deposits pigment in the dermis"}, {"letter": "C", "text": "Aldosterone loss darkens sun-exposed skin"}, {"letter": "D", "text": "Adrenal androgens stimulate melanocyte growth"}], "answer": "A", "explanation": "A failing gland cannot suppress the pituitary, so **ACTH and MSH** both rise — a tan without tan lines."}, {"teach": "The symptoms that actually bring these patients in are vague, which is why the diagnosis is often missed.", "stem": "Which set of chronic symptoms typically precedes the diagnosis of Addison disease?", "options": [{"letter": "A", "text": "Palpitations, sweating and episodic headache"}, {"letter": "B", "text": "Central obesity, bruising and glucose intolerance"}, {"letter": "C", "text": "Polyuria, polydipsia and blurred vision"}, {"letter": "D", "text": "Anorexia, nausea, weight loss and fatigue"}], "answer": "D", "explanation": "The presentation is **insidious and vague** — anorexia, nausea, weight loss, fatigue and generalized weakness."}], "checkpoints": [{"stem": "An Addison patient develops a severe infection and collapses with hypotension. What is this presentation called?", "options": [{"letter": "A", "text": "Thyroid storm"}, {"letter": "B", "text": "Hypertensive emergency"}, {"letter": "C", "text": "Addisonian crisis"}, {"letter": "D", "text": "Cushing triad"}], "answer": "C", "explanation": "Adrenal insufficiency may first declare itself as an **Addisonian crisis** when another stressor hits."}, {"stem": "Why does a patient with primary adrenal insufficiency crave salt?", "options": [{"letter": "A", "text": "Hyperkalemia alters sodium taste"}, {"letter": "B", "text": "Cortisol loss blunts taste sensitivity"}, {"letter": "C", "text": "Aldosterone loss causes renal sodium wasting"}, {"letter": "D", "text": "High ACTH stimulates appetite"}], "answer": "C", "explanation": "Without aldosterone the kidney wastes sodium, so patients **crave salt and ice water**."}]}}, {"id": "17", "group": 17, "section": "Adrenal insufficiency — types", "topic": "Adrenal insufficiency", "skill": "Disease process", "stem": "Which hormones are deficient in primary adrenal insufficiency, also called Addison disease?", "options": [{"letter": "A", "text": "Catecholamines only"}, {"letter": "B", "text": "Cortisol only"}, {"letter": "C", "text": "Cortisol and aldosterone"}, {"letter": "D", "text": "Aldosterone only"}], "answer": "C", "explanation": "**Primary** disease destroys the cortex, so **both cortisol and aldosterone** are lost; **secondary** disease costs cortisol only.", "objective": "", "remediation": {"steps": [{"teach": "Primary disease destroys the adrenal cortex itself, so every zone it contains is affected.", "stem": "Which part of the adrenal gland is destroyed in Addison disease?", "options": [{"letter": "A", "text": "The zona glomerulosa alone"}, {"letter": "B", "text": "The whole adrenal cortex"}, {"letter": "C", "text": "The adrenal medulla"}, {"letter": "D", "text": "The pituitary gland"}], "answer": "B", "explanation": "Addison disease is destruction of the **entire adrenal cortex**, taking the mineralocorticoid and glucocorticoid zones together.", "clarify": [{"stem": "Which axis controls aldosterone, so that a lack of ACTH leaves it intact?", "options": [{"letter": "A", "text": "The renin–angiotensin–aldosterone axis"}, {"letter": "B", "text": "The hypothalamic–pituitary–adrenal axis"}], "answer": "A", "explanation": "Aldosterone answers to the **RAA axis**, not to ACTH."}]}, {"teach": "Secondary disease starts above the gland, so only the ACTH-driven hormone is lost.", "stem": "Which hormone is deficient in secondary (central) adrenal insufficiency?", "options": [{"letter": "A", "text": "Aldosterone only"}, {"letter": "B", "text": "Cortisol and aldosterone"}, {"letter": "C", "text": "Catecholamines only"}, {"letter": "D", "text": "Cortisol only"}], "answer": "D", "explanation": "A central process limits ACTH, so **cortisol alone** falls while aldosterone stays normal."}], "checkpoints": [{"stem": "What is the most common cause of primary adrenal insufficiency in the United States?", "options": [{"letter": "A", "text": "Metastatic malignancy"}, {"letter": "B", "text": "Autoimmune destruction of the adrenal cortex"}, {"letter": "C", "text": "Adrenal hemorrhage"}, {"letter": "D", "text": "Tuberculous adrenalitis"}], "answer": "B", "explanation": "**Autoimmune** adrenalitis accounts for 70–90% in the US; **tuberculosis** was historically the leading cause and is still 7–20%."}, {"stem": "What plasma ACTH is expected in primary adrenal insufficiency?", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Undetectable"}, {"letter": "C", "text": "Low"}, {"letter": "D", "text": "Normal"}], "answer": "A", "explanation": "A normal pituitary keeps pushing a failing gland, giving **high ACTH with low cortisol**."}]}}, {"id": "18", "group": 18, "section": "Hypocortisolism — cosyntropin test", "topic": "Adrenal insufficiency", "skill": "Diagnostics & imaging", "stem": "What does failure of cortisol to rise after 250 mcg of IV cosyntropin indicate?", "options": [{"letter": "A", "text": "Primary adrenal insufficiency"}, {"letter": "B", "text": "Secondary adrenal insufficiency"}, {"letter": "C", "text": "Cushing's disease"}, {"letter": "D", "text": "Normal adrenal function"}], "answer": "A", "explanation": "No rise means the gland itself cannot respond, so the disease is **primary**. A normal rise points upstream, to a **secondary** cause.", "objective": "", "remediation": {"steps": [{"teach": "Cosyntropin is synthetic ACTH, so the test asks one question: can the gland itself respond?", "stem": "Which hormone does cosyntropin mimic when it is given during this test?", "options": [{"letter": "A", "text": "Dexamethasone"}, {"letter": "B", "text": "Renin"}, {"letter": "C", "text": "CRH"}, {"letter": "D", "text": "ACTH"}], "answer": "D", "explanation": "Cosyntropin is synthetic **ACTH**, given as a 250 mcg IV bolus.", "clarify": [{"stem": "What peak cortisol at 30–60 minutes counts as a normal response?", "options": [{"letter": "A", "text": "At least 18–20 µg/dL"}, {"letter": "B", "text": "Under 2 µg/dL"}], "answer": "A", "explanation": "A normal response is a rise to a peak of **18–20 µg/dL or more**."}, {"stem": "At which times is cortisol measured during the cosyntropin test?", "options": [{"letter": "A", "text": "At 0, 30 and 60 minutes"}, {"letter": "B", "text": "Only the next morning at 8 AM"}], "answer": "A", "explanation": "Draw a baseline, then **30 and 60 minutes** after the bolus."}]}, {"teach": "A gland that has been destroyed has nothing left to recruit, however hard it is stimulated.", "stem": "Why does a destroyed adrenal cortex fail to respond to cosyntropin?", "options": [{"letter": "A", "text": "Cosyntropin is cleared before it can act"}, {"letter": "B", "text": "ACTH receptors are blocked by antibodies"}, {"letter": "C", "text": "There is no functioning cortical tissue left to stimulate"}, {"letter": "D", "text": "Cortisol is consumed as fast as it is produced"}], "answer": "C", "explanation": "The cortex is gone, so there is **no tissue left to respond** — the defining feature of primary disease."}], "checkpoints": [{"stem": "A patient with symptoms of adrenal insufficiency has a normal cortisol rise after cosyntropin. What does this suggest?", "options": [{"letter": "A", "text": "Primary adrenal insufficiency"}, {"letter": "B", "text": "Cushing syndrome"}, {"letter": "C", "text": "Primary hyperaldosteronism"}, {"letter": "D", "text": "Secondary adrenal insufficiency"}], "answer": "D", "explanation": "The gland works when stimulated, so the problem is upstream — **secondary** adrenal insufficiency."}, {"stem": "A patient has a basal 8 AM cortisol of 4 µg/dL and a stimulated value of 12 µg/dL. How should this be read?", "options": [{"letter": "A", "text": "Normal adrenal function"}, {"letter": "B", "text": "Probable adrenal insufficiency — treat"}, {"letter": "C", "text": "Cushing syndrome"}, {"letter": "D", "text": "An invalid test needing repetition"}], "answer": "B", "explanation": "A basal below **5** with a stimulated value below **18 µg/dL** is probable adrenal insufficiency."}]}}, {"id": "19", "group": 19, "section": "Addison's disease — confirming primary disease", "topic": "Adrenal insufficiency", "skill": "Diagnostics & imaging", "stem": "Primary adrenal insufficiency is suspected. Which investigations belong to the next step of the workup?", "options": [{"letter": "A", "text": "Plasma free metanephrines"}, {"letter": "B", "text": "Overnight 1-mg dexamethasone suppression test"}, {"letter": "C", "text": "Late-night salivary cortisol"}, {"letter": "D", "text": "Plasma ACTH, expected to be high"}, {"letter": "E", "text": "Serum aldosterone with plasma renin activity"}, {"letter": "F", "text": "Anti-21-hydroxylase antibodies"}], "answer": ["D", "E", "F"], "explanation": "Step 2 characterises primary disease: **ACTH high**, **aldosterone low with renin high**, and **anti-21-hydroxylase antibodies** in 70–90%. The others belong to Cushing syndrome and pheochromocytoma.", "objective": "", "remediation": {"steps": [{"teach": "Step 2 of the pattern uses a second hormone to place the lesion — here, the one the pituitary sends.", "stem": "What plasma ACTH distinguishes primary from secondary adrenal insufficiency?", "options": [{"letter": "A", "text": "Low in both"}, {"letter": "B", "text": "Low in primary, high in secondary"}, {"letter": "C", "text": "High in primary, low in secondary"}, {"letter": "D", "text": "High in both"}], "answer": "C", "explanation": "A failing gland cannot suppress the pituitary, so primary disease runs a **high ACTH** and central disease a low one.", "clarify": [{"stem": "Why is ACTH high when the adrenal cortex has been destroyed?", "options": [{"letter": "A", "text": "The adrenal gland secretes ACTH itself"}, {"letter": "B", "text": "A normal pituitary keeps pushing a failing gland"}], "answer": "B", "explanation": "The pituitary is intact and responds to the low cortisol by **driving ACTH up**."}]}, {"teach": "The mineralocorticoid arm is checked with the same pair used for Conn syndrome, read in the opposite direction.", "stem": "Which aldosterone and renin pattern confirms the mineralocorticoid loss of Addison disease?", "options": [{"letter": "A", "text": "High aldosterone with low renin"}, {"letter": "B", "text": "High aldosterone with high renin"}, {"letter": "C", "text": "Low aldosterone with low renin"}, {"letter": "D", "text": "Low aldosterone with high renin"}], "answer": "D", "explanation": "**Low aldosterone with a high plasma renin activity** is the exact mirror of primary hyperaldosteronism."}, {"teach": "The last piece is the cause, and in this country that is nearly always autoimmune.", "stem": "Which antibody supports an autoimmune cause of Addison disease?", "options": [{"letter": "A", "text": "Anti-TSH receptor"}, {"letter": "B", "text": "Anti-thyroid peroxidase"}, {"letter": "C", "text": "Anti-21-hydroxylase"}, {"letter": "D", "text": "Anti-GAD"}], "answer": "C", "explanation": "**Anti-21-hydroxylase** antibodies target an adrenal steroid-synthesising enzyme."}], "checkpoints": [{"stem": "In roughly what proportion of Addison disease are anti-21-hydroxylase antibodies present?", "options": [{"letter": "A", "text": "About 10–20%"}, {"letter": "B", "text": "About 30–40%"}, {"letter": "C", "text": "About 70–90%"}, {"letter": "D", "text": "Essentially 100%"}], "answer": "C", "explanation": "They are found in about **70–90%** of patients with autoimmune Addison disease."}]}}, {"id": "20", "group": 20, "section": "Secondary hypocortisolism — distinguishing", "topic": "Adrenal insufficiency", "skill": "Identification", "stem": "Which type of adrenal insufficiency is suggested by the absence of hyperpigmentation and a normal potassium level?", "options": [{"letter": "A", "text": "Primary adrenal insufficiency"}, {"letter": "B", "text": "Secondary adrenal insufficiency"}, {"letter": "C", "text": "Primary hyperaldosteronism"}, {"letter": "D", "text": "ACTH-dependent Cushing's"}], "answer": "B", "explanation": "Central disease runs a **low ACTH**, so there is no pigmentation, and it leaves **aldosterone intact**, so potassium is normal.", "objective": "", "remediation": {"steps": [{"teach": "Each of the two missing findings traces back to a hormone that central disease leaves alone.", "stem": "Which hormone must be high for hyperpigmentation to develop?", "options": [{"letter": "A", "text": "Aldosterone"}, {"letter": "B", "text": "ACTH"}, {"letter": "C", "text": "Renin"}, {"letter": "D", "text": "Cortisol"}], "answer": "B", "explanation": "Pigmentation needs a **high ACTH**, because its precursor POMC also yields MSH.", "clarify": [{"stem": "Why is potassium normal when the cause of adrenal insufficiency is central?", "options": [{"letter": "A", "text": "Aldosterone is still made under the RAA axis"}, {"letter": "B", "text": "Potassium is excreted by the liver instead"}], "answer": "A", "explanation": "The RAA axis is untouched, so **aldosterone and potassium handling stay normal**."}]}, {"teach": "Put the two findings in one line and the distinction becomes a bedside call.", "stem": "Which combination of findings identifies adrenal insufficiency as primary?", "options": [{"letter": "A", "text": "Pale skin with hypernatremia"}, {"letter": "B", "text": "Pale skin with a normal potassium"}, {"letter": "C", "text": "Hyperpigmentation with hypokalemia"}, {"letter": "D", "text": "Hyperpigmentation with hyperkalemia"}], "answer": "D", "explanation": "**Hyperpigmentation plus hyperkalemia or salt craving means primary**; neither finding means secondary."}], "checkpoints": [{"stem": "Secondary adrenal insufficiency is diagnosed. Which other hormone deficiency should you look for?", "options": [{"letter": "A", "text": "Central hypothyroidism"}, {"letter": "B", "text": "Primary hyperparathyroidism"}, {"letter": "C", "text": "Catecholamine excess"}, {"letter": "D", "text": "Primary hyperaldosteronism"}], "answer": "A", "explanation": "Central disease often takes the other pituitary axes with it — check **TSH and free T4, gonadal hormones and growth hormone**."}]}}, {"id": "21", "group": 21, "section": "Adrenal insufficiency — imaging", "topic": "Adrenal insufficiency", "skill": "Diagnostics & imaging", "stem": "Which imaging study is ordered when primary adrenal insufficiency is suspected?", "options": [{"letter": "A", "text": "Plain abdominal radiograph"}, {"letter": "B", "text": "Abdominal CT"}, {"letter": "C", "text": "Brain MRI with contrast"}, {"letter": "D", "text": "Thyroid ultrasound"}], "answer": "B", "explanation": "**Abdominal CT** looks for enlarged adrenals or an infectious, infiltrative, hemorrhagic or metastatic cause. A central cause would be imaged with brain MRI instead.", "objective": "", "remediation": {"steps": [{"teach": "Image the gland that holds the lesion — in primary disease that is the adrenal, not the pituitary.", "stem": "Where is the lesion in primary adrenal insufficiency?", "options": [{"letter": "A", "text": "In the hypothalamus"}, {"letter": "B", "text": "In the kidney"}, {"letter": "C", "text": "In the pituitary gland"}, {"letter": "D", "text": "In the adrenal gland"}], "answer": "D", "explanation": "Primary disease is destruction of the **adrenal cortex** itself.", "clarify": [{"stem": "Which imaging study is used instead when a central cause is suspected?", "options": [{"letter": "A", "text": "Abdominal CT"}, {"letter": "B", "text": "Brain MRI with contrast"}], "answer": "B", "explanation": "Secondary disease is imaged with **brain MRI with contrast**, plus labs for the other pituitary axes."}]}, {"teach": "What the scan is looking for is a cause — enlargement, infiltration, bleeding or metastasis.", "stem": "What is the abdominal CT looking for in suspected Addison disease?", "options": [{"letter": "A", "text": "A pituitary microadenoma"}, {"letter": "B", "text": "Renal artery stenosis"}, {"letter": "C", "text": "Enlarged, infiltrated, hemorrhagic or metastatic adrenals"}, {"letter": "D", "text": "Gallbladder wall thickening"}], "answer": "C", "explanation": "CT can show **enlarged adrenals** or findings that point to infection, infiltration, hemorrhage or metastasis."}], "checkpoints": [{"stem": "Tuberculosis is suspected as the cause of a patient's Addison disease. Which tests should be added?", "options": [{"letter": "A", "text": "Plasma free metanephrines"}, {"letter": "B", "text": "An overnight 1-mg dexamethasone test"}, {"letter": "C", "text": "A thyroid ultrasound"}, {"letter": "D", "text": "A PPD or IGRA with a chest radiograph"}], "answer": "D", "explanation": "If TB is suspected, add a **PPD or IGRA and a chest radiograph**."}]}}, {"id": "22", "group": 22, "section": "Pheochromocytoma — clinical manifestations", "topic": "Pheochromocytoma", "skill": "Identification", "stem": "Which diagnosis should be suspected in a patient with episodic headaches, sweating, and palpitations?", "options": [{"letter": "A", "text": "Pheochromocytoma"}, {"letter": "B", "text": "Primary hyperaldosteronism"}, {"letter": "C", "text": "Cushing's disease"}, {"letter": "D", "text": "Addison's disease"}], "answer": "A", "explanation": "The classic pheochromocytoma triad is **episodic headache, sweating and palpitations**, usually with hypertension that is paroxysmal in about half of patients.",  "explanation": "Metanephrines are **metabolites** of the catecholamines."}]}, {"teach": "That sensitive screen is a blood test rather than a timed collection.", "stem": "Which blood test is the best initial test for pheochromocytoma?", "options": [{"letter": "A", "text": "Plasma ACTH"}, {"letter": "B", "text": "Plasma aldosterone"}, {"letter": "C", "text": "Plasma renin activity"}, {"letter": "D", "text": "Plasma free metanephrines"}], "answer": "D", "explanation": "**Plasma free metanephrines** open the workup."}], "checkpoints": [{"stem": "Should the adrenal glands be imaged before the biochemical diagnosis is made?", "options": [{"letter": "A", "text": "No — biochemistry comes first in every adrenal disorder"}, {"letter": "B", "text": "Yes — imaging is faster and cheaper"}, {"letter": "C", "text": "Yes — imaging replaces biochemical testing"}, {"letter": "D", "text": "Only if the patient is hypertensive"}], "answer": "A", "explanation": "The sequence is fixed: **plasma metanephrines, then 24-hour urine, then CT or MRI**."}]}}, {"id": "24", "group": 24, "section": "Pheochromocytoma — confirmation", "topic": "Pheochromocytoma", "skill": "Diagnostics & imaging", "stem": "What confirmatory test should follow a positive plasma free metanephrine result?", "options": [{"letter": "A", "text": "Repeat plasma free metanephrines"}, {"letter": "B", "text": "Overnight 1 mg dexamethasone test"}, {"letter": "C", "text": "Plasma aldosterone : renin ratio"}, {"letter": "D", "text": "24-h urine catecholamines and metanephrines"}], "answer": "D", "explanation": "Confirm with a **24-hour urine for catecholamines and metanephrines** — a test chosen for **high specificity** that also catches fluctuating secretion.", "objective": "", "remediation": {"steps": [{"teach": "Confirmation is chosen for the opposite property to the screen — it has to be hard to pass by accident.", "stem": "Which test property is wanted in a confirmatory test?", "options": [{"letter": "A", "text": "High sensi
