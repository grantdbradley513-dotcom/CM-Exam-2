<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1a2332;
    --ink-soft: #5a6675;
    --accent: #1f5fa8;
    --accent-soft: #e8f0fa;
    --green: #1e8a4c;
    --green-bg: #e7f6ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b7791f;
    --amber-bg: #fdf3e3;
    --border: #dde3ec;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(20, 35, 60, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 110px; }

  /* Header */
  header {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  .progress-meta { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; }
  .progress-track {
    flex-basis: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 0.25s; }

  /* Question card */
  .qcard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .qnum {
    display: inline-block;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 2px 12px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .stem { margin-bottom: 14px; white-space: pre-wrap; }
  .pending { margin-top: 14px; padding: 10px 12px; border: 1px dashed #c9ccd2; border-radius: 8px;
    color: #6b7280; font-size: 0.9em; text-align: center; }
  .qimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 0 0 14px; display: block; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: #fbfcfe;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .letter {
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { color: var(--green); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt.incorrect .letter { color: var(--red); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 4px;
    font-size: 0.95rem;
  }
  .feedback.good { background: var(--green-bg); border-left: 4px solid var(--green); }
  .feedback.bad { background: var(--red-bg); border-left: 4px solid var(--red); }
  .feedback .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.good .verdict { color: var(--green); }
  .feedback.bad .verdict { color: var(--red); }
  .feedback .obj { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }

  /* Tiered compact layout: the more questions on the page, the tighter the text,
     so vignette + follow-ups fit with as little scrolling as possible. */
  .group.c2 { font-size: 16px; }
  .group.c3 { font-size: 14.5px; line-height: 1.45; }
  .group.c4 { font-size: 13.5px; line-height: 1.4; }
  .group.c3 .qcard, .group.c4 .qcard { padding: 12px 14px; margin-bottom: 10px; }
  .group.c2 .qcard { padding: 16px 18px; margin-bottom: 12px; }
  .group.c3 .opt, .group.c4 .opt { padding: 6px 10px; margin-bottom: 5px; border-width: 1.5px; }
  .group.c2 .opt { padding: 8px 12px; margin-bottom: 6px; }
  .group.c3 .stem, .group.c4 .stem { margin-bottom: 8px; }
  .group.c3 .feedback, .group.c4 .feedback { padding: 8px 12px; font-size: 0.92em; }
  .group.c3 .qnum, .group.c4 .qnum { margin-bottom: 6px; padding: 1px 10px; }
  @media (min-width: 760px) {
    .group.c3 .followups, .group.c4 .followups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .group.c3 .followups .qcard, .group.c4 .followups .qcard { margin-bottom: 10px; }
  }

  /* Missed-questions review page */
  .review-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qcard.context { background: var(--accent-soft); border: 1px dashed var(--accent); box-shadow: none; }
  .qcard.context .qnum { background: var(--card); }

  /* Nav bar */
  .navbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(20,35,60,0.08);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .navbar-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.12s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.grade { background: var(--amber-bg); color: var(--amber); }
  .btn.submit { background: var(--green); color: #fff; }
  .spacer { flex: 1; }

  /* Results */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 24px;
    margin-bottom: 16px;
    text-align: center;
  }
  .score-big { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .score-sub { color: var(--ink-soft); margin-bottom: 4px; }
  .score-note { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  .sections-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 16px;
  }
  .sections-card h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .sec-row { margin-bottom: 14px; }
  .sec-head { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 4px; gap: 8px; }
  .sec-name { font-weight: 600; }
  .sec-tag {
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 6px;
    padding: 1px 8px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .sec-tag.strong { background: var(--green-bg); color: var(--green); }
  .sec-tag.weak { background: var(--red-bg); color: var(--red); }
  .sec-track { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .sec-fill { height: 100%; border-radius: 5px; background: var(--accent); }
  .sec-fill.hi { background: var(--green); }
  .sec-fill.lo { background: var(--red); }
  .results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Adaptive tutor ---------- */
  :root { --tutor: #5b3fa6; --tutor-bg: #f5f2fc; --tutor-line: #ddd3f3; }
  .feedback.tutoring { background: var(--amber-bg); border-left: 4px solid var(--amber); margin-bottom: 22px; }
  .feedback.tutoring .verdict { color: var(--amber); }
  /* Guided review: a quiet rail instead of a filled box, so nested cards don't stack up visually */
  .tutor { border-left: 3px solid var(--tutor-line); padding: 2px 0 2px 16px; margin: 0 0 6px 4px; }
  .tutor-head { font-weight: 700; color: var(--tutor); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .tnode { background: var(--card); border: 1px solid var(--tutor-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .tnode.active { border-color: var(--tutor); box-shadow: 0 2px 10px rgba(91,63,166,0.10); }
  .tnode.done { background: #fcfcfe; }
  .tlabel { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tutor); margin-bottom: 8px; }
  .tlabel.cp { color: #fff; background: var(--tutor); border-radius: 6px; padding: 1px 8px; }
  .tlabel.clar { color: var(--amber); }
  .teach { border-left: 3px solid var(--tutor); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 0.95em; white-space: pre-wrap; color: var(--ink); }
  .tnode .stem { margin-bottom: 12px; font-weight: 500; }
  .tnode .opt { padding: 8px 12px; margin-bottom: 8px; }
  .tnode .feedback { margin-top: 10px; }
  .tnode .nudge { margin-top: 8px; color: var(--amber); font-weight: 600; font-size: 0.9em; }
  .opt.elim { opacity: 0.45; text-decoration: line-through; border-style: dashed; }
  .tnote { border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.95em; }
  .tnote.reveal { background: var(--green-bg); border-left: 4px solid var(--green); }
  .tnote.mastered { background: var(--green-bg); border-left: 4px solid var(--green); font-weight: 600; }
  .tnote.review { background: var(--red-bg); border-left: 4px solid var(--red); font-weight: 600; }
  .tnote.info { color: var(--ink-soft); padding: 0 2px; margin-bottom: 10px; font-style: italic; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
  .badge.mastered { background: var(--green-bg); color: var(--green); }
  .badge.review { background: var(--red-bg); color: var(--red); }
  .badge.active { background: var(--tutor-bg); color: var(--tutor); }
  details.trail { margin-top: 12px; }
  details.trail summary { cursor: pointer; color: var(--tutor); font-weight: 600; font-size: 0.9rem; }
  details.trail .tutor { margin-top: 12px; }

  .qcard > .feedback + .tutor { margin-top: 22px; }

  /* ---------- Results: study plan ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 4px; }
  .card .sub { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 14px; }
  .focus-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .focus-grid { grid-template-columns: 1fr 1fr; } }
  .focus-box { border-radius: 10px; padding: 12px 14px; background: var(--red-bg); border-left: 4px solid var(--red); }
  .focus-box.ok { background: var(--green-bg); border-left-color: var(--green); }
  .focus-box .k { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .focus-box .v { font-weight: 700; font-size: 1.02rem; margin-top: 2px; }
  .focus-box .n { font-size: 0.85rem; color: var(--ink-soft); }
  .todo { list-style: none; }
  .todo li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.93rem; }
  .todo li:first-child { border-top: none; }
  .todo .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
  .todo .dot.review { background: var(--red); } .todo .dot.missed { background: var(--amber); } .todo .dot.mastered { background: var(--green); }
  .todo .what { flex: 1; }
  .todo .what b { font-weight: 600; }
  .todo .tag { flex: none; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }
  .todo .tag.review { color: var(--red); } .todo .tag.missed { color: var(--amber); } .todo .tag.mastered { color: var(--green); }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 2px; }
  .bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.92rem; margin-bottom: 5px; }
  .bar-head .nm { font-weight: 600; }
  .bar-head .pc { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .bar-head .pc b { color: var(--ink); }
  .bar-meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 3px; }
  .tutor-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tutor-stats { grid-template-columns: repeat(4, 1fr); } }
  .tstat { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-soft); }
  .tstat b { display: block; font-size: 1.4rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tstat.m b { color: var(--green); } .tstat.r b { color: var(--red); } .tstat.t b { color: var(--tutor); }

ble"}, {"letter": "C", "text": "High"}, {"letter": "D", "text": "Normal-low"}], "answer": "C", "explanation": "Hirsutism/acne and hyperpigmentation occur **only if ACTH is high** (pituitary or ectopic) — adrenal adenomas usually make cortisol only.", "objective": "", "remediation": {"steps": [{"teach": "ACTH drives both **cortisol and adrenal androgens**, and its precursor POMC gives **MSH** (pigment).", "stem": "An adrenal adenoma usually secretes:", "options": [{"letter": "A", "text": "Cortisol and androgens"}, {"letter": "B", "text": "ACTH and cortisol"}, {"letter": "C", "text": "Cortisol only"}], "answer": "C", "explanation": "Most adrenal adenomas make **cortisol only**, so ACTH is suppressed and no pigment/androgen excess.", "clarify": [{"stem": "Pituitary ACTH tumor → stimulates androgens too?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "A", "explanation": "ACTH stimulates **both cortisol and androgens**."}]}], "checkpoints": [{"stem": "Cushing's due to adrenal adenoma → hyperpigmentation?", "options": [{"letter": "A", "text": "Absent"}, {"letter": "B", "text": "Present, generalized"}, {"letter": "C", "text": "Present, palms only"}, {"letter": "D", "text": "Present, oral only"}], "answer": "A", "explanation": "Adrenal-adenoma Cushing's has **low ACTH → no hyperpigmentation**."}]}}, {"id": "11", "group": 11, "section": "Cushing's — physical findings", "topic": "Cushing syndrome", "skill": "Identification", "stem": "Which finding is more specific for Cushing syndrome than for ordinary obesity?", "options": [{"letter": "A", "text": "Moon facies"}, {"letter": "B", "text": "Supraclavicular fat filling"}, {"letter": "C", "text": "Dorsocervical fat pad"}, {"letter": "D", "text": "Generalized weight gain"}], "answer": "B", "explanation": "**Facial plethora and supraclavicular filling** are more specific; moon facies and buffalo hump also occur in ordinary obesity.", "objective": "", "remediation": {"steps": [{"teach": "Cush swer": "B", "explanation": "**None are pathognomonic**, so labs are required.", "clarify": [{"stem": "Testing is most fruitful in patients with:", "options": [{"letter": "A", "text": "Multiple progressive features"}, {"letter": "B", "text": "A single vague symptom"}], "answer": "A", "explanation": "Test when there are **multiple progressive features** or findings unusual for age."}]}], "checkpoints": [{"stem": "Young adult with osteoporosis and HTN → why test for Cushing's?", "options": [{"letter": "A", "text": "Always normal in young adults"}, {"letter": "B", "text": "Imaging is cheaper"}, {"letter": "C", "text": "Findings unusual for age"}, {"letter": "D", "text": "Cortisol peaks at noon"}], "answer": "C", "explanation": "Findings **unusual for age** (e.g., osteoporosis or HTN in young adults) warrant testing."}]}}, {"id": "13", "group": 13, "section": "Hypercortisolism — 24-h urine free cortisol", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What is the best initial and most sensitive test for hypercortisolism?", "options": [{"letter": "A", "text": "Random serum cortisol"}, {"letter": "B", "text": "Plasma ACTH level"}, {"letter": "C", "text": "24-hour urine free cortisol"}, {"letter": "D", "text": "Adrenal CT with contrast"}], "answer": "C", "explanation": "**24-hour urine free cortisol** is the best initial test and most sensitive.", "objective": "", "remediation": {"steps": [{"teach": "Step 1 is always to **document the hormone excess** — before finding its level or imaging.", "stem": "Step 1 in suspected Cushing's:", "options": [{"letter": "A", "text": "Image the adrenals"}, {"letter": "B", "text": "Measure ACTH first"}, {"letter": "C", "text": "Document high cortisol"}], "answer": "C", "explanation": "First **prove hypercortisolism** biochemically.", "clarify": [{"stem": "Random cortisol → useful screen?", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "answer": "B", "explanation": "A **random cortisol is not helpful** due to diurnal variation."}]}, {"teach": "Of the three screening tests, the 24-hour collection captures a whole day of free cortisol.", "stem": "Hypercortisolism → best initial, most sensitive test:", "options": [{"letter": "A", "text": "24-hour urine free cortisol"}, {"letter": "B", "text": "Plasma ACTH level"}, {"letter": "C", "text": "Adrenal CT with contrast"}], "answer": "A", "explanation": "**24-h UFC** is best initial/most sensitive.", "clarify": []}], "checkpoints": [{"stem": "Urine free cortisol reflects which fraction of plasma cortisol?", "options": [{"letter": "A", "text": "CBG-bound cortisol"}, {"letter": "B", "text": "Albumin-bound cortisol"}, {"letter": "C", "text": "Unbound (free) cortisol"}, {"letter": "D", "text": "Total cortisol"}], "answer": "C", "explanation": "UFC reflects **plasma-unbound cortisol** filtered by the kidney."}, {"stem": "Which is NOT one of the three main hypercortisolism tests?", "options": [{"letter": "A", "text": "24-h urine free cortisol"}, {"letter": "B", "text": "Late-night salivary cortisol"}, {"letter": "C", "text": "Overnight 1 mg DST"}, {"letter": "D", "text": "Plasma ACTH level"}], "answer": "D", "explanation": "**Plasma ACTH** is the step-2 'level' test, not a screening test."}]}}, {"id": "14", "group": 14, "section": "Hypercortisolism — 24-h UFC values", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What is the most likely source of cortisol excess when 24-hour urine free cortisol is 350 µg/24 h?", "options": [{"letter": "A", "text": "Cortisol-secreting adrenal adenoma"}, {"letter": "B", "text": "Normal cortisol secretion"}, {"letter": "C", "text": "Secondary adrenal insufficiency"}, {"letter": "D", "text": "Primary hyperaldosteronism"}], "answer": "A", "explanation": "Reference ~**4–45 µg/24 h**; Cushing's disease usually **50–200**; adrenal adenoma frequently **>200**.", "objective": "", "remediation": {"steps": [{"teach": "Example reference range is about **4–45 µg/24 h**; anything far above that = hypercortisolism.", "stem": "350 µg/24 h compared with normal is:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Markedly elevated"}, {"letter": "C", "text": "Low"}], "answer": "B", "explanation": "350 is **markedly elevated** — diagnostic of hypercortisolism.", "clarify": [{"stem": "Cushing's disease UFC usually falls in:", "options": [{"letter": "A", "text": "50–200 µg/24 h"}, {"letter": "B", "text": ">200 µg/24 h"}], "answer": "A", "explanation": "Pituitary Cushing's is usually **50–200**."}]}], "checkpoints": [{"stem": "Cushing's disease (pituitary) → typical 24-h UFC:", "options": [{"letter": "A", "text": "4–45 µg/24 h"}, {"letter": "B", "text": ">500 µg/24 h"}, {"letter": "C", "text": "50–200 µg/24 h"}, {"letter": "D", "text": "<4 µg/24 h"}], "answer": "C", "explanation": "Cushing's disease usually **50–200 µg/24 h**."}]}}, {"id": "15", "group": 15, "section": "Hypercortisolism — late-night cortisol", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What does an elevated late-night salivary cortisol level reflect?", "options": [{"letter": "A", "text": "Loss of adrenal androgen output"}, {"letter": "B", "text": "Excess renin activity"}, {"letter": "C", "text": "Normal morning cortisol peak"}, {"letter": "D", "text": "Loss of normal diurnal variation"}], "answer": "D", "explanation": "A high midnight cortisol reflects **loss of normal diurnal variation** (should be lowest at night).", "objective": "", "remediation": {"steps": [{"teach": "Normally cortisol is **lowest around midnight** (usually <5 µg/dL by 11 PM).", "stem": "A high cortisol at midnight is:", "options": [{"letter": "A", "text": "Normal"}, {"letter": "B", "text": "Abnormal"}, {"letter": "C", "text": "Expected after meals"}], "answer": "B", "explanation": "Midnight should be low — high is **abnormal**.", "clarify": [{"stem": "Why salivary instead of serum at midnight?", "options": [{"letter": "A", "text": "More accurate than urine"}, {"letter": "B", "text": "Collected at home and mailed"}], "answer": "B", "explanation": "Labs don't draw at midnight; salivary kits are **collected at home and mailed**."}]}], "checkpoints": [{"stem": "Cushing's patient → morning cortisol may be:", "options": [{"letter": "A", "text": "Undetectable"}, {"letter": "B", "text": "Normal"}, {"letter": "C", "text": "Always very low"}, {"letter": "D", "text": "Zero"}], "answer": "B", "explanation": "Morning cortisol may be **normal**; the evening value is what is high."}]}}, {"id": "16", "group": 16, "section": "Hypercortisolism — timing the cortisol draw", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "At what time should cortisol be measured when cortisol excess is suspected?", "options": [{"letter": "A", "text": "Early morning (8 AM)"}, {"letter": "B", "text": "Late night (midnight)"}, {"letter": "C", "text": "Random time of day"}, {"letter": "D", "text": "Mid-afternoon (3 PM)"}], "answer": "B", "explanation": "Time cortisol to when it should be **low** — **midnight** for suspected Cushing's; random levels are not helpful.", "objective": "", "remediation": {"steps": [{"teach": "Pick the time when a normal person's cortisol should be at its **lowest**, so an elevated value stands out.", "stem": "Normal cortisol is lowest at:", "options": [{"letter": "A", "text": "8 AM"}, {"letter": "B", "text": "Midnight"}], "answer": "B", "explanation": "Normal nadir = **midnight**.", "clarify": [{"stem": "Suspected cortisol DEFICIENCY → draw at:", "options": [{"letter": "A", "text": "8 AM"}, {"letter": "B", "text": "Midnight"}], "answer": "A", "explanation": "For deficiency, draw at **8 AM** when it should be highest."}]}], "checkpoints": [{"stem": "Suspected adrenal insufficiency → time to measure cortisol:", "options": [{"letter": "A", "text": "Early morning (8 AM)"}, {"letter": "B", "text": "Late night (midnight)"}, {"letter": "C", "text": "Random time of day"}, {"letter": "D", "text": "Mid-afternoon (3 PM)"}], "answer": "A", "explanation": "Deficiency → **8 AM** cortisol (should be highest then)."}]}}, {"id": "17", "group": 17, "section": "Hypercortisolism — overnight DST", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What dose of dexamethasone is given for an overnight low-dose suppression test, and when is it administered?", "options": [{"letter": "A", "text": "250 mcg IV at 8 AM"}, {"letter": "B", "text": "1 mg PO at 11 PM"}, {"letter": "C", "text": "8 mg PO at 8 AM"}, {"letter": "D", "text": "1 mg IV at noon"}], "answer": "B", "explanation": "Give **1 mg dexamethasone PO at 11 PM**, then measure plasma cortisol at **8–9 AM**.", "objective": "", "remediation": {"steps": [{"teach": "It is called 'overnight' and 'low-dose' — the dose is given at night and cortisol is checked next morning.", "stem": "When is the cortisol measured?", "options": [{"letter": "A", "text": "Immediately after the dose"}, {"letter": "B", "text": "8–9 AM next morning"}, {"letter": "C", "text": "Midnight the same night"}], "answer": "B", "explanation": "Cortisol is drawn at **8–9 AM**.", "clarify": [{"stem": "250 mcg IV cosyntropin belongs to which test?", "options": [{"letter": "A", "text": "Dexamethasone suppression test"}, {"letter": "B", "text": "ACTH stimulation test"}], "answer": "B", "explanation": "250 mcg cosyntropin IV is the **ACTH (cosyntropin) stimulation test** for insufficiency."}]}], "checkpoints": [{"stem": "Why dexamethasone for the DST?", "options": [{"letter": "A", "text": "It is a mineralocorticoid"}, {"letter": "B", "text": "It is short-acting"}, {"letter": "C", "text": "It raises ACTH"}, {"letter": "D", "text": "Doesn't interfere with cortisol assay"}], "answer": "D", "explanation": "Dexamethasone is potent, long-acting, minimally mineralocorticoid, and **does not interfere with cortisol measurement**."}]}}, {"id": "18", "group": 18, "section": "Hypercortisolism — DST interpretation", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "How should an 8 AM cortisol level of 9 µg/dL be interpreted after an overnight 1-mg dexamethasone suppression test?", "options": [{"letter": "A", "text": "Normal suppression — Cushing's excluded"}, {"letter": "B", "text": "Adrenal insufficiency is likely"}, {"letter": "C", "text": "Test invalid — repeat at midnight"}, {"letter": "D", "text": "Failure to suppress — suggests Cushing's"}], "answer": "D", "explanation": "Normal = suppressed to **<2 µg/dL**; **>5 µg/dL = failure to suppress** → suggestive of Cushing's.", "objective": "", "remediation": {"steps": [{"teach": "Normally dexamethasone shuts down ACTH, so morning cortisol should fall **below 2 µg/dL**.", "stem": "Normal post-DST cortisol is:", "options": [{"letter": "A", "text": ">5 µg/dL"}, {"letter": "B", "text": "<2 µg/dL"}, {"letter": "C", "text": "8–25 µg/dL"}], "answer": "B", "explanation": "Normal suppression = **<2 µg/dL**.", "clarify": [{"stem": "Cortisol >5 µg/dL after DST is called:", "options": [{"letter": "A", "text": "Failure to suppress"}, {"letter": "B", "text": "Normal suppression"}], "answer": "A", "explanation": ">5 = **non-suppression / failure to suppress**."}]}], "checkpoints": [{"stem": "Cortisol 1.2 µg/dL after overnight 1 mg DST → interpretation:", "options": [{"letter": "A", "text": "Failure to suppress"}, {"letter": "B", "text": "Adrenal insufficiency"}, {"letter": "C", "text": "Normal suppression"}, {"letter": "D", "text": "Ectopic ACTH"}], "answer": "C", "explanation": "<2 µg/dL = **normal suppression**."}]}}, {"id": "19", "group": 19, "section": "Hypercortisolism — DST purpose", "topic": "Cushing syndrome", "skill": "Disease process", "stem": "Loss of which normal response is documented by an abnormal overnight dexamethasone suppression test?", "options": [{"letter": "A", "text": "Diurnal cortisol variation"}, {"letter": "B", "text": "Renin responsiveness"}, {"letter": "C", "text": "Negative feedback on the HPA axis"}, {"letter": "D", "text": "Adrenal reserve to ACTH"}], "answer": "C", "explanation": "The DST documents **loss of negative feedback** of cortisol on the HPA axis.", "objective": "", "remediation": {"steps": [{"teach": "Dexamethasone acts like cortisol at the pituitary — in a normal axis it should **shut off ACTH**.", "stem": "Normal response to dexamethasone → ACTH:", "options": [{"letter": "A", "text": "Increased"}, {"letter": "B", "text": "Suppressed"}, {"letter": "C", "text": "Unchanged"}], "answer": "B", "explanation": "Normal axis → **ACTH suppressed** → cortisol falls.", "clarify": [{"stem": "Which test documents loss of DIURNAL variation?", "options": [{"letter": "A", "text": "Dexamethasone suppression"}, {"letter": "B", "text": "Late-night salivary cortisol"}], "answer": "B", "explanation": "**Midnight cortisol** = diurnal variation; DST = feedback."}]}], "checkpoints": [{"stem": "Late-night salivary cortisol → documents loss of:", "options": [{"letter": "A", "text": "Negative feedback"}, {"letter": "B", "text": "Diurnal variation"}, {"letter": "C", "text": "Renin suppression"}, {"letter": "D", "text": "Adrenal reserve"}], "answer": "B", "explanation": "Midnight cortisol documents **loss of diurnal variation**."}]}}, {"id": "20", "group": 20, "section": "Reason for hypercortisolism — finding the level", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What test should be ordered next to determine the source of confirmed hypercortisolism?", "options": [{"letter": "A", "text": "Plasma ACTH level"}, {"letter": "B", "text": "Repeat 24-h urine cortisol"}, {"letter": "C", "text": "Plasma renin activity"}, {"letter": "D", "text": "Plasma free metanephrines"}], "answer": "A", "explanation": "Once hypercortisolism is proven, **plasma ACTH** distinguishes ACTH-dependent from ACTH-independent.", "objective": "", "remediation": {"steps": [{"teach": "Step 2 uses a **second hormone** to tell pituitary/ectopic from adrenal — the hormone just upstream of cortisol.", "stem": "Hormone directly upstream of cortisol:", "options": [{"letter": "A", "text": "Renin"}, {"letter": "B", "text": "ACTH"}, {"letter": "C", "text": "Aldosterone"}], "answer": "B", "explanation": "**ACTH** is directly upstream of cortisol.", "clarify": [{"stem": "Plasma renin is used mainly to evaluate:", "options": [{"letter": "A", "text": "Aldosterone disorders"}, {"letter": "B", "text": "Cortisol disorders"}], "answer": "A", "explanation": "Renin pairs with **aldosterone**."}]}], "checkpoints": [{"stem": "Hypercortisolism workup order:", "options": [{"letter": "A", "text": "Cortisol test → ACTH → imaging"}, {"letter": "B", "text": "Imaging → ACTH → cortisol test"}, {"letter": "C", "text": "ACTH → imaging → cortisol test"}, {"letter": "D", "text": "Imaging → cortisol test → ACTH"}], "answer": "A", "explanation": "Document excess → **ACTH for level** → then image."}]}}, {"id": "21", "group": 21, "section": "ACTH dependent vs independent", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What is the source of cortisol excess when cortisol is elevated and ACTH is low?", "options": [{"letter": "A", "text": "Adrenal adenoma"}, {"letter": "B", "text": "Pituitary adenoma"}, {"letter": "C", "text": "Ectopic ACTH tumor"}, {"letter": "D", "text": "Hypothalamic CRH excess"}], "answer": "A", "explanation": "Excess cortisol should suppress ACTH; **low ACTH → ACTH-independent → adrenal tumor**.", "objective": "", "remediation": {"steps": [{"teach": "If the **adrenal** autonomously makes cortisol, the normal pituitary sees the excess and **shuts ACTH off**.", "stem": "Autonomous adrenal cortisol → ACTH:", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Suppressed (low)"}, {"letter": "C", "text": "Normal-high"}], "answer": "B", "explanation": "Feedback **suppresses ACTH**.", "clarify": [{"stem": "Pituitary ACTH tumor → plasma ACTH:", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High or normal"}], "answer": "B", "explanation": "Pituitary source → ACTH **high (or inappropriately normal)**."}]}], "checkpoints": [{"stem": "↑ Cortisol, ↑ ACTH → source category:", "options": [{"letter": "A", "text": "ACTH-independent"}, {"letter": "B", "text": "Exogenous steroid"}, {"letter": "C", "text": "Adrenal adenoma"}, {"letter": "D", "text": "ACTH-dependent"}], "answer": "D", "explanation": "High ACTH = **ACTH-dependent** (pituitary or ectopic)."}]}}, {"id": "22", "group": 22, "section": "Ectopic ACTH", "topic": "Cushing syndrome", "skill": "Disease process", "stem": "Which tumor is classically associated with ectopic ACTH secretion?", "options": [{"letter": "A", "text": "Papillary thyroid cancer"}, {"letter": "B", "text": "Renal cell carcinoma"}, {"letter": "C", "text": "Adrenal cortical adenoma"}, {"letter": "D", "text": "Small cell lung cancer"}], "answer": "D", "explanation": "Ectopic ACTH as a paraneoplastic phenomenon — **think small cell lung CA** (also thymic, pancreatic islet, medullary thyroid).", "objective": "", "remediation": {"steps": [{"teach": "'Ectopic' means ACTH made **outside the pituitary**, typically by a neuroendocrine-type tumor.", "stem": "Ectopic ACTH → plasma ACTH level:", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "High"}, {"letter": "C", "text": "Undetectable"}], "answer": "B", "explanation": "Ectopic ACTH makes plasma ACTH **high**.", "clarify": [{"stem": "Ectopic ACTH arises from:", "options": [{"letter": "A", "text": "A non-pituitary tumor"}, {"letter": "B", "text": "The adrenal cortex"}], "answer": "A", "explanation": "It comes from a **non-pituitary tumor** (e.g., lung)."}]}], "checkpoints": [{"stem": "Which tumor can ALSO secrete ectopic ACTH?", "options": [{"letter": "A", "text": "Papillary thyroid carcinoma"}, {"letter": "B", "text": "Aldosterone-producing adenoma"}, {"letter": "C", "text": "Medullary thyroid carcinoma"}, {"letter": "D", "text": "Bilateral adrenal hyperplasia"}], "answer": "C", "explanation": "Small cell lung, thymic, pancreatic islet cell tumors, and **medullary thyroid CA** can secrete ACTH."}]}}, {"id": "23", "group": 23, "section": "Imaging — ACTH-dependent hypercortisolism", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What imaging should be ordered in a patient with hypercortisolism and elevated ACTH?", "options": [{"letter": "A", "text": "CT of adrenals with contrast"}, {"letter": "B", "text": "Ultrasound of the adrenals"}, {"letter": "C", "text": "MRI of pituitary with contrast"}, {"letter": "D", "text": "Non-contrast CT of the head"}], "answer": "C", "explanation": "ACTH-dependent → **MRI of the pituitary with contrast**; ACTH-independent → CT/MRI of adrenals.", "objective": "", "remediation": {"steps": [{"teach": "High ACTH points to an ACTH source — most often a **pituitary adenoma**.", "stem": "High ACTH → most likely lesion site:", "options": [{"letter": "A", "text": "Pituitary"}, {"letter": "B", "text": "Adrenal gland"}], "answer": "A", "explanation": "High ACTH = **pituitary** (or ectopic).", "clarify": [{"stem": "Low ACTH Cushing's → image:", "options": [{"letter": "A", "text": "Pituitary"}, {"letter": "B", "text": "Adrenal glands"}], "answer": "B", "explanation": "Low ACTH → **CT/MRI adrenals**."}]}], "checkpoints": [{"stem": "Hypercortisolism with low ACTH → imaging to order:", "options": [{"letter": "A", "text": "MRI of pituitary with contrast"}, {"letter": "B", "text": "CT or MRI of adrenals with contrast"}, {"letter": "C", "text": "Chest x-ray"}, {"letter": "D", "text": "Thyroid ultrasound"}], "answer": "B", "explanation": "ACTH-independent → **adrenal CT/MRI with contrast**."}]}}, {"id": "24", "group": 24, "section": "Why biochemistry before imaging", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "Why should hypercortisolism be confirmed before imaging the adrenal glands?", "options": [{"letter": "A", "text": "Contrast is contraindicated"}, {"letter": "B", "text": "Incidentalomas are common"}, {"letter": "C", "text": "Adrenals can't be imaged"}, {"letter": "D", "text": "Imaging is never diagnostic"}], "answer": "B", "explanation": "Sensitive imaging finds **incidentalomas** of no consequence — prove disease **biochemically first**, then image.", "objective": "", "remediation": {"steps": [{"teach": "Incidental adrenal adenomas are found in up to **4% of middle-aged** and **10% of elderly** people.", "stem": "Most incidental adrenal adenomas are:", "options": [{"letter": "A", "text": "Cortisol-secreting"}, {"letter": "B", "text": "Nonfunctional"}, {"letter": "C", "text": "Malignant"}], "answer": "B", "explanation": "**~85% are nonfunctional**.", "clarify": [{"stem": "Rule for every adrenal disorder:", "options": [{"letter": "A", "text": "Biochemistry first, imaging second"}, {"letter": "B", "text": "Imaging first, biochemistry second"}], "answer": "A", "explanation": "**Biochemical diagnosis FIRST**, then imaging."}]}], "checkpoints": [{"stem": "Functional adrenal adenomas most commonly secrete:", "options": [{"letter": "A", "text": "Cortisol"}, {"letter": "B", "text": "Androgens"}, {"letter": "C", "text": "Catecholamines"}, {"letter": "D", "text": "ACTH"}], "answer": "A", "explanation": "The ~15% functional adenomas usually secrete **cortisol** (sometimes aldosterone, rarely androgens)."}]}}, {"id": "25", "group": 25, "section": "Cushing's disease — pituitary adenoma", "topic": "Cushing syndrome", "skill": "Diagnostics & imaging", "stem": "What size defines a pituitary macroadenoma?", "options": [{"letter": "A", "text": ">2 mm"}, {"letter": "B", "text": ">5 mm"}, {"letter": "C", "text": ">10 mm"}, {"letter": "D", "text": ">20 mm"}], "answer": "C", "explanation": "**Macroadenoma >10 mm**; microadenoma <10 mm. Most pituitary adenomas are **microadenomas**.", "objective": "", "remediation": {"steps": [{"teach": "The 10 mm (1 cm) line separates the two adenoma size categories.", "stem": "Most pituitary adenomas are:", "options": [{"letter": "A", "text": "Microadenomas"}, {"letter": "B", "text": "Macroadenomas"}], "answer": "A", "explanation": "Most are **microadenomas (<10 mm)**.", "clarify": [{"stem": "Large pituitary mass → visual field defect:", "options": [{"letter": "A", "text": "Homonymous hemianopsia"}, {"letter": "B", "text": "Bitemporal hemianopsia"}], "answer": "B", "explanation": "Mass effect on the chiasm → **bitemporal hemianopsia**."}]}], "checkpoints": [{"stem": "Pituitary mass suspected → bedside exam to perform:", "options": [{"letter": "A", "text": "Fundoscopic cup-to-disc ratio"}, {"letter": "B", "text": "Romberg test"}, {"letter": "C", "text": "Babinski reflex"}, {"letter": "D", "text": "Visual fields to confrontation"}], "answer": "D", "explanation": "Check **visual fields to confrontation** for bitemporal hemianopsia."}]}}, {"id": "26", "group": 26, "section": "Hyperaldosteronism — clinical manifestations", "topic": "Primary hyperaldosteronism", "skill": "Identification", "stem": "What diagnosis should be suspected in a patient with hypertension and spontaneous hypokalemia?", "options": [{"letter": "A", "text": "Addison's disease"}, {"letter": "B", "text": "Primary hyperaldosteronism"}, {"letter": "C", "text": "Secondary adrenal insufficiency"}, {"letter": "D", "text": "Pheochromocytoma"}], "answer": "B", "explanation": "Classic presentation of **primary aldosteronism = hypertension + hypokalemia** (± mild hypernatremia 143–147).", "objective": "", "remediation": {"steps": [{"teach": "Aldosterone retains **Na⁺/water** (→ ↑BP) and wastes **K⁺** (→ ↓K⁺).", "stem": "Aldosterone excess → potassium:", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}, {"letter": "C", "text": "Normal"}], "answer": "B", "explanation": "Excess aldosterone → **hypokalemia**.", "clarify": [{"stem": "Addison's disease → potassium:", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}], "answer": "A", "explanation": "Addison's (aldosterone deficient) → **hyperkalemia** — the opposite."}]}], "checkpoints": [{"stem": "Primary hyperaldosteronism → serum sodium:", "options": [{"letter": "A", "text": "Markedly low (<125)"}, {"letter": "B", "text": "Mildly low (130–134)"}, {"letter": "C", "text": "Mildly high (143–147)"}, {"letter": "D", "text": "Always normal (140)"}], "answer": "C", "explanation": "May have **mild hypernatremia (143–147 mEq/L)**."}]}}, {"id": "27", "group": 27, "section": "Secondary HTN — resistant hypertension", "topic": "Primary hyperaldosteronism", "skill": "Identification", "stem": "How is treatment-resistant hypertension defined?", "options": [{"letter": "A", "text": "Not at goal on 1 drug at low dose"}, {"letter": "B", "text": "BP >180/120 on first visit"}, {"letter": "C", "text": "Not at goal on 2 drugs w/o diuretic"}, {"letter": "D", "text": "Not at goal on 3 drugs incl. a diuretic"}], "answer": "D", "explanation": "Resistant HTN = **failure to reach goal despite an appropriate 3-drug regimen that includes a diuretic** → think secondary HTN.", "objective": "", "remediation": {"steps": [{"teach": "Resistant HTN is a trigger to look for **secondary (endocrine) causes** — Cushing's, hyperaldosteronism, pheo.", "stem": "Number of drugs in the definition:", "options": [{"letter": "A", "text": "1"}, {"letter": "B", "text": "3"}, {"letter": "C", "text": "2"}], "answer": "B", "explanation": "**Three** drugs at appropriate doses.", "clarify": [{"stem": "One of the three must be a:", "options": [{"letter": "A", "text": "Beta-blocker"}, {"letter": "B", "text": "Diuretic"}], "answer": "B", "explanation": "The regimen must include a **diuretic**."}]}], "checkpoints": [{"stem": "Which is NOT an endocrine secondary-HTN cause from this lecture?", "options": [{"letter": "A", "text": "Cushing's syndrome"}, {"letter": "B", "text": "Addison's disease"}, {"letter": "C", "text": "Primary hyperaldosteronism"}, {"letter": "D", "text": "Pheochromocytoma"}], "answer": "B", "explanation": "Addison's causes **hypotension**; the other three cause secondary HTN."}]}}, {"id": "28", "group": 28, "section": "Primary hyperaldosteronism — etiologies", "topic": "Primary hyperaldosteronism", "skill": "Disease process", "stem": "What is the most common cause of primary hyperaldosteronism?", "options": [{"letter": "A", "text": "Aldosterone-producing adenoma"}, {"letter": "B", "text": "Bilateral idiopathic hyperplasia"}, {"letter": "C", "text": "Adrenocortical carcinoma"}, {"letter": "D", "text": "Excess licorice intake"}], "answer": "A", "explanation": "**Aldosterone-producing adrenal adenoma (Conn's syndrome) ~50–75%**; bilateral idiopathic hyperplasia ~25–50%.", "objective": "", "remediation": {"steps": [{"teach": "Conn's syndrome refers specifically to PA from an **aldosterone-secreting benign adrenal adenoma**.", "stem": "Bilateral idiopathic hyperplasia → share of cases:", "options": [{"letter": "A", "text": "~50–75%"}, {"letter": "B", "text": "~25–50%"}, {"letter": "C", "text": "~90%"}], "answer": "B", "explanation": "Bilateral hyperplasia is the **second** most common (~25–50%).", "clarify": [{"stem": "Conn's syndrome lesion:", "options": [{"letter": "A", "text": "Unilateral adrenal adenoma"}, {"letter": "B", "text": "Bilateral hyperplasia"}], "answer": "A", "explanation": "Conn's = **adenoma**."}]}], "checkpoints": [{"stem": "Bilateral idiopathic hyperplasia vs adenoma → disease severity:", "options": [{"letter": "A", "text": "Milder, less hypokalemia"}, {"letter": "B", "text": "More severe, more hypokalemia"}, {"letter": "C", "text": "Identical in all cases"}, {"letter": "D", "text": "Always normokalemic"}], "answer": "A", "explanation": "IHA is generally **milder with less hypokalemia**."}]}}, {"id": "29", "group": 29, "section": "Hyperaldosteronism — screening", "topic": "Primary hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "What screening test is used for suspected primary hyperaldosteronism?", "options": [{"letter": "A", "text": "24-hour urine free cortisol"}, {"letter": "B", "text": "Plasma aldosterone : renin ratio"}, {"letter": "C", "text": "Plasma free metanephrines"}, {"letter": "D", "text": "8 AM serum cortisol"}], "answer": "B", "explanation": "Screen with **simultaneous mid-morning ambulatory plasma aldosterone concentration and plasma renin activity** (PAC/PRA).", "objective": "", "remediation": {"steps": [{"teach": "Primary hyperaldosteronism is **autonomous** — aldosterone is high even though its regulator (renin) is shut off.", "stem": "Aldosterone's main regulator is:", "options": [{"letter": "A", "text": "ACTH"}, {"letter": "B", "text": "Renin (RAA axis)"}, {"letter": "C", "text": "Catecholamines"}], "answer": "B", "explanation": "Aldosterone is regulated by **renin** → measure both together.", "clarify": [{"stem": "Plasma free metanephrines screen for:", "options": [{"letter": "A", "text": "Hyperaldosteronism"}, {"letter": "B", "text": "Pheochromocytoma"}], "answer": "B", "explanation": "Metanephrines = **pheo**."}]}], "checkpoints": [{"stem": "Why draw PAC/PRA in the mid-morning?", "options": [{"letter": "A", "text": "Renin is undetectable at night"}, {"letter": "B", "text": "Fasting is required overnight"}, {"letter": "C", "text": "Cortisol interferes after noon"}, {"letter": "D", "text": "Aldosterone peaks in the morning"}], "answer": "D", "explanation": "ACTH gives aldosterone a **morning peak** circadian rhythm."}]}}, {"id": "29a", "group": 29, "section": "Hyperaldosteronism — screening", "topic": "Primary hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "Expected primary hyperaldosteronism pattern → aldosterone/renin:", "options": [{"letter": "A", "text": "↑ Aldosterone, ↓ renin"}, {"letter": "B", "text": "↓ Aldosterone, ↑ renin"}, {"letter": "C", "text": "↑ Aldosterone, ↑ renin"}, {"letter": "D", "text": "↓ Aldosterone, ↓ renin"}], "answer": "A", "explanation": "Primary = **high aldosterone, suppressed (low) renin**.", "objective": "", "remediation": {"steps": [{"teach": "High aldosterone → Na⁺/volume retention → the kidney senses plenty ests pheochromocytoma"}], "answer": "A", "explanation": "Persistent elevation (**poor suppressibility**) confirms PA."}]}}, {"id": "32", "group": 32, "section": "Hyperaldosteronism — imaging", "topic": "Primary hyperaldosteronism", "skill": "Diagnostics & imaging", "stem": "What study should be obtained after hyperaldosteronism is biochemically confirmed?", "options": [{"letter": "A", "text": "Pituitary MRI with contrast"}, {"letter": "B", "text": "Renal artery Doppler"}, {"letter": "C", "text": "Chest CT for lung mass"}, {"letter": "D", "text": "Adrenal CT or MRI"}], "answer": "D", "explanation": "**Adrenal CT or MRI** distinguishes aldosterone-producing **adenoma vs bilateral hyperplasia** (and catches rare carcinoma).", "objective": "", "remediation": {"steps": [{"teach": "The goal is to tell a **single adrenal adenoma** from **bilateral** disease — both are in the adrenal glands.", "stem": "Lesion location in primary hyperaldosteronism:", "options": [{"letter": "A", "text": "Adrenal gland"}, {"letter": "B", "text": "Pituitary gland"}], "answer": "A", "explanation": "PA is an **adrenal** problem.", "clarify": [{"stem": "Image before or after biochemical confirmation?", "options": [{"letter": "A", "text": "Before"}, {"letter": "B", "text": "After"}], "answer": "B", "explanation": "Image **after** biochemical confirmation."}]}], "checkpoints": [{"stem": "Why distinguish adenoma from bilateral hyperplasia?", "options": [{"letter": "A", "text": "Both are always treated surgically"}, {"letter": "B", "text": "Only hyperplasia causes HTN"}, {"letter": "C", "text": "Adenomas need no treatment"}, {"letter": "D", "text": "Adenoma → surgery; hyperplasia → meds"}], "answer": "D", "explanation": "Adenoma → **unilateral adrenalectomy**; bilateral hyperplasia → **medical therapy**."}]}}, {"id": "33", "group": 33, "section": "Hyperaldosteronism — imaging result", "topic": "Primary hyperaldosteronism", "skill": "Management", "stem": "What treatment approach is appropriate when adrenal CT shows bilateral hyperplasia?", "options": [{"letter": "A", "text": "Unilateral adrenalectomy"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Spironolactone or eplerenone"}, {"letter": "D", "text": "Hydrocortisone replacement"}], "answer": "C", "explanation": "Bilateral idiopathic hyperplasia is treated **medically with aldosterone antagonists (spironolactone/eplerenone)**.", "objective": "", "remediation": {"steps": [{"teach": "Removing one gland won't control BP when **both** sides are overactive; removing both would need lifelong steroid replacement.", "stem": "Unilateral adrenalectomy in bilateral disease → BP control:", "options": [{"letter": "A", "text": "Always curative"}, {"letter": "B", "text": "Often inadequate"}], "answer": "B", "explanation": "BP control is **often inadequate** with one-sided surgery.", "clarify": [{"stem": "Spironolactone/eplerenone are:", "options": [{"letter": "A", "text": "Aldosterone antagonists"}, {"letter": "B", "text": "ACE inhibitors"}], "answer": "A", "explanation": "They are **aldosterone antagonists**."}]}], "checkpoints": [{"stem": "Adrenal CT shows a 1.3 cm unilateral adenoma → treatment:", "options": [{"letter": "A", "text": "Spironolactone or eplerenone"}, {"letter": "B", "text": "Bilateral adrenalectomy"}, {"letter": "C", "text": "Unilateral adrenalectomy"}, {"letter": "D", "text": "Observation only"}], "answer": "C", "explanation": "Aldosterone-producing adenoma → **unilateral adrenalectomy**."}]}}, {"id": "34", "group": 34, "section": "Adrenal insufficiency — types", "topic": "Adrenal insufficiency", "skill": "Disease process", "stem": "Which hormones are deficient in primary adrenal insufficiency, also called Addison disease?", "options": [{"letter": "A", "text": "Cortisol and aldosterone"}, {"letter": "B", "text": "Cortisol only"}, {"letter": "C", "text": "Aldosterone only"}, {"letter": "D", "text": "Catecholamines only"}], "answer": "A", "explanation": "**Primary** = deficiency of **both cortisol and aldosterone**; **secondary** = cortisol only.", "objective": "", "remediation": {"steps": [{"teach": "In primary disease the **whole adrenal cortex** is destroyed, so every cortical zone is affected.", "stem": "Secondary (pituitary) insufficiency → hormone deficient:", "options": [{"letter": "A", "text": "Cortisol only"}, {"letter": "B", "text": "Cortisol and aldosterone"}], "answer": "A", "explanation": "Secondary = **cortisol only**; aldosterone is run by the RAA axis.", "clarify": [{"stem": "Aldosterone is mainly controlled by:", "options": [{"letter": "A", "text": "ACTH"}, {"letter": "B", "text": "RAA axis"}], "answer": "B", "explanation": "**RAA axis** — so lack of ACTH spares aldosterone."}]}], "checkpoints": [{"stem": "Secondary adrenal insufficiency → aldosterone level:", "options": [{"letter": "A", "text": "Low"}, {"letter": "B", "text": "Normal"}, {"letter": "C", "text": "High"}, {"letter": "D", "text": "Undetectable"}], "answer": "B", "explanation": "Aldosterone is **normal** in secondary disease."}]}}, {"id": "35", "group": 35, "section": "Adrenal insufficiency — etiologies", "topic": "Adrenal insufficiency", "skill": "Disease process", "stem": "What is the most common cause of primary adrenal insufficiency in the United States?", "options": [{"letter": "A", "text": "Tuberculosis infection"}, {"letter": "B", "text": "Autoimmune adrenal destruction"}, {"letter": "C", "text": "Metastatic malignancy"}, {"letter": "D", "text": "Adrenal hemorrhage"}], "answer": "B", "explanation": "In the US the MCC is **autoimmune destruction of the adrenal cortex (70–90%)**; TB was historically the MCC.", "objective": "", "remediation": {"steps": [{"teach": "Addison originally described TB destruction, but TB is now only ~7–20% of cases.", "stem": "Historically most common cause:", "options": [{"letter": "A", "text": "Autoimmune"}, {"letter": "B", "text": "Tuberculosis"}], "answer": "B", "explanation": "**TB** was historically most common.", "clarify": [{"stem": "Today in the US, autoimmune causes:", "options": [{"letter": "A", "text": "70–90%"}, {"letter": "B", "text": "7–20%"}], "answer": "A", "explanation": "Autoimmune = **70–90%**."}]}], "checkpoints": [{"stem": "Primary adrenal insufficiency → laboratory ACTH:", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}, {"letter": "C", "text": "Normal"}, {"letter": "D", "text": "Undetectable"}], "answer": "A", "explanation": "Primary AI has **high ACTH** (normal pituitary pushing a failing gland)."}]}}, {"id": "36", "group": 36, "section": "Adrenal insufficiency — clinical manifestations", "topic": "Adrenal insufficiency", "skill": "Identification", "stem": "What electrolyte pattern is expected in primary adrenal insufficiency?", "options": [{"letter": "A", "text": "↑ Na⁺, ↓ K⁺"}, {"letter": "B", "text": "↓ Na⁺, ↑ K⁺"}, {"letter": "C", "text": "↓ Na⁺, ↓ K⁺"}, {"letter": "D", "text": "↑ Na⁺, ↑ K⁺"}], "answer": "B", "explanation": "Aldosterone loss → **hyponatremia + hyperkalemia** (may crave salt and ice water).", "objective": "", "remediation": {"steps": [{"teach": "Without aldosterone the kidney **can't retain Na⁺** or **excrete K⁺**.", "stem": "Aldosterone deficiency → potassium:", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}], "answer": "A", "explanation": "Can't excrete K⁺ → **hyperkalemia**.", "clarify": [{"stem": "Aldosterone deficiency → sodium:", "options": [{"letter": "A", "text": "High"}, {"letter": "B", "text": "Low"}], "answer": "B", "explanation": "Can't retain Na⁺ → **hyponatremia**."}]}], "checkpoints": [{"stem": "Primary adrenal insufficiency → blood pressure:", "options": [{"letter": "A", "text": "Paroxysmal hypertension"}, {"letter": "B", "text": "Resistant hypertension"}, {"letter": "C", "text": "Widened pulse pressure"}, {"letter": "D", "text": "Hypotension / orthostasis"}], "answer": "D", "explanation": "AI causes **hypotension / orthostatic hypotension**."}]}}, {"id": "37", "group": 37
